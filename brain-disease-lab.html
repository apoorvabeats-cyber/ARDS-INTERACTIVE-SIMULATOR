function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    if(c==="&") return "\u0026amp;";
    if(c==="<") return "\u0026lt;";
    if(c===">") return "\u0026gt;";
    return "\u0026quot;";
  });
}
function stopSpoken(){
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function femaleVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  const named = /female|samantha|victoria|karen|moira|fiona|tessa|serena|zira|susan|veena|heera|sonia|catherine|allison|ava|nicky|libby/i;
  const en = voices.filter(function(voice){ return /^en/i.test(voice.lang || ""); });
  return en.find(function(voice){ return named.test((voice.name || "") + " " + (voice.voiceURI || "")); })
    || en.find(function(voice){ return /en-GB|en-IN|en-AU/i.test(voice.lang) && !/male/i.test(voice.name || ""); })
    || null;
}
function speakLine(text){
  if(!text || !window.speechSynthesis) return;
  const say = function(){
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voice = femaleVoice();
    utterance.lang = voice && voice.lang ? voice.lang : "en-GB";
    utterance.rate = 0.92;
    utterance.pitch = 1.06;
    if(voice) utterance.voice = voice;
    speechSynthesis.speak(utterance);
  };
  if(!speechSynthesis.getVoices().length){
    const once = function(){
      speechSynthesis.removeEventListener("voiceschanged", once);
      say();
    };
    speechSynthesis.addEventListener("voiceschanged", once);
    speechSynthesis.getVoices();
    return;
  }
  say();
}
function clamp(k){ return Math.max(0, Math.min(1, k)); }
function mix(a,b,k){ return a+(b-a)*k; }
function phase(t,a,b){ return clamp((t-a)/(b-a)); }

const CT_SPOTS = [
  {id:"sdh", title:"Acute subdural", text:"A crescent of acute blood over the hemisphere. It can cross suture lines. Mass effect and shift decide the pace."},

  {id:"ivh", title:"Blood in the ventricle", text:"Blood inside a ventricle can block CSF flow. That is one reason an external drain is considered."}
];

const SHOWS = {
  evd:{dur:43.19, clip:"neuro/evd.mp4", captioned:true, steps:[
    {t:0, title:"Entry site", text:"Identify the appropriate entry site, usually Kocher's point, followed by sterile preparation and local anesthesia."},
    {t:9.69, title:"Incision and burr hole", text:"A small incision is made in the scalp, and a burr hole is drilled through the skull."},
    {t:14.56, title:"Advance the catheter", text:"The dura is opened, and a catheter is carefully advanced into the lateral ventricle, typically the frontal horn, following a trajectory toward the ipsilateral medial canthus and external auditory meatus."},
    {t:27.27, title:"Connect and level", text:"Once cerebrospinal fluid flows freely, the catheter is secured to the scalp, connected to the drainage system, and leveled to a set height relative to the external auditory canal for controlled cerebrospinal fluid drainage and intracranial pressure monitoring."}
  ]},
  ett:{dur:24.05, clip:"neuro/ett-user.mp4?v=attach4", poster:"neuro/intubation-poster.jpg", steps:[
    {t:0, title:"Position", text:"The head is positioned and the mouth is opened. The blade is introduced. Hypoxia and a fall in blood pressure are the dangers of this minute."},
    {t:6, title:"The cords", text:"The blade lifts the tongue and brings the vocal cords into view. The tube is aimed through them, not blindly."},
    {t:12, title:"The pass", text:"The tube crosses the cords. A cuff sits in the trachea. This is the attached teaching film, not the older sequence."},
    {t:18, title:"Confirm", text:"The tube is seated. Sustained exhaled carbon dioxide confirms the trachea. Then control carbon dioxide and blood pressure. Do not hyperventilate as a routine."}
  ]},
  bolt:{dur:10, steps:[
    {t:0, title:"What it is", text:"A parenchymal monitor sits in the brain substance and measures pressure. It does not drain cerebrospinal fluid."},
    {t:3, title:"Placement", text:"It is usually placed frontally, through a small hole, by a trained operator. Coagulation is corrected first."},
    {t:6, title:"The number", text:"The waveform and the number guide treatment. A reading without a clinical story is not a diagnosis."}
  ]},
  crani:{dur:25, clip:"neuro/crani-user.mp4?v=attach4", poster:"neuro/crani-poster.jpg", captioned:true, steps:[
    {t:0, title:"Intracranial hypertension", text:"Severe cerebral edema can cause intracranial hypertension, compromising cerebral perfusion and risking secondary brain injury."},
    {t:4, title:"Surgical exposure", text:"Decompressive craniectomy creates additional intracranial volume when indicated for refractory intracranial hypertension. It is a neurosurgical operation, not a bedside procedure."},
    {t:8, title:"Bone flap", text:"A sufficiently large bone flap is removed to permit expansion of the swollen brain."},
    {t:14, title:"Dural opening", text:"Expansile duraplasty provides additional space. In this illustration the pressure falls as the brain expands."},
    {t:20, title:"Afterwards", text:"Postoperative care focuses on intracranial pressure, cerebral perfusion, hemodynamics, and complications, including bleeding, infection, hydrocephalus, and later the syndrome of the trephined."}

  ct:{dur:12, inspect:true, steps:CT_SPOTS.map(function(s,i){ return {t:i*2.2, title:s.title, text:s.text}; })},
  art:{dur:9, steps:[
    {t:0, title:"Why", text:"Beat-to-beat arterial pressure matters when cerebral perfusion is tight. The radial artery is the usual first site."},
    {t:3, title:"The vessel", text:"Ultrasound makes the artery and the nearby structures obvious. A catheter is advanced and connected to a flushed transducer at the right height."},
    {t:6, title:"Afterwards", text:"Watch the hand. Remove the line when it is no longer guiding treatment."}
  ]},
  cvc:{dur:10, steps:[
    {t:0, title:"Why", text:"A central vein is used for reliable access and for some vasoactive infusions. It is not required for every brain injury."},
    {t:2, title:"Ultrasound", text:"The vein compresses. The artery pulses and does not. The needle is watched entering the vein."},
    {t:6, title:"Wire and catheter", text:"A wire, then a catheter, then confirmation that the tip is venous before anything caustic is infused. Pneumothorax and arterial puncture are the early risks."}
  ]},
  coil:{dur:11, steps:[
    {t:0, title:"The sac", text:"Most ruptured aneurysms sit at branch points on the circle of Willis. The dome is the weak part."},
    {t:4, title:"Filling", text:"From an arterial catheter, coils are packed into the sac so blood no longer enters it. Clipping is the open alternative. Both are specialist procedures."},
    {t:8, title:"After", text:"Securing the aneurysm stops the next rupture. It does not by itself treat hydrocephalus, vasospasm or delayed ischaemia."}
  ]},
  evt:{dur:11, steps:[
    {t:0, title:"The occlusion", text:"A clot in a large intracranial artery, often the middle cerebral stem, threatens a wide territory."},

    {t:8, title:"Reperfusion", text:"The aim is restored flow before the territory dies. The time window depends on imaging and the pathway, not on a guess."}

    {t:8, title:"When not to", text:"Do not puncture if a mass or tight brain makes herniation likely, or if coagulation is unsafe. Image first when that risk is real."}

  shunt:{dur:10, steps:[
    {t:0, title:"Temporary versus lasting", text:"An external drain is temporary. A shunt is an implanted path from ventricle to another compartment, usually the peritoneum."},

    {t:7, title:"Failure", text:"Shunts block and they infect. A sleepy patient with a shunt needs that thought early."}

  clock:{dur:9, steps:[

  cpp:{dur:8, steps:[
    {t:0, title:"Perfusion pressure", text:"Cerebral perfusion pressure is mean arterial pressure minus intracranial pressure."},
    {t:3, title:"The fall", text:"If pressure inside the skull rises and blood pressure does not, the brain is under-perfused."}

  icp:{dur:9, steps:[

  hern:{dur:8, steps:[

    {t:3, title:"The pupil", text:"The oculomotor nerve is compressed. The pupil on that side enlarges. The opposite limbs become weak."}

  sahRupture:{dur:9, steps:[
    {t:0, title:"The sac", text:"An aneurysm forms at a branch point. The dome is weakest."},

  sahBlood:{dur:8, steps:[

  sahIcp:{dur:8, steps:[

  ]},
  mca:{dur:9, steps:[

    {t:4, title:"The territory", text:"Face and arm are weak. In the dominant hemisphere, language fails. The leg may be relatively spared because it is anterior-cerebral cortex."}

function shuffleIds(n){
  const ids = [];
  for(let i = 0; i < n; i++) ids.push(i);
  for(let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  }
  return ids;
}
function shuffleOpts(list){
  const copy = list.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = copy[i]; copy[i] = copy[j]; copy[j] = t;
  }
  return copy;
}

function readHash(){
  const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  if(!parts.length || !DISEASES.some(function(d){ return d.id===parts[0]; })){
    listMode = true;
    chapterMenu = false;
    topicId = "";
    return;
  }
  listMode = false;
  diseaseId = parts[0];
  if(!parts[1]){
    chapterMenu = true;
    topicId = "";
    return;
  }
  chapterMenu = false;
  sectionId = (parts[1] && SECTIONS.some(function(s){ return s[0]===parts[1]; })) ? parts[1] : "overview";
  topicId = parts[2] || "";
}
function writeHash(){
  if(listMode){

  }
  const next = chapterMenu ? diseaseId : (topicId ? diseaseId+"/"+sectionId+"/"+topicId : diseaseId+"/"+sectionId);
  if(location.hash.replace(/^#/, "") !== next) history.replaceState(null, "", "#"+next);

function bindClip(def, steps){
  const video = document.getElementById("reel");
  const hud = document.getElementById("hud");
  if(def.captioned && hud) hud.style.display = "none";
  const playBtn = document.getElementById("play");
  const scrub = document.getElementById("scrub");
  player = {t:0, playing:!reduced, speed:1, step:-1, dur:def.dur};
  let jump = false;
  filmCleanup = function(){
    video.pause();
    video.removeAttribute("src");
    video.load();
  };
  function currentStep(){
    let idx = 0;
    steps.forEach(function(s,i){ if(player.t+0.05 >= s.t) idx = i; });
    return idx;
  }
  function paintChrome(){
    const idx = currentStep();
    if(hud && steps[idx]) hud.textContent = steps[idx].title;
    if(idx !== player.step){
      player.step = idx;
      work.querySelectorAll(".step").forEach(function(btn,i){ btn.classList.toggle("on", i===idx); });
    }
    scrub.value = String(player.t);
    scrub.max = String(player.dur);
  }
  function seek(t, pause){
    player.t = Math.max(0, Math.min(player.dur, t));
    jump = true;
    if(pause) player.playing = false;
    playBtn.textContent = player.playing ? "Pause" : "Play";
    try{ video.currentTime = player.t; }catch(err){}
    if(player.playing) video.play().catch(function(){ player.playing = false; playBtn.textContent = "Play"; });
    else video.pause();
    paintChrome();
  }
  playBtn.onclick = function(){
    player.playing = !player.playing;
    playBtn.textContent = player.playing ? "Pause" : "Play";
    if(player.playing){
      if(video.currentTime >= (video.duration || player.dur) - 0.05) video.currentTime = 0;
      video.play().catch(function(){ player.playing = false; playBtn.textContent = "Play"; });
    }else video.pause();
  };
  document.getElementById("replay").onclick = function(){ seek(0, false); player.playing = true; playBtn.textContent = "Pause"; video.play().catch(function(){}); };
  document.getElementById("slow").onclick = function(){ player.speed = 0.75; video.playbackRate = 0.75; };
  document.getElementById("fast").onclick = function(){ player.speed = 1.5; video.playbackRate = 1.5; };
  scrub.oninput = function(){ seek(Number(scrub.value), true); };
  work.querySelectorAll(".step").forEach(function(btn){
    btn.onclick = function(){ seek(steps[Number(btn.getAttribute("data-step"))].t, true); };
  });
  video.addEventListener("loadedmetadata", function(){
    if(video.duration && isFinite(video.duration)) player.dur = video.duration;
    paintChrome();
  });
  video.addEventListener("timeupdate", function(){
    if(jump){ jump = false; return; }
    player.t = video.currentTime || 0;
    paintChrome();
  });
  video.addEventListener("ended", function(){
    player.playing = false;
    player.t = player.dur;
    playBtn.textContent = "Play";
    paintChrome();
  });
  paintChrome();
  if(player.playing) video.play().catch(function(){ player.playing = false; playBtn.textContent = "Play"; });
}

    if(token !== playerToken) return;
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, last ? (now-last)/1000 : 0.016);
    last = now;
    if(player && player.playing){
      player.t += dt*player.speed;
      if(player.t >= player.dur){ player.t = player.dur; player.playing = false; playBtn.textContent = "Play"; }
    }
    paintFrame();
  }
  requestAnimationFrame(loop);
}
function renderAlgo(d, head){
  work.innerHTML = head+'<p class="note">Tap a step, or walk the pathway. Doses elsewhere on the page are teaching reminders, not orders.</p><div class="grid algo" id="algo">'+d.algo.map(function(step,i){
    return '<button type="button" class="card'+(i===algoStep?' on"':'"')+' data-i="'+i+'"><b>Step '+(i+1)+'</b><span>'+esc(step)+'</span></button>';
  }).join("")+'</div><div class="controls"><button type="button" id="walk">Walk the pathway</button></div>'+simLink(d)+footnote();
  work.querySelectorAll("[data-i]").forEach(function(btn){
    btn.onclick = function(){ algoStep = Number(btn.getAttribute("data-i")); renderAlgo(d, head); };
  });
  document.getElementById("walk").onclick = function(){
    algoStep = (algoStep+1) % d.algo.length;
    renderAlgo(d, head);
  };
}
function renderAnatomy(d, head){
  work.innerHTML = head+'<p class="lead">'+esc(d.anatomy.note)+'</p><p class="note">This is a real glTF model, the same atlas as the 3D brain lab. It is not a video. Drag to turn it. Only the structures named for this disease are coloured.</p><div class="player"><canvas id="anat"></canvas></div>'+footnote();
  mountAnatomy(d.anatomy.labels || []);
}
function mountAnatomy(labels){
  const canvas = document.getElementById("anat");
  if(!canvas) return;
  canvas.width = 960; canvas.height = 540;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true}); }
  catch(err){ return; }
  renderer.setSize(canvas.clientWidth || 640, 360, false);
  renderer.setClearColor(0x071018, 1);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xf2efe8, 0x101820, 1));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(2,3,4); scene.add(key);
  const camera = new THREE.PerspectiveCamera(35, 16/9, 0.01, 50);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  const token = ++brainToken;
  const loader = new GLTFLoader();
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
  loader.setDRACOLoader(draco);
  loader.load("neuro/brain.glb", function(gltf){
    if(token !== brainToken) return;
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
    const size = box.getSize(new THREE.Vector3());
    const extent = Math.max(size.x, size.y, size.z);
    camera.position.set(0, extent*0.05, extent*0.9);
    scene.add(model);
    const wanted = {};
    labels.forEach(function(name){ wanted[name] = true; });
    const focus = new THREE.Box3();
    let n = 0;
    model.traverse(function(obj){
      if(!obj.isMesh) return;
      obj.material = obj.material.clone();
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      const on = !!wanted[obj.userData.bx_label];
      mats.forEach(function(mat){
        if(on){ mat.color.set("#7fd4e6"); mat.emissive = new THREE.Color("#7fd4e6"); mat.emissiveIntensity = 0.25; }
      });
      if(on){ focus.expandByObject(obj); n++; }
    });
    if(n){
      const c = focus.getCenter(new THREE.Vector3());
      controls.target.copy(c);
      camera.position.copy(c).add(new THREE.Vector3(0, extent*0.05, extent*0.55));
    }
  });
  let frame = 0;
  anatomyCleanup = function(){
    cancelAnimationFrame(frame);
    controls.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
    draco.dispose();
  };
  function loop(){
    if(token !== brainToken) return;
    frame = requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  }
  const viewW = Math.max(320, canvas.clientWidth || 640);
  const viewH = Math.round(viewW * 9 / 16);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(viewW, viewH, false);
  camera.aspect = viewW / viewH;
  camera.updateProjectionMatrix();
  frame = requestAnimationFrame(loop);
}
function renderCase(d, head){
  const item = d.case;
  work.innerHTML = head+'<span class="badge">Clinical case</span>'+(item.image?'<figure class="viewer" style="margin:8px 0 12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#05080c"><img src="'+esc(item.image)+'" alt="'+esc(item.alt||"Clinical image")+'" style="width:100%;height:auto;display:block"><figcaption class="note" style="padding:8px 12px">'+(item.caption?esc(item.caption):"")+'</figcaption></figure>':'')+'<p class="lead">'+esc(item.stem)+'</p><div class="grid" id="choices">'+item.choices.map(function(choice){
    return '<button type="button" class="card" data-c="'+choice.id+'"><b>'+esc(choice.label)+'</b></button>';
  }).join("")+'</div><div class="controls"><button type="button" id="lock">Submit</button></div><p id="why" class="lead"></p>'+footnote();
  work.querySelectorAll("[data-c]").forEach(function(btn){
    btn.onclick = function(){
      if(caseLocked) return;
      casePick = btn.getAttribute("data-c");
      work.querySelectorAll("[data-c]").forEach(function(other){ other.classList.toggle("on", other===btn); });
    };
  });
  document.getElementById("lock").onclick = function(){
    if(!casePick){ document.getElementById("why").textContent = "Choose a response first."; return; }
    caseLocked = true;
    work.querySelectorAll("[data-c]").forEach(function(btn){
      const id = btn.getAttribute("data-c");
      btn.classList.toggle("on", id===item.answer);
      btn.classList.toggle("bad", id===casePick && id!==item.answer);
    });
    const right = casePick === item.answer;
    const named = item.choices.find(function(choice){ return choice.id===item.answer; });
    const line = right ? "Correct. "+item.why : "That is incorrect. The correct answer is "+(named?named.label:"")+". "+item.why;
    document.getElementById("why").textContent = line;
    speakLine(line);
  };
  if(caseLocked) document.getElementById("lock").click();
}
function renderAssess(d, head){
  const q = d.quiz[quizAt];
  if(!q){
    work.innerHTML = head+'<p class="lead">That is the end of the questions.</p><div class="backrow"><button type="button" id="quiz-back">First question</button></div>'+d.refs.map(function(r){return '<p class="note">'+esc(r)+'</p>';}).join("")+simLink(d)+footnote();
    document.getElementById("quiz-back").onclick = function(){ quizAt = 0; render(); };
    return;
  }
  work.innerHTML = head+'<span class="badge">Question '+(quizAt+1)+' of '+d.quiz.length+'</span><div class="card"><b>'+esc(q.q)+'</b><div class="grid">'+q.choices.map(function(choice, n){
    return '<button type="button" class="qopt" data-n="'+n+'">'+esc(choice)+'</button>';
  }).join("")+'</div><p class="note" id="why-q"></p></div>'+
    (quizAt+1<d.quiz.length ? '<div class="backrow"><button type="button" id="quiz-next" disabled>Next question</button></div>' : '')+
    '<h3>References</h3>'+d.refs.map(function(r){return '<p class="note">'+esc(r)+'</p>';}).join("")+simLink(d)+footnote();
  work.querySelectorAll("[data-n]").forEach(function(btn){
    btn.onclick = function(){
      if(quizLocked[d.id+"-"+quizAt]) return;
      quizLocked[d.id+"-"+quizAt] = true;
      const n = Number(btn.getAttribute("data-n"));
      const right = n === q.answer;
      work.querySelectorAll("[data-n]").forEach(function(other){
        const i = Number(other.getAttribute("data-n"));
        other.classList.toggle("on", i===q.answer);
        other.classList.toggle("bad", i===n && i!==q.answer);
      });
      const line = right ? "Correct. "+q.why : "That is incorrect. The correct answer is "+q.choices[q.answer]+". "+q.why;
      document.getElementById("why-q").textContent = line;
      const next = document.getElementById("quiz-next");
      if(next) next.disabled = false;
      speakLine(line);
    };
  });
  const next = document.getElementById("quiz-next");
  if(next) next.onclick = function(){
    quizLocked[d.id+"-"+quizAt] = false;
    quizAt += 1;
    render();
  };
  speakLine(q.q);
}
function simLink(d){
  var html = "";
  if(d.work) html += '<p><a href="'+esc(d.work)+'">Open the neuroimaging workstation</a></p>';
  if(d.sim) html += '<p><a href="'+esc(d.sim)+'">Open the practice simulator for this disease</a></p>';
  return html;
}
function footnote(){
  return "";
}
window.addEventListener("hashchange", function(){ readHash(); render(); });
readHash();
render();
