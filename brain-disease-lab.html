function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    if(c==="&") return "\u0026amp;";
    if(c==="<") return "\u0026lt;";
    if(c===">") return "\u0026gt;";
    return "\u0026quot;";
  });
}
function clamp(k){ return Math.max(0, Math.min(1, k)); }
function mix(a,b,k){ return a+(b-a)*k; }
function phase(t,a,b){ return clamp((t-a)/(b-a)); }
function disease(){ return DISEASES.find(function(d){ return d.id===diseaseId; }) || DISEASES[0]; }
function showDef(id){ return SHOWS[id]; }

const CT_SPOTS = [
  {id:"sdh", title:"Acute subdural", text:"A crescent of acute blood over the hemisphere. It can cross suture lines. Mass effect and shift decide the pace."},
  {id:"shift", title:"Midline shift", text:"The septum between the frontal horns is pushed off the midline. Shift is a sign of mass effect, not a diagnosis by itself."},
  {id:"cistern", title:"Basal cisterns", text:"Compressed or absent basal cisterns mean the brain is tight. This is a pressure emergency."},
  {id:"contusion", title:"Contusion", text:"Hemorrhagic bruising, often frontal or temporal, and often worse on the second scan than the first."},
  {id:"ivh", title:"Blood in the ventricle", text:"Blood inside a ventricle can block CSF flow. That is one reason an external drain is considered."}
];

const SHOWS = {
  evd:{dur:16, steps:[
    {t:0, title:"Mark the entry", text:"Kocher's point is about 11 cm back from the nasion and about 3 cm from the midline, just in front of the coronal suture. Know which ventricle you are aiming at from the scan."},
    {t:3, title:"Open the skull", text:"A twist drill or burr hole is made at that point after a sterile preparation. The dura is opened only enough for the catheter."},
    {t:6, title:"Pass the catheter", text:"Aim toward the ipsilateral medial canthus and the tragus, so the catheter enters the frontal horn. A typical pass is marked near 5 to 6 cm. Do not force it deeper."},
    {t:10, title:"Confirm CSF", text:"Clear or blood-stained CSF should flow. A poor flow means the tip may be in the wrong place. Image if you are not sure."},
    {t:13, title:"Tunnel and measure", text:"The catheter is tunnelled, connected to a closed drainage system, and set at the prescribed height. ICP can be transduced when the drain is closed."}
  ]},
  ett:{dur:10, steps:[
    {t:0, title:"Why the airway", text:"Hypoxia and hypercarbia raise intracranial pressure. Intubation is for patients who cannot protect the airway or who need controlled ventilation."},
    {t:3, title:"The pass", text:"A rapid sequence induction aims to avoid a long apnoea and a blood-pressure crash. The tube crosses the vocal cords."},
    {t:7, title:"Confirm", text:"Sustained exhaled carbon dioxide confirms tracheal placement. Then control carbon dioxide and blood pressure. Do not hyperventilate as a routine."}
  ]},
  bolt:{dur:10, steps:[
    {t:0, title:"What it is", text:"A parenchymal monitor sits in the brain substance and measures pressure. It does not drain cerebrospinal fluid."},
    {t:3, title:"Placement", text:"It is usually placed frontally, through a small hole, by a trained operator. Coagulation is corrected first."},
    {t:6, title:"The number", text:"The waveform and the number guide treatment. A reading without a clinical story is not a diagnosis."}
  ]},
  crani:{dur:11, steps:[
    {t:0, title:"When it is considered", text:"Decompression is for selected mass lesions and for intracranial pressure that will not yield. It is a neurosurgical operation, not a bedside procedure."},
    {t:3, title:"The flap", text:"Bone is removed so the swollen hemisphere has somewhere to go. The dura is opened wide enough for that purpose."},
    {t:7, title:"Afterwards", text:"The bone is stored or left off. Complications include bleeding, infection, hydrocephalus and the syndrome of the trephined later."}
  ]},
  ct:{dur:12, inspect:true, steps:CT_SPOTS.map(function(s,i){ return {t:i*2.2, title:s.title, text:s.text}; })},
  art:{dur:9, steps:[
    {t:0, title:"Why", text:"Beat-to-beat arterial pressure matters when cerebral perfusion is tight. The radial artery is the usual first site."},
    {t:3, title:"The vessel", text:"Ultrasound makes the artery and the nearby structures obvious. A catheter is advanced and connected to a flushed transducer at the right height."},
    {t:6, title:"Afterwards", text:"Watch the hand. Remove the line when it is no longer guiding treatment."}
  ]},
  cvc:{dur:10, steps:[
    {t:0, title:"Why", text:"A central vein is used for reliable access and for some vasoactive infusions. It is not required for every brain injury."},
    {t:2, title:"Ultrasound", text:"The vein compresses. The artery pulses and does not. The needle is watched entering the vein."},
    {t:6, title:"Wire and catheter", text:"A wire, then a catheter, then confirmation that the tip is venous before anything caustic is infused. Pneumothorax and arterial puncture are the early risks."}
  ]},
  coil:{dur:11, steps:[
    {t:0, title:"The sac", text:"Most ruptured aneurysms sit at branch points on the circle of Willis. The dome is the weak part."},
    {t:4, title:"Filling", text:"From an arterial catheter, coils are packed into the sac so blood no longer enters it. Clipping is the open alternative. Both are specialist procedures."},
    {t:8, title:"After", text:"Securing the aneurysm stops the next rupture. It does not by itself treat hydrocephalus, vasospasm or delayed ischaemia."}
  ]},
  evt:{dur:11, steps:[
    {t:0, title:"The occlusion", text:"A clot in a large intracranial artery, often the middle cerebral stem, threatens a wide territory."},
    {t:3, title:"Retrieval", text:"A stent retriever or aspiration catheter is used, in a suitably selected patient, to remove the clot."},
    {t:8, title:"Reperfusion", text:"The aim is restored flow before the territory dies. The time window depends on imaging and the pathway, not on a guess."}
  ]},
  lp:{dur:10, steps:[
    {t:0, title:"Why", text:"A lumbar puncture samples CSF when meningitis or subarachnoid blood is the question and imaging does not already answer it."},
    {t:3, title:"The pass", text:"The needle passes between lumbar spinous processes into the CSF space."},
    {t:8, title:"When not to", text:"Do not puncture if a mass or tight brain makes herniation likely, or if coagulation is unsafe. Image first when that risk is real."}
  ]},
  shunt:{dur:10, steps:[
    {t:0, title:"Temporary versus lasting", text:"An external drain is temporary. A shunt is an implanted path from ventricle to another compartment, usually the peritoneum."},
    {t:4, title:"The path", text:"The ventricular catheter, the valve and the distal catheter are placed in an operation."},
    {t:7, title:"Failure", text:"Shunts block and they infect. A sleepy patient with a shunt needs that thought early."}
  ]},
  clock:{dur:9, steps:[
    {t:0, title:"The clock", text:"Time starts at last known well, not at the moment the patient was found."},
    {t:3, title:"Thrombolysis", text:"Alteplase is considered up to 4.5 hours when exclusions have been checked. The dose is 0.9 mg/kg, maximum 90 mg."},
    {t:6, title:"Thrombectomy", text:"A large-vessel occlusion may still be treated by mechanical thrombectomy on a longer imaging-selected clock."}
  ]},
  tbiPrimary:{dur:8, steps:[
    {t:0, title:"Primary injury", text:"The impact tears axons and vessels and bruises cortex. This damage is already done when the patient arrives."},
    {t:3, title:"Coup and contrecoup", text:"Injury is at the impact and often opposite it, where the brain rebounds."}
  ]},
  tbiSecond:{dur:9, steps:[
    {t:0, title:"Secondary injury", text:"The hours after trauma decide how much more brain is lost."},
    {t:2, title:"The drivers", text:"Hypoxia, hypotension, swelling, seizures and raised pressure extend the damage. These are the targets of care."}
  ]},
  edema:{dur:8, steps:[
    {t:0, title:"Oedema", text:"Cytotoxic and vasogenic swelling increase brain volume."},
    {t:3, title:"The box", text:"The skull does not expand. After a point, small increases in volume cause large increases in pressure."}
  ]},
  cpp:{dur:8, steps:[
    {t:0, title:"Perfusion pressure", text:"Cerebral perfusion pressure is mean arterial pressure minus intracranial pressure."},
    {t:3, title:"The fall", text:"If pressure inside the skull rises and blood pressure does not, the brain is under-perfused."}
  ]},
  icp:{dur:9, steps:[
    {t:0, title:"Compliance", text:"Early volume is tolerated. The pressure curve then steepens."},
    {t:4, title:"Clinical meaning", text:"A patient can look stable and then deteriorate quickly once that steep part is reached."}
  ]},
  hern:{dur:8, steps:[
    {t:0, title:"Across the tentorium", text:"The medial temporal lobe is forced through the tentorial opening."},
    {t:3, title:"The pupil", text:"The oculomotor nerve is compressed. The pupil on that side enlarges. The opposite limbs become weak."}
  ]},
  sahRupture:{dur:9, steps:[
    {t:0, title:"The sac", text:"An aneurysm forms at a branch point. The dome is weakest."},
    {t:4, title:"Rupture", text:"Blood leaves the artery at arterial pressure and enters the subarachnoid space."}
  ]},
  sahBlood:{dur:8, steps:[
    {t:0, title:"Where the blood goes", text:"Blood fills the basal cisterns and can track into the ventricles or the brain itself."}
  ]},
  sahIcp:{dur:8, steps:[
    {t:0, title:"The pressure spike", text:"Intracranial pressure can jump at the moment of rupture. Cerebral blood flow can briefly stop. That is one mechanism of the sudden coma."}
  ]},
  ebi:{dur:8, steps:[
    {t:0, title:"Early brain injury", text:"The first 72 hours bring global inflammation, microcirculatory failure and ionic injury, not only the effect of the clot."}
  ]},
  hydro:{dur:8, steps:[
    {t:0, title:"Hydrocephalus", text:"Blood blocks CSF pathways. The ventricles enlarge. The patient becomes sleepier, and an external drain is then considered."}
  ]},
  spasm:{dur:8, steps:[
    {t:0, title:"Vasospasm", text:"From about day 3, and for up to two weeks, arteries can narrow. This is a radiographic finding."}
  ]},
  dci:{dur:8, steps:[
    {t:0, title:"Delayed cerebral ischaemia", text:"A new deficit or a fall in consciousness in that window. Angiographic spasm explains only part of it. Treat the patient, not only the picture of the artery."}
  ]},
  mca:{dur:9, steps:[
    {t:0, title:"Occlusion", text:"Clot lodges in the middle cerebral stem or one of its divisions."},
    {t:4, title:"The territory", text:"Face and arm are weak. In the dominant hemisphere, language fails. The leg may be relatively spared because it is anterior-cerebral cortex."}
  ]},
  nimo:{dur:8, steps:[
    {t:0, title:"What it does", text:"Nimodipine is a calcium-channel blocker used enterally after aneurysmal subarachnoid haemorrhage."},
    {t:3, title:"How it is given", text:"60 mg every 4 hours for 21 days, if the blood pressure allows. It is not an intravenous drug in ordinary practice. It does not replace securing the aneurysm."}
  ]},
  osm:{dur:8, steps:[
    {t:0, title:"Osmotherapy", text:"Mannitol or hypertonic saline pulls water out of brain tissue for a time. Watch sodium, osmolality, volume and the clinical response."}
  ]},
  benzo:{dur:8, steps:[
    {t:0, title:"First drug", text:"A benzodiazepine stops the seizure. Lorazepam 4 mg intravenously, repeated once, is the usual adult teaching dose. Intramuscular midazolam if there is no vein."}
  ]},
  heparin:{dur:9, steps:[
    {t:0, title:"The sinus", text:"Thrombus in a dural sinus blocks venous outflow."},
    {t:3, title:"Anticoagulation", text:"Heparin is the usual treatment, including when a modest venous haemorrhage is already present. Worsening clot, falling consciousness or refractory pressure raises the question of endovascular removal in a specialist centre."}
  ]},
  reverse:{dur:8, steps:[
    {t:0, title:"Stop the bleeding", text:"Reverse anticoagulation with the specific agent. Lower systolic pressure smoothly toward about 140 if it is high. Avoid a crash fall."}
  ]}
};

    indication:indication,
    prerequisites:["A scan that shows the target ventricle","A plan for coagulation","A sterile field and a trained operator","Consent when the situation allows"],

    specialist:"This is a specialist procedure. The animation is a teaching sequence, not a licence to perform it and not a filmed operation."};
}
function proc(id, name, show, indication, prerequisites, risks){
  return {id:id, name:name, show:show, indication:indication, prerequisites:prerequisites, risks:risks,
    specialist:"Perform it only if you are trained and the clinical indication is real. This page is a teaching sequence, not a filmed procedure and not a device manual."};
}

const DISEASES = [
  {id:"tbi", name:"TBI", full:"Traumatic brain injury",
    overview:{definition:"Brain dysfunction caused by an external force. Severity is grouped by the Glasgow coma scale: mild 13–15, moderate 9–12, severe 3–8.", classification:"Primary damage occurs at impact. Secondary damage occurs afterwards from hypoxia, hypotension, swelling, seizures and pressure. Lesions may be focal, diffuse, closed or penetrating.", significance:"The injury already done cannot be undone. Care is aimed at preventing the next injury and finding lesions that need an operation."},
    anatomy:{note:"The ventricles, the tentorium and the brainstem are the landmarks for pressure, drains and herniation.", labels:["Lateral ventricle","Third ventricle","Tentorium cerebelli","Midbrain","Oculomotor nerve (III)"]},

      {id:"edema", name:"Cerebral oedema", show:"edema", link:"Swelling raises pressure and can force herniation."},

    ],

      {sign:"Battle sign, raccoon eyes, CSF leak", mechanism:"Basal skull fracture. Do not pack a CSF leak blindly."}
    ],
    invest:[

      proc("ett","Endotracheal intubation","ett","The patient cannot protect the airway, or ventilation must be controlled to protect the brain.",["Monitoring","A plan that avoids hypoxia and hypotension","Cervical spine held if not cleared"],["Failed airway","Hypotension on induction","Right main bronchus"]),

let hotspots = [];

function readHash(){
  const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  if(parts[0] && DISEASES.some(function(d){ return d.id===parts[0]; })) diseaseId = parts[0];
  if(parts[1] && SECTIONS.some(function(s){ return s[0]===parts[1]; })) sectionId = parts[1];
  topicId = parts[2] || "";
}
function writeHash(){
  const next = topicId ? diseaseId+"/"+sectionId+"/"+topicId : diseaseId+"/"+sectionId;
  if(location.hash.replace(/^#/, "") !== next) history.replaceState(null, "", "#"+next);
}
function paintChrome(){
  document.getElementById("diseases").innerHTML = DISEASES.map(function(d){
    return '<button type="button"'+(d.id===diseaseId?' class="on"':'')+' data-d="'+d.id+'">'+esc(d.name)+'</button>';
  }).join("");
  document.getElementById("diseases").querySelectorAll("[data-d]").forEach(function(btn){
    btn.onclick = function(){
      diseaseId = btn.getAttribute("data-d");
      topicId = "";
      casePick = null; caseLocked = false; spotId = "";
      writeHash(); render();
    };
  });
  document.getElementById("sections").innerHTML = SECTIONS.map(function(s){
    return '<button type="button"'+(s[0]===sectionId?' class="on"':'')+' data-s="'+s[0]+'">'+s[1]+'  '+esc(s[2])+'</button>';
  }).join("");
  document.getElementById("sections").querySelectorAll("[data-s]").forEach(function(btn){
    btn.onclick = function(){
      sectionId = btn.getAttribute("data-s");
      topicId = "";
      algoStep = 0; spotId = "";
      writeHash(); render();
    };
  });
  const dNow = disease();
  const sNow = SECTIONS.find(function(item){ return item[0]===sectionId; });
  document.getElementById("context").textContent = dNow.full + "  ·  " + (sNow ? sNow[1] + "  " + sNow[3] : "");
}
function sectionTitle(){
  const s = SECTIONS.find(function(item){ return item[0]===sectionId; });
  return s ? s[3] : "";
}
function openTopic(id){
  topicId = id;
  spotId = "";
  writeHash();
  render();
  work.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"start"});
}
function render(){
  playerToken++;
  brainToken++;
  if(anatomyCleanup){ anatomyCleanup(); anatomyCleanup = null; }
  if(filmCleanup){ filmCleanup(); filmCleanup = null; }
  paintChrome();
  writeHash();
  const d = disease();
  const head = '<p class="kicker">'+esc(d.full)+'</p><h2>'+esc(sectionTitle())+'</h2>';
  if(sectionId==="overview") renderOverview(d, head);
  else if(sectionId==="anatomy") renderAnatomy(d, head);
  else if(sectionId==="etiology") renderList(d, head, "Causes and risks", d.etiology);
  else if(sectionId==="path") renderCatalogue(d, head, d.path, "Each mechanism opens an animated sequence.");
  else if(sectionId==="clinical") renderPairs(d, head, "Sign", d.clinical, "sign", "mechanism");
  else if(sectionId==="invest") renderPairs(d, head, "Test", d.invest, "test", "look");
  else if(sectionId==="ddx") renderPairs(d, head, "Alternative", d.ddx, "name", "split");
  else if(sectionId==="algo") renderAlgo(d, head);
  else if(sectionId==="meds") renderCatalogue(d, head, d.meds, "Open a drug to see its mechanism.");
  else if(sectionId==="procedures") renderCatalogue(d, head, d.procedures, "Open a procedure for a visual demonstration, not a text-only page.");
  else if(sectionId==="monitor") renderList(d, head, "Watch these", d.monitor);
  else if(sectionId==="complications") renderComplications(d, head);
  else if(sectionId==="prognosis") renderPrognosis(d, head);
  else if(sectionId==="case") renderCase(d, head);
  else renderAssess(d, head);
}

  work.innerHTML =
    '<p class="kicker">'+esc(d.full)+' · '+esc(sectionTitle())+'</p>'+
    '<div class="backrow"><button type="button" id="backcat">Back to the list</button></div>'+
    '<div class="stage wide">'+
      '<div class="panel side-l"><span class="badge">'+(def.inspect?"3D teaching view":"3D teaching sequence")+'</span><h2>'+esc(topic.name)+'</h2>'+

        (topic.mech?'<h3>Mechanism</h3><p>'+esc(topic.mech)+'</p>':"")+
        (topic.link?'<p>'+esc(topic.link)+'</p>':"")+

        (topic.prerequisites?'<h3>Before you start</h3>'+topic.prerequisites.map(function(x){return '<p>'+esc(x)+'</p>';}).join(""):"")+
        '<p class="note warn">'+esc(topic.specialist || "Teaching material for clinicians. Not an order and not a filmed procedure.")+'</p>'+

      '<div class="panel side-r"><h3>Steps</h3><div class="grid" id="steps">'+steps.map(function(s,i){

      }).join("")+'</div>'+(topic.risks?'<h3>Risks</h3>'+topic.risks.map(function(x){return '<p>'+esc(x)+'</p>';}).join(""):"")+(topic.harm?'<h3>Harm</h3><p>'+esc(topic.harm)+'</p>':"")+'</div>'+
      '<div class="controls"><button type="button" id="play">'+(reduced?'Play':'Pause')+'</button><button type="button" id="replay">Replay</button>'+
        '<input id="scrub" type="range" min="0" max="'+def.dur+'" step="0.05" value="0" aria-label="Timeline">'+
        '<button type="button" id="slow">0.75×</button><button type="button" id="fast">1.5×</button></div>'+
    '</div>';
  document.getElementById("backcat").onclick = function(){ topicId=""; writeHash(); render(); };
  const canvas = document.getElementById("reel");
  const hud = document.getElementById("hud");
  player = {t:0, playing:!reduced, speed:1, step:-1, dur:def.dur};
  const playBtn = document.getElementById("play");
  const theatre = mountFilm(canvas, hud, function(){
    player.playing = false;
    playBtn.textContent = "Play";
  });
  filmCleanup = function(){ theatre.dispose(); };
  theatre.setShow(topic.show);
  const scrub = document.getElementById("scrub");
  function currentStep(){
    let idx = 0;
    steps.forEach(function(s,i){ if(player.t+0.05 >= s.t) idx = i; });
    return idx;
  }
  function paintFrame(){
    const idx = currentStep();
    if(player.playing) theatre.recenter();
    theatre.frame(player.t, spotId);
    if(hud && steps[idx]){
      const extra = hud.textContent;
      hud.textContent = steps[idx].title + (extra ? "  ·  " + extra : "");
    }
    if(idx !== player.step){
      player.step = idx;
      work.querySelectorAll(".step").forEach(function(btn,i){ btn.classList.toggle("on", i===idx); });
    }
    scrub.value = String(player.t);
  }
  function seek(t, pause){
    player.t = Math.max(0, Math.min(def.dur, t));
    if(pause) player.playing = false;
    playBtn.textContent = player.playing ? "Pause" : "Play";
    theatre.recenter();
    paintFrame();
  }
  playBtn.onclick = function(){ player.playing = !player.playing; playBtn.textContent = player.playing ? "Pause" : "Play"; };
  document.getElementById("replay").onclick = function(){ player.t = 0; player.playing = true; playBtn.textContent = "Pause"; paintFrame(); };
  document.getElementById("slow").onclick = function(){ player.speed = 0.75; };
  document.getElementById("fast").onclick = function(){ player.speed = 1.5; };
  scrub.oninput = function(){ seek(Number(scrub.value), true); };
  work.querySelectorAll(".step").forEach(function(btn){
    btn.onclick = function(){ seek(steps[Number(btn.getAttribute("data-step"))].t, true); };
  });
  canvas.onclick = function(event){
    if(!def.inspect) return;
    const hit = theatre.pick(event);
    if(!hit) return;
    spotId = hit;
    const idx = CT_SPOTS.findIndex(function(s){ return s.id===hit; });
    if(idx>=0) seek(steps[idx].t, true);
  };
  paintFrame();
  const token = ++playerToken;
  let last = 0;
  function loop(now){
    if(token !== playerToken) return;
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, last ? (now-last)/1000 : 0.016);
    last = now;
    if(player && player.playing){
      player.t += dt*player.speed;
      if(player.t >= player.dur){ player.t = player.dur; player.playing = false; playBtn.textContent = "Play"; }
    }
    paintFrame();
  }
  requestAnimationFrame(loop);
}
function renderAlgo(d, head){
  work.innerHTML = head+'<p class="note">Tap a step, or walk the pathway. Doses elsewhere on the page are teaching reminders, not orders.</p><div class="grid algo" id="algo">'+d.algo.map(function(step,i){
    return '<button type="button" class="card'+(i===algoStep?' on"':'"')+' data-i="'+i+'"><b>Step '+(i+1)+'</b><span>'+esc(step)+'</span></button>';
  }).join("")+'</div><div class="controls"><button type="button" id="walk">Walk the pathway</button></div>'+simLink(d)+footnote();
  work.querySelectorAll("[data-i]").forEach(function(btn){
    btn.onclick = function(){ algoStep = Number(btn.getAttribute("data-i")); renderAlgo(d, head); };
  });
  document.getElementById("walk").onclick = function(){
    algoStep = (algoStep+1) % d.algo.length;
    renderAlgo(d, head);
  };
}
function renderAnatomy(d, head){
  work.innerHTML = head+'<p class="lead">'+esc(d.anatomy.note)+'</p><p class="note">This is a real glTF model, the same atlas as the 3D brain lab. It is not a video. Drag to turn it. Only the structures named for this disease are coloured.</p><div class="player"><canvas id="anat"></canvas></div><p><a href="brain-3d.html">Open the full interactive brain</a></p>'+footnote();
  mountAnatomy(d.anatomy.labels || []);
}
function mountAnatomy(labels){
  const canvas = document.getElementById("anat");
  if(!canvas) return;
  canvas.width = 960; canvas.height = 540;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true}); }
  catch(err){ return; }
  renderer.setSize(canvas.clientWidth || 640, 360, false);
  renderer.setClearColor(0x071018, 1);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xf2efe8, 0x101820, 1));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(2,3,4); scene.add(key);
  const camera = new THREE.PerspectiveCamera(35, 16/9, 0.01, 50);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  const token = ++brainToken;
  const loader = new GLTFLoader();
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
  loader.setDRACOLoader(draco);
  loader.load("neuro/brain.glb", function(gltf){
    if(token !== brainToken) return;
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
    const size = box.getSize(new THREE.Vector3());
    const extent = Math.max(size.x, size.y, size.z);
    camera.position.set(0, extent*0.05, extent*0.9);
    scene.add(model);
    const wanted = {};
    labels.forEach(function(name){ wanted[name] = true; });
    const focus = new THREE.Box3();
    let n = 0;
    model.traverse(function(obj){
      if(!obj.isMesh) return;
      obj.material = obj.material.clone();
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      const on = !!wanted[obj.userData.bx_label];
      mats.forEach(function(mat){
        if(on){ mat.color.set("#7fd4e6"); mat.emissive = new THREE.Color("#7fd4e6"); mat.emissiveIntensity = 0.25; }
      });
      if(on){ focus.expandByObject(obj); n++; }
    });
    if(n){
      const c = focus.getCenter(new THREE.Vector3());
      controls.target.copy(c);
      camera.position.copy(c).add(new THREE.Vector3(0, extent*0.05, extent*0.55));
    }
  });
  let frame = 0;
  anatomyCleanup = function(){
    cancelAnimationFrame(frame);
    controls.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
    draco.dispose();
  };
  function loop(){
    if(token !== brainToken) return;
    frame = requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  }
  const viewW = Math.max(320, canvas.clientWidth || 640);
  const viewH = Math.round(viewW * 9 / 16);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(viewW, viewH, false);
  camera.aspect = viewW / viewH;
  camera.updateProjectionMatrix();
  frame = requestAnimationFrame(loop);
}
function renderCase(d, head){
  const item = d.case;
  work.innerHTML = head+'<span class="badge">Clinical case</span><p class="lead">'+esc(item.stem)+'</p><div class="grid" id="choices">'+item.choices.map(function(choice){
    return '<button type="button" class="card" data-c="'+choice.id+'"><b>'+esc(choice.label)+'</b></button>';
  }).join("")+'</div><div class="controls"><button type="button" id="lock">Submit</button></div><p id="why" class="lead"></p>'+footnote();
  work.querySelectorAll("[data-c]").forEach(function(btn){
    btn.onclick = function(){
      if(caseLocked) return;
      casePick = btn.getAttribute("data-c");
      work.querySelectorAll("[data-c]").forEach(function(other){ other.classList.toggle("on", other===btn); });
    };
  });
  document.getElementById("lock").onclick = function(){
    if(!casePick){ document.getElementById("why").textContent = "Choose a response first."; return; }
    caseLocked = true;
    work.querySelectorAll("[data-c]").forEach(function(btn){
      const id = btn.getAttribute("data-c");
      btn.classList.toggle("on", id===item.answer);
    });
    const right = casePick === item.answer;
    document.getElementById("why").textContent = (right ? "Correct. " : "Not that one. ")+item.why;
  };
  if(caseLocked) document.getElementById("lock").click();
}
function renderAssess(d, head){
  const key = "bd-"+d.id;
  work.innerHTML = head+'<span class="badge">Questions</span><div id="qs">'+d.quiz.map(function(q,i){
    return '<div class="card"><b>'+esc(q.q)+'</b><div class="grid">'+q.choices.map(function(choice, n){
      return '<button type="button" data-q="'+i+'" data-n="'+n+'">'+esc(choice)+'</button>';
    }).join("")+'</div><p class="note" id="why-'+i+'"></p></div>';
  }).join("")+'</div><h3>References</h3>'+d.refs.map(function(r){return '<p class="note">'+esc(r)+'</p>';}).join("")+simLink(d)+footnote();
  work.querySelectorAll("[data-q]").forEach(function(btn){
    btn.onclick = function(){
      const i = Number(btn.getAttribute("data-q"));
      if(quizLocked[key+i]) return;
      quizLocked[key+i] = true;
      const n = Number(btn.getAttribute("data-n"));
      const q = d.quiz[i];
      const right = n === q.answer;
      work.querySelectorAll('[data-q="'+i+'"]').forEach(function(other){
        other.classList.toggle("on", Number(other.getAttribute("data-n"))===q.answer);
      });
      document.getElementById("why-"+i).textContent = (right?"Correct. ":"Not that one. ")+q.why;
    };
  });
}
function simLink(d){
  if(!d.sim) return "";
  return '<p><a href="'+esc(d.sim)+'">Open the practice simulator for this disease</a></p>';
}
function footnote(){
  return '<p class="note">Doses are teaching reminders for clinicians, not prescriptions. Sequences are three-dimensional teaching views. Where the atlas has the structure, it is the real model. They are not a filmed operation and not a patient scan.</p>';
}
window.addEventListener("hashchange", function(){ readHash(); render(); });
readHash();
if(!location.hash){ diseaseId = "tbi"; sectionId = "procedures"; topicId = ""; }
render();

</script>
