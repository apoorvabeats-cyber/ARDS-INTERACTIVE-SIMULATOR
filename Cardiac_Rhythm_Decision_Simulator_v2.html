<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardiac Rhythm Decision Simulator</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#d9e1ec;--accent:#1264a3;--good:#14804a;--bad:#c62828;--warn:#a15c00;--ecg:#10a85a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{max-width:1050px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:18px}.case{font-size:13px;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 16px 80px}.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px rgba(20,32,51,.05)}
.start{text-align:center;padding:70px 24px}.start h1{font-size:32px;margin:0 0 12px}.start p{color:var(--muted);max-width:650px;margin:0 auto 28px;line-height:1.6}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 15px;cursor:pointer}
button:hover{border-color:#9bb3ca}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.good{background:#eaf8f0;border-color:#a9ddc1;color:#12643c}button.danger{background:#fff0f0;border-color:#efb0b0;color:#9c2020}
button:disabled{opacity:.5;cursor:not-allowed}
.question{font-size:22px;font-weight:800;margin-bottom:14px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{text-align:left;min-height:58px}.option b{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:#eef3f8;margin-right:8px}
.feedback{min-height:28px;margin-top:14px;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.ecg-wrap{background:#07130d;border-radius:15px;padding:10px;overflow:hidden}.ecg-title{display:flex;justify-content:space-between;color:#d6ffe3;font-size:13px;margin:0 3px 8px}.ecg{width:100%;height:190px;display:block;background:linear-gradient(rgba(16,168,90,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(16,168,90,.09) 1px,transparent 1px);background-size:20px 20px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.controls button{padding:9px 12px}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.vital{border:1px solid var(--line);border-radius:12px;padding:12px}.vital small{display:block;color:var(--muted)}.vital strong{font-size:22px}.vital.alert{animation:blink .65s infinite}.vital.alert strong{color:var(--bad)}
@keyframes blink{50%{background:#fff0f0}}
.flash{animation:flash .55s 2}@keyframes flash{50%{box-shadow:0 0 0 5px rgba(20,128,74,.35)}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tabs button{font-size:12px;min-height:58px}.tabs button.selected{border-color:var(--accent);background:#eef6fd}.tabs button.correct{background:#eaf8f0;border-color:#8dd0aa}.tabs button.wrong{background:#fff0f0;border-color:#e7a4a4}
.scenario{line-height:1.55;background:#f8fafc;border-radius:12px;padding:14px}.abg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.abg .lab{border:1px solid var(--line);padding:12px;border-radius:12px}.lab small{display:block;color:var(--muted)}
.hidden{display:none!important}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.status{font-size:12px;color:var(--muted);margin-top:8px}
.alarm{position:fixed;right:16px;bottom:16px;background:#9c2020;color:white;padding:10px 14px;border-radius:12px;display:none;font-weight:800;z-index:30}.alarm.on{display:block;animation:blink .6s infinite}
@media(max-width:650px){.options{grid-template-columns:1fr}.vitals{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(2,1fr)}.abg{grid-template-columns:repeat(2,1fr)}.start h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">Cardiac Rhythm Decision Simulator</div><div class="case" id="caseLabel"></div></div></header>
<main>
<section id="start" class="screen active">
 <div class="card start">
  <h1>Cardiac Rhythm Decision Simulator</h1>
  <p>Interactive ECG recognition, treatment decisions, and a separate dynamic cardiac-arrest pathway.</p>
  <button class="primary" id="startBtn">Start Simulation</button>
 </div>
</section>

<section id="sim" class="screen">
 <div class="card">
  <div class="vitals" id="vitals"></div>
 </div>

 <div class="card" id="ecgCard">
  <div class="ecg-wrap">
   <div class="ecg-title"><span>ECG</span><span id="rateLabel"></span></div>
   <canvas id="ecg" class="ecg"></canvas>
  </div>
  <div class="controls">
   <button id="ecgPause">⏸ Pause ECG</button><button id="ecgResume">▶ Resume ECG</button>
   <button id="pulsePause">⏸ Pause Pulse</button><button id="pulseResume">▶ Resume Pulse</button>
  </div>
  <div class="status" id="audioStatus"></div>
 </div>

 <div class="card" id="questionCard">
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
 </div>

 <div class="card hidden" id="arrestCard">
  <div class="question">Resuscitation actions</div>
  <div class="options" id="arrestOptions"></div>
  <div class="feedback" id="arrestFeedback"></div>
 </div>

 <div class="card hidden" id="htCard">
  <div class="question">Identify the reversible cause</div>
  <div class="scenario" id="scenario"></div>
  <div style="height:12px"></div>
  <div class="tabs" id="htTabs"></div>
  <div class="feedback" id="htFeedback"></div>
 </div>

 <div class="card hidden" id="managementCard">
  <div class="question">What is the next line of management?</div>
  <div class="options" id="managementOptions"></div>
  <div class="feedback" id="managementFeedback"></div>
 </div>

 <div class="card hidden" id="abgCard">
  <div class="question">ABG</div>
  <div class="abg" id="abg"></div>
 </div>

 <div class="nav">
  <button id="prevBtn">Previous</button>
  <div style="display:flex;gap:8px">
   <button id="refreshAsystoleBtn" class="hidden">↻ Refresh Asystole Scenario</button>
   <button class="primary" id="nextBtn">Next</button>
  </div>
 </div>
</section>
</main>
<div class="alarm" id="alarm">MONITOR ALARM</div>

<script>
"use strict";

/* ===== CASE DATABASE ===== */
const core = [
 {id:1,name:"Normal sinus rhythm",kind:"sinus",rate:75,correct:"Normal sinus rhythm",treatment:"No acute treatment required; continue monitoring"},
 {id:2,name:"Sinus bradycardia",kind:"sinus",rate:48,correct:"Sinus bradycardia",treatment:"Assess symptoms; atropine if symptomatic with instability"},
 {id:3,name:"Sinus tachycardia",kind:"sinus",rate:125,correct:"Sinus tachycardia",treatment:"Treat the underlying cause"},
 {id:4,name:"Sinus arrhythmia",kind:"arrhythmia",rate:75,correct:"Sinus arrhythmia",treatment:"Usually no treatment; treat the underlying cause if needed"},
 {id:5,name:"Atrial fibrillation",kind:"af",rate:118,correct:"Atrial fibrillation",treatment:"Rate control and assess anticoagulation/stroke risk"},
 {id:6,name:"Atrial flutter",kind:"flutter",rate:150,correct:"Atrial flutter",treatment:"Rate control and assess anticoagulation/stroke risk"},
 {id:7,name:"PSVT",kind:"psvt",rate:180,correct:"Paroxysmal supraventricular tachycardia",treatment:"Vagal manoeuvres; adenosine if appropriate"},
 {id:8,name:"PVCs",kind:"pvc",rate:76,correct:"Premature ventricular complexes",treatment:"Assess cause and treat triggers; manage instability if present"},
 {id:9,name:"Monomorphic VT",kind:"vt",rate:165,correct:"Monomorphic ventricular tachycardia",treatment:"Synchronized cardioversion if unstable; antiarrhythmic therapy if appropriate"},
 {id:10,name:"Torsades de pointes",kind:"torsades",rate:190,correct:"Torsades de pointes",treatment:"IV magnesium and correct precipitating factors; defibrillate if pulseless"},
 {id:11,name:"Ventricular fibrillation",kind:"vf",rate:0,correct:"Ventricular fibrillation",treatment:"Immediate unsynchronized defibrillation and CPR"},
 {id:12,name:"First-degree AV block",kind:"av1",rate:65,correct:"First-degree atrioventricular block",treatment:"Usually observation and treatment of the underlying cause"},
 {id:13,name:"Second-degree AV block – Mobitz I/Wenckebach",kind:"mobitz1",rate:55,correct:"Second-degree atrioventricular block, Mobitz I (Wenckebach)",treatment:"Assess symptoms; atropine if symptomatic bradycardia"},
 {id:14,name:"Second-degree AV block – Mobitz II",kind:"mobitz2",rate:48,correct:"Second-degree atrioventricular block, Mobitz II",treatment:"Pacing for significant symptomatic/high-risk block"},
 {id:15,name:"Third-degree AV block/complete heart block",kind:"complete",rate:38,correct:"Third-degree atrioventricular block (complete heart block)",treatment:"Immediate pacing for symptomatic/high-risk complete heart block"},
 {id:16,name:"Asystole",kind:"asystole",rate:0,correct:"Asystole",treatment:null}
];
const miscNames = [
 "STEMI","NSTEMI / ischemic ST depression","Tall/peaked T waves — hyperkalemia","T-wave inversion",
 "ST-segment depression","Hyperacute T waves","Wellens pattern","de Winter pattern","Posterior MI",
 "Right ventricular MI","Acute pericarditis","LBBB with Sgarbossa/modified Sgarbossa pattern","RBBB",
 "Bifascicular block","Brugada type 1","Long QT","Short QT","WPW/pre-excitation","Hypokalemia with U waves",
 "Hypocalcemia with prolonged QT","Hypercalcemia with short QT","LVH with strain","RV strain / acute PE pattern",
 "Electrical alternans / low-voltage effusion pattern"
];
const misc = miscNames.map((name,i)=>({id:17+i,name,kind:"misc"+(17+i),rate:[78,82,88,72,80,90,76,84,74,86,75,68,70,66,72,62,74,92,68,64,78,70,96,84][i],correct:name,treatment:"Manage the underlying clinical condition and follow the appropriate guideline-based pathway"}));
const cases = [...core,...misc];

const hts = [
 {name:"Hypovolemia",type:"H",scenario:"Postoperative patient with several hours of bleeding. The patient is tachycardic and hypotensive with cool extremities, poor capillary refill and a low pulse pressure.",management:"Rapid IV fluid/blood-product resuscitation and control the bleeding."},
 {name:"Hypoxia",type:"H",scenario:"A ventilated patient suddenly desaturates. SpO₂ is 72%, oxygen delivery is inadequate and there are signs of severe hypoxemia.",management:"Restore oxygenation and ventilation; provide 100% oxygen while correcting the cause."},
 {name:"Hydrogen ion/acidosis",type:"H",scenario:"Prolonged shock with poor perfusion. ABG shows severe metabolic acidosis, very low pH, low bicarbonate and markedly elevated lactate.",management:"CPR/ventilation as indicated and correct the underlying cause of severe acidosis and tissue hypoperfusion."},
 {name:"Hypo-/hyperkalemia",type:"H",scenario:"A patient with renal failure develops weakness and malignant ECG changes with broad QRS complexes and tall peaked T waves.",management:"Urgently treat the potassium abnormality with appropriate membrane stabilization and potassium-lowering therapy."},
 {name:"Hypothermia",type:"H",scenario:"An unconscious patient is found after prolonged cold exposure. Core temperature is markedly reduced and the ECG shows bradycardia with J-wave-type changes.",management:"Active rewarming and standard resuscitation with attention to hypothermia-specific considerations."},
 {name:"Tension pneumothorax",type:"T",scenario:"Immediately after positive-pressure ventilation, the patient becomes profoundly hypotensive with unilateral absent breath sounds, severe respiratory distress and obstructive-shock physiology.",management:"Immediate chest decompression followed by definitive chest drainage."},
 {name:"Cardiac tamponade",type:"T",scenario:"A patient with a large pericardial effusion becomes hypotensive and tachycardic with raised venous pressure and pulsus paradoxus. Echo suggests chamber compression.",management:"Urgent pericardial drainage."},
 {name:"Toxins",type:"T",scenario:"An unconscious patient has a history suggesting drug exposure. There is unexplained cardiovascular collapse with a toxidrome-compatible examination.",management:"Supportive resuscitation plus the appropriate antidote/toxin-specific therapy when available."},
 {name:"Thrombosis — pulmonary",type:"T",scenario:"Sudden cardiovascular collapse follows acute dyspnea. There is severe hypoxemia, right-heart strain and a strong clinical context for massive pulmonary embolism.",management:"Treat massive pulmonary embolism with urgent reperfusion therapy when indicated."},
 {name:"Thrombosis — coronary",type:"T",scenario:"Cardiac arrest is preceded by crushing chest pain and dynamic ischemic ECG changes. There is strong evidence of acute coronary occlusion.",management:"Urgent coronary reperfusion/PCI pathway."}
];

/* ===== STATE ===== */
const state = {
 running:false, caseIndex:0, case:null, phase:"rhythm", answered:false, treatmentAnswered:false,
 ecgPaused:false,pulsePaused:false, audioCtx:null, pulseTimer:null, alarmTimer:null,
 ht:null, htAnswered:false, managementAnswered:false, abgImproved:false, arrestPath:[], arrestStep:0
};
let anim=0, last=0;

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sampleWrong=(correct,pool,n=3)=>shuffle(pool.filter(x=>x!==correct)).slice(0,n);
function speak(text){
 if(!("speechSynthesis" in window)) return Promise.resolve();
 speechSynthesis.cancel();
 return new Promise(resolve=>{
   const u=new SpeechSynthesisUtterance(text); u.rate=.95;u.pitch=1;
   u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
 });
}
function ding(){
 try{const c=state.audioCtx||new (window.AudioContext||window.webkitAudioContext)();state.audioCtx=c;
  [0,1].forEach((i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i?880:660;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime+i*.14);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+i*.14+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.14+.18);o.start(c.currentTime+i*.14);o.stop(c.currentTime+i*.14+.2)})
 }catch(e){}
}
function alarmSound(on){
 const el=$("alarm");el.classList.toggle("on",on);
 if(on&&!state.alarmTimer) state.alarmTimer=setInterval(()=>{try{const c=state.audioCtx||new (window.AudioContext||window.webkitAudioContext)();state.audioCtx=c;const o=c.createOscillator(),g=c.createGain();o.frequency.value=900;o.type="square";o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.14);o.start();o.stop(c.currentTime+.15)}catch(e){}},600);
 if(!on&&state.alarmTimer){clearInterval(state.alarmTimer);state.alarmTimer=null}
}
function pulse(){
 if(!state.running||state.pulsePaused||state.ecgPaused)return;
 const c=state.case;
 if(!c||["vf","asystole"].includes(c.kind))return;
 try{const ac=state.audioCtx||new (window.AudioContext||window.webkitAudioContext)();state.audioCtx=ac;
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=70;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.13,ac.currentTime+.008);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.start();o.stop(ac.currentTime+.1);
 }catch(e){}
}
function schedulePulse(){
 clearTimeout(state.pulseTimer);
 if(!state.running||state.pulsePaused||state.ecgPaused)return;
 const c=state.case; if(!c||c.kind==="vf"||c.kind==="asystole"){state.pulseTimer=null;return}
 let rate=c.rate||75;
 let interval=60000/rate;
 if(c.kind==="af") interval*=.75+Math.random()*.5;
 if(c.kind==="arrhythmia") interval*=.85+Math.random()*.3;
 if(c.kind==="pvc") interval*=.75;
 state.pulseTimer=setTimeout(()=>{pulse();schedulePulse()},interval);
}
function setVitals(v,alerts=[]){
 const vals={hr:v.hr,bp:v.bp,rr:v.rr,spo2:v.spo2};
 $("vitals").innerHTML=Object.entries(vals).map(([k,val])=>`<div class="vital ${alerts.includes(k)?"alert":""}"><small>${k==="hr"?"Heart rate":k==="bp"?"Blood pressure":k==="rr"?"Respiratory rate":"SpO₂"}</small><strong>${val}</strong></div>`).join("");
}
function baselineVitals(c){return {hr:c.rate?Math.round(c.rate):0,bp:"124/78",rr:16,spo2:98}}
function flashECG(){ $("ecgCard").classList.remove("flash");void $("ecgCard").offsetWidth;$("ecgCard").classList.add("flash") }

/* ===== ECG ENGINE ===== */
const canvas=$("ecg"),ctx=canvas.getContext("2d");
function resizeCanvas(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(600,r.width*devicePixelRatio);canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
window.addEventListener("resize",resizeCanvas);resizeCanvas();

function gauss(x,m,s,a){return a*Math.exp(-Math.pow((x-m)/s,2)/2)}
function normalBeat(t,rr,prLong=false){
 let x=((t%rr)+rr)%rr;
 let y=0;
 y+=gauss(x,0.18*rr,.035*rr,.16);
 const q=prLong?.35*rr:.28*rr;
 y-=gauss(x,q,.012*rr,.18);y+=gauss(x,q+.025*rr,.010*rr,1.05);y-=gauss(x,q+.055*rr,.014*rr,.28);
 y+=gauss(x,.62*rr,.09*rr,.30);return y;
}
function waveform(kind,t,rate){
 const rr=rate?60000/rate:800;
 switch(kind){
  case"sinus":return normalBeat(t,rr);
  case"arrhythmia":{let phase=t/rr;let varying=rr*(1+.16*Math.sin(phase*2*Math.PI));return normalBeat(t%Math.max(500,varying),Math.max(500,varying))}
  case"af":{let base=normalBeat(t,rr);let x=t%rr;let fibr=.035*Math.sin(x*.13)+.025*Math.sin(x*.071)+.018*Math.sin(x*.31);return (x<.25*rr?0:fibr)+base*.85}
  case"flutter":{let x=t%(rr*.25);let saw=(x/(rr*.25))*0.16;return saw-.08+((t%rr)<.08*rr?normalBeat(t,rr)*.9:0)}
  case"psvt":return normalBeat(t,333);
  case"pvc":{let x=t%rr;if(x>rr*.7&&x<rr*.94){let z=(x-rr*.7)/(rr*.24);return Math.sin(z*Math.PI*2)*.8-Math.sin(z*Math.PI*4)*.35}return normalBeat(t,rr)}
  case"vt":return Math.sin((t%rr)/rr*Math.PI*2)*.62+Math.sin((t%rr)/rr*Math.PI*4)*.18;
  case"torsades":{let amp=.2+.75*(.5+.5*Math.sin(t*.004));return amp*Math.sin(t*.065+1.5*Math.sin(t*.0017))}
  case"vf":return .42*Math.sin(t*.047)+.25*Math.sin(t*.083)+.18*Math.sin(t*.137)+.12*Math.sin(t*.211);
  case"av1":return normalBeat(t,rr,true);
  case"mobitz1":{let cycle=4, beat=Math.floor(t/rr)%cycle;return beat===3?0:normalBeat(t,rr-(beat*.018*rr),true)}
  case"mobitz2":{let beat=Math.floor(t/rr)%4;return beat===2?0:normalBeat(t,rr,true)}
  case"complete":{let p=normalBeat(t,800);let q=waveform("vt",t,rate)*.5;return p*.5+q}
  case"asystole":return 0;
  default:{
    if(kind==="misc17") return normalBeat(t,rr)+gauss(t%rr,.28*rr,.02*rr,.35); // STEMI
    if(kind==="misc18"||kind==="misc21") return normalBeat(t,rr)-gauss(t%rr,.52*rr,.055*rr,.32);
    if(kind==="misc19"||kind==="misc22") return normalBeat(t,rr)+gauss(t%rr,.48*rr,.07*rr,.72);
    if(kind==="misc23") return normalBeat(t,rr)-gauss(t%rr,.62*rr,.07*rr,.30);
    if(kind==="misc24") return normalBeat(t,rr)-gauss(t%rr,.50*rr,.04*rr,.45)+gauss(t%rr,.58*rr,.03*rr,.45);
    if(kind==="misc25") return normalBeat(t,rr)-gauss(t%rr,.46*rr,.055*rr,.75);
    if(kind==="misc26") return normalBeat(t,rr)-gauss(t%rr,.48*rr,.05*rr,.55);
    if(kind==="misc27") return normalBeat(t,rr)+gauss(t%rr,.67*rr,.07*rr,.5);
    if(kind==="misc28") return waveform("vt",t,rate)*.45+normalBeat(t,rr)*.35;
    if(kind==="misc29") return normalBeat(t,rr)+Math.sin((t%rr)/rr*Math.PI*2)*.18;
    if(kind==="misc30") return normalBeat(t,rr)+Math.sin((t%rr)/rr*Math.PI*2)*.22;
    if(kind==="misc31") return normalBeat(t,rr)+gauss(t%rr,.46*rr,.035*rr,.35);
    if(kind==="misc32") return normalBeat(t,rr)*.8+Math.sin(t*.012)*.02;
    if(kind==="misc33") return normalBeat(t,rr)*1.05;
    if(kind==="misc34") return normalBeat(t,rr)+gauss(t%rr,.22*rr,.02*rr,.22);
    if(kind==="misc35") return normalBeat(t,rr)+gauss(t%rr,.78*rr,.05*rr,.25);
    if(kind==="misc36") return normalBeat(t,rr)*.75+Math.sin(t*.01)*.02;
    if(kind==="misc37") return normalBeat(t,rr)*.9;
    if(kind==="misc38") return normalBeat(t,rr)*1.25-gauss(t%rr,.62*rr,.07*rr,.35);
    if(kind==="misc39") return normalBeat(t,rr)*.9+Math.sin(t*.03)*.08;
    if(kind==="misc40") return normalBeat(t,rr)*.45+Math.sin(t*.02)*.03;
    return normalBeat(t,rr);
  }
 }
}
function drawECG(now){
 if(!state.running||state.ecgPaused)return;
 const w=canvas.clientWidth,h=canvas.clientHeight;
 ctx.clearRect(0,0,w,h);ctx.strokeStyle="#10a85a";ctx.lineWidth=1.25;ctx.beginPath();
 const c=state.case||core[0], t0=now*.001*1000, speed=1;
 for(let x=0;x<w;x++){
  const t=t0+(x-w)*speed*2.2;
  const y=h/2-waveform(c.kind,t,c.rate)*h*.34;
  if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();anim=requestAnimationFrame(drawECG);
}
function stopECG(){cancelAnimationFrame(anim)}
function startECG(){stopECG();anim=requestAnimationFrame(drawECG)}

function rhythmOptions(c){
 const names=shuffle([c.correct,...sampleWrong(c.correct,cases.map(x=>x.correct),3)]);
 $("options").innerHTML=names.map((x,i)=>`<button class="option" data-answer="${encodeURIComponent(x)}"><b>${"ABCD"[i]}</b>${x}</button>`).join("");
 [...$("options").children].forEach(b=>b.onclick=()=>answerRhythm(decodeURIComponent(b.dataset.answer)));
}
async function answerRhythm(ans){
 if(state.answered)return;
 state.answered=true;
 if(ans===state.case.correct){
  ding();flashECG();$("feedback").className="feedback good";$("feedback").textContent="Correct";
  await speak(`Yes, the rhythm is ${state.case.correct}.`);
  if(state.case.kind==="asystole"){enterArrest();return}
  $("question").textContent="What is the most appropriate treatment?";
  state.phase="treatment";state.treatmentAnswered=false;renderTreatment();
 }else{
  alarmSound(true);$("feedback").className="feedback bad";$("feedback").textContent="Incorrect";
  deteriorate();setTimeout(()=>alarmSound(false),1800);
 }
}
function renderTreatment(){
 const c=state.case;const opts=shuffle([c.treatment,...sampleWrong(c.treatment,[
 "Immediate defibrillation",
 "IV adenosine",
 "No treatment; discharge immediately",
 "Synchronized cardioversion",
 "CPR and epinephrine",
 "Atropine for symptomatic bradycardia",
 "Rate control and stroke-risk assessment",
 "IV magnesium",
 "Urgent pacing",
 "Treat the underlying cause"
 ],3)]);
 $("options").innerHTML=opts.map((x,i)=>`<button class="option" data-answer="${encodeURIComponent(x)}"><b>${"ABCD"[i]}</b>${x}</button>`).join("");
 [...$("options").children].forEach(b=>b.onclick=()=>answerTreatment(decodeURIComponent(b.dataset.answer)));
}
async function answerTreatment(ans){
 if(state.treatmentAnswered)return;state.treatmentAnswered=true;
 if(ans===state.case.treatment){ding();flashECG();$("feedback").className="feedback good";$("feedback").textContent="Correct";await speak("Yes, this is the correct treatment.");}
 else{alarmSound(true);$("feedback").className="feedback bad";$("feedback").textContent="Incorrect";deteriorate();setTimeout(()=>alarmSound(false),1800)}
}
function deteriorate(){setVitals({hr:state.case.rate?Math.max(35,state.case.rate-20):35,bp:"78/46",rr:28,spo2:84},["hr","bp","rr","spo2"]);$("ecgCard").classList.add("flash")}

/* ===== ARREST ENGINE ===== */
function enterArrest(){
 state.phase="arrest";state.arrestStep=0;
 $("questionCard").classList.add("hidden");$("arrestCard").classList.remove("hidden");$("htCard").classList.add("hidden");$("managementCard").classList.add("hidden");$("abgCard").classList.add("hidden");
 buildArrestPath();renderArrest();
 setVitals({hr:0,bp:"0/0",rr:0,spo2:0},["hr","bp","rr","spo2"]);
 alarmSound(true);$("caseLabel").textContent="Asystole pathway";updateArrestNavigation();
 startECG();
}
function buildArrestPath(){
 const lengths=[3,5,7,9,11];let n=lengths[Math.floor(Math.random()*lengths.length)];
 const pool=["asystole","pea","vf","pvt","rosc"];
 let p=["asystole"];
 for(let i=1;i<n-1;i++){
   const choices=shuffle(pool.filter(x=>x!==p[p.length-1]&&x!=="rosc"));
   p.push(choices[0]);
 }
 p.push("rosc");state.arrestPath=p;
}
function arrestName(k){return({asystole:"Asystole",pea:"PEA",vf:"Ventricular fibrillation",pvt:"Pulseless ventricular tachycardia",rosc:"ROSC"})[k]}
const arrestActions=[
 ["CPR","CPR"],["Epinephrine","Epinephrine"],["Airway/BVM","Airway/BVM"],["100% oxygen","100% oxygen"],
 ["IV/IO access","IV/IO access"],["Rhythm check","Rhythm check"],["Capnography","Capnography"],["Defibrillator","Defibrillator"],
 ["Amiodarone","Amiodarone"],["Lidocaine","Lidocaine"],["Magnesium","Magnesium"],["Calcium when indicated","Calcium when indicated"],
 ["Sodium bicarbonate when indicated","Sodium bicarbonate when indicated"],["Search/treat reversible causes","Search/treat reversible causes"]
];
function renderArrest(){
 const k=state.arrestPath[state.arrestStep];
 $("ecgCard").classList.add("flash"); $("rateLabel").textContent=arrestName(k);
 if(k==="vf"){state.case={...state.case,kind:"vf",rate:0};alarmSound(false)}
 else if(k==="pvt"){state.case={...state.case,kind:"vt",rate:180};alarmSound(false)}
 else if(k==="rosc"){state.case={...state.case,kind:"sinus",rate:82};alarmSound(false);setVitals({hr:82,bp:"108/66",rr:20,spo2:95});enterHT();return}
 else {state.case={...state.case,kind:k==="pea"?"asystole":"asystole",rate:0};alarmSound(true)}
 $("arrestOptions").innerHTML=shuffle(arrestActions).map(([label,val],i)=>`<button class="option" data-action="${val}"><b>${i+1}</b>${label}</button>`).join("");
 [...$("arrestOptions").children].forEach(b=>b.onclick=()=>arrestAction(b.dataset.action,k));
}
async function arrestAction(action,k){
 const shockable=k==="vf"||k==="pvt";
 if(action==="Defibrillator"&&!shockable){alarmSound(true);$("arrestFeedback").className="feedback bad";$("arrestFeedback").textContent="Inappropriate action for a non-shockable rhythm.";setVitals({hr:0,bp:"58/34",rr:30,spo2:70},["bp","spo2"]);return}
 if(shockable&&action==="Defibrillator"){ding();$("arrestFeedback").className="feedback good";$("arrestFeedback").textContent="Defibrillation delivered.";state.arrestStep=Math.min(state.arrestStep+1,state.arrestPath.length-1);setTimeout(renderArrest,700);return}
 if(k==="asystole"&&action==="CPR"){ding();$("arrestFeedback").className="feedback good";$("arrestFeedback").textContent="CPR initiated.";state.arrestStep=Math.min(state.arrestStep+1,state.arrestPath.length-1);setTimeout(renderArrest,900);return}
 if(action==="Rhythm check"){state.arrestStep=Math.min(state.arrestStep+1,state.arrestPath.length-1);renderArrest();return}
 alarmSound(true);$("arrestFeedback").className="feedback bad";$("arrestFeedback").textContent="Action noted; reassess the rhythm and clinical state.";
}
function enterHT(){
 $("arrestCard").classList.add("hidden");$("htCard").classList.remove("hidden");$("abgCard").classList.remove("hidden");
 state.ht=hts[Math.floor(Math.random()*hts.length)];state.htAnswered=false;state.managementAnswered=false;
 $("scenario").textContent=state.ht.scenario;
 $("htTabs").innerHTML=hts.map((x,i)=>`<button data-i="${i}">${x.type}: ${x.name}</button>`).join("");
 [...$("htTabs").children].forEach(b=>b.onclick=()=>answerHT(+b.dataset.i));
 updateABG(false);$("htCard").scrollIntoView({behavior:"smooth",block:"start"});
}
async function answerHT(i){
 if(state.htAnswered)return;
 const selected=hts[i]; if(selected.name===state.ht.name){state.htAnswered=true;ding();$("htFeedback").className="feedback good";$("htFeedback").textContent="Correct.";[...$("htTabs").children][i].classList.add("correct");await speak(`Correct. The reversible cause is ${state.ht.name}.`);await speak("What is the next line of management?");renderManagement()}
 else{alarmSound(true);$("htFeedback").className="feedback bad";$("htFeedback").textContent="Incorrect. Reassess the clinical clues.";[...$("htTabs").children][i].classList.add("wrong");setTimeout(()=>alarmSound(false),1200)}
}
function renderManagement(){
 $("managementCard").classList.remove("hidden");
 const opts=shuffle([state.ht.management,"Continue observation without treating the cause","Defibrillate regardless of rhythm","Give an unrelated antiarrhythmic"]);
 $("managementOptions").innerHTML=opts.map((x,i)=>`<button class="option" data-a="${encodeURIComponent(x)}"><b>${"ABCD"[i]}</b>${x}</button>`).join("");
 [...$("managementOptions").children].forEach(b=>b.onclick=()=>answerManagement(decodeURIComponent(b.dataset.a)));
 $("managementCard").scrollIntoView({behavior:"smooth",block:"start"});
}
async function answerManagement(a){
 if(state.managementAnswered)return;state.managementAnswered=true;
 if(a===state.ht.management){ding();$("managementFeedback").className="feedback good";$("managementFeedback").textContent="Correct.";state.abgImproved=true;updateABG(true);setVitals({hr:88,bp:"112/70",rr:18,spo2:97});await speak("Yes, this is the correct option.");}
 else{alarmSound(true);$("managementFeedback").className="feedback bad";$("managementFeedback").textContent="Incorrect. The physiology does not improve.";setTimeout(()=>alarmSound(false),1400)}
}
function updateABG(improved){
 const v=improved?{pH:"7.34",hco3:"20",lactate:"3.1",pO2:"88"}:{pH:"7.12",hco3:"13",lactate:"8.6",pO2:"61"};
 $("abg").innerHTML=Object.entries(v).map(([k,x])=>`<div class="lab"><small>${k==="pH"?"pH":k==="hco3"?"HCO₃⁻":k==="lactate"?"Lactate":"PaO₂"}</small><strong>${x}</strong></div>`).join("");
}

/* ===== SIMULATION NAV ===== */
function loadCase(index){
 speechSynthesis?.cancel();alarmSound(false);state.caseIndex=(index+cases.length)%cases.length;state.case=cases[state.caseIndex];state.phase="rhythm";state.answered=false;state.treatmentAnswered=false;
 $("caseLabel").textContent=`Case ${state.case.id} of 40`;
 $("questionCard").classList.remove("hidden");$("arrestCard").classList.add("hidden");$("htCard").classList.add("hidden");$("managementCard").classList.add("hidden");$("abgCard").classList.add("hidden");
 $("question").textContent="What is the rhythm?";$("feedback").textContent="";$("feedback").className="feedback";
 $("rateLabel").textContent="";rhythmOptions(state.case);setVitals(baselineVitals(state.case));alarmSound(false);schedulePulse();updateArrestNavigation();startECG();
 $("sim").scrollIntoView({behavior:"smooth",block:"start"});
}
$("startBtn").onclick=async()=>{
 state.running=true;$("start").classList.remove("active");$("sim").classList.add("active");
 try{state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();await state.audioCtx.resume()}catch(e){}
 loadCase(Math.floor(Math.random()*cases.length));
};
$("ecgPause").onclick=()=>{state.ecgPaused=true;stopECG();clearTimeout(state.pulseTimer);$("audioStatus").textContent="ECG and pulse paused."};
$("ecgResume").onclick=()=>{state.ecgPaused=false;startECG();schedulePulse();$("audioStatus").textContent="ECG and pulse resumed."};
$("pulsePause").onclick=()=>{state.pulsePaused=true;clearTimeout(state.pulseTimer);$("audioStatus").textContent="Pulse paused."};
$("pulseResume").onclick=()=>{state.pulsePaused=false;schedulePulse();$("audioStatus").textContent="Pulse resumed."};
$("prevBtn").onclick=()=>{if(state.phase!=="arrest")loadCase(state.caseIndex-1)};
$("nextBtn").onclick=()=>{
 if(state.phase==="arrest"){
   if(state.arrestStep<state.arrestPath.length-1){state.arrestStep++;renderArrest()}
   else enterHT()
 }else loadCase(state.caseIndex+1)
};
$("refreshAsystoleBtn").onclick=()=>enterArrest();

function updateArrestNavigation(){
 const arrest = state.phase==="arrest";
 $("refreshAsystoleBtn").classList.toggle("hidden",!arrest);
 $("nextBtn").textContent = arrest ? "Next" : "Next";
}


requestAnimationFrame(function loop(t){if(state.running&&!state.ecgPaused)drawECG(t);requestAnimationFrame(loop)});
/* ===== STATIC VALIDATION ===== */
const REQUIRED_RHYTHMS=16, REQUIRED_HT=10, REQUIRED_CASES=40;
console.assert(cases.length===REQUIRED_CASES,"40 cases missing");
console.assert(core.length===REQUIRED_RHYTHMS,"16 core rhythms missing");
console.assert(hts.length===REQUIRED_HT,"5 Hs + 5 Ts missing");
console.assert(["av1","mobitz1","mobitz2","complete"].every(k=>core.some(c=>c.kind===k)),"AV block branches missing");
console.assert(["sinus","arrhythmia","af","flutter","psvt","pvc","vt","torsades","vf","av1","mobitz1","mobitz2","complete","asystole"].every(k=>core.some(c=>c.kind===k)),"ECG morphology branch missing");
</script>
