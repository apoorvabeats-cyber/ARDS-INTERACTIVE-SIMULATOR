const OUT=[['g','GFR','mL/min',0],['rpf','Renal plasma flow','mL/min',0],['ffp','Filtration fraction','%',1],['vh','Urine output','mL/h',0],['uo','Urine osmolality','mOsm/kg',0],['uNa','Urine Na⁺','mmol/L',0],['uK','Urine K⁺','mmol/L',0],['uCl','Urine Cl⁻','mmol/L',0],['ph','Urine pH','',2],['ug','Urine glucose','',0],['uB','Urine HCO₃⁻','mmol/L',1],['fena','FENa','%',2],['feu','FEUrea','%',0],['fwc','Free-water clearance','mL/min',2],['Na','Serum Na⁺','mmol/L',1],['Ks','Serum K⁺','mmol/L',2],['Po','Serum osmolality','mOsm/kg',0],['Hs','Serum HCO₃⁻','mmol/L',1],['acc','Urine collected','mL',0],['ex','Na⁺ / K⁺ excreted','mmol',0]];
const RG={g:[90,140],Na:[135,145],Ks:[3.5,5],Hs:[22,28]};
const sl=(o,k,l,mn,mx,st)=>{const v=(o=='S'?S:D)[k];return`<label>${l}<b id="v${o}${k}">${o=='D'?Math.round(v*100)+'%':v}</b><input type="range" data-o="${o}" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`};
const dsl=k=>sl('D',k,DR[k][0]+' <i>'+DR[k][1]+'</i>',0,1,.05);
const DIS=[['Normal','Baseline physiology.',{},{}],
['Acute tubular injury','Tubular cells lose reabsorption and concentrating ability while GFR falls: FENa rises above 2% and urine tends toward isosthenuria (Uosm near 300).',{Kf:.4,PBS:24},{loop:.6,thz:.3}],
['Glomerulonephritis','Inflamed glomerular capillaries: low Kf and GFR, Na⁺ and water retention, hypertension.',{Kf:.35,ald:1.5,MAP:105},{}],
['Nephrotic syndrome','Heavy proteinuria with secondary Na⁺ retention (modelled as reduced Kf and raised aldosterone).',{Kf:.7,ald:1.8},{}],
['Renal artery stenosis','Low post-stenotic pressure drives renin and angiotensin II; GFR depends on efferent constriction. Add an ACE inhibitor and watch GFR fall.',{MAP:65,ang:1.8,ald:1.6},{}],
['Diabetic nephropathy','Early hyperfiltration: high glucose, efferent constriction, falling Kf. Add an SGLT2 inhibitor.',{glu:14,Re:1.4,Kf:.7},{}],
['Tubulointerstitial disease','Tubular damage: salt wasting and a concentrating defect.',{Kf:.8,adh:.4},{loop:.35,thz:.2}],
['Bartter syndrome','Loop (NKCC2/ROMK/ClC-Kb) failure: salt wasting, hypokalaemic alkalosis, hypercalciuria.',{ald:1.5},{loop:.9}],
['Gitelman syndrome','NCC failure: milder salt wasting, hypokalaemia, hypomagnesaemia, low urine calcium.',{ald:1.3},{thz:.85}],
['SIADH','Excess ADH with free-water intake: concentrated urine and falling serum Na⁺.',{adh:3,fl:3},{}],
['Central diabetes insipidus','No ADH: large volumes of dilute urine; serum Na⁺ rises unless intake keeps up.',{adh:0},{}],
['Nephrogenic diabetes insipidus','Kidney ignores ADH (modelled as V2 blockade): dilute polyuria despite high ADH.',{adh:2},{tolv:.95}]];
const disHTML=()=>'<div class="dz">'+DIS.map((d,i)=>`<button data-i="${i}"${i==dis?' class="on"':''}>${d[0]}</button>`).join('')+`</div><p><b>${DIS[dis][0]}.</b> ${DIS[dis][1]}</p><p style="color:var(--mu);font-size:11px">Presets load into the same engine. Watch the Output tab, then add drugs on top.</p>`;
function applyDis(i){dis=i;S={...S0,...DIS[i][2]};D={...D0,...DIS[i][3]};B=newB();H1=[];H2=[];render()}
const ar=(m,x1,y1,x2,y2,c)=>`<line class="a" data-m="${m}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}"/>`,tx=(x,y,t,b)=>`<text x="${x}" y="${y}" font-size="8" ${b?'font-weight="600" ':''}fill="var(--fg)" text-anchor="middle">${t}</text>`;
const CELL='<svg id="cellsv" viewBox="0 0 340 200" style="width:100%;border:1px solid var(--bd);border-radius:8px"><rect width="340" height="30" fill="#8fd0ff" opacity=".25"/><rect y="138" width="340" height="62" fill="#c23b3b" opacity=".18"/>'+[[8,170],[184,72],[262,72]].map(([x,w])=>`<rect x="${x}" y="34" width="${w}" height="100" rx="6" fill="var(--cd)" stroke="var(--mu)"/>`).join('')+tx(170,12,'Tubular lumen')+tx(170,192,'Peritubular blood')+tx(93,46,'Principal cell',1)+tx(220,46,'α-intercalated',1)+tx(298,46,'β-intercalated',1)+ar('enac',40,20,40,72,'#d4a017')+ar('k',90,72,90,20,'#9b5de5')+ar('w',140,20,140,72,'#3a8dde')+ar('pump',50,112,50,150,'#d4a017')+ar('w',140,112,140,150,'#3a8dde')+ar('h',208,72,208,20,'#e05a47')+ar('h',220,112,220,150,'#e8873a')+ar('bb',298,72,298,20,'#e8873a')+ar('bb',298,112,298,150,'#e05a47')+tx(40,84,'ENaC')+tx(90,84,'ROMK/BK')+tx(140,84,'AQP2')+tx(50,106,'Na⁺/K⁺-ATPase')+tx(140,106,'AQP3/4')+tx(208,84,'H⁺-ATPase')+tx(220,106,'AE1 HCO₃⁻')+tx(298,84,'Pendrin')+tx(298,106,'H⁺-ATPase')+'</svg><p style="font-size:11px;color:var(--mu)">Arrow weight and speed show live activity (normal = 1). Yellow Na⁺, violet K⁺, blue water, red H⁺, orange HCO₃⁻.<br><span id="cellro"></span></p>';
function render(){let h='';
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t==tab));
if(tab==1)h='<div class="gr">'+OUT.map(o=>`<div id="d_${o[0]}">${o[1]}<b>–</b>${o[2]}</div>`).join('')+'</div><canvas id="sk2" width="360" height="70" style="width:100%;height:70px"></canvas><p style="color:var(--mu);font-size:11px">Blue: GFR. Green: urine output. 1 s ≈ '+SPD+' min of simulated time; body Na⁺, K⁺, water and HCO₃⁻ shift as balance changes.</p>';
else if(tab==3)h=disHTML();else if(tab==2)h='<h3>Combine drugs</h3>'+Object.keys(DR).map(dsl).join('')+'<h3>Hormones and intake</h3>'+sl('S','adh','ADH / V2 (above 1 = desmopressin)',0,3,.05)+sl('S','ald','Aldosterone (× normal)',0,3,.05)+sl('S','ang','Angiotensin II (× normal)',0,2.5,.05)+sl('S','fl','Fluid intake (L/day)',0,6,.1);
else if(sel=='kid'){const q=KN[kp];h=`<h3>${q?q[0]:'External and internal kidney'}</h3><p>${q?q[1]:'Tap a structure. Drag to rotate. Cut-away exposes pyramids and pelvis.'}</p><button id="cutb">${cut?'Hide':'Show'} cut-away</button> <button id="ent">Enter nephron</button>`}
else{const q=SEG[sel];h=`<h3>${q.n}</h3><p><b>Anatomy.</b> ${q.an}</p>`+(q.tr.length?'<table>'+q.tr.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</table>':'')+`<p><b>Electrolytes.</b> ${q.el}</p><p><b>Pharmacology.</b> ${q.ph}</p>`;
if(sel=='glo')h+='<div class="bx" id="sk"></div>'+sl('S','Ra','Afferent resistance (×)',.4,3,.05)+sl('S','Re','Efferent resistance (×)',.4,3,.05)+sl('S','PBS','Bowman’s space pressure (mmHg)',10,40,1)+sl('S','Kf','Filtration coefficient Kf (×)',.2,1.3,.05)+sl('S','MAP','Mean arterial pressure (mmHg)',50,140,1)+sl('S','ang','Angiotensin II (×)',0,2.5,.05);
if(sel=='pct')h+=sl('S','glu','Plasma glucose (mmol/L)',3,30,.5);
if(sel=='cd')h+=CELL+sl('S','adh','ADH / V2 (above 1 = desmopressin)',0,3,.05)+sl('S','ald','Aldosterone (×)',0,3,.05)+sl('S','fl','Fluid intake (L/day)',0,6,.1);
h+=q.dr.map(dsl).join('')}
$('#c').innerHTML=h}
let H1=[],H2=[];
function upd(){const o=O,v={...o,ffp:o.ff*100,vh:o.V*60,ug:o.uG<1?'neg':o.uG.toFixed(0)+' mmol/L',acc:B.acc,ex:B.ua.toFixed(0)+' / '+B.uk.toFixed(0)};
OUT.forEach(([k,,,d])=>{const e=$('#d_'+k);if(!e)return;const x=v[k];e.firstElementChild.textContent=typeof x=='number'?x.toFixed(d):x;const r=RG[k];e.className=r&&(x<r[0]||x>r[1])?'w':''});
$('#hud').innerHTML=`GFR ${o.g.toFixed(0)} mL/min · urine ${(o.V*60).toFixed(0)} mL/h<br>Uosm ${o.uo.toFixed(0)} · pH ${o.ph.toFixed(1)} · Na ${o.Na.toFixed(0)} K ${o.Ks.toFixed(1)}`;
$('#tf').style.height=B.acc/5+'%';const q=cl((o.uo-50)/950,0,1),c=(a,b)=>Math.round(a+(b-a)*q);$('#tf').style.background=`rgb(${c(244,196)},${c(241,130)},${c(197,0)})`;
const sk=$('#sk');if(sk)sk.innerHTML=`NFP = P<sub>GC</sub> − P<sub>BS</sub> − π<sub>GC</sub> + π<sub>BS</sub><br><b>${o.pgc.toFixed(0)} − ${S.PBS} − ${o.pi.toFixed(0)} + 0 = ${o.nfp.toFixed(1)} mmHg</b><br>GFR = K<sub>f</sub> × NFP = ${o.g.toFixed(0)} mL/min · RPF ${o.rpf.toFixed(0)} · FF ${(o.ff*100).toFixed(0)}%<br>Afferent R ${o.Ra.toFixed(2)} · efferent R ${o.Re.toFixed(2)} (× normal, includes feedback)`;
const cs=$('#cellsv');if(cs){const A={enac:cl((.4+.6*o.act)*(1-.85*D.amil),0,2),k:cl(o.kF/.125,0,3),w:o.pm/.9615,h:cl(o.nae/.049,0,3),bb:cl(.3+o.bic*8,0,2.5)};A.pump=A.enac;cs.querySelectorAll('.a').forEach(e=>{const v=A[e.dataset.m];e.style.opacity=.12+.88*Math.min(1,v);e.style.strokeWidth=.5+2*v;e.style.animationDuration=1.2/Math.max(.15,v)+'s'});$('#cellro').textContent=`ENaC ×${A.enac.toFixed(2)} · K⁺ secretion ×${A.k.toFixed(2)} · AQP2 ×${A.w.toFixed(2)} · α-IC H⁺ ×${A.h.toFixed(2)} · pendrin ×${A.bb.toFixed(2)}`}
H1.push(o.g);H2.push(o.V*60);if(H1.length>120){H1.shift();H2.shift()}
const c2=$('#sk2');if(c2){const x=c2.getContext('2d');x.clearRect(0,0,360,70);[[H1,200,'#3aa0ff'],[H2,1500,'#3ecf8e']].forEach(([h,m,col])=>{x.strokeStyle=col;x.beginPath();h.forEach((y,i)=>{const py=68-cl(y/m,0,1)*66;i?x.lineTo(i*3,py):x.moveTo(0,py)});x.stroke()})}}
/* ---------- interaction ---------- */
function go(id){sel=id;tab=0;tl.set(...FOC[id][0]);tp.set(...FOC[id][1]);document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.g==id));hl();render()}
$('#nv').innerHTML=NV.map(([k,l])=>`<button data-g="${k}">${l}</button>`).join('');
$('#nv').onclick=e=>{if(e.target.dataset.g)go(e.target.dataset.g)};
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=+e.target.dataset.t;render()}};
$('#c').onclick=e=>{if(e.target.id=='cutb'){cut=!cut;hl();render()}if(e.target.id=='ent')go('all');const i=e.target.dataset.i;if(i!==undefined)applyDis(+i)};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;(t.dataset.o=='S'?S:D)[k]=+t.value;const b=$('#v'+t.dataset.o+k);if(b)b.textContent=t.dataset.o=='D'?Math.round(t.value*100)+'%':t.value});
$('#rs').onclick=()=>{dis=0;S={...S0};D={...D0};B=newB();H1=[];H2=[];render()};
$('#sp').onclick=e=>{SPD=SPD==1?2:SPD==2?5:SPD==5?20:1;e.target.textContent='×'+SPD;if(tab==1)render()};
const rc=new T.Raycaster(),pt=new T.Vector2();
function pick(e){const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(pt,cam);
const hs=rc.intersectObjects(sel=='kid'?ks:nm).filter(h=>!(sel=='kid'&&cut&&h.point.z>0&&/capsule|cortex/.test(h.object.userData.id))),h=hs.find(h=>h.object.userData.id!='capsule')||hs[0];
if(!h)return;const id=h.object.userData.id;if(sel=='kid'){kp=id;tab=0;hl();render()}else go(id)}
cv.onpointerdown=e=>{dr=[e.clientX,e.clientY,0]};
cv.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr[0];dr[2]+=Math.abs(dx)+Math.abs(e.clientY-dr[1]);if(sel=='kid')K.rotation.y+=dx*.012;dr[0]=e.clientX;dr[1]=e.clientY};
cv.onpointerup=e=>{if(dr&&dr[2]<6)pick(e);dr=0};
/* ---------- main loop ---------- */
let last=performance.now(),lu=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
O=calc();step(O,dt*SPD);cam.position.lerp(tp,.05);look.lerp(tl,.06);cam.lookAt(look);
if(sel=='kid'&&!dr)K.rotation.y+=dt*.25;anim(dt,O);R.render(sc,cam);if(t-lu>250){lu=t;upd()}}
O=calc();go('all');requestAnimationFrame(loop);
</script></body></html>
