<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Myocardial dysfunction in sepsis: 3D lab</title>
<style>
:root{--bg:#eef3f8;--ink:#0c1b2e;--mute:#546579;--panel:#fff;--line:#b9c8d8;--acc:#0a7f8f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;--bad:#ef5b52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;--bad:#ef5b52;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{margin:0 0 10px;font-size:24px}
#cv{position:relative;height:56vh;min-height:320px;border-radius:14px;overflow:hidden;background:#06111f;touch-action:none}
canvas{display:block;width:100%;height:100%}
#lbl{position:absolute;left:12px;right:12px;bottom:10px;color:#e6f1fb;font-size:13px;line-height:1.35;text-shadow:0 1px 4px #000;pointer-events:none}
#lbl b{display:block;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
label{display:block;margin:12px 0 2px;color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.panel ul{margin:4px 0 0;padding-left:18px}.warn{color:var(--bad);font-weight:600}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
</style></head><body><main>
<h1>Myocardial dysfunction in sepsis: 3D lab</h1>
<div id="cv"><div id="lbl"></div></div>
<div class="row" id="stages"></div>
<div class="row" id="dz"></div>
<label for="sev">Sepsis severity: <span id="v0"></span></label><input id="sev" type="range" min="0" max="100" value="55">
<div class="row" id="rx"></div>
<div class="panel" id="out"></div>
<div class="panel"><canvas id="sp" width="480" height="90" style="width:100%;height:90px" role="img" aria-label="Key outputs over simulated hours"></canvas><div class="hint" style="margin:2px 0 0"><span id="leg"></span> Hour <span id="hr">0</span>.</div></div>
<div class="panel" id="info">Tap any part of the 3D scene to inspect it.</div>
<p class="hint">Drag to orbit. Scroll or pinch to zoom. Stage buttons fly you in. Presets replay the disease over simulated hours.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const $=s=>document.querySelector(s),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!window.THREE){$('#lbl').innerHTML='<b>3D engine could not load</b>Check your connection and reload.'}else{
const V=(x,y,z)=>new THREE.Vector3(x,y,z),PI=Math.PI,rnd=Math.random;
const cv=$('#cv'),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x06111f);cv.prepend(R.domElement);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.01,400);S.add(new THREE.AmbientLight(0x8899bb,.9));cam.add(new THREE.PointLight(0xffffff,1.3,0));S.add(cam);
const M=(c,o=.8,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,transparent:true,opacity:o,roughness:.45},x));
const add=(m,p,par=S)=>{if(p)m.position.copy(p);par.add(m);return m};
const CR=a=>new THREE.CatmullRomCurve3(a),tube=(c,r,mt)=>new THREE.Mesh(new THREE.TubeGeometry(c,60,r,12,false),mt);
const dirv=()=>V(rnd()-.5,rnd()-.5,rnd()-.5).normalize();
const mkp=(par,n,c,s)=>{const a=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:c,size:s}));p.frustumCulled=false;par.add(p);return{a,g}};
let sev=.55,rx={},m={};

const BG='none',LEG='Teal: ejection fraction. Amber: cardiac output.';
const lvO=add(new THREE.Mesh(new THREE.SphereGeometry(1,32,24),M(0xc0392b,.4,{side:THREE.DoubleSide})),V(0,0,0)),lvI=add(new THREE.Mesh(new THREE.SphereGeometry(1,28,20),M(0xe0405a,.5)),V(0,0,0));
add(new THREE.Mesh(new THREE.SphereGeometry(1.3,20,14),M(0xe0405a,.35)),V(-2.8,4,0));
add(tube(CR([V(.8,2.6,0),V(1.6,5.5,0),V(3,8,0),V(5,9,0)]),.7,M(0xe0405a,.4)));
const P=CR([V(-2.8,4,0),V(-1.4,2,0),V(0,0,0),V(.8,2.4,0),V(1.6,5.5,0),V(3,8,0),V(5,9,0)]),PL=P.getLength(),N=160,bt=[];for(let i=0;i<N;i++)bt.push(rnd());
const bl=mkp(S,N,0xff6a7a,.2);
const CG=V(12,0,0),cg=new THREE.Group();cg.position.copy(CG);cg.scale.setScalar(.12);S.add(cg);
const cell=add(new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,7,24),M(0xe0405a,.28)),null,cg);cell.rotation.z=PI/2;
const zd=[...Array(13)].map((_,i)=>add(new THREE.Mesh(new THREE.BoxGeometry(.06,2.1,2.1),M(0xf0c040,.8)),V((i-6)*.5,0,0),cg));
const mi=[...Array(12)].map((_,i)=>add(new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),M(0xf0a030,.95)),V(-3+(i%6)*1.2+.3,i<6?.55:-.55,(rnd()-.5)*.8),cg));
const rc=[...Array(14)].map((_,i)=>{const a=i*2.4;return add(new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),M(0x4aa8ff,1)),V(-2.8+(i%7)*.9,1.25*Math.cos(a),1.25*Math.sin(a)),cg)});
const NC=40,NK=36,cy=mkp(cg,NC,0xffe060,.03),ca=mkp(cg,NK,0x9be8ff,.03),cx=[],cd=[],kb=[];
for(let i=0;i<NC;i++){cx.push((rnd()-.5)*6);const d=dirv();cd.push([d.y,d.z,rnd()])}
for(let i=0;i<NK;i++)kb.push([(rnd()-.5)*6,(rnd()-.5)*1.4,(rnd()-.5)*1.4]);
const ST=[['Heart',V(2,3,0),20,null,null,'Left ventricle, atrium and aorta. Output falls as the ventricle dilates and ejects less.'],
['Ventricle',V(0,1,0),7.5,null,null,'The wall thins and the chamber dilates. Blood still flows, but each beat ejects less.'],
['Cardiomyocyte',CG,1.5,0,0,'Sarcomeres shorten weakly. Receptors fall, mitochondria swell and cytokines attack the cell.']];
const RX=[['dobu','Dobutamine','raises contractility, adds tachycardia'],['levo','Levosimendan','calcium sensitiser, limited evidence'],['nor','Noradrenaline','supports coronary perfusion pressure'],['bb','Esmolol','selected tachycardia only; lowers contractility'],['epi','High-dose adrenaline','arrhythmia and raised lactate (harms)']];
const DZ=[['Early sepsis',.25,[],'Mild depression; output preserved.'],['Septic cardiomyopathy',.7,[],'Dilated, hypocontractile ventricle.'],['Dobutamine',.7,['dobu'],'Raises output; watch the heart rate.'],['Levosimendan',.7,['levo'],'Sensitises myofilaments to calcium.'],['Esmolol trial',.6,['bb'],'Slows the rate but lowers contractility.'],['Adrenaline excess',.6,['epi'],'Arrhythmia and lactate rise.']];
const INFO={lv:['Left ventricle','Dilates and ejects less in septic cardiomyopathy. EF often recovers within 7 to 10 days.','Dobutamine or levosimendan only for persistent low output.'],wall:['Myocardial wall','Thins as the chamber dilates and wall stress rises. Troponin leaks from injured myocytes.','Noradrenaline supports coronary perfusion pressure.'],sarc:['Sarcomere','Z-discs approach as filaments slide. Calcium sensitivity falls under cytokines.','Levosimendan sensitises troponin C to calcium.'],mito:['Mitochondria','Swell and lose output, so the cell lacks ATP for contraction.','No approved mitochondrial therapy; restore perfusion.'],rec:['Beta-1 receptors','Downregulated and uncoupled by TNF, IL-1 and NO, so catecholamines work less.','Dobutamine may need higher doses; excess adds arrhythmia.'],cell:['Cardiomyocyte','Cytokines and NO depress contractility without cell death, which is why recovery is possible.','Treat sepsis; avoid fluid overload and negative inotropes.']};
const KEY=()=>[[m.EF,70,'#2ad4c0'],[m.CO,8,'#f0a030']];
const TAG=()=>{lvO.userData.k='wall';lvI.userData.k='lv';zd.forEach(z=>z.userData.k='sarc');mi.forEach(x=>x.userData.k='mito');rc.forEach(x=>x.userData.k='rec');cell.userData.k='cell'};
function model(){const s=sev,con=clamp(1-.55*s+(rx.dobu?.3:0)+(rx.levo?.15:0)-(rx.bb?.15:0)+(rx.epi?.2:0)+(rx.nor?.04:0),.1,1.3),
 HR=Math.round(70+45*s+(rx.dobu?15:0)-(rx.bb?25:0)+(rx.epi?15:0)),EDV=120+60*s,EF=clamp(62*con,12,75),CO=EDV*EF/100*HR/1000,lac=1+Math.max(0,4-CO)*1.2+(rx.epi?1.5:0);
 Object.assign(m,{con,HR,EDV,EF,CO});const on=RX.filter(d=>rx[d[0]]);
 $('#out').innerHTML=`<span class="${EF<40?'warn':''}">EF ${Math.round(EF)}%</span>, HR ${HR}, EDV ${Math.round(EDV)} ml, <span class="${CO<4?'warn':''}">CO ${CO.toFixed(1)} L/min</span>, troponin ×${(1+14*s).toFixed(0)}, lactate ${lac.toFixed(1)}`+(HR>130?'<br><span class="warn">Tachycardia shortens filling time</span>':'')+(rx.epi?'<br><span class="warn">High-dose adrenaline: arrhythmia and raised lactate</span>':'')+(on.length?'<ul>'+on.map(d=>`<li>${d[1]}: ${d[2]}</li>`).join('')+'</ul>':'');
 mi.forEach(x=>{x.scale.setScalar(1+1.2*s);x.material.opacity=.95-.6*s});rc.forEach((x,i)=>x.visible=i<Math.round(14*(1-.7*s)))}
let bph=0;
function frame(dt){if(!calm)bph+=dt*m.HR/60*PI*2*.4;const sy=.5+.5*Math.sin(bph),dil=1+.25*sev,wt=.85-.3*sev,c=1-.16*(m.EF/62)*sy,a=3.2*dil,b=4.2*dil;
 lvO.scale.set(a*c,b*c,a*c);lvI.scale.set((a-wt)*c,(b-wt)*c,(a-wt)*c);
 for(let i=0;i<N;i++){if(!calm)bt[i]=(bt[i]+dt*(1+m.CO*.5)*3/PL)%1;const p=P.getPointAt(bt[i]);bl.a[i*3]=p.x;bl.a[i*3+1]=p.y;bl.a[i*3+2]=p.z}bl.g.attributes.position.needsUpdate=true;
 zd.forEach((z,i)=>z.position.x=(i-6)*.5*(1-.2*clamp(m.con,0,1.3)*sy));
 const nc=Math.round(NC*sev);for(let i=0;i<NC;i++){if(i>=nc){cy.a[i*3+1]=-1e4;continue}const t=((bph*.15+cd[i][2])%1),r=2.8-1.7*t;cy.a[i*3]=cx[i];cy.a[i*3+1]=cd[i][0]*r*2;cy.a[i*3+2]=cd[i][1]*r*2}cy.g.attributes.position.needsUpdate=true;
 const f=.4+.6*sy*clamp(m.con,0,1);for(let i=0;i<NK;i++){ca.a[i*3]=kb[i][0];ca.a[i*3+1]=kb[i][1]*f;ca.a[i*3+2]=kb[i][2]*f}ca.g.attributes.position.needsUpdate=true}

const goal={t:ST[0][1].clone(),r:ST[0][2],y:null,p:null};let yaw=.5,pit=.15,rad=ST[0][2],tgt=ST[0][1].clone(),stage=0;
function go(i){stage=i;const s=ST[i];goal.t.copy(s[1]);goal.r=s[2];goal.y=s[3];goal.p=s[4];$('#lbl').innerHTML=`<b>${s[0]}</b>${s[5]}`;
 document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===i))}
function refresh(){model();$('#v0').textContent=Math.round(sev*100)+'%';document.querySelectorAll('[data-rx]').forEach(b=>b.setAttribute('aria-pressed',!!rx[b.dataset.rx]))}
$('#stages').innerHTML=ST.map((s,i)=>`<button data-s="${i}">${s[0]}</button>`).join('')+'<button data-next="1">Next stage</button>';
$('#rx').innerHTML=RX.map(d=>`<button data-rx="${d[0]}" aria-pressed="false">${d[1]}</button>`).join('');
$('#stages').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)go(b.dataset.next?(stage+1)%ST.length:+b.dataset.s)});
$('#rx').addEventListener('click',ev=>{const b=ev.target.closest('[data-rx]');if(b){rx[b.dataset.rx]=!rx[b.dataset.rx];refresh()}});
$('#sev').addEventListener('input',ev=>{sev=ev.target.value/100;refresh()});
const ptr=new Map(),zoomBy=f=>{goal.r=clamp(goal.r*f,.3,110)};
cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);ptr.set(ev.pointerId,[ev.clientX,ev.clientY])});
cv.addEventListener('pointermove',ev=>{const o=ptr.get(ev.pointerId);if(!o)return;
 if(ptr.size===1){goal.y=goal.p=null;yaw-=(ev.clientX-o[0])*.008;pit=clamp(pit+(ev.clientY-o[1])*.008,-1.3,1.3)}
 else if(ptr.size===2){const q=[...ptr.entries()].find(([id])=>id!==ev.pointerId)[1];zoomBy(Math.hypot(o[0]-q[0],o[1]-q[1])/Math.hypot(ev.clientX-q[0],ev.clientY-q[1]))}
 ptr.set(ev.pointerId,[ev.clientX,ev.clientY])});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,ev=>ptr.delete(ev.pointerId)));
cv.addEventListener('wheel',ev=>{ev.preventDefault();zoomBy(1+ev.deltaY*.001)},{passive:false});
function fit(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(cv);fit();

const LAB={go:refresh,tg:rx,bg:BG,leg:LEG,key:KEY,tag:TAG,dz:DZ,info:INFO};
let tsev=sev,ramp=false,hr=0,hist=[],lh=0;const ray=new THREE.Raycaster(),dn=[0,0,0];
$('#leg').textContent=LAB.leg;
function spark(){const c=$('#sp'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);g.strokeStyle='#8886';g.beginPath();g.moveTo(0,h-1);g.lineTo(w,h-1);g.stroke();
 [0,1].forEach(s=>{g.lineWidth=2;g.beginPath();hist.forEach((p,j)=>{g.strokeStyle=p[s][2];const x=j/79*w,y=h-4-(h-8)*clamp(p[s][0]/p[s][1]);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()})}
function step(dt){if(ramp&&Math.abs(sev-tsev)>.003){sev+=(tsev-sev)*(1-Math.exp(-dt*.5));$('#sev').value=Math.round(sev*100);LAB.go()}
 if(!calm)hr+=dt*3;lh+=dt;if(lh>.5){lh=0;hist.push(LAB.key());if(hist.length>80)hist.shift();spark();$('#hr').textContent=Math.floor(hr)}}
$('#dz').innerHTML=LAB.dz.map((d,i)=>`<button data-i="${i}" aria-pressed="false">${d[0]}</button>`).join('');
$('#dz').addEventListener('click',ev=>{const b=ev.target.closest('[data-i]');if(!b)return;const d=LAB.dz[+b.dataset.i];
 Object.keys(LAB.tg).forEach(x=>delete LAB.tg[x]);d[2].forEach(x=>LAB.tg[x]=true);tsev=d[1];sev=calm?tsev:0;ramp=!calm;hr=0;hist.length=0;
 $('#sev').value=Math.round(sev*100);LAB.go();
 document.querySelectorAll('#dz button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#info').innerHTML=`<strong>${d[0]}</strong><br>${d[3]}`});
$('#sev').addEventListener('input',()=>{ramp=false});
cv.addEventListener('pointerdown',ev=>{dn[0]=ev.clientX;dn[1]=ev.clientY;dn[2]=1});
cv.addEventListener('pointerup',ev=>{if(!dn[2]||Math.hypot(ev.clientX-dn[0],ev.clientY-dn[1])>6)return;dn[2]=0;LAB.tag();const r=cv.getBoundingClientRect();
 ray.setFromCamera({x:(ev.clientX-r.left)/r.width*2-1,y:-(ev.clientY-r.top)/r.height*2+1},cam);
 const hs=ray.intersectObjects(S.children,true).filter(h=>h.object.isMesh&&h.object.visible&&h.object.userData.k),h=hs.find(x=>x.object.userData.k!==LAB.bg)||hs[0];
 const i=h&&LAB.info[h.object.userData.k];if(!i)return;$('#info').innerHTML=`<strong>${i[0]}</strong><br>${i[1]}<br><em>Drugs and care:</em> ${i[2]}`});

const VOD={lv:["Organ level", "Chamber level", "Cell level"],ph:["Early sepsis. At organ level the heart beats faster and output is preserved. At cellular level, cytokines begin to dampen how strongly the muscle cells respond to calcium.", "Mild septic cardiomyopathy. At organ level, the ventricle ejects a little less with each beat. At cellular level, beta receptors are down regulated, so adrenaline has less effect.", "Moderate dysfunction. At organ level, the ventricle dilates and the ejection fraction falls. At cellular level, mitochondria swell and the sarcomeres shorten weakly.", "Severe dysfunction. At organ level, cardiac output is low and troponin rises. At cellular level, the muscle cells are energy starved, yet stunned rather than dead, so recovery is possible."]};
const VOq=(t,q)=>{if(parent!==window)parent.postMessage({vo:t,q:!!q},'*')};
const phase=()=>sev<.25?0:sev<.5?1:sev<.75?2:3;let lastPh=phase(),vt_=0;
const plain=h=>h.replace(/<br>/g,'. ').replace(/<[^>]+>/g,'');
$('#stages').addEventListener('click',()=>VOq(VOD.lv[stage]+'. '+ST[stage][0]+'. '+(ST[stage][5]||ST[stage][3])));
document.querySelector('#rx,#drugs').addEventListener('click',ev=>{const b=ev.target.closest('[data-rx],[data-dg]');if(!b)return;const k=b.dataset.rx||b.dataset.dg,L=(typeof RX!=='undefined'?RX:DG).find(d=>d[0]===k);if(!L)return;
 const w=[...$('#out').querySelectorAll('.warn')].map(e=>e.textContent).join('. ');VOq(L[1]+(LAB.tg[k]?' switched on. ':' switched off. ')+(L[3]||L[2])+'. '+w)});
new MutationObserver(()=>VOq(plain($('#info').innerHTML))).observe($('#info'),{childList:true});
$('#sev').addEventListener('input',()=>{clearTimeout(vt_);vt_=setTimeout(()=>{lastPh=phase();VOq(VOD.ph[lastPh])},700)});
$('#dz').addEventListener('click',()=>{lastPh=-1;if(!ramp){lastPh=phase();VOq(VOD.ph[lastPh],true)}});
setInterval(()=>{if(!ramp)return;const p=phase();if(p!==lastPh){lastPh=p;VOq(VOD.ph[p],true)}},400);
const clock=new THREE.Clock();
function tick(){const dt=Math.min(clock.getDelta(),.05);step(dt);const k=calm?1:1-Math.exp(-dt*3);
 tgt.lerp(goal.t,k);rad+=(goal.r-rad)*k;if(goal.y!==null){yaw+=(goal.y-yaw)*k;pit+=(goal.p-pit)*k}
 cam.position.set(tgt.x+rad*Math.sin(yaw)*Math.cos(pit),tgt.y+rad*Math.sin(pit),tgt.z+rad*Math.cos(yaw)*Math.cos(pit));cam.lookAt(tgt);
 frame(dt);R.render(S,cam);requestAnimationFrame(tick)}
refresh();go(0);tick();
}
</script></body></html>
