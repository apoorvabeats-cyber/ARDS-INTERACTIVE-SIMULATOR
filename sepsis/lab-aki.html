<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKI in sepsis: 3D nephron lab</title>
<style>
:root{--bg:#eef3f8;--ink:#0c1b2e;--mute:#546579;--panel:#fff;--line:#b9c8d8;--acc:#0a7f8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{margin:0 0 10px;font-size:24px}
#cv{position:relative;height:58vh;min-height:320px;border-radius:14px;overflow:hidden;background:#06111f;touch-action:none}
canvas{display:block;width:100%;height:100%}
#lbl{position:absolute;left:12px;right:12px;bottom:10px;color:#e6f1fb;font-size:13px;line-height:1.35;text-shadow:0 1px 4px #000;pointer-events:none}
#lbl b{display:block;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
label{display:block;margin:14px 0 2px;color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.panel ul{margin:4px 0 0;padding-left:18px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
</style></head><body><main>
<h1>AKI in sepsis: 3D nephron lab</h1>
<div id="cv"><div id="lbl"></div></div>
<div class="row" id="stages"></div>
<label for="sev">Sepsis severity</label>
<input id="sev" type="range" min="0" max="100" value="45">
<div class="row" id="drugs"></div>
<div class="row" id="dz"></div><div class="panel" id="out"></div><div class="panel"><canvas id="sp" width="480" height="90" style="width:100%;height:90px" role="img" aria-label="Key outputs over simulated hours"></canvas><div class="hint" style="margin:2px 0 0"><span id="leg"></span> Hour <span id="hr">0</span>.</div></div><div class="panel" id="info">Tap any part of the 3D scene to inspect it.</div>
<p class="hint">Drag to orbit. Scroll or pinch to zoom. Use the stage buttons to fly in.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!window.THREE){$('#lbl').innerHTML='<b>3D engine could not load</b>Check your connection and reload.'}else{
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const SEG=[
{n:'Proximal tubule',w:1,r:.24,c:new THREE.CatmullRomCurve3([V(-3,1.9,0),V(-3.5,.9,.4),V(-2.5,0,-.4),V(-3.3,-.8,.4),V(-2.4,-1.6,0),V(-1.5,-2,0)])},
{n:'Loop of Henle',w:.7,r:.2,c:new THREE.CatmullRomCurve3([V(-1.5,-2,0),V(-1.2,-5,0),V(-.2,-6.6,0),V(.8,-5,0),V(1,-2,0)])},
{n:'Distal tubule',w:.5,r:.22,c:new THREE.CatmullRomCurve3([V(1,-2,0),V(2,-1,.4),V(3,.5,0),V(3.6,1.8,0)])},
{n:'Collecting duct',w:.4,r:.32,c:new THREE.CatmullRomCurve3([V(3.6,1.8,0),V(4.1,0,0),V(4,-4,0),V(4,-8,0)])},
{n:'Urine',w:0,c:new THREE.LineCurve3(V(4,-8,0),V(4,-10,0))}];
SEG.forEach(g=>g.len=g.c.getLength());
const ST=[
['Kidney',V(0,-2,0),85,'About a million nephrons filter blood. Zoom in to follow filtrate through one.'],
['Nephron',V(0,-2,0),17,'One nephron: glomerulus, proximal tubule, loop, distal tubule, collecting duct.'],
['Glomerulus',V(-3,3,0),4.2,'Filtration falls when afferent flow drops in septic shock.'],
['Proximal tubule',V(-2.8,0,0),4.8,'Swollen mitochondria and casts appear first here.'],
['Loop of Henle',V(-.3,-4.5,0),8,'The medullary thick limb runs on the edge of hypoxia.'],
['Distal and collecting',V(3.5,-2,0),9,'Casts block flow and urine concentration fails.'],
['Urine',V(4,-9,0),4,'Output falls as injury and obstruction rise.']];
const DG=[['nor','Noradrenaline',-.15,'restores renal perfusion pressure'],['bal','Balanced crystalloid',-.08,'fewer kidney events than saline'],['nsaid','NSAID',.2,'constricts the afferent arteriole'],['nephro','Vancomycin + pip-tazo',.15,'injures proximal tubule cells']];
let sev=.45,dg={},stage=0;

const cv=$('#cv'),R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x06111f);cv.prepend(R.domElement);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.05,500);
S.add(new THREE.AmbientLight(0x8899bb,.9));cam.add(new THREE.PointLight(0xffffff,1.3,0));S.add(cam);
const M=(c,o=.8)=>new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:o,roughness:.4});
const kid=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),new THREE.MeshStandardMaterial({color:0xb5483f,transparent:true,opacity:.35,side:THREE.DoubleSide,roughness:.6}));
kid.scale.set(30,42,22);kid.position.set(0,-2,0);S.add(kid);
const ure=new THREE.Mesh(new THREE.CylinderGeometry(2,2,34,16),M(0xb5483f,.35));ure.position.set(0,-60,0);S.add(ure);
SEG.forEach(g=>{if(g.r){g.m=new THREE.Mesh(new THREE.TubeGeometry(g.c,90,g.r,12,false),M(0x2ad4c0,.7));S.add(g.m)}});
const gl=new THREE.Group();gl.position.set(-3,3,0);
const gs=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),M(0x2ad4c0,.22)),gk=new THREE.Mesh(new THREE.TorusKnotGeometry(.45,.12,80,8),M(0xe0405a,.9));
gl.add(gs,gk);S.add(gl);
const mito=[],casts=[],CP=[[0,.2],[0,.5],[0,.8],[3,.3],[3,.5],[3,.7],[3,.9],[1,.5],[2,.5],[0,.95]];
for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),M(0xf0c040,.95));const p=SEG[0].c.getPointAt((i+.5)/14);m.position.copy(p).add(V(.1,.08,0));S.add(m);mito.push(m)}
CP.forEach(([s,t])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),M(0x8a7a6a,1));m.position.copy(SEG[s].c.getPointAt(t));S.add(m);casts.push(m)});
const N=260,pos=new Float32Array(N*3),sg=[],tt=[];
for(let i=0;i<N;i++){sg.push(Math.floor(Math.random()*5));tt.push(Math.random())}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x7fd6ff,size:.17}));pts.frustumCulled=false;S.add(pts);

const eff=()=>clamp(sev+DG.reduce((a,d)=>a+(dg[d[0]]?d[2]:0),0));
let e=eff(),nAct=N;
function col(w){return new THREE.Color().setHSL((175-175*clamp(e*w))/360,.85,.5)}
function update(){
 e=eff();nAct=Math.round(N*(1-.85*e));
 SEG.forEach(g=>{if(g.m){const c=col(g.w);g.m.material.color.copy(c);g.m.material.emissive.copy(c).multiplyScalar(.25)}});
 const gc=col(.8);gs.material.color.copy(gc);
 mito.forEach(m=>{m.scale.setScalar(1+1.6*e);m.material.opacity=.95-.55*e});
 casts.forEach((m,i)=>{m.visible=i<Math.round(10*e)});
 const gfr=Math.round(100*(1-.85*e)),on=DG.filter(d=>dg[d[0]]);
 $('#out').innerHTML=`GFR about ${gfr} ml/min, urine ${(1-.9*e).toFixed(1)} ml/kg/h, creatinine ×${(1/(1-.85*e)).toFixed(1)}`+(on.length?'<ul>'+on.map(d=>`<li>${d[1]}: ${d[3]}</li>`).join('')+'</ul>':'');
 document.querySelectorAll('[data-dg]').forEach(b=>b.setAttribute('aria-pressed',!!dg[b.dataset.dg]));
}
let yaw=.5,pit=.15,rad=85,tgt=V(0,-2,0);const goal={t:V(0,-2,0),r:85};
function go(i){stage=i;goal.t.copy(ST[i][1]);goal.r=ST[i][2];$('#lbl').innerHTML=`<b>${ST[i][0]}</b>${ST[i][3]}`;
 document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===i))}
$('#stages').innerHTML=ST.map((s,i)=>`<button data-s="${i}">${s[0]}</button>`).join('')+'<button data-next="1">Next stage</button>';
$('#drugs').innerHTML=DG.map(d=>`<button data-dg="${d[0]}" aria-pressed="false">${d[1]}</button>`).join('');
$('#stages').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;go(b.dataset.next?(stage+1)%ST.length:+b.dataset.s)});
$('#drugs').addEventListener('click',ev=>{const b=ev.target.closest('[data-dg]');if(!b)return;dg[b.dataset.dg]=!dg[b.dataset.dg];update()});
$('#sev').addEventListener('input',ev=>{sev=ev.target.value/100;update()});

const ptr=new Map(),zoomBy=f=>{goal.r=clamp(goal.r*f,1.5,110)};
cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);ptr.set(ev.pointerId,[ev.clientX,ev.clientY])});
cv.addEventListener('pointermove',ev=>{const o=ptr.get(ev.pointerId);if(!o)return;
 if(ptr.size===1){yaw-=(ev.clientX-o[0])*.008;pit=clamp(pit+(ev.clientY-o[1])*.008,-1.3,1.3)}
 else if(ptr.size===2){const q=[...ptr.entries()].find(([id])=>id!==ev.pointerId)[1];zoomBy(Math.hypot(o[0]-q[0],o[1]-q[1])/Math.hypot(ev.clientX-q[0],ev.clientY-q[1]))}
 ptr.set(ev.pointerId,[ev.clientX,ev.clientY])});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,ev=>ptr.delete(ev.pointerId)));
cv.addEventListener('wheel',ev=>{ev.preventDefault();zoomBy(1+ev.deltaY*.001)},{passive:false});
function fit(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(cv);fit();

const LAB={go:update,tg:dg,bg:'kidney',leg:'Teal: GFR. Amber: urine output.',
key:()=>[[100*(1-.85*e),100,'#2ad4c0'],[1-.9*e,1,'#f0a030']],
tag:()=>{kid.userData.k='kidney';SEG.forEach((g,i)=>{if(g.m)g.m.userData.k=['pct','loop',null,'cd'][i]||undefined});gs.userData.k=gk.userData.k='glom';casts.forEach(c=>c.userData.k='cast')},
dz:[['Early sepsis',.2,[],'Perfusion intact; tubules are stressed.'],['Septic AKI',.55,[],'Tubular injury and falling GFR.'],['With noradrenaline',.55,['nor'],'Perfusion pressure restored.'],['Nephrotoxin hit',.5,['nsaid','nephro'],'NSAID plus vancomycin with piperacillin-tazobactam.'],['Best supportive',.55,['nor','bal'],'Pressor plus balanced crystalloid.'],['Established ATN',.85,[],'Severe injury; expect renal replacement.']],
info:{kidney:['Kidney','Receives about 20% of cardiac output. Sepsis AKI is mainly microcirculatory and tubular injury.','Keep MAP up, avoid nephrotoxins, dose-adjust drugs.'],glom:['Glomerulus','Filtration falls with low afferent flow and efferent changes under sepsis.','Noradrenaline restores perfusion pressure; NSAIDs constrict the afferent arteriole.'],pct:['Proximal tubule','Highest energy use. Mitochondria swell and the brush border sloughs first.','Avoid vancomycin with piperacillin-tazobactam, aminoglycosides and contrast.'],loop:['Loop of Henle','The thick ascending limb works near hypoxia in the medulla.','Furosemide does not protect the kidney; use it only for volume overload.'],cd:['Collecting duct','Casts of dead cells obstruct flow and concentrating ability is lost.','Balanced crystalloids; avoid hydroxyethyl starch.'],cast:['Granular cast','Debris from sloughed tubular cells, seen as muddy brown casts in the urine.','Marks established tubular injury; supportive care.']}};
let tsev=sev,ramp=false,hr=0,hist=[],lh=0;const ray=new THREE.Raycaster(),dn=[0,0,0];
$('#leg').textContent=LAB.leg;
function spark(){const c=$('#sp'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);g.strokeStyle='#8886';g.beginPath();g.moveTo(0,h-1);g.lineTo(w,h-1);g.stroke();
 [0,1].forEach(s=>{g.lineWidth=2;g.beginPath();hist.forEach((p,j)=>{g.strokeStyle=p[s][2];const x=j/79*w,y=h-4-(h-8)*clamp(p[s][0]/p[s][1]);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()})}
function step(dt){if(ramp&&Math.abs(sev-tsev)>.003){sev+=(tsev-sev)*(1-Math.exp(-dt*.5));$('#sev').value=Math.round(sev*100);LAB.go()}
 if(!calm)hr+=dt*3;lh+=dt;if(lh>.5){lh=0;hist.push(LAB.key());if(hist.length>80)hist.shift();spark();$('#hr').textContent=Math.floor(hr)}}
$('#dz').innerHTML=LAB.dz.map((d,i)=>`<button data-i="${i}" aria-pressed="false">${d[0]}</button>`).join('');
$('#dz').addEventListener('click',ev=>{const b=ev.target.closest('[data-i]');if(!b)return;const d=LAB.dz[+b.dataset.i];
 Object.keys(LAB.tg).forEach(x=>delete LAB.tg[x]);d[2].forEach(x=>LAB.tg[x]=true);tsev=d[1];sev=calm?tsev:0;ramp=!calm;hr=0;hist.length=0;
 $('#sev').value=Math.round(sev*100);LAB.go();
 document.querySelectorAll('#dz button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#info').innerHTML=`<strong>${d[0]}</strong><br>${d[3]}`});
$('#sev').addEventListener('input',()=>{ramp=false});
cv.addEventListener('pointerdown',ev=>{dn[0]=ev.clientX;dn[1]=ev.clientY;dn[2]=1});
cv.addEventListener('pointerup',ev=>{if(!dn[2]||Math.hypot(ev.clientX-dn[0],ev.clientY-dn[1])>6)return;dn[2]=0;LAB.tag();const r=cv.getBoundingClientRect();
 ray.setFromCamera({x:(ev.clientX-r.left)/r.width*2-1,y:-(ev.clientY-r.top)/r.height*2+1},cam);
 const hs=ray.intersectObjects(S.children,true).filter(h=>h.object.isMesh&&h.object.visible&&h.object.userData.k),h=hs.find(x=>x.object.userData.k!==LAB.bg)||hs[0];
 const i=h&&LAB.info[h.object.userData.k];if(!i)return;$('#info').innerHTML=`<strong>${i[0]}</strong><br>${i[1]}<br><em>Drugs and care:</em> ${i[2]}`});
const VOD={lv:["Organ level", "Nephron level", "Filter level", "Tubular cell level", "Medullary level", "Duct level", "Output level"],ph:["Early sepsis. At organ level, the kidneys still filter normally. At cellular level, the tubular cells are stressed by inflammation and low oxygen delivery.", "Early kidney injury. At organ level, urine output begins to fall. At cellular level, the proximal tubule loses its brush border and the mitochondria begin to swell.", "Established acute kidney injury. At organ level, filtration drops and creatinine rises. At cellular level, injured cells slough off and form casts that block the tubule.", "Severe acute tubular injury. At organ level, very little urine is made, and potassium and acid build up. At cellular level, tubular cells die, and renal replacement therapy may be needed."]};
const VOq=(t,q)=>{if(parent!==window)parent.postMessage({vo:t,q:!!q},'*')};
const phase=()=>sev<.25?0:sev<.5?1:sev<.75?2:3;let lastPh=phase(),vt_=0;
const plain=h=>h.replace(/<br>/g,'. ').replace(/<[^>]+>/g,'');
$('#stages').addEventListener('click',()=>VOq(VOD.lv[stage]+'. '+ST[stage][0]+'. '+(ST[stage][5]||ST[stage][3])));
document.querySelector('#rx,#drugs').addEventListener('click',ev=>{const b=ev.target.closest('[data-rx],[data-dg]');if(!b)return;const k=b.dataset.rx||b.dataset.dg,L=(typeof RX!=='undefined'?RX:DG).find(d=>d[0]===k);if(!L)return;
 const w=[...$('#out').querySelectorAll('.warn')].map(e=>e.textContent).join('. ');VOq(L[1]+(LAB.tg[k]?' switched on. ':' switched off. ')+(L[3]||L[2])+'. '+w)});
new MutationObserver(()=>VOq(plain($('#info').innerHTML))).observe($('#info'),{childList:true});
$('#sev').addEventListener('input',()=>{clearTimeout(vt_);vt_=setTimeout(()=>{lastPh=phase();VOq(VOD.ph[lastPh])},700)});
$('#dz').addEventListener('click',()=>{lastPh=-1;if(!ramp){lastPh=phase();VOq(VOD.ph[lastPh],true)}});
setInterval(()=>{if(!ramp)return;const p=phase();if(p!==lastPh){lastPh=p;VOq(VOD.ph[p],true)}},400);
const clock=new THREE.Clock();
function tick(){
 const dt=Math.min(clock.getDelta(),.05);step(dt);const k=calm?1:1-Math.exp(-dt*3);
 tgt.lerp(goal.t,k);rad+=(goal.r-rad)*k;
 cam.position.set(tgt.x+rad*Math.sin(yaw)*Math.cos(pit),tgt.y+rad*Math.sin(pit),tgt.z+rad*Math.cos(yaw)*Math.cos(pit));cam.lookAt(tgt);
 const o=clamp((rad-16)/40);kid.material.opacity=.35*o;kid.visible=ure.visible=o>.02;ure.material.opacity=.35*o;
 for(let i=0;i<N;i++){
  if(i>=nAct){pos[i*3+1]=-1e4;continue}
  const g=SEG[sg[i]];if(!calm)tt[i]+=dt*3*(g.w?1-.7*e*g.w:1)/g.len;
  if(tt[i]>=1){tt[i]=0;sg[i]=(sg[i]+1)%5}
  const p=SEG[sg[i]].c.getPointAt(tt[i]);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z}
 pg.attributes.position.needsUpdate=true;
 gk.rotation.y+=calm?0:dt*.8;
 R.render(S,cam);requestAnimationFrame(tick)}
update();go(0);tick();
}
</script></body></html>
