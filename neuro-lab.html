<title>Neuroanatomy Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#07111a;--fg:#e7f1f4;--muted:#93a8b3;--line:rgba(127,212,230,.28);--cyan:#7fd4e6;--green:#3ee0a0;--warm:#e2b48a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Figtree,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
a.back{position:fixed;top:10px;left:10px;z-index:5;color:var(--muted);text-decoration:none;min-height:40px;display:flex;align-items:center}
.bar{position:fixed;z-index:4;left:0;right:0;display:flex;gap:6px;overflow:auto;padding:0 10px 6px;-webkit-overflow-scrolling:touch}
.bar.mods{top:48px}
.bar.layers{top:92px}
.bar button,.dock button{flex:0 0 auto;border:1px solid var(--line);background:rgba(7,17,26,.72);color:var(--fg);border-radius:999px;min-height:36px;padding:0 12px}
.bar button.on,.dock button.on{border-color:var(--green);color:var(--green)}
.dock{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;gap:6px;overflow:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,17,26,.92) 30%)}
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;max-height:min(52dvh,520px);overflow:auto;background:rgba(8,16,24,.94);border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s ease}
.sheet.open{transform:none}
.sheet h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:28px;margin:0 0 4px;letter-spacing:-.03em}
.kicker{margin:0;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.sheet p{margin:8px 0;line-height:1.45;color:#d5e3ea}
.sheet h3{margin:14px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.close{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);min-width:44px;min-height:44px}
.choices{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.choices button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;min-height:44px}
.choices button.good{border-color:var(--green);color:var(--green)}
.choices button.bad{border-color:#e07a7a;color:#e07a7a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button,button.go{border:1px solid var(--line);background:transparent;border-radius:999px;min-height:40px;padding:0 14px}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;background:var(--bg);text-align:center;padding:24px}
.load.gone{display:none}
.note{color:var(--muted);font-size:13px}
.list button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(127,212,230,.12);padding:10px 0;min-height:44px}
input.find{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;margin:8px 0}
.score{font-variant-numeric:tabular-nums;color:var(--green)}
@media(min-width:900px){
  .sheet{left:auto;top:0;width:min(420px,38vw);max-height:none;height:100%;border-top:0;border-left:1px solid var(--line)}
  .dock{right:min(420px,38vw)}
}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const loadEl = document.getElementById("load");
const loadMsg = document.getElementById("loadmsg");
let renderer, camera, controls, model, home;
const meshes = [];
const byLabel = new Map();
let manifest = {nodes:[], categories:{}};
let selected = null;
let moduleId = "cortex";
let pathStep = 0;
let pathId = "motor";
let caseId = "mca";
let caseHints = 0;
let casePicked = null;
let caseOpen = false;
const revealed = {};

Object.keys(points).forEach(function(key){ revealed[key] = true; });
const hidden = new Set();
const clipOn = {axial:false, coronal:false, sagittal:false};
const clipK = {axial:0, coronal:0, sagittal:0};
let flip = 1;
const planes = {
  axial: new THREE.Plane(new THREE.Vector3(0, -1, 0), 0),
  coronal: new THREE.Plane(new THREE.Vector3(0, 0, -1), 0),
  sagittal: new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)
};
let extent = 1;

function mats(mesh){ return Array.isArray(mesh.material) ? mesh.material : [mesh.material]; }
function boot(){
  try{
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:"high-performance"});
  }catch(err){
    fail("WebGL did not start. The structure list is still available.");
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setClearColor(0x07111a, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.localClippingEnabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  sceneAdd();
}
const scene = new THREE.Scene();
function sceneAdd(){
  scene.add(new THREE.HemisphereLight(0xd7e8f2, 0x0b1218, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 1.35);
  key.position.set(2, 3, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x7fd4e6, 0.7);
  rim.position.set(-3, 1, -2);
  scene.add(rim);
  camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.autoRotate = !reduced;
  controls.autoRotateSpeed = 0.7;
  const loader = new GLTFLoader();
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
  loader.setDRACOLoader(draco);
  loader.load("neuro/brain.glb", function(gltf){
    model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const size = box.getSize(new THREE.Vector3());
    extent = Math.max(size.x, size.y, size.z) * 0.55;
    model.traverse(function(obj){
      if(!obj.isMesh) return;
      const ex = obj.userData || {};
      obj.material = obj.material.clone();
      mats(obj).forEach(function(mat){
        mat.clippingPlanes = [];
        mat.transparent = false;
        mat.depthWrite = true;
      });
      meshes.push(obj);
      const label = ex.bx_label || obj.name;
      if(!byLabel.has(label)) byLabel.set(label, []);
      byLabel.get(label).push(obj);
    });
    scene.add(model);
    home = {pos: new THREE.Vector3(0, extent * 0.05, extent * 2.3), target: new THREE.Vector3()};
    camera.position.copy(home.pos);
    controls.target.copy(home.target);
    loadEl.classList.add("gone");
    applyModule();
    if(sheet.classList.contains("open") && moduleId==="cortex") renderModule();
  }, function(ev){
    if(ev.total) loadMsg.textContent = Math.round(ev.loaded / ev.total * 100) + "%";
  }, function(){
    fail("The brain model did not load. The names from the atlas list are still available.");
  });
  fetch("neuro/manifest.json").then(function(r){ return r.json(); }).then(function(data){
    manifest = data;
    applyModule();
    paintLayers();
  }).catch(function(){ loadMsg.textContent = "The label file did not load."; });
  addEventListener("resize", resize);
  canvas.addEventListener("pointerdown", down);
  canvas.addEventListener("pointerup", up);
  requestAnimationFrame(frame);
}
let downPt = null;
function down(e){ downPt = {x:e.clientX, y:e.clientY}; controls.autoRotate = false; paintDock(); }
function up(e){
  if(!downPt || !meshes.length) return;
  const moved = Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y);
  downPt = null;
  if(moved > 8) return;
  const rect = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(meshes.filter(function(m){ return m.visible; }), false);
  if(hits[0]) openMesh(hits[0].object);
}
function frame(){
  requestAnimationFrame(frame);
  if(controls) controls.update();
  if(renderer) renderer.render(scene, camera);
}
function resize(){
  if(!renderer) return;
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  camera.updateProjectionMatrix();
}
function fail(msg){
  loadEl.classList.add("gone");
  moduleId = "list";
  openSheet(msg);
}
function nodeOf(mesh){
  const id = mesh.userData.bx_id;
  return manifest.nodes.find(function(n){ return n.id === id; }) || null;
}
function showLabels(labels){
  const wanted = new Set(labels);
  meshes.forEach(function(mesh){
    const on = wanted.has(mesh.userData.bx_label);
    mesh.visible = on;
    mats(mesh).forEach(function(mat){
      mat.emissive = mat.emissive || new THREE.Color();
      mat.emissive.set(on ? 0x143028 : 0x000000);
      mat.emissiveIntensity = on ? 0.35 : 0;
    });
  });
}
function applyVisibility(){
  meshes.forEach(function(mesh){
    const cat = mesh.userData.bx_cat;
    mesh.visible = !hidden.has(cat);
    mats(mesh).forEach(function(mat){
      const hot = selected && mesh === selected;
      mat.emissive = mat.emissive || new THREE.Color();
      mat.emissive.set(hot ? 0x0d3b32 : 0x000000);
      mat.emissiveIntensity = hot ? 0.55 : 0;
    });
  });
}
function applyClip(){
  const list = [];
  ["axial","coronal","sagittal"].forEach(function(key){
    if(!clipOn[key]) return;
    planes[key].constant = clipK[key];
    if(key === "axial") planes[key].normal.set(0, -flip, 0);
    if(key === "coronal") planes[key].normal.set(0, 0, -flip);
    if(key === "sagittal") planes[key].normal.set(-flip, 0, 0);
    list.push(planes[key]);
  });
  meshes.forEach(function(mesh){
    mats(mesh).forEach(function(mat){ mat.clippingPlanes = list; mat.clipShadows = true; });
  });
}
function view(which){
  if(!home) return;
  const d = extent * 2.3;
  const map = {
    front:[0, extent*0.05, d],
    side:[d, extent*0.05, 0],
    top:[0, d, 0.01],
    back:[0, extent*0.05, -d]
  };
  const p = map[which] || map.front;
  camera.position.set(p[0], p[1], p[2]);
  controls.target.set(0, 0, 0);
}
function openMesh(mesh){
  selected = mesh;
  applyVisibility();
  const label = mesh.userData.bx_label || mesh.name;
  const node = nodeOf(mesh);
  const card = CARDS[label];
  const side = mesh.userData.bx_side || "";
  const cat = (manifest.categories[mesh.userData.bx_cat] || {}).label || mesh.userData.bx_cat || "";
  let html = '<button type="button" class="close" id="shut">Close</button>';
  html += '<p class="kicker">'+esc(cat)+(side?' · '+esc(side):'')+'</p>';
  html += '<h2>'+esc(label)+'</h2>';
  if(node && node.region) html += '<p class="note">'+esc(node.region)+'</p>';
  if(card){
    html += block("Function", card.functions);
    html += block("Afferent", card.afferent);
    html += block("Efferent", card.efferent);
    html += block("Blood supply", card.supply);
    html += block("At the bedside", card.clinical);
    html += block("If it is injured", card.deficits);
    html += block("On a scan", card.imaging);
    if(card.case) html += '<div class="row"><button type="button" id="jump">Open the related case</button></div>';
    if(card.quiz) html += quizHtml(label, card.quiz);
  }else{
    html += '<p>No separate clinical card is written for this mesh. The name is the atlas label, not a guess.</p>';
  }
  html += '<p class="note">Source: Z-Anatomy / BodyParts3D, CC BY-SA 4.0. Registered deep nuclei and tracts are approximate.</p>';
  sheet.innerHTML = html;
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); };
  const jump = document.getElementById("jump");
  if(jump) jump.onclick = function(){ moduleId = "cases"; caseId = card.case; casePicked = null; caseHints = 0; caseOpen = true; paint(); renderCase(); };
  const ask = document.getElementById("ask");
  if(ask){
    ask.onclick = function(){
      const picked = sheet.querySelector("input[name=q]:checked");
      const out = document.getElementById("qout");
      if(!picked){ out.textContent = "Choose one first."; return; }
      const right = String(card.quiz.answer) === picked.value;
      out.textContent = (right ? "Correct. " : "Not that one. ") + card.quiz.why;
    };
  }
}
function block(title, text){ return text ? '<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>' : ""; }
function quizHtml(label, quiz){
  return '<h3>Check</h3><p>'+esc(quiz.q)+'</p><div class="choices">'+quiz.choices.map(function(choice, i){
    return '<label><input type="radio" name="q" value="'+i+'"> '+esc(choice)+'</label>';
  }).join("<br>")+'</div><div class="row"><button type="button" id="ask">Check the answer</button></div><p id="qout"></p>';
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    if(c==="&") return "\u0026amp;";
    if(c==="<") return "\u0026lt;";
    if(c===">") return "\u0026gt;";
    return "\u0026quot;";
  });
}
function paint(){
  document.getElementById("mods").innerHTML = MODULES.map(function(mod){
    return '<button type="button"'+(mod.id===moduleId?' class="on"':'')+' data-mod="'+mod.id+'">'+esc(mod.title)+'</button>';
  }).join("");
  document.getElementById("mods").querySelectorAll("[data-mod]").forEach(function(btn){
    btn.onclick = function(){ moduleId = btn.getAttribute("data-mod"); caseOpen = moduleId==="cases"; applyModule(); paint(); if(moduleId!=="cases") renderModule(); else renderCase(); };
  });
  paintDock();
  paintLayers();
}
function paintLayers(){
  const cats = manifest.categories || {};
  const keys = Object.keys(cats);
  document.getElementById("layers").innerHTML = keys.map(function(key){
    const on = !hidden.has(key);
    return '<button type="button"'+(on?' class="on"':'')+' data-cat="'+key+'">'+esc(cats[key].label)+'</button>';
  }).join("");
  document.getElementById("layers").querySelectorAll("[data-cat]").forEach(function(btn){
    btn.onclick = function(){
      const key = btn.getAttribute("data-cat");
      if(hidden.has(key)) hidden.delete(key); else hidden.add(key);
      applyVisibility();
      paintLayers();
    };
  });
}
function paintDock(){
  const auto = controls && controls.autoRotate;
  document.getElementById("dock").innerHTML =
    '<button type="button"'+(auto?' class="on"':'')+' id="spin">Turn</button>'+
    '<button type="button" id="reset">Reset</button>'+
    '<button type="button" id="front">Front</button>'+
    '<button type="button" id="side">Side</button>'+
    '<button type="button" id="top">Top</button>'+
    '<button type="button" id="solo">Isolate</button>'+
    '<button type="button" id="about">About</button>'+
    '<span class="score">'+scoreText()+'</span>';
  document.getElementById("spin").onclick = function(){ controls.autoRotate = !controls.autoRotate; paintDock(); };
  document.getElementById("reset").onclick = function(){
    hidden.clear(); selected = null; clipOn.axial = clipOn.coronal = clipOn.sagittal = false;
    applyClip(); applyModule(); view("front"); sheet.classList.remove("open");
  };
  document.getElementById("front").onclick = function(){ view("front"); };
  document.getElementById("side").onclick = function(){ view("side"); };
  document.getElementById("top").onclick = function(){ view("top"); };
  document.getElementById("solo").onclick = function(){
    if(!selected) return;
    meshes.forEach(function(mesh){ mesh.visible = mesh === selected; });
  };
  document.getElementById("about").onclick = renderAbout;
}
function scoreText(){
  const vals = Object.values(points);
  if(!vals.length) return "";
  const sum = vals.reduce(function(a,b){ return a+b; }, 0);
  return sum.toFixed(1)+" / "+CASES.length*2;
}
function applyModule(){
  const mod = MODULES.find(function(item){ return item.id === moduleId; }) || MODULES[0];
  hidden.clear();
  if(manifest.categories){
    Object.keys(manifest.categories).forEach(function(key){
      if(mod.cats.indexOf(key) === -1) hidden.add(key);
    });
  }
  applyVisibility();
  paintLayers();
}
function renderModule(){
  const mod = MODULES.find(function(item){ return item.id === moduleId; });
  if(!mod) return;
  if(moduleId === "paths"){ renderPath(); return; }
  if(moduleId === "sections"){ renderSections(); return; }
  if(moduleId === "list"){ renderList(); return; }
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">Module</p><h2>'+esc(mod.title)+'</h2><p>'+esc(mod.text)+'</p>'+searchBox();
  sheet.classList.add("open");
  bindList();
}
function searchBox(){
  const labels = [];
  byLabel.forEach(function(group, label){
    const cat = group[0].userData.bx_cat;
    if(hidden.has(cat)) return;
    labels.push(label);
  });
  labels.sort();
  return '<input class="find" id="find" placeholder="Find a structure" aria-label="Find a structure"><div class="list" id="list">'+labels.map(function(label){
    return '<button type="button" data-label="'+esc(label)+'">'+esc(label)+'</button>';
  }).join("")+'</div>';
}
function bindList(){
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); };
  const find = document.getElementById("find");
  const list = document.getElementById("list");
  if(find) find.oninput = function(){
    const q = find.value.toLowerCase();
    list.querySelectorAll("button").forEach(function(btn){
      btn.hidden = btn.textContent.toLowerCase().indexOf(q) === -1;
    });
  };
  if(list) list.onclick = function(event){
    const btn = event.target.closest("[data-label]");
    if(!btn) return;
    const group = byLabel.get(btn.getAttribute("data-label"));
    if(group && group[0]){ showLabels([btn.getAttribute("data-label")]); openMesh(group[0]); }
  };
}
function renderPath(){
  const path = PATHS.find(function(item){ return item.id === pathId; }) || PATHS[0];
  const step = path.steps[pathStep];
  showLabels(step.meshes);
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">Pathway '+(pathStep+1)+' / '+path.steps.length+'</p><h2>'+esc(path.title)+'</h2><div class="row">'+PATHS.map(function(item){
    return '<button type="button" data-path="'+item.id+'">'+esc(item.title)+'</button>';
  }).join("")+'</div><p>'+esc(step.text)+'</p><p class="note">'+esc(step.meshes.join(", "))+'</p><div class="row"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div>';
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); applyModule(); };
  sheet.querySelectorAll("[data-path]").forEach(function(btn){
    btn.onclick = function(){ pathId = btn.getAttribute("data-path"); pathStep = 0; renderPath(); };
  });
  document.getElementById("prev").onclick = function(){ pathStep = Math.max(0, pathStep-1); renderPath(); };
  document.getElementById("next").onclick = function(){ pathStep = Math.min(path.steps.length-1, pathStep+1); renderPath(); };
}
function renderSections(){
  applyModule();
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">Atlas sections</p><h2>Cutting planes</h2><p>These planes cut the 3D model. They are not computed tomography or magnetic resonance slices. A DICOM viewer is not included, because no licensed scan volume ships with this lab.</p>'+
    planeRow("axial","Axial")+planeRow("coronal","Coronal")+planeRow("sagittal","Sagittal")+
    '<div class="row"><button type="button" id="flip">Flip the cut</button></div>'+
    '<h3>Landmarks</h3><div class="list"><button type="button" data-label="Lateral ventricle">Lateral ventricle</button><button type="button" data-label="Corpus callosum">Corpus callosum</button><button type="button" data-label="Midbrain">Midbrain</button><button type="button" data-label="Middle cerebral artery (M1-segment)">Middle cerebral artery, M1</button></div>';
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); };
  ["axial","coronal","sagittal"].forEach(function(key){
    document.getElementById("on-"+key).onchange = function(event){ clipOn[key] = event.target.checked; applyClip(); };
    document.getElementById("k-"+key).oninput = function(event){ clipK[key] = Number(event.target.value) * extent; applyClip(); };
  });
  document.getElementById("flip").onclick = function(){ flip = -flip; applyClip(); };
  sheet.querySelectorAll("[data-label]").forEach(function(btn){
    btn.onclick = function(){
      const group = byLabel.get(btn.getAttribute("data-label"));
      if(group){ hidden.delete(group[0].userData.bx_cat); applyVisibility(); openMesh(group[0]); }
    };
  });
}
function planeRow(key, label){
  return '<h3>'+label+'</h3><label><input type="checkbox" id="on-'+key+'"> Show '+label.toLowerCase()+' plane</label><br><input id="k-'+key+'" type="range" min="-1" max="1" step="0.02" value="0" aria-label="'+label+' position">';
}
function renderCase(){
  const item = CASES.find(function(c){ return c.id === caseId; }) || CASES[0];
  const open = !!revealed[item.id];
  const order = item.choices.slice();
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">'+esc(item.level)+' · '+scoreText()+'</p><h2>'+esc(item.title)+'</h2><p>'+esc(item.stem)+'</p><div class="choices" id="choices">'+order.map(function(choice){
    return '<button type="button" data-choice="'+choice.id+'">'+esc(choice.label)+'</button>';
  }).join("")+'</div><div class="row"><button type="button" id="hint">Hint ('+caseHints+'/2)</button><button type="button" id="lock">Submit</button><button type="button" id="debrief">Debrief</button></div><p id="hinttext"></p><div class="row">'+CASES.map(function(c){
    return '<button type="button" data-case="'+c.id+'">'+esc(c.title)+(points[c.id]!=null?" ·":"")+'</button>';
  }).join("")+'</div>';
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); };
  if(open) markChoices(item);
  sheet.querySelectorAll("[data-choice]").forEach(function(btn){
    btn.onclick = function(){
      if(revealed[item.id]) return;
      casePicked = btn.getAttribute("data-choice");
      sheet.querySelectorAll("[data-choice]").forEach(function(other){ other.classList.toggle("on", other===btn); });
    };
  });
  document.getElementById("hint").onclick = function(){
    if(revealed[item.id] || caseHints >= item.hints.length) return;
    caseHints += 1;
    document.getElementById("hinttext").textContent = item.hints[caseHints-1];
    document.getElementById("hint").textContent = "Hint ("+caseHints+"/2)";
  };
  document.getElementById("lock").onclick = function(){
    if(revealed[item.id]) return;
    if(!casePicked){ document.getElementById("hinttext").textContent = "Select a site first."; return; }
    revealed[item.id] = true;
    const right = casePicked === item.answer;
    points[item.id] = right ? Math.max(0, 2 - caseHints) : 0;
    sessionStorage.setItem("neuro-score", JSON.stringify(points));
    markChoices(item);
    showLabels(item.meshes);
    paintDock();
  };
  document.getElementById("debrief").onclick = renderDebrief;
  sheet.querySelectorAll("[data-case]").forEach(function(btn){
    btn.onclick = function(){ caseId = btn.getAttribute("data-case"); casePicked = null; caseHints = 0; renderCase(); };
  });
}
function markChoices(item){
  sheet.querySelectorAll("[data-choice]").forEach(function(btn){
    const id = btn.getAttribute("data-choice");
    btn.classList.toggle("good", id === item.answer);
    btn.classList.toggle("bad", id === casePicked && id !== item.answer);
  });
  const note = document.getElementById("hinttext");
  if(note) note.textContent = item.why;
}
function renderDebrief(){
  const sum = CASES.reduce(function(total, item){ return total + (points[item.id] || 0); }, 0);
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">Debrief</p><h2>'+sum.toFixed(1)+' of '+(CASES.length*2)+'</h2><p>A correct answer with no hint is 2. Each hint costs 1. A wrong site is 0. The explanation stays hidden until you submit.</p>'+CASES.map(function(item){
    const got = points[item.id];
    return '<h3>'+esc(item.title)+'</h3><p>'+(got==null?'Not submitted yet.':((got>0?'Scored '+got+'. ':'Missed. ')+esc(item.why)))+'</p>';
  }).join("")+'<div class="row"><button type="button" id="again">Clear the score</button></div>';
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ renderCase(); };
  document.getElementById("again").onclick = function(){
    Object.keys(points).forEach(function(key){ delete points[key]; });
    Object.keys(revealed).forEach(function(key){ delete revealed[key]; });
    sessionStorage.removeItem("neuro-score");
    renderCase();
    paintDock();
  };
}
function renderAbout(){
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">About this lab</p><h2>What is real</h2><p>The brain is a Draco-compressed glTF, 437 named meshes, loaded with Three.js. It is the Brain Project atlas from Z-Anatomy and BodyParts3D, CC BY-SA 4.0. Deep nuclei and tract centerlines were registered from open atlases and are approximate to about 7 mm.</p><h3>Not in the model</h3><p>No spinal cord. No internal capsule as its own mesh. No uncus. No spinothalamic tract. No arachnoid granulations. No DICOM stack and no window or level tool. Cutting planes are sections of the mesh, not scans.</p><h3>Not finished</h3><p>Clinical cards cover the structures used in the cases and pathways, not every mesh. Meshes without a card show the atlas name only. This is teaching anatomy, not a device and not a surgical plan.</p><h3>How to open it</h3><p>From the brain in the Critical Care Hub, choose Learning Lab. The files are neuro-lab.html, neuro/brain.glb and neuro/manifest.json. Three.js is loaded from a network CDN. The licence is in neuro/LICENSE.txt.</p><div class="row"><button type="button" id="listview">Structure list</button></div>';
  sheet.classList.add("open");
  document.getElementById("shut").onclick = function(){ sheet.classList.remove("open"); };
  document.getElementById("listview").onclick = function(){ moduleId = "list"; renderList(); };
}
function renderList(){
  const labels = manifest.nodes.length ? manifest.nodes.map(function(n){ return n.label+" · "+n.side; }) : Array.from(byLabel.keys());
  sheet.innerHTML = '<button type="button" class="close" id="shut">Close</button><p class="kicker">Atlas list</p><h2>Structures</h2><input class="find" id="find" aria-label="Filter structures"><div class="list" id="list">'+labels.map(function(label){
    const clean = String(label).split(" · ")[0];
    return '<button type="button" data-label="'+esc(clean)+'">'+esc(label)+'</button>';
  }).join("")+'</div>';
  sheet.classList.add("open");
  bindList();
}
function openSheet(msg){
  sheet.innerHTML = '<p>'+esc(msg)+'</p>';
  sheet.classList.add("open");
  renderAbout();
}
paint();
boot();
</script>
</body>
</html>
