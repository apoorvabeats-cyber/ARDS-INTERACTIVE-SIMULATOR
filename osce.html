<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>OSCE World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#071018;color:#f3efe6}
body{font-family:Figtree,ui-sans-serif,sans-serif;line-height:1.45;min-height:100dvh}
button,a{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #f3efe6;outline-offset:3px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;position:sticky;top:0;background:#071018;z-index:2}
header a, #icuBack{color:#b7b1a4;text-decoration:none;min-height:44px;display:flex;align-items:center}
#icuBack{border:0;background:none;padding:0;border-radius:0}
header strong{flex:1;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:20px;min-width:120px}
.tools{display:flex;gap:8px}
header button{min-height:44px;border-radius:999px;border:1px solid rgba(243,239,230,.28);background:transparent;padding:0 14px}
#voice[aria-pressed="true"]{border-color:#7fd4e6;color:#7fd4e6}
#clock{margin-left:auto;min-width:84px;height:64px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#102028;color:#7fd4e6;box-shadow:inset 0 0 0 2px #7fd4e6;font-family:Fraunces,Georgia,serif;font-size:36px;font-weight:520;font-variant-numeric:tabular-nums;line-height:1;animation:tick 1s steps(2,end) infinite}
#clock.low{color:#ffd0cb;background:#2a1414;animation-duration:.4s}
@keyframes tick{0%{box-shadow:inset 0 0 0 2px #7fd4e6}50%{box-shadow:inset 0 0 0 4px #f4efe4;background:#1a4552}100%{box-shadow:inset 0 0 0 2px #7fd4e6}}
main{padding:6px 14px 48px;max-width:720px;margin:0 auto}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:34px;letter-spacing:-.03em;line-height:1;margin:8px 0}
.lede{color:#b7b1a4;margin:0 0 12px}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{text-align:left;border:0;border-radius:16px;padding:16px;min-height:88px;background:#102028;box-shadow:inset 0 0 0 1px rgba(127,212,230,.35)}
.mode b{display:block;font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:520}
.mode span{display:block;margin-top:4px;color:#b7b1a4}
.gas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.gas div:last-child{grid-column:1 / -1}
.gas div{background:#10161c;border-radius:12px;padding:10px}
.gas dt{color:#8a8478;font-size:12px}
.gas dd{margin:2px 0 0;font-variant-numeric:tabular-nums;font-weight:650}
.prompt{font-size:18px;margin:12px 0}
.choice{display:block;width:100%;text-align:left;background:#10161c;color:#f3efe6;border:1px solid rgba(243,239,230,.16);border-radius:12px;padding:12px;min-height:48px;margin:8px 0}
.choice.right{border-color:#8fbf9a}
.choice.wrong{border-color:#d27b73}
.choice:disabled{opacity:1}
.fb{border-radius:12px;padding:12px;margin-top:8px;background:#10161c}
.next{margin-top:12px;min-height:48px;border:0;border-radius:12px;padding:12px 16px;background:#7fd4e6;color:#071018;font-weight:650}
.score{color:#8a8478;font-variant-numeric:tabular-nums}
svg.ecg{display:block;background:#fff;width:100%;height:auto;max-width:100%}
.ecgwrap{overflow:hidden;border-radius:12px;background:#fbf6f4;margin:8px 0}
.tablets{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tablet{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:14px 16px;min-height:64px;background:#102028;box-shadow:inset 0 0 0 1px rgba(243,239,230,.18)}
.tablet b{display:block;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:520;line-height:1.15}
.tablet span{display:block;margin-top:4px;color:#b7b1a4;font-size:14px}
.tablet.on{box-shadow:inset 0 0 0 2px #7fd4e6}
a.tablet{text-decoration:none;color:inherit}
.backrow{background:none;border:0;color:#b7b1a4;padding:8px 0;min-height:44px}
.groups{display:flex;flex-direction:column;gap:8px;overflow:visible;padding-bottom:6px}
.groups button,.drugs button{width:100%;flex:none;min-height:44px;border-radius:14px;border:1px solid rgba(243,239,230,.2);background:transparent;padding:8px 12px;margin:0;text-align:left}
.groups button.on,.drugs button.on{border-color:#7fd4e6;color:#7fd4e6}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.calc label{font-size:13px;color:#b7b1a4}
.calc input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(243,239,230,.3);color:#f3efe6;padding:8px 0;font-size:16px}
.out{grid-column:1/-1;font-variant-numeric:tabular-nums}
.fine{color:#8a8478;font-size:13px}
.lightbox{background:#05070c;border-radius:12px;padding:8px;margin:10px 0}
.lightbox img{width:100%;max-height:58dvh;object-fit:contain;display:block;background:#000;border-radius:8px}
.filmshot{position:relative}
.spot{position:absolute;border:2px solid #e2b48a;border-radius:12px;box-shadow:0 0 0 2px rgba(7,17,26,.75);pointer-events:none}
.spot b{position:absolute;left:0;bottom:calc(100% + 4px);background:#07111a;color:#f3efe6;font-size:12px;font-weight:650;line-height:1.3;padding:3px 7px;border-radius:8px;white-space:nowrap;max-width:72vw}
.mod{margin:0 0 6px;color:#8a8478;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
</style>
</head>
<body>
<header>
  <button type="button" id="icuBack">Back to ICU</button>
  <strong>OSCE World</strong>
  <div id="clock" role="timer" aria-live="polite" aria-label="Twenty seconds for each answer">20</div>
  <div class="tools">
    <button type="button" id="stations">Stations</button>
    <button type="button" id="voice" aria-pressed="true">Voice on</button>
  </div>
</header>
<main id="app"></main>
<script src="osce-data.js?v=20261029a"></script>
<script src="osce-stations.js?v=20261028d"></script>
<script>
const app = document.getElementById("app");
const voiceBtn = document.getElementById("voice");
let voiceOn = localStorage.getItem("osce-voice") !== "off";
voiceBtn.setAttribute("aria-pressed", voiceOn ? "true" : "false");
voiceBtn.textContent = voiceOn ? "Voice on" : "Voice off";
voiceBtn.onclick = function(){
  voiceOn = !voiceOn;
  localStorage.setItem("osce-voice", voiceOn ? "on" : "off");
  voiceBtn.setAttribute("aria-pressed", voiceOn ? "true" : "false");
  voiceBtn.textContent = voiceOn ? "Voice on" : "Voice off";
  if(!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  else say("Voice on.");
};
document.getElementById("icuBack").onclick = function(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  try{
    if(window.parent && window.parent !== window && typeof window.parent.returnToIcu === "function"){
      window.parent.returnToIcu();
      return;
    }
  }catch(err){}
  location.href = "index.html";
};
document.getElementById("stations").onclick = function(){
  mode = "";
  history.replaceState(null, "", "osce.html?v=20261021q");
  if(window.speechSynthesis) speechSynthesis.cancel();
  stopClock();
  home();
};
function speakable(text){
  let out = String(text);
  const phrases = [
    ["OSCE", "Objective Structured Clinical Examination"],
    ["PaCO2", "Pa CO2"],
    ["PaO2", "Pa O2"],
    ["EtCO2", "end tidal carbon dioxide"],
    ["SpO2", "oxygen saturation"],
    ["FiO2", "Fi O2"],
    ["HCO3", "bicarbonate"],
    ["mmHg", "millimetres of mercury"],
    ["NSTEMI", "non ST elevation myocardial infarction"],
    ["STEMI", "ST elevation myocardial infarction"],
    ["HFNC", "high flow nasal oxygen"],
    ["PEEP", "peep"],
    ["BP", "blood pressure"],
    ["pH", "pH"]
  ];
  phrases.forEach(function(pair){
    out = out.replace(new RegExp("\\b"+pair[0]+"\\b","g"), pair[1]);
  });
  const nums = {1:"one",2:"two",3:"three",4:"four",5:"five",6:"six"};
  out = out.replace(/\bV([1-6])\b/g, function(_, d){ return "V "+nums[d]; });
  out = out.replace(/\bIII\b/g, "three");
  out = out.replace(/\bII\b/g, "two");
  return out;
}
function britishFemale(){
  if(!window.speechSynthesis || !speechSynthesis.getVoices) return null;
  const voices = speechSynthesis.getVoices() || [];
  const female = /female|woman|kate|martha|serena|libby|maisie|susan|fiona|emily|hazel|catherine|emma|amy|sonia|lily|olivia|charlotte|mia|allison|karen|victoria|stephanie|sarah|nicky|tessa|moira|sandy|kathy|fiona|google uk english female/i;
  const male = /\bmale\b|daniel|arthur|george|james|oliver|thomas|brian|rishi|ryan|alex|fred|gordon|malcolm|ravi|google uk english male/i;
  const british = voices.filter(function(v){
    return /en-GB/i.test(v.lang || "") || /UK English|British/i.test(v.name || "");
  });
  const soft = british.filter(function(v){ return female.test(v.name || "") && !male.test(v.name || ""); })[0];
  if(soft) return soft;
  const unnamed = british.filter(function(v){ return !male.test(v.name || ""); })[0];
  return unnamed || british[0] || null;
}
function say(text){
  if(!voiceOn || !window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speakable(text));
  u.lang = "en-GB";
  u.rate = 0.84;
  u.pitch = 1.04;
  u.volume = 0.82;
  const voice = britishFemale();
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); };
}
const CLOCK_LIMIT = 20;
let clock = null;
let clockGen = 0;
let remain = CLOCK_LIMIT;
let clockLive = false;
function paintClock(){
  const el = document.getElementById("clock");
  if(!el) return;
  el.textContent = String(Math.max(remain, 0));
  el.classList.toggle("low", clockLive && remain <= 5);
}
function stopClock(){
  clockGen += 1;
  if(clock){ clearInterval(clock); clock = null; }
  clockLive = false;
  remain = CLOCK_LIMIT;
  paintClock();
}
function armClock(onExpire){
  stopClock();
  const gen = clockGen;
  clockLive = true;
  remain = CLOCK_LIMIT;
  paintClock();
  clock = setInterval(function(){
    if(gen !== clockGen) return;
    remain -= 1;
    paintClock();
    if(remain > 0) return;
    clearInterval(clock);
    clock = null;
    clockLive = false;
    paintClock();
    onExpire();
  }, 1000);
}
function afterSpeech(text, then){
  const gen = clockGen;
  let done = false;
  const leave = function(){
    if(done) return;
    done = true;
    if(gen !== clockGen) return;
    then();
  };
  if(!voiceOn || !window.speechSynthesis || !text){
    setTimeout(leave, 2800);
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speakable(text));
  u.lang = "en-GB";
  u.rate = 0.84;
  u.pitch = 1.04;
  u.volume = 0.82;
  const voice = britishFemale();
  if(voice) u.voice = voice;
  u.onend = function(){ setTimeout(leave, 500); };
  u.onerror = function(){ setTimeout(leave, 1200); };
  speechSynthesis.speak(u);
  setTimeout(leave, Math.min(22000, 5000 + String(text).length * 75));
}
function timeUp(markMode, answerIndex, spoken, go){
  stopClock();
  if(markMode) mark(markMode, false);
  const buttons = app.querySelectorAll(".choice");
  buttons.forEach(function(btn){ btn.disabled = true; });
  if(buttons[answerIndex]) buttons[answerIndex].classList.add("right");
  const line = "Time is up. The answer is " + spoken;
  const fb = document.getElementById("fb");
  if(fb){ fb.hidden = false; fb.textContent = line; }
  if(typeof showFilmMark === "function") showFilmMark();
  afterSpeech(line, go);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return "&#" + c.charCodeAt(0) + ";";
  });
}
function store(){
  try { return JSON.parse(localStorage.getItem("osce-sim-v1") || "{}"); }
  catch(e){ return {}; }
}
function mark(mode, ok){
  const all = store();
  const rec = all[mode] || {asked:0, correct:0};
  rec.asked += 1;
  if(ok) rec.correct += 1;
  all[mode] = rec;
  localStorage.setItem("osce-sim-v1", JSON.stringify(all));
  return rec;
}
function scoreLine(mode){
  const rec = store()[mode];
  if(!rec || !rec.asked) return "Not started";
  return rec.correct + " of " + rec.asked;
}
const params = new URLSearchParams(location.search);
let mode = params.get("mode") || "";
const FIELDS = ["indication","dose","infusion","preparation","renal","hepatic","contra","monitoring","adverse","reversal","evidence"];
const FIELD_LABEL = {
  indication:"Indication in the ICU",
  dose:"Adult dose",
  infusion:"Infusion",
  preparation:"Preparation",
  renal:"Renal adjustment",
  hepatic:"Hepatic adjustment",
  contra:"Contraindications and cautions",
  monitoring:"Monitoring",
  adverse:"Adverse effects",
  reversal:"Reversal or antidote",
  evidence:"Evidence and source"
};

function home(){
  stopClock();
  app.innerHTML =
    "<h1>Choose the station</h1>"+
    "<p class='lede'>One station at a time. Twenty seconds for each answer. The voice reads the question, says whether the answer is correct, and reads the explanation.</p>"+
    "<div class='modes'>"+
      "<button class='mode' data-go='abg'><b>ABG</b><span>25 gases. Name the disorder, then the cause. "+esc(scoreLine("abg"))+"</span></button>"+
      "<button class='mode' data-go='drug'><b>ICU drugs</b><span>Pick from the checklist. The questions walk the monograph. "+esc(scoreLine("drug"))+"</span></button>"+
      "<button class='mode' data-go='ecg'><b>ECG</b><span>50 teaching traces. Name it, then the treatment. "+esc(scoreLine("ecg"))+"</span></button>"+
      "<button class='mode' data-go='kit'><b>Instruments</b><span>Pick from the bay. The station asks what it is for, then the check that matters. "+esc(scoreLine("kit"))+"</span></button>"+
      "<button class='mode' data-go='film'><b>Radiology</b><span>X-ray, CT, or MRI. The film, then the finding, then the treatment. "+esc(scoreLine("film"))+"</span></button>"+
    "</div>";
  app.querySelectorAll("[data-go]").forEach(function(btn){
    btn.onclick = function(){
      mode = btn.getAttribute("data-go");
      history.replaceState(null, "", "?mode="+mode+"&v=20261021q");
      start();
    };
  });
  say("OSCE World. Choose a gas, a drug, a trace, an instrument, or a film.");
}

let abgOrder = [];
let abgAt = 0;
let abgStep = "id";
function shuffled(step){
  const options = step.options.slice();
  const correct = options[step.answer];
  for(let i = options.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = options[i];
    options[i] = options[j];
    options[j] = tmp;
  }
  return {prompt:step.prompt, say:step.say, options:options, answer:options.indexOf(correct)};
}
function startAbg(){
  abgOrder = OSCE_DATA.abg.map(function(_, i){ return i; }).sort(function(){ return Math.random()-0.5; });
  abgAt = 0;
  abgStep = "id";
  renderAbg();
}
function renderAbg(){
  const item = OSCE_DATA.abg[abgOrder[abgAt]];
  const v = item.values;
  const step = shuffled(abgStep==="id" ? item.identify : item.cause);
  const gas = [["pH", v.ph],["PaCO2", v.pco2],["HCO3", v.hco3],["PaO2", v.po2],["Na", v.na],["Cl", v.cl],["Lactate", v.lactate],["FiO2", v.fio2],["Note", v.note]];
  app.innerHTML =
    "<p class='score'>"+(abgAt+1)+" of 25 · "+esc(scoreLine("abg"))+"</p>"+
    "<h1>Arterial blood gas</h1>"+
    "<div class='gas'>"+gas.map(function(row){ return "<div><dt>"+esc(row[0])+"</dt><dd>"+esc(row[1])+"</dd></div>"; }).join("")+"</div>"+
    "<p class='prompt'>"+esc(step.prompt)+"</p>"+
    step.options.map(function(opt, i){ return "<button class='choice' data-i='"+i+"'>"+esc(opt)+"</button>"; }).join("")+
    "<p class='fb' id='fb' hidden></p><button class='next' id='next' hidden>Continue</button>"+
    "<p class='fine'></p>";
  say(abgStep==="id" ? "What is the main acid-base disorder?" : "What is the most likely cause?");
  armClock(function(){ timeUp("abg", step.answer, step.options[step.answer] + ". " + step.say, function(){ advanceAbg(false); }); });
  app.querySelectorAll(".choice").forEach(function(btn){
    btn.onclick = function(){ answerAbg(item, step, Number(btn.getAttribute("data-i"))); };
  });
}
function advanceAbg(ok){
  if(abgStep==="id" && ok){ abgStep = "cause"; renderAbg(); return; }
  abgStep = "id";
  abgAt += 1;
  if(abgAt >= abgOrder.length) abgAt = 0;
  renderAbg();
}
function answerAbg(item, step, i){
  stopClock();
  const buttons = app.querySelectorAll(".choice");
  buttons.forEach(function(btn){ btn.disabled = true; });
  const ok = i === step.answer;
  buttons[i].classList.add(ok ? "right" : "wrong");
  if(!ok) buttons[step.answer].classList.add("right");
  mark("abg", ok);
  const fb = document.getElementById("fb");
  fb.hidden = false;
  fb.textContent = (ok ? "Correct. " : "That is incorrect. The correct answer is " + step.options[step.answer] + ". ") + step.say;
  say(fb.textContent);
  const next = document.getElementById("next");
  next.hidden = false;
  next.onclick = function(){ advanceAbg(ok); };
}

let groupId = "A";
let picked = [];
let drugQueue = [];
let drugAt = 0;
let fieldAt = 0;
function startDrug(){
  groupId = "";
  picked = [];
  renderDrugGroups();
}
function renderDrugGroups(){
  stopClock();
  app.innerHTML =
    "<p class='score'>Drugs · "+esc(scoreLine("drug"))+"</p>"+
    "<h1>ICU drug groups</h1>"+
    "<p class='lede'>Choose one group. The drugs in that group open on the next screen.</p>"+
    "<div class='tablets'>"+OSCE_DATA.groups.map(function(g){
      return "<button type='button' class='tablet' data-g='"+g.id+"'><b>"+esc(g.id+". "+g.name)+"</b><span>"+g.drugs.length+" drugs</span></button>";
    }).join("")+"</div>";
  say("Choose a drug group.");
  app.querySelectorAll("[data-g]").forEach(function(btn){
    btn.onclick = function(){
      groupId = btn.getAttribute("data-g");
      picked = [];
      renderDrugList();
    };
  });
}
function renderDrugList(){
  stopClock();
  const group = OSCE_DATA.groups.find(function(g){ return g.id===groupId; });
  app.innerHTML =
    "<button type='button' class='backrow' id='drugBack'>All groups</button>"+
    "<p class='score'>Drugs · "+esc(scoreLine("drug"))+"</p>"+
    "<h1>"+esc(group.id+". "+group.name)+"</h1>"+
    "<p class='lede'>Select the drugs. The station then asks one field at a time.</p>"+
    "<div class='tablets'>"+group.drugs.map(function(id){
      const drug = OSCE_DATA.drugs[id];
      const on = picked.indexOf(id)!==-1;
      return "<button type='button' class='tablet"+(on?" on":"")+"' data-d='"+id+"'><b>"+esc(drug.name)+"</b></button>";
    }).join("")+"</div>"+
    "<button class='next' id='begin'>Ask these drugs</button>"+
    "<p class='fine'>If you select none, this whole group is used.</p>";
  say(group.name+". Select the drugs.");
  document.getElementById("drugBack").onclick = function(){ renderDrugGroups(); };
  app.querySelectorAll("[data-d]").forEach(function(btn){
    btn.onclick = function(){
      const id = btn.getAttribute("data-d");
      const at = picked.indexOf(id);
      if(at===-1) picked.push(id); else picked.splice(at, 1);
      btn.classList.toggle("on");
    };
  });
  document.getElementById("begin").onclick = function(){
    drugQueue = picked.length ? picked.slice() : group.drugs.slice();
    drugAt = 0;
    fieldAt = 0;
    say("Starting "+OSCE_DATA.drugs[drugQueue[0]].name);
    renderDrugQ();
  };
}
function others(id, field){
  const pool = Object.keys(OSCE_DATA.drugs).filter(function(key){
    return key!==id && OSCE_DATA.drugs[key][field] && OSCE_DATA.drugs[key][field] !== OSCE_DATA.drugs[id][field];
  });
  const out = [];
  while(out.length < 3 && pool.length){
    const key = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    out.push(OSCE_DATA.drugs[key][field]);
  }
  return out;
}
function renderDrugQ(){
  const id = drugQueue[drugAt];
  const drug = OSCE_DATA.drugs[id];
  const field = FIELDS[fieldAt];
  const correct = drug[field];
  const options = others(id, field);
  options.splice(Math.floor(Math.random()*(options.length+1)), 0, correct);
  const answer = options.indexOf(correct);
  app.innerHTML =
    "<p class='score'>"+esc(drug.name)+" · "+(fieldAt+1)+" of "+FIELDS.length+" · drug "+(drugAt+1)+" of "+drugQueue.length+" · "+esc(scoreLine("drug"))+"</p>"+
    "<h1>"+esc(drug.name)+"</h1>"+
    "<p class='prompt'>"+esc(FIELD_LABEL[field])+". Which statement is right?</p>"+
    options.map(function(opt, i){ return "<button class='choice' data-i='"+i+"'>"+esc(opt)+"</button>"; }).join("")+
    "<p class='fb' id='fb' hidden></p><div id='calc'></div><button class='next' id='next' hidden>Continue</button>";
  say(drug.name+". "+FIELD_LABEL[field]+". Which statement is right?");
  armClock(function(){ timeUp("drug", answer, correct, advanceDrug); });
  app.querySelectorAll(".choice").forEach(function(btn){
    btn.onclick = function(){
      stopClock();
      const i = Number(btn.getAttribute("data-i"));
      app.querySelectorAll(".choice").forEach(function(b){ b.disabled = true; });
      const ok = i === answer;
      btn.classList.add(ok ? "right" : "wrong");
      if(!ok) app.querySelectorAll(".choice")[answer].classList.add("right");
      mark("drug", ok);
      const fb = document.getElementById("fb");
      fb.hidden = false;
      fb.textContent = (ok ? "Correct. " : "That is incorrect. The correct answer is ") + correct;
      say(fb.textContent);
      if(field==="infusion" && drug.calc){
        document.getElementById("calc").innerHTML = calculator(drug);

  }

  d += " L"+(x0+6)+" "+calTop.toFixed(1);

  d += " L"+(x0+6+calW).toFixed(1)+" "+baseline.toFixed(1);

  for(let i = 0; i < n; i++){

}
function put(y, sr, t0, t1, fn){

    "<button type='button' class='backrow' id='kitBack'>All headings</button>"+
    "<p class='score'>Instruments · "+esc(scoreLine("kit"))+"</p>"+
    "<h1>"+esc(group.name)+"</h1>"+
    "<p class='lede'>Select the instruments. The station then asks what each one is for, then the check that matters.</p>"+
    "<div class='tablets'>"+group.items.map(function(item){
      const on = kitPicked.indexOf(item.id)!==-1;
      return "<button type='button' class='tablet"+(on?" on":"")+"' data-d='"+item.id+"'><b>"+esc(item.name)+"</b></button>";
    }).join("")+"</div>"+
    "<button class='next' id='begin'>Ask the use</button>"+
    "<p class='fine'>If you select none, this whole heading is used.</p>";
  say(group.name+". Select the instruments.");
  document.getElementById("kitBack").onclick = function(){ renderKitGroups(); };
  app.querySelectorAll("[data-d]").forEach(function(btn){
    btn.onclick = function(){
      const id = btn.getAttribute("data-d");
      const at = kitPicked.indexOf(id);
      if(at===-1) kitPicked.push(id); else kitPicked.splice(at, 1);
      btn.classList.toggle("on");
    };
  });
  document.getElementById("begin").onclick = function(){
    const group = kitGroupById(kitGroup);
    kitQueue = kitPicked.length ? kitPicked.slice() : group.items.map(function(item){ return item.id; });
    kitAt = 0;
    kitStep = "use";
    renderKitQ();
  };
}
function renderKitQ(){
  const item = kitItem(kitQueue[kitAt]);
  const field = kitStep;
  const correct = item[field];
  const options = kitOthers(item.id, field);
  options.splice(Math.floor(Math.random()*(options.length+1)), 0, correct);
  const answer = options.indexOf(correct);
  const prompt = field==="use" ? "What is it for?" : "Which check matters?";
  app.innerHTML =
    "<p class='score'>"+esc(item.name)+" · "+(field==="use"?"Use":"The check")+" · "+(kitAt+1)+" of "+kitQueue.length+" · "+esc(scoreLine("kit"))+"</p>"+
    "<h1>"+esc(item.name)+"</h1>"+
    "<p class='prompt'>"+esc(prompt)+"</p>"+
    options.map(function(opt, i){ return "<button class='choice' data-i='"+i+"'>"+esc(opt)+"</button>"; }).join("")+
    "<p class='fb' id='fb' hidden></p><button class='next' id='next' hidden>Continue</button>";
  say(item.name+". "+prompt);
  armClock(function(){ timeUp("kit", answer, correct, advanceKit); });
  app.querySelectorAll(".choice").forEach(function(btn){
    btn.onclick = function(){
      stopClock();
      const i = Number(btn.getAttribute("data-i"));
      app.querySelectorAll(".choice").forEach(function(b){ b.disabled = true; });
      const ok = i === answer;
      btn.classList.add(ok ? "right" : "wrong");
      if(!ok) app.querySelectorAll(".choice")[answer].classList.add("right");
      mark("kit", ok);
      const fb = document.getElementById("fb");
      fb.hidden = false;
      fb.textContent = (ok ? "Correct. " : "That is incorrect. The correct answer is ") + correct;
      say(fb.textContent);
      const next = document.getElementById("next");
      next.hidden = false;
      next.onclick = advanceKit;
    };
  });
}
function advanceKit(){
  if(kitStep==="use"){ kitStep = "check"; renderKitQ(); return; }
  kitStep = "use";
  kitAt += 1;
  if(kitAt >= kitQueue.length){ say("That list is finished."); renderKitList(); return; }
  renderKitQ();
}

  return OSCE_STATIONS.films.filter(function(film){ return film.mod===mod; });
}
function startFilm(){
  filmMod = "";
  renderFilmGroups();
}

function showFilmMark(){
  const spot = document.getElementById("spot");
  if(!spot || !filmMark) return;
  spot.hidden = false;
  spot.style.left = filmMark.l+"%";
  spot.style.top = filmMark.t+"%";
  spot.style.width = filmMark.w+"%";
  spot.style.height = filmMark.h+"%";
  const label = spot.querySelector("b");
  if(label) label.textContent = filmMark.name;
}
function renderFilmGroups(){
  stopClock();
  const mods = [["xray","X-ray","Chest and abdominal films"],["ct","CT","Computed tomography"],["mri","MRI","Magnetic resonance films"]];
  app.innerHTML =
    "<p class='score'>Radiology · "+esc(scoreLine("film"))+"</p>"+
    "<h1>Radiology</h1>"+
    "<p class='lede'>Choose one heading. The films in that heading open on the next screen. The diagnosis is not in the list.</p>"+
    "<div class='tablets'>"+mods.map(function(row){
      const n = filmsIn(row[0]).length;
      return "<button type='button' class='tablet' data-m='"+row[0]+"'><b>"+esc(row[1])+"</b><span>"+esc(row[2])+" · "+n+" films</span></button>";
    }).join("")+"</div>";
  say("Choose a radiology heading.");
  app.querySelectorAll("[data-m]").forEach(function(btn){
    btn.onclick = function(){
      filmMod = btn.getAttribute("data-m");
      renderFilmList();
    };
  });
}
function renderFilmList(){
  stopClock();
  const names = {xray:"X-ray", ct:"CT", mri:"MRI"};
  const list = filmsIn(filmMod);
  app.innerHTML =
    "<button type='button' class='backrow' id='filmBack'>All headings</button>"+
    "<p class='score'>Radiology · "+esc(scoreLine("film"))+"</p>"+
    "<h1>"+esc(names[filmMod] || "Films")+"</h1>"+
    "<p class='lede'>Choose one film. You get the picture, then the finding, then the treatment.</p>"+
    "<div class='tablets'>"+list.map(function(film){
      return "<button type='button' class='tablet' data-f='"+film.id+"'><b>"+esc(film.blurb)+"</b></button>";
    }).join("")+"</div>"+
    "<p class='fine'>"+(filmMod==="xray"
      ? "Not listed, because no open-licence radiograph was available: tracheostomy-tube malposition, feeding-tube malposition, chest-drain malposition, pulmonary-artery catheter malposition, and pulmonary hemorrhage."
      : filmMod==="ct"
      ? "Not listed, because no separate open-licence CT was available: aspiration pneumonitis and hemoperitoneum."
      : filmMod==="mri"
      ? "Not listed, because no separate open-licence MRI was available: hypoxic-ischemic brain injury, cerebral edema with herniation, and cerebellar arterial infarction."
      : "")+"</p>";
  say((names[filmMod] || "This heading")+". Choose a film.");
  document.getElementById("filmBack").onclick = function(){ renderFilmGroups(); };
  app.querySelectorAll("[data-f]").forEach(function(btn){
    btn.onclick = function(){ renderFilm(btn.getAttribute("data-f"), "finding"); };
  });
}
function renderFilm(id, stepName){
  const film = OSCE_STATIONS.films.find(function(item){ return item.id===id; });
  const step = shuffled(film[stepName]);
  const box = (window.FILM_SPOT && FILM_SPOT[film.id]) || {l:30,t:26,w:40,h:36};
  filmMark = {l:box.l,t:box.t,w:box.w,h:box.h,name:film.title};
  app.innerHTML =
    "<button type='button' class='backrow' id='radBack'>Radiology</button>"+
    "<p class='score'>"+esc(film.modLabel)+" · "+esc(scoreLine("film"))+"</p>"+
    "<p class='mod'>"+esc(film.modLabel)+"</p>"+
    "<div class='lightbox'><div class='filmshot'><img src='"+esc(film.src)+"?v=20261028d' alt='"+esc(film.modLabel)+" for this station'>"+
    "<div id='spot' class='spot' hidden style='left:"+box.l+"%;top:"+box.t+"%;width:"+box.w+"%;height:"+box.h+"%'><b>"+esc(film.title)+"</b></div></div></div>"+
    "<p class='lede'>"+esc(film.stem)+"</p>"+
    "<p class='prompt'>"+esc(step.prompt)+"</p>"+
    step.options.map(function(opt, i){ return "<button class='choice' data-i='"+i+"'>"+esc(opt)+"</button>"; }).join("")+
    "<p class='fb' id='fb' hidden></p><button class='next' id='next' hidden>Continue</button>";
  document.getElementById("radBack").onclick = function(){ stopClock(); renderFilmGroups(); };
  say(film.stem+" "+step.prompt);
  const filmLead = stepName==="finding" ? film.title+". " : "";
  armClock(function(){ timeUp("film", step.answer, step.options[step.answer] + ". " + filmLead + step.say, function(){ advanceFilm(id, stepName); }); });
  app.querySelectorAll(".choice").forEach(function(btn){
    btn.onclick = function(){
      stopClock();
      const i = Number(btn.getAttribute("data-i"));
      app.querySelectorAll(".choice").forEach(function(b){ b.disabled = true; });
      const ok = i === step.answer;
      btn.classList.add(ok ? "right" : "wrong");
      if(!ok) app.querySelectorAll(".choice")[step.answer].classList.add("right");
      mark("film", ok);
      const fb = document.getElementById("fb");
      fb.hidden = false;
      const lead = filmLead;
      fb.textContent = (ok ? "Correct. " : "That is incorrect. The correct answer is " + step.options[step.answer] + ". ") + lead + step.say;
      showFilmMark();
      say(fb.textContent);
      const next = document.getElementById("next");
      next.hidden = false;
      next.textContent = stepName==="finding" ? "Ask the treatment" : "Back to the films";
      next.onclick = function(){ advanceFilm(id, stepName); };
    };
  });
}
function advanceFilm(id, stepName){
  if(stepName==="finding"){ renderFilm(id, "treat"); return; }
  renderFilmList();
}

function start(){
  if(mode==="abg") startAbg();
  else if(mode==="drug") startDrug();
  else if(mode==="ecg") startEcg();
  else if(mode==="kit") startKit();
  else if(mode==="film") startFilm();
  else home();
}
start();
