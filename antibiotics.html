<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Drugs and doses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--fg:#f3efe6;--muted:#b7b1a4;--faint:#8a8478;--line:rgba(243,239,230,.18);--cool:#7fd4e6;--warm:#e2b48a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh;padding:16px 16px 48px}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:42rem;margin:0 auto}
.kicker{margin:0;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--faint)}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:40px;letter-spacing:-.03em;line-height:.95;margin:8px 0}
h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 0}
.lede{color:var(--muted);line-height:1.45;margin:12px 0 0}
.notice{margin:16px 0 0;padding:12px 14px;border:1px solid rgba(226,180,138,.45);border-radius:16px;color:var(--warm);line-height:1.45}
.find{width:100%;margin-top:16px;background:#0c1822;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 4px}
.chips button{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chips button.on{border-color:var(--cool);color:var(--cool)}
.count{margin:14px 0 0;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--faint)}
.drug{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:44px}
.drug b{display:block;font-size:17px}
.drug span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.drug i{display:block;margin-top:4px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--faint)}
.back{display:flex;margin-left:auto;background:none;border:0;color:var(--muted);min-height:44px;padding:8px 0}
.dose{color:var(--cool);line-height:1.45;margin:12px 0 0}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;scroll-margin-top:12px}
.sec p{color:var(--muted);line-height:1.5;margin:8px 0 0}
.note{color:var(--muted);line-height:1.45;margin:8px 0 0}
.foot{margin-top:28px;color:var(--faint);line-height:1.45;font-size:14px}
.empty{color:var(--muted);border-top:1px solid var(--line);padding:18px 0}
a{color:var(--cool)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">[{"id": "pip-tazo", "name": "Piperacillin–tazobactam", "group": "Beta-lactams", "doseLine": "4.5 g IV every 6 hours, extended infusion in shock", "identity": "Piperacillin–tazobactam. Ureidopenicillin plus a beta-lactamase inhibitor. Intravenous powder only, commonly 2.25 g, 3.375 g and 4.5 g vials (4 g piperacillin with 0.5 g tazobactam in the 4.5 g vial). No oral product.", "mechanism": "Piperacillin binds penicillin-binding proteins and stops peptidoglycan cross-linking. Tazobactam inhibits many class A beta-lactamases. The combination is bactericidal.", "spectrum": "Streptococci, many methicillin-susceptible staphylococci, ampicillin-susceptible enterococci, Enterobacterales, Pseudomonas aeruginosa and many anaerobes, including Bacteroides. Not MRSA. Not reliable definitive therapy for ESBL producers. Inactive against carbapenemase producers.", "indications": "Empiric IV therapy when Pseudomonas and anaerobes are both plausible: severe intra-abdominal infection, hospital pneumonia, diabetic foot infection, undifferentiated sepsis. Pair with vancomycin if MRSA is possible. Not preferred definitive treatment of serious ESBL infection.", "adult": "Normal renal function, severe infection: 4.5 g IV every 6 hours. In septic shock infuse each dose over 3 to 4 hours. Usual ceiling is 4.5 g every 6 hours (18 g piperacillin and 2 g tazobactam per day). After stability, some units use 4.5 g over 4 hours every 8 hours.", "pkpd": "Time-dependent killing. Efficacy tracks the time free drug stays above the MIC; critical illness often aims for the whole dosing interval. Extracellular distribution, renal clearance, good lung and peritoneal levels with prolonged infusion. Poor CSF penetration. Not a meningitis drug.", "renal": "CrCl above 40 mL/min: standard dose. CrCl 20–40: 2.25 g every 6 hours; nosocomial pneumonia labels often keep 3.375 g every 6 hours. CrCl below 20: 2.25 g every 8 hours (every 6 hours on some pneumonia labels). Haemodialysis: 2.25 g every 8 hours plus 0.75 g after dialysis. CRRT and SLED clear the drug. A common ICU practice, not a single labeled milligram, is 4.5 g every 6–8 hours as an extended infusion, matched to effluent rate. Do not cut the first emergency dose for AKI.", "hepatic": "No hepatic dose change. Vials carry a sodium load, which matters in fluid-overloaded cirrhosis, but that is not a reason to underdose shock.", "resistance": "Destroyed by KPC, OXA-48, NDM, VIM and IMP. ESBL producers may look susceptible and still fail in bacteraemia. AmpC derepression and porin loss reduce activity. Pseudomonas may lose OprD or increase efflux. Tazobactam does not restore MRSA.", "adverse": "Diarrhoea, rash, interstitial nephritis, cytopenias on long courses, hypokalaemia, and seizures if the dose far exceeds clearance. Kidney injury is reported more often with concurrent vancomycin. Sodium load. A positive direct Coombs test can occur.", "interactions": "Do not mix with an aminoglycoside in the same bag. Vancomycin combination needs daily creatinine review. Probenecid can raise penicillin exposure. Do not assume valproate stays therapeutic. Warfarin effect is variable.", "monitoring": "Creatinine and urine output daily in ICU. Electrolytes. Blood count if the course exceeds a week. Mental status when clearance is falling. Beta-lactam levels where the laboratory offers them, especially with augmented clearance, CRRT or obesity.", "special": "Septic shock: full dose now, extended infusion, source control in parallel. Meningitis: do not use. Obesity: keep the gram dose and prolong the infusion rather than inventing a mg/kg regimen. Pregnancy: an acceptable beta-lactam when treatment is required. Penicillin anaphylaxis: avoid. No extra dose for immunosuppression.", "stewardship": "Narrow as soon as cultures allow. Do not leave it as definitive ESBL bacteraemia therapy. After source control, complicated intra-abdominal infection is often about 4 days if the patient is improving. There is no oral piperacillin–tazobactam; step down only to a susceptible oral agent. Do not add it by reflex to a carbapenem."}, {"id": "cefepime", "name": "Cefepime", "group": "Beta-lactams", "doseLine": "2 g IV every 8 hours; extend the infusion in shock", "identity": "Cefepime. Fourth-generation cephalosporin. Intravenous powder, 1 g and 2 g vials. No oral formulation.", "mechanism": "Binds penicillin-binding proteins, including PBP3 of Gram-negatives, and blocks cell-wall cross-linking. Zwitterion that enters Gram-negative porins readily. Bactericidal.", "spectrum": "Streptococci, methicillin-susceptible staphylococci, many Enterobacterales including AmpC producers, and Pseudomonas aeruginosa. Weak anaerobes. Not MRSA, not enterococci, not ESBL as preferred therapy, not carbapenemases, not atypicals.", "indications": "Hospital pneumonia, febrile neutropenia, and severe sepsis when Pseudomonas is plausible and anaerobes are not the main concern. Add metronidazole if a gut source needs anaerobic cover. Targeted therapy for susceptible AmpC or Pseudomonas isolates.", "adult": "Severe infection, normal kidneys: 2 g IV every 8 hours, each dose over 30 minutes, or over 3 to 4 hours in septic shock. Moderate infection: 2 g every 12 hours. Usual maximum 6 g/day.", "pkpd": "Time-dependent. Target free-drug time above MIC, often the full interval in shock. Renally cleared, modest protein binding, adequate lung levels. CSF penetration is enough for some Gram-negative meningitis regimens when the dose is high, but it is not first choice if a better agent is susceptible.", "renal": "Essential adjustment. CrCl above 60: standard. CrCl 30–60: 2 g every 12 hours. CrCl 11–29: 2 g every 24 hours. CrCl below 11: 1 g every 24 hours. Haemodialysis: 1 g on day 1 then 500 mg every 24 hours, after dialysis on dialysis days; some severe-infection protocols use 1–2 g after each session and then follow levels or mental status. CRRT: commonly 2 g every 8–12 hours, not the anuric dose. SLED: redose with pharmacy around the session. Recheck as soon as AKI or recovery starts. Do not reduce the first dose.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Stable to many AmpC enzymes, so it is a targeted option for Enterobacter, Citrobacter and Serratia if susceptible. Destroyed by ESBLs in serious infection despite some susceptible reports, and by carbapenemases. Pseudomonas efflux and OprD changes cause resistance. No MRSA activity.", "adverse": "The characteristic toxicity is encephalopathy, myoclonus and seizures, especially when the dose is not cut for falling clearance. Also rash, diarrhoea, cytopenias and a positive Coombs test.", "interactions": "May raise the nephrotoxicity signal when combined with other toxins, though the vancomycin interaction is best described with piperacillin. Aminoglycosides: do not mix in one bag. Can interfere with some urine glucose tests.", "monitoring": "Creatinine daily. Mental status every shift while on high doses or renal replacement. Blood count on prolonged courses. Stop and rethink if new confusion or myoclonus appears. Levels if a beta-lactam assay exists.", "special": "Septic shock: 2 g immediately, prolonged infusion, add anaerobic cover only if the source needs it. Meningitis: only with specialist dosing and a susceptible organism. Obesity: standard gram dose plus prolonged infusion. Pregnancy: generally acceptable. Severe penicillin anaphylaxis: cross-reactivity is low but not zero; avoid if the history is anaphylaxis unless allergy advice says otherwise. Neurotoxicity risk is higher with pre-existing brain injury.", "stewardship": "Step down when Pseudomonas and AmpC are excluded. Do not use it as ESBL bacteraemia therapy. Febrile neutropenia can stop with neutrophil recovery and no documented infection. No oral cefepime. Do not continue it through unexplained encephalopathy."}, {"id": "ceftazidime", "name": "Ceftazidime", "group": "Beta-lactams", "doseLine": "2 g IV every 8 hours for severe susceptible infection", "identity": "Ceftazidime. Third-generation antipseudomonal cephalosporin. Intravenous powder, 1 g and 2 g. No oral product. Distinct from ceftazidime–avibactam.", "mechanism": "Inhibits penicillin-binding proteins and cell-wall synthesis. Bactericidal. The side chain that gives Pseudomonas activity is the same family as aztreonam, which is why those two allergies can cross.", "spectrum": "Pseudomonas aeruginosa and many Enterobacterales. Weaker streptococci and staphylococci than ceftriaxone. Almost no anaerobes, no MRSA, no enterococci, no atypicals. Not reliable against ESBL, AmpC derepressed strains or any carbapenemase.", "indications": "Targeted therapy for susceptible Pseudomonas or Gram-negative infection when a narrower agent will not do. Empiric hospital infection only if local Pseudomonas coverage is still trustworthy and anaerobes are covered separately when needed.", "adult": "Severe infection: 2 g IV every 8 hours, infused over 30 minutes, longer if the patient is in shock. Usual maximum 6 g/day.", "pkpd": "Time-dependent, renally cleared, extracellular. Lung levels are adequate. CSF penetration supports selected Gram-negative meningitis at high dose. Poor anaerobic and Gram-positive killing.", "renal": "CrCl above 50: 2 g every 8 hours. CrCl 31–50: 1 g every 12 hours. CrCl 16–30: 1 g every 24 hours. CrCl 6–15: 500 mg every 24 hours. CrCl below 5: 500 mg every 48 hours. Haemodialysis: 1 g load, then 1 g after each session. CRRT: commonly 2 g every 8–12 hours rather than the anuric dose. Label bands are for intermittent clearance; ask pharmacy to match a high-effluent circuit. Neurotoxicity if the anuric dose is used by mistake in a patient whose clearance has returned.", "hepatic": "No hepatic dose change.", "resistance": "Hydrolysed by ESBL, AmpC and all carbapenemases. Pseudomonas resistance by efflux, porin loss and acquired beta-lactamases is common in ICU. Avibactam is a different product and restores some of those enzymes.", "adverse": "Rash, diarrhoea, positive Coombs, cytopenias, and encephalopathy or seizures when drug accumulates.", "interactions": "Do not mix with aminoglycosides. Nephrotoxins raise the chance of accumulation. Warfarin effect is unpredictable. Shares an allergy side chain with aztreonam.", "monitoring": "Creatinine, mental status, blood count on long courses. Clinical response and cultures.", "special": "Septic shock: full 2 g dose first, then adjust. Meningitis: 2 g every 8 hours only for a susceptible organism, with renal adjustment. Obesity: no mg/kg formula. Pregnancy: acceptable when indicated. Avoid if the patient has anaphylaxis to ceftazidime or aztreonam.", "stewardship": "A workhorse of the past, now often too narrow or already resistant. De-escalate to ceftriaxone or nothing once Pseudomonas is excluded. Do not use for gut sepsis without metronidazole. No oral step-down inside the same drug."}, {"id": "ceftriaxone", "name": "Ceftriaxone", "group": "Beta-lactams", "doseLine": "2 g IV every 24 hours; meningitis 2 g every 12 hours", "identity": "Ceftriaxone. Third-generation cephalosporin. Intravenous or intramuscular powder, 1 g and 2 g. No oral formulation. Long half-life allows once-daily dosing.", "mechanism": "Binds penicillin-binding proteins and stops cell-wall synthesis. Bactericidal. Dual biliary and renal elimination.", "spectrum": "Streptococci including most pneumococci, methicillin-susceptible staphylococci (not a first MSSA bacteraemia drug), Neisseria, Haemophilus and many community Enterobacterales. Not Pseudomonas, not enterococci, not MRSA, not atypicals, not ESBL, weak anaerobes.", "indications": "Community pneumonia with a macrolide or doxycycline, community Gram-negative bacteraemia and pyelonephritis when susceptible, meningitis at the high dose, and targeted step-in once cultures allow. Gonorrhoea uses a separate single intramuscular dose and is not an ICU regimen.", "adult": "Most severe infections: 1–2 g IV every 24 hours; use 2 g in ICU. Meningitis: 2 g IV every 12 hours. Infuse over 30 minutes. Usual maximum 4 g/day. Do not mix in the same line as calcium-containing solutions.", "pkpd": "Time-dependent, high protein binding, once-daily because of the long half-life. Excellent CSF levels at meningitis doses. Biliary excretion causes sludge. Lung and urine levels are adequate for susceptible organisms.", "renal": "No change for isolated renal impairment at usual doses, including most haemodialysis patients. Combined severe renal and hepatic failure: do not exceed 2 g/day without a reason, and watch for accumulation. CRRT and SLED do not usually require a reduction at 2 g daily. Augmented clearance does not have a standard increase; meningitis already uses 2 g every 12 hours.", "hepatic": "No routine hepatic reduction. In combined severe liver and kidney failure, cap exposure and watch bilirubin and prothrombin time. Biliary sludge and pseudolithiasis are the hepatic caution, especially in children and on prolonged high doses.", "resistance": "ESBL, AmpC and carbapenemases destroy it. Pneumococcal resistance is still uncommon in many regions but must be checked in meningitis. No Pseudomonas activity to begin with.", "adverse": "Rash, diarrhoea, biliary sludge, cholestasis, cytopenias, and rarely haemolytic anaemia or encephalopathy. Calcium-ceftriaxone precipitates are dangerous, particularly in neonates, where the combination is contraindicated.", "interactions": "Do not co-infuse with calcium. In adults, sequential use through one line needs a thorough flush. Warfarin effect may increase. Can displace bilirubin from albumin in neonates.", "monitoring": "Clinical response. Liver tests if the course is long or jaundice appears. Creatinine does not set the dose but severe dual organ failure does. Blood count if treatment is prolonged. No drug level in routine practice.", "special": "Septic shock from community pneumonia or meningitis: give 2 g immediately; meningitis stays at 2 g every 12 hours. Obesity: no weight-based increase. Pregnancy: widely used when needed. Penicillin anaphylaxis: decide with the allergy history; side-chain cross-reactivity is low for ceftriaxone. Immunocompromise does not change the gram dose but widens the organisms you must still cover.", "stewardship": "The default narrow step-down from piperacillin–tazobactam or a carbapenem when cultures grow a susceptible community Gram-negative or streptococcus. Stop at 5 days for improving community pneumonia if the patient is stable. Do not use for hospital Pseudomonas cover, ESBL, or MRSA. No oral ceftriaxone; switch to a susceptible oral agent."}, {"id": "cefazolin", "name": "Cefazolin", "group": "Beta-lactams", "doseLine": "2 g IV every 8 hours for serious MSSA infection", "identity": "Cefazolin. First-generation cephalosporin. Intravenous powder, 1 g and 2 g. No oral cefazolin; cephalexin is a different oral first-generation agent.", "mechanism": "Inhibits penicillin-binding proteins and cell-wall synthesis. Bactericidal, with particular affinity for staphylococcal PBPs.", "spectrum": "Methicillin-susceptible Staphylococcus aureus, streptococci, and a narrow set of community Enterobacterales such as many E. coli, Klebsiella and Proteus mirabilis. Not MRSA, not Pseudomonas, not enterococci, not anaerobes, not ESBL.", "indications": "First-line targeted IV therapy for MSSA bacteraemia, bone and joint infection and skin infection once susceptibilities are known. Surgical prophylaxis: 2 g (3 g if body weight is at least 120 kg) within 60 minutes before incision.", "adult": "Serious MSSA infection: 2 g IV every 8 hours. Skin and many other infections: 1–2 g every 8 hours. Infuse over 30 minutes. Prophylaxis is a single pre-incision dose, repeated intra-operatively about every 4 hours if the wound is still open. Usual treatment ceiling is 6 g/day.", "pkpd": "Time-dependent, renally cleared, high protein binding relative to other cephalosporins. Good bone and skin levels. Inadequate CSF levels, so not for meningitis. Inoculum effect against some type A beta-lactamase MSSA isolates is debated; most MSSA bacteraemia is still treated with cefazolin.", "renal": "CrCl above 35 mL/min: every 8 hours. CrCl 10–34: 1–2 g every 12 hours. CrCl below 10: 1–2 g every 24 hours. Haemodialysis: 1–2 g after dialysis, or every 24 hours with the dialysis-day dose given after the session. CRRT: commonly 2 g every 12 hours, sometimes every 8 hours on high-effluent circuits. SLED: give a dose after the session and ask pharmacy if sessions are daily.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Any mecA MRSA is intrinsically resistant. Gram-negatives with ESBL, AmpC or carbapenemases are resistant. Enterococci and Pseudomonas are intrinsically resistant.", "adverse": "Rash, diarrhoea, cytopenias, eosinophilia, and rarely encephalopathy if it accumulates. Less phlebitis than antistaphylococcal penicillins.", "interactions": "Probenecid can raise levels. Do not mix with aminoglycosides. Warfarin interaction is minor and variable.", "monitoring": "Creatinine. Blood count on courses lasting more than a week. Clinical response. No routine level.", "special": "Septic shock due to suspected MSSA: start vancomycin or another MRSA drug until methicillin susceptibility is known, then switch. Meningitis: do not use. Obesity: prophylaxis rises to 3 g at or above 120 kg; treatment usually stays 2 g every 8 hours. Pregnancy: acceptable. Penicillin anaphylaxis: cefazolin side-chain cross-reactivity with penicillins is low, and many protocols allow it after non-severe penicillin allergy.", "stewardship": "The preferred definitive MSSA bacteraemia drug in most adults, for about 14 days from the first negative blood culture if the course is uncomplicated, longer for endocarditis or osteomyelitis. Stop vancomycin the day MSSA is confirmed. Oral step-down, when the syndrome allows, is usually cephalexin or another susceptible oral agent, not a prolonged IV default."}, {"id": "ceftaroline", "name": "Ceftaroline", "group": "Beta-lactams", "doseLine": "600 mg IV every 12 hours; some MRSA bacteraemia regimens use every 8 hours", "identity": "Ceftaroline fosamil, the prodrug of ceftaroline. Advanced-generation cephalosporin with MRSA binding. Intravenous powder equivalent to 600 mg ceftaroline. No oral product. Filed here, and also relevant to the Gram-positive list.", "mechanism": "The active drug binds PBP2a of MRSA as well as usual penicillin-binding proteins. Bactericidal. Fosamil is converted rapidly in plasma.", "spectrum": "MRSA, methicillin-susceptible staphylococci, streptococci including penicillin-resistant pneumococci, and some Enterobacterales. Not Pseudomonas, not anaerobes of consequence, not ESBL or carbapenemase producers, not enterococci, not atypicals.", "indications": "Licensed for complicated bacterial skin infection and community-acquired bacterial pneumonia. Off-label, with microbiology advice, for MRSA bacteraemia salvage or when vancomycin has failed or cannot be used. Not an empiric hospital Gram-negative drug.", "adult": "Standard: 600 mg IV every 12 hours, infused over 1 hour. For MRSA bacteraemia, published regimens often use 600 mg every 8 hours. Do not exceed that without specialist advice. Duration follows the syndrome, not a ceftaroline-specific maximum gram dose beyond 600 mg every 8 hours.", "pkpd": "Time-dependent, renally cleared, converted from the prodrug. Lung levels support community pneumonia. Bacteraemia data are largely observational. CSF data are limited.", "renal": "CrCl above 50: 600 mg every 12 hours. CrCl 31–50: 400 mg every 12 hours. CrCl 15–30: 300 mg every 12 hours. Haemodialysis and CrCl below 15: 200 mg every 12 hours, after dialysis on dialysis days. The every-8-hour bacteraemia schedule also needs a renal reduction; do not invent it at the bedside, ask pharmacy. CRRT: label is silent; many centres start from the CrCl 30–50 band and adjust. Do not give a full unadjusted dose in anuria.", "hepatic": "No hepatic adjustment stated.", "resistance": "MRSA with altered PBP2a can become resistant, still uncommon. Enterobacterales resistance is ordinary beta-lactamase mediated. No antipseudomonal claim to lose.", "adverse": "Rash, diarrhoea, positive Coombs with or without haemolytic anaemia, cytopenias, and rare eosinophilic pneumonia. Neurotoxicity if accumulated.", "interactions": "Few CYP interactions. Do not mix casually with other IV drugs. Probenecid may increase exposure.", "monitoring": "Creatinine. Blood count and a haemolysis review on prolonged courses. Respiratory status if new infiltrates appear, because of eosinophilic pneumonia. No routine level.", "special": "Septic shock: this is not broad enough to be the only Gram-negative agent. Meningitis: not an established regimen. Obesity: no labeled weight adjustment. Pregnancy: limited data; use if the benefit is clear. Severe cephalosporin allergy: avoid. Useful when vancomycin MIC creep, rash or nephrotoxicity forces a change and the isolate is susceptible.", "stewardship": "Do not use it as a carbapenem substitute. Skin infection and improving pneumonia should step down to an oral MRSA agent such as linezolid, doxycycline or co-trimoxazole when the isolate allows. Keep the every-8-hour dose for bacteraemia salvage, not for every skin infection. Stop if the organism is MSSA and cefazolin will do."}, {"id": "meropenem", "name": "Meropenem", "group": "Beta-lactams", "doseLine": "1 g IV every 8 hours; meningitis 2 g every 8 hours, over 3 hours", "identity": "Meropenem. Carbapenem. Intravenous powder, 500 mg and 1 g. No oral meropenem.", "mechanism": "Binds penicillin-binding proteins, especially PBP2 and PBP3, and resists many beta-lactamases including ESBL and AmpC. Bactericidal.", "spectrum": "Broad Gram-positives except MRSA and most enterococci, almost all anaerobes, Enterobacterales including ESBL and AmpC producers, and Pseudomonas aeruginosa. Not atypicals, not Stenotrophomonas, not MRSA. Carbapenemase producers (KPC, OXA-48, NDM) are resistant.", "indications": "First-line serious ESBL infection, hospital sepsis when resistant Gram-negatives are likely, necrotising infection with polymicrobial flora, and bacterial meningitis at the high dose. Step down once a narrower susceptible drug is known.", "adult": "Severe infection: 1 g IV every 8 hours. Meningitis and some high-MIC infections: 2 g every 8 hours. Infuse each dose over 3 hours in septic shock. Usual maximum 6 g/day.", "pkpd": "Time-dependent. Prolonged infusion raises free-drug time above MIC. Renally cleared, low protein binding, excellent tissue and inflamed-CSF penetration. Valproate interaction is a distribution-of-effect problem as much as a level problem.", "renal": "CrCl above 50: standard. CrCl 26–50: the usual dose every 12 hours. CrCl 10–25: half the usual dose every 12 hours. CrCl below 10: half the usual dose every 24 hours. Haemodialysis: dose after the session. CRRT: commonly 1–2 g every 8–12 hours depending on effluent; do not use the anuric intermittent dose on a running circuit. SLED: redose after the session or follow a local table. First emergency dose is unreduced.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Carbapenemases, porin loss plus AmpC or ESBL, and Pseudomonas efflux or OprD loss. Klebsiella pneumoniae carbapenemase is the usual KPC. Metallo-beta-lactamases need a different drug. Stenotrophomonas is intrinsically resistant.", "adverse": "Rash, diarrhoea, nausea, cytopenias, and seizures at a lower rate than imipenem but still real if the dose ignores kidney function. C. difficile.", "interactions": "Carbapenems can drop valproate concentrations within days and cause seizures. Do not combine them unless epilepsy advice has a plan. Probenecid raises meropenem. Do not mix with other drugs in one syringe.", "monitoring": "Creatinine. Mental status and seizure history. Blood count on long courses. Valproate level if the combination was unavoidable. Cultures so the drug can be narrowed.", "special": "Septic shock: 1 or 2 g now over a prolonged infusion. Meningitis: 2 g every 8 hours with renal adjustment. Obesity: gram dose, not mg/kg, plus 3-hour infusion. Pregnancy: acceptable when a severe infection requires it. Penicillin anaphylaxis: cross-reactivity is low; still avoid if the history is severe unless allergy advice agrees. Immunosuppression does not change the dose.", "stewardship": "The drug most often left on too long. De-escalate to ertapenem, ceftriaxone or piperacillin–tazobactam when Pseudomonas and carbapenem resistance are excluded. Intra-abdominal courses after source control are short if the patient improves. No oral meropenem."}, {"id": "imipenem", "name": "Imipenem–cilastatin", "group": "Beta-lactams", "doseLine": "500 mg IV every 6 hours, or 1 g every 6–8 hours for severe infection", "identity": "Imipenem with cilastatin. Carbapenem plus a renal dehydropeptidase inhibitor that stops the kidney breaking imipenem down. Intravenous powder, commonly 500/500 mg. Not the relebactam product.", "mechanism": "Imipenem inhibits penicillin-binding proteins. Cilastatin has no antibacterial effect. Bactericidal, time-dependent.", "spectrum": "Similar breadth to meropenem: ESBL and AmpC Enterobacterales, many anaerobes, Gram-positives except MRSA, and Pseudomonas. Slightly more seizure risk. Enterococcus faecalis is often susceptible; E. faecium is not. Not Stenotrophomonas, not carbapenemases.", "indications": "Severe polymicrobial or resistant Gram-negative infection when meropenem is unsuitable. Not preferred for meningitis because of seizures. Targeted Pseudomonas therapy only if susceptible and a safer antipseudomonal drug is not available.", "adult": "500 mg IV every 6 hours, or 1 g every 6 to 8 hours for severe infection, infused over 30–60 minutes. Do not exceed 4 g/day of imipenem or 50 mg/kg/day, whichever is lower. Doses above 500 mg increase seizure risk if clearance is low.", "pkpd": "Time-dependent, renally cleared as a pair with cilastatin. Tissue penetration is broad. CSF entry plus seizure threshold makes it a poor meningitis choice.", "renal": "CrCl at least 60–90: standard, with some labels already reducing between 60 and 89. CrCl 30–59: about 500 mg every 6–8 hours. CrCl 15–29: 500 mg every 12 hours or 250 mg every 6 hours depending on the product table. Haemodialysis: 250–500 mg every 12 hours after dialysis. CRRT: commonly 500 mg every 6–8 hours. Match the exact vial table; seizure risk is the reason not to guess upward.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Same carbapenemase, porin and efflux problems as meropenem. Cilastatin does not inhibit beta-lactamases.", "adverse": "Seizures are the characteristic toxicity, especially with high dose, kidney failure, or brain injury. Nausea during fast infusion, rash, cytopenias, C. difficile.", "interactions": "Valproate concentrations collapse. Ganciclovir and the seizure threshold are a concern if both are required. Do not mix with other beta-lactams in one bag.", "monitoring": "Creatinine. Seizure precautions. Blood count. Stop or reduce at the first myoclonus. Valproate level if co-prescribed.", "special": "Septic shock: a full dose is reasonable, but meropenem is usually easier to infuse over 3 hours. Meningitis: avoid. Obesity: respect the 50 mg/kg ceiling as well as 4 g. Pregnancy: use if needed. Penicillin anaphylaxis: same caution as other carbapenems. Avoid or reduce aggressively after head injury or known epilepsy.", "stewardship": "Do not choose it over meropenem without a reason. Narrow early. Never use it to treat pneumonia caused by a carbapenem-resistant organism; that needs a newer agent. No oral switch inside the class."}, {"id": "ertapenem", "name": "Ertapenem", "group": "Beta-lactams", "doseLine": "1 g IV every 24 hours", "identity": "Ertapenem. Carbapenem without useful Pseudomonas activity. Intravenous or intramuscular 1 g vial. Once daily.", "mechanism": "Inhibits penicillin-binding proteins and is stable to ESBL and AmpC. Bactericidal. High protein binding explains the long half-life.", "spectrum": "ESBL-producing Enterobacterales, streptococci, methicillin-susceptible staphylococci and many anaerobes. Not Pseudomonas, not Acinetobacter, not MRSA, not enterococci, not carbapenemases, not atypicals.", "indications": "Targeted or step-down therapy for susceptible ESBL infection outside the urinary tract when once-daily dosing helps, community complicated intra-abdominal infection, and diabetic foot infection. Not empiric cover for hospital Pseudomonas.", "adult": "1 g IV every 24 hours, infused over 30 minutes. Maximum 1 g/day. Intramuscular injection is an alternative only when IV access is impossible and the product is licensed for it.", "pkpd": "Time-dependent, highly protein bound, renally cleared. Once-daily exposure is enough for susceptible Enterobacterales. Poor against organisms with higher carbapenem MICs. Limited CSF use.", "renal": "CrCl above 30: 1 g daily. CrCl 30 or below, including haemodialysis: 500 mg daily. If the dose is given within 6 hours before haemodialysis, give a supplemental 150 mg after dialysis. CRRT: protein binding limits removal; many centres keep 1 g daily and do not drop to 500 mg. Confirm locally.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Any carbapenemase. Porin loss can raise MICs. Pseudomonas and Acinetobacter are intrinsically resistant. Do not read an ertapenem-susceptible result as meropenem-equivalent for those organisms.", "adverse": "Diarrhoea, infusion-vein irritation, headache, cytopenias, rare seizures, and C. difficile. Transaminase rise.", "interactions": "Valproate may fall, though the interaction is best documented with other carbapenems; still avoid the combination. Probenecid increases ertapenem.", "monitoring": "Creatinine at the start, because the cut-point is 30 mL/min. Liver tests if treatment is prolonged. Clinical response. No routine level.", "special": "Septic shock with possible Pseudomonas: do not use ertapenem as the only Gram-negative drug. Meningitis: not recommended. Obesity: 1 g is the labeled dose. Pregnancy: acceptable when indicated. Carbapenem or severe penicillin allergy: avoid unless allergy advice allows it.", "stewardship": "A de-escalation from meropenem when Pseudomonas, Acinetobacter and enterococcus are not involved. Convenient outpatient IV step-down. Stop when an oral susceptible drug will do. Do not use it for CRAB, CRE or hospital septic shock of unknown source."}, {"id": "aztreonam", "name": "Aztreonam", "group": "Beta-lactams", "doseLine": "2 g IV every 8 hours; severe infection every 6–8 hours", "identity": "Aztreonam. Monobactam. Intravenous powder, 1 g and 2 g. The inhaled product used in cystic fibrosis is a different formulation and is not an ICU substitute. Distinct from aztreonam–avibactam.", "mechanism": "Binds PBP3 of Gram-negative aerobes only. Bactericidal. Stable to metallo-beta-lactamases when they are the only enzyme, which is why it is paired with avibactam for NDM producers.", "spectrum": "Aerobic Gram-negatives, including many Pseudomonas and Enterobacterales. No Gram-positive activity, no anaerobes, no atypicals. Destroyed by ESBL, AmpC and KPC unless an inhibitor is added. Metallo-beta-lactamases alone do not hydrolyse it.", "indications": "Gram-negative cover in a patient with true penicillin anaphylaxis, provided there is no ceftazidime allergy. Always combine with a Gram-positive drug and, if the gut is the source, with metronidazole. Not adequate alone for septic shock of unknown source.", "adult": "2 g IV every 8 hours for serious infection; every 6 hours is used for more severe disease. Infuse over 30–60 minutes. Maximum 8 g/day.", "pkpd": "Time-dependent, renally cleared, extracellular. Lung levels are adequate. No useful activity in a mixed Gram-positive infection no matter the concentration.", "renal": "CrCl 10–30: give half the usual dose at the usual interval after a normal first dose. CrCl below 10: give one quarter of the usual dose. Haemodialysis: give one-eighth of the initial dose as a supplement after dialysis, and keep the maintenance dose at one quarter. CRRT: commonly 2 g every 8–12 hours. Do not underdose the first shock dose.", "hepatic": "No hepatic adjustment. The ceftazidime side-chain issue is allergy, not liver metabolism.", "resistance": "ESBL, KPC and AmpC hydrolyse it. NDM, VIM and IMP do not, but the organism often carries a second enzyme, so plain aztreonam fails unless avibactam is added. Pseudomonas efflux and porin changes also cause resistance.", "adverse": "Rash, diarrhoea, transaminase rise, and rarely toxic epidermal necrolysis. Generally well tolerated. Neurotoxicity is uncommon.", "interactions": "Synergy is deliberately used with avibactam or ceftazidime–avibactam for metallo-beta-lactamase producers. Do not mix with other drugs. Nephrotoxins matter only because they change the renal dose.", "monitoring": "Creatinine. Liver tests on prolonged courses. The Gram stain and cultures, because this drug covers only aerobic Gram-negatives.", "special": "Septic shock: never as monotherapy. Meningitis: can enter CSF but is rarely the best agent. Obesity: no mg/kg dose. Pregnancy: acceptable if required. Penicillin anaphylaxis: usually safe. Ceftazidime allergy: avoid, because the side chains cross. Immunosuppression: still add Gram-positive and anaerobic cover as the source demands.", "stewardship": "Stop it when a narrower beta-lactam is allowed by allergy review. Do not treat CRE with aztreonam alone. If the mechanism is NDM, move to aztreonam–avibactam or aztreonam plus ceftazidime–avibactam. No oral aztreonam."}, {"id": "amox-clav", "name": "Amoxicillin–clavulanate", "group": "Beta-lactams", "doseLine": "IV 1.2 g every 8 hours; oral 875/125 mg every 12 hours", "identity": "Amoxicillin plus clavulanate. Aminopenicillin with a beta-lactamase inhibitor. Oral tablets 875/125 mg and 500/125 mg, and, where marketed, intravenous 1.2 g vials (amoxicillin 1 g plus clavulanate 200 mg). The ratio is not interchangeable between products.", "mechanism": "Amoxicillin inhibits cell-wall synthesis. Clavulanate inhibits many class A beta-lactamases, including some ESBLs in the urine, but not AmpC or carbapenemases. Bactericidal.", "spectrum": "Streptococci, methicillin-susceptible staphylococci, ampicillin-susceptible enterococci, Listeria if the amoxicillin dose is adequate, many anaerobes, and community Enterobacterales. Not MRSA, not Pseudomonas, not reliable serious ESBL bacteraemia cover.", "indications": "Oral step-down for susceptible respiratory, bite, urinary and skin infection. Intravenous therapy, where the IV product exists, for moderate community infection. Not empiric monotherapy for septic shock.", "adult": "Oral, normal kidneys: 875/125 mg every 12 hours, or 500/125 mg every 8 hours. Do not double the 875/125 tablet to raise the clavulanate dose. IV, where available: 1.2 g every 8 hours, or every 6 hours for severe infection, infused over 30 minutes. Maximum oral clavulanate is kept at 125 mg per dose in standard tablets.", "pkpd": "Time-dependent. Oral bioavailability of amoxicillin is good. Clavulanate is the part linked to cholestatic hepatitis. Urine levels can exceed serum levels enough to clear some ESBL cystitis even when the serum MIC would fail bacteraemia.", "renal": "Oral CrCl 10–30: avoid the 875 mg tablet; use 500/125 mg every 12 hours. CrCl below 10: 500/125 mg every 24 hours. Haemodialysis: dose after dialysis. IV product labels reduce interval and milligrams below CrCl 30; follow that local label. CRRT: IV therapy often continues at 1.2 g every 6–8 hours. Do not use oral therapy as the only drug in shock.", "hepatic": "Cholestatic hepatitis, sometimes delayed until after the drug has stopped, is the characteristic risk. Previous amoxicillin–clavulanate jaundice is a contraindication. No numeric hepatic reduction; choose a different drug if the liver injury is active.", "resistance": "Plasmid AmpC, carbapenemases and many ESBLs in the bloodstream. MRSA. Pseudomonas is intrinsically resistant. Inhibitor-resistant class A enzymes exist.", "adverse": "Diarrhoea is common. Cholestatic hepatitis is the serious signature, more often in older adults and with longer courses. Rash, C. difficile, and rare interstitial nephritis.", "interactions": "Allopurinol plus amoxicillin raises rash risk. Warfarin effect may increase. Probenecid raises amoxicillin. Methotrexate clearance can fall.", "monitoring": "Liver tests if treatment exceeds a few days or if the patient is older. Creatinine. Stop if jaundice or itching appears and do not rechallenge.", "special": "Septic shock: not sole therapy. Meningitis: ampicillin, not this combination, if Listeria cover is required. Obesity: no change to the oral tablet. Pregnancy: amoxicillin is widely used; treat cholestasis as a reason to stop. Penicillin anaphylaxis: avoid. Epstein–Barr virus: a rash is common and is not always true allergy.", "stewardship": "Prefer amoxicillin alone when clavulanate is not needed. Five days is enough for many respiratory infections. Do not use it to treat ESBL bacteraemia. Stop immediately if cholestatic injury appears."}, {"id": "amp-sul", "name": "Ampicillin–sulbactam", "group": "Beta-lactams", "doseLine": "3 g IV every 6 hours; Acinetobacter needs a high sulbactam dose", "identity": "Ampicillin plus sulbactam. Aminopenicillin with a beta-lactamase inhibitor. Intravenous 1.5 g and 3 g vials. A 3 g vial is ampicillin 2 g plus sulbactam 1 g. No oral amp–sulbactam; sultamicillin is a different oral prodrug where it is sold.", "mechanism": "Ampicillin inhibits cell-wall synthesis. Sulbactam inhibits some class A enzymes and, at high dose, has direct activity against Acinetobacter penicillin-binding proteins. Bactericidal.", "spectrum": "Streptococci, ampicillin-susceptible enterococci, Listeria, many anaerobes, community Enterobacterales, and Acinetobacter when the sulbactam dose is high and the isolate is susceptible. Not MRSA, not Pseudomonas, not reliable ESBL bacteraemia therapy.", "indications": "Community aspiration or head-and-neck infection, susceptible enterococcal or Listeria infection when ampicillin alone is not enough, and, at high sulbactam doses, carbapenem-resistant Acinetobacter when sulbactam–durlobactam is unavailable.", "adult": "Standard severe infection: 3 g IV every 6 hours, infused over 30 minutes. For Acinetobacter, target sulbactam 6–9 g/day in divided doses, for example 3 g every 4 hours (6 g sulbactam) or 9 g of the sulbactam component per day, which exceeds some older labels and needs renal adjustment plus pharmacy check. Usual labeled ceiling is often 4 g sulbactam/day; the Acinetobacter regimen is a specialist exception.", "pkpd": "Time-dependent. Sulbactam exposure is what kills Acinetobacter. Ampicillin handles enterococcus and Listeria. CSF entry of ampicillin is relevant for Listeria meningitis, but the sulbactam component is not why that regimen works; plain ampicillin is preferred for Listeria.", "renal": "CrCl at least 30: standard interval. CrCl 15–29: 1.5–3 g every 12 hours. CrCl 5–14: 1.5–3 g every 24 hours. Haemodialysis: dose after dialysis. High-dose Acinetobacter regimens must be reduced on the same principles; do not give 9 g/day of sulbactam in anuria. CRRT: often closer to the full q6h dose. Ask pharmacy for the Acinetobacter CRRT schedule.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Pseudomonas is intrinsically resistant. ESBL bacteraemia should not be treated with this drug. Acinetobacter resistance to sulbactam is rising; susceptibility must be confirmed. Carbapenemases are not inhibited.", "adverse": "Rash, diarrhoea, interstitial nephritis, cytopenias, and sodium load at high doses. Cholestasis is less characteristic than with clavulanate.", "interactions": "Allopurinol rash risk with the ampicillin component. Do not mix with aminoglycosides. Warfarin effect is variable. High sodium content matters with other fluid.", "monitoring": "Creatinine. Blood count on long or high-dose courses. Acinetobacter cultures and susceptibility. Mental status at high doses in kidney failure.", "special": "Septic shock with possible Pseudomonas: do not rely on this drug. Listeria meningitis: use ampicillin, often with gentamicin, not a low sulbactam dose as the key drug. Obesity: standard vials, and the Acinetobacter dose is in grams of sulbactam, not mg/kg. Pregnancy: acceptable. Penicillin anaphylaxis: avoid. Immunosuppression does not add Pseudomonas cover.", "stewardship": "Use plain ampicillin for susceptible enterococcus and Listeria. Reserve high-dose sulbactam for Acinetobacter, and prefer sulbactam–durlobactam where it is available and the isolate is susceptible. Stop when cultures allow a narrower drug."}, {"id": "caz-avi", "name": "Ceftazidime–avibactam", "group": "Newer resistant Gram-negative agents", "doseLine": "2.5 g IV every 8 hours over 2 hours", "identity": "Ceftazidime plus avibactam. Antipseudomonal cephalosporin with a diazabicyclooctane beta-lactamase inhibitor. Intravenous 2.5 g vial (ceftazidime 2 g and avibactam 0.5 g). No oral product.", "mechanism": "Ceftazidime inhibits cell-wall synthesis. Avibactam inhibits class A (including KPC and ESBL), class C (AmpC) and many class D (OXA-48) enzymes. It does not inhibit class B metallo-enzymes. Bactericidal.", "spectrum": "KPC and OXA-48 producing Enterobacterales, many ESBL and AmpC producers, and some multidrug-resistant Pseudomonas. Not reliable against NDM, VIM or IMP when used alone. Not MRSA, not anaerobes, not Acinetobacter as a class indication.", "indications": "Targeted therapy for KPC or OXA-48 CRE, and for difficult Pseudomonas when susceptible. Combined with aztreonam for metallo-beta-lactamase producers if aztreonam–avibactam is not available. Add metronidazole for intra-abdominal infection because anaerobic cover is weak.", "adult": "2.5 g IV every 8 hours, each dose over 2 hours. This is the ceftazidime 2 g plus avibactam 0.5 g dose. Do not split the ratio.", "pkpd": "Time-dependent for both components. Avibactam needs to be present for the whole interval, which is why the renal dose falls quickly. Extracellular, renally cleared, adequate lung levels. Not a meningitis license.", "renal": "CrCl above 50: 2.5 g every 8 hours. CrCl 31–50: 1.25 g every 8 hours. CrCl 16–30: 0.94 g every 12 hours. CrCl 6–15: 0.94 g every 24 hours. CrCl 5 or below, and haemodialysis: 0.94 g every 48 hours, after dialysis on dialysis days. CRRT: both drugs are cleared; a common ICU practice is to keep 2.5 g every 8 hours over 2 hours rather than the anuric dose. Confirm with pharmacy. Recheck CrCl often, including augmented clearance.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Metallo-beta-lactamases are the hole. KPC variants that resist avibactam have been described. Pseudomonas can still resist by efflux and porin changes. Do not use it for CRAB.", "adverse": "Diarrhoea, nausea, positive Coombs, anxiety and encephalopathy if accumulated, transaminase rise, and C. difficile.", "interactions": "The useful interaction is with aztreonam against MBL producers: give both, on a schedule pharmacy writes, because they should overlap. Probenecid is not a useful booster. Do not mix with aminoglycosides.", "monitoring": "Creatinine at least daily in ICU. Liver tests. Blood count. Clinical response. No routine therapeutic level.", "special": "Septic shock due to suspected CRE: start as soon as the risk is real, and add a second active agent only if the local CRE guidance says so. Meningitis: not an established dose. Obesity: no labeled mg/kg change. Pregnancy: use if the infection is life-threatening and no safer active drug exists. Ceftazidime or severe cephalosporin allergy: avoid. Immunosuppression does not change the gram dose.", "stewardship": "Reserve for documented or highly likely KPC, OXA-48 or DTR Pseudomonas. Stop if the isolate is meropenem susceptible. Duration follows the syndrome, often 7 days or less after source control. There is no oral step-down of this combination."}, {"id": "tol-tazo", "name": "Ceftolozane–tazobactam", "group": "Newer resistant Gram-negative agents", "doseLine": "Pneumonia 3 g IV every 8 hours; other sites 1.5 g every 8 hours", "identity": "Ceftolozane plus tazobactam. Antipseudomonal cephalosporin with a beta-lactamase inhibitor. Intravenous vials. The 1.5 g dose is ceftolozane 1 g plus tazobactam 0.5 g. The pneumonia dose is 3 g (2 g plus 1 g).", "mechanism": "Ceftolozane is stable to many Pseudomonas resistance mechanisms, including efflux and AmpC. Tazobactam covers some class A enzymes. Bactericidal. Not a carbapenemase inhibitor of consequence.", "spectrum": "Difficult-to-treat Pseudomonas aeruginosa and some ESBL Enterobacterales. Not CRE, not CRAB, not reliable anaerobes, not MRSA, not enterococci.", "indications": "Hospital and ventilator pneumonia and other serious infections caused by susceptible Pseudomonas, including some carbapenem-resistant but ceftolozane-susceptible strains. Complicated intra-abdominal infection only in combination with metronidazole. Not a CRE drug.", "adult": "Pneumonia: 3 g IV every 8 hours over 1 hour. Complicated urinary or intra-abdominal infection: 1.5 g IV every 8 hours over 1 hour. Use the pneumonia dose for serious ICU infection outside the urinary tract unless microbiology advises otherwise.", "pkpd": "Time-dependent, renally cleared, excellent lung levels at the 3 g dose. The urinary 1.5 g dose under-doses pneumonia. Tazobactam does not restore carbapenemase producers.", "renal": "Pneumonia, CrCl above 50: 3 g every 8 hours. CrCl 30–50: 1.5 g every 8 hours. CrCl 15–29: 750 mg every 8 hours. Haemodialysis: 2.25 g loading dose, then 450 mg every 8 hours, after dialysis. Non-pneumonia doses are half of those bands (1.5 g, then 750 mg, then 375 mg every 8 hours; dialysis 750 mg load then 150 mg every 8 hours). CRRT: commonly the full indication dose every 8 hours. The label is thin here; confirm locally.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Carbapenemases, especially metallo-enzymes, and emerging ceftolozane-resistant Pseudomonas. Does not cover CRAB. ESBL bacteraemia is still usually a carbapenem if meropenem is susceptible and the source is not Pseudomonas.", "adverse": "Diarrhoea, nausea, pyrexia, transaminase rise, positive Coombs, and C. difficile. Neurotoxicity if the renal dose is missed.", "interactions": "No important CYP interactions. Add metronidazole when anaerobes matter. Do not mix with aminoglycosides in one bag.", "monitoring": "Creatinine daily while unstable. Liver tests if the course is long. Confirm the Pseudomonas MIC before calling it definitive.", "special": "Septic shock from hospital pneumonia: start the 3 g dose, not 1.5 g. Meningitis: not established. Obesity: no labeled weight change. Pregnancy: limited data; use for resistant Pseudomonas if needed. Cephalosporin anaphylaxis: avoid.", "stewardship": "Do not spend it on susceptible Pseudomonas that cefepime or piperacillin can treat. Do not call it CRE cover. Add metronidazole for the gut. No oral equivalent."}, {"id": "mero-vab", "name": "Meropenem–vaborbactam", "group": "Newer resistant Gram-negative agents", "doseLine": "4 g IV every 8 hours over 3 hours", "identity": "Meropenem plus vaborbactam. Carbapenem with a boronic-acid beta-lactamase inhibitor. Intravenous dose of 4 g is meropenem 2 g plus vaborbactam 2 g. No oral product.", "mechanism": "Meropenem inhibits cell-wall synthesis. Vaborbactam inhibits KPC and some other class A enzymes. It does not inhibit metallo-beta-lactamases or OXA-48 reliably. Bactericidal.", "spectrum": "KPC-producing Enterobacterales, plus the usual meropenem spectrum of anaerobes, streptococci and many Pseudomonas strains. Vaborbactam does not restore Pseudomonas that is resistant because of porin loss. Not NDM, not OXA-48 as a reliable target, not MRSA, not CRAB.", "indications": "Targeted KPC infection, especially complicated urinary infection and other susceptible CRE when the MIC supports it. Not the preferred agent for OXA-48 or NDM.", "adult": "4 g IV every 8 hours, infused over 3 hours. That is the full meropenem 2 g plus vaborbactam 2 g dose.", "pkpd": "Time-dependent for meropenem; vaborbactam must be present throughout. The 3-hour infusion is part of the dose, not optional. Renally cleared. Good urinary levels. Lung data are more limited than for some comparators.", "renal": "CrCl at least 50: 4 g every 8 hours. CrCl 30–49: 2 g every 8 hours. CrCl 15–29: 2 g every 12 hours. CrCl below 15: 1 g every 12 hours. Haemodialysis: give after dialysis. CRRT: often kept at 4 g every 8 hours because both components are cleared. Confirm locally. The reduced doses are of the combination, preserving the 1:1 ratio.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "NDM, VIM, IMP and most OXA-48. Porin mutations can defeat meropenem even when KPC is inhibited. Not active against CRAB.", "adverse": "Headache, diarrhoea, infusion-site reactions, transaminase rise, seizures if meropenem accumulates, and C. difficile.", "interactions": "Valproate concentrations can fall because of the meropenem component. Probenecid may raise meropenem. Do not shorten the 3-hour infusion to fit a conflicting IV drug without a second lumen.", "monitoring": "Creatinine. Seizure risk. Valproate level if co-prescribed. Confirm the carbapenemase class, not just “CRE”.", "special": "Septic shock due to KPC: this is a valid targeted option if the isolate is susceptible. Meningitis: meropenem dosing experience exists, but the combination is not a meningitis license. Obesity: no extra mg/kg. Pregnancy: use only for serious resistant infection. Carbapenem allergy: avoid.", "stewardship": "Only for KPC or a documented susceptible CRE. If the mechanism is OXA-48, use ceftazidime–avibactam. If it is NDM, use a metallo-beta-lactamase strategy. De-escalate to meropenem alone when the organism is meropenem susceptible."}, {"id": "imi-rel", "name": "Imipenem–cilastatin–relebactam", "group": "Newer resistant Gram-negative agents", "doseLine": "1.25 g IV every 6 hours over 30 minutes", "identity": "Imipenem, cilastatin and relebactam. Carbapenem plus renal protectant plus a diazabicyclooctane inhibitor. One 1.25 g dose contains imipenem 500 mg, cilastatin 500 mg and relebactam 250 mg.", "mechanism": "Imipenem inhibits cell-wall synthesis. Relebactam inhibits class A enzymes including KPC and class C enzymes, restoring imipenem against some Pseudomonas. It does not inhibit metallo-beta-lactamases. Bactericidal. Cilastatin blocks renal metabolism of imipenem.", "spectrum": "KPC-producing Enterobacterales and some carbapenem-resistant Pseudomonas. Anaerobes and streptococci follow imipenem. Not NDM or OXA-48 as a reliable target, not CRAB, not MRSA.", "indications": "Hospital pneumonia, ventilator pneumonia, bacteraemia and complicated urinary infection due to susceptible CRE or difficult Pseudomonas. An alternative to ceftazidime–avibactam for KPC when the MIC supports it.", "adult": "1.25 g IV every 6 hours, infused over 30 minutes, when CrCl is at least 90. Maximum is that schedule; do not give plain imipenem doses on top.", "pkpd": "Time-dependent. Relebactam must cover the interval, so the q6h schedule is tighter than meropenem. Seizure risk of imipenem remains. Renal clearance of all three components.", "renal": "CrCl at least 90: 1.25 g every 6 hours. CrCl 60–89: 1 g every 6 hours (imipenem/cilastatin/relebactam 400/400/200 mg). CrCl 30–59: 750 mg every 6 hours (300/300/150 mg). CrCl 15–29 or haemodialysis: 500 mg every 6 hours (200/200/100 mg), after dialysis. CRRT: commonly the full 1.25 g every 6 hours. Below CrCl 15 and not on dialysis, the label is limited; involve pharmacy. Seizures if the anuric patient receives the CrCl-90 dose.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Metallo-beta-lactamases and OXA-48 are the main holes. CRAB is not an indication. Pseudomonas can still fail if the mechanism is not AmpC plus OprD.", "adverse": "Seizures, nausea, diarrhoea, transaminase rise, cytopenias, and C. difficile. Infusion reactions if pushed too fast.", "interactions": "Valproate levels fall. The seizure risk is higher if the patient already has brain injury or is on other pro-convulsant drugs.", "monitoring": "Creatinine, because the bands are narrow. Mental status. Liver tests. Confirm the enzyme class.", "special": "Septic shock: full renal-appropriate dose; do not delay for the perfect MIC if CRE is likely and this is the active drug on the shelf. Meningitis: avoid because of imipenem seizures. Obesity: no labeled weight dose. Pregnancy: reserved for resistant infection. Carbapenem allergy: avoid.", "stewardship": "Do not use it where meropenem is active. Match the enzyme: KPC or susceptible Pseudomonas, not NDM and not CRAB. No oral step-down of the combination."}, {"id": "cefiderocol", "name": "Cefiderocol", "group": "Newer resistant Gram-negative agents", "doseLine": "2 g IV every 8 hours over 3 hours", "identity": "Cefiderocol. Siderophore cephalosporin. Intravenous 1 g vials; a dose is 2 g. No oral product.", "mechanism": "Chelates iron and enters Gram-negatives through iron transporters, then inhibits penicillin-binding proteins. Stable to all four Ambler classes, including metallo-beta-lactamases. Bactericidal.", "spectrum": "Carbapenem-resistant Enterobacterales including NDM, difficult Pseudomonas, Stenotrophomonas, and Acinetobacter. Not Gram-positives, not anaerobes, not atypicals. Clinical outcomes in CRAB have been mixed.", "indications": "Reserve for documented carbapenem-resistant Gram-negatives with no better option, including some MBL and Stenotrophomonas infections. For CRAB, many clinicians prefer sulbactam–durlobactam when it is susceptible, because a mortality signal was seen with cefiderocol in one Acinetobacter trial. Combination therapy is often used when the MIC is high or the source is pneumonia.", "adult": "2 g IV every 8 hours, each dose over 3 hours. If CrCl is at least 120 mL/min, give 2 g every 6 hours. The infusion time is part of the regimen.", "pkpd": "Time-dependent, and the 3-hour infusion is required to hold levels above MIC. Renally cleared, including on dialysis. Iron physiology, not a CYP drug. Poor Gram-positive activity regardless of level.", "renal": "CrCl at least 120: 2 g every 6 hours. CrCl 60–119: 2 g every 8 hours. CrCl 30–59: 1.5 g every 8 hours. CrCl 15–29: 1 g every 8 hours. CrCl below 15: 0.75 g every 12 hours. Haemodialysis: 0.75 g every 12 hours, after the session when dialysis falls near a dose. CRRT and SLED: label is limited; many ICUs use 1.5–2 g every 8 hours over 3 hours and match effluent rate with pharmacy. Augmented clearance is the band people miss.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Mutations in iron-transport genes and some beta-lactamases can raise the MIC. Heteroresistance in Acinetobacter is a clinical concern. Not a Gram-positive failure so much as a spectrum gap.", "adverse": "Diarrhoea, infusion reactions, cough, rash, C. difficile, and transaminase rise. The serious concern is worse clinical outcome in some Acinetobacter pneumonia, not a classic organ toxicity.", "interactions": "Few CYP interactions. Do not shorten the infusion. Separate from drugs that occupy the only lumen for 3 hours.", "monitoring": "Creatinine, including looking for augmented clearance. Liver tests. MIC and identified mechanism. Clinical failure should prompt a change, not a higher homemade dose.", "special": "Septic shock due to MBL: a reasonable targeted drug, usually with a second active agent if one exists. Meningitis: not established. Obesity: standard 2 g, but check for augmented clearance. Pregnancy: only for untreatable resistant infection. Cephalosporin anaphylaxis: avoid.", "stewardship": "Last-line. Do not start it for ordinary ESBL or for MRSA cover. Do not use it as the sole plan for CRAB if sulbactam–durlobactam is available and active. No oral switch."}, {"id": "atm-avi", "name": "Aztreonam–avibactam", "group": "Newer resistant Gram-negative agents", "doseLine": "Load 2.67 g IV, then 2 g every 6 hours, each over 3 hours", "identity": "Aztreonam plus avibactam, fixed 3:1, marketed as Emblaveo where it is licensed. A maintenance vial is aztreonam 1.5 g plus avibactam 0.5 g. Not the same as giving plain aztreonam.", "mechanism": "Aztreonam resists class B metallo-enzymes. Avibactam inhibits the ESBL, KPC, AmpC or OXA enzymes that usually accompany them. Together they cover many NDM producers. Bactericidal. No Gram-positive or anaerobic killing.", "spectrum": "Metallo-beta-lactamase Enterobacterales, including many NDM, and other avibactam-susceptible resistant Gram-negatives. Not MRSA, not anaerobes, not CRAB as an indication, and not a substitute for a Gram-positive drug.", "indications": "Where the product is available, targeted therapy for MBL-producing Enterobacterales, including complicated intra-abdominal infection together with metronidazole. If the product is not on the shelf, the bridge is aztreonam plus ceftazidime–avibactam, dosed so the infusions overlap.", "adult": "CrCl above 50: one loading dose of 2.67 g (aztreonam 2 g plus avibactam 0.67 g), then 2 g (aztreonam 1.5 g plus avibactam 0.5 g) every 6 hours. Every dose over 3 hours. The next dose is timed from the start of the previous infusion. Intra-abdominal infection is combined with metronidazole. Duration often 5–14 days.", "pkpd": "Both components are time-dependent and renally cleared. Avibactam protects aztreonam only while it is present, so missed renal adjustment leads to failure or toxicity. No useful lung activity against Gram-positives.", "renal": "CrCl above 50: load 2.67 g, then 2 g every 6 hours. CrCl above 30 to 50: same load, then 1 g every 6 hours. CrCl above 15 to 30: load 1.8 g, then 0.9 g every 8 hours. CrCl 15 or below, including haemodialysis: load 1.33 g, then 0.9 g every 12 hours, after dialysis when a session coincides. All infusions over 3 hours. CRRT: label is not a full effluent table; do not use the anuric dose on a high-clearance circuit without pharmacy.", "hepatic": "No hepatic adjustment stated. Still follow liver tests on a long course.", "resistance": "Designed for MBL plus a serine enzyme. CRAB and some Pseudomonas mechanisms are outside this claim. Resistance can still emerge if the dose is reduced incorrectly.", "adverse": "Diarrhoea, nausea, transaminase rise, rash, infusion reactions, and the usual aztreonam hypersensitivity risk. C. difficile.", "interactions": "Must be paired with metronidazole for gut anaerobes. Shares the ceftazidime allergy side chain through aztreonam. Few CYP effects.", "monitoring": "Creatinine at the start and with any shock-related AKI, because every band changes the vial. Liver tests. Confirm an MBL rather than guessing from “CRE”.", "special": "Septic shock due to NDM: this is a targeted option where stocked, plus cover for Gram-positives and anaerobes as the source requires. Meningitis: not a labeled regimen. Obesity: no mg/kg dose. Pregnancy: only for serious MBL infection. Ceftazidime or aztreonam anaphylaxis: avoid. Not available in every country; do not pretend plain aztreonam is the same drug.", "stewardship": "Do not use it for ESBL that meropenem can treat. If the product is unavailable, document the aztreonam plus ceftazidime–avibactam overlap regimen instead of omitting the inhibitor. Stop anaerobic and Gram-positive companions when cultures allow. No oral step-down of the pair."}, {"id": "sul-dur", "name": "Sulbactam–durlobactam", "group": "Newer resistant Gram-negative agents", "doseLine": "1 g / 1 g IV every 6 hours over 3 hours", "identity": "Sulbactam plus durlobactam, co-packaged as Xacduro where available. Each dose is sulbactam 1 g and durlobactam 1 g, infused together over 3 hours. Not the same as high-dose ampicillin–sulbactam.", "mechanism": "Sulbactam binds Acinetobacter penicillin-binding proteins and kills the organism at these doses. Durlobactam inhibits the serine beta-lactamases that would otherwise destroy sulbactam, including many OXA carbapenemases of Acinetobacter. Bactericidal against susceptible CRAB.", "spectrum": "Acinetobacter baumannii–calcoaceticus complex, including many carbapenem-resistant isolates. Not a general CRE drug, not Pseudomonas cover, not MRSA, not anaerobes.", "indications": "Hospital-acquired and ventilator-associated pneumonia caused by susceptible Acinetobacter, in adults, where the product is available. Often combined with a carbapenem in the trial design; follow current guidance on whether a companion drug is still required.", "adult": "CrCl 45–129: sulbactam 1 g plus durlobactam 1 g IV every 6 hours, over 3 hours. CrCl at least 130: the same gram dose every 4 hours. Planned duration 7–14 days, guided by the infection. Do not substitute ampicillin–sulbactam milligrams for this pair.", "pkpd": "Time-dependent sulbactam killing of Acinetobacter, protected by durlobactam. Both are renally cleared. The 3-hour infusion is mandatory. Augmented clearance needs a shorter interval, which is unusual and easy to miss.", "renal": "CrCl at least 130: 1 g/1 g every 4 hours. CrCl 45–129: every 6 hours. CrCl 30–44: every 8 hours. CrCl 15–29: every 12 hours. CrCl below 15, starting now: every 12 hours for the first three doses (0, 12 and 24 hours), then every 24 hours. If clearance falls below 15 during therapy: every 24 hours. Haemodialysis: give after the session. The manufacturer does not give a CRRT dose; do not improvise from the anuric schedule on a running filter. No hepatic dose change.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Metallo-beta-lactamases of Acinetobacter, and isolates with sulbactam PBPs that durlobactam cannot protect, may fail. This drug does not treat KPC Klebsiella. Susceptibility testing is required.", "adverse": "Diarrhoea, anaemia, hypokalaemia, transaminase rise, infusion reactions, and C. difficile. Hypersensitivity to either component.", "interactions": "Few CYP interactions. The practical conflict is a 3-hour infusion every 6 hours occupying a lumen. Do not mix with other drugs in the same bag.", "monitoring": "Creatinine, because augmented clearance shortens the interval and AKI lengthens it. Potassium and haemoglobin. Liver tests. Acinetobacter susceptibility.", "special": "Septic shock due to CRAB pneumonia: start if the isolate is known or highly likely and the product is in stock. It is not empiric cover for all septic shock. Meningitis: not the labeled indication. Obesity: the augmented-clearance rule matters more than weight. Pregnancy: use only for serious CRAB. Sulbactam or beta-lactam anaphylaxis: avoid. Where the product is not available, high-dose ampicillin–sulbactam is the older alternative, not a milligram-equivalent.", "stewardship": "Only for Acinetobacter. Stop companion drugs that cultures do not support. Do not widen it into a CRE protocol. No oral Acinetobacter step-down of this pair."}, {"id": "vancomycin", "name": "Vancomycin", "group": "Gram-positive agents", "doseLine": "15–20 mg/kg IV every 8–12 hours, guided by AUC", "identity": "Vancomycin. Glycopeptide. Intravenous powder or solution, and oral capsules or solution that act only inside the gut. The two routes are not interchangeable.", "mechanism": "Binds D-alanyl-D-alanine termini and blocks cell-wall cross-linking. Bactericidal against many staphylococci, slower than a beta-lactam. Time- and exposure-dependent; the clinical index is AUC over MIC.", "spectrum": "MRSA, methicillin-susceptible staphylococci, streptococci, and many E. faecalis and E. faecium that remain glycopeptide susceptible. Not Gram-negatives, not anaerobes, not atypicals. VRE and some vancomycin-intermediate staphylococci are resistant.", "indications": "Empiric IV MRSA cover in severe hospital infection, targeted MRSA when the MIC is in the susceptible range, and oral therapy only for C. difficile colitis. Beta-lactams are better for MSSA once susceptibility is known.", "adult": "Load 20–35 mg/kg actual body weight IV (usual cap about 3 g) when seriously ill. Maintenance 15–20 mg/kg every 8–12 hours. Infuse no faster than 1 g per hour. Target AUC/MIC 400–600 over 24 hours. Oral C. difficile: 125 mg four times daily, which does not treat pneumonia or bacteraemia. Do not use trough-only dosing if AUC is available.", "pkpd": "AUC/MIC is the efficacy index. Renally cleared, large molecule, moderate CSF entry only with inflammation. Lung levels are adequate for MRSA pneumonia at a correct AUC. Continuous infusion is an alternative in some ICUs, often targeting a steady level around 20–25 mg/L.", "renal": "Dose and interval are kinetic, not a single CrCl table. AKI: extend the interval and follow levels; do not give q8h blindly. Intermittent haemodialysis: load, then redose according to pre-dialysis levels; high-flux membranes remove a large fraction. CRRT: commonly 15–20 mg/kg every 24 hours or a continuous infusion, then levels. SLED: levels around the session. The first severe-infection load is still given.", "hepatic": "No hepatic adjustment. Levels still depend on the kidney.", "resistance": "vanA and vanB in enterococci. A high MIC inside the susceptible range predicts harder-to-treat MRSA. It has no activity on organisms without a D-Ala-D-Ala target that it can bind.", "adverse": "Infusion reaction (“vancomycin flushing”) if given too fast, nephrotoxicity especially with piperacillin–tazobactam or other toxins, ototoxicity, neutropenia on long courses, and DRESS. Oral therapy can still cause systemic exposure in severe colitis with kidney failure.", "interactions": "Piperacillin–tazobactam and aminoglycosides increase kidney injury. Anaesthetic histamine release can worsen flushing. Levels rise when clearance falls, not usually through CYP.", "monitoring": "AUC-guided levels, or a trough only if AUC is impossible. Creatinine daily. Blood count on courses beyond a week. Hearing complaints. The flush is an infusion-rate problem, not always an allergy.", "special": "Septic shock with MRSA risk: load now; do not wait for a level to give the first dose. Meningitis: needs adequate exposure and usually a second drug such as rifampicin only in device infection, not by reflex. Obesity: use actual weight for the load and cap it, then follow AUC rather than escalating forever. Pregnancy: IV vancomycin is acceptable when MRSA treatment is required; levels change with clearance. True vancomycin anaphylaxis is rare; most flushing allows a slower rechallenge.", "stewardship": "Stop when MRSA is excluded. Switch MSSA to cefazolin. Do not treat pneumonia with the oral capsules. Avoid stacking nephrotoxins. Typical MRSA pneumonia courses are about 7 days if the patient improves. There is no oral step-down that treats MRSA bacteraemia."}, {"id": "teicoplanin", "name": "Teicoplanin", "group": "Gram-positive agents", "doseLine": "Load 12 mg/kg every 12 hours for 3–5 doses, then daily", "identity": "Teicoplanin. Glycopeptide. Intravenous or intramuscular powder. Not licensed in the United States. Where it is unavailable, vancomycin is the usual alternative; linezolid or daptomycin can replace it when the site allows.", "mechanism": "Binds D-alanyl-D-alanine and inhibits cell-wall synthesis. Bactericidal against many staphylococci, with a very long half-life that requires a load.", "spectrum": "MRSA, streptococci and many glycopeptide-susceptible enterococci. Not Gram-negatives, not VRE with vanA, not anaerobes.", "indications": "Targeted or empiric MRSA and enterococcal infection where teicoplanin is the stocked glycopeptide: bone, joint, skin, bacteraemia and endocarditis at the high load. Not a C. difficile drug.", "adult": "Serious infection: 12 mg/kg IV every 12 hours for 3 to 5 doses, then 12 mg/kg every 24 hours. Moderate infection can use 6 mg/kg on that same pattern. Infuse over 30 minutes. Target a trough of at least 15 mg/L, and 20–30 mg/L or higher for endocarditis and bone infection.", "pkpd": "AUC and trough both used; trough is the practical index. Extremely long half-life, so a missed load leaves the patient untreated for days. Poor CSF penetration. Good bone levels once loaded. Renally cleared.", "renal": "Give the full load even in AKI. Then stretch maintenance: CrCl below 60 often moves to every 48 hours, and haemodialysis often to every 72 hours or after sessions, always by trough. CRRT removes less than vancomycin in many circuits; still check a trough before the third maintenance dose. Do not skip the load because of kidney failure.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "vanA enterococci are resistant. Some staphylococci with thickened cell walls fail glycopeptides. Cross-resistance with vancomycin is common but not universal.", "adverse": "Rash, drug fever, eosinophilia, and less flushing and less nephrotoxicity than vancomycin. Thrombocytopenia and ototoxicity are uncommon. Bronchospasm is rare.", "interactions": "Fewer nephrotoxin interactions than vancomycin, but aminoglycosides still add ototoxicity. Levels rise if other drugs crash the GFR.", "monitoring": "Trough before the next dose, after loading is complete, then at least weekly and with every creatinine change. Creatinine. Blood count on long courses. No ECG routine.", "special": "Septic shock: the load cannot wait. Meningitis: poor choice. Obesity: mg/kg on actual or adjusted weight is debated; follow the trough and do not underload. Pregnancy: acceptable if a glycopeptide is required. Vancomycin flushing does not predict teicoplanin allergy, but true glycopeptide anaphylaxis does.", "stewardship": "If the hospital has no teicoplanin, do not delay vancomycin. Stop when MRSA is excluded. MSSA belongs on cefazolin. Long bone courses need a trough in range before discharge planning. There is no gut-only oral teicoplanin for systemic infection."}, {"id": "linezolid", "name": "Linezolid", "group": "Gram-positive agents", "doseLine": "600 mg IV or oral every 12 hours", "identity": "Linezolid. Oxazolidinone. Intravenous solution and oral tablets or suspension, 600 mg. Oral bioavailability is essentially complete, so the IV and oral doses match.", "mechanism": "Binds the 23S ribosomal RNA of the 50S subunit and stops protein synthesis. Bacteriostatic against staphylococci and enterococci. Also a weak non-selective MAOI.", "spectrum": "MRSA, VRE, penicillin-resistant pneumococci and other Gram-positive aerobes. Not Gram-negatives, not anaerobes of consequence, not Pseudomonas.", "indications": "MRSA pneumonia, when vancomycin fails or cannot be used, VRE infection, and oral step-down of susceptible Gram-positive infection. Not first choice for a long bacteraemia if a bactericidal beta-lactam will do.", "adult": "600 mg IV or oral every 12 hours. Infuse IV over 30–120 minutes. No load. Usual maximum 600 mg every 12 hours. Keep most courses at or under 14 days.", "pkpd": "AUC/MIC is the linked index, but the dose is fixed because the therapeutic window is toxicity, not underdosing. Excellent lung and tissue levels. Good oral absorption even in many sick patients who are eating. CSF levels are moderate.", "renal": "No routine reduction. Metabolites accumulate when CrCl is below 30 and may add to thrombocytopenia; watch the blood count rather than changing the first dose. Haemodialysis removes drug: give the dose after dialysis. CRRT: 600 mg every 12 hours.", "hepatic": "No adjustment for mild or moderate impairment. Limited data in severe hepatic failure; use only if needed and follow the blood count.", "resistance": "23S rRNA mutations and cfr methyltransferase. Still uncommon, but more likely after prolonged or repeated exposure. Gram-negatives are intrinsically resistant.", "adverse": "Thrombocytopenia, anaemia and neutropenia after about two weeks, lactic acidosis, peripheral and optic neuropathy on long courses, and serotonin syndrome with serotonergic drugs. Nausea and headache early.", "interactions": "SSRIs, SNRIs, tramadol, fentanyl and other serotonergic drugs can precipitate serotonin syndrome. Avoid MAOIs and linezolid together. Tyramine-rich food in large amounts is a theoretical pressor risk. Rifampicin may lower linezolid levels.", "monitoring": "Full blood count weekly, sooner if CrCl is low or the course may pass 10 days. Lactate if new acidosis appears. Visual symptoms. Creatinine does not set the dose but changes the marrow risk. No drug level in routine practice. No ECG requirement, though serotonergic toxicity is a clinical diagnosis.", "special": "Septic shock due to MRSA pneumonia: a valid IV start, and oral once the gut works. Meningitis: not standard. Obesity: 600 mg every 12 hours is still the dose. Pregnancy: limited data; use for serious resistant Gram-positive infection if a beta-lactam cannot. The drug is not an allergy alternative for Gram-negative cover.", "stewardship": "Do not prescribe a 4-week course by default. Switch IV to oral at the same dose as soon as the patient absorbs. Stop SSRIs only with a plan, not by reflex if a one-day overlap is safer than untreated shock. Never use it for Gram-negative sepsis. Prefer cefazolin for MSSA."}, {"id": "daptomycin", "name": "Daptomycin", "group": "Gram-positive agents", "doseLine": "8–10 mg/kg IV every 24 hours; never for pneumonia", "identity": "Daptomycin. Cyclic lipopeptide. Intravenous powder only. Dosed in mg/kg.", "mechanism": "Inserts into the Gram-positive membrane in a calcium-dependent manner and depolarises it. Rapidly bactericidal. Pulmonary surfactant binds and inactivates it.", "spectrum": "MRSA, MSSA and many VRE, including some vancomycin-resistant E. faecium. Not Gram-negatives, not anaerobes, and not organisms sitting in the alveolar lining fluid.", "indications": "MRSA or VRE bacteraemia, right-sided endocarditis and complicated skin infection when a beta-lactam cannot be used. Contraindicated for pneumonia. Do not use it as the lung drug in septic emboli from right-sided endocarditis without a separate pneumonia plan.", "adult": "Skin infection: 4–6 mg/kg IV every 24 hours. Bacteraemia and endocarditis: 8–10 mg/kg every 24 hours. Some VRE regimens use 10–12 mg/kg. Infuse over 30 minutes, or 2 minutes if the label allows that concentration. Use actual body weight; in severe obesity many pharmacists use adjusted weight and then follow CPK.", "pkpd": "Concentration-dependent, indexed to AUC/MIC and peak. Renally cleared. Inactivated in the lung. Poor CSF penetration. Highl
