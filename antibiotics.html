<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Drugs and doses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--ink:#071018;--panel:#0c1822;--fg:#f3efe6;--muted:#b7b1a4;--faint:#8a8478;--line:rgba(243,239,230,.18);--cool:#7fd4e6;--warm:#e2b48a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh;padding:16px 16px 56px}
button,a,input,select{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:42rem;margin:0 auto}
@media(min-width:960px){.wrap.wide{max-width:64rem}}
.kicker{margin:0;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;color:var(--faint)}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:40px;letter-spacing:-.03em;line-height:.95;margin:8px 0 0}
h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 0}
.lede,.muted{color:var(--muted);line-height:1.5}
.notice{margin:16px 0 0;padding:12px 14px;border:1px solid rgba(226,180,138,.45);border-radius:16px;color:var(--warm);line-height:1.45}
.find{width:100%;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.chips{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 0 4px}
.chips a,.chips button{width:100%;flex:none;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);text-decoration:none;display:flex;align-items:center;text-align:left}
.sections{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sections a{display:flex;align-items:center;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit}
.chips .on{border-color:var(--cool);color:var(--cool)}
.group{margin-top:28px}
.drug,.classlink{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:44px;text-decoration:none;color:inherit}
.drug b,.classlink b{display:block;font-size:17px}
.drug span,.classlink span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.drug i{display:block;margin-top:4px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--faint)}
.back{display:inline-flex;align-items:center;min-height:48px;margin:0 0 12px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none}
.dose{color:var(--cool);line-height:1.45;margin:12px 0 0}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;scroll-margin-top:12px}
.sec p{color:var(--muted);line-height:1.5;margin:8px 0 0}
.panel{margin-top:16px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;scroll-margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
label.field{display:block;color:var(--muted);font-size:14px}
label.field input,label.field select{display:block;width:100%;margin-top:4px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--ink);padding:0 12px;font-size:16px}
.warm{color:var(--warm);line-height:1.45}
.faint{color:var(--faint);line-height:1.45}
.mcq{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.opt{display:block;width:100%;text-align:left;background:#0c1822;color:#f3efe6;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;min-height:48px;line-height:1.4}
.opt.good{border-color:#3ee07a;color:#d7ffe8;background:#10241c}
.opt.bad{border-color:#e2b48a;color:#f6e7d4;background:#241c14}
.check{margin-top:16px;min-height:48px;border-radius:12px;border:1px solid var(--cool);background:transparent;color:var(--cool);padding:0 16px}
.empty{color:var(--muted);border-top:1px solid var(--line);padding:18px 0}
@media(min-width:960px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:24px;align-items:start}
  .panel.stick{position:sticky;top:16px;margin-top:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="drugs-data.js?v=20261029a"></script>
<script src="osce-data.js?v=20261029a"></script>
<script>
(function () {
  var bank = window.DRUG_BANK;
  var app = document.getElementById("app");
  var USE = { routine: "Routine ICU", occasional: "Selected cases", specialist: "Specialist", "not-routine": "Not routine ICU" };
  var FILTERS = [["all", "All"], ["routine", "Routine ICU"], ["occasional", "Selected cases"], ["specialist", "Specialist"], ["not-routine", "Not routine"]];

  function findClass(id) {
    for (var g = 0; g < bank.groups.length; g++) {
      var group = bank.groups[g];
      for (var i = 0; i < group.classes.length; i++) {
        if (group.classes[i].id === id) return { group: group, info: group.classes[i] };
      }
    }
    return null;
  }
  function drugById(id) {
    for (var i = 0; i < bank.drugs.length; i++) if (bank.drugs[i].id === id) return bank.drugs[i];
    return null;
  }
  function inClass(id) {
    return bank.drugs.filter(function (d) { return d.classes.indexOf(id) !== -1; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function route() {
    var hash = location.hash.replace(/^#/, "") || "/";
    var q = hash.indexOf("?");
    var query = "";
    if (q !== -1) { query = hash.slice(q + 1); hash = hash.slice(0, q); }
    var parts = hash.split("/").filter(Boolean);
    var params = {};
    query.split("&").forEach(function (pair) {
      if (!pair) return;
      var bits = pair.split("=");
      params[decodeURIComponent(bits[0])] = decodeURIComponent(bits[1] || "");
    });
    return { parts: parts, params: params };
  }
  function go(hash) { location.hash = hash; }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function paragraphs(parent, text) {
    String(text || "").split("\n").forEach(function (line) {
      var trimmed = line.trim();
      if (trimmed) parent.appendChild(el("p", null, trimmed));
    });
  }

  function render() {
    stopSpoken();
    clear(app);
    app.className = "wrap";
    var r = route();
    if (r.parts[0] === "abx") return renderAbx();
    if (r.parts[0] === "icu" && r.parts[1] === "d" && r.parts[2]) return renderIcuDrug(r.parts[2], r.params.from || "");
    if (r.parts[0] === "icu" && r.parts[1]) return renderIcuGroup(r.parts[1]);
    if (r.parts[0] === "c" && r.parts[1]) return renderClass(r.parts[1]);
    if (r.parts[0] === "d" && r.parts[1]) return renderDrug(r.parts[1], r.params.from || "", r.parts[2] || "", r.parts[3] || "0");
    renderHome();
  }

  function renderHome() {
    app.appendChild(el("a", "back", "Back")).href = "index.html";
    app.appendChild(el("p", "kicker", "Critical care hub"));
    var h = el("h1", null, "Drugs and doses");
    app.appendChild(h);
    app.appendChild(el("p", "lede", "Headings are in alphabetical order. Antimicrobials opens by class, with the full monograph on every drug."));
    var input = el("input", "find");
    input.placeholder = "Search a drug, organism or gene";
    input.setAttribute("aria-label", "Search drugs");
    app.appendChild(input);
    var list = el("div");
    app.appendChild(list);
    function paint(query) {
      clear(list);
      var words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
      if (words.length) {
        var hits = bank.drugs.filter(function (drug) {
          var hay = [drug.name, drug.subclass, drug.doseLine, drug.keywords, drug.spectrum, drug.icu, drug.resistance, drug.classes.join(" ")].join(" ").toLowerCase();
          return words.every(function (word) { return hay.indexOf(word) !== -1; });
        }).sort(function (a, b) { return a.name.localeCompare(b.name); });
        var icuHits = icuDrugs().filter(function (drug) {
          if (drug._group === "E") return false;
          var hay = [drug.name, drug.indication, drug.dose, drug.infusion, drug.evidence].join(" ").toLowerCase();
          return words.every(function (word) { return hay.indexOf(word) !== -1; });
        });
        list.appendChild(el("p", "kicker", (hits.length + icuHits.length) + " drugs"));
        if (!hits.length && !icuHits.length) list.appendChild(el("p", "empty", "Nothing in the directory matches that."));
        icuHits.forEach(function (drug) { list.appendChild(icuLink(drug)); });
        hits.forEach(function (drug) { list.appendChild(drugLink(drug, drug.classes[0])); });
        return;
      }
      var tabs = OSCE_DATA.groups.filter(function (group) { return group.id !== "E"; }).map(function (group) {
        return { name: group.name, href: "#/icu/" + group.id, blurb: group.drugs.length + " drugs. Each page has the indication, dose, infusion, preparation, renal and hepatic adjustment, cautions, monitoring, adverse effects, reversal, and the source." };
      });
      var classCount = 0;
      bank.groups.forEach(function (group) { classCount += group.classes.length; });
      tabs.push({ name: "Antimicrobials", href: "#/abx", blurb: classCount + " classes. Mechanism, spectrum, ICU use, adult dose, calculator, renal adjustment, hepatic adjustment, PK/PD, contraindications, adverse effects, monitoring, resistance, reversal, and the source." });
      tabs.sort(function (a, b) { return a.name.localeCompare(b.name); });
      var block = el("section", "group");
      block.appendChild(el("p", "kicker", "Headings"));
      tabs.forEach(function (tab) {
        var a = el("a", "classlink");
        a.href = tab.href;
        a.appendChild(el("b", null, tab.name));
        a.appendChild(el("span", null, tab.blurb));
        block.appendChild(a);
      });
      list.appendChild(block);
    }
    input.addEventListener("input", function () { paint(input.value); });
    paint("");
  }

  function drugLink(drug, from) {
    var a = el("a", "drug");
    a.href = "#/d/" + drug.id + (from ? "?from=" + encodeURIComponent(from) : "");
    a.appendChild(el("b", null, drug.name));
    a.appendChild(el("span", null, drug.doseLine));
    a.appendChild(el("i", null, USE[drug.use] + " · " + drug.subclass));
    return a;
  }

  function icuDrugs() {
    var seen = {};
    var list = [];
    OSCE_DATA.groups.forEach(function (group) {
      group.drugs.forEach(function (id) {
        if (seen[id] || !OSCE_DATA.drugs[id]) return;
        seen[id] = group.id;
        var drug = OSCE_DATA.drugs[id];
        drug.id = id;
        drug._group = group.id;
        list.push(drug);
      });
    });
    return list.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function icuGroup(id) {
    for (var i = 0; i < OSCE_DATA.groups.length; i++) if (OSCE_DATA.groups[i].id === id) return OSCE_DATA.groups[i];
    return null;
  }
  function icuLink(drug) {
    var a = el("a", "drug");
    a.href = "#/icu/d/" + drug.id + "?from=" + encodeURIComponent(drug._group || "");
    a.appendChild(el("b", null, drug.name));
    a.appendChild(el("span", null, drug.dose));
    return a;
  }
  function renderIcuGroup(id) {
    var group = icuGroup(id);
    if (!group || id === "E") {
      if (id === "E") return renderAbx();
      app.appendChild(homeBack());
      app.appendChild(el("h1", null, "Section not found"));
      return;
    }
    app.appendChild(homeBack());
    app.appendChild(el("p", "kicker", "Critical care"));
    app.appendChild(el("h1", null, group.name));
    app.appendChild(el("p", "lede", "Every drug opens on the full index: indication, dose, infusion, preparation, renal, hepatic, cautions, monitoring, adverse effects, reversal, and the source."));
    group.drugs.forEach(function (drugId) {
      var drug = OSCE_DATA.drugs[drugId];
      if (!drug) return;
      drug.id = drugId;
      drug._group = id;
      app.appendChild(icuLink(drug));
    });
  }
  var ICU_INDEX = [
    ["indication", "Indication in the ICU"],
    ["dose", "Adult dose"],
    ["infusion", "Infusion"],
    ["preparation", "Preparation"],
    ["renal", "Renal adjustment"],
    ["hepatic", "Hepatic adjustment"],
    ["contra", "Contraindications and cautions"],
    ["monitoring", "Monitoring"],
    ["adverse", "Adverse effects"],
    ["reversal", "Reversal or antidote"],
    ["evidence", "Evidence and source"]
  ];
  function renderIcuDrug(id, from) {
    var drug = OSCE_DATA.drugs[id];
    if (!drug) {
      app.appendChild(homeBack());
      app.appendChild(el("h1", null, "Drug not found"));
      return;
    }
    var group = icuGroup(from) || icuGroup(drug._group) || OSCE_DATA.groups.filter(function (item) { return item.drugs.indexOf(id) !== -1; })[0];
    var back = el("a", "back", group ? group.name : "All drugs");
    back.href = group ? "#/icu/" + group.id : "#/";
    app.appendChild(back);
    app.appendChild(el("p", "kicker", group ? group.name : "Critical care"));
    app.appendChild(el("h1", null, drug.name));
    var menu = el("nav", "sections");
    menu.setAttribute("aria-label", "Monograph sections");
    ICU_INDEX.forEach(function (item, index) {
      var a = el("a", "", String(index + 1).padStart(2, "0") + "  " + item[1]);
      a.href = "#/icu/d/" + id + (from ? "?from=" + encodeURIComponent(from) : "");
      a.addEventListener("click", function (event) {
        event.preventDefault();
        var node = document.getElementById("icu-" + item[0]);
        if (node) node.scrollIntoView({behavior: "smooth", block: "start"});
      });
      menu.appendChild(a);
    });
    app.appendChild(menu);
    ICU_INDEX.forEach(function (item, index) {
      writeSection(app, "icu-" + item[0], index + 1, item[1], drug[item[0]]);
    });
  }

  function renderAbx() {
    var back = el("a", "back", "All headings");
    back.href = "#/";
    app.appendChild(back);
    app.appendChild(el("p", "kicker", "Antimicrobials"));
    app.appendChild(el("h1", null, "Antimicrobials"));
    app.appendChild(el("p", "lede", "Class by class. Open a class, then a drug. The monograph has the mechanism, the spectrum, the ICU use, the adult dose, the calculator, renal adjustment, hepatic adjustment, PK/PD, contraindications, adverse effects, monitoring, resistance, reversal, and the source."));
    bank.groups.forEach(function (group) {
      var block = el("section", "group");
      block.appendChild(el("p", "kicker", group.label));
      group.classes.forEach(function (info) {
        var a = el("a", "classlink");
        a.href = "#/c/" + info.id;
        a.appendChild(el("b", null, info.label));
        var n = inClass(info.id).length;
        a.appendChild(el("span", null, info.blurb + " " + n + (n === 1 ? " drug." : " drugs.")));
        block.appendChild(a);
      });
      app.appendChild(block);
    });
  }

  function renderClass(id) {
    var found = findClass(id);
    if (!found) {
      app.appendChild(homeBack());
      app.appendChild(el("h1", null, "Class not found"));
      return;
    }
    var back = el("a", "back", "Antimicrobials");
    back.href = "#/abx";
    app.appendChild(back);
    app.appendChild(el("p", "kicker", found.group.label));
    app.appendChild(el("h1", null, found.info.label));
    app.appendChild(el("p", "lede", found.info.blurb));
    var chips = el("div", "chips");
    chips.setAttribute("role", "tablist");
    found.group.classes.forEach(function (item) {
      var a = el("a", item.id === id ? "on" : "", item.label);
      a.href = "#/c/" + item.id;
      a.setAttribute("role", "tab");
      a.setAttribute("aria-selected", item.id === id ? "true" : "false");
      chips.appendChild(a);
    });
    app.appendChild(chips);
    var filters = el("div", "chips");
    var state = { q: "", use: "all" };
    FILTERS.forEach(function (pair) {
      var b = el("button", pair[0] === "all" ? "on" : "", pair[1]);
      b.type = "button";
      b.addEventListener("click", function () {
        state.use = pair[0];
        Array.prototype.forEach.call(filters.children, function (child) { child.className = ""; });
        b.className = "on";
        paint();
      });
      filters.appendChild(b);
    });
    app.appendChild(filters);
    var input = el("input", "find");
    input.placeholder = "Search inside " + found.info.label;
    input.setAttribute("aria-label", "Search this class");
    app.appendChild(input);
    var list = el("div");
    app.appendChild(list);
    function paint() {
      clear(list);
      var words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
      var hits = inClass(id).filter(function (drug) {
        if (state.use !== "all" && drug.use !== state.use) return false;
        if (!words.length) return true;
        var hay = [drug.name, drug.subclass, drug.doseLine, drug.keywords, drug.spectrum, drug.resistance].join(" ").toLowerCase();
        return words.every(function (word) { return hay.indexOf(word) !== -1; });
      });
      list.appendChild(el("p", "kicker", hits.length + (hits.length === 1 ? " drug" : " drugs")));
      if (!hits.length) list.appendChild(el("p", "empty", "Nothing in this class matches."));
      hits.forEach(function (drug) { list.appendChild(drugLink(drug, id)); });
    }
    input.addEventListener("input", function () { state.q = input.value; paint(); });
    paint();
  }

  function homeBack() {
    var a = el("a", "back", "All classes");
    a.href = "#/";
    return a;
  }

  var SECTIONS = [["moa", "Mechanism"], ["spectrum", "Spectrum"], ["icu", "ICU use"], ["adult", "Adult dose"], ["dose-calc", "Calculator"], ["renal", "Renal adjustment"], ["hepatic", "Hepatic adjustment"], ["pkpd", "PK/PD"], ["contraindications", "Contraindications"], ["adverse", "Adverse effects"], ["monitoring", "Monitoring"], ["resistance", "Resistance"], ["reversal", "Reversal"], ["evidence", "Evidence and source"], ["mcq", "MCQs"]];

  function drugHash(id, section, from, extra) {
    var hash = "#/d/" + id + (section ? "/" + section : "") + (extra ? "/" + extra : "");
    if (from) hash += "?from=" + encodeURIComponent(from);
    return hash;
  }
  function stopSpoken() {
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  function femaleVoice() {
    if (!window.speechSynthesis) return null;
    var voices = speechSynthesis.getVoices() || [];
    var named = /female|samantha|victoria|karen|moira|fiona|tessa|serena|zira|susan|veena|heera|sonia|catherine|allison|ava|nicky|libby/i;
    var en = voices.filter(function (voice) { return /^en/i.test(voice.lang || ""); });
    return en.find(function (voice) { return named.test((voice.name || "") + " " + (voice.voiceURI || "")); })
      || en.find(function (voice) { return /en-GB|en-IN|en-AU/i.test(voice.lang) && !/male/i.test(voice.name || ""); })
      || null;
  }
  function speakMcq(text) {
    if (!text || !window.speechSynthesis) return;
    var say = function () {
      speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      var voice = femaleVoice();
      utterance.lang = voice && voice.lang ? voice.lang : "en-GB";
      utterance.rate = 0.92;
      utterance.pitch = 1.06;
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    };
    if (!speechSynthesis.getVoices().length) {
      var once = function () {
        speechSynthesis.removeEventListener("voiceschanged", once);
        say();
      };
      speechSynthesis.addEventListener("voiceschanged", once);
      speechSynthesis.getVoices();
      return;
    }
    say();
  }

  function renderDrug(id, from, section, qIndex) {
    var drug = drugById(id);
    if (!drug) {
      app.appendChild(homeBack());
      app.appendChild(el("h1", null, "Drug not found"));
      return;
    }
    app.className = "wrap wide";
    var homeId = from && drug.classes.indexOf(from) !== -1 ? from : drug.classes[0];
    var home = findClass(homeId);
    var back = el("a", "back", home ? home.info.label : "All classes");
    back.href = home ? "#/c/" + home.info.id : "#/";
    app.appendChild(back);
    app.appendChild(el("p", "kicker", (home ? home.info.label : "") + " · " + drug.subclass));
    app.appendChild(el("h1", null, drug.name));
    app.appendChild(el("p", "dose", drug.doseLine));
    app.appendChild(el("p", "muted", drug.formulations));
    app.appendChild(el("p", "faint", USE[drug.use] + ". " + drug.availability));
    if (drug.classes.length > 1) {
      var others = drug.classes.filter(function (cid) { return cid !== homeId; }).map(function (cid) {
        var found = findClass(cid);
        return found ? found.info.label : cid;
      });
      app.appendChild(el("p", "muted", "Also listed under " + others.join(", ") + "."));
    }
    var known = null;
    for (var s = 0; s < SECTIONS.length; s++) if (SECTIONS[s][0] === section) known = SECTIONS[s];
    var menu = el("nav", "sections");
    menu.setAttribute("aria-label", "Monograph sections");
    SECTIONS.forEach(function (item, index) {
      var a = el("a", item[0] === section ? "on" : "", String(index + 1).padStart(2, "0") + "  " + item[1]);
      a.href = drugHash(drug.id, item[0], from, item[0] === "mcq" ? "0" : "");
      a.addEventListener("click", function (event) {
        if (item[0] === "mcq") return;
        event.preventDefault();
        var node = document.getElementById(item[0]);
        if (node) node.scrollIntoView({behavior: "smooth", block: "start"});
      });
      menu.appendChild(a);
    });
    app.appendChild(menu);
    writeSection(app, "moa", 1, "Mechanism of action", drug.moa);
    writeSection(app, "spectrum", 2, "Spectrum", drug.spectrum);
    writeSection(app, "icu", 3, "ICU indications", drug.icu);
    writeSection(app, "adult", 4, "Adult dose", drug.adult);
    app.appendChild(calculator(drug));
    writeSection(app, "renal", 6, "Renal adjustment", drug.renal);
    writeSection(app, "hepatic", 7, "Hepatic adjustment", drug.hepatic);
    writeSection(app, "pkpd", 8, "PK/PD", drug.pkpd);
    writeSection(app, "contraindications", 9, "Contraindications", drug.contraindications);
    writeSection(app, "adverse", 10, "Adverse effects", drug.adverse);
    writeSection(app, "monitoring", 11, "Monitoring", drug.monitoring);
    writeSection(app, "resistance", 12, "Resistance mechanisms", drug.resistance);
    writeSection(app, "reversal", 13, "Reversal or antidote", "No specific antidote. Stop the drug and support the patient. Do not use a bleeding-reversal agent for an antimicrobial.");
    var betaLactam = drug.classes.some(function (id) { return /penicillin|cephalosporin|carbapenem|monobactam|beta-lactam/.test(id); });
    writeSection(app, "evidence", 14, "Evidence and source", betaLactam
      ? "In shock, this time-dependent beta-lactam is given as an extended infusion."
      : "The dose follows current ICU practice for this agent.");
    if (section === "mcq") mcqs(drug, from, qIndex);
    else {
      var quiz = el("section", "sec");
      quiz.id = "mcq";
      quiz.appendChild(el("p", "kicker", "15 · MCQs"));
      quiz.appendChild(el("h2", null, "Ten questions"));
      quiz.appendChild(el("p", null, "The questions use the facts above. One at a time."));
      var openQuiz = el("a", "back", "Start the questions");
      openQuiz.href = drugHash(drug.id, "mcq", from, "0");
      openQuiz.style.marginTop = "12px";
      quiz.appendChild(openQuiz);
      app.appendChild(quiz);
    }
    if (known && section !== "mcq") {
      var jump = document.getElementById(section);
      if (jump) jump.scrollIntoView({block: "start"});
    }
  }

  function writeSection(parent, id, index, title, text) {
    var sec = el("section", "sec");
    sec.id = id;
    sec.appendChild(el("p", "kicker", String(index).padStart(2, "0") + " · " + title));
    sec.appendChild(el("h2", null, title));
    paragraphs(sec, text);
    parent.appendChild(sec);
  }

  function field(label, value, oninput, kind) {
    var wrap = el("label", "field", label);
    var input = document.createElement(kind || "input");
    if (!kind) input.inputMode = "decimal";
    input.value = value;
    input.addEventListener("input", function () { oninput(input.value); });
    input.addEventListener("change", function () { oninput(input.value); });
    wrap.appendChild(input);
    return { wrap: wrap, input: input };
  }

  function calculator(drug) {
    var calc = drug.calc;
    var box = el("section", "panel stick");
    box.id = "dose-calc";
    box.appendChild(el("p", "kicker", "05 · Dosage calculation"));
    box.appendChild(el("h2", null, "CrCl from age, sex, weight and creatinine"));
    box.appendChild(el("p", "muted", "Cockcroft–Gault, in mL/min. Female estimates are multiplied by 0.85."));
    var state = { age: "", sex: "male", weight: "", height: "", creatinine: "", unit: "mg", replacement: "none" };
    var grid = el("div", "grid");
    var out = el("div");
    function draw() {
      var age = state.age.trim() === "" ? null : Number(state.age);
      var weight = state.weight.trim() === "" ? null : Number(state.weight);
      var creatinine = state.creatinine.trim() === "" ? null : Number(state.creatinine);
      var height = state.height.trim() === "" ? null : Number(state.height);
      clear(out);
      if (age == null || weight == null || creatinine == null || !isFinite(age) || !isFinite(weight) || !isFinite(creatinine)) {
        out.appendChild(el("p", "muted", "Enter age, weight and creatinine to see a teaching dose."));
      } else {
        var result = window.calculateDose(calc, { age: age, sex: state.sex, weightKg: weight, heightCm: height, creatinine: creatinine, unit: state.unit }, state.replacement);
        if (result.error) out.appendChild(el("p", "warm", result.error));
        else {
          var line = "Estimated CrCl " + result.crcl + " mL/min";
          if (calc.mode === "mgkg") line += " · " + result.weightLabel + " " + result.weightUsed + " kg";
          if (result.crcl >= 130 && state.replacement === "none") line += " · augmented clearance range";
          out.appendChild(el("p", "faint", line));
          if (result.milligrams != null) {
            var amount = "Calculated amount " + result.milligrams + " mg";
            if (calc.mgPerKg != null) amount += " (" + calc.mgPerKg + " mg/kg)";
            if (calc.maxMg != null) amount += ", capped at " + calc.maxMg + " mg";
            amount += ".";
            out.appendChild(el("p", null, amount));
          }
          if (result.extra) out.appendChild(el("p", "warm", result.extra));
          out.appendChild(el("p", "dose", result.dose));
          if (calc.load && state.replacement === "none") out.appendChild(el("p", "muted", "Loading dose, not adjusted for the CrCl above: " + calc.load));
        }
      }
          if (calc.note) out.appendChild(el("p", "faint", calc.note));
    }
    function bind(node, key) {
      node.addEventListener("input", function () { state[key] = node.value; draw(); });
      node.addEventListener("change", function () { state[key] = node.value; draw(); });
    }
    var age = field("Age (years)", "", function (v) { state.age = v; draw(); });
    var sex = field("Sex", "male", function (v) { state.sex = v; draw(); }, "select");
    sex.input.appendChild(new Option("Male", "male"));
    sex.input.appendChild(new Option("Female", "female"));
    var weight = field("Weight (kg)", "", function (v) { state.weight = v; draw(); });
    var height = field(calc.weight === "ibw" || calc.weight === "adjusted" ? "Height (cm)" : "Height (cm, optional)", "", function (v) { state.height = v; draw(); });
    var creat = field("Creatinine (mg/dL)", "", function (v) { state.creatinine = v; draw(); });
    var unit = field("Creatinine unit", "mg", function (v) {
      state.unit = v;
      creat.wrap.firstChild.textContent = v === "mg" ? "Creatinine (mg/dL)" : "Creatinine (µmol/L)";
      draw();
    }, "select");
    unit.input.appendChild(new Option("mg/dL", "mg"));
    unit.input.appendChild(new Option("µmol/L", "umol"));
    [age, sex, weight, height, creat, unit].forEach(function (item) { grid.appendChild(item.wrap); });
    box.appendChild(grid);
    var reps = el("div", "chips");
    reps.setAttribute("role", "group");
    [["none", "No replacement"], ["hd", "Haemodialysis"], ["crrt", "CRRT"], ["sled", "SLED"]].forEach(function (pair) {
      var b = el("button", pair[0] === "none" ? "on" : "", pair[1]);
      b.type = "button";
      b.addEventListener("click", function () {
        state.replacement = pair[0];
        Array.prototype.forEach.call(reps.children, function (child) { child.className = ""; });
        b.className = "on";
        draw();
      });
      reps.appendChild(b);
    });
    box.appendChild(reps);
    var rule = el("div");
    rule.style.borderTop = "1px solid rgba(243,239,230,.18)";
    rule.style.marginTop = "12px";
    rule.style.paddingTop = "12px";
    rule.appendChild(out);
    box.appendChild(rule);
    draw();
    return box;
  }

  function mcqs(drug, from, qIndex) {
    var index = parseInt(qIndex, 10);
    if (!isFinite(index) || index < 0 || index >= drug.mcq.length) index = 0;
    var item = drug.mcq[index];
    var sec = el("section", "sec");
    sec.appendChild(el("p", "kicker", "12 · Question " + (index + 1) + " of " + drug.mcq.length));
    sec.appendChild(el("h2", null, item.stem));
    var picked = null;
    item.options.forEach(function (option, optionIndex) {
      var b = el("button", "opt", option);
      b.type = "button";
      b.addEventListener("click", function () {
        if (picked !== null) return;
        picked = optionIndex;
        var buttons = sec.querySelectorAll(".opt");
        var correctText = item.options[item.answer];
        buttons.forEach(function (button, i) {
          button.disabled = true;
          if (i === item.answer) button.className = "opt good";
          else if (i === optionIndex) button.className = "opt bad";
        });
        var line = optionIndex === item.answer
          ? "Correct. " + item.why
          : "That is incorrect. The correct answer is " + correctText + ". " + item.why;
        why.hidden = false;
        why.textContent = line;
        speakMcq(line);
      });
      sec.appendChild(b);
    });
    var why = el("p", "muted");
    why.hidden = true;
    sec.appendChild(why);
    var next = el("a", "back", index + 1 === drug.mcq.length ? "Back to sections" : "Next question");
    next.href = index + 1 === drug.mcq.length ? drugHash(drug.id, "", from, "") : drugHash(drug.id, "mcq", from, String(index + 1));
    next.style.marginTop = "16px";
    sec.appendChild(next);
    app.appendChild(sec);
    speakMcq(item.stem);
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
