Candida species, including many azole-resistant isolates. Not Mucorales, not a reliable CSF or urine drug, not first-line Aspergillus.", "indications": "Candidemia and invasive candidiasis, especially when the liver or the kidney has already failed. Oesophageal candidiasis uses a lower dose.", "adult": "Candidemia: 200 mg IV on day 1, then 100 mg daily, each over about 90 minutes. Do not exceed an infusion rate of 1.1 mg/minute. Oesophageal: 100 mg on day 1, then 50 mg daily.", "pkpd": "AUC/MIC. Chemical degradation rather than organ clearance, so exposure is stable in organ failure. Poor urine and CSF, like the other echinocandins.", "renal": "No adjustment for any CrCl, haemodialysis, CRRT or SLED.", "hepatic": "No adjustment for any Child-Pugh class. This is the echinocandin to choose in severe hepatic failure.", "resistance": "FKS mutations. The lack of hepatic metabolism does not protect against an FKS mutant.", "adverse": "Hypokalaemia, nausea, flushing and histamine symptoms if infused too fast, and liver-test abnormalities that are usually mild.", "interactions": "No clinically important CYP interactions. That is the point of the drug.", "monitoring": "Liver tests once, not because the dose changes. Potassium. Blood-culture clearance. Infusion rate.", "special": "Septic shock with candidemia and liver failure: prefer this echinocandin. Meningitis and endophthalmitis: inadequate alone. Obesity: some centres increase the daily dose above a high weight; the label stays 200 then 100. Pregnancy: limited data. Immunosuppression does not create mould activity.", "stewardship": "Step down to an azole when susceptibility and stability allow. Do not treat candiduria. Do not combine two echinocandins."}, {"id": "flucytosine", "name": "Flucytosine", "group": "Antifungals and antivirals", "doseLine": "25 mg/kg oral every 6 hours, with amphotericin", "identity": "Flucytosine, 5-fluorocytosine. Oral capsules in most countries, and an IV product in some. Never used alone. The partner for cryptococcal meningitis is amphotericin.", "mechanism": "Converted by fungal cytosine deaminase to 5-fluorouracil, which blocks fungal RNA and DNA synthesis. Resistance emerges in days if it is monotherapy. Mammalian cells do not do this conversion well, but gut flora can, which contributes to marrow toxicity.", "spectrum": "Cryptococcus and some Candida, only in combination. Not moulds. Not Mucorales.", "indications": "Induction therapy of cryptococcal meningitis, with amphotericin, usually for two weeks. Rare combination use in severe Candida endocarditis or meningitis with specialist advice.", "adult": "25 mg/kg oral every 6 hours, using ideal or adjusted body weight. Infuse the IV product, where it exists, over a labeled interval. Target a 2-hour post-dose level of about 30–80 mg/L and keep it under 100 mg/L. Do not start 37.5 mg/kg regimens without a level.", "pkpd": "Time above MIC, with excellent CSF levels, which is why it is in the meningitis regimen. Renally cleared unchanged. A falling GFR from amphotericin raises the level and the marrow risk within a day.", "renal": "CrCl above 40: every 6 hours. CrCl 20–40: every 12 hours. CrCl 10–20: every 24 hours. CrCl below 10: every 24–48 hours. Haemodialysis: dose after the session and follow a level. CRRT: often every 12 hours at a reduced mg/kg, by level. Recheck the interval the morning the creatinine rises.", "hepatic": "No standard reduction, but hepatitis is a toxicity. Follow liver tests and stop if severe injury appears.", "resistance": "Mutations in the cytosine permease or deaminase. Guaranteed on monotherapy. Not a bacterial drug.", "adverse": "Dose-related marrow suppression, hepatitis, nausea and diarrhoea. Colitis. The toxicity tracks high levels.", "interactions": "Amphotericin both enables the regimen and causes the renal failure that makes flucytosine toxic. Other marrow suppressants, including ganciclovir and co-trimoxazole, add risk. Zidovudine too.", "monitoring": "A level around day 3, then twice weekly, and after every creatinine jump. Full blood count and liver tests at the same rhythm. Creatinine daily while amphotericin is in the regimen.", "special": "Cryptococcal meningitis in septic or immunocompromised patients, including advanced HIV: this plus amphotericin is the induction, not fluconazole alone if the patient can take combination therapy. Pregnancy: avoid if possible; it is teratogenic in animals. Obesity: dose on ideal or adjusted weight, not a huge total weight. It does not treat bacterial meningitis.", "stewardship": "Two weeks of induction, then fluconazole consolidation, if the lumbar puncture and the guidelines agree. Never a discharge monotherapy. Stop or stretch the dose the day the level or the leukocytes fall."}, {"id": "acyclovir", "name": "Acyclovir", "group": "Antifungals and antivirals", "doseLine": "Encephalitis: 10 mg/kg IV every 8 hours, on ideal body weight", "identity": "Acyclovir. Nucleoside analogue. Intravenous powder or solution for serious disease, and oral tablets or valacyclovir prodrug for mucosal disease. Dose IV on ideal body weight.", "mechanism": "Phosphorylated by viral thymidine kinase, then it terminates viral DNA. Bacteriostatic is the wrong word: it is virustatic against replicating herpes viruses. It does nothing to latent virus.", "spectrum": "Herpes simplex and varicella-zoster. Not CMV in the usual doses. Not bacteria and not fungi.", "indications": "HSV encephalitis, severe mucocutaneous HSV, and varicella or zoster in the immunocompromised or the neurologically complicated. Start encephalitis treatment before the PCR returns if the syndrome fits.", "adult": "Encephalitis and VZV: 10 mg/kg IV every 8 hours, using ideal body weight, infused over at least 1 hour. Mucocutaneous HSV in an immunocompromised adult: 5 mg/kg IV every 8 hours. Oral mucosal regimens are 400 mg three times daily or valacyclovir 1 g every 8 hours and do not treat encephalitis. Hydrate with the infusion.", "pkpd": "Time above the inhibitory concentration, renally cleared unchanged, good CSF levels at the 10 mg/kg dose. Crystallises in the tubule if the patient is dry or the dose is calculated on total weight.", "renal": "Use ideal body weight first, then stretch the interval. CrCl 25–50: same mg/kg every 12 hours. CrCl 10–25: every 24 hours. CrCl below 10: half the mg/kg every 24 hours. Haemodialysis: dose after dialysis. CRRT: commonly 5–10 mg/kg every 12–24 hours. SLED: dose with pharmacy around the session. Obesity is the usual reason levels become neurotoxic.", "hepatic": "No hepatic adjustment. Neurotoxicity can look like worsening encephalitis.", "resistance": "Thymidine-kinase-deficient HSV after prolonged exposure, especially in immunosuppression. Those isolates may need foscarnet, which is outside this list.", "adverse": "Crystal nephropathy, neurotoxicity with confusion and tremor, phlebitis, and nausea. The neurotoxicity is easy to mistake for the infection getting worse.", "interactions": "Other nephrotoxins. Probenecid and tenofovir can raise levels. Zidovudine adds lethargy. No CYP maze.", "monitoring": "Creatinine every day or two, and urine output. Ideal-body-weight check on the order. Mental status. No drug level in routine practice. HSV PCR to know when the drug was actually indicated.", "special": "Septic shock is rarely HSV, but encephalitis with coma gets the 10 mg/kg dose immediately. Confirm the weight basis. Pregnancy: IV acyclovir is used for disseminated HSV and for encephalitis. Immunosuppression may need the higher end and a longer course. True allergy is rare.", "stewardship": "Stop if a lumbar puncture and imaging point elsewhere and the PCR is negative. Fourteen days is a typical encephalitis course, longer if there is immunosuppression or slow clearance. Do not treat asymptomatic shedding. Switch to oral valacyclovir only for mucosal disease, not for encephalitis halfway through."}, {"id": "ganciclovir", "name": "Ganciclovir", "group": "Antifungals and antivirals", "doseLine": "Induction: 5 mg/kg IV every 12 hours", "identity": "Ganciclovir. Nucleoside analogue for cytomegalovirus. Intravenous powder. Valganciclovir is the oral prodrug. Handle it as a cytotoxic drug. Dose on ideal or adjusted weight.", "mechanism": "Phosphorylated in CMV-infected cells and terminates viral DNA. Also toxic to host marrow. Virustatic. Not meaningful HSV encephalitis cover at these doses as a plan, and not a bacterial drug.", "spectrum": "Cytomegalovirus. Some activity on HSV and VZV, but acyclovir is the HSV drug. Not bacteria or fungi.", "indications": "Sight-threatening or tissue-invasive CMV, and induction of serious CMV disease in transplant and other immunocompromised patients. Maintenance or prophylaxis uses a lower schedule.", "adult": "Induction: 5 mg/kg IV every 12 hours, infused over at least 1 hour, usually for 14–21 days. Maintenance: 5 mg/kg IV every 24 hours, or oral valganciclovir 900 mg daily after induction if the gut works. Use ideal body weight, or adjusted weight if obese. Hydrate.", "pkpd": "Preventing CMV replication tracks AUC and the intracellular triphosphate. Renally cleared. Oral valganciclovir is well absorbed and can replace IV ganciclovir after induction. Poor casual “antiviral” effect on unrelated viruses.", "renal": "Induction is sensitive to CrCl. Above 70: 5 mg/kg every 12 hours. CrCl 50–69: 2.5 mg/kg every 12 hours. CrCl 25–49: 2.5 mg/kg every 24 hours. CrCl 10–24: 1.25 mg/kg every 24 hours. Below 10: 1.25 mg/kg three times a week, after haemodialysis. CRRT: often 2.5 mg/kg every 12–24 hours. Recheck the day kidney function moves. Maintenance doses are roughly half the induction frequency pattern on the product table.", "hepatic": "No standard hepatic reduction.", "resistance": "UL97 kinase mutations first, then UL54 polymerase mutations which also hit foscarnet and cidofovir. Suspect resistance if virus load rises after three weeks of correct dosing.", "adverse": "Neutropenia, thrombocytopenia and anaemia are expected risks. Nephrotoxicity if hydration is poor. Possible carcinogen and teratogen; the powder is handled with cytotoxic precautions. Seizures are uncommon.", "interactions": "Zidovudine and other marrow toxins add cytopenias. Imipenem plus ganciclovir has a seizure warning. Probenecid raises levels. Mycophenolate adds marrow risk.", "monitoring": "Full blood count twice weekly during induction. Creatinine. CMV viral load. Absolute neutrophil count; hold or use G-CSF according to a local threshold rather than pushing through agranulocytosis. Pregnancy test before treatment when relevant.", "special": "Septic shock in a transplant patient can be CMV syndrome, but bacterial cover still comes first until cultures return. Meningitis and retinitis: this is a tissue-invasive drug and ophthalmology needs to see the eye. Obesity: ideal or adjusted weight, never a raw total-weight 5 mg/kg. Pregnancy: avoid; teratogenic. Immunosuppression is the setting, and the dose is still the renal dose, not a higher one.", "stewardship": "Induction, then maintenance, then stop when the immune system recovers and the viral load has cleared for the guideline window. Switch to valganciclovir when oral therapy is reliable. Do not run induction doses for months."}, {"id": "oseltamivir", "name": "Oseltamivir", "group": "Antifungals and antivirals", "doseLine": "75 mg oral every 12 hours for treatment", "identity": "Oseltamivir. Neuraminidase inhibitor, taken as the oral prodrug oseltamivir phosphate. Capsules and suspension. No IV product in ordinary use.", "mechanism": "Blocks viral neuraminidase so new influenza particles cannot leave the cell. It does not kill bacteria and it does not reverse respiratory failure by itself.", "spectrum": "Influenza A and B. Not COVID, not RSV, not bacteria. Resistance by H275Y and related neuraminidase mutations appears in some seasons, especially H1N1 after prolonged exposure.", "indications": "Treatment of suspected or confirmed influenza in hospitalised and critically ill adults, started as early as possible and also when the patient has already been ill for more than 48 hours if they are severely unwell. Prophylaxis is a different, once-daily dose.", "adult": "Treatment: 75 mg oral every 12 hours. A 5-day course is the community standard; critically ill patients are often treated longer, commonly 10 days, or until viral clearance if they remain deeply immunocompromised. Prophylaxis: 75 mg once daily. Give by nasogastric tube if the capsule can be opened as the product allows. There is no benefit to doubling the dose in ordinary obesity or ordinary ICU care.", "pkpd": "Time above inhibitory concentration of the active carboxylate. The prodrug is well absorbed and converted by liver esterases. Renally cleared. Starting late is less effective but still indicated in severe disease.", "renal": "CrCl above 60: 75 mg every 12 hours. CrCl 31–60: 30 mg every 12 hours. CrCl 11–30: 30 mg every 24 hours. Haemodialysis: often 30 mg after each session, or 30 mg immediately then after every session for a short course. CRRT: usually 75 mg every 12 hours because the drug is cleared. SLED: follow a local table, closer to the CRRT dose if sessions are prolonged. Give the first severe-disease dose while the creatinine is being confirmed.", "hepatic": "No hepatic adjustment for ordinary impairment.", "resistance": "Neuraminidase H275Y and related substitutions. A rising viral load on therapy in an immunocompromised patient is the clue. Zanamivir is the usual alternative and is not on this list.", "adverse": "Nausea and vomiting, improved if taken with food. Neuropsychiatric events have been reported, mostly in younger people, and are hard to separate from influenza itself. Rare rash.", "interactions": "Probenecid raises exposure. Live attenuated influenza vaccine should not be given from 48 hours before until two weeks after the drug. Few CYP problems.", "monitoring": "Creatinine at the start. Clinical fever curve and oxygen requirement. A repeat respiratory PCR in the immunocompromised or in failure to improve. No serum level and no ECG routine.", "special": "Septic shock during influenza season still needs antibacterials for bacterial superinfection; oseltamivir does not replace them. It is not a meningitis drug. Obesity: 75 mg, not mg/kg. Pregnancy: treat confirmed or strongly suspected influenza; pregnancy is a reason to start, not to withhold. Immunosuppression: consider the longer course. Allergy to the prodrug is uncommon.", "stewardship": "Stop if an alternative diagnosis is secure and influenza PCR is negative. Do not extend community courses past 5 days out of habit. Do not use prophylaxis dosing to treat pneumonia. Antibacterials stop when bacterial infection is excluded, separately from this decision."}]</script>
<script>
const DRUGS = JSON.parse(document.getElementById("data").textContent);
const DOMAINS = [
  ["identity","Identity","Generic name, class, subclass and available formulations"],
  ["mechanism","Mechanism","Molecular target and bactericidal versus bacteriostatic action"],
  ["spectrum","Spectrum","Gram-positive, Gram-negative, anaerobes, atypicals and key resistant organisms"],
  ["indications","Indications","First-line, alternative and combination-treatment roles"],
  ["adult","Adult dosing","Dose, route, interval, infusion duration and maximum dose"],
  ["pkpd","PK/PD","Killing characteristics, index predicting efficacy, distribution and penetration"],
  ["renal","Renal dosing","CrCl-based adjustment, AKI, CRRT, SLED and haemodialysis"],
  ["hepatic","Hepatic dosing","Whether adjustment is required and relevant precautions"],
  ["resistance","Resistance","Intrinsic resistance, acquired resistance and important resistance genes"],
  ["adverse","Adverse effects","Common, serious and characteristic toxicities"],
  ["interactions","Interactions","Clinically significant drug-drug interactions"],
  ["monitoring","Monitoring","Renal function, liver function, blood counts, ECG, drug levels where relevant"],
  ["special","Special situations","Septic shock, meningitis, obesity, pregnancy, allergy and immunosuppression"],
  ["stewardship","Stewardship","De-escalation, duration, oral step-down and when not to use it"]
];
const GROUPS = ["Beta-lactams","Newer resistant Gram-negative agents","Gram-positive agents","Aminoglycosides and polymyxins","Other antibacterial agents","Antifungals and antivirals"];
const NOTES = {
  "Gram-positive agents":"Ceftaroline is filed with the beta-lactams. Where teicoplanin is not stocked, vancomycin is the usual glycopeptide. Linezolid or daptomycin can stand in when the site allows.",
  "Newer resistant Gram-negative agents":"Aztreonam-avibactam and sulbactam-durlobactam are listed for centres where those products are available. They are not substitutes for the older agent in the name."
};
function shortGroup(name){
  if(name.indexOf("Newer")===0) return "Resistant Gram-negatives";
  if(name.indexOf("Aminoglycosides")===0) return "Aminoglycosides";
  if(name.indexOf("Other")===0) return "Other antibacterials";
  if(name.indexOf("Antifungals")===0) return "Antifungals and antivirals";
  return name;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return "&#"+c.charCodeAt(0)+";";
  });
}

const app = document.getElementById("app");
let query = "", group = "All";
function readId(){
  const raw = location.hash.replace(/^#/, "");
  if(!raw) return null;
  const id = decodeURIComponent(raw);
  return DRUGS.some(function(d){ return d.id===id; }) ? id : null;
}
function list(){
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return DRUGS.filter(function(drug){
    if(group!=="All" && drug.group!==group) return false;
    if(!words.length) return true;
    const hay = [drug.name, drug.group, drug.doseLine].concat(DOMAINS.map(function(d){ return drug[d[0]]; })).join(" ").toLowerCase();
    return words.every(function(word){ return hay.indexOf(word)!==-1; });
  });
}
function render(){
  const open = DRUGS.find(function(d){ return d.id===readId(); });
  if(open){ monograph(open); return; }
  const rows = list();
  const chips = ["All"].concat(GROUPS).map(function(name){
    return '<button type="button" data-group="'+esc(name)+'" class="'+(group===name?"on":"")+'">'+(name==="All"?"All":esc(shortGroup(name)))+"</button>";
  }).join("");
  app.innerHTML =
    '<p class="kicker">Critical care hub</p>'+
    "<h1>Drugs and doses</h1>"+
    '<p class="lede">Adult teaching monographs. Fourteen domains on every drug. Confirm the product label, the indication and local guidance before a dose is given.</p>'+
    '<p class="notice">Not a prescription. CrCl bands use Cockcroft-Gault. Where a CRRT or SLED milligram is not on the label, the page says so and gives the usual ICU practice rather than inventing a false precision.</p>'+
    '<input class="find" id="find" type="search" placeholder="Search a drug, a gene, or a syndrome" value="'+esc(query)+'" aria-label="Search drugs">'+
    '<div class="chips" id="chips">'+chips+"</div>"+
    (NOTES[group]?'<p class="note">'+esc(NOTES[group])+"</p>":"")+
    '<p class="count">'+rows.length+(rows.length===1?" drug":" drugs")+"</p>"+
    (rows.length? rows.map(function(drug){
      return '<button type="button" class="drug" data-id="'+esc(drug.id)+'"><b>'+esc(drug.name)+"</b><span>"+esc(drug.doseLine)+"</span><i>"+esc(drug.group)+"</i></button>";
    }).join("") : '<p class="empty">Nothing in this bank matches that.</p>')+
    '<p class="foot"><a href="index.html">Back to the body</a></p>';
  const find = document.getElementById("find");
  find.oninput = function(){ query = find.value; const pos = find.selectionStart; render(); const next = document.getElementById("find"); next.focus(); next.setSelectionRange(pos, pos); };
  document.getElementById("chips").onclick = function(event){
    const btn = event.target.closest("[data-group]");
    if(!btn) return;
    group = btn.getAttribute("data-group");
    render();
  };
  app.onclick = function(event){
    const btn = event.target.closest("[data-id]");
    if(!btn || !btn.getAttribute("data-id")) return;
    location.hash = encodeURIComponent(btn.getAttribute("data-id"));
  };
}
function monograph(drug){
  const sections = DOMAINS.map(function(domain, index){
    const paras = String(drug[domain[0]]||"").split("\n").filter(Boolean).map(function(line){ return "<p>"+esc(line)+"</p>"; }).join("");
    return '<section class="sec" id="'+esc(drug.id+"-"+domain[0])+'"><p class="kicker">'+String(index+1).padStart(2,"0")+" · "+esc(domain[1])+"</p><h2>"+esc(domain[2])+"</h2>"+paras+"</section>";
  }).join("");
  const jumps = DOMAINS.map(function(domain){
    return '<button type="button" data-jump="'+esc(drug.id+"-"+domain[0])+'">'+esc(domain[1])+"</button>";
  }).join("");
  app.innerHTML =
    '<button type="button" class="back" id="back">All drugs</button>'+
    '<p class="kicker">'+esc(drug.group)+"</p><h1>"+esc(drug.name)+"</h1>"+
    '<p class="dose">'+esc(drug.doseLine)+"</p>"+
    '<div class="chips" id="jumps">'+jumps+"</div>"+
    sections+
    '<p class="foot">Teaching figures for adults. They do not replace the monograph, a renal-replacement order, or a local antimicrobial policy.</p>';
  document.getElementById("back").onclick = function(){
    history.pushState(null, "", location.pathname + location.search);
    render();
    scrollTo(0,0);
  };
  document.getElementById("jumps").onclick = function(event){
    const btn = event.target.closest("[data-jump]");
    if(!btn) return;
    const node = document.getElementById(btn.getAttribute("data-jump"));
    if(node) node.scrollIntoView({behavior:"smooth", block:"start"});
  };
}
window.addEventListener("hashchange", function(){ render(); scrollTo(0,0); });
window.addEventListener("popstate", function(){ render(); });
render();
</script>
</body>
</html>
