<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Antibiotic reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#071018;--fg:#f3efe6;--muted:#b7b1a4;--faint:#8a8478;--line:rgba(243,239,230,.18);--cool:#7fd4e6;--warm:#e2b48a}
*{box-sizing:border-box}
html,body{margin:0;background:#05070c;color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh;padding:14px 14px 28px}
button,a,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
a{color:var(--cool)}
.back{display:block;margin-left:auto;background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px;text-align:right}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:520;letter-spacing:-.03em;line-height:1.05}
h1{font-size:40px;margin:6px 0 8px}
h2{font-size:28px;margin:18px 0 8px}
.kicker{margin:0;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--faint)}
.lede{margin:0 0 12px;color:var(--muted);line-height:1.45;max-width:40rem}
.notice{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(226,180,138,.45);border-radius:14px;color:var(--warm);line-height:1.4}
.doors{display:flex;flex-direction:column;gap:10px}
.door{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:18px;min-height:132px;padding:16px 18px 18px;color:var(--fg)}
.door span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.door strong{display:block;margin-top:8px;font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:520;letter-spacing:-.03em}
.door em{display:block;margin-top:6px;font-style:normal;color:var(--muted);line-height:1.35}
.door.a{background:radial-gradient(80% 50% at 50% 100%,rgba(127,212,230,.16),transparent 70%),radial-gradient(120% 80% at 50% 0%,#12343f,#071018 70%);box-shadow:inset 0 0 0 1px rgba(127,212,230,.4)}
.door.a span{color:var(--cool)}
.door.b{background:radial-gradient(80% 46% at 50% 100%,rgba(226,180,138,.18),transparent 70%),radial-gradient(120% 80% at 50% 0%,#3a2a1c,#071018 70%);box-shadow:inset 0 0 0 1px rgba(226,180,138,.45)}
.door.b span{color:var(--warm)}
.door.c{background:radial-gradient(80% 50% at 50% 100%,rgba(170,196,168,.18),transparent 70%),radial-gradient(120% 80% at 50% 0%,#1c3324,#071018 70%);box-shadow:inset 0 0 0 1px rgba(170,196,168,.45)}
.door.c span{color:#b7d2b8}
.find{width:100%;background:#0c1822;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;margin:8px 0 14px}
.sub{margin-top:18px}
.sub h2{font-size:22px}
.drug{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 0;min-height:44px}
.drug b{display:block;font-size:17px}
.drug span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.mono p{margin:0 0 10px;line-height:1.45}
.mono h3{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:18px;margin:16px 0 6px}
ul{margin:0 0 10px;padding-left:18px;color:var(--muted);line-height:1.45}
.pearl{padding:12px 14px;border-radius:14px;background:#102028;border:1px solid rgba(127,212,230,.28);line-height:1.45}
label{display:block;margin:12px 0 4px;color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
input,select{width:100%;background:#0c1822;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
.go{margin-top:16px;width:100%;min-height:56px;border:0;border-radius:14px;background:#12343f;color:var(--fg);font-family:Fraunces,Georgia,serif;font-size:20px}
.out{margin-top:16px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#0c1418}
.out b{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px}
.warn{color:#e7b2b2}
.ok{color:#b7d7c0}
.gram{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gram button{background:none;border:0;color:var(--warm);min-height:44px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<p class="kicker">Drugs and doses</p>
<h1 id="title">Antibiotics</h1>
<p class="notice" id="notice"></p>
<div id="app"></div>
<script src="abx-data.js?v=20261022d"></script>
<script>
const app = document.getElementById("app");
const title = document.getElementById("title");
document.getElementById("notice").textContent = ABX.notice;
const KEY = "abx-antibiogram-v1";
let view = "home";
let openId = null;

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}
function drugs(){
  const list = [];
  ABX.classes.forEach(function(klass){
    klass.groups.forEach(function(group){
      group.subclasses.forEach(function(sub){
        sub.drugs.forEach(function(drug){
          list.push({klass:klass, group:group, sub:sub, drug:drug});
        });
      });
    });
  });
  return list;
}
function findDrug(id){
  return drugs().find(function(row){ return row.drug.id === id; });
}
function gram(){
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch(e){ return []; }
}
function saveGram(rows){ localStorage.setItem(KEY, JSON.stringify(rows)); }
function back(label, fn){
  const btn = document.createElement("button");
  btn.className = "back";
  btn.type = "button";
  btn.textContent = label;
  btn.onclick = fn;
  return btn;
}
function home(){
  view = "home"; openId = null; title.textContent = "Antibiotics";
  app.innerHTML = "";
  app.appendChild(back("Back to the body", function(){ location.href = "index.html?v=20261022d"; }));
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = "Three layers. The penicillins are loaded. Other classes are not invented to fill the bank.";
  const doors = document.createElement("div");
  doors.className = "doors";
  doors.innerHTML =
    '<button type="button" class="door a" data-go="ref"><span>Layer 1</span><strong>Drug reference</strong><em>Search the class, then open the monograph.</em></button>'+
    '<button type="button" class="door b" data-go="calc"><span>Layer 2</span><strong>Dose check</strong><em>Renal clearance, hepatic risk, CRRT and SLED. No invented milligram.</em></button>'+
    '<button type="button" class="door c" data-go="engine"><span>Layer 3</span><strong>Prescribing check</strong><em>Culture, mechanism, MIC, and the antibiogram stored on this device.</em></button>';
  app.appendChild(lede);
  app.appendChild(doors);
  doors.onclick = function(event){
    const btn = event.target.closest("[data-go]");
    if(!btn) return;
    const go = btn.getAttribute("data-go");
    if(go==="ref") reference("");
    else if(go==="calc") calculator();
    else engine();
  };
}
function reference(q){
  view = "ref"; title.textContent = "Drug reference";
  app.innerHTML = "";
  app.appendChild(back("Back to the layers", home));
  const input = document.createElement("input");
  input.className = "find";
  input.type = "search";
  input.placeholder = "Search a drug, a class, or an organism";
  input.value = q || "";
  app.appendChild(input);
  const host = document.createElement("div");
  app.appendChild(host);
  function paint(){
    const query = input.value.trim().toLowerCase();
    host.innerHTML = "";
    ABX.classes.forEach(function(klass){
      klass.groups.forEach(function(group){
        group.subclasses.forEach(function(sub){
          const hits = sub.drugs.filter(function(drug){
            if(!query) return true;
            const hay = [drug.name, drug.dose, sub.name, group.name, klass.name, sub.moa, sub.use, sub.spectrum, sub.pearl, (sub.adverse||[]).join(" ")].join(" ").toLowerCase();
            return query.split(/\s+/).every(function(word){ return hay.indexOf(word)!==-1; });
          });
          if(!hits.length) return;
          const block = document.createElement("section");
          block.className = "sub";
          block.innerHTML = "<p class='kicker'>"+esc(klass.name)+" · "+esc(group.name)+"</p><h2>"+esc(sub.name)+"</h2>";
          hits.forEach(function(drug){
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "drug";
            btn.innerHTML = "<b>"+esc(drug.name)+"</b><span>"+esc(drug.dose)+"</span>";
            btn.onclick = function(){ monograph(drug.id); };
            block.appendChild(btn);
          });
          host.appendChild(block);
        });
      });
    });
    if(!host.children.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing in the loaded bank matches that.";
      host.appendChild(p);
    }
  }
  input.oninput = paint;
  paint();
  input.focus();
}
function list(items){
  if(!items || !items.length) return "";
  return "<ul>"+items.map(function(item){ return "<li>"+esc(item)+"</li>"; }).join("")+"</ul>";
}
function monograph(id){
  const row = findDrug(id);
  if(!row){ reference(""); return; }
  openId = id; view = "drug"; title.textContent = row.drug.name;
  const sub = row.sub;
  app.innerHTML = "";
  app.appendChild(back("Back to the reference", function(){ reference(""); }));
  const mono = document.createElement("article");
  mono.className = "mono";
  mono.innerHTML =
    "<p class='kicker'>"+esc(row.klass.name)+" · "+esc(sub.name)+"</p>"+
    "<h2>Teaching dose</h2><p>"+esc(row.drug.dose)+"</p>"+
    (row.drug.notes?list(row.drug.notes):"")+
    "<h3>Mechanism</h3><p>"+esc(sub.moa||"")+"</p>"+
    (sub.pharm?"<h3>Pharmacology</h3><p>"+esc(sub.pharm)+"</p>":"")+
    (sub.use?"<h3>Clinical applications</h3><p>"+esc(sub.use)+"</p>":"")+
    (sub.spectrum?"<h3>Spectrum</h3><p>"+esc(sub.spectrum)+"</p>":"")+
    "<h3>Contraindications and precautions</h3>"+list(sub.contra)+
    "<h3>Adverse effects</h3>"+list(sub.adverse)+
    "<h3>Dose modification</h3><p>"+esc(sub.renalText)+" "+esc(sub.hepaticText)+"</p>"+
    "<h3>Monitoring</h3><p>"+esc(sub.monitor)+"</p>"+
    (sub.pearl?"<h3>Pearl</h3><p class='pearl'>"+esc(sub.pearl)+"</p>":"");
  app.appendChild(mono);
  const again = document.createElement("button");
  again.className = "go";
  again.type = "button";
  again.textContent = "Check this dose";
  again.onclick = function(){ calculator(id); };
  app.appendChild(again);
}
function field(label, html){
  const wrap = document.createElement("div");
  wrap.innerHTML = "<label>"+esc(label)+"</label>"+html;
  return wrap;
}
function calculator(preset){
  view = "calc"; title.textContent = "Dose check";
  app.innerHTML = "";
  app.appendChild(back("Back to the layers", home));
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = "Cockcroft–Gault is calculated here. The milligram in the result is the teaching example from the bank. A lower number is not invented for CRRT, SLED, or a creatinine clearance.";
  app.appendChild(lede);
  const options = drugs().map(function(row){
    return "<option value='"+esc(row.drug.id)+"'"+(row.drug.id===preset?" selected":"")+">"+esc(row.drug.name)+"</option>";
  }).join("");
  const form = document.createElement("form");
  form.innerHTML =
    "<label>Drug</label><select name='drug'>"+options+"</select>"+
    "<div class='row'><div><label>Age (years)</label><input name='age' inputmode='numeric' autocomplete='off'></div>"+
    "<div><label>Sex</label><select name='sex'><option value='female'>Female</option><option value='male'>Male</option></select></div></div>"+
    "<label>Weight (kg)</label><input name='weight' inputmode='decimal' autocomplete='off'>"+
    "<div class='row'><div><label>Creatinine</label><input name='scr' inputmode='decimal' autocomplete='off'></div>"+
    "<div><label>Unit</label><select name='unit'><option value='umol'>µmol/L</option><option value='mg'>mg/dL</option></select></div></div>"+
    "<label>Liver</label><select name='liver'><option value='none'>No hepatic impairment stated</option><option value='mild'>Mild</option><option value='moderate'>Moderate</option><option value='severe'>Severe</option></select>"+
    "<label>Renal replacement</label><select name='rrt'><option value='none'>None</option><option value='ihd'>Intermittent haemodialysis</option><option value='crrt'>CRRT</option><option value='sled'>SLED</option></select>"+
    "<label>Severity</label><select name='severe'><option value='no'>Not described as severe</option><option value='yes'>Severe infection</option></select>"+
    "<button class='go' type='submit'>Show the teaching check</button>";
  const out = document.createElement("div");
  form.onsubmit = function(event){
    event.preventDefault();
    const data = new FormData(form);
    out.innerHTML = doseReport(Object.fromEntries(data.entries()));
  };
  app.appendChild(form);
  app.appendChild(out);
}
function crcl(age, sex, kg, scr, unit){
  const nAge = Number(age), nKg = Number(kg), nScr = Number(scr);
  if(!(nAge>0 && nKg>0 && nScr>0) || nAge>120 || nKg>400) return null;
  const mg = unit==="umol" ? nScr/88.4 : nScr;
  if(!(mg>0)) return null;
  let value = ((140-nAge)*nKg)/(72*mg);
  if(sex==="female") value *= 0.85;
  return value;
}
function doseReport(data){
  const row = findDrug(data.drug);
  if(!row) return "<p class='empty'>Choose a drug from the bank.</p>";
  const clearance = crcl(data.age, data.sex, data.weight, data.scr, data.unit);
  const sub = row.sub;
  let renal = sub.renalText;
  if(clearance!=null && clearance<30) renal += " The calculated clearance is under 30 mL/min, so the renal sentence above applies with more force. This page still does not substitute a reduced dose.";
  else if(clearance!=null && clearance<60) renal += " The calculated clearance is under 60 mL/min. Confirm whether this formulation is one that the monograph adjusts.";
  let hepatic = sub.hepaticText;
  if((data.liver==="moderate" || data.liver==="severe") && row.drug.id==="amox-clav"){
    hepatic = "Moderate or severe hepatic impairment plus amoxicillin–clavulanate: liver injury is the stated risk. No reduced milligram is in the bank. Check liver tests and the monograph.";
  }
  let rrt = "No renal replacement is selected. "+sub.rrtText;
  if(data.rrt==="crrt") rrt = "CRRT is selected. "+sub.rrtText;
  if(data.rrt==="sled") rrt = "SLED is selected. "+sub.rrtText;
  if(data.rrt==="ihd") rrt = "Intermittent haemodialysis is selected. "+sub.rrtText;
  let severe = "";
  if(data.severe==="yes" && row.drug.id==="pen-g") severe = "Severe infection: the bank says high-dose penicillin G regimens may be required. The exact high dose is indication-specific.";
  if(data.severe==="yes" && row.drug.id==="pip-tazo") severe = "Severe infection: extended-infusion piperacillin–tazobactam is used in selected cases. The interval still has to account for clearance and replacement therapy.";
  const clearanceLine = clearance==null
    ? "Creatinine clearance was not calculated. Age, weight, and creatinine are all required."
    : "Cockcroft–Gault estimate: "+clearance.toFixed(0)+" mL/min. This is not a measured clearance.";
  return "<div class='out'><p class='kicker'>"+esc(row.drug.name)+"</p><p><b>"+esc(row.drug.dose)+"</b></p><p>"+esc(clearanceLine)+"</p><p>"+esc(renal)+"</p><p>"+esc(hepatic)+"</p><p>"+esc(rrt)+"</p>"+(severe?"<p>"+esc(severe)+"</p>":"")+"<p>"+esc(sub.monitor)+"</p></div>";
}
function engine(){
  view = "engine"; title.textContent = "Prescribing check";
  app.innerHTML = "";
  app.appendChild(back("Back to the layers", home));
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = "The check uses only the pearls in this bank. It does not invent a regimen for a syndrome that was not described.";
  app.appendChild(lede);
  const form = document.createElement("form");
  form.innerHTML =
    "<label>Syndrome in the bank</label><select name='focus'>"+
      "<option value='unspecified'>Not one of the listed syndromes</option>"+
      "<option value='strep'>Susceptible streptococcal infection</option>"+
      "<option value='syphilis'>Syphilis</option>"+
      "<option value='enterococcus'>Enterococcus, susceptibility known or pending</option>"+
      "<option value='listeria'>Listeria monocytogenes</option>"+
      "<option value='esbl'>Serious ESBL-producing Enterobacterales infection</option>"+
    "</select>"+
    "<label>Shock</label><select name='shock'><option value='no'>Not septic shock</option><option value='yes'>Septic shock</option></select>"+
    "<label>Penicillin allergy</label><select name='allergy'><option value='none'>No penicillin allergy stated</option><option value='delayed'>Delayed or unclear reaction</option><option value='immediate'>Serious immediate hypersensitivity</option></select>"+
    "<label>Organism named on the culture</label><input name='organism' autocomplete='off' placeholder='Leave blank if no culture'>"+
    "<label>Reported susceptibility</label><select name='susc'><option value='unknown'>Not reported</option><option value='S'>Susceptible</option><option value='I'>Intermediate or susceptible dose-dependent</option><option value='R'>Resistant</option></select>"+
    "<label>Resistance mechanism</label><select name='mech'><option value='none'>None stated</option><option value='esbl'>ESBL</option><option value='other'>Other mechanism</option></select>"+
    "<label>MIC, if the laboratory reported one</label><input name='mic' autocomplete='off' placeholder='No breakpoint is stored in this bank'>"+
    "<button class='go' type='submit'>Run the check</button>";
  const out = document.createElement("div");
  form.onsubmit = function(event){
    event.preventDefault();
    out.innerHTML = engineReport(Object.fromEntries(new FormData(form).entries()));
  };
  app.appendChild(form);
  app.appendChild(out);
  app.appendChild(gramEditor());
}
function matchGram(organism, drugId){
  const name = (organism||"").trim().toLowerCase();
  if(!name) return [];
  return gram().filter(function(row){
    return row.drugId===drugId && name.indexOf(String(row.organism).toLowerCase())!==-1 || String(row.organism).toLowerCase().indexOf(name)!==-1 && row.drugId===drugId;
  });
}
function gramLine(organism, drugId, drugName){
  const rows = matchGram(organism, drugId);
  if(!rows.length) return "No local antibiogram row on this device matches "+drugName+" and that organism.";
  return rows.map(function(row){ return "Stored antibiogram: "+row.organism+", "+drugName+", "+row.percent+"% susceptible. This bank does not set an empirical threshold."; }).join(" ");
}
function engineReport(data){
  const lines = [];
  const organism = (data.organism||"").trim();
  if(data.allergy==="immediate"){
    lines.push("Serious immediate hypersensitivity is stated. Do not choose a penicillin from this bank. Cross-reactivity with other beta-lactams depends on the allergy history and the side-chain. No alternative class is loaded.");
  } else {
    if(data.allergy==="delayed") lines.push("The allergy is delayed or unclear. A penicillin is not automatically excluded, and it is not automatically safe. Use the history and the side-chain.");
    if(data.focus==="esbl" || data.mech==="esbl"){
      lines.push("Piperacillin–tazobactam should not automatically be considered definitive therapy for every serious ESBL-producing Enterobacterales infection. The organism, site, susceptibility, severity, and current guidance decide.");
      lines.push(gramLine(organism, "pip-tazo", "Piperacillin–tazobactam"));
    }
    if(data.focus==="enterococcus" || data.focus==="listeria"){
      if(data.susc==="R") lines.push("The report says resistant. Ampicillin is then not a targeted option, whatever the syndrome.");
      else {
        lines.push("Ampicillin is an important targeted option for susceptible enterococci and Listeria. Teaching dose: 1–2 g IV every 4–6 hours, depending on indication.");
        if(data.shock==="yes") lines.push("Septic shock: amoxicillin by mouth is not an empirical substitute for IV therapy.");
        if(data.susc==="unknown") lines.push("Susceptibility is not on the report yet. Keep this as a targeted plan for a susceptible isolate, not as proof that this isolate is susceptible.");
        lines.push(gramLine(organism, "ampi", "Ampicillin"));
      }
    }
    if(data.focus==="syphilis"){
      lines.push("Syphilis is a stated use of the natural penicillins. Benzathine penicillin G is indication-specific deep intramuscular treatment. Never administer that formulation intravenously.");
      lines.push("Penicillin G intravenous dosing is indication-specific. High-dose regimens may be required for severe infection.");
    }
    if(data.focus==="strep"){
      if(data.susc==="R") lines.push("The report says resistant. A natural penicillin is not supported for this isolate.");
      else {
        lines.push("Susceptible streptococcal infection is a stated use of the natural penicillins.");
        if(data.shock==="yes") lines.push("Septic shock needs an intravenous plan. Penicillin V and amoxicillin by mouth are not empirical substitutes for IV therapy.");
        else lines.push("Penicillin V teaching example, for a selected infection that can be treated orally: 250–500 mg every 6 hours.");
        lines.push(gramLine(organism, "pen-g", "Penicillin G"));
      }
    }
    if(data.focus==="unspecified" && data.mech!=="esbl"){
      lines.push("This syndrome is not one of the applications written into the bank. No empirical drug is added.");
    }
    if(data.mech==="other") lines.push("Another resistance mechanism is named. The bank has no rule for it. Do not stretch the ESBL pearl to cover it.");
  }
  if((data.mic||"").trim()) lines.push("MIC entered: "+data.mic.trim()+". No breakpoint is stored here, so this page does not call that MIC susceptible or resistant.");
  if(data.susc==="I") lines.push("Intermediate or dose-dependent susceptibility needs the laboratory definition and the dose the monograph ties to that category. The bank does not convert it into a susceptible result.");
  if(!lines.length) lines.push("Nothing in the loaded rules fired.");
  return "<div class='out'>"+lines.map(function(line){ return "<p>"+esc(line)+"</p>"; }).join("")+"</div>";
}
function gramEditor(){
  const box = document.createElement("section");
  box.className = "sub";
  const head = document.createElement("h2");
  head.textContent = "Local antibiogram on this device";
  box.appendChild(head);
  const note = document.createElement("p");
  note.className = "lede";
  note.textContent = "Nothing is preloaded. Enter the percent your unit quotes. It stays in this browser only.";
  box.appendChild(note);
  const options = drugs().map(function(row){
    return "<option value='"+row.drug.id+"'>"+esc(row.drug.name)+"</option>";
  }).join("");
  const form = document.createElement("form");
  form.innerHTML =
    "<label>Organism</label><input name='organism' autocomplete='off'>"+
    "<label>Drug</label><select name='drug'>"+options+"</select>"+
    "<label>Percent susceptible</label><input name='percent' inputmode='decimal' autocomplete='off'>"+
    "<button class='go' type='submit'>Store this row</button>";
  const listHost = document.createElement("div");
  function paint(){
    listHost.innerHTML = "";
    const rows = gram();
    if(!rows.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No antibiogram row stored.";
      listHost.appendChild(p);
      return;
    }
    rows.forEach(function(row, index){
      const item = document.createElement("div");
      item.className = "gram";
      const drug = findDrug(row.drugId);
      item.innerHTML = "<span>"+esc(row.organism)+" · "+esc(drug?drug.drug.name:row.drugId)+" · "+esc(row.percent)+"%</span>";
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "Remove";
      del.onclick = function(){
        const next = gram();
        next.splice(index, 1);
        saveGram(next);
        paint();
      };
      item.appendChild(del);
      listHost.appendChild(item);
    });
  }
  form.onsubmit = function(event){
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const percent = Number(data.percent);
    const organism = data.organism.trim();
    if(!organism || !(percent>=0 && percent<=100)) return;
    const rows = gram();
    rows.push({organism:organism, drugId:data.drug, percent:Math.round(percent*10)/10});
    saveGram(rows);
    form.reset();
    paint();
  };
  box.appendChild(form);
  box.appendChild(listHost);
  paint();
  return box;
}
home();
</script>
</body>
</html>
