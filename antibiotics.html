y protein bound.", "renal": "CrCl at least 30: every 24 hours. CrCl below 30: every 48 hours. Haemodialysis: every 48 hours, after dialysis. CRRT clears the drug, so many ICUs stay on every 24 hours rather than the anuric interval; confirm locally. Do not stretch the interval on a high-effluent circuit and call it safer.", "hepatic": "No hepatic adjustment. CPK still needs watching.", "resistance": "Thickened cell walls and mprF mutations, sometimes appearing on vancomycin exposure. Not active in pneumonia regardless of MIC.", "adverse": "Myopathy and a rising CPK, eosinophilic pneumonia, and rarely peripheral neuropathy. Nausea. Less nephrotoxicity than vancomycin.", "interactions": "Hold HMG-CoA reductase inhibitors during therapy. Other myotoxins add risk. No important CYP effect.", "monitoring": "CPK at baseline and at least weekly, sooner if muscle pain or a statin was recent. Creatinine, because it sets the interval. Eosinophil count and new pulmonary infiltrates. No routine serum level.", "special": "Septic shock from MRSA bacteraemia: high mg/kg dose now. Any pneumonia, including influenza superinfection: do not use it. Meningitis: ineffective. Obesity: discuss actual versus adjusted weight and do not exceed a careless 12 mg/kg on total weight without advice. Pregnancy: limited data. It is not a beta-lactam allergy cross-reactor, so it is useful in anaphylaxis when the organism is Gram-positive.", "stewardship": "If the label says pneumonia, choose something else. Switch MSSA to cefazolin. Stop when cultures clear and an oral linezolid or co-trimoxazole step-down fits the syndrome. Do not combine with a statin “just in case”."}, {"id": "dalbavancin", "name": "Dalbavancin", "group": "Gram-positive agents", "doseLine": "1500 mg IV once, over 30 minutes", "identity": "Dalbavancin. Long-acting lipoglycopeptide. Intravenous powder. A single dose lasts more than a week. Not a drug for the unstable septic patient who still needs daily review.", "mechanism": "Inhibits cell-wall synthesis by binding D-alanyl-D-alanine, with a lipophilic side chain that anchors it in the membrane. Bactericidal against many Gram-positives. Half-life is about 14 days.", "spectrum": "MRSA, MSSA and streptococci. Not Gram-negatives, not vanA VRE as reliable cover, not anaerobes.", "indications": "Acute bacterial skin and skin-structure infection when a single IV dose avoids a hospital stay. Off-label bone and joint regimens exist and belong to a specialist plan, not a one-line ICU order.", "adult": "1500 mg IV once over 30 minutes. Alternative: 1000 mg on day 1 and 500 mg one week later. Do not stack daily glycopeptides on top without a reason.", "pkpd": "AUC with an extremely long tail. Renal excretion and some faecal loss. Poor urinary levels early, so not a pyelonephritis drug. Unsuitable when you may need to stop therapy tomorrow because the culture grew a Gram-negative.", "renal": "CrCl 30 or above, and patients already on regular haemodialysis: no change, 1500 mg. CrCl below 30 and not on regular haemodialysis: 1125 mg once. CRRT: little formal guidance; do not give a long-acting drug to a patient whose clearance is swinging without pharmacy and infectious-diseases input.", "hepatic": "No adjustment for mild impairment. Caution in severe hepatic disease because data are limited.", "resistance": "vanA-type enterococci. Ordinary MRSA remains the target. You cannot retrieve the dose if the organism is resistant.", "adverse": "Nausea, headache, diarrhoea, infusion reactions, and rare ALT rise. Hypersensitivity can appear after the patient has gone home, because the drug is still present.", "interactions": "Few CYP interactions. Do not co-administer a full vancomycin course “for safety”; the exposures stack.", "monitoring": "Creatinine before the dose, to choose 1500 versus 1125 mg. No weekly level. Blood count and liver tests only if a prolonged off-label regimen is used. The patient needs a number to call if a rash starts days later.", "special": "Septic shock: do not use a one-shot drug as the only Gram-positive agent while the source is unknown. Meningitis: no. Obesity: the gram dose is not mg/kg. Pregnancy: avoid unless no alternative. Glycopeptide anaphylaxis: avoid.", "stewardship": "A discharge drug, not an ICU resuscitation drug. If blood cultures are pending, choose vancomycin or linezolid so you can stop. Do not use it for urinary infection or Gram-negative cover."}, {"id": "amikacin", "name": "Amikacin", "group": "Aminoglycosides and polymyxins", "doseLine": "One 15–20 mg/kg IV dose, then stop or follow levels", "identity": "Amikacin. Aminoglycoside. Intravenous solution or powder. Also used in some inhaled regimens that are not interchangeable with the IV dose.", "mechanism": "Binds the 30S ribosome and causes misreading of mRNA. Rapidly bactericidal and concentration-dependent. A post-antibiotic effect allows once-daily dosing.", "spectrum": "Many Gram-negatives, including some gentamicin-resistant Pseudomonas and Enterobacterales. Synergy against some enterococci and streptococci only in combination. Not anaerobes, not atypicals, not MRSA monotherapy.", "indications": "A single high dose, or a very short course, added to a beta-lactam for severe Gram-negative shock or for a resistant isolate that is susceptible. IDSA-style cystitis: 15 mg/kg IV once. Other serious infections: about 20 mg/kg IV once, then redose only with pharmacokinetic advice.", "adult": "Extended-interval: 15 mg/kg IV for cystitis once, or 15–20 mg/kg IV for systemic infection, infused over 30–60 minutes. Use ideal or adjusted body weight if the patient is obese, not a raw total weight at the extreme. Do not write a standing q8h order. Traditional divided dosing is reserved for endocarditis synergy protocols.", "pkpd": "Peak over MIC predicts killing. Once-daily dosing maximises the peak and lets the trough fall, which limits toxicity. Extracellular, renally cleared, poor CSF, excellent urine. Lung levels of IV drug are modest; inhaled drug is a different strategy.", "renal": "The first severe-infection dose is full. The next dose is late or cancelled if CrCl is low: below about 60 mL/min, extend beyond 24 hours using a nomogram or a level. Haemodialysis: redose after dialysis by level, typically a lower mg/kg. CRRT and SLED: levels, not a blind daily 20 mg/kg. AKI is a reason to give one dose and stop, not to start a week of therapy.", "hepatic": "No hepatic adjustment. Ascites does not justify a larger dose.", "resistance": "Aminoglycoside-modifying enzymes; amikacin resists some of the enzymes that destroy gentamicin. 16S rRNA methyltransferases confer high-level resistance to all aminoglycosides. Anaerobes are intrinsically resistant.", "adverse": "Nephrotoxicity and irreversible ototoxicity, both vestibular and cochlear. Neuromuscular blockade, worse with myasthenia or magnesium. The toxicity rises sharply after a few days.", "interactions": "Other nephrotoxins and loop diuretics add injury. Neuromuscular blockers are prolonged. Do not mix in the same bag as a beta-lactam. Vancomycin adds kidney risk.", "monitoring": "Creatinine. A peak 30 minutes after the infusion if therapy continues, and a random level used with a nomogram, or a trough before any repeat dose. Hearing and balance complaints. No routine ECG.", "special": "Septic shock: one appropriate mg/kg dose with the beta-lactam, then reassess tomorrow. Meningitis: IV amikacin is not adequate CSF therapy. Obesity: adjusted body weight. Pregnancy: avoid if another active drug exists, because of fetal ototoxicity. It is useful in beta-lactam allergy because it is unrelated.", "stewardship": "Most ICU courses should be one to three doses. Do not continue “until the culture is negative” without levels and a susceptible MIC. Stop when the beta-lactam is active. Never monotherapy for pneumonia outside a specific inhaled protocol."}, {"id": "gentamicin", "name": "Gentamicin", "group": "Aminoglycosides and polymyxins", "doseLine": "5–7 mg/kg IV every 24 hours, or 1 mg/kg for synergy", "identity": "Gentamicin. Aminoglycoside. Intravenous solution. Systemic doses and the tiny synergy doses used in endocarditis are different prescriptions.", "mechanism": "30S ribosomal binding, concentration-dependent bactericidal killing, post-antibiotic effect.", "spectrum": "Aerobic Gram-negatives including susceptible Pseudomonas. Synergy, at low dose, against some viridans streptococci and enterococci when combined with a cell-wall drug. Not anaerobes, not MRSA monotherapy.", "indications": "Short-course Gram-negative therapy, and low-dose synergy for endocarditis. Not prolonged monotherapy.", "adult": "Extended interval: 5–7 mg/kg IV every 24 hours if CrCl is normal, over 30–60 minutes, then a nomogram. Endocarditis synergy: about 3 mg/kg/day divided every 8 hours, or 1 mg/kg every 8 hours, targeting a low peak. Obese patients: adjusted body weight.", "pkpd": "Peak/MIC for Gram-negative killing. Synergy dosing deliberately uses a lower peak. Renal clearance, high urine levels, poor CSF. Once-daily systemic dosing is less nephrotoxic than split dosing for the same daily gram amount.", "renal": "Normal CrCl: every 24 hours. As CrCl falls, the Hartford or a local nomogram stretches to 36 or 48 hours or stops. Haemodialysis: dose after dialysis by level. CRRT: redose by level, often a reduced mg/kg every 24–48 hours. Give the first shock dose, then measure.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Modifying enzymes and ribosomal methylation. High-level gentamicin resistance in enterococci abolishes synergy; the laboratory must look for it specifically.", "adverse": "Nephrotoxicity, vestibular toxicity that patients describe as spinning, cochlear hearing loss, and neuromuscular blockade.", "interactions": "Loop diuretics, vancomycin, amphotericin and other nephrotoxins. Neuromuscular blockers. Inactivation if mixed with penicillins in one bag, and even in vivo in severe renal failure the penicillin can lower the measured level.", "monitoring": "Creatinine. Extended-interval random level, or peak and trough for synergy (trough below 1 mg/L). Symptoms of vertigo or hearing loss. No ECG routine.", "special": "Septic shock: one 5–7 mg/kg dose plus a beta-lactam. Meningitis: not adequate alone. Obesity: adjusted body weight. Pregnancy: avoid prolonged therapy. Myasthenia: can precipitate weakness.", "stewardship": "Define the indication in the order: “Gram-negative once-daily” or “endocarditis synergy”. Stop synergy if the enterococcus has high-level resistance. Most Gram-negative courses end within 48–72 hours."}, {"id": "tobramycin", "name": "Tobramycin", "group": "Aminoglycosides and polymyxins", "doseLine": "5–7 mg/kg IV every 24 hours", "identity": "Tobramycin. Aminoglycoside. Intravenous solution, plus inhaled solution and powder for cystic fibrosis that must not be substituted dose-for-dose into a vein.", "mechanism": "30S ribosomal inhibitor. Concentration-dependent bactericidal activity with a post-antibiotic effect.", "spectrum": "Aerobic Gram-negatives. Often preferred to gentamicin for Pseudomonas. Not anaerobes, not Gram-positive monotherapy.", "indications": "Short-course systemic Pseudomonas therapy, and inhaled adjunctive therapy in bronchiectasis using the inhaled product only.", "adult": "IV extended interval: 5–7 mg/kg every 24 hours when CrCl is normal, over 30–60 minutes, adjusted body weight if obese. Inhaled doses are in the hundreds of milligrams and are nebulised, never injected.", "pkpd": "Peak/MIC. Renal clearance, high urine, modest serum lung levels, which is why inhalation exists. Poor CSF.", "renal": "Same pattern as gentamicin: full first dose, then stretch or stop by nomogram as CrCl falls. Haemodialysis and CRRT: dose by level. Do not run a fixed q8h IV schedule.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "Many gentamicin-modifying enzymes spare tobramycin incompletely. Ribosomal methylation hits both. Pseudomonas efflux also matters.", "adverse": "Nephrotoxicity and ototoxicity, plus bronchospasm only when the drug is inhaled.", "interactions": "Nephrotoxins, loop diuretics, neuromuscular blockers. Do not mix IV with a beta-lactam.", "monitoring": "Creatinine and a nomogram level if more than one dose is planned. For inhaled drug, watch wheeze, not a serum peak.", "special": "Septic shock: one IV dose with a beta-lactam. Meningitis: no. Obesity: adjusted weight. Pregnancy: avoid systemic courses. Useful in beta-lactam allergy as Gram-negative adjunct, not as the only drug.", "stewardship": "Stop at 48–72 hours unless endocarditis or a resistant isolate with no alternative is documented. Never IV-push an inhaled vial."}, {"id": "colistin", "name": "Colistin", "group": "Aminoglycosides and polymyxins", "doseLine": "Load 300 mg CBA IV, then 150–180 mg CBA every 12 hours", "identity": "Colistimethate sodium, the inactive prodrug of colistin. Orders must say either colistin base activity (CBA) or international units, never an unqualified “mg”. About 1 million IU equals 33 mg CBA. About 9 million IU equals 300 mg CBA.", "mechanism": "The formed colistin disrupts the Gram-negative outer membrane. Bactericidal and concentration-dependent. The prodrug has little activity until it converts, which is slow.", "spectrum": "Last-line aerobic Gram-negatives: some CRE, CRAB and difficult Pseudomonas. Not Proteus, Serratia, Morganella, Burkholderia or Gram-positives. Not a modern first CRE drug if a beta-lactam/beta-lactamase inhibitor is active.", "indications": "Only when no beta-lactam is active, often combined with a second agent. Urinary infection is the one syndrome where formed colistin concentrates and polymyxin B is less suitable. Inhaled colistimethate is an adjunct for pneumonia, not the systemic dose.", "adult": "Load 300 mg CBA (about 9 million IU) IV over 30–60 minutes regardless of kidney function. First maintenance dose 12–24 hours later. Normal kidneys: 150–180 mg CBA every 12 hours (300–360 mg CBA per day, about 9–10.9 million IU/day), each over 30–60 minutes. Do not exceed this casual ceiling.", "pkpd": "The prodrug must convert, so the load exists to avoid a day of subtherapeutic colistin. AUC of formed colistin is the index. Poor early plasma levels even after a correct load. Excellent urine. Nephrotoxicity limits how high you can push.", "renal": "Do not reduce the load. Reduce maintenance as CrCl falls, using the international consensus table: roughly half or less once CrCl is below 50, and much lower in anuria, with a small supplemental dose after intermittent haemodialysis timed as late as possible in the interval. SLED: add about 10 percent of the daily CMS dose per hour of SLED. CRRT: clearance is high, so maintenance stays closer to the normal-renal daily dose. These are consensus figures, not a reason to invent a new load.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "mcr plasmid genes and chromosomal lipid-A changes. Heteroresistance is common. Proteus, Serratia and Morganella are intrinsically resistant.", "adverse": "Nephrotoxicity is expected, not a surprise. Neurotoxicity includes paraesthesia, vertigo and neuromuscular blockade. Bronchospasm if inhaled.", "interactions": "Other nephrotoxins. Neuromuscular blockers. Do not confuse a CBA order with a CMS-salt order; a threefold error is easy.", "monitoring": "Creatinine daily. Neurological symptoms. The prescription unit written in full. No routine plasma colistin level in most hospitals.", "special": "Septic shock: give the load now and a second active drug if one exists. Meningitis: IV drug alone is unreliable; intrathecal therapy is a specialist procedure. Obesity: the consensus load is flat, not mg/kg. Pregnancy: avoid if any newer active agent exists. It is chemically unrelated to beta-lactams, so allergy is not the issue; toxicity is.", "stewardship": "If ceftazidime–avibactam, meropenem–vaborbactam or sulbactam–durlobactam is active, stop colistin. Prefer polymyxin B for non-urinary infection when both are available. Courses should be as short as source control allows."}, {"id": "poly-b", "name": "Polymyxin B", "group": "Aminoglycosides and polymyxins", "doseLine": "Load 2–2.5 mg/kg IV, then 1.25–1.5 mg/kg every 12 hours", "identity": "Polymyxin B. Active polymyxin, not a prodrug. One milligram is about 10,000 units. Intravenous, and a separate intrathecal preparation that must never be mixed up with the vial strength casually.", "mechanism": "Disrupts the Gram-negative outer membrane. Bactericidal, concentration-dependent. Already active when infused, unlike colistimethate.", "spectrum": "Same last-line Gram-negatives as colistin: selected CRE, CRAB and Pseudomonas. Intrinsically inactive against Proteus, Serratia and Morganella. Not Gram-positive.", "indications": "Serious non-urinary infection when no beta-lactam is active. Preferred over colistin for pneumonia and bacteraemia in the international consensus, because it is not a prodrug. Poor urinary levels, so colistin is preferred for cystitis.", "adult": "Load 2–2.5 mg/kg total body weight IV over 1 hour. Then 1.25–1.5 mg/kg every 12 hours, each over 1 hour. A practical ceiling used by many centres is about 200–250 mg/day even at very high body weight. Write milligrams or units, not both inconsistently.", "pkpd": "AUC of active drug. No conversion delay, so the load works the same day. Non-renal clearance dominates, which is why kidney failure does not justify a large maintenance reduction. Poor urine. Lung levels are still marginal.", "renal": "Do not routinely reduce maintenance for low CrCl; the consensus recommends the same mg/kg, with a careful eye on toxicity. Haemodialysis does not require a supplemental dose. CRRT and SLED do not clear it enough to demand the colistin-style increases. AKI still happens and is not a signal to stop on day 1 if the organism is untreatable another way, but it should force a search for any newer agent.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "mcr and lipid-A modification, shared with colistin. Intrinsic resistance of Proteus, Serratia and Morganella.", "adverse": "Nephrotoxicity and neurotoxicity, including paraesthesia, ataxia and apnoea at excessive doses. Flushing if infused too fast.", "interactions": "Nephrotoxins and neuromuscular blockers. A unit-versus-milligram error is the most dangerous interaction with the medication chart.", "monitoring": "Creatinine daily. Neurological examination. The written unit. No routine level.", "special": "Septic shock: load on total body weight now, plus any second active drug. Meningitis: IV therapy is not enough; intrathecal polymyxin is specialist-only. Obesity: total body weight, but respect a daily ceiling. Pregnancy: last resort. Beta-lactam allergy does not cross.", "stewardship": "Replace it the day a susceptible newer beta-lactam is known. Do not use it for UTI. Do not run it as monotherapy for pneumonia if a second active agent exists."}, {"id": "levofloxacin", "name": "Levofloxacin", "group": "Other antibacterial agents", "doseLine": "750 mg IV or oral every 24 hours", "identity": "Levofloxacin. Respiratory fluoroquinolone. Intravenous solution and oral tablets, 250, 500 and 750 mg. IV and oral doses are equivalent.", "mechanism": "Inhibits DNA gyrase and topoisomerase IV. Bactericidal and concentration-dependent.", "spectrum": "Streptococci including pneumococcus, atypicals, many Enterobacterales and some Pseudomonas and Haemophilus. Not reliable MRSA, not anaerobes as monotherapy, and not ESBL bacteraemia.", "indications": "Community or hospital pneumonia when a beta-lactam cannot be used, and susceptible Gram-negative infection including some Pseudomonas at the 750 mg dose. Avoid as a casual urinary drug when nitrofurantoin or another narrow agent would do.", "adult": "750 mg IV or oral every 24 hours for pneumonia and serious infection, infused over 90 minutes. 500 mg every 24 hours is the lower urinary and some skin dose. Do not exceed 750 mg/day.", "pkpd": "AUC/MIC. Excellent oral absorption and lung levels. Renally cleared, so urine levels are high. Chelation in the gut destroys the oral dose.", "renal": "750 mg schedule: CrCl 20–49, 750 mg every 48 hours. CrCl below 20, 750 mg once then 500 mg every 48 hours. Haemodialysis: the same, after dialysis. CRRT: often 500–750 mg every 24 hours. The 500 mg schedule has its own, slightly lower, table.", "hepatic": "No hepatic dose adjustment. Liver failure by itself does not change the gram dose. Stop the drug if it is the cause of hepatitis.", "resistance": "QRDR mutations in gyrase and topoisomerase, and efflux. Cross-resistance across fluoroquinolones is common. MRSA is usually resistant.", "adverse": "Tendinopathy and rupture, QT prolongation, confusion and seizures, dysglycaemia, aortic-aneurysm warning, phototoxicity, neuropathy and C. difficile. Boxed warnings limit casual use.", "interactions": "Separate oral doses from iron, calcium, magnesium and sucralfate by several hours. QT drugs add risk. Warfarin effect may rise. NSAIDs add seizure risk.", "monitoring": "QTc if other QT drugs are present or the patient is elderly. Glucose. Tendon pain. Creatinine, because it sets the interval. No drug level.", "special": "Septic shock: IV 750 mg is an adjunct or a beta-lactam alternative, not preferred monotherapy for hospital shock. Meningitis: not standard. Obesity: no mg/kg dose. Pregnancy: avoid. Myasthenia: can worsen weakness. Children: avoid unless no alternative.", "stewardship": "Do not start a fluoroquinolone for a syndrome a beta-lactam can treat. Stop at the culture result. Oral step-down is the same milligram if a quinolone is still the right drug. Typical pneumonia courses are 5 days if the patient has improved."}, {"id": "ciprofloxacin", "name": "Ciprofloxacin", "group": "Other antibacterial agents", "doseLine": "400 mg IV every 8 hours for serious Pseudomonas", "identity": "Ciprofloxacin. Fluoroquinolone. Intravenous solution and oral tablets. The IV 400 mg dose is not the same number as the oral 500 mg dose.", "mechanism": "Inhibits DNA gyrase and topoisomerase IV. Bactericidal, concentration-dependent.", "spectrum": "Many Enterobacterales and Pseudomonas aeruginosa. Poor streptococci, no anaerobes, no MRSA, no atypicals as a strength compared with levofloxacin, though some atypical activity exists.", "indications": "Susceptible Pseudomonas or Gram-negative infection when a beta-lactam is unsuitable, including oral step-down of a susceptible isolate. Not community pneumonia monotherapy, because pneumococcus is a hole.", "adult": "Serious or Pseudomonas infection: 400 mg IV every 8 hours, infused over 60 minutes. Other infections: 400 mg IV every 12 hours. Oral: 500–750 mg every 12 hours. Tizanidine is contraindicated with ciprofloxacin.", "pkpd": "AUC/MIC. Good oral absorption unless chelated. High urine levels. Modest CSF. Renally and metabolically cleared.", "renal": "CrCl below 30: extend the IV interval toward every 12–24 hours or reduce the oral dose to 250–500 mg every 12–18 hours, depending on the indication table. Haemodialysis: dose after dialysis, usually at the reduced interval. CRRT: commonly 400 mg every 8–12 hours.", "hepatic": "No specific hepatic reduction. Severe liver disease plus kidney disease needs a lower dose.", "resistance": "Gyrase mutations and efflux. Pseudomonas resistance emerges during monotherapy, especially in pneumonia. Cross-resistance with other fluoroquinolones.", "adverse": "The class warnings: tendon, QT, CNS, glucose, aorta, neuropathy, plus more drug interactions than levofloxacin.", "interactions": "Tizanidine is contraindicated. Theophylline and caffeine levels rise. Warfarin effect rises. Chelating cations block oral absorption. QT drugs. Strong CYP1A2 inhibition.", "monitoring": "QTc, creatinine, glucose, theophylline level if that drug cannot be stopped. Tendon symptoms.", "special": "Septic shock: combine with a beta-lactam if Pseudomonas pneumonia is possible; do not rely on ciprofloxacin alone. Meningitis: not standard. Obesity: flat dose. Pregnancy: avoid. Myasthenia: avoid.", "stewardship": "Monotherapy for serious Pseudomonas is how resistance is bred. Stop when a beta-lactam is active. Do not treat pneumococcal pneumonia with it."}, {"id": "moxifloxacin", "name": "Moxifloxacin", "group": "Other antibacterial agents", "doseLine": "400 mg IV or oral every 24 hours", "identity": "Moxifloxacin. Respiratory fluoroquinolone. Intravenous solution and oral 400 mg tablet. Hepatic clearance, so the kidney does not set the dose.", "mechanism": "Inhibits DNA gyrase and topoisomerase IV, so bacterial DNA cannot replicate or separate. The effect is bactericidal.", "spectrum": "Pneumococcus, atypicals, Haemophilus, and some anaerobes. Not Pseudomonas. Not useful for urinary infection, because urine levels are low. Not MRSA.", "indications": "Community respiratory infection and some intra-abdominal combinations when a beta-lactam is impossible. Not pyelonephritis and not hospital Pseudomonas cover.", "adult": "400 mg IV or oral every 24 hours. Infuse IV over 60 minutes. No load and no renal reduction. Maximum 400 mg/day.", "pkpd": "AUC/MIC. Excellent lung levels, poor urinary levels. Hepatic metabolism. Longest QT effect of the commonly used fluoroquinolones.", "renal": "No dose change for low CrCl, intermittent haemodialysis, CRRT or SLED. Give the usual dose without waiting for a level.", "hepatic": "Avoid in severe hepatic impairment and in Child-Pugh C with other QT risks. No numeric reduction; choose another drug.", "resistance": "Class fluoroquinolone resistance. No Pseudomonas activity to lose.", "adverse": "QT prolongation is the signature risk, plus tendon, CNS and C. difficile effects of the class.", "interactions": "Class Ia and III antiarrhythmics and other QT drugs. Chelating cations if oral. Less CYP interaction than ciprofloxacin.", "monitoring": "A baseline ECG if the patient is elderly, hypokalaemic, or on another QT drug. Liver tests if the course is long. Electrolytes.", "special": "Septic shock: not monotherapy for hospital sepsis. Meningitis: not standard. Obesity: 400 mg. Pregnancy: avoid. Known QT prolongation: do not start.", "stewardship": "Do not use it for UTI. Stop when a beta-lactam will treat the pneumococcus. Five days is often enough for improving community pneumonia."}, {"id": "azithromycin", "name": "Azithromycin", "group": "Other antibacterial agents", "doseLine": "500 mg IV or oral daily", "identity": "Azithromycin. Macrolide. Intravenous solution and oral tablets. Long tissue half-life.", "mechanism": "Binds the 50S ribosome and stops protein synthesis. Usually bacteriostatic. Weak anti-inflammatory effects are not a reason to prescribe it.", "spectrum": "Atypicals (Legionella, Mycoplasma, Chlamydia), some streptococci, Haemophilus, and non-tuberculous mycobacteria in other regimens. Not Pseudomonas, not Enterobacterales bacteraemia, not anaerobes, not MRSA.", "indications": "Added to a beta-lactam for severe community pneumonia to cover atypicals and Legionella. Single-drug therapy only for proven or highly likely atypical infection, or for some sexually transmitted infections outside ICU practice.", "adult": "500 mg IV or oral every 24 hours for pneumonia, usually for 3 to 5 days. A common oral alternative is 500 mg on day 1 then 250 mg daily for 4 days. Infuse IV over 1 hour, not as a bolus.", "pkpd": "AUC/MIC, with huge tissue uptake and a long tail. Poor serum levels, so it is not a bacteraemia drug. Hepatic excretion into bile.", "renal": "No adjustment for CrCl above 10. Below that, use caution; haemodialysis and CRRT do not have a useful removal to plan around. The usual ICU dose stays 500 mg daily.", "hepatic": "Use caution in significant hepatic disease because the drug is biliary. No standard reduced milligram.", "resistance": "erm and mef mechanisms in streptococci. Do not rely on it for pneumococcus in regions of high macrolide resistance.", "adverse": "Nausea, diarrhoea, QT prolongation, and rare hepatotoxicity or hearing loss on long courses.", "interactions": "Fewer CYP3A effects than clarithromycin. QT drugs still add up. Antacids containing magnesium or aluminium bind the oral extended-release forms.", "monitoring": "ECG if other QT risks exist. Liver tests on longer courses. It does not need a level.", "special": "Septic shock from community pneumonia: give it with a beta-lactam, not instead of one. Meningitis: no. Obesity: 500 mg. Pregnancy: often used when needed for atypical cover. Macrolide allergy: avoid.", "stewardship": "Stop at 3 days if Legionella is excluded and the patient is improving. Do not continue a week of macrolide “to finish the pack” on a ventilator patient with hospital flora."}, {"id": "clarithromycin", "name": "Clarithromycin", "group": "Other antibacterial agents", "doseLine": "500 mg oral every 12 hours", "identity": "Clarithromycin. Macrolide. Oral tablets, and an IV product in some countries. A strong CYP3A4 inhibitor, unlike azithromycin.", "mechanism": "50S ribosomal inhibition. Bacteriostatic. Metabolised to an active hydroxy metabolite.", "spectrum": "Similar to azithromycin: atypicals, some streptococci and Haemophilus, plus H. pylori in combination regimens. Not Pseudomonas or serious Enterobacterales.", "indications": "Atypical respiratory infection and H. pylori combinations. In ICU, azithromycin is usually simpler because it has fewer interactions.", "adult": "500 mg oral every 12 hours. CrCl below 30: 500 mg once, then 250 mg every 12 hours, or 250 mg every 12 hours. IV, where it exists, follows the local label and is not a higher casual dose.", "pkpd": "AUC/MIC, hepatic metabolism, tissue uptake. Less convenient lung kinetics than azithromycin for once-daily ICU use.", "renal": "Reduce by half when CrCl is below 30, including many dialysis patients. Give after haemodialysis if a dose falls due. CRRT: use the reduced dose unless pharmacy advises otherwise.", "hepatic": "If the patient has both hepatic impairment and renal impairment, avoid or reduce further. Hepatotoxicity itself is a reason to stop.", "resistance": "Same macrolide ribosome mechanisms as azithromycin, and the two drugs usually fail together.", "adverse": "Nausea, metallic taste, QT prolongation, cholestatic hepatitis, and C. difficile.", "interactions": "This is the problem drug of the pair. It raises levels of many CYP3A substrates: some statins, colchicine, calcium-channel blockers, and tacrolimus. QT drugs. Ergot alkaloids are contraindicated.", "monitoring": "ECG, creatinine, liver tests, and a review of the medication list before the first dose. Tacrolimus or cyclosporine levels if those drugs continue.", "special": "Septic shock: prefer azithromycin if a macrolide is needed. Meningitis: no. Obesity: standard dose. Pregnancy: azithromycin is usually chosen instead. Macrolide allergy: avoid.", "stewardship": "Do not add it to a long ICU list without an interaction check. H. pylori courses are not ICU courses. Stop when atypicals are excluded."}, {"id": "doxycycline", "name": "Doxycycline", "group": "Other antibacterial agents", "doseLine": "100 mg IV or oral every 12 hours", "identity": "Doxycycline. Tetracycline. Intravenous and oral, 100 mg. Oral absorption is good if it is not chelated.", "mechanism": "Binds the 30S ribosomal subunit and blocks bacterial protein synthesis. The effect is bacteriostatic.", "spectrum": "Atypicals, many MRSA skin isolates, rickettsiae, some stenotrophomonas combinations, malaria species, and a mixed Gram-positive and community Gram-negative list. Not Pseudomonas, not reliable bacteraemia therapy, not hospital Enterobacterales.", "indications": "Atypical cover in pneumonia, tick-borne disease, susceptible MRSA skin infection, and oral step-down when the isolate is susceptible. Part of some Stenotrophomonas combinations, not alone for bacteraemia.", "adult": "100 mg IV or oral every 12 hours. Infuse IV over 1 hour and avoid extravasation. A 200 mg first-day load is sometimes used in rickettsial disease. Usual maximum 200 mg/day.", "pkpd": "AUC/MIC. Highly bioavailable. Hepatic metabolism and biliary excretion, which is why the kidney rarely matters. Poor blood levels for endocarditis. Chelates with cations.", "renal": "No dose change for AKI, haemodialysis, CRRT or SLED.", "hepatic": "No standard reduction. Avoid or watch closely in severe hepatic failure. Expired tetracycline is nephrotoxic; use in-date stock.", "resistance": "tet efflux and ribosomal protection. MRSA susceptibility must be tested, not assumed, for serious infection.", "adverse": "Oesophagitis if a tablet sticks, photosensitivity, nausea, and intracranial hypertension rarely. Tooth and bone staining in the fetus and young child. Thrombophlebitis if the IV dose extravasates.", "interactions": "Separate from iron, calcium, magnesium and antacids. Warfarin effect may increase. Isotretinoin adds intracranial-hypertension risk. Enzyme inducers can lower levels.", "monitoring": "Liver tests on long courses. No level and no ECG routine. Tell the patient to report severe headache or visual change.", "special": "Septic shock: not adequate Gram-negative cover. Meningitis: not standard, except some rickettsial and specific specialist contexts. Obesity: 100 mg. Pregnancy: avoid. Children under 8: avoid unless rickettsial or other life-threatening infection has no alternative.", "stewardship": "A good oral step-down for susceptible MRSA skin infection and for atypical pneumonia. Do not treat Pseudomonas or ESBL bacteraemia with it. Sit the patient up for the oral dose."}, {"id": "tigecycline", "name": "Tigecycline", "group": "Other antibacterial agents", "doseLine": "100 mg IV load, then 50 mg every 12 hours", "identity": "Tigecycline. Glycylcycline, given only IV. Vials of 50 mg. A black-box warning reports higher mortality than comparator drugs.", "mechanism": "30S ribosomal inhibitor that overcomes many tet efflux pumps. Bacteriostatic. Very large volume of distribution, so serum levels stay low.", "spectrum": "MRSA, VRE, many anaerobes, atypicals, and some CRE and CRAB as salvage. Not Pseudomonas, Proteus, Providencia or Morganella. Poor for bacteraemia and UTI because the blood and urine levels are low.", "indications": "Complicated intra-abdominal infection and skin infection when other options have failed, and salvage combinations for resistant Gram-negatives. Not monotherapy for septic shock or bacteraemia.", "adult": "100 mg IV once, then 50 mg every 12 hours, each over 30–60 minutes. Some salvage regimens use higher doses under specialist supervision; they are not the labeled start. Do not give it by mouth; there is no oral product.", "pkpd": "AUC/MIC, but the huge volume means the serum AUC is small. That is why pneumonia and bacteraemia outcomes disappoint. Biliary levels are high. No renal clearance of importance.", "renal": "No adjustment for CrCl, dialysis, CRRT or SLED.", "hepatic": "Child-Pugh C: 100 mg load, then 25 mg every 12 hours. Child-Pugh A and B: no change.", "resistance": "Some efflux and ribosomal protection still occur. Intrinsic gaps are Pseudomonas and the Proteus group.", "adverse": "Nausea and vomiting are very common. Pancreatitis, transaminase rise, thrombocytopenia, and the mortality signal in pooled trials. Photosensitivity is less than with older tetracyclines.", "interactions": "Warfarin effect may increase. Oral contraceptives are irrelevant to the IV exposure issue. It can prolong coagulation tests.", "monitoring": "Liver tests. A lipase if abdominal pain worsens. Blood count. Acknowledge the mortality warning in the note if it is used as salvage.", "special": "Septic shock: do not use it alone. Bacteraemia: add a drug with blood levels. Meningitis: poor. Obesity: labeled flat dose. Pregnancy: avoid, tetracycline class. It is an option in severe beta-lactam allergy for mixed intra-abdominal flora if the warning is accepted.", "stewardship": "Last-line salvage, usually combined. Stop when any narrower active drug with adequate serum levels is known. Do not treat UTI or Pseudomonas with it."}, {"id": "eravacycline", "name": "Eravacycline", "group": "Other antibacterial agents", "doseLine": "1 mg/kg IV every 12 hours", "identity": "Eravacycline. Fluorocycline. Intravenous only, dosed by body weight.", "mechanism": "30S ribosomal inhibitor designed to resist common tetracycline efflux and ribosomal protection. Bacteriostatic.", "spectrum": "Enterobacterales including many CRE, Acinetobacter, MRSA, enterococci including VRE, and anaerobes. Not Pseudomonas. Failed as a urinary drug.", "indications": "Complicated intra-abdominal infection due to susceptible organisms. Salvage for CRE or CRAB only inside a combination plan. Not complicated UTI.", "adult": "1 mg/kg IV every 12 hours, infused over about 60 minutes, for 4–14 days. Strong CYP3A inducers: 1.5 mg/kg every 12 hours.", "pkpd": "AUC/MIC. Weight-based. Not renally cleared in a way that sets the dose. Urine levels were insufficient in clinical UTI trials.", "renal": "No adjustment for renal impairment, haemodialysis or, by expectation, CRRT. Formal CRRT data are limited.", "hepatic": "Child-Pugh A or B: no change. Child-Pugh C: 1 mg/kg every 12 hours on day 1, then 1 mg/kg every 24 hours.", "resistance": "Some enzymatic tetracycline destruction. Pseudomonas is intrinsically resistant. Being a tetracycline relative does not restore a urinary indication.", "adverse": "Nausea, infusion reactions, thrombophlebitis, and class warnings about teeth and photosensitivity. Fewer gastrointestinal effects than tigecycline for many patients.", "interactions": "Strong CYP3A inducers such as rifampicin require the 1.5 mg/kg dose. Warfarin may be potentiated.", "monitoring": "Liver tests, weight used for the dose, and the inducer list. No drug level.", "special": "Septic shock: not monotherapy. UTI: do not use it. Meningitis: no. Obesity: the mg/kg dose already scales; confirm which weight the local policy uses. Pregnancy: avoid. Useful when a mixed abdominal infection needs CRE cover and a beta-lactam is impossible.", "stewardship": "Do not stretch an intra-abdominal license into bacteraemia monotherapy. Stop if meropenem or another beta-lactam is active. There is no oral eravacycline."}, {"id": "omadacycline", "name": "Omadacycline", "group": "Other antibacterial agents", "doseLine": "Load 200 mg IV, then 100 mg IV daily", "identity": "Omadacycline. Aminomethylcycline. Intravenous and oral. Community pneumonia and skin infection are the licenses, not septic shock of unknown source.", "mechanism": "30S ribosomal inhibitor that evades common tetracycline resistance mechanisms. Bacteriostatic.", "spectrum": "Pneumococcus, atypicals, Haemophilus, MSSA and many MRSA, and some Enterobacterales. Not Pseudomonas. Not a CRE drug of choice.", "indications": "Community-acquired bacterial pneumonia and acute bacterial skin infection when a tetracycline-class option is wanted. Not hospital-acquired pneumonia and not bacteraemia monotherapy.", "adult": "Pneumonia: 200 mg IV over 60 minutes on day 1, then 100 mg IV over 30 minutes daily; or 100 mg IV twice on day 1. Oral: 300 mg twice on day 1, then 300 mg daily. Skin: oral can start at 450 mg daily on days 1 and 2, then 300 mg daily. Oral doses are taken fasting: no food for 4 hours before and 2 hours after, and no dairy at the dose.", "pkpd": "AUC/MIC. Oral absorption collapses with food and cations. Not renally cleared in a dose-changing way.", "renal": "No dose change for low CrCl or haemodialysis. CRRT does not require a reduction either.", "hepatic": "No adjustment for Child-Pugh A, B or C.", "resistance": "Designed around tet genes, but it is not a carbapenemase solution. Pseudomonas is a hole.", "adverse": "Nausea, vomiting, infusion reactions, transaminase rise, and tetracycline-class photosensitivity, tooth and intracranial-hypertension warnings.", "interactions": "Food, iron, calcium and magnesium destroy the oral dose. Warfarin may be affected. No renal chelation issue for the IV dose.", "monitoring": "Liver tests if the course is long. Confirm the patient can actually take oral doses fasting before a switch. No level.", "special": "Septic shock or hospital pneumonia: do not use it as the Gram-negative backbone. Meningitis: no. Obesity: flat gram dose. Pregnancy and young children: avoid.", "stewardship": "A community step-down or alternative, not an ICU resuscitation drug. If the patient cannot fast, stay on IV or choose another oral agent."}, {"id": "clindamycin", "name": "Clindamycin", "group": "Other antibacterial agents", "doseLine": "600–900 mg IV every 8 hours", "identity": "Clindamycin. Lincosamide. Intravenous solution and oral capsules. The oral dose is lower than a serious IV dose because of tolerability, not because IV milligrams equal oral milligrams.", "mechanism": "Binds the 50S ribosome. Bacteriostatic. Also suppresses staphylococcal and streptococcal toxin production, which is why it is added in toxic shock.", "spectrum": "Many streptococci, some MSSA and community MRSA, and many anaerobes above the diaphragm. Not reliable Bacteroides in many hospitals, not enterococci, not Gram-negative aerobes.", "indications": "Added to a beta-lactam for toxic shock or necrotising fasciitis to shut down toxin. Surgical prophylaxis in severe penicillin allergy for some operations. Not Gram-negative sepsis.", "adult": "Serious infection and toxin suppression: 900 mg IV every 8 hours, infused over 30–60 minutes. Many skin infections: 600 mg IV every 8 hours. Oral: 300–450 mg every 6–8 hours. Labeled ceilings are often 2700 mg/day IV, and some necrotising protocols use 900 mg every 8 hours inside that.", "pkpd": "Time above MIC for a bacteriostatic drug, with good tissue and abscess penetration and poor CSF. Toxin suppression is a ribosome effect, not a reason to omit the killing beta-lactam.", "renal": "No adjustment for CrCl, dialysis or CRRT.", "hepatic": "Severe hepatic disease: reduce the dose or extend the interval and follow the clinical response. No single labeled table.", "resistance": "erm-mediated ribosomal methylation causes inducible resistance in staphylococci and streptococci. A susceptible clindamycin result next to erythromycin resistance needs a D-test before you trust it.", "adverse": "C. difficile colitis is the signature harm, including after short courses. Rash, metallic taste, oesophagitis with capsules, and rare drug reaction with eosinophilia.", "interactions": "Neuromuscular blockers can be prolonged. It does not cover the Gram-negative gap if someone stops the beta-lactam.", "monitoring": "Stool frequency. Stop if colitis is suspected and test for C. difficile. Liver tests on long courses. The D-test result.", "special": "Septic shock from necrotising Group A streptococcus: add it to a beta-lactam, and arrange surgery. It is not the only drug. Meningitis: poor. Obesity: 900 mg. Pregnancy: often used when needed. Penicillin anaphylaxis: it is a useful Gram-positive alternative but still misses Gram-negatives.", "stewardship": "Stop the toxin dose after the invasive infection is controlled, often within a few days, because every extra day raises C. difficile risk. Do not use it for bacteraemia if a bactericidal drug is susceptible. Prefer oral metronidazole or a beta-lactam/inhibitor for many abdominal anaerobes, depending on local Bacteroides resistance."}, {"id": "metronidazole", "name": "Metronidazole", "group": "Other antibacterial agents", "doseLine": "500 mg IV every 8 hours", "identity": "Metronidazole. Nitroimidazole. Intravenous and oral, with excellent oral absorption, so 500 mg oral replaces 500 mg IV.", "mechanism": "A prodrug reduced inside anaerobic cells to radicals that damage DNA. Rapidly bactericidal against susceptible anaerobes and protozoa.", "spectrum": "Obligate anaerobes including Bacteroides, Clostridium and many others, plus C. difficile as an alternative, and protozoa. Not aerobes, not streptococci, not Gram-negative rods that grow in air.", "indications": "Anaerobic cover added to cefepime, ceftazidime or ciprofloxacin. Intra-abdominal infection when the beta-lactam lacks anaerobes. Brain abscess combinations. Not C. difficile first-line any more if vancomycin or fidaxomicin is available.", "adult": "500 mg IV or oral every 8 hours. Infuse IV over 30–60 minutes. Some deep or CNS infections use 500 mg every 6 hours. Usual maximum about 4 g/day. A 15 mg/kg load is sometimes used, then 7.5 mg/kg every 6 hours, in surgical protocols.", "pkpd": "Concentration-dependent killing of anaerobes, with excellent abscess and CSF penetration. Hepatic metabolism. Oral equals IV.", "renal": "No change for CrCl, CRRT or SLED. Metabolites accumulate in anuria; after haemodialysis consider a supplemental dose if therapy is daily and the session is long. This rarely changes the 500 mg schedule.", "hepatic": "Severe hepatic impairment: extend to every 12 hours, or halve the dose. Mild disease: no change.", "resistance": "nim genes in Bacteroides and some C. difficile resistance. Aerobes are intrinsically resistant no matter the dose.", "adverse": "Nausea, metallic taste, peripheral neuropathy after weeks, encephalopathy and seizures with prolonged or high exposure, and a disulfiram-like reaction with alcohol.", "interactions": "Warfarin effect increases. Alcohol during and for a few days after therapy. Disulfiram should be separated. CYP effects are modest but phenytoin and lithium need a look.", "monitoring": "Clinical neuropathy symptoms on courses beyond 10–14 days. Liver tests in hepatic failure. No routine level. INR if the patient takes warfarin.", "special": "Septic shock from a gut source: add it only if the beta-lactam does not already cover anaerobes. Meningitis and brain abscess: one of the few antibacterials with reliable pus penetration; dose every 6–8 hours. Obesity: 500 mg is usual. Pregnancy: avoid in the first trimester if a true alternative exists; later, treat a serious anaerobic infection. Immunosuppression does not add aerobic cover.", "stewardship": "If piperacillin–tazobactam or a carbapenem is active, stop metronidazole. Switch IV to oral the day the gut works. Do not run it for four weeks. It is not a substitute for source control."}, {"id": "tmp-smx", "name": "Trimethoprim–sulfamethoxazole", "group": "Other antibacterial agents", "doseLine": "PCP: 5 mg/kg of trimethoprim IV every 6–8 hours", "identity": "Trimethoprim plus sulfamethoxazole, co-trimoxazole. Dose by the trimethoprim component. Intravenous solution and oral tablets, including double-strength 160/800 mg. IV fluid load is large.", "mechanism": "Two-step folate blockade: sulfamethoxazole inhibits dihydropteroate synthase and trimethoprim inhibits dihydrofolate reductase. Bactericidal together for many organisms.", "spectrum": "PCP (Pneumocystis), Stenotrophomonas, some MRSA, Nocardia, Listeria as an alternative, and many community Gram-negatives. Not Pseudomonas, not anaerobes, not enterococci.", "indications": "First-line Pneumocystis pneumonia. Targeted Stenotrophomonas. Susceptible MRSA skin and some bone infection. Not empiric septic shock cover.", "adult": "Pneumocystis: 5 mg/kg trimethoprim IV every 6 to 8 hours (15–20 mg/kg/day). Stenotrophomonas bacteraemia often uses a similar high dose. Ordinary MRSA skin infection: one double-strength tablet every 12 hours. Infuse IV over 60–90 minutes. Check the vial concentration so the kilogram dose is trimethoprim, not the combined salt.", "pkpd": "AUC related, renally cleared, good tissue and urine levels, useful CSF levels for some nocardial and other rare CNS infections. Pneumocystis is a fungus but this antibacterial is still the first drug.", "renal": "CrCl above 30: standard. CrCl 15–30: half the dose. CrCl below 15: avoid, or use a reduced dose with levels and a specialist. Haemodialysis: dose after dialysis, often a partial daily dose. CRRT: Pneumocystis doses are often kept high because the drug is cleared; follow potassium and the level if available.", "hepatic": "Use caution in severe hepatic disease. Cholestatic injury and fulminant hepatitis are reasons to stop, not to shave a milligram.", "resistance": "Folate-pathway mutations. Stenotrophomonas susceptibility must be tested. It does not cover Pseudomonas at any dose.", "adverse": "Hyperkalaemia, a creatinine rise that is partly secretion rather than GFR, rash including Stevens–Johnson syndrome, marrow suppression, hyponatraemia, hepatitis, and haemolysis in G6PD deficiency.", "interactions": "Warfarin effect rises sharply. Methotrexate toxicity. ACE inhibitors and spironolactone add hyperkalaemia. Phenytoin levels rise. Dofetilide is contraindicated.", "monitoring": "Potassium, creatinine and sodium within a day of a high dose, then frequently. Blood count. The rash history. INR. A Pneumocystis course also needs a steroid plan if the A-a gradient is high, which is not a property of the antibiotic itself.", "special": "Septic shock: not broad enough alone. Meningitis: used for some nocardia and Listeria alternatives at high dose with advice. Obesity: Pneumocystis dosing is mg/kg; consider adjusted weight at the extreme so the dose does not become toxic. Pregnancy: avoid in the first trimester and near term. Sulfa anaphylaxis or severe rash: do not rechallenge. G6PD deficiency: haemolysis risk.", "stewardship": "Use the skin-infection tablet dose for skin infection, not the Pneumocystis dose. Step down to oral at the same trimethoprim milligrams when the gut works. Stop if a rash starts. Do not treat Pseudomonas “UTI” with it."}, {"id": "fosfomycin", "name": "Fosfomycin", "group": "Other antibacterial agents", "doseLine": "Oral cystitis: 3 g once. IV: specialist gram doses", "identity": "Fosfomycin. A small phosphonic-acid antibiotic. The oral sachet is fosfomycin trometamol 3 g, for cystitis only. Intravenous fosfomycin, where it is marketed, is a different product with a large sodium load and is not licensed in every country.", "mechanism": "Inhibits MurA and the first step of peptidoglycan synthesis. Bactericidal. Oral drug reaches the urine, not a reliable serum level for pyelonephritis.", "spectrum": "Many Enterobacterales including some ESBL E. coli in the urine, some enterococci, and, for the IV drug, a broader Gram-positive and Gram-negative list used only in combination. Not reliable Pseudomonas monotherapy.", "indications": "Oral: a single dose for uncomplicated cystitis in a woman. IV: combination salvage for MDR organisms, never alone, and only where the product and a susceptibility test exist.", "adult": "Oral: 3 g sachet once, dissolved in water, for uncomplicated cystitis. Do not repeat daily by habit. IV, where used: often 12–24 g/day divided every 8 hours, for example 8 g every 8 hours, infused over 30–60 minutes or longer. Each gram of IV drug contains about 14 mmol of sodium. Confirm the national monograph before writing an IV dose.", "pkpd": "Time-dependent, with excellent and prolonged urinary levels after one oral dose. Serum levels from the sachet are trivial. IV drug is renally cleared and distributes widely, including some CSF and bone data in combinations.", "renal": "Oral cystitis: avoid if CrCl is very low because the urine level may never arrive; the sachet is not a dialysis drug. IV: reduce the daily gram dose as CrCl falls, give after haemodialysis, and expect CRRT to remove a large fraction so the dose stays relatively high. The sodium load remains. Use a local IV table rather than a homemade fraction.", "hepatic": "No standard hepatic reduction. The sodium load matters more in cirrhosis.", "resistance": "MurA and transporter mutations, and plasmid enzymes. Resistance emerges during monotherapy of serious infection, which is why IV drug is combined.", "adverse": "Oral: diarrhoea and headache. IV: hypokalaemia, a large sodium load, heart-failure decompensation, and gastrointestinal upset.", "interactions": "Metoclopramide lowers the oral urine level. IV sodium plus other fluid. Do not mix the sachet regimen with an assumption of bacteraemia cover.", "monitoring": "For IV: potassium, sodium, weight, creatinine. For oral: nothing beyond clinical cure. Susceptibility for anything other than E. coli cystitis.", "special": "Septic shock or pyelonephritis: the 3 g sachet is the wrong drug. Meningitis: IV combination only inside a specialist protocol. Obesity: oral dose stays 3 g. Pregnancy: a single oral cystitis dose is often acceptable; IV is a specialist decision. It is useful in beta-lactam allergy for susceptible cystitis.", "stewardship": "One sachet, not a five-day course, for uncomplicated cystitis. Do not use oral fosfomycin for bacteraemia, pyelonephritis or Pseudomonas. IV fosfomycin is combination salvage, stopped when a beta-lactam is active."}, {"id": "rifampicin", "name": "Rifampicin", "group": "Other antibacterial agents", "doseLine": "600 mg oral or IV daily; never alone for bacteria", "identity": "Rifampicin, also called rifampin. Rifamycin. Oral capsules and intravenous solution. A potent inducer of metabolising enzymes. Never monotherapy for a bacterial infection.", "mechanism": "Inhibits DNA-dependent RNA polymerase. Bactericidal against susceptible staphylococci and mycobacteria, with resistance from a single mutation if it is used alone.", "spectrum": "Mycobacteria, and a useful biofilm adjunct for susceptible staphylococci. Not a Gram-negative drug. Not anaerobes of consequence.", "indications": "Tuberculosis combinations. Adjunct for staphylococcal prosthetic-valve or hardware infection after the blood cultures have cleared, together with an active companion. Not the first drug of staphylococcal bacteraemia.", "adult": "Tuberculosis, with other drugs: 10 mg/kg oral or IV once daily, maximum 600 mg. Staphylococcal hardware: often 300–450 mg every 12 hours, or 600 mg daily, only with a second active drug. Infuse IV over 30 minutes to 3 hours depending on the product.", "pkpd": "Concentration-dependent early killing and then rapid resistance if the bacterial load is high and the drug is alone. Excellent tissue and CSF levels. Hepatic metabolism. Turns urine, tears and contact lenses orange.", "renal": "No change for CrCl or haemodialysis at the 600 mg dose. CRRT does not set the dose. Hepatic function does.", "hepatic": "Use caution and follow liver tests. Reduce or interrupt if significant hepatitis develops. There is no safe “half dose” that preserves companion-drug levels, because induction may persist.", "resistance": "rpoB mutations. Emerges within days as monotherapy. Always pair it.", "adverse": "Hepatitis, cholestatic enzymes, flu-like syndrome with intermittent dosing, thrombocytopenia, and orange body fluids. Hypersensitivity.", "interactions": "The dominant issue. It induces CYP3A, CYP2C and P-glycoprotein and drops levels of warfarin, azoles, many HIV drugs, tacrolimus, corticosteroids, methadone and oral contraceptives. Check every long-term drug before the first dose.", "monitoring": "Liver tests at baseline and during therapy. INR if warfarin continues. Drug levels of tacrolimus, azoles or HIV therapy. The orange-fluid warning so it is not mistaken for haematuria.", "special": "Septic shock: this is not empiric cover. Meningitis: good penetration, but only inside a mycobacterial or staphylococcal combination. Obesity: TB dosing is mg/kg with a 600 mg cap. Pregnancy: used for tuberculosis when needed; enzyme induction still applies. Not a beta-lactam substitute.", "stewardship": "Do not add it to every MRSA bacteraemia. Wait until the hardware infection is bacteraemic-clear and a companion is on board. Never a one-drug discharge prescription for a staphylococcus."}, {"id": "chloramphenicol", "name": "Chloramphenicol", "group": "Other antibacterial agents", "doseLine": "12.5–25 mg/kg IV every 6 hours, maximum 4 g/day", "identity": "Chloramphenicol. Intravenous succinate prodrug in most hospitals, and oral forms where they still exist. A last-line drug because of aplastic anaemia.", "mechanism": "Binds the 50S ribosome and inhibits protein synthesis. Bacteriostatic for most organisms. The succinate ester must be hydrolysed to the active drug.", "spectrum": "A broad historical spectrum: many Gram-positives, Gram-negatives, anaerobes and rickettsiae. Not Pseudomonas. Not a modern resistant-Gram-negative agent.", "indications": "Only when a serious infection, often meningitis or rickettsial disease, has no safer active drug. It should be a named specialist decision.", "adult": "50–100 mg/kg/day IV divided every 6 hours, which is 12.5–25 mg/kg every 6 hours, maximum 4 g/day. Infuse over 15–30 minutes or as the product states. If levels exist, target a peak of about 10–20 mg/L.", "pkpd": "AUC and time above MIC, with excellent CSF and tissue penetration, which is the only reason it is still discussed. Hepatic glucuronidation. The succinate is renally cleared before activation, so kidney failure can paradoxically change exposure.", "renal": "The parent succinate accumulates in severe renal failure; some centres reduce the dose or follow a level. Haemodialysis: dose after, with a level if possible. CRRT: specialist dosing. Do not start a full 100 mg/kg/day in anuria without advice.", "hepatic": "Reduce the dose in significant hepatic failure and follow a level and the blood count. Grey-baby physiology is the neonatal version of failed glucuronidation; do not use it in neonates.", "resistance": "Acetyltransferase enzymes. It is not a solution for carbapenemases.", "adverse": "Dose-related marrow suppression, which is reversible, and idiosyncratic aplastic anaemia, which is not and can occur after the drug has stopped. Grey-baby syndrome in neonates. Optic neuritis on long courses.", "interactions": "Phenytoin, warfarin and sulfonylureas levels rise because metabolism is inhibited. Rifampicin and phenobarbital may lower chloramphenicol. Other marrow toxins add risk.", "monitoring": "Full blood count every couple of days. Liver tests. A serum level if the laboratory can do one. Reticulocyte count if treatment exceeds a few days. Stop at the first important cytopenia.", "special": "Septic shock: only if the microbiology is already known and nothing safer is active. Meningitis: the penetration is real, the toxicity is why it is last. Obesity: mg/kg with the 4 g cap. Pregnancy and neonates: avoid. G6PD and marrow disease: avoid.", "stewardship": "A documented exception, not a protocol drug. Stop at the earliest susceptibility that allows a safer agent. Do not discharge a patient on it."}, {"id": "fluconazole", "name": "Fluconazole", "group": "Antifungals and antivirals", "doseLine": "Candidemia: 800 mg IV load, then 400 mg daily", "identity": "Fluconazole. Triazole antifungal. Intravenous and oral, milligram for milligram. Renally cleared, unlike the mould-active azoles.", "mechanism": "Inhibits fungal lanosterol 14-alpha-demethylase and disrupts the membrane ergosterol. Fungistatic against yeasts.", "spectrum": "Candida albicans and many other Candida species. Not Candida krusei. Unreliable for Candida glabrata. No mould activity: not Aspergillus, not Mucorales.", "indications": "Targeted susceptible candidemia after a stable patient can leave an echinocandin, urinary candidiasis because it reaches urine, and mucosal candidiasis. Not empiric mould cover in neutropenia.", "adult": "Candidemia: 800 mg (12 mg/kg) IV or oral load, then 400 mg (6 mg/kg) daily. Deep or susceptible-dose-dependent infection may stay at 800 mg daily. Oesophageal: often 200–400 mg daily. Infuse IV at a comfortable rate, about 200 mg/hour.", "pkpd": "AUC/MIC. Excellent oral absorption, urine, CSF and eye levels. That pharmacokinetic kindness is why it is the step-down drug, not because it is the most fungicidal.", "renal": "Give the full load. If CrCl is 50 or below, halve the maintenance dose. Haemodialysis: full dose after dialysis, on the reduced schedule if CrCl is low between sessions. CRRT: usually the full 400–800 mg daily because the drug is cleared. SLED: similar, give after the session.", "hepatic": "No routine reduction. Hepatitis is a reason to stop. The drug can raise other drugs’ levels more than the liver changes its own dose.", "resistance": "Intrinsic in C. krusei and common in C. glabrata. Erg11 and efflux mutations. A susceptible C. albicans result is what allows step-down.", "adverse": "Nausea, alopecia on long courses, transaminase rise, QT prolongation, and rare Stevens–Johnson syndrome.", "interactions": "CYP2C9 and CYP3A4 inhibitor. Warfarin, phenytoin, tacrolimus, sulfonylureas and many others rise. Rifampicin lowers fluconazole. QT drugs.", "monitoring": "Liver tests. Creatinine, because it sets maintenance. INR and tacrolimus if relevant. Species identification before calling it definitive. No routine level.", "special": "Septic shock from candidemia: start an echinocandin, not fluconazole, then step down if stable and the species is susceptible. Meningitis: used for some susceptible yeasts, including step-down of cryptococcal therapy, at high dose. Obesity: the 12 then 6 mg/kg approach is better than a flat 400 mg. Pregnancy: avoid, especially high doses, because of teratogenicity. Immunosuppression does not create mould activity.", "stewardship": "Step down from an echinocandin at about 5–7 days of candidemia if the patient is stable, the species is susceptible, and cultures have cleared. Do not use it for Aspergillus. Urinary candiduria often needs a catheter change more than a drug."}, {"id": "voriconazole", "name": "Voriconazole", "group": "Antifungals and antivirals", "doseLine": "6 mg/kg IV every 12 hours for two doses, then 4 mg/kg", "identity": "Voriconazole. Mould-active triazole. Intravenous solution, tablets and oral suspension. The IV vehicle is a cyclodextrin. Kinetics are non-linear and vary between people.", "mechanism": "Inhibits ergosterol synthesis. Fungicidal against Aspergillus for practical purposes. Not active against Mucorales.", "spectrum": "Aspergillus, many Candida including some fluconazole-resistant species, and some rare moulds. Not Mucorales. Not reliably Fusarium in every isolate.", "indications": "First-line invasive aspergillosis. Alternative candidemia step-down when fluconazole cannot be used and the isolate is susceptible. Not mucormycosis.", "adult": "Load 6 mg/kg IV every 12 hours for two doses, then 4 mg/kg IV every 12 hours. Oral maintenance, if weight is at least 40 kg, is often 200 mg every 12 hours after a 400 mg every 12 hours load for two doses; serious invasive disease prefers the IV mg/kg regimen or a level-guided oral dose. Infuse over 1–2 hours. Take oral doses on an empty stomach.", "pkpd": "Trough concentration is the practical index because of non-linear CYP2C19 metabolism. Aim about 1–5.5 mg/L. Excellent lung and CSF levels. The cyclodextrin, not the azole, is the renal-failure problem with the IV form.", "renal": "Oral voriconazole: no renal adjustment. IV: avoid if CrCl is below 50 because the cyclodextrin accumulates, and use oral instead. If IV is unavoidable, the azole dose is not reduced; the vehicle is the concern. CRRT clears cyclodextrin better than intermittent dialysis, but oral is still preferred when the gut works. Haemodialysis does not require an extra azole dose.", "hepatic": "Child-Pugh A or B: same load, then half the maintenance dose. Child-Pugh C: use only if essential, with levels. Hepatitis from the drug itself means stop or change.", "resistance": "CYP51 mutations in Aspergillus. Mucorales are intrinsically resistant. Prior azole exposure is a risk.", "adverse": "Visual disturbance, photosensitivity, fluorosis and skin cancer on long exposure, hallucinations, hepatotoxicity, QT prolongation, and periostitis.", "interactions": "Strong CYP3A4, 2C9 and 2C19 effects. Rifampicin, carbamazepine and phenobarbital are contraindications because they collapse the level. Tacrolimus, cyclosporine, warfarin and sirolimus need major dose cuts. QT drugs.", "monitoring": "A trough after several days, then after any interacting drug or a change in liver function. Liver tests. ECG if other QT risks. Creatinine decides IV versus oral, not the mg/kg. Skin advice on long courses.", "special": "Septic shock from possible invasive aspergillosis: start the load now, and check for mucormycosis mimics if the patient was already on an azole. Meningitis: good penetration for susceptible fungi. Obesity: use adjusted body weight for the mg/kg IV dose rather than an uncapped total weight. Pregnancy: avoid. Immunosuppression is the usual host, and it does not change the load.", "stewardship": "Do not treat mucormycosis with it. Switch IV to oral when a trough is therapeutic and the gut works. Stop interacting enzyme inducers or pick another mould drug. Level-guided therapy prevents both failure and toxicity."}, {"id": "isavuconazole", "name": "Isavuconazole", "group": "Antifungals and antivirals", "doseLine": "200 mg IV or oral every 8 hours for 6 doses, then daily", "identity": "Isavuconazole, given as isavuconazonium sulfate. A 372 mg prodrug dose equals 200 mg isavuconazole. Intravenous and oral capsules. No cyclodextrin in the IV product.", "mechanism": "Inhibits ergosterol synthesis. Active against Aspergillus and many Mucorales. Fungicidal or fungistatic depending on the mould.", "spectrum": "Aspergillus and Mucorales, plus some other moulds and yeasts. Not a urinary antifungal. Not every rare mould.", "indications": "Invasive aspergillosis, as an alternative to voriconazole, and mucormycosis, usually with surgery. Useful when voriconazole QT risk or interactions are unacceptable.", "adult": "Load 200 mg (as 372 mg prodrug) IV or oral every 8 hours for six doses (48 hours), then 200 mg IV or oral every 24 hours. Infuse IV over at least 1 hour. Capsules are swallowed whole.", "pkpd": "AUC and trough, but routine levels are not required in the label. Linear kinetics, unlike voriconazole. Prodrug is cleaved in plasma. Long half-life. Poor urine levels.", "renal": "No adjustment for CrCl, haemodialysis or CRRT. IV use is acceptable in kidney failure because there is no cyclodextrin vehicle.", "hepatic": "No adjustment for mild or moderate impairment. Severe hepatic impairment has not been defined; use only with a clear reason and liver tests.", "resistance": "Azole target mutations can cross from voriconazole. Not active against every Mucorales species equally; species identification matters.", "adverse": "Nausea, liver-test abnormalities, infusion reactions, and hypokalaemia. It shortens the QT interval, which is the opposite of other azoles.", "interactions": "CYP3A4 substrate and moderate inhibitor. Rifampicin and other strong inducers are contraindicated. Tacrolimus and cyclosporine still need a reduction, but the list is shorter than voriconazole. Do not use in familial short-QT syndrome.", "monitoring": "Liver tests. Electrolytes. An ECG if the baseline QT is already short or the patient is on other QT-shortening drugs. Levels only in selected failure or interaction cases. Creatinine does not change the dose.", "special": "Septic shock from mucormycosis: start the load and involve surgery; this is not a one-drug rescue. Meningitis: some CSF data, specialist use. Obesity: the flat 200 mg dose. Pregnancy: avoid. It is often the azole chosen when voriconazole toxicity or QT prolongation has already happened.", "stewardship": "Do not add it on top of voriconazole. For mucormycosis, plan debridement and a defined duration, often alongside or instead of lipid amphotericin depending on the centre. Oral and IV doses match, so switch when the gut works."}, {"id": "posaconazole", "name": "Posaconazole", "group": "Antifungals and antivirals", "doseLine": "300 mg IV or tablet every 12 hours on day 1, then daily", "identity": "Posaconazole. Triazole. Delayed-release tablets, intravenous solution, and an older suspension. Tablet and IV doses match. The suspension does not: it is dosed more often and must be taken with fat. Do not convert 1:1.", "mechanism": "Ergosterol-synthesis inhibitor. Broad mould activity, including Aspergillus and many Mucorales as salvage or prophylaxis.", "spectrum": "Aspergillus, many Mucorales, and Candida. Used more for prophylaxis and salvage than as the first invasive-aspergillosis drug. Not a urinary agent.", "indications": "Prophylaxis in high-risk neutropenia and graft-versus-host disease. Salvage mould therapy when voriconazole or isavuconazole is unsuitable. Not first-line mucormycosis if amphotericin or isavuconazole is the local standard.", "adult": "Tablets or IV: 300 mg every 12 hours on day 1, then 300 mg every 24 hours. Infuse IV over 90 minutes through a central line if possible; a peripheral vein is a last resort. Suspension, if that is all you have: 200 mg three times daily with a fatty meal, or 400 mg twice daily for some salvage uses. Those suspension doses are not equivalent to one 300 mg tablet.", "pkpd": "Trough is the index. Prophylaxis usually wants above 0.7–1 mg/L; treatment often above 1.25 mg/L. Tablets are absorbed more reliably than suspension. Saturable suspension absorption.", "renal": "Tablets: no renal change. IV: the cyclodextrin vehicle accumulates when eGFR is below 50; prefer tablets, and use IV only if the benefit outweighs the vehicle. Haemodialysis and CRRT do not remove the azole enough to change the 300 mg dose.", "hepatic": "Use caution. No numeric reduction. Stop if drug-induced liver injury develops.", "resistance": "Azole target mutations. Prior prophylaxis can select resistant Aspergillus.", "adverse": "Nausea, diarrhoea, hepatotoxicity, hypokalaemia, and QT prolongation. Infusion thrombophlebitis.", "interactions": "Strong CYP3A4 inhibitor. Sirolimus is contraindicated with some labels. Tacrolimus, cyclosporine and warfarin need major cuts. PPIs and acid suppression hurt the suspension more than the tablet. Rifampicin collapses the level.", "monitoring": "A trough after about a week, sooner if the suspension is used or absorption is doubtful. Liver tests, potassium, ECG if other QT drugs are present. Creatinine decides IV versus tablet.", "special": "Septic shock from breakthrough mould infection while already on prophylaxis: change class, usually to lipid amphotericin, rather than doubling posaconazole blindly. Meningitis: limited. Obesity: 300 mg, then a level. Pregnancy: avoid. Neutropenia prophylaxis is the usual immunosuppressive context and does not change the gram dose.", "stewardship": "Use tablets, not suspension, unless there is no alternative. Do not stack two mould-active azoles. Stop prophylaxis when neutrophils recover or the guideline window ends. Confirm a level before calling salvage therapy a failure."}, {"id": "amphotericin", "name": "Amphotericin B", "group": "Antifungals and antivirals", "doseLine": "Liposomal 3–5 mg/kg IV daily; mucormycosis up to 5–10 mg/kg", "identity": "Amphotericin B. Polyene. The ICU product is liposomal amphotericin B. Deoxycholate amphotericin is more nephrotoxic and is a different mg/kg dose (about 0.7–1 mg/kg). Never substitute the formulations.", "mechanism": "Binds ergosterol and punches holes in the fungal membrane. Broadly fungicidal, including against many Mucorales.", "spectrum": "Most Candida, Aspergillus, Cryptococcus, Mucorales and many endemic fungi. Candida lusitaniae may resist it. Not a drug with a resistance-gene name so much as a membrane toxin.", "indications": "Mucormycosis at the high dose, cryptococcal meningitis in combination with flucytosine, and invasive mould infection when azoles cannot be used. Empiric fever in some high-risk patients is a local protocol, not an automatic start.", "adult": "Liposomal: 3 mg/kg IV daily for many invasive yeast and Aspergillus infections, 3–5 mg/kg for aspergillosis, and 5–10 mg/kg for mucormycosis. Infuse over about 2 hours. Deoxycholate, if it must be used: 0.7–1 mg/kg daily after a test of tolerability, never at the liposomal milligram dose.", "pkpd": "Peak and AUC against a large, poorly cleared molecule. Tissue accumulation, poor urine, limited CSF even though cryptococcal meningitis is treated with it plus flucytosine. The lipid shield reduces kidney binding.", "renal": "Do not reduce the mg/kg dose for AKI; a reduced dose fails the fungus. If the kidney is failing, change formulation or change drug, and replace potassium and magnesium. Haemodialysis, CRRT and SLED do not remove liposomal drug enough to require a supplemental dose.", "hepatic": "No hepatic dose change. Liver tests can still rise.", "resistance": "Rare ergosterol-pathway changes, and intrinsic resistance in some C. lusitaniae and occasional Aspergillus terreus concerns with deoxycholate. Mucorales that fail azoles are often the reason to choose it.", "adverse": "Infusion rigors, fever, chest pain, hypokalaemia, hypomagnesaemia, nephrotoxicity and anaemia. Liposomal products cause less nephrotoxicity than deoxycholate but not zero. Bronchospasm during infusion.", "interactions": "Other nephrotoxins. Digoxin toxicity if potassium falls. Granulocyte transfusions have been linked to pulmonary reactions. Do not mix with saline bags of other drugs casually; check compatibility. Saline loading can limit nephrotoxicity of the deoxycholate form.", "monitoring": "Creatinine, potassium and magnesium daily at the start. Haemoglobin on long courses. Infusion observations. No routine serum level.", "special": "Septic shock from mucormycosis or azole-breakthrough mould: start the lipid dose and arrange surgery. Cryptococcal meningitis: liposomal or deoxycholate plus flucytosine, then fluconazole consolidation. Obesity: mg/kg, often on adjusted weight at the extreme so a 10 mg/kg total-weight dose does not become an overdose; follow the local policy. Pregnancy: a preferred systemic antifungal when a serious fungal infection must be treated. Immunosuppression is the indication, not a dose modifier.", "stewardship": "Name the formulation on every order. Step down to an azole when the species, the MIC and the clinical response allow. Do not run 10 mg/kg after mucor has been resected and the patient has stabilised, without a stop date."}, {"id": "caspofungin", "name": "Caspofungin", "group": "Antifungals and antivirals", "doseLine": "70 mg IV load, then 50 mg daily", "identity": "Caspofungin. Echinocandin. Intravenous powder only. No oral echinocandin.", "mechanism": "Inhibits beta-1,3-glucan synthase and weakens the fungal cell wall. Fungicidal against Candida, fungistatic against Aspergillus. Mammals lack this target.", "spectrum": "Candida, including many fluconazole-resistant C. glabrata and C. krusei. Not a reliable Candida auris drug in every isolate, though often used. Not Mucorales. Not a urine or CSF drug. Aspergillus only as salvage.", "indications": "First-line candidemia and invasive candidiasis. Empiric Candida cover in unstable patients with risk factors. Not mucormycosis and not the first Aspergillus drug.", "adult": "70 mg IV on day 1, then 50 mg daily, each over 1 hour. Moderate hepatic impairment: 70 mg once, then 35 mg daily. If an enzyme inducer such as rifampicin is essential, many labels use 70 mg daily. Usual maximum is 70 mg/day.", "pkpd": "AUC/MIC for Candida. Large, polar molecule, hepatic metabolism, negligible urine and CSF. That distribution is why candiduria and meningitis are the wrong indications.", "renal": "No dose change for low CrCl, intermittent haemodialysis, CRRT or SLED. Give the usual dose without waiting for a level.", "hepatic": "Child-Pugh B: 70 mg load, then 35 mg daily. Child-Pugh C: no studied dose; prefer anidulafungin. Child-Pugh A: standard dose.", "resistance": "FKS mutations in the glucan-synthase gene. C. auris may be resistant. Dimorphic fungi and Mucorales are not susceptible.", "adverse": "Fever, phlebitis, histamine symptoms if infused too fast, transaminase rise, and hypokalaemia. Generally well tolerated.", "interactions": "Cyclosporine can raise caspofungin and liver tests. Rifampicin and other inducers may require 70 mg daily. Tacrolimus levels can fall slightly. No azole-scale CYP blockade.", "monitoring": "Liver tests. Creatinine is not for dosing but Candida patients are often in AKI. Species and susceptibility. No routine level.", "special": "Septic shock with candidemia risk: this, or another echinocandin, is the start, not fluconazole. Meningitis and endophthalmitis: inadequate; add or switch to a drug that enters that space. Obesity: some centres keep 70 mg daily above a high weight; the label uses 70 then 50. Pregnancy: limited data; amphotericin is better described. Immunosuppression does not add mould cover.", "stewardship": "Step down to fluconazole when the Candida is susceptible and the patient is stable. Stop if cultures and a non-infectious explanation account for the fever. Do not treat asymptomatic candiduria."}, {"id": "micafungin", "name": "Micafungin", "group": "Antifungals and antivirals", "doseLine": "100 mg IV daily for candidemia", "identity": "Micafungin. Echinocandin. Intravenous powder. No load for the candidemia dose. No oral product.", "mechanism": "Inhibits beta-1,3-glucan synthase. Fungicidal against Candida. No mammalian target.", "spectrum": "Similar to caspofungin: most Candida, weak or no Mucorales, not a CSF or urine drug. Aspergillus activity is not a first-line indication.", "indications": "Candidemia and invasive candidiasis. Oesophageal candidiasis uses a higher dose. Prophylaxis in some transplant protocols uses a lower dose.", "adult": "Candidemia: 100 mg IV daily over 1 hour. Oesophageal: 150 mg daily. Prophylaxis, where used: often 50 mg daily. No loading dose. No renal or hepatic change.", "pkpd": "AUC/MIC, linear kinetics, negligible renal clearance, poor urine and CSF. Weight may lower exposure at the extreme of obesity.", "renal": "No adjustment for AKI, haemodialysis, CRRT or SLED.", "hepatic": "No adjustment for mild, moderate or severe impairment. Still stop if drug liver injury appears.", "resistance": "FKS mutations. C. auris is variably resistant. Not a mucormycosis failure you can dose your way out of.", "adverse": "Rash, phlebitis, nausea, liver-test rise, and rare haemolysis. Fewer cyclosporine issues than caspofungin.", "interactions": "Sirolimus and nifedipine levels can rise slightly. Less inducer trouble than caspofungin. No cyclodextrin and no QT class effect.", "monitoring": "Liver tests. Clinical response and clearance of blood cultures. No level and no ECG routine.", "special": "Septic shock from Candida: 100 mg now, or 150 mg if local obesity policy says so. Meningitis and urinary infection: do not rely on it. Obesity: some ICU policies use 150 mg daily above 100–115 kg because the 100 mg exposure falls. Pregnancy: limited data. It is a reasonable echinocandin when caspofungin interactions are in the way.", "stewardship": "Same step-down rules as other echinocandins. Do not continue prophylaxis and treatment doses together. Stop when invasive Candida is excluded."}, {"id": "anidulafungin", "name": "Anidulafungin", "group": "Antifungals and antivirals", "doseLine": "200 mg IV load, then 100 mg daily", "identity": "Anidulafungin. Echinocandin. Intravenous solution reconstituted from powder. It degrades chemically in plasma and does not need the liver or the kidney.", "mechanism": "Inhibits beta-1,3-glucan synthase. Fungicidal against Candida. No renal or hepatic metabolism of consequence.", "spectrum": "
