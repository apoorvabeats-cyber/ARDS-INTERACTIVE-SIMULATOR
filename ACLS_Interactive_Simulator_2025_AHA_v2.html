<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#071b3a">
<title>ACLS Simulator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f7fb; color: #14213d; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.4; }
  button { font: inherit; cursor: pointer; border: 1px solid #d7e0ec; background: #fff; color: #14213d; border-radius: 14px; min-height: 48px; padding: 10px 12px; text-align: left; }
  button.on { background: #1457a6; color: #fff; border-color: #1457a6; }
  .wrap { max-width: 840px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { background: linear-gradient(135deg,#071b3a,#1457a6); color: #fff; border-radius: 24px; padding: 22px 18px; }
  h1 { font-size: clamp(28px, 7vw, 42px); line-height: 1.05; margin: 8px 0; }
  h2 { margin: 16px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #5f6f86; }
  p { margin: 0; }
  a { color: #9ec5ff; }
  .lede { color: #dbe9ff; font-size: 16px; }
  .card { display: block; width: 100%; margin-top: 10px; }
  .card b { display: block; color: #1457a6; font-size: 18px; }
  .meta { color: #5f6f86; margin-top: 4px; }
  canvas { width: 100%; height: 150px; display: block; background: #06110d; border-radius: 16px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pill { background: #e9f2ff; color: #1457a6; border-radius: 999px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
  .opts { display: grid; gap: 8px; }
  @media (min-width: 760px) { .opts { grid-template-columns: 1fr 1fr; } }
  .fb { margin-top: 10px; background: #fff; border: 1px solid #d7e0ec; border-radius: 16px; padding: 12px; }
  .good { background: #ecfdf5; border-color: #9bd9c5; }
  .bad { background: #fff1f2; border-color: #f1a4ad; }
  .top { display: flex; gap: 8px; margin-top: 12px; }
  .top button { flex: 1; text-align: center; }
  .stem { background: #fff; border: 1px solid #d7e0ec; border-radius: 16px; padding: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div id="app"></div>

let screen = "board";
let caseId = null;
let step = 0;
let score = 0;
let misses = 0;
let used = false;
let rhythm = "vf";
let pulse = "None";
let raf = 0;

const app = document.getElementById("app");
function cur() { return CASES.find((c) => c.id === caseId); }

function draw() {
  cancelAnimationFrame(raf);
  if (screen === "board") return board();
  if (screen === "done") return done();
  play();
}
function board() {
  const hub = location.hostname.endsWith("github.io") ? '<p><a href="index.html">← All simulators</a></p>' : "";
  app.innerHTML = `<div class="wrap"><div class="hero">${hub}
    <div style="font-size:13px;letter-spacing:.08em;font-weight:700">2025 AHA · ADULT</div>
    <h1>ACLS simulator</h1>
    <p class="lede">Seven cases. The next button is the one the 2025 adult algorithms would press: arrest, tachycardia, and bradycardia. Wrong actions stay on the screen until you correct them.</p>
  </div>
  ${CASES.map((c) => `<button class="card" data-id="${c.id}"><b>${c.title}</b><div class="meta">${c.tag}</div></button>`).join("")}
  <p class="meta" style="margin-top:14px">Educational drill based on the published 2025 AHA adult cardiac arrest, bradycardia, tachycardia, and cardioversion algorithms. Not a certification and not a substitute for the provider manual or local protocol.</p>
  </div>`;
  app.querySelectorAll(".card").forEach((b) => b.onclick = () => {
    caseId = b.dataset.id;
    cur().steps.forEach((s) => { s.missed = false; });
    step = 0; score = 0; misses = 0; used = false;
    rhythm = cur().rhythm; pulse = cur().pulse;
    screen = "play";
    draw();
  });
}
function play() {
  const c = cur();
  const s = c.steps[step];
  if (s.rhythm) rhythm = s.rhythm;
  if (s.pulse) pulse = s.pulse;
  app.innerHTML = `<div class="wrap"><div class="hero">
      <div style="font-size:13px;letter-spacing:.08em;font-weight:700">${c.tag} · ${step + 1} / ${c.steps.length}</div>
      <h1>${c.title}</h1>
      <div class="top"><button id="back">Cases</button><button id="reset">Restart case</button></div>
    </div>
    <div class="stem"><p>${c.stem}</p><div class="pills"><span class="pill">Pulse: ${pulse}</span><span class="pill" id="rlabel">Rhythm</span><span class="pill">Score ${score}</span></div></div>
    <h2>Monitor</h2>
    <canvas id="ecg"></canvas>
    <h2>${s.q}</h2>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb">Choose the action the algorithm takes next.</div>
  </div>`;
  document.getElementById("back").onclick = () => { screen = "board"; draw(); };
  document.getElementById("reset").onclick = () => {
    c.steps.forEach((s) => { s.missed = false; });
    step = 0; score = 0; misses = 0; used = false; rhythm = c.rhythm; pulse = c.pulse; draw();
  };
  document.getElementById("opts").innerHTML = s.options.map((o, i) => `<button data-i="${i}">${o.t}</button>`).join("");
  document.getElementById("opts").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || used) return;
    const o = s.options[+b.dataset.i];
    const fb = document.getElementById("fb");
    if (o.ok) {
      if (!s.missed) score++;
      used = true;
      b.className = "on";
      fb.className = "fb good";
      fb.textContent = o.why;
      if (o.rhythm) rhythm = o.rhythm;
      if (s.rhythm) rhythm = s.rhythm;
      if (s.pulse) pulse = s.pulse;
      setTimeout(() => {
        step++;
        used = false;
        if (step >= c.steps.length) { screen = "done"; draw(); }
        else draw();
      }, 700);
    } else {
      s.missed = true;
      misses++;
      fb.className = "fb bad";
      fb.textContent = o.why;
    }
  };
  startWave();
}
function done() {
  const c = cur();
  const possible = c.steps.length;
  app.innerHTML = `<div class="wrap"><div class="hero">
    <div style="font-size:13px;letter-spacing:.08em;font-weight:700">${c.tag}</div>
    <h1>${score} of ${possible}</h1>
    <p class="lede">${misses ? misses + " wrong turns, then corrected." : "Clean run."}</p>
    <div class="top"><button id="back">Cases</button><button id="retry">Retry</button></div>
  </div>
  <div class="stem">${c.pearls.map((p) => `<p style="margin-top:8px">${p}</p>`).join("")}</div>
  </div>`;
  document.getElementById("back").onclick = () => { screen = "board"; draw(); };
  document.getElementById("retry").onclick = () => {
    c.steps.forEach((s) => { s.missed = false; });
    step = 0; score = 0; misses = 0; used = false; rhythm = c.rhythm; pulse = c.pulse; screen = "play"; draw();
  };
}

function startWave() {
  const canvas = document.getElementById("ecg");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  function size() {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, r.width * dpr);
    canvas.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: r.width, h: r.height };
  }
  let dim = size();
  const n = Math.max(2, Math.floor(dim.w));
  const buf = new Float32Array(n);
  let x = 0, t = 0;
  const label = document.getElementById("rlabel");
  const names = { vf: "VF", asystole: "Asystole", pea: "PEA", vt: "Monomorphic VT", svt: "Narrow SVT", brady: "Bradycardia", sinus: "Sinus", poly: "Polymorphic VT" };
  if (label) label.textContent = names[rhythm] || rhythm;
  function sample(time) {
    if (rhythm === "vf") return (Math.sin(time * 47) + Math.sin(time * 93) + Math.sin(time * 17)) * 0.28;
    if (rhythm === "asystole") return Math.sin(time * 2) * 0.02;
    if (rhythm === "pea" || rhythm === "brady") {
      const p = (time % (rhythm === "brady" ? 1.7 : 1.35));
      const qrs = Math.exp(-((p - 0.08) ** 2) / 0.0008) - 0.35 * Math.exp(-((p - 0.12) ** 2) / 0.001);
      return qrs;
    }
    if (rhythm === "vt") return Math.sin(time * Math.PI * 2 * 3.1) * 0.75;
    if (rhythm === "poly") return Math.sin(time * 28) * (0.35 + 0.55 * Math.abs(Math.sin(time * 1.7)));
    if (rhythm === "svt") {
      const p = time % 0.32;
      return Math.exp(-((p - 0.04) ** 2) / 0.00015);
    }
    const p = time % 0.86;
    const pwave = 0.12 * Math.exp(-((p - 0.08) ** 2) / 0.0006);
    const qrs = Math.exp(-((p - 0.22) ** 2) / 0.00025) - 0.28 * Math.exp(-((p - 0.25) ** 2) / 0.0004);
    const twave = 0.22 * Math.exp(-((p - 0.48) ** 2) / 0.004);
    return pwave + qrs + twave;
  }
  function frame() {
    dim = size();
    t += 0.016;
    buf[x % buf.length] = sample(t);
    x++;
    ctx.fillStyle = "#06110d";
    ctx.fillRect(0, 0, dim.w, dim.h);
    ctx.strokeStyle = "rgba(120,200,160,.15)";
    ctx.beginPath();
    for (let g = 0; g < dim.w; g += 25) { ctx.moveTo(g, 0); ctx.lineTo(g, dim.h); }
    for (let g = 0; g < dim.h; g += 25) { ctx.moveTo(0, g); ctx.lineTo(dim.w, g); }
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = "#65f0a6";
    ctx.lineWidth = 1.6;
    const len = Math.min(x, buf.length);
    for (let i = 0; i < len; i++) {
      const idx = (x - len + i + buf.length) % buf.length;
      const px = (i / (buf.length - 1)) * dim.w;
      const py = dim.h * 0.55 - buf[idx] * dim.h * 0.38;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}
draw();
</script>
