<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GI Critical Care — Acute pancreatitis</title>
<style>
  :root{--ink:#14213d}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 18px;background:linear-gradient(90deg,#14532d,#0f766e);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#d1fae5}
  main{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:14px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0f766e}
  h2:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff}
  .chips button.pick{outline:3px solid #0f172a;outline-offset:2px}
  .g{background:#0f766e}.a{background:#b45309}.r{background:#be123c}.b{background:#1d4ed8}.p{background:#6d28d9}.n{background:#334155}
  .sev{display:flex;gap:8px;margin-bottom:10px}
  .sev b{flex:1;text-align:center;border-radius:12px;padding:10px 6px;background:#e2e8f0;color:#64748b;font-size:13px}
  .sev b.on{background:#0f766e;color:#fff}
  .sev b.warn{background:#b45309;color:#fff}
  .sev b.bad{background:#be123c;color:#fff}
  #now{border-radius:14px;padding:14px;background:#ecfdf5;font-weight:800;line-height:1.4}
  #now small{display:block;font-weight:700;color:#115e59;margin-bottom:4px}
  #steps{margin:10px 0 0;padding:0;list-style:none}
  #steps li{background:#fff;border-radius:10px;padding:8px 10px;margin-top:6px}
  #ask{display:none}
  #ask.show{display:block}
  .q{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .q button{text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
  .q button.good{border-color:#059669;background:#ecfdf5}
  .q button.bad{border-color:#dc2626;background:#fef2f2}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <h1>GI Critical Care</h1>
  <p>Acute pancreatitis. The necrosis steps are the step-up approach.</p>
</header>
<main>
  <section>
    <h2>Diagnosis</h2>
    <div class="chips" data-k="pain">
      <button type="button" class="g" data-v="yes">Typical pain</button>
      <button type="button" class="n" data-v="no">No typical pain</button>
    </div>
    <div class="chips" data-k="lipase" style="margin-top:8px">
      <button type="button" class="g" data-v="high">Lipase ≥ 3×</button>
      <button type="button" class="n" data-v="low">Lipase under 3×</button>
    </div>
    <h2>Organ failure</h2>
    <div class="chips" data-k="of">
      <button type="button" class="g" data-v="none">None</button>
      <button type="button" class="a" data-v="transient">Under 48 h</button>
      <button type="button" class="r" data-v="persistent">Over 48 h</button>
    </div>
    <h2>Cause</h2>
    <div class="chips" data-k="cause">
      <button type="button" class="b" data-v="biliary">Gallstone</button>
      <button type="button" class="a" data-v="alcohol">Alcohol</button>
      <button type="button" class="p" data-v="tg">Triglyceride</button>
      <button type="button" class="n" data-v="other">Other</button>
    </div>
    <div class="chips" data-k="cholangitis" style="margin-top:8px">
      <button type="button" class="r" data-v="yes">Cholangitis</button>
      <button type="button" class="g" data-v="no">No cholangitis</button>
    </div>
    <h2>Necrosis</h2>
    <div class="chips" data-k="necrosis">
      <button type="button" class="g" data-v="no">No collection</button>
      <button type="button" class="r" data-v="yes">Necrosis</button>
    </div>
    <div id="ask">
      <h2>1. Timing</h2>
      <div class="chips" data-k="timing">
        <button type="button" class="a" data-v="lt4">Under 4 weeks</button>
        <button type="button" class="g" data-v="gte4">4 weeks or more</button>
      </div>
      <h2>2. Infection</h2>
      <div class="chips" data-k="infection">
        <button type="button" class="r" data-v="yes">Suspected or proven</button>
        <button type="button" class="g" data-v="no">Sterile</button>
      </div>
      <h2>3. Unstable</h2>
      <div class="chips" data-k="instability">
        <button type="button" class="r" data-v="yes">Sepsis or organ failure</button>
        <button type="button" class="g" data-v="no">Stable</button>
      </div>
      <h2>4. After drainage</h2>
      <div class="chips" data-k="response">
        <button type="button" class="g" data-v="improve">Improving</button>
        <button type="button" class="r" data-v="noimprove">No improvement</button>
      </div>
    </div>
  </section>
  <section>
    <div class="sev" id="sev"><b>Mild</b><b>Moderate</b><b>Severe</b></div>
    <div id="now"><small>Now</small><span id="title">Set the patient.</span><ul id="steps"></ul></div>
    <h2>Your move</h2>
    <div class="q" id="q"></div>
    <p><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
var S={pain:null,lipase:null,of:null,cause:null,cholangitis:null,necrosis:null,timing:null,infection:null,instability:null,response:null};
var BANK={
  not:['Do not treat as pancreatitis','Urgent ERCP','Prophylactic antibiotics','Open necrosectomy'],
  ercp:['Urgent ERCP','Cholecystectomy before ERCP','Prophylactic antibiotics only','Open necrosectomy'],
  icu:['ICU and enteral feed','Prophylactic meropenem','Open necrosectomy now','Nil by mouth for a week'],
  chole:['Cholecystectomy this admission','Urgent ERCP','Prophylactic antibiotics','Delay surgery 6 weeks'],
  tg:['Insulin infusion','Prophylactic antibiotics','Urgent ERCP','Open necrosectomy'],
  support:['Early feed, no antibiotic','Prophylactic antibiotics','Urgent ERCP','Nil by mouth for a week'],
  unstable:['Urgent drainage','Wait 4 weeks no matter what','Antibiotics only','Open surgery first'],
  sterileEarly:['Support and wait','Drain now','Open necrosectomy','Prophylactic antibiotics'],
  stepup:['Drain first','Open necrosectomy first','Antibiotics and never drain','Ignore the collection'],
  earlyInfected:['Drain, delay necrosectomy','Open necrosectomy now','No antibiotics','No drainage'],
  sterileLate:['Reassess, drain if symptomatic','Open necrosectomy first','Stop feeding','Ignore it'],
  fallback:['Least invasive first','Open necrosectomy first','Prophylactic antibiotics','Nil by mouth for a week'],
  wait:['Finish the necrosis questions','Open necrosectomy','Prophylactic antibiotics','Urgent ERCP']
};
function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function necrosis(){
  if(S.instability==='yes') return {title:'Unstable necrosis', key:'unstable', lines:['Urgent source control and resuscitation.','Antibiotics and ICU care.','Drain by endoscope or catheter if the collection is reachable.','If the drain fails, necrosectomy. Do not wait out uncontrolled sepsis.']};
  if(S.infection==='no' && S.timing==='lt4') return {title:'Sterile, under 4 weeks', key:'sterileEarly', lines:['Support only.','Enteral feed.','Do not drain or operate yet. Wait for walled-off necrosis.']};
  if(S.infection==='yes' && S.instability==='no' && S.timing==='gte4') return {title:'Infected, walled off', key:'stepup', lines:['Antibiotics and support.','Drain first, endoscopic or percutaneous.','Necrosectomy only if the drain fails.','Open surgery last.']};
  if(S.infection==='yes' && S.instability==='no') return {title:'Infected, under 4 weeks', key:'earlyInfected', lines:['Antibiotics.','Drain if needed.','Delay necrosectomy while the patient allows it.','Escalate if there is no improvement.']};
  if(S.infection==='no' && S.timing==='gte4' && S.response==='noimprove') return {title:'Sterile, not improving', key:'sterileLate', lines:['Look again for infection, obstruction, or ongoing inflammation.','Drain if there is pain, SIRS, or organ failure.']};
  return {title:'Step up', key:'fallback', lines:['Least invasive first.','Escalate only if there is no improvement.']};
}
function plan(){
  if(S.pain!=='yes' || S.lipase!=='high') return {title:'Not pancreatitis', key:'not', lines:['Typical pain and a lipase at least 3 times normal are missing.']};
  if(S.cholangitis==='yes' && S.necrosis!=='yes') return {title:'Cholangitis', key:'ercp', lines:['Urgent ERCP.','Antibiotics.','Support the organ failure.']};
  if(S.necrosis==='yes'){
    if(!S.timing||!S.infection||!S.instability||!S.response) return {title:'Necrosis', key:'wait', lines:['Answer timing, infection, stability, and the response to drainage.']};
    var n=necrosis();
    if(S.cholangitis==='yes'){ n.lines=['Urgent ERCP for cholangitis.'].concat(n.lines); if(n.key!=='unstable'){ n.key='ercp'; n.title='Cholangitis and necrosis'; } }
    return n;
  }
  if(S.of==='persistent') return {title:'Severe pancreatitis', key:'icu', lines:['ICU.','Moderate lactated Ringer, not a large flood.','Enteral feed if the gut works.','No prophylactic antibiotic.']};
  if(S.cause==='tg') return {title:'Triglyceride pancreatitis', key:'tg', lines:['Insulin infusion.','No prophylactic antibiotic.','Feed when the abdomen allows.']};
  if(S.cause==='biliary' && S.of==='none') return {title:'Mild gallstone pancreatitis', key:'chole', lines:['Early oral feeding.','No antibiotics.','Cholecystectomy this admission.']};
  var name=S.of==='transient'?'Moderately severe pancreatitis':'Mild pancreatitis';
  return {title:name, key:'support', lines:['Moderate lactated Ringer.','Early oral or enteral feeding.','No prophylactic antibiotic.','CT only if the patient gets worse or the diagnosis is unclear.']};
}
var lastKey='';
function paint(){
  document.getElementById('ask').className=S.necrosis==='yes'?'show':'';
  var sev=document.querySelectorAll('#sev b');
  sev[0].className=S.of==='none'?'on':'';
  sev[1].className=S.of==='transient'?'warn':'';
  sev[2].className=S.of==='persistent'?'bad':'';
  var p=plan();
  document.getElementById('title').textContent=p.title;
  document.getElementById('steps').innerHTML=p.lines.map(function(l){ return '<li>'+l+'</li>'; }).join('');
  if(p.key!==lastKey){
    lastKey=p.key;
    var right=BANK[p.key][0];
    document.getElementById('q').innerHTML=shuffle(BANK[p.key]).map(function(t){
      return '<button type="button" data-ok="'+(t===right?'1':'0')+'">'+t+'</button>';
    }).join('');
  }
}
document.querySelectorAll('.chips').forEach(function(box){
  box.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      box.querySelectorAll('button').forEach(function(x){ x.classList.remove('pick'); });
      b.classList.add('pick');
      S[box.dataset.k]=b.dataset.v;
      paint();
    };
  });
});
document.getElementById('q').onclick=function(e){
  var b=e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#q button').forEach(function(x){ x.classList.remove('good','bad'); });
  b.classList.add(b.dataset.ok==='1'?'good':'bad');
};
paint();
</script>
<script src="icu-audio.js?v=20260925s"></script>
</body>
</html>
