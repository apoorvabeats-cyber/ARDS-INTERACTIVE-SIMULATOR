<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GI Critical Care — Acute pancreatitis</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f7fb;color:#14213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 18px 10px;background:#0f766e;color:#fff}
  h1{margin:0;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
  #stepName{margin:4px 0 0;font-weight:700}
  main{max-width:760px;margin:0 auto;padding:14px 14px 92px}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:12px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#0f766e}
  h2:first-child{margin-top:0}
  .hint{margin:0 0 10px;font-weight:700;color:#334155}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button,.yn button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;color:#fff;background:#0f766e}
  .chips button.pick,.yn button.pick{outline:3px solid #0f172a;outline-offset:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#334155;margin-bottom:4px}
  input,select{width:100%;font-size:16px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px}
  input[type=range]{accent-color:#0f766e}
  .out{margin-top:12px;border-radius:14px;padding:12px;background:#f8fafc;border:2px solid #e2e8f0;font-weight:800;line-height:1.45}
  .out.bad{border-color:#be123c}
  .out b{font-size:22px;display:block}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .row3 div{border:2px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center;font-weight:800}
  .row3 div.bad{border-color:#be123c}
  .row3 b{display:block;font-size:20px}
  canvas{width:100%;height:220px;background:#fff;border:2px solid #e2e8f0;border-radius:12px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;margin-top:8px}
  .legend i{display:inline-block;width:18px;height:4px;background:#0f766e;margin-right:6px;vertical-align:middle}
  .legend .red{background:#dc2626}
  .legend .now{background:#f59e0b;width:4px;height:14px}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e2e8f0}
  nav button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:#0f766e;color:#fff}
  nav button:disabled{background:#cbd5e1;color:#64748b}
  ul{margin:8px 0 0;padding-left:18px}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <h1>GI Critical Care</h1>
  <p id="stepName">Diagnosis</p>
</header>
<main><section id="view"></section></main>
<nav>
  <button type="button" id="back">Back</button>
  <button type="button" id="next">Next</button>
</nav>
<script>
var S={lr:'150'};
var stack=['dx'];
var raf=0, hour=0, tick=0, path=[70];
var TITLE={
  dx:'Diagnosis', labs:'First look', sev:'Severity', fluid:'Fluids',
  pain:'Pain', feed:'Feeding', check:'Check again', cause:'Cause',
  bile:'Gallstone', comp:'Complication', bag:'Collection', bagwhy:'Why it matters', step:'Step up',
  act:'What to do', sum:'Summary'
};
function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function map(){ var a=num('sbp'), b=num('dbp'); return a==null||b==null?null:(a+2*b)/3; }
function ag(){ var a=num('na'), b=num('cl'), c=num('hco3'); return a==null||b==null||c==null?null:a-(b+c); }
function corr(){ var ca=num('ca'), alb=num('alb'); return ca==null||alb==null?null:ca+0.8*(4-alb); }
function pf(){ var o=num('pao2'), f=num('fio2'); if(o==null||f==null) return null; if(f>1) f=f/100; return f?o/f:null; }
function sirs(){
  var n=0, have=0;
  if(num('temp')!=null){ have++; if(num('temp')>38||num('temp')<36) n++; }
  if(num('hr')!=null){ have++; if(num('hr')>90) n++; }
  if(num('rr')!=null){ have++; if(num('rr')>20) n++; }
  if(num('wbc')!=null){ have++; if(num('wbc')>12||num('wbc')<4) n++; }
  return {n:n, have:have};
}
function bisap(){
  var s=sirs();
  var bits=[num('bun')==null?null:num('bun')>25, num('gcs')==null?null:num('gcs')<15, s.have<4?null:s.n>=2, num('age')==null?null:num('age')>60, S.pleura==null?null:S.pleura==='yes'];
  return {pts:bits.filter(function(x){return x===true;}).length, left:bits.filter(function(x){return x==null;}).length};
}
function ofResp(){ var r=pf(); if(S.vent==='yes') return true; if(r!=null&&r<=300) return true; if(num('spo2')!=null&&num('spo2')<90) return true; return false; }
function ofCirc(){ var m=map(); if(S.pressor==='yes') return true; if(m!=null&&m<65) return true; return false; }
function ofRenal(){ if(num('cr')!=null&&num('cr')>=1.9) return true; if(num('uo')!=null&&num('wt')!=null&&num('uo')/num('wt')<0.5) return true; return false; }
function anyOF(){ return ofResp()||ofCirc()||ofRenal(); }
function severity(){
  if(anyOF()&&S.dur==='persist') return 'Severe';
  if(anyOF()&&S.dur==='transient') return 'Moderately severe';
  if(anyOF()) return '';
  if(S.local==='yes') return 'Moderately severe';
  return 'Mild';
}
function marshall(){
  var r=pf(), c=num('cr'), s=num('sbp');
  if(r==null||c==null||s==null) return null;
  var resp=r>400?0:r>300?1:r>200?2:r>100?3:4;
  var renal=c<1.4?0:c<=1.8?1:c<=3.6?2:c<=4.9?3:4;
  var cv=s>=90?0:S.pressor==='yes'?2:1;
  return {resp:resp, renal:renal, cv:cv, max:Math.max(resp,renal,cv)};
}
function bagName(){
  if(!S.nec||!S.weeks) return '';
  if(S.nec==='no'&&S.weeks==='early') return 'Acute fluid collection';
  if(S.nec==='no') return 'Pseudocyst';
  if(S.weeks==='early') return 'Acute necrotic collection';
  return 'Walled-off necrosis';
}
function ranson(){
  var biliary=S.cause==='biliary';
  var ids=['age','wbc','glu','ldh','ast'];
  var miss=ids.filter(function(id){ return num(id)==null; }).length;
  var pts=(num('age')>(biliary?70:55)?1:0)+(num('wbc')>(biliary?18:16)?1:0)+(num('glu')>(biliary?220:200)?1:0)+(num('ldh')>(biliary?400:350)?1:0)+(num('ast')>250?1:0);
  return {pts:pts, miss:miss, biliary:biliary};
}
function glasgow(){
  var ids=['age','wbc','glu','bun','pao2','ca','alb','ldh'];
  var miss=ids.filter(function(id){ return num(id)==null; }).length;
  var pts=(num('age')>55?1:0)+(num('wbc')>15?1:0)+(num('glu')>180?1:0)+(num('bun')>45?1:0)+(num('pao2')<60?1:0)+(num('ca')<8?1:0)+(num('alb')<3.2?1:0)+(num('ldh')>600?1:0);
  return {pts:pts, miss:miss};
}
function ctsi(){ if(S.bal==null||S.bal===''||S.necros==null||S.necros==='') return null; return (+S.bal)+(+S.necros); }
function isInfected(){ return S.infected==='yes'||S.gas==='yes'||S.fever==='yes'||S.relapse==='yes'; }
function comps(){
  if(Array.isArray(S.comp)) return S.comp.filter(function(x){ return x && x!=='none'; });
  return S.comp && S.comp!=='none' ? [S.comp] : [];
}
function hasComp(name){ return comps().indexOf(name)>=0; }
function route(){
  var r=['dx','labs','sev','fluid','pain','feed','check','cause'];
  if(S.cause==='biliary') r.push('bile');
  r.push('comp');
  ['breath','shock','aki','acs','vessel','gut','bileblock','pleura','duct'].forEach(function(c){
    if(hasComp(c)) r.push('act-'+c);
  });
  if(hasComp('collection')){
    r.push('bag');
    if(S.nec==='no' && S.sym==='yes') r.push('bagwhy');
    if(S.nec==='yes'||isInfected()||S.sym==='yes') r.push('step');
  }
  r.push('sum');
  return r;
}
function dxCount(){ return (S.pain==='yes'?1:0)+(S.lipase==='yes'?1:0)+(S.image==='yes'?1:0); }
function ok(id){
  if(id==='dx') return dxCount()>=2;
  if(id==='labs') return map()!=null;
  if(id==='sev') return !anyOF() || !!S.dur;
  if(id==='feed') return !!S.oral;
  if(id==='check') return !!S.check;
  if(id==='cause') return !!S.cause;
  if(id==='bile') return !!S.cholangitis && !!S.block;
  if(id==='comp') return Array.isArray(S.comp) && S.comp.length>0;
  if(id==='bag') return !!S.nec && !!S.weeks;
  if(id==='bagwhy') return !!S.why;
  if(id==='step') return stepDone();
  if(id.indexOf('act-')===0) return actReady();
  return true;
}
function chips(key, opts){
  return '<div class="chips" data-k="'+key+'">'+opts.map(function(o){
    return '<button type="button" data-v="'+o[0]+'" class="'+(S[key]===o[0]?'pick':'')+'">'+o[1]+'</button>';
  }).join('')+'</div>';
}
function box(id, label){ return '<div><label>'+label+'</label><input id="'+id+'" inputmode="decimal" value="'+(S[id]||'')+'"></div>'; }
function yn(key, label){
  return '<div><label>'+label+'</label><div class="chips" data-k="'+key+'"><button type="button" data-v="yes" class="'+(S[key]==='yes'?'pick':'')+'">Yes</button><button type="button" data-v="no" class="'+(S[key]==='no'?'pick':'')+'">No</button></div></div>';
}
function out(title, lines, bad){
  return '<div class="out'+(bad?' bad':'')+'"><b>'+title+'</b>'+(lines&&lines.length?'<ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>':'')+'</div>';
}
function labsLive(){
  var m=map(), g=ag(), ca=corr(), s=sirs(), b=bisap();
  var bits=[];
  if(m!=null) bits.push('MAP '+m.toFixed(0));
  if(g!=null) bits.push('Anion gap '+g.toFixed(0));
  if(ca!=null) bits.push('Corrected calcium '+ca.toFixed(1));
  if(s.have) bits.push('SIRS '+(s.have<4?s.n+' so far':s.n));
  if(b.left<5) bits.push('BISAP '+b.pts+(b.left?' · '+b.left+' left':''));
  return bits.length?out(bits[0], bits.slice(1), m!=null&&m<65):'';
}
function views(){
  return {
    dx:function(){
      var n=dxCount();
      return '<h2>Two of these three</h2><p class="hint">Do not wait for a CT if the first two are present.</p>'
        +yn('pain','Typical pain')+yn('lipase','Lipase or amylase at least 3 times normal')+yn('image','Scan looks like pancreatitis')
        +out(n>=2?'Acute pancreatitis':n+' of 3', n>=2?['Start treatment.']:['Not enough to call it pancreatitis.'], n<2);
    },
    labs:function(){
      return '<p class="hint">MAP needs the two pressures. The other boxes feed the scores.</p>'
        +'<h2>Vitals</h2><div class="grid">'+box('age','Age')+box('wt','Weight kg')+box('hr','Heart rate')+box('sbp','Systolic')+box('dbp','Diastolic')+box('spo2','SpO2 %')+box('rr','Respiratory rate')+box('temp','Temperature °C')+box('gcs','GCS')+'</div>'
        +'<h2>Blood</h2><div class="grid">'+box('wbc','WBC')+box('hct','Hematocrit')+box('bun','BUN mg/dL')+box('cr','Creatinine')+box('na','Sodium')+box('k','Potassium')+box('cl','Chloride')+box('hco3','Bicarbonate')+box('glu','Glucose')+box('ca','Calcium')+box('alb','Albumin')+box('mg','Magnesium')+box('lact','Lactate')+box('uo','Urine mL/h')+'</div>'
        +'<h2>Liver and cause</h2><div class="grid">'+box('bili','Bilirubin')+box('ast','AST')+box('alt','ALT')+box('alp','ALP')+box('ggt','GGT')+box('lip','Lipase')+box('crp','CRP')+box('ldh','LDH')+box('tg','Triglyceride')+box('fio2','FiO2')+box('pao2','PaO2')+'</div>'
        +'<h2>Yes or no</h2><div class="grid">'+yn('pleura','Pleural effusion')+yn('pressor','Vasopressor')+yn('vent','On a ventilator')+yn('local','A collection is already known')+'</div>'
        +'<div id="live">'+labsLive()+'</div>';
    },
    sev:function(){
      var name=severity();
      var m=marshall();
      var lines=[];
      lines.push('Lung '+(ofResp()?'failing':'clear'));
      lines.push('Pressure '+(ofCirc()?'failing':'holding'));
      lines.push('Kidney '+(ofRenal()?'failing':'clear'));
      if(m) lines.push('Marshall '+m.max+' · lung '+m.resp+' · kidney '+m.renal+' · pressure '+m.cv);
      var b=bisap();
      if(b.left===0) lines.push('BISAP '+b.pts+(b.pts>=3?' · high':''));
      var rn=ranson(); if(rn.miss===0) lines.push((rn.biliary?'Gallstone Ranson ':'Ranson ')+rn.pts);
      var gl=glasgow(); if(gl.miss===0) lines.push('Glasgow '+gl.pts+(gl.pts>=3?' · severe':''));
      var body='<h2>Organ failure</h2><div class="row3"><div class="'+(ofResp()?'bad':'')+'"><span>Lung</span><b>'+(ofResp()?'Yes':'No')+'</b></div><div class="'+(ofCirc()?'bad':'')+'"><span>Pressure</span><b>'+(ofCirc()?'Yes':'No')+'</b></div><div class="'+(ofRenal()?'bad':'')+'"><span>Kidney</span><b>'+(ofRenal()?'Yes':'No')+'</b></div></div>';
      if(anyOF()) body+='<h2>How long</h2>'+chips('dur',[['transient','Under 48 h'],['persist','48 h or more']]);
      body+=out(name||'How long has this lasted?', lines, name==='Severe');
      return body;
    },
    fluid:function(){
      return '<p class="hint">Lactated Ringer. Aim for a pressure of at least 65. Reassess, do not flood.</p>'
        +'<label>Lactated Ringer <b id="lrLab">'+(S.lr||150)+'</b> mL/h</label><input id="lr" type="range" min="0" max="400" step="10" value="'+(S.lr||150)+'">'
        +yn('wet','Crackles, high neck veins, or wet lungs')
        +'<h2>Mean arterial pressure</h2><canvas id="chart" width="720" height="220"></canvas>'
        +'<div class="legend"><span><i></i>MAP mmHg</span><span><i class="red"></i>65</span><span><i class="now"></i>This hour</span></div>'
        +'<p class="hint">Bottom axis is hours. Under the red line the pressure is too low.</p><div id="live"></div>';
    },
    pain:function(){
      return '<p class="hint">Treat the pain. Do not let the pain medicine delay a low pressure or low oxygen.</p>'
        +'<label>Pain <b id="painLab">'+(S.painScore||'5')+'</b> / 10</label><input id="painScore" type="range" min="0" max="10" step="1" value="'+(S.painScore||5)+'">'
        +yn('analgesia','Pain medicine given')
        +'<div id="live"></div>';
    },
    feed:function(){
      return '<p class="hint">Feed within a day if the belly allows it. Use the gut before a vein.</p>'
        +yn('oral','Can drink')+yn('gut','Gut can be used')+yn('nj','Stomach is not emptying')
        +'<div id="live"></div>';
    },
    check:function(){
      return '<h2>At 6 to 12 hours</h2>'+chips('check',[['better','Improving'],['same','No change'],['worse','Worse']])
        +'<div id="live"></div>';
    },
    cause:function(){
      return '<h2>Cause</h2>'+chips('cause',[['biliary','Gallstone'],['alcohol','Alcohol'],['tg','Triglyceride'],['cal','High calcium'],['drug','Drug'],['ercp','After ERCP'],['trauma','Trauma'],['auto','Autoimmune'],['unknown','Not clear']])
        +'<div id="live"></div>';
    },
    bile:function(){
      return '<h2>Bile duct</h2>'+yn('cholangitis','Cholangitis')+yn('block','Stone or blockage still there')
        +'<div id="live"></div>';
    },
    comp:function(){
      var opts=[['none','Nothing new'],['breath','Breathing'],['shock','Shock'],['aki','Kidneys'],['collection','Collection'],['acs','Belly pressure'],['vessel','Bleed or clot'],['gut','Gut'],['bileblock','Bile duct later'],['pleura','Pleural fluid'],['duct','Duct leak']];
      var sel=Array.isArray(S.comp)?S.comp:[];
      return '<p class="hint">Choose every problem. More than one is allowed.</p><div class="chips" data-k="comp">'+opts.map(function(o){
        return '<button type="button" data-v="'+o[0]+'" class="'+(sel.indexOf(o[0])>=0?'pick':'')+'">'+o[1]+'</button>';
      }).join('')+'</div><div id="live"></div>';
    },
    bag:function(){
      return '<h2>What kind</h2>'+yn('nec','Necrosis')+chips('weeks',[['early','Under 4 weeks'],['late','4 weeks or more']])
        +yn('sym','Pain, blockage, or another problem from it')+yn('infected','Infected')
        +yn('gas','Gas in the collection')+yn('fever','Fever or sepsis')+yn('relapse','Worse after getting better')
        +'<h2>CTSI</h2><div class="grid"><div><label>Balthazar</label><select id="bal"><option value="">—</option><option value="0">A normal</option><option value="1">B enlarged</option><option value="2">C fat</option><option value="3">D one collection</option><option value="4">E two or gas</option></select></div>'
        +'<div><label>Necrosis</label><select id="necros"><option value="">—</option><option value="0">None</option><option value="2">Under 30%</option><option value="4">30–50%</option><option value="6">Over 50%</option></select></div></div>'
        +'<div id="live"></div>';
    },
    bagwhy:function(){
      return '<h2>What is it doing</h2>'+chips('why',[['goo','Stomach blocked'],['bile','Bile duct pressed'],['infect','Infected'],['bleed','Bleeding'],['rupture','Ruptured']])
        +'<div id="live"></div>';
    },
    step:function(){
      var st=stepState();
      var html='<p class="hint">'+(bagName()||'Collection')+'</p>';
      st.shown.forEach(function(s){ html+='<h2>'+s.text+'</h2>'+chips(s.key, s.opts); });
      return html+'<div id="live"></div>';
    },
    act:function(){ return actBody()+'<div id="live"></div>'; },
    sum:function(){ return summary(); }
  };
}
function painLive(){
  var p=num('painScore'); if(p==null) p=5;
  if(p>=4 && S.analgesia!=='yes') return out('Give a pain medicine', ['Then check the breathing and the pressure.'], true);
  return out('Pain is treated', []);
}
function feedLive(){
  if(!S.oral) return '';
  if(S.oral==='yes') return out('Oral feeding', ['Low fat when it is tolerated.']);
  if(S.oral==='no' && !S.gut) return out('Can the gut be used?', []);
  if(S.gut==='no') return out('Vein feeding', ['Only because the gut cannot be used.']);
  if(S.nj==='yes') return out('Feed past the stomach', []);
  return out('Nasogastric feeding', ['Do not use a vein if the gut works.']);
}
function checkLive(){
  if(S.check==='worse') return out('ICU', ['Look for a complication.'], true);
  if(S.check==='same') return out('Look for a complication', []);
  if(S.check==='better') return out('Continue this plan', []);
  return '';
}
function causeLive(){
  var tg=num('tg');
  if(S.cause==='tg'){
    if(tg==null) return out('Enter the triglyceride', []);
    if(tg>=1000) return out('Lower the triglyceride', ['Insulin infusion.'], true);
    if(tg>=500) return out('Triglyceride is high', ['Lower it.']);
    return out('Triglyceride is not the cause', ['Under 500.'], true);
  }
  if(S.cause==='biliary') return out('Next is the bile duct', []);
  if(S.cause==='alcohol') return out('Support', ['Watch withdrawal.']);
  if(S.cause==='cal') return out('Lower the calcium', []);
  if(S.cause==='drug') return out('Stop the drug', []);
  if(S.cause==='auto') return out('Prove it first', ['Do not start steroids on a guess.']);
  if(S.cause==='unknown' && num('age')!=null && num('age')>=40) return out('Look for a tumor', []);
  if(S.cause) return out('Support', []);
  return '';
}
function bileLive(){
  if(!S.cholangitis||!S.block) return '';
  var lines=[];
  var bad=false;
  if(S.cholangitis==='yes'){ lines.push('ERCP within 24 hours.'); bad=true; }
  else if(S.block==='yes') lines.push('The duct is still blocked. ERCP, not a routine early ERCP for simple gallstone pancreatitis.');
  else lines.push('No urgent ERCP.');
  if(severity()==='Mild') lines.push('Take the gallbladder out this admission.');
  else if(severity()) lines.push('Do not take the gallbladder out this admission.');
  return out(S.cholangitis==='yes'?'Cholangitis':'Gallstone pancreatitis', lines, bad);
}
function compLive(){
  if(!Array.isArray(S.comp)||!S.comp.length) return '';
  if(S.comp.indexOf('none')>=0) return out('No new complication', []);
  var names={breath:'Breathing',shock:'Shock',aki:'Kidneys',collection:'Collection',acs:'Belly pressure',vessel:'Bleed or clot',gut:'Gut',bileblock:'Bile duct',pleura:'Pleural fluid',duct:'Duct leak'};
  return out(comps().length+' selected', comps().map(function(c){ return names[c]; }));
}
function bagLive(){
  var name=bagName();
  if(!name) return '';
  var lines=[];
  var score=ctsi();
  if(score!=null){ var band=score>=7?'severe':score>=4?'moderate':'mild'; lines.push('CTSI '+score+' · '+band); }
  if(S.infected==='yes'||S.gas==='yes'||S.fever==='yes'||S.relapse==='yes') lines.push('Treat it as infected.');
  else if((name==='Acute fluid collection'||name==='Pseudocyst') && S.sym!=='yes') lines.push('No drain just because it is there.');
  return out(name, lines, S.infected==='yes'||(score!=null&&score>=7));
}
function bagWhyLive(){
  var t={goo:'The stomach is blocked. Drain it.', bile:'The duct is pressed. Drain it, and relieve the duct if the jaundice stays.', infect:'This is infected. Go to the step-up.', bleed:'Look for a bleeding vessel. Embolise it.', rupture:'It has ruptured. Drain it and treat the peritonitis.'};
  return S.why?out(bagName()||'Collection', [t[S.why]]):'';
}
function stepRight(q){
  if(!q || q.right==null) return true;
  if(Array.isArray(q.right)) return q.right.indexOf(S[q.key])>=0;
  return S[q.key]===q.right;
}
function stepScript(){
  var early=S.weeks==='early', infected=isInfected(), nec=S.nec==='yes';
  var q=[{key:'stable', text:'Is the patient stable?', opts:[['yes','Stable'],['no','Unstable']], right:null}];
  if(!S.stable) return q;
  if(S.stable==='no'){
    q.push({key:'abx', text:'Next: give an antibiotic.', opts:[['yes','Antibiotic'],['no','No antibiotic']], right:'yes'});
    if(!stepRight(q[q.length-1])) return q;
    q.push({key:'drainHow', text:'Next: drain now.', opts:[['endo','Endoscopic drain'],['perc','Percutaneous drain'],['no','No drain']], right:['endo','perc']});
    if(!stepRight(q[q.length-1])) return q;
    q.push({key:'respond', text:'Next: is the drain working?', opts:[['yes','Better'],['no','Not better']], right:null});
    if(!S.respond) return q;
    if(S.respond==='no'){
      q.push({key:'op', text:'Next: necrosectomy. The drain failed.', opts:[['yes','Necrosectomy'],['no','No necrosectomy']], right:'yes'});
      if(!stepRight(q[q.length-1])) return q;
      q.push({key:'opFail', text:'Next: did necrosectomy control it?', opts:[['no','Controlled'],['yes','Failed']], right:null});
      if(S.opFail==='yes') q.push({key:'open', text:'Next: open surgery is last.', opts:[['yes','Open surgery'],['no','Not yet']], right:'yes'});
    }
    return q;
  }
  if(nec && !infected && early) return q;
  if(infected && early){
    q.push({key:'abx', text:'Next: antibiotic, and wait for a wall.', opts:[['yes','Antibiotic and wait'],['drain','Drain now'],['open','Open surgery']], right:'yes'});
    if(!stepRight(q[q.length-1])) return q;
    q.push({key:'worse', text:'Next: drain only if the patient gets worse.', opts:[['no','Still stable'],['yes','Getting worse']], right:null});
    if(S.worse==='yes') q.push({key:'drainHow', text:'Next: drain now.', opts:[['endo','Endoscopic drain'],['perc','Percutaneous drain']], right:['endo','perc']});
    return q;
  }
  if(infected){
    q.push({key:'abx', text:'Next: antibiotic.', opts:[['yes','Antibiotic'],['no','No antibiotic']], right:'yes'});
    if(!stepRight(q[q.length-1])) return q;
    q.push({key:'drainHow', text:'Next: drain first.', opts:[['endo','Endoscopic drain'],['perc','Percutaneous drain'],['op','Necrosectomy first']], right:['endo','perc']});
    if(!stepRight(q[q.length-1])) return q;
    q.push({key:'respond', text:'Next: check the drain.', opts:[['yes','Better'],['no','Not better']], right:null});
    if(S.respond==='no'){
      q.push({key:'op', text:'Next: necrosectomy.', opts:[['yes','Necrosectomy'],['no','Open surgery now']], right:'yes'});
      if(!stepRight(q[q.length-1])) return q;
      q.push({key:'opFail', text:'Next: did necrosectomy control it?', opts:[['no','Controlled'],['yes','Failed']], right:null});
      if(S.opFail==='yes') q.push({key:'open', text:'Next: open surgery is last.', opts:[['yes','Open surgery'],['no','Stop']], right:'yes'});
    }
    return q;
  }
  q.push({key:'drainHow', text:'Next: drain the problem. No surgery first.', opts:[['endo','Endoscopic drain'],['perc','Percutaneous drain'],['op','Surgery first']], right:['endo','perc']});
  return q;
}
function stepState(){
  var all=stepScript();
  var last=all[all.length-1];
  var answered=S[last.key]!=null && S[last.key]!=='';
  var good=stepRight(last);
  return {shown:all, done:answered && good && stepScriptDone(all), wrong:answered && !good, last:last};
}
function stepScriptDone(all){
  var last=all[all.length-1];
  if(!stepRight(last) || S[last.key]==null || S[last.key]==='') return false;
  if(last.key==='stable' && S.stable==='yes' && S.nec==='yes' && !isInfected() && S.weeks==='early') return true;
  if(last.key==='stable') return false;
  if(last.key==='respond' && S.respond==='yes') return true;
  if(last.key==='worse' && S.worse==='no') return true;
  if(last.key==='opFail' && S.opFail==='no') return true;
  if(last.key==='drainHow' && (S.drainHow==='endo'||S.drainHow==='perc')){
    if(S.stable==='yes' && !isInfected()) return true;
    if(S.worse==='yes') return true;
  }
  if(last.key==='open') return S.open==='yes';
  if(last.right!=null) return stepRight(last);
  return false;
}
function stepDone(){ return stepState().done; }
function stepPlan(){
  var lines=[(bagName()||'Collection')+(S.stable==='no'?'. Unstable.':'. Stable.')];
  if(S.stable==='yes' && S.nec==='yes' && !isInfected() && S.weeks==='early') return lines.concat(['No antibiotic.','No drain.','No operation.','Wait for walled-off necrosis.']);
  if(S.abx==='yes' && S.weeks==='early' && isInfected() && S.stable==='yes') lines.push('Antibiotic. Wait toward 4 weeks.');
  else if(S.abx==='yes') lines.push('Antibiotic.');
  if(S.worse==='no') lines.push('Still stable, so no drain yet.');
  if(S.drainHow==='endo') lines.push('Endoscopic drain.');
  if(S.drainHow==='perc') lines.push('Percutaneous drain.');
  if(S.respond==='yes') lines.push('The drain is working. Stop there.');
  if(S.op==='yes') lines.push('Necrosectomy.');
  if(S.opFail==='no') lines.push('Necrosectomy controlled it.');
  if(S.open==='yes') lines.push('Open surgery.');
  return lines;
}
function stepLive(){
  var st=stepState();
  if(st.wrong) return out('Not that', [st.last.text], true);
  if(!st.done) return '';
  return out('Treatment plan', stepPlan(), false);
}
function thisComp(){ var id=stack[stack.length-1]; return id.indexOf('act-')===0?id.slice(4):''; }
function actBody(){
  var c=thisComp();
  if(c==='breath') return '<h2>Support</h2>'+chips('o2mode',[['o2','Oxygen'],['hfnc','High flow or mask'],['vent','Ventilator']]);
  if(c==='shock') return '<h2>Pressure still low</h2>'+yn('norepi','Start norepinephrine')+chips('source',[['nec','Infected necrosis'],['bleed','Bleeding'],['acs','Belly compartment'],['heart','Heart']]);
  if(c==='aki') return '<h2>Dialysis</h2>'+chips('whyrrt',[['none','No dialysis reason'],['k','High potassium'],['acid','Acid'],['flood','Fluid overload'],['urea','Uremia']])+yn('rrt','Dialyse');
  if(c==='acs') return '<h2>Bladder pressure</h2>'+box('iap','mmHg')+'<p class="hint">20 or more, with organ failure, is compartment.</p>';
  if(c==='vessel') return '<h2>Which one</h2>'+chips('vtype',[['clot','Vein clot'],['pseudo','Pseudoaneurysm']]);
  if(c==='gut') return '<h2>Which one</h2>'+chips('gutkind',[['bleed','Bleed'],['goo','Stomach blocked'],['duo','Duodenum blocked'],['colon','Colon'],['fistula','Fistula'],['perf','Perforation']]);
  if(c==='bileblock') return yn('stillblock','The duct is still blocked');
  if(c==='pleura') return yn('amylase','Pleural fluid amylase is high');
  if(c==='duct') return yn('stent','Stent the duct');
  return '';
}
function actReady(){
  var c=thisComp();
  if(c==='breath') return !!S.o2mode;
  if(c==='shock') return !!S.norepi && !!S.source;
  if(c==='aki') return !!S.whyrrt && !!S.rrt;
  if(c==='acs') return num('iap')!=null;
  if(c==='vessel') return !!S.vtype;
  if(c==='gut') return !!S.gutkind;
  if(c==='bileblock') return !!S.stillblock;
  if(c==='pleura') return !!S.amylase;
  if(c==='duct') return !!S.stent;
  return true;
}
function breathNeed(){
  if(S.vent==='yes'||(num('spo2')!=null&&num('spo2')<88)||(num('rr')!=null&&num('rr')>=35)) return 'vent';
  if(ofResp()||(num('spo2')!=null&&num('spo2')<94)) return 'hfnc';
  return 'o2';
}
function actLive(){
  var c=thisComp();
  if(c==='breath'&&S.o2mode){
    var need=breathNeed();
    var name={o2:'Oxygen', hfnc:'High flow or a mask', vent:'A ventilator'};
    var bad=need==='vent'&&S.o2mode!=='vent' || need==='hfnc'&&S.o2mode==='o2';
    return out(name[need], bad?['That support is not enough.']:['Match the support to the oxygen and the work of breathing.'], bad);
  }
  if(c==='shock'&&S.norepi&&S.source){
    var low=map()!=null&&map()<65;
    var lines=[];
    if(low && S.norepi!=='yes') lines.push('Start norepinephrine.');
    else if(!low && S.norepi==='yes') lines.push('The pressure is already 65 or more.');
    else lines.push(S.norepi==='yes'?'Norepinephrine is on.':'No pressor.');
    var src={nec:'Look in the necrosis.', bleed:'Look for bleeding.', acs:'Measure the belly pressure.', heart:'Look at the heart.'};
    lines.push(src[S.source]);
    return out('Shock', lines, low&&S.norepi!=='yes');
  }
  if(c==='aki'&&S.whyrrt&&S.rrt){
    var dial=S.whyrrt!=='none';
    var bad=dial!==(S.rrt==='yes');
    return out(dial?'Dialyse':'Not yet', dial?['There is a reason to dialyse.']:['No potassium, acid, fluid, or uremia reason.'], bad);
  }
  if(c==='acs'&&num('iap')!=null){
    var p=num('iap');
    if(p>=20) return out('Compartment', ['ICU. Stop extra fluid. Decompress if the pressure and the organs do not improve.'], true);
    if(p>=12) return out('Pressure is up', ['Not compartment yet. Measure it again.']);
    return out('Not compartment', []);
  }
  if(c==='vessel'&&S.vtype){
    if(S.vtype==='pseudo') return out('Pseudoaneurysm', ['CT angiogram, then embolise it.'], true);
    return out('Vein clot', ['Decide anticoagulation one patient at a time. Do not anticoagulate active bleeding.']);
  }
  if(c==='gut'&&S.gutkind){
    var g={bleed:['Bleed','Endoscopy.'], goo:['Stomach blocked','Drain the collection that is pressing it.'], duo:['Duodenum blocked','CT, then relieve the block.'], colon:['Colon','Ischemia or blockage needs a surgical decision.'], fistula:['Fistula','Control sepsis, then the anatomy.'], perf:['Perforation','Surgery.']};
    return out(g[S.gutkind][0], [g[S.gutkind][1]], S.gutkind==='perf'||S.gutkind==='colon');
  }
  if(c==='bileblock'&&S.stillblock) return out(S.stillblock==='yes'?'ERCP':'No ERCP now', S.stillblock==='yes'?['The duct is still blocked.']:['Watch.']);
  if(c==='pleura'&&S.amylase) return out(S.amylase==='yes'?'Duct leak into the chest':'Not a pancreatic effusion', S.amylase==='yes'?['MRCP. Stent the duct if it is leaking.']:[]);
  if(c==='duct'&&S.stent) return out(S.stent==='yes'?'Stent the duct':'No stent', S.stent==='yes'?['The collection will keep returning without it.']:['Only if the duct is leaking.']);
  return '';
}
function summary(){
  var lines=[];
  var m=map(); if(m!=null) lines.push('MAP '+m.toFixed(0)+' mmHg.');
  var g=ag(); if(g!=null) lines.push('Anion gap '+g.toFixed(0)+'.');
  var ca=corr(); if(ca!=null) lines.push('Corrected calcium '+ca.toFixed(1)+'.');
  var b=bisap(); if(b.left===0) lines.push('BISAP '+b.pts+'.');
  var rn=ranson(); if(rn.miss===0) lines.push((rn.biliary?'Gallstone Ranson ':'Ranson ')+rn.pts+'.');
  var gl=glasgow(); if(gl.miss===0) lines.push('Glasgow '+gl.pts+'.');
  var s=sirs(); if(s.have===4) lines.push('SIRS '+s.n+'.');
  var ms=marshall(); if(ms) lines.push('Marshall '+ms.max+'.');
  if(S.cause) lines.push('Cause: '+S.cause+'.');
  if(bagName()) lines.push(bagName()+'.');
  if(stepDone()) stepPlan().forEach(function(line){ lines.push(line); });
  else if(S.nec==='yes' && !isInfected() && S.weeks==='early') lines.push('Sterile necrosis under 4 weeks. No drain yet.');
  if(S.why==='goo') lines.push('The collection is blocking the stomach.');
  if(S.why==='bleed'||S.vtype==='pseudo') lines.push('Embolise the bleeding vessel.');
  if(S.o2mode==='vent') lines.push('Ventilate.');
  if(S.norepi==='yes') lines.push('Norepinephrine.');
  if(S.rrt==='yes') lines.push('Dialyse.');
  if(num('iap')!=null && num('iap')>=20) lines.push('Abdominal compartment. Decompress if it does not fall.');
  if(S.gutkind==='perf') lines.push('Perforation. Surgery.');
  if(S.amylase==='yes'||S.stent==='yes') lines.push('Stent a leaking duct.');
  if(S.stillblock==='yes') lines.push('The duct is still blocked. ERCP.');
  var score=ctsi(); if(score!=null) lines.push('CTSI '+score+'.');
  if(severity()==='Severe' || S.check==='worse') lines.push('ICU.');
  if(S.cholangitis==='yes') lines.push('ERCP within 24 hours.');
  if(S.cause==='biliary' && severity()==='Mild') lines.push('Cholecystectomy this admission.');
  var wet=S.wet==='yes'; if(wet) lines.push('Stop extra fluid. The lungs are wet.');
  return out(severity()||'Acute pancreatitis', lines, severity()==='Severe');
}
function fluidNote(){
  var rate=num('lr')||0, m=map();
  var lines=[];
  if(S.wet==='yes') lines.push('Stop more fluid. The lungs are wet.');
  else if(rate>300) lines.push('Too much fluid.');
  else if(m!=null && m<65 && rate<80) lines.push('The pressure is under 65. Give more, then check again.');
  else lines.push('Check the pressure, urine, BUN, hematocrit, and lactate again at 6 hours.');
  var u=num('uo'), w=num('wt');
  if(u!=null&&w) lines.push('Urine '+(u/w).toFixed(2)+' mL/kg/h. Aim at least 0.5.');
  return out('Fluid', lines, S.wet==='yes'||rate>300||(m!=null&&m<65));
}
function fluidPath(){
  var start=map()==null?72:map();
  var rate=num('lr')==null?150:num('lr');
  var wet=S.wet==='yes';
  var cur=start, outp=[cur];
  for(var h=1;h<=12;h++){
    var d=0;
    if(wet) d -= cur>70?1:0.3;
    else if(rate>300) d -= 0.4;
    else if(rate>=80 && rate<=200) d += cur<78?1.6:0.15;
    else if(rate<50 && cur<70) d -= 0.7;
    cur=Math.max(45, Math.min(115, cur+d));
    outp.push(cur);
  }
  return outp;
}
function draw(){
  var c=document.getElementById('chart'); if(!c) return;
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var W=c.clientWidth||640, H=c.clientHeight||220;
  c.width=W*dpr; c.height=H*dpr;
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var min=45, max=120, L=46, T=16, B=28, R=W-10, n=path.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-(v-min)/(max-min)); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [50,65,90,110].forEach(function(v){ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(R,Y(v)); g.stroke(); g.fillText(String(v),4,Y(v)+4); });
  g.fillText('mmHg',4,12);
  [0,3,6,9,12].forEach(function(h){ g.fillText(h+' h', X(h)-8, H-8); });
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(65)); g.lineTo(R,Y(65)); g.stroke(); g.setLineDash([]);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  path.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
  g.strokeStyle='#f59e0b'; g.lineWidth=2; g.beginPath(); g.moveTo(X(hour),T); g.lineTo(X(hour),H-B); g.stroke();
  g.fillStyle='#0f766e'; g.font='bold 14px sans-serif';
  g.fillText(Math.round(path[hour])+' mmHg', Math.min(R-78, X(hour)+6), Math.max(28, Y(path[hour])-6));
}
function loop(){
  tick++;
  if(tick>28){ tick=0; hour=(hour+1)%path.length; draw(); }
  raf=requestAnimationFrame(loop);
}
function refresh(){
  var id=stack[stack.length-1];
  var el=document.getElementById('live');
  var html='';
  if(id==='labs') html=labsLive();
  if(id==='pain') html=painLive();
  if(id==='feed') html=feedLive();
  if(id==='check') html=checkLive();
  if(id==='cause') html=causeLive();
  if(id==='bile') html=bileLive();
  if(id==='comp') html=compLive();
  if(id==='bag') html=bagLive();
  if(id==='bagwhy') html=bagWhyLive();
  if(id==='step') html=stepLive();
  if(id.indexOf('act-')===0) html=actLive();
  if(id==='fluid'){ path=fluidPath(); html=fluidNote(); var lab=document.getElementById('lrLab'); if(lab) lab.textContent=String(num('lr')||0); draw(); }
  var pl=document.getElementById('painLab'); if(pl) pl.textContent=String(num('painScore')==null?5:num('painScore'));
  if(el) el.innerHTML=html;
  document.getElementById('next').disabled = id==='sum' ? false : !ok(id);
}
function show(){
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  var id=stack[stack.length-1];
  var r=route();
  var actName={breath:'Breathing',shock:'Shock',aki:'Kidneys',acs:'Belly pressure',vessel:'Bleed or clot',gut:'Gut',bileblock:'Bile duct',pleura:'Pleural fluid',duct:'Duct leak'};
  var title=id.indexOf('act-')===0?actName[id.slice(4)]:TITLE[id];
  document.getElementById('stepName').textContent=title+' · '+(r.indexOf(id)+1)+' of '+r.length;
  document.getElementById('view').innerHTML=id.indexOf('act-')===0?actBody()+'<div id="live"></div>':views()[id]();
  if(id==='bag'){ ['bal','necros'].forEach(function(k){ var s=document.getElementById(k); if(s&&S[k]!=null) s.value=S[k]; }); }
  document.getElementById('back').disabled=stack.length<2;
  document.getElementById('next').textContent=id==='sum'?'Done':'Next';
  refresh();
  if(id==='fluid'){ hour=0; tick=0; raf=requestAnimationFrame(loop); }
}
document.getElementById('view').onclick=function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.id==='abx'||b.id==='drain'||b.id==='op'||b.id==='open'){ S[b.id]=S[b.id]==='yes'?'no':'yes'; show(); return; }
  var box=b.closest('.chips'); if(!box) return;
  if(box.dataset.k==='comp'){
    var v=b.dataset.v;
    if(!Array.isArray(S.comp)) S.comp=[];
    if(v==='none') S.comp=['none'];
    else {
      S.comp=S.comp.filter(function(x){ return x!=='none'; });
      var i=S.comp.indexOf(v);
      if(i>=0) S.comp.splice(i,1); else S.comp.push(v);
    }
    show();
    return;
  }
  var stepKeys=['stable','abx','worse','drainHow','respond','op','opFail','open'];
  var si=stepKeys.indexOf(box.dataset.k);
  if(si>=0){ for(var j=si+1;j<stepKeys.length;j++) delete S[stepKeys[j]]; }
  S[box.dataset.k]=b.dataset.v;
  show();
};
document.getElementById('view').oninput=function(e){
  if(!e.target.id) return;
  S[e.target.id]=e.target.value;
  refresh();
};
document.getElementById('view').onchange=document.getElementById('view').oninput;
document.getElementById('back').onclick=function(){ if(stack.length>1){ stack.pop(); show(); } };
document.getElementById('next').onclick=function(){
  var id=stack[stack.length-1];
  if(id==='sum'){ window.location.href='index.html'; return; }
  if(!ok(id)) return;
  var r=route(), i=r.indexOf(id);
  stack.push(r[i+1]);
  show();
};
show();
