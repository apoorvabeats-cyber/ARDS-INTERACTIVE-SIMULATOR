<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low potassium</title>
<style>
  :root{--ink:#0f172a;--bg:#e7f6f3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px;background:linear-gradient(90deg,#0f766e,#0e7490);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#ccfbf1}
  #limitBadge{background:#fff;color:#0f766e;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
  main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0f766e}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;color:#334155}
  input,select{width:100%;font-size:18px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a}
  #target{border-color:#059669;background:#ecfdf5}
  input[type=range]{padding:0;height:32px;accent-color:#0f766e;border:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff}
  #r10{background:#0f766e}#r20{background:#7c3aed}#oral{background:#0891b2}#mg{background:#d97706}
  .chips button.on{outline:3px solid #0f172a;outline-offset:2px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{border-radius:12px;text-align:center;padding:10px 6px;color:#fff}
  .num:nth-child(1){background:#0f766e}.num:nth-child(2){background:#0e7490}.num:nth-child(3){background:#059669}
  .num.bad{background:#dc2626}
  .num span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .num b{font-size:28px}
  #banner{display:none;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800;text-align:center;padding:10px;margin:12px 0}
  #banner.show{display:block}
  #ods{display:none;margin-top:10px;background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800}
  #ods.show{display:block}
  .plot{margin-top:12px;background:#f0fdfa;border:2px solid #99f6e4;border-radius:16px;padding:8px}
  canvas.chart{width:100%;height:280px;display:block}
  .ecgbox{margin-top:10px;background:#04130f;border-radius:16px;padding:8px;border:2px solid #115e59}
  .ecgbox.bad{border-color:#dc2626}
  canvas.ecg{width:100%;height:168px;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin:4px 0}
  .legend i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
  .lg-k{background:#0f766e}.lg-goal{background:#059669}.lg-lim{background:#dc2626}
  .hours{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
  .hours b{display:block;font-size:16px;color:#0f766e}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <div>
    <h1>Low potassium</h1>
    <p>Drag the rate. The line is 12 hours.</p>
  </div>
  <div id="limitBadge">Stop at 5.0</div>
</header>
<main>
  <section>
    <h2>Replacement</h2>
    <div class="row">
      <div><label>Potassium now</label><input id="k" type="text" inputmode="decimal" value="2.8"></div>
      <div><label>12 h goal</label><input id="target" type="text" inputmode="decimal" value="4"></div>
    </div>
    <label>Route</label>
    <select id="route">
      <option value="10">Peripheral · 10</option>
      <option value="20">Central · 20</option>
      <option value="40">Monitored · 40</option>
    </select>
    <label>Rate <b id="rateLabel">10</b> mmol/h</label>
    <input id="rate" type="range" min="0" max="40" step="1" value="10">
    <input id="rateN" type="number" value="10" min="0" max="60">
    <div class="chips">
      <button type="button" id="r10">10 mmol/h</button>
      <button type="button" id="r20">20 mmol/h</button>
      <button type="button" id="oral">Oral 40</button>
      <button type="button" id="mg">Low magnesium</button>
    </div>
  </section>
  <section>
    <div class="nums">
      <div class="num"><span>mmol</span><b id="mmol">—</b></div>
      <div class="num" id="endBox"><span>At 12 h</span><b id="end">—</b></div>
      <div class="num" id="deltaBox"><span>Change</span><b id="delta">—</b></div>
    </div>
    <div id="banner"></div>
    <div id="ods"></div>
    <div class="plot">
      <canvas class="chart" id="chart" width="720" height="280"></canvas>
      <div class="legend"><span><i class="lg-k"></i>Potassium</span><span id="goalKey"><i class="lg-goal"></i>Goal</span><span><i class="lg-lim"></i>5.0</span></div>
    </div>
    <div class="hours" id="hours"></div>
    <div class="ecgbox" id="ecgBox"><canvas class="ecg" id="ecg" width="720" height="168"></canvas></div>
    <p><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
var H=12, CAP=5, phase=0, nowKind='normal', laterKind='normal';
var NAME={normal:'Normal',peaked:'Peaked T',wide:'Wide QRS',sine:'Sine wave',flat:'Flat T',uwave:'U wave',bigu:'Large U',vt:'VT'};
function read(id){ var n=parseFloat(String(document.getElementById(id).value||'').replace(',','.')); return Number.isFinite(n)?n:null; }
function on(id){ return document.getElementById(id).classList.contains('on'); }
function factor(){ return on('mg')?0.4:1; }
function hyperKind(k){ if(k>=8) return 'sine'; if(k>=6.5) return 'wide'; if(k>=5.5) return 'peaked'; return 'normal'; }
function hypoKind(k){ if(k>=5.5) return hyperKind(k); if(k<2.2) return 'vt'; if(k<2.6) return 'bigu'; if(k<3.2) return 'uwave'; if(k<3.5) return 'flat'; return 'normal'; }
function project(k, rate, oral){
  var per=0.01*factor(), path=[k], given=0;
  for(var h=1;h<=H;h++){ given+=rate; if(oral&&h<=4) given+=10; path.push(k+given*per); }
  return {path:path, mmol:given, final:path[H]};
}
function g(x,c,w,a){ var d=x-c; return a*Math.exp(-(d*d)/(2*w*w)); }
function sample(t, kind){
  t=((t%1)+1)%1;
  if(kind==='sine') return Math.sin(t*Math.PI*2)*0.85;
  if(kind==='vt') return Math.sin(t*Math.PI*8)*(0.55+0.35*Math.sin(t*40));
  var p=0.16, qw=0.012, qa=1, ta=0.32, tw=0.035, tc=0.46, ua=0, uc=0.62;
  if(kind==='peaked'){ ta=0.9; tw=0.02; }
  if(kind==='wide'){ p=0.04; qw=0.045; ta=0.55; tw=0.03; }
  if(kind==='flat'){ ta=0.08; ua=0.18; }
  if(kind==='uwave'){ ta=0.06; ua=0.32; }
  if(kind==='bigu'){ ta=0.02; ua=0.5; qa=0.75; }
  return g(t,0.14,0.018,p)+g(t,0.24,qw*0.45,-0.25*qa)+g(t,0.27,qw,qa)+g(t,tc,tw,ta)+g(t,uc,0.04,ua);
}
function paintChart(path, goal, cross){
  var c=document.getElementById('chart'), dpr=Math.min(2,devicePixelRatio||1);
  var W=c.clientWidth||640, Ht=c.clientHeight||280;
  c.width=W*dpr; c.height=Ht*dpr;
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,Ht);
  var vals=path.concat([goal, CAP]);
  var min=Math.min.apply(null,vals)-0.35, max=Math.max.apply(null,vals)+0.35;
  var L=42,T=16,B=22,R=W-78, n=path.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(Ht-T-B)*(1-(v-min)/(max-min)); };
  ctx.font='12px sans-serif'; ctx.fillStyle='#64748b'; ctx.strokeStyle='#ccfbf1';
  for(var i=0;i<=4;i++){ var v=max-(max-min)*i/4, y=T+(Ht-T-B)*i/4; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke(); ctx.fillText(v.toFixed(1),2,y+4); }
  ctx.beginPath(); ctx.strokeStyle='#0f766e'; ctx.lineWidth=3.5;
  path.forEach(function(v,i){ var x=X(i), y=Y(v); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
  ctx.stroke();
  ctx.fillStyle='#0f766e'; ctx.beginPath(); ctx.arc(X(n),Y(path[n]),5,0,7); ctx.fill();
  ctx.strokeStyle='#dc2626'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(0),Y(CAP)); ctx.lineTo(R,Y(CAP)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#dc2626'; ctx.fillText('5.0', X(0)+4, Y(CAP)-4);
  if(cross!=null){ ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.arc(X(cross),Y(path[cross]),7,0,7); ctx.fill(); }
  var y=Y(goal);
  ctx.strokeStyle='#059669'; ctx.lineWidth=4; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(X(0),y); ctx.lineTo(R,y); ctx.stroke(); ctx.setLineDash([]);
  var label='Goal '+Number(goal).toFixed(1);
  ctx.font='bold 13px sans-serif';
  var tw=ctx.measureText(label).width+14, bx=Math.min(W-tw-6,R+4), by=Math.max(4,Math.min(Ht-28,y-12));
  ctx.fillStyle='#059669'; ctx.fillRect(bx,by,tw,22); ctx.fillStyle='#fff'; ctx.fillText(label,bx+7,by+16);
}
function drawStrip(ctx, y0, h, kind, title){
  var W=ctx.canvas.clientWidth||640;
  ctx.fillStyle='#06281f'; ctx.fillRect(0,y0,W,h);
  ctx.strokeStyle='#115e5944'; ctx.lineWidth=1;
  for(var x=0;x<W;x+=24){ ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y0+h); ctx.stroke(); }
  for(var y=y0;y<y0+h;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  var bad=kind==='sine'||kind==='wide'||kind==='vt'||kind==='bigu';
  ctx.strokeStyle=bad?'#f87171':'#4ade80'; ctx.lineWidth=2; ctx.beginPath();
  var beats=4;
  for(var i=0;i<W;i++){
    var t=(i/W)*beats+phase;
    var v=sample(t, kind);
    var py=y0+h*0.55-v*h*0.38;
    if(i) ctx.lineTo(i,py); else ctx.moveTo(i,py);
  }
  ctx.stroke();
  ctx.font='bold 13px sans-serif'; ctx.fillStyle=bad?'#fecaca':'#bbf7d0';
  ctx.fillText(title+' · '+NAME[kind], 8, y0+16);
}
function frame(){
  var c=document.getElementById('ecg'), dpr=Math.min(2,devicePixelRatio||1);
  var W=c.clientWidth||640, Ht=c.clientHeight||168;
  if(c.width!==Math.floor(W*dpr)){ c.width=W*dpr; c.height=Ht*dpr; }
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  drawStrip(ctx, 0, Ht/2-2, nowKind, 'Now');
  drawStrip(ctx, Ht/2+2, Ht/2-2, laterKind, '12 h');
  phase+=0.012;
  requestAnimationFrame(frame);
}
function paint(){
  var k=read('k'), goal=read('target'), rate=parseFloat(document.getElementById('rateN').value)||0;
  var maxR=+document.getElementById('route').value;
  document.getElementById('rate').value=Math.min(40,rate);
  document.getElementById('rateLabel').textContent=String(rate);
  if(k==null) return;
  if(goal==null) goal=k;
  var t=project(k, rate, on('oral'));
  var cross=null;
  for(var h=1;h<t.path.length;h++) if(t.path[h-1]<CAP && t.path[h]>=CAP){ cross=h; break; }
  document.getElementById('mmol').textContent=String(Math.round(t.mmol));
  document.getElementById('end').textContent=t.final.toFixed(1);
  document.getElementById('delta').textContent=(t.final-k>=0?'+':'')+(t.final-k).toFixed(1);
  var over=cross!=null;
  document.getElementById('endBox').className='num'+(over?' bad':'');
  document.getElementById('deltaBox').className='num'+(over||rate>maxR?' bad':'');
  var lines=[];
  if(rate>maxR) lines.push('Too fast for this route.');
  if(Math.abs(t.final-goal)>0.15) lines.push('The green line is the goal. This rate does not reach it.');
  document.getElementById('banner').className=lines.length?'show':'';
  document.getElementById('banner').textContent=lines.join(' ');
  var ods=document.getElementById('ods');
  if(over){ ods.className='show'; ods.textContent='Overcorrection. The potassium crosses 5.0 at '+cross+' h. Stop the infusion.'; }
  else { ods.className=''; ods.textContent=''; }
  document.getElementById('goalKey').innerHTML='<i class="lg-goal"></i>Goal '+goal.toFixed(1);
  paintChart(t.path, goal, cross);
  document.getElementById('hours').innerHTML=[0,3,6,9,12].map(function(h){ return '<div>'+h+' h<b>'+t.path[h].toFixed(1)+'</b></div>'; }).join('');
  nowKind=hypoKind(k); laterKind=hypoKind(t.final);
  var bad=nowKind==='vt'||nowKind==='bigu'||laterKind==='sine'||laterKind==='wide'||laterKind==='vt';
  document.getElementById('ecgBox').className='ecgbox'+(bad?' bad':'');
}
function applyGoal(){
  var k=read('k'), goal=read('target');
  if(k==null||goal==null){ paint(); return; }
  var oral=on('oral')?40:0;
  var need=Math.max(0,(goal-k)/(0.01*factor())-oral);
  document.getElementById('rateN').value=Math.max(0, Math.round(need/H));
  paint();
}
document.getElementById('rate').oninput=function(e){ document.getElementById('rateN').value=e.target.value; paint(); };
document.getElementById('rateN').oninput=paint;
document.getElementById('route').onchange=paint;
document.getElementById('k').oninput=function(){ var k=read('k'); if(k!=null && k<3.5) document.getElementById('target').value='4'; applyGoal(); };
document.getElementById('target').oninput=applyGoal;
document.getElementById('r10').onclick=function(){ document.getElementById('route').value='10'; document.getElementById('rateN').value=10; paint(); };
document.getElementById('r20').onclick=function(){ document.getElementById('route').value='20'; document.getElementById('rateN').value=20; paint(); };
document.getElementById('oral').onclick=function(){ this.classList.toggle('on'); applyGoal(); };
document.getElementById('mg').onclick=function(){ this.classList.toggle('on'); applyGoal(); };
var q=new URLSearchParams(location.search);
if(q.get('k')) document.getElementById('k').value=q.get('k');
applyGoal();
requestAnimationFrame(frame);
window.addEventListener('resize', paint);
</script>
</body>
</html>
