<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low potassium</title>
<style>
  :root{--ink:#0f172a;--muted:#475569;--bg:#e7f6f3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px;background:linear-gradient(90deg,#0f766e,#0e7490);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#ccfbf1}
  #limitBadge{background:#fff;color:#0f766e;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
  main{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0f766e}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;color:#334155}
  input,select{width:100%;font-size:18px;font-weight:700;padding:8px;border:2px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px}
  #target{border-color:#059669;background:#ecfdf5}
  input[type=range]{padding:0;height:32px;accent-color:#0f766e;border:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff;background:#0f766e}
  .chips button.on{outline:3px solid #0f172a;outline-offset:2px}
  #oral{background:#0891b2}
  #mg{background:#d97706}
  #dex{background:#7c3aed}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{border-radius:12px;text-align:center;padding:10px 6px;color:#fff}
  .num:nth-child(1){background:#0f766e}
  .num:nth-child(2){background:#0e7490}
  .num:nth-child(3){background:#059669}
  .num.bad{background:#dc2626}
  .num span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .num b{font-size:28px}
  #banner{display:none;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800;text-align:center;padding:10px;margin:12px 0}
  #banner.show{display:block}
  #ods{display:none;margin-top:10px;background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.35}
  #ods.show{display:block}
  #ods b{display:block;font-size:16px;letter-spacing:.03em;margin-bottom:4px}
  .plot{margin-top:12px;background:#f0fdfa;border:2px solid #99f6e4;border-radius:16px;padding:8px 8px 4px}
  canvas{width:100%;height:340px;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin:4px 0 8px}
  .legend i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
  .lg-k{background:#0f766e}.lg-goal{background:#059669}.lg-lim{background:#dc2626}
  .hours{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
  .hours b{display:block;font-size:16px;color:#0f766e}
  .quiet{font-size:12px;color:var(--muted);margin:8px 0 0}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <div>
    <h1>Low potassium</h1>
    <p>12-hour line. 10 mmol raises the potassium about 0.1.</p>
  </div>
  <div id="limitBadge">Stop at 5.0</div>
</header>
<main>
  <section>
    <h2>Replacement</h2>
    <div class="row">
      <div><label>Potassium now</label><input id="k" type="text" inputmode="decimal" value="2.8"></div>
      <div><label>12 h goal</label><input id="target" type="text" inputmode="decimal" value="4.0"></div>
    </div>
    <p class="quiet" id="goalNote"></p>
    <label>Route</label>
    <select id="route">
      <option value="10">Peripheral · max 10 mmol/h</option>
      <option value="20">Central · max 20 mmol/h</option>
      <option value="40">Monitored central · max 40 mmol/h</option>
    </select>
    <label>IV rate <b id="rateLabel">10</b> mmol/h</label>
    <input id="rate" type="range" min="0" max="40" step="1" value="10">
    <input id="rateN" type="number" value="10" min="0" max="60" step="1">
    <div class="chips">
      <button type="button" id="r10">10 mmol/h</button>
      <button type="button" id="r20">20 mmol/h</button>
      <button type="button" id="oral">Oral 40</button>
      <button type="button" id="mg">Low magnesium</button>
      <button type="button" id="dex">Dextrose diluent</button>
    </div>
  </section>
  <section>
    <div class="nums">
      <div class="num"><span>mmol in 12 h</span><b id="mmol">—</b></div>
      <div class="num" id="endBox"><span>At 12 h</span><b id="end">—</b></div>
      <div class="num" id="deltaBox"><span>Change</span><b id="delta">—</b></div>
    </div>
    <div id="banner"></div>
    <div id="ods"></div>
    <div class="plot">
      <canvas id="chart" width="720" height="340"></canvas>
      <div class="legend"><span><i class="lg-k"></i>Potassium</span><span id="goalKey"><i class="lg-goal"></i>Goal</span><span><i class="lg-lim"></i>5.0</span></div>
    </div>
    <div class="hours" id="hours"></div>
    <p class="quiet" id="note"></p>
    <p class="quiet"><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
var H=12, CAP=5.0;
function factor(){
  var f=1;
  if(document.getElementById('mg').classList.contains('on')) f*=0.4;
  if(document.getElementById('dex').classList.contains('on')) f*=0.5;
  return f;
}
function read(id){
  var raw=String(document.getElementById(id).value||'').replace(',','.').trim();
  var n=parseFloat(raw);
  return Number.isFinite(n)?n:null;
}
function project(k, rate, oral){
  var per=0.01*factor();
  var path=[k], given=0;
  for(var h=1;h<=H;h++){
    given+=rate;
    if(oral && h<=4) given+=10;
    path.push(k+given*per);
  }
  return {path:path, mmol:given, final:path[H], delta:path[H]-k};
}
function draw(path, goal, crossH){
  var c=document.getElementById('chart');
  var dpr=Math.min(2, devicePixelRatio||1);
  var cssW=c.clientWidth||640, cssH=c.clientHeight||340;
  c.width=cssW*dpr; c.height=cssH*dpr;
  var ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  var vals=path.concat([goal, CAP]);
  var min=Math.min.apply(null,vals)-0.3, max=Math.max.apply(null,vals)+0.3;
  if(!(max>min)){ min=2; max=6; }
  var L=42,T=22,B=26,plotR=cssW-86, n=path.length-1;
  var X=function(i){ return L+(plotR-L)*i/n; };
  var Y=function(v){ return T+(cssH-T-B)*(1-(v-min)/(max-min)); };
  ctx.font='12px sans-serif'; ctx.fillStyle='#64748b'; ctx.strokeStyle='#ccfbf1';
  for(var i=0;i<=4;i++){
    var v=max-(max-min)*i/4, y=T+(cssH-T-B)*i/4;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(plotR,y); ctx.stroke();
    ctx.fillText(v.toFixed(1), 2, y+4);
  }
  ctx.beginPath(); ctx.strokeStyle='#0f766e'; ctx.lineWidth=3.5;
  path.forEach(function(v,i){ var x=X(i), y=Y(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle='#0f766e'; ctx.beginPath(); ctx.arc(X(n), Y(path[n]), 5, 0, 7); ctx.fill();
  ctx.strokeStyle='#dc2626'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(0), Y(CAP)); ctx.lineTo(plotR, Y(CAP)); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle='#dc2626'; ctx.font='11px sans-serif'; ctx.fillText('5.0', X(0)+4, Y(CAP)-4);
  if(crossH!=null){
    ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.arc(X(crossH), Y(path[crossH]), 7, 0, 7); ctx.fill();
    ctx.font='bold 13px sans-serif'; ctx.fillText('High', X(Math.min(crossH,n-1))+8, Y(path[crossH])-8);
  }
  var y=Y(goal);
  ctx.strokeStyle='#059669'; ctx.lineWidth=4; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(X(0), y); ctx.lineTo(plotR, y); ctx.stroke();
  ctx.setLineDash([]);
  var label='Goal '+Number(goal).toFixed(1);
  ctx.font='bold 13px sans-serif';
  var tw=ctx.measureText(label).width+14;
  var bx=Math.min(cssW-tw-6, plotR+6);
  var by=Math.max(6, Math.min(cssH-30, y-12));
  ctx.fillStyle='#059669'; ctx.fillRect(bx, by, tw, 24);
  ctx.fillStyle='#fff'; ctx.fillText(label, bx+7, by+16);
}
function paint(){
  var k=read('k'), goal=read('target');
  var rate=parseFloat(document.getElementById('rateN').value)||0;
  var oral=document.getElementById('oral').classList.contains('on');
  var maxR=parseFloat(document.getElementById('route').value);
  document.getElementById('rate').value=Math.min(40, rate);
  document.getElementById('rateLabel').textContent=String(rate);
  if(k==null) return;
  if(goal==null) goal=k;
  var t=project(k, rate, oral);
  var cross=null;
  for(var h=1;h<t.path.length;h++){
    if(t.path[h-1]<CAP && t.path[h]>=CAP){ cross=h; break; }
  }
  document.getElementById('mmol').textContent=String(Math.round(t.mmol));
  document.getElementById('end').textContent=t.final.toFixed(2);
  document.getElementById('delta').textContent=(t.delta>=0?'+':'')+t.delta.toFixed(2);
  var over=cross!=null;
  document.getElementById('endBox').className='num'+(over?' bad':'');
  document.getElementById('deltaBox').className='num'+(over?' bad':'');
  var lines=[];
  if(rate>maxR) lines.push('Above the safe rate for this route. Peripheral 10, central 20, and 40 only with a central line and monitoring.');
  if(document.getElementById('mg').classList.contains('on')) lines.push('Low magnesium. The same potassium barely moves the line. Replace magnesium.');
  if(document.getElementById('dex').classList.contains('on')) lines.push('Dextrose pushes potassium into cells. Use saline.');
  if(Math.abs(t.final-goal)>0.15) lines.push('This rate does not reach the goal. The green line is still the goal.');
  document.getElementById('banner').className=lines.length?'show':'';
  document.getElementById('banner').textContent=lines.join(' ');
  var ods=document.getElementById('ods');
  if(cross!=null){
    ods.className='show';
    ods.innerHTML='<b>Overcorrection — hyperkalemia</b>The potassium crosses 5.0 at '+cross+' h. Stop the infusion and recheck. This is not a target to aim through.';
  } else { ods.className=''; ods.innerHTML=''; }
  document.getElementById('goalNote').textContent='Goal '+goal.toFixed(1)+' at 12 h. The green line is that number.';
  document.getElementById('goalKey').innerHTML='<i class="lg-goal"></i>Goal '+goal.toFixed(1);
  draw(t.path, goal, cross);
  document.getElementById('hours').innerHTML=[0,3,6,9,12].map(function(h){ return '<div>'+h+' h<b>'+t.path[h].toFixed(1)+'</b></div>'; }).join('');
  document.getElementById('note').textContent='Estimate only. Recheck the potassium. Do not run past 5.0.';
}
function applyGoal(){
  var k=read('k'), goal=read('target');
  if(k==null||goal==null){ paint(); return; }
  var per=0.01*factor();
  var oral=document.getElementById('oral').classList.contains('on')?40:0;
  var need=Math.max(0, (goal-k)/per - oral);
  var rate=Math.max(0, Math.round(need/H));
  document.getElementById('rateN').value=rate;
  paint();
}
document.getElementById('rate').addEventListener('input', function(e){ document.getElementById('rateN').value=e.target.value; paint(); });
document.getElementById('rateN').addEventListener('input', paint);
document.getElementById('route').addEventListener('change', paint);
document.getElementById('k').addEventListener('input', function(){ setTarget(); applyGoal(); });
document.getElementById('target').addEventListener('input', applyGoal);
document.getElementById('target').addEventListener('change', applyGoal);
document.getElementById('r10').onclick=function(){ document.getElementById('route').value='10'; document.getElementById('rateN').value=10; paint(); };
document.getElementById('r20').onclick=function(){ document.getElementById('route').value='20'; document.getElementById('rateN').value=20; paint(); };
document.getElementById('oral').onclick=function(){ this.classList.toggle('on'); applyGoal(); };
document.getElementById('mg').onclick=function(){ this.classList.toggle('on'); applyGoal(); };
document.getElementById('dex').onclick=function(){ this.classList.toggle('on'); applyGoal(); };
function setTarget(){
  var k=read('k');
  if(k==null) return;
  var g=k<3.5?4.0:Math.round(k*10)/10;
  document.getElementById('target').value=String(g);
}
var q=new URLSearchParams(location.search);
if(q.get('k')) document.getElementById('k').value=q.get('k');
setTarget();
applyGoal();
window.addEventListener('resize', paint);
</script>
</body>
</html>
