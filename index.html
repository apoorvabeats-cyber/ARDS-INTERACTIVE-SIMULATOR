ility:.88,pvr:4.6,tamponade:0,ptx:0,lungInjury:.22,bronchospasm:0,anaphylaxis:0,sepsis:0,ischemia:.2,pulmonaryEdema:0,temp:36.8,hb:10.6,lactate:4.8,ph:7.26,uo:7,stemi:!1}),correct:{shock:`obstructive`,etiology:`obstructive_pe`},etiologies:[{id:`obstructive_pe`,label:`Obstructive — massive PE`},{id:`obstructive_tamponade`,label:`Tamponade`},{id:`cardiogenic_stemi`,label:`Inferior STEMI`},{id:`septic_pneumonia`,label:`Septic shock`},{id:`obstructive_ptx`,label:`Tension pneumothorax`}],pearls:[`Clear lungs, sudden RV failure, post-op — think PE before you think pneumonia.`,`Unstable massive PE is a lytic (or catheter) problem, not a CT problem.`,`Norepinephrine supports the RV. Huge fluid boluses overdistend it.`],keyActions:[{id:`thrombolysis`,label:`Systemic thrombolysis`,required:!0},{id:`norepi`,label:`Hemodynamic support`,required:!1}],harmful:[{id:`pericardiocentesis`,label:`Blind pericardiocentesis`},{id:`ct`,label:`Unstable trip to CT`},{id:`chest_tube`,label:`Chest tube without PTX`}],findings:{cbc:`Hb 10.5. WBC 10. Plt 190.`,chem:`Cr 0.9. Troponin pending.`,abg:`7.31 / 24 / 52 on NRB — hypoxemia plus dead-space hypocapnia.`,lactate:`4.9 mmol/L.`,troponin:`0.31 — RV strain, not a coronary occlusion pattern.`,bnp:`420.`,coag:`INR 1.1. On prophylactic heparin only.`,cultures:`Not first-line.`,ecg:`Sinus tach 132. S1Q3T3, T-wave inversion V1–V3. Incomplete RBBB. No ST elevation.`,cxr:`Clear. No consolidation, no pneumothorax. Oligemic left lung if you look twice.`,echo:`Dilated hypokinetic RV, septal D-sign, underfilled LV. No effusion. McConnell-type apical sparing.`}},{id:`tamponade`,bed:`Bay 3`,title:`Day 2 post-CABG`,complaint:`Rising CVP, quiet chest`,ageSex:`71M`,difficulty:`fellow`,minutesInBay:18,stem:[`Uneventful triple bypass yesterday. Overnight the chest tubes slowed. This morning he is restless, oliguric, and the CVP is 22.`,`The PACU note said the heart was 'dry.' Now nobody can hear it. Systolics are drifting through the 80s.`],exam:[`Cool. Muffled tern`,minutesInBay:3,stem:[`Admitted for pyelo, first dose of cefepime hanging. Three minutes later she claws at her throat, wheezes, and the systolic vanishes.`,`A lanyard allergy card in her bag says 'penicillin — hives.' Nobody scanned it.`],exam:[`Urticaria over the chest. Lip swelling. Diffuse wheeze. Warm then suddenly mottled. HR 140, BP 62/34, SpO2 84%.`],phys:Wt({volume:4.2,bleedRate:0,vasoplegia:.88,contractility:.95,pvr:1.1,tamponade:0,ptx:0,lungInjury:.1,bronchospasm:.7,anaphylaxis:.9,sepsis:.15,ischemia:.05,pulmonaryEdema:0,temp:37,hb:12.4,lactate:3.2,ph:7.3,uo:12,stemi:!1}),correct:{shock:`distributive`,etiology:`anaphylaxis`},etiologies:[{id:`anaphylaxis`,label:`Anaphylactic shock`},{id:`septic_pneumonia`,label:`Septic shock`},{id:`obstructive_pe`,label:`PE`},{id:`cardiogenic_stemi`,label:`Kounis / cardiogenic`},{id:`obstructive_ptx`,label:`Tension pneumothorax`}],pearls:[`Intramuscular epinephrine is the first drug, not a second antihistamine.`,`This is distributive plus airway. Fluids help; the alpha and beta of epinephrine treat both.`,`Stop the infusion. Everything else is secondary.`],keyActions:[{id:`im_epi`,label:`Epinephrine`,required:!0},{id:`crystalloid_1000`,label:`Fluids`,required:!1}],harmful:[{id:`metoprolol`,label:`Beta blockade`},{id:`thrombolysis`,label:`Lytics`}],findings:{cbc:`WBC 11. Hb 12.4. (Tryptase later.)`,chem:`Normal Cr. Glucose 118.`,abg:`7.32 / 30 / 58 with wheeze.`,lactate:`3.3 mmol/L.`,troponin:`0.01.`,bnp:`50.`,coag:`INR 1.0.`,cultures:`Already cooking from the pyelo workup.`,ecg:`Sinus tach. No ST change.`,cxr:`Hyperinflation, no infiltrate, no pneumothorax.`,echo:`Hyperdynamic, underfilled, no obstruction, no effusion.`}},{id:`ards`,bed:`Bay 8`,title:`Week of fever, now the lung`,complaint:`Severe viral ARDS`,ageSex:`44F`,difficulty:`resident`,minutesInBay:40,stem:[`Ten days of fever, myalgia, then a day of drowning at rest. She was intubated an hour ago for sats in the 70s on a non-rebreather.`,`The night team left v
