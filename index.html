<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Critical Care Interactive Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --fg:#f4f0e6; --muted:#b7b2a6; --faint:#8d887e;
  --line:rgba(244,240,230,.16); --learn:#12181c; --practice:#1b1511;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{display:block;padding:14px 16px 2px}
.brand{font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:520;letter-spacing:-.03em;margin:0;line-height:1}
header input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:10px 0 8px;font-size:16px;
}
header input::placeholder{color:var(--faint)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:4px;padding:8px 8px 0}
.rail{display:flex;flex-direction:column;justify-content:space-between;padding:8px 0 12px}
.rail button{
  background:none;border:0;text-align:left;color:var(--faint);font-size:13px;padding:0;min-height:44px;
}
.rail button.on{color:var(--fg)}
.well{perspective:1100px;display:flex;align-items:center;justify-content:center;min-height:0}
.figure{
  position:relative;height:100%;max-height:100%;aspect-ratio:1008/1792;width:auto;max-width:100%;
  transform-style:preserve-3d;
}
.figure.sway{animation:sway 10s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-8deg)}50%{transform:rotateY(8deg)}}
.figure img{width:100%;height:100%;display:block;object-fit:fill;border-radius:28px;pointer-events:none;user-select:none}
.hot{
  position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border:0;border-radius:999px;background:transparent;padding:0;
}
.hot i{
  position:absolute;inset:12px;border-radius:inherit;border:1.5px solid rgba(244,240,230,.72);
  box-shadow:0 0 0 6px rgba(12,13,16,.25);
}
.hot.on i{inset:6px;background:rgba(244,240,230,.16);box-shadow:0 0 22px rgba(244,240,230,.45)}
.chambers{display:none;min-height:0;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
body.picked .chambers{display:grid;height:46dvh}
body.picked .stage{flex:1}
.half{min-width:0;overflow:auto;padding:12px 12px 18px}
.half.learn{background:linear-gradient(180deg,var(--learn),var(--bg))}
.half.practice{background:linear-gradient(180deg,var(--practice),var(--bg));border-left:1px solid var(--line)}
.kicker{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.organ-name{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:520;letter-spacing:-.03em;margin:2px 0 8px;line-height:1}
.half.practice .organ-name{font-size:0;margin:0}
.card{
  display:block;text-decoration:none;padding:11px 0;border-top:1px solid var(--line);min-height:44px;
}
.card b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.card span{display:block;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.35}
.empty{color:var(--muted);font-size:14px;line-height:1.45;margin:8px 0 0}
.results{display:none;padding:8px 14px 20px}
.invite{display:none;max-width:16rem;color:var(--muted);font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:520;letter-spacing:-.03em;line-height:1.15}
body.searching .stage,body.searching .chambers{display:none}
body.searching .results{display:block}
.group{margin:14px 0}
.group h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;margin:0 0 4px}
@media(min-width:900px){
  body{display:grid;grid-template-columns:minmax(320px,46vw) minmax(0,1fr);grid-template-rows:auto 1fr}
  header{grid-column:1/-1;display:flex;align-items:flex-end;gap:24px}
  .brand{white-space:nowrap}
  header input{flex:1}
  body:not(.picked) .chambers{display:grid;place-items:center;padding:32px}
  body:not(.picked) .invite{display:block}
  body.picked .chambers{display:grid;height:auto;border-top:0;border-left:1px solid var(--line)}
  .stage{padding-bottom:16px}
}
@media(prefers-reduced-motion:reduce){
  .figure.sway{animation:none}
}
</style>
</head>
<body>
<header>
  <h1 class="brand">Critical Care</h1>
  <input id="find" type="search" enterkeyhint="search" placeholder="Find a simulator" aria-label="Find a simulator">
</header>
<div class="stage">
  <nav class="rail" id="rail" aria-label="Organs"></nav>
  <div class="well">
    <div class="figure sway" id="figure">
      <img src="anatomy-body.jpg" alt="Translucent anatomical model. Brain, thyroid, lungs, heart, liver, stomach, spleen and kidneys are visible.">
    </div>
  </div>
</div>
<section class="chambers" id="chambers" aria-live="polite"><p class="invite">Tap an organ. Learn and practice open on either side of the same cut.</p></section>
<section class="results" id="results"></section>
<script>
const ORGANS = [
  {
    id:"brain", name:"Brain", kicker:"Neurocritical care",
    spots:[{x:50,y:11.2}],
    learn:[
      ["Acute ischemic stroke","Assessment, NIHSS, imaging, thrombolysis and EVT.","Acute_Ischemic_Stroke_Simulator_V6_FINAL.html?v=20260925s"],
      ["Traumatic brain injury","GCS, CT, reversal, ICP tiers and surgery.","TBI_Interactive_Simulator_v5_ICP_Anisocoria.html?v=20260925s"],
      ["Intracerebral hemorrhage","Blood pressure, reversal and the ICP pathway.","Intracerebral_Hemorrhage_Interactive_Simulator_v1.html?v=20260925s"],
      ["Subarachnoid hemorrhage","Grading, the aneurysm and the day-one bundle.","Subarachnoid_Hemorrhage_Interactive_Simulator_v1.html?v=20260925s"],
      ["Status epilepticus","Benzodiazepine, second-line drug, then refractory care.","Status_Epilepticus_Interactive_Simulator_v2_EDITABLE.html?v=20260925s"],
      ["CNS infection","Meningitis, encephalitis, abscess and the ICU complications.","CNS_Infection_Interactive_Algorithm_v7.html?v=20260925s"]
    ],
    practice:[
      ["Neurology Practice Simulator","Stroke and subarachnoid hemorrhage. Click the finding on the study, then choose the next move.","Practice_Simulator.html?focus=neuro&v=20261014e"]
    ]
  },
  {
    id:"thyroid", name:"Thyroid", kicker:"Endocrine critical care",
    spots:[{x:50,y:28.9}],
    learn:[
      ["DKA","Fluids, potassium, insulin and dextrose across four bedside cases.","DKA_Interactive_Simulator.html?v=20260925s"],
      ["DKA and HHS","Holds insulin when potassium is under 3.3, and does not stop it when the glucose falls.","DKA_HHS_Resuscitation_Engine.html?v=20260925n"]
    ],
    practice:[]
  },
  {
    id:"lungs", name:"Lungs", kicker:"Respiratory critical care",
    spots:[{x:39,y:42},{x:63,y:42}],
    learn:[
      ["Ventilator waveforms","Pressure, flow and volume. Name the pattern.","Ventilator_Waveform_Troubleshooting.html?v=20260925s"],
      ["Hypoxic patient","Oxygen, HFNC, NIV and the reason for the failure.","Hypoxic_Patient_Respiratory_Critical_Care_Simulator_v22.html?v=20260925s"],
      ["ARDS ventilator","PEEP, prone position, driving pressure and rescue.","ARDS_Active_Simulator.html?v=20260925s"],
      ["COPD and asthma","Bronchodilator, the ventilator and the ICU pathway.","COPD_Asthma_V11_CASE_DRIVEN_CHECKED.html?v=20260925s"],
      ["COPD versus ARDS","An atlas of the two patterns.","COPD_vs_ARDS_Interactive_Atlas_NATIVE.html?v=20260925s"],
      ["ABG photo","Photograph a report. The six-step reading is done for you.","ABG_Photo_Interpreter_Simulator.html?v=20260925s"]
    ],
    practice:[
      ["Respiratory Practice Simulator","ARDS. Click the opacity, name the severity, then set the tidal volume.","Practice_Simulator.html?focus=lungs&v=20261014e"]
    ]
  },
  {
    id:"heart", name:"Heart", kicker:"Cardiac and shock",
    spots:[{x:55,y:44.5}],
    learn:[
      ["ACLS, 2025 AHA","Arrest, tachycardia and bradycardia, with the current doses.","ACLS_Interactive_Simulator_2025_AHA_v2.html?v=20260925s"],
      ["Cardiac rhythm","A moving ECG, the arrest and the reversible causes.","Cardiac_Rhythm_Decision_Simulator_V29_FINAL_AUDITED.html?v=20260925t"],
      ["Shock bay","Phenotypes of shock, and a ventilator you control.","Shock_Bay.html?v=20260925s"],
      ["Shock and POCUS","RUSH exam, ScvO2 and lactate.","Shock_POCUS_RUSH_Simulator.html?v=20260925l"],
      ["Shock identification","MAP, cardiac index and the phenotype.","Shock_Identification_Management_Simulator.html?v=20260925s"],
      ["Shock telemetry","Arterial line, IVC, PPV and the vasopressor.","Shock_Telemetry_POCUS_Simulator.html?v=20261001a"]
    ],
    practice:[
      ["Shock Practice Simulator","Septic shock. The small ventricle, the full IVC, then norepinephrine.","Practice_Simulator.html?focus=circulation&v=20261014e"]
    ]
  },
  {
    id:"liver", name:"Liver", kicker:"Hepatic critical care",
    spots:[{x:40,y:55}],
    learn:[],
    practice:[]
  },
  {
    id:"stomach", name:"Stomach", kicker:"GI critical care",
    spots:[{x:54,y:59.5}],
    learn:[
      ["Acute pancreatitis","Diagnosis, fluids, cause, and the step-up approach.","Acute_Pancreatitis_Simulator.html?v=20260926s"]
    ],
    practice:[]
  },
  {
    id:"spleen", name:"Spleen", kicker:"Infection",
    spots:[{x:66,y:54}],
    learn:[
      ["Antibiotics","The culture, the resistance, and the toxicity that changes the choice.","Antibiotic_Simulator.html?v=20260928e"],
      ["IDSA selection","KPC, OXA-48, NDM, and the dose that follows the clearance.","IDSA_Antibiotic_Selection_Simulator.html?v=20260928g"],
      ["Antifungal resistance","C. auris, Mucorales, and the site the drug does not reach.","Antifungal_Resistance_Simulator.html?v=20260925s"]
    ],
    practice:[]
  },
  {
    id:"kidneys", name:"Kidneys", kicker:"Electrolytes",
    spots:[{x:40,y:64},{x:60,y:64}],
    learn:[
      ["Electrolytes","Sodium, potassium, calcium, magnesium and phosphate. Calcium starts from the serum value and the albumin.","Electrolyte_Disorders_Interactive_Simulator.html?v=20261014d"]
    ],
    practice:[]
  }
];

const figure = document.getElementById("figure");
const rail = document.getElementById("rail");
const chambers = document.getElementById("chambers");
const results = document.getElementById("results");
const find = document.getElementById("find");
let current = null;
let dragging = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}
function cards(list){
  if(!list.length) return '<p class="empty">Nothing on this shelf yet.</p>';
  return list.map(function(row){
    return '<a class="card" href="'+esc(row[2])+'"><b>'+esc(row[0])+'</b><span>'+esc(row[1])+'</span></a>';
  }).join("");
}
function selectOrgan(id){
  const organ = ORGANS.find(function(item){ return item.id===id; });
  if(!organ) return;
  current = id;
  document.body.classList.add("picked");
  figure.classList.remove("sway");
  figure.querySelectorAll(".hot").forEach(function(btn){
    btn.classList.toggle("on", btn.getAttribute("data-id")===id);
  });
  rail.querySelectorAll("button").forEach(function(btn){
    btn.classList.toggle("on", btn.getAttribute("data-id")===id);
    if(btn.getAttribute("data-id")===id) btn.setAttribute("aria-current","true");
    else btn.removeAttribute("aria-current");
  });
  chambers.innerHTML =
    '<div class="half learn"><p class="kicker">Learn</p><h2 class="organ-name">'+esc(organ.name)+'</h2><p class="kicker">'+esc(organ.kicker)+'</p>'+cards(organ.learn)+'</div>'+
    '<div class="half practice"><p class="kicker">Practice</p><h2 class="organ-name">'+esc(organ.name)+'</h2><p class="kicker">'+esc(organ.kicker)+'</p>'+cards(organ.practice)+'</div>';
  if(window.matchMedia("(max-width:899px)").matches){
    chambers.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
}
function paint(){
  rail.innerHTML = ORGANS.map(function(organ){
    return '<button type="button" data-id="'+organ.id+'">'+esc(organ.name)+'</button>';
  }).join("");
  const spots = [];
  ORGANS.forEach(function(organ){
    organ.spots.forEach(function(spot){
      spots.push('<button type="button" class="hot" data-id="'+organ.id+'" style="left:'+spot.x+'%;top:'+spot.y+'%" aria-label="'+esc(organ.name)+'"><i></i></button>');
    });
  });
  figure.insertAdjacentHTML("beforeend", spots.join(""));
  document.querySelectorAll("[data-id]").forEach(function(btn){
    btn.addEventListener("click", function(){ selectOrgan(btn.getAttribute("data-id")); });
  });
}
function search(){
  const words = find.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  document.body.classList.toggle("searching", words.length>0);
  if(!words.length){ results.innerHTML=""; return; }
  const html = ORGANS.map(function(organ){
    const rows = organ.learn.concat(organ.practice).filter(function(row){
      const hay = (organ.name+" "+organ.kicker+" "+row[0]+" "+row[1]+" "+row[2]).toLowerCase();
      return words.every(function(word){ return hay.indexOf(word)!==-1; });
    });
    if(!rows.length) return "";
    return '<div class="group"><h2>'+esc(organ.name)+'</h2>'+cards(rows)+'</div>';
  }).join("");
  results.innerHTML = html || '<p class="empty">No simulator matches that.</p>';
}
figure.addEventListener("pointerdown", function(event){
  if(event.target.closest(".hot")) return;
  dragging = {x:event.clientX, r:0};
  figure.classList.remove("sway");
  figure.setPointerCapture(event.pointerId);
});
figure.addEventListener("pointermove", function(event){
  if(!dragging) return;
  const next = Math.max(-16, Math.min(16, (event.clientX-dragging.x)/8));
  figure.style.transform = "rotateY("+next+"deg)";
});
figure.addEventListener("pointerup", function(){
  dragging = null;
  if(!current){
    figure.style.transform = "";
    figure.classList.add("sway");
  }
});
find.addEventListener("input", search);
paint();
</script>
</body>
</html>
