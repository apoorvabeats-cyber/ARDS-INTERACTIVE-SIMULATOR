<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Formulas</title>
<style>
:root{--bg:#05070c;--fg:#f3efe6;--muted:#b7b1a4;--line:rgba(243,239,230,.18);--cool:#7fd4e6;--warm:#e2b48a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Figtree,ui-sans-serif,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:#102028;border:1px solid var(--line);border-radius:999px;min-height:40px;padding:0 12px}
button.on{border-color:var(--warm);color:#fff8ee;background:#2a2118}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
header{padding:12px 14px 0}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:28px;letter-spacing:-.03em;margin:0}
.lede{margin:6px 0 0;color:var(--muted);line-height:1.4}
.mods,.list{display:flex;gap:8px;overflow:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
.mods button,.list button{flex:none;font-size:14px;text-align:left}
.card{margin:0 14px 18px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#0c141c}
.card h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.expr{margin:0 0 8px;color:var(--cool);font-size:17px;line-height:1.35}
.case{margin:0 0 10px;color:var(--muted);line-height:1.4}
label{display:block;margin:0 0 8px;color:var(--muted);font-size:14px}
input,select{display:block;width:100%;margin-top:4px;background:#071018;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.result{margin:8px 0;padding:10px;border-radius:12px;background:#101820;border:1px solid var(--line)}
.result b{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:26px;letter-spacing:-.03em}
.read{margin:6px 0 0;line-height:1.4}
.work{margin:6px 0 0;color:var(--warm);font-size:14px;line-height:1.4}
.key{margin:10px 0 0;padding:0;list-style:none}
.key li{margin:0 0 4px;line-height:1.35;font-size:14px}
.sect{margin:12px 0 0}
.sect b{display:block;color:var(--warm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
.sect p{margin:0;line-height:1.45}
</style>
</head>
<body>
<header>
  <h1>Formulas</h1>
  <p class="lede">Enter the values from the case, or your own. The result, the reading, and the abbreviations update together.</p>
</header>
<div class="mods" id="mods"></div>
<div class="list" id="list"></div>
<article class="card" id="card"></article>
<script>
const MODULES = [
  ["haem","Haemodynamics"],
  ["vent","Ventilation"],
  ["abg","Acid–base"],
  ["renal","Renal"],
  ["echo","Echo and neuro"],
  ["drug","Dosing"],
  ["crit","Criteria"]
];
function num(v){ const n = parseFloat(String(v).replace(",",".")); return Number.isFinite(n) ? n : null; }
function round(n, d){
  if(n==null || !Number.isFinite(n)) return "—";
  const p = Math.pow(10, d);
  return String(Math.round(n*p)/p);
}
function fio2(raw){
  if(raw==null) return null;
  if(raw > 1) return {v: raw/100, note:"FiO₂ was read as a percent and divided by 100."};
  return {v: raw, note:""};
}
const F = [
  {id:"map", mod:"haem", name:"Mean arterial pressure",
    expr:"MAP = (SBP + 2 × DBP) / 3",
    abbr:[["MAP","Mean arterial pressure"],["SBP","Systolic blood pressure"],["DBP","Diastolic blood pressure"]],
    case:"Blood pressure 88/52 mmHg in septic shock.",
    inputs:[["sbp","Systolic pressure","mmHg","88"],["dbp","Diastolic pressure","mmHg","52"]],
    run:function(v){
      const map = (v.sbp + 2*v.dbp)/3;
      return {value:round(map,1)+" mmHg", work:"("+v.sbp+" + 2 × "+v.dbp+") / 3",
        read: map<65 ? "Below 65 mmHg. That is under the usual first target in shock. The right target still depends on the patient." : "65 mmHg or higher. That meets the usual first target in shock. Perfusion still has to be checked at the bedside."};
    }},
  {id:"si", mod:"haem", name:"Shock index",
    expr:"Shock index = HR / SBP",
    abbr:[["HR","Heart rate"],["SBP","Systolic blood pressure"]],
    case:"Heart rate 128 beats/min, systolic pressure 84 mmHg.",
    inputs:[["hr","Heart rate","beats/min","128"],["sbp","Systolic pressure","mmHg","84"]],
    run:function(v){
      const si = v.hr/v.sbp;
      return {value:round(si,2), work:v.hr+" / "+v.sbp,
        read: si>=1 ? "1 or above. This is a marker of more severe shock. It is not a diagnosis." : si>=0.9 ? "Above 0.9. The index is raised." : "Under 0.9. A resting index is often nearer 0.5–0.7."};
    }},
  {id:"co", mod:"haem", name:"Cardiac output",
    expr:"Cardiac output = HR × SV",
    abbr:[["HR","Heart rate"],["SV","Stroke volume"],["CO","Cardiac output"]],
    case:"Heart rate 110 beats/min, stroke volume 42 mL.",
    inputs:[["hr","Heart rate","beats/min","110"],["sv","Stroke volume","mL","42"]],
    run:function(v){
      const co = v.hr*v.sv/1000;
      return {value:round(co,2)+" L/min", work:v.hr+" × "+v.sv+" mL / 1000",
        read: co<4 ? "Under 4 L/min. Resting output is often 4–8 L/min. A low output needs the stroke volume and the rate read separately." : co>8 ? "Above 8 L/min. Output can be high in a hyperdynamic circulation." : "Inside the usual resting range of about 4–8 L/min."};
    }},
  {id:"ci", mod:"haem", name:"Cardiac index",
    expr:"Cardiac index = CO / BSA. Cardiac output = heart rate × stroke volume. BSA (Mosteller) = √(height in cm × weight in kg / 3600).",
    abbr:[["CO","Cardiac output, heart rate × stroke volume, in L/min"],["BSA","Body surface area, Mosteller formula, in m²"],["CI","Cardiac index"]],
    case:"Heart rate 100 beats/min, stroke volume 36 mL, height 170 cm, weight 70 kg.",
    inputs:[["hr","Heart rate","beats/min","100"],["sv","Stroke volume","mL","36"],["ht","Height","cm","170"],["wt","Weight","kg","70"]],
    run:function(v){
      const co = v.hr*v.sv/1000;
      const bsa = Math.sqrt(v.ht*v.wt/3600);
      const ci = co/bsa;
      return {value:round(ci,2)+" L/min/m²", work:"CO "+round(co,2)+" L/min. BSA "+round(bsa,2)+" m². "+round(co,2)+" / "+round(bsa,2),
        read: ci<2.2 ? "Under 2.2 L/min/m². That is a low index." : ci>4 ? "Above 4 L/min/m². That is a high index." : "About 2.2–4 L/min/m² is a usual range."};
    }},
  {id:"svr", mod:"haem", name:"Systemic vascular resistance",
    expr:"SVR = (MAP − CVP) × 80 / CO. MAP = (SBP + 2 × DBP) / 3. Cardiac output = heart rate × stroke volume.",
    abbr:[["SVR","Systemic vascular resistance"],["MAP","Mean arterial pressure"],["CVP","Central venous pressure"],["CO","Cardiac output, in L/min"]],
    case:"Blood pressure 88/50 mmHg, CVP 14 mmHg, heart rate 120 beats/min, stroke volume 70 mL.",
    inputs:[["sbp","Systolic pressure","mmHg","88"],["dbp","Diastolic pressure","mmHg","50"],["cvp","Central venous pressure","mmHg","14"],["hr","Heart rate","beats/min","120"],["sv","Stroke volume","mL","70"]],
    run:function(v){
      const map = (v.sbp+2*v.dbp)/3;
      const co = v.hr*v.sv/1000;
      const svr = (map-v.cvp)*80/co;
      return {value:round(svr,0)+" dyn·s·cm⁻⁵", work:"MAP "+round(map,1)+". CO "+round(co,2)+" L/min. ("+round(map,1)+" − "+v.cvp+") × 80 / "+round(co,2),
        read:(svr<800?"Under 800. Resistance is low, as in a distributive circulation. ":"")+ (svr>1200?"Above 1200. Resistance is high. ":"")+ (svr>=800 && svr<=1200?"Inside a usual range of about 800–1200. ":"")+"The ×80 factor is what puts the result in dyn·s·cm⁻⁵."};
    }},
  {id:"pvr", mod:"haem", name:"Pulmonary vascular resistance",
    expr:"PVR = (mPAP − PAWP) × 80 / CO. Cardiac output = heart rate × stroke volume.",
    abbr:[["PVR","Pulmonary vascular resistance"],["mPAP","Mean pulmonary artery pressure"],["PAWP","Pulmonary artery wedge pressure"],["CO","Cardiac output, in L/min"]],
    case:"Mean pulmonary artery pressure 38 mmHg, wedge pressure 12 mmHg, heart rate 90 beats/min, stroke volume 47 mL.",
    inputs:[["mpap","Mean pulmonary artery pressure","mmHg","38"],["pawp","Wedge pressure","mmHg","12"],["hr","Heart rate","beats/min","90"],["sv","Stroke volume","mL","47"]],
    run:function(v){
      const co = v.hr*v.sv/1000;
      const pvr = (v.mpap-v.pawp)*80/co;
      return {value:round(pvr,0)+" dyn·s·cm⁻⁵", work:"CO "+round(co,2)+" L/min. ("+v.mpap+" − "+v.pawp+") × 80 / "+round(co,2),
        read: pvr>240 ? "Above about 240 dyn·s·cm⁻⁵. Pulmonary vascular resistance is raised." : "About 240 dyn·s·cm⁻⁵ or less is a usual upper range with this formula."};
    }},
  {id:"cpo", mod:"haem", name:"Cardiac power output",
    expr:"CPO = MAP × CO / 451. MAP = (SBP + 2 × DBP) / 3. Cardiac output = heart rate × stroke volume.",
    abbr:[["CPO","Cardiac power output"],["MAP","Mean arterial pressure"],["CO","Cardiac output"]],
    case:"Blood pressure 90/55 mmHg, heart rate 110 beats/min, stroke volume 28 mL, in cardiogenic shock.",
    inputs:[["sbp","Systolic pressure","mmHg","90"],["dbp","Diastolic pressure","mmHg","55"],["hr","Heart rate","beats/min","110"],["sv","Stroke volume","mL","28"]],
    run:function(v){
      const map = (v.sbp+2*v.dbp)/3;
      const co = v.hr*v.sv/1000;
      const cpo = map*co/451;
      return {value:round(cpo,2)+" W", work:"MAP "+round(map,1)+". CO "+round(co,2)+". "+round(map,1)+" × "+round(co,2)+" / 451",
        read: cpo<0.6 ? "Under 0.6 W. In cardiogenic shock this has been associated with higher mortality. It does not replace the clinical picture." : "0.6 W or higher. Higher cardiac power is more favourable in cardiogenic shock, still read with the whole picture."};
    }},
  {id:"do2", mod:"haem", name:"Oxygen delivery",
    expr:"DO₂ = CO × CaO₂ × 10. Cardiac output = heart rate × stroke volume. CaO₂ = (1.34 × Hb × SaO₂) + (0.003 × PaO₂).",
    abbr:[["DO₂","Oxygen delivery"],["CO","Cardiac output"],["CaO₂","Arterial oxygen content"],["Hb","Haemoglobin"],["SaO₂","Arterial oxygen saturation"]],
    case:"Heart rate 100 beats/min, stroke volume 45 mL, haemoglobin 8.2 g/dL, saturation 92%, PaO₂ 68 mmHg.",
    inputs:[["hr","Heart rate","beats/min","100"],["sv","Stroke volume","mL","45"],["hb","Haemoglobin","g/dL","8.2"],["sao2","Saturation","%","92"],["pao2","PaO₂","mmHg","68"]],
    run:function(v){
      const co = v.hr*v.sv/1000;
      const sat = v.sao2>1 ? v.sao2/100 : v.sao2;
      const cao2 = (1.34*v.hb*sat) + (0.003*v.pao2);
      const d = co*cao2*10;
      return {value:round(d,0)+" mL/min", work:"CO "+round(co,2)+" L/min. CaO₂ "+round(cao2,2)+" mL/dL. "+round(co,2)+" × "+round(cao2,2)+" × 10",
        read:"Resting delivery is often around 900–1100 mL/min. A low result is a low haemoglobin, a low saturation, a low output, or more than one of those."};
    }},
  {id:"cao2", mod:"haem", name:"Arterial oxygen content",
    expr:"CaO₂ = (1.34 × Hb × SaO₂) + (0.003 × PaO₂)",
    abbr:[["CaO₂","Arterial oxygen content"],["Hb","Haemoglobin"],["SaO₂","Arterial oxygen saturation"],["PaO₂","Arterial partial pressure of oxygen"]],
    case:"Haemoglobin 8.2 g/dL, saturation 92%, PaO₂ 68 mmHg.",
    inputs:[["hb","Haemoglobin","g/dL","8.2"],["sao2","Saturation","%","92"],["pao2","PaO₂","mmHg","68"]],
    run:function(v){
      const sat = v.sao2>1 ? v.sao2/100 : v.sao2;
      const c = (1.34*v.hb*sat) + (0.003*v.pao2);
      return {value:round(c,2)+" mL/dL", work:"(1.34 × "+v.hb+" × "+round(sat,2)+") + (0.003 × "+v.pao2+")",
        read:"Most of the oxygen is bound to haemoglobin. The dissolved part, 0.003 × PaO₂, is small unless the PaO₂ is very high. A usual content is about 16–22 mL/dL."};
    }},
  {id:"lac", mod:"haem", name:"Lactate clearance",
    expr:"Clearance (%) = (Initial − Repeat) / Initial × 100",
    abbr:[["Initial","First lactate"],["Repeat","Later lactate"]],
    case:"Lactate falls from 6.4 mmol/L to 4.8 mmol/L.",
    inputs:[["a","Initial lactate","mmol/L","6.4"],["b","Repeat lactate","mmol/L","4.8"]],
    run:function(v){
      const c = (v.a-v.b)/v.a*100;
      return {value:round(c,1)+"%", work:"("+v.a+" − "+v.b+") / "+v.a+" × 100",
        read: c<0 ? "The lactate has risen. Clearance is negative. That is more concerning than the percentage." : c>=10 ? "A fall of 10% or more is a commonly used early resuscitation mark. The cause of the lactate still has to be treated." : "The fall is under 10%. Clearance is limited so far."};
    }},
  {id:"pf", mod:"vent", name:"P/F ratio",
    expr:"P/F = PaO₂ / FiO₂",
    abbr:[["PaO₂","Arterial partial pressure of oxygen"],["FiO₂","Fraction of inspired oxygen"],["P/F","PaO₂ to FiO₂ ratio"]],
    case:"PaO₂ 104 mmHg on FiO₂ 0.80, PEEP 10 cmH₂O.",
    inputs:[["pao2","PaO₂","mmHg","104"],["fio2","FiO₂","fraction","0.8"]],
    run:function(v){
      const f = fio2(v.fio2);
      const pf = v.pao2/f.v;
      let band = "Above 300. This is not in the ARDS bands.";
      if(pf<=100) band = "100 or below: severe band of the Berlin definition, if the other criteria and a PEEP of at least 5 cmH₂O are met.";
      else if(pf<=200) band = "200 or below: moderate band, if the other Berlin criteria are met.";
      else if(pf<=300) band = "300 or below: mild band, if the other Berlin criteria are met.";
      return {value:round(pf,0), work:v.pao2+" / "+round(f.v,2), note:f.note, read:band};
    }},
  {id:"rox", mod:"vent", name:"ROX index",
    expr:"ROX = (SpO₂ / FiO₂) / RR",
    abbr:[["ROX","Respiratory rate–oxygenation index"],["SpO₂","Pulse oximeter saturation"],["FiO₂","Fraction of inspired oxygen"],["RR","Respiratory rate"]],
    case:"Saturation 92% on FiO₂ 0.70, respiratory rate 32/min, on high-flow oxygen.",
    inputs:[["spo2","Saturation","%","92"],["fio2","FiO₂","fraction","0.7"],["rr","Respiratory rate","breaths/min","32"]],
    run:function(v){
      const f = fio2(v.fio2);
      const rox = (v.spo2/f.v)/v.rr;
      return {value:round(rox,2), work:"("+v.spo2+" / "+round(f.v,2)+") / "+v.rr, note:f.note,
        read: rox<3.85 ? "Below about 3.85. On high-flow nasal oxygen this has been associated with a higher chance of intubation. It is a trend, not a rule." : rox>4.88 ? "Above about 4.88. On high-flow nasal oxygen this has been a more reassuring range in the same studies." : "Between about 3.85 and 4.88. Repeat it. A single number is not a decision."};
    }},
  {id:"dp", mod:"vent", name:"Driving pressure",
    expr:"Driving pressure = Pplat − PEEP",
    abbr:[["Pplat","Plateau pressure"],["PEEP","Positive end-expiratory pressure"]],
    case:"Plateau pressure 28 cmH₂O, PEEP 10 cmH₂O.",
    inputs:[["pplat","Plateau pressure","cmH₂O","28"],["peep","PEEP","cmH₂O","10"]],
    run:function(v){
      const d = v.pplat-v.peep;
      return {value:round(d,1)+" cmH₂O", work:v.pplat+" − "+v.peep,
        read: d>=15 ? "15 cmH₂O or more. In ARDS a driving pressure under 15 is a common lung-protective target. It is not a guarantee." : "Under 15 cmH₂O. That meets the common ARDS target."};
    }},
  {id:"cstat", mod:"vent", name:"Static compliance",
    expr:"Static compliance = VT / (Pplat − PEEP)",
    abbr:[["VT","Tidal volume"],["Pplat","Plateau pressure"],["PEEP","Positive end-expiratory pressure"]],
    case:"Tidal volume 420 mL, plateau 26 cmH₂O, PEEP 10 cmH₂O.",
    inputs:[["vt","Tidal volume","mL","420"],["pplat","Plateau pressure","cmH₂O","26"],["peep","PEEP","cmH₂O","10"]],
    run:function(v){
      const d = v.pplat-v.peep;
      const c = v.vt/d;
      return {value:round(c,1)+" mL/cmH₂O", work:v.vt+" / ("+v.pplat+" − "+v.peep+")",
        read: c<50 ? "Under about 50 mL/cmH₂O. The respiratory system is stiff." : "About 50–100 mL/cmH₂O is a usual range for a ventilated lung."};
    }},
  {id:"cdyn", mod:"vent", name:"Dynamic compliance",
    expr:"Dynamic compliance = VT / (PIP − PEEP)",
    abbr:[["VT","Tidal volume"],["PIP","Peak inspiratory pressure"],["PEEP","Positive end-expiratory pressure"]],
    case:"Tidal volume 420 mL, peak pressure 34 cmH₂O, PEEP 10 cmH₂O.",
    inputs:[["vt","Tidal volume","mL","420"],["pip","Peak pressure","cmH₂O","34"],["peep","PEEP","cmH₂O","10"]],
    run:function(v){
      const c = v.vt/(v.pip-v.peep);
      return {value:round(c,1)+" mL/cmH₂O", work:v.vt+" / ("+v.pip+" − "+v.peep+")",
        read:"Dynamic compliance includes airway resistance, so it is lower than the static compliance when the airway is narrow. A large gap between peak and plateau points to resistance."};
    }},
  {id:"vd", mod:"vent", name:"Dead-space fraction",
    expr:"Dead-space fraction = (PaCO₂ − PECO₂) / PaCO₂",
    abbr:[["PaCO₂","Arterial partial pressure of carbon dioxide"],["PECO₂","Mixed expired carbon dioxide"]],
    case:"PaCO₂ 48 mmHg, mixed expired CO₂ 22 mmHg.",
    inputs:[["paco2","PaCO₂","mmHg","48"],["peco2","Mixed expired CO₂","mmHg","22"]],
    run:function(v){
      const d = (v.paco2-v.peco2)/v.paco2;
      return {value:round(d,2), work:"("+v.paco2+" − "+v.peco2+") / "+v.paco2,
        read: d>0.6 ? "Above 0.6. Dead space is high. In ARDS this has been associated with worse outcome." : "A usual fraction is nearer 0.2–0.35. This uses mixed expired CO₂, not end-tidal CO₂."};
    }},
  {id:"rsbi", mod:"vent", name:"Rapid shallow breathing index",
    expr:"RSBI = RR / VT, with VT in litres",
    abbr:[["RSBI","Rapid shallow breathing index"],["RR","Respiratory rate"],["VT","Tidal volume"]],
    case:"Respiratory rate 28/min, tidal volume 0.32 L, on a spontaneous trial.",
    inputs:[["rr","Respiratory rate","breaths/min","28"],["vt","Tidal volume","L","0.32"]],
    run:function(v){
      let vt = v.vt, note = "";
      if(vt>5){ vt = vt/1000; note = "Tidal volume above 5 was read as millilitres and converted to litres."; }
      const r = v.rr/vt;
      return {value:round(r,0)+" breaths/min/L", work:v.rr+" / "+round(vt,3)+" L", note:note,
        read: r<105 ? "Under 105 breaths/min/L. That was the original mark suggesting a spontaneous breathing trial is more likely to succeed. The trial itself still decides." : "105 or above. Breathing is rapid and shallow. The trial is less likely to succeed, and the number does not replace looking at the patient."};
    }},
  {id:"oi", mod:"vent", name:"Oxygenation index",
    expr:"Oxygenation index = FiO₂ × mean airway pressure × 100 / PaO₂",
    abbr:[["FiO₂","Fraction of inspired oxygen"],["MAP","Mean airway pressure, not blood pressure"],["PaO₂","Arterial partial pressure of oxygen"]],
    case:"FiO₂ 0.80, mean airway pressure 18 cmH₂O, PaO₂ 62 mmHg.",
    inputs:[["fio2","FiO₂","fraction","0.8"],["paw","Mean airway pressure","cmH₂O","18"],["pao2","PaO₂","mmHg","62"]],
    run:function(v){
      const f = fio2(v.fio2);
      const oi = f.v*v.paw*100/v.pao2;
      return {value:round(oi,1), work:round(f.v,2)+" × "+v.paw+" × 100 / "+v.pao2, note:f.note,
        read:"A higher index means worse oxygenation. The pressure in this formula is mean airway pressure, not the arterial mean. In paediatric practice, values above about 25–40 mark severe disease. Adult cut-offs are less fixed."};
    }},
  {id:"ag", mod:"abg", name:"Anion gap",
    expr:"Anion gap = Na − (Cl + HCO₃)",
    abbr:[["Na","Sodium"],["Cl","Chloride"],["HCO₃","Bicarbonate"],["AG","Anion gap"]],
    case:"Sodium 138, chloride 100, bicarbonate 12 mmol/L. Lactate is 6 mmol/L.",
    inputs:[["na","Sodium","mmol/L","138"],["cl","Chloride","mmol/L","100"],["hco3","Bicarbonate","mmol/L","12"]],
    run:function(v){
      const ag = v.na-(v.cl+v.hco3);
      return {value:round(ag,1)+" mmol/L", work:v.na+" − ("+v.cl+" + "+v.hco3+")",
        read: ag>12 ? "Above 12 mmol/L. The gap is raised if albumin is normal. Pair it with the pH before calling it a high-gap acidosis." : "12 mmol/L or less. The gap is not raised. A normal gap does not exclude a hyperchloraemic acidosis."};
    }},
  {id:"cag", mod:"abg", name:"Corrected anion gap",
    expr:"Anion gap = Na − (Cl + HCO₃). Corrected AG = AG + 2.5 × (4 − albumin).",
    abbr:[["AG","Anion gap"],["Na","Sodium"],["Cl","Chloride"],["HCO₃","Bicarbonate"],["Albumin","Serum albumin, in g/dL"]],
    case:"Sodium 138, chloride 102, bicarbonate 16 mmol/L, albumin 2.0 g/dL.",
    inputs:[["na","Sodium","mmol/L","138"],["cl","Chloride","mmol/L","102"],["hco3","Bicarbonate","mmol/L","16"],["alb","Albumin","g/dL","2"]],
    run:function(v){
      let alb = v.alb, note = "";
      if(alb>10){ alb = alb/10; note = "Albumin above 10 was read as g/L and converted to g/dL."; }
      const ag = v.na-(v.cl+v.hco3);
      const c = ag + 2.5*(4-alb);
      return {value:round(c,1)+" mmol/L", work:"AG "+round(ag,1)+". "+round(ag,1)+" + 2.5 × (4 − "+round(alb,1)+")", note:note,
        read:"Albumin carries part of the negative charge. A low albumin hides a raised gap unless it is corrected. A corrected gap above 12 mmol/L is raised."};
    }},
  {id:"winter", mod:"abg", name:"Winter’s formula",
    expr:"Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2",
    abbr:[["PaCO₂","Arterial partial pressure of carbon dioxide"],["HCO₃","Bicarbonate"]],
    case:"Bicarbonate 12 mmol/L in a metabolic acidosis. Measured PaCO₂ is 28 mmHg.",
    inputs:[["hco3","Bicarbonate","mmol/L","12"],["paco2","Measured PaCO₂, optional","mmHg","28"]],
    run:function(v){
      const exp = 1.5*v.hco3+8;
      let read = "The expected carbon dioxide is "+round(exp-2,1)+" to "+round(exp+2,1)+" mmHg. This is the respiratory compensation for a metabolic acidosis.";
      if(v.paco2!=null){
        if(Math.abs(v.paco2-exp)<=2) read += " The measured PaCO₂ sits inside that range.";
        else if(v.paco2<exp-2) read += " The measured PaCO₂ is lower, so there is an added respiratory alkalosis.";
        else read += " The measured PaCO₂ is higher, so compensation is incomplete or there is an added respiratory acidosis.";
      }
      return {value:round(exp,1)+" ± 2 mmHg", work:"1.5 × "+v.hco3+" + 8", read:read};
    }},
  {id:"delta", mod:"abg", name:"Delta ratio",
    expr:"Anion gap = Na − (Cl + HCO₃). Delta ratio = (AG − 12) / (24 − HCO₃).",
    abbr:[["AG","Anion gap"],["Na","Sodium"],["Cl","Chloride"],["HCO₃","Bicarbonate"]],
    case:"Sodium 140, chloride 100, bicarbonate 10 mmol/L.",
    inputs:[["na","Sodium","mmol/L","140"],["cl","Chloride","mmol/L","100"],["hco3","Bicarbonate","mmol/L","10"]],
    run:function(v){
      const ag = v.na-(v.cl+v.hco3);
      const den = 24-v.hco3;
      if(Math.abs(den)<0.5) return {value:"—", work:"AG "+round(ag,1)+". (AG − 12) / (24 − "+v.hco3+")", read:"The bicarbonate is too close to 24 for this ratio."};
      const d = (ag-12)/den;
      let read = "Under 0.4 suggests a pure hyperchloraemic acidosis. 0.4–0.8 suggests a mixed high-gap and hyperchloraemic acidosis. 1–2 fits a high-gap acidosis. Above 2 suggests a coexisting metabolic alkalosis.";
      if(d<0.4) read = "Under 0.4. This pattern fits a hyperchloraemic metabolic acidosis more than a high-gap acidosis.";
      else if(d<0.8) read = "Between 0.4 and 0.8. A high-gap acidosis and a hyperchloraemic acidosis may both be present.";
      else if(d<=2) read = "Between 1 and 2. This fits a high-gap metabolic acidosis.";
      else read = "Above 2. A metabolic alkalosis may be sitting with the high-gap acidosis.";
      return {value:round(d,2), work:"AG "+round(ag,1)+". ("+round(ag,1)+" − 12) / (24 − "+v.hco3+")", read:read};
    }},
  {id:"osm", mod:"abg", name:"Calculated osmolality",
    expr:"Calculated osmolality = 2 × Na + glucose/18 + BUN/2.8",
    abbr:[["Na","Sodium"],["BUN","Blood urea nitrogen"],["Glucose","Plasma glucose, in mg/dL"]],
    case:"Sodium 142 mmol/L, glucose 180 mg/dL, BUN 28 mg/dL. Measured osmolality 318 mOsm/kg.",
    inputs:[["na","Sodium","mmol/L","142"],["glu","Glucose","mg/dL","180"],["bun","BUN","mg/dL","28"],["meas","Measured osmolality, optional","mOsm/kg","318"]],
    run:function(v){
      const o = 2*v.na + v.glu/18 + v.bun/2.8;
      let read = "A usual calculated osmolality is about 275–295 mOsm/kg. Glucose and urea in this formula are in mg/dL, not mmol/L.";
      if(v.meas!=null){
        const gap = v.meas-o;
        read += " The osmolar gap is "+round(gap,1)+". A gap above 10 mOsm/kg suggests an unmeasured osmole, such as a toxic alcohol, if the assay and the units are right.";
      }
      return {value:round(o,1)+" mOsm/kg", work:"2 × "+v.na+" + "+v.glu+"/18 + "+v.bun+"/2.8", read:read};
    }},
  {id:"na", mod:"abg", name:"Corrected sodium",
    expr:"Corrected Na = measured Na + 1.6 × [(glucose − 100) / 100]",
    abbr:[["Na","Sodium"],["Glucose","Plasma glucose, in mg/dL"]],
    case:"Sodium 128 mmol/L, glucose 600 mg/dL.",
    inputs:[["na","Measured sodium","mmol/L","128"],["glu","Glucose","mg/dL","600"]],
    run:function(v){
      const c = v.na + 1.6*((v.glu-100)/100);
      return {value:round(c,1)+" mmol/L", work:v.na+" + 1.6 × [("+v.glu+" − 100) / 100]",
        read:"Hyperglycaemia draws water into the blood and lowers the measured sodium. This 1.6 correction is an estimate. Some use a larger factor. Recheck the sodium as the glucose falls."};
    }},
  {id:"crcl", mod:"renal", name:"Cockcroft–Gault creatinine clearance",
    expr:"CrCl = (140 − age) × weight / (72 × SCr), × 0.85 if female",
    abbr:[["CrCl","Creatinine clearance"],["SCr","Serum creatinine, in mg/dL"]],
    case:"A 72-year-old woman, weight 60 kg, creatinine 1.6 mg/dL, creatinine stable.",
    inputs:[["age","Age","years","72"],["wt","Weight","kg","60"],["scr","Creatinine","mg/dL","1.6"],["sex","Sex","","female"]],
    run:function(v){
      let scr = v.scr, note = "";
      if(scr>20){ scr = scr/88.4; note = "Creatinine above 20 was read as µmol/L and converted to mg/dL."; }
      let cr = (140-v.age)*v.wt/(72*scr);
      if(v.sex==="female") cr *= 0.85;
      return {value:round(cr,1)+" mL/min", work:"(140 − "+v.age+") × "+v.wt+" / (72 × "+round(scr,2)+")"+(v.sex==="female"?" × 0.85":""), note:note,
        read:"This estimates clearance from a stable creatinine. It is unreliable in acute kidney injury, and it is not the same as an eGFR. In obesity, ideal body weight is sometimes used instead of actual weight."};
    }},
  {id:"fena", mod:"renal", name:"Fractional excretion of sodium",
    expr:"FENa (%) = (UNa × PCr) / (PNa × UCr) × 100",
    abbr:[["FENa","Fractional excretion of sodium"],["UNa","Urine sodium"],["PNa","Plasma sodium"],["UCr","Urine creatinine"],["PCr","Plasma creatinine"]],
    case:"Urine sodium 12 mmol/L, plasma sodium 140, urine creatinine 140 mg/dL, plasma creatinine 2.0 mg/dL. No diuretic.",
    inputs:[["una","Urine sodium","mmol/L","12"],["pcr","Plasma creatinine","same unit as urine","2"],["pna","Plasma sodium","mmol/L","140"],["ucr","Urine creatinine","same unit as plasma","140"]],
    run:function(v){
      const fe = (v.una*v.pcr)/(v.pna*v.ucr)*100;
      return {value:round(fe,2)+"%", work:"("+v.una+" × "+v.pcr+") / ("+v.pna+" × "+v.ucr+") × 100",
        read: fe<1 ? "Under 1%. This suggests a prerenal state if the creatinine is rising and the patient is not on a diuretic. Contrast, rhabdomyolysis and chronic kidney disease break the rule." : fe>2 ? "Above 2%. This is more in keeping with tubular injury, with the same exceptions." : "Between 1% and 2%. The fraction is indeterminate."};
    }},
  {id:"feurea", mod:"renal", name:"Fractional excretion of urea",
    expr:"FEUrea (%) = (UUrea × PCr) / (PUrea × UCr) × 100",
    abbr:[["FEUrea","Fractional excretion of urea"],["UUrea","Urine urea"],["PUrea","Plasma urea"],["PCr","Plasma creatinine"],["UCr","Urine creatinine"]],
    case:"On a loop diuretic. Urine urea 420, plasma urea 48, urine creatinine 90, plasma creatinine 2.4, all in consistent units.",
    inputs:[["uu","Urine urea","same unit as plasma","420"],["pcr","Plasma creatinine","same unit as urine","2.4"],["pu","Plasma urea","same unit as urine","48"],["ucr","Urine creatinine","same unit as plasma","90"]],
    run:function(v){
      const fe = (v.uu*v.pcr)/(v.pu*v.ucr)*100;
      return {value:round(fe,1)+"%", work:"("+v.uu+" × "+v.pcr+") / ("+v.pu+" × "+v.ucr+") × 100",
        read: fe<35 ? "Under 35%. This supports a prerenal state and is more useful than the sodium fraction after a diuretic." : fe>50 ? "Above 50%. This is less specific for tubular injury." : "Between 35% and 50%. The result is indeterminate."};
    }},
  {id:"fwd", mod:"renal", name:"Free-water deficit",
    expr:"TBW = 0.6 × weight in men, or 0.5 × weight in women. Free-water deficit = TBW × [(Na / 140) − 1].",
    abbr:[["TBW","Total body water"],["Na","Serum sodium"]],
    case:"A man, weight 70 kg, sodium 158 mmol/L.",
    inputs:[["wt","Weight","kg","70"],["sex","Sex","","male"],["na","Sodium","mmol/L","158"]],
    run:function(v){
      const frac = v.sex==="female" ? 0.5 : 0.6;
      const tbw = frac*v.wt;
      const d = tbw*((v.na/140)-1);
      return {value:round(d,2)+" L", work:"TBW "+round(tbw,1)+" L ("+frac+" × "+v.wt+"). "+round(tbw,1)+" × [("+v.na+"/140) − 1]",
        read: d>0 ? "This is the estimated free-water deficit in hypernatraemia. Replace it slowly and recheck the sodium. It is not a fixed prescription." : "The sodium is under 140, so this is a free-water excess rather than a deficit."};
    }},
  {id:"urr", mod:"renal", name:"Urea reduction ratio",
    expr:"URR (%) = (Pre − Post) / Pre × 100",
    abbr:[["URR","Urea reduction ratio"],["Pre","Urea before dialysis"],["Post","Urea after dialysis"]],
    case:"Urea 140 before dialysis and 42 after, in the same units.",
    inputs:[["pre","Urea before dialysis","same unit","140"],["post","Urea after dialysis","same unit","42"]],
    run:function(v){
      const u = (v.pre-v.post)/v.pre*100;
      return {value:round(u,1)+"%", work:"("+v.pre+" − "+v.post+") / "+v.pre+" × 100",
        read: u>=65 ? "65% or more. That is a commonly used adequacy target for a haemodialysis session. Kt/V is the paired measure." : "Under 65%. For thrice-weekly haemodialysis this is below the usual urea-reduction target."};
    }},
  {id:"ktv", mod:"renal", name:"Kt/V",
    expr:"Kt/V = −ln(R) + (4 − 3.5 × R) × UF / W",
    abbr:[["Kt/V","Dialyser clearance × time / volume"],["R","Post-dialysis urea / pre-dialysis urea"],["UF","Ultrafiltration volume"],["W","Post-dialysis weight"]],
    case:"Urea 140 before and 42 after. Fluid removed 2.5 L. Post-dialysis weight 70 kg.",
    inputs:[["pre","Urea before","same unit","140"],["post","Urea after","same unit","42"],["uf","Ultrafiltration","L","2.5"],["w","Weight after dialysis","kg","70"]],
    run:function(v){
      const R = v.post/v.pre;
      if(!(R>0 && R<1.2)) return {value:"—", work:"R = "+v.post+" / "+v.pre, read:"R must be the post-dialysis urea divided by the pre-dialysis urea, and the post value should be lower."};
      const k = -Math.log(R) + (4 - 3.5*R)*(v.uf/v.w);
      return {value:round(k,2), work:"R = "+round(R,3)+". −ln(R) + (4 − 3.5 × R) × "+v.uf+" / "+v.w,
        read: k>=1.2 ? "1.2 or more. That is a usual single-pool target for thrice-weekly haemodialysis. This is the second-generation Daugirdas estimate." : "Under 1.2. For thrice-weekly haemodialysis this is below the usual single-pool target."};
    }},
  {id:"ef", mod:"echo", name:"Ejection fraction",
    expr:"EF (%) = (EDV − ESV) / EDV × 100",
    abbr:[["EF","Ejection fraction"],["EDV","End-diastolic volume"],["ESV","End-systolic volume"]],
    case:"End-diastolic volume 140 mL, end-systolic volume 82 mL.",
    inputs:[["edv","End-diastolic volume","mL","140"],["esv","End-systolic volume","mL","82"]],
    run:function(v){
      const ef = (v.edv-v.esv)/v.edv*100;
      let read = "The two volumes must be from the same cycle.";
      if(ef>=50) read = "50% or more. This is in the preserved range.";
      else if(ef>=41) read = "41–49%. This is mildly reduced.";
      else read = "40% or below. This is in the reduced range.";
      return {value:round(ef,1)+"%", work:"("+v.edv+" − "+v.esv+") / "+v.edv+" × 100", read:read};
    }},
  {id:"lvot", mod:"echo", name:"LVOT area",
    expr:"LVOT area = 0.785 × diameter²",
    abbr:[["LVOT","Left ventricular outflow tract"]],
    case:"Left ventricular outflow tract diameter 2.0 cm.",
    inputs:[["d","LVOT diameter","cm","2"]],
    run:function(v){
      const a = 0.785*v.d*v.d;
      return {value:round(a,2)+" cm²", work:"0.785 × "+v.d+"²",
        read:"0.785 is π/4, so this is the area of a circle. A small error in diameter changes the area, and the stroke volume, by a large amount."};
    }},
  {id:"sv", mod:"echo", name:"Stroke volume by echo",
    expr:"LVOT area = 0.785 × diameter². SV = LVOT area × LVOT VTI.",
    abbr:[["SV","Stroke volume"],["LVOT","Left ventricular outflow tract"],["VTI","Velocity–time integral"]],
    case:"LVOT diameter 2.0 cm, LVOT velocity–time integral 16 cm.",
    inputs:[["d","LVOT diameter","cm","2"],["vti","LVOT VTI","cm","16"]],
    run:function(v){
      const area = 0.785*v.d*v.d;
      const sv = area*v.vti;
      return {value:round(sv,1)+" mL", work:"Area "+round(area,2)+" cm². "+round(area,2)+" × "+v.vti,
        read: sv<60 ? "Under 60 mL. A usual stroke volume is about 60–100 mL. Confirm the outflow diameter before calling the volume low." : "About 60–100 mL is a usual stroke volume."};
    }},
  {id:"ava", mod:"echo", name:"Aortic valve area",
    expr:"LVOT area = 0.785 × diameter². Aortic valve area = LVOT area × LVOT VTI / AV VTI.",
    abbr:[["LVOT","Left ventricular outflow tract"],["VTI","Velocity–time integral"],["AV","Aortic valve"]],
    case:"LVOT diameter 2.0 cm, LVOT VTI 18 cm, aortic valve VTI 70 cm.",
    inputs:[["d","LVOT diameter","cm","2"],["lvot","LVOT VTI","cm","18"],["av","Aortic valve VTI","cm","70"]],
    run:function(v){
      const area = 0.785*v.d*v.d;
      const a = area*v.lvot/v.av;
      return {value:round(a,2)+" cm²", work:"Area "+round(area,2)+" cm². "+round(area,2)+" × "+v.lvot+" / "+v.av,
        read: a<=1 ? "1.0 cm² or less. That is in the severe range if the measurements agree. Low flow can make the area and the gradient disagree." : "Above 1.0 cm². Severe stenosis is less likely if the tracing is reliable."};
    }},
  {id:"bern", mod:"echo", name:"Pressure gradient",
    expr:"Pressure gradient = 4 × velocity²",
    abbr:[["Velocity","Blood velocity across the valve or jet"]],
    case:"Tricuspid regurgitant velocity 3.2 m/s.",
    inputs:[["v","Velocity","m/s","3.2"]],
    run:function(v){
      const g = 4*v.v*v.v;
      return {value:round(g,1)+" mmHg", work:"4 × "+v.v+"²",
        read:"This is the simplified Bernoulli equation. It is a peak gradient if you entered a peak velocity. It overestimates the gradient when the velocity just upstream is already high."};
    }},
  {id:"pasp", mod:"echo", name:"Pulmonary artery systolic pressure",
    expr:"PASP = 4 × TR velocity² + RAP",
    abbr:[["PASP","Pulmonary artery systolic pressure"],["TR","Tricuspid regurgitation"],["RAP","Right atrial pressure"]],
    case:"Tricuspid regurgitant velocity 3.2 m/s. Right atrial pressure estimated at 15 mmHg from a plethoric vena cava.",
    inputs:[["v","TR velocity","m/s","3.2"],["rap","Right atrial pressure","mmHg","15"]],
    run:function(v){
      const p = 4*v.v*v.v + v.rap;
      return {value:round(p,1)+" mmHg", work:"4 × "+v.v+"² + "+v.rap,
        read: p>40 ? "Above about 35–40 mmHg. The estimate is raised, and only if there is no pulmonary stenosis. The atrial pressure you entered moves the result." : "About 40 mmHg or less. This estimates pulmonary artery systolic pressure only if there is no pulmonary stenosis."};
    }},
  {id:"cpp", mod:"echo", name:"Cerebral perfusion pressure",
    expr:"MAP = (SBP + 2 × DBP) / 3. CPP = MAP − ICP.",
    abbr:[["CPP","Cerebral perfusion pressure"],["MAP","Mean arterial pressure"],["ICP","Intracranial pressure"],["SBP","Systolic blood pressure"],["DBP","Diastolic blood pressure"]],
    case:"Blood pressure 120/60 mmHg, intracranial pressure 26 mmHg after traumatic brain injury.",
    inputs:[["sbp","Systolic pressure","mmHg","120"],["dbp","Diastolic pressure","mmHg","60"],["icp","Intracranial pressure","mmHg","26"]],
    run:function(v){
      const map = (v.sbp+2*v.dbp)/3;
      const c = map-v.icp;
      return {value:round(c,1)+" mmHg", work:"MAP "+round(map,1)+". "+round(map,1)+" − "+v.icp,
        read: c<60 ? "Under 60 mmHg. In traumatic brain injury a perfusion pressure around 60–70 mmHg is a common target. The low value is either a low arterial pressure, a high intracranial pressure, or both." : "60 mmHg or higher. Around 60–70 mmHg is a common target after traumatic brain injury."};
    }},
  {id:"pi", mod:"echo", name:"Transcranial Doppler pulsatility index",
    expr:"Mean velocity ≈ (PSV + 2 × EDV) / 3. Pulsatility index = (PSV − EDV) / mean velocity.",
    abbr:[["PSV","Peak systolic velocity"],["EDV","End-diastolic velocity"]],
    case:"Peak systolic velocity 120 cm/s, end-diastolic velocity 30 cm/s.",
    inputs:[["psv","Peak systolic velocity","cm/s","120"],["edv","End-diastolic velocity","cm/s","30"]],
    run:function(v){
      const mean = (v.psv+2*v.edv)/3;
      const pi = (v.psv-v.edv)/mean;
      return {value:round(pi,2), work:"Mean "+round(mean,1)+" cm/s. ("+v.psv+" − "+v.edv+") / "+round(mean,1),
        read: pi>1.2 ? "Above about 1.2. Downstream resistance is high. This is not a direct measure of intracranial pressure." : "About 0.6–1.2 is a typical pulsatility index."};
    }},
  {id:"half", mod:"drug", name:"Drug half-life",
    expr:"Half-life = 0.693 × Vd / clearance",
    abbr:[["Vd","Volume of distribution"],["Clearance","Plasma clearance of the drug"]],
    case:"Volume of distribution 40 L, clearance 5 L/h.",
    inputs:[["vd","Volume of distribution","L","40"],["cl","Clearance","L/h","5"]],
    run:function(v){
      const t = 0.693*v.vd/v.cl;
      return {value:round(t,2)+" h", work:"0.693 × "+v.vd+" / "+v.cl,
        read:"The half-life lengthens when clearance falls or the volume of distribution rises. Organ failure can change both. The units here assume litres and litres per hour, so the result is in hours."};
    }},
  {id:"bmi", mod:"drug", name:"Body mass index",
    expr:"BMI = weight (kg) / height² (m²)",
    abbr:[["BMI","Body mass index"]],
    case:"Weight 92 kg, height 170 cm.",
    inputs:[["wt","Weight","kg","92"],["ht","Height","cm","170"]],
    run:function(v){
      const m = v.ht>3 ? v.ht/100 : v.ht;
      const b = v.wt/(m*m);
      let read = "30 or more is obesity.";
      if(b<18.5) read = "Under 18.5. This is in the underweight range.";
      else if(b<25) read = "18.5–24.9. This is the usual range.";
      else if(b<30) read = "25–29.9. This is in the overweight range.";
      read += " In critical care, some drug and ventilator calculations use ideal or adjusted weight instead.";
      return {value:round(b,1)+" kg/m²", work:v.wt+" / "+round(m,2)+"²", read:read};
    }}
];
[
  {id:"sepsis3", name:"Sepsis-3 criteria",
    formula:"Sepsis is suspected or proven infection plus an acute rise in the SOFA score of 2 or more. Septic shock is sepsis with vasopressors required to keep the mean arterial pressure at 65 mmHg or higher, and a lactate above 2 mmol/L, after adequate fluid resuscitation.",
    diagnostic:"Sepsis-3 does not use the systemic inflammatory response criteria. The organ-dysfunction mark is an acute increase of at least 2 SOFA points from the baseline. If the baseline is unknown, it is taken as zero. Septic shock requires both the vasopressor requirement and the lactate above 2 mmol/L. Either one alone is not septic shock.",
    classification:"There is no mild, moderate or severe grade inside Sepsis-3. The two categories are sepsis and septic shock.",
    application:"Use it when infection is suspected and an organ has newly failed. It decides that the patient has sepsis, not which antibiotic or how much fluid to give. qSOFA is not part of the diagnosis."},
  {id:"sofa", name:"SOFA score",
    formula:"One point scale, 0 to 4, for each of six systems. The total is 0 to 24. Respiration uses PaO₂/FiO₂. Coagulation uses the platelet count. Liver uses bilirubin. Cardiovascular uses the mean pressure and the vasopressor dose. The brain uses the Glasgow Coma Scale. The kidney uses creatinine or urine output.",
    diagnostic:"PaO₂/FiO₂, in mmHg: 400 or more is 0; under 400 is 1; under 300 is 2; under 200 with respiratory support is 3; under 100 with respiratory support is 4. Platelets, ×10⁹/L: 150 or more is 0; under 150 is 1; under 100 is 2; under 50 is 3; under 20 is 4. Bilirubin, mg/dL: under 1.2 is 0; 1.2 to 1.9 is 1; 2.0 to 5.9 is 2; 6.0 to 11.9 is 3; 12 or more is 4. Circulation: mean pressure 70 or more is 0; under 70 is 1; dopamine at 5 µg/kg/min or less, or any dobutamine, is 2; dopamine above 5, or adrenaline or noradrenaline at 0.1 or less, is 3; dopamine above 15, or adrenaline or noradrenaline above 0.1, is 4. Glasgow score: 15 is 0; 13 to 14 is 1; 10 to 12 is 2; 6 to 9 is 3; under 6 is 4. Creatinine, mg/dL: under 1.2 is 0; 1.2 to 1.9 is 1; 2.0 to 3.4 is 2; 3.5 to 4.9, or urine under 500 mL/day, is 3; 5 or more, or urine under 200 mL/day, is 4.",
    classification:"SOFA has no mild, moderate or severe band. In Sepsis-3, an acute rise of 2 or more points is the threshold for organ dysfunction. A higher total tracks a higher risk of death, but the number is not itself a stage.",
    application:"Score the worst value in the day being assessed. Use the change from baseline, not a single number, when you are deciding whether sepsis is present. A sedated or intubated patient needs the assumed Glasgow score stated, or the brain component is not interpretable."},
  {id:"qsofa", name:"qSOFA score",
    formula:"One point each for respiratory rate 22 or more, systolic pressure 100 mmHg or less, and altered mentation. The total is 0 to 3.",
    diagnostic:"Altered mentation is a Glasgow score under 15. A score of 2 or more is the published threshold. qSOFA is not a diagnostic criterion for sepsis.",
    classification:"0 to 1 is below the threshold. 2 to 3 is the threshold that should prompt a look for organ dysfunction. There is no mild, moderate or severe class.",
    application:"Use it outside the ICU, where a full SOFA score is not yet available, as a prompt. Do not use it to rule sepsis out, and do not withhold treatment because the score is low."},
  {id:"berlin", name:"Berlin ARDS criteria",
    formula:"All four must be present: timing, chest imaging, origin of the oedema, and oxygenation. The oxygenation band uses PaO₂/FiO₂ while the patient is on at least 5 cmH₂O of PEEP or CPAP.",
    diagnostic:"Timing: within 1 week of a known insult, or of new or worsening respiratory symptoms. Imaging: bilateral opacities not fully explained by effusion, collapse or nodules. Oedema: respiratory failure not fully explained by cardiac failure or fluid overload. If there is no risk factor, an objective assessment such as echocardiography is needed. Oxygenation is measured on PEEP or CPAP of at least 5 cmH₂O.",
    classification:"Mild: PaO₂/FiO₂ more than 200 and up to 300. Moderate: more than 100 and up to 200. Severe: 100 or less. The ratio uses PaO₂ in mmHg and FiO₂ as a fraction.",
    application:"Use it to name the syndrome and its band after the other three criteria are met. The band does not choose the PEEP or the decision to prone. A ratio taken without at least 5 cmH₂O of PEEP or CPAP does not meet the definition."},
  {id:"scai", name:"SCAI cardiogenic shock stages",
    formula:"A clinical stage, A to E, based on risk, blood pressure, hypoperfusion and the response to support. It is not a numerical equation.",
    diagnostic:"Stage A, at risk: not currently in shock, but a condition that can cause it is present. Stage B, beginning: hypotension or tachycardia without hypoperfusion. Stage C, classic: hypoperfusion that needs an intervention beyond volume, such as a drug or a device. Stage D, deteriorating: the shock is worsening despite that support. Stage E, extremis: actual or impending circulatory collapse, including ongoing arrest.",
    classification:"The stages are A, B, C, D and E. A patient can move up or down. There is no separate mild, moderate or severe label.",
    application:"Use the stage to describe how the shock is behaving and whether the first support has failed. The stage does not choose the device. Lactate, blood pressure and the examination decide whether hypoperfusion is present."},
  {id:"kdigoaki", name:"KDIGO AKI criteria",
    formula:"Acute kidney injury is an increase in creatinine of at least 0.3 mg/dL within 48 hours, or an increase to at least 1.5 times the baseline within 7 days, or urine output under 0.5 mL/kg/h for 6 hours.",
    diagnostic:"Use the criterion that is met first. The baseline is the known creatinine, not a number guessed after the injury. Urine output must be measured, not estimated. Stage is assigned by the worst criterion that is met.",
    classification:"Stage 1: creatinine 1.5 to 1.9 times baseline, or a rise of at least 0.3 mg/dL, or urine under 0.5 mL/kg/h for 6 to 12 hours. Stage 2: creatinine 2.0 to 2.9 times baseline, or urine under 0.5 mL/kg/h for 12 hours or more. Stage 3: creatinine 3 times baseline or more, or 4.0 mg/dL or more, or renal replacement therapy, or urine under 0.3 mL/kg/h for 24 hours, or anuria for 12 hours. In a patient under 18 years, a fall in estimated filtration rate to under 35 mL/min/1.73 m² also meets stage 3.",
    application:"Use it to name and stage an acute injury. It does not distinguish a prerenal state from tubular injury, and it does not decide when to start dialysis. A single creatinine without a baseline or a urine record cannot stage the injury."},
  {id:"kdigockd", name:"KDIGO CKD classification",
    formula:"Chronic kidney disease is an abnormality of kidney structure or function present for more than 3 months. The classification is the filtration-rate category, G, plus the albuminuria category, A.",
    diagnostic:"A low filtration rate, albuminuria, a structural abnormality or a sediment abnormality must persist for more than 3 months. One low filtration rate during an acute illness is not chronic kidney disease.",
    classification:"G1 is 90 or more, G2 is 60 to 89, G3a is 45 to 59, G3b is 30 to 44, G4 is 15 to 29, and G5 is under 15 mL/min/1.73 m². A1 is albuminuria under 30 mg/g, A2 is 30 to 300, and A3 is over 300. G1 or G2 without another marker is not chronic kidney disease.",
    application:"Use the G and A pair to describe risk and to adjust drugs that depend on filtration. Do not apply a chronic category to an acute rise. Dialysis dependence is recorded separately from the G category."},
  {id:"dka2024", name:"2024 DKA criteria",
    formula:"Diabetic ketoacidosis requires all three: the D criterion, the K criterion and the A criterion. Severity then uses beta-hydroxybutyrate, pH, bicarbonate and mental status.",
    diagnostic:"D: glucose 200 mg/dL (11.1 mmol/L) or more, or a prior history of diabetes. K: beta-hydroxybutyrate 3.0 mmol/L or more, or urine ketones 2+ or higher. A: pH under 7.3, or bicarbonate under 18 mmol/L, or both. Glucose is no longer required if diabetes is already known, so euglycaemic ketoacidosis can meet the definition.",
    classification:"Mild: beta-hydroxybutyrate 3 to 6 mmol/L, pH above 7.25, bicarbonate 15 mmol/L or more, and normal mentation. Moderate: beta-hydroxybutyrate 3 to 6 mmol/L, pH 7.0 to 7.25, bicarbonate 10 to under 15 mmol/L, and normal or drowsy mentation. Severe: beta-hydroxybutyrate above 6 mmol/L, pH under 7.0, bicarbonate under 10 mmol/L, and stupor or coma. Not every item has to match. The anion gap is not a severity criterion in this report.",
    application:"Use the three letters to make the diagnosis, then the severity to choose the level of care. Mild disease may be managed outside intensive care. Severe disease, or ketoacidosis with another critical illness, belongs in intensive care. Do not start insulin if the potassium is low. Resolution is judged on closing of the ketoacidosis, not on the glucose alone."},
  {id:"hhs2024", name:"2024 HHS criteria",
    formula:"Hyperglycaemic hyperosmolar state requires hyperglycaemia, hyperosmolality, no significant ketosis, and no acidosis.",
    diagnostic:"Glucose 600 mg/dL (33.3 mmol/L) or more. Effective serum osmolality above 300 mOsm/kg, or total serum osmolality above 320 mOsm/kg. Beta-hydroxybutyrate under 3.0 mmol/L, or a urine ketone strip below 2+. pH 7.3 or more and bicarbonate 15 mmol/L or more. Effective osmolality is 2 × sodium plus glucose in mmol/L. Total osmolality also adds urea.",
    classification:"The 2024 report does not grade HHS as mild, moderate or severe. A mixed picture, with acidosis and significant ketones, is ketoacidosis or a mixed crisis, not pure HHS.",
    application:"Use all four requirements. HHS is managed in intensive care. Fluid and a careful insulin infusion follow the osmolality and the sodium, and the rate of fall of osmolality is kept controlled. A patient who also meets the ketoacidosis criteria is not labelled as HHS alone."},
  {id:"atlanta", name:"Revised Atlanta pancreatitis classification",
    formula:"The diagnosis needs two of three: pain typical of pancreatitis, lipase or amylase at least three times the upper limit, or imaging consistent with pancreatitis. Severity is then classified by organ failure and complications.",
    diagnostic:"Organ failure uses the modified Marshall score. A score of 2 or more in respiration, circulation or the kidney is organ failure. Local complications include fluid collections, necrosis and gastric-outlet or biliary obstruction. Transient organ failure lasts under 48 hours. Persistent organ failure lasts 48 hours or more.",
    classification:"Mild: no organ failure and no local or systemic complication. Moderately severe: transient organ failure, or a local or systemic complication, without persistent organ failure. Severe: persistent organ failure.",
    application:"Make the diagnosis from two of the three findings. Do not wait for a scan if the pain and the enzyme already agree. Assign severity after 48 hours, because the first day cannot yet separate transient from persistent failure. The class describes the attack. It does not replace a look for the cause."},
  {id:"bisap", name:"BISAP score",
    formula:"One point each for blood urea nitrogen above 25 mg/dL, impaired mentation, the systemic inflammatory response, age above 60 years, and a pleural effusion. The total is 0 to 5.",
    diagnostic:"Impaired mentation is a Glasgow score under 15. The systemic inflammatory response here is two or more of: temperature under 36 or above 38 °C, heart rate above 90, respiratory rate above 20 or a carbon dioxide under 32 mmHg, and a white-cell count under 4 or above 12 ×10⁹/L. The effusion may be on either side.",
    classification:"A score of 3 or more marks a higher risk of death and of severe disease. BISAP has no official mild, moderate and severe stages of its own.",
    application:"Use it in the first 24 hours as a bedside risk score. It does not replace the Revised Atlanta class, which depends on organ failure over time. A low score does not exclude necrosis."},
  {id:"child", name:"Child-Pugh classification",
    formula:"Five items, scored 1 to 3, then added. Bilirubin, albumin, INR, ascites and encephalopathy. The total is 5 to 15.",
    diagnostic:"Bilirubin, mg/dL: under 2 is 1, 2 to 3 is 2, above 3 is 3. Albumin, g/dL: above 3.5 is 1, 2.8 to 3.5 is 2, under 2.8 is 3. INR: under 1.7 is 1, 1.7 to 2.3 is 2, above 2.3 is 3. Ascites: none is 1, slight or controlled by diuretic is 2, moderate despite treatment is 3. Encephalopathy: none is 1, grade 1 or 2 is 2, grade 3 or 4 is 3.",
    classification:"Class A is 5 or 6. Class B is 7 to 9. Class C is 10 to 15. There is no stage I to IV.",
    application:"Use it to describe the reserve of a patient with cirrhosis. It is not a diagnosis of cirrhosis, and it is not the allocation score. Acute kidney injury, infection and bleeding can move the class within days."},
  {id:"meld", name:"MELD score",
    formula:"MELD = 3.78 × ln(bilirubin) + 11.2 × ln(INR) + 9.57 × ln(creatinine) + 6.43. Bilirubin and creatinine are in mg/dL. Any value under 1 is entered as 1. Creatinine above 4 is entered as 4, and creatinine is set to 4 if the patient was dialysed twice in the last week.",
    diagnostic:"The laboratory MELD uses those three values only. MELD-Na then adjusts for sodium bounded between 125 and 137 mmol/L: MELD + 1.32 × (137 − sodium) − 0.033 × MELD × (137 − sodium). Current transplant allocation uses a later revision, MELD 3.0, which is not this equation.",
    classification:"MELD has no mild, moderate or severe class. A higher number marks a higher short-term risk of death in chronic liver disease. The result is usually rounded to the nearest integer.",
    application:"Use the original equation for a bedside estimate, and say which version you used. Do not use it to diagnose acute liver failure. King's College criteria are the separate transplant threshold for acute failure. A rising creatinine from shock changes the score without meaning the liver has worsened alone."},
  {id:"kings", name:"King's College criteria",
    formula:"Two lists. One is for paracetamol. The other is for every other cause of acute liver failure. Meeting the list is the criterion. There is no summed score.",
    diagnostic:"Paracetamol: arterial pH under 7.30 after resuscitation, or all three of INR above 6.5, creatinine above 3.4 mg/dL, and grade 3 or 4 encephalopathy. Other causes: INR above 6.5, or any three of age under 10 or over 40 years, an unfavourable cause such as seronegative hepatitis or drug injury, jaundice to encephalopathy longer than 7 days, INR above 3.5, and bilirubin above 17.5 mg/dL.",
    classification:"The result is met or not met. There is no mild, moderate or severe grade.",
    application:"Use it in acute liver failure when transplant is being considered. It does not apply to decompensated cirrhosis. A patient who does not meet the list can still deteriorate, so the list is repeated as the INR, the pH and the grade change."},
  {id:"gcs", name:"Glasgow Coma Scale",
    formula:"Eye opening, 1 to 4, plus verbal response, 1 to 5, plus motor response, 1 to 6. The total is 3 to 15. Eye: none 1, to pressure 2, to sound 3, spontaneous 4. Verbal: none 1, sounds 2, words 3, confused 4, oriented 5. Motor: none 1, extension 2, abnormal flexion 3, normal flexion 4, localising 5, obeys commands 6.",
    diagnostic:"Score the best response. A tube or facial injury removes the verbal or eye score. Report the three parts, not only the total, and say if a part could not be tested.",
    classification:"The scale itself has no grades. In traumatic brain injury the usual bands are 13 to 15 mild, 9 to 12 moderate, and 3 to 8 severe. Those bands are not part of the original scale.",
    application:"Use the three parts at the bedside and repeat them. A total of 8 or less is the usual prompt to protect the airway, not an automatic indication for the same treatment in every disease. Sedation makes the score unusable unless it is recorded as untestable."},
  {id:"nihss", name:"NIHSS",
    formula:"National Institutes of Health Stroke Scale. Eleven items, scored from the examination, total 0 to 42. The items are consciousness, orientation, commands, gaze, visual fields, face, arm, leg, ataxia, sensation, language, dysarthria and extinction.",
    diagnostic:"Score what the patient does, not what you think they could do. Each item has its own ceiling: most are 0 to 2, the arms and legs are 0 to 4, and language is 0 to 3. An untestable item is stated, not guessed.",
    classification:"Commonly used bands, which are not a formal diagnostic class: 0 is no measured deficit, 1 to 4 is minor, 5 to 15 is moderate, 16 to 20 is moderate to severe, and 21 to 42 is severe.",
    application:"Use it to describe the deficit and to follow change. A low score does not exclude a large-vessel occlusion, and a high score does not by itself choose thrombolysis or thrombectomy. Those decisions use time, imaging and contraindications."},
  {id:"aspects", name:"ASPECTS",
    formula:"Alberta Stroke Program Early CT Score. Start at 10. Subtract 1 for each region of early ischaemic change in the middle-cerebral territory. The regions are caudate, lentiform, internal capsule, insula, and the six cortical areas M1 to M6. The score runs from 10 down to 0.",
    diagnostic:"It is read on a non-contrast scan, on the side of the suspected ischaemia. A score of 10 means none of those regions is involved. A lower score means more early change. It is not a diagnosis of stroke.",
    classification:"There is no mild, moderate or severe class. A score of 7 or less has been used in trials as extensive early change. That trial threshold is not a universal rule that treatment is forbidden.",
    application:"Use it to describe how much of the middle-cerebral territory already looks infarcted on the plain scan. It does not score the posterior circulation, and it does not replace a vessel image."},
  {id:"ich", name:"ICH score",
    formula:"Glasgow score, volume, intraventricular blood, site and age. Glasgow 3 or 4 scores 2, and 5 to 12 scores 1. Volume of 30 mL or more scores 1. Intraventricular blood scores 1. An infratentorial origin scores 1. Age of 80 years or more scores 1. The total is 0 to 6.",
    diagnostic:"Volume is the intracerebral haematoma volume, not the ventricle. The Glasgow score is the one at presentation. Each item is present or absent except the Glasgow bands.",
    classification:"The score is 0 to 6. Observed mortality rises as the score rises. There is no mild, moderate or severe rename of these points.",
    application:"Use it to estimate hospital mortality after a spontaneous intracerebral haemorrhage. It does not decide whether to operate, and it does not apply unchanged to a traumatic haematoma."},
  {id:"hunthess", name:"Hunt-Hess classification",
    formula:"A clinical grade, 1 to 5, for aneurysmal subarachnoid haemorrhage. It is assigned from symptoms and the examination, not from a scan measurement.",
    diagnostic:"Grade 1: asymptomatic, or mild headache and slight neck stiffness. Grade 2: moderate or severe headache, neck stiffness, no deficit other than a cranial-nerve palsy. Grade 3: drowsiness or confusion, or a mild focal deficit. Grade 4: stupor, moderate or severe hemiparesis, or early decerebrate posturing. Grade 5: deep coma, decerebrate posturing, or a moribund appearance. A serious systemic disease is sometimes recorded by adding one grade. Say so if you do it.",
    classification:"Grades 1 to 5. Grades 1 and 2 are the better grades. Grades 4 and 5 are the poor grades. There is no separate stage I to IV.",
    application:"Grade the patient at presentation and again if they worsen. The grade describes the haemorrhage. It does not locate the aneurysm and it does not time the securing of the aneurysm by itself."},
  {id:"wfns", name:"WFNS classification",
    formula:"World Federation of Neurosurgical Societies grade for subarachnoid haemorrhage. It uses the Glasgow score and whether there is a motor deficit. Grades 1 to 5.",
    diagnostic:"Grade 1: Glasgow 15 and no motor deficit. Grade 2: Glasgow 13 or 14 and no motor deficit. Grade 3: Glasgow 13 or 14 with a motor deficit. Grade 4: Glasgow 7 to 12, with or without a motor deficit. Grade 5: Glasgow 3 to 6, with or without a motor deficit.",
    classification:"Grades 1 to 5. A motor deficit moves a patient from grade 2 to grade 3. There is no mild, moderate or severe label beyond the grade.",
    application:"Use it alongside, not instead of, the Hunt-Hess grade. Record the Glasgow parts that produced the grade. Sedation after intubation makes a new grade meaningless unless the pre-intubation score is the one you cite."},
  {id:"wells", name:"Wells score for pulmonary embolism",
    formula:"Clinical signs of deep-vein thrombosis, 3. An alternative diagnosis is less likely than embolism, 3. Heart rate above 100, 1.5. Immobilisation or surgery in the previous 4 weeks, 1.5. Previous deep-vein thrombosis or embolism, 1.5. Haemoptysis, 1. Malignancy treated or palliative in the last 6 months, 1.",
    diagnostic:"The score is the sum of the features that are present. The item worth 3 for an alternative diagnosis is a judgment, and it must be written down. This is the pulmonary-embolism score. The deep-vein thrombosis Wells score is a different list.",
    classification:"Three levels: under 2 is low, 2 to 6 is moderate, and above 6 is high. Two levels: 4 or less is embolism unlikely, and above 4 is embolism likely.",
    application:"Use the two-level result with a D-dimer when embolism is unlikely. A likely score is not a reason to skip imaging if the patient can have it. Do not apply this point list to a swollen leg without chest symptoms."},
  {id:"pesi", name:"PESI score",
    formula:"Age in years, plus 10 if male, 30 for cancer, 10 for heart failure, 10 for chronic lung disease, 20 if the heart rate is 110 or more, 30 if the systolic pressure is under 100, 20 if the respiratory rate is 30 or more, 20 if the temperature is under 36 °C, 60 for altered mentation, and 20 if the saturation is under 90 percent.",
    diagnostic:"Use the values at presentation. Cancer is active cancer. Altered mentation is disorientation, lethargy, stupor or coma. This is the original index, not the simplified four-item version.",
    classification:"Class I is 65 or less. Class II is 66 to 85. Class III is 86 to 105. Class IV is 106 to 125. Class V is more than 125. Classes I and II are low risk. Classes III to V are higher risk.",
    application:"Use it after embolism is diagnosed, to describe short-term mortality risk. It does not diagnose embolism, and a low class does not by itself send a hypoxic or hypotensive patient home."},
  {id:"isth", name:"ISTH DIC score",
    formula:"Platelets, a fibrin marker, the prothrombin time and fibrinogen. Platelets above 100 ×10⁹/L score 0, 50 to 100 score 1, and under 50 score 2. The fibrin marker scores 0 if not raised, 2 if moderately raised, and 3 if strongly raised. Prolongation of the prothrombin time under 3 seconds scores 0, 3 to 6 seconds scores 1, and more than 6 seconds scores 2. Fibrinogen of 1.0 g/L or more scores 0, and under 1.0 g/L scores 1.",
    diagnostic:"A score of 5 or more is compatible with overt disseminated intravascular coagulation, if the patient has an underlying disorder known to cause it. Under 5 is not overt, and the score is repeated. The fibrin marker is usually a D-dimer or a fibrin-degradation product. The laboratory must define moderate and strong for its own assay.",
    classification:"Overt if 5 or more. Not overt if under 5. There is no mild, moderate or severe grade inside the score.",
    application:"Use it only when a provoking disease is already present, such as sepsis, trauma or a complication of pregnancy. Do not use the number to diagnose clotting from a D-dimer alone. Treat the cause. The score follows the response. It does not order plasma or heparin by itself."},
  {id:"fourts", name:"4Ts score",
    formula:"Thrombocytopenia, timing, thrombosis and another cause. Each scores 0, 1 or 2. Thrombocytopenia: a fall of more than half and a nadir of at least 20 ×10⁹/L is 2; a fall of 30 to 50 percent, or a nadir of 10 to 19, is 1; a fall under 30 percent, or a nadir under 10, is 0. Timing: day 5 to 10, or day 1 if there was recent heparin exposure, is 2; after day 10 or an unclear start is 1; day 4 or earlier with no recent heparin is 0. Thrombosis: a new proven thrombosis, a skin necrosis, or an anaphylactoid reaction after a bolus is 2; a progressive or recurrent thrombosis, or suspected but unproven thrombosis, or a red skin lesion, is 1; none is 0. Other cause: none apparent is 2; a possible other cause is 1; another cause is definite is 0.",
    diagnostic:"Add the four items. The score estimates the probability of heparin-induced thrombocytopenia before the antibody or the functional test returns.",
    classification:"A score of 3 or less is low probability. 4 or 5 is intermediate. 6 to 8 is high. There is no stage I to IV.",
    application:"A low score makes heparin-induced thrombocytopenia unlikely, and heparin need not be stopped for that reason alone. An intermediate or high score means stop heparin, including flushes, and start a non-heparin anticoagulant unless bleeding forbids it. Send the test. Do not wait for it to stop the heparin when the score is not low."},
  {id:"apache", name:"APACHE II score",
    formula:"The worst value in the first 24 hours of 12 physiology items, plus age points, plus chronic-health points. The physiology items are temperature, mean arterial pressure, heart rate, respiratory rate, oxygenation, arterial pH, sodium, potassium, creatinine, haematocrit, white-cell count, and the Glasgow score. The Glasgow contribution is 15 minus the Glasgow score. Age: 44 or under is 0, 45 to 54 is 2, 55 to 64 is 3, 65 to 74 is 5, and 75 or over is 6. Chronic health, only for severe organ failure or immunocompromise: 2 points after elective surgery, and 5 points for emergency surgery or a non-operative admission. The total runs from 0 to 71.",
    diagnostic:"Each physiology item is scored from the original Knaus table, using the worst value, not the admission value. If the inspired oxygen fraction is 0.5 or more, oxygenation uses the alveolar–arterial gradient. If it is under 0.5, oxygenation uses the PaO₂. Acute kidney injury doubles the creatinine points. A missing blood gas cannot be replaced by a guess.",
    classification:"APACHE II has no mild, moderate or severe class and no stage I to IV. A higher score marks a higher risk. The published risk of death also needs the diagnostic category and whether the admission followed emergency surgery. The score alone is not that percentage.",
    application:"Use it to describe severity for the first ICU day. Do not recalculate it every day and call the change a new APACHE II. Do not withhold treatment because the score is high. Drug dosing and the decision to limit care are not read off this number."}
].forEach(function(row){
  row.mod = "crit";
  row.kind = "crit";
  F.push(row);
});
const mods = document.getElementById("mods");
const list = document.getElementById("list");
const card = document.getElementById("card");
let mod = "haem";
let current = "map";
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return "&#"+c.charCodeAt(0)+";"; }); }
function paintMods(){
  mods.innerHTML = MODULES.map(function(m){
    return "<button type='button' data-mod='"+m[0]+"'"+(m[0]===mod?" class='on'":"")+">"+esc(m[1])+"</button>";
  }).join("");
}
function paintList(){
  list.innerHTML = F.filter(function(f){ return f.mod===mod; }).map(function(f){
    return "<button type='button' data-id='"+f.id+"'"+(f.id===current?" class='on'":"")+">"+esc(f.name)+"</button>";
  }).join("");
}
function valuesOf(f){
  const v = {};
  f.inputs.forEach(function(inp){
    const el = document.getElementById("in-"+inp[0]);
    if(!el) return;
    if(inp[0]==="sex") v.sex = el.value;
    else {
      const n = num(el.value);
      if(el.value.trim()==="") v[inp[0]] = null;
      else v[inp[0]] = n;
    }
  });
  return v;
}
function requiredReady(f, v){
  return f.inputs.every(function(inp){
    if(inp[0]==="sex") return true;
    if(/optional/i.test(inp[1])) return true;
    return v[inp[0]]!=null;
  });
}
function paintCard(){
  const f = F.find(function(x){ return x.id===current; });
  if(f.kind==="crit"){
    card.innerHTML =
      "<h2>"+esc(f.name)+"</h2>"+
      "<div class='sect'><b>Formula</b><p>"+esc(f.formula)+"</p></div>"+
      "<div class='sect'><b>Diagnostic criteria</b><p>"+esc(f.diagnostic)+"</p></div>"+
      "<div class='sect'><b>Classification</b><p>"+esc(f.classification)+"</p></div>"+
      "<div class='sect'><b>Clinical application</b><p>"+esc(f.application)+"</p></div>";
    return;
  }
  const fields = f.inputs.map(function(inp){
    if(inp[0]==="sex"){
      return "<label>"+esc(inp[1])+"<select id='in-sex'><option value='female'"+(inp[3]==="female"?" selected":"")+">Female</option><option value='male'"+(inp[3]==="male"?" selected":"")+">Male</option></select></label>";
    }
    return "<label>"+esc(inp[1])+" ("+esc(inp[2])+")<input id='in-"+inp[0]+"' inputmode='decimal' value='"+esc(inp[3])+"'></label>";
  }).join("");
  const key = f.abbr.map(function(pair){ return "<li><b>"+esc(pair[0])+"</b> — "+esc(pair[1])+"</li>"; }).join("");
  card.innerHTML =
    "<h2>"+esc(f.name)+"</h2>"+
    "<p class='expr'>"+esc(f.expr)+"</p>"+
    "<p class='case'>"+esc(f.case)+"</p>"+
    fields+
    "<div class='result' id='out'></div>"+
    "<ul class='key'>"+key+"</ul>";
  card.querySelectorAll("input,select").forEach(function(el){
    el.addEventListener("input", calc);
  });
  calc();
}
function calc(){
  const f = F.find(function(x){ return x.id===current; });
  if(!f || f.kind==="crit") return;
  const v = valuesOf(f);
  const out = document.getElementById("out");
  if(!requiredReady(f, v)){
    out.innerHTML = "<b>—</b><p class='read'>Enter every value.</p>";
    return;
  }
  let res;
  try{ res = f.run(v); }
  catch(err){ res = {value:"—", work:"", read:"Those values cannot be used in this formula."}; }
  if(!res || /Infinity|NaN/.test(String(res.value))) res = {value:"—", work:"", read:"Those values cannot be used in this formula."};
  out.innerHTML = "<b>"+esc(res.value)+"</b>"+
    (res.work ? "<p class='work'>"+esc(res.work)+"</p>" : "")+
    (res.note ? "<p class='work'>"+esc(res.note)+"</p>" : "")+
    "<p class='read'>"+esc(res.read||"")+"</p>";
}
mods.onclick = function(e){
  const btn = e.target.closest("[data-mod]");
  if(!btn) return;
  mod = btn.getAttribute("data-mod");
  const first = F.find(function(f){ return f.mod===mod; });
  current = first.id;
  paintMods(); paintList(); paintCard();
};
list.onclick = function(e){
  const btn = e.target.closest("[data-id]");
  if(!btn) return;
  current = btn.getAttribute("data-id");
  paintList(); paintCard();
};
const asked = new URLSearchParams(location.search).get("mod");
if(asked && F.some(function(f){ return f.mod===asked; })){
  mod = asked;
  current = F.find(function(f){ return f.mod===mod; }).id;
}
paintMods(); paintList(); paintCard();
</script>
</body>
</html>
