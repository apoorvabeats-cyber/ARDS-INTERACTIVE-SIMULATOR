<head>

<title>Practice Simulator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f7fb;color:#14213d}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.45}
button,a{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;background:#071b3a;color:#fff}
.top a,.top button.linkish{color:#dbe9ff;background:none;border:0;padding:8px 0;min-height:44px;text-decoration:none;font-weight:700}
#nav[hidden]{display:none}
.crumb{font-weight:800;font-size:15px;text-align:center;flex:1;min-width:0}
.progress{font-variant-numeric:tabular-nums;color:#dbe9ff;font-size:14px;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 120px}
.hero{background:linear-gradient(135deg,#071b3a,#1457a6);color:#fff;border-radius:24px;padding:26px 20px;margin-bottom:14px}
.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.05;margin:0 0 10px}
.hero p{margin:0;color:#dbe9ff;font-size:17px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.steps div{background:#ffffff14;border-radius:12px;padding:10px 12px}
.steps b{display:block;font-size:12px;letter-spacing:.04em;color:#bfdbfe}
.card{display:grid;grid-template-columns:108px minmax(0,1fr);gap:0;background:#fff;border:1px solid #d7e0ec;border-radius:18px;overflow:hidden;margin:12px 0;text-decoration:none;color:inherit;width:100%;text-align:left;padding:0}
.card img{width:108px;height:100%;object-fit:cover;background:#0b1b33;min-height:112px}
.card .body{padding:14px}
.kicker{color:#5f6f86;font-size:13px;font-weight:700}
h2{margin:4px 0 6px;font-size:22px;line-height:1.15}
.meta{color:#5f6f86;font-size:14px}
.badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#e9f2ff;color:#1457a6;font-weight:800;font-size:13px}
.panel{background:#fff;border:1px solid #d7e0ec;border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.mode{flex:1 1 220px;text-align:left;border:1px solid #d7e0ec;background:#fff;border-radius:14px;padding:12px;min-height:72px}
.mode.on{border-color:#1457a6;background:#f3f8ff}
.mode b{display:block}
.mode span{color:#5f6f86;font-size:14px}
.btn{min-height:48px;border:0;border-radius:12px;padding:12px 16px;background:#1457a6;color:#fff;font-weight:800}
.btn.ghost{background:#fff;color:#14213d;border:1px solid #d7e0ec}
.btn:disabled{opacity:.45}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-bottom:1px solid #d7e0ec}
.vitals div{padding:8px 12px;border-top:1px solid #e6edf5}
.vitals dt{font-size:12px;color:#5f6f86}
.vitals dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.vitals dd.warn{color:#b42318}
.skill{color:#1457a6;font-weight:800;font-size:13px;margin:0}
.lead{color:#3d4d63}
.prompt{font-size:18px;font-weight:750;margin:8px 0}
.figure{background:#07111f;border-radius:16px;overflow:hidden;border:1px solid #d7e0ec}
.stage{position:relative;overflow:hidden;max-height:min(56vh,460px);background:#07111f;touch-action:pan-y}
.stage.zoomed{touch-action:none}
.frame{position:relative;width:fit-content;max-width:100%;margin:0 auto}
.frame img{display:block;max-width:100%;width:auto;height:auto;max-height:min(56vh,460px);user-select:none;-webkit-user-drag:none}
.frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#fff;padding:10px 12px;color:#5f6f86;font-size:13px}
.cap .tools{display:flex;gap:6px;align-items:center}
.icon{width:44px;height:44px;border-radius:10px;border:1px solid #d7e0ec;background:#fff;font-weight:800}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #d7e0ec;border-radius:12px;padding:12px;min-height:48px;margin:8px 0}
.choice.on{border-color:#1457a6;background:#f3f8ff}
.choice.hinted{border-color:#0f7a4a}
.choice .n{color:#5f6f86;font-variant-numeric:tabular-nums;font-weight:800}
.choice:disabled{opacity:1}
.fb{border-radius:12px;padding:12px;background:#f4f7fb;border:1px solid #d7e0ec;margin-top:8px}
.fb.correct{border-color:#0f7a4a}
.fb.wrong{border-color:#b42318}
.fb.partial{border-color:#9a6700}
.fb b.correct{color:#0f7a4a}
.fb b.wrong{color:#b42318}
.fb b.partial{color:#9a6700}
.bar{position:sticky;bottom:0;z-index:15;display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#f4f7fb;border-top:1px solid #d7e0ec}
.bar .btn{flex:1 1 160px}
details summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
ul{margin:8px 0 0;padding-left:18px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{background:#fff;border:1px solid #d7e0ec;border-radius:14px;padding:12px}
.score b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.fine{color:#718096;font-size:13px}
.cross{stroke:#1457a6;fill:none}
.good{stroke:#1f9d62}
.bad{stroke:#d64545}
@media(min-width:760px){
  .steps{grid-template-columns:repeat(4,1fr)}
  .vitals{grid-template-columns:repeat(6,minmax(0,1fr))}
  .card{grid-template-columns:160px minmax(0,1fr)}
  .card img{width:160px}
  .scores{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<script>
const CASES = [{"id":"stroke","title":"Acute ischemic stroke","syndrome":"Left MCA syndrome","minutes":"12 min","difficulty":"Core","available":true,"summary":"Aphasia and right hemiparesis. Choose the scan, click the thrombus, and take her through thrombolysis and thrombectomy without missing the blood pressure.","queued":"","clockLabel":"Since last known well","clockWarnAfterMin":270,"objectives":["Choose the first imaging series","Find the hyperdense artery","Read vessel occlusion and eligibility","Treat blood pressure, then reperfuse","Respond when she suddenly worsens"],"thumb":"sim/stroke-ncct.jpg","patient":"E. Navarro","ageSex":"67-year-old woman","chart":["Teaching case. Not a real patient, and not a substitute for a stroke-team decision.","Sudden aphasia and right hemiparesis while pouring tea. Witnessed by her daughter.","Last known well 78 minutes before arrival. Weight 72 kg.","Amlodipine 5 mg and atorvastatin 40 mg. No anticoagulant. No antiplatelet.","No recent surgery, stroke, seizure, or bleeding disorder.","Glucose 126 mg/dL. Global aphasia, left gaze preference, right hemiparesis. NIHSS 16."],"opening":{"lkwMin":78,"status":"Aphasic, right hemiparesis. Just arrived.","sbp":198,"dbp":112,"hr":86,"rr":18,"spo2":98,"glucose":126,"nihss":16},"stages":[{"id":"first-image","skill":"Investigation","title":"What do you image first?","lead":"She cannot name objects or lift the right arm. The deficit is disabling, and last known well is still inside the thrombolysis window. The scanner is free.","prompt":"Which study do you obtain first?","hint":"The first question is whether there is blood. Vascular imaging comes immediately after that, not instead of it.","guideline":"Non-contrast head CT is the first series so hemorrhage can be excluded before a thrombolytic. Door-to-imaging is aimed at 20 minutes or less. CTA often follows on the same table.","answer":"Non-contrast CT head","kind":"choice","successFinding":"Non-contrast CT obtained first","successStatus":"On the scanner. Non-contrast series first.","missYou":"","miss":"","choices":[{"id":"ncct","label":"Non-contrast CT of the head","verdict":"correct","feedback":"Non-contrast CT is first because it answers the safety question: is there hemorrhage? In a stroke protocol she often stays on the table for angiography, but the non-contrast series is acquired and read before any thrombolytic. CTA does not replace it.","finding":"Non-contrast CT obtained first","status":"On the scanner. Non-contrast series first."},{"id":"cta","label":"CT angiography of the head and neck","verdict":"wrong","delayMin":10,"feedback":"Angiography is the right vascular study, and it is not the first series. You cannot clear the brain for thrombolysis from CTA alone. Obtain the non-contrast CT, then the angiogram."},{"id":"mri","label":"MRI brain with diffusion","verdict":"wrong","critical":true,"delayMin":180,"feedback":"Diffusion MRI is more sensitive for ischemia, and it is the wrong first test when a disabling deficit is still inside the thrombolysis window. In this run the detour costs about three hours. The clock has moved. Non-contrast CT is the first study."},{"id":"ctp","label":"CT perfusion","verdict":"wrong","delayMin":12,"feedback":"Perfusion helps select patients in an extended window. It does not exclude hemorrhage, and it is not required when last known well is just over an hour ago. Start with non-contrast CT."}]},{"id":"click-mca","skill":"Localization","title":"Click the abnormal vessel","lead":"The non-contrast CT is up. There is no bright intraparenchymal clot and no large dark territory with shift. One short segment of vessel is brighter than it should be.","prompt":"Click the hyperdense left middle cerebral artery.","hint":"The patient\u2019s left is the side marked L. Look in the Sylvian fissure for a short bright line, not at the dark ventricles.","guideline":"The hyperdense MCA sign is acute thrombus. It is fairly specific and not sensitive, so a normal-looking artery does not exclude an occlusion. It should push you straight to CTA.","answer":"Hyperdense left MCA in the Sylvian fissure","image":{"src":"sim/stroke-ncct.jpg","alt":"Teaching illustration of an axial non-contrast head CT with a hyperdense left middle cerebral artery","caption":"Non-contrast CT, teaching illustration at the basal ganglia. Radiological orientation: the patient\u2019s left is marked L. Not a real scan."},"kind":"hotspot","successFinding":"Hyperdense left MCA sign","successStatus":"Hyperdense left MCA. No hemorrhage on this slice.","missYou":"Clicked outside the hyperdense artery","miss":"Not that structure. Acute thrombus in the MCA is a short bright line in the Sylvian fissure, on the side marked L.","regions":[{"id":"hypermca","verdict":"correct","cx":0.695,"cy":0.468,"rx":0.065,"ry":0.05,"you":"Hyperdense left MCA","feedback":"That bright line in the left Sylvian fissure is the hyperdense MCA sign: thrombus in the artery, not calcification and not blood in the cistern. It matches the aphasia and the right hemiparesis. There is no hemorrhage on this slice."},{"id":"insula","verdict":"close","cx":0.6,"cy":0.44,"rx":0.04,"ry":0.05,"you":"Left insular cortex","feedback":"You are in the left insula, where early ischemic change can blur the gray\u2013white boundary. The question asks for the vessel. The bright line is just lateral to this, in the Sylvian fissure."},{"id":"right","verdict":"wrong","cx":0.33,"cy":0.46,"rx":0.08,"ry":0.08,"you":"Patient\u2019s right hemisphere","feedback":"That is the patient\u2019s right side, marked R. Her syndrome is left hemisphere: language and the right body. The bright artery is on the side marked L."},{"id":"vents","verdict":"wrong","cx":0.5,"cy":0.4,"rx":0.045,"ry":0.07,"you":"Lateral ventricles","feedback":"Those dark slits are CSF in the lateral ventricles. They are not enlarged, and they are not the acute finding. Look laterally for a vessel that is too bright."}]},{"id":"read-ct","skill":"Interpretation","title":"Read the non-contrast CT","lead":"Same slice. Use it to decide whether reperfusion is still conceivable, not only to name a sign.","prompt":"Which reading is right?","hint":"Separate three things: blood in the brain, a bright artery, and how established any hypodensity looks at this hour.","guideline":"Early ischemic change on CT does not by itself exclude thrombolysis inside the standard window. A large established hypodensity, hemorrhage, or a story that does not match the clock should make you stop.","answer":"No hemorrhage, hyperdense left MCA, early change only","image":{"src":"sim/stroke-ncct.jpg","alt":"Teaching illustration of the same non-contrast head CT","caption":"Same teaching illustration. Not a real scan."},"kind":"choice","successFinding":"CT: no hemorrhage, hyperdense left MCA, early change only","successStatus":"Hemorrhage excluded. Early ischemia, not a completed infarct.","missYou":"","miss":"","choices":[{"id":"early","label":"No hemorrhage. Hyperdense left MCA and only early ischemic change. This does not look like a completed infarct.","verdict":"correct","feedback":"At about 90 minutes a large dark territory with midline shift would imply a much earlier onset. The abnormal finding here is the bright artery, with subtle parenchymal change at most. There is no blood. This CT does not exclude thrombolysis.","finding":"CT read: no hemorrhage, hyperdense left MCA","status":"Hemorrhage excluded. Early ischemia, not a completed infarct."},{"id":"sah","label":"Diffuse subarachnoid blood in the basal cisterns.","verdict":"wrong","feedback":"Subarachnoid blood fills cisterns and fissures after a thunderclap headache. This slice does not show that cast of blood. The story is a focal deficit, and the bright structure is a vessel."},{"id":"ich","label":"Basal ganglia hemorrhage. Withhold every reperfusion treatment.","verdict":"wrong","critical":true,"feedback":"A basal ganglia hemorrhage is a bright clot inside the brain, usually with mass effect. There is no such clot here. Calling this a hemorrhage would wrongly close the door on reperfusion."},{"id":"malignant","label":"Established malignant left infarct. Reperfusion is futile.","verdict":"wrong","critical":true,"feedback":"Malignant edema and obvious low attenuation of most of the MCA territory take hours. Over-calling early change as a completed infarct is a common reason patients miss treatment. Read the attenuation that is actually there."}]},{"id":"next-step","skill":"Decision","title":"Vessels, drug, and the pressure","lead":"Hemorrhage is excluded. The deficit is disabling. Blood pressure is still 198/112. Last known well remains inside 4.5 hours unless your earlier choices burned the clock \u2014 watch the time above.","prompt":"What is the best next action?","hint":"She needs a CTA, a thrombolytic if she is still eligible, and a pressure under 185/110 before that drug. Do not trade one of those for another.","guideline":"CTA should not be the reason a thrombolytic is late. Blood pressure above 185/110 is a reason to lower the pressure before alteplase or tenecteplase. Aspirin is not a substitute for reperfusion inside the window.","answer":"CTA now, and thrombolysis once the pressure is under 185/110","kind":"choice","successFinding":"CTA ordered. Thrombolysis held only for blood pressure.","successStatus":"CTA next. Drug waits on the pressure, not on the report.","missYou":"","miss":"","choices":[{"id":"both","label":"CTA of the head and neck now. Give a thrombolytic once the pressure is under 185/110. Do not wait for the CTA report to start the drug.","verdict":"correct","feedback":"CTA is how you find a large-vessel occlusion and route her to thrombectomy. The written report should not delay a thrombolytic she is otherwise eligible for. The barrier in front of you is the pressure: 198/112 is above 185/110. Control that, and do not hold the drug for the angiogram.","finding":"CTA ordered. Thrombolysis held only for blood pressure.","status":"CTA next. Drug waits on the pressure, not on the report."},{"id":"hold","label":"CTA first. Give nothing until the radiologist reports the angiogram.","verdict":"wrong","delayMin":30,"feedback":"Vascular imaging should not be why the drug is late. The contraindication you actually have is the blood pressure, not the missing report. Order the CTA and treat the pressure in parallel."},{"id":"mri","label":"MRI before any reperfusion decision.","verdict":"wrong","critical":true,"delayMin":45,"feedback":"You already have a non-contrast CT that excludes hemorrhage. A trip to MRI now delays both the drug and thrombectomy."},{"id":"aspirin","label":"Aspirin, a statin, and a ward bed. The thrombolysis window is closed.","verdict":"wrong","critical":true,"delayMin":20,"feedback":"Check the clock before you close the window yourself. Unless earlier delay pushed her past 4.5 hours, she is still a reperfusion candidate. Aspirin is what you give when reperfusion is not happening. It is also held for 24 hours after a thrombolytic."}]},{"id":"click-cutoff","skill":"Localization","title":"Click the cutoff","lead":"The angiogram is on the screen. One middle cerebral artery branches. The other ends.","prompt":"Click the arterial cutoff \u2014 where contrast in the left MCA stops.","hint":"Ignore the side that looks like a full tree. On the side marked L, follow the horizontal artery until the bright column ends.","guideline":"A proximal MCA occlusion with a disabling deficit is a standard reason for thrombectomy in the early window, in addition to thrombolysis when she is still eligible.","answer":"Proximal left M1 cutoff","image":{"src":"sim/stroke-cta.jpg","alt":"Teaching illustration of a CT angiogram with a left M1 cutoff","caption":"CT angiography, teaching illustration. The patient\u2019s left is marked L. Not a real scan."},"kind":"hotspot","successFinding":"Left M1 occlusion","successStatus":"Left M1 occlusion. NIHSS 16. Thrombectomy eligible on anatomy.","missYou":"Clicked off the cutoff","miss":"Trace the middle cerebral artery on the side marked L from the midline outward. Click where the bright column stops, not where branches are still filling.","regions":[{"id":"stump","verdict":"correct","cx":0.7,"cy":0.502,"rx":0.055,"ry":0.04,"you":"Left M1 cutoff","feedback":"The horizontal left M1 ends in a blunt stump. Distal branches beyond it are missing, while the patient\u2019s right MCA fills. This is a proximal large-vessel occlusion, and with NIHSS 16 it is a thrombectomy target."},{"id":"proximal","verdict":"close","cx":0.62,"cy":0.49,"rx":0.035,"ry":0.03,"you":"Proximal left MCA, before the cutoff","feedback":"You are on the left MCA, but still proximal. Follow the bright column toward the side marked L. The cutoff is where it stops, not where it is still opacified."},{"id":"patent","verdict":"wrong","cx":0.35,"cy":0.4,"rx":0.11,"ry":0.09,"you":"Patent right MCA","feedback":"That tree fills. It is the patient\u2019s right MCA, on the side marked R. An occlusion is the vessel that ends. Look at the side marked L."}]},{"id":"plan","skill":"Reperfusion","title":"Set the reperfusion plan","lead":"CTA shows a proximal left M1 occlusion. NIHSS is 16. The non-contrast CT shows no hemorrhage and no established large infarct. She is not on an anticoagulant. Blood pressure is still 198/112 unless you already changed it. Weight 72 kg.","prompt":"Choose the plan.","hint":"Inside 4.5 hours with no contraindication except the pressure, she should be offered a thrombolytic and thrombectomy. The pressure is fixed first. Past 4.5 hours, the drug comes off the table and thrombectomy does not.","guideline":"Eligible patients with a large-vessel occlusion are offered intravenous thrombolysis and endovascular thrombectomy. The drug is not withheld merely because a clot is visible, and thrombectomy is not delayed to \u201csee if the drug works.\u201d","answer":"Thrombolysis after blood pressure control, plus thrombectomy \u2014 or thrombectomy alone if the window has closed","kind":"choice","successFinding":"Reperfusion plan recorded","successStatus":"Reperfusion plan set.","missYou":"","miss":"","choices":[{"id":"bridge","label":"Lower the pressure below 185/110, give intravenous thrombolysis, and activate thrombectomy for the M1 occlusion.","verdict":"correct","feedback":"She is inside the thrombolysis window, with a disabling deficit, no hemorrhage, and no anticoagulant. The drug and the catheter treat the same occlusion at different scales. One does not cancel the other. Blood pressure must be under 185/110 before the drug.","finding":"Plan: thrombolysis once blood pressure allows, plus thrombectomy","status":"Plan set. Blood pressure still blocks the drug.","late":{"afterMin":270,"verdict":"wrong","critical":true,"feedback":"The 4.5-hour thrombolysis window has closed because of earlier delay. A correct drug and dose do not make a late thrombolytic safe. Continue to thrombectomy without one."}},{"id":"evt-only","label":"Thrombectomy only. Skip thrombolysis because a large-vessel occlusion is present.","verdict":"partial","feedback":"Skipping the drug only because an M1 is visible is not the default while she is clearly eligible and the dose will not delay the puncture. Direct thrombectomy has been studied; it is an option when the drug is contraindicated, not a shortcut around a treatable pressure.","finding":"Thrombectomy planned without thrombolysis","status":"Thrombectomy planned. Thrombolysis not given.","late":{"afterMin":270,"verdict":"correct","feedback":"The thrombolysis window is now closed. With a favorable CT and an M1 occlusion still in the early thrombectomy window, endovascular treatment without a thrombolytic is the right plan. Do not give a late drug to make up the time."}},{"id":"push","label":"Give the thrombolytic now, at 198/112, and consider thrombectomy only if she fails to improve.","verdict":"wrong","critical":true,"delayMin":8,"feedback":"Two separate mistakes. Pressure above 185/110 is a reason to treat the pressure, not to push the drug. And an M1 occlusion with NIHSS 16 should go to thrombectomy in parallel, not after a watch-and-wait period."},{"id":"none","label":"No reperfusion. Age and the early CT change make her ineligible.","verdict":"wrong","critical":true,"delayMin":15,"feedback":"There is no age cutoff that excludes a 67-year-old inside the standard window. Early ischemic change on a still-favorable CT is a reason to move, not a reason to stop."}]},{"id":"pressure","skill":"Blood pressure","title":"The pressure before the drug","lead":"Blood pressure is 198/112. A thrombolytic is only safe to give under 185/110, and only if the 4.5-hour window is still open. Look at the clock before you choose.","prompt":"What do you do with this pressure?","hint":"Labetalol or nicardipine, recheck, then the drug \u2014 if the window is open. Sublingual nifedipine is not the tool. If the window has already closed, do not give a thrombolytic at all.","guideline":"Before intravenous alteplase or tenecteplase, blood pressure must be below 185/110. Labetalol 10\u201320 mg IV, or nicardipine started at 5 mg/h, is the usual approach. Recheck, and do not overshoot into hypotension.","answer":"Lower below 185/110 with labetalol or nicardipine, then give the drug if the window is open","kind":"choice","successFinding":"Blood pressure addressed before thrombolysis","successStatus":"Pressure plan confirmed.","missYou":"","miss":"","choices":[{"id":"labetalol","label":"Labetalol 10\u201320 mg IV, or nicardipine infusion. Recheck. Give the thrombolytic only after the pressure is under 185/110.","verdict":"correct","sbp":174,"dbp":94,"feedback":"That is the pre-thrombolysis rule. You treat only until the pressure is just under 185/110, then you recheck. She is now 174/94, which clears the threshold. Nicardipine is the alternative if labetalol is a poor fit. Sublingual nifedipine is not.","finding":"Blood pressure lowered to 174/94 before thrombolysis","status":"Blood pressure 174/94. Threshold met.","late":{"afterMin":270,"verdict":"wrong","feedback":"The thrombolysis window has closed, so there is no drug that requires this threshold. Do not force the pressure down just to give a late thrombolytic. Take her to thrombectomy and avoid hypotension."}},{"id":"ignore","label":"198 systolic is close enough. Give the thrombolytic now.","verdict":"wrong","critical":true,"feedback":"185/110 is a safety threshold, not a suggestion. 198/112 is over it. Lower the pressure, confirm the repeat reading, then give the drug if the window is still open."},{"id":"nifedipine","label":"Sublingual nifedipine, for a fast drop.","verdict":"wrong","critical":true,"delayMin":6,"feedback":"Sublingual nifedipine drops pressure unpredictably and can overshoot. It is not used to prepare someone for thrombolysis. Use IV labetalol or a nicardipine infusion, and recheck."},{"id":"skip-drug","label":"No thrombolytic and no pressure treatment. Go to thrombectomy. The 185/110 rule is only for the drug.","verdict":"partial","feedback":"The rule is real, and it is a reason to treat the pressure, not a reason to skip a drug she can still receive. Lower the pressure, give the thrombolytic, and still take her to thrombectomy.","late":{"afterMin":270,"verdict":"correct","feedback":"With the window closed, thrombectomy proceeds without a thrombolytic. You do not need to force the pressure under 185/110 for a drug you are not giving. Avoid hypotension, and move her to the suite."}}]},{"id":"dose","skill":"Dosing","title":"Name the regimen","lead":"Weight is 72 kg. Give a thrombolytic only if the window is still open and the pressure is under 185/110. If either is not true, say so and go to thrombectomy without a drug.","prompt":"What do you administer?","hint":"Stroke tenecteplase is 0.25 mg/kg as one bolus, not the cardiac dose. Alteplase is 0.9 mg/kg, 10% as a bolus and the rest over an hour. Both are acceptable here. 72 kg is 18 mg of tenecteplase, or 64.8 mg of alteplase.","guideline":"Tenecteplase 0.25 mg/kg (maximum 25 mg) as a single bolus is used in many current stroke protocols. Alteplase 0.9 mg/kg (maximum 90 mg) remains an accepted regimen. The 0.5 mg/kg tenecteplase dose is for myocardial infarction, not stroke.","answer":"Tenecteplase 18 mg or alteplase 64.8 mg, if the window is open","kind":"choice","successFinding":"Thrombolytic decision recorded","successStatus":"Drug decision made. Thrombectomy team activated.","missYou":"","miss":"","choices":[{"id":"tnk","label":"Tenecteplase 0.25 mg/kg intravenous bolus. For 72 kg, that is 18 mg, once.","verdict":"correct","feedback":"18 mg is 0.25 mg/kg for 72 kg, given as a single bolus, with a usual maximum of 25 mg. It is not the myocardial infarction dose. Activate thrombectomy at the same time. The bolus does not mean you skip the angio suite.","finding":"Tenecteplase 18 mg IV bolus","status":"Tenecteplase given. Thrombectomy team moving.","late":{"afterMin":270,"verdict":"wrong","critical":true,"feedback":"The 4.5-hour thrombolysis window has closed because of earlier delay. A correct drug and dose do not make a late thrombolytic safe. Continue to thrombectomy without one."}},{"id":"tpa","label":"Alteplase 0.9 mg/kg. For 72 kg, 64.8 mg total: about 6.5 mg as a bolus, the rest over 60 minutes.","verdict":"correct","feedback":"Alteplase 0.9 mg/kg, maximum 90 mg, is still an accepted regimen. For 72 kg the total is 64.8 mg: 10% as a bolus over one minute and the remainder over 60 minutes. Do not exceed 0.9 mg/kg, and do not let the infusion delay the puncture.","finding":"Alteplase 64.8 mg started","status":"Alteplase running. Thrombectomy team moving.","late":{"afterMin":270,"verdict":"wrong","critical":true,"feedback":"The 4.5-hour thrombolysis window has closed because of earlier delay. A correct drug and dose do not make a late thrombolytic safe. Continue to thrombectomy without one."}},{"id":"cardiac","label":"Tenecteplase 0.5 mg/kg. For 72 kg, 36 mg. The dose used for myocardial infarction.","verdict":"wrong","critical":true,"feedback":"0.5 mg/kg is the ST-elevation myocardial infarction dose. In ischemic stroke it raises the bleeding risk without a reason. The stroke dose is 0.25 mg/kg."},{"id":"none","label":"No thrombolytic. The window is closed, or she is otherwise ineligible. Thrombectomy without a drug.","verdict":"wrong","feedback":"Check the clock and the pressure again. If both still allow it, withholding the drug is the weaker plan. She was eligible on arrival.","late":{"afterMin":270,"verdict":"correct","feedback":"The window is closed. Thrombectomy without thrombolysis is appropriate. Do not give a late bolus to compensate for the delay."}}]},{"id":"decline","skill":"Complication","title":"She suddenly worsens","lead":"Twenty minutes later, before the puncture, she vomits, becomes drowsier, and the NIHSS rises from 16 to 22. Blood pressure is 176/98. If an alteplase infusion is still running, it is running. Tenecteplase, if you gave it, is already in.","prompt":"What is the first move?","hint":"You cannot tell hemorrhage from reocclusion at the bedside. Stop a running infusion, give nothing that makes bleeding worse, and image.","guideline":"Neurological decline after a thrombolytic is hemorrhage until a non-contrast CT says otherwise. Stop alteplase if it is still infusing. Hold antithrombotics. Do not give a second lytic, and do not start heparin, until imaging is done.","answer":"Stop any running thrombolytic, hold antithrombotics, immediate non-contrast CT","kind":"choice","successFinding":"Decline investigated before more drug or heparin","successStatus":"Infusion held if it was running. Repeat CT ordered.","missYou":"","miss":"","choices":[{"id":"ct","label":"Stop any thrombolytic still running. Hold aspirin and heparin. Control the pressure. Immediate non-contrast CT.","verdict":"correct","nihss":22,"feedback":"A sudden drop can be hemorrhage, swelling, seizure, or recurrent ischemia. You cannot tell those apart from the doorway. Tenecteplase has no infusion to stop; alteplase does. Hold antithrombotics either way. If the repeat CT shows hemorrhage, then reverse, tighten the pressure, and call neurosurgery. Do not reverse blindly before you see blood, and do not give more lytic before you have excluded it.","finding":"Sudden decline. Thrombolytic held. Repeat CT ordered.","status":"NIHSS 22. Waiting on the repeat CT."},{"id":"more","label":"The vessel has reoccluded. Give a second thrombolytic dose.","verdict":"wrong","critical":true,"feedback":"More lytic into a patient who is crashing is how you enlarge a bleed you have not excluded. Image first. A second dose is not the rescue."},{"id":"heparin","label":"Start heparin so the upcoming thrombectomy stays open.","verdict":"wrong","critical":true,"feedback":"Heparin is not the treatment of an unexplained decline, and it is the wrong drug in the early hours after thrombolysis. It also does not belong on the way to the suite before you know this is not a hemorrhage."},{"id":"ignore","label":"Expected fluctuation. Continue to the angio suite with no new imaging.","verdict":"wrong","delayMin":10,"feedback":"A rise of 6 NIHSS points with vomiting is not benign fluctuation. Get a non-contrast CT before she is anticoagulated for the procedure."}]},{"id":"orders","skill":"Aftercare","title":"The repeat CT is dry","lead":"The repeat non-contrast CT shows no hemorrhage. The deficit has settled back toward her arrival examination. The M1 is still occluded. She is going for thrombectomy.","prompt":"Which orders cover the next day?","hint":"After a thrombolytic: frequent checks, pressure under 180/105, and no antithrombotic for 24 hours. She also needs groin checks after the puncture. Aspirin now is early.","guideline":"After intravenous thrombolysis, neurological checks are every 15 minutes for 2 hours, every 30 minutes for 6 hours, then hourly. Blood pressure stays under 180/105 for 24 hours. Antiplatelets and anticoagulants wait until a follow-up image excludes hemorrhage, typically 24 hours.","answer":"Frequent neuro checks, pressure under 180/105 if a thrombolytic was given, no early antithrombotic","kind":"choice","successFinding":"Post-treatment observation orders placed","successStatus":"Observation orders set. En route to thrombectomy.","missYou":"","miss":"","choices":[{"id":"schedule","label":"Neuro checks every 15 minutes for 2 hours, then every 30 minutes for 6 hours, then hourly. If she received a thrombolytic, keep the pressure under 180/105 and give no antithrombotic for 24 hours. Groin checks after the puncture.","verdict":"correct","feedback":"That is the standard post-thrombolysis schedule. The ceiling after a thrombolytic is 180/105 for 24 hours, tighter than the permissive range used when no drug was given. Antiplatelets wait. Add puncture-site checks because she is also going for thrombectomy. If you never gave a thrombolytic, you would not use the 24-hour antithrombotic ban in the same way \u2014 aspirin can start once hemorrhage is excluded \u2014 but the frequent checks still stand.","finding":"Post-thrombolysis observation and thrombectomy handoff","status":"Orders placed. En route to thrombectomy."},{"id":"permissive","label":"Allow the pressure up to 220/120. She had an ischemic stroke.","verdict":"wrong","feedback":"Permissive hypertension toward 220/120 is for ischemic stroke when no thrombolytic was given and nothing else demands treatment. After a thrombolytic the ceiling is 180/105. A patient heading into thrombectomy is not left at 220 either way."},{"id":"aspirin","label":"Aspirin 325 mg now, before the suite, so a stent has cover.","verdict":"wrong","critical":true,"feedback":"There is no stent yet. If a thrombolytic was given, an antiplatelet in the first hours adds bleeding risk before you know later imaging is safe. Do not give aspirin on the way to the suite."},{"id":"quiet","label":"Hourly checks are enough overnight if the groin looks fine.","verdict":"wrong","feedback":"The first hours after a thrombolytic are when hemorrhage declares itself. Fifteen-minute checks are the early schedule, not a routine ward round. Groin checks are added, not substituted."}]}]},{"id":"sah","title":"Subarachnoid hemorrhage","syndrome":"Thunderclap headache","minutes":"8 min","difficulty":"Core","available":true,"summary":"A thunderclap headache. Pick the first scan, click the blood, find the aneurysm, and manage the days after it is secured.","queued":"","clockLabel":"Since thunderclap","objectives":["Choose the first investigation","Click the subarachnoid blood","Find the aneurysm on CTA","Secure it, start nimodipine, and avoid hypotension","Recognize delayed cerebral ischemia"],"thumb":"sim/sah-ncct.jpg","patient":"R. Shah","ageSex":"52-year-old man","chart":["Teaching case. Not a real patient.","Thunderclap headache, maximal in seconds, while lifting a box. Vomited twice.","Onset two hours ago. Drowsy, photophobic, neck stiffness. No hemiparesis.","GCS 14 (eyes open to speech). Blood pressure 168/98. Heart rate 76.","No anticoagulant. No known polycystic kidney disease or prior aneurysm."],"opening":{"lkwMin":120,"status":"Thunderclap headache. Drowsy, neck stiffness.","sbp":168,"dbp":98,"hr":76,"rr":16,"spo2":98,"glucose":108,"gcs":"14"},"stages":[{"id":"first","skill":"Investigation","title":"What do you do first?","lead":"The headache peaked in seconds, he has vomited, and his neck is stiff. GCS is 14. This is a suspected subarachnoid hemorrhage until the scan says otherwise.","prompt":"Which investigation comes first?","hint":"In the first six hours, a non-contrast CT is extremely sensitive. A lumbar puncture is for when that CT is negative, not before it.","guideline":"Non-contrast head CT is the first test for suspected subarachnoid hemorrhage. Sensitivity is highest in the first six hours. Lumbar puncture is the next step only if the CT is negative and suspicion remains.","answer":"Non-contrast CT head","kind":"choice","successFinding":"Non-contrast CT obtained","successStatus":"Non-contrast CT done.","missYou":"","miss":"","choices":[{"id":"ncct","label":"Non-contrast CT of the head","verdict":"correct","feedback":"Within six hours of a thunderclap headache, non-contrast CT is the right first image and is highly sensitive for subarachnoid blood. You do not start with a needle, and you do not start with contrast.","finding":"Non-contrast CT obtained for thunderclap headache","status":"Non-contrast CT done."},{"id":"lp","label":"Lumbar puncture now, before any imaging","verdict":"wrong","critical":true,"feedback":"A puncture before imaging can miss a mass or hydrocephalus and is the wrong order. CT comes first. Puncture is reserved for a negative CT when you still suspect blood."},{"id":"cta","label":"CT angiography, without a non-contrast series","verdict":"wrong","delayMin":8,"feedback":"You will want an angiogram if blood is there, to look for an aneurysm. It is not the first series. Non-contrast CT is what shows the blood."},{"id":"mri","label":"MRI brain, because CT can miss small bleeds","verdict":"wrong","delayMin":40,"feedback":"MRI can help in delayed or CT-negative cases. Two hours into a thunderclap headache, it is slower than the test that already performs well. Start with non-contrast CT."}]},{"id":"click-blood","skill":"Localization","title":"Click the blood","lead":"The non-contrast CT is up at the level of the midbrain. Cerebrospinal fluid should be dark. A lot of it is not.","prompt":"Click acute subarachnoid blood.","hint":"Blood is the bright material in the cisterns and Sylvian fissures, wrapped around the midbrain. The midbrain itself is the dark circle in the center. Do not click that.","guideline":"On non-contrast CT, acute subarachnoid blood is hyperdense in the cisterns and fissures, where CSF should be dark. Distribution suggests, but does not prove, where an aneurysm sits. Hydrocephalus is judged on the ventricles, which this single low slice does not measure.","answer":"Bright blood in the basal cisterns or Sylvian fissures","image":{"src":"sim/sah-ncct.jpg","alt":"Teaching illustration of subarachnoid blood around the midbrain","caption":"Non-contrast CT, teaching illustration through the basal cisterns. Patient\u2019s left is marked L. Not a real scan."},"kind":"hotspot","successFinding":"Diffuse subarachnoid blood","successStatus":"Subarachnoid blood in the basal cisterns.","missYou":"Clicked off the blood","miss":"Acute blood is the bright cast in the cisterns and Sylvian fissures around the midbrain, not the skull and not the dark midbrain in the middle.","brightAssist":{"min":200,"x0":0.25,"y0":0.32,"x1":0.75,"y1":0.7,"you":"Bright subarachnoid blood","feedback":"That bright material is acute blood where CSF should be dark. It fills the basal cisterns and tracks into the Sylvian fissures. This is subarachnoid hemorrhage. The distribution is diffuse, which fits an aneurysmal source until angiography says otherwise."},"regions":[{"id":"anterior","verdict":"correct","cx":0.5,"cy":0.37,"rx":0.09,"ry":0.05,"you":"Blood in the anterior basal cisterns","feedback":"That bright star in front of the midbrain is acute subarachnoid blood, not contrast and not calcification. CSF in those cisterns should be dark. This is a subarachnoid hemorrhage."},{"id":"sylvian-r","verdict":"correct","cx":0.32,"cy":0.48,"rx":0.07,"ry":0.04,"you":"Blood in the right Sylvian fissure","feedback":"Blood is tracking into the Sylvian fissure. Together with the basal cisterns, this is diffuse subarachnoid hemorrhage. The next study looks for an aneurysm. It does not start with a lumbar puncture."},{"id":"sylvian-l","verdict":"correct","cx":0.68,"cy":0.48,"rx":0.07,"ry":0.04,"you":"Blood in the left Sylvian fissure","feedback":"That is blood in the Sylvian fissure, continuous with the cast around the midbrain. Diffuse subarachnoid hemorrhage. Angiography is next, not a thrombolytic and not a lumbar puncture."},{"id":"posterior","verdict":"correct","cx":0.5,"cy":0.64,"rx":0.08,"ry":0.06,"you":"Blood posterior to the midbrain","feedback":"Blood behind and below the midbrain is part of the same subarachnoid cast. One slice cannot locate the aneurysm. It can tell you the CT is positive, so the puncture is unnecessary."},{"id":"midbrain","verdict":"wrong","cx":0.5,"cy":0.5,"rx":0.06,"ry":0.05,"you":"Midbrain","feedback":"That dark circle is the midbrain. The blood is the bright material in the cisterns around it. Click the white star, not the gray center."}]},{"id":"read","skill":"Interpretation","title":"Name the syndrome","lead":"He is drowsy, GCS 14, with a stiff neck and no hemiparesis. The CT shows diffuse subarachnoid blood. This slice is too low to judge the size of the lateral ventricles.","prompt":"Which statement is right?","hint":"Grade the person and the scan separately. Hunt\u2013Hess 3 is drowsiness. A lumbar puncture is not required after a positive CT.","guideline":"A positive CT does not need a lumbar puncture to \u201cconfirm\u201d subarachnoid blood. Hunt\u2013Hess 3 is drowsiness or confusion. WFNS 2 is GCS 13\u201314 without a major focal deficit. Hydrocephalus is assessed on ventricular size and the clinical trajectory.","answer":"Diffuse SAH, Hunt\u2013Hess 3, no puncture required","kind":"choice","successFinding":"Diffuse SAH, Hunt\u2013Hess 3, WFNS 2","successStatus":"Aneurysmal SAH until angiography says otherwise.","missYou":"","miss":"","choices":[{"id":"grade","label":"Diffuse subarachnoid hemorrhage. Drowsy, so Hunt\u2013Hess 3, WFNS 2. No lumbar puncture. This slice does not clear him of hydrocephalus.","verdict":"correct","feedback":"The CT is positive, so a puncture adds risk and no diagnosis. Drowsiness puts him at Hunt\u2013Hess 3; GCS 14 without a focal deficit is WFNS 2. You still need a proper look at the ventricles, because hydrocephalus is what an external drain is for. The blood itself needs a vascular study.","finding":"Diffuse SAH. Hunt\u2013Hess 3. CT already diagnostic.","status":"Aneurysmal pattern until proven otherwise."},{"id":"lp","label":"Possible SAH. He still needs a lumbar puncture before you act.","verdict":"wrong","critical":true,"feedback":"A lumbar puncture is for a negative CT. His CT shows the blood. A needle now delays angiography and aneurysm repair."},{"id":"trauma","label":"This pattern is typical of trauma. No aneurysm search is needed.","verdict":"wrong","feedback":"He was lifting a box, not struck. Diffuse cisternal blood with a thunderclap headache is an aneurysm until CTA or catheter angiography excludes one. Trauma can put blood in the fissures, and the history does not support it."},{"id":"ischemia","label":"Early ischemic change. Consider thrombolysis.","verdict":"wrong","critical":true,"feedback":"This is blood, not ischemia. A thrombolytic is contraindicated. The bright material is in the cisterns, where CSF belongs."}]},{"id":"next","skill":"Decision","title":"What happens next?","lead":"The diagnosis is subarachnoid hemorrhage. He is protecting his airway. Blood pressure is 168/98. Neurosurgery and neurointerventional radiology are in the hospital.","prompt":"Choose the next step.","hint":"Find the aneurysm before you take him to repair it. Do not drop his pressure into the basement while you wait.","guideline":"CT angiography is the usual next study to look for an aneurysm. Securing the aneurysm, by coiling or clipping, is urgent. A common blood-pressure target before the aneurysm is secured is systolic under 160, without causing hypotension.","answer":"CTA to look for an aneurysm, and plan to secure it","kind":"choice","successFinding":"CTA planned to find the aneurysm","successStatus":"Going to CTA. Aneurysm securing to follow.","missYou":"","miss":"","choices":[{"id":"cta","label":"CT angiography now to look for an aneurysm, and plan urgent coiling or clipping once you know where it is.","verdict":"correct","feedback":"You need the anatomy before the repair. CTA is fast and, if it shows an aneurysm, the securing procedure can be planned the same day. While you wait, treat very high pressure \u2014 many units use a systolic target under 160 before the aneurysm is secured \u2014 and do not let him become hypotensive. Nimodipine is started, but it is not the substitute for closing the aneurysm.","finding":"CTA requested. Urgent securing planned.","status":"CTA next. Repair the same day if an aneurysm is found."},{"id":"or","label":"Straight to the operating room for clipping, without vascular imaging.","verdict":"wrong","feedback":"You do not know whether there is an aneurysm, or which vessel holds it. Blind exploration is not the next step. Image the vessels, then secure the lesion by the route that fits."},{"id":"lp","label":"Lumbar puncture to measure the opening pressure.","verdict":"wrong","critical":true,"feedback":"The diagnosis is already made. A puncture does not locate the aneurysm and can precipitate trouble if pressure relationships change. Angiography is the next test."},{"id":"bp","label":"Drop the systolic pressure to 100 with a nitroprusside infusion and observe overnight.","verdict":"wrong","critical":true,"feedback":"Aggressive hypotension threatens perfusion, especially if intracranial pressure is up. Observation overnight leaves a ruptured aneurysm unsecured. Image it and close it. Treat extreme hypertension. Do not chase a low normal."}]},{"id":"click-an","skill":"Localization","title":"Click the aneurysm","lead":"CTA maximum-intensity projection. Both middle cerebral arteries fill. Something in the anterior midline is not a normal vessel.","prompt":"Click the aneurysm sac.","hint":"Look in the anterior midline for a round outpouching on the anterior communicating artery. The branching trees to either side are patent middle cerebral arteries.","guideline":"An anterior communicating artery aneurysm is a common source of diffuse subarachnoid blood. The sac is secured by endovascular coiling or surgical clipping. The image localizes it. It does not finish the treatment.","answer":"Anterior communicating artery aneurysm","image":{"src":"sim/sah-cta.jpg","alt":"Teaching illustration of a CT angiogram with an anterior communicating artery aneurysm","caption":"CT angiography, teaching illustration of the circle of Willis. Patient\u2019s left is marked L. Not a real scan."},"kind":"hotspot","successFinding":"Anterior communicating artery aneurysm","successStatus":"AComm aneurysm. Plan to secure it today.","missYou":"Clicked off the sac","miss":"The aneurysm is the round sac in the anterior midline, larger than the vessel it arises from. The feathery trees to either side are normal middle cerebral branches.","regions":[{"id":"sac","verdict":"correct","cx":0.532,"cy":0.428,"rx":0.055,"ry":0.048,"you":"Anterior communicating artery aneurysm","feedback":"That round sac sits on the anterior communicating artery in the midline. It is larger than the parent vessel and explains diffuse subarachnoid blood. It needs securing today, by coiling or clipping, not a period of observation."},{"id":"mca-r","verdict":"wrong","cx":0.3,"cy":0.45,"rx":0.09,"ry":0.08,"you":"Right MCA branches","feedback":"Those are patent middle cerebral branches, not a sac. Come back to the midline, where a round outpouching sits on the anterior communicating artery."},{"id":"mca-l","verdict":"wrong","cx":0.7,"cy":0.45,"rx":0.09,"ry":0.08,"you":"Left MCA branches","feedback":"That tree fills and branches normally. The aneurysm is medial to it: a ball on the anterior communicating artery."},{"id":"basilar","verdict":"wrong","cx":0.5,"cy":0.72,"rx":0.1,"ry":0.07,"you":"Posterior circulation","feedback":"That is the posterior circulation, lower on the image. The sac is anterior and midline, between the two MCA trees."}]},{"id":"bundle","skill":"Treatment","title":"The first-day bundle","lead":"CTA shows an anterior communicating artery aneurysm. He remains GCS 14, blood pressure 168/98, airway intact. The ventricles, on the full CT, are not enlarged.","prompt":"What belongs in the plan today?","hint":"Secure the aneurysm. Start nimodipine. Keep him in a neurocritical bed. Do not flood him with fluid \u201cjust in case,\u201d and do not start a thrombolytic.","guideline":"Ruptured aneurysms are secured early. Enteral nimodipine 60 mg every 4 hours for 21 days reduces poor outcome from delayed cerebral ischemia. Prophylactic hypervolemia is not useful. Avoid hypotension, including hypotension caused by the nimodipine itself.","answer":"Secure the aneurysm today, nimodipine, neuro ICU, avoid hypotension","kind":"choice","successFinding":"Aneurysm securing, nimodipine, and ICU planned","successStatus":"Booked to secure the aneurysm. Nimodipine ordered.","missYou":"","miss":"","choices":[{"id":"bundle","label":"Secure the aneurysm today by coiling or clipping. Nimodipine 60 mg enterally every 4 hours. Neurocritical care. Treat a systolic pressure that stays above about 160 before securing, and do not let him go hypotensive.","verdict":"correct","feedback":"That is the first-day bundle. The aneurysm is the emergency. Nimodipine is started for 21 days and continued even after the procedure, but if it drops the pressure you reduce the dose or the interval rather than ignoring the blood pressure. A systolic target under about 160 is widely used until the sac is secured. Prophylactic hypervolemia is not part of this. No external drain tonight: the ventricles are not enlarged and he is not deteriorating from hydrocephalus.","finding":"Secure aneurysm today. Nimodipine started. Neuro ICU.","status":"Aneurysm unsecured. Nimodipine ordered. Pressure watched."},{"id":"observe","label":"Nimodipine and bed rest. Secure the aneurysm next week if he is still stable.","verdict":"wrong","critical":true,"feedback":"Rebleeding is the catastrophe you are trying to prevent, and the risk is front-loaded. Nimodipine does not close the aneurysm. Secure it today."},{"id":"triple","label":"Prophylactic hypervolemia, hypertension, and hemodilution, starting now.","verdict":"wrong","feedback":"Triple-H as prophylaxis is obsolete, and hypertension before the aneurysm is secured risks a rebleed. Secure the sac first. Give nimodipine. Keep him euvolemic. Induced hypertension is a later tool, for delayed ischemia, after the aneurysm is closed."},{"id":"evd","label":"Place an external ventricular drain now, even though the ventricles are small and he is stable.","verdict":"wrong","feedback":"A drain is for hydrocephalus or a declining patient whose ventricles explain the decline. His ventricles are not enlarged and his GCS is holding. An unnecessary drain is a source of infection and a possible pressure change across an unsecured aneurysm. Reassess if he drops."}]},{"id":"dci","skill":"Complication","title":"Day 7, a new deficit","lead":"The aneurysm was coiled on day 1. Nimodipine has continued. On day 7 he is abruptly weak in the right arm. A repeat CT shows no rebleed and no new hydrocephalus. He is febrile and a little dry on examination.","prompt":"What is this, and what do you change?","hint":"After the aneurysm is secured, a new deficit with a negative CT is delayed cerebral ischemia until proven otherwise. Fill him back to euvolemia and raise the pressure. Do not start a thrombolytic.","guideline":"Delayed cerebral ischemia is treated, after the aneurysm is secured, with euvolemia and induced hypertension. Prophylactic hypervolemia is not used. Nimodipine continues. A new CT must exclude rebleeding before the pressure is pushed up.","answer":"Delayed cerebral ischemia: euvolemia and induced hypertension","kind":"choice","successFinding":"Delayed cerebral ischemia treated with induced hypertension","successStatus":"Aneurysm secured. Pressure raised for delayed ischemia.","missYou":"","miss":"","choices":[{"id":"dci","label":"Delayed cerebral ischemia. The CT has excluded rebleeding. Restore euvolemia and induce hypertension. Continue nimodipine. No thrombolytic.","verdict":"correct","feedback":"Day 4 to 14 is the window for delayed cerebral ischemia. A negative CT makes rebleeding and hydrocephalus unlikely as the cause of this new weakness. The aneurysm is already coiled, so induced hypertension is allowed. Give volume if he is dry, then raise the pressure and watch the arm. Keep nimodipine going. Do not give a thrombolytic for a deficit that is not an embolus you have proven.","finding":"Day-7 deficit treated as delayed cerebral ischemia","status":"Induced hypertension for delayed cerebral ischemia."},{"id":"drop","label":"The deficit is hypertensive damage. Lower the systolic pressure to 110.","verdict":"wrong","critical":true,"feedback":"Dropping the pressure is the opposite of what a new ischemic deficit needs once the aneurysm is secured. Hypotension extends injury. The CT has already shown this is not a rebleed."},{"id":"lytic","label":"New arm weakness. Give tenecteplase for an ischemic stroke.","verdict":"wrong","critical":true,"feedback":"He had a subarachnoid hemorrhage a week ago. A thrombolytic is contraindicated. This time course, after a secured aneurysm, is delayed cerebral ischemia until you prove a different lesion."},{"id":"nimodipine-only","label":"Increase nimodipine and change nothing else. The weakness will pass.","verdict":"wrong","feedback":"Nimodipine is prevention he is already receiving. It is not the acute rescue for a new deficit. He needs euvolemia and induced hypertension, and a search for other causes if he does not turn around."}]}]},{"id":"ards","title":"ARDS","syndrome":"Hypoxemic respiratory failure","minutes":"10 min","difficulty":"Core","available":true,"summary":"Bilateral opacities and a failing non-rebreather. Read the film, set a safe tidal volume, and prone him before the oxygen gets worse.","queued":"","clockLabel":"Since first hypoxia","objectives":["Recognize impending respiratory failure","Click bilateral airspace opacity","Grade ARDS from the P/F ratio","Limit tidal volume and plateau pressure","Prone, then decompress a tension pneumothorax"],"thumb":"sim/ards-cxr.jpg","patient":"L. Okonkwo","ageSex":"58-year-old man","chart":["Teaching case. Not a real patient, and not a ventilator prescription.","Three days of fever and cough. Now unable to speak in sentences.","SpO2 84% on a non-rebreather. Respiratory rate 36. Accessory muscles.","No heart-failure history. No chest trauma. Temperature 38.7\u00b0C.","Height 175 cm. Predicted body weight about 71 kg. Weight on the scale is 92 kg.","Blood pressure 104/62. Heart rate 118. Glucose 142 mg/dL."],"opening":{"lkwMin":180,"status":"Failing a non-rebreather. Speaking in single words.","sbp":104,"dbp":62,"hr":118,"rr":36,"spo2":84,"glucose":142},"stages":[{"id":"first","skill":"Airway","title":"He is failing oxygen","lead":"Respiratory rate 36, oxygen saturation 84% on a non-rebreather, and he is using his neck muscles. The story is pneumonia, not chest pain and not trauma. The CT scanner is two floors away.","prompt":"What do you do first?","hint":"This is impending respiratory failure. A portable film and a blood gas can happen where he is. A CT pulmonary angiogram cannot.","guideline":"Hypoxemia with a high work of breathing is an airway problem before it is a diagnostic puzzle. Support him where he lies, and do not transport an exhausted patient for a scan you can defer.","answer":"Prepare the airway, portable chest radiograph, and an arterial blood gas","kind":"choice","successFinding":"Airway plan started. Portable film and blood gas requested.","successStatus":"Airway equipment open. Film and blood gas coming to the bedside.","missYou":"","miss":"","choices":[{"id":"bedside","label":"Stay at the bedside. Prepare to intubate. Portable chest radiograph and an arterial blood gas now. Do not travel to CT.","verdict":"correct","feedback":"He is exhausted and hypoxemic on a reservoir mask. The next minutes are oxygen, a plan to intubate, and tests that come to him. A pulmonary angiogram is a later question, after the airway is safe.","finding":"Intubation planned. Portable film and blood gas at the bedside.","status":"Airway equipment open. Still on the non-rebreather."},{"id":"ctpa","label":"CT pulmonary angiogram first. Pulmonary embolism has to be excluded before anything else.","verdict":"wrong","critical":true,"delayMin":25,"feedback":"Embolism is on the list. It is not the test you do while he is failing a non-rebreather two floors from the scanner. Secure the situation, then look for clot if the story still points there."},{"id":"diuretic","label":"Furosemide 80 mg for cardiogenic edema. No imaging until the urine flows.","verdict":"wrong","delayMin":20,"feedback":"There is no heart-failure history, and you have not seen the film. Diuresis before a radiograph treats a diagnosis you have not made and delays the airway."},{"id":"ward","label":"High-flow nasal oxygen and a ward bed. Recheck the saturation in four hours.","verdict":"wrong","critical":true,"delayMin":40,"feedback":"A saturation of 84% on a non-rebreather, with a rate of 36, is not a ward trial. High-flow can be a bridge in someone less spent. This man needs a clinician who can intubate standing next to him."}]},{"id":"click-opacity","skill":"Localization","title":"Click the abnormal lung","lead":"Portable radiograph, taken as if you are looking at him. The letter R is the patient\u2019s right. The apices are clearer than the bases. The central silhouette is not globular.","prompt":"Click acute airspace opacity.","hint":"Opacity is white lung in the mid and lower zones, on both sides. The cardiac silhouette is the central bulge. Do not click that, and do not stop at a relatively clear apex.","guideline":"ARDS needs bilateral opacities that are not fully explained by effusion, collapse, or nodules, together with a timing and a heart that fit. One film does not make the diagnosis. It starts it.","answer":"Bilateral mid and lower zone airspace opacity","image":{"src":"sim/ards-cxr.jpg","alt":"Teaching illustration of a portable chest radiograph with bilateral airspace opacities","caption":"Portable chest radiograph, teaching illustration. The patient\u2019s right is marked R, on the left of the image. Not a real film."},"kind":"hotspot","successFinding":"Bilateral mid and lower zone airspace opacities","successStatus":"Bilateral opacities. Heart size not enlarged. No pneumothorax seen.","missYou":"Clicked off the opacities","miss":"The dense white lung is in both mid and lower zones. The central bulge is the heart. The apices are the clearer part of the film.","regions":[{"id":"right-lung","verdict":"correct","cx":0.22,"cy":0.5,"rx":0.1,"ry":0.12,"you":"Opacity in the patient\u2019s right mid and lower zone","feedback":"That white lung is airspace opacity, on the side marked R. The same pattern is on the other side. The heart is not enlarged. This is the film of diffuse alveolar filling, not a single lobar pneumonia and not a pneumothorax."},{"id":"left-lung","verdict":"correct","cx":0.79,"cy":0.5,"rx":0.09,"ry":0.12,"you":"Opacity in the patient\u2019s left mid and lower zone","feedback":"That is airspace opacity on the patient\u2019s left. The right side matches it. Bilateral, mid and lower zone, with a normal-sized heart. You still need the gas and the cardiac story before you call it ARDS, but the film is not unilateral and it is not a collapsed lung."},{"id":"heart","verdict":"wrong","cx":0.51,"cy":0.52,"rx":0.09,"ry":0.1,"you":"Cardiac silhouette","feedback":"That central bulge is the heart, and it is not enlarged. The abnormal finding is the white lung on either side of it. A normal heart does not prove the edema is non-cardiogenic, but this click is not the opacity."},{"id":"apex","verdict":"close","cx":0.22,"cy":0.22,"rx":0.08,"ry":0.055,"you":"Relatively spared upper zone","feedback":"You are high, near the apex, where the lung is clearer. Come down into the mid and lower zone. That is where the film is white."}]},{"id":"read-film","skill":"Interpretation","title":"Read the radiograph","lead":"Same film. Use it for what it can say, and not for what it cannot.","prompt":"Which reading is right?","hint":"Look for three negatives: no visceral pleural line, no giant heart, and the disease is not confined to one lobe. Bilateral white lung is the positive.","guideline":"A portable film can show bilateral airspace disease and can exclude a large pneumothorax. It cannot, by itself, separate ARDS from cardiogenic edema. That takes the history, the gas, and usually an echocardiogram.","answer":"Bilateral alveolar opacities, normal heart size, no pneumothorax","image":{"src":"sim/ards-cxr.jpg","alt":"The same teaching chest radiograph","caption":"Same teaching illustration. Not a real film."},"kind":"choice","successFinding":"Film read as bilateral opacities without pneumothorax","successStatus":"Film: bilateral opacities, no pneumothorax, heart not enlarged.","missYou":"","miss":"","choices":[{"id":"bilateral","label":"Bilateral alveolar opacities. Heart size is not increased. No pneumothorax. This is not a complete explanation by itself.","verdict":"correct","feedback":"Both lungs are involved, the silhouette is not globular, and there is no dark rim of a pneumothorax. That pattern fits pneumonia with evolving ARDS. It does not prove the filling pressures are low. You still want the blood gas, and a bedside look at the heart before you commit the whole plan to diuretics.","finding":"Bilateral opacities. No pneumothorax. Heart not enlarged.","status":"Film read. Blood gas still needed."},{"id":"ptx","label":"Left tension pneumothorax. Decompress the chest before you do anything else.","verdict":"wrong","critical":true,"feedback":"A tension pneumothorax is a black lung, a shifted mediastinum, and a crashing patient. This film is white on both sides. A needle into that chest treats a disease he does not have."},{"id":"lobar","label":"Unilateral right-lower-lobe pneumonia. The other lung is clear.","verdict":"wrong","feedback":"Look again at the side opposite the R marker. It is white through the mid and lower zone as well. Calling this unilateral changes the treatment and the monitoring, and it is not what the film shows."},{"id":"chf","label":"A globular heart with florid cardiogenic edema. Stop the pneumonia treatment.","verdict":"wrong","feedback":"The heart is not globular, he has no failure history, and he is febrile with a cough. Cardiogenic edema stays on the list until an echocardiogram speaks, but this film is not a reason to abandon antibiotics."}]},{"id":"severity","skill":"Gas exchange","title":"Name the severity","lead":"He is intubated. PEEP is 10 cmH2O. FiO2 is 0.80. PaO2 is 88 mmHg. The hypoxemia began within a week of the pneumonia. A bedside echo does not show left-atrial hypertension as the sole cause.","prompt":"What is the P/F ratio, and how severe is this?","hint":"Divide PaO2 by FiO2 as a fraction, not a percent. 88 \u00f7 0.80 = 110. Severe is 100 or below. Moderate sits above 100 and up to 200. PEEP is already at least 5.","guideline":"The Berlin definition needs acute onset within a week, bilateral opacities, and respiratory failure not fully explained by heart failure or fluid overload. With PEEP at least 5, a P/F of 101\u2013200 is moderate and 100 or below is severe.","answer":"P/F 110, moderate ARDS","kind":"choice","atStart":{"rr":24,"spo2":92,"status":"Intubated. PEEP 10. Waiting on the P/F ratio."},"successFinding":"Moderate ARDS, P/F 110 on PEEP 10","successStatus":"Intubated. Moderate ARDS. P/F 110.","missYou":"","miss":"","choices":[{"id":"moderate","label":"P/F is 110. This is moderate ARDS. PEEP is already at least 5, and the timing and the heart fit.","verdict":"correct","rr":26,"spo2":93,"feedback":"88 divided by 0.80 is 110. Above 100, so not severe, and well below 200, so not mild. Moderate ARDS still kills people, and it still gets a lung-protective ventilator. The echo not showing isolated left-atrial hypertension is what lets you use the ARDS label rather than a pure diuretic plan.","finding":"Moderate ARDS. P/F 110 on PEEP 10 and FiO2 0.80.","status":"Intubated. Moderate ARDS. Oxygen saturation 93%."},{"id":"severe","label":"P/F is 110, so this is severe ARDS.","verdict":"wrong","feedback":"The arithmetic is right and the grade is not. Severe is a P/F of 100 or below. 110 is moderate. The treatments overlap, but the words you put in the note should match the cut-point."},{"id":"pao2","label":"The ratio is 88. Use the PaO2 and ignore the inspired oxygen.","verdict":"wrong","feedback":"PaO2 without FiO2 cannot be compared from one ventilator to the next. Divide by the FiO2 as a fraction. 88 / 0.80 is 110, not 88."},{"id":"not-ards","label":"A visible heart on the film means this cannot be ARDS. Treat it only as heart failure.","verdict":"wrong","critical":true,"feedback":"Every chest film has a heart. ARDS is excluded when cardiac failure or overload is the full explanation, not when a silhouette is visible. The echo does not support that explanation here."}]},{"id":"tv","skill":"Ventilation","title":"Set the tidal volume","lead":"Predicted body weight is 71 kg. His scale weight is 92 kg. He is sedated, synchronous, and you have not yet measured a plateau pressure. Height was 175 cm.","prompt":"What tidal volume do you order?","hint":"Use 6 mL per kilogram of predicted body weight, not the scale weight. 6 \u00d7 71 is about 420 mL. The old 10\u201312 mL/kg target is what the ARDSNet trial retired.","guideline":"For men, predicted body weight in kilograms is 50 + 0.91 \u00d7 (height in cm \u2212 152.4). Start near 6 mL/kg predicted body weight and limit plateau pressure to 30 cmH2O. Scale weight overestimates the lung in someone with a large body.","answer":"About 420 mL, which is 6 mL/kg predicted body weight","kind":"choice","successFinding":"Tidal volume set near 6 mL/kg predicted body weight","successStatus":"Volume control, about 420 mL. Plateau not yet measured.","missYou":"","miss":"","choices":[{"id":"six","label":"Volume-targeted breaths of about 420 mL, 6 mL/kg predicted body weight. Set the rate for the pH. Pair FiO2 and PEEP.","verdict":"correct","feedback":"Predicted weight, not 92 kg. For 175 cm the male formula gives about 71 kg, and 6 mL/kg is about 426 mL, reasonably ordered as 420. You will still measure plateau pressure. A higher rate keeps the pH tolerable when the volume is small. Do not use his scale weight or you will ventilate him at an ARDSNet tidal volume in name only.","finding":"Tidal volume about 420 mL (6 mL/kg predicted body weight).","status":"Lung-protective volume set. Plateau still to measure."},{"id":"twelve","label":"800 mL, about 12 mL/kg predicted body weight, so the carbon dioxide normalizes.","verdict":"wrong","critical":true,"feedback":"That is the volume the low-tidal-volume trial showed was harmful. A normal CO2 is not the goal. A plateau of 30 or less, and a pH you can live with, is the goal. 800 mL is nearly twice the starting volume."},{"id":"actual","label":"550 mL, because 6 mL/kg of his 92 kg scale weight is the right denominator.","verdict":"wrong","feedback":"Predicted body weight estimates lung size from height and sex. His scale weight includes tissue that does not add alveoli. 6 mL/kg of 92 kg is about 550 mL, and that is too much for a 71 kg predicted weight. Use 420 mL."},{"id":"ps","label":"Pressure support of 10 cmH2O immediately, with no set tidal volume.","verdict":"partial","feedback":"Pressure support is a weaning mode. In early ARDS you want a guaranteed small volume and a measured plateau. You can support his breaths later, once the lung is safer and he is waking.","finding":"Pressure support chosen early, without a set protective volume.","status":"On pressure support. Volume not guaranteed."}]},{"id":"pplat","skill":"Mechanics","title":"The plateau is 32","lead":"Tidal volume is 420 mL. PEEP is 10. FiO2 is 0.70. An end-inspiratory pause gives a plateau of 32 cmH2O. The peak is 40. He is not biting the tube, and there is no sudden change in the waveform.","prompt":"What do you change?","hint":"Plateau is the pressure to keep at or under 30, not the peak. Driving pressure here is plateau minus PEEP, 22 cmH2O, which is high. Lower the volume toward 4 mL/kg and raise the rate. Recheck the plateau.","guideline":"Keep plateau pressure at or below 30 cmH2O. If it is over 30 at 6 mL/kg, drop the tidal volume toward 4 mL/kg predicted body weight and increase the rate, aiming to keep pH at or above about 7.20. Driving pressure (plateau minus PEEP) is kept as low as the gas exchange allows.","answer":"Lower the tidal volume until the plateau is 30 or less","kind":"choice","successFinding":"Tidal volume reduced for a plateau of 32","successStatus":"Volume coming down. Plateau to be rechecked.","missYou":"","miss":"","choices":[{"id":"lower","label":"Lower the tidal volume toward 4 mL/kg predicted body weight, raise the rate, accept a higher CO2 if the pH stays about 7.20 or better, and recheck the plateau.","verdict":"correct","feedback":"32 is over the limit, and the driving pressure of 22 (32 minus a PEEP of 10) agrees that the volume is too big for this lung. Peak pressure includes the tube and the airways. The pause pressure is the one you act on. Come down toward 4 mL/kg, about 280 mL, and measure again. Do not chase a normal CO2.","finding":"Tidal volume reduced because plateau was 32.","status":"Volume lowered. Awaiting a repeat plateau."},{"id":"peak","label":"Treat the peak of 40 with bronchodilators and a larger tidal volume.","verdict":"wrong","feedback":"The peak is 8 above the plateau, which is an ordinary gap from the tube and the large airways, not bronchospasm as the main problem. A larger volume will push the plateau further past 30."},{"id":"peep","label":"Raise PEEP to 18 to fix the oxygen, and do not remeasure the plateau.","verdict":"wrong","critical":true,"feedback":"More PEEP on top of a plateau of 32 can push end-inspiratory pressure into unsafe territory, and it can drop the blood pressure. If you change PEEP, you remeasure the plateau. The number in front of you is a volume problem."},{"id":"ignore","label":"32 is close enough to 30. Leave the ventilator and check it tomorrow.","verdict":"wrong","feedback":"The limit is a limit. A plateau of 32 at 6 mL/kg is the signal to reduce the volume now, not on the next day\u2019s round."}]},{"id":"prone","skill":"Rescue","title":"The oxygen is still poor","lead":"After the smaller volume, plateau is 27 and driving pressure is 15 on a PEEP of 12. FiO2 is still 0.80. PaO2 is 84 mmHg, so the P/F ratio is 105. He has been optimized for an hour. No unstable spine, no open abdomen, no raised intracranial pressure.","prompt":"What is the next move for this oxygen?","hint":"A P/F that stays under 150 after a real optimization is the prone-positioning threshold used in the trial that changed mortality. Sixteen hours or more. ECMO is a rescue if prone ventilation fails, not a substitute for turning him.","guideline":"Prone positioning for 16 hours or longer is recommended for moderate-to-severe ARDS when the P/F ratio stays below 150 on FiO2 of at least 0.6 after optimization. Venovenous ECMO is considered when hypoxemia remains refractory, including to prone ventilation, in a patient without contraindications.","answer":"Prone positioning for at least 16 hours","kind":"choice","successFinding":"Prone ventilation planned for 16 hours","successStatus":"Being turned prone. Lung-protective volume continues.","missYou":"","miss":"","choices":[{"id":"prone","label":"Turn him prone for at least 16 hours. Keep the low tidal volume. Let the ECMO service know he exists, without cannulating him instead of turning him.","verdict":"correct","feedback":"P/F 105 on FiO2 0.80, after you have already fixed the volume and the plateau, is the patient prone positioning was built for. The session is long, 16 hours or more, not a brief turn to \u201csee if the saturation likes it.\u201d ECMO is the conversation you have if he stays refractory in the prone position, or if he cannot be turned. It is not the first rescue today.","finding":"Prone session of at least 16 hours.","status":"Prone. Protective ventilation continues."},{"id":"ecmo","label":"Cannulate for venovenous ECMO now. Prone positioning is optional.","verdict":"wrong","feedback":"ECMO is a rescue with its own bleeding and cannula risks. He has no contraindication to prone ventilation, and he has not had it. Turn him first, in a unit that knows how."},{"id":"steroid","label":"Give a steroid and leave him supine. That is the intervention that matters.","verdict":"wrong","feedback":"Corticosteroids are a separate, protocol-specific decision and they do not replace prone ventilation when the P/F ratio is under 150. Staying supine leaves the proven positional treatment unused."},{"id":"ino","label":"Start inhaled epoprostenol and do not prone him.","verdict":"partial","feedback":"An inhaled pulmonary vasodilator can buy oxygen for a few hours. It has not been shown to do what prone positioning does for survival. Use it as a bridge if you must, not as a reason to stay supine.","finding":"Inhaled vasodilator chosen instead of prone positioning.","status":"Still supine. Adjunct inhaled therapy only."}]},{"id":"ptx","skill":"Complication","title":"He crashes prone","lead":"Four hours into the prone session the saturation falls to 78%. On volume control the peak pressure jumps from 36 to 58. Blood pressure is 78/40. One side of the chest is silent and drum-like, and the trachea is shifted. This is new.","prompt":"What do you do in the next minute?","hint":"New high pressure, hypotension, and a silent chest on a ventilator is tension pneumothorax until you have treated it. More PEEP makes tension worse. A radiograph is for a patient who can wait. He cannot.","guideline":"Tension pneumothorax on positive pressure is a clinical diagnosis. Decompress the chest immediately, then place a definitive drain. Increasing PEEP or waiting for imaging in a hypotensive patient delays the only useful action.","answer":"Decompress the chest now. Do not increase PEEP.","kind":"choice","atStart":{"sbp":78,"dbp":40,"spo2":78,"rr":28,"status":"Prone. Sudden desaturation, high airway pressure, hypotensive."},"successFinding":"Tension pneumothorax decompressed","successStatus":"Chest decompressed. Pressure recovering.","missYou":"","miss":"","choices":[{"id":"decompress","label":"Call for help. Decompress the silent side now, then place a drain. Do not raise PEEP. A film can follow once the pressure returns.","verdict":"correct","sbp":98,"dbp":60,"spo2":92,"feedback":"A sudden jump in airway pressure, a falling blood pressure, and a silent hyper-resonant chest is tension physiology. Positive pressure will keep filling the pleural air until you open the chest. Finger or needle decompression, then a drain. Confirm later with a film and with the ventilator, which should accept the volume again. Do not pull the endotracheal tube for a problem that started hours after a stable intubation.","finding":"Clinical tension pneumothorax. Chest decompressed.","status":"Decompressed. Blood pressure 98/60. Saturation recovering."},{"id":"peep","label":"FiO2 1.0 and PEEP 16. The ARDS has worsened, or the tube has migrated.","verdict":"wrong","critical":true,"feedback":"More PEEP in tension pneumothorax inflates the pleural air and drops the venous return further. A tube that has been fine for hours does not suddenly explain a unilateral silent chest and a shifted trachea. Open the chest."},{"id":"extubate","label":"Pull the endotracheal tube. This has to be an esophageal intubation.","verdict":"wrong","critical":true,"feedback":"Esophageal intubation declares itself at the start, with no end-tidal CO2 and no chest movement, not four hours into a prone session that was ventilating. Pulling the tube now removes the airway from a hypoxic patient whose problem is pleural."},{"id":"film","label":"Wait for a portable radiograph before anyone puts a needle in the chest.","verdict":"wrong","delayMin":8,"feedback":"A film is the right confirmation when the blood pressure can tolerate the wait. 78 systolic with a silent chest cannot. Decompress, then radiograph the drain you have just placed."}]}]},{"id":"shock","title":"Septic shock","syndrome":"Undifferentiated shock","minutes":"9 min","difficulty":"Core","available":true,"summary":"Fever, a urinary source, and a pressure of 78. Read the echo, start norepinephrine, and know when to stop the fluid.","queued":"","clockLabel":"Since hypotension","objectives":["Start the first-hour sepsis bundle","Click an underfilled left ventricle","Separate distributive shock from cardiogenic and obstructive shock","Add vasopressin when norepinephrine climbs","Stop fluid once the cava is plethoric"],"thumb":"sim/shock-plax.jpg","patient":"A. Mendes","ageSex":"64-year-old woman","chart":["Teaching case. Not a real patient, and not a prescription.","Two days of dysuria and fever. Found confused at home.","Blood pressure 78/44. Heart rate 128. Lactate 5.4 mmol/L. Mottled knees.","Temperature 39.1\u00b0C. Lungs clear. Weight 80 kg. No chest pain.","Penicillin as a child caused a rash, not anaphylaxis, not swelling.","Glucose 186 mg/dL. Oxygen saturation 96% on 2 liters."],"opening":{"lkwMin":40,"status":"Febrile, confused, mottled. Mean pressure about 55.","sbp":78,"dbp":44,"hr":128,"rr":26,"spo2":96,"glucose":186,"gcs":"14"},"stages":[{"id":"first","skill":"Recognition","title":"The pressure is 78","lead":"She has a urinary story, a fever, a lactate of 5.4, and a mean arterial pressure around 55. The CT scanner is free. So is a bag of saline. Antibiotics are not in yet.","prompt":"What belongs in the first hour?","hint":"Cultures, an antibiotic that covers pyelonephritis, norepinephrine because the pressure is already this low, some crystalloid, and a bedside look at the heart. CT can wait. Dopamine is not the first vasopressor.","guideline":"Septic shock is infection plus vasopressors to keep the mean pressure at 65, with a lactate above 2. Antibiotics start immediately. Norepinephrine is first-line. A lactate is repeated. Imaging that delays the drug is the wrong sequence.","answer":"Cultures, antibiotics, norepinephrine, crystalloid, and a bedside cardiac view","kind":"choice","successFinding":"Sepsis bundle started. Bedside echo planned.","successStatus":"Cultures drawn. Antibiotic and norepinephrine being mixed.","missYou":"","miss":"","choices":[{"id":"bundle","label":"Blood cultures, then a parenteral antibiotic for pyelonephritis immediately. Start norepinephrine for this pressure. Begin crystalloid. Look at the heart with ultrasound before you commit to liters.","verdict":"correct","feedback":"Mean pressure in the mid-50s does not wait for a fluid challenge to finish. Norepinephrine is the first vasopressor. The antibiotic is for the likely urinary source and it goes in now. A childhood penicillin rash is not anaphylaxis and is not a reason to delay; if you avoid penicillin, pick another effective drug rather than waiting for an allergy clinic. Ultrasound stops you giving fluid to a heart that cannot take it. CT is for when she can travel.","finding":"Antibiotics and norepinephrine started. Echo next.","status":"Bundle underway. Still mottled. Echo not yet seen."},{"id":"fluid-only","label":"Three liters of saline and a CT of the abdomen. No vasopressor until the fluid is in and the scan is done.","verdict":"wrong","critical":true,"delayMin":35,"feedback":"A mean pressure of 55 during a long infusion and a trip to CT is time spent under-perfused. Start norepinephrine in parallel with the first fluid. Scan later, unless a surgeon already has a reason to open her."},{"id":"dopamine","label":"Dopamine as the first vasopressor, because the heart rate should be driven higher.","verdict":"wrong","feedback":"Her rate is already 128. Dopamine causes more arrhythmia than norepinephrine and is not the first-line agent in septic shock.
