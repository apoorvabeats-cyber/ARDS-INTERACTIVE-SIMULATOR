e":"A low ADAMTS13 confirms TTP. Plasma exchange continues. Newer adjuncts are added by the specialist team. They do not replace today's exchange.","answer":"Keep exchanging. Adjuncts do not replace it","kind":"choice","successFinding":"Diagnosis confirmed","successStatus":"ADAMTS13 low. Exchange continues.","missYou":"Not that decision","miss":"Nothing that stops the exchange. The result confirms you were right. Rituximab or caplacizumab is a specialist addition, not a substitute, and not a reason to pause today.","choices":[{"id":"ok","label":"Continue exchange. Let specialists add an adjunct. Do not pause today","verdict":"correct","feedback":"Confirmation is not graduation from the treatment.","finding":"Diagnosis confirmed","status":"ADAMTS13 low. Exchange continues."},{"id":"w0","label":"Stop exchange. The fancy drug can take over","verdict":"wrong","feedback":"The fancy drug is an adjunct."},{"id":"w1","label":"Platelets, now that you are sure","verdict":"wrong","feedback":"Being sure makes platelets more clearly wrong."},{"id":"w2","label":"Antibiotics for the low enzyme","verdict":"wrong","feedback":"The enzyme is not an infection."}]},{"id":"c9","skill":"Reassessment","title":"She is more awake. Platelets are 40","lead":"Day 4. She speaks more clearly. LDH is falling. Platelets are 40. Creatinine is improving.","prompt":"Do you stop?","hint":"Not yet. Continue until the response is sustained. Do not discharge. Do not give platelets to push the count over 150.","guideline":"Exchange continues until the platelet count and the hemolysis have clearly turned and stayed turned. One better morning is not a stop.","answer":"Continue until the response holds","kind":"choice","successFinding":"Response, not recovery","successStatus":"Awake. Still exchanging.","missYou":"Not that decision","miss":"Not yet. Continue until the response is sustained. Do not discharge. Do not give platelets to push the count over 150.","choices":[{"id":"ok","label":"Keep the daily exchange until the rise is sustained","verdict":"correct","feedback":"Stopping at 40 is how she is back at 11.","finding":"Response, not recovery","status":"Awake. Still exchanging."},{"id":"w0","label":"Stop and discharge today","verdict":"wrong","feedback":"40 and one clearer morning is not a sustained remission."},{"id":"w1","label":"Platelets to reach 150 by the weekend","verdict":"wrong","feedback":"The count has to rise because the disease stopped, not because you infused the problem."},{"id":"w2","label":"Aspirin so the platelets do not clot","verdict":"wrong","feedback":"Aspirin is not the emergency drug here, and the count is still low."}]},{"id":"c10","skill":"Reassessment","title":"The count holds and LDH is near normal","lead":"Several days later the platelets are over 150 and the LDH has normalised. She is ready for the exchanges to be spaced.","prompt":"What is the stop, and what is it not?","hint":"Space and then stop the exchanges under the hematology plan. It is not a platelet transfusion holiday, and it is not heparin.","guideline":"A sustained response is when exchanges are tapered. Follow-up is hematology. The relapse plan is not a bag of platelets.","answer":"Taper the exchanges with hematology","kind":"choice","successFinding":"Exchanges tapered","successStatus":"Count held. LDH settled.","missYou":"Not that decision","miss":"Space and then stop the exchanges under the hematology plan. It is not a platelet transfusion holiday, and it is not heparin.","choices":[{"id":"ok","label":"Taper the exchanges. Do not finish with a platelet transfusion","verdict":"correct","feedback":"She recovered because the plasma was replaced. Keep that logic to the end.","finding":"Exchanges tapered","status":"Count held. LDH settled."},{"id":"w0","label":"One last platelet transfusion to be safe","verdict":"wrong","feedback":"There is no bleeding. There is a recovered count."},{"id":"w1","label":"Lifelong daily exchange at home","verdict":"wrong","feedback":"Taper is the point of a sustained response."},{"id":"w2","label":"Heparin on discharge","verdict":"wrong","feedback":"This was not a heparin-indication clot."}]}]},{"id":"ulcer","title":"Duodenal ulcer","syndrome":"Non-variceal bleed","minutes":"14 min","difficulty":"Core","available":true,"summary":"Hematemesis, and no known varices. The endoscope shows an ulcer with a flat pigmented spot. A proton-pump inhibitor, not the variceal bundle.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/ulcer.jpg","patient":"Vomiting blood for two hours","ageSex":"57-year-old man","chart":["Teaching case. Not a prescription.","No known liver disease. Hemoglobin 8.2 g/dL. Urea 48 mg/dL. Taking ibuprofen for a week."],"opening":{"lkwMin":40,"status":"Pale. Fresh blood in the vomit.","sbp":98,"dbp":62,"hr":114,"rr":20,"spo2":98,"glucose":112,"gcs":"E4 V5 M6"},"stages":[{"id":"resus","skill":"Resuscitation","title":"Before the picture","lead":"He is tachycardic and still vomiting blood. The endoscope is being set up.","prompt":"What do you do first?","hint":"Access, blood, and a restrictive transfusion. Do not treat every hematemesis as varices.","guideline":"Non-variceal bleeding is resuscitated to a hemoglobin around 7 g/dL, and scoped. Terlipressin and a balloon are for varices.","answer":"Access, blood, restrictive transfusion, endoscopy","kind":"choice","successFinding":"Resuscitation started","successStatus":"Blood requested. Endoscopy being opened.","missYou":"Not that plan","miss":"Access and blood. A litre of saline is not a transfusion, and the variceal bundle is the wrong disease.","choices":[{"id":"blood","label":"Two large cannulae, crossmatch, and transfuse toward a hemoglobin of 7. Endoscopy today, sooner if he stays unstable.","verdict":"correct","feedback":"Restrictive transfusion, and a scope while he is still bleeding. Not a target of 10.","finding":"Access and blood","status":"Blood on the way. Endoscopy opened."},{"id":"saline","label":"Two litres of saline and no blood","verdict":"wrong","feedback":"Saline does not carry oxygen. He is bleeding.","critical":true},{"id":"varix","label":"Terlipressin and a balloon, and cancel the endoscopy, because every hematemesis is variceal","verdict":"wrong","feedback":"He has no known varices. The endoscope is how you find out. A balloon is not a treatment for an ulcer.","critical":true},{"id":"ten","label":"Transfuse until the hemoglobin is 10, then scope tomorrow","verdict":"wrong","feedback":"A target of 10 is too high, and tomorrow is too late while he is still vomiting blood."}]},{"id":"click","skill":"Localization","title":"Click the ulcer","lead":"The endoscope is in the duodenum. One small crater has a flat pigmented spot. The lower field is bubbles.","prompt":"Click the ulcer crater.","hint":"The pigmented spot is the crater, above the bubbles.","guideline":"A flat pigmented spot is a low-risk stigma. It is not a varix and it is not a spurting vessel.","answer":"Ulcer with a flat pigmented spot","image":{"src":"sim/cases/ulcer.jpg","alt":"Endoscopy. A duodenal ulcer with a flat pigmented spot.","caption":"Duodenal ulcer with a flat pigmented spot."},"kind":"hotspot","successFinding":"Pigmented ulcer spot","successStatus":"The crater is the finding.","missYou":"Clicked off the crater","miss":"The ulcer is the small pigmented crater. The bubbles are air in the lumen.","regions":[{"id":"crater","verdict":"correct","cx":0.42,"cy":0.445,"rx":0.08,"ry":0.065,"you":"Pigmented ulcer crater","feedback":"That flat pigmented spot is the ulcer. It is not spurting."},{"id":"bubbles","verdict":"wrong","cx":0.48,"cy":0.78,"rx":0.18,"ry":0.12,"you":"Bubbles in the lumen","feedback":"Those are bubbles. The ulcer is the pigmented crater above them."}]},{"id":"name","skill":"Diagnosis","title":"Name the bleed","lead":"You are looking at a duodenal ulcer with a flat pigmented spot.","prompt":"What is this?","hint":"Peptic ulcer. Not varices.","guideline":"Forrest IIc is a flat pigmented spot. Active bleeding, a visible vessel, and an adherent clot are the stigmata that need endoscopic therapy.","answer":"Peptic ulcer, flat pigmented spot","kind":"choice","successFinding":"Ulcer named","successStatus":"Proton-pump inhibitor being drawn.","missYou":"Not that lesion","miss":"It is an ulcer with a flat pigmented spot, not a varix.","choices":[{"id":"ulcer","label":"Duodenal ulcer with a flat pigmented spot. Not varices.","verdict":"correct","feedback":"The spot is flat. It is not a column, and it is not a spurting artery.","finding":"Non-variceal ulcer","status":"Ulcer, not varices."},{"id":"varix","label":"Esophageal varices. Start terlipressin and cancel the proton-pump inhibitor.","verdict":"wrong","feedback":"There is no varix on this view. The variceal bundle does not treat an ulcer.","critical":true},{"id":"mw","label":"A Mallory-Weiss tear. No drug, and home.","verdict":"wrong","feedback":"A tear is a mucosal split, not a crater with a pigmented spot."},{"id":"nose","label":"Swallowed nosebleed. The mucosa is normal.","verdict":"wrong","feedback":"The crater is real."}]},{"id":"ppi","skill":"Treatment","title":"What runs now?","lead":"The stigma is a flat pigmented spot. He is no longer pouring blood.","prompt":"Which treatment matches this finding?","hint":"A proton-pump inhibitor. Endoscopic therapy is for spurting, a visible vessel, or a clot, which this still does not show.","guideline":"A flat pigmented spot is managed with a proton-pump inhibitor. Banding and terlipressin treat varices.","answer":"Proton-pump inhibitor","kind":"choice","successFinding":"Proton-pump inhibitor","successStatus":"Inhibitor running.","missYou":"Not that drug","miss":"A proton-pump inhibitor. Do not band a pigmented spot, and do not start terlipressin for an ulcer.","choices":[{"id":"ppi","label":"Intravenous proton-pump inhibitor. No band, and no terlipressin.","verdict":"correct","feedback":"This spot does not need a band. Acid suppression is the drug.","finding":"Proton-pump inhibitor","status":"Inhibitor running. Watching the hemoglobin.","sbp":104,"hr":100},{"id":"band","label":"Band the spot, as if it were a varix","verdict":"wrong","feedback":"A band is for a varix. This is an ulcer."},{"id":"terli","label":"Terlipressin as the main plan, and no proton-pump inhibitor","verdict":"wrong","feedback":"Terlipressin is the variceal drug. This bleed is an ulcer.","critical":true},{"id":"surg","label":"Immediate gastrectomy","verdict":"wrong","feedback":"Surgery is not the first act for a flat pigmented spot."}]},{"id":"re","skill":"Reassessment","title":"The hemoglobin is 6.6, and the melena continues","lead":"An hour later he is still tachycardic. The inhibitor is running.","prompt":"What do you change?","hint":"Transfuse toward 7, keep the inhibitor, and repeat the endoscopy if bleeding continues.","guideline":"Ongoing non-variceal bleeding goes back to endoscopy. A balloon does not tamponade a duodenal ulcer.","answer":"Transfuse and repeat endoscopy if it continues","kind":"choice","successFinding":"Transfusion repeated","successStatus":"Still in the department. Endoscopy recalled.","missYou":"Not that response","miss":"Blood toward 7, the inhibitor stays, and the scope comes back if he keeps bleeding.","choices":[{"id":"again","label":"Transfuse toward 7, keep the proton-pump inhibitor, and repeat endoscopy if the bleeding continues","verdict":"correct","feedback":"The threshold stays near 7. Ongoing bleeding is a reason to look again, not a reason for a balloon.","finding":"Repeat endoscopy planned","status":"Transfused. Scope on standby.","sbp":100,"hr":108},{"id":"twelve","label":"Transfuse to a hemoglobin of 12 so the ulcer seals","verdict":"wrong","feedback":"Twelve is not the target. It does not seal an ulcer."},{"id":"balloon","label":"Place a balloon tamponade tube","verdict":"wrong","feedback":"A balloon is a bridge for varices, not a treatment for this ulcer.","critical":true},{"id":"stop","label":"Stop the proton-pump inhibitor because the first scope already saw a spot","verdict":"wrong","feedback":"The inhibitor is the treatment for this stigma. Stopping it does not help."}]},{"id":"c6","skill":"Reassessment","title":"The second endoscopy looks the same","lead":"Hemoglobin is 7.8 after the transfusion and has stopped falling. The repeat look shows the same flat pigmented spot. It is not spurting and there is no visible vessel.","prompt":"Do you band it, operate, or stay with the proton-pump inhibitor?","hint":"Stay with the proton-pump inhibitor. Do not band a peptic spot. Do not operate on a stable pigmented spot.","guideline":"A flat pigmented spot does not need endoscopic therapy the way a spurting vessel does. Surgery is for bleeding you cannot stop.","answer":"Proton-pump inhibitor. No band. No operation","kind":"choice","successFinding":"Same spot. Drugs continued","successStatus":"Stable hemoglobin. No operation.","missYou":"Not that decision","miss":"Stay with the proton-pump inhibitor. Do not band a peptic spot. Do not operate on a stable pigmented spot.","choices":[{"id":"ok","label":"Continue the proton-pump inhibitor. Do not band it and do not operate","verdict":"correct","feedback":"The second look agreed with the first. The treatment does not escalate to a varix bundle.","finding":"Same spot. Drugs continued","status":"Stable hemoglobin. No operation."},{"id":"w0","label":"Band the spot","verdict":"wrong","feedback":"Bands are for varices."},{"id":"w1","label":"Gastrectomy tonight","verdict":"wrong","feedback":"He is stable. The spot is not spurting."},{"id":"w2","label":"Terlipressin, in case they were wrong","verdict":"wrong","feedback":"Two looks have said ulcer."}]},{"id":"c7","skill":"Reassessment","title":"Hemoglobin stays at 8","lead":"No more melena. Heart rate is 84. Blood pressure is 120. He asks if he needs another unit so the number is 10.","prompt":"Do you transfuse to 10?","hint":"No. He is stable at 8. The restrictive threshold stands.","guideline":"A stable patient after a peptic bleed is not transfused to a normal hemoglobin. The threshold remains about 7, and he is above it and well.","answer":"No further transfusion","kind":"choice","successFinding":"Restrictive target kept","successStatus":"Stable. No bleeding.","missYou":"Not that decision","miss":"No. He is stable at 8. The restrictive threshold stands.","choices":[{"id":"ok","label":"Do not transfuse a stable hemoglobin of 8","verdict":"correct","feedback":"The extra unit is a risk, not a comfort.","finding":"Restrictive target kept","status":"Stable. No bleeding."},{"id":"w0","label":"Two units, to reach 10","verdict":"wrong","feedback":"That was the wrong target at the start. It is still wrong."},{"id":"w1","label":"Transfuse and operate, to be finished","verdict":"wrong","feedback":"He is finished. The bleeding has stopped."},{"id":"w2","label":"Stop the proton-pump inhibitor so the number can recover","verdict":"wrong","feedback":"The drug is why the spot stays quiet."}]},{"id":"c8","skill":"Reassessment","title":"He has been taking ibuprofen","lead":"The chart already says a week of ibuprofen for a bad knee. The knee still hurts. He wants the same tablets.","prompt":"What do you stop?","hint":"Stop the ibuprofen. Offer a different analgesic that is not a non-steroidal. Do not restart it with a stomach-protection myth as the only plan.","guideline":"Non-steroidal anti-inflammatory drugs caused this ulcer. They stop. A proton-pump inhibitor does not make them safe tonight.","answer":"Stop ibuprofen","kind":"choice","successFinding":"Ibuprofen stopped","successStatus":"Bleed controlled. Drug stopped.","missYou":"Not that decision","miss":"Stop the ibuprofen. Offer a different analgesic that is not a non-steroidal. Do not restart it with a stomach-protection myth as the only plan.","choices":[{"id":"ok","label":"Stop the ibuprofen. Use a different analgesic","verdict":"correct","feedback":"The precipitant is in his pocket. Take it out.","finding":"Ibuprofen stopped","status":"Bleed controlled. Drug stopped."},{"id":"w0","label":"Continue ibuprofen with a double proton-pump inhibitor","verdict":"wrong","feedback":"The bleed is one day old. The drug goes.","critical":true},{"id":"w1","label":"A steroid for the knee","verdict":"wrong","feedback":"A steroid is not a kindness to a fresh ulcer either."},{"id":"w2","label":"Nothing. Pain is not your specialty","verdict":"wrong","feedback":"The painkiller is why he is in the bed."}]},{"id":"c9","skill":"Reassessment","title":"When do you test for Helicobacter?","lead":"He is stable and eating. The proton-pump inhibitor is intravenous. Biopsies were not taken at the emergency look.","prompt":"What is the timing?","hint":"Test, but know a test on a high-dose inhibitor can be a false negative. Do not stop the inhibitor on day 1 to get a pretty test. Treat or retest when the timing is valid.","guideline":"Helicobacter testing matters, and so does not stopping the inhibitor during an acute bleed. A negative test on day 1 of intravenous inhibitor is not a reliable negative.","answer":"Do not stop the inhibitor for the test","kind":"choice","successFinding":"Test planned properly","successStatus":"Eating. Inhibitor continued.","missYou":"Not that decision","miss":"Test, but know a test on a high-dose inhibitor can be a false negative. Do not stop the inhibitor on day 1 to get a pretty test. Treat or retest when the timing is valid.","choices":[{"id":"ok","label":"Keep the inhibitor. Arrange a test that will not be a false negative","verdict":"correct","feedback":"The emergency is the bleed. The bacterium can be found without stopping the drug that just saved him.","finding":"Test planned properly","status":"Eating. Inhibitor continued."},{"id":"w0","label":"Stop the inhibitor tonight so the breath test works in the morning","verdict":"wrong","feedback":"The ulcer is hours old.","critical":true},{"id":"w1","label":"Never test. Ulcers are all painkillers","verdict":"wrong","feedback":"Both can be true. The bacterium still matters."},{"id":"w2","label":"Triple therapy and no inhibitor","verdict":"wrong","feedback":"The inhibitor is the bleed treatment. The antibiotic course is additional, not a swap."}]},{"id":"c10","skill":"Reassessment","title":"He has been stable for a day","lead":"No melena, heart rate normal, hemoglobin unchanged, eating.","prompt":"What is a safe leaving plan?","hint":"Oral proton-pump inhibitor, no ibuprofen, a Helicobacter plan, and clear advice to return if he bleeds. Not terlipressin to take home.","guideline":"A stable low-risk-stigmata ulcer can leave on an oral inhibitor with follow-up. The variceal drugs do not come along for company.","answer":"Oral inhibitor, no ibuprofen, a Helicobacter plan","kind":"choice","successFinding":"Discharge plan","successStatus":"Stable. Oral inhibitor.","missYou":"Not that decision","miss":"Oral proton-pump inhibitor, no ibuprofen, a Helicobacter plan, and clear advice to return if he bleeds. Not terlipressin to take home.","choices":[{"id":"ok","label":"Send him with an oral proton-pump inhibitor and no ibuprofen","verdict":"correct","feedback":"The pigmented spot, once stable, is not an operation and not a varix bundle.","finding":"Discharge plan","status":"Stable. Oral inhibitor."},{"id":"w0","label":"Terlipressin tablets for a month","verdict":"wrong","feedback":"There were no varices."},{"id":"w1","label":"Ibuprofen as needed, for the knee","verdict":"wrong","feedback":"That is the cause."},{"id":"w2","label":"Stay nil by mouth for a week","verdict":"wrong","feedback":"He is stable and the gut is how the oral drug arrives."}]}]},{"id":"vf","title":"Ventricular fibrillation","syndrome":"Pulseless arrest","minutes":"14 min","difficulty":"Core","available":true,"summary":"He collapses. There is no pulse. The tracing is chaotic. The shock comes before the drug.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/vf.jpg","patient":"Collapsed, no pulse","ageSex":"60-year-old man","chart":["Teaching case. Not a prescription.","Witnessed collapse on the ward. Defibrillator is in the room. No pulse. Not breathing."],"opening":{"lkwMin":2,"status":"No pulse. The monitor is not a pulse.","sbp":0,"dbp":0,"hr":0,"rr":0,"spo2":74,"glucose":118,"gcs":"E1 V1 M1"},"stages":[{"id":"shock","skill":"Action","title":"The defibrillator is in your hand","lead":"No pulse. Someone has started compressions. The pads are reaching the chest.","prompt":"What is the next act?","hint":"Defibrillate. Do not intubate or give a drug before the first shock.","guideline":"Pulseless ventricular fibrillation is shocked as soon as a defibrillator is ready. Epinephrine and amiodarone come during the resuscitation, not instead of the first shock.","answer":"Defibrillate now","kind":"choice","successFinding":"First shock","successStatus":"Shock delivered. Compressions restarted.","missYou":"Not that first act","miss":"Shock first. A tube and a drug do not come before the defibrillator that is already here.","choices":[{"id":"dfib","label":"Confirm there is no pulse and defibrillate now. Compressions around the shock.","verdict":"correct","feedback":"The defibrillator is here. The shock is the treatment.","finding":"Defibrillation","status":"Shocked. Compressions resumed."},{"id":"tube","label":"Intubate before anyone takes the defibrillator off the trolley","verdict":"wrong","feedback":"A tube can wait. The shock cannot.","critical":true},{"id":"amio","label":"Amiodarone before any shock","verdict":"wrong","feedback":"The drug is not the first act when the defibrillator is in the room.","critical":true},{"id":"pace","label":"Transcutaneous pacing","verdict":"wrong","feedback":"Pacing treats a bradycardia. This baseline has no QRS to pace."}]},{"id":"click","skill":"Localization","title":"Click the fibrillation","lead":"Every lead is an irregular oscillation. There is no organized QRS.","prompt":"Click the fibrillatory baseline.","hint":"The chaotic line is the rhythm. There is no pulse attached to it.","guideline":"Ventricular fibrillation is a pulseless shockable rhythm. A machine-counted rate is not a pulse.","answer":"Ventricular fibrillation","image":{"src":"sim/cases/vf.jpg","alt":"Electrocardiogram. Chaotic baseline without an organized QRS.","caption":"Ventricular fibrillation. No organized QRS."},"kind":"hotspot","successFinding":"Fibrillatory baseline","successStatus":"No pulse with this tracing.","missYou":"Clicked off the tracing","miss":"The finding is the chaotic baseline, not the empty margin.","regions":[{"id":"vf","verdict":"correct","cx":0.5,"cy":0.5,"rx":0.44,"ry":0.4,"you":"Fibrillatory waves","feedback":"That chaotic baseline is ventricular fibrillation. There is no organized QRS and no pulse."}]},{"id":"name","skill":"Diagnosis","title":"Name the rhythm","lead":"There is still no pulse.","prompt":"What do you call it?","hint":"Pulseless ventricular fibrillation. Not a stable tachycardia, and not asystole.","guideline":"Fibrillation without a pulse is shocked. A stable ventricular tachycardia is a different patient, one who has a pulse.","answer":"Pulseless ventricular fibrillation","kind":"choice","successFinding":"Rhythm named","successStatus":"Still no pulse. Preparing the next shock.","missYou":"Not that name","miss":"No pulse and a chaotic baseline is ventricular fibrillation.","choices":[{"id":"vf","label":"Pulseless ventricular fibrillation","verdict":"correct","feedback":"Shockable, and still pulseless.","finding":"Ventricular fibrillation","status":"Named. Next shock due."},{"id":"vt","label":"Stable ventricular tachycardia. Amiodarone and the ward.","verdict":"wrong","feedback":"Stable means there is a pulse. He has none.","critical":true},{"id":"asystole","label":"Asystole. Epinephrine only, and put the defibrillator away.","verdict":"wrong","feedback":"Asystole is a flat line. This line is chaotic, and it is shocked."},{"id":"art","label":"Artifact. Ignore it.","verdict":"wrong","feedback":"He has no pulse. This is not a loose lead.","critical":true}]},{"id":"next","skill":"Resuscitation","title":"The next check is still fibrillation","lead":"Compressions have been running. The rhythm has not organized.","prompt":"What happens at the next pause?","hint":"Shock again. Epinephrine is given during the resuscitation, not instead of the shock.","guideline":"Refractory fibrillation is shocked again. Epinephrine 1 mg is given during cardiopulmonary resuscitation, about every 3 to 5 minutes. It does not replace a shock.","answer":"Shock again, epinephrine during resuscitation","kind":"choice","successFinding":"Second shock","successStatus":"Shocked again. Epinephrine given during compressions.","missYou":"Not that sequence","miss":"Another shock. The drug is part of the resuscitation, not a reason to stop shocking.","choices":[{"id":"again","label":"Shock again. Epinephrine 1 mg during the resuscitation, and keep the compressions going.","verdict":"correct","feedback":"The rhythm is still shockable. The drug joins the compressions. It does not cancel the shock.","finding":"Epinephrine during resuscitation","status":"Second shock delivered."},{"id":"look","label":"Stop compressions for a full minute and feel carefully for a pulse","verdict":"wrong","feedback":"A pulse check is brief. A minute without compressions is not a search.","critical":true},{"id":"saline","label":"A litre of cold saline, and no further shock","verdict":"wrong","feedback":"Saline is not the treatment of fibrillation."},{"id":"ward","label":"Move him to the ward on a lidocaine infusion, with no further shock","verdict":"wrong","feedback":"He is still in arrest. The ward is not a plan.","critical":true}]},{"id":"rosc","skill":"Reassessment","title":"After the next shock there is a pulse","lead":"Blood pressure is 104/68. He is not awake. The compressions have stopped.","prompt":"What now?","hint":"Support the airway and the pressure, record a 12-lead, and look for a cause. Do not shock a pulse.","guideline":"After return of circulation the priorities are oxygen, blood pressure, a 12-lead, and the cause. A further shock is for fibrillation, not for a pulse.","answer":"Support circulation and find the cause","kind":"choice","successFinding":"Pulse returned","successStatus":"Pulse present. Recording a 12-lead.","missYou":"Not that next step","miss":"He has a pulse. Support him and find the cause. Do not keep shocking.","choices":[{"id":"cause","label":"Oxygen, support the pressure, record a 12-lead, and look for the cause","verdict":"correct","feedback":"The arrest is over for the moment. The tracing now has to be read as a 12-lead, not shocked on habit.","finding":"Pulse returned","status":"Pulse present. Cause being sought.","sbp":104,"dbp":68,"hr":96,"rr":16,"spo2":96},{"id":"more","label":"Shock again, because the last rhythm was fibrillation","verdict":"wrong","feedback":"You shock fibrillation, not a pulse.","critical":true},{"id":"home","label":"A beta blocker and discharge this hour","verdict":"wrong","feedback":"He has just had an arrest. He is not going home."},{"id":"lyse","label":"Thrombolysis for every fibrillation, before any tracing","verdict":"wrong","feedback":"A cause may be an infarction, but a blind lytic is not the first act once he has a pulse."}]},{"id":"c6","skill":"Reassessment","title":"He has a pulse. Get the 12-lead","lead":"The shock worked. Systolic pressure is 90. He is groaning. Oxygen is on his face.","prompt":"What do you record, and what do you not pour in?","hint":"A 12-lead electrocardiogram. No litre of cold saline. Support the pressure if it stays low.","guideline":"After ventricular fibrillation the cause is the next question. An ST-elevation infarction goes to the laboratory. A saline litre is not a treatment of a rhythm.","answer":"12-lead. No cold litre","kind":"choice","successFinding":"Electrocardiogram after the pulse","successStatus":"Pulse present. Pressure watched.","missYou":"Not that decision","miss":"A 12-lead electrocardiogram. No litre of cold saline. Support the pressure if it stays low.","choices":[{"id":"ok","label":"Record a 12-lead. Do not give a litre of cold saline","verdict":"correct","feedback":"The rhythm may have been an infarction. The tracing tells you. The litre does not.","finding":"Electrocardiogram after the pulse","status":"Pulse present. Pressure watched."},{"id":"w0","label":"A litre of cold saline as the cooling plan","verdict":"wrong","feedback":"Cooling is not a litre into a heart that just fibrillated.","critical":true},{"id":"w1","label":"No ECG. He has a pulse, so the emergency is over","verdict":"wrong","feedback":"The pulse is the start of the cause hunt."},{"id":"w2","label":"Amiodarone as a blood-pressure drug","verdict":"wrong","feedback":"If the pressure is low, use a vasopressor. Amiodarone is not that drug."}]},{"id":"c7","skill":"Reassessment","title":"The tracing shows no ST elevation. Saturation is 100 percent on a high-flow mask","lead":"There is no ST elevation. He is waking. The mask is turned up high and the saturation has been 100 percent for a while.","prompt":"What do you do with the oxygen?","hint":"Turn it down to a normal saturation. Do not leave him on 100 percent for comfort.","guideline":"After a pulse returns, oxygen is titrated. Prolonged hyperoxia is not a treatment.","answer":"Titrate the oxygen","kind":"choice","successFinding":"Oxygen titrated","successStatus":"Awake. No ST elevation.","missYou":"Not that decision","miss":"Turn it down to a normal saturation. Do not leave him on 100 percent for comfort.","choices":[{"id":"ok","label":"Turn the oxygen down. A normal saturation is the target","verdict":"correct","feedback":"100 percent was for the arrest. It is not a souvenir.","finding":"Oxygen titrated","status":"Awake. No ST elevation."},{"id":"w0","label":"Leave the mask at full flow all day","verdict":"wrong","feedback":"Hyperoxia is not safer."},{"id":"w1","label":"Take all oxygen off immediately, including if he desaturates","verdict":"wrong","feedback":"Titrate. Do not swing to hypoxia."},{"id":"w2","label":"Intubate so the oxygen is tidy","verdict":"wrong","feedback":"He is waking and talking enough. Do not intubate for tidiness."}]},{"id":"c8","skill":"Reassessment","title":"The systolic pressure is 80","lead":"He is mentating. Systolic pressure is 80. Lungs are clear. There is no ST elevation. The electrocardiogram is sinus.","prompt":"What raises the pressure?","hint":"Norepinephrine. Not a saline litre. Not a beta blocker. Look again for a cause if it does not respond.","guideline":"Hypotension after fibrillation is supported with a vasopressor while the cause is sought. Clear lungs are not an invitation to a litre if the story is a cardiac arrest.","answer":"Norepinephrine. No litre","kind":"choice","successFinding":"Vasopressor started","successStatus":"Pressure supported. Cause still open.","missYou":"Not that decision","miss":"Norepinephrine. Not a saline litre. Not a beta blocker. Look again for a cause if it does not respond.","choices":[{"id":"ok","label":"Start norepinephrine. Do not give a litre as the blood-pressure drug","verdict":"correct","feedback":"A cardiac cause is still the leading one until the examination says otherwise.","finding":"Vasopressor started","status":"Pressure supported. Cause still open."},{"id":"w0","label":"A litre, then another, until the pressure is 120","verdict":"wrong","feedback":"You may create the pulmonary edema he does not have yet.","critical":true},{"id":"w1","label":"A beta blocker, because arrests like a slow heart","verdict":"wrong","feedback":"The pressure is 80. A beta blocker will make it 50."},{"id":"w2","label":"Thrombolysis, because all arrests are emboli","verdict":"wrong","feedback":"There is no right-heart story and no ST elevation. Do not lyse a guess."}]},{"id":"c9","skill":"Reassessment","title":"You are offered ice packs as the main plan","lead":"Someone wants the whole bed packed in ice before any more examination. He is 36.8 degrees. Pressure is now 100 on a small norepinephrine dose.","prompt":"What is the priority?","hint":"The cause, the airway, and the blood pressure. Temperature care must not delay those. Do not pack him in ice and walk away.","guideline":"Temperature management after cardiac arrest is a unit protocol. It is not a reason to skip the electrocardiogram or the blood pressure, which you have already addressed. Ice as a ritual is not the treatment.","answer":"Do not let ice delay the cause","kind":"choice","successFinding":"Cause kept first","successStatus":"Pressure acceptable. Not an ice ritual.","missYou":"Not that decision","miss":"The cause, the airway, and the blood pressure. Temperature care must not delay those. Do not pack him in ice and walk away.","choices":[{"id":"ok","label":"Keep treating the cause and the pressure. Do not make ice the plan","verdict":"correct","feedback":"He already has a pulse and a tracing. Do not bury the next decision under packs.","finding":"Cause kept first","status":"Pressure acceptable. Not an ice ritual."},{"id":"w0","label":"Ice first. The blood pressure can wait","verdict":"wrong","feedback":"The blood pressure is the perfusion of the brain you are trying to save."},{"id":"w1","label":"Warm him actively to 39 degrees","verdict":"wrong","feedback":"Fever is not a goal either."},{"id":"w2","label":"A paralytic so he does not shiver, with no sedation","verdict":"wrong","feedback":"Paralysis without sedation is not temperature care."}]},{"id":"c10","skill":"Reassessment","title":"He is stable on low-dose norepinephrine","lead":"Awake, no ST elevation, saturation normal, a small vasopressor still running. The ward that watched him collapse wants him back.","prompt":"Where does he go?","hint":"A monitored critical-care bed until the vasopressor is off and a cause is at least looked for. Not the same unmonitored bay tonight.","guideline":"Return of circulation is an intensive-care problem for the first day. The ward is where it happened, not where it is finished.","answer":"Monitored bed until the vasopressor is off","kind":"choice","successFinding":"Stays monitored","successStatus":"Stable. Still on a small vasopressor.","missYou":"Not that decision","miss":"A monitored critical-care bed until the vasopressor is off and a cause is at least looked for. Not the same unmonitored bay tonight.","choices":[{"id":"ok","label":"Keep him monitored. Do not send him back on a vasopressor","verdict":"correct","feedback":"The next fibrillation, if it comes, needs a defibrillator in the room.","finding":"Stays monitored","status":"Stable. Still on a small vasopressor."},{"id":"w0","label":"Back to the open ward on the infusion","verdict":"wrong","feedback":"The infusion and the rhythm both need watching."},{"id":"w1","label":"Home. He is awake","verdict":"wrong","feedback":"He was dead an hour ago."},{"id":"w2","label":"A beta blocker infusion overnight while the pressure needs norepinephrine","verdict":"wrong","feedback":"Those two drugs disagree."}]}]},{"id":"tamponade","title":"Cardiac tamponade","syndrome":"Obstructive shock","minutes":"14 min","difficulty":"Core","available":true,"summary":"Hypotension, distended neck veins, and clear lungs. Fluid surrounds the heart. Drain it. A litre of saline is not the treatment.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/tamponade.jpg","patient":"Breathless, veins up, lungs clear","ageSex":"64-year-old woman","chart":["Teaching case. Not a prescription.","Known metastatic cancer. No chest trauma. Muffled sounds. Pulsus paradoxus."],"opening":{"lkwMin":30,"status":"Cold. Neck veins distended. Lungs clear.","sbp":78,"dbp":64,"hr":126,"rr":28,"spo2":95,"glucose":108,"gcs":"E3 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"Where do you look?","lead":"The pressure is 78. The lungs are clear and the veins are up.","prompt":"Which study happens now?","hint":"A bedside echocardiogram. Do not send her to CT while she is this shocked.","guideline":"Bedside ultrasound is the study for tamponade. A still image can show the fluid. Collapse of a chamber is what makes the physiology, and one frame does not prove it.","answer":"Bedside echocardiogram","kind":"choice","successFinding":"Echocardiogram","successStatus":"Probe on the chest.","missYou":"Not that study","miss":"Ultrasound now. A trip to CT is how this patient arrests in a corridor.","choices":[{"id":"echo","label":"Bedside echocardiogram now","verdict":"correct","feedback":"The probe is the test. It does not require a trip.","finding":"Echocardiogram","status":"Subcostal view on the screen."},{"id":"ct","label":"CT pulmonary angiogram as the only test","verdict":"wrong","feedback":"She is too unstable to leave for a scan that is not the first test.","critical":true},{"id":"chest","label":"Chest film, then a drain into the pleura because the veins are up","verdict":"wrong","feedback":"Clear lungs and distended veins are not a reason to incise the pleura."},{"id":"trop","label":"Wait for a troponin before any imaging","verdict":"wrong","feedback":"A troponin does not move while the filling pressure is falling."}]},{"id":"click","skill":"Localization","title":"Click the fluid","lead":"Subcostal view. The near field is liver. Under it is a black rim around the heart. The round black cavities inside the muscle are chambers.","prompt":"Click the fluid around the heart, not a chamber.","hint":"The anechoic rim between the liver and the heart is the effusion.","guideline":"Pericardial fluid is the black space outside the muscle. A chamber is a black cavity inside it. One still does not prove diastolic collapse.","answer":"Fluid around the heart","image":{"src":"sim/cases/tamponade.jpg","alt":"Subcostal echocardiogram. Anechoic fluid surrounds the heart.","caption":"Fluid around the heart. The round cavities inside the muscle are chambers."},"kind":"hotspot","successFinding":"Pericardial fluid","successStatus":"Fluid around the heart.","missYou":"Not the fluid","miss":"The effusion is the black rim outside the muscle, just under the liver. A round cavity inside the muscle is a chamber.","regions":[{"id":"fluid","verdict":"correct","cx":0.5,"cy":0.35,"rx":0.12,"ry":0.055,"you":"Fluid around the heart","feedback":"That black rim under the liver is fluid outside the heart."},{"id":"chamber","verdict":"wrong","cx":0.42,"cy":0.58,"rx":0.05,"ry":0.055,"you":"A cardiac chamber","feedback":"That round black cavity is inside the muscle. It is a chamber, not the effusion."}]},{"id":"name","skill":"Diagnosis","title":"Name the shock","lead":"She is shocked, the veins are up, and there is fluid around the heart. This single frame does not show chamber collapse.","prompt":"What is the working diagnosis?","hint":"Tamponade until the drainage proves otherwise. Not a clinic effusion.","guideline":"Tamponade is clinical: shock plus fluid under pressure. The still shows the fluid. It does not, by itself, show collapse.","answer":"Tamponade","kind":"choice","successFinding":"Tamponade","successStatus":"Drainage kit being opened.","missYou":"Not that diagnosis","miss":"Shock and fluid around the heart is tamponade until you have drained it.","choices":[{"id":"tamp","label":"Tamponade. The fluid is under pressure until drainage says otherwise.","verdict":"correct","feedback":"You do not send this blood pressure to a clinic.","finding":"Tamponade","status":"Drainage being prepared."},{"id":"simple","label":"A simple effusion. Clinic next week.","verdict":"wrong","feedback":"A simple effusion does not make a blood pressure of 78.","critical":true},{"id":"ptx","label":"Tension pneumothorax. Needle the chest and ignore the ultrasound.","verdict":"wrong","feedback":"The lungs are clear, and the ultrasound shows fluid around the heart."},{"id":"pump","label":"A dead ventricle. Dobutamine, and leave the fluid.","verdict":"wrong","feedback":"The ventricle is not filling. An inotrope does not remove the fluid."}]},{"id":"drain","skill":"Treatment","title":"The kit is in the room","lead":"She is still at 78 systolic. The ultrasound probe stays on the chest.","prompt":"What is the treatment?","hint":"Drain the pericardium. A small fluid bolus is only a bridge. Do not ventilate her with high pressure first.","guideline":"Tamponade is treated by drainage. Positive-pressure ventilation further reduces venous return. A large crystalloid bolus is not the cure.","answer":"Pericardial drainage","kind":"choice","successFinding":"Drainage","successStatus":"Fluid drained. Pressure rising.","missYou":"Not that treatment","miss":"Drain the pericardium. Do not intubate her onto high pressure before the fluid is out.","choices":[{"id":"drain","label":"Echo-guided pericardial drainage now. A small bolus only while the needle is prepared.","verdict":"correct","feedback":"Drainage is the treatment. Fluid is a bridge of minutes, not a litre and a ward.","finding":"Pericardial drainage","status":"Drained. Pressure rising.","sbp":108,"dbp":70,"hr":100},{"id":"litre","label":"One litre of saline, and the ward","verdict":"wrong","feedback":"A litre does not remove the fluid, and the ward is not a place to arrest.","critical":true},{"id":"tube","label":"Intubate now and ventilate with high pressure, before any drainage","verdict":"wrong","feedback":"Positive pressure drops the venous return further. Drainage comes first unless the airway has already failed.","critical":true},{"id":"lyse","label":"Thrombolysis, because the veins are distended","verdict":"wrong","feedback":"Distended veins here are the pericardium, not a reason for a lytic."}]},{"id":"after","skill":"Reassessment","title":"The pressure is 108","lead":"A straw-colored sample is in the syringe. She is more awake.","prompt":"What do you do with the next hour?","hint":"Watch for the fluid coming back. Send the sample. Do not anticoagulate a fresh pericardial drain.","guideline":"After drainage, recollection is the failure mode. Anticoagulation without a new reason can refill the sac with blood.","answer":"Watch for recollection","kind":"choice","successFinding":"Watching","successStatus":"Drain on free drainage. Sample sent.","missYou":"Not that plan","miss":"Watch the pressure and the drain. Do not anticoagulate tonight without a reason.","choices":[{"id":"watch","label":"Leave the drain, send the fluid, and watch for recollection. No anticoagulant tonight.","verdict":"correct","feedback":"The cause still needs a diagnosis. The sac must not be refilled.","finding":"Watching for recollection","status":"Better. Drain left in.","sbp":112,"hr":92},{"id":"heparin","label":"Heparin, because distended veins meant a pulmonary embolus","verdict":"wrong","feedback":"The ultrasound showed fluid, not a reason to anticoagulate a pericardium you have just entered.","critical":true},{"id":"bolus","label":"Another litre, now that she looks better","verdict":"wrong","feedback":"The pressure has recovered because the fluid left. More saline is not the plan."},{"id":"home","label":"Remove the drain and discharge within the hour","verdict":"wrong","feedback":"Recollection is the next danger. She stays."}]},{"id":"c6","skill":"Reassessment","title":"The drain suddenly stops and the pressure falls","lead":"After a good initial drain the systolic pressure had been 108. The drain has stopped. Systolic pressure is 84. The neck veins are up again.","prompt":"What do you check first?","hint":"The drain. Blocked drains get fixed or the fluid reaccumulates and you re-image. Do not give a litre. Do not start heparin.","guideline":"A sudden stop plus falling pressure is a blocked drain or reaccumulation. Clear the drain or re-image. Fluid loading is a bridge at best and a mistake as the plan.","answer":"Fix or re-image the drain. No litre","kind":"choice","successFinding":"Drain checked","successStatus":"Pressure falling. Drain the question.","missYou":"Not that decision","miss":"The drain. Blocked drains get fixed or the fluid reaccumulates and you re-image. Do not give a litre. Do not start heparin.","choices":[{"id":"ok","label":"Unblock or re-site the drain. Do not give a litre of saline","verdict":"correct","feedback":"The fluid is back around the heart or stuck in the tube. Put it in the bag, not in the veins.","finding":"Drain checked","status":"Pressure falling. Drain the question."},{"id":"w0","label":"A litre of saline and the ward","verdict":"wrong","feedback":"That was the wrong plan before the first drain.","critical":true},{"id":"w1","label":"Heparin, in case the drain caused a clot","verdict":"wrong","feedback":"Heparin into a fresh pericardial space is a bleed."},{"id":"w2","label":"Thrombolysis into the pericardium","verdict":"wrong","feedback":"That is not a ward trick, and it is not the first move."}]},{"id":"c7","skill":"Reassessment","title":"The drain is patent again and the pressure recovers","lead":"A flush and a position change restored flow. Pressure is 112. The fluid is bloody. The history is metastatic cancer. He is not bleeding from a wound.","prompt":"What do you send, and what do you not start?","hint":"Send the fluid for the tests the cancer team needs. Do not anticoagulate. Leave the drain in.","guideline":"Malignant effusions are diagnosed from the fluid and often need a lasting drain. Anticoagulation is dangerous immediately after pericardial drainage.","answer":"Send the fluid. No anticoagulation. Drain stays","kind":"choice","successFinding":"Fluid sent","successStatus":"Drain patent. Pressure held.","missYou":"Not that decision","miss":"Send the fluid for the tests the cancer team needs. Do not anticoagulate. Leave the drain in.","choices":[{"id":"ok","label":"Send the fluid. Do not anticoagulate. Leave the drain","verdict":"correct","feedback":"The sample is the diagnosis. The drain is the treatment still in progress.","finding":"Fluid sent","status":"Drain patent. Pressure held."},{"id":"w0","label":"Remove the drain now that one sample is in the pot","verdict":"wrong","feedback":"It stopped once already. Leave it until the output declares itself."},{"id":"w1","label":"Warfarin tonight for the cancer","verdict":"wrong","feedback":"Cancer and a fresh pericardial drain are a bleeding story, not an automatic clot story."},{"id":"w2","label":"A steroid into the pericardium as the first act","verdict":"wrong","feedback":"That is not the rescue. The drain is."}]},{"id":"c8","skill":"Reassessment","title":"Output is 40 mL and then trivial","lead":"Several hours of little output. Pressure stays 114. He is warm. An echocardiogram shows a small residual rim and no collapse.","prompt":"What do you do with the drain?","hint":"Leave it while the team is sure the output has finished, then remove it on purpose. Do not inject thrombolysis. Do not start heparin the same hour.","guideline":"A resolved tamponade with trivial output can lose the drain once a senior review agrees. Prophylactic heparin is delayed while the pericardium has just been drained.","answer":"Plan removal. No heparin this hour","kind":"choice","successFinding":"Drain removal planned","successStatus":"Small rim. Pressure stable.","missYou":"Not that decision","miss":"Leave it while the team is sure the output has finished, then remove it on purpose. Do not inject thrombolysis. Do not start heparin the same hour.","choices":[{"id":"ok","label":"Remove it when the output has clearly finished. No heparin in the same hour","verdict":"correct","feedback":"The emergency is over. The clot prophylaxis can wait a few hours.","finding":"Drain removal planned","status":"Small rim. Pressure stable."},{"id":"w0","label":"Full-dose heparin now, because he is in bed","verdict":"wrong","feedback":"The pericardium was just a bleeding space."},{"id":"w1","label":"Another blind needle, although he is well","verdict":"wrong","feedback":"He is well. Do not needle a small rim."},{"id":"w2","label":"A litre, to keep the veins full","verdict":"wrong","feedback":"The veins were the problem when they were too full behind a trapped heart."}]},{"id":"c9","skill":"Reassessment","title":"The fluid is malignant","lead":"Cytology is positive. He is stable. The question of a surgical window is raised because malignant effusions come back.","prompt":"What is the timing?","hint":"A window is for recurrence, arranged with the specialists. It is not an emergency operation tonight while he is stable with a working drain. Do not restart chemotherapy in this hour as the blood-pressure drug.","guideline":"Recurrent malignant tamponade is often treated with a window. A stable patient after successful drainage can have that planned. It is not a 2 a.m. operation.","answer":"Plan a window if it recurs. Not tonight","kind":"choice","successFinding":"Window discussed","successStatus":"Stable. Malignant fluid.","missYou":"Not that decision","miss":"A window is for recurrence, arranged with the specialists. It is not an emergency operation tonight while he is stable with a working drain. Do not restart chemotherapy in this hour as the blood-pressure drug.","choices":[{"id":"ok","label":"If it comes back, a window. Not an emergency operation tonight","verdict":"correct","feedback":"He is stable. The surgeons can meet him in daylight unless the pressure falls again.","finding":"Window discussed","status":"Stable. Malignant fluid."},{"id":"w0","label":"Emergency sternotomy tonight","verdict":"wrong","feedback":"There is no instability left."},{"id":"w1","label":"Never a window. Needles forever","verdict":"wrong","feedback":"Repeated blind needles are how complications accumulate."},{"id":"w2","label":"Stop all cancer treatment discussions forever","verdict":"wrong","feedback":"The fluid is the cancer. The oncologist still has a job, just not as the vasopressor."}]},{"id":"c10","skill":"Reassessment","title":"He remains stable off any vasopressor","lead":"Drain output is nothing. Pressure is normal. He is talking. The cancer team knows he is here.","prompt":"Where does he spend the night?","hint":"Somewhere the drain and the blood pressure are watched. Not home. Not a heparin infusion.","guideline":"The first night after tamponade is observed. Discharge waits until the drain is out or safely managed and the pressure has stayed up.","answer":"Observed overnight. No heparin infusion","kind":"choice","successFinding":"Observed","successStatus":"Stable. Still in hospital.","missYou":"Not that decision","miss":"Somewhere the drain and the blood pressure are watched. Not home. Not a heparin infusion.","choices":[{"id":"ok","label":"Keep him in overnight. No heparin infusion","verdict":"correct","feedback":"Reaccumulation is a night-time event. Someone has to notice.","finding":"Observed","status":"Stable. Still in hospital."},{"id":"w0","label":"Home with the drain coiled in a pocket","verdict":"wrong","feedback":"A pericardial drain is not a pocket device."},{"id":"w1","label":"A treatment-dose heparin infusion for the cancer","verdict":"wrong","feedback":"Not tonight."},{"id":"w2","label":"Discharge the diagnosis. It was anxiety","verdict":"wrong","feedback":"The echo and the pressure already disagreed."}]}]},{"id":"cholangitis","title":"Acute cholangitis","syndrome":"Obstructed infected bile","minutes":"14 min","difficulty":"Core","available":true,"summary":"Fever, jaundice, and shock. The duct is dilated and holds a stone. The colored dots are flow in the vessels. Antibiotics and drainage tonight.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/cbd.jpg","patient":"Fever and jaundice","ageSex":"64-year-old woman","chart":["Teaching case. Not a prescription.","Temperature 39.2. Bilirubin 8.4 mg/dL. Alkaline phosphatase 610 U/L. White cells 18. Known gallstones."],"opening":{"lkwMin":20,"status":"Jaundiced, febrile, cold.","sbp":84,"dbp":50,"hr":122,"rr":24,"spo2":96,"glucose":142,"gcs":"E4 V4 M6"},"stages":[{"id":"study","skill":"Resuscitation","title":"What happens in the first minutes?","lead":"She is jaundiced, febrile, and hypotensive. The gallbladder history is old.","prompt":"What do you start?","hint":"Cultures, intravenous antibiotics with biliary cover, and fluid. Then the duct.","guideline":"Severe cholangitis is infected bile behind a blockage, with shock. Antibiotics start immediately. Drainage is the same night, not next week.","answer":"Antibiotics and ultrasound of the duct","kind":"choice","successFinding":"Antibiotics started","successStatus":"Cultures sent. Looking at the duct.","missYou":"Not that start","miss":"Intravenous antibiotics and a look at the duct. Oral antibiotics and a clinic visit are how this becomes a death.","choices":[{"id":"abx","label":"Blood cultures, intravenous antibiotics, resuscitation, and an ultrasound of the duct","verdict":"correct","feedback":"The drug and the picture happen now. Drainage is next, not instead of the drug.","finding":"Antibiotics and ultrasound","status":"Antibiotics running. Duct on the screen."},{"id":"oral","label":"Oral amoxicillin and a review in two days","verdict":"wrong","feedback":"She is in shock. Oral therapy and a delay are not a plan.","critical":true},{"id":"surg","label":"Immediate open cholecystectomy, and no antibiotics","verdict":"wrong","feedback":"The emergency is the infected duct, and the antibiotic cannot wait."},{"id":"ppi","label":"A proton-pump inhibitor only","verdict":"wrong","feedback":"This is not an ulcer. Acid suppression does not drain bile."}]},{"id":"click","skill":"Localization","title":"Click the duct","lead":"Right-upper-quadrant ultrasound. A dark structure is the dilated duct and its stone. A blue dot beside it is Doppler flow in a vessel.","prompt":"Click the dilated duct. Do not click the color dot.","hint":"The black structure is the duct. The color is blood flow, which is how the duct is told from the vessel.","guideline":"A dilated duct with a stone, plus fever and shock, is cholangitis. Color Doppler marks the vessels so they are not called the duct.","answer":"Dilated duct with a stone","image":{"src":"sim/cases/cbd.jpg","alt":"Ultrasound. A dilated bile duct with a stone. Color marks flow in the adjacent vessels.","caption":"Dilated duct with a stone. The colored dots are flow in the vessels."},"kind":"hotspot","successFinding":"Dilated duct","successStatus":"The duct, not the vessel.","missYou":"Not the duct","miss":"The black structure is the duct and the stone. The colored dot is flow in a vessel.","regions":[{"id":"duct","verdict":"correct","cx":0.42,"cy":0.68,"rx":0.12,"ry":0.1,"you":"Dilated duct and stone","feedback":"That black structure is the dilated duct with the stone."},{"id":"flow","verdict":"wrong","cx":0.7,"cy":0.752,"rx":0.04,"ry":0.035,"you":"Doppler flow in a vessel","feedback":"That color is blood flow. It is there so you do not call the vessel a duct."}]},{"id":"name","skill":"Diagnosis","title":"Name the emergency","lead":"Fever, jaundice, hypotension, and a stone in a dilated duct.","prompt":"What is this grade of illness?","hint":"Severe cholangitis. Shock makes it severe. A full pentad is not required.","guideline":"Tokyo grade III cholangitis is organ dysfunction, including shock. Reynolds pentad is not required before you act.","answer":"Severe cholangitis","kind":"choice","successFinding":"Severe cholangitis","successStatus":"Drainage being arranged.","missYou":"Not that name","miss":"Shock plus a blocked infected duct is severe cholangitis.","choices":[{"id":"sev","label":"Severe cholangitis. The duct is blocked and she is in shock.","verdict":"correct","feedback":"You do not wait for a complete pentad.","finding":"Severe cholangitis","status":"Endoscopy asked to drain the duct tonight."},{"id":"colic","label":"Biliary colic. Home with analgesia.","verdict":"wrong","feedback":"Colic is pain without infection and without shock.","critical":true},{"id":"chole","label":"Cholecystitis only. The duct can wait for a clinic.","verdict":"wrong","feedback":"The stone is in the duct, and she is in shock. The duct is the emergency."},{"id":"dot","label":"The colored dot is the stone. No drainage.","verdict":"wrong","feedback":"The color is a vessel. The stone is in the black duct."}]},{"id":"drain","skill":"Source control","title":"Set the treatment","lead":"Antibiotics are running. The duct is still blocked.","prompt":"What clears the bile?","hint":"Urgent endoscopic drainage, and piperacillin-tazobactam if that is the severe regimen you have.","guideline":"Severe cholangitis needs biliary drainage tonight and an intravenous antibiotic that covers gram-negative rods and anaerobes. Piperacillin-tazobactam 4.5 g every 6 hours is one such regimen.","answer":"Piperacillin-tazobactam and endoscopic drainage","kind":"choice","successFinding":"Drainage planned","successStatus":"Antibiotic running. Endoscopy tonight.","missYou":"Not that plan","miss":"Drain the duct tonight. An oral drug and a clinic appointment leave the pus in place.","choices":[{"id":"ercp","label":"Piperacillin-tazobactam 4.5 g IV every 6 hours, and urgent endoscopic drainage","verdict":"correct","feedback":"The antibiotic holds the bacteremia. The endoscope removes the obstruction.","finding":"Duct drainage","status":"Drained. Pressure rising.","sbp":104,"hr":98},{"id":"wait","label":"Antibiotics for a week. Drainage only if she is still jaundiced at clinic.","verdict":"wrong","feedback":"A blocked infected duct in shock is drained tonight.","critical":true},{"id":"gb","label":"Cholecystectomy tonight as the only operation, and leave the duct stone","verdict":"wrong","feedback":"Removing the gallbladder does not empty a stone that is already in the duct."},{"id":"steroid","label":"Steroids for the jaundice","verdict":"wrong","feedback":"Jaundice from a stone is not a steroid deficiency."}]},{"id":"after","skill":"Reassessment","title":"The duct is draining and the pressure is 104","lead":"She is warmer. The drain is putting out bile.","prompt":"What about the gallbladder?","hint":"Antibiotics continue. The gallbladder is planned later if she is improving. Not a nephrostomy.","guideline":"Once the duct is drained and the shock is resolving, the gallbladder is an elective problem. It is not a reason for a second emergency operation tonight.","answer":"Antibiotics continue, gallbladder later","kind":"choice","successFinding":"Improving","successStatus":"Bile draining. Antibiotics continued.","missYou":"Not that next step","miss":"Keep the antibiotics. The gallbladder can wait. The ureter is not the duct.","choices":[{"id":"later","label":"Continue the antibiotics. Plan the gallbladder when she has recovered.","verdict":"correct","feedback":"Source control has been done. A second operation tonight is not the prize.","finding":"Improving after drainage","status":"Bile draining.","sbp":112,"hr":90},{"id":"stop","label":"Stop the antibiotics because the fever fell once","verdict":"wrong","feedback":"One better reading is not a completed course."},{"id":"kidney","label":"Nephrostomy, because the duct and the ureter are the same tube","verdict":"wrong","feedback":"They are not the same tube. The bile is already draining."},{"id":"terli","label":"Add terlipressin for the jaundice","verdict":"wrong","feedback":"Terlipressin is not a treatment for cholangitis."}]},{"id":"c6","skill":"Reassessment","title":"Bilirubin is still 6 the next day","lead":"The duct is draining. Pressure is normal. He is less jaundiced but the bilirubin is not normal. Someone wants an open bile-duct exploration tonight.","prompt":"Is tonight an open operation?","hint":"No. The endoscopic drain is working. Open exploration is not the next step in a man who is improving.","guideline":"After successful endoscopic drainage, the bilirubin falls over days. A second, open operation is for a drain that has failed, not for a number that is merely unfinished.","answer":"No open operation. Drainage continues","kind":"choice","successFinding":"No open exploration","successStatus":"Improving. Drain in place.","missYou":"Not that decision","miss":"No. The endoscopic drain is working. Open exploration is not the next step in a man who is improving.","choices":[{"id":"ok","label":"Do not operate tonight. Let the endoscopic drain work","verdict":"correct","feedback":"Improving cholangitis is not an emergency laparotomy.","finding":"No open exploration","status":"Improving. Drain in place."},{"id":"w0","label":"Open the duct tonight","verdict":"wrong","feedback":"He is getting better with the drain he has.","critical":true},{"id":"w1","label":"Pull the stent because the fever fell","verdict":"wrong","feedback":"The stone and the swelling are why it was placed."},{"id":"w2","label":"A steroid for the bilirubin","verdict":"wrong","feedback":"Steroids do not drain bile."}]},{"id":"c7","skill":"Reassessment","title":"The blood culture grows a sensitive gram-negative","lead":"The organism is sensitive to a narrower antibiotic than the one he is on. He is afebrile and the pressure is normal.","prompt":"What do you do with the antibiotic?","hint":"Narrow it. Do not stop it. The drainage does not replace the course.","guideline":"Severe cholangitis needs antibiotics and drainage. Once the culture is sensitive and he is well, the drug is narrowed and finished, not stopped on day 1.","answer":"Narrow the antibiotic. Finish a course","kind":"choice","successFinding":"Antibiotic narrowed","successStatus":"Afebrile. Culture known.","missYou":"Not that decision","miss":"Narrow it. Do not stop it. The drainage does not replace the course.","choices":[{"id":"ok","label":"Narrow to the sensitive drug and finish the course","verdict":"correct","feedback":"Three leftover broad drugs are not safer than the one that works.","finding":"Antibiotic narrowed","status":"Afebrile. Culture known."},{"id":"w0","label":"Stop today. The duct is open","verdict":"wrong","feedback":"The bile was infected. The course is not one dose."},{"id":"w1","label":"Add a second and a third antibiotic anyway","verdict":"wrong","feedback":"The culture already answered the question."},{"id":"w2","label":"Antifungal, because the bilirubin was high","verdict":"wrong","feedback":"High bilirubin is the obstruction, not Candida."}]},{"id":"c8","skill":"Reassessment","title":"When is the gallbladder removed?","lead":"He has gallstones. The duct has been cleared and stented. He is eating. The infection has settled.","prompt":"When is the cholecystectomy?","hint":"Later, when the infection has settled. Not tonight, and not never.","guideline":"Interval cholecystectomy follows cholangitis from gallstones once the sepsis is over. Doing it in the night of the septic shock is how bile peritonitis happens.","answer":"Interval cholecystectomy. Not tonight","kind":"choice","successFinding":"Gallbladder planned later","successStatus":"Eating. Infection settled.","missYou":"Not that decision","miss":"Later, when the infection has settled. Not tonight, and not never.","choices":[{"id":"ok","label":"Book the gallbladder for later. Do not take it out tonight","verdict":"correct","feedback":"The emergency was the duct and the sepsis. Both are settling. The gallbladder can wait for a list.","finding":"Gallbladder planned later","status":"Eating. Infection settled."},{"id":"w0","label":"Cholecystectomy tonight","verdict":"wrong","feedback":"He has just been in septic shock."},{"id":"w1","label":"Never remove it. The stent is forever","verdict":"wrong","feedback":"Stents block. Stones recur. The gallbladder still needs a plan."},{"id":"w2","label":"Dissolve the stones with a proton-pump inhibitor","verdict":"wrong","feedback":"That drug does not dissolve gallstones."}]},{"id":"c9","skill":"Reassessment","title":"The fever returns on day 4","lead":"He had been well. Temperature is 38.8. The stent was placed. Bilirubin is climbing again. Pressure is normal.","prompt":"What do you image?","hint":"The duct. A blocked stent is the question. Do not add a steroid. Do not assume the antibiotic failed and add four more.","guideline":"Recurrent fever after drainage is a blocked or migrated stent until proven otherwise. Re-image and re-drain. Do not decorate it with steroids.","answer":"Re-image the duct","kind":"choice","successFinding":"Duct re-imaged","successStatus":"Fever back. Stent in question.","missYou":"Not that decision","miss":"The duct. A blocked stent is the question. Do not add a steroid. Do not assume the antibiotic failed and add four more.","choices":[{"id":"ok","label":"Ultrasound or a cholangiogram. Do not add a steroid","verdict":"correct","feedback":"The pipe blocked again. Look at the pipe.","finding":"Duct re-imaged","status":"Fever back. Stent in question."},{"id":"w0","label":"Dexamethasone for the fever","verdict":"wrong","feedback":"The fever is a blocked infected duct."},{"id":"w1","label":"Four extra antibiotics and no image","verdict":"wrong","feedback":"You may be treating a plastic problem with drugs."},{"id":"w2","label":"Discharge. Fevers come and go","verdict":"wrong","feedback":"A climbing bilirubin and a fever is the first illness, repeated."}]},{"id":"c10","skill":"Reassessment","title":"The stent is replaced and the fever goes","lead":"He is eating, afebrile, and the new drain is working. The gallbladder date exists.","prompt":"What do you send him with?","hint":"A short remaining antibiotic plan if it is not finished, the stent card or the date, and the gallbladder plan. Not a month of the broadest drug.","guideline":"Follow-up of the stent and the gallbladder is the discharge. Endless broad antibiotics are not.","answer":"Finish a finite course. Keep the stent and gallbladder plans","kind":"choice","successFinding":"Discharge plan","successStatus":"Afebrile. Plans written.","missYou":"Not that decision","miss":"A short remaining antibiotic plan if it is not finished, the stent card or the date, and the gallbladder plan. Not a month of the broadest drug.","choices":[{"id":"ok","label":"A finite antibiotic course, a stent plan, and a date for the gallbladder","verdict":"correct","feedback":"The plastic in the duct has to be remembered. The antibiotic does not have to be eternal.","finding":"Discharge plan","status":"Afebrile. Plans written."},{"id":"w0","label":"Broad antibiotics for six weeks, no follow-up","verdict":"wrong","feedback":"The follow-up is the part that prevents the next cholangitis."},{"id":"w1","label":"Pull the new stent on the way out","verdict":"wrong","feedback":"It was just replaced because the old one blocked."},{"id":"w2","label":"No letter. He will remember","verdict":"wrong","feedback":"Stents are forgotten. Write it down."}]}]},{"id":"cld","title":"Decompensated cirrhosis","syndrome":"Ascites and confusion","minutes":"14 min","difficulty":"Core","available":true,"summary":"Known cirrhosis. He is confused and the abdomen is tense. This slice shows the liver and the spleen, not a blocked kidney. Find the precipitant.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/cirrhosis.png","patient":"Confused, tense abdomen, known cirrhosis","ageSex":"56-year-old man","chart":["Teaching case. Not a prescription.","Alcohol-related cirrhosis. No hematemesis. Spironolactone at home. Sodium 128 mmol/L. Bilirubin 4.1 mg/dL. Creatinine 1.1 mg/dL. Glucose 78 mg/dL."],"opening":{"lkwMin":25,"status":"Drowsy. Tense abdomen.","sbp":104,"dbp":66,"hr":96,"rr":18,"spo2":97,"glucose":78,"gcs":"E3 V3 M5"},"stages":[{"id":"first","skill":"First moves","title":"What do you do before a label?","lead":"He is confused. The glucose is 78 mg/dL. The abdomen is tense and he is on a diuretic.","prompt":"What is the first set of acts?","hint":"Check the sugar, hold the diuretic, and plan a diagnostic tap. Look for a precipitant.","guideline":"Decompensation has a precipitant: infection, bleeding, a drug, constipation, or an electrolyte. Fluid restriction alone is not a treatment. A diagnostic tap is.","answer":"Glucose, hold the diuretic, diagnostic tap","kind":"choice","successFinding":"Precipitant search","successStatus":"Diuretic held. Tap planned.","missYou":"Not that start","miss":"Look for the precipitant and sample the ascites. Fluid restriction is not a diagnosis.","choices":[{"id":"tap","label":"Recheck the glucose, hold the diuretic, and plan a diagnostic tap","verdict":"correct","feedback":"The sugar is checked, the drug that may be worsening him is held, and the fluid is sampled.","finding":"Diagnostic tap planned","status":"Diuretic held. Preparing the tap.","glucose":96},{"id":"restrict","label":"Restrict fluid to 750 mL and do nothing else","verdict":"wrong","feedback":"Restriction does not find infection, bleeding, or a drug cause.","critical":true},{"id":"saline","label":"A litre of saline, because the sodium is 128","verdict":"wrong","feedback":"A saline litre is the wrong answer to a low sodium in cirrhosis."},{"id":"bb","label":"Start a beta blocker tonight, because every person with cirrhosis needs one","verdict":"wrong","feedback":"A new beta blocker in acut ker is not a treatment of hyponatremia."}]},{"id":"c7","skill":"Reassessment","title":"He is agitated at night","lead":"He tries to climb out of bed. There is no focal sign. Glucose is normal. The tap was not infected.","prompt":"What sedation do you allow?","hint":"Almost none. A benzodiazepine will deepen the encephalopathy. A sitter, a low bed, and treatment of the cause. Not a large sedative.","guideline":"Benzodiazepines last for days in a failing liver and worsen encephalopathy. Agitation is the encephalopathy until proved otherwise.","answer":"No benzodiazepine","kind":"choice","successFinding":"Sedative avoided","successStatus":"Agitated. Glucose normal.","missYou":"Not that decision","miss":"Almost none. A benzodiazepine will deepen the encephalopathy. A sitter, a low bed, and treatment of the cause. Not a large sedative.","choices":[{"id":"ok","label":"Do not give a benzodiazepine. Watch him and treat the encephalopathy","verdict":"correct","feedback":"The drug will be in him tomorrow when you want him awake.","finding":"Sedative avoided","status":"Agitated. Glucose normal."},{"id":"w0","label":"Diazepam so the night is quiet","verdict":"wrong","feedback":"The night will be quiet because he will be unconscious.","critical":true},{"id":"w1","label":"Haloperidol in a large intravenous dose as a first act","verdict":"wrong","feedback":"A large sedative is still a sedative. Look for a cause first."},{"id":"w2","label":"Four-point restraint and no reassessment","verdict":"wrong","feedback":"Restraint without a medical plan is not care."}]},{"id":"c8","skill":"Reassessment","title":"He has not opened his bowels","lead":"Lactulose was started but there has been no stool. He is still drowsy. The abdomen is tense but not peritonitic.","prompt":"What do you do with the lactulose?","hint":"Titrate it until he stools. Do not stop it after one dose. Do not give a beta blocker instead.","guideline":"Lactulose is titrated to two or three stools, not to a single prescript "skill":"Diagnosis","title":"The neutrophil count is 840","lead":"The culture is not back. She is still febrile.","prompt":"What is 840?","hint":"Spontaneous bacterial peritonitis. 250 is enough. Do not wait for the culture.","guideline":"An ascitic neutrophil count of 250 cells/mm3 or more is peritonitis and is treated immediately. The culture confirms later.","answer":"Spontaneous bacterial peritonitis","kind":"choice","successFinding":"Peritonitis","successStatus":"Antibiotic indicated now.","missYou":"Not that reading","miss":"840 neutrophils is peritonitis. You do not wait for a culture, and you do not call 840 normal.","choices":[{"id":"sbp","label":"Spontaneous bacterial peritonitis. Treat now. Do not wait for the culture.","verdict":"correct","feedback":"The count is already over 250.","finding":"Spontaneous bacterial peritonitis","status":"Antibiotic indicated."},{"id":"normal","label":"Normal ascites. The pain is the diuretic.","verdict":"wrong","feedback":"840 is not a normal count."},{"id":"surg","label":"Secondary peritonitis. Laparotomy before any antibiotic.","verdict":"wrong","feedback":"Even if a surgical leak is possible, the antibiotic does not wait for the incision."},{"id":"ca","label":"Malignant ascites. An oncology referral is the only act.","verdict":"wrong","feedback":"A neutrophil count of 840 is infection until proved otherwise."}]},{"id":"drug","skill":"Treatment","title":"Which drug, and which albumin?","lead":"Creatinine is 1.8 mg/dL. Bilirubin is 5.2 mg/dL.","prompt":"What do you give?","hint":"Cefotaxime 2 g every 8 hours, or ceftriaxone 2 g daily, and albumin 1.5 g/kg today.","guideline":"Cefotaxime 2 g IV every 8 hours is the classic regimen. Ceftriaxone 2 g IV daily is an accepted alternative. Albumin 1.5 g/kg on day 1 and 1 g/kg on day 3 is for creatinine above 1 mg/dL, urea above 30 mg/dL, or bilirubin above 4 mg/dL.","answer":"Cefotaxime or ceftriaxone, plus albumin","kind":"choice","successFinding":"Antibiotic and albumin","successStatus":"First dose running. Albumin started.","missYou":"Not that regimen","miss":"A third-generation cephalosporin, and albumin because the creatinine and the bilirubin qualify. A diuretic is not an antibiotic.","choices":[{"id":"ctx","label":"Cefotaxime 2 g IV every 8 hours, or ceftriaxone 2 g IV daily, plus albumin 1.5 g/kg today","verdict":"correct","feedback":"The antibiotic treats the bacteria. The albumin is for the kidney risk her numbers already show. Day 3 is 1 g/kg if she still qualifies.","finding":"Cefotaxime and albumin","status":"Antibiotic and albumin running.","sbp":100,"hr":100},{"id":"loop","label":"Furosemide only","verdict":"wrong","feedback":"A diuretic does not kill bacteria.","critical":true},{"id":"alb","label":"Albumin, and no antibiotic","verdict":"wrong","feedback":"Albumin does not replace the antibiotic."},{"id":"vanc","label":"Vancomycin only, because ascites is a gram-positive infection","verdict":"wrong","feedback":"The usual organisms are enteric gram-negative rods. Vancomycin alone is the wrong cover."}]},{"id":"day","skill":"Reassessment","title":"She is improving on day two","lead":"The fever is down. The abdomen is softer. The culture is growing an organism that matches the drug.","prompt":"How long, and what else?","hint":"About five days if she keeps improving. Look for why this happened. Not a shunt tonight, and not a steroid.","guideline":"A five-day course is enough for most people who improve. A transjugular shunt is not the treatment of resolving peritonitis.","answer":"Five days, and look for a precipitant","kind":"choice","successFinding":"Course set","successStatus":"Improving. Five-day course.","missYou":"Not that plan","miss":"Finish a short course if she is better. Do not add a steroid, and do not send her home after one dose.","choices":[{"id":"five","label":"Continue to about five days, and look for the precipitant","verdict":"correct","feedback":"Improvement is the reason to complete a short course, not to invent a longer one.","finding":"Five-day course","status":"Improving.","sbp":108,"hr":88},{"id":"one","label":"One dose was enough. Home tonight.","verdict":"wrong","feedback":"A single dose is not a course."},{"id":"dex","label":"Add dexamethasone","verdict":"wrong","feedback":"Steroids are not the treatment of infected ascites."},{"id":"taps","label":"Daily large-volume taps instead of finishing the antibiotic","verdict":"wrong","feedback":"Draining the fluid does not replace the drug."}]},{"id":"c6","skill":"Reassessment","title":"It is day 3. She looks better","lead":"Temperature is normal. Creatinine is 1.6, from 1.8. She met the albumin criteria on day 1 and received 1.5 g/kg. The day-3 dose is being omitted because she looks well.","prompt":"Does the day-3 albumin still happen?","hint":"Yes. 1 g/kg on day 3. Looking better does not cancel the dose that was indicated.","guideline":"Albumin on day 1 and day 3 is the regimen when creatinine or bilirubin met the threshold. Improvement is the reason it worked, not a reason to skip the second day.","answer":"Give the day-3 albumin","kind":"choice","successFinding":"Day-3 albumin given","successStatus":"Improving. Albumin completed.","missYou":"Not that decision","miss":"Yes. 1 g/kg on day 3. Looking better does not cancel the dose that was indicated.","choices":[{"id":"ok","label":"Give albumin 1 g/kg today","verdict":"correct","feedback":"The trial dose is two days, not one, when she qualified.","finding":"Day-3 albumin given","status":"Improving. Albumin completed."},{"id":"w0","label":"Skip it. She looks well","verdict":"wrong","feedback":"Looking well is not the cancel button."},{"id":"w1","label":"1.5 g/kg every day for a week","verdict":"wrong","feedback":"Day 3 is 1 g/kg, not an indefinite load."},{"id":"w2","label":"Albumin and stop the antibiotic","verdict":"wrong","feedback":"The antibiotic is why the infection is fading."}]},{"id":"c7","skill":"Reassessment","title":"Someone wants a large diuresis today","lead":"The abdomen is still distended. Creatinine is 1.6. She is not breathless. A 5-litre tap with no albumin is suggested, plus furosemide.","prompt":"What do you allow?","hint":"Not a large tap with no albumin, and not an aggressive diuresis while the creatinine is still up. The infection treatment continues.","guideline":"Large-volume paracentesis needs albumin. Diuretics in the first days of SBP, with a raised creatinine, can worsen the kidney. This is not the afternoon for either.","answer":"No large tap without albumin. No aggressive diuresis","kind":"choice","successFinding":"Diuresis deferred","successStatus":"Infection still the priority.","missYou":"Not that decision","miss":"Not a large tap with no albumin, and not an aggressive diuresis while the creatinine is still up. The infection treatment continues.","choices":[{"id":"ok","label":"Do not take 5 litres off without albumin, and do not push diuretic","verdict":"correct","feedback":"The kidney is why she got albumin. Do not insult it with a dry-out.","finding":"Diuresis deferred","status":"Infection still the priority."},{"id":"w0","label":"Five litres off, no albumin","verdict":"wrong","feedback":"That is how the kidney fails.","critical":true},{"id":"w1","label":"Furosemide and spironolactone at high dose today","verdict":"wrong","feedback":"The creatinine has not recovered."},{"id":"w2","label":"Stop albumin and start the diuretic","verdict":"wrong","feedback":"You are on the albumin day, not the diuretic day."}]},{"id":"c8","skill":"Reassessment","title":"How long is the antibiotic?","lead":"Day 3, improving, organism sensitive, no secondary peritonitis on the story.","prompt":"What duration do you write?","hint":"About five days if she keeps improving. Not one more dose, and not three weeks.","guideline":"A responding spontaneous bacterial peritonitis is treated for about 5 days. Longer is for a complication, not for anxiety.","answer":"About five days","kind":"choice","successFinding":"Five-day
