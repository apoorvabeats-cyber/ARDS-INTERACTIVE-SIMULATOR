ting for a species is how septic shock gets its mortality. Cover a community urinary source now, with a drug that treats gram-negative infection. Vancomycin alone does not. Narrow the antibiotic when the culture speaks."}]},{"id":"click-lv","skill":"Localization","title":"Click the left ventricular cavity","lead":"Parasternal long-axis view, teaching still. You are separating an empty hyperdynamic ventricle from a baggy one, a dilated right ventricle, or an effusion.","prompt":"Click the left ventricular cavity.","hint":"The cavity is the small black space in the middle of the sector, inside the muscle. The near field at the top is the right-ventricular side, and it is not a large chamber. Do not click the gray muscle.","guideline":"In early septic shock the left ventricle is often small and hyperdynamic, which supports fluid and a vasopressor rather than an inotrope. A dilated, poorly contracting ventricle changes that plan. A large right ventricle suggests obstruction. An effusion with chamber collapse is tamponade.","answer":"Small left ventricular cavity","image":{"src":"sim/shock-plax.jpg","alt":"Teaching illustration of a parasternal long-axis view with a small left ventricular cavity","caption":"Parasternal long-axis echocardiogram, teaching illustration. Not a real study. The black space in the middle of the sector is the ventricular cavity."},"kind":"hotspot","successFinding":"Small, underfilled left ventricular cavity","successStatus":"Hyperdynamic, underfilled left ventricle. Right ventricle not dilated.","missYou":"Clicked off the left ventricular cavity","miss":"The cavity is the small black center of the sector. Gray tissue around it is muscle. The top of the sector is the right-ventricular side.","regions":[{"id":"lv","verdict":"correct","cx":0.45,"cy":0.47,"rx":0.065,"ry":0.06,"you":"Small left ventricular cavity","feedback":"That black space is a small cavity, not a dilated bag. The ventricle is underfilled and, in this context, hyperdynamic. There is no large pericardial effusion around it, and the near field is not a strained right ventricle. This is the echo of distributive shock that can still take fluid, not the echo of cardiogenic shock."},{"id":"rv","verdict":"wrong","cx":0.5,"cy":0.18,"rx":0.11,"ry":0.055,"you":"Right-ventricular side, near field","feedback":"That is the near field, on the right-ventricular side of a parasternal long-axis view. It is not a dilated, pressure-overloaded right ventricle. Come down into the small black cavity in the middle of the sector."},{"id":"wall","verdict":"wrong","cx":0.66,"cy":0.42,"rx":0.07,"ry":0.08,"you":"Myocardium","feedback":"That gray tissue is muscle. The finding is the size of the cavity it surrounds. The cavity is the black center, and it is small."}]},{"id":"phenotype","skill":"Classification","title":"Name the shock","lead":"The left ventricular cavity is small. The right ventricle is not dilated. There is no pericardial effusion. Lungs are clear. Lactate is 5.4. She is febrile, with a urinary source. Mean pressure is about 55.","prompt":"Which phenotype fits?","hint":"Cardiogenic shock has a full, poorly contracting left ventricle. Tamponade has an effusion and collapsing chambers. Massive embolism has a dilated right ventricle. She has none of those.","guideline":"Septic shock is distributive: low systemic vascular resistance, often with a high cardiac output once volume is restored. Bedside ultrasound is what stops you treating it as cardiogenic, obstructive, or tamponade.","answer":"Distributive septic shock with an underfilled ventricle","kind":"choice","successFinding":"Distributive septic shock. Ventricle underfilled.","successStatus":"Septic shock. Not cardiogenic, not tamponade.","missYou":"","miss":"","choices":[{"id":"sepsis","label":"Distributive shock, most likely septic, with an underfilled ventricle. Not cardiogenic. Not tamponade. Not a massive pulmonary embolus.","verdict":"correct","feedback":"Fever, a source, lactate, and a small hyperdynamic ventricle is septic shock until a better story appears. She can take measured fluid. She needs a vasopressor. She does not need dobutamine for a ventricle that is emptying, a needle in a pericardium that is empty, or a thrombolytic for a right ventricle that is not dilated.","finding":"Phenotype: septic, distributive, underfilled.","status":"Septic shock. Echo does not show cardiogenic or obstructive shock."},{"id":"cardio","label":"Cardiogenic shock. Start dobutamine and stop all fluid.","verdict":"wrong","critical":true,"feedback":"Cardiogenic shock is a dilated, poorly contracting left ventricle, often with pulmonary edema. Hers is small. Dobutamine in profound vasoplegia drops the pressure further. Fluid is not forbidden. It is titrated."},{"id":"tamponade","label":"Tamponade. Pericardiocentesis now.","verdict":"wrong","critical":true,"feedback":"Tamponade needs an effusion and chambers that cannot fill. There is no effusion on this view. A needle into that pericardium is a complication, not a rescue."},{"id":"pe","label":"Massive pulmonary embolism. Give a thrombolytic.","verdict":"wrong","critical":true,"feedback":"Obstructive shock from embolism shows a dilated, strained right ventricle. That is not this view, and the story is fever and dysuria. A thrombolytic here is the wrong drug for the wrong disease."}]},{"id":"resuscitate","skill":"Resuscitation","title":"Fluid and the first vasopressor","lead":"Weight 80 kg. Lungs are clear. The ventricle is underfilled. Mean pressure is about 55. Lactate is 5.4. Antibiotics are being mixed if you ordered them. She has had no measured fluid yet.","prompt":"How do you resuscitate the pressure?","hint":"Norepinephrine is first-line, titrated to a mean pressure of 65, not 80. While the lungs are clear and the ventricle is empty, about 30 mL/kg of crystalloid is the classic initial volume: 2.4 liters for 80 kg. Recheck before you reflexively give more.","guideline":"Norepinephrine is the first vasopressor in septic shock, with a usual mean-pressure target of 65 mmHg. Initial crystalloid, often quoted as 30 mL/kg, is for hypoperfusion when overload is absent. More fluid is an active decision, not an automatic second 30 mL/kg.","answer":"Norepinephrine to a mean pressure of 65, plus about 30 mL/kg if the lungs stay clear","kind":"choice","successFinding":"Norepinephrine started and initial crystalloid ordered","successStatus":"Norepinephrine running. First liters going in. Lungs still clear.","missYou":"","miss":"","choices":[{"id":"both","label":"Start norepinephrine now and titrate to a mean pressure of 65. Give about 30 mL/kg crystalloid, 2.4 liters, while the lungs stay clear and the cava is not plethoric. Repeat the lactate.","verdict":"correct","sbp":88,"dbp":48,"feedback":"She needs both. A mean pressure of 55 is a vasopressor indication now, not after the third liter. Thirty milliliters per kilogram of 80 kg is 2.4 liters, and her empty ventricle says the first part of that is welcome. She is not at the target of 65 yet. Stop if crackles appear or the inferior vena cava stops collapsing. Chasing a mean pressure of 85 just adds arrhythmia and vasoconstriction.","finding":"Norepinephrine for MAP 65. Initial 30 mL/kg crystalloid.","status":"Pressure 88/48 on norepinephrine. Fluid running. Lungs clear."},{"id":"more-fluid","label":"No vasopressor. Another 3 liters after an initial 2 liters, because sepsis is a fluid problem.","verdict":"wrong","feedback":"Fluid without a vasopressor leaves a vasodilated patient hypotensive while you search for a liter that will not come. Start norepinephrine. Give the initial volume. Then reassess, instead of committing to 5 liters on principle."},{"id":"vaso-only","label":"Vasopressin as the only drug, fixed dose, and no fluid because the lactate is a laboratory problem.","verdict":"wrong","critical":true,"feedback":"Vasopressin is an adjunct, not the first agent, and it is not started alone. The lactate of 5.4 with an empty heart is hypoperfusion. She needs norepinephrine and measured crystalloid."},{"id":"pressor-no-fluid","label":"Norepinephrine to a mean pressure of 65, and no fluid, because septic shock is pure vasoplegia.","verdict":"partial","sbp":88,"dbp":54,"feedback":"Norepinephrine is the right drug and 65 is the right target. The ventricle is empty and the lungs are clear, so withholding all crystalloid ignores the volume she can still use. Give the initial 30 mL/kg and reassess. Do not give a second 30 by habit.","finding":"Norepinephrine without the initial fluid.","status":"On norepinephrine. Still underfilled."}]},{"id":"second","skill":"Vasopressors","title":"The first agent is not enough","lead":"She has received 2 liters. Norepinephrine is 0.25 micrograms per kilogram per minute. Mean pressure is 61. Lactate has fallen only to 4.1. Lungs are still clear. There is no abscess a surgeon must drain tonight.","prompt":"What do you add?","hint":"Vasopressin 0.03 units per minute is the usual second vasopressor, not a bolus and not a substitute for norepinephrine. Hydrocortisone is reasonable while shock still needs a high-dose vasopressor. It does not replace the second agent. Do not climb norepinephrine to extreme doses first.","guideline":"Vasopressin 0.03 units per minute is added to norepinephrine when the dose is rising and the mean pressure is still short of target. It is not titrated up like norepinephrine. IV hydrocortisone is suggested for septic shock with an ongoing vasopressor requirement. The mean-pressure target stays 65.","answer":"Add vasopressin 0.03 units per minute, and consider hydrocortisone","kind":"choice","atStart":{"sbp":86,"dbp":48,"hr":118,"spo2":96,"status":"Two liters in. Norepinephrine 0.25 mcg/kg/min. Mean pressure still about 61."},"successFinding":"Vasopressin added as the second vasopressor","successStatus":"Norepinephrine plus vasopressin. Mean pressure recovering.","missYou":"","miss":"","choices":[{"id":"vaso","label":"Add vasopressin at 0.03 units per minute. Consider hydrocortisone 50 mg intravenously every 6 hours while she still needs a vasopressor. Keep the mean-pressure target at 65. Continue antibiotics.","verdict":"correct","sbp":108,"dbp":62,"feedback":"At 0.25 micrograms per kilogram per minute of norepinephrine with a mean pressure still under 65, a second agent is due. Vasopressin is a fixed 0.03 units per minute, not a push and not a titration to 0.1. Hydrocortisone is adjunctive for ongoing shock. It is not the drug that replaces norepinephrine, and a vitamin infusion is not the next step. Source control here is the antibiotic and the urine. A CT can happen when the pressure allows.","finding":"Vasopressin 0.03 U/min added. Steroid considered.","status":"Two vasopressors. Pressure 108/62."},{"id":"max","label":"Take norepinephrine to 1.5 micrograms per kilogram per minute before adding anything.","verdict":"wrong","feedback":"Extreme single-agent doses buy ischemia. The usual move, once norepinephrine is in the range of a quarter microgram per kilogram per minute and the target is still missed, is to add vasopressin rather than to triple the first drug."},{"id":"cocktail","label":"Stop norepinephrine. Start a vitamin C cocktail as the rescue.","verdict":"wrong","critical":true,"feedback":"Stopping norepinephrine for an unproven cocktail drops the pressure you just spent an hour building. Keep the vasopressor. Add vasopressin. Do not replace resuscitation with a vitamin."},{"id":"steroid-only","label":"Hydrocortisone only. No second vasopressor.","verdict":"partial","feedback":"A steroid is a fair adjunct when shock is ongoing. It is not the agent that moves the mean pressure in the next minutes. Add vasopressin as well, at 0.03 units per minute, and keep norepinephrine running.","finding":"Steroid without a second vasopressor.","status":"Hydrocortisone ordered. Still on norepinephrine alone."}]},{"id":"click-ivc","skill":"Localization","title":"The next morning","lead":"Norepinephrine is down to 0.06 micrograms per kilogram per minute. Mean pressure is 74. Lactate is 1.8. Overnight she received maintenance fluid on top of the resuscitation. Saturation is 90% on 4 liters, and she has new crackles. This is a subcostal view.","prompt":"Click the inferior vena cava.","hint":"The lumen is the wide black tube. The liver is the gray organ beside it. A collapsing, slit-like vein would be flat. This one is not.","guideline":"A plethoric inferior vena cava with little inspiratory collapse, plus new pulmonary edema, means more crystalloid is likely to harm. Fluid responsiveness is reassessed. It is not assumed from yesterday’s lactate.","answer":"Plethoric inferior vena cava","image":{"src":"sim/shock-ivc.jpg","alt":"Teaching illustration of a plethoric inferior vena cava beside the liver","caption":"Subcostal ultrasound, teaching illustration of a dilated inferior vena cava. Not a real study. The vein is the black lumen. The liver is gray."},"kind":"hotspot","atStart":{"sbp":112,"dbp":55,"hr":96,"rr":24,"spo2":90,"status":"Next morning. Low-dose norepinephrine. New crackles."},"successFinding":"Plethoric inferior vena cava","successStatus":"IVC dilated. New crackles. No longer fluid responsive.","missYou":"Clicked off the vein","miss":"The inferior vena cava is the wide black tube in the sector. The gray tissue is liver. Click the lumen.","regions":[{"id":"ivc","verdict":"correct","cx":0.6,"cy":0.635,"rx":0.16,"ry":0.055,"you":"Dilated inferior vena cava","feedback":"That wide black lumen is a plethoric inferior vena cava, not a slit. Combined with new crackles and a falling saturation, she is no longer the empty patient from yesterday. More saline will worsen the oxygen. The vein does not, by itself, prove the filling pressure, but it is enough to stop the fluid."},{"id":"liver","verdict":"wrong","cx":0.34,"cy":0.28,"rx":0.15,"ry":0.12,"you":"Liver","feedback":"That gray organ is liver. The vein is the black tube next to it, and the tube is wide. Click the lumen."}]},{"id":"stop-fluid","skill":"Reassessment","title":"What do you do with fluid now?","lead":"The cava is plethoric. Crackles are new. Saturation is 90% on 4 liters. Norepinephrine is 0.06 micrograms per kilogram per minute and the mean pressure is 74. Lactate is 1.8. Yesterday’s lactate was 5.4.","prompt":"Choose the fluid plan for today.","hint":"Perfusion has been restored. The lung is wet and the vein is full. Stop boluses and stop maintenance fluid. A diuretic is reasonable if the oxygen is the problem and the pressure stays up. Do not repeat 30 mL/kg because of yesterday.","guideline":"After the initial resuscitation, further fluid is guided by reassessment. Pulmonary edema and a plethoric cava are reasons to stop, and often to remove, fluid. A falling lactate means the earlier hypoperfusion is improving. It is not an order for more saline.","answer":"Stop fluid. Diurese if the oxygen requires it and the pressure holds.","kind":"choice","successFinding":"Fluids stopped for volume overload","successStatus":"Fluid stopped. Diuretic ordered. Vasopressor weaning.","missYou":"","miss":"","choices":[{"id":"stop","label":"Stop boluses and maintenance fluid. If the pressure holds, give a diuretic for the edema. Keep a low-dose vasopressor rather than flooding her to come off it. Recheck the saturation.","verdict":"correct","spo2":94,"feedback":"Yesterday she was empty. Today she is full, wet, and perfusing, with a lactate of 1.8 and a mean pressure of 74 on a small dose of norepinephrine. More crystalloid treats a problem she no longer has. Stopping the fluid, and removing some of it, is how the oxygen comes back. Wean the vasopressor on its own merits. Do not buy a lower norepinephrine dose with pulmonary edema.","finding":"Fluids stopped. Diuretic for hydrostatic edema.","status":"Overload recognized. Saturation recovering on less fluid."},{"id":"repeat","label":"Repeat 30 mL/kg. The lactate was 5.4 yesterday, so the protocol is not finished.","verdict":"wrong","critical":true,"feedback":"Thirty milliliters per kilogram was an initial resuscitation target, not a daily subscription. Giving it again to a plethoric, crackling patient is how non-cardiogenic resuscitation becomes pulmonary edema. Her lactate has already fallen."},{"id":"dobutamine","label":"Start dobutamine. Occult cardiogenic shock explains the crackles.","verdict":"wrong","feedback":"Crackles after several liters, with a full cava and a ventricle that was empty yesterday, are volume until you prove otherwise. Dobutamine is for a low-output ventricle. You have not shown one. Stop the fluid first."},{"id":"albumin","label":"Albumin 100 g and another liter of saline, to pull fluid into the vessels.","verdict":"wrong","feedback":"Albumin is not a diuretic, and adding saline beside it increases the total volume. She needs less fluid, not a different brand of more fluid. Stop the infusions and consider a diuretic."}]}]},{"id":"pancreatitis","title":"Acute pancreatitis","syndrome":"Biliary, early organ failure","minutes":"12 min","difficulty":"Core","available":true,"summary":"Epigastric pain to the back after known gallstones. Start the fluid, skip the early scan, then click the necrosis and choose the drain rather than an open operation.","queued":"","clockLabel":"Since the pain began","objectives":["Make the diagnosis without an early CT","Choose a moderate lactated Ringer plan","Find the gallstone cause","Click the non-enhancing pancreas","Drain infected necrosis instead of opening the abdomen"],"thumb":"sim/pancreatitis-ct.jpg","patient":"R. Mehta","ageSex":"52-year-old man","chart":["Teaching case. Not a real patient, and not a substitute for a pancreatitis decision.","Eight hours of epigastric pain going through to the back. Two vomits. No fever at the door.","Gallstones on an ultrasound last year. Rare alcohol. No new medicine. Weight 80 kg.","Tender epigastrium. No rigid abdomen and no free air on the erect chest film.","Heart rate 118. Blood pressure 92/58. Respiratory rate 26. Oxygen saturation 95 percent on air.","Glucose 168 mg/dL. Lipase is not back yet."],"opening":{"lkwMin":480,"status":"Epigastric pain to the back. Hypotensive.","sbp":92,"dbp":58,"hr":118,"rr":26,"spo2":95,"glucose":168},"stages":[{"id":"first-move","skill":"Resuscitation","title":"What do you do first?","lead":"The pain is typical, the blood pressure is low, and the lipase is still in the centrifuge. The scanner is free. The theatre is not the next room you want.","prompt":"What is the first move?","hint":"Two of pain, enzymes, and imaging make the diagnosis. You already have the pain. Do not spend the first hour on a scan he may not need.","guideline":"Characteristic pain plus a lipase at least three times the upper limit is enough to diagnose pancreatitis. Contrast CT on the first day is for diagnostic doubt, not for a classic story, and it underestimates necrosis.","answer":"Lipase, and lactated Ringer while you watch the pulse","kind":"choice","successFinding":"Lipase sent. Lactated Ringer started.","successStatus":"Fluid running. Lipase pending.","missYou":"","miss":"","choices":[{"id":"lipase-fluid","label":"Send a lipase and start intravenous lactated Ringer","verdict":"correct","feedback":"The story is already characteristic. The lipase confirms it. He is tachycardic and hypotensive, so fluid starts now, not after a scan. Contrast CT can wait until the diagnosis is in doubt or he is failing later.","finding":"Lipase sent. Lactated Ringer started.","status":"Fluid running. Lipase pending.","sbp":98,"hr":110},{"id":"ct-first","label":"Contrast CT of the abdomen before any fluid","verdict":"wrong","delayMin":40,"feedback":"An early contrast scan does not diagnose this faster than a lipase, and it can miss necrosis that has not declared itself. He is under-filled. Resuscitate and send the enzyme. Image later if you still need to."},{"id":"laparotomy","label":"Immediate exploratory laparotomy","verdict":"wrong","critical":true,"delayMin":90,"feedback":"There is no peritonism and no free air. Opening the abdomen for uncomplicated early pancreatitis adds harm and does not treat the inflammation. This is a medical resuscitation first."},{"id":"antibiotic","label":"Prophylactic imipenem, and no fluid yet","verdict":"wrong","feedback":"Antibiotics do not prevent infection of necrosis, and they are not the treatment of hypovolemia. He needs fluid and a diagnosis, not a carbapenem at the door."}]},{"id":"diagnosis","skill":"Diagnosis","title":"The lipase is back","lead":"Lipase is 2,140 U/L. The laboratory upper limit is 60. The pain has not moved. He has had one litre of lactated Ringer.","prompt":"What do you call this, and do you scan now?","hint":"The enzyme is more than three times the upper limit. Imaging is the third way to diagnose, not a requirement once the first two are met.","guideline":"Acute pancreatitis is diagnosed with two of three: typical pain, lipase or amylase at least three times the upper limit, or characteristic imaging. CT is reserved for doubt or for later deterioration.","answer":"Acute pancreatitis. No CT today.","kind":"choice","successFinding":"Acute pancreatitis diagnosed without an early CT","successStatus":"Lipase 2,140. Resuscitation continues.","missYou":"","miss":"","choices":[{"id":"no-scan","label":"Acute pancreatitis. Continue resuscitation. Do not scan today.","verdict":"correct","feedback":"Pain plus a lipase more than thirty times the upper limit is the diagnosis. A contrast CT this morning will not change the fluid, and it may under-call necrosis. Look for the cause and watch the organs.","finding":"Acute pancreatitis diagnosed without an early CT","status":"Lipase 2,140. Resuscitation continues."},{"id":"ct-anyway","label":"The lipase is high, so he needs a contrast CT now","verdict":"wrong","delayMin":30,"feedback":"The lipase already answered the diagnostic question. Early CT is for a doubtful abdomen, not for a textbook enzyme. It also delays the fluid and the search for a stone."},{"id":"discharge","label":"Gastritis. Discharge on an oral antacid.","verdict":"wrong","critical":true,"feedback":"A lipase of 2,140 is not gastritis. Sending him home with this pulse and blood pressure misses organ failure at the door."},{"id":"ercp-all","label":"Urgent ERCP for every patient with gallstones","verdict":"wrong","feedback":"A stone in the gallbladder is not an indication for an emergency ERCP. Urgent ERCP is for cholangitis or a stone still blocking the bile duct. He has no fever and no jaundice yet."}]},{"id":"fluids","skill":"Fluids","title":"Set the fluid plan","lead":"He weighs 80 kg. After one litre he is still dry: heart rate 110, blood pressure 98/64, urine 15 mL in the last hour. The lungs are clear.","prompt":"Which fluid plan do you write?","hint":"Lactated Ringer is the usual fluid. More is not better. The aggressive protocol caused more fluid overload without a better recovery.","guideline":"Moderate lactated Ringer, about 1.5 mL/kg per hour after a bolus only if hypovolemic, is preferred to a prolonged high-rate infusion. Stop or slow the fluid if oxygen falls or the lungs fill. The WATERFALL trial is the reason the aggressive arm is not the default.","answer":"Moderate lactated Ringer, reassessed every few hours","kind":"choice","atStart":{"hr":110,"sbp":98,"dbp":64,"status":"Still volume-responsive. Lungs clear."},"successFinding":"Moderate lactated Ringer plan","successStatus":"1.5 mL/kg/h of lactated Ringer. Urine watched.","missYou":"","miss":"","choices":[{"id":"moderate","label":"Lactated Ringer at about 1.5 mL/kg per hour, and reassess urine, pulse, and oxygen","verdict":"correct","feedback":"He is hypovolemic, so he can have a bolus, then a moderate rate, about 120 mL per hour at this weight, not a day-long flood. Recheck the urine, the pulse, and the saturation. If the lungs get wet, the fluid stops.","finding":"Moderate lactated Ringer plan","status":"1.5 mL/kg/h of lactated Ringer. Urine watched.","sbp":108,"dbp":68,"hr":98,"spo2":96},{"id":"aggressive","label":"A 20 mL/kg bolus, then 3 mL/kg per hour for a full day","verdict":"wrong","feedback":"That is the aggressive arm. In the WATERFALL trial it caused more fluid overload and did not improve outcomes. Use a moderate rate and stop when the circulation has answered.","spo2":91,"rr":30,"status":"More fluid. Saturation falling."},{"id":"saline","label":"Normal saline at that same aggressive rate","verdict":"wrong","feedback":"Saline in large volume tends toward a hyperchloremic acidosis, and the rate is still the aggressive one. Lactated Ringer at a moderate rate is the plan."},{"id":"none","label":"No further fluid. The low pressure is only pain.","verdict":"wrong","critical":true,"feedback":"Pain does not explain a heart rate of 110 and 15 mL of urine in an hour. Untreated hypovolemia is how early pancreatitis becomes prolonged organ failure."}]},{"id":"cause","skill":"Cause","title":"Name the cause today","lead":"The pain is settling toward the moderate fluid. You still do not know why the pancreas inflamed. The history has gallstones and almost no alcohol.","prompt":"What do you arrange now?","hint":"The common causes are gallstones, alcohol, high triglycerides, and a medicine. Ultrasound is the first look at the gallbladder. Save MRCP for when the duct is the question.","guideline":"Right-upper-quadrant ultrasound is the first test for a biliary source. A triglyceride level is needed when the serum is lipemic or the history suggests it. MRCP or EUS comes later, not ahead of resuscitation.","answer":"Ultrasound for stones, plus triglycerides if the serum is lipemic","kind":"choice","successFinding":"Ultrasound shows gallbladder stones. No bile-duct dilatation.","successStatus":"Biliary pancreatitis. No cholangitis.","missYou":"","miss":"","choices":[{"id":"us","label":"Right-upper-quadrant ultrasound, and a triglyceride level if the blood looks lipemic","verdict":"correct","feedback":"Ultrasound shows stones in the gallbladder and a bile duct that is not dilated. There is no fever and no jaundice, so this is biliary pancreatitis without cholangitis. The gallbladder will need to come out, but not tonight.","finding":"Ultrasound shows gallbladder stones. No bile-duct dilatation.","status":"Biliary pancreatitis. No cholangitis."},{"id":"mrcp","label":"MRCP tonight, before ultrasound, while he is still hypotensive","verdict":"wrong","delayMin":50,"feedback":"MRCP is a good test for a stone in the duct when ultrasound has not answered that question. It is a poor first test in a man who still needs the ward, the fluid, and a simple ultrasound."},{"id":"ignore","label":"The cause can wait until the clinic","verdict":"wrong","feedback":"Missing gallstones means a second attack. The cause is looked for on this admission, even when the operation itself waits."},{"id":"eus","label":"Endoscopic ultrasound as the first test","verdict":"wrong","feedback":"Endoscopic ultrasound is a second-line look for microlithiasis or a missed stone. It is not the test you book from the door. Start with a transabdominal ultrasound."}]},{"id":"click-necrosis","skill":"Localization","title":"Click the necrosis","lead":"Forty-eight hours on, the urine is still poor, the saturation is 92 percent on oxygen, and the creatinine has risen. A contrast CT is now justified. One part of the gland does not take up contrast.","prompt":"Click the non-enhancing pancreatic body.","hint":"Radiological orientation: the patient’s left is marked L. The dark geographic area is in the gland, not in the liver and not in the spleen.","guideline":"Necrosis is pancreatic tissue that does not enhance. It is usually obvious after the first several days, which is why a scan at the door is a poor map. Necrosis alone is not proof of infection.","answer":"Non-enhancing pancreatic body","image":{"src":"sim/pancreatitis-ct.jpg","alt":"Teaching illustration of an axial contrast CT with non-enhancing pancreatic body","caption":"Contrast CT, teaching illustration. Patient’s left is marked L. Not a real scan."},"kind":"hotspot","atStart":{"spo2":92,"rr":28,"hr":108,"sbp":104,"dbp":64,"status":"Organ failure still present at 48 hours."},"successFinding":"Necrosis in the pancreatic body","successStatus":"Necrotizing pancreatitis. No gas on this scan.","missYou":"Clicked outside the non-enhancing gland","miss":"Not that organ. The necrosis is the dark geographic area in the pancreas, just toward the side marked L of the midline.","regions":[{"id":"necrosis","verdict":"correct","cx":0.57,"cy":0.36,"rx":0.1,"ry":0.08,"you":"Non-enhancing pancreatic body","feedback":"That dark area in the gland does not enhance. This is necrosis of the pancreatic body, with a little fluid around it. There is no gas. Necrosis is not the same thing as infection, so it is not an indication for an antibiotic or an operation today."},{"id":"liver","verdict":"wrong","cx":0.22,"cy":0.42,"rx":0.14,"ry":0.16,"you":"Liver","feedback":"That large organ on the side marked R is the liver. It is not the inflamed gland. Come back toward the midline, slightly toward the L marker."},{"id":"spleen","verdict":"wrong","cx":0.84,"cy":0.4,"rx":0.08,"ry":0.1,"you":"Spleen","feedback":"That oval on the side marked L is the spleen. The pancreas sits medial to it. The non-enhancing tissue is closer to the midline."},{"id":"spine","verdict":"wrong","cx":0.5,"cy":0.74,"rx":0.08,"ry":0.08,"you":"Vertebra","feedback":"The bright white structure at the back is the vertebra. Necrosis is soft tissue in front of it, in the pancreas."}]},{"id":"read-ct","skill":"Interpretation","title":"What does this scan change?","lead":"Same slice. Necrosis in the body, a rim of fluid, no gas, and organ failure that has already lasted two days.","prompt":"Which plan matches the scan?","hint":"Separate three decisions: antibiotics, feeding, and an operation. Necrosis without gas is not an infected collection.","guideline":"Prophylactic antibiotics do not prevent infection of necrosis. Enteral feeding is preferred if he cannot eat. Open necrosectomy is not the treatment of sterile necrosis.","answer":"No prophylactic antibiotic. Feed the gut. Do not operate today.","image":{"src":"sim/pancreatitis-ct.jpg","alt":"The same teaching CT of pancreatic necrosis","caption":"Same teaching illustration. Not a real scan."},"kind":"choice","successFinding":"Sterile necrosis. No antibiotic. Enteral plan.","successStatus":"Necrosis without gas. Organs supported.","missYou":"","miss":"","choices":[{"id":"support","label":"No antibiotic. Start enteral feed. Do not operate.","verdict":"correct","feedback":"This is necrotizing pancreatitis with persistent organ failure, which makes it severe. The necrosis is not infected on this scan. Antibiotics do not sterilize it in advance. If he cannot eat, feed the gut. An operation today removes tissue that may recover and that is not the source of sepsis yet.","finding":"Sterile necrosis. No antibiotic. Enteral plan.","status":"Necrosis without gas. Organs supported."},{"id":"mero","label":"Meropenem now, because necrosis means infection","verdict":"wrong","feedback":"Necrosis is dead tissue, not automatically infected tissue. Gas, or a septic deterioration later, is what changes that. A prophylactic carbapenem selects resistant organisms for the day you actually need a drug."},{"id":"open","label":"Open necrosectomy this afternoon","verdict":"wrong","critical":true,"feedback":"Operating on sterile necrosis early increases harm. Drainage, if it is ever needed, waits for a walled collection or for a patient who is septic from it. Today he needs organ support."},{"id":"starve","label":"Nil by mouth until the lipase is normal","verdict":"wrong","feedback":"The lipase is not a switch for feeding. Early oral intake is used in mild disease, and enteral feed is used when he cannot eat. Starvation until the enzyme falls is an old plan."}]},{"id":"feed","skill":"Nutrition","title":"He cannot eat","lead":"It is the third da function toTop(){

function soundCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(ac, freq, start, dur, type, peak){
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(peak, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(start);
  o.stop(start + dur + 0.02);
}
function playVerdict(verdict){
  if (mode === "exam") return;
  const ac = soundCtx();
  if (verdict === "wrong"){
    if (!ac) return;
    const t = ac.currentTime;
    tone(ac, 880, t, 0.16, "square", 0.08);
    tone(ac, 620, t + 0.18, 0.16, "square", 0.08);
    tone(ac, 880, t + 0.36, 0.18, "square", 0.08);
    return;
  }
  if (verdict !== "correct") return;
  if (ac){
    const t = ac.currentTime;
    tone(ac, 523, t, 0.12, "sine", 0.07);
    tone(ac, 784, t + 0.1, 0.18, "sine", 0.07);
  }
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const said = new SpeechSynthesisUtterance("Correct");
    said.lang = "en-US";
    said.rate = 1;
    window.speechSynthesis.speak(said);
  } catch (e) {}
}
function orderedChoices(stage){
  const key = item.id + ":" + index + ":" + stage.id;
  if (orderKey !== key){
    const ids = (stage.choices || []).map(function(choice){ return choice.id; });
    for (let i = ids.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const swap = ids[i];
      ids[i] = ids[j];
      ids[j] = swap;
    }
    orderKey = key;
    choiceOrder = ids;
  }
  const byId = {};
  (stage.choices || []).forEach(function(choice){ byId[choice.id] = choice; });
  return choiceOrder.map(function(id){ return byId[id]; }).filter(Boolean);
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}
function formatDuration(mins){
  const m = Math.max(0, Math.round(mins));
  const h = Math.floor(m / 60);
  const r = m % 60;
  if (h <= 0) return r + " m";
  return h + " h " + r + " m";
}
function resolveChoice(choice, lkw){
  if (choice.late && lkw > choice.late.afterMin){
    return {verdict: choice.late.verdict, feedback: choice.late.feedback, critical: choice.late.verdict === "wrong" && !!choice.late.critical};
  }
  return {verdict: choice.verdict, feedback: choice.feedback, critical: choice.verdict === "wrong" && !!choice.critical};
}
function hitRegion(regions, x, y){
  let best = null, bestArea = Infinity;
  (regions || []).forEach(function(region){
    const dx = (x - region.cx) / region.rx;
    const dy = (y - region.cy) / region.ry;
    if (dx * dx + dy * dy <= 1){
      const area = region.rx * region.ry;
      if (area < bestArea){ best = region; bestArea = area; }
    }
  });
  return best;
}
function inBrightBox(box, x, y){
  return x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1;
}
function scorePoints(verdict, tries, hintUsed){
  if (verdict === "wrong") return 0;
  const base = verdict === "partial" ? 60 : 100;
  const factor = hintUsed ? 0.4 : tries <= 1 ? 1 : tries === 2 ? 0.7 : 0.5;
  return Math.round(base * factor);
}
function loadBest(id){
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) || "{}");
    return parsed[id] && parsed[id].best ? parsed[id].best : 0;
  } catch(e){ return 0; }
}
function saveBest(id, score){
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) || "{}");
    const best = Math.max((parsed[id] && parsed[id].best) || 0, score);
    parsed[id] = {best: best};
    localStorage.setItem(KEY, JSON.stringify(parsed));
    return best;
  } catch(e){ return score; }
}

function percent(){

}

function applyStart(base){

function teachFor(fallback){
  const stage = item.stages[index];
  if (stage.kind === "choice"){
    const ideal = (stage.choices || []).find(function(choice){ return resolveChoice(choice, lkw()).verdict === "correct"; });
    return ideal ? resolveChoice(ideal, lkw()).feedback : fallback;
  }
  const region = (stage.regions || []).find(function(r){ return r.verdict === "correct"; });
  return region ? region.feedback : fallback;
}
function finish(record, nextLive){
  log.push(record);
  live = nextLive;
  strikes = emptyStrikes();
  feedback = {
    title: mode === "exam" ? "Recorded" : record.verdict === "correct" ? "Correct" : "Partly right",
    body: mode === "learn" ? record.teach : "The explanation waits for the debrief.",
    verdict: record.verdict,
    canAdvance: true

function onChoice(){
  const stage = item.stages[index];
  if (!stage.choices || !selected) return;
  const choice = stage.choices.find(function(c){ return c.id === selected; });
  if (!choice) return;
  const resolved = resolveChoice(choice, lkw());
  const canAdvance = mode === "exam" || resolved.verdict !== "wrong";
  const tries = strikes.tries + 1;
  const critical = strikes.critical || resolved.critical;
  if (!canAdvance){
    strikes = {tries: tries, hint: strikes.hint, critical: critical};
    if (choice.delayMin) live = Object.assign({}, live, {extraMin: live.extraMin + choice.delayMin});
    feedback = {title:"Not that", body: resolved.feedback, verdict:"wrong", canAdvance:false};
    phase = "feedback";
    playVerdict("wrong");
    render();
    return;
  }
  const delay = choice.delayMin == null ? 4 : choice.delayMin;
  const keep = resolved.verdict !== "wrong";
  const nextLive = Object.assign({}, live, {
    extraMin: live.extraMin + delay,
    sbp: keep && choice.sbp != null ? choice.sbp : live.sbp,
    dbp: keep && choice.dbp != null ? choice.dbp : live.dbp,
    rr: keep && choice.rr != null ? choice.rr : live.rr,
    spo2: keep && choice.spo2 != null ? choice.spo2 : live.spo2,
    gcs: keep && choice.gcs ? choice.gcs : live.gcs,
    nihss: keep && choice.nihss != null ? choice.nihss : live.nihss,
    status: keep && choice.status ? choice.status : live.status,
    findings: keep && choice.finding ? live.findings.concat([choice.finding]) : live.findings.slice()
  });
  finish({
    title: stage.title,
    skill: stage.skill,
    you: choice.label,
    verdict: resolved.verdict,
    critical: critical,
    hintUsed: strikes.hint,
    tries: tries,
    points: scorePoints(resolved.verdict, tries, strikes.hint && mode === "learn"),
    answer: stage.answer,
    teach: mode === "exam" ? teachFor(resolved.feedback) : resolved.feedback,
    guideline: stage.guideline
  }, nextLive);
  playVerdict(resolved.verdict);
}
function brightnessAt(img, x, y){
  if (!img || !img.naturalWidth) return 0;
  const canvas = document.createElement("canvas");
  canvas.width = 1; canvas.height = 1;
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  if (!ctx) return 0;
  const sx = Math.min(img.naturalWidth - 1, Math.max(0, Math.floor(x * img.naturalWidth)));
  const sy = Math.min(img.naturalHeight - 1, Math.max(0, Math.floor(y * img.naturalHeight)));
  try {
    ctx.drawImage(img, sx, sy, 1, 1, 0, 0, 1, 1);
    const pixel = ctx.getImageData(0, 0, 1, 1).data;
    return (pixel[0] + pixel[1] + pixel[2]) / 3;
  } catch (e) { return 0; }
}
function onPick(x, y, brightness){
  const stage = item.stages[index];
  if (phase !== "ask" || stage.kind !== "hotspot") return;
  const region = hitRegion(stage.regions, x, y);
  let verdict = "wrong";
  let you = stage.missYou;
  let body = stage.miss;
  let titleHint = "";
  if (region && region.verdict === "correct"){
    verdict = "correct"; you = region.you; body = region.feedback;
  } else if (region && region.verdict === "close"){
    verdict = "wrong"; you = "Close: " + region.you; body = region.feedback; titleHint = "close";
  } else if (region){
    verdict = "wrong"; you = region.you; body = region.feedback;
  } else if (stage.brightAssist && brightness >= stage.brightAssist.min && inBrightBox(stage.brightAssist, x, y)){
    verdict = "correct"; you = stage.brightAssist.you; body = stage.brightAssist.feedback;
  }
  const tone = mode === "exam" ? "neutral" : verdict === "correct" ? "good" : "bad";
  marks = marks.concat([{x:x, y:y, tone:tone}]);
  if (verdict !== "correct" && mode === "learn"){
    strikes = {tries: strikes.tries + 1, hint: strikes.hint, critical: strikes.critical};
    feedback = {title: titleHint === "close" ? "Close" : "Not that", body: body, verdict:"wrong", canAdvance:false};
    phase = "feedback";
    playVerdict("wrong");
    render();
    return;
  }
  const usedTries = mode === "exam" ? 1 : Math.max(1, strikes.tries + 1);
  const nextLive = Object.assign({}, live, {
    extraMin: live.extraMin + 4,
    status: verdict === "correct" ? stage.successStatus : live.status,
    findings: verdict === "correct" ? live.findings.concat([stage.successFinding]) : live.findings.slice()
  });
  finish({
    title: stage.title,
    skill: stage.skill,
    you: you,
    verdict: mode === "exam" ? verdict : "correct",
    critical: false,
    hintUsed: strikes.hint,
    tries: usedTries,
    points: scorePoints(verdict, usedTries, strikes.hint && mode === "learn"),
    answer: stage.answer,
    teach: mode === "exam" ? teachFor(body) : body,
    guideline: stage.guideline
  }, nextLive);
  playVerdict(verdict);
}

}
function choiceList(stage){
  return orderedChoices(stage).map(function(choice, i){
    const resolved = resolveChoice(choice, lkw());
    const hinted = mode === "learn" && strikes.hint && resolved.verdict === "correct";
    const on = selected === choice.id;
    const cls = "choice" + (on ? " on" : "") + (hinted ? " hinted" : "");
    return '<button type="button" class="' + cls + '" data-choice="' + esc(choice.id) + '" ' + (phase !== "ask" ? "disabled" : "") + '><span class="n">' + String(i + 1).padStart(2, "0") + "</span><span>" + esc(choice.label) + "</span></button>";
  }).join("");
}
function imageBlock(stage){
  if (!stage.image) return "";
  const reveal = mode === "learn" && (strikes.hint || (phase === "feedback" && feedback && feedback.verdict === "correct"));
  const regions = reveal ? (stage.regions || []).filter(function(r){ return r.verdict === "correct"; }) : [];
  const ellipses = regions.map(function(region){
    return '<ellipse cx="' + (region.cx * 100) + '" cy="' + (region.cy * 100) + '" rx="' + (region.rx * 100) + '" ry="' + (region.ry * 100) + '" fill="none" stroke="#1f9d62" stroke-width="0.6" stroke-dasharray="1.4 1"/>';
  }).join("");
  const markSvg = marks.map(function(mark){
    const cls = mark.tone === "good" ? "good" : mark.tone === "bad" ? "bad" : "cross";
    const cx = mark.x * 100, cy = mark.y * 100;
    return '<g class="' + cls + '"><circle cx="' + cx + '" cy="' + cy + '" r="1.6" fill="none" stroke-width="0.55"/><path d="M ' + (cx - 2.2) + " " + cy + " H " + (cx + 2.2) + " M " + cx + " " + (cy - 2.2) + " V " + (cy + 2.2) + '" stroke-width="0.35"/></g>';
  }).join("");
  const cursor = stage.kind === "hotspot" && phase === "ask" ? "crosshair" : "default";
  return '<figure class="figure"><div class="stage' + (zoom > 1 ? " zoomed" : "") + '" id="stage" style="cursor:' + cursor + '"><div class="frame" id="frame" style="transform:translate(' + pan.x + "px," + pan.y + "px) scale(" + zoom + ');transform-origin:center center"><img id="plate" alt="' + esc(stage.image.alt) + '" src="' + esc(stage.image.src) + '" draggable="false" style="filter:contrast(' + contrast + ')"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' + ellipses + markSvg + "</svg></div></div><figcaption class='cap'><span>" + esc(stage.image.caption) + '</span><span class="tools"><label>Contrast <input id="contrast" type="range" min="0.85" max="1.6" step="0.05" value="' + contrast + '" aria-label="Image contrast"></label><button class="icon" type="button" id="zoomOut" aria-label="Zoom out">−</button><button class="icon" type="button" id="zoomIn" aria-label="Zoom in">+</button><button class="icon" type="button" id="zoomReset" aria-label="Reset view">↺</button></span></figcaption></figure>';
}
function feedbackBlock(stage){
  let html = "";
  if (mode === "learn" && strikes.hint) html += '<p class="meta">' + esc(stage.hint) + "</p>";
  if (phase === "feedback" && feedback){
    html += '<div class="fb ' + esc(feedback.verdict) + '" role="status"><b class="' + esc(feedback.verdict) + '">' + esc(feedback.title) + "</b>";
    if (mode === "learn") html += '<p>' + esc(feedback.body) + "</p>";
    if (mode === "learn" && feedback.canAdvance) html += '<p class="fine">' + esc(stage.guideline) + "</p>";
    html += "</div>";
  }
  return html;
}
function wireImage(stage){
  const stageEl = document.getElementById("stage");
  const img = document.getElementById("plate");
  if (!stageEl || !img) return;
  stageEl.addEventListener("pointerdown", function(event){
    stageEl.setPointerCapture(event.pointerId);
    drag = {x: event.clientX, y: event.clientY, px: pan.x, py: pan.y, moved: false};
  });
  stageEl.addEventListener("pointermove", function(event){
    if (!drag) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (Math.hypot(dx, dy) > 8) drag.moved = true;
    if (drag.moved && zoom > 1){
      pan = {x: drag.px + dx, y: drag.py + dy};
      const frame = document.getElementById("frame");
      if (frame) frame.style.transform = "translate(" + pan.x + "px," + pan.y + "px) scale(" + zoom + ")";
    }
  });
  stageEl.addEventListener("pointerup", function(event){
    const moved = drag && drag.moved;
    drag = null;
    if (moved || stage.kind !== "hotspot" || phase !== "ask") return;
    const rect = img.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;
    if (x < 0 || y < 0 || x > 1 || y > 1) return;
    onPick(x, y, brightnessAt(img, x, y));
  });
  const contrastInput = document.getElementById("contrast");
  if (contrastInput) contrastInput.addEventListener("input", function(){
    contrast = Number(contrastInput.value);
    img.style.filter = "contrast(" + contrast + ")";
  });
  document.getElementById("zoomIn").onclick = function(){ zoom = Math.min(3, Math.round((zoom + 0.25) * 100) / 100); render(); };
  document.getElementById("zoomOut").onclick = function(){
    zoom = Math.max(1, Math.round((zoom - 0.25) * 100) / 100);
    if (zoom === 1) pan = {x:0, y:0};
    render();
  };
  document.getElementById("zoomReset").onclick = function(){ zoom = 1; pan = {x:0,y:0}; contrast = 1.05; render(); };
}
function setBar(buttons){
  if (!buttons.length){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML = buttons.map(function(button){
    return '<button type="button" class="btn' + (button.ghost ? " ghost" : "") + '" id="' + button.id + '"' + (button.disabled ? " disabled" : "") + ">" + esc(button.label) + "</button>";
  }).join("");
  buttons.forEach(function(button){
    const el = document.getElementById(button.id);
    if (el) el.onclick = button.on;
  });
}
const FOCUS = {
  neuro: { title: "Neurology Practice Simulator", ids: ["stroke", "sah"], line: "Stroke and subarachnoid hemorrhage. The scan comes first, then the next decision." },
  lungs: { title: "Respiratory Practice Simulator", ids: ["ards"], line: "ARDS. The film, the gas, and the next breath." },
  circulation: { title: "Shock Practice Simulator", ids: ["shock"], line: "Septic shock. The echo, the pressure, and the first vasopressor." },
  gi: { title: "GI Practice Simulator", ids: ["pancreatitis"], line: "Acute pancreatitis. The lipase and the fluid come first. Then you click the necrosis." }
};
function focusSpec(){
  const key = new URLSearchParams(location.search).get("focus");
  return FOCUS[key] || null;
}
function visibleCases(){
  const spec = focusSpec();
  if (!spec) return CASES;
  return CASES.filter(function(c){ return spec.ids.indexOf(c.id) !== -1; });
}
function render(){
  renderVitals();
  if (phase === "catalog"){
    const spec = focusSpec();
    crumb.textContent = spec ? spec.title : "Practice Simulator";
    progress.textContent = "";
    nav.textContent = "Hub";
    nav.onclick = null;
    setBar([]);
    const shown = visibleCases();
    app.innerHTML = '<section class="hero"><h1>' + esc(spec ? spec.title : "Practice Simulator") + "</h1><p>" + esc(spec ? spec.line : "The chart and the image come first. Choose the study, click the finding, and live with the next set of numbers. Learn mode stops a miss. Exam mode waits until the debrief.") + '</p><div class="steps"><div><b>01</b>Select the study</div><div><b>02</b>Click the finding</div><div><b>03</b>Decide the next move</div><div><b>04</b>Reassess</div></div></section>' +
      shown.map(function(c){
        const best = loadBest(c.id);
        return '<button class="card" type="button" data-open="' + esc(c.id) + '"><img alt="" src="' + esc(c.thumb || "") + '"><span class="body"><span class="kicker">' + esc(c.syndrome) + " · " + esc(c.difficulty) + "</span><h2>" + esc(c.title) + "</h2><p class='meta'>" + esc(c.summary) + "</p><span class='badge'>" + c.stages.length + " decisions" + (best ? " · Best " + best + "%" : "") + " · Open</span></span></button>";
      }).join("") +
      '<p class="fine">Practice Simulator is a teaching tool for stroke, subarachnoid hemorrhage, ARDS, septic shock, and acute pancreatitis. Pathways follow widely used critical-care teaching. Illustrations are not real patient scans. Nothing here replaces a local protocol or a clinician at the bedside.</p>';
    app.querySelectorAll("[data-open]").forEach(function(el){
      el.onclick = function(){ openCase(el.getAttribute("data-open")); };
    });
    return;
  }
  nav.textContent = "Cases";
  nav.onclick = function(event){ event.preventDefault(); goCatalog(); };
  crumb.textContent = item.title;
  if (phase === "intro"){
    progress.textContent = "Not started";
    const best = loadBest(item.id);
    app.innerHTML = '<p class="skill">' + esc(item.syndrome) + "</p><h2 style='font-size:32px'>" + esc(item.title) + "</h2><p class='lead'>" + esc(item.summary) + '</p><div class="row" style="margin-top:12px"><button type="button" class="mode' + (mode === "learn" ? " on" : "") + '" id="modeLearn"><b>Learn</b><span>Feedback at each step. A miss does not advance you.</span></button><button type="button" class="mode' + (mode === "exam" ? " on" : "") + '" id="modeExam"><b>Exam</b><span>No hints. One attempt. The teaching is in the debrief.</span></button></div><section class="panel"><h2 style="font-size:18px">' + esc(item.patient) + "</h2><p class='meta'>" + esc(item.ageSex) + "</p><ul>" + item.objectives.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + '</ul><p class="fine">Educational simulation. Images are illustrations, not diagnostic scans.</p></section>' + (best ? '<p class="meta">Best on this device: ' + best + "%</p>" : "");
    document.getElementById("modeLearn").onclick = function(){ mode = "learn"; render(); };
    document.getElementById("modeExam").onclick = function(){ mode = "exam"; render(); };
    setBar([{id:"begin", label:"Begin case", on: begin}]);
    return;
  }
  if (phase === "debrief"){
    progress.textContent = "Debrief";
    const criticals = log.filter(function(row){ return row.critical; }).length;
    app.innerHTML = '<p class="skill">Debrief</p><h2 style="font-size:32px">' + esc(item.title) + '</h2><div class="scores"><div class="score"><span class="kicker">Score</span><b>' + percent() + '%</b></div><div class="score"><span class="kicker">Best here</span><b>' + loadBest(item.id) + '%</b></div><div class="score"><span class="kicker">Critical misses</span><b>' + criticals + '</b></div><div class="score"><span class="kicker">Time from onset</span><b style="font-size:20px">' + esc(formatDuration(lkw())) + "</b></div></div><ol style='padding-left:0;list-style:none'>" +
      log.map(function(row, i){
        const word = row.verdict === "correct" ? "Correct" : row.verdict === "partial" ? "Partial" : "Missed";
        return '<li class="panel"><div class="row" style="justify-content:space-between"><b>' + (i + 1) + ". " + esc(row.title) + '</b><span class="' + row.verdict + '">' + word + (row.critical ? " · critical" : "") + " · " + row.points + "</span></div><p class='meta'>You: " + esc(row.you) + "</p><p>" + esc(row.teach) + '</p><p class="fine">' + esc(row.guideline) + "</p></li>";
      }).join("") + "</ol>";
    setBar([{id:"again", label:"Run it again", on: resetCase}, {id:"all", label:"All cases", ghost:true, on: goCatalog}]);
    return;
  }
  const stage = item.stages[index];
  progress.textContent = (index + 1) + " of " + item.stages.length;
  const findings = live.findings.length ? "<ul>" + live.findings.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + "</ul>" : "<p class='meta'>Nothing established yet.</p>";
  app.innerHTML = '<p class="skill">' + esc(stage.skill) + "</p><h2>" + esc(stage.title) + "</h2><p class='lead'>" + esc(stage.lead) + '</p><p class="prompt">' + esc(stage.prompt) + "</p>" +
    (stage.kind === "hotspot" && phase === "ask" ? '<p class="meta">Click the image. Zoom in, then drag to pan.</p>' : "") +
    imageBlock(stage) +
    '<section class="panel"><p class="kicker">' + esc(item.patient) + " · " + esc(item.ageSex) + "</p><p>" + esc(live.status) + "</p><details><summary>Chart</summary><ul>" + item.chart.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + "</ul></details><details><summary>Established</summary>" + findings + "</details></section>" +
    (stage.kind === "choice" ? '<div role="listbox">' + choiceList(stage) + "</div>" : "") +
    feedbackBlock(stage);
  if (stage.kind === "choice"){
    app.querySelectorAll("[data-choice]").forEach(function(el){
      el.onclick = function(){ if (phase !== "ask") return; selected = el.getAttribute("data-choice"); render(); };
    });
  }
  wireImage(stage);
  const buttons = [];
  if (phase === "ask" && stage.kind === "choice") buttons.push({id:"submit", label:"Submit decision", disabled:!selected, on:onChoice});
  if (phase === "feedback") buttons.push({id:"next", label: feedback && feedback.canAdvance ? (index + 1 >= item.stages.length ? "See the debrief" : "Continue") : "Try again", on: continueOn});
  if (mode === "learn" && phase === "ask") buttons.push({id:"hint", label: strikes.hint ? "Hint shown" : "Hint after a miss", ghost:true, disabled: strikes.tries < 1 || strikes.hint, on: showHint});
  setBar(buttons);
}

const startId = (location.hash || "").replace("#", "") || new URLSearchParams(location.search).get("case");
if (startId && CASES.some(function(c){ return c.id === startId; })) openCase(startId);
else render();
</script>
