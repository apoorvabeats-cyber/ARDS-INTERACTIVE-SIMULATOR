te liver failure","successStatus":"Bilirubin 22. INR 4.4. Not a paracetamol pattern.","missYou":"","miss":"","choices":[{"id":"dili","label":"Non-paracetamol acute liver failure. Do not use the paracetamol criteria.","verdict":"correct","feedback":"He has encephalopathy and an INR of 4.4 from an acute injury, without cirrhosis. That is acute liver failure. An AST of 980 with a bilirubin of 22, after weeks of tuberculosis treatment, is not paracetamol. The prognostic rules are the non-paracetamol rules.","finding":"Non-paracetamol acute liver failure","status":"Bilirubin 22. INR 4.4. Not a paracetamol pattern."},{"id":"must-be-apap","label":"The INR is high, so this is paracetamol until proved otherwise","verdict":"wrong","feedback":"Coagulopathy is part of every acute liver failure. It does not identify the cause. An undetectable paracetamol level and this enzyme-bilirubin pattern argue against paracetamol."},{"id":"cirrhosis","label":"Decompensated cirrhosis. Lactulose is the treatment.","verdict":"wrong","feedback":"There is no chronic liver disease. Lactulose will not stop drug injury, and it is not the decision that changes his outcome."},{"id":"ffp","label":"Give plasma until the INR is below 1.5, then decide","verdict":"wrong","feedback":"The INR is how you follow the liver and how you apply prognostic criteria. Correct it for bleeding or a procedure, not to make the case look milder."}]},{"id":"panel","skill":"Cause","title":"What else do you send?","lead":"The drugs are stopped. A drug history does not exclude a virus, and in this region hepatitis E and B still have to be looked for. He is afebrile. There is no hemolysis.","prompt":"Which set do you send today?","hint":"Send the acute viral studies now. Do not wait for them before the drugs are stopped, and do not take a biopsy before you have referred a failing liver.","guideline":"The first liver-failure panel looks for hepatitis A IgM, hepatitis B surface antigen and IgM core antibody, and hepatitis E IgM. Autoimmune and Wilson studies are added when the story suggests them. A biopsy is not required to refer.","answer":"Hepatitis A IgM, B surface antigen and IgM core antibody, and hepatitis E IgM","kind":"choice","successFinding":"Acute viral studies sent","successStatus":"Drugs already stopped. Viral studies in the laboratory.","missYou":"","miss":"","choices":[{"id":"viruses","label":"Hepatitis A IgM, hepatitis B surface antigen and IgM core antibody, hepatitis E IgM","verdict":"correct","feedback":"Send those today. A positive virus would change the story, and hepatitis E in particular belongs on the list. You did not need the results in order to stop the drugs. Wilson disease is unlikely at 46 without hemolysis. Biopsy can wait.","finding":"Acute viral studies sent","status":"Drugs already stopped. Viral studies in the laboratory."},{"id":"none","label":"No blood tests. The prescription is explanation enough.","verdict":"wrong","feedback":"The drugs are the leading cause. They are not the only cause you are allowed to consider. A virus can sit underneath a convenient drug history."},{"id":"biopsy","label":"Transjugular biopsy before any serology","verdict":"wrong","feedback":"Histology will not return fast enough to make the first decisions, and it is not required to diagnose drug injury or to refer him. Send the serology."},{"id":"hsv-only","label":"Acyclovir only, and no viral hepatitis studies","verdict":"wrong","feedback":"Herpes is suspected when the transaminases are very high, the bilirubin is relatively low, and there is fever, especially in pregnancy or immunosuppression. That is not this pattern. Do not skip hepatitis A, B, and E."}]},{"id":"glucose-airway","skill":"Support","title":"He is harder to rouse","lead":"The glucose is 48 mg/dL. He no longer follows commands and only localizes to pain. The gag is poor. The tuberculosis drugs remain stopped.","prompt":"What do you do now?","hint":"Glucose first in the same minute as the airway. Grade III to IV encephalopathy is intubated. Lactulose is not the treatment of this disease.","guideline":"Hypoglycemia is treated with dextrose and rechecked. Advanced hepatic encephalopathy is an indication to intubate for airway protection before transfer or imaging.","answer":"Dextrose, then intubate","kind":"choice","atStart":{"glucose":48,"status":"Only localizes to pain. Glucose 48 mg/dL."},"successFinding":"Glucose replaced and airway protected","successStatus":"Intubated. Dextrose running.","missYou":"","miss":"","choices":[{"id":"both","label":"Intravenous dextrose now, and intubate for airway protection","verdict":"correct","feedback":"Replace the glucose and check it again soon. Then intubate. He is in grade IV encephalopathy and will not protect his airway for a transfer or a scan. Record the grade before the sedative.","finding":"Glucose replaced and airway protected","status":"Intubated. Dextrose running.","glucose":136,"spo2":99,"rr":16},{"id":"sugar-only","label":"Dextrose, then observe him on the ward","verdict":"wrong","critical":true,"feedback":"The glucose must be treated, and it does not restore an airway. Leaving grade IV encephalopathy on a ward is how this patient aspirates."},{"id":"lactulose","label":"Lactulose by mouth, and no tube","verdict":"wrong","feedback":"Lactulose is not the treatment of drug-induced acute liver failure, and a dose by mouth in this grade risks aspiration. The airway comes first."},{"id":"restart","label":"Restart rifampicin at half the dose","verdict":"wrong","critical":true,"feedback":"Half a dose of a hepatotoxic drug is still the wrong drug during liver failure. Rifampicin stays stopped."}]},{"id":"click-cistern","skill":"Localization","title":"Click the tight cisterns","lead":"He is intubated. The non-contrast head CT shows no blood. The dark spaces around the midbrain have closed.","prompt":"Click the effaced basal cisterns.","hint":"They are in the center of the slice, around the midbrain. Patient\u2019s left is marked L.","guideline":"Cerebral edema in acute liver failure is not limited to paracetamol. Effaced basal cisterns mean the same precaution: protect the brain, and do not do a lumbar puncture.","answer":"Effaced basal cisterns","image":{"src":"sim/alf-ct.jpg","alt":"Teaching illustration of a head CT with effaced basal cisterns","caption":"Non-contrast head CT, teaching illustration. Not a real scan."},"kind":"hotspot","successFinding":"Effaced basal cisterns","successStatus":"Cerebral edema. No hemorrhage.","missYou":"Clicked outside the cisterns","miss":"Not that structure. The basal cisterns are central, around the midbrain. On this scan they are tight.","regions":[{"id":"cisterns","verdict":"correct","cx":0.5,"cy":0.48,"rx":0.09,"ry":0.09,"you":"Effaced basal cisterns","feedback":"The spaces around the midbrain should be dark. They are compressed. Cerebral edema occurs in non-paracetamol acute liver failure too. There is no hemorrhage. This hurries the referral. It is not a lumbar puncture."},{"id":"cortex","verdict":"wrong","cx":0.32,"cy":0.38,"rx":0.1,"ry":0.1,"you":"Cerebral cortex","feedback":"That is cortex, lateral to the finding. Come to the center, around the midbrain."},{"id":"skull","verdict":"wrong","cx":0.5,"cy":0.16,"rx":0.12,"ry":0.06,"you":"Skull","feedback":"The bright rim is bone. The cisterns are inside the skull, in the center of the slice."},{"id":"scalp","verdict":"wrong","cx":0.78,"cy":0.5,"rx":0.08,"ry":0.1,"you":"Outside the brain","feedback":"Too lateral. The tight cisterns are central."}]},{"id":"kings","skill":"Prognosis","title":"Which criteria apply?","lead":"Age 46. Idiosyncratic drug injury. Jaundice for twelve days before the encephalopathy. Bilirubin 22 mg/dL. INR 5.2. Arterial pH 7.38. Grade IV encephalopathy. No paracetamol.","prompt":"Does he meet King's College criteria?","hint":"Do not borrow the paracetamol pH rule. For other causes, one route is an INR above 6.5. The other is any three of the five factors. He does not need the INR to reach 6.5 if three factors are already present.","guideline":"Non-paracetamol King's College criteria are an INR above 6.5, or any three of: age under 10 or over 40, an unfavorable cause such as idiosyncratic drug injury, jaundice more than 7 days before encephalopathy, INR above 3.5, and bilirubin above 17.5 mg/dL.","answer":"Any three factors are enough. He has more than three.","kind":"choice","atStart":{"status":"INR 5.2. Bilirubin 22. Grade IV. pH 7.38."},"successFinding":"Non-paracetamol King's College criteria met","successStatus":"Criteria met without waiting for the INR to pass 6.5.","missYou":"","miss":"","choices":[{"id":"three","label":"Age, drug cause, the twelve-day jaundice, the bilirubin, and an INR above 3.5. Refer him.","verdict":"correct","feedback":"He has five of the five factors: age over 40, a drug cause, jaundice more than seven days before encephalopathy, bilirubin 22 mg/dL, and INR 5.2 which is already above 3.5. Any three would be enough. You do not wait for the INR to pass 6.5, and you do not use the paracetamol pH rule. His pH is 7.38 and would have falsely reassured you.","finding":"Non-paracetamol King's College criteria met","status":"Criteria met without waiting for the INR to pass 6.5."},{"id":"need-inr","label":"The INR is only 5.2, so he does not meet criteria","verdict":"wrong","critical":true,"feedback":"An INR above 6.5 is one way to meet the non-paracetamol criteria. It is not the only way. Three of the five factors already list him. Waiting for a worse INR is a delay."},{"id":"ph","label":"Use the paracetamol rule. The pH is 7.38, so he is safe.","verdict":"wrong","critical":true,"feedback":"The arterial-pH criterion belongs to paracetamol. Using it here is how a non-paracetamol failure is falsely cleared. His pH is normal. His criteria are not."},{"id":"grade","label":"Criteria require him to be grade IV for a full day first","verdict":"wrong","feedback":"The non-paracetamol list does not ask you to watch grade IV encephalopathy overnight. He already meets it. Refer now."}]},{"id":"nac-role","skill":"Transfer","title":"What is the role of N-acetylcysteine here?","lead":"The center asks what you are giving. Someone wants a full 21-hour antidote course before the ambulance leaves. Someone else wants a steroid trial for possible autoimmune hepatitis. He has no autoimmune history, and the criteria are already met.","prompt":"What do you tell them?","hint":"N-acetylcysteine is not the specific antidote for a tuberculosis drug. A possible early benefit does not postpone a referral once criteria are met.","guideline":"Intravenous N-acetylcysteine has been studied in early non-paracetamol acute liver failure and is sometimes continued, especially at a milder grade. It is not a reason to delay transplant assessment once King's College criteria are met, and it does not replace stopping the causative drug.","answer":"Refer now. The antidote protocol must not delay the transfer.","kind":"choice","successFinding":"Referred. Drugs stay stopped.","successStatus":"Transfer arranged. INR left uncorrected.","missYou":"","miss":"","choices":[{"id":"refer","label":"Refer now. Do not hold the ambulance for a 21-hour antidote course or a steroid trial.","verdict":"correct","feedback":"The criteria are met. N-acetylcysteine is not a specific antidote for isoniazid, rifampicin, or pyrazinamide, and finishing a paracetamol schedule before transfer wastes time. A steroid trial is not indicated without a reason to suspect autoimmune disease. Keep the INR readable, keep the glucose checked, and move him. The tuberculosis drugs stay stopped.","finding":"Referred. Drugs stay stopped.","status":"Transfer arranged. INR left uncorrected."},{"id":"finish-nac","label":"Finish 21 hours of N-acetylcysteine, then discuss transplant","verdict":"wrong","critical":true,"feedback":"That schedule is the paracetamol course. He has already met non-paracetamol transplant criteria. Holding him for an antidote clock delays the only treatment that changes survival."},{"id":"steroid-trial","label":"Three days of methylprednisolone before any referral","verdict":"wrong","feedback":"There is no autoimmune diagnosis. A steroid trial in established criteria delays transplantation. Stop the causative drugs and refer."},{"id":"mask","label":"Give plasma so the receiving INR is kinder","verdict":"wrong","feedback":"Plasma hides the number the receiving team needs. Give it for bleeding or a procedure, not for the appearance of the transfer sheet."}]},{"id":"c8","skill":"Reassessment","title":"The tuberculosis team is worried about the fever","lead":"He is awaiting transfer. Someone wants rifampicin and pyrazinamide restarted tonight because tuberculosis can relapse.","prompt":"What do you restart?","hint":"Nothing hepatotoxic tonight. The drugs that injured the liver stay off. A non-hepatotoxic plan is a daylight decision with the tuberculosis team.","guideline":"Isoniazid, rifampicin, and pyrazinamide stay stopped in drug-induced acute liver failure. Restarting them into a falling liver is how he dies of the cure.","answer":"Do not restart the hepatotoxic drugs","kind":"choice","successFinding":"Hepatotoxic drugs stay off","successStatus":"Transfer still the priority.","missYou":"Not that decision","miss":"Nothing hepatotoxic tonight. The drugs that injured the liver stay off. A non-hepatotoxic plan is a daylight decision with the tuberculosis team.","choices":[{"id":"ok","label":"Leave isoniazid, rifampicin, and pyrazinamide stopped","verdict":"correct","feedback":"The fever is not a reason to pour the same injury back in before he reaches a liver unit.","finding":"Hepatotoxic drugs stay off","status":"Transfer still the priority."},{"id":"w0","label":"Restart all four tonight so the tuberculosis clock does not slip","verdict":"wrong","feedback":"Three of those drugs are why the liver failed.","critical":true},{"id":"w1","label":"A week of high-dose paracetamol for the fever","verdict":"wrong","feedback":"Paracetamol is not a comfort drug in acute liver failure."},{"id":"w2","label":"Rifampicin alone, because it is the important one","verdict":"wrong","feedback":"Rifampicin is one of the drugs you stopped."}]},{"id":"c9","skill":"Reassessment","title":"The glucose is 60 mg/dL","lead":"He is hard to rouse. The fingerstick is 60 mg/dL. N-acetylcysteine has not delayed the referral.","prompt":"What do you run?","hint":"Dextrose. Then keep checking. Do not assume the drowsiness is only the liver.","guideline":"Hypoglycemia is common and immediately correctable. It does not change the transplant decision, and it must not be missed.","answer":"Dextrose","kind":"choice","successFinding":"Dextrose given","successStatus":"Sugar corrected. Still for transfer.","missYou":"Not that decision","miss":"Dextrose. Then keep checking. Do not assume the drowsiness is only the liver.","choices":[{"id":"ok","label":"Intravenous dextrose, and repeat the check","verdict":"correct","feedback":"A glucose of 60 in a drowsy patient is treated, not interpreted.","finding":"Dextrose given","status":"Sugar corrected. Still for transfer.","glucose":120},{"id":"w0","label":"Observe. The liver unit will sort the sugar","verdict":"wrong","feedback":"An hour of hypoglycemia is an hour of injury."},{"id":"w1","label":"Insulin to drive glucose into cells","verdict":"wrong","feedback":"There is not enough glucose.","critical":true},{"id":"w2","label":"Lactulose as the only drug, because he is drowsy","verdict":"wrong","feedback":"Lactulose does not raise the glucose, and it is not the rescue for this encephalopathy."}]},{"id":"c10","skill":"Reassessment","title":"He is accepted. What is bundled for the door?","lead":"The liver unit has a bed. He is intubated. The three hepatotoxic drugs are off. Glucose is corrected. He is not bleeding.","prompt":"What goes with him?","hint":"The airway, the glucose, and the uncorrected INR. No fresh plasma for the number. No restart of the tuberculosis drugs in the ambulance.","guideline":"Transfer a readable INR, a safe glucose, and a protected airway. Do not pretty the coagulation on the way.","answer":"Airway, glucose, readable INR. Drugs stay off","kind":"choice","successFinding":"Transferred safely","successStatus":"Left with a readable INR.","missYou":"Not that decision","miss":"The airway, the glucose, and the uncorrected INR. No fresh plasma for the number. No restart of the tuberculosis drugs in the ambulance.","choices":[{"id":"ok","label":"Send him as he is: airway safe, glucose safe, INR uncorrected, hepatotoxic drugs off","verdict":"correct","feedback":"The receiving team needs the truth of the INR and a patient who is not hypoglycemic.","finding":"Transferred safely","status":"Left with a readable INR."},{"id":"w0","label":"Plasma on the way so they see a normal INR","verdict":"wrong","feedback":"You would be hiding the reason they accepted him."},{"id":"w1","label":"A dose of pyrazinamide in the ambulance","verdict":"wrong","feedback":"That drug stays stopped."},{"id":"w2","label":"Extubate for the journey so the tube is not in the way","verdict":"wrong","feedback":"He was intubated because he could not protect the airway.","critical":true}]}]},{"id":"ich","title":"Intracerebral hemorrhage","syndrome":"Sudden deficit, deep clot","minutes":"14 min","difficulty":"Core","available":true,"summary":"A deep hemorrhage. Lower the pressure, and do not reach for a steroid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/ich2.jpg","patient":"Sudden right weakness while cooking","ageSex":"62-year-old woman","chart":["Teaching case. Not a prescription.","Onset forty minutes ago. No anticoagulant. Glucose is normal. She is drowsy but localizes."],"opening":{"lkwMin":20,"status":"Drowsy, dense right hemiparesis.","sbp":204,"dbp":112,"hr":78,"rr":16,"spo2":97,"glucose":118,"gcs":"E3 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"What do you image first?","lead":"The deficit is sudden and she is not protecting a long conversation. The scanner is free.","prompt":"Which study comes first?","hint":"Blood is the question that changes the drug. MRI can wait.","guideline":"Non-contrast CT is first in a sudden deficit. It is fast, and it shows blood.","answer":"Non-contrast CT of the head","kind":"choice","successFinding":"Non-contrast CT first","successStatus":"On the way to the scanner.","missYou":"Not that choice","miss":"Blood is the question that changes the drug. MRI can wait.","choices":[{"id":"ct","label":"Non-contrast CT of the head","verdict":"correct","feedback":"Non-contrast CT answers whether this is blood. Do not wait for an MRI, and do not give a thrombolytic on the story alone.","finding":"Non-contrast CT first","status":"Non-contrast CT done."},{"id":"mri","label":"MRI before any CT","verdict":"wrong","feedback":"MRI is a poor first test when you still do not know if there is blood. It delays the answer."},{"id":"lyse","label":"Thrombolysis from the clinical syndrome","verdict":"wrong","feedback":"A sudden deficit can be a hemorrhage. A thrombolytic before the CT can be fatal.","critical":true},{"id":"lp","label":"Lumbar puncture first","verdict":"wrong","feedback":"There is a focal deficit and you have not seen the scan. A lumbar puncture is not the first study."}]},{"id":"click","skill":"Localization","title":"Click the clot","lead":"Several slices are on the screen. One slice carries a bright intraparenchymal clot, and blood has reached the ventricles.","prompt":"Click the bright intraparenchymal hemorrhage.","hint":"Blood is bright on a non-contrast CT. The largest white clot is in the upper middle slice.","guideline":"Acute blood is hyperdense. Intraventricular blood often travels with a deep hemorrhage. Volume and the ventricles decide the next hour, not a steroid.","answer":"Intraparenchymal hemorrhage","image":{"src":"sim/cases/ich2.jpg","alt":"Non-contrast CT with a deep hemorrhage and blood in the ventricles.","caption":"Deep hemorrhage. Blood is bright, and some of it is in the ventricles."},"kind":"hotspot","successFinding":"Deep intracerebral hemorrhage","successStatus":"Clot seen. No thrombolytic.","missYou":"Clicked away from the clot","miss":"The clot is the bright mass in the brain, not the dark ventricles on the slices where they are still black.","regions":[{"id":"clot","verdict":"correct","cx":0.5,"cy":0.24,"rx":0.09,"ry":0.11,"you":"Deep hemorrhage","feedback":"That bright mass is acute blood in the brain. Nearby slices also show blood that has broken into the ventricles."},{"id":"vent","verdict":"wrong","cx":0.84,"cy":0.28,"rx":0.08,"ry":0.08,"you":"A slice with dark ventricles","feedback":"Those dark slits are ventricles that are not the main clot. Go back to the slice with the large white hemorrhage."}]},{"id":"name","skill":"Interpretation","title":"Name the finding","lead":"She is not on a blood thinner. The clot is deep, and the ventricles contain blood.","prompt":"What is this?","hint":"Bright blood inside the brain, not a subdural crescent and not an infarct.","guideline":"A deep spontaneous hemorrhage is not a drain-first extradural. Blood pressure, the airway, and the ventricles come before any thought of a steroid.","answer":"Intracerebral hemorrhage with intraventricular blood","kind":"choice","successFinding":"Intracerebral hemorrhage","successStatus":"Hemorrhage, not an infarct.","missYou":"Not that choice","miss":"Bright blood inside the brain, not a subdural crescent and not an infarct.","choices":[{"id":"ich","label":"Intracerebral hemorrhage with blood in the ventricles","verdict":"correct","feedback":"Deep blood, plus intraventricular blood. This is not an infarct and it is not an extradural lens.","finding":"Intracerebral hemorrhage","status":"Hemorrhage confirmed."},{"id":"infarct","label":"Established infarct, safe for thrombolysis","verdict":"wrong","feedback":"The bright material is blood. A thrombolytic is contraindicated.","critical":true},{"id":"sdh","label":"Subdural hematoma","verdict":"wrong","feedback":"A subdural hematoma hugs the surface as a crescent. This blood is inside the brain."},{"id":"tumor","label":"Tumor, so start dexamethasone","verdict":"wrong","feedback":"Acute bright blood is not a tumor protocol. Dexamethasone is not the treatment of this hemorrhage."}],"image":{"src":"sim/cases/ich2.jpg","alt":"Name the finding","caption":"Name the finding"}},{"id":"bp","skill":"Blood pressure","title":"The pressure is 204","lead":"Airway is holding. There is no story of a large-vessel occlusion to chase. Systolic pressure is 204.","prompt":"What do you do about the pressure?","hint":"For a spontaneous hemorrhage with systolic pressure between 150 and 220, the usual aim is near 140, with a drug you can turn down.","guideline":"Lowering toward 140 is reasonable. Do not crash the pressure far below that. Do not give a steroid, and do not transfuse platelets when she takes none.","answer":"Titrate the systolic pressure toward 140","kind":"choice","successFinding":"Pressure plan set","successStatus":"Systolic pressure coming down.","missYou":"Not that choice","miss":"For a spontaneous hemorrhage with systolic pressure between 150 and 220, the usual aim is near 140, with a drug you can turn down.","choices":[{"id":"aim","label":"A titratable infusion, aiming the systolic pressure near 140","verdict":"correct","feedback":"Nicardipine or labetalol, titrated. The aim is near 140, not a normal of 110, and not leaving her at 204.","sbp":142,"dbp":78,"finding":"Systolic pressure aimed near 140","status":"Pressure falling, slowly."},{"id":"leave","label":"Leave it. Pressure helps the brain perfuse","verdict":"wrong","feedback":"204 is above the range where we leave a spontaneous hemorrhage alone."},{"id":"crash","label":"Drop the systolic pressure to 100 quickly","verdict":"wrong","feedback":"A steep drop can under-perfuse the brain around the clot."},{"id":"steroid","label":"Dexamethasone for the swelling","verdict":"wrong","feedback":"Steroids do not improve this hemorrhage and they bring harm. They are not the pressure plan."}]},{"id":"next","skill":"Reassessment","title":"She stops localizing","lead":"An hour later she only flexes, and one pupil is a little larger. The pressure is 138.","prompt":"What is the next move?","hint":"The hemorrhage can extend, and the ventricles can obstruct. Look again. Protect the airway. A steroid will not empty the ventricle.","guideline":"A falling conscious level needs an airway and a repeat scan. Hydrocephalus from intraventricular blood may need a drain. Surgery is not automatic for a deep clot.","answer":"Airway and a repeat CT","kind":"choice","successFinding":"Airway secured, repeat CT","successStatus":"Being moved for a repeat scan.","missYou":"Not that choice","miss":"The hemorrhage can extend, and the ventricles can obstruct. Look again. Protect the airway. A steroid will not empty the ventricle.","choices":[{"id":"rescan","label":"Secure the airway and repeat the CT now","verdict":"correct","feedback":"She has fallen off. The airway comes first, then a repeat scan to see extension, shift, or trapped ventricles. A drain is for obstruction, not a reflex.","gcs":"E2 V2 M4","finding":"Airway and repeat CT","status":"Intubated. Repeat CT underway."},{"id":"dex","label":"Dexamethasone and observe on the ward","verdict":"wrong","feedback":"She is deteriorating. A steroid does not treat the clot or the ventricle, and the ward is the wrong place.","critical":true},{"id":"lyse","label":"Thrombolysis, because the first hour was an infarct","verdict":"wrong","feedback":"You have already seen blood. A thrombolytic is contraindicated.","critical":true},{"id":"plt","label":"Platelet transfusion to help the clot stop","verdict":"wrong","feedback":"She is not on an antiplatelet drug, and platelets are not routine even when someone is. They are not the rescue here."}]},{"id":"c6","skill":"Reassessment","title":"The repeat CT shows a larger clot","lead":"She is intubated. The second scan shows a bigger deep hemorrhage and more blood in the ventricles. Systolic pressure is 168. No anticoagulant was ever in the history.","prompt":"What do you do with the pressure?","hint":"Bring the systolic pressure back toward 140. Do not crash it to 100, and do not give a steroid.","guideline":"Expansion is a reason to keep the systolic pressure near 140, not a reason for steroids or a platelet drip.","answer":"Systolic pressure toward 140","kind":"choice","successFinding":"Pressure retitrated","successStatus":"Clot larger. Pressure toward 140.","missYou":"Not that decision","miss":"Bring the systolic pressure back toward 140. Do not crash it to 100, and do not give a steroid.","choices":[{"id":"ok","label":"Titrate the systolic pressure toward 140 again. No steroid","verdict":"correct","feedback":"The target did not change because the clot grew. A crash to 100 steals perfusion.","finding":"Pressure retitrated","status":"Clot larger. Pressure toward 140."},{"id":"w0","label":"Drop the systolic pressure to 90 with a big bolus","verdict":"wrong","feedback":"That is how the penumbra infarcts.","critical":true},{"id":"w1","label":"Dexamethasone for the swelling","verdict":"wrong","feedback":"Steroids do not treat this hemorrhage."},{"id":"w2","label":"Platelets now, although she takes no antiplatelet and is not bleeding elsewhere","verdict":"wrong","feedback":"Platelets are not a treatment for a number on this scan."}]},{"id":"c7","skill":"Reassessment","title":"The family mentions a daily aspirin","lead":"There is still no anticoagulant. She takes aspirin 75 mg. The clot has expanded. Platelets are on the board as a suggestion.","prompt":"Do you transfuse platelets?","hint":"No. Aspirin is not a reason for platelets here. Keep the pressure plan and the airway.","guideline":"Routine platelets for antiplatelet-associated intracerebral hemorrhage do not help and can harm. Reversal is for anticoagulants, which she is not taking.","answer":"No platelet transfusion","kind":"choice","successFinding":"Platelets withheld","successStatus":"Aspirin noted. No platelets.","missYou":"Not that decision","miss":"No. Aspirin is not a reason for platelets here. Keep the pressure plan and the airway.","choices":[{"id":"ok","label":"Do not transfuse platelets for the aspirin","verdict":"correct","feedback":"The airway and the blood pressure are the treatment. Platelets are not.","finding":"Platelets withheld","status":"Aspirin noted. No platelets."},{"id":"w0","label":"One pool of platelets so the aspirin is reversed","verdict":"wrong","feedback":"That transfusion is not the reversal you want.","critical":true},{"id":"w1","label":"Vitamin K and a prothrombin complex, just in case","verdict":"wrong","feedback":"She is not on warfarin. Do not invent an anticoagulant."},{"id":"w2","label":"A decompressive craniectomy tonight for a deep clot","verdict":"wrong","feedback":"Deep hemorrhage is not the superficial clot that a flap is for. Talk to neurosurgery. Do not book it as the reflex."}]},{"id":"c8","skill":"Reassessment","title":"The glucose is 186 mg/dL and she is warm","lead":"Temperature is 38.4. Glucose is 186 mg/dL. The pressure is now 142 systolic. She is still intubated and not seizing.","prompt":"What do you treat?","hint":"Bring the glucose down gently if it stays high, and treat the fever. Do not start a seizure drug because the CT looks bad.","guideline":"Fever and marked hyperglycemia worsen brain injury. Seizure drugs are for seizures, not for the appearance of the clot.","answer":"Treat fever and a high glucose. No seizure drug","kind":"choice","successFinding":"Fever and glucose treated","successStatus":"No prophylactic seizure drug.","missYou":"Not that decision","miss":"Bring the glucose down gently if it stays high, and treat the fever. Do not start a seizure drug because the CT looks bad.","choices":[{"id":"ok","label":"Acetaminophen for the fever, insulin if the glucose stays high, and no seizure prophylaxis","verdict":"correct","feedback":"A seizure drug without a seizure is not protection. The fever is worth treating.","finding":"Fever and glucose treated","status":"No prophylactic seizure drug."},{"id":"w0","label":"Phenytoin load now, before a seizure","verdict":"wrong","feedback":"Prophylaxis is not routine in intracerebral hemorrhage."},{"id":"w1","label":"Ice-cold saline as fast as it will run","verdict":"wrong","feedback":"A cold fluid bolus is not the antipyretic, and it is a lot of salt."},{"id":"w2","label":"Let the glucose sit at 250. The brain prefers it","verdict":"wrong","feedback":"Marked hyperglycemia is not a kindness."}]},{"id":"c9","skill":"Reassessment","title":"She has a brief seizure","lead":"One witnessed seizure, now stopped. Glucose is 140. The airway is already a tube.","prompt":"What drug follows?","hint":"A benzodiazepine if she is still seizing, then a regular anticonvulsant. Not a paralytic as the treatment of the seizure, and not a steroid.","guideline":"Treat the seizure. Do not paralyse the movement and call it control. Phenytoin is a possible drug. The point is to treat the seizure, not the CT.","answer":"Treat the seizure. Do not paralyse it","kind":"choice","successFinding":"Seizure treated","successStatus":"Anticonvulsant given. Still no steroid.","missYou":"Not that decision","miss":"A benzodiazepine if she is still seizing, then a regular anticonvulsant. Not a paralytic as the treatment of the seizure, and not a steroid.","choices":[{"id":"ok","label":"Benzodiazepine if it continues, then an anticonvulsant. No paralysis as the plan","verdict":"correct","feedback":"Paralysis hides seizures. It does not stop them.","finding":"Seizure treated","status":"Anticonvulsant given. Still no steroid."},{"id":"w0","label":"A paralysing infusion so the shaking cannot be seen","verdict":"wrong","feedback":"You would be hiding the seizure, not treating it.","critical":true},{"id":"w1","label":"Dexamethasone, because seizures mean edema","verdict":"wrong","feedback":"Steroids are still the wrong drug."},{"id":"w2","label":"Nothing. One seizure in a hemorrhage is expected and ignored","verdict":"wrong","feedback":"A seizure is treated. It is not a curiosity."}]},{"id":"c10","skill":"Reassessment","title":"The next afternoon she localizes again","lead":"Systolic pressure is 136. The pupil is unchanged. She localizes. Neurosurgery is not taking her for the deep clot.","prompt":"Where does she spend the night, and what do you not start?","hint":"She stays in a neuro critical-care bed. Do not start heparin in the first hours. Do not send her to a general ward tonight.","guideline":"Stability is not a ward discharge on day 1. Venous-clot prophylaxis waits until the clot has declared itself stable, not the first hour.","answer":"Stay in neuro critical care. No early heparin","kind":"choice","successFinding":"Neuro critical care","successStatus":"Localizing. Clot prophylaxis not started yet.","missYou":"Not that decision","miss":"She stays in a neuro critical-care bed. Do not start heparin in the first hours. Do not send her to a general ward tonight.","choices":[{"id":"ok","label":"Keep her in neuro critical care tonight. No heparin yet","verdict":"correct","feedback":"The first day is for the pressure, the airway, and the repeat look. Heparin can wait.","finding":"Neuro critical care","status":"Localizing. Clot prophylaxis not started yet."},{"id":"w0","label":"Prophylactic heparin now, in the first hours","verdict":"wrong","feedback":"The clot just expanded. Prophylaxis is later."},{"id":"w1","label":"The general ward, because she localizes","verdict":"wrong","feedback":"Localizing on a ventilator after an expanding hemorrhage is not a ward patient."},{"id":"w2","label":"A statin load as the emergency treatment","verdict":"wrong","feedback":"There is no emergency statin for this bleed."}]}]},{"id":"edh","title":"Traumatic brain injury","syndrome":"Extradural hematoma","minutes":"14 min","difficulty":"Core","available":true,"summary":"A lens of blood after a head strike. This one needs a surgeon, not a steroid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/edh.jpg","patient":"Hit his temple on a step, then a lucid interval","ageSex":"28-year-old man","chart":["Teaching case. Not a prescription.","Brief loss of consciousness, then he spoke, then he became drowsy. No anticoagulant. Scalp bruise over the temple."],"opening":{"lkwMin":20,"status":"Drowsy after a lucid interval.","sbp":148,"dbp":86,"hr":64,"rr":18,"spo2":96,"glucose":108,"gcs":"E3 V4 M5"},"stages":[{"id":"study","skill":"Investigation","title":"What do you do first?","lead":"He is breathing, the pressure is adequate, and oxygen is acceptable. He is not herniating on the pillow in front of you.","prompt":"What comes first?","hint":"Non-contrast CT is the trauma brain study. Do not send him for an MRI, and do not start a steroid.","guideline":"In traumatic brain injury the first brain image is a non-contrast CT. Hypoxia and hypotension are treated at the same time, not instead of the scan.","answer":"Non-contrast CT","kind":"choice","successFinding":"CT arranged","successStatus":"Oxygen on. CT next.","missYou":"Not that choice","miss":"Non-contrast CT is the trauma brain study. Do not send him for an MRI, and do not start a steroid.","choices":[{"id":"ct","label":"Non-contrast CT of the head, while you keep oxygen and pressure normal","verdict":"correct","feedback":"He can go to the scanner. Keep the systolic pressure up, not down. CT, not MRI.","finding":"Trauma CT","status":"In the scanner. Pressure maintained."},{"id":"mri","label":"MRI, to grade the diffuse injury","verdict":"wrong","feedback":"MRI delays a diagnosis that CT makes in a minute. An extradural hematoma is a CT diagnosis."},{"id":"steroid","label":"Dexamethasone now, scan in the morning","verdict":"wrong","feedback":"Steroids harm traumatic brain injury. Waiting until morning misses a surgical clot.","critical":true},{"id":"hyper","label":"Routine hyperventilation to a carbon dioxide of 25","verdict":"wrong","feedback":"He is not herniating on the trolley. Prolonged hyperventilation constricts vessels and is not a treatment plan."}]},{"id":"click","skill":"Localization","title":"Click the blood","lead":"The blood is outside the brain and it is lens-shaped. The midline is being pushed away from it.","prompt":"Click the extradural hematoma.","hint":"Look for a biconvex bright collection under the skull, not the dark folds of normal sulci.","guideline":"An extradural hematoma is lens-shaped because the dura is stuck at the sutures. A large one with shift is a surgical emergency.","answer":"Extradural hematoma","image":{"src":"sim/cases/edh.jpg","alt":"Non-contrast CT. Lens-shaped extra-axial blood with shift.","caption":"Lens-shaped extradural blood."},"kind":"hotspot","successFinding":"Extradural hematoma with shift","successStatus":"Extradural hematoma with shift","missYou":"Clicked away from the lens","miss":"The blood is the bright lens against the inside of the skull. The dark folded brain on the other side is not the clot.","regions":[{"id":"lens","verdict":"correct","cx":0.27,"cy":0.46,"rx":0.12,"ry":0.16,"you":"Extradural lens","feedback":"That biconvex collection is extradural blood, and the midline is shifted away from it."},{"id":"other","verdict":"wrong","cx":0.7,"cy":0.48,"rx":0.1,"ry":0.12,"you":"The opposite hemisphere","feedback":"That side is compressed, not the source. The lens of blood is against the skull on the other side."}]},{"id":"name","skill":"Interpretation","title":"Name the collection","lead":"It is bright, biconvex, and under the skull. The history had a lucid interval.","prompt":"What is it?","hint":"Lens shape and a lucid interval. Not a spontaneous deep clot.","guideline":"Extradural blood with shift is evacuated. It is not managed as a deep spontaneous hemorrhage, and it is not a steroid diagnosis.","answer":"Extradural hematoma","kind":"choice","successFinding":"Extradural hematoma","successStatus":"Surgical extradural hematoma.","missYou":"Not that choice","miss":"Lens shape and a lucid interval. Not a spontaneous deep clot.","choices":[{"id":"edh","label":"Extradural hematoma with shift","verdict":"correct","feedback":"Lens-shaped, extra-axial, with shift. This is a surgical extradural hematoma.","finding":"Extradural hematoma","status":"Surgeon being called."},{"id":"ich","label":"Spontaneous deep hemorrhage. Aim the systolic pressure at 140","verdict":"wrong","feedback":"The blood is outside the brain, after trauma. Do not run the spontaneous-hemorrhage blood-pressure protocol as the plan."},{"id":"sdh","label":"A thin chronic subdural, safe for the ward","verdict":"wrong","feedback":"This is acute, bright, and shifting the midline. The ward is the wrong destination.","critical":true},{"id":"infarct","label":"Infarct","verdict":"wrong","feedback":"Infarct is dark once it is established, and it is inside the brain. This is a bright lens outside it."}],"image":{"src":"sim/cases/edh.jpg","alt":"Name the collection","caption":"Name the collection"}},{"id":"op","skill":"Decision","title":"Who takes him, and what do you protect?","lead":"Neurosurgery is in the building. His systolic pressure is 148. Oxygen is 96 percent.","prompt":"What is the plan?","hint":"A shifted extradural hematoma goes to theatre. Do not drop the pressure the way you would for a spontaneous deep bleed. Do not give a steroid.","guideline":"Evacuate a surgical extradural hematoma. Keep the systolic pressure at least 110. Avoid hypoxia. Steroids are not used in traumatic brain injury.","answer":"Urgent evacuation","kind":"choice","successFinding":"Theatre","successStatus":"Going to theatre.","missYou":"Not that choice","miss":"A shifted extradural hematoma goes to theatre. Do not drop the pressure the way you would for a spontaneous deep bleed. Do not give a steroid.","choices":[{"id":"or","label":"Urgent surgical evacuation. Keep the pressure up and the oxygen normal","verdict":"correct","feedback":"This clot comes out. Hypotension and hypoxia are the injuries you can still prevent on the way.","sbp":136,"finding":"Urgent craniotomy","status":"Transferred to theatre. Pressure maintained."},{"id":"icu","label":"Medical management on the neurointensive unit, no surgeon","verdict":"wrong","feedback":"A lens with shift and a falling conscious level is not a medical-only clot."},{"id":"drop","label":"Drop the systolic pressure to 120 before theatre, as in spontaneous hemorrhage","verdict":"wrong","feedback":"Traumatic brain injury does not get the spontaneous-hemorrhage pressure target. Hypotension is harmful."},{"id":"dex","label":"Dexamethasone and a repeat scan in six hours","verdict":"wrong","feedback":"Steroids increase harm in traumatic brain injury, and six hours is too long.","critical":true}]},{"id":"pupil","skill":"Reassessment","title":"One pupil enlarges on the way","lead":"The theatre door is two minutes away. One pupil has blown. Pressure is still adequate.","prompt":"What do you add?","hint":"A brief osmotic bridge is allowed while the skull is opened. It does not replace the operation. Do not hyperventilate him for the rest of the day.","guideline":"Mannitol or hypertonic saline can bridge herniation for minutes. The operation is the treatment. Prolonged hyperventilation is not a plan.","answer":"Osmotic bridge, then the knife","kind":"choice","successFinding":"Bridge given","successStatus":"Pupil noted. Still going to theatre.","missYou":"Not that choice","miss":"A brief osmotic bridge is allowed while the skull is opened. It does not replace the operation. Do not hyperventilate him for the rest of the day.","choices":[{"id":"bridge","label":"Hypertonic saline or mannitol as a bridge, and open the skull now","verdict":"correct","feedback":"The osmotic drug buys minutes. It is not the treatment. Do not pause the transfer to watch it work.","gcs":"E1 V1 M4","finding":"Osmotic bridge to theatre","status":"Pupil blown. Theatre, not a longer medical trial."},{"id":"watch","label":"Wait in recovery to see if the pupil comes back","verdict":"wrong","feedback":"A new blown pupil is herniation. Waiting is how the brainstem infarcts.","critical":true},{"id":"vent","label":"Hyperventilate to a carbon dioxide of 20 until tomorrow","verdict":"wrong","feedback":"A brief drop in carbon dioxide is a bridge only. Hours of it reduce blood flow."},{"id":"steroid","label":"High-dose steroid for the swelling","verdict":"wrong","feedback":"Steroids are not used in traumatic brain injury.","critical":true}]},{"id":"c6","skill":"Reassessment","title":"He is in the operating room","lead":"The extradural hematoma is being evacuated. A colleague suggests dexamethasone so the brain is less swollen for the surgeon.","prompt":"Do you give the steroid?","hint":"No. Steroids increase death after head injury. Give the surgeon the patient, not a steroid.","guideline":"The CRASH trial stopped steroids in traumatic brain injury. Evacuation is the treatment of this clot.","answer":"No steroid","kind":"choice","successFinding":"Steroid withheld","successStatus":"In theatre. No steroid.","missYou":"Not that decision","miss":"No. Steroids increase death after head injury. Give the surgeon the patient, not a steroid.","choices":[{"id":"ok","label":"No dexamethasone. Let them evacuate the clot","verdict":"correct","feedback":"The drug harms. The operation helps.","finding":"Steroid withheld","status":"In theatre. No steroid."},{"id":"w0","label":"Dexamethasone so the surgeon has an easier brain","verdict":"wrong","feedback":"Steroids increase mortality after head injury.","critical":true},{"id":"w1","label":"A platelet transfusion although he takes nothing","verdict":"wrong","feedback":"There is no drug to reverse."},{"id":"w2","label":"Cancel theatre now that the osmotic drug was given","verdict":"wrong","feedback":"The osmotic drug was a bridge, not the operation."}]},{"id":"c7","skill":"Reassessment","title":"The pupil comes down after evacuation","lead":"The clot is out. The pupil is smaller. He is still intubated. Someone orders a magnetic resonance scan before he is allowed to wake.","prompt":"What study, if he does not wake as expected?","hint":"A CT if he fails to wake. Not an MRI as the first look, and not more mannitol on a schedule now that the pupil has recovered.","guideline":"CT is the next look if recovery stalls. Mannitol is not a six-hour ritual after the clot is out and the pupil is back.","answer":"CT only if he does not wake. Stop routine mannitol","kind":"choice","successFinding":"Mannitol not repeated","successStatus":"Pupil recovered. Clot out.","missYou":"Not that decision","miss":"A CT if he fails to wake. Not an MRI as the first look, and not more mannitol on a schedule now that the pupil has recovered.","choices":[{"id":"ok","label":"No scheduled mannitol. CT if he fails to wake","verdict":"correct","feedback":"The pupil recovered because the clot left. Do not keep drying him out.","finding":"Mannitol not repeated","status":"Pupil recovered. Clot out."},{"id":"w0","label":"Mannitol every six hours for two days","verdict":"wrong","feedback":"Scheduled osmotic drug without a pressure problem causes renal failure."},{"id":"w1","label":"MRI before anyone lightens the sedation","verdict":"wrong","feedback":"CT answers the surgical question faster."},{"id":"w2","label":"A steroid now that the operation is over","verdict":"wrong","feedback":"The operation being over does not make the steroid safe."}]},{"id":"c8","skill":"Reassessment","title":"Sodium is 152 after the mannitol","lead":"The osmotic drug was given once on the way to theatre. Sodium is 152. He is starting to cough on the tube. Creatinine is normal.","prompt":"What do you do with the sodium?","hint":"Do not give more mannitol. Let him wake if the airway is safe. Replace free water only if the sodium is a problem, not a saline bolus for the number.","guideline":"One dose of mannitol can raise the sodium. The treatment is to stop repeating it, not to chase the number with more of the same.","answer":"No more mannitol","kind":"choice","successFinding":"Osmotic drug stopped","successStatus":"Waking. Sodium watched.","missYou":"Not that decision","miss":"Do not give more mannitol. Let him wake if the airway is safe. Replace free water only if the sodium is a problem, not a saline bolus for the number.","choices":[{"id":"ok","label":"No further mannitol. Assess the airway for extubation","verdict":"correct","feedback":"The indication has gone. Another dose is toxicity.","finding":"Osmotic drug stopped","status":"Waking. Sodium watched."},{"id":"w0","label":"Another mannitol, because 152 shows it is working","verdict":"wrong","feedback":"152 shows he has had enough."},{"id":"w1","label":"Hypertonic saline on top, to be sure","verdict":"wrong","feedback":"Stacking osmotic drugs without a pupil problem is not care."},{"id":"w2","label":"Keep him paralysed so the sodium can be corrected slowly","verdict":"wrong","feedback":"Paralysis is not a treatment of the sodium."}]},{"id":"c9","skill":"Reassessment","title":"Do you start a seizure drug?","lead":"He has not seized. The clot was extradural and is out. He is localizing and opening his eyes.","prompt":"What is the duration if a seizure drug is used at all?","hint":"If the protocol uses a short course after severe injury, it is days, not months. Do not start a six-month drug in a man who has not seized and is waking.","guideline":"Early seizures after severe trauma are sometimes prevented for about 7 days. Late epilepsy is not prevented by a long course. He is waking and has not seized.","answer":"No six-month seizure drug","kind":"choice","successFinding":"No long seizure drug","successStatus":"Waking. No seizure.","missYou":"Not that decision","miss":"If the protocol uses a short course after severe injury, it is days, not months. Do not start a six-month drug in a man who has not seized and is waking.","choices":[{"id":"ok","label":"Do not start six months of a seizure drug. A short course is a protocol, not a habit","verdict":"correct","feedback":"He is waking without a seizure. A long prescription is not the evacuation.","finding":"No long seizure drug","status":"Waking. No seizure."},{"id":"w0","label":"Phenytoin for six months","verdict":"wrong","feedback":"A long course does not prevent late epilepsy."},{"id":"w1","label":"A paralytic infusion so a seizure cannot happen","verdict":"wrong","feedback":"Paralysis is not anticonvulsant.","critical":true},{"id":"w2","label":"Dexamethasone, which also calms seizures","verdict":"wrong","feedback":"It does not, and it harms."}]},{"id":"c10","skill":"Reassessment","title":"He is ready for the tube to come out","lead":"Eyes open, coughs, localizes, pupil equal. The drain, if any, is not the issue. The stomach is empty enough.","prompt":"What do you do?","hint":"Extubate if the airway is safe. Do not keep the tube for a tidy CT. Do not start heparin in the first hours after the craniotomy.","guideline":"The operation worked. A safe extubation is the next act. Venous prophylaxis is later, when the surgeons agree the wound is safe.","answer":"Extubate. No immediate heparin","kind":"choice","successFinding":"Extubated","successStatus":"Awake. Tube out.","missYou":"Not that decision","miss":"Extubate if the airway is safe. Do not keep the tube for a tidy CT. Do not start heparin in the first hours after the craniotomy.","choices":[{"id":"ok","label":"Extubate. Leave heparin for later, when the wound is safe","verdict":"correct","feedback":"A talking patient does not need a tube, and a fresh craniotomy does not need heparin in the first hour.","finding":"Extubated","status":"Awake. Tube out."},{"id":"w0","label":"Keep him intubated until tomorrow's MRI","verdict":"wrong","feedback":"The tube is for the airway, which he has back."},{"id":"w1","label":"Prophylactic heparin in the recovery room","verdict":"wrong","feedback":"Ask the surgeon later. Not in the first hour."},{"id":"w2","label":"A fluid litre to celebrate","verdict":"wrong","feedback":"There is no celebration bolus."}]}]},{"id":"status","title":"Status epilepticus","syndrome":"Generalized spike-and-wave","minutes":"14 min","difficulty":"Core","available":true,"summary":"She has stopped speaking and she is staring. The recording is spike-and-wave, not a stroke.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/eeg.png","patient":"Stopped talking and stares","ageSex":"19-year-old woman","chart":["Teaching case. Not a prescription.","No convulsion. Eyes open, no speech, she picks at her clothes. Glucose is 5.4 mmol/L. This recording is already running."],"opening":{"lkwMin":25,"status":"Staring, no speech, not shaking.","sbp":118,"dbp":72,"hr":96,"rr":18,"spo2":98,"glucose":97},"stages":[{"id":"study","skill":"Investigation","title":"What do you obtain?","lead":"She is not shaking. Glucose is already normal. A stroke pathway would be the wrong room.","prompt":"What is the study?","hint":"An ongoing impairment of awareness without a convulsion is an EEG question. Do not send her to thrombolysis.","guideline":"Non-convulsive status is an electrical diagnosis. This pattern, generalized spike-and-wave, is absence status. Phenytoin is the wrong drug for it.","answer":"EEG","kind":"choice","successFinding":"EEG running","successStatus":"The recording is on the screen.","missYou":"Not that choice","miss":"An ongoing impairment of awareness without a convulsion is an EEG question. Do not send her to thrombolysis.","choices":[{"id":"eeg","label":"EEG now, and treat if it shows ongoing seizure","verdict":"correct","feedback":"She is not protecting a conversation and she is not convulsing. The EEG is the study. Do not activate thrombolysis.","finding":"EEG obtained","status":"EEG on the screen."},{"id":"ct","label":"CT and a thrombolysis call, as for stroke","verdict":"wrong","feedback":"A stare and picking at clothes is not a thrombolysis pathway. You will lose the seizure while the scanner runs."},{"id":"wait","label":"Watch for an hour. Absence never needs a drug","verdict":"wrong","feedback":"An hour of untreated spike-and-wave status is not observation. Stop it."},{"id":"phen","label":"Load phenytoin before any recording","verdict":"wrong","feedback":"Phenytoin is the wrong drug for generalized spike-and-wave, and you have not looked."}]},{"id":"click","skill":"Localization","title":"Click the discharge","lead":"The page is a multichannel EEG. A run of generalized high spike-and-wave occupies the middle of the record.","prompt":"Click the spike-and-wave discharge.","hint":"Look for the tall, rhythmic, generalized spikes, not a flat stretch of background.","guideline":"Generalized spike-and-wave at about three a second is an absence pattern. If it does not stop, it is absence status.","answer":"Generalized spike-and-wave","image":{"src":"sim/cases/eeg.png","alt":"EEG with a generalized spike-and-wave discharge.","caption":"Generalized spike-and-wave."},"kind":"hotspot","successFinding":"Spike-and-wave seen","successStatus":"Spike-and-wave seen","missYou":"Clicked off the discharge","miss":"The seizure is the tall rhythmic spike-and-wave across the channels, in the middle of the page.","regions":[{"id":"sw","verdict":"correct","cx":0.62,"cy":0.42,"rx":0.24,"ry":0.2,"you":"Spike-and-wave","feedback":"That generalized run is spike-and-wave. It is an absence pattern, and it is still going."},{"id":"edge","verdict":"wrong","cx":0.08,"cy":0.08,"rx":0.06,"ry":0.05,"you":"The corner of the page","feedback":"That is the edge of the paper, not the discharge. Move into the tall rhythmic activity."}]},{"id":"name","skill":"Interpretation","title":"Name the pattern","lead":"It is generalized, rhythmic, and it has not stopped. She is still not speaking.","prompt":"What is this?","hint":"Spike-and-wave. Not a focal convulsion, and not ventricular fibrillation.","guideline":"Continuous generalized spike-and-wave with impaired awareness is absence status. The first drug is still a benzodiazepine. Phenytoin can make absence worse.","answer":"Absence status","kind":"choice","successFinding":"Absence status","successStatus":"Spike-and-wave status.","missYou":"Not that choice","miss":"Spike-and-wave. Not a focal convulsion, and not ventricular fibrillation.","choices":[{"id":"abs","label":"Absence status: generalized spike-and-wave","verdict":"correct","feedback":"Ongoing spike-and-wave and a stare. This is status, and the pattern is absence, not a focal motor seizure.","finding":"Absence status","status":"Pattern named."},{"id":"focal","label":"Focal motor status, so phenytoin is the best second drug","verdict":"wrong","feedback":"The discharge is generalized spike-and-wave. Phenytoin is a poor and sometimes harmful choice for absence."},{"id":"stroke","label":"A cortical stroke","verdict":"wrong","feedback":"The EEG is epileptic. Do not take her down a thrombolysis path."},{"id":"artifact","label":"Artifact from the wires","verdict":"wrong","feedback":"The run is cerebral, generalized, and it matches the stare."}],"image":{"src":"sim/cases/eeg.png","alt":"Name the pattern","caption":"Name the pattern"}},{"id":"drug","skill":"Treatment","title":"Stop the discharge","lead":"She is still staring. You have intravenous access.","prompt":"What do you give?","hint":"A benzodiazepine stops absence status. Do not reach for phenytoin.","guideline":"Benzodiazepine first. If it recurs, the maintenance drug for an absence pattern is ethosuximide or valproate, not phenytoin.","answer":"Benzodiazepine","kind":"choice","successFinding":"Benzodiazepine given","successStatus":"She is starting to answer.","missYou":"Not that choice","miss":"A benzodiazepine stops absence status. Do not reach for phenytoin.","choices":[{"id":"bz","label":"Intravenous benzodiazepine now","verdict":"correct","feedback":"Stop the status with a benzodiazepine. If you need a maintenance drug afterwards, it is not phenytoin.","finding":"Benzodiazepine given","status":"Discharge breaking."},{"id":"phen","label":"Phenytoin as the first and only drug","verdict":"wrong","feedback":"Phenytoin does not treat absence status and can worsen it."},{"id":"none","label":"No drug. Absence is benign even when it lasts an hour","verdict":"wrong","feedback":"A brief absence is not this. Ongoing spike-and-wave with no speech is status."},{"id":"throm","label":"Thrombolysis","verdict":"wrong","feedback":"There is no infarct on this page. A thrombolytic is the wrong class of drug.","critical":true}]},{"id":"after","skill":"Reassessment","title":"She speaks again","lead":"The high-voltage run has stopped. She answers her name. Someone offers a phenytoin load 'so it does not come back.'","prompt":"What do you do with that offer?","hint":"The pattern was spike-and-wave. Phenytoin is not the prevention.","guideline":"Do not add phenytoin after absence status. If a maintenance drug is needed, think of ethosuximide or valproate, and look for the trigger.","answer":"No phenytoin","kind":"choice","successFinding":"Phenytoin declined","successStatus":"Speaking. No phenytoin.","missYou":"Not that choice","miss":"The pattern was spike-and-wave. Phenytoin is not the prevention.","choices":[{"id":"no","label":"Decline phenytoin. If a maintenance drug is needed, use an absence drug","verdict":"correct","feedback":"Ethosuximide or valproate, not phenytoin. And look for missed doses and sleep loss.","finding":"Phenytoin avoided","status":"Recovered. Absence drug if she needs one."},{"id":"load","label":"Load phenytoin anyway, because all status gets phenytoin","verdict":"wrong","feedback":"That rule is wrong for this EEG. Phenytoin is for a different seizure, and it can worsen absence."},{"id":"ct","label":"Cancel the recovery and take her for thrombolysis","verdict":"wrong","feedback":"She is speaking and the EEG was epileptic. There is no thrombolysis indication."},{"id":"icu","label":"Intubate and start an anesthetic infusion now that she is speaking","verdict":"wrong","feedback":"The status has stopped and she is awake. Anesthesia is for refractory convulsive status, not for a recovered patient."}]},{"id":"c6","skill":"Reassessment","title":"She is speaking. The EEG still has short runs","lead":"The benzodiazepine worked. She answers. The EEG still shows brief generalized runs, and she is not convulsing.","prompt":"What do you add?","hint":"Another small benzodiazepine if the runs continue, or the absence drug she was supposed to be taking. Not phenytoin, and not a propofol coma.","guideline":"Absence status is a benzodiazepine and an absence drug. Phenytoin does not treat this pattern. Coma is for refractory convulsive status.","answer":"Treat the runs. No phenytoin. No coma","kind":"choice","successFinding":"Absence drug, not phenytoin","successStatus":"Speaking. No coma.","missYou":"Not that decision","miss":"Another small benzodiazepine if the runs continue, or the absence drug she was supposed to be taking. Not phenytoin, and not a propofol coma.","choices":[{"id":"ok","label":"Repeat a benzodiazepine or give her absence drug. Do not start phenytoin or a coma","verdict":"correct","feedback":"She is awake. The pattern is still absence. Match the drug to the pattern.","finding":"Absence drug, not phenytoin","status":"Speaking. No coma."},{"id":"w0","label":"Phenytoin 20 mg/kg, because all status gets it","verdict":"wrong","feedback":"Phenytoin is the wrong drug for this EEG.","critical":true},{"id":"w1","label":"Propofol coma now that she is speaking","verdict":"wrong","feedback":"Coma is not the treatment of a talking patient."},{"id":"w2","label":"Intubate so the EEG can be watched comfortably","verdict":"wrong","feedback":"The airway is not the problem. She is speaking."}]},{"id":"c7","skill":"Reassessment","title":"She was supposed to be on ethosuximide","lead":"Her mother brings a bottle of ethosuximide. It has not been opened this month. She is drowsy from the benzodiazepine but protecting her airway.","prompt":"What do you restart?","hint":"Restart the ethosuximide. Do not give flumazenil for the drowsiness. Do not swap in levetiracetam as the absence drug.","guideline":"Restart the drug that treats absence. Flumazenil can precipitate seizures. Levetiracetam is a poor absence drug.","answer":"Restart ethosuximide. No flumazenil","kind":"choice","successFinding":"Ethosuximide restarted","successStatus":"Drowsy, airway safe.","missYou":"Not that decision","miss":"Restart the ethosuximide. Do not give flumazenil for the drowsiness. Do not swap in levetiracetam as the absence drug.","choices":[{"id":"ok","label":"Restart ethosuximide. Do not reverse the benzodiazepine","verdict":"correct","feedback":"The drowsiness is the price of the dose that stopped the status. Watch her. Do not reverse it.","finding":"Ethosuximide restarted","status":"Drowsy, airway safe."},{"id":"w0","label":"Flumazenil so she wakes for the ward","verdict":"wrong","feedback":"You may restart the seizures.","critical":true},{"id":"w1","label":"Levetiracetam instead, because it is what the ward stocks","verdict":"wrong","feedback":"It is the wrong class for absence."},{"id":"w2","label":"Phenytoin, now that a home drug exists","verdict":"wrong","feedback":"The home drug is the one you restart."}]},{"id":"c8","skill":"Reassessment","title":"She is sleepy but the EEG has quietened","lead":"She rouses, squeezes, and the spike-and-wave has stopped. Glucose remains normal.","prompt":"Where does she go?","hint":"Observed, not home in the first hour, and not the ICU for a propofol infusion.","guideline":"A recovered absence status needs observation until she is safe to swallow and the sedation has lifted. It does not need a coma protocol.","answer":"Observe until she is safely awake","kind":"choice","successFinding":"Observed","successStatus":"EEG quiet. Sleepy but rousable.","missYou":"Not that decision","miss":"Observed, not home in the first hour, and not the ICU for a propofol infusion.","choices":[{"id":"ok","label":"Keep her under observation. No ICU coma","verdict":"correct","feedback":"The emergency is over. The sedation is not.","finding":"Observed","status":"EEG quiet. Sleepy but rousable."},{"id":"w0","label":"Propofol and a tube, to be safe","verdict":"wrong","feedback":"There is nothing left to suppress."},{"id":"w1","label":"Home now, while she is still too sleepy to stand","verdict":"wrong","feedback":"Observation is the point of the next hour."},{"id":"w2","label":"A CT before anyone may speak to her","verdict":"wrong","feedback":"The diagnosis is on the EEG. A scan does not precede a conversation she is already having."}]},{"id":"c9","skill":"Reassessment","title":"She wants to know why it happened","lead":"She missed two weeks of tablets and slept four hours a night. There is no fever and no new drug.","prompt":"What is the plan you actually write?","hint":"Restart and explain the missed drug. Do not add a second anticonvulsant tonight. Do not blame a stroke without a focal sign.","guideline":"The precipitant is the missed ethosuximide and sleep loss. One effective drug, taken, is the plan.","answer":"Restart the missed drug and explain it","kind":"choice","successFinding":"Missed doses explained","successStatus":"Awake. One drug.","missYou":"Not that decision","miss":"Restart and explain the missed drug. Do not add a second anticonvulsant tonight. Do not blame a stroke without a focal sign.","choices":[{"id":"ok","label":"Restart the one drug and tell her what the missed doses did","verdict":"correct","feedback":"Adding a second drug tonight treats the doctor's anxiety, not the EEG.","finding":"Missed doses explained","status":"Awake. One drug."},{"id":"w0","label":"Two new anticonvulsants on top of the old one","verdict":"wrong","feedback":"She did not fail the drug. She did not take it."},{"id":"w1","label":"Thrombolysis, in case the staring was a stroke","verdict":"wrong","feedback":"The EEG already named it."},{"id":"w2","label":"Discharge with no prescription because the EEG is now normal","verdict":"wrong","feedback":"The reason it started is still in the unopened bottle."}]},{"id":"c10","skill":"Reassessment","title":"She is fully awake","lead":"Speech is back to normal. She has eaten. A parent is with her.","prompt":"What is a safe discharge?","hint":"Home with the restarted drug, a warning about driving and baths, and a follow-up. Not a syringe of midazolam as her only plan, and not phenytoin to take away.","guideline":"Safety advice and the correct drug. Rescue benzodiazepine can be taught. Phenytoin is still the wrong tablet.","answer":"Home on ethosuximide, with safety advice","kind":"choice","successFinding":"Discharge plan","successStatus":"Awake. Correct drug in her hand.","missYou":"Not that decision","miss":"Home with the restarted drug, a warning about driving and baths, and a follow-up. Not a syringe of midazolam as her only plan, and not phenytoin to take away.","choices":[{"id":"ok","label":"Discharge on ethosuximide with safety advice. No phenytoin","verdict":"correct","feedback":"She has recovered from absence status. Send the drug that treats it.","finding":"Discharge plan","status":"Awake. Correct drug in her hand."},{"id":"w0","label":"Phenytoin tablets, because the ward uses them","verdict":"wrong","feedback":"They will not prevent the next absence."},{"id":"w1","label":"No follow-up. It was a one-off","verdict":"wrong","feedback":"She stopped a drug and seized in slow motion. She needs a plan."},{"id":"w2","label":"A week of dexamethasone","verdict":"wrong","feedback":"There is no inflammation to treat."}]}]},{"id":"tension","title":"Tension pneumothorax","syndrome":"No breath sounds, falling pressure","minutes":"14 min","difficulty":"Core","available":true,"summary":"The trachea is moving and the pressure is falling. The film does not come before the needle.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/tension.jpg","patient":"Sudden dyspnea after a subclavian line","ageSex":"54-year-old man","chart":["Teaching case. Not a prescription.","A line was just placed. Breath sounds are absent on one side. Neck veins are up. Systolic pressure is 72."],"opening":{"lkwMin":20,"status":"Shocked, absent breath sounds on one side.","sbp":72,"dbp":48,"hr":132,"rr":34,"spo2":84,"glucose":142},"stages":[{"id":"first","skill":"Action","title":"He is crashing","lead":"You can hear air hunger. One side of the chest is silent. The radiographer is outside the door.","prompt":"What happens first?","hint":"Tension is a clinical diagnosis. Decompress before the film when the pressure is gone.","guideline":"Do not wait for a radiograph to decompress tension. The film, if you take one, comes after the needle or the finger thoracostomy.","answer":"Decompress now","kind":"choice","successFinding":"Decompressed","successStatus":"A rush of air. Pressure rising.","missYou":"Not that choice","miss":"Tension is a clinical diagnosis. Decompress before the film when the pressure is gone.","choices":[{"id":"needle","label":"Decompress the silent side now, then a definitive drain","verdict":"correct","feedback":"Finger thoracostomy or a needle in the mid-axillary line, fourth or fifth space, then an intercostal drain. The film is not the treatment.","sbp":104,"spo2":94,"finding":"Decompressed","status":"Air released. Pressure recovering."},{"id":"cxr","label":"Portable film first, then decide","verdict":"wrong","feedback":"He is shocked and silent on one side. Waiting for the picture is how tension kills.","critical":true},{"id":"fluid","label":"A litre of fluid for the hypotension","verdict":"wrong","feedback":"The shock is obstructive. Fluid does not put the lung back and the mediastinum back."},{"id":"intub","label":"Intubate and ventilate before you decompress","verdict":"wrong","feedback":"Positive pressure before decompression makes tension worse. Open the chest first.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the pneumothorax","lead":"The film, taken after the first release of air, still shows one hemithorax with no lung markings and a shifted mediastinum.","prompt":"Click the hemithorax with no lung markings.","hint":"The abnormal side is black, with no vessels. The mediastinum is pushed away from it.","guideline":"Absent markings and a pushed mediastinum are tension or a large pneumothorax. A needle is not the definitive drain.","answer":"Pneumothorax","image":{"src":"sim/cases/tension.jpg","alt":"Chest radiograph. One black hemithorax and a shifted mediastinum.","caption":"Lung markings are gone on one side."},"kind":"hotspot","successFinding":"Large pneumothorax","successStatus":"Large pneumothorax","missYou":"Clicked the aerated lung","miss":"The abnormal side is the black one, without lung markings. The other side still has vessels.","regions":[{"id":"black","verdict":"correct","cx":0.74,"cy":0.42,"rx":0.16,"ry":0.22,"you":"Pneumothorax","feedback":"No lung markings, and the mediastinum is pushed the other way."},{"id":"lung","verdict":"wrong","cx":0.28,"cy":0.42,"rx":0.12,"ry":0.16,"you":"The lung that is still there","feedback":"That side still has markings. The pneumothorax is the black hemithorax."}]},{"id":"name","skill":"Interpretation","title":"Name it","lead":"One side is black. The mediastinum has shifted toward the lung that remains.","prompt":"What is the diagnosis?","hint":"Shift plus no markings, after shock. Not a simple small apical rim.","guideline":"This is tension physiology even if the film was taken a minute late. The definitive treatment is a chest drain, not another radiograph.","answer":"Tension pneumothorax","kind":"choice","successFinding":"Tension pneumothorax","successStatus":"Drain, not another film.","missYou":"Not that choice","miss":"Shift plus no markings, after shock. Not a simple small apical rim.","choices":[{"id":"ten","label":"Tension pneumothorax","verdict":"correct","feedback":"Shock, absent sounds, no markings, and shift. That is tension.","finding":"Tension pneumothorax","status":"Drain being prepared."},{"id":"eff","label":"Pleural effusion","verdict":"wrong","feedback":"Effusion is white, not black. This side has too little density, not too much."},{"id":"pna","label":"Lobar pneumonia","verdict":"wrong","feedback":"Pneumonia is opaque. This hemithorax is lucent."},{"id":"small","label":"A tiny apical pneumothorax, safe to observe","verdict":"wrong","feedback":"The mediastinum has moved and he was shocked. This is not an observe-on-the-ward rim.","critical":true}],"image":{"src":"sim/cases/tension.jpg","alt":"Name it","caption":"Name it"}},{"id":"drain","skill":"Decision","title":"The needle helped. Then what?","lead":"His pressure is 104. The needle is still in, or the finger sweep is done. He is not on a drain.","prompt":"What is the definitive step?","hint":"A needle or a finger is a bridge. The intercostal drain stays.","guideline":"Place an intercostal drain. Do not send him back to the ward with a needle as the only treatment.","answer":"Intercostal drain","kind":"choice","successFinding":"Drain placed","successStatus":"On a drain. Pressure holding.","missYou":"Not that choice","miss":"A needle or a finger is a bridge. The intercostal drain stays.","choices":[{"id":"icd","label":"Intercostal drain on that side","verdict":"correct","feedback":"The needle is temporary. The drain is the treatment. Re-expand, and do not clamp a bubbling drain.","sbp":118,"spo2":96,"finding":"Intercostal drain","status":"Drain swinging. Pressure stable."},{"id":"out","label":"Remove the needle and repeat the film in four hours","verdict":"wrong","feedback":"If you remove the only vent before a drain, tension returns.","critical":true},{"id":"both","label":"Drain the other side as well, empirically","verdict":"wrong","feedback":"The other lung has markings. Do not put a drain into a working lung."},{"id":"ct","label":"CT of the chest before any drain","verdict":"wrong","feedback":"He has already declared himself. CT delays the drain."}]},{"id":"again","skill":"Reassessment","title":"The pressure falls again","lead":"The drain is in, but it is not bubbling and the bottle is clamped 'for the transfer.' Pressure is 80.","prompt":"What do you do?","hint":"A clamped or kinked drain does not exist, clinically. Open it, or decompress again.","guideline":"Never clamp a bubbling chest drain. If the pressure falls, the drain is not working: unkink it, unclamp it, or reopen the chest.","answer":"Make the drain work","kind":"choice","successFinding":"Drain unclamped","successStatus":"Bubbling. Pressure back.","missYou":"Not that choice","miss":"A clamped or kinked drain does not exist, clinically. Open it, or decompress again.","choices":[{"id":"open","label":"Unclamp and unkink the drain. If it still fails, decompress again","verdict":"correct","feedback":"A clamp on a pneumothorax drain recreates tension. Open it.","sbp":116,"finding":"Drain working","status":"Bubbling. Pressure recovered."},{"id":"fluid","label":"Another litre, and leave the clamp on","verdict":"wrong","feedback":"The clamp is the disease. Fluid will not move the mediastinum back.","critical":true},{"id":"peep","label":"Raise the ventilator pressures","verdict":"wrong","feedback":"Higher pressure with an undrained pneumothorax worsens tension."},{"id":"observe","label":"The clamp is policy. Observe for an hour","verdict":"wrong","feedback":"There is no policy that clamps a tension drain. Take it off."}]},{"id":"c6","skill":"Reassessment","title":"The drain is bubbling and the pressure is back","lead":"Systolic pressure is 110. The drain bubbles. A colleague reaches for the clamp so the bottle can be emptied neatly.","prompt":"Do you clamp it?","hint":"No. A bubbling drain stays open. Clamping recreates the tension.","guideline":"Never clamp a bubbling chest drain. The leak has to escape.","answer":"Leave the drain unclamped","kind":"choice","successFinding":"Drain left open","successStatus":"Bubbling. Pressure held.","missYou":"Not that decision","miss":"No. A bubbling drain stays open. Clamping recreates the tension.","choices":[{"id":"ok","label":"Do not clamp it","verdict":"correct","feedback":"The bubbles are the leak leaving. Trapping them puts the tension back.","finding":"Drain left open","status":"Bubbling. Pressure held."},{"id":"w0","label":"Clamp it for the porter","verdict":"wrong","feedback":"That is how tension returns.","critical":true},{"id":"w1","label":"Pull the tube out now that the pressure is normal","verdict":"wrong","feedback":"The lung has not had time to stay up."},{"id":"w2","label":"Turn the suction off and cap the tube","verdict":"wrong","feedback":"Capping a leak is clamping by another name."}]},{"id":"c7","skill":"Reassessment","title":"The chest film is taken","lead":"The film shows the tube in the pleural space and the lung up. He is comfortable on simple oxygen.","prompt":"What does the film change?","hint":"It confirms the tube. It does not authorize removal tonight, and it does not mean the first decompression was unnecessary.","guideline":"A good position and an expanded lung means leave a functioning drain. Removal waits until the leak has stopped and the lung stays up.","answer":"Leave the drain. It is in the right place","kind":"choice","successFinding":"Tube position confirmed","successStatus":"Lung up. Drain stays.","missYou":"Not that decision","miss":"It confirms the tube. It does not authorize removal tonight, and it does not mean the first decompression was unnecessary.","choices":[{"id":"ok","label":"Leave it tonight. The film shows a tube in the pleura and a lung that is up","verdict":"correct","feedback":"You do not reward a good film by pulling the tube at one hour.","finding":"Tube position confirmed","status":"Lung up. Drain stays."},{"id":"w0","label":"Remove it. The lung is up","verdict":"wrong","feedback":"The leak may still be there. One film is not a finished leak."},{"id":"w1","label":"Put a second drain on the other side, to be symmetrical","verdict":"wrong","feedback":"The other side was not the tension."},{"id":"w2","label":"Start non-invasive ventilation for comfort","verdict":"wrong","feedback":"A mask on a fresh pleural drain is not comfort."}]},{"id":"c8","skill":"Reassessment","title":"He is in pain and breathing shallowly","lead":"The lung is up. He will not take a deep breath. Saturation is 94 percent on oxygen. The drain swings.","prompt":"What do you add?","hint":"Analgesia so he can breathe. Not a sedative that stops the breathing, and not a clamp.","guideline":"A chest drain hurts. Shallow breathing collapses the lung you just saved. Adequate analgesia is the next treatment.","answer":"Analgesia, and keep the drain open","kind":"choice","successFinding":"Analgesia given","successStatus":"Breathing deeper. Drain open.","missYou":"Not that decision","miss":"Analgesia so he can breathe. Not a sedative that stops the breathing, and not a clamp.","choices":[{"id":"ok","label":"Relieve the pain so he can breathe. Leave the drain alone","verdict":"correct","feedback":"Pain is the reason the lung will collapse again. Treat it.","finding":"Analgesia given","status":"Breathing deeper. Drain open."},{"id":"w0","label":"A large dose of sedation and a clamp","verdict":"wrong","feedback":"You would stop the breathing and close the escape."},{"id":"w1","label":"Nothing. Pain means the drain is working","verdict":"wrong","feedback":"Pain means he will not expand the lung."},{"id":"w2","label":"Antibiotics for 7 days because a tube is in","verdict":"wrong","feedback":"A clean traumatic or iatrogenic drain does not automatically need a week of antibiotics."}]},{"id":"c9","skill":"Reassessment","title":"The bubbling stops","lead":"Six hours later the drain has stopped bubbling and has stopped swinging. He is comfortable. You do not have a new film yet.","prompt":"Is the tube out?","hint":"Not yet. Confirm the lung is still up, and that the tube is not blocked, before anyone pulls it.","guideline":"A silent drain is either a sealed leak or a blocked tube. Look before you pull.","answer":"Check the lung before removal","kind":"choice","successFinding":"Removal deferred","successStatus":"Awaiting a film. Not pulled.","missYou":"Not that decision","miss":"Not yet. Confirm the lung is still up, and that the tube is not blocked, before anyone pulls it.","choices":[{"id":"ok","label":"A film first. A silent drain is not automatically a finished job","verdict":"correct","feedback":"Blocked and healed look the same until you look.","finding":"Removal deferred","status":"Awaiting a film. Not pulled."},{"id":"w0","label":"Pull it now. Silence means success","verdict":"wrong","feedback":"Silence also means kinked."},{"id":"w1","label":"Flush it with a litre of saline under pressure","verdict":"wrong","feedback":"That is not how a chest drain is tested."},{"id":"w2","label":"Clamp it overnight now that it is quiet","verdict":"wrong","feedback":"Clamping a drain that might still have a leak is the old mistake."}]},{"id":"c10","skill":"Reassessment","title":"The lung stays up and there is no leak","lead":
