f it and the blood pressure holds. Restart his chronic medicines with cardiology, not by emptying the cupboard tonight.","choices":[{"id":"ok","label":"Keep him monitored until the inotrope stops","verdict":"correct","feedback":"The ward cannot run the drug that is still keeping him warm.","finding":"Still monitored","status":"Low-dose inotrope. Not for the ward."},{"id":"w0","label":"The ward, with the inotrope in a bag","verdict":"wrong","feedback":"That infusion is not a ward drug."},{"id":"w1","label":"Stop the inotrope from here and hope","verdict":"wrong","feedback":"Hope is not a wean. Turn it down and look."},{"id":"w2","label":"A large oral beta blocker tonight","verdict":"wrong","feedback":"The ventricle is one day out from shock."}]}]},{"id":"hyperk","title":"Hyperkalemia","syndrome":"Weak, and the T waves are peaked","minutes":"14 min","difficulty":"Core","available":true,"summary":"Potassium is 7.1. The electrocardiogram has already changed. Calcium comes before the insulin.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/hyperk.jpg","patient":"Weakness, and a missed dialysis session","ageSex":"66-year-old man","chart":["Teaching case. Not a prescription.","Anuric. Potassium 7.1 mmol/L. Glucose 162 mg/dL. No digoxin."],"opening":{"lkwMin":20,"status":"Weak, anuric.","sbp":146,"dbp":82,"hr":81,"rr":18,"spo2":97,"glucose":162},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at before the drug?","lead":"The laboratory has already phoned the potassium. You need the membrane.","prompt":"Which test changes the first drug?","hint":"The electrocardiogram. Peaked T waves, a wide QRS, or a sine wave means calcium first.","guideline":"Intravenous calcium stabilizes the membrane. It does not lower the potassium. Insulin with glucose does that.","answer":"Electrocardiogram","kind":"choice","successFinding":"Electrocardiogram done","successStatus":"The tracing is up.","missYou":"Not that choice","miss":"The electrocardiogram. Peaked T waves, a wide QRS, or a sine wave means calcium first.","choices":[{"id":"ecg","label":"Electrocardiogram now","verdict":"correct","feedback":"If it is abnormal, calcium is first. Do not start with a resin.","finding":"Electrocardiogram","status":"Tracing on the screen."},{"id":"resin","label":"Sodium polystyrene only, and a repeat potassium tomorrow","verdict":"wrong","feedback":"A resin is slow, weak, and not the treatment of a potassium of 7.1 with a changed tracing.","critical":true},{"id":"wait","label":"Repeat the laboratory. Do nothing if it might be hemolyzed","verdict":"wrong","feedback":"Treat the patient in front of you. A second sample can be drawn while the calcium is running, not instead of it."},{"id":"kcl","label":"Potassium replacement, because he is weak","verdict":"wrong","feedback":"Weakness here is from too much potassium. Giving more can arrest him.","critical":true}]},{"id":"click","skill":"Localization","title":"Click a peaked T wave","lead":"The precordial leads are on the right of the page. The T waves are tall and pointed.","prompt":"Click a tall peaked T wave.","hint":"The chest leads on the right have the sharp tall T waves. The limb leads are on the left.","guideline":"Peaked T waves are the early electrocardiographic sign of hyperkalemia. A wide QRS is later and more dangerous. Either one earns calcium.","answer":"Peaked T waves","image":{"src":"sim/cases/hyperk.jpg","alt":"Electrocardiogram with tall peaked precordial T waves.","caption":"Tall peaked T waves."},"kind":"hotspot","successFinding":"Membrane is irritable","successStatus":"Membrane is irritable","missYou":"Clicked a limb lead","miss":"The peaked waves to mark are in the chest leads, on the right of the page.","regions":[{"id":"t","verdict":"correct","cx":0.72,"cy":0.46,"rx":0.18,"ry":0.28,"you":"Peaked T wave","feedback":"Those tall pointed T waves are the hyperkalemic change."},{"id":"limb","verdict":"wrong","cx":0.22,"cy":0.22,"rx":0.1,"ry":0.08,"you":"A limb lead","feedback":"That side is the limb leads. The peaked precordial T waves are on the right."}]},{"id":"name","skill":"Interpretation","title":"Name the danger","lead":"Potassium 7.1, anuric, peaked T waves, QRS not yet a sine wave.","prompt":"What does the tracing mean?","hint":"The membrane is unstable. Calcium first, then shift the potassium.","guideline":"Calcium gluconate, 10 mL of 10 percent, is the usual first intravenous calcium. It lasts about 30 to 60 minutes. It does not remove potassium.","answer":"Hyperkalemia with electrocardiographic change","kind":"choice","successFinding":"Calcium first","successStatus":"Calcium being drawn.","missYou":"Not that choice","miss":"The membrane is unstable. Calcium first, then shift the potassium.","choices":[{"id":"ca","label":"Hyperkalemia with a changed tracing. Give intravenous calcium first","verdict":"correct","feedback":"10 mL of 10 percent calcium gluconate, with the monitor on. Then shift the potassium. Calcium is not the cure.","finding":"Calcium indicated","status":"Calcium ready."},{"id":"fine","label":"A normal tracing. Insulin can wait until the morning","verdict":"wrong","feedback":"Those T waves are not normal, and 7.1 in an anuric patient does not wait."},{"id":"stemi","label":"ST-elevation infarction. Activate the catheter laboratory only","verdict":"wrong","feedback":"The tall waves are T waves, not an ST-elevation infarct pattern to treat instead of the potassium."},{"id":"hypo","label":"Hypokalemia, so give potassium","verdict":"wrong","feedback":"Hypokalemia flattens the T wave. These are peaked. Giving potassium is dangerous.","critical":true}],"image":{"src":"sim/cases/hyperk.jpg","alt":"Name the danger","caption":"Name the danger"}},{"id":"shift","skill":"Decision","title":"Calcium is in. The potassium is still 7.1","lead":"The T waves look a little kinder. The number has not moved. Glucose is 9 mmol/L. He makes no urine.","prompt":"What lowers the potassium?","hint":"Insulin with glucose. A beta-agonist as an adjunct. A resin is not the plan. Dialysis if there is no urine.","guideline":"10 units of regular insulin intravenously, with glucose so the sugar does not crash. Salbutamol can be added. Neither replaces dialysis in an anuric patient who remains high.","answer":"Insulin with glucose","kind":"choice","successFinding":"Insulin given","successStatus":"Glucose watched. Dialysis called.","missYou":"Not that choice","miss":"Insulin with glucose. A beta-agonist as an adjunct. A resin is not the plan. Dialysis if there is no urine.","choices":[{"id":"ins","label":"Insulin with glucose, and arrange dialysis because he is anuric","verdict":"correct","feedback":"Insulin shifts potassium. It does not remove it for long. Anuria means dialysis. Recheck the glucose.","glucose":140,"finding":"Insulin and dialysis referral","status":"Shifted. Dialysis planned."},{"id":"ca2","label":"More calcium only, every hour, and nothing else","verdict":"wrong","feedback":"Calcium will wear off and the potassium is still 7.1. You have not moved the number."},{"id":"kcl","label":"Potassium in the maintenance fluid","verdict":"wrong","feedback":"Do not put potassium into this patient.","critical":true},{"id":"resin","label":"A resin enema as the only next step","verdict":"wrong","feedback":"A resin is too slow and too weak for this number."}]},{"id":"again","skill":"Reassessment","title":"The QRS widens again at forty minutes","lead":"Insulin is in. The potassium is now 6.4. The QRS, which had narrowed, is wide again.","prompt":"What do you do?","hint":"Calcium wore off. Give it again. The insulin is still doing its job. Do not stop dialysis.","guideline":"Repeat calcium if the electrocardiogram worsens. Keep the shift going. Dialysis removes the potassium his kidney will not.","answer":"Repeat calcium, keep dialysis","kind":"choice","successFinding":"Calcium repeated","successStatus":"QRS narrowing. Dialysis on the way.","missYou":"Not that choice","miss":"Calcium wore off. Give it again. The insulin is still doing its job. Do not stop dialysis.","choices":[{"id":"rep","label":"Repeat the calcium. Do not cancel dialysis","verdict":"correct","feedback":"The membrane needs calcium again. The body still needs the potassium gone.","finding":"Calcium repeated","status":"Electrocardiogram watched. Dialysis continues."},{"id":"stop","label":"Stop everything. 6.4 is close enough and the QRS is his normal","verdict":"wrong","feedback":"A widening QRS is not his normal. And anuria will send the number back up."},{"id":"bic","label":"Sodium bicarbonate as the only drug, stop the insulin","verdict":"wrong","feedback":"Bicarbonate is a weak shift at best, and only when he is acidotic. It does not replace insulin or dialysis."},{"id":"k","label":"A small potassium replacement now that it is 6.4","verdict":"wrong","feedback":"6.4 with a widening QRS is still too much potassium.","critical":true}]},{"id":"c6","skill":"Reassessment","title":"The QRS is narrower on dialysis","lead":"Calcium has been repeated. The dialysis machine is running. The QRS is tighter. Potassium is not yet back.","prompt":"Do you stop to give polystyrene resin instead?","hint":"No. Resin is not the emergency treatment. Dialysis stays. Bicarbonate is not the main drug if the pH is acceptable.","guideline":"When the ECG is changing and he is anuric, dialysis is the removal. Exchange resin does not replace it.","answer":"Keep dialysis. Do not swap it for resin","kind":"choice","successFinding":"Dialysis continued","successStatus":"QRS narrower. Still on the machine.","missYou":"Not that decision","miss":"No. Resin is not the emergency treatment. Dialysis stays. Bicarbonate is not the main drug if the pH is acceptable.","choices":[{"id":"ok","label":"Leave him on dialysis. Do not replace it with resin","verdict":"correct","feedback":"The heart just showed you why removal has to be real.","finding":"Dialysis continued","status":"QRS narrower. Still on the machine."},{"id":"w0","label":"Stop dialysis and give resin","verdict":"wrong","feedback":"Resin is too slow for a wide QRS.","critical":true},{"id":"w1","label":"A bicarbonate infusion as the only potassium plan","verdict":"wrong","feedback":"Bicarbonate is not the treatment of anuric hyperkalemia with ECG change."},{"id":"w2","label":"No more calcium ever, because one dose was given","verdict":"wrong","feedback":"Calcium is repeated if the ECG widens again. It does not lower the potassium, and you already know that."}]},{"id":"c7","skill":"Reassessment","title":"The glucose is 68 mg/dL","lead":"Insulin and glucose were given before dialysis. The fingerstick is now 68 mg/dL. He is anuric and still on the machine.","prompt":"What do you give?","hint":"Dextrose. Do not repeat the insulin without more glucose. Do not treat 68 with insulin.","guideline":"Insulin outlasts the glucose you gave with it. Hypoglycemia is corrected with dextrose. A second insulin dose without glucose is the same mistake.","answer":"Dextrose. No lone insulin","kind":"choice","successFinding":"Dextrose given","successStatus":"Glucose corrected on dialysis.","missYou":"Not that decision","miss":"Dextrose. Do not repeat the insulin without more glucose. Do not treat 68 with insulin.","choices":[{"id":"ok","label":"Give dextrose. Do not give insulin on its own","verdict":"correct","feedback":"The potassium shift already happened. The sugar has run out.","finding":"Dextrose given","status":"Glucose corrected on dialysis.","glucose":120},{"id":"w0","label":"Another 10 units of insulin, because the potassium was 7","verdict":"wrong","feedback":"The sugar is 68. Insulin alone is hypoglycemia.","critical":true},{"id":"w1","label":"Stop dialysis to chase the glucose","verdict":"wrong","feedback":"Give sugar. The machine can keep running."},{"id":"w2","label":"Glucagon and no dextrose available is not this situation. Wait","verdict":"wrong","feedback":"You have dextrose. Use it."}]},{"id":"c8","skill":"Reassessment","title":"An hour after dialysis the potassium is 6.2","lead":"The ECG is still narrow. He is anuric. Potassium has rebounded to 6.2 mmol/L. Glucose is 120 mg/dL.","prompt":"What does the rebound mean?","hint":"The source is still there. He needs more removal, not a single insulin dose as a cure. Calcium only if the ECG changes.","guideline":"Dialysis removes what is in the blood. Rebound means more potassium is moving out of cells, or the session was not enough. Anuric patients need another look at dialysis, not a tablet.","answer":"Plan more dialysis. Calcium only if the ECG changes","kind":"choice","successFinding":"Rebound recognised","successStatus":"Narrow ECG. Potassium 6.2. More removal planned.","missYou":"Not that decision","miss":"The source is still there. He needs more removal, not a single insulin dose as a cure. Calcium only if the ECG changes.","choices":[{"id":"ok","label":"More dialysis. Do not call one insulin dose a cure","verdict":"correct","feedback":"6.2 with a narrow ECG is urgent removal, not a new calcium reflex and not a finished case.","finding":"Rebound recognised","status":"Narrow ECG. Potassium 6.2. More removal planned."},{"id":"w0","label":"Home. 6.2 is close enough","verdict":"wrong","feedback":"He is anuric. 6.2 will be 7 again.","critical":true},{"id":"w1","label":"Calcium infusion all night, and no more dialysis","verdict":"wrong","feedback":"Calcium does not lower the potassium."},{"id":"w2","label":"A saline litre to dilute it","verdict":"wrong","feedback":"He missed dialysis because he is overloaded. Do not add saline."}]},{"id":"c9","skill":"Reassessment","title":"Why did this happen?","lead":"He missed two dialysis sessions. He is on an ACE inhibitor and a potassium-containing salt substitute.","prompt":"What do you stop?","hint":"The salt substitute and, for now, the ACE inhibitor. Do not stop the dialysis schedule. Do not add spironolactone.","guideline":"The precipitants are missed dialysis, an ACE inhibitor, and extra potassium. They are removed. The schedule is restored.","answer":"Stop the salt substitute and hold the ACE inhibitor","kind":"choice","successFinding":"Precipitant removed","successStatus":"Dialysis schedule restored.","missYou":"Not that decision","miss":"The salt substitute and, for now, the ACE inhibitor. Do not stop the dialysis schedule. Do not add spironolactone.","choices":[{"id":"ok","label":"Stop the salt substitute, hold the ACE inhibitor, and put him back on his dialysis days","verdict":"correct","feedback":"The ECG was the emergency. The missed sessions are the cause.","finding":"Precipitant removed","status":"Dialysis schedule restored."},{"id":"w0","label":"Spironolactone, to help the heart","verdict":"wrong","feedback":"That will raise the potassium again.","critical":true},{"id":"w1","label":"No more dialysis this week, to rest the fistula","verdict":"wrong","feedback":"Rest is how the potassium returns."},{"id":"w2","label":"A banana diet. Fruit is healthy","verdict":"wrong","feedback":"Not this week."}]},{"id":"c10","skill":"Reassessment","title":"The fistula is in the left arm","lead":"Potassium is 4.8 after the second session. The ECG is normal. A nurse is about to take blood pressures on the left arm.","prompt":"What do you protect?","hint":"No blood pressure cuff and no intravenous drip in the fistula arm. He can leave the high-care area when the potassium and the ECG stay safe, back to his dialysis slot.","guideline":"A working fistula is how he stays alive. Needles and cuffs belong in the other arm.","answer":"Protect the fistula. Back to his dialysis slot","kind":"choice","successFinding":"Fistula protected","successStatus":"Potassium safe. Dialysis plan restored.","missYou":"Not that decision","miss":"No blood pressure cuff and no intravenous drip in the fistula arm. He can leave the high-care area when the potassium and the ECG stay safe, back to his dialysis slot.","choices":[{"id":"ok","label":"Use the other arm. Send him back to his dialysis days, not off them","verdict":"correct","feedback":"The emergency is over only if the access and the schedule survive it.","finding":"Fistula protected","status":"Potassium safe. Dialysis plan restored."},{"id":"w0","label":"Blood pressure every 15 minutes on the fistula arm","verdict":"wrong","feedback":"You will lose the access."},{"id":"w1","label":"Discharge with no dialysis for a fortnight","verdict":"wrong","feedback":"That is the history of this admission."},{"id":"w2","label":"Daily resin instead of dialysis","verdict":"wrong","feedback":"Resin is not his kidney."}]}]},{"id":"aki","title":"Acute kidney injury with shock","syndrome":"The kidney is obstructed","minutes":"14 min","difficulty":"Core","available":true,"summary":"He is shocked and the creatinine has jumped. The film is not 'acute tubular necrosis by default.' One kidney is a bag of fluid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/hydro.jpg","patient":"Fever, a stone history, and no urine for eight hours","ageSex":"63-year-old man","chart":["Teaching case. Not a prescription.","Creatinine was 0.9 mg/dL last month and is 3.6 today. Right loin pain. Lactate 4. Systolic pressure 82 after a small fluid start."],"opening":{"lkwMin":20,"status":"Febrile, loin pain, oliguric.","sbp":82,"dbp":50,"hr":124,"rr":26,"spo2":94,"glucose":154},"stages":[{"id":"study","skill":"Investigation","title":"What must the image answer?","lead":"You are treating shock. The creatinine has quadrupled and he has loin pain.","prompt":"What do you need to see?","hint":"Whether the collecting system is blocked. A blocked infected kidney is a surgical abscess.","guideline":"Imaging for obstruction is part of acute kidney injury when the story suggests a stone or a single functioning kidney. Infected obstruction is drained, not dosed away.","answer":"Image the kidneys","kind":"choice","successFinding":"Imaged","successStatus":"The scan is up.","missYou":"Not that choice","miss":"Whether the collecting system is blocked. A blocked infected kidney is a surgical abscess.","choices":[{"id":"img","label":"Image the kidneys now. Do not call this tubular necrosis yet","verdict":"correct","feedback":"Loin pain and anuria earn a look. Ultrasound is usual. This CT is what you have, and it answers the question.","finding":"Kidneys imaged","status":"Scan on the screen."},{"id":"atn","label":"Label it tubular necrosis and never image","verdict":"wrong","feedback":"You will miss a drainable obstruction. That kidney can kill him."},{"id":"dop","label":"Renal-dose dopamine instead of imaging","verdict":"wrong","feedback":"There is no useful renal-dose dopamine."},{"id":"ignore","label":"The creatinine can wait until tomorrow's ward round","verdict":"wrong","feedback":"He is shocked, febrile, and anuric. Tomorrow is a septic death.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the obstructed kidney","lead":"The marker R is on the left of the screen, so that side is the patient's right. One kidney is a huge fluid-filled sac. The other still enhances.","prompt":"Click the obstructed kidney.","hint":"The large grey sac on the patient's right is the dilated collecting system. The arrows on the film point at it.","guideline":"An infected obstructed kidney needs drainage, a culture, and an antibiotic that covers the gram-negative organisms, plus a vasopressor if the pressure stays low.","answer":"Obstructed right kidney","image":{"src":"sim/cases/hydro.jpg","alt":"CT. A massively dilated right kidney. The left kidney still enhances.","caption":"The right collecting system is a bag of fluid."},"kind":"hotspot","successFinding":"Obstruction","successStatus":"Obstruction","missYou":"Clicked the working kidney","miss":"The enhancing kidney on the other side is the one that still works. The obstructed one is the huge fluid-filled sac on the side marked R.","regions":[{"id":"hydro","verdict":"correct","cx":0.3,"cy":0.42,"rx":0.14,"ry":0.16,"you":"Obstructed kidney","feedback":"That sac is the dilated right collecting system."},{"id":"good","verdict":"wrong","cx":0.78,"cy":0.55,"rx":0.08,"ry":0.08,"you":"The enhancing kidney","feedback":"That kidney is taking up contrast. It is not the obstructed one."}]},{"id":"name","skill":"Interpretation","title":"Name the kidney injury","lead":"Septic shock, anuria, and a dilated collecting system.","prompt":"What kind of acute kidney injury is this?","hint":"Post-renal. Drainage is the treatment of the kidney. Norepinephrine is the treatment of the pressure.","guideline":"Do both. A vasopressor does not unblind a ureter. A nephrostomy does not, by itself, fix the vasodilated shock.","answer":"Post-renal acute kidney injury","kind":"choice","successFinding":"Obstruction","successStatus":"Drainage and a pressor.","missYou":"Not that choice","miss":"Post-renal. Drainage is the treatment of the kidney. Norepinephrine is the treatment of the pressure.","choices":[{"id":"post","label":"Post-renal. Infected obstruction until proved otherwise","verdict":"correct","feedback":"Drain it. Culture the urine you get. Cover gram-negative organisms. Support the pressure.","finding":"Obstructed, infected kidney","status":"Urology and a pressor."},{"id":"pre","label":"Pre-renal. Another two litres will open it","verdict":"wrong","feedback":"A sac of fluid under pressure is not a dry kidney. More fluid will not empty the pelvis."},{"id":"atn","label":"Tubular necrosis from shock, so no drainage","verdict":"wrong","feedback":"Tubular necrosis may also be present. It does not cancel a blocked, infected kidney.","critical":true},{"id":"gn","label":"Glomerulonephritis. High-dose steroid first","verdict":"wrong","feedback":"This picture is a dilated collecting system, not a glomerulus. A steroid delays the drain."}],"image":{"src":"sim/cases/hydro.jpg","alt":"Name the kidney injury","caption":"Name the kidney injury"}},{"id":"do","skill":"Decision","title":"Who does what?","lead":"Pressure is 82 after a cautious fluid start. The lactate is 4. You have a culture cooking.","prompt":"What is the plan?","hint":"Norepinephrine, an antibiotic, and drainage. Not dopamine.","guideline":"Source control is the drainage. Norepinephrine if the pressure remains low after a modest fluid. Do not chase a creatinine with dialysis before the ureter is open, unless potassium, acid, or fluid overload forces you.","answer":"Drain, antibiotic, norepinephrine","kind":"choice","successFinding":"Bundle started","successStatus":"Pressure rising. Drain being arranged.","missYou":"Not that choice","miss":"Norepinephrine, an antibiotic, and drainage. Not dopamine.","choices":[{"id":"all","label":"Drainage, an antibiotic, and norepinephrine for the pressure","verdict":"correct","feedback":"All three. Dialysis is not the substitute for a nephrostomy.","sbp":100,"finding":"Drainage and norepinephrine","status":"Pressure 100. Urology on the way."},{"id":"dop","label":"Dopamine at 2 micrograms and no drainage","verdict":"wrong","feedback":"That infusion does not exist as a renal rescue, and the pelvis stays blocked.","critical":true},{"id":"fluid","label":"Thirty millilitres per kilogram more, no pressor, no drain","verdict":"wrong","feedback":"He has already had fluid and he is obstructed. More fluid is not source control."},{"id":"hd","label":"Hemodialysis now, and leave the stone until next week","verdict":"wrong","feedback":"You can dialyze the number and still leave pus under pressure. Drain the kidney."}]},{"id":"day","skill":"Reassessment","title":"The creatinine is still 3.2 the next morning","lead":"The nephrostomy is draining. He is warmer. Potassium is 4.8. He is off the norepinephrine. Someone wants dialysis because the number is not normal.","prompt":"Do you dialyze for the number?","hint":"No, if the potassium, the acid, the volume, and the drugs are safe. The creatinine lags.","guideline":"Dialysis is for a reason: potassium, acid, volume, or a toxin. A creatinine that has not yet fallen the morning after drainage is not, by itself, a reason.","answer":"No dialysis for a number","kind":"choice","successFinding":"Observed","successStatus":"Urine draining. Number watched.","missYou":"Not that choice","miss":"No, if the potassium, the acid, the volume, and the drugs are safe. The creatinine lags.","choices":[{"id":"no","label":"No. He is safe. The creatinine will lag the drainage","verdict":"correct","feedback":"Watch the potassium, the bicarbonate, and the volume. Do not dialyze a label.","finding":"Dialysis not required","status":"Draining. Off the vasopressor."},{"id":"yes","label":"Dialyze because any creatinine over 3 needs a machine","verdict":"wrong","feedback":"There is no such threshold. He has a drain and a safe potassium."},{"id":"out","label":"Remove the nephrostomy tonight because the number disappointed you","verdict":"wrong","feedback":"The tube is why he is alive. Do not pull it."},{"id":"fluid","label":"A large fluid bolus to wash the creatinine down","verdict":"wrong","feedback":"He is no longer shocked. A bolus is not a treatment for a recovering creatinine."}]},{"id":"c6","skill":"Reassessment","title":"The drain is working and the vasopressor is off","lead":"Urine is coming from the nephrostomy. Systolic pressure is 110 with no norepinephrine. Creatinine is still 3.2. He is afebrile on the antibiotic.","prompt":"Do you stop the antibiotic?","hint":"No. The obstructed infected kidney still needs the course. The pressure recovering is not a stop date.","guideline":"Source control and antibiotics. Stopping the drug on the first good blood pressure leaves the infection.","answer":"Continue the antibiotic","kind":"choice","successFinding":"Antibiotic continued","successStatus":"Draining. Off vasopressor.","missYou":"Not that decision","miss":"No. The obstructed infected kidney still needs the course. The pressure recovering is not a stop date.","choices":[{"id":"ok","label":"Keep the antibiotic. The drain does not replace it","verdict":"correct","feedback":"The bacteria were in the tissue and the blood, not only in the bag.","finding":"Antibiotic continued","status":"Draining. Off vasopressor."},{"id":"w0","label":"Stop the antibiotic. He is warm","verdict":"wrong","feedback":"Warm is not a completed course."},{"id":"w1","label":"A second nephrostomy on the normal side","verdict":"wrong","feedback":"The other kidney was not the obstructed one."},{"id":"w2","label":"Dopamine to make the creatinine fall","verdict":"wrong","feedback":"Dopamine is not a renal drug."}]},{"id":"c7","skill":"Reassessment","title":"Urine output is 100 mL an hour","lead":"The bag is filling. Someone prescribes a litre of saline every hour to match it.","prompt":"Do you match it litre for litre?","hint":"No. Replace what he needs after an examination, not a standing hourly litre. He is not in shock.","guideline":"Post-obstructive diuresis is real, but a blind hourly litre causes overload and low sodium. Match the need, not a ritual.","answer":"No standing hourly litre","kind":"choice","successFinding":"Fluids judged, not automatic","successStatus":"Diuresing. Not shocked.","missYou":"Not that decision","miss":"No. Replace what he needs after an examination, not a standing hourly litre. He is not in shock.","choices":[{"id":"ok","label":"Examine him and replace what he needs. Do not hang a litre every hour","verdict":"correct","feedback":"The kidney is catching up. You do not have to drown it.","finding":"Fluids judged, not automatic","status":"Diuresing. Not shocked."},{"id":"w0","label":"A litre every hour until tomorrow","verdict":"wrong","feedback":" r and a urology date. Oral antibiotics if the team switches. No dopamine prescription to take away.","choices":[{"id":"ok","label":"Move him only with the drain secure and a date to treat the stone","verdict":"correct","feedback":"The emergency was obstruction plus shock. Both are treated. The stone is not gone.","finding":"Stepped down","status":"Drain safe. Follow-up booked."},{"id":"w0","label":"Home, pull the tube in the car park","verdict":"wrong","feedback":"That is the obstruction, restarted."},{"id":"w1","label":"Stay in intensive care until the creatinine is 0.9","verdict":"wrong","feedback":"A falling creatinine does not need a ventilator bed."},{"id":"w2","label":"Renal-dose dopamine for a month","verdict":"wrong","feedback":"There is no such useful drug."}]}]},{"id":"ckd","title":"Chronic kidney disease","syndrome":"Missed dialysis, a white hemithorax","minutes":"14 min","difficulty":"Core","available":true,"summary":"He missed two sessions. He is anuric and hypoxic. The film is a large effusion from overload, not a reason for a first-line chest drain.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/effusion.jpg","patient":"Missed dialysis. Cannot lie flat","ageSex":"59-year-old man","chart":["Teaching case. Not a prescription.","Anuric. No fever. Weight is 4 kg up. Oxygen 88 percent on air. Potassium 5.4."],"opening":{"lkwMin":20,"status":"Hypoxic, anuric, overloaded.","sbp":168,"dbp":96,"hr":104,"rr":28,"spo2":88,"glucose":121},"stages":[{"id":"study","skill":"Investigation","title":"What do you image?","lead":"The diagnosis of missed dialysis is clinical. The film tells you how the water chose to collect.","prompt":"Which picture?","hint":"A chest radiograph. It will not replace dialysis.","guideline":"Volume overload in an anuric patient on-invasive ventilation. Not a chest drain. Not fluid.","guideline":"Non-invasive ventilation is reasonable if he is tiring. Urgent dialysis is the treatment. A tap is for doubt, not for a clear overload story.","answer":"Support the breathing, dialyze","kind":"choice","successFinding":"Dialysis starting","successStatus":"Mask on.","missYou":"Not that choice","miss":"Oxygen or non-invasive ventilation. Not a chest drain. Not fluid.","choices":[{"id":"hd","label":"Non-invasive ventilation if he tires, and urgent dialysis. No chest drain","verdict":"correct","feedback":"Take the water out of the body. Reassess the effusion after. Most of these do not need a drain.","spo2":94,"finding":"Urgent dialysis","status":"Dialysis starting."},{"id":"drain","label":"A 28 French drain before dialysis","verdict":"wrong","feedback":"You can collapse a lung and still have an overloaded patient. Drainage is not first.","critical":true},{"id":"fur","label":"Intravenous furosemide 250 mg and cancel dialysis","verdict":"wrong","feedback":"He is anuric. A large diuretic dose will not make urine that the kidney cannot make."},{"id":"fluid","label":"A bolus, because non-invasive ventilation drops the pressure sometimes","verdict":"wrong","feedback":"If the mask drops the pressure, turn the pressures down or fill the veins carefully. He is not empty. He is 4 kg up."}]},{"id":"after","skill":"Reassessment","title":"After dialysis he is better and the film is not clear","lead":"Two litres off. Oxygen 95 percent on nasal prongs. The effusion is smaller but still there. Someone books a chest drain for the morning.","prompt":"Does he need that drain?","hint":"Not if he is breathing and there is no infection. The rest of the water will move.","guideline":"A remaining effusion after a successful dialysis is observed if the breathing is easy. Drain infection or a lung that is still trapped and failing.","answer":"No drain","kind":"choice","successFinding":"Observed","successStatus":"Breathing. No drain.","missYou":"Not that choice","miss":"Not if he is breathing and there is no infection. The rest of the water will move.","choices":[{"id":"no","label":"No drain. He is breathing. Repeat the film if he worsens","verdict":"correct","feedback":"The machine was the treatment. A drain now adds a hole and no benefit.","spo2":95,"finding":"Drain avoided","status":"Better after dialysis."},{"id":"yes","label":"Drain it because any remaining white is a failure","verdict":"wrong","feedback":"White that is shrinking, in a comfortable patient, is not an indication."},{"id":"fluid","label":"Replace the two litres you removed","verdict":"wrong","feedback":"You removed them on purpose. Putting them back recreates the effusion."},{"id":"stop","label":"Stop future dialysis. One session fixed him","verdict":"wrong","feedback":"He missed sessions because he needs them. Book the next one."}]},{"id":"c6","skill":"Reassessment","title":"Potassium is 4.6 and he can lie flatter","lead":"Dialysis is finished. Oxygen is 4 litres and the saturation is 96 percent. The film is clearer but not normal. He feels better.","prompt":"Is the residual white area a drain?","hint":"No. It was overload. It is shrinking. A drain is for a pleural problem that dialysis will not clear, which this is not.","guideline":"Missed-dialysis edema is treated by dialysis. A chest drain into leftover fluid is an injury.","answer":"No chest drain","kind":"choice","successFinding":"Drain avoided again","successStatus":"Better after dialysis. No drain.","missYou":"Not that decision","miss":"No. It was overload. It is shrinking. A drain is for a pleural problem that dialysis will not clear, which this is not.","choices":[{"id":"ok","label":"Leave the pleura alone","verdict":"correct","feedback":"The white area is the tail of the fluid you just removed from the blood.","finding":"Drain avoided again","status":"Better after dialysis. No drain."},{"id":"w0","label":"A chest drain, because the film is not perfect","verdi ow hemoglobin. Routine transfusion to normal is volume he may not tolerate and iron the next dialysis has to consider.","answer":"No transfusion for his usual hemoglobin","kind":"choice","successFinding":"Transfusion avoided","successStatus":"Comfortable. Usual hemoglobin.","missYou":"Not that decision","miss":"Not for a usual hemoglobin of 9 in a man who is now comfortable. Transfusion is for symptoms or a true drop, not for a round number.","choices":[{"id":"ok","label":"Do not transfuse a usual hemoglobin of 9","verdict":"correct","feedback":"He is comfortable. Two units is overload looking for a reason.","finding":"Transfusion avoided","status":"Comfortable. Usual hemoglobin."},{"id":"w0","label":"Two units, to reach 11","verdict":"wrong","feedback":"11 is not his physiology."},{"id":"w1","label":"A diuretic and a transfusion together, to be clever","verdict":"wrong","feedback":"You do not need either for this number."},{"id":"w2","label":"Stop erythropoietin forever","verdict":"wrong","feedback":"That is a clinic decision, not a punishment for an admission."}]},{"id":"c9","skill":"Reassessment","title":"His drugs from home","lead":"The bag contains an ACE inhibitor, a potassium salt substitute, and his phosphate binders.","prompt":"What do you hold today?","hint":"Hold the ACE inhibitor and the salt substitute until the potassium plan is clear. Keep the binders if he is eating. Do not add spironolactone.","guideline":"The admission was overload and missed dialysis. Drugs that raise potassium are held until he is safely back in his schedule.","answer":"Hold the ACE inhibitor and the salt substitute","kind":"choice","successFinding":"Potassium drugs held","successStatus":"Back on the dialysis schedule.","missYou":"Not that decision","miss":"Hold the ACE inhibitor and the salt substitute until the potassium plan is clear. Keep the binders if he is eating. Do not add spironolactone.","choices":[{"id":"ok","label":"Hold the ACE inhibitor and the salt substitute. Do d":"w2","label":"A chest drain to do before he leaves","verdict":"wrong","feedback":"The indication was never there."}]}]},{"id":"variceal","title":"Variceal bleeding","syndrome":"Known cirrhosis, vomiting blood","minutes":"14 min","difficulty":"Core","available":true,"summary":"The endoscope shows columns of varices. Restrict the transfusion, give terlipressin and an antibiotic, and band them.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/varices-wale.jpg","patient":"Hematemesis, known cirrhosis","ageSex":"52-year-old man","chart":["Teaching case. Not a prescription.","Hemoglobin 6.8 g/dL. Drowsy, vomiting blood. No fever. Systolic pressure 88."],"opening":{"lkwMin":20,"status":"Drowsy, vomiting blood.","sbp":88,"dbp":54,"hr":124,"rr":24,"spo2":94,"glucose":108,"gcs":"E3 V4 M6"},"stages":[{"id":"first","skill":"Action","title":"What comes before the picture?","lead":"He is vomiting blood and he is drowsy. The endoscopy room is being opened.","prompt":"What do you do first?","hint":"Protect the airway if he cannot, two lines of access, and do not pour in crystalloid as if it were blood.","guideline":"Massive upper gastrointestinal bleeding with a falling conscious level needs an airway. Blood is transfused to a restrictive target, about 7 to 8 g/dL, not toward 10.","answer":"Airway and access","kind":"choice","successFinding":"Airway assessed","successStatus":"Access in. Calling for blood.","missYou":"Not that choice","miss":"Protect the airway if he cannot, two lines of access, and do not pour in crystalloid as if it were blood.","choices":[{"id":"air","label":"Assess the airway, two large cannulae, and a restrictive transfusion plan","verdict":"correct","feedback":"If he keeps vomiting and stays drowsy, intubate before the endoscope. Transfuse because 6.8 is under the trigger. Do not aim at 10.","finding":"Airway and access","status":"Blood requested. Endoscopy being opened."},{"id":"cryst","label":"Two litres of saline and no blood","verdict":"wrong","feedback":"Saline does not carry oxygen and it can raise the portal pressure. He needs blood, carefully.","critical":true},{"id":"hb10","label":"Transfuse until the hemoglobin is 10, then scope tomorrow","verdict":"wrong","feedback":"A target near 10 worsens portal hypertension. And tomorrow is another bleed."},{"id":"ng","label":"A nasogastric lavage as the only treatment","verdict":"wrong","feedback":"Lavage is not hemostasis."}]},{"id":"click","skill":"Localization","title":"Click the varix","lead":"The lumen is filled by columns of mucosa that bulge inward. There is a little fresh blood.","prompt":"Click a varix.","hint":"The varices are the bulging columns, not the black corner outside the scope.","guideline":"Esophageal varices are banded. The drug and the antibiotic start before the band, and they do not replace it.","answer":"Esophageal varix","image":{"src":"sim/cases/varices-wale.jpg","alt":"Endoscopy. Columns of esophageal varices.","caption":"Variceal columns."},"kind":"hotspot","successFinding":"Varices","successStatus":"Varices","missYou":"Clicked outside the lumen","miss":"Stay on the bulging columns inside the esophagus.","regions":[{"id":"v","verdict":"correct","cx":0.5,"cy":0.58,"rx":0.28,"ry":0.24,"you":"Varix","feedback":"Those bulging columns are varices."},{"id":"out","verdict":"wrong","cx":0.06,"cy":0.08,"rx":0.05,"ry":0.05,"you":"Outside the picture","feedback":"That corner is not the mucosa. Click a column."}]},{"id":"name","skill":"Interpretation","title":"Name the bleed","lead":"Known cirrhosis, hematemesis, and these columns.","prompt":"What is bleeding?","hint":"Varices. Not a duodenal ulcer, until a full look says otherwise. The bundle is still the variceal bundle.","guideline":"Terlipressin, an antibiotic, and band ligation. Octreotide is the alternative if terlipressin is unavailable. A proton-pump infusion does not replace banding.","answer":"Variceal hemorrhage","kind":"choice","successFinding":"Varices","successStatus":"Bundle starting.","missYou":"Not that choice","miss":"Varices. Not a duodenal ulcer, until a full look says otherwise. The bundle is still the variceal bundle.","choices":[{"id":"var","label":"Esophageal varices","verdict":"correct","feedback":"Start the bundle and band. Do not wait for the band to start the drug and the antibiotic.","finding":"Variceal bleed","status":"Terlipressin and an antibiotic being drawn."},{"id":"ulcer","label":"A clean duodenal ulcer. Oral omeprazole and home","verdict":"wrong","feedback":"The columns are varices, he is shocked, and home is not a destination.","critical":true},{"id":"mw","label":"A Mallory-Weiss tear. No drug, no scope","verdict":"wrong","feedback":"You are looking at varices. A tear is a different lesion, and he still needs endoscopy."},{"id":"nose","label":"Swallowed nosebleed","verdict":"wrong","feedback":"The lesion is in the esophagus."}],"image":{"src":"sim/cases/varices-wale.jpg","alt":"Name the bleed","caption":"Name the bleed"}},{"id":"bundle","skill":"Decision","title":"Set the bundle","lead":"The airway is protected. Hemoglobin is 6.8. The endoscopist is scrubbing.","prompt":"What do you give?","hint":"Terlipressin, ceftriaxone, restrictive blood, then bands.","guideline":"Terlipressin 2 mg intravenously, then 1 to 2 mg every four to six hours. Ceftriaxone 1 g daily. Band the varix. Do not aim the hemoglobin at 10.","answer":"Terlipressin, ceftriaxone, banding","kind":"choice","successFinding":"Bundle running","successStatus":"Being banded.","missYou":"Not that choice","miss":"Terlipressin, ceftriaxone, restrictive blood, then bands.","choices":[{"id":"all","label":"Terlipressin, ceftriaxone, transfuse toward 7 to 8, and band","verdict":"correct","feedback":"That is the first-day bundle. A balloon is not the first endoscope.","sbp":100,"finding":"Variceal bundle","status":"Banding. Drugs running."},{"id":"ppi","label":"A proton-pump infusion only, no band, no vasoactive drug","verdict":"wrong","feedback":"A proton-pump drug does not close a varix. He needs the bundle."},{"id":"ten","label":"Transfuse to a hemoglobin of 10 before anyone scopes","verdict":"wrong","feedback":"Over-transfusion raises portal pressure and rebleeding."},{"id":"scl","label":"Surgical shunt tonight, no endoscopy","verdict":"wrong","feedback":"Endoscopic banding is first. A shunt or TIPS is for the failure of endoscopy, not the opening move."}]},{"id":"re","skill":"Reassessment","title":"He rebleeds at twelve hours","lead":"Bands are on. He vomits blood again and the pressure falls to 80.","prompt":"What is the bridge?","hint":"A balloon tamponade tube as a bridge to a repeat endoscopy or to TIPS. Not a splenectomy on the ward.","guideline":"Balloon tamponade controls bleeding for a short time so a definitive procedure can happen. It is not a treatment you leave in for a day. Airway protection is mandatory.","answer":"Balloon as a bridge","kind":"choice","successFinding":"Balloon planned","successStatus":"Airway protected. Bridge to TIPS.","missYou":"Not that choice","miss":"A balloon tamponade tube as a bridge to a repeat endoscopy or to TIPS. Not a splenectomy on the ward.","choices":[{"id":"ball","label":"Protect the airway and place a balloon as a bridge to TIPS or a senior relook","verdict":"correct","feedback":"The balloon is temporary. Someone who can do TIPS, or a very experienced relook, is the destination.","sbp":84,"gcs":"E2 V1 M5","finding":"Balloon bridge","status":"Airway secured. Balloon as a bridge."},{"id":"home","label":"More terlipressin only, and the ward","verdict":"wrong","feedback":"He is bleeding again at a pressure of 80. The ward is the wrong room.","critical":true},{"id":"splen","label":"Immediate splenectomy","verdict":"wrong","feedback":"Splenectomy is not the rescue for esophageal varices."},{"id":"hb","label":"Transfuse to 12 so the bands hold","verdict":"wrong","feedback":"A high hemoglobin target makes portal bleeding worse."}]},{"id":"c6","skill":"Reassessment","title":"The balloon is up and the airway is a tube","lead":"Bleeding has slowed. The balloon is a bridge. Systolic pressure is 96. Hemoglobin is 7.4 after a unit.","prompt":"How long is the bridge?","hint":"Hours, to endoscopy or TIPS. Not a day as the treatment. Do not transfuse toward 12.","guideline":"A balloon tamponade is temporary because the esophagus will not tolerate it. Definitive therapy is the next senior endoscopy or a TIPS. The hemoglobin target stays near 7 to 8.","answer":"Bridge only. Keep the hemoglobin near 7 to 8","kind":"choice","successFinding":"Balloon is a bridge","successStatus":"Airway secured. Awaiting definitive therapy.","missYou":"Not that decision","miss":"Hours, to endoscopy or TIPS. Not a day as the treatment. Do not transfuse toward 12.","choices":[{"id":"ok","label":"Get him to TIPS or a senior endoscopy. Do not leave the balloon as the treatment, and do not transfuse to 12","verdict":"correct","feedback":"The balloon buys a short time. A hemoglobin of 12 buys another bleed.","finding":"Balloon is a bridge","status":"Airway secured. Awaiting definitive therapy."},{"id":"w0","label":"Leave the balloon inflated until tomorrow evening","verdict":"wrong","feedback":"That is how the esophagus dies."},{"id":"w1","label":"Transfuse to a hemoglobin of 12 so the balloon can come down","verdict":"wrong","feedback":"The restrictive target does not change because a balloon is up.","critical":true},{"id":"w2","label":"Pull the tube out so he can talk","verdict":"wrong","feedback":"He re-bled into a threatened airway. The tube stays until the bleed is controlled."}]},{"id":"c7","skill":"Reassessment","title":"Terlipressin and the antibiotic","lead":"The balloon is in. Someone stops terlipressin and ceftriaxone because the device is doing the work.","prompt":"Do the drugs stop?","hint":"No. Terlipressin and ceftriaxone continue. The balloon does not replace them.","guideline":"The variceal bundle is a drug, an antibiotic, and a definitive endoscopic or radiological plan. A balloon is only a bridge on top of that.","answer":"Continue terlipressin and ceftriaxone","kind":"choice","successFinding":"Bundle continued","successStatus":"Drugs running. Balloon temporary.","missYou":"Not that decision","miss":"No. Terlipressin and ceftriaxone continue. The balloon does not replace them.","choices":[{"id":"ok","label":"Keep terlipressin and ceftriaxone","verdict":"correct","feedback":"Stopping the drugs because plastic is in the esophagus misses why the drugs were started.","finding":"Bundle continued","status":"Drugs running. Balloon temporary."},{"id":"w0","label":"Stop both drugs. The balloon is enough","verdict":"wrong","feedback":"The balloon is the least definitive part."},{"id":"w1","label":"Add a proton-pump infusion and stop the terlipressin","verdict":"wrong","feedback":"This bleed was varices, not a peptic spot."},{"id":"w2","label":"A beta blocker tonight while the systolic pressure is 96","verdict":"wrong","feedback":"A beta blocker in an acute bleed with a soft pressure is harmful."}]},{"id":"c8","skill":"Reassessment","title":"It is time to deflate and do the definitive procedure","lead":"The team is ready for TIPS or repeat endoscopy. The balloon has been up for the bridge, not for a shift.","prompt":"What do you do with the balloon?","hint":"Deflate it for the procedure, with the airway still protected. Do not forget it. Do not send him to the ward first.","guideline":"The balloon comes down when the definitive therapy is happening, in a place that can put it back or finish the bleed. The airway stays protected.","answer":"Deflate for the procedure. Airway stays","kind":"choice","successFinding":"Definitive therapy","successStatus":"Airway still protected.","missYou":"Not that decision","miss":"Deflate it for the procedure, with the airway still protected. Do not forget it. Do not send him to the ward first.","choices":[{"id":"ok","label":"Take the balloon down in the procedure, with the tube still in","verdict":"correct","feedback":"A forgotten inflated balloon is an esophageal injury. A premature extubation is an airway injury.","finding":"Definitive therapy","status":"Airway still protected."},{"id":"w0","label":"Extubate, then deflate on the ward","verdict":"wrong","feedback":"Both the airway and the bleed are unprotected.","critical":true},{"id":"w1","label":"Leave it up through the TIPS","verdict":"wrong","feedback":"The procedure needs the balloon down, and the mucosa needs the balloon gone."},{"id":"w2","label":"Deflate and go for a coffee. He will be fine","verdict":"wrong","feedback":"Someone who can reinflate or stent stays in the room."}]},{"id":"c9","skill":"Reassessment","title":"The bleed is controlled. He is still drowsy","lead":"TIPS is done. There is no active blood. He is drowsy, which he was at the start. Ammonia is not back. The tube is still in.","prompt":"What do you add for the drowsiness?","hint":"Lactulose once the gut can take it, and look for other reasons he is drowsy. Do not extubate to give the lactulose. Do not start a beta blocker yet.","guideline":"Encephalopathy after a variceal bleed is treated with lactulose and with treating the bleed, which you have. A beta blocker waits until the pressure is reliably safe.","answer":"Lactulose when the gut works. No beta blocker tonight","kind":"choice","successFinding":"Lactulose planned","successStatus":"Bleed controlled. Still intubated.","missYou":"Not that decision","miss":"Lactulose once the gut can take it, and look for other reasons he is drowsy. Do not extubate to give the lactulose. Do not start a beta blocker yet.","choices":[{"id":"ok","label":"Give lactulose when it is safe to put it in the gut. Do not start a beta blocker tonight","verdict":"correct","feedback":"The pressure is only just acceptable. A beta blocker is for later, outpatient, not for this hour.","finding":"Lactulose planned","status":"Bleed controlled. Still intubated."},{"id":"w0","label":"Intravenous beta blocker now that the TIPS is in","verdict":"wrong","feedback":"He has just been in shock from bleeding."},{"id":"w1","label":"Extubate so he can drink lactulose","verdict":"wrong","feedback":"Drowsy and just bridged from a bleed is not an extubation."},{"id":"w2","label":"Neomycin as the only drug, and no lactulose","verdict":"wrong","feedback":"Lactulose is the drug you have a reason to use."}]},{"id":"c10","skill":"Reassessment","title":"The next day there is no blood","lead":"Hemoglobin is 8 and stable. Pressure is 116. He is waking. The antibiotic course for the bleed is not finished.","prompt":"What do you stop, and what do you keep?","hint":"Keep the antibiotic for its short course. Keep a restrictive transfusion threshold. Feed when it is safe. Do not restart a beta blocker until discharge planning says the pressure will stand it.","guideline":"After endoscopic or TIPS control, the antibiotic is a short course, feeding is early, and non-selective beta blockade is reintroduced only when he is stable and no longer acutely bleeding.","answer":"Finish the short antibiotic. Feed when safe. Beta blocker later","kind":"choice","successFinding":"Stabilised","successStatus":"No rebleeding. Waking.","missYou":"Not that decision","miss":"Keep the antibiotic for its short course. Keep a restrictive transfusion threshold. Feed when it is safe. Do not restart a beta blocker until discharge planning says the pressure will stand it.","choices":[{"id":"ok","label":"Finish the antibiotic course, feed him when safe, and leave the beta blocker for a stable day","verdict":"correct","feedback":"The emergency bundle unwinds in order. It does not all stop because the vomit has stopped.","finding":"Stabilised","status":"No rebleeding. Waking."},{"id":"w0","label":"Stop the antibiotic at one dose","verdict":"wrong","feedback":"The infection prophylaxis is a short course, not one dose."},{"id":"w1","label":"Transfuse to 12 now that he is stable","verdict":"wrong","feedback":"Stable is when a high hemoglobin does the most harm."},{"id":"w2","label":"A month of terlipressin","verdict":"wrong","feedback":"Terlipressin is for the acute bleed, for days, not a month."}]}]},{"id":"malaria","title":"Severe malaria","syndrome":"A ring and a schizont","minutes":"14 min","difficulty":"Core","available":true,"summary":"Fever after travel. The sugar is 48 mg/dL. The film has parasites. The drug is artesunate.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/malaria.jpg","patient":"Fever, confusion, returned from a malaria area","ageSex":"34-year-old man","chart":["Teaching case. Not a prescription.","Glucose 48 mg/dL. Hemoglobin 7.2 g/dL. Lactate 5. No rash. Systolic pressure 86."],"opening":{"lkwMin":20,"status":"Febrile, confused, shocked.","sbp":86,"dbp":50,"hr":122,"rr":28,"spo2":94,"glucose":48,"gcs":"E3 V4 M5"},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at?","lead":"The glucose is already low. Treat that while the smear is made. Do not wait for a laboratory report to give sugar.","prompt":"Which study makes the diagnosis?","hint":"A blood film. Give dextrose now, in parallel.","guideline":"Severe malaria is a positive film plus a severity criterion: shock, low sugar, low hemoglobin, coma, lactate, or a high parasite count. Artesunate is the drug.","answer":"Blood film, and dextrose now","kind":"choice","successFinding":"Film and sugar","successStatus":"Dextrose running. Film on the microscope.","missYou":"Not that choice","miss":"A blood film. Give dextrose now, in parallel.","choices":[{"id":"film","label":"Blood film now, and intravenous dextrose for the glucose of 48","verdict":"correct","feedback":"Do not wait for the smear to treat the sugar. Do not wait for the sugar to make the smear.","glucose":110,"finding":"Film and dextrose","status":"Sugar corrected. Looking at the film."},{"id":"ct","label":"CT of the head first, no film, no sugar","verdict":"wrong","feedback":"Coma in a returning traveler with a glucose of 48 is sugar and malaria until proved otherwise. CT delays both."},{"id":"abx","label":"Antibiotics only, no film","verdict":"wrong","feedback":"Antibiotics do not kill Plasmodium. You still need the film, and you still need artesunate if it is positive."},{"id":"wait","label":"Observe the fever curve until tomorrow","verdict":"wrong","feedback":"Shock, coma, and a glucose of 48 do not wait.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the parasite","lead":"Most cells are empty. One cell near the lower middle is packed with a purple schizont. Rings sit off to the right.","prompt":"Click a malaria parasite.","hint":"The dense purple cluster inside a red cell is a schizont. The smaller rings are parasites too.","guideline":"Falciparum can hide, so one film does not exclude it. A visible schizont means the infection is serious. Artesunate is intravenous.","answer":"Malaria parasite","image":{"src":"sim/cases/malaria.jpg","alt":"Blood film. A schizont and ring forms.","caption":"Parasites inside red cells."},"kind":"hotspot","successFinding":"Film positive","successStatus":"Film positive","missYou":"Clicked an empty red cell","miss":"Empty cells are the pale discs. The parasite is the purple structure inside a cell. The large one is a schizont.","regions":[{"id":"sch","verdict":"correct","cx":0.58,"cy":0.63,"rx":0.08,"ry":0.08,"you":"Schizont","feedback":"That packed purple cell is a schizont."},{"id":"ring","verdict":"correct","cx":0.86,"cy":0.55,"rx":0.07,"ry":0.08,"you":"Ring form","feedback":"Those small rings are parasites too."},{"id":"empty","verdict":"wrong","cx":0.2,"cy":0.3,"rx":0.06,"ry":0.06,"you":"An empty red cell","feedback":"That disc has no parasite. Look for the purple chromatin."}]},{"id":"name","skill":"Interpretation","title":"Name the emergency","lead":"Shock, low sugar, anemia, and parasites on the film.","prompt":"How severe is this?","hint":"Severe malaria. Not uncomplicated fever.","guideline":"Intravenous artesunate is 2.4 mg/kg at 0, 12, and 24 hours, then daily until he can take oral treatment. Quinine is the alternative only if artesunate is truly unavailable. Steroids are not used.","answer":"Severe falciparum malaria","kind":"choice","successFinding":"Severe malaria","successStatus":"Artesunate next.","missYou":"Not that choice","miss":"Severe malaria. Not uncomplicated fever.","choices":[{"id":"sev","label":"Severe malaria","verdict":"correct","feedback":"More than one severity criterion, and a positive film. Intravenous artesunate.","finding":"Severe malaria","status":"Artesunate being prepared."},{"id":"mild","label":"Uncomplicated malaria. Oral drug and home","verdict":"wrong","feedback":"He is shocked and he was hypoglycemic. This is severe. Home is unsafe.","critical":true},{"id":"bac","label":"Bacterial sepsis only. The purple dots are stain debris","verdict":"wrong","feedback":"A schizont is not debris. Bacteria may coexist, but they do not replace artesunate."},{"id":"den","label":"Dengue. No antimalarial","verdict":"wrong","feedback":"Dengue does not put a schizont in a red cell."}],"image":{"src":"sim/cases/malaria.jpg","alt":"Name the emergency","caption":"Name the emergency"}},{"id":"drug","skill":"Decision","title":"Which drug?","lead":"Artesunate is in the cupboard. Quinine is too. He can have either, and someone suggests a steroid for the brain.","prompt":"What do you give?","hint":"Artesunate. Dextrose you have already started. No steroid.","guideline":"Artesunate is preferred over quinine. Do not use a steroid. Watch the glucose again. A bacterial antibiotic is added only if you also suspect a bacterial infection, and it does not replace artesunate.","answer":"Intravenous artesunate","kind":"choice","successFinding":"Artesunate given","successStatus":"First dose in.","missYou":"Not that choice","miss":"Artesunate. Dextrose you have already started. No steroid.","choices":[{"id":"art","label":"Intravenous artesunate 2.4 mg/kg. No steroid","verdict":"correct","feedback":"Dose at 0, 12, and 24 hours. Recheck the glucose. Do not add dexamethasone.","finding":"Artesunate","status":"First dose running."},{"id":"quin","label":"Quinine, because it is what you remember, and artesunate is in the cupboard","verdict":"wrong","feedback":"If artesunate is available it is the better drug. Do not choose the older one out of habit."},{"id":"ster","label":"Dexamethasone for cerebral malaria","verdict":"wrong","feedback":"Steroids harm cerebral malaria. They are not adjuncts.","critical":true},{"id":"oral","label":"Oral artemether-lumefantrine only, and the ward","verdict":"wrong","feedback":"He is in shock. Severe malaria is intravenous until he can reliably swallow and the severity has settled."}]},{"id":"hour","skill":"Reassessment","title":"Twelve hours later the parasite count is higher","lead":"He is warmer. Glucose is 110. The laboratory says the parasite count has risen since the first dose.","prompt":"Do you stop artesunate?","hint":"No. Counts often rise early as parasites leave the tissues. Continue the schedule.","guideline":"Do not switch off artesunate because the twelve-hour count rose. Give the scheduled dose. Keep checking glucose. Oral treatment comes only when he can take it and the severity has gone.","answer":"Continue artesunate","kind":"choice","successFinding":"Dose continued","successStatus":"Still intravenous.","missYou":"Not that choice","miss":"No. Counts often rise early as parasites leave the tissues. Continue the schedule.","choices":[{"id":"go","label":"Give the twelve-hour dose. A rising early count is expected","verdict":"correct","feedback":"Stay on the schedule. Recheck the sugar and the lactate. Do not declare failure at twelve hours.","finding":"Artesunate continued","status":"On schedule."},{"id":"stop","label":"Stop artesunate. It has failed","verdict":"wrong","feedback":"An early rise is not failure. Stopping leaves him untreated.","critical":true},{"id":"ster","label":"Add a steroid because the count rose","verdict":"wrong","feedback":"A steroid is not salvage therapy in malaria."},{"id":"oral","label":"Switch to oral now, while he is still on a vasopressor","verdict":"wrong","feedback":"He is not ready for oral treatment. Finish the intravenous schedule."}]},{"id":"c6","skill":"Reassessment","title":"It is the 24-hour dose","lead":"He has had artesunate at 0 and 12 hours. Glucose is being checked. He is still in the ICU but the pressure is better. The parasite count has not been repeated yet.","prompt":"Do you give the 24-hour dose?","hint":"Yes. Artesunate at 0, 12, and 24 hours. Do not switch to oral yet. Do not add a steroid.","guideline":"Intravenous artesunate is given at 0, 12, and 24 hours in severe malaria, then daily until he can take oral treatment. A steroid does not help cerebral malaria.","answer":"Give the 24-hour artesunate","kind":"choice","successFinding":"Artesunate at 24 hours","successStatus":"Still intravenous. Pressure better.","missYou":"Not that decision","miss":"Yes. Artesunate at 0, 12, and 24 hours. Do not switch to oral yet. Do not add a steroid.","choices":[{"id":"ok","label":"Give intravenous artesunate. No steroid. Not oral yet","verdict":"correct","feedback":"He is not eating reliably and he was in shock. The intravenous course is not finished.","finding":"Artesunate at 24 hours","status":"Still intravenous. Pressure better."},{"id":"w0","label":"Oral artemether-lumefantrine only, from now","verdict":"wrong","feedback":"Oral treatment waits until he is clearly well enough."},{"id":"w1","label":"Dexamethasone for the brain","verdict":"wrong","feedback":"Steroids worsen cerebral malaria.","critical":true},{"id":"w2","label":"Stop. The 12-hour count was higher, so it failed","verdict":"wrong","feedback":"An early rise is not failure. You already kept going. Keep going."}]},{"id":"c7","skill":"Reassessment","title":"The glucose is 60 mg/dL again","lead":"He is drowsy. The fingerstick is 60 mg/dL. Artesunate is due and is not the cause you skip.","prompt":"What runs with the antimalarial?","hint":"Dextrose, and the artesunate. Do not hold the antimalarial for the sugar.","guideline":"Hypoglycemia is part of severe malaria. Correct it and continue artesunate. Quinine is more likely to cause hypoglycemia. You are not using it as the first drug.","answer":"Dextrose and artesunate","kind":"choice","successFinding":"Glucose corrected","successStatus":"Drowsy from sugar, not from stopping the drug.","missYou":"Not that decision","miss":"Dextrose, and the artesunate. Do not hold the antimalarial for the sugar.","choices":[{"id":"ok","label":"Intravenous dextrose, and give the artesunate","verdict":"correct","feedback":"Both are treatments. Neither replaces the other.","finding":"Glucose corrected","status":"Drowsy from sugar, not from stopping the drug.","glucose":110},{"id":"w0","label":"Hold artesunate until he eats","verdict":"wrong","feedback":"The sugar is a drip, not a reason to delay the drug."},{"id":"w1","label":"Insulin, in case this is diabetes","verdict":"wrong","feedback":"The glucose is 60."},{"id":"w2","label":"Steroid, because steroids raise glucose","verdict":"wrong","feedback":"They also worsen this infection.","critical":true}]},{"id":"c8","skill":"Reassessment","title":"Hemoglobin is 6.4 g/dL","lead":"He is more breathless. Hemoglobin has fallen from 7.2 to 6.4. There is no hematuria story you can see, and the bleed is not variceal. He is still on artesunate.","prompt":"What do you transfuse, and what do you not stop?","hint":"Transfuse if he is symptomatic. Do not stop artesunate. Do not give a steroid for the fall.","guideline":"Anemia in severe malaria is transfused on symptoms and the number, with a threshold around 7 in many units, lower if he is symptomatic. The antimalarial continues. This fall on day 1 is the disease, not a reason to declare the drug a failure.","answer":"Transfuse and continue artesunate","kind":"choice","successFinding":"Transfused","successStatus":"Breathless. Artesunate continued.","missYou":"Not that decision","miss":"Transfuse if he is symptomatic. Do not stop artesunate. Do not give a steroid for the fall.","choices":[{"id":"ok","label":"Transfuse him. Do not stop artesunate and do not add a steroid","verdict":"correct","feedback":"The drug is still the treatment of the parasite that caused the anemia.","finding":"Transfused","status":"Breathless. Artesunate continued."},{"id":"w0","label":"Stop artesunate. It has hemolysed the blood","verdict":"wrong","feedback":"Hemolysis is the malaria. A later artesunate-related hemolysis is a different day. Do not stop the emergency course now.","critical":true},{"id":"w1","label":"Platelets, although you have not been told they are low","verdict":"wrong","feedback":"Do not treat a number you do not have."},{"id":"w2","label":"No transfusion. 6.4 is fine in a breathless man","verdict":"wrong","feedback":"Breathless at 6.4 is a reason to transfuse."}]},{"id":"c9","skill":"Reassessment","title":"He is still shocked, and you wonder about bacteria","lead":"The film showed parasites. Systolic pressure is 90 on a low-dose vasopressor. A bacterial bloodstream infection has not been excluded.","prompt":"Do you add an antibiotic?","hint":"Yes, while he is in shock, and you do not stop the artesunate. The antibiotic is not instead of the antimalarial.","guideline":"Severe malaria and bacterial sepsis can sit together. Artesunate stays. An antibacterial is reasonable while he is shocked. It is not a substitute.","answer":"Antibiotic plus artesunate","kind":"choice","successFinding":"Antibiotic added","successStatus":"Shocked. Both infections covered.","missYou":"Not that decision","miss":"Yes, while he is in shock, and you do not stop the artesunate. The antibiotic is not instead of the antimalarial.","choices":[{"id":"ok","label":"Add an antibacterial and keep the artesunate","verdict":"correct","feedback":"Choosing one kingdom of organism is how the other one kills him.","finding":"Antibiotic added","status":"Shocked. Both infections covered."},{"id":"w0","label":"Stop artesunate and give only ceftriaxone","verdict":"wrong","feedback":"The parasites are on the film.","critical":true},{"id":"w1","label":"No antibiotic ever. Malaria explains everything","verdict":"wrong","feedback":"Shock can be both. Cover the bacterium while you are unsure."},{"id":"w2","label":"Antifungal, because he is in the ICU","verdict":"wrong","feedback":"There is no fungal clue."}]},{"id":"c10","skill":"Reassessment","title":"He is eating and the pressure is normal","lead":"Day 3. He is eating. The parasite count is falling. Vasopressor is off. He has had at least the three intravenous doses.","prompt":"What do you switch to?","hint":"A full oral artemisinin combination course. Not one tablet. Not home in the same hour without the tablets in his hand.","guideline":"After at least 24 hours of intravenous artesunate and clinical improvement, a full oral course finishes the treatment. Stopping at the intravenous doses allows recrudescence.","answer":"A full oral course","kind":"choice","successFinding":"Oral course started","successStatus":"Eating. Parasites falling.","missYou":"Not that decision","miss":"A full oral artemisinin combination course. Not one tablet. Not home in the same hour without the tablets in his hand.","choices":[{"id":"ok","label":"Start a full oral combination. Do not stop at the injections","verdict":"correct","feedback":"The intravenous drug saved him. The oral course stops the relapse.","finding":"Oral course started","status":"Eating. Parasites falling."},{"id":"w0","label":"No oral drug. Three injections are a course","verdict":"wrong","feedback":"They are the start."},{"id":"w1","label":"One oral dose and the bus","verdict":"wrong","feedback":"A partial course is a recurrence."},{"id":"w2","label":"Quinine for six weeks, because it feels thorough","verdict":"wrong","feedback":"Finish with the oral combination that matches the artesunate you started."}]}]},{"id":"ttp","title":"Thrombotic thrombocytopenic purpura","syndrome":"Fragments on the film","minutes":"14 min","difficulty":"Core","available":true,"summary":"Platelets of 11, confusion, and a fever. The film has broken red cells. Plasma exchange now. Do not transfuse platelets.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/schist.jpg","patient":"Confusion, fever, a bruise, and dark urine","ageSex":"41-year-old woman","chart":["Teaching case. Not a prescription.","Platelets 11 \u00d7 10\u2079/L. Hemoglobin 8.1 g/dL. Creatinine 2.8 mg/dL. Fever. No heparin exposure."],"opening":{"lkwMin":20,"status":"Confused, febrile.","sbp":128,"dbp":78,"hr":110,"rr":20,"spo2":97,"glucose":104,"gcs":"E3 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at tonight?","lead":"The count is already 11. You need the red-cell shape, and you must not wait a day for a send-away test before treating.","prompt":"Which study do you read tonight?","hint":"The blood film. ADAMTS13 is sent, and it does not delay plasma exchange.","guideline":"TTP is a clinical diagnosis: microangiopathic hemolysis, thrombocytopenia, and organ injury. Plasma exchange starts before the ADAMTS13 returns.","answer":"Blood film","kind":"choice","successFinding":"Film made","successStatus":"The smear is on the microscope.","missYou":"Not that choice","miss":"The blood film. ADAMTS13 is sent, and it does not delay plasma exchange.","choices":[{"id":"film","label":"Blood film tonight. Send ADAMTS13, but do not wait for it","verdict":"correct","feedback":"The film is tonight's study. The special test confirms later.","finding":"Blood film","status":"Film on the screen."},{"id":"wait","label":"Wait for ADAMTS13 before any treatment","verdict":"wrong","feedback":"The result takes days. She will clot her organs while you wait.","critical":true},{"id":"bmb","label":"Bone marrow tonight, before a film","verdict":"wrong","feedback":"The marrow is not the emergency test. The film is."},{"id":"plt","label":"Platelet transfusion first, so the count looks safer, then think","verdict":"wrong","feedback":"Platelets feed the thrombi in TTP. They are not a comfort measure.","critical":true}]},{"id":"click","skill":"Localization","title":"Click a fragmented red cell","lead":"Most cells are round. Scattered among them are helmets and broken fragments.","prompt":"Click a schistocyte.","hint":"Look for a fragmented cell or a helmet, not a smooth round disc and not the scale mark in the corner.","guideline":"Schistocytes mean mechanical shearing. With a platelet count of 11 and confusion, that is a microangiopathy, and TTP is the one you must not miss.","answer":"Schistocyte","image":{"src":"sim/cases/schist.jpg","alt":"Blood film with fragmented red cells.","caption":"Fragmented red cells."},"kind":"hotspot","successFinding":"Schistocytes","successStatus":"Schistocytes","missYou":"Clicked away from the fragments","miss":"A schistocyte is a broken or helmet-shaped cell. The smooth round discs are normal red cells. The ink in the corner is a scale, not a cell.","regions":[{"id":"frag","verdict":"correct","cx":0.46,"cy":0.48,"rx":0.2,"ry":0.18,"you":"Fragmented red cells","feedback":"That field contains helmets and broken cells. Those are schistocytes."},{"id":"scale","verdict":"wrong","cx":0.9,"cy":0.95,"rx":0.08,"ry":0.04,"you":"The scale mark","feedback":"That is a printed scale, not a cell."}]},{"id":"name","skill":"Interpretation","title":"Name the emergency","lead":"Fragments, platelets of 11, confusion, fever, and a rising creatinine.","prompt":"What is the working diagnosis?","hint":"TTP. Plasma exchange. Not ITP, and not a platelet transfusion.","guideline":"Start plasma exchange the hour you think of TTP. Caplacizumab and steroids are additions. Platelets are contraindicated unless there is life-threatening bleeding.","answer":"TTP","kind":"choice","successFinding":"TTP","successStatus":"Exchange being arranged.","missYou":"Not that choice","miss":"TTP. Plasma exchange. Not ITP, and not a platelet transfusion.","choices":[{"id":"ttp","label":"Thrombotic thrombocytopenic purpura","verdict":"correct","feedback":"Do not wait for the confirmatory test. Call for plasma exchange.","finding":"TTP","status":"Plasma exchange requested."},{"id":"itp","label":"Immune thrombocytopenia. Platelets and a steroid, no exchange","verdict":"wrong","feedback":"Immune thrombocytopenia does not break the red cells and does not raise the creatinine like this. Platelets here are harmful.","critical":true},{"id":"dic","label":"DIC from sepsis, so only an antibiotic","verdict":"wrong","feedback":"There is no septic focus in the story, and DIC is not treated by ignoring plasma exchange when the picture is TTP. If you truly think TTP, exchange."},{"id":"hh","label":"Hypothyroidism","verdict":"wrong","feedback":"Nothing on the film is a thyroid test."}],"image":{"src":"sim/cases/schist.jpg","alt":"Name the emergency","caption":"Name the emergency"}},{"id":"rx","skill":"Decision","title":"The line is difficult","lead":"The count is 11. The operator wants a platelet transfusion 'to cover the dialysis catheter.' There is no bleeding.","prompt":"What do you say?","hint":"No platelets. Experienced hands, and exchange. A little steroid can accompany the exchange. Platelets cannot.","guideline":"Platelet transfusion in TTP is associated with deterioration. Place the line with the best operator you have. Do not 'cover' it with platelets when she is not bleeding.","answer":"Plasma exchange, no platelets","kind":"choice","successFinding":"Exchange started","successStatus":"No platelet transfusion.","missYou":"Not that choice","miss":"No platelets. Experienced hands, and exchange. A little steroid can accompany the exchange. Platelets cannot.","choices":[{"id":"pex","label":"Plasma exchange now. No platelet transfusion","verdict":"correct","feedback":"The line goes in carefully. The treatment is plasma, not platelets.","finding":"Plasma exchange without platelets","status":"Exchange running."},{"id":"plt","label":"One pool of platelets, then exchange","verdict":"wrong","feedback":"Those platelets join the microvascular thrombi. She can seize or worsen.","critical":true},{"id":"ster","label":"A steroid only, review on Monday","verdict":"wrong","feedback":"A steroid may be added. It is not a substitute for exchange, and Monday is too late.","critical":true},{"id":"hep","label":"Heparin, because there are clots","verdict":"wrong","feedback":"Heparin is not the treatment of TTP, and it is the wrong instinct when the count is 11."}]},{"id":"am","skill":"Reassessment","title":"The next morning the platelets are 18","lead":"She is a little clearer. One exchange is done. The count only moved from 11 to 18. Someone stops exchange because 'it did not work.'","prompt":"What do you do?","hint":"Continue daily exchange. The count lags. Do not transfuse.","guideline":"Exchange continues daily until the platelet count is recovering and the story is settling. A single disappointing number is not failure, and it is not a reason for a platelet transfusion.","answer":"Continue exchange","kind":"choice","successFinding":"Exchange continues","successStatus":"Still no platelets transfused.","missYou":"Not that choice","miss":"Continue daily exchange. The count lags. Do not transfuse.","choices":[{"id":"go","label":"Continue daily plasma exchange. Do not transfuse platelets","verdict":"correct","feedback":"Response takes more than one session. Send the ADAMTS13 if it is not already gone, and do not stop.","finding":"Exchange continued","status":"Daily exchange."},{"id":"stop","label":"Stop. One session should have normalized the count","verdict":"wrong","feedback":"That expectation is wrong. Stopping now is how the thrombi return.","critical":true},{"id":"plt","label":"Transfuse up to 50 so the number looks better","verdict":"wrong","feedback":"The number is not the goal of a transfusion. Platelets are still dangerous.","critical":true},{"id":"once","label":"One more exchange next week","verdict":"wrong","feedback":"The schedule is daily, not weekly, while she is acute."}]},{"id":"c6","skill":"Reassessment","title":"Platelets are 18 after one exchange","lead":"She has had one plasma exchange. Platelets have moved from 11 to 18. She is still confused. A colleague calls the exchange a failure.","prompt":"Is it a failure?","hint":"No. Continue daily exchange. Do not transfuse platelets to speed the count.","guideline":"Response is judged over days, not after one session. Platelets are still withheld unless there is life-threatening bleeding.","answer":"Continue daily exchange. No platelets","kind":"choice","successFinding":"Exchange continued","successStatus":"One exchange is not a failure.","missYou":"Not that decision","miss":"No. Continue daily exchange. Do not transfuse platelets to speed the count.","choices":[{"id":"ok","label":"Daily plasma exchange continues. Do not transfuse platelets","verdict":"correct","feedback":"18 is not recovered, and it is not a reason to stop.","finding":"Exchange continued","status":"One exchange is not a failure."},{"id":"w0","label":"Platelet transfusion so the count looks kinder","verdict":"wrong","feedback":"Platelets feed the thrombi.","critical":true},{"id":"w1","label":"Stop exchange. Try steroids alone","verdict":"wrong","feedback":"Steroids do not replace plasma exchange."},{"id":"w2","label":"Heparin, because the clots are the disease","verdict":"wrong","feedback":"The clots are platelet thrombi. Heparin is not the treatment."}]},{"id":"c7","skill":"Reassessment","title":"ADAMTS13 is still pending","lead":"The sample was sent. The result is not back. She is booked for today's exchange. Someone wants to wait.","prompt":"Do you wait?","hint":"No. The exchange happens today. The result confirms. It does not start the treatment.","guideline":"TTP is treated on the clinical picture. A low ADAMTS13 supports the diagnosis when it arrives. Waiting is how organs die.","answer":"Exchange today. Do not wait for the result","kind":"choice","successFinding":"Exchange not delayed","successStatus":"Pending result. Exchange proceeding.","missYou":"Not that decision","miss":"No. The exchange happens today. The result confirms. It does not start the treatment.","choices":[{"id":"ok","label":"Do today's exchange. The blood test does not have to be back","verdict":"correct","feedback":"You already decided this on the film and the counts. Do not undecide it.","finding":"Exchange not delayed","status":"Pending result. Exchange proceeding."},{"id":"w0","label":"Hold exchange until the result","verdict":"wrong","feedback":"That wait is the harm.","critical":true},{"id":"w1","label":"Cancel the diagnosis if the result is delayed","verdict":"wrong","feedback":"A delayed assay is not a negative assay."},{"id":"w2","label":"Bone marrow today instead of exchange","verdict":"wrong","feedback":"The marrow is not the emergency."}]},{"id":"c8","skill":"Reassessment","title":"The result comes back very low","lead":"ADAMTS13 activity is reported very low. She is on daily exchange. Platelets are 25. LDH is still high.","prompt":"What changes?","hint":"Nothing that stops the exchange. The result confirms you were right. Rituximab or caplacizumab is a specialist addition, not a substitute, and not a reason to pause today.","guidelin
