 mg running.","sbp":118,"hr":78},{"id":"bleed","label":"Terlipressin 2 mg every 4 hours, because that is the variceal dose, and no albumin","verdict":"wrong","feedback":"The bleed dose is not how this starts, and albumin is part of the regimen."},{"id":"loop","label":"Furosemide to force the urine","verdict":"wrong","feedback":"A diuretic is what you stopped. It is not the treatment."},{"id":"hd","label":"Hemodialysis now, and leave the terlipressin in the cupboard","verdict":"wrong","feedback":"Dialysis is for a rescue indication. It is not a substitute for the vasoconstrictor on the first day."}]},{"id":"next","skill":"Reassessment","title":"The next morning the creatinine is 3.0","lead":"It has not halved. His fingers are warm. The pressure is 118.","prompt":"What do you do?","hint":"Continue. One day is not failure. Stop if the digits go ischemic.","guideline":"A response is judged over days, not overnight. Ischemia of the fingers or gut is a reason to stop. Dopamine is not added.","answer":"Continue while the circulation tolerates it","kind":"choice","successFinding":"Continued","successStatus":"Warm fingers. Dose unchanged this morning.","missYou":"Not that change","miss":"Continue if the fingers are warm. Do not double it every hour, and do not add dopamine.","choices":[{"id":"stay","label":"Continue. A one-day creatinine is not failure. Stop if the fingers become ischemic.","verdict":"correct","feedback":"The regimen needs time. Ischemia is the stop signal, not a single morning number.","finding":"Terlipressin continued","status":"Warm fingers. Still on 1 mg."},{"id":"hour","label":"Double the dose every hour until the hands are mottled","verdict":"wrong","feedback":"Mottled fingers are ischemia. That is a reason to stop, not a target.","critical":true},{"id":"dopa","label":"Add dopamine","verdict":"wrong","feedback":"Dopamine is still not the drug."},{"id":"pcn","label":"Nephrostomy, because the number did not halve overnight","verdict":"wrong","feedback":" title":"The pressure is 80 and blood is running","lead":"The chest film had rib fractures and no large pneumothorax. The pelvis was clinically stable. He is still pale. The abdomen is now tender.","prompt":"Where do you look besides the chest?","hint":"The abdomen and the pelvis again. Blood continues. Do not place a chest drain into a lung that is up. Do not give more crystalloid as the resuscitation.","guideline":"Unexplained hypotension after rib fractures is bleeding in the chest, the abdomen, or the pelvis until proven otherwise. A normal first chest film does not close the abdomen.","answer":"Look at the abdomen and pelvis. Keep giving blood","kind":"choice","successFinding":"Other cavities checked","successStatus":"Blood running. Abdomen now tender.","missYou":"Not that decision","miss":"The abdomen and the pelvis again. Blood continues. Do not place a chest drain into a lung that is up. Do not give more crystalloid as the resuscitation.","choices":[{"id":"ok","label":"Blood, and examine the abdomen and pelvis. No chest drain for a lung that is up","verdict":"correct","feedback":"The circle on the film is not the only place a crash can bleed.","finding":"Other cavities checked","status":"Blood running. Abdomen now tender."},{"id":"w0","label":"Another two litres of saline","verdict":"wrong","feedback":"He is bleeding. Saline is not blood.","critical":true},{"id":"w1","label":"Bilateral chest drains","verdict":"wrong","feedback":"There is still no pneumothorax."},{"id":"w2","label":"A ward bed. The film explained it","verdict":"wrong","feedback":"A pressure of 80 is not explained by a bruise."}]},{"id":"c7","skill":"Reassessment","title":"The pelvis is still clinically stable. FAST shows free fluid","lead":"A bedside ultrasound shows free fluid in the abdomen. Pressure is 82 on blood. The chest drain question remains negative.","prompt":"Where does he go?","hint":"To an operating room or to a CT only if the pressure allows. Do not pause the blood for a long scan while he is unstable. Tranexamic acid is already in if you gave it in the first hour.","guideline":"Free fluid and persistent shock is a surgical abdomen until proved otherwise. Imaging is for the patient whose pressure allows it.","answer":"Operating room if he stays unstable","kind":"choice","successFinding":"Surgical abdomen","successStatus":"Free fluid. Still shocked.","missYou":"Not that decision","miss":"To an operating room or to a CT only if the pressure allows. Do not pause the blood for a long scan while he is unstable. Tranexamic acid is already in if you gave it in the first hour.","choices":[{"id":"ok","label":"Take him to theatre if the pressure will not hold. Do not delay blood for a slow scan","verdict":"correct","feedback":"The ultrasound has named a cavity. Unstable patients bleed in the operating room, not in the scanner.","finding":"Surgical abdomen","status":"Free fluid. Still shocked."},{"id":"w0","label":"CT before any more blood, however low the pressure","verdict":"wrong","feedback":"The scan does not resuscitate.","critical":true},{"id":"w1","label":"Observation. Free fluid can be a little urine","verdict":"wrong","feedback":"With a pressure of 82 it is blood until the surgeon says otherwise."},{"id":"w2","label":"A chest drain as well, for completeness","verdict":"wrong","feedback":"Completeness is not an indication."}]},{"id":"c8","skill":"Reassessment","title":"Theatre stops the abdominal bleeding","lead":"The abdomen is closed. Pressure is 110. He is intubated. The ribs still hurt on the story, and he will need to breathe.","prompt":"What do you plan for the ribs?","hint":"Analgesia so he can breathe, including a regional block if it is available later. Not a prophylactic chest drain. Not rib fixation tonight.","guideline":"Rib-fracture pain causes shallow breathing and pneumonia. Analgesia is the treatment. Fixation and drains are for specific indications he does not currently have.","answer":"Analgesia. No prophylactic drain. No fixation tonight","kind":"choice","successFinding":"Analgesia planned","successStatus":"Bleeding stopped. Ribs still the pain.","missYou":"Not that decision","miss":"Analgesia so he can breathe, including a regional block if it is available later. Not a prophylactic chest drain. Not rib fixation tonight.","choices":[{"id":"ok","label":"Good analgesia. Do not put a drain in, and do not fix the ribs tonight","verdict":"correct","feedback":"The operation treated the cavity that was bleeding. The ribs need him to breathe.","finding":"Analgesia planned","status":"Bleeding stopped. Ribs still the pain."},{"id":"w0","label":"Prophylactic chest drains on both sides","verdict":"wrong","feedback":"The lungs were up."},{"id":"w1","label":"No analgesia. Pain is a useful sign","verdict":"wrong","feedback":"Pain is how he stops breathing."},{"id":"w2","label":"Extubate in the corridor before analgesia exists","verdict":"wrong","feedback":"He needs a plan for the pain before the tube comes out."}]},{"id":"c9","skill":"Reassessment","title":"Six hours later he is stable","lead":"No vasopressor. Hemoglobin is stable. The drains from theatre are quiet. Calcium was checked after the transfusion.","prompt":"When does clot prophylaxis start?","hint":"Not in the bleeding hour. Once the surgeon agrees the bleeding has stopped, prophylaxis can be discussed. Not a treatment dose.","guideline":"Venous-clot prophylaxis after trauma waits until bleeding is controlled. A treatment dose in a fresh laparotomy is a return to theatre.","answer":"Prophylaxis only after bleeding is clearly finished","kind":"choice","successFinding":"Prophylaxis deferred","successStatus":"Stable. Bleeding stopped.","missYou":"Not that decision","miss":"Not in the bleeding hour. Once the surgeon agrees the bleeding has stopped, prophylaxis can be discussed. Not a treatment dose.","choices":[{"id":"ok","label":"Do not start heparin now. Ask again when the bleeding has clearly stopped","verdict":"correct","feedback":"The first hours are for clot in the right places, which is the wounds.","finding":"Prophylaxis deferred","status":"Stable. Bleeding stopped."},{"id":"w0","label":"Treatment-dose heparin tonight","verdict":"wrong","feedback":"He has just had a laparotomy for bleeding.","critical":true},{"id":"w1","label":"Nothing for two weeks, however stable","verdict":"wrong","feedback":"A stable patient needs a daily decision, not a two-week ban written in stone."},{"id":"w2","label":"A vena cava filter as a routine","verdict":"wrong","feedback":"A filter is not routine trauma care."}]},{"id":"c10","skill":"Reassessment","title":"He is ready to leave the resuscitation bay","lead":"Extubated, analgesia working, hemoglobin stable, chest clear, abdomen soft.","prompt":"What is the destination?","hint":"A monitored surgical bed. Not home. Chest physiotherapy and a warning about delayed pneumothorax. No antibiotic for the bruises.","guideline":"Multiple rib fractures after a bleed are observed. Delayed pneumothorax is why the chest is watched. Bruises do not need antibiotics.","answer":"Monitored bed. No antibiotic for bruises","kind":"choice","successFinding":"Stepped to a surgical bed","successStatus":"Stable. Ribs observed.","missYou":"Not that decision","miss":"A monitored surgical bed. Not home. Chest physiotherapy and a warning about delayed pneumothorax. No antibiotic for the bruises.","choices":[{"id":"ok","label":"A monitored surgical bed. Watch the chest. No antibiotic for bruises","verdict":"correct","feedback":"The emergency is over. The ribs can still declare a pneumothorax tomorrow.","finding":"Stepped to a surgical bed","status":"Stable. Ribs observed."},{"id":"w0","label":"Home tonight","verdict":"wrong","feedback":"He bled and has multiple ribs."},{"id":"w1","label":"A week of antibiotics for the seatbelt mark","verdict":"wrong","feedback":"A bruise is not an infection."},{"id":"w2","label":"A chest drain before he leaves the bay, to be safe","verdict":"wrong","feedback":"There is still no pneumothorax."}]}]},{"id":"pelvis","title":"Open pelvic ring","syndrome":"Pelvic hemorrhage","minutes":"14 min","difficulty":"Core","available":true,"summary":"A fall from height. The pelvis is unstable and the pressure is falling. The film shows an open symphysis. Binder and blood now.","queued":"","clockLabel":"Time from injury","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/pelvis.jpg","patient":"Unstable pelvis after a fall","ageSex":"45-year-old man","chart":["Teaching case. Not a prescription.","About forty minutes from the fall. Weight 75 kg. No chest wound. The pelvis moves when it should not."],"opening":{"lkwMin":45,"status":"Pale. Pelvis unstable.","sbp":78,"dbp":48,"hr":132,"rr":26,"spo2":96,"glucose":136,"gcs":"E3 V4 M6"},"stages":[{"id":"bind","skill":"Resuscitation","title":"Before the radiograph is a souvenir","lead":"The pressure is 78 and the pelvis feels open. You are inside three hours.","prompt":"What do you do now?","hint":"A binder over the greater trochanters, blood, and tranexamic acid. Do not log-roll him.","guideline":"An open pelvic ring is bound at the trochanters, not at the iliac crests, and not after a tour of the scanner. Tranexamic acid 1 g is given within 3 hours. Blood, not crystalloid.","answer":"Binder, blood, and tranexamic acid","kind":"choice","successFinding":"Binder on","successStatus":"Binder at the trochanters. Blood running.","missYou":"Not that first act","miss":"Bind the pelvis, give blood and tranexamic acid, and do not roll him to look at the back.","choices":[{"id":"binder","label":"Pelvic binder over the greater trochanters, blood, and tranexamic acid 1 g. No log roll.","verdict":"correct","feedback":"The binder closes the ring. The blood replaces what the ring is losing.","finding":"Binder and blood","status":"Binder on. Transfusing."},{"id":"roll","label":"Two litres of saline and a log roll to inspect the back","verdict":"wrong","feedback":"A log roll opens the clot. Saline is not blood.","critical":true},{"id":"chest","label":"A chest drain, because every trauma film is a pneumothorax","verdict":"wrong","feedback":"You have not been shown a pneumothorax. The unstable bone is the pelvis."},{"id":"ct","label":"CT before the binder, while the pressure is 78","verdict":"wrong","feedback":"He does not travel unbound and untransfused.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the open symphysis","lead":"Anteroposterior pelvis. The pubic symphysis in the midline is wide. No side marker is printed.","prompt":"Click the widened pubic symphysis.","hint":"The gap is in the midline, between the pubic bones, at the level of the obturator foramina.","guideline":"An open-book injury widens the pubic symphysis. The hip joint is not the ring injury.","answer":"Widened pubic symphysis","image":{"src":"sim/cases/pelvis.jpg","alt":"Anteroposterior pelvis. The pubic symphysis is widened.","caption":"Widened pubic symphysis. No side marker is printed."},"kind":"hotspot","successFinding":"Open symphysis","successStatus":"The ring is open at the front.","missYou":"Not the symphysis","miss":"The opening is the midline gap between the pubic bones. A femoral head is not the symphysis.","regions":[{"id":"sym","verdict":"correct","cx":0.5,"cy":0.7,"rx":0.055,"ry":0.06,"you":"Widened pubic symphysis","feedback":"That midline gap is the open symphysis."},{"id":"hip","verdict":"wrong","cx":0.22,"cy":0.74,"rx":0.08,"ry":0.07,"you":"Femoral head","feedback":"That is the hip, not the front of the pelvic ring."}]},{"id":"name","skill":"Diagnosis","title":"Name the injury","lead":"The binder is on. The film shows the front of the ring is open.","prompt":"What is bleeding?","hint":"An open pelvic ring. The blood is in the pelvis until you have proved another cavity.","guideline":"Open-book disruption bleeds from the sacral veins and the fracture surfaces. It is not a rib fracture and not a hip replacement problem.","answer":"Open pelvic ring","kind":"choice","successFinding":"Open pelvic ring","successStatus":"Hemorrhage control being called.","missYou":"Not that injury","miss":"This is an open pelvic ring. It is not a rib fracture and not arthritis.","choices":[{"id":"open","label":"Open-book pelvic ring. The bleeding is pelvic until proved otherwise.","verdict":"correct","feedback":"The film and the examination say the same thing.","finding":"Open pelvic ring","status":"Still hypotensive in the binder."},{"id":"rib","label":"A single rib fracture. Analgesia and the ward.","verdict":"wrong","feedback":"This film is a pelvis, and the pressure is 78.","critical":true},{"id":"oa","label":"Hip osteoarthritis. Physiotherapy.","verdict":"wrong","feedback":"The hip is not the acute finding, and physiotherapy is not a resuscitation."},{"id":"gas","label":"A normal symphysis. The gap is bowel gas.","verdict":"wrong","feedback":"The gap is between the pubic bones. It is the injury."}]},{"id":"still","skill":"Hemorrhage","title":"The binder is on and the pressure is still 80","lead":"Blood is running. The binder has not been removed.","prompt":"What is the next control?","hint":"Interventional radiology or preperitoneal packing. Do not take the binder off.","guideline":"If the pressure stays down after a binder and blood, the pelvis needs procedural hemostasis: embolisation or packing. Removing the binder to look is how the clot falls off.","answer":"Embolisation or packing, binder stays","kind":"choice","successFinding":"Hemostasis","successStatus":"Binder left on. Procedural hemostasis activated.","missYou":"Not that next step","miss":"Keep the binder on and stop the bleeding in the suite or the theatre. Do not switch to more saline.","choices":[{"id":"ir","label":"Keep the binder on. Activate embolisation or preperitoneal packing, with blood still running.","verdict":"correct","feedback":"The binder is a splint, not the last step, when the pressure stays down.","finding":"Procedural hemostasis","status":"Binder stays. Suite being opened.","sbp":84},{"id":"off","label":"Remove the binder so the skin can be examined","verdict":"wrong","feedback":"Taking the binder off reopens the veins.","critical":true},{"id":"salt","label":"More crystalloid, and stop the blood","verdict":"wrong","feedback":"He is still bleeding. Crystalloid does not clot."},{"id":"fascia","label":"Fasciotomy of the thigh as the first act","verdict":"wrong","feedback":"A thigh compartment is not the open symphysis. The pelvis is the bleeding cavity."}]},{"id":"better","skill":"Reassessment","title":"The pressure comes up after packing","lead":"He is 104 systolic. The binder is still on. Several units have gone in.","prompt":"What do you protect in the next hour?","hint":"Leave the binder. Check calcium if the transfusion is large. Do not anticoagulate. Plan fixation with the surgeons.","guideline":"A large transfusion lowers ionized calcium. The binder stays until fixation. Early anticoagulation reopens the pelvis.","answer":"Binder stays, check calcium, plan fixation","kind":"choice","successFinding":"Stabilised","successStatus":"Binder on. Calcium checked. Surgeons planning fixation.","missYou":"Not that next hour","miss":"Leave the binder. Replace calcium if it is low. Do not start heparin in the first hour.","choices":[{"id":"stay","label":"Leave the binder, check ionized calcium, and plan fixation. No heparin in this hour.","verdict":"correct","feedback":"The clot is new. Fixation is the surgeons' next act, not a prophylactic anticoagulant.","finding":"Binder left in place","status":"Pressure held. Fixation planned.","sbp":104,"hr":100},{"id":"hep","label":"Prophylactic heparin now, in the first hour","verdict":"wrong","feedback":"The ring has just been bleeding. Heparin is not the first-hour drug."},{"id":"off","label":"Take the binder off because the pressure rose","verdict":"wrong","feedback":"The pressure rose because the ring was closed. Opening it is the experiment you do not run."},{"id":"party","label":"A litre of saline to celebrate","verdict":"wrong","feedback":"He has had blood. A celebration litre is not a treatment."}]},{"id":"c6","skill":"Reassessment","title":"The transfusion is large","lead":"He has had several units. The binder is on. Pressure is 100 after packing. Ionized calcium has not been checked.","prompt":"What do you check?","hint":"Ionized calcium, and replace it if it is low. Do not give a huge blind calcium infusion, and do not take the binder off to check the skin.","guideline":"Citrate in blood products binds calcium. A low ionized calcium is replaced. The binder stays.","answer":"Check ionized calcium. Binder stays","kind":"choice","successFinding":"Calcium checked","successStatus":"Packed. Binder on.","missYou":"Not that decision","miss":"Ionized calcium, and replace it if it is low. Do not give a huge blind calcium infusion, and do not take the binder off to check the skin.","choices":[{"id":"ok","label":"Check the ionized calcium and replace it if it is low. Leave the binder","verdict":"correct","feedback":"The blood that saved him can lower the calcium. Look, then replace.","finding":"Calcium checked","status":"Packed. Binder on."},{"id":"w0","label":"Take the binder off to inspect, and skip the calcium","verdict":"wrong","feedback":"The binder is why the pressure is 100.","critical":true},{"id":"w1","label":"A large calcium infusion with no level, repeated until the vein burns","verdict":"wrong","feedback":"Replace a low level. Do not invent a toxic one."},{"id":"w2","label":"Stop the blood because calcium is a worry","verdict":"wrong","feedback":"If he is still short of blood, he needs blood and calcium, not neither."}]},{"id":"c7","skill":"Reassessment","title":"The CT scanner is free","lead":"Pressure is 108. He is in the binder. The radiographers ask for the binder off so the pictures are prettier.","prompt":"Does the binder come off?","hint":"No. Scan in the binder if the pressure is acceptable. If the pressure is not acceptable he does not go to the scanner at all.","guideline":"A pelvic binder stays on for imaging. Removing it for a prettier picture reopens the ring.","answer":"Scan in the binder, or do not scan","kind":"choice","successFinding":"Binder left on for imaging","successStatus":"Pressure acceptable. Binder undisturbed.","missYou":"Not that decision","miss":"No. Scan in the binder if the pressure is acceptable. If the pressure is not acceptable he does not go to the scanner at all.","choices":[{"id":"ok","label":"Leave the binder on. The scan can see through it","verdict":"correct","feedback":"Pretty pictures are not worth an open ring.","finding":"Binder left on for imaging","status":"Pressure acceptable. Binder undisturbed."},{"id":"w0","label":"Binder off for the scan","verdict":"wrong","feedback":"That is how the pressure falls in the corridor.","critical":true},{"id":"w1","label":"Log roll onto the scanner","verdict":"wrong","feedback":"You do not log roll an open pelvis."},{"id":"w2","label":"Skip calcium, the scanner is waiting","verdict":"wrong","feedback":"The scanner waits for a safe patient."}]},{"id":"c8","skill":"Reassessment","title":"The pictures show the open ring and no new chest bleed","lead":"Arterial blush is a question for the interventional team. Packing has already been done and the pressure is holding.","prompt":"What do you not remove?","hint":"The binder. Embolisation, if still required, happens with the binder on. Do not start heparin.","guideline":"Ongoing arterial bleeding after packing may need embolisation. Nothing about that request includes removing the binder or anticoagulating him.","answer":"Binder stays. No heparin","kind":"choice","successFinding":"Binder remains","successStatus":"Ring still open on the film. Pressure held.","missYou":"Not that decision","miss":"The binder. Embolisation, if still required, happens with the binder on. Do not start heparin.","choices":[{"id":"ok","label":"Keep the binder. Do not anticoagulate. Embolise only if he is still bleeding","verdict":"correct","feedback":"A held pressure after packing is observed. A falling pressure is embolisation or more surgery. Neither starts with a naked pelvis.","finding":"Binder remains","status":"Ring still open on the film. Pressure held."},{"id":"w0","label":"Heparin so the blush does not clot the wrong way","verdict":"wrong","feedback":"Heparin is how the blush gets bigger."},{"id":"w1","label":"Binder off. The picture is taken","verdict":"wrong","feedback":"The picture is not the treatment."},{"id":"w2","label":"Remove the packs on the scanner table","verdict":"wrong","feedback":"Packs come out in an operating room, on purpose."}]},{"id":"c9","skill":"Reassessment","title":"He is cold","lead":"Temperature is 35 degrees. Pressure is 112. The binder is on. Coagulation has not been repeated.","prompt":"What do you correct?","hint":"Warm him. Repeat a coagulation test and correct it if it is abnormal. Do not take the binder off to warm the skin with a bath.","guideline":"Trauma hypothermia worsens bleeding. Warming and a coagulation check are the next resuscitation. Exposure is for injuries you have not looked at, not for a bath.","answer":"Warm him. Check coagulation","kind":"choice","successFinding":"Warmed","successStatus":"Pressure held. Cold.","missYou":"Not that decision","miss":"Warm him. Repeat a coagulation test and correct it if it is abnormal. Do not take the binder off to warm the skin with a bath.","choices":[{"id":"ok","label":"Warm him and check the coagulation. Binder stays","verdict":"correct","feedback":"A cold bleeding patient clots badly. Warmth is a drug.","finding":"Warmed","status":"Pressure held. Cold."},{"id":"w0","label":"A cold saline infusion to match the temperature","verdict":"wrong","feedback":"Warm the fluids."},{"id":"w1","label":"Binder off in a warm bath","verdict":"wrong","feedback":"The ring opens in the bath."},{"id":"w2","label":"Heparin to stop microvascular clot","verdict":"wrong","feedback":"He is cold and freshly packed. Heparin is the wrong clot."}]},{"id":"c10","skill":"Reassessment","title":"The morning pressure is stable","lead":"Warm, calcium normal, binder on, packs in, no vasopressor. The orthopaedic team is planning fixation.","prompt":"What stays until fixation?","hint":"The binder or an external frame. Not a prophylactic heparin infusion. Not a ward with no checks.","guideline":"The pelvis remains mechanically held until definitive fixation. Clot prophylaxis is a later surgical decision. The first morning is still a high-care morning.","answer":"Mechanical hold stays. No heparin infusion. High care","kind":"choice","successFinding":"Awaiting fixation","successStatus":"Stable. Binder or frame continues.","missYou":"Not that decision","miss":"The binder or an external frame. Not a prophylactic heparin infusion. Not a ward with no checks.","choices":[{"id":"ok","label":"Keep the pelvis held. Stay in high care. No heparin infusion this morning","verdict":"correct","feedback":"Stable is not the same as fixed.","finding":"Awaiting fixation","status":"Stable. Binder or frame continues."},{"id":"w0","label":"Binder off for the ward round photograph","verdict":"wrong","feedback":"The photograph can include the binder."},{"id":"w1","label":"Home in the binder","verdict":"wrong","feedback":"Packs and an open ring are not a home."},{"id":"w2","label":"Treatment-dose heparin, because he is lying still","verdict":"wrong","feedback":"He is lying still because of a bleed."}]}]},{"minutes":"14 min","difficulty":"Core","available":true,"queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"id":"dka","title":"Diabetic ketoacidosis","syndrome":"Ketones and potassium","summary":"Glucose 520 mg/dL, pH 7.08, and large ketones. Insulin starts only once the potassium is known, and it does not stop when the glucose falls.","thumb":"sim/cases/ketone.jpg","patient":"Vomiting, deep breathing, known diabetes","ageSex":"22-year-old woman","chart":["Teaching case. Not a prescription.","Glucose 520 mg/dL. Venous pH 7.08. Bicarbonate 8 mEq/L. Potassium 5.6 mEq/L. Sodium 128 mEq/L. Weight 70 kg."],"opening":{"lkwMin":40,"status":"Deep breathing. Dry mouth.","sbp":104,"dbp":64,"hr":124,"rr":32,"spo2":99,"glucose":520,"gcs":"E4 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"What do you settle before the insulin?","lead":"She is acidotic and dry. The glucose is already high. The number that decides whether insulin is safe is the potassium.","prompt":"What do you do first?","hint":"Fluid can start. Insulin waits until you have seen the potassium. It is 5.6, so it may start. Bicarbonate is not the first drug at this pH.","guideline":"Start fluid, measure ketones, gas, and potassium, and only then start a fixed-rate insulin infusion. Do not give bicarbonate for a pH of 7.08.","answer":"Fluid, ketones, gas, and the potassium","kind":"choice","successFinding":"Potassium known","successStatus":"Saline running. Potassium is 5.6.","missYou":"Not that order","miss":"Fluid and the potassium first. Insulin is next, not a bicarbonate infusion, and not a scan.","choices":[{"id":"labs","label":"A litre of 0.9% saline in the first hour, a ketone check, and a gas. Potassium is 5.6","verdict":"correct","feedback":"The potassium is high enough for insulin. The fluid starts now.","finding":"Potassium 5.6","status":"Saline running."},{"id":"push","label":"Insulin 10 units intravenous push before anyone checks the potassium","verdict":"wrong","feedback":"Insulin drives potassium into cells. You do not push it until the potassium is known.","critical":true},{"id":"bic","label":"Bicarbonate now, because she is breathing hard","verdict":"wrong","feedback":"This pH does not need bicarbonate. The insulin and the fluid close the gap."},{"id":"ct","label":"CT of the head first. No glucose, no insulin","verdict":"wrong","feedback":"The breathing is Kussmaul, not a primary brain injury. The glucose is 520."}]},{"id":"click","skill":"Localization","title":"Click the large ketones","lead":"The urine ketones are large. The scale runs from a pale negative pad to a dark pad at 16 mmol/L.","prompt":"Click the dark pad that means a large amount of ketones.","hint":"The darkest square, labelled 16. Not the pale square.","guideline":"Large ketones plus an anion-gap acidosis is diabetic ketoacidosis until you have proved otherwise. A negative pad would not fit this gas.","answer":"Dark pad, 16 mmol/L","image":{"src":"sim/cases/ketone.jpg","alt":"Ketone color scale from a pale negative pad to a dark pad at 16 mmol/L","caption":"Ketone color scale. The pale square is negative. The darkest square is 16 mmol/L."},"kind":"hotspot","successFinding":"Large ketones","successStatus":"Ketones are large.","missYou":"Not the large end of the scale","miss":"The darkest square is the large result. The pale square is negative.","regions":[{"id":"dark","verdict":"correct","cx":0.785,"cy":0.7,"rx":0.06,"ry":0.16,"you":"Dark pad, 16 mmol/L","feedback":"That is the large end of the scale. It matches a pH of 7.08."},{"id":"neg","verdict":"wrong","cx":0.105,"cy":0.7,"rx":0.055,"ry":0.16,"you":"The negative pad","feedback":"That pale square is a negative test. Her ketones are not negative."}]},{"id":"name","skill":"Diagnosis","title":"Name the emergency","lead":"Glucose 520 mg/dL, pH 7.08, bicarbonate 8, potassium 5.6, and large ketones.","prompt":"What is this?","hint":"Diabetic ketoacidosis. Not a hyperosmolar state with no ketones, and not a reason for thrombolysis.","guideline":"DKA is hyperglycemia, ketones, and a metabolic acidosis. Hyperosmolar state has little or no ketoacidosis and a higher osmolality.","answer":"Diabetic ketoacidosis","kind":"choice","successFinding":"Diabetic ketoacidosis","successStatus":"Fixed-rate insulin being prepared.","missYou":"Not that name","miss":"Diabetic ketoacidosis. The ketones and the pH are the point.","choices":[{"id":"dka","label":"Diabetic ketoacidosis","verdict":"correct","feedback":"Hyperglycemia, ketones, and acidosis. Potassium is 5.6, so insulin may start.","finding":"Diabetic ketoacidosis","status":"Insulin infusion next."},{"id":"hhs","label":"Hyperosmolar state. No ketones, so no insulin","verdict":"wrong","feedback":"The ketones are large and the pH is 7.08. This is not a ketone-free hyperosmolar state."},{"id":"sep","label":"Sepsis only. Antibiotics, and no insulin","verdict":"wrong","feedback":"Look for a trigger, but the acidosis still needs insulin and fluid."},{"id":"stroke","label":"A stroke. Thrombolysis for the deep breathing","verdict":"wrong","feedback":"Kussmaul breathing is the acidosis, not a hemispheric stroke.","critical":true}]},{"id":"rx","skill":"Treatment","title":"Set the infusion","lead":"Weight 70 kg. Potassium is still 5.6. pH is still 7.08. The first litre of saline is in.","prompt":"Which plan?","hint":"Fixed-rate intravenous insulin at 0.1 unit/kg/hour. No potassium in the bag while the serum potassium is 5.6. No bicarbonate at this pH.","guideline":"Insulin 0.1 unit/kg/hour intravenously. Add potassium only once the serum value is in the normal range and falling. Bicarbonate is not routine above a pH of about 6.9.","answer":"Insulin 0.1 unit/kg/hour","kind":"choice","successFinding":"Insulin infusion","successStatus":"7 units an hour running. Potassium still held.","missYou":"Not that regimen","miss":"0.1 unit/kg/hour intravenously. Hold potassium while the serum value is 5.6. Do not use bicarbonate as the treatment.","choices":[{"id":"inf","label":"Intravenous insulin at 0.1 unit/kg/hour. No potassium in the bag yet. No bicarbonate","verdict":"correct","feedback":"Seven units an hour for 70 kg. Potassium stays out of the bag while the serum value is 5.6.","finding":"Insulin 0.1 unit/kg/hour","status":"Infusion running.","hr":118,"rr":28},{"id":"ss","label":"A subcutaneous sliding scale, and breakfast","verdict":"wrong","feedback":"A sliding scale will not close this gap. She needs a fixed intravenous infusion.","critical":true},{"id":"bic","label":"Bicarbonate as the main infusion, and a little insulin later","verdict":"wrong","feedback":"Bicarbonate is not the treatment at pH 7.08. Insulin is."},{"id":"k","label":"Potassium in the first bag, because every case of ketoacidosis needs it before the number","verdict":"wrong","feedback":"The number is already 5.6. Adding potassium now can raise it further."}]},{"id":"later","skill":"Reassessment","title":"The glucose is 190. The gap is not closed","lead":"Two hours later the glucose is 190 mg/dL. pH is 7.18. Ketones are still large. Potassium has fallen to 3.0 mEq/L.","prompt":"What do you change?","hint":"Add dextrose, replace potassium, and pause the insulin until the potassium is at least 3.3. Do not stop the treatment of the ketones for good, and do not double the insulin on a potassium of 3.0.","guideline":"When the glucose falls near 200 mg/dL, add dextrose and keep treating the ketones. If the potassium is under 3.3, hold the insulin and replace potassium, then restart it. Stopping because the glucose looks better leaves the acidosis.","answer":"Dextrose, potassium, and a pause until 3.3","kind":"choice","successFinding":"Potassium replaced","successStatus":"Dextrose running. Insulin paused for the potassium.","missYou":"Not that change","miss":"Add dextrose. Replace potassium. Pause the insulin until the potassium is at least 3.3, then restart it. The ketones are still there.","choices":[{"id":"hold","label":"Add dextrose, replace potassium, and pause the insulin until the potassium is at least 3.3. Then restart it","verdict":"correct","feedback":"The glucose has fallen. The ketones have not. A :"Insulin restarted","status":"Potassium 3.6. Ketones still present."},{"id":"w0","label":"Wait until the glucose is 400 again","verdict":"wrong","feedback":"You would be recreating the admission."},{"id":"w1","label":"Restart insulin with no dextrose and no potassium","verdict":"wrong","feedback":"The glucose will crash and the potassium will fall.","critical":true},{"id":"w2","label":"No more insulin. The potassium is the only number that matters","verdict":"wrong","feedback":"The pH is 7.22."}]},{"id":"c7","skill":"Reassessment","title":"Glucose is 150. pH is 7.28. Ketones are still positive","lead":"She is on dextrose and insulin. She feels less breathless. A colleague stops the insulin because the glucose looks acceptable.","prompt":"Does the insulin stop?","hint":"No. Ketones are still there. The glucose is being held down by dextrose on purpose.","guideline":"Insulin stops only when the ketones have cleared and she is eating, and even then only after subcutaneous insulin overlaps. A pretty glucose is the dextrose working.","answer":"Continue insulin","kind":"choice","successFinding":"Insulin continued","successStatus":"Glucose held by dextrose. Ketones remain.","missYou":"Not that decision","miss":"No. Ketones are still there. The glucose is being held down by dextrose on purpose.","choices":[{"id":"ok","label":"Keep the insulin running. The glucose of 150 is not the end point","verdict":"correct","feedback":"Stopping now returns the ketoacidosis with a normal-looking sugar.","finding":"Insulin continued","status":"Glucose held by dextrose. Ketones remain."},{"id":"w0","label":"Stop the insulin. 150 is normal","verdict":"wrong","feedback":"150 on a dextrose infusion is the plan, not the cure.","critical":true},{"id":"w1","label":"Stop the dextrose and double the insulin","verdict":"wrong","feedback":"The ketones need insulin. The glucose needs the dextrose."},{"id":"w2","label":"Bicarbonate, because the pH is 7.28","verdict":"wrong","feedback":"7.28 does not need bicarbonate."}]},{"id":"c8","skill":"Reassessment","title":"She is hungry. Ketones have cleared. pH is 7.36","lead":"She wants food. Ketones are clear. pH is 7.36. Intravenous insulin is still running.","prompt":"How do you stop the infusion?","hint":"Give subcutaneous insulin, let it overlap for one to two hours, then stop the infusion. Do not stop the drip and hope.","guideline":"Stopping intravenous insulin without an overlap causes a gap and a return of ketones. She can eat. The subcutaneous dose has to be on board first.","answer":"Overlap subcutaneous insulin, then stop the drip","kind":"choice","successFinding":"Overlap started","successStatus":"Eating. Ketones clear.","missYou":"Not that decision","miss":"Give subcutaneous insulin, let it overlap for one to two hours, then stop the infusion. Do not stop the drip and hope.","choices":[{"id":"ok","label":"Subcutaneous insulin first, overlap one to two hours, then stop the infusion","verdict":"correct","feedback":"The drip is still the only insulin in her until the injection starts working.","finding":"Overlap started","status":"Eating. Ketones clear."},{"id":"w0","label":"Stop the drip and order lunch","verdict":"wrong","feedback":"Lunch is not insulin.","critical":true},{"id":"w1","label":"Keep the infusion for three more days although she is eating and the gap is closed","verdict":"wrong","feedback":"A closed gap and a meal is the time to overlap, not to live on a pump."},{"id":"w2","label":"Sliding scale only, after the drip stops, with a gap","verdict":"wrong","feedback":"A gap is the ketoacidosis coming back."}]},{"id":"c9","skill":"Reassessment","title":"Why did this happen?","lead":"She ran out of insulin two days ago. There is no cough, no abdominal pain, and no fever.","prompt":"What do you write as the cause?","hint":"Missed insulin. Do not invent an infection. Do not discharge her with no insulin supply.","guideline":"The precipitant is omitted insulin until you find another. Education and a supply of insulin are the discharge, not a lecture alone.","answer":"Missed insulin. Arrange a supply","kind":"choice","successFinding":"Cause identified","successStatus":"No infection. Insulin supply the issue.","missYou":"Not that decision","miss":"Missed insulin. Do not invent an infection. Do not discharge her with no insulin supply.","choices":[{"id":"ok","label":"Name the missed insulin and make sure she leaves with insulin","verdict":"correct","feedback":"A perfect infusion is wasted if she goes home to an empty pen.","finding":"Cause identified","status":"No infection. Insulin supply the issue."},{"id":"w0","label":"Antibiotics, because ketoacidosis is always pneumonia","verdict":"wrong","feedback":"There is no pneumonia."},{"id":"w1","label":"Discharge tonight with a prescription she cannot fill until Monday","verdict":"wrong","feedback":"The gap in the pen is the disease."},{"id":"w2","label":"Tell her to take less insulin so this hurts less","verdict":"wrong","feedback":"Less insulin is how this started."}]},{"id":"c10","skill":"Reassessment","title":"She is biochemically well","lead":"Eating, ketones negative, potassium normal, subcutaneous insulin working. She understands the sick-day rules.","prompt":"Can she go?","hint":"Yes, with insulin, a way to check glucose, and advice to return if she vomits. Not the same hour the drip stopped, if the overlap has not been watched.","guideline":"Discharge follows a successful overlap, a supply of insulin, and safety advice. It does not follow the first normal glucose.","answer":"Discharge after the overlap is proven","kind":"choice","successFinding":"Discharge plan","successStatus":"Well. Insulin in hand.","missYou":"Not that decision","miss":"Yes, with insulin, a way to check glucose, and advice to return if she vomits. Not the same hour the drip stopped, if the overlap has not been watched.","choices":[{"id":"ok","label":"Send her when the subcutaneous insulin has been shown to hold, with insulin and advice","verdict":"correct","feedback":"The last risk is the gap between the drip and the injection. Watch it, then let her go.","finding":"Discharge plan","status":"Well. Insulin in hand."},{"id":"w0","label":"Home the minute the drip is disconnected, before any subcutaneous dose","verdict":"wrong","feedback":"That is the gap.","critical":true},{"id":"w1","label":"Stay a week for safety although everything has resolved","verdict":"wrong","feedback":"A resolved, supplied, educated patient does not need a week."},{"id":"w2","label":"No meter. She can tell by how she feels","verdict":"wrong","feedback":"How she feels was late last time."}]}]},{"minutes":"14 min","difficulty":"Core","available":true,"queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"id":"dengue","title":"Dengue shock","syndrome":"Plasma leak","summary":"Fever has just fallen. The pulse pressure is 12. The hematocrit has risen. Fluid and a repeat hematocrit. Not a platelet transfusion, and not a steroid.","thumb":"sim/cases/dengue.jpg","patient":"Day five, fever gone, cold limbs","ageSex":"29-year-old man","chart":["Teaching case. Not a prescription.","Blood pressure 90/78. Hematocrit 48 percent, from 36 percent two days ago. Platelets 22 \u00d7 10\u2079/L. No melena. Weight 60 kg."],"opening":{"lkwMin":30,"status":"Cold limbs. Fever has just fallen.","sbp":90,"dbp":78,"hr":118,"rr":24,"spo2":97,"glucose":102,"gcs":"E4 V5 M6"},"stages":[{"id":"fluid","skill":"Resuscitation","title":"The pressure is narrow. What do you give?","lead":"Day five. The fever has gone and the limbs are cold. Pulse pressure is 12. Hematocrit has risen from 36 to 48 percent. Platelets are 22, and he is not bleeding.","prompt":"What is the first treatment?","hint":"Isotonic crystalloid, 10 to 20 mL/kg, and a hematocrit. Not platelets for the number. Not a steroid.","guideline":"Dengue shock is plasma leak in the critical phase. A rising hematocrit means leak, so the first fluid is crystalloid. Platelets are not a treatment for a low count without bleeding.","answer":"Crystalloid and a hematocrit","kind":"choice","successFinding":"Crystalloid started","successStatus":"First bolus in. Hematocrit to be repeated.","missYou":"Not that first treatment","miss":"Isotonic crystalloid, 10 to 20 mL/kg, and repeat the hematocrit. Do not open with platelets or a steroid.","choices":[{"id":"cry","label":"Isotonic crystalloid, 10 to 20 mL/kg, and repeat the hematocrit. No platelets","verdict":"correct","feedback":"The hematocrit has risen and he is not bleeding. Replace the leak, then look again.","finding":"Crystalloid bolus","status":"Bolus running.","sbp":96,"dbp":74},{"id":"plt","label":"Platelets until the count is over 50. No fluid plan","verdict":"wrong","feedback":"He is not bleeding. The rising hematocrit is leak, and platelets will not fill the vessels.","critical":true},{"id":"dex","label":"Dexamethasone for the shock","verdict":"wrong","feedback":"A steroid does not treat dengue leak."},{"id":"fast","label":"A litre of saline every hour until the platelets rise","verdict":"wrong","feedback":"The platelet count is not the tap you turn. Unmetered fluid will drown him in the recovery phase."}]},{"id":"click","skill":"Localization","title":"Click the rash","lead":"The skin is red, with pale islands. The sheet around him is not the finding.","prompt":"Click the rash.","hint":"Red skin with pale islands, on the abdomen or the arm. Not the white sheet.","guideline":"The rash supports dengue. It does not tell you the hematocrit, and it is not what you resuscitate.","answer":"Dengue rash","image":{"src":"sim/cases/dengue.jpg","alt":"Dengue rash. Red skin with pale islands on the abdomen and the arm","caption":"Dengue rash. Pale islands in red skin."},"kind":"hotspot","successFinding":"Dengue rash","successStatus":"Rash seen. The hematocrit is still the number that matters.","missYou":"Not the rash","miss":"The rash is the red skin with pale islands. The white sheet is not it.","regions":[{"id":"abd","verdict":"correct","cx":0.55,"cy":0.64,"rx":0.28,"ry":0.2,"you":"Rash on the abdomen","feedback":"Pale islands in red skin. That is the rash. It still does not replace the hematocrit."},{"id":"arm","verdict":"correct","cx":0.32,"cy":0.32,"rx":0.24,"ry":0.16,"you":"Rash on the arm","feedback":"The same rash is on the arm. Pale islands in red skin."},{"id":"sheet","verdict":"wrong","cx":0.08,"cy":0.94,"rx":0.07,"ry":0.04,"you":"The sheet","feedback":"That is the bedsheet. The rash is the red skin."}]},{"id":"name","skill":"Diagnosis","title":"Name the shock","lead":"Crystalloid is in. He is still cold. Hematocrit 48 percent. Platelets 22. No bleeding.","prompt":"What is this shock?","hint":"Dengue shock from plasma leak. Not malaria, and not a safe case to send home.","guideline":"Severe dengue in the critical phase leaks plasma. A narrow pulse pressure and a rising hematocrit are the picture. The rash is supportive, not the diagnosis you treat.","answer":"Dengue shock","kind":"choice","successFinding":"Dengue shock","successStatus":"Still in the critical phase.","missYou":"Not that name","miss":"Dengue shock. Leak, a narrow pulse pressure, and a rising hematocrit.","choices":[{"id":"den","label":"Dengue shock. Plasma leak","verdict":"correct","feedback":"The fever has fallen, the pulse pressure is narrow, and the hematocrit has risen.","finding":"Dengue shock","status":"Critical phase."},{"id":"mal","label":"Severe malaria. Artesunate, and no more fluid","verdict":"wrong","feedback":"There is no film of malaria here, and stopping fluid in a rising hematocrit leaves the leak."},{"id":"men","label":"Meningococcal sepsis. Antibiotics only, no fluid plan","verdict":"wrong","feedback":"Antibiotics do not replace the volume he is leaking."},{"id":"home","label":"Ordinary dengue. Paracetamol and . Do not give another bolus.","guideline":"In recovery, intravenous fluid is stopped once the pulse pressure and the perfusion have recovered. More fluid then causes overload. A diuretic is for overload once the pressure is stable, not another bolus.","answer":"Stop the fluid","kind":"choice","successFinding":"Fluid stopped","successStatus":"Drip off. Watching the breathing.","missYou":"Do not bolus again","miss":"Stop the intravenous fluid. The shock has recovered and he is fluid overloaded.","choices":[{"id":"off","label":"Stop the drip. The shock has recovered and the fluid is now the problem","verdict":"correct","feedback":"Warm limbs and a wider pulse pressure mean the critical leak has eased. More saline will fill the lungs.","finding":"Fluids stopped","status":"Recovery. Drip off.","spo2":91,"sbp":110,"dbp":70,"hr":96},{"id":"again","label":"Another 20 mL/kg, because yesterday he was shocked","verdict":"wrong","feedback":"Yesterday's shock is not today's indication. He is overloaded.","critical":true},{"id":"plt","label":"Platelets now that the pressure is safer","verdict":"wrong","feedback":"There is still no bleeding. Platelets are not a recovery ritual."},{"id":"dex","label":"Dexamethasone for the rash","verdict":"wrong","feedback":"The rash does not need a steroid, and it is not why he is breathless."}]},{"id":"c6","skill":"Reassessment","title":"He is breathless and the drip is off","lead":"You stopped the fluid. Saturation is 91 percent. Pressure is 110/70. He is warm. The chest has crackles.","prompt":"Do you give a diuretic?","hint":"Yes, if the pressure stays up and the overload is clear. Do not restart the bolus. Sit him up and give oxygen.","guideline":"Fluid overload in dengue recovery, once shock has clearly gone, is treated by stopping fluid and, if needed, a diuretic. Another bolus is the injury.","answer":"Oxygen, sit up, and a diuretic if the pressure holds","kind":"choice","successFinding":"Overload treated","successStatus":"Shock resolved. Lungs wet.","missYou":"Not that decision","miss":"Yes, if the pressure stays up and the overload is clear. Do not restart the bolus. Sit him up and give oxygen.","choices":[{"id":"ok","label":"Oxygen, upright, and a diuretic. No bolus","verdict":"correct","feedback":"The critical phase has flipped. The fluid you gave is now the problem.","finding":"Overload treated","status":"Shock resolved. Lungs wet."},{"id":"w0","label":"20 mL/kg, because 91 percent looks like shock","verdict":"wrong","feedback":"The pressure is wide and the limbs are warm. This is overload.","critical":true},{"id":"w1","label":"Nothing. Breathlessness is anxiety","verdict":"wrong","feedback":"Crackles and 91 percent are fluid."},{"id":"w2","label":"Platelets for the breathlessness","verdict":"wrong","feedback":"Platelets do not move lung water."}]},{"id":"c7","skill":"Reassessment","title":"Platelets are 18. There is no bleeding","lead":"The hematocrit is stable at 38. He is less breathless after the diuretic. A bag of platelets is suggested so the number looks safer.","prompt":"Do you transfuse platelets?","hint":"No. There is no bleeding. The number is not an indication.","guideline":"Prophylactic platelets for a low count in dengue, without bleeding, are not recommended. Watch the count. Do not treat it.","answer":"No platelets","kind":"choice","successFinding":"Platelets withheld","successStatus":"No bleeding. Count still low.","missYou":"Not that decision","miss":"No. There is no bleeding. The number is not an indication.","choices":[{"id":"ok","label":"Do not transfuse platelets","verdict":"correct","feedback":"The dangerous phase was the leak. The count will rise on its own if the illness allows.","finding":"Platelets withheld","status":"No bleeding. Count still low."},{"id":"w0","label":"One bag, to get over 50","verdict":"wrong","feedback":"50 is not a target without bleeding."},{"id":"w1","label":"Two bags, because 18 looks frightening","verdict":"wrong","feedback":"Fright is not an indication."},{"id":"w2","label":"A steroid so the platelets rise","verdict":"wrong","feedback":"Steroids do not treat dengue."}]},{"id":"c8","skill":"Reassessment","title":"The abdomen is still uncomfortable","lead":"There is ascites and a tender liver edge. He is not peritonitic. Pressure is normal. A surgeon is asked about a laparotomy.","prompt":"Do you operate?","hint":"No. Plasma leak causes ascites and gallbladder-wall edema. Operate only for a true surgical abdomen, which this is not.","guideline":"Abdominal pain and ascites in dengue are the leak. Surgery is for perforation or another surgical diagnosis, not for the leak itself.","answer":"No laparotomy","kind":"choice","successFinding":"Operation avoided","successStatus":"Ascites from the leak. Not peritonitic.","missYou":"Not that decision","miss":"No. Plasma leak causes ascites and gallbladder-wall edema. Operate only for a true surgical abdomen, which this is not.","choices":[{"id":"ok","label":"Do not operate. This is the leak","verdict":"correct","feedback":"The fluid is the same fluid you just diuresed from the lungs.","finding":"Operation avoided","status":"Ascites from the leak. Not peritonitic."},{"id":"w0","label":"Laparotomy for the ascites","verdict":"wrong","feedback":"You would open a leaking patient for no surgical target.","critical":true},{"id":"w1","label":"A large paracentesis as the treatment","verdict":"wrong","feedback":"He is not tense and breathless from the ascites alone. Do not make a new problem."},{"id":"w2","label":"Antibiotics for a week for the pain","verdict":"wrong","feedback":"Pain from a leak is not automatically peritonitis. He has no peritonism."}]},{"id":"c9","skill":"Reassessment","title":"Urine output returns","lead":"He passes urine. A fluid challenge is suggested to make the kidneys look grateful.","prompt":"Do you challenge him?","hint":"No. He has just been overloaded. Urine returning is recovery, not a deficit.","guideline":"Recovery diuresis and a returning urine output are expected. A fluid challenge recreates the pulmonary edema.","answer":"No fluid challenge","kind":"choice","successFinding":"Fluids stay off","successStatus":"Urine returning. Lungs clearing.","missYou":"Not that decision","miss":"No. He has just been overloaded. Urine returning is recovery, not a deficit.","choices":[{"id":"ok","label":"Do not give a fluid challenge","verdict":"correct","feedback":"The kidneys woke up because the leak stopped, not because a bag arrived.","finding":"Fluids stay off","status":"Urine returning. Lungs clearing."},{"id":"w0","label":"A 500 mL challenge, then another","verdict":"wrong","feedback":"That is the bolus, renamed."},{"id":"w1","label":"A Foley catheter and hourly saline to match the urine","verdict":"wrong","feedback":"Matching a recovery diuresis with saline is how you stay behind."},{"id":"w2","label":"Dopamine for the urine","verdict":"wrong","feedback":"There is urine. There is no role for dopamine."}]},{"id":"c10","skill":"Reassessment","title":"When can he leave high care?","lead":"Breathing is easy. Pulse pressure is normal. He is hungry. Platelets are still low but rising. Hematocrit is stable. No fever for this morning.","prompt":"What has to be true before discharge home, not just before the ward?","hint":"The critical phase is over: stable hematocrit, rising platelets, eating, no warning signs. The ward can have him tonight. Home waits for that rise, not for this morning alone.","guideline":"Discharge from hospital after dengue shock waits until the critical phase is clearly over and the platelet count is rising. Moving to a ward is earlier than going home.","answer":"Ward tonight. Home only when the rise is clear","kind":"choice","successFinding":"Critical phase ending","successStatus":"Easy breathing. Platelets rising slowly.","missYou":"Not that decision","miss":"The critical phase is over: stable hematocrit, rising platelets, eating, no warning signs. The ward can have him tonight. Home waits for that function tone(ac, freq, start, dur, type, peak){
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(peak, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(start);
  o.stop(start + dur + 0.02);
}

    tone(ac, 620, t + 0.18, 0.16, "square", 0.08);
    tone(ac, 880, t + 0.36, 0.18, "square", 0.08);
    return;
  }
  if (verdict !== "correct") return;
  if (ac){
    const t = ac.currentTime;
    tone(ac, 523, t, 0.12, "sine", 0.07);
    tone(ac, 784, t + 0.1, 0.18, "sine", 0.07);
  }

    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

function orderedChoices(stage){

    const ids = (stage.choices || []).map(function(choice){ return choice.id; });
    for (let i = ids.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const swap = ids[i];
      ids[i] = ids[j];
      ids[j] = swap;

    orderKey = key;

  }
  const byId = {};
  (stage.choices || []).forEach(function(choice){ byId[choice.id] = choice; });

function hitRegion(regions, x, y){
  let best = null, bestArea = Infinity;
  (regions || []).forEach(function(region){
    const dx = (x - region.cx) / region.rx;
    const dy = (y - region.cy) / region.ry;
    if (dx * dx + dy * dy <= 1){
      const area = region.rx * region.ry;
      if (area < bestArea){ best = region; bestArea = area; }
    }
  });
  return best;
}

  if (!ctx) return 0;
  const sx = Math.min(img.naturalWidth - 1, Math.max(0, Math.floor(x * img.naturalWidth)));
  const sy = Math.min(img.naturalHeight - 1, Math.max(0, Math.floor(y * img.naturalHeight)));
  try {
    ctx.drawImage(img, sx, sy, 1, 1, 0, 0, 1, 1);
    const pixel = ctx.getImageData(0, 0, 1, 1).data;
    return (pixel[0] + pixel[1] + pixel[2]) / 3;
  } catch (e) { return 0; }
}
function onPick(x, y, brightness){
  const stage = item.stages[index];
  if (phase !== "ask" || stage.kind !== "hotspot") return;
  const region = hitRegion(stage.regions, x, y);
  let verdict = "wrong";
  let you = stage.missYou;
  let body = stage.miss;
  let titleHint = "";
  if (region && region.verdict === "correct"){
    verdict = "correct"; you = region.you; body = region.feedback;
  } else if (region && region.verdict === "close"){
    verdict = "wrong"; you = "Close: " + region.you; body = region.feedback; titleHint = "close";
  } else if (region){
    verdict = "wrong"; you = region.you; body = region.feedback;
  } else if (stage.brightAssist && brightness >= stage.brightAssist.min && inBrightBox(stage.brightAssist, x, y)){
    verdict = "correct"; you = stage.brightAssist.you; body = stage.brightAssist.feedback;
  }
  const tone = mode === "exam" ? "neutral" : verdict === "correct" ? "good" : "bad";
  marks = marks.concat([{x:x, y:y, tone:tone}]);
  if (verdict !== "correct" && mode === "learn"){
    strikes = {tries: strikes.tries + 1, hint: strikes.hint, critical: strikes.critical};
    feedback = {title: titleHint === "close" ? "Close" : "Not that", body: body, verdict:"wrong", canAdvance:false};
    phase = "feedback";
    playVerdict("wrong");
    render();
    return;
  }
  const usedTries = mode === "exam" ? 1 : Math.max(1, strikes.tries + 1);
  const nextLive = Object.assign({}, live, {
    extraMin: live.extraMin + 4,
    status: verdict === "correct" ? stage.successStatus : live.status,
    findings: verdict === "correct" ? live.findings.concat([stage.successFinding]) : live.findings.slice()
  });
  finish({
    title: stage.title,
    skill: stage.skill,
    you: you,
    verdict: mode === "exam" ? verdict : "correct",
    critical: false,
    hintUsed: strikes.hint,
    tries: usedTries,
    points: scorePoints(verdict, usedTries, strikes.hint && mode === "learn"),
    answer: stage.answer,
    teach: mode === "exam" ? teachFor(body) : body,
    guideline: stage.guideline
  }, nextLive);
  playVerdict(verdict);
}
function continueOn(){
  if (!feedback || !feedback.canAdvance){
    phase = "ask";
    selected = null;
    render();
    toTop();
    return;
  }
  if (index + 1 >= item.stages.length){
    const finalScore = percent();
    saveBest(item.id, finalScore);
    phase = "debrief";
    render();
    toTop();
    return;
  }
  index += 1;
  live = applyStart(live);
  selected = null;
  marks = [];
  feedback = null;
  zoom = 1; pan = {x:0,y:0};
  phase = "ask";
  render();
  toTop();
}
function showHint(){
  if (strikes.tries < 1 || strikes.hint) return;
  strikes = Object.assign({}, strikes, {hint:true});
  render();
}
function resetCase(){
  phase = "intro";
  index = 0;
  live = applyStart(Object.assign({}, item.opening, {extraMin:0, findings:[]}));
  strikes = emptyStrikes();
  selected = null;
  marks = [];
  feedback = null;
  log = [];
  zoom = 1; pan = {x:0,y:0}; contrast = 1.05;
  clearOrder();
  render();
  toTop();
}
function goCatalog(){
  item = null;
  phase = "catalog";
  history.replaceState(null, "", location.pathname + location.search);
  clearOrder();
  render();
  toTop();
}

function renderVitals(){
  if (!item || phase === "catalog" || phase === "intro"){ vitalsEl.innerHTML = ""; return; }
  const bits = [
    [item.clockLabel, formatDuration(lkw()), pastWindow()],
    ["Pressure", live.sbp + "/" + live.dbp, false],
    ["Heart rate", String(live.hr), false],
    ["Resp. rate", String(live.rr), false],
    ["Oxygen", live.spo2 + "%", false]
  ];
  if (live.nihss != null) bits.push(["NIHSS", String(live.nihss), false]);
  if (live.gcs) bits.push(["GCS", live.gcs, false]);
  bits.push(["Glucose", String(live.glucose), false]);
  vitalsEl.innerHTML = '<dl class="vitals">' + bits.map(function(bit){
    return '<div><dt>' + esc(bit[0]) + '</dt><dd class="' + (bit[2] ? "warn" : "") + '">' + esc(bit[1]) + "</dd></div>";
  }).join("") + "</dl>";
}
function choiceList(stage){
  return orderedChoices(stage).map(function(choice, i){
    const resolved = resolveChoice(choice, lkw());
    const hinted = mode === "learn" && strikes.hint && resolved.verdict === "correct";
    const on = selected === choice.id;
    const cls = "choice" + (on ? " on" : "") + (hinted ? " hinted" : "");
    return '<button type="button" class="' + cls + '" data-choice="' + esc(choice.id) + '" ' + (phase !== "ask" ? "disabled" : "") + '><span class="n">' + String(i + 1).padStart(2, "0") + "</span><span>" + esc(choice.label) + "</span></button>";
  }).join("");
}
function imageBlock(stage){
  if (!stage.image) return "";
  const reveal = mode === "learn" && (strikes.hint || (phase === "feedback" && feedback && feedback.verdict === "correct"));
  const regions = reveal ? (stage.regions || []).filter(function(r){ return r.verdict === "correct"; }) : [];
  const ellipses = regions.map(function(region){
    return '<ellipse cx="' + (region.cx * 100) + '" cy="' + (region.cy * 100) + '" rx="' + (region.rx * 100) + '" ry="' + (region.ry * 100) + '" fill="none" stroke="#1f9d62" stroke-width="0.6" stroke-dasharray="1.4 1"/>';
  }).join("");
  const markSvg = marks.map(function(mark){
    const cls = mark.tone === "good" ? "good" : mark.tone === "bad" ? "bad" : "cross";
    const cx = mark.x * 100, cy = mark.y * 100;
    return '<g class="' + cls + '"><circle cx="' + cx + '" cy="' + cy + '" r="1.6" fill="none" stroke-width="0.55"/><path d="M ' + (cx - 2.2) + " " + cy + " H " + (cx + 2.2) + " M " + cx + " " + (cy - 2.2) + " V " + (cy + 2.2) + '" stroke-width="0.35"/></g>';
  }).join("");
  const cursor = stage.kind === "hotspot" && phase === "ask" ? "crosshair" : "default";
  return '<figure class="figure"><div class="stage' + (zoom > 1 ? " zoomed" : "") + '" id="stage" style="cursor:' + cursor + '"><div class="frame" id="frame" style="transform:translate(' + pan.x + "px," + pan.y + "px) scale(" + zoom + ');transform-origin:center center"><img id="plate" alt="' + esc(stage.image.alt) + '" src="' + esc(stage.image.src) + '" draggable="false" style="filter:contrast(' + contrast + ')"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' + ellipses + markSvg + "</svg></div></div><figcaption class='cap'><span>" + esc(stage.image.caption) + '</span><span class="tools"><label>Contrast <input id="contrast" type="range" min="0.85" max="1.6" step="0.05" value="' + contrast + '" aria-label="Image contrast"></label><button class="icon" type="button" id="zoomOut" aria-label="Zoom out">−</button><button class="icon" type="button" id="zoomIn" aria-label="Zoom in">+</button><button class="icon" type="button" id="zoomReset" aria-label="Reset view">↺</button></span></figcaption></figure>';
}
function feedbackBlock(stage){
  let html = "";
  if (mode === "learn" && strikes.hint) html += '<p class="meta">' + esc(stage.hint) + "</p>";
  if (phase === "feedback" && feedback){
    html += '<div class="fb ' + esc(feedback.verdict) + '" role="status"><b class="' + esc(feedback.verdict) + '">' + esc(feedback.title) + "</b>";
    if (mode === "learn") html += '<p>' + esc(feedback.body) + "</p>";
    if (mode === "learn" && feedback.canAdvance) html += '<p class="fine">' + esc(stage.guideline) + "</p>";
    html += "</div>";
  }
  return html;
}
function wireImage(stage){
  const stageEl = document.getElementById("stage");
  const img = document.getElementById("plate");
  if (!stageEl || !img) return;
  stageEl.addEventListener("pointerdown", function(event){
    stageEl.setPointerCapture(event.pointerId);
    drag = {x: event.clientX, y: event.clientY, px: pan.x, py: pan.y, moved: false};
  });
  stageEl.addEventListener("pointermove", function(event){
    if (!drag) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (Math.hypot(dx, dy) > 8) drag.moved = true;
    if (drag.moved && zoom > 1){
      pan = {x: drag.px + dx, y: drag.py + dy};
      const frame = document.getElementById("frame");
      if (frame) frame.style.transform = "translate(" + pan.x + "px," + pan.y + "px) scale(" + zoom + ")";
    }
  });
  stageEl.addEventListener("pointerup", function(event){
    const moved = drag && drag.moved;
    drag = null;
    if (moved || stage.kind !== "hotspot" || phase !== "ask") return;
    const rect = img.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;
    if (x < 0 || y < 0 || x > 1 || y > 1) return;
    onPick(x, y, brightnessAt(img, x, y));
  });
  const contrastInput = document.getElementById("contrast");
  if (contrastInput) contrastInput.addEventListener("input", function(){
    contrast = Number(contrastInput.value);
    img.style.filter = "contrast(" + contrast + ")";
  });
  document.getElementById("zoomIn").onclick = function(){ zoom = Math.min(3, Math.round((zoom + 0.25) * 100) / 100); render(); };
  document.getElementById("zoomOut").onclick = function(){
    zoom = Math.max(1, Math.round((zoom - 0.25) * 100) / 100);
    if (zoom === 1) pan = {x:0, y:0};
    render();
  };
  document.getElementById("zoomReset").onclick = function(){ zoom = 1; pan = {x:0,y:0}; contrast = 1.05; render(); };
}
function setBar(buttons){
  if (!buttons.length){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML = buttons.map(function(button){
    return '<button type="button" class="btn' + (button.ghost ? " ghost" : "") + '" id="' + button.id + '"' + (button.disabled ? " disabled" : "") + ">" + esc(button.label) + "</button>";
  }).join("");
  buttons.forEach(function(button){
    const el = document.getElementById(button.id);
    if (el) el.onclick = button.on;
  });
}
const FOCUS = {
  neuro: { title: "Neurology Practice Simulator", ids: ["stroke", "sah", "ich", "edh", "status"], line: "Stroke, subarachnoid hemorrhage, intracerebral hemorrhage, extradural blood, and spike-and-wave status. The study comes first, then the next decision." },
  lungs: { title: "Respiratory Practice Simulator", ids: ["ards", "tension", "pe", "asthma", "edema"], line: "ARDS, tension pneumothorax, pulmonary embolism, severe asthma, and pulmonary edema. The film, then the next breath." },
  circulation: { title: "Shock Practice Simulator", ids: ["shock"], line: "Septic shock. The echo, the pressure, and the first vasopressor." },
  heart: { title: "Cardiac Practice Simulator", ids: ["stemi", "chb", "cardio", "vf", "tamponade"], line: "Infarction, complete heart block, cardiogenic shock, ventricular fibrillation, and tamponade. The tracing or the film, then the next decision." },
  kidney: { title: "Renal Practice Simulator", ids: ["hyperk", "aki", "ckd"], line: "Hyperkalemia, obstructed acute kidney injury, and missed dialysis. The study, then the next decision." },
  gi: { title: "GI Practice Simulator", ids: ["pancreatitis", "variceal", "ulcer", "cholangitis"], line: "Pancreatitis, variceal bleeding, a duodenal ulcer, and cholangitis. The study comes first. Then the bundle." },
  bleed: { title: "Upper GI Bleed Practice Simulator", ids: ["variceal", "ulcer"], line: "Variceal and non-variceal bleeding. The endoscope, then the bundle that matches the lesion." },
  liver: { title: "Liver Practice Simulator", ids: ["alf", "alf-drug", "cld", "sbp", "hrs", "cholangitis"], line: "Acute liver failure, decompensated cirrhosis, infected ascites, hepatorenal syndrome, and a blocked duct." },
  id: { title: "Infection Practice Simulator", ids: ["shock", "malaria", "dengue"], line: "Septic shock, severe malaria, and dengue shock. The film, then the next decision." },
  heme: { title: "Hematology Practice Simulator", ids: ["ttp"], line: "Thrombotic thrombocytopenic purpura. The film, then plasma exchange. Not a platelet transfusion." },
  trauma: { title: "Trauma Practice Simulator", ids: ["poly", "pelvis"], line: "Rib fractures, and an open pelvic ring. Blood and a binder, not a litre of saline." },
  endo: { title: "Endocrine Practice Simulator", ids: ["dka"], line: "Diabetic ketoacidosis. The ketones, the potassium, then the insulin that must not stop when the glucose falls." },
  tox: { title: "Toxicology Practice Simulator", ids: ["op"], line: "Organophosphate poisoning. A pinpoint pupil, then atropine until the chest is dry." }
};
function focusSpec(){
  const key = new URLSearchParams(location.search).get("focus");
  return FOCUS[key] || null;
}
function visibleCases(){
  const spec = focusSpec();
  if (!spec) return CASES;
  return CASES.filter(function(c){ return spec.ids.indexOf(c.id) !== -1; });
}
function render(){
  renderVitals();
  if (phase === "catalog"){
    const spec = focusSpec();
    crumb.textContent = spec ? spec.title : "Practice Simulator";
    progress.textContent = "";
    nav.hidden = true;
    doors.href = doorsHref();
    setBar([]);
    const shown = visibleCases();
    app.innerHTML = '<section class="hero"><h1>' + esc(spec ? spec.title : "Practice Simulator") + "</h1><p>" + esc(spec ? spec.line : "The history and the image come first. Choose the study, click the finding, and live with the next set of numbers. Learn mode stops a miss. Exam mode waits until the debrief.") + '</p><div class="steps"><div><b>01</b>Select the study</div><div><b>02</b>Click the finding</div><div><b>03</b>Decide the next move</div><div><b>04</b>Reassess</div></div></section>' +
      shown.map(function(c){
        const best = loadBest(c.id);
        return '<button class="card" type="button" data-open="' + esc(c.id) + '"><img alt="" src="' + esc(c.thumb || "") + '"><span class="body"><span class="kicker">' + esc(c.syndrome) + " · " + esc(c.difficulty) + "</span><h2>" + esc(c.title) + "</h2><p class='meta'>" + esc(c.summary) + "</p><span class='badge'>" + c.stages.length + " decisions" + (best ? " · Best " + best + "%" : "") + " · Open</span></span></button>";
      }).join("") +
      '<p class="fine">Teaching cases. The study, the finding, then the next decision. Not a prescription, and not a substitute for the team at the bedside.</p>';
    app.querySelectorAll("[data-open]").forEach(function(el){
      el.onclick = function(){ openCase(el.getAttribute("data-open")); };
    });
    return;
  }
  nav.hidden = false;
  nav.textContent = "Cases";
  doors.href = doorsHref();
  nav.onclick = function(event){ event.preventDefault(); goCatalog(); };
  crumb.textContent = item.title;
  if (phase === "intro"){
    progress.textContent = "Not started";
    const best = loadBest(item.id);
    app.innerHTML = '<p class="skill">' + esc(item.syndrome) + "</p><h2 style='font-size:32px'>" + esc(item.title) + "</h2><p class='lead'>" + esc(item.summary) + '</p><div class="row" style="margin-top:12px"><button type="button" class="mode' + (mode === "learn" ? " on" : "") + '" id="modeLearn"><b>Learn</b><span>Feedback at each step. A miss does not advance you.</span></button><button type="button" class="mode' + (mode === "exam" ? " on" : "") + '" id="modeExam"><b>Exam</b><span>No hints. One attempt. The teaching is in the debrief.</span></button></div><section class="panel"><h2 style="font-size:18px">' + esc(item.patient) + "</h2><p class='meta'>" + esc(item.ageSex) + "</p><ul>" + item.objectives.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + '</ul><p class="fine">Educational simulation. The film is for this decision, not a report on a real patient.</p></section>' + (best ? '<p class="meta">Best on this device: ' + best + "%</p>" : "");
    document.getElementById("modeLearn").onclick = function(){ mode = "learn"; render(); };
    document.getElementById("modeExam").onclick = function(){ mode = "exam"; render(); };
    setBar([{id:"begin", label:"Begin case", on: begin}]);
    return;
  }
  if (phase === "debrief"){
    progress.textContent = "Debrief";
    const criticals = log.filter(function(row){ return row.critical; }).length;
    app.innerHTML = '<p class="skill">Debrief</p><h2 style="font-size:32px">' + esc(item.title) + '</h2><div class="scores"><div class="score"><span class="kicker">Score</span><b>' + percent() + '%</b></div><div class="score"><span class="kicker">Best here</span><b>' + loadBest(item.id) + '%</b></div><div class="score"><span class="kicker">Critical misses</span><b>' + criticals + '</b></div><div class="score"><span class="kicker">Time from onset</span><b style="font-size:20px">' + esc(formatDuration(lkw())) + "</b></div></div><ol style='padding-left:0;list-style:none'>" +
      log.map(function(row, i){
        const word = row.verdict === "correct" ? "Correct" : row.verdict === "partial" ? "Partial" : "Missed";
        return '<li class="panel"><div class="row" style="justify-content:space-between"><b>' + (i + 1) + ". " + esc(row.title) + '</b><span class="' + row.verdict + '">' + word + (row.critical ? " · critical" : "") + " · " + row.points + "</span></div><p class='meta'>You: " + esc(row.you) + "</p><p>" + esc(row.teach) + '</p><p class="fine">' + esc(row.guideline) + "</p></li>";
      }).join("") + "</ol>";
    setBar([{id:"again", label:"Run it again", on: resetCase}, {id:"all", label:"All cases", ghost:true, on: goCatalog}]);
    return;
  }
  const stage = item.stages[index];
  progress.textContent = (index + 1) + " of " + item.stages.length;
  const findings = live.findings.length ? "<ul>" + live.findings.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + "</ul>" : "<p class='meta'>Nothing in the summary yet.</p>";
  app.innerHTML = '<p class="skill">' + esc(stage.skill) + "</p><h2>" + esc(stage.title) + "</h2><p class='lead'>" + esc(stage.lead) + '</p><p class="prompt">' + esc(stage.prompt) + "</p>" +
    (stage.kind === "hotspot" && phase === "ask" ? '<p class="meta">Click the image. Zoom in, then drag to pan.</p>' : "") +
    imageBlock(stage) +
    '<section class="panel"><p class="kicker">' + esc(item.patient) + " · " + esc(item.ageSex) + "</p><p>" + esc(live.status) + "</p><details><summary>History</summary><ul>" + item.chart.map(function(line){ return "<li>" + esc(line) + "</li>"; }).join("") + "</ul></details><details><summary>Case summary till now</summary>" + findings + "</details></section>" +
    (stage.kind === "choice" ? '<div role="listbox">' + choiceList(stage) + "</div>" : "") +
    feedbackBlock(stage);
  if (stage.kind === "choice"){
    app.querySelectorAll("[data-choice]").forEach(function(el){
      el.onclick = function(){ if (phase !== "ask") return; selected = el.getAttribute("data-choice"); render(); };
    });
  }
  wireImage(stage);
  const buttons = [];
  if (phase === "ask" && stage.kind === "choice") buttons.push({id:"submit", label:"Submit decision", disabled:!selected, on:onChoice});
  if (phase === "feedback") buttons.push({id:"next", label: feedback && feedback.canAdvance ? (index + 1 >= item.stages.length ? "See the debrief" : "Continue") : "Try again", on: continueOn});
  if (mode === "learn" && phase === "ask") buttons.push({id:"hint", label: strikes.hint ? "Hint shown" : "Hint after a miss", ghost:true, disabled: strikes.tries < 1 || strikes.hint, on: showHint});
  setBar(buttons);
}

const startId = (location.hash || "").replace("#", "") || new URLSearchParams(location.search).get("case");
if (startId && CASES.some(function(c){ return c.id === startId; })) openCase(startId);
else render();
</script>
