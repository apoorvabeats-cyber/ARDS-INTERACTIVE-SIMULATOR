"Interpretation","title":"Name the finding","lead":"She is not on a blood thinner. The clot is deep, and the ventricles contain blood.","prompt":"What is this?","hint":"Bright blood inside the brain, not a subdural crescent and not an infarct.","guideline":"A deep spontaneous hemorrhage is not a drain-first extradural. Blood pressure, the airway, and the ventricles come before any thought of a steroid.","answer":"Intracerebral hemorrhage with intraventricular blood","kind":"choice","successFinding":"Intracerebral hemorrhage","successStatus":"Hemorrhage, not an infarct.","missYou":"Not that choice","miss":"Bright blood inside the brain, not a subdural crescent and not an infarct.","choices":[{"id":"ich","label":"Intracerebral hemorrhage with blood in the ventricles","verdict":"correct","feedback":"Deep blood, plus intraventricular blood. This is not an infarct and it is not an extradural lens.","finding":"Intracerebral hemorrhage","status":"Hemorrhage confirmed."},{"id":"infarct","label":"Established infarct, safe for thrombolysis","verdict":"wrong","feedback":"The bright material is blood. A thrombolytic is contraindicated.","critical":true},{"id":"sdh","label":"Subdural hematoma","verdict":"wrong","feedback":"A subdural hematoma hugs the surface as a crescent. This blood is inside the brain."},{"id":"tumor","label":"Tumor, so start dexamethasone","verdict":"wrong","feedback":"Acute bright blood is not a tumor protocol. Dexamethasone is not the treatment of this hemorrhage."}],"image":{"src":"sim/cases/ich2.jpg","alt":"Name the finding","caption":"Name the finding"}},{"id":"bp","skill":"Blood pressure","title":"The pressure is 204","lead":"Airway is holding. There is no story of a large-vessel occlusion to chase. Systolic pressure is 204.","prompt":"What do you do about the pressure?","hint":"For a spontaneous hemorrhage with systolic pressure between 150 and 220, the usual aim is near 140, with a drug you can turn down.","guideline":"Lowering toward 140 is reasonable. Do not crash the pressure far below that. Do not give a steroid, and do not transfuse platelets when she takes none.","answer":"Titrate the systolic pressure toward 140","kind":"choice","successFinding":"Pressure plan set","successStatus":"Systolic pressure coming down.","missYou":"Not that choice","miss":"For a spontaneous hemorrhage with systolic pressure between 150 and 220, the usual aim is near 140, with a drug you can turn down.","choices":[{"id":"aim","label":"A titratable infusion, aiming the systolic pressure near 140","verdict":"correct","feedback":"Nicardipine or labetalol, titrated. The aim is near 140, not a normal of 110, and not leaving her at 204.","sbp":142,"dbp":78,"finding":"Systolic pressure aimed near 140","status":"Pressure falling, slowly."},{"id":"leave","label":"Leave it. Pressure helps the brain perfuse","verdict":"wrong","feedback":"204 is above the range where we leave a spontaneous hemorrhage alone."},{"id":"crash","label":"Drop the systolic pressure to 100 quickly","verdict":"wrong","feedback":"A steep drop can under-perfuse the brain around the clot."},{"id":"steroid","label":"Dexamethasone for the swelling","verdict":"wrong","feedback":"Steroids do not improve this hemorrhage and they bring harm. They are not the pressure plan."}]},{"id":"next","skill":"Reassessment","title":"She stops localizing","lead":"An hour later she only flexes, and one pupil is a little larger. The pressure is 138.","prompt":"What is the next move?","hint":"The hemorrhage can extend, and the ventricles can obstruct. Look again. Protect the airway. A steroid will not empty the ventricle.","guideline":"A falling conscious level needs an airway and a repeat scan. Hydrocephalus from intraventricular blood may need a drain. Surgery is not automatic for a deep clot.","answer":"Airway and a repeat CT","kind":"choice","successFinding":"Airway secured, repeat CT","successStatus":"Being moved for a repeat scan.","missYou":"Not that choice","miss":"The hemorrhage can extend, and the ventricles can obstruct. Look again. Protect the airway. A steroid will not empty the ventricle.","choices":[{"id":"rescan","label":"Secure the airway and repeat the CT now","verdict":"correct","feedback":"She has fallen off. The airway comes first, then a repeat scan to see extension, shift, or trapped ventricles. A drain is for obstruction, not a reflex.","gcs":"E2 V2 M4","finding":"Airway and repeat CT","status":"Intubated. Repeat CT underway."},{"id":"dex","label":"Dexamethasone and observe on the ward","verdict":"wrong","feedback":"She is deteriorating. A steroid does not treat the clot or the ventricle, and the ward is the wrong place.","critical":true},{"id":"lyse","label":"Thrombolysis, because the first hour was an infarct","verdict":"wrong","feedback":"You have already seen blood. A thrombolytic is contraindicated.","critical":true},{"id":"plt","label":"Platelet transfusion to help the clot stop","verdict":"wrong","feedback":"She is not on an antiplatelet drug, and platelets are not routine even when someone is. They are not the rescue here."}]}]},{"id":"edh","title":"Traumatic brain injury","syndrome":"Extradural hematoma","minutes":"8 min","difficulty":"Core","available":true,"summary":"A lens of blood after a head strike. This one needs a surgeon, not a steroid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/edh.jpg","patient":"Hit his temple on a step, then a lucid interval","ageSex":"28-year-old man","chart":["Teaching case. Not a prescription.","Brief loss of consciousness, then he spoke, then he became drowsy. No anticoagulant. Scalp bruise over the temple."],"opening":{"lkwMin":20,"status":"Drowsy after a lucid interval.","sbp":148,"dbp":86,"hr":64,"rr":18,"spo2":96,"glucose":108,"gcs":"E3 V4 M5"},"stages":[{"id":"study","skill":"Investigation","title":"What do you do first?","lead":"He is breathing, the pressure is adequate, and oxygen is acceptable. He is not herniating on the pillow in front of you.","prompt":"What comes first?","hint":"Non-contrast CT is the trauma brain study. Do not send him for an MRI, and do not start a steroid.","guideline":"In traumatic brain injury the first brain image is a non-contrast CT. Hypoxia and hypotension are treated at the same time, not instead of the scan.","answer":"Non-contrast CT","kind":"choice","successFinding":"CT arranged","successStatus":"Oxygen on. CT next.","missYou":"Not that choice","miss":"Non-contrast CT is the trauma brain study. Do not send him for an MRI, and do not start a steroid.","choices":[{"id":"ct","label":"Non-contrast CT of the head, while you keep oxygen and pressure normal","verdict":"correct","feedback":"He can go to the scanner. Keep the systolic pressure up, not down. CT, not MRI.","finding":"Trauma CT","status":"In the scanner. Pressure maintained."},{"id":"mri","label":"MRI, to grade the diffuse injury","verdict":"wrong","feedback":"MRI delays a diagnosis that CT makes in a minute. An extradural hematoma is a CT diagnosis."},{"id":"steroid","label":"Dexamethasone now, scan in the morning","verdict":"wrong","feedback":"Steroids harm traumatic brain injury. Waiting until morning misses a surgical clot.","critical":true},{"id":"hyper","label":"Routine hyperventilation to a carbon dioxide of 25","verdict":"wrong","feedback":"He is not herniating on the trolley. Prolonged hyperventilation constricts vessels and is not a treatment plan."}]},{"id":"click","skill":"Localization","title":"Click the blood","lead":"The blood is outside the brain and it is lens-shaped. The midline is being pushed away from it.","prompt":"Click the extradural hematoma.","hint":"Look for a biconvex bright collection under the skull, not the dark folds of normal sulci.","guideline":"An extradural hematoma is lens-shaped because the dura i ock, so the plan changes","successStatus":"Pressure 78. Thrombolysis decision.","missYou":"Not that choice","miss":"Shock from embolism is a different disease from yesterday. Thrombolysis, if nothing else stops you.","choices":[{"id":"now","label":"She is now in shock. Systemic thrombolysis if the bleeding risk allows it","verdict":"correct","feedback":"Yesterday she was not a lysis case. Today the pressure has failed. Alteplase 100 mg over two hours is the systemic regimen, unless a recent operation makes you choose an embolectomy instead.","sbp":78,"finding":"Shock, thrombolysis considered","status":"Massive embolism physiology."},{"id":"same","label":"Keep the same heparin and add a fluid litre","verdict":"wrong","feedback":"A litre will not move a saddle clot that is now causing shock. The treatment class has changed."},{"id":"stop","label":"Stop all anticoagulation because the pressure fell","verdict":"wrong","feedback":"Stopping the heparin does not treat obstructive shock."},{"id":"aspirin","label":"Add aspirin and observe","verdict":"wrong","feedback":"Aspirin is not rescue therapy for massive embolism."}]}]},{"id":"asthma","title":"Severe asthma","syndrome":"Silent chest, hyperinflation","minutes":"8 min","difficulty":"Core","available":true,"summary":"She can say one word. The film shows air trapping. It does not show a pneumonia to treat instead.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/asthma.jpg","patient":"Known asthma, three days of a cold, now one-word sentences","ageSex":"24-year-old woman","chart":["Teaching case. Not a prescription.","Back-to-back nebulisers at home. Speaking one word. Wheeze is quiet. No fever."],"opening":{"lkwMin":20,"status":"One-word sentences. Quiet chest.","sbp":146,"dbp":90,"hr":128,"rr":32,"spo2":91,"gl "you":"A limb lead","feedback":"That column is the limb leads. Move right, to the chest leads."}]},{"id":"name","skill":"Interpretation","title":"Name the tracing","lead":"The pain is ongoing. The ST segment is up in the chest leads. The catheter laboratory is free.","prompt":"What do you call, and what do you not wait for?","hint":"ST-elevation infarction. Activate the laboratory. Give aspirin. Do not wait for the troponin.","guideline":"Primary percutaneous coronary intervention is preferred when the laboratory can take him promptly. Aspirin is given unless he truly cannot have it. Thrombolysis is the alternative only when timely intervention is impossible.","answer":"ST-elevation infarction, laboratory now","kind":"choice","successFinding":"ST-elevation infarction","successStatus":"Laboratory activated.","missYou":"Not that choice","miss":"ST-elevation infarction. Activate the laboratory. Give aspirin. Do not wait for the troponin.","choices":[{"id":"stemi","label":"ST-elevation infarction. Aspirin, anticoagulation, and the catheter laboratory now","verdict":"correct","feedback":"Do not wait for a biomarker. The laboratory is open, so this is primary intervention, not a thrombolytic by default.","finding":"ST-elevation infarction","status":"Laboratory activated. Aspirin given."},{"id":"nstemi","label":"Non-ST elevation. Admit and repeat the tracing tomorrow","verdict":"wrong","feedback":"The ST segment is elevated. Tomorrow is a completed infarct."},{"id":"peric","label":"Pericarditis. Ibuprofen and home","verdict":"wrong","feedback":"Ongoing crushing pain and territorial ST elevation is not a home diagnosis. Pericarditis is widespread and the story differs."},{"id":"wait","label":"Troponin first, laboratory only if it is raised","verdict":"wrong","feedback":"You will lose the myocardium while the blood spins.","critical":true}],"image":{"src":"sim/cases/stemi.jpg","alt":"Name the tracing","caption":"Name the tracing"}},{"id":"drug","skill":"Decision","title":"The laboratory is ready. Which drugs before he moves?","lead":"He can chew. Systolic pressure is 138. No active bleeding.","prompt":"What do you give before transfer?","hint":"Aspirin, a loading antiplatelet per the laboratory, and anticoagulation. Not a thrombolytic when the laboratory is waiting.","guideline":"Aspirin 162 to 325 mg chewed. The second antiplatelet and the heparin follow the laboratory's protocol. Do not give fibrinolysis when primary intervention is immediate.","answer":"Aspirin and transfer","kind":"choice","successFinding":"Aspirin given","successStatus":"Moving to the laboratory.","missYou":"Not that choice","miss":"Aspirin, a loading antiplatelet per the laboratory, and anticoagulation. Not a thrombolytic when the laboratory is waiting.","choices":[{"id":"asa","label":"Aspirin now, anticoagulation, and transfer for primary intervention","verdict":"correct","feedback":"Chew the aspirin. Do not delay transfer for a decorative set of bloods.","sbp":136,"finding":"Aspirin and primary intervention","status":"In transfer. Pain still present."},{"id":"lyse","label":"Tenecteplase here, and cancel the laboratory","verdict":"wrong","feedback":"The laboratory can take him. Fibrinolysis is for when timely intervention cannot happen."},{"id":"none","label":"No aspirin, because the laboratory will give it","verdict":"wrong","feedback":"Aspirin is given at the first opportunity, not after a journey."},{"id":"gtnonly","label":"Nitrate only, and review in the morning","verdict":"wrong","feedback":"A nitrate may ease pain. It does not open an occluded artery.","critical":true}]},{"id":"vf","skill":"Reassessment","title":"He arrests as the drapes go on","lead":"The monitor shows a coarse irregular trembling of the baseline and no pulse.","prompt":"What is the first act?","hint":"That is ventricular fibrillation. Shock. Do not start with a nitrate or with amiodarone.","guideline":"Pulseless ventricular fibrillation is defibrillated immediately. Drugs come after the shock, not before it.","answer":"Defibrillate","kind":"choice","successFinding":"Shock delivered","successStatus":"Compressions around the shock.","missYou":"Not that choice","miss":"That is ventricular fibrillation. Shock. Do not start with a nitrate or with amiodarone.","choices":[{"id":"shock","label":"Defibrillate now","verdict":"correct","feedback":"No pulse and ventricular fibrillation. Charge and shock. Then compressions. Amiodarone is not the first act.","finding":"Defibrillation","status":"Shock delivered."},{"id":"amio","label":"Amiodarone before any shock","verdict":"wrong","feedback":"The drug does not replace the shock. Defibrillate first.","critical":true},{"id":"gtn","label":"More nitrate","verdict":"wrong","feedback":"He has no pulse. A nitrate is irrelevant and harmful here."},{"id":"pace","label":"Transcutaneous pacing","verdict":"wrong","feedback":"You cannot pace fibrillation. Shock it."}]}]},{"id":"chb","title":"Complete heart block","syndrome":"Slow, and shocked","minutes":"8 min","difficulty":"Core","available":true,"summary":"She is dizzy and the systolic pressure is 78. The P waves march through the QRS.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/chb.png","patient":"Two syncopal spells today","ageSex":"76-year-old woman","chart":["Teaching case. Not a prescription.","On no rate-limiting drug overdose. Perfusion is poor. Heart rate on the monitor is 34."],"opening":{"lkwMin":20,"status":"Pale, dizzy, poor perfusion.","sbp":78,"dbp":40,"hr":34,"rr":20,"spo2":95,"glucose":112},"stages":[{"id":"study","skill":"Investigation","title":"What do you record?","lead":"The monitor already shows a slow rate. You need the relationship of P waves to QRS.","prompt":"Which tracing?","hint":"A 12-lead, or at least a long rhythm strip. Do not send her for a pacing check in the morning.","guideline":"Complete heart block is P waves and QRS complexes that are divorced. An unstable patient is paced, not observed.","answer":"Rhythm strip","kind":"choice","successFinding":"Strip recorded","successStatus":"The strip is up.","missYou":"Not that choice","miss":"A 12-lead, or at least a long rhythm strip. Do not send her for a pacing check in the morning.","choices":[{"id":"ecg","label":"A rhythm strip now, with pads on the chest","verdict":"correct","feedback":"Diagnose it and be ready to pace in the same minute. She is already shocked.","finding":"Rhythm strip","status":"Pads on. Strip running."},{"id":"lab","label":"Electrolytes first, no strip until they return","verdict":"wrong","feedback":"The electrolytes matter, and they can wait two minutes. The rate cannot."},{"id":"home","label":"Oral amlodipine hold, and home","verdict":"wrong","feedback":"She is hypotensive at a rate of 34. This is not an outpatient problem.","critical":true},{"id":"fluid","label":"A litre of fluid as the only act","verdict":"wrong","feedback":"Fluid does not reconnect atrioventricular conduction."}]},{"id":"click","skill":"Localization","title":"Click a P wave that does not conduct","lead":"The arrows mark P waves. The QRS complexes are the taller narrow spikes, and they are not married to those P waves.","prompt":"Click a P wave.","hint":"The arrows point at the P waves. They walk through at their own rate.","guideline":"If P waves and QRS complexes are dissociated, and the ventricular rate is slower, this is complete heart block.","answer":"A non-conducted P wave","image":{"src":"sim/cases/chb.png","alt":"Rhythm strip. P waves and QRS complexes are dissociated.","caption":"P waves marching through."},"kind":"hotspot","successFinding":"Complete dissociation","successStatus":"Complete dissociation","missYou":"Clicked a QRS","miss":"That taller spike is the QRS. The P wave is the smaller deflection the arrow is marking.","regions":[{"id":"p1","verdict":"correct","cx":0.16,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"That is a P wave, and it is not tied to a QRS."},{"id":"p2","verdict":"correct","cx":0.48,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"Another P wave, still dissociated."},{"id":"p3","verdict":"correct","cx":0.8,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"A third P wave at its own rate."},{"id":"qrs","verdict":"wrong","cx":0.24,"cy":0.58,"rx":0.05,"ry":0.08,"you":"A QRS complex","feedback":"That is the ventricular beat. The question asked for the P wave that fails to conduct."}]},{"id":"name","skill":"Interpretation","title":"Name the rhythm","lead":"P waves and QRS complexes are divorced. The ventricular rate is 34. She is shocked.","prompt":"What is it?","hint":"Complete, or third-degree, heart block.","guideline":"Unstable complete heart block is paced. Atropine is unreliable when the block is below the node, and it is not the plan you rely on.","answer":"Complete heart block","kind":"choice","successFinding":"Complete heart block","successStatus":"Pacing next.","missYou":"Not that choice","miss":"Complete, or third-degree, heart block.","choices":[{"id":"chb","label":"Complete heart block","verdict":"correct","feedback":"Dissociated P waves, a slow ventricular escape, and shock. Pace her.","finding":"Complete heart block","status":"Calling for pacing."},{"id":"af","label":"Atrial fibrillation with a normal rate","verdict":"wrong","feedback":"There are organized P waves, and the rate is 34. This is not controlled fibrillation."},{"id":"sinus","label":"Sinus bradycardia that will settle","verdict":"wrong","feedback":"Sinus bradycardia keeps each P married to a QRS. These are divorced."},{"id":"vt","label":"Ventricular tachycardia","verdict":"wrong","feedback":"The QRS is slow and narrow enough to be an escape, not a wide fast tachycardia."}],"image":{"src":"sim/cases/chb.png","alt":"Name the rhythm","caption":"Name the rhythm"}},{"id":"pace","skill":"Decision","title":"The pressure is 78","lead":"Pads are on. She is sweaty. Atropine 0.5 mg did nothing.","prompt":"What do you do?","hint":"Transcutaneous pacing now. Then a transvenous wire. Do not keep giving atropine as the only plan.","guideline":"Pace the unstable patient. Sedate for the pads if you can do it without delaying the capture. Adrenaline or isoprenaline is a bridge only if pacing is delayed.","answer":"Transcutaneous pacing","kind":"choice","successFinding":"Pacing","successStatus":"Capture. Pressure rising.","missYou":"Not that choice","miss":"Transcutaneous pacing now. Then a transvenous wire. Do not keep giving atropine as the only plan.","choices":[{"id":"tcp","label":"Transcutaneous pacing now, and arrange a transvenous wire","verdict":"correct","feedback":"Capture, then a wire. Do not stop at atropine.","sbp":108,"finding":"Transcutaneous pacing","status":"Pads capturing. Pressure 108."},{"id":"atrop","label":"Repeat atropine every five minutes and do not pace","verdict":"wrong","feedback":"Atropine has already failed. Infra-nodal block often ignores it.","critical":true},{"id":"oral","label":"Oral salbutamol and the ward","verdict":"wrong","feedback":"She is shocked. The ward is the wrong destination."},{"id":"shock","label":"Defibrillate the slow rhythm","verdict":"wrong","feedback":"A shock is for fibrillation and for unstable tachycardia, not for a perfusing bradycardia you can pace."}]},{"id":"wire","skill":"Reassessment","title":"The pads are capturing","lead":"Each pacing spike is followed by a QRS and a pulse. Someone wants the pads paused 'to rest the skin' before the wire is in.","prompt":"What do you say?","hint":"Do not stop a capturing external pacemaker until a wire has captured.","guideline":"External pacing continues until transvenous pacing has taken over and been tested. Then, and only then, the pads come off demand.","answer":"Keep pacing until the wire captures","kind":"choice","successFinding":"Wire planned","successStatus":"Still capturing.","missYou":"Not that choice","miss":"Do not stop a capturing external pacemaker until a wire has captured.","choices":[{"id":"keep","label":"Keep the pads capturing until a transvenous wire has captured","verdict":"correct","feedback":"Test the wire. Then you may stop the pads. Not before.","sbp":112,"finding":"Bridge to a wire","status":"External pacing continues."},{"id":"off","label":"Pause the pads for ten minutes to rest the skin","verdict":"wrong","feedback":"Ten minutes without capture returns her to a rate of 34 and a pressure of 78.","critical":true},{"id":"home","label":"Discharge on the pads","verdict":"wrong","feedback":"External pacing is a bridge, not a discharge plan."},{"id":"fluid","label":"Turn the pads off and give fluid","verdict":"wrong","feedback":"Fluid is not a pacemaker."}]}]},{"id":"cardio","title":"Cardiogenic shock","syndrome":"Cold, wet, wires in the sternum","minutes":"8 min","difficulty":"Core","available":true,"summary":"The film is edema and old sternal wires. The pressure is 78. This is not a litre of saline.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/cardio.jpg","patient":"Breathless and cold the day after a cardiac admission","ageSex":"71-year-old man","chart":["Teaching case. Not a prescription.","Cool hands, wet lungs, lactate 5. A previous sternotomy. No fever. Systolic pressure 78 on no support."],"opening":{"lkwMin":20,"status":"Cold and wet.","sbp":78,"dbp":50,"hr":118,"rr":28,"spo2":88,"glucose":164},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at first?","lead":"He is shocked and hypoxic. You need the lungs and the pump, in that order of speed.","prompt":"What do you obtain?","hint":"A portable film and a bedside echo. Not a fluid challenge as the test.","guideline":"Cold and wet shock is cardiogenic until the echo says otherwise. Fluid is not the diagnostic test.","answer":"Film and an echocardiogram","kind":"choice","successFinding":"Studies going","successStatus":"Film up. Echo next.","missYou":"Not that choice","miss":"A portable film and a bedside echo. Not a fluid challenge as the test.","choices":[{"id":"both","label":"Portable chest film and a bedside echocardiogram","verdict":"correct","feedback":"The film shows the water. The echo shows the pump. Neither is a reason to pour in saline first.","finding":"Film and echo planned","status":"Film on the screen."},{"id":"fluid","label":"500 mL saline, and repeat, as a fluid challenge","verdict":"wrong","feedback":"He is wet and cold. A challenge floods the lungs.","critical":true},{"id":"ct","label":"Contrast CT of the whole aorta before any support","verdict":"wrong","feedback":"He is too unstable for a diagnostic tour. Support him and use the echo."},{"id":"dop","label":"Renal-dose dopamine and the ward","verdict":"wrong","feedback":"There is no renal-dose dopamine that treats cardiogenic shock, and the ward is unsafe."}]},{"id":"click","skill":"Localization","title":"Click the edema, not the wires","lead":"The lungs are hazy on both sides. Metal wires sit in the sternum from an old operation. The wires are not today's disease.","prompt":"Click the alveolar edema.","hint":"The white haze in the lungs is the edema. The bright twists in the midline are old wires.","guideline":"Bilateral edema with shock and a cold periphery is cardiogenic until the echo disagrees. The wires only tell you he has had a sternotomy.","answer":"Pulmonary edema","image":{"src":"sim/cases/cardio.jpg","alt":"Chest radiograph. Bilateral edema and old sternal wires.","caption":"Bilateral pulmonary edema."},"kind":"hotspot","successFinding":"Wet lungs","successStatus":"Wet lungs","missYou":"Clicked the sternal wires","miss":"Those wires are old. Today's finding is the haze in the lungs.","regions":[{"id":"ed","verdict":"correct","cx":0.3,"cy":0.46,"rx":0.14,"ry":0.14,"you":"Alveolar edema","feedback":"That haze is edema in the lung."},{"id":"ed2","verdict":"correct","cx":0.72,"cy":0.46,"rx":0.12,"ry":0.12,"you":"Alveolar edema","feedback":"The other lung is wet as well."},{"id":"wire","verdict":"wrong","cx":0.52,"cy":0.32,"rx":0.06,"ry":0.08,"you":"Sternal wires","feedback":"Those are old wires. They are not the cause of today's shock. Click the edema."}]},{"id":"name","skill":"Interpretation","title":"Name the shock","lead":"Cold hands, wet film, lactate up, pressure 78.","prompt":"Which shock is this?","hint":"Cardiogenic. Cold and wet. Not distributive warmth, and not a fluid-responsive hypovolemia.","guideline":"Norepinephrine is a reasonable first vasopressor when the pressure is this low. An inotrope is added for the cold pump once you have a pressure. A litre of saline is not the treatment.","answer":"Cardiogenic shock","kind":"choice","successFinding":"Cardiogenic shock","successStatus":"Wet and cold.","missYou":"Not that choice","miss":"Cardiogenic. Cold and wet. Not distributive warmth, and not a fluid-responsive hypovolemia.","choices":[{"id":"cs","label":"Cardiogenic shock. Cold and wet","verdict":"correct","feedback":"Support the pressure. Do not flood him. Get the echo if it is not already on the machine.","finding":"Cardiogenic shock","status":"Pressor being drawn up."},{"id":"sep","label":"Septic shock. A 30 mL/kg fluid bolus","verdict":"wrong","feedback":"He is cold, not warm, and the film is already edema. A sepsis bolus is the wrong recipe.","critical":true},{"id":"hyp","label":"Hypovolemic shock from poor intake","verdict":"wrong","feedback":"Hypovolemia has dry lungs. These lungs are wet."},{"id":"ana","label":"Anaphylaxis","verdict":"wrong","feedback":"There is no rash, no trigger, and the film is edema from pressure, not bronchospasm."}],"image":{"src":"sim/cases/cardio.jpg","alt":"Name the shock","caption":"Name the shock"}},{"id":"drug","skill":"Decision","title":"The pressure is 78","lead":"The echo, when it arrives, shows a poorly contracting left ventricle and no large pericardial collection.","prompt":"What do you start?","hint":"Norepinephrine to get a pressure. Do not start with nitroprusside. Do not give a litre.","guideline":"In hypotensive cardiogenic shock a vasopressor comes before a pure vasodilator. Dobutamine or a similar inotrope is added if he stays cold once the pressure exists.","answer":"Norepinephrine","kind":"choice","successFinding":"Norepinephrine started","successStatus":"Pressure rising slowly.","missYou":"Not that choice","miss":"Norepinephrine to get a pressure. Do not start with nitroprusside. Do not give a litre.","choices":[{"id":"nor","label":"Norepinephrine now. No fluid bolus. Inotrope if he stays cold once the pressure exists","verdict":"correct","feedback":"Make a pressure first. Then an inotrope for the pump. The echo has excluded a tamponade you would have drained.","sbp":95,"finding":"Norepinephrine","status":"Pressure 95. Still cool."},{"id":"fluid","label":"One litre, then another, guided by nothing","verdict":"wrong","feedback":"The lungs are wet and the ventricle is poor. Fluid will worsen both.","critical":true},{"id":"ntp","label":"Nitroprusside alone","verdict":"wrong","feedback":"A pure vasodilator at a systolic pressure of 78 drops the coronary perfusion further."},{"id":"dop","label":"Low-dose dopamine for the kidney","verdict":"wrong","feedback":"Renal-dose dopamine does not exist as a useful treatment. He needs a pressure and a pump."}]},{"id":"ino","skill":"Reassessment","title":"Pressure 95, still cold, lactate rising","lead":"He has a mean pressure you can defend, but the hands are cold and the lactate has gone from 5 to 6.","prompt":"What do you add?","hint":"An inotrope. Not more fluid.","guideline":"Once a pressure exists, dobutamine or a similar inotrope treats the low output. More fluid treats a different shock.","answer":"Add an inotrope","kind":"choice","successFinding":"Inotrope added","successStatus":"Warmer. Lactate watched.","missYou":"Not that choice","miss":"An inotrope. Not more fluid.","choices":[{"id":"dob","label":"Add an inotrope. Do not add fluid","verdict":"correct","feedback":"The constraint was pressure. That is better. The remaining problem is the pump.","sbp":98,"finding":"Inotrope added","status":"Pressure held. Inotrope running."},{"id":"more","label":"Another litre, because the lactate rose","verdict":"wrong","feedback":"Lactate here is low flow, not an empty tank. The film was already wet.","critical":true},{"id":"stop","label":"Stop the norepinephrine because 95 is enough and he is cold","verdict":"wrong","feedback":"If you remove the pressure, the inotrope has nothing to work with. Add the inotrope, do not strip the vasopressor blindly."},{"id":"steroid","label":"Hydrocortisone as the main cardiac drug","verdict":"wrong","feedback":"Steroid is not the treatment of a failed pump."}]}]},{"id":"hyperk","title":"Hyperkalemia","syndrome":"Weak, and the T waves are peaked","minutes":"8 min","difficulty":"Core","available":true,"summary":"Potassium is 7.1. The electrocardiogram has already changed. Calcium comes before the insulin.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/hyperk.jpg","patient":"Weakness, and a missed dialysis session","ageSex":"66-year-old man","chart":["Teaching case. Not a prescription.","Anuric. Potassium 7.1 mmol/L. Glucose 162 mg/dL. No digoxin."],"opening":{"lkwMin":20,"status":"Weak, anuric.","sbp":146,"dbp":82,"hr":81,"rr":18,"spo2":97,"glucose":162},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at before the drug?","lead":"The laboratory has already phoned the potassium. You need the membrane.","prompt":"Which test changes the first drug?","hint":"The electrocardiogram. Peaked T waves, a wide QRS, or a sine wave means calcium first.","guideline":"Intravenous calcium stabilizes the membrane. It does not lower the potassium. Insulin with glucose does that.","answer":"Electrocardiogram","kind":"choice","successFinding":"Electrocardiogram done","successStatus":"The tracing is up.","missYou":"Not that choice","miss":"The electrocardiogram. Peaked T waves, a wide QRS, or a sine wave means calcium first.","choices":[{"id":"ecg","label":"Electrocardiogram now","verdict":"correct","feedback":"If it is abnormal, calcium is first. Do not start with a resin.","finding":"Electrocardiogram","status":"Tracing on the screen."},{"id":"resin","label":"Sodium polystyrene only, and a repeat potassium tomorrow","verdict":"wrong","feedback":"A resin is slow, weak, and not the treatment of a potassium of 7.1 with a changed tracing.","critical":true},{"id":"wait","label":"Repeat the laboratory. Do nothing if it might be hemolyzed","verdict":"wrong","feedback":"Treat the patient in front of you. A second sample can be drawn while the calcium is running, not instead of it."},{"id":"kcl","label":"Potassium replacement, because he is weak","verdict":"wrong","feedback":"Weakness here is from too much potassium. Giving more can arrest him.","critical":true}]},{"id":"click","skill":"Localization","title":"Click a peaked T wave","lead":"The precordial leads are on the right of the page. The T waves are tall and pointed.","prompt":"Click a tall peaked T wave.","hint":"The chest leads on the right have the sharp tall T waves. The limb leads are on the left.","guideline":"Peaked T waves are the early electrocardiographic sign of hyperkalemia. A wide QRS is later and more dangerous. Either one earns calcium.","answer":"Peaked T waves","image":{"src":"sim/cases/hyperk.jpg","alt":"Electrocardiogram with tall peaked precordial T waves.","caption":"Tall peaked T waves."},"kind":"hotspot","successFinding":"Membrane is irritable","successStatus":"Membrane is irritable","missYou":"Clicked a limb lead","miss":"The peaked waves to mark are in the chest leads, on the right of the page.","regions":[{"id":"t","verdict":"correct","cx":0.72,"cy":0.46,"rx":0.18,"ry":0.28,"you":"Peaked T wave","feedback":"Those tall pointed T waves are the hyperkalemic change."},{"id":"limb","verdict":"wrong","cx":0.22,"cy":0.22,"rx":0.1,"ry":0.08,"you":"A limb lead","feedback":"That side is the limb leads. The peaked precordial T waves are on the right."}]},{"id":"name","skill":"Interpretation","title":"Name the danger","lead":"Potassium 7.1, anuric, peaked T waves, QRS not yet a sine wave.","prompt":"What does the tracing mean?","hint":"The membrane is unstable. Calcium first, then shift the potassium.","guideline":"Calcium gluconate, 10 mL of 10 percent, is the usual first intravenous calcium. It lasts about 30 to 60 minutes. It does not remove potassium.","answer":"Hyperkalemia with electrocardiographic change","kind":"choice","successFinding":"Calcium first","successStatus":"Calcium being drawn.","missYou":"Not that choice","miss":"The membrane is unstable. Calcium first, then shift the potassium.","choices":[{"id":"ca","label":"Hyperkalemia with a changed tracing. Give intravenous calcium first","verdict":"correct","feedback":"10 mL of 10 percent calcium gluconate, with the monitor on. Then shift the potassium. Calcium is not the cure.","finding":"Calcium indicated","status":"Calcium ready."},{"id":"fine","label":"A normal tracing. Insulin can wait until the morning","verdict":"wrong","feedback":"Those T waves are not normal, and 7.1 in an anuric patient does not wait."},{"id":"stemi","label":"ST-elevation infarction. Activate the catheter laboratory only","verdict":"wrong","feedback":"The tall waves are T waves, not an ST-elevation infarct pattern to treat instead of the potassium."},{"id":"hypo","label":"Hypokalemia, so give potassium","verdict":"wrong","feedback":"Hypokalemia flattens the T wave. These are peaked. Giving potassium is dangerous.","critical":true}],"image":{"src":"sim/cases/hyperk.jpg","alt":"Name the danger","caption":"Name the danger"}},{"id":"shift","skill":"Decision","title":"Calcium is in. The potassium is still 7.1","lead":"The T waves look a little kinder. The number has not moved. Glucose is 9 mmol/L. He makes no urine.","prompt":"What lowers the potassium?","hint":"Insulin with glucose. A beta-agonist as an adjunct. A resin is not the plan. Dialysis if there is no urine.","guideline":"10 units of regular insulin intravenously, with glucose so the sugar does not crash. Salbutamol can be added. Neither replaces dialysis in an anuric patient who remains high.","answer":"Insulin with glucose","kind":"choice","successFinding":"Insulin given","successStatus":"Glucose watched. Dialysis called.","missYou":"Not that choice","miss":"Insulin with glucose. A beta-agonist as an adjunct. A resin is not the plan. Dialysis if there is no urine.","choices":[{"id":"ins","label":"Insulin with glucose, and arrange dialysis because he is anuric","verdict":"correct","feedback":"Insulin shifts potassium. It does not remove it for long. Anuria means dialysis. Recheck the glucose.","glucose":140,"finding":"Insulin and dialysis referral","status":"Shifted. Dialysis planned."},{"id":"ca2","label":"More calcium only, every hour, and nothing else","verdict":"wrong","feedback":"Calcium will wear off and the potassium is still 7.1. You have not moved the number."},{"id":"kcl","label":"Potassium in the maintenance fluid","verdict":"wrong","feedback":"Do not put potassium into this patient.","critical":true},{"id":"resin","label":"A resin enema as the only next step","verdict":"wrong","feedback":"A resin is too slow and too weak for this number."}]},{"id":"again","skill":"Reassessment","title":"The QRS widens again at forty minutes","lead":"Insulin is in. The potassium is now 6.4. The QRS, which had narrowed, is wide again.","prompt":"What do you do?","hint":"Calcium wore off. Give it again. The insulin is still doing its job. Do not stop dialysis.","guideline":"Repeat calcium if the electrocardiogram worsens. Keep the shift going. Dialysis removes the potassium his kidney will not.","answer":"Repeat calcium, keep dialysis","kind":"choice","successFinding":"Calcium repeated","successStatus":"QRS narrowing. Dialysis on the way.","missYou":"Not that choice","miss":"Calcium wore off. Give it again. The insulin is still doing its job. Do not stop dialysis.","choices":[{"id":"rep","label":"Repeat the calcium. Do not cancel dialysis","verdict":"correct","feedback":"The membrane needs calcium again. The body still needs the potassium gone.","finding":"Calcium repeated","status":"Electrocardiogram watched. Dialysis continues."},{"id":"stop","label":"Stop everything. 6.4 is close enough and the QRS is his normal","verdict":"wrong","feedback":"A widening QRS is not his normal. And anuria will send the number back up."},{"id":"bic","label":"Sodium bicarbonate as the only drug, stop the insulin","verdict":"wrong","feedback":"Bicarbonate is a weak shift at best, and only when he is acidotic. It does not replace insulin or dialysis."},{"id":"k","label":"A small potassium replacement now that it is 6.4","verdict":"wrong","feedback":"6.4 with a widening QRS is still too much potassium.","critical":true}]}]},{"id":"aki","title":"Acute kidney injury with shock","syndrome":"The kidney is obstructed","minutes":"8 min","difficulty":"Core","available":true,"summary":"He is shocked and the creatinine has jumped. The film is not 'acute tubular necrosis by default.' One kidney is a bag of fluid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/hydro.jpg","patient":"Fever, a stone history, and no urine for eight hours","ageSex":"63-year-old man","chart":["Teaching case. Not a prescription.","Creatinine was 0.9 mg/dL last month and is 3.6 today. Right loin pain. Lactate 4. Systolic pressure 82 after a small fluid start."],"opening":{"lkwMin":20,"status":"Febrile, loin pain, oliguric.","sbp":82,"dbp":50,"hr":124,"rr":26,"spo2":94,"glucose":154},"stages":[{"id":"study","skill":"Investigation","title":"What must the image answer?","lead":"You are treating shock. The creatinine has quadrupled and he has loin pain.","prompt":"What do you need to see?","hint":"Whether the collecting system is blocked. A blocked infected kidney is a surgical abscess.","guideline":"Imaging for obstruction is part of acute kidney injury when the story suggests a stone or a single functioning kidney. Infected obstruction is drained, not dosed away.","answer":"Image the kidneys","kind":"choice","successFinding":"Imaged","successStatus":"The scan is up.","missYou":"Not that choice","miss":"Whether the collecting system is blocked. A blocked infected kidney is a surgical abscess.","choices":[{"id":"img","label":"Image the kidneys now. Do not call this tubular necrosis yet","verdict":"correct","feedback":"Loin pain and anuria earn a look. Ultrasound is usual. This CT is what you have, and it answers the question.","finding":"Kidneys imaged","status":"Scan on the screen."},{"id":"atn","label":"Label it tubular necrosis and never image","verdict":"wrong","feedback":"You will miss a drainable obstruction. That kidney can kill him."},{"id":"dop","label":"Renal-dose dopamine instead of imaging","verdict":"wrong","feedback":"There is no useful renal-dose dopamine."},{"id":"ignore","label":"The creatinine can wait until tomorrow's ward round","verdict":"wrong","feedback":"He is shocked, febrile, and anuric. Tomorrow is a septic death.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the obstructed kidney","lead":"The marker R is on the left of the screen, so that side is the patient's right. One kidney ise","verdict":"correct","feedback":"Drain it. Culture the urine you get. Cover gram-negative organisms. Support the pressure.","finding":"Obstructed, infected kidney","status":"Urology and a pressor."},{"id":"pre","label":"Pre-renal. Another two litres will open it","verdict":"wrong","feedback":"A sac of fluid under pressure is not a dry kidney. More fluid will not empty the pelvis."},{"id":"atn","label":"Tubular necrosis from shock, so no drainage","verdict":"wrong","feedback":"Tubular necrosis may also be present. It does not cancel a blocked, infected kidney.","critical":true},{"id":"gn","label":"Glomerulonephritis. High-dose steroid first","verdict":"wrong","feedback":"This picture is a dilated collecting system, not a glomerulus. A steroid delays the drain."}],"image":{"src":"sim/cases/hydro.jpg","alt":"Name the kidney injury","caption":"Name the kidney injury"}},{"id":"do","skill":"Decision","title":"Who does what?","lead":"Pressure is 82 after a cautious fluid start. The lactate is 4. You have a culture cooking.","prompt":"What is the plan?","hint":"Norepinephrine, an antibiotic, and drainage. Not dopamine.","guideline":"Source control is the drainage. Norepinephrine if the pressure remains low after a modest fluid. Do not chase a creatinine with dialysis before the ureter is open, unless potassium, acid, or fluid overload forces you.","answer":"Drain, antibiotic, norepinephrine","kind":"choice","successFinding":"Bundle started","successStatus":"Pressure rising. Drain being arranged.","missYou":"Not that choice","miss":"Norepinephrine, an antibiotic, and drainage. Not dopamine.","choices":[{"id":"all","label":"Drainage, an antibiotic, and norepinephrine for the pressure","verdict":"correct","feedback":"All three. Dialysis is not the substitute for a nephrostomy.","sbp":100,"finding":"Drainage and norepinephrine","status":"Pressure 100. Urology on the way."},{"id":"dop","label":"Dopamine at 2 micrograms and no drainage","verdict":"wrong","feedback":"That infusion does not exist as a renal rescue, and the pelvis stays blocked.","critical":true},{"id":"fluid","label":"Thirty millilitres per kilogram more, no pressor, no drain","verdict":"wrong","feedback":"He has already had fluid and he is obstructed. More fluid is not source control."},{"id":"hd","label":"Hemodialysis now, and leave the stone until next week","verdict":"wrong","feedback":"You can dialyze the number and still leave pus under pressure. Drain the kidney."}]},{"id":"day","skill":"Reassessment","title":"The creatinine is still 3.2 the next morning","lead":"The nephrostomy is draining. He is warmer. Potassium is 4.8. He is off the norepinephrine. Someone wants dialysis because the number is not normal.","prompt":"Do you dialyze for the number?","hint":"No, if the potassium, the acid, the volume, and the drugs are safe. The creatinine lags.","guideline":"Dialysis is for a reason: potassium, acid, volume, or a toxin. A creatinine that has not yet fallen the morning after drainage is not, by itself, a reason.","answer":"No dialysis for a number","kind":"choice","successFinding":"Observed","successStatus":"Urine draining. Number watched.","missYou":"Not that choice","miss":"No, if the potassium, the acid, the volume, and the drugs are safe. The creatinine lags.","choices":[{"id":"no","label":"No. He is safe. The creatinine will lag the drainage","verdict":"correct","feedback":"Watch the potassium, the bicarbonate, and the volume. Do not dialyze a label.","finding":"Dialysis not required","status":"Draining. Off the vasopressor."},{"id":"yes","label":"Dialyze because any creatinine over 3 needs a machine","verdict":"wrong","feedback":"There is no such threshold. He has a drain and a safe potassium."},{"id":"out","label":"Remove the nephrostomy tonight because the number disappointed you","verdict":"wrong","feedback":"The tube is why he is alive. Do not pull it."},{"id":"fluid","label":"A large fluid bolus to wash the creatinine down","verdict":"wrong","feedback":" ,"verdict":"wrong","feedback":"You would drain one space and leave the body overloaded. And a drain is not the first move.","critical":true},{"id":"fluid","label":"A fluid bolus for the hypoxia","verdict":"wrong","feedback":"He is 4 kg up and anuric. Fluid is the disease.","critical":true},{"id":"home","label":"Oral furosemide and home","verdict":"wrong","feedback":"Anuric means the furosemide has nowhere to work. He needs a filter or a kidney machine."}]},{"id":"click","skill":"Localization","title":"Click the effusion","lead":"One hemithorax is white and the other still has air. He is sitting, and the white side is the water.","prompt":"Click the opaque hemithorax.","hint":"The white side is the effusion. The dark side still has lung markings.","guideline":"A large effusion in missed dialysis is usually water. Fever, a very acid pH on a tap, or pus would change that. He has no fever.","answer":"Large pleural effusion","image":{"src":"sim/cases/effusion.jpg","alt":"Chest radiograph. One hemithorax is opaque.","caption":"One side is white."},"kind":"hotspot","successFinding":"Large effusion","successStatus":"Large effusion","missYou":"Clicked the aerated lung","miss":"That side still has air. The effusion is the white hemithorax.","regions":[{"id":"white","verdict":"correct","cx":0.72,"cy":0.52,"rx":0.18,"ry":0.26,"you":"Opaque hemithorax","feedback":"That white side is the effusion."},{"id":"air","verdict":"wrong","cx":0.22,"cy":0.42,"rx":0.12,"ry":0.16,"you":"The aerated lung","feedback":"That lung is the one that is still working. Click the white side."}]},{"id":"name","skill":"Interpretation","title":"What is the white side?","lead":"No fever. Four kilograms up. Anuric.","prompt":"What is it, most likely?","hint":"A transudative effusion from overload. Not an empyema to drain tonight.","guideline":"Dialysis removes the water from both the vessels and, more slowly, the pleura. Oxygen or non-invasive ventilation holds him until the machine runs.","answer":"Overload effusion","kind":"choice","successFinding":"Volume overload","successStatus":"Dialysis, not a drain.","missYou":"Not that choice","miss":"A transudative effusion from overload. Not an empyema to drain tonight.","choices":[{"id":"vol","label":"Pleural effusion from missed dialysis","verdict":"correct","feedback":"Treat the body water. Do not stab the chest as the first procedure.","finding":"Overload effusion","status":"Waiting for dialysis. Oxygen on."},{"id":"emp","label":"Empyema. A large drain tonight, no dialysis","verdict":"wrong","feedback":"There is no fever and the story is missed sessions. A drain does not replace the machine."},{"id":"pna","label":"Pneumonia. Antibiotics only","verdict":"wrong","feedback":"A whole hemithorax of white in an anuric patient is water until a tap says otherwise. Antibiotics do not remove 4 kg."},{"id":"ptx","label":"Pneumothorax","verdict":"wrong","feedback":"Pneumothorax is black. This side is white."}],"image":{"src":"sim/cases/effusion.jpg","alt":"What is the white side?","caption":"What is the white side?"}},{"id":"rx","skill":"Decision","title":"He is on a mask at 92 percent","lead":"Dialysis can start within the hour. The potassium is 5.4. He is tiring a little.","prompt":"What do you do while the machine is set up?","hint":"Oxygen or non-invasive ventilation. Not a chest drain. Not fluid.","guideline":"Non-invasive ventilation is reasonable if he is tiring. Urgent dialysis is the treatment. A tap is for doubt, not for a clear overload story.","answer":"Support the breathing, dialyze","kind":"choice","successFinding":"Dialysis starting","successStatus":"Mask on.","missYou":"Not that choice","miss":"Oxygen or non-invasive ventilation. Not a chest drain. Not fluid.","choices":[{"id":"hd","label":"Non-invasive ventilation if he tires, and urgent dialysis. No chest drain","verdict":"correct","feedback":"Take the water out of the body. Reassess the effusion after. Most of these do not need a drain.","spo2":94,"finding":"Urgent dialysis","status":"Dialysis starting."},{"id":"drain","label":"A 28 French drain before dialysis","verdict":"wrong","feedback":"You can collapse a lung and still have an overloaded patient. Drainage is not first.","critical":true},{"id":"fur","label":"Intravenous furosemide 250 mg and cancel dialysis","verdict":"wrong","feedback":"He is anuric. A large diuretic dose will not make urine that the kidney cannot make."},{"id":"fluid","label":"A bolus, because non-invasive ventilation drops the pressure sometimes","verdict":"wrong","feedback":"If the mask drops the pressure, turn the pressures down or fill the veins carefully. He is not empty. He is 4 kg up."}]},{"id":"after","skill":"Reassessment","title":"After dialysis he is better and the film is not clear","lead":"Two litres off. Oxygen 95 percent on nasal prongs. The effusion is smaller but still there. Someone books a chest drain for the morning.","prompt":"Does he need that drain?","hint":"Not if he is breathing and there is no infection. The rest of the water will move.","guideline":"A remaining effusion after a successful dialysis is observed if the breathing is easy. Drain infection or a lung that is still trapped and failing.","answer":"No drain","kind":"choice","successFinding":"Observed","successStatus":"Breathing. No drain.","missYou":"Not that choice","miss":"Not if he is breathing and there is no infection. The rest of the water will move.","choices":[{"id":"no","label":"No drain. He is breathing. Repeat the film if he worsens","verdict":"correct","feedback":"The machine was the treatment. A drain now adds a hole and no benefit.","spo2":95,"finding":"Drain avoided","status":"Better after dialysis."},{"id":"yes","label":"Drain it because any remaining white is a failure","verdict":"wrong","feedback":"White that is shrinking, in a comfortable patient, is not an indication."},{"id":"fluid","label":"Replace the two litres you removed","verdict":"wrong","feedback":"You removed them on purpose. Putting them back recreates the effusion."},{"id":"stop","label":"Stop future dialysis. One session fixed him","verdict":"wrong","feedback":"He missed sessions because he needs them. Book the next one."}]}]},{"id":"variceal","title":"Variceal bleeding","syndrome":"Known cirrhosis, vomiting blood","minutes":"8 min","difficulty":"Core","available":true,"summary":"The endoscope shows columns of varices. Restrict the transfusion, give terlipressin and an antibiotic, and band them.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/varices-wale.jpg","patient":"Hematemesis, known cirrhosis","ageSex":"52-year-old man","chart":["Teaching case. Not a prescription.","Hemoglobin 6.8 g/dL. Drowsy, vomiting blood. No fever. Systolic pressure 88."],"opening":{"lkwMin":20,"status":"Drowsy, vomiting blood.","sbp":88,"dbp":54,"hr":124,"rr":24,"spo2":94,"glucose":108,"gcs":"E3 V4 M6"},"stages":[{"id":"first","skill":"Action","title":"What comes before the picture?","lead":"He is vomiting blood and he is drowsy. The endoscopy room is being opened.","prompt":"What do you do first?","hint":"Protect the airway if he cannot, two lines of access, and do not pour in crystalloid as if it were blood.","guideline":"Massive upper gastrointestinal bleeding with a falling conscious level needs an airway. Blood is transfused to a restrictive target, about 7 to 8 g/dL, not toward 10.","answer":"Airway and access","kind":"choice","successFinding":"Airway assessed","successStatus":"Access in. Calling for blood.","missYou":"Not that choice","miss":"Protect the airway if he cannot, two lines of access, and do not pour in crystalloid as if it were blood.","choices":[{"id":"air","label":"Assess the airway, two large cannulae, and a restrictive transfusion plan","verdict":"correct","feedback":"If he keeps vomiting and stays drowsy, intubate before the endoscope. Transfuse because 6.8 is under the trigger. Do not aim at 10.","finding":"Airway and access","status":"Blood requested. Endoscopy being opened."},{"id":"cryst","label":"Two litres of saline and no blood","verdict":"wrong","feedback":"Saline does not carry oxygen and it can raise the portal pressure. He needs blood, carefully.","critical":true},{"id":"hb10","label":"Transfuse until the hemoglobin is 10, then scope tomorrow","verdict":"wrong","feedback":"A target near 10 worsens portal hypertension. And tomorrow is another bleed."},{"id":"ng","label":"A nasogastric lavage as the only treatment","verdict":"wrong","feedback":"Lavage is not hemostasis."}]},{"id":"click","skill":"Localization","title":"Click the varix","lead":"The lumen is filled by columns of mucosa that bulge inward. There is a little fresh blood.","prompt":"Click a varix.","hint":"The varices are the bulging columns, not the black corner outside the scope.","guideline":"Esophageal varices are banded. The drug and the antibiotic start before the band, and they do not replace it.","answer":"Esophageal varix","image":{"src":"sim/cases/varices-wale.jpg","alt":"Endoscopy. Columns of esophageal varices.","caption":"Variceal columns."},"kind":"hotspot","successFinding":"Varices","successStatus":"Varices","missYou":"Clicked outside the lumen","miss":"Stay on the bulging columns inside the esophagus.","regions":[{"id":"v","verdict":"correct","cx":0.5,"cy":0.58,"rx":0.28,"ry":0.24,"you":"Varix","feedback":"Those bulging columns are varices."},{"id":"out","verdict":"wrong","cx":0.06,"cy":0.08,"rx":0.05,"ry":0.05,"you":"Outside the picture","feedback":"That corner is not the mucosa. Click a column."}]},{"id":"name","skill":"Interpretation","title":"Name the bleed","lead":"Known cirrhosis, hematemesis, and these columns.","prompt":"What is bleeding?","hint":"Varices. Not a duodenal ulcer, until a full look says otherwise. The bundle is still the variceal bundle.","guideline":"Terlipressin, an antibiotic, and band ligation. Octreotide is the alternative if terlipressin is unavailable. A proton-pump infusion does not replace banding.","answer":"Variceal hemorrhage","kind":"choice","successFinding":"Varices","successStatus":"Bundle starting.","missYou":"Not that choice","miss":"Varices. Not a duodenal ulcer, until a full look says otherwise. The bundle is still the variceal bundle.","choices":[{"id":"var","label":"Esophageal varices","verdict":"correct","feedback":"Start the bundle and band. Do not wait for the band to start the drug and the antibiotic.","finding":"Variceal bleed","status":"Terlipressin and an antibiotic being drawn."},{"id":"ulcer","label":"A clean duodenal ulcer. Oral omeprazole and home","verdict":"wrong","feedback":"The columns are varices, he is shocked, and home is not a destination.","critical":true},{"id":"mw","label":"A Mallory-Weiss tear. No drug, no scope","verdict":"wrong","feedback":"You are looking at varices. A tear is a different lesion, and he still needs endoscopy."},{"id":"nose","label":"Swallowed nosebleed","verdict":"wrong","feedback":"The lesion is in the esophagus."}],"image":{"src":"sim/cases/varices-wale.jpg","alt":"Name the bleed","caption":"Name the bleed"}},{"id":"bundle","skill":"Decision","title":"Set the bundle","lead":"The airway is protected. Hemoglobin is 6.8. The endoscopist is scrubbing.","prompt":"What do you give?","hint":"Terlipressin, ceftriaxone, restrictive blood, then bands.","guideline":"Terlipressin 2 mg intravenously, then 1 to 2 mg every four to six hours. Ceftriaxone 1 g daily. Band the varix. Do not aim the hemoglobin at 10.","answer":"Terlipressin, ceftriaxone, banding","kind":"choice","successFinding":"Bundle running","successStatus":"Being banded.","missYou":"Not that choice","miss":"Terlipressin, ceftriaxone, restrictive blood, then bands.","choices":[{"id":"all","label":"Terlipressin, ceftriaxone, transfuse toward 7 to 8, and band","verdict":"correct","feedback":"That is the first-day bundle. A balloon is not the first endoscope.","sbp":100,"finding":"Variceal bundle","status":"Banding. Drugs running."},{"id":"ppi","label":"A proton-pump infusion only, no band, no vasoactive drug","verdict":"wrong","feedback":"A proton-pump drug does not close a varix. He needs the bundle."},{"id":"ten","label":"Transfuse to a hemoglobin of 10 before anyone scopes","verdict":"wrong","feedback":"Over-transfusion raises portal pressure and rebleeding."},{"id":"scl","label":"Surgical shunt tonight, no endoscopy","verdict":"wrong","feedback":"Endoscopic banding is first. A shunt or TIPS is for the failure of endoscopy, not the opening move."}]},{"id":"re","skill":"Reassessment","title":"He rebleeds at twelve hours","lead":"Bands are on. He vomits blood again and the pressure falls to 80.","prompt":"What is the bridge?","hint":"A balloon tamponade tube as a bridge to a repeat endoscopy or to TIPS. Not a splenectomy on the ward.","guideline":"Balloon tamponade controls bleeding for a short time so a definitive procedure can happen. It is not a treatment you leave in for a day. Airway protection is mandatory.","answer":"Balloon as a bridge","kind":"choice","successFinding":"Balloon planned","successStatus":"Airway protected. Bridge to TIPS.","missYou":"Not that choice","miss":"A balloon tamponade tube as a bridge to a repeat endoscopy or to TIPS. Not a splenectomy on the ward.","choices":[{"id":"ball","label":"Protect the airway and place a balloon as a bridge to TIPS or a senior relook","verdict":"correct","feedback":"The balloon is temporary. Someone who can do TIPS, or a very experienced relook, is the destination.","sbp":84,"gcs":"E2 V1 M5","finding":"Balloon bridge","status":"Airway secured. Balloon as a bridge."},{"id":"home","label":"More terlipressin only, and the ward","verdict":"wrong","feedback":"He is bleeding again at a pressure of 80. The ward is the wrong room.","critical":true},{"id":"splen","label":"Immediate splenectomy","verdict":"wrong","feedback":"Splenectomy is not the rescue for esophageal varices."},{"id":"hb","label":"Transfuse to 12 so the bands hold","verdict":"wrong","feedback":"A high hemoglobin target makes portal bleeding worse."}]}]},{"id":"malaria","title":"Severe malaria","syndrome":"A ring and a schizont","minutes":"8 min","difficulty":"Core","available":true,"summary":"Fever after travel. The sugar is 48 mg/dL. The film has parasites. The drug is artesunate.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/malaria.jpg","patient":"Fever, confusion, returned from a malaria area","ageSex":"34-year-old man","chart":["Teaching case. Not a prescription.","Glucose 48 mg/dL. Hemoglobin 7.2 g/dL. Lactate 5. No rash. Systolic pressure 86."],"opening":{"lkwMin":20,"status":"Febrile, confused, shocked.","sbp":86,"dbp":50,"hr":122,"rr":28,"spo2":94,"glucose":48,"gcs":"E3 V4 M5"},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at?","lead":"The glucose is already low. Treat that while the smear is made. Do not wait for a laboratory report to give sugar.","prompt":"Which study makes the diagnosis?","hint":"A blood film. Give dextrose now, in parallel.","guideline":"Severe malaria is a positive film plus a severity criterion: shock, low sugar, low hemoglobin, coma, lactate, or a high parasite count. Artesunate is the drug.","answer":"Blood film, and dextrose now","kind":"choice","successFinding":"Film and sugar","successStatus":"Dextrose running. Film on the microscope.","missYou":"Not that choice","miss":"A blood film. Give dextrose now, in parallel.","choices":[{"id":"film","label":"Blood film now, and intravenous dextrose for the glucose of 48","verdict":"correct","feedback":"Do not wait for the smear to treat the sugar. Do not wait for the sugar to make the smear.","glucose":110,"finding":"Film and dextrose","status":"Sugar corrected. Looking at the film."},{"id":"ct","label":"CT of the head first, no film, no sugar","verdict":"wrong","feedback":"Coma in a returning traveler with a glucose of 48 is sugar and malaria until proved otherwise. CT delays both."},{"id":"abx","label":"Antibiotics only, no film","verdict":"wrong","feedback":"Antibiotics do not kill Plasmodium. You still need the film, and you still need artesunate if it is positive."},{"id":"wait","label":"Observe the fever curve until tomorrow","verdict":"wrong","feedback":"Shock, coma, and a glucose of 48 do not wait.","critical":true}]},{"id":"click","skill":"Localization","title":"Click the parasite","lead":"Most cells are empty. One cell near the lower middle is packed with a purple schizont. Rings sit off to the right.","prompt":"Click a malaria parasite.","hint":"The dense purple cluster inside a red cell is a schizont. The smaller rings are parasites too.","guideline":"Falciparum can hide, so one film does not exclude it. A visible schizont means the infection is serious. Artesunate is intravenous.","answer":"Malaria parasite","image":{"src":"sim/cases/malaria.jpg","alt":"Blood film. A schizont and ring forms.","caption":"Parasites inside red cells."},"kind":"hotspot","successFinding":"Film positive","successStatus":"Film positive","missYou":"Clicked an empty red cell","miss":"Empty cells are the pale discs. The parasite is the purple structure inside a cell. The large one is a schizont.","regions":[{"id":"sch","verdict":"correct","cx":0.58,"cy":0.63,"rx":0.08,"ry":0.08,"you":"Schizont","feedback":"That packed purple cell is a schizont."},{"id":"ring","verdict":"correct","cx":0.86,"cy":0.55,"rx":0.07,"ry":0.08,"you":"Ring form","feedback":"Those small rings are parasites too."},{"id":"empty","verdict":"wrong","cx":0.2,"cy":0.3,"rx":0.06,"ry":0.06,"you":"An empty red cell","feedback":"That disc has no parasite. Look for the purple chromatin."}]},{"id":"name","skill":"Interpretation","title":"Name the emergency","lead":"Shock, low sugar, anemia, and parasites on the film.","prompt":"How severe is this?","hint":"Severe malaria. Not uncomplicated fever.","guideline":"Intravenous artesunate is 2.4 mg/kg at 0, 12, and 24 hours, then daily until he can take oral treatment. Quinine is the alternative only if artesunate is truly unavailable. Steroids are not used.","answer":"Severe falciparum malaria","kind":"choice","successFinding":"Severe malaria","successStatus":"Artesunate next.","missYou":"Not that choice","miss":"Severe malaria. Not uncomplicated fever.","choices":[{"id":"sev","label":"Severe malaria","verdict":"correct","feedback":"More than one severity criterion, and a positive film. Intravenous artesunate.","finding":"Severe malaria","status":"Artesunate being prepared."},{"id":"mild","label":"Uncomplicated malaria. Oral drug and home","verdict":"wrong","feedback":"He is shocked and he was hypoglycemic. This is severe. Home is unsafe.","critical":true},{"id":"bac","label":"Bacterial sepsis only. The purple dots are stain debris","verdict":"wrong","feedback":"A schizont is not debris. Bacteria may coexist, but they do not replace artesunate."},{"id":"den","label":"Dengue. No antimalarial","verdict":"wrong","feedback":"Dengue does not put a schizont in a red cell."}],"image":{"src":"sim/cases/malaria.jpg","alt":"Name the emergency","caption":"Name the emergency"}},{"id":"drug","skill":"Decision","title":"Which drug?","lead":"Artesunate is in the cupboard. Quinine is too. He can have either, and someone suggests a steroid for the brain.","prompt":"What do you give?","hint":"Artesunate. Dextrose you have already started. No steroid.","guideline":"Artesunate is preferred over quinine. Do not use a steroid. Watch the glucose again. A bacterial antibiotic is added only if you also suspect a bacterial infection, and it does not replace artesunate.","answer":"Intravenous artesunate","kind":"choice","successFinding":"Artesunate given","successStatus":"First dose in.","missYou":"Not that choice","miss":"Artesunate. Dextrose you have already started. No steroid.","choices":[{"id":"art","label":"Intravenous artesunate 2.4 mg/kg. No steroid","verdict":"correct","feedback":"Dose at 0, 12, and 24 hours. Recheck the glucose. Do not add dexamethasone.","finding":"Artesunate","status":"First dose running."},{"id":"quin","label":"Quinine, because it is what you remember, and artesunate is in the cupboard","verdict":"wrong","feedback":"If artesunate is available it is the better drug. Do not choose the older one out of habit."},{"id":"ster","label":"Dexamethasone for cerebral malaria","verdict":"wrong","feedback":"Steroids harm cerebral malaria. They are not adjuncts.","critical":true},{"id":"oral","label":"Oral artemether-lumefantrine only, and the ward","verdict":"wrong","feedback":"He is in shock. Severe malaria is intravenous until he can reliably swallow and the severity has settled."}]},{"id":"hour","skill":"Reassessment","title":"Twelve hours later the parasite count is higher","lead":"He is warmer. Glucose is 110. The laboratory says the parasite count has risen since the first dose.","prompt":"Do you stop artesunate?","hint":"No. Counts often rise early as parasites leave the tissues. Continue the schedule.","guideline":"Do not switch off artesunate because the twelve-hour count rose. Give the scheduled dose. Keep checking glucose. Oral treatment comes only when he can take it and the severity has gone.","answer":"Continue artesunate","kind":"choice","successFinding":"Dose continued","successStatus":"Still intravenous.","missYou":"Not that choice","miss":"No. Counts often rise early as parasites leave the tissues. Continue the schedule.","choices":[{"id":"go","label":"Give the twelve-hour dose. A rising early count is expected","verdict":"correct","feedback":"Stay on the schedule. Recheck the sugar and the lactate. Do not declare failure at twelve hours.","finding":"Artesunate continued","status":"On schedule."},{"id":"stop","label":"Stop artesunate. It has failed","verdict":"wrong","feedback":"An early rise is not failure. Stopping leaves him untreated.","critical":true},{"id":"ster","label":"Add a steroid because the count rose","verdict":"wrong","feedback":"A steroid is not salvage therapy in malaria."},{"id":"oral","label":"Switch to oral now, while he is still on a vasopressor","verdict":"wrong","feedback":"He is not ready for oral treatment. Finish the intravenous schedule."}]}]},{"id":"ttp","title":"Thrombotic thrombocytopenic purpura","syndrome":"Fragments on the film","minutes":"8 min","difficulty":"Core","available":true,"summary":"Platelets of 11, confusion, and a fever. The film has broken red cells. Plasma exchange now. Do not transfuse platelets.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/schist.jpg","patient":"Confusion, fever, a bruise, and dark urine","ageSex":"41-year-old woman","chart":["Teaching case. Not a prescription.","Platelets 11 \u00d7 10\u2079/L. Hemoglobin 8.1 g/dL. Creatinine 2.8 mg/dL. Fever. No heparin exposure."],"opening":{"lkwMin":20,"status":"Confused, febrile.","sbp":128,"dbp":78,"hr":110,"rr":20,"spo2":97,"glucose":104,"gcs":"E3 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at tonight?","lead":"The count is already 11. You need the red-cell shape, and you must not wait a day for a send-away test before treating.","prompt":"Which study do you read tonight?","hint":"The blood film. ADAMTS13 is sent, and it does not delay plasma exchange.","guideline":"TTP is a clinical diagnosis: microangiopathic hemolysis, thrombocytopenia, and organ injury. Plasma exchange starts before the ADAMTS13 returns.","answer":"Blood film","kind":"choice","succe re schistocytes."},{"id":"scale","verdict":"wrong","cx":0.9,"cy":0.95,"rx":0.08,"ry":0.04,"you":"The scale mark","feedback":"That is a printed scale, not a cell."}]},{"id":"name","skill":"Interpretation","title":"Name the emergency","lead":"Fragments, platelets of 11, confusion, fever, and a rising creatinine.","prompt":"What is the working diagnosis?","hint":"TTP. Plasma exchange. Not ITP, and not a platelet transfusion.","guideline":"Start plasma exchange the hour you think of TTP. Caplacizumab and steroids are additions. Platelets are contraindicated unless there is life-threatening bleeding.","answer":"TTP","kind":"choice","successFinding":"TTP","successStatus":"Exchange being arranged.","missYou":"Not that choice","miss":"TTP. Plasma exchange. Not ITP, and not a platelet transfusion.","choices":[{"id":"ttp","label":"Thrombotic thrombocytopenic purpura","verdict":"correct","feedback":"Do not wait for the confirmatory test. Call for plasma exchange.","finding":"TTP","status":"Plasma exchange requested."},{"id":"itp","label":"Immune thrombocytopenia. Platelets and a steroid, no exchange","verdict":"wrong","feedback":"Immune thrombocytopenia does not break the red cells and does not raise the creatinine like this. Platelets here are harmful.","critical":true},{"id":"dic","label":"DIC from sepsis, so only an antibiotic","verdict":"wrong","feedback":"There is no septic focus in the story, and DIC is not treated by ignoring plasma exchange when the picture is TTP. If you truly think TTP, exchange."},{"id":"hh","label":"Hypothyroidism","verdict":"wrong","feedback":"Nothing on the film is a thyroid test."}],"image":{"src":"sim/cases/schist.jpg","alt":"Name the emergency","caption":"Name the emergency"}},{"id":"rx","skill":"Decision","title":"The line is difficult","lead":"The count is 11. The operator wants a platelet transfusion 'to cover the dialysis catheter.' There is no bleeding.","prompt":"What do you say?","hint":"No platelets. Experienced hands, and exchange. A t choice","miss":"Continue daily exchange. The count lags. Do not transfuse.","choices":[{"id":"go","label":"Continue daily plasma exchange. Do not transfuse platelets","verdict":"correct","feedback":"Response takes more than one session. Send the ADAMTS13 if it is not already gone, and do not stop.","finding":"Exchange continued","status":"Daily exchange."},{"id":"stop","label":"Stop. One session should have normalized the count","verdict":"wrong","feedback":"That expectation is wrong. Stopping now is how the thrombi return.","critical":true},{"id":"plt","label":"Transfuse up to 50 so the number looks better","verdict":"wrong","feedback":"The number is not the goal of a transfusion. Platelets are still dangerous.","critical":true},{"id":"once","label":"One more exchange next week","verdict":"wrong","feedback":"The schedule is daily, not weekly, while she is acute."}]}]},{"id":"ulcer","title":"Duodenal ulcer","syndrome":"Non-variceal bleed","minutes":"8 min","difficulty":"Core","available":true,"summary":"Hematemesis, and no known varices. The endoscope shows an ulcer with a flat pigmented spot. A proton-pump inhibitor, not the variceal bundle.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/ulcer.jpg","patient":"Vomiting blood for two hours","ageSex":"57-year-old man","chart":["Teaching case. Not a prescription.","No known liver disease. Hemoglobin 8.2 g/dL. Urea 48 mg/dL. Taking ibuprofen for a week."],"opening":{"lkwMin":40,"status":"Pale. Fresh blood in the vomit.","sbp":98,"dbp":62,"hr":114,"rr":20,"spo2":98,"glucose":112,"gcs":"E4 V5 M6"},"stages":[{"id":"resus","skill":"Resuscitation","title":"Before the picture","lead":"He is tachycardic and still vomiting blood. The endoscope is being set up.","prompt":"What do you do first?","hint":"Access, blood, and a restrictive transfusion. Do not treat every hematemesis as varices.","guideline":"Non-variceal bleeding is resuscitated to a hemoglobin around 7 g/dL, and scoped. Terlipressin and a balloon are for varices.","answer":"Access, blood, restrictive transfusion, endoscopy","kind":"choice","successFinding":"Resuscitation started","successStatus":"Blood requested. Endoscopy being opened.","missYou":"Not that plan","miss":"Access and blood. A litre of saline is not a transfusion, and the variceal bundle is the wrong disease.","choices":[{"id":"blood","label":"Two large cannulae, crossmatch, and transfuse toward a hemoglobin of 7. Endoscopy today, sooner if he stays unstable.","verdict":"correct","feedback":"Restrictive transfusion, and a scope while he is still bleeding. Not a target of 10.","finding":"Access and blood","status":"Blood on the way. Endoscopy opened."},{"id":"saline","label":"Two litres of saline and no blood","verdict":"wrong","feedback":"Saline does not carry oxygen. He is bleeding.","critical":true},{"id":"varix","label":"Terlipressin and a balloon, and cancel the endoscopy, because every hematemesis is variceal","verdict":"wrong","feedback":"He has no known varices. The endoscope is how you find out. A balloon is not a treatment for an ulcer.","critical":true},{"id":"ten","label":"Transfuse until the hemoglobin is 10, then scope tomorrow","verdict":"wrong","feedback":"A target of 10 is too high, and tomorrow is too late while he is still vomiting blood."}]},{"id":"click","skill":"Localization","title":"Click the ulcer","lead":"The endoscope is in the duodenum. One small crater has a flat pigmented spot. The lower field is bubbles.","prompt":"Click the ulcer crater.","hint":"The pigmented spot is the crater, above the bubbles.","guideline":"A flat pigmented spot is a low-risk stigma. It is not a varix and it is not a spurting vessel.","answer":"Ulcer with a flat pigmented spot","image":{"src":"sim/cases/ulcer.jpg","alt":"Endoscopy. A duodenal ulcer with a flat pigmented spot.","caption":"Duodenal ulcer with a flat pigmented spot."},"kind":"hotspot","successFinding":"Pigmented ulcer spot","successStatus":"The crater is the finding.","missYou":"Clicked off the crater","miss":"The ulcer is the small pigmented crater. The bubbles are air in the lumen.","regions":[{"id":"crater","verdict":"correct","cx":0.42,"cy":0.445,"rx":0.08,"ry":0.065,"you":"Pigmented ulcer crater","feedback":"That flat pigmented spot is the ulcer. It is not spurting."},{"id":"bubbles","verdict":"wrong","cx":0.48,"cy":0.78,"rx":0.18,"ry":0.12,"you":"Bubbles in the lumen","feedback":"Those are bubbles. The ulcer is the pigmented crater above them."}]},{"id":"name","skill":"Diagnosis","title":"Name the bleed","lead":"You are looking at a duodenal ulcer with a flat pigmented spot.","prompt":"What is this?","hint":"Peptic ulcer. Not varices.","guideline":"Forrest IIc is a flat pigmented spot. Active bleeding, a visible vessel, and an adherent clot are the stigmata that need endoscopic therapy.","answer":"Peptic ulcer, flat pigmented spot","kind":"choice","successFinding":"Ulcer named","successStatus":"Proton-pump inhibitor being drawn.","missYou":"Not that lesion","miss":"It is an ulcer with a flat pigmented spot, not a varix.","choices":[{"id":"ulcer","label":"Duodenal ulcer with a flat pigmented spot. Not varices.","verdict":"correct","feedback":"The spot is flat. It is not a column, and it is not a spurting artery.","finding":"Non-variceal ulcer","status":"Ulcer, not varices."},{"id":"varix","label":"Esophageal varices. Start terlipressin and cancel the proton-pump inhibitor.","verdict":"wrong","feedback":"There is no varix on this view. The variceal bundle does not treat an ulcer.","critical":true},{"id":"mw","label":"A Mallory-Weiss tear. No drug, and home.","verdict":"wrong","feedback":"A tear is a mucosal split, not a crater with a pigmented spot."},{"id":"nose","label":"Swallowed nosebleed. The mucosa is normal.","verdict":"wrong","feedback":"The crater is real."}]},{"id":"ppi","skill":"Treatment","title":"What runs now?","lead":"The stigma is a flat pigmented spot. He is no longer pouring blood.","prompt":"Which treatment matches this finding?","hint":"A proton-pump inhibitor. Endoscopic therapy is for spurting, a visible vessel, or a clot, which this still does not show.","guideline":"A flat pigmented spot is managed with a proton-pump inhibitor. Banding and terlipressin treat varices.","answer":"Proton-pump inhibitor","kind":"choice","successFinding":"Proton-pump inhibitor","successStatus":"Inhibitor running.","missYou":"Not that drug","miss":"A proton-pump inhibitor. Do not band a pigmented spot, and do not start terlipressin for an ulcer.","choices":[{"id":"ppi","label":"Intravenous proton-pump inhibitor. No band, and no terlipressin.","verdict":"correct","feedback":"This spot does not need a band. Acid suppression is the drug.","finding":"Proton-pump inhibitor","status":"Inhibitor running. Watching the hemoglobin.","sbp":104,"hr":100},{"id":"band","label":"Band the spot, as if it were a varix","verdict":"wrong","feedback":"A band is for a varix. This is an ulcer."},{"id":"terli","label":"Terlipressin as the main plan, and no proton-pump inhibitor","verdict":"wrong","feedback":"Terlipressin is the variceal drug. This bleed is an ulcer.","critical":true},{"id":"surg","label":"Immediate gastrectomy","verdict":"wrong","feedback":"Surgery is not the first act for a flat pigmented spot."}]},{"id":"re","skill":"Reassessment","title":"The hemoglobin is 6.6, and the melena continues","lead":"An hour later he is still tachycardic. The inhibitor is running.","prompt":"What do you change?","hint":"Transfuse toward 7, keep the inhibitor, and repeat the endoscopy if bleeding continues.","guideline":"Ongoing non-variceal bleeding goes back to endoscopy. A balloon does not tamponade a duodenal ulcer.","answer":"Transfuse and repeat endoscopy if it continues","kind":"choice","successFinding":"Transfusion rep
