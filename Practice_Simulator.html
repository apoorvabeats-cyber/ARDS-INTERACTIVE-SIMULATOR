"The film shows a fully expanded lung. There has been no bubble and no swing for a proper interval. He is walking with oxygen off.","prompt":"What now?","hint":"Remove the tube. Do not send him home with it. Do not start a blood thinner tonight because a line caused this.","guideline":"A resolved iatrogenic pneumothorax with no leak can lose its drain. Anticoagulation is a separate question and not a same-hour reflex.","answer":"Remove the drain","kind":"choice","successFinding":"Drain removed","successStatus":"Lung up. Tube out.","missYou":"Not that decision","miss":"Remove the tube. Do not send him home with it. Do not start a blood thinner tonight because a line caused this.","choices":[{"id":"ok","label":"Remove the drain. Do not anticoagulate him for the line","verdict":"correct","feedback":"The complication is over. A blood thinner does not belong to a pneumothorax.","finding":"Drain removed","status":"Lung up. Tube out."},{"id":"w0","label":"Leave the tube for a week, for safety","verdict":"wrong","feedback":"A healed pleura does not need a week of plastic."},{"id":"w1","label":"Heparin tonight, because central lines cause clots","verdict":"wrong","feedback":"This complication was air, not clot."},{"id":"w2","label":"Put the tube back if he coughs once","verdict":"wrong","feedback":"One cough is not a recurrence."}]}]},{"id":"pe","title":"Pulmonary embolism","syndrome":"Hypoxic, pressure is holding","minutes":"14 min","difficulty":"Core","available":true,"summary":"Sudden dyspnea and a clear chest. The pressure is 124, so this is not a lysis case yet.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/pe.jpg","patient":"Sudden dyspnea on day six after a fracture","ageSex":"70-year-old woman","chart":["Teaching case. Not a prescription.","Oxygen 90 percent on air. Chest is clear. No hemoptysis. Systolic pressure 124. Heart rate 112. Recent surgery was a week ago, bleeding has stopped."],"opening":{"lkwMin":20,"status":"Hypoxic, clear lungs, pressure holding.","sbp":124,"dbp":78,"hr":112,"rr":24,"spo2":90,"glucose":106},"stages":[{"id":"study","skill":"Investigation","title":"Which study?","lead":"The probability is high. A D-dimer will not change your mind, and she is well enough to lie flat.","prompt":"What do you request?","hint":"CT pulmonary angiography when the probability is high and the pressure allows it.","guideline":"Do not use a D-dimer to exclude embolism when the pretest probability is already high. Do not thrombolyse a pressure of 124.","answer":"CT pulmonary angiogram","kind":"choice","successFinding":"Angiogram done","successStatus":"On the table. Pressure unchanged.","missYou":"Not that choice","miss":"CT pulmonary angiography when the probability is high and the pressure allows it.","choices":[{"id":"ctpa","label":"CT pulmonary angiogram","verdict":"correct","feedback":"She can travel. The angiogram is the study. Anticoagulation should not wait for a long debate if the scan will be delayed, but here the scanner is free.","finding":"CT pulmonary angiogram","status":"Angiogram underway."},{"id":"dimer","label":"D-dimer, and send her home if it is only mildly raised","verdict":"wrong","feedback":"A high-probability embolism is not excluded by a dimer, and a fracture week makes the dimer useless."},{"id":"lyse","label":"Thrombolysis now, before any image","verdict":"wrong","feedback":"Her pressure is 124. Systemic thrombolysis is for shock or persistent hypotension, and it bleeds.","critical":true},{"id":"cxr","label":"A chest film only, then discharge if it is clear","verdict":"wrong","feedback":"A clear film is exactly what embolism looks like. It does not rule it out."}]},{"id":"click","skill":"Localization","title":"Click the clot","lead":"Contrast is in the pulmonary arteries. Dark filling defects sit in the bright lumen. Red arrows were left on this published film.","prompt":"Click a filling defect in a pulmonary artery.","hint":"The clot is the dark gap inside the bright artery, not the bright aorta and not the black lung.","guideline":"A filling defect on CT pulmonary angiography is embolus. Arrows do not change the decision.","answer":"Pulmonary embolus","image":{"src":"sim/cases/pe.jpg","alt":"CT pulmonary angiogram with filling defects in the pulmonary arteries.","caption":"Filling defect in a pulmonary artery."},"kind":"hotspot","successFinding":"Embolus seen","successStatus":"Embolus seen","missYou":"Clicked the wrong structure","miss":"The embolus is a dark defect inside a bright pulmonary artery. The big white circle of the aorta is contrast, not clot.","regions":[{"id":"rpa","verdict":"correct","cx":0.28,"cy":0.48,"rx":0.07,"ry":0.07,"you":"Filling defect","feedback":"That dark gap in the artery is embolus."},{"id":"main","verdict":"correct","cx":0.48,"cy":0.4,"rx":0.06,"ry":0.06,"you":"Filling defect","feedback":"That defect is embolus in the central pulmonary artery."},{"id":"lpa","verdict":"correct","cx":0.72,"cy":0.5,"rx":0.07,"ry":0.07,"you":"Filling defect","feedback":"That dark defect on the other side is embolus too."},{"id":"aorta","verdict":"wrong","cx":0.46,"cy":0.28,"rx":0.08,"ry":0.08,"you":"The opacified aorta","feedback":"That bright circle is the aorta full of contrast. The clot is the dark hole inside a pulmonary artery."}]},{"id":"name","skill":"Interpretation","title":"Name it","lead":"There are filling defects on both sides. Her systolic pressure is still 124.","prompt":"What is this, and how severe is the pressure?","hint":"Embolus, and she is not in shock.","guideline":"Bilateral emboli with a normal pressure are anticoagulated. Thrombolysis is not routine.","answer":"Pulmonary embolism, not in shock","kind":"choice","successFinding":"Pulmonary embolism","successStatus":"Not a lysis case.","missYou":"Not that choice","miss":"Embolus, and she is not in shock.","choices":[{"id":"pe","label":"Pulmonary embolism. The pressure is holding, so this is not a thrombolysis case","verdict":"correct","feedback":"Clot on both sides, systolic pressure 124. Anticoagulate.","finding":"Pulmonary embolism without shock","status":"Anticoagulation decision next."},{"id":"ao","label":"Aortic dissection","verdict":"wrong","feedback":"The aorta on this slice is opacified. The disease is in the pulmonary arteries."},{"id":"mass","label":"Massive embolism because there are two clots, so lyse now","verdict":"wrong","feedback":"Massive means shock, not the number of clots. She is not shocked."},{"id":"pna","label":"Pneumonia","verdict":"wrong","feedback":"The lung windows are not the point. The arteries contain clot."}],"image":{"src":"sim/cases/pe.jpg","alt":"Name it","caption":"Name it"}},{"id":"rx","skill":"Decision","title":"What treatment?","lead":"No active bleeding. The kidney is working. The leg operation was a week ago and the wound is dry.","prompt":"What do you start?","hint":"Anticoagulate. Thrombolysis is for the patient whose pressure fails.","guideline":"Low-molecular-weight heparin if the kidney works and no procedure is imminent. Unfractionated heparin if either is in doubt. An inferior vena cava filter is not the first treatment.","answer":"Anticoagulation","kind":"choice","successFinding":"Anticoagulant started","successStatus":"Heparin running. Pressure 122.","missYou":"Not that choice","miss":"Anticoagulate. Thrombolysis is for the patient whose pressure fails.","choices":[{"id":"ac","label":"Anticoagulate. Low-molecular-weight heparin if the kidney is working","verdict":"correct","feedback":"She is hypoxic but not shocked. Anticoagulation is the treatment. Watch the wound.","sbp":122,"finding":"Anticoagulation","status":"Heparin started."},{"id":"lyse","label":"Alteplase 100 mg over two hours now","verdict":"wrong","feedback":"That dose is for massive embolism with shock. Her pressure is 124, and a recent operation raises the bleeding cost.","critical":true},{"id":"filter","label":"A vena cava filter, and no anticoagulant","verdict":"wrong","feedback":"A filter does not treat the clot already in the lung. She can be anticoagulated."},{"id":"home","label":"Discharge on aspirin","verdict":"wrong","feedback":"Aspirin is not the treatment of acute pulmonary embolism."}]},{"id":"later","skill":"Reassessment","title":"The next morning the pressure is 78","lead":"Overnight she becomes faint. Systolic pressure is 78. The wound is still dry. The CT already showed the clot.","prompt":"What changes?","hint":"Shock from embolism is a different disease from yesterday. Thrombolysis, if nothing else stops you.","guideline":"Persistent hypotension from pulmonary embolism is treated with systemic thrombolysis if there is no high bleeding risk, or with a catheter or surgical embolectomy if there is. Alteplase for this is 100 mg over two hours.","answer":"Thrombolysis for shock","kind":"choice","successFinding":"Shock, so the plan changes","successStatus":"Pressure 78. Thrombolysis decision.","missYou":"Not that choice","miss":"Shock from embolism is a different disease from yesterday. Thrombolysis, if nothing else stops you.","choices":[{"id":"now","label":"She is now in shock. Systemic thrombolysis if the bleeding risk allows it","verdict":"correct","feedback":"Yesterday she was not a lysis case. Today the pressure has failed. Alteplase 100 mg over two hours is the systemic regimen, unless a recent operation makes you choose an embolectomy instead.","sbp":78,"finding":"Shock, thrombolysis considered","status":"Massive embolism physiology."},{"id":"same","label":"Keep the same heparin and add a fluid litre","verdict":"wrong","feedback":"A litre will not move a saddle clot that is now causing shock. The treatment class has changed."},{"id":"stop","label":"Stop all anticoagulation because the pressure fell","verdict":"wrong","feedback":"Stopping the heparin does not treat obstructive shock."},{"id":"aspirin","label":"Add aspirin and observe","verdict":"wrong","feedback":"Aspirin is not rescue therapy for massive embolism."}]},{"id":"c6","skill":"Reassessment","title":"The thrombolysis is running and the pressure returns","lead":"Alteplase is going in for the shock. Systolic pressure is back to 100. Saturation is 93 percent on oxygen. A colleague wants a second dose because the oxygen is not normal.","prompt":"Do you give more lytic?","hint":"No. Finish this dose and anticoagulate. A second thrombolysis is for a second collapse, not for a saturation of 93.","guideline":"The PE dose is 100 mg over 2 hours, once. Anticoagulation follows. Routine catheter clot removal is not required when the shock has resolved.","answer":"No second lytic. Anticoagulate after this dose","kind":"choice","successFinding":"Single thrombolysis","successStatus":"Pressure restored. No second dose.","missYou":"Not that decision","miss":"No. Finish this dose and anticoagulate. A second thrombolysis is for a second collapse, not for a saturation of 93.","choices":[{"id":"ok","label":"Finish the one dose. Then anticoagulate. Do not give a second thrombolysis","verdict":"correct","feedback":"The shock was the indication. It has eased. Oxygen of 93 percent is not another 100 mg.","finding":"Single thrombolysis","status":"Pressure restored. No second dose."},{"id":"w0","label":"Another 100 mg, because she is still on oxygen","verdict":"wrong","feedback":"That is a second full dose without a second arrest."},{"id":"w1","label":"Stop all anticoagulation forever because she had a lytic","verdict":"wrong","feedback":"The lytic is the start. The clot still needs anticoagulation."},{"id":"w2","label":"Straight to surgical embolectomy now that she is stable","verdict":"wrong","feedback":"Stable after lysis is not an indication for an emergency operation."}]},{"id":"c7","skill":"Reassessment","title":"The cannula site is oozing","lead":"A puncture site oozes. Systolic pressure is 108. There is no intracranial symptom and no large hematoma. The alteplase has just finished.","prompt":"What do you do?","hint":"Press on the site. Do not reverse everything for an ooze while the embolism was just in shock. Do not ignore a real bleed.","guideline":"Local pressure for a puncture ooze. Major bleeding is a different decision. A stable patient who just survived a massive embolism still needs anticoagulation once the ooze is controlled.","answer":"Local pressure. Do not reverse a minor ooze","kind":"choice","successFinding":"Site compressed","successStatus":"Ooze controlled. Anticoagulation planned.","missYou":"Not that decision","miss":"Press on the site. Do not reverse everything for an ooze while the embolism was just in shock. Do not ignore a real bleed.","choices":[{"id":"ok","label":"Press on the site. Do not give a full reversal for a minor ooze","verdict":"correct","feedback":"Reversing a life-saving lysis for a wet plaster is how the clot returns.","finding":"Site compressed","status":"Ooze controlled. Anticoagulation planned."},{"id":"w0","label":"Protamine and stop every anticoagulant permanently","verdict":"wrong","feedback":"This is an ooze, not a catastrophic bleed."},{"id":"w1","label":"Ignore it and send her to the ward unsupervised","verdict":"wrong","feedback":"Press on it. Look at her. Then decide."},{"id":"w2","label":"A platelet transfusion for the ooze","verdict":"wrong","feedback":"Platelets are not the missing factor here."}]},{"id":"c8","skill":"Reassessment","title":"The echo the next day is better","lead":"The right ventricle is less dilated. She is on heparin. Saturation is 96 percent on nasal oxygen. Blood pressure is 118 systolic.","prompt":"Does she need a filter in the vena cava?","hint":"No. She can be anticoagulated. A filter is for a clot when anticoagulation is truly impossible.","guideline":"An inferior vena cava filter is not routine after a treated pulmonary embolism. Anticoagulation continues.","answer":"No filter. Continue anticoagulation","kind":"choice","successFinding":"No filter","successStatus":"Anticoagulated. Right ventricle improving.","missYou":"Not that decision","miss":"No. She can be anticoagulated. A filter is for a clot when anticoagulation is truly impossible.","choices":[{"id":"ok","label":"Continue heparin. Do not place a filter","verdict":"correct","feedback":"The drug is working and she can receive it. A filter is not a souvenir.","finding":"No filter","status":"Anticoagulated. Right ventricle improving."},{"id":"w0","label":"A filter, so the heparin can stop","verdict":"wrong","feedback":"She can take the heparin. That is why the filter is not indicated."},{"id":"w1","label":"Stop heparin at 48 hours. The echo is better","verdict":"wrong","feedback":"The echo improving is not the end of the course."},{"id":"w2","label":"Another thrombolysis to make the echo normal","verdict":"wrong","feedback":"The ventricle is recovering. A second lytic is harm."}]},{"id":"c9","skill":"Reassessment","title":"She had surgery a week ago","lead":"The operation site is dry. She is walking to the chair. Hemoglobin is stable. The recent surgery was why you waited until she shocked before lysing.","prompt":"Do you stop the anticoagulation because of that operation?","hint":"No. The bleeding has stopped and the embolism was massive. Continue, and watch the wound. Do not stop at the first quiet day.","guideline":"A week-old operation that is not bleeding does not cancel treatment of a massive embolism. Watch the wound. Do not stop the drug.","answer":"Continue anticoagulation and watch the wound","kind":"choice","successFinding":"Anticoagulation continued","successStatus":"Wound dry. Still anticoagulated.","missYou":"Not that decision","miss":"No. The bleeding has stopped and the embolism was massive. Continue, and watch the wound. Do not stop at the first quiet day.","choices":[{"id":"ok","label":"Keep the anticoagulation. Inspect the wound. Do not stop","verdict":"c ital","verdict":"wrong","feedback":"She does not need to live in a bed. She needs a finished plan."}]}]},{"id":"asthma","title":"Severe asthma","syndrome":"Silent chest, hyperinflation","minutes":"14 min","difficulty":"Core","available":true,"summary":"She can say one word. The film shows air trapping. It does not show a pneumonia to treat instead.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/asthma.jpg","patient":"Known asthma, three days of a cold, now one-word sentences","ageSex":"24-year-old woman","chart":["Teaching case. Not a prescription.","Back-to-back nebulisers at home. Speaking one word. Wheeze is quiet. No fever."],"opening":{"lkwMin":20,"status":"One-word sentences. Quiet chest.","sbp":146,"dbp":90,"hr":128,"rr":32,"spo2":91,"glucose":142},"stages":[{"id":"first","skill":"Action","title":"What happens before the film?","lead":"She is tiring. The radiographer can come, but the drug should not wait.","prompt":"What do you start?","hint":"Oxygen, continuous salbutamol, ipratropium, and a steroid. The film looks for complications, it does not make the diagnosis.","guideline":"Severe asthma is a clinical diagnosis. A chest film looks for pneumothorax and pneumonia. It must not delay the nebuliser.","answer":"Bronchodilator and steroid now","kind":"choice","successFinding":"Treatment started","successStatus":"Nebuliser running.","missYou":"Not that choice","miss":"Oxygen, continuous salbutamol, ipratropium, and a steroid. The film looks for complications, it does not make the diagnosis.","choices":[{"id":"neb","label":"Oxygen, continuous salbutamol, ipratropium, and a steroid. Then a film","verdict":"correct","feedback":"Treat first. The film is for pneumothorax, collapse, and pneumonia, not to decide whether she has asthma.","spo2":94,"findin saline.","choices":[{"id":"niv","label":"Non-invasive ventilation, oxygen, and a nitrate infusion","verdict":"correct","feedback":"The pressure is the afterload. Drop it, and support the breathing. Sit him up.","spo2":93,"sbp":160,"finding":"Non-invasive ventilation and nitrate","status":"Mask on. Pressure falling."},{"id":"fluid","label":"A litre of saline for the tachycardia","verdict":"wrong","feedback":"The lungs are wet and the pressure is 210. Fluid will drown him.","critical":true},{"id":"beta","label":"An intravenous beta-blocker as the only drug","verdict":"wrong","feedback":"A beta-blocker alone in florid edema can collapse the cardiac output. The acute tools are ventilation and a vasodilator."},{"id":"abx","label":"Antibiotics for bat-wing pneumonia, no ventilation","verdict":"wrong","feedback":"This pattern with hypertension and froth is edema until proved otherwise. He needs the mask."}]},{"id":"click","skill":"Localization","title":"Click the edema","lead":"Both hila are fluffy and the vessels are full. There is no single lobar consolidation.","prompt":"Click the perihilar edema.","hint":"The white haze sits around both hila, not under the diaphragm.","guideline":"Bilateral perihilar alveolar opacity with a high-pressure story is pulmonary edema. Always still look for a pneumothorax if he crashes on the mask.","answer":"Perihilar edema","image":{"src":"sim/cases/edema.jpg","alt":"Chest radiograph with bilateral perihilar edema.","caption":"Bat-wing perihilar opacity."},"kind":"hotspot","successFinding":"Pulmonary edema on the film","successStatus":"Pulmonary edema on the film","missYou":"Clicked below the diaphragm","miss":"The edema is the white haze in both lungs around the hila, not the abdomen.","regions":[{"id":"bat","verdict":"correct","cx":0.5,"cy":0.42,"rx":0.24,"ry":0.16,"you":"Perihilar edema","feedback":"That bilateral haze is alveolar edema."},{"id":"abd","verdict":"wrong","cx":0.5,"cy":0.86,"rx":0.12,"ry":0.06,"you":"Below the diaphragm","feedback":"That is the upper abdomen. The finding is in the lungs."}]},{"id":"name","skill":"Interpretation","title":"Name the film","lead":"Bilateral, central, fluffy. The history is hypertensive.","prompt":"What is it?","hint":"Pulmonary edema. Not a right-upper pneumonia.","guideline":"Cardiogenic edema is a clinical and film diagnosis. The echocardiogram comes next, but the mask should already be on.","answer":"Pulmonary edema","kind":"choice","successFinding":"Pulmonary edema","successStatus":"Not pneumonia.","missYou":"Not that choice","miss":"Pulmonary edema. Not a right-upper pneumonia.","choices":[{"id":"ed","label":"Acute pulmonary edema","verdict":"correct","feedback":"Bat-wing opacity and a pressure of 210. Treat it as edema.","finding":"Pulmonary edema","status":"Edema, not a focal pneumonia."},{"id":"ards","label":"ARDS. Set a low tidal volume and ignore the blood pressure","verdict":"wrong","feedback":"ARDS is not the first label when the pressure is 210 and the onset was minutes. The pressure is the disease."},{"id":"ptx","label":"Tension pneumothorax","verdict":"wrong","feedback":"Both lungs are white and large, not one lung black."},{"id":"pe","label":"Pulmonary embolism, so thrombolyse","verdict":"wrong","feedback":"Embolism is a clear or oligemic film more often than bat-wing edema, and he is hypertensive, not shocked."}],"image":{"src":"sim/cases/edema.jpg","alt":"Name the film","caption":"Name the film"}},{"id":"loop","skill":"Decision","title":"The mask is on. What about the fluid?","lead":"He is still hypertensive. You do not yet have an echocardiogram. The story is missed blood-pressure tablets, not a week of sepsis.","prompt":"What else do you give?","hint":"A nitrate if the pressure allows, and a diuretic if he is volume overloaded. Not morphine as a routine, and not a bolus.","guideline":"Nitroglycerin infusion while the systolic pressure is high. A modest dose of furosemide if there is fluid to lose. Reassess the mask, do not stack sedation.","answer":"Nitrate, and a diuretic if he is overloaded","kind":"choice","successFinding":"Nitrate running","successStatus":"Pressure 150. Still on the mask.","missYou":"Not that choice","miss":"A nitrate if the pressure allows, and a diuretic if he is volume overloaded. Not morphine as a routine, and not a bolus.","choices":[{"id":"gtn","label":"Continue the nitrate. Add furosemide if he is fluid overloaded. No fluid bolus","verdict":"correct","feedback":"Afterload first. A diuretic helps if there is volume to remove. Recheck the pressure so you do not nitrate him into shock.","sbp":148,"spo2":95,"finding":"Nitrate and a careful diuretic","status":"Improving on the mask."},{"id":"litre","label":"A 1 litre bolus, then reassess","verdict":"wrong","feedback":"The film is already water. A bolus is the wrong direction.","critical":true},{"id":"morph","label":"Morphine 10 mg as the main treatment","verdict":"wrong","feedback":"Morphine is not routine in edema. It sedates a tiring patient and it is not the vasodilator you think it is."},{"id":"stop","label":"Take the mask off to let him rest","verdict":"wrong","feedback":"The mask is the treatment of the work of breathing. Do not remove it because he looks uncomfortable."}]},{"id":"tire","skill":"Reassessment","title":"The mask is failing","lead":"An hour later the pH is 7.12, he is nodding, and the pressure is 150 on the nitrate.","prompt":"What now?","hint":"Non-invasive ventilation that is failing needs a tube. Do not add more morphine to 'settle' him.","guideline":"Intubate if he is tiring, the pH is falling, or the mask cannot keep the oxygen up. Have a plan for the pressure after induction.","answer":"Intubate","kind":"choice","successFinding":"Intubated","successStatus":"Tube in. Still hypertensive.","missYou":"Not that choice","miss":"Non-invasive ventilation that is failing needs a tube. Do not add more morphine to 'settle' him.","choices":[{"id":"ett","label":"Intubate. Keep treating the blood pressure","verdict":"correct","feedback":"The mask has failed. A tube, then a low tidal volume, and do not let the pressure leap back to 210 after induction.","spo2":96,"finding":"Intubated for failing non-invasive ventilation","status":"Ventilated. Pressure watched."},{"id":"morph","label":"Morphine so he tolerates the mask","verdict":"wrong","feedback":"He is nodding and acidotic. More sedation without a tube is how he arrests.","critical":true},{"id":"off","label":"Stop the nitrate because the pH is low","verdict":"wrong","feedback":"The pH is from ventilation, not from the nitrate. The pressure is still 150, so the nitrate still has a job."},{"id":"fluid","label":"Fluid bolus for the acidosis","verdict":"wrong","feedback":"This acidosis is respiratory from fatigue, and the lungs are wet. Fluid is wrong."}]},{"id":"c6","skill":"Reassessment","title":"He is intubated. The pressure dips to 90","lead":"The tube has just gone in. Systolic pressure is 90, from 210. The lungs are wet. There is no new ST elevation.","prompt":"What do you give?","hint":"A small vasopressor if the dip does not recover, not a litre of saline. Keep some PEEP. Continue the vasodilator once the pressure allows.","guideline":"Post-intubation hypotension in hypertensive edema is not hypovolemia. A litre recreates the edema. PEEP stays. Nitrate returns when the pressure allows.","answer":"No fluid litre. Support the pressure. Keep PEEP","kind":"choice","successFinding":"No saline litre","successStatus":"Intubated. Pressure supported, not flooded.","missYou":"Not that decision","miss":"A small vasopressor if the dip does not recover, not a litre of saline. Keep some PEEP. Continue the vasodilator once the pressure allows.","choices":[{"id":"ok","label":"Norepinephrine if needed. No litre of saline. PEEP stays","verdict":"correct","feedback":"He drowned in his own pressure. Do not add a litre to that.","finding":"No saline litre","status":"Intubated. Pressure supported, not flooded."},{"id":"w0","label":"A litre of saline, because intubation drops the pressure","verdict":"wrong","feedback":"That drop is not an empty tank.","critical":true},{"id":"w1","label":"Turn the PEEP to zero so the pressure rises","verdict":"wrong","feedback":"You just intubated him for edema. Zero PEEP puts the fluid back in the way of the oxygen."},{"id":"w2","label":"Thrombolysis, because he arrested a little","verdict":"wrong","feedback":"He did not have a rhythm problem, and the ECG is not a STEMI."}]},{"id":"c7","skill":"Reassessment","title":"The oxygen is acceptable. He is still wet","lead":"Saturation is 96 percent on 50 percent oxygen. Blood pressure is 150 systolic on a small dose of norepinephrine. There is froth in the tube.","prompt":"What drug treats the fluid?","hint":"A diuretic, and a nitrate when the pressure will stand it. Do not give more fluid. Do not start a beta blocker while he is on a vasopressor.","guideline":"Hydrostatic edema needs offloading once the airway is safe. Vasodilate if the pressure is high. Do not beta-block a shocked heart.","answer":"Diuretic, and nitrate if the pressure allows","kind":"choice","successFinding":"Diuretic given","successStatus":"Wet lungs. Offloading.","missYou":"Not that decision","miss":"A diuretic, and a nitrate when the pressure will stand it. Do not give more fluid. Do not start a beta blocker while he is on a vasopressor.","choices":[{"id":"ok","label":"Give a diuretic. Add nitrate only when the pressure will stand it","verdict":"correct","feedback":"The mask failed and the tube is in. The fluid still has to leave.","finding":"Diuretic given","status":"Wet lungs. Offloading."},{"id":"w0","label":"Another fluid bolus. The vasopressor means he is empty","verdict":"wrong","feedback":"The vasopressor is for a dip, not for hypovolemia. The tube is full of froth."},{"id":"w1","label":"A beta blocker for the rate","verdict":"wrong","feedback":"He is still on a vasopressor. Do not block the heart."},{"id":"w2","label":"Stop the diuretic. Froth means infection","verdict":"wrong","feedback":"Froth after hypertensive edema is the edema."}]},{"id":"c8","skill":"Reassessment","title":"The troponin is slightly up","lead":"A troponin is mildly raised. The ECG has no ST elevation and no new left bundle. The story is missed blood-pressure tablets and pink froth.","prompt":"Do you activate the catheter laboratory?","hint":"Not for a small troponin with a clear hypertensive edema and a quiet ECG. Repeat the ECG if the pain or the tracing changes.","guideline":"A small troponin leak from a strained heart is not an ST-elevation infarction. The laboratory is for ST elevation or a convincing ischemic story.","answer":"No emergency angiogram for this troponin","kind":"choice","successFinding":"Not a STEMI","successStatus":"ECG quiet. Edema still the diagnosis.","missYou":"Not that decision","miss":"Not for a small troponin with a clear hypertensive edema and a quiet ECG. Repeat the ECG if the pain or the tracing changes.","choices":[{"id":"ok","label":"Do not activate the laboratory. Repeat the ECG if it changes","verdict":"correct","feedback":"The diagnosis is already on the film and in the blood pressure. A mild troponin does not rename it.","finding":"Not a STEMI","status":"ECG quiet. Edema still the diagnosis."},{"id":"w0","label":"Primary angioplasty now","verdict":"wrong","feedback":"There is no ST elevation and no ischemic story."},{"id":"w1","label":"Thrombolysis, because the troponin is up","verdict":"wrong","feedback":"Thrombolysis without ST elevation is bleeding for nothing."},{"id":"w2","label":"Stop the diuretic until a cardiologist arrives in the morning","verdict":"wrong","feedback":"The pulmonary edema does not wait for a clinic."}]},{"id":"c9","skill":"Reassessment","title":"He is drier. The vasopressor is off","lead":"Urine output has been good. Oxygen is 30 percent. He is waking. Blood pressure is 160 systolic.","prompt":"What is the next step off the ventilator?","hint":"A spontaneous breathing trial. Restart a blood-pressure drug he can absorb. Do not start it as a huge intravenous beta blocker.","guideline":"Extubation follows a successful trial. Blood pressure treatment restarts in a form he can take, once he is off the vasopressor and absorbing.","answer":"Breathing trial, and restart an oral pressure drug","kind":"choice","successFinding":"Trial planned","successStatus":"Drier. Vasopressor off.","missYou":"Not that decision","miss":"A spontaneous breathing trial. Restart a blood-pressure drug he can absorb. Do not start it as a huge intravenous beta blocker.","choices":[{"id":"ok","label":"Trial of breathing. Restart his blood-pressure treatment in a dose he can absorb","verdict":"correct","feedback":"The reason he is here is missed treatment. Do not discharge that fact.","finding":"Trial planned","status":"Drier. Vasopressor off."},{"id":"w0","label":"Intravenous beta blocker bolus now","verdict":"wrong","feedback":"A bolus into a heart that just failed is how shock returns."},{"id":"w1","label":"Keep him intubated until the troponin is undetectable","verdict":"wrong","feedback":"The tube follows the lungs, not a tiny troponin."},{"id":"w2","label":"A saline infusion overnight so the kidney stays pretty","verdict":"wrong","feedback":"You just diuresed the edema. Do not put it back."}]},{"id":"c10","skill":"Reassessment","title":"He passes the trial","lead":"Awake, coughs, oxygen is fine on a low support. Blood pressure is 150 on a restarted oral drug. No chest pain.","prompt":"What do you do?","hint":"Extubate. Keep the oral blood-pressure drug. Do not give a farewell fluid bolus.","guideline":"A passed trial in a dry patient is extubation. The blood-pressure plan leaves with him.","answer":"Extubate on the oral blood-pressure drug","kind":"choice","successFinding":"Extubated","successStatus":"Awake. Pressure treated.","missYou":"Not that decision","miss":"Extubate. Keep the oral blood-pressure drug. Do not give a farewell fluid bolus.","choices":[{"id":"ok","label":"Extubate. Continue the oral blood-pressure drug. No fluid bolus","verdict":"correct","feedback":"He came in because the pressure was untreated. Send him out with that treated.","finding":"Extubated","status":"Awake. Pressure treated."},{"id":"w0","label":"Extubate and hold every blood-pressure tablet for a week","verdict":"wrong","feedback":"That is the admission, repeated."},{"id":"w1","label":"A litre of saline after extubation","verdict":"wrong","feedback":"The lungs just cleared."},{"id":"w2","label":"Keep the tube one more night for caution","verdict":"wrong","feedback":"A passed trial is the caution."}]}]},{"id":"stemi","title":"ST-elevation myocardial infarction","syndrome":"Crushing pain, the lab is open","minutes":"14 min","difficulty":"Core","available":true,"summary":"Forty minutes of pain. The electrocardiogram is the diagnosis. Do not wait for a troponin.","queued":"","clockLabel":"Minutes of pain","clockWarnAfterMin":120,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/stemi.jpg","patient":"Crushing chest pain for forty minutes","ageSex":"58-year-old man","chart":["Teaching case. Not a prescription.","Sweaty, nauseated. No prior bypass. The catheter laboratory can take him now. Systolic pressure 138."],"opening":{"lkwMin":40,"status":"Sweaty, ongoing pain.","sbp":138,"dbp":86,"hr":74,"rr":18,"spo2":97,"glucose":126},"stages":[{"id":"study","skill":"Investigation","title":"What do you record first?","lead":"The pain is typical and it is ongoing. A troponin will not be back in time to change the first hour.","prompt":"Which test decides the next ten minutes?","hint":"A 12-lead electrocardiogram. Not a troponin, and not a CT of the aorta as the first move when the story is ischemic pain and the ECG is not yet done.","guideline":"ST elevation on a 12-lead tracing activates reperfusion. Do not wait for biomarkers.","answer":"12-lead electrocardiogram","kind":"choice","successFinding":"Electrocardiogram done","successStatus":"The tracing is on the screen.","missYou":"Not that choice","miss":"A 12-lead electrocardiogram. Not a troponin, and not a CT of the aorta as the first move when the story is ischemic pain and the ECG is not yet done.","choices":[{"id":"ecg","label":"12-lead electrocardiogram now","verdict":"correct","feedback":"The tracing is the decision. Draw blood, but do not wait for it.","finding":"12-lead electrocardiogram","status":"Tracing recorded."},{"id":"trop","label":"Wait for the troponin before calling anyone","verdict":"wrong","feedback":"A troponin can be normal in the first hour of a completed occlusion. The laboratory will not save myocardium.","critical":true},{"id":"cxr","label":"Chest film first, and no tracing until it is reported","verdict":"wrong","feedback":"A film does not diagnose ST elevation. Put the leads on."},{"id":"ct","label":"CT aortogram as the only test","verdict":"wrong","feedback":"Dissection is a different story. This pain needs an electrocardiogram before you commit him to a long scan."}]},{"id":"click","skill":"Localization","title":"Click the ST elevation","lead":"The chest leads are on the right of the page. The ST segment is lifted in the precordial leads.","prompt":"Click the ST elevation in the chest leads.","hint":"Look at the right-hand columns, where the ST segment stays up after the QRS. The limb leads are on the left.","guideline":"ST elevation in the precordial leads is an anterior or anterolateral infarct until a catheter proves otherwise. The laboratory should already be calling.","answer":"ST elevation in the chest leads","image":{"src":"sim/cases/stemi.jpg","alt":"12-lead electrocardiogram with ST elevation in the precordial leads.","caption":"ST segment elevated in the chest leads."},"kind":"hotspot","successFinding":"ST elevation","successStatus":"ST elevation","missYou":"Clicked the limb leads","miss":"Those left-hand leads are the limb leads. The elevation to mark is in the chest leads on the right of the page.","regions":[{"id":"prec","verdict":"correct","cx":0.74,"cy":0.42,"rx":0.2,"ry":0.28,"you":"Precordial ST elevation","feedback":"The ST segment in the chest leads is elevated. That is the infarct."},{"id":"limb","verdict":"wrong","cx":0.14,"cy":0.36,"rx":0.08,"ry":0.12,"you":"A limb lead","feedback":"That column is the limb leads. Move right, to the chest leads."}]},{"id":"name","skill":"Interpretation","title":"Name the tracing","lead":"The pain is ongoing. The ST segment is up in the chest leads. The catheter laboratory is free.","prompt":"What do you call, and what do you not wait for?","hint":"ST-elevation infarction. Activate the laboratory. Give aspirin. Do not wait for the troponin.","guideline":"Primary percutaneous coronary intervention is preferred when the laboratory can take him promptly. Aspirin is given unless he truly cannot have it. Thrombolysis is the alternative only when timely intervention is impossible.","answer":"ST-elevation infarction, laboratory now","kind":"choice","successFinding":"ST-elevation infarction","successStatus":"Laboratory activated.","missYou":"Not that choice","miss":"ST-elevation infarction. Activate the laboratory. Give aspirin. Do not wait for the troponin.","choices":[{"id":"stemi","label":"ST-elevation infarction. Aspirin, anticoagulation, and the catheter laboratory now","verdict":"correct","feedback":"Do not wait for a biomarker. The laboratory is open, so this is primary intervention, not a thrombolytic by default.","finding":"ST-elevation infarction","status":"Laboratory activated. Aspirin given."},{"id":"nstemi","label":"Non-ST elevation. Admit and repeat the tracing tomorrow","verdict":"wrong","feedback":"The ST segment is elevated. Tomorrow is a completed infarct."},{"id":"peric","label":"Pericarditis. Ibuprofen and home","verdict":"wrong","feedback":"Ongoing crushing pain and territorial ST elevation is not a home diagnosis. Pericarditis is widespread and the story differs."},{"id":"wait","label":"Troponin first, laboratory only if it is raised","verdict":"wrong","feedback":"You will lose the myocardium while the blood spins.","critical":true}],"image":{"src":"sim/cases/stemi.jpg","alt":"Name the tracing","caption":"Name the tracing"}},{"id":"drug","skill":"Decision","title":"The laboratory is ready. Which drugs before he moves?","lead":"He can chew. Systolic pressure is 138. No active bleeding.","prompt":"What do you give before transfer?","hint":"Aspirin, a loading antiplatelet per the laboratory, and anticoagulation. Not a thrombolytic when the laboratory is waiting.","guideline":"Aspirin 162 to 325 mg chewed. The second antiplatelet and the heparin follow the laboratory's protocol. Do not give fibrinolysis when primary intervention is immediate.","answer":"Aspirin and transfer","kind":"choice","successFinding":"Aspirin given","successStatus":"Moving to the laboratory.","missYou":"Not that choice","miss":"Aspirin, a loading antiplatelet per the laboratory, and anticoagulation. Not a thrombolytic when the laboratory is waiting.","choices":[{"id":"asa","label":"Aspirin now, anticoagulation, and transfer for primary intervention","verdict":"correct","feedback":"Chew the aspirin. Do not delay transfer for a decorative set of bloods.","sbp":136,"finding":"Aspirin and primary intervention","status":"In transfer. Pain still present."},{"id":"lyse","label":"Tenecteplase here, and cancel the laboratory","verdict":"wrong","feedback":"The laboratory can take him. Fibrinolysis is for when timely intervention cannot happen."},{"id":"none","label":"No aspirin, because the laboratory will give it","verdict":"wrong","feedback":"Aspirin is given at the first opportunity, not after a journey."},{"id":"gtnonly","label":"Nitrate only, and review in the morning","verdict":"wrong","feedback":"A nitrate may ease pain. It does not open an occluded artery.","critical":true}]},{"id":"vf","skill":"Reassessment","title":"He arrests as the drapes go on","lead":"The monitor shows a coarse irregular trembling of the baseline and no pulse.","prompt":"What is the first act?","hint":"That is ventricular fibrillation. Shock. Do not start with a nitrate or with amiodarone.","guideline":"Pulseless ventricular fibrillation is defibrillated immediately. Drugs come after the shock, not before it.","answer":"Defibrillate","kind":"choice","successFinding":"Shock delivered","successStatus":"Compressions around the shock.","missYou":"Not that choice","miss":"That is ventricular fibrillation. Shock. Do not start with a nitrate or with amiodarone.","choices":[{"id":"shock","label":"Defibrillate now","verdict":"correct","feedback":"No pulse and ventricular fibrillation. Charge and shock. Then compressions. Amiodarone is not the first act.","finding":"Defibrillation","status":"Shock delivered."},{"id":"amio","label":"Amiodarone before any shock","verdict":"wrong","feedback":"The drug does not replace the shock. Defibrillate first.","critical":true},{"id":"gtn","label":"More nitrate","verdict":"wrong","feedback":"He has no pulse. A nitrate is irrelevant and harmful here."},{"id":"pace","label":"Transcutaneous pacing","verdict":"wrong","feedback":"You cannot pace fibrillation. Shock it."}]},{"id":"c6","skill":"Reassessment","title":"There is a pulse after the shock","lead":"The shock worked. He is groaning. Systolic pressure is 88. The drapes are still on and the laboratory is the room he is already in.","prompt":"What is the next look?","hint":"A 12-lead if it will not delay the artery, and support the pressure. Do not leave the laboratory for a CT. Do not give a litre.","guideline":"Return of a pulse during ST-elevation infarction still means open the artery. Hypotension is supported, not flooded.","answer":"Stay for the artery. Support the pressure. No litre","kind":"choice","successFinding":"Pulse back. Artery still the plan","successStatus":"Pressure supported. Still in the laboratory.","missYou":"Not that decision","miss":"A 12-lead if it will not delay the artery, and support the pressure. Do not leave the laboratory for a CT. Do not give a litre.","choices":[{"id":"ok","label":"Norepinephrine if needed, and open the artery. No saline litre and no detour to CT","verdict":"correct","feedback":"The rhythm was treated. The occlusion is still there.","finding":"Pulse back. Artery still the plan","status":"Pressure supported. Still in the laboratory."},{"id":"w0","label":"A litre of cold saline, then a CT of the head","verdict":"wrong","feedback":"He has a pulse and an occluded artery. Do not drown him or leave the room.","critical":true},{"id":"w1","label":"Amiodarone infusion as the blood-pressure drug","verdict":"wrong","feedback":"Amiodarone is not a vasopressor."},{"id":"w2","label":"Cancel the procedure. He has had enough","verdict":"wrong","feedback":"The procedure is why he is alive in an hour."}]},{"id":"c7","skill":"Reassessment","title":"The artery is open and stented","lead":"Flow is restored. He is awake enough. Systolic pressure is 110. The dual antiplatelet question is on the table.","prompt":"What tablets does the stent need?","hint":"Aspirin and a second antiplatelet, unless he is bleeding. Not thrombolysis on top. Not a heparin stop in the first hour.","guideline":"A coronary stent needs dual antiplatelet therapy. Thrombolysis after a successful primary angioplasty adds bleeding.","answer":"Dual antiplatelet therapy. No thrombolysis","kind":"choice","successFinding":"Dual antiplatelet started","successStatus":"Artery open. Stent in.","missYou":"Not that decision","miss":"Aspirin and a second antiplatelet, unless he is bleeding. Not thrombolysis on top. Not a heparin stop in the first hour.","choices":[{"id":"ok","label":"Aspirin and a second antiplatelet. Do not add thrombolysis","verdict":"correct","feedback":"The artery is already open. The stent has to stay open. A lytic now is a bleed.","finding":"Dual antiplatelet started","status":"Artery open. Stent in."},{"id":"w0","label":"Tenecteplase as well, to be sure","verdict":"wrong","feedback":"The balloon already did the job. The lytic adds bleeding."},{"id":"w1","label":"No antiplatelet, because he had a rhythm arrest","verdict":"wrong","feedback":"The arrest does not remove the stent."},{"id":"w2","label":"Warfarin instead of both antiplatelets","verdict":"wrong","feedback":"That is not the regimen for this stent."}]},{"id":"c8","skill":"Reassessment","title":"He has frequent ventricular ectopics","lead":"Blood pressure is 116. There are frequent ectopic beats and one short run that stops itself. He is not in ventricular fibrillation.","prompt":"Do you treat the ectopics?","hint":"No lidocaine for ectopics. If a sustained unstable rhythm returns, shock it. Amiodarone is for recurrent serious ventricular arrhythmia, not for every ectopic.","guideline":"Reperfusion ectopics are common and usually watched. A stable patient is not given an antiarrhythmic for cosmetic beats.","answer":"Watch the ectopics. Shock only if a bad rhythm returns","kind":"choice","successFinding":"Ectopics watched","successStatus":"Stable. Artery open.","missYou":"Not that decision","miss":"No lidocaine for ectopics. If a sustained unstable rhythm returns, shock it. Amiodarone is for recurrent serious ventricular arrhythmia, not for every ectopic.","choices":[{"id":"ok","label":"Do not give lidocaine for ectopics","verdict":"correct","feedback":"Treating the harmless beats can cause the harmful rhythm.","finding":"Ectopics watched","status":"Stable. Artery open."},{"id":"w0","label":"Lidocaine infusion for every ectopic","verdict":"wrong","feedback":"Those beats are not the emergency."},{"id":"w1","label":"A beta blocker bolus while the pressure is still soft from the arrest","verdict":"wrong","feedback":"Wait until he is clearly stable. A bolus now can drop the pressure."},{"id":"w2","label":"Defibrillate the ectopics","verdict":"wrong","feedback":"There is a pulse and no fibrillation. Do not shock a perfusing rhythm."}]},{"id":"c9","skill":"Reassessment","title":"He is stable an hour after the stent","lead":"Pain is gone. Pressure is 124. No pulmonary edema. The first tablets are due.","prompt":"Which prevention starts now, and which waits?","hint":"A high-intensity statin can start. A beta blocker and an ACE inhibitor wait until you are sure he is not in shock. He is not in shock now, so an oral beta blocker is reasonable. Do not give all three as intravenous boluses.","guideline":"Secondary prevention is real, but intravenous boluses of beta blocker and ACE inhibitor in a fresh arrest are how shock returns. Oral treatment once he is stable is appropriate.","answer":"Statin now. Oral beta blocker only because he is stable. No intravenous bolts","kind":"choice","successFinding":"Secondary prevention started carefully","successStatus":"Pain free. Pressure stable.","missYou":"Not that decision","miss":"A high-intensity statin can start. A beta blocker and an ACE inhibitor wait until you are sure he is not in shock. He is not in shock now, so an oral beta blocker is reasonable. Do not give all three as intravenous boluses.","choices":[{"id":"ok","label":"Start a statin. If you start a beta blocker, make it oral. No intravenous bolus","verdict":"correct","feedback":"He is stable, so prevention starts. It does not start as a push.","finding":"Secondary prevention started carefully","status":"Pain free. Pressure stable."},{"id":"w0","label":"Intravenous metoprolol and intravenous enalapril together","verdict":"wrong","feedback":"Two intravenous vasodilating or rate-slowing drugs after an arrest is a way to recreate shock."},{"id":"w1","label":"No statin, because the artery is open","verdict":"wrong","feedback":"The artery being open is not the end of the disease."},{"id":"w2","label":"Nothing by mouth for three days","verdict":"wrong","feedback":"He is awake and stable. The statin does not need a three-day fast."}]},{"id":"c10","skill":"Reassessment","title":"The groin is soft and he is pain free","lead":"Four hours later the access site is not swelling. He can eat. There is no heart failure.","prompt":"Where does he go tonight?","hint":"A monitored cardiac bed, not home. The antiplatelet drugs stay. The access site is observed, not pressed for an hour if it is dry.","guideline":"The first night after primary angioplasty and an arrest is monitored. Discharge the same afternoon is not that night.","answer":"Monitored bed. Drugs continued","kind":"choice","successFinding":"Monitored cardiac bed","successStatus":"Stable. Site dry.","missYou":"Not that decision","miss":"A monitored cardiac bed, not home. The antiplatelet drugs stay. The access site is observed, not pressed for an hour if it is dry.","choices":[{"id":"ok","label":"Keep him monitored tonight. Continue the antiplatelet drugs","verdict":"correct","feedback":"The artery is open. The rhythm has already killed him once today. Watch him.","finding":"Monitored cardiac bed","status":"Stable. Site dry."},{"id":"w0","label":"Home this afternoon","verdict":"wrong","feedback":"He arrested and was stented today."},{"id":"w1","label":"Stop the second antiplatelet so the groin cannot bleed","verdict":"wrong","feedback":"A dry groin does not outrank a fresh stent."},{"id":"w2","label":"Heparin infusion for a week on top of both antiplatelets","verdict":"wrong","feedback":"Triple treatment without a reason is a bleed."}]}]},{"id":"chb","title":"Complete heart block","syndrome":"Slow, and shocked","minutes":"14 min","difficulty":"Core","available":true,"summary":"She is dizzy and the systolic pressure is 78. The P waves march through the QRS.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/chb.png","patient":"Two syncopal spells today","ageSex":"76-year-old woman","chart":["Teaching case. Not a prescription.","On no rate-limiting drug overdose. Perfusion is poor. Heart rate on the monitor is 34."],"opening":{"lkwMin":20,"status":"Pale, dizzy, poor perfusion.","sbp":78,"dbp":40,"hr":34,"rr":20,"spo2":95,"glucose":112},"stages":[{"id":"study","skill":"Investigation","title":"What do you record?","lead":"The monitor already shows a slow rate. You need the relationship of P waves to QRS.","prompt":"Which tracing?","hint":"A 12-lead, or at least a long rhythm strip. Do not send her for a pacing check in the morning.","guideline":"Complete heart block is P waves and QRS complexes that are divorced. An unstable patient is paced, not observed.","answer":"Rhythm strip","kind":"choice","successFinding":"Strip recorded","successStatus":"The strip is up.","missYou":"Not that choice","miss":"A 12-lead, or at least a long rhythm strip. Do not send her for a pacing check in the morning.","choices":[{"id":"ecg","label":"A rhythm strip now, with pads on the chest","verdict":"correct","feedback":"Diagnose it and be ready to pace in the same minute. She is already shocked.","finding":"Rhythm strip","status":"Pads on. Strip running."},{"id":"lab","label":"Electrolytes first, no strip until they return","verdict":"wrong","feedback":"The electrolytes matter, and they can wait two minutes. The rate cannot."},{"id":"home","label":"Oral amlodipine hold, and home","verdict":"wrong","feedback":"She is hypotensive at a rate of 34. This is not an outpatient problem.","critical":true},{"id":"fluid","label":"A litre of fluid as the only act","verdict":"wrong","feedback":"Fluid does not reconnect atrioventricular conduction."}]},{"id":"click","skill":"Localization","title":"Click a P wave that does not conduct","lead":"The arrows mark P waves. The QRS complexes are the taller narrow spikes, and they are not married to those P waves.","prompt":"Click a P wave.","hint":"The arrows point at the P waves. They walk through at their own rate.","guideline":"If P waves and QRS complexes are dissociated, and the ventricular rate is slower, this is complete heart block.","answer":"A non-conducted P wave","image":{"src":"sim/cases/chb.png","alt":"Rhythm strip. P waves and QRS complexes are dissociated.","caption":"P waves marching through."},"kind":"hotspot","successFinding":"Complete dissociation","successStatus":"Complete dissociation","missYou":"Clicked a QRS","miss":"That taller spike is the QRS. The P wave is the smaller deflection the arrow is marking.","regions":[{"id":"p1","verdict":"correct","cx":0.16,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"That is a P wave, and it is not tied to a QRS."},{"id":"p2","verdict":"correct","cx":0.48,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"Another P wave, still dissociated."},{"id":"p3","verdict":"correct","cx":0.8,"cy":0.4,"rx":0.06,"ry":0.09,"you":"P wave","feedback":"A third P wave at its own rate."},{"id":"qrs","verdict":"wrong","cx":0.24,"cy":0.58,"rx":0.05,"ry":0.08,"you":"A QRS complex","feedback":"That is the ventricular beat. The question asked for the P wave that fails to conduct."}]},{"id":"name","skill":"Interpretation","title":"Name the rhythm","lead":"P waves and QRS complexes are divorced. The ventricular rate is 34. She is shocked.","prompt":"What is it?","hint":"Complete, or third-degree, heart block.","guideline":"Unstable complete heart block is paced. Atropine is unreliable when the block is below the node, and it is not the plan you rely on.","answer":"Complete heart block","kind":"choice","successFinding":"Complete heart block","successStatus":"Pacing next.","missYou":"Not that choice","miss":"Complete, or third-degree, heart block.","choices":[{"id":"chb","label":"Complete heart block","verdict":"correct","feedback":"Dissociated P waves, a slow ventricular escape, and shock. Pace her.","finding":"Complete heart block","status":"Calling for pacing."},{"id":"af","label":"Atrial fibrillation with a normal rate","verdict":"wrong","feedback":"There are organized P waves, and the rate is 34. This is not controlled fibrillation."},{"id":"sinus","label":"Sinus bradycardia that will settle","verdict":"wrong","feedback":"Sinus bradycardia keeps each P married to a QRS. These are divorced."},{"id":"vt","label":"Ventricular tachycardia","verdict":"wrong","feedback":"The QRS is slow and narrow enough to be an escape, not a wide fast tachycardia."}],"image":{"src":"sim/cases/chb.png","alt":"Name the rhythm","caption":"Name the rhythm"}},{"id":"pace","skill":"Decision","title":"The pressure is 78","lead":"Pads are on. She is sweaty. Atropine 0.5 mg did nothing.","prompt":"What do you do?","hint":"Transcutaneous pacing now. Then a transvenous wire. Do not keep giving atropine as the only plan.","guideline":"Pace the unstable patient. Sedate for the pads if you can do it without delaying the capture. Adrenaline or isoprenaline is a bridge only if pacing is delayed.","answer":"Transcutaneous pacing","kind":"choice","successFinding":"Pacing","successStatus":"Capture. Pressure rising.","missYou":"Not that choice","miss":"Transcutaneous pacing now. Then a transvenous wire. Do not keep giving atropine as the only plan.","choices":[{"id":"tcp","label":"Transcutaneous pacing now, and arrange a transvenous wire","verdict":"correct","feedback":"Capture, then a wire. Do not stop at atropine.","sbp":108,"finding":"Transcutaneous pacing","status":"Pads capturing. Pressure 108."},{"id":"atrop","label":"Repeat atropine every five minutes and do not pace","verdict":"wrong","feedback":"Atropine has already failed. Infra-nodal block often ignores it.","critical":true},{"id":"oral","label":"Oral salbutamol and the ward","verdict":"wrong","feedback":"She is shocked. The ward is the wrong destination."},{"id":"shock","label":"Defibrillate the slow rhythm","verdict":"wrong","feedback":"A shock is for fibrillation and for unstable tachycardia, not for a perfusing bradycardia you can pace."}]},{"id":"wire","skill":"Reassessment","title":"The pads are capturing","lead":"Each pacing spike is followed by a QRS and a pulse. Someone wants the pads paused 'to rest the skin' before the wire is in.","prompt":"What do you say?","hint":"Do not stop a capturing external pacemaker until a wire has captured.","guideline":"External pacing continues until transvenous pacing has taken over and been tested. Then, and only then, the pads come off demand.","answer":"Keep pacing until the wire captures","kind":"choice","successFinding":"Wire planned","successStatus":"Still capturing.","missYou":"Not that choice","miss":"Do not stop a capturing external pacemaker until a wire has captured.","choices":[{"id":"keep","label":"Keep the pads capturing until a transvenous wire has captured","verdict":"correct","feedback":"Test the wire. Then you may stop the pads. Not before.","sbp":112,"finding":"Bridge to a wire","status":"External pacing continues."},{"id":"off","label":"Pause the pads for ten minutes to rest the skin","verdict":"wrong","feedback":"Ten minutes without capture returns her to a rate of 34 and a pressure of 78.","critical":true},{"id":"home","label":"Discharge on the pads","verdict":"wrong","feedback":"External pacing is a bridge, not a discharge plan."},{"id":"fluid","label":"Turn the pads off and give fluid","verdict":"wrong","feedback":"Fluid is not a pacemaker."}]},{"id":"c6","skill":"Reassessment","title":"The temporary wire is capturing","lead":"A wire is in and the blood pressure is 118. The external pads are still firing as well. She is uncomfortable.","prompt":"What do you turn off?","hint":"Turn the external pads off once the wire is clearly capturing. Leave the wire. Do not give more atropine.","guideline":"Two pacing modes at once are painful and confusing. The wire replaces the pads. Atropine is unreliable in infra-nodal block and is no longer the treatment.","answer":"Pads off. Wire stays. No more atropine","kind":"choice","successFinding":"External pads stopped","successStatus":"Wire capturing. Pads off.","missYou":"Not that decision","miss":"Turn the external pads off once the wire is clearly capturing. Leave the wire. Do not give more atropine.","choices":[{"id":"ok","label":"Stop the external pads. Keep the wire. Stop the atropine","verdict":"correct","feedback":"The wire is the bridge. The pads were the bridge to the wire.","finding":"External pads stopped","status":"Wire capturing. Pads off."},{"id":"w0","label":"Leave both pacing, so one is a spare","verdict":"wrong","feedback":"Competing spikes are not a spare."},{"id":"w1","label":"Pull the wire now that the pressure is normal","verdict":"wrong","feedback":"The pressure is normal because of the wire."},{"id":"w2","label":"A large dose of atropine, now that the wire works","verdict":"wrong","feedback":"Atropine is the drug that does not work reliably here. You no longer need it."}]},{"id":"c7","skill":"Reassessment","title":"Is this a myocardial infarction?","lead":"The paced beats make the ST segment hard. A brief look at the underlying rhythm, while the wire is ready to restart, shows no ST elevation. Potassium is normal. She takes no rate-limiting overdose.","prompt":"Do you thrombolyse?","hint":"No. There is no ST-elevation infarction. She needs a pacing plan, not a lytic.","guideline":"Complete heart block without ST elevation is a pacing problem. Thrombolysis is for the infarction you have not found.","answer":"No thrombolysis. Plan a permanent pacemaker","kind":"choice","successFinding":"Not an infarction","successStatus":"Wire in. No lytic.","missYou":"Not that decision","miss":"No. There is no ST-elevation infarction. She needs a pacing plan, not a lytic.","choices":[{"id":"ok","label":"Do not thrombolyse. She needs a permanent pacing plan","verdict":"correct","feedback":"The rhythm is the disease in front of you. Do not add a bleeding drug for a tracing you do not have.","finding":"Not an infarction","status":"Wire in. No lytic."},{"id":"w0","label":"Tenecteplase, because heart block means a blocked artery","verdict":"wrong","feedback":"Heart block has several causes. This ECG is not an ST-elevation infarction."},{"id":"w1","label":"Stop pacing to get a pretty 12-lead for half an hour","verdict":"wrong","feedback":"She was in shock at a rate of 34. Do not leave her unpaced for a photograph."},{"id":"w2","label":"Isoprenaline as the only plan, and pull the wire","verdict":"wrong","feedback":"You already have a wire that captures. Do not swap it for an infusion."}]},{"id":"c8","skill":"Reassessment","title":"She is paced and awake","lead":"She is talking. The wire threshold is stable. The external pads are off but still on the chest, disconnected.","prompt":"Can she go to the general ward?","hint":"No. A temporary wire stays in a monitored bed until a permanent system is in, or a senior decision says the rhythm has recovered.","guideline":"Temporary pacing is not a ward-level appliance. Displacement is asystole.","answer":"Monitored bed until a permanent system","kind":"choice","successFinding":"Stays monitored","successStatus":"Wire stable. Still dependent.","missYou":"Not that decision","miss":"No. A temporary wire stays in a monitored bed until a permanent system is in, or a senior decision says the rhythm has recovered.","choices":[{"id":"ok","label":"Keep her monitored. Do not send a temporary wire to an unmonitored ward","verdict":"correct","feedback":"If the wire moves on a ward round, nobody is watching the rate.","finding":"Stays monitored","status":"Wire stable. Still dependent."},{"id":"w0","label":"The general ward. The pads are in the cupboard","verdict":"wrong","feedback":"The pads in a cupboard do not help a displaced wire."},{"id":"w1","label":"Home with the wire taped","verdict":"wrong","feedback":"That is not a discharge."},{"id":"w2","label":"Remove the wire overnight to prevent infection","verdict":"wrong","feedback":"Infection is a later risk. Asystole is tonight's risk.","critical":true}]},{"id":"c9","skill":"Reassessment","title":"The threshold rises","lead":"The output needed to capture has climbed. She is still pacing. There is no pneumothorax on the story.","prompt":"What do you do?","hint":"Tell the cardiology team and raise the output so it still captures. Do not ignore a rising threshold. Do not pull the wire.","guideline":"A rising threshold means the wire is becoming unreliable. Capture is maintained while it is repositioned or replaced. It is not observed from a distance.","answer":"Keep capture and get the wire revised","kind":"choice","successFinding":"Threshold addressed","successStatus":"Still capturing. Wire under review.","missYou":"Not that decision","miss":"Tell the cardiology team and raise the output so it still captures. Do not ignore a rising threshold. Do not pull the wire.","choices":[{"id":"ok","label":"Increase the output so she still captures, and have the wire revised","verdict":"correct","feedback":"Loss of capture at 3 a.m. is the complication you are preventing.","finding":"Threshold addressed","status":"Still capturing. Wire under review."},{"id":"w0","label":"Leave it. Thresholds always rise","verdict":"wrong","feedback":"Not like this, and not without a plan."},{"id":"w1","label":"Turn the box off to rest the heart","verdict":"wrong","feedback":"The heart is depending on the box."},{"id":"w2","label":"A fluid bolus for the threshold","verdict":"wrong","feedback":"Threshold is not a volume problem."}]},{"id":"c10","skill":"Reassessment","title":"A permanent pacemaker is booked for the morning","lead":"She has remained dependent all night. Electrolytes are normal. There is no drug to stop. The permanent procedure is in the morning.","prompt":"What happens overnight?","hint":"The temporary wire stays. She stays monitored. She does not get a sleeping tablet that hides a change in consciousness. Antibiotics are not automatic.","guideline":"Bridge pacing continues until the permanent system captures. Prophylactic antibiotics for a temporary wire are not a substitute for a secure wire.","answer":"Temporary wire overnight. Permanent system in the morning","kind":"choice","successFinding":"Bridged to a permanent pacemaker","successStatus":"Dependent. Booked.","missYou":"Not that decision","miss":"The temporary wire stays. She stays monitored. She does not get a sleeping tablet that hides a change in consciousness. Antibiotics are not automatic.","choices":[{"id":"ok","label":"Leave the temporary wire on overnight, monitored, until the permanent system captures","verdict":"correct","feedback":"The morning procedure is the cure. Tonight is the bridge you already built.","finding":"Bridged to a permanent pacemaker","status":"Dependent. Booked."},{"id":"w0","label":"Pull the temporary wire at midnight so the site is clean","verdict":"wrong","feedback":"She has no underlying rate you can live with.","critical":true},{"id":"w1","label":"Cancel the permanent pacemaker. One stable night is a cure","verdict":"wrong","feedback":"Stable because she is paced."},{"id":"w2","label":"A beta blocker for the paced rate of 80","verdict":"wrong","feedback":"Do not slow the only rate she has."}]}]},{"id":"cardio","title":"Cardiogenic shock","syndrome":"Cold, wet, wires in the sternum","minutes":"14 min","difficulty":"Core","available":true,"summary":"The film is edema and old sternal wires. The pressure is 78. This is not a litre of saline.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/cardio.jpg","patient":"Breathless and cold the day after a cardiac admission","ageSex":"71-year-old man","chart":["Teaching case. Not a prescription.","Cool hands, wet lungs, lactate 5. A previous sternotomy. No fever. Systolic pressure 78 on no support."],"opening":{"lkwMin":20,"status":"Cold and wet.","sbp":78,"dbp":50,"hr":118,"rr":28,"spo2":88,"glucose":164},"stages":[{"id":"study","skill":"Investigation","title":"What do you look at first?","lead":"He is shocked and hypoxic. You need the lungs and the pump, in that order of speed.","prompt":"What do you obtain?","hint":"A portable film and a bedside echo. Not a fluid challenge as the test.","guideline":"Cold and wet shock is cardiogenic until the echo says otherwise. Fluid is not the diagnostic test.","answer":"Film and an echocardiogram","kind":"choice","successFinding":"Studies going","successStatus":"Film up. Echo next.","missYou":"Not that choice","miss":"A portable film and a bedside echo. Not a fluid challenge as the test.","choices":[{"id":"both","label":"Portable chest film and a bedside echocardiogram","verdict":"correct","feedback":"The film shows the water. The echo shows the pump. Neither is a reason to pour in saline first.","finding":"Film and echo planned","status":"Film on the screen."},{"id":"fluid","label":"500 mL saline, and repeat, as a fluid challenge","verdict":"wrong","feedback":"He is wet and cold. A challenge floods the lungs.","critical":true},{"id":"ct","label":"Contrast CT of the whole aorta before any support","verdict":"wrong","feedback":"He is too unstable for a diagnostic tour. Support him and use the echo."},{"id":"dop","label":"Renal-dose dopamine and the ward","verdict":"wrong","feedback":"There is no renal-dose dopamine that treats cardiogenic shock, and the ward is unsafe."}]},{"id":"click","skill":"Localization","title":"Click the edema, not the wires","lead":"The lungs are hazy on both sides. Metal wires sit in the sternum from an old operation. The wires are not today's disease.","prompt":"Click the alveolar edema.","hint":"The white haze in the lungs is the edema. The bright twists in the midline are old wires.","guideline":"Bilateral edema with shock and a cold periphery is cardiogenic until the echo disagrees. The wires only tell you he has had a sternotomy.","answer":"Pulmonary edema","image":{"src":"sim/cases/cardio.jpg","alt":"Chest radiograph. Bilateral edema and old sternal wires.","caption":"Bilateral pulmonary edema."},"kind":"hotspot","successFinding":"Wet lungs","successStatus":"Wet lungs","missYou":"Clicked the sternal wires","miss":"Those wires are old. Today's finding is the haze in the lungs.","regions":[{"id":"ed","verdict":"correct","cx":0.3,"cy":0.46,"rx":0.14,"ry":0.14,"you":"Alveolar edema","feedback":"That haze is edema in the lung."},{"id":"ed2","verdict":"correct","cx":0.72,"cy":0.46,"rx":0.12,"ry":0.12,"you":"Alveolar edema","feedback":"The other lung is wet as well."},{"id":"wire","verdict":"wrong","cx":0.52,"cy":0.32,"rx":0.06,"ry":0.08,"you":"Sternal wires","feedback":"Those are old wires. They are not the cause of today's shock. Click the edema."}]},{"id":"name","skill":"Interpretation","title":"Name the shock","lead":"Cold hands, wet film, lactate up, pressure 78.","prompt":"Which shock is this?","hint":"Cardiogenic. Cold and wet. Not distributive warmth, and not a fluid-responsive hypovolemia.","guideline":"Norepinephrine is a reasonable first vasopressor when the pressure is this low. An inotrope is added for the cold pump once you have a pressure. A litre of saline is not the treatment.","answer":"Cardiogenic shock","kind":"choice","successFinding":"Cardiogenic shock","successStatus":"Wet and cold.","missYou":"Not that choice","miss":"Cardiogenic. Cold and wet. Not distributive warmth, and not a fluid-responsive hypovolemia.","choices":[{"id":"cs","label":"Cardiogenic shock. Cold and wet","verdict":"correct","feedback":"Support the pressure. Do not flood him. Get the echo if it is not already on the machine.","finding":"Cardiogenic shock","status":"Pressor being drawn up."},{"id":"sep","label":"Septic shock. A 30 mL/kg fluid bolus","verdict":"wrong","feedback":"He is cold, not warm, and the film is already edema. A sepsis bolus is the wrong recipe.","critical":true},{"id":"hyp","label":"Hypovolemic shock from poor intake","verdict":"wrong","feedback":"Hypovolemia has dry lungs. These lungs are wet."},{"id":"ana","label":"Anaphylaxis","verdict":"wrong","feedback":"There is no rash, no trigger, and the film is edema from pressure, not bronchospasm."}],"image":{"src":"sim/cases/cardio.jpg","alt":"Name the shock","caption":"Name the shock"}},{"id":"drug","skill":"Decision","title":"The pressure is 78","lead":"The echo, when it arrives, shows a poorly contracting left ventricle and no large pericardial collection.","prompt":"What do you start?","hint":"Norepinephrine to get a pressure. Do not start with nitroprusside. Do not give a litre.","guideline":"In hypotensive cardiogenic shock a vasopressor comes before a pure vasodilator. Dobutamine or a similar inotrope is added if he stays cold once the pressure exists.","answer":"Norepinephrine","kind":"choice","successFinding":"Norepinephrine started","successStatus":"Pressure rising slowly.","missYou":"Not that choice","miss":"Norepinephrine to get a pressure. Do not start with nitroprusside. Do not give a litre.","choices":[{"id":"nor","label":"Norepinephrine now. No fluid bolus. Inotrope if he stays cold once the pressure exists","verdict":"correct","feedback":"Make a pressure first. Then an inotrope for the pump. The echo has excluded a tamponade you would have drained.","sbp":95,"finding":"Norepinephrine","status":"Pressure 95. Still cool."},{"id":"fluid","label":"One litre, then another, guided by nothing","verdict":"wrong","feedback":"The lungs are wet and the ventricle is poor. Fluid will worsen both.","critical":true},{"id":"ntp","label":"Nitroprusside alone","verdict":"wrong","feedback":"A pure vasodilator at a systolic pressure of 78 drops the coronary perfusion further."},{"id":"dop","label":"Low-dose dopamine for the kidney","verdict":"wrong","feedback":"Renal-dose dopamine does not exist as a useful treatment. He needs a pressure and a pump."}]},{"id":"ino","skill":"Reassessment","title":"Pressure 95, still cold, lactate rising","lead":"He has a mean pressure you can defend, but the hands are cold and the lactate has gone from 5 to 6.","prompt":"What do you add?","hint":"An inotrope. Not more fluid.","guideline":"Once a pressure exists, dobutamine or a similar inotrope treats the low output. More fluid treats a different shock.","answer":"Add an inotrope","kind":"choice","successFinding":"Inotrope added","successStatus":"Warmer. Lactate watched.","missYou":"Not that choice","miss":"An inotrope. Not more fluid.","choices":[{"id":"dob","label":"Add an inotrope. Do not add fluid","verdict":"correct","feedback":"The constraint was pressure. That is better. The remaining problem is the pump.","sbp":98,"finding":"Inotrope added","status":"Pressure held. Inotrope running."},{"id":"more","label":"Another litre, because the lactate rose","verdict":"wrong","feedback":"Lactate here is low flow, not an empty tank. The film was already wet.","critical":true},{"id":"stop","label":"Stop the norepinephrine because 95 is enough and he is cold","verdict":"wrong","feedback":"If you remove the pressure, the inotrope has nothing to work with. Add the inotrope, do not strip the vasopressor blindly."},{"id":"steroid","label":"Hydrocortisone as the main cardiac drug","verdict":"wrong","feedback":"Steroid is not the treatment of a failed pump."}]},{"id":"c6","skill":"Reassessment","title":"The inotrope is on and he is still wet","lead":"Mean pressure is 70 on norepinephrine and an inotrope. The lungs are wet. Lactate is 4. There is no new ST elevation.","prompt":"What do you do with fluid?","hint":"Stop fluid. Diurese if the pressure holds. Do not add a third vasopressor for wet lungs.","guideline":"Cardiogenic shock with wet lungs is not a fluid problem. Offload. Keep the perfusion pressure.","answer":"Diuretic. No more fluid","kind":"choice","successFinding":"Diuretic given","successStatus":"Wet. Pressure held. No more saline.","missYou":"Not that decision","miss":"Stop fluid. Diurese if the pressure holds. Do not add a third vasopressor for wet lungs.","choices":[{"id":"ok","label":"Give a diuretic if the pressure holds. No further saline","verdict":"correct","feedback":"The ventricle is failing. Filling it further makes the oxygen worse.","finding":"Diuretic given","status":"Wet. Pressure held. No more saline."},{"id":"w0","label":"A litre, because lactate means underfilling","verdict":"wrong","feedback":"Lactate here is a weak heart, not an empty one.","critical":true},{"id":"w1","label":"A third vasopressor and no diuretic","verdict":"wrong","feedback":"The pressure is already 70. The lungs are the problem you have not treated."},{"id":"w2","label":"A beta blocker for the rate of 110","verdict":"wrong","feedback":"He is in shock. Do not block the remaining contractility."}]},{"id":"c7","skill":"Reassessment","title":"Lactate is falling. The hands are warmer","lead":"Lactate is 2.4. Mean pressure is 72. Urine has started. He is still on both infusions.","prompt":"Do you add anything else?","hint":"No new drug. Do not start a beta blocker yet. Do not wean both infusions at once.","guideline":"Improvement is observed, not decorated with another agent. Weaning is one drug at a time, later.","answer":"No new drug. Do not wean both at once","kind":"choice","successFinding":"Left alone to improve","successStatus":"Warmer. Lactate falling.","missYou":"Not that decision","miss":"No new drug. Do not start a beta blocker yet. Do not wean both infusions at once.","choices":[{"id":"ok","label":"Change nothing yet. Do not add a beta blocker","verdict":"correct","feedback":"He is getting better on the current plan. A beta blocker now can reverse that.","finding":"Left alone to improve","status":"Warmer. Lactate falling."},{"id":"w0","label":"Intravenous beta blocker, now that the lactate is falling","verdict":"wrong","feedback":"Falling is not normal, and he is still on two infusions."},{"id":"w1","label":"Stop both infusions together","verdict":"wrong","feedback":"You will find out which one he needed by losing the pressure."},{"id":"w2","label":"A fluid challenge to celebrate the urine","verdict":"wrong","feedback":"The urine is from perfusion, not from a missing litre."}]},{"id":"c8","skill":"Reassessment","title":"He goes into a fast atrial fibrillation","lead":"Rate 150. Systolic pressure falls to 85. He is dizzy. The lungs are still wet.","prompt":"What do you do with the rhythm?","hint":"If he is unstable, synchronised cardioversion. Not a beta-blocker bolus. Not a fluid litre.","guideline":"Unstable atrial fibrillation in cardiogenic shock is electrically cardioverted. A beta blocker or a calcium blocker will drop the pressure further.","answer":"Synchronised cardioversion","kind":"choice","successFinding":"Cardioverted","successStatus":"Rate controlled by a shock. Pressure recovering.","missYou":"Not that decision","miss":"If he is unstable, synchronised cardioversion. Not a beta-blocker bolus. Not a fluid litre.","choices":[{"id":"ok","label":"Synchronised cardioversion. No beta-blocker bolus","verdict":"correct","feedback":"He is unstable. Electricity is the treatment. A blocking drug is the injury.","finding":"Cardioverted","status":"Rate controlled by a shock. Pressure recovering."},{"id":"w0","label":"Metoprolol 5 mg intravenous, repeated","verdict":"wrong","feedback":"That is how the blood pressure leaves.","critical":true},{"id":"w1","label":"A litre of saline so the rate slows","verdict":"wrong","feedback":"He is wet. Saline will not slow a failing heart safely."},{"id":"w2","label":"Ignore it. Atrial fibrillation is expected","verdict":"wrong","feedback":"A falling pressure and dizziness are not expected enough to ignore."}]},{"id":"c9","skill":"Reassessment","title":"He is back in sinus rhythm and warmer","lead":"Rate 90 in sinus. Lactate 1.8. Mean pressure 75 on a lower norepinephrine dose. The inotrope is unchanged. He is awake.","prompt":"What do you wean first?","hint":"Wean the norepinephrine if the pressure allows, and keep the inotrope while he is still recovering. Do not stop both.","guideline":"The vasopressor and the inotrope are weaned against the examination, one at a time. The inotrope is still treating the ventricle.","answer":"Wean the vasopressor first. Keep the inotrope","kind":"choice","successFinding":"Vasopressor weaned","successStatus":"Sinus. Still on an inotrope.","missYou":"Not that decision","miss":"Wean the norepinephrine if the pressure allows, and keep the inotrope while he is still recovering. Do not stop both.","choices":[{"id":"ok","label":"Reduce the norepinephrine. Leave the inotrope for now","verdict":"correct","feedback":"He needed both. Take away the one the blood pressure no longer needs.","finding":"Vasopressor weaned","status":"Sinus. Still on an inotrope."},{"id":"w0","label":"Stop the inotrope and the norepinephrine together","verdict":"wrong","feedback":"You will be starting them again in ten minutes."},{"id":"w1","label":"Add fluid as you wean","verdict":"wrong","feedback":"Weaning a vasopressor is not a fluid deficit."},{"id":"w2","label":"A beta blocker now that the rate is 90","verdict":"wrong","feedback":"Wait until the inotrope is a memory."}]},{"id":"c10","skill":"Reassessment","title":"The next day he is on a low-dose inotrope only","lead":"He is sitting up. Oxygen is low. Lactate is normal. The question is the ward.","prompt":"Is he ready for an unmonitored ward?","hint":"Not while an inotrope is running. He can leave when he is off it and the blood pressure holds. Restart his chronic medicines with cardiology, not by emptying the cupboard tonight.","guideline":"An inotrope is a critical-care drug. Step-down follows the infusion stopping, not the other way round.","answer":"Stay monitored until the inotrope is off","kind":"choice","successFinding":"Still monitored","successStatus":"Low-dose inotrope. Not for the ward.","missYou":"Not that decision","miss":"Not while an inotrope is running. He can leave when he is of
