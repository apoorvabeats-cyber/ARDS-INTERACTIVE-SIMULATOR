 Use norepinephrine, and treat the rate only if it is the thing making her worse."},{"id":"wait-culture","label":"Vancomycin only, and only after the culture result and the CT are back.","verdict":"wrong","critical":true,"delayMin":50,"feedback":"Waiting for a species is how septic shock gets its mortality. Cover a community urinary source now, with a drug that treats gram-negative infection. Vancomycin alone does not. Narrow the antibiotic when the culture speaks."}]},{"id":"click-lv","skill":"Localization","title":"Click the left ventricular cavity","lead":"Parasternal long-axis view, teaching still. You are separating an empty hyperdynamic ventricle from a baggy one, a dilated right ventricle, or an effusion.","prompt":"Click the left ventricular cavity.","hint":"The cavity is the small black space in the middle of the sector, inside the muscle. The near field at the top is the right-ventricular side, and it is not a large chamber. Do not click the gray muscle.","guideline":"In early septic shock the left ventricle is often small and hyperdynamic, which supports fluid and a vasopressor rather than an inotrope. A dilated, poorly contracting ventricle changes that plan. A large right ventricle suggests obstruction. An effusion with chamber collapse is tamponade.","answer":"Small left ventricular cavity","image":{"src":"sim/shock-plax.jpg","alt":"Teaching illustration of a parasternal long-axis view with a small left ventricular cavity","caption":"Parasternal long-axis echocardiogram, teaching illustration. Not a real study. The black space in the middle of the sector is the ventricular cavity."},"kind":"hotspot","successFinding":"Small, underfilled left ventricular cavity","successStatus":"Hyperdynamic, underfilled left ventricle. Right ventricle not dilated.","missYou":"Clicked off the left ventricular cavity","miss":"The cavity is the small black center of the sector. Gray tissue around it is muscle. The top of the sector is the right-ventricular side.","regions":[{"id":"lv","verdict":"correct","cx":0.45,"cy":0.47,"rx":0.065,"ry":0.06,"you":"Small left ventricular cavity","feedback":"That black space is a small cavity, not a dilated bag. The ventricle is underfilled and, in this context, hyperdynamic. There is no large pericardial effusion around it, and the near field is not a strained right ventricle. This is the echo of distributive shock that can still take fluid, not the echo of cardiogenic shock."},{"id":"rv","verdict":"wrong","cx":0.5,"cy":0.18,"rx":0.11,"ry":0.055,"you":"Right-ventricular side, near field","feedback":"That is the near field, on the right-ventricular side of a parasternal long-axis view. It is not a dilated, pressure-overloaded right ventricle. Come down into the small black cavity in the middle of the sector."},{"id":"wall","verdict":"wrong","cx":0.66,"cy":0.42,"rx":0.07,"ry":0.08,"you":"Myocardium","feedback":"That gray tissue is muscle. The finding is the size of the cavity it surrounds. The cavity is the black center, and it is small."}]},{"id":"phenotype","skill":"Classification","title":"Name the shock","lead":"The left ventricular cavity is small. The right ventricle is not dilated. There is no pericardial effusion. Lungs are clear. Lactate is 5.4. She is febrile, with a urinary source. Mean pressure is about 55.","prompt":"Which phenotype fits?","hint":"Cardiogenic shock has a full, poorly contracting left ventricle. Tamponade has an effusion and collapsing chambers. Massive embolism has a dilated right ventricle. She has none of those.","guideline":"Septic shock is distributive: low systemic vascular resistance, often with a high cardiac output once volume is restored. Bedside ultrasound is what stops you treating it as cardiogenic, obstructive, or tamponade.","answer":"Distributive septic shock with an underfilled ventricle","kind":"choice","successFinding":"Distributive septic shock. Ventricle underfilled.","successStatus":"Septic shock. Not cardiogenic, not tamponade.","missYou":"","miss":"","choices":[{"id":"sepsis","label":"Distributive shock, most likely septic, with an underfilled ventricle. Not cardiogenic. Not tamponade. Not a massive pulmonary embolus.","verdict":"correct","feedback":"Fever, a source, lactate, and a small hyperdynamic ventricle is septic shock until a better story appears. She can take measured fluid. She needs a vasopressor. She does not need dobutamine for a ventricle that is emptying, a needle in a pericardium that is empty, or a thrombolytic for a right ventricle that is not dilated.","finding":"Phenotype: septic, distributive, underfilled.","status":"Septic shock. Echo does not show cardiogenic or obstructive shock."},{"id":"cardio","label":"Cardiogenic shock. Start dobutamine and stop all fluid.","verdict":"wrong","critical":true,"feedback":"Cardiogenic shock is a dilated, poorly contracting left ventricle, often with pulmonary edema. Hers is small. Dobutamine in profound vasoplegia drops the pressure further. Fluid is not forbidden. It is titrated."},{"id":"tamponade","label":"Tamponade. Pericardiocentesis now.","verdict":"wrong","critical":true,"feedback":"Tamponade needs an effusion and chambers that cannot fill. There is no effusion on this view. A needle into that pericardium is a complication, not a rescue."},{"id":"pe","label":"Massive pulmonary embolism. Give a thrombolytic.","verdict":"wrong","critical":true,"feedback":"Obstructive shock from embolism shows a dilated, strained right ventricle. That is not this view, and the story is fever and dysuria. A thrombolytic here is the wrong drug for the wrong disease."}]},{"id":"resuscitate","skill":"Resuscitation","title":"Fluid and the first vasopressor","lead":"Weight 80 kg. Lungs are clear. The ventricle is underfilled. Mean pressure is about 55. Lactate is 5.4. Antibiotics are being mixed if you ordered them. She has had no measured fluid yet.","prompt":"How do you resuscitate the pressure?","hint":"Norepinephrine is first-line, titrated to a mean pressure of 65, not 80. While the lungs are clear and the ventricle is empty, about 30 mL/kg of crystalloid is the classic initial volume: 2.4 liters for 80 kg. Recheck before you reflexively give more.","guideline":"Norepinephrine is the first vasopressor in septic shock, with a usual mean-pressure target of 65 mmHg. Initial crystalloid, often quoted as 30 mL/kg, is for hypoperfusion when overload is absent. More fluid is an active decision, not an automatic second 30 mL/kg.","answer":"Norepinephrine to a mean pressure of 65, plus about 30 mL/kg if the lungs stay clear","kind":"choice","successFinding":"Norepinephrine started and initial crystalloid ordered","successStatus":"Norepinephrine running. First liters going in. Lungs still clear.","missYou":"","miss":"","choices":[{"id":"both","label":"Start norepinephrine now and titrate to a mean pressure of 65. Give about 30 mL/kg crystalloid, 2.4 liters, while the lungs stay clear and the cava is not plethoric. Repeat the lactate.","verdict":"correct","sbp":88,"dbp":48,"feedback":"She needs both. A mean pressure of 55 is a vasopressor indication now, not after the third liter. Thirty milliliters per kilogram of 80 kg is 2.4 liters, and her empty ventricle says the first part of that is welcome. She is not at the target of 65 yet. Stop if crackles appear or the inferior vena cava stops collapsing. Chasing a mean pressure of 85 just adds arrhythmia and vasoconstriction.","finding":"Norepinephrine for MAP 65. Initial 30 mL/kg crystalloid.","status":"Pressure 88/48 on norepinephrine. Fluid running. Lungs clear."},{"id":"more-fluid","label":"No vasopressor. Another 3 liters after an initial 2 liters, because sepsis is a fluid problem.","verdict":"wrong","feedback":"Fluid without a vasopressor leaves a vasodilated patient hypotensive while you search for a liter that will not come. Start norepinephrine. Give the initial volume. Then reassess, instead of committing to 5 liters on principle."},{"id":"vaso-only","label":"Vasopressin as the only drug, fixed dose, and no fluid because the lactate is a laboratory problem.","verdict":"wrong","critical":true,"feedback":"Vasopressin is an adjunct, not the first agent, and it is not started alone. The lactate of 5.4 with an empty heart is hypoperfusion. She needs norepinephrine and measured crystalloid."},{"id":"pressor-no-fluid","label":"Norepinephrine to a mean pressure of 65, and no fluid, because septic shock is pure vasoplegia.","verdict":"partial","sbp":88,"dbp":54,"feedback":"Norepinephrine is the right drug and 65 is the right target. The ventricle is empty and the lungs are clear, so withholding all crystalloid ignores the volume she can still use. Give the initial 30 mL/kg and reassess. Do not give a second 30 by habit.","finding":"Norepinephrine without the initial fluid.","status":"On norepinephrine. Still underfilled."}]},{"id":"second","skill":"Vasopressors","title":"The first agent is not enough","lead":"She has received 2 liters. Norepinephrine is 0.25 micrograms per kilogram per minute. Mean pressure is 61. Lactate has fallen only to 4.1. Lungs are still clear. There is no abscess a surgeon must drain tonight.","prompt":"What do you add?","hint":"Vasopressin 0.03 units per minute is the usual second vasopressor, not a bolus and not a substitute for norepinephrine. Hydrocortisone is reasonable while shock still needs a high-dose vasopressor. It does not replace the second agent. Do not climb norepinephrine to extreme doses first.","guideline":"Vasopressin 0.03 units per minute is added to norepinephrine when the dose is rising and the mean pressure is still short of target. It is not titrated up like norepinephrine. IV hydrocortisone is suggested for septic shock with an ongoing vasopressor requirement. The mean-pressure target stays 65.","answer":"Add vasopressin 0.03 units per minute, and consider hydrocortisone","kind":"choice","atStart":{"sbp":86,"dbp":48,"hr":118,"spo2":96,"status":"Two liters in. Norepinephrine 0.25 mcg/kg/min. Mean pressure still about 61."},"successFinding":"Vasopressin added as the second vasopressor","successStatus":"Norepinephrine plus vasopressin. Mean pressure recovering.","missYou":"","miss":"","choices":[{"id":"vaso","label":"Add vasopressin at 0.03 units per minute. Consider hydrocortisone 50 mg intravenously every 6 hours while she still needs a vasopressor. Keep the mean-pressure target at 65. Continue antibiotics.","verdict":"correct","sbp":108,"dbp":62,"feedback":"At 0.25 micrograms per kilogram per minute of norepinephrine with a mean pressure still under 65, a second agent is due. Vasopressin is a fixed 0.03 units per minute, not a push and not a titration to 0.1. Hydrocortisone is adjunctive for ongoing shock. It is not the drug that replaces norepinephrine, and a vitamin infusion is not the next step. Source control here is the antibiotic and the urine. A CT can happen when the pressure allows.","finding":"Vasopressin 0.03 U/min added. Steroid considered.","status":"Two vasopressors. Pressure 108/62."},{"id":"max","label":"Take norepinephrine to 1.5 micrograms per kilogram per minute before adding anything.","verdict":"wrong","feedback":"Extreme single-agent doses buy ischemia. The usual move, once norepinephrine is in the range of a quarter microgram per kilogram per minute and the target is still missed, is to add vasopressin rather than to triple the first drug."},{"id":"cocktail","label":"Stop norepinephrine. Start a vitamin C cocktail as the rescue.","verdict":"wrong","critical":true,"feedback":"Stopping norepinephrine for an unproven cocktail drops the pressure you just spent an hour building. Keep the vasopressor. Add vasopressin. Do not replace resuscitation with a vitamin."},{"id":"steroid-only","label":"Hydrocortisone only. No second vasopressor.","verdict":"partial","feedback":"A steroid is a fair adjunct when shock is ongoing. It is not the agent that moves the mean pressure in the next minutes. Add vasopressin as well, at 0.03 units per minute, and keep norepinephrine running.","finding":"Steroid without a second vasopressor.","status":"Hydrocortisone ordered. Still on norepinephrine alone."}]},{"id":"click-ivc","skill":"Localization","title":"The next morning","lead":"Norepinephrine is down to 0.06 micrograms per kilogram per minute. Mean pressure is 74. Lactate is 1.8. Overnight she received maintenance fluid on top of the resuscitation. Saturation is 90% on 4 liters, and she has new crackles. This is a subcostal view.","prompt":"Click the inferior vena cava.","hint":"The lumen is the wide black tube. The liver is the gray organ beside it. A collapsing, slit-like vein would be flat. This one is not.","guideline":"A plethoric inferior vena cava with little inspiratory collapse, plus new pulmonary edema, means more crystalloid is likely to harm. Fluid responsiveness is reassessed. It is not assumed from yesterday\u2019s lactate.","answer":"Plethoric inferior vena cava","image":{"src":"sim/shock-ivc.jpg","alt":"Teaching illustration of a plethoric inferior vena cava beside the liver","caption":"Subcostal ultrasound, teaching illustration of a dilated inferior vena cava. Not a real study. The vein is the black lumen. The liver is gray."},"kind":"hotspot","atStart":{"sbp":112,"dbp":55,"hr":96,"rr":24,"spo2":90,"status":"Next morning. Low-dose norepinephrine. New crackles."},"successFinding":"Plethoric inferior vena cava","successStatus":"IVC dilated. New crackles. No longer fluid responsive.","missYou":"Clicked off the vein","miss":"The inferior vena cava is the wide black tube in the sector. The gray tissue is liver. Click the lumen.","regions":[{"id":"ivc","verdict":"correct","cx":0.6,"cy":0.635,"rx":0.16,"ry":0.055,"you":"Dilated inferior vena cava","feedback":"That wide black lumen is a plethoric inferior vena cava, not a slit. Combined with new crackles and a falling saturation, she is no longer the empty patient from yesterday. More saline will worsen the oxygen. The vein does not, by itself, prove the filling pressure, but it is enough to stop the fluid."},{"id":"liver","verdict":"wrong","cx":0.34,"cy":0.28,"rx":0.15,"ry":0.12,"you":"Liver","feedback":"That gray organ is liver. The vein is the black tube next to it, and the tube is wide. Click the lumen."}]},{"id":"stop-fluid","skill":"Reassessment","title":"What do you do with fluid now?","lead":"The cava is plethoric. Crackles are new. Saturation is 90% on 4 liters. Norepinephrine is 0.06 micrograms per kilogram per minute and the mean pressure is 74. Lactate is 1.8. Yesterday\u2019s lactate was 5.4.","prompt":"Choose the fluid plan for today.","hint":"Perfusion has been restored. The lung is wet and the vein is full. Stop boluses and stop maintenance fluid. A diuretic is reasonable if the oxygen is the problem and the pressure stays up. Do not repeat 30 mL/kg because of yesterday.","guideline":"After the initial resuscitation, further fluid is guided by reassessment. Pulmonary edema and a plethoric cava are reasons to stop, and often to remove, fluid. A falling lactate means the earlier hypoperfusion is improving. It is not an order for more saline.","answer":"Stop fluid. Diurese if the oxygen requires it and the pressure holds.","kind":"choice","successFinding":"Fluids stopped for volume overload","successStatus":"Fluid stopped. Diuretic ordered. Vasopressor weaning.","missYou":"","miss":"","choices":[{"id":"stop","label":"Stop boluses and maintenance fluid. If the pressure holds, give a diuretic for the edema. Keep a low-dose vasopressor rather than flooding her to come off it. Recheck the saturation.","verdict":"correct","spo2":94,"feedback":"Yesterday she was empty. Today she is full, wet, and perfusing, with a lactate of 1.8 and a mean pressure of 74 on a small dose of norepinephrine. More crystalloid treats a problem she no longer has. Stopping the fluid, and removing some of it, is how the oxygen comes back. Wean the vasopressor on its own merits. Do not buy a lower norepinephrine dose with pulmonary edema.","finding":"Fluids stopped. Diuretic for hydrostatic edema.","status":"Overload recognized. Saturation recovering on less fluid."},{"id":"repeat","label":"Repeat 30 mL/kg. The lactate was 5.4 yesterday, so the protocol is not finished.","verdict":"wrong","critical":true,"feedback":"Thirty milliliters per kilogram was an initial resuscitation target, not a daily subscription. Giving it again to a plethoric, crackling patient is how non-cardiogenic resuscitation becomes pulmonary edema. Her lactate has already fallen."},{"id":"dobutamine","label":"Start dobutamine. Occult cardiogenic shock explains the crackles.","verdict":"wrong","feedback":"Crackles after several liters, with a full cava and a ventricle that was empty yesterday, are volume until you prove otherwise. Dobutamine is for a low-output ventricle. You have not shown one. Stop the fluid first."},{"id":"albumin","label":"Albumin 100 g and another liter of saline, to pull fluid into the vessels.","verdict":"wrong","feedback":"Albumin is not a diuretic, and adding saline beside it increases the total volume. She needs less fluid, not a different brand of more fluid. Stop the infusions and consider a diuretic."}]}]},{"id":"pancreatitis","title":"Acute pancreatitis","syndrome":"Biliary, early organ failure","minutes":"12 min","difficulty":"Core","available":true,"summary":"Epigastric pain to the back after known gallstones. Start the fluid, skip the early scan, then click the necrosis and choose the drain rather than an open operation.","queued":"","clockLabel":"Since the pain began","objectives":["Make the diagnosis without an early CT","Choose a moderate lactated Ringer plan","Find the gallstone cause","Click the non-enhancing pancreas","Drain infected necrosis instead of opening the abdomen"],"thumb":"sim/pancreatitis-ct.jpg","patient":"R. Mehta","ageSex":"52-year-old man","chart":["Teaching case. Not a real patient, and not a substitute for a pancreatitis decision.","Eight hours of epigastric pain going through to the back. Two vomits. No fever at the door.","Gallstones on an ultrasound last year. Rare alcohol. No new medicine. Weight 80 kg.","Tender epigastrium. No rigid abdomen and no free air on the erect chest film.","Heart rate 118. Blood pressure 92/58. Respiratory rate 26. Oxygen saturation 95 percent on air.","Glucose 168 mg/dL. Lipase is not back yet."],"opening":{"lkwMin":480,"status":"Epigastric pain to the back. Hypotensive.","sbp":92,"dbp":58,"hr":118,"rr":26,"spo2":95,"glucose":168},"stages":[{"id":"first-move","skill":"Resuscitation","title":"What do you do first?","lead":"The pain is typical, the blood pressure is low, and the lipase is still in the centrifuge. The scanner is free. The theatre is not the next room you want.","prompt":"What is the first move?","hint":"Two of pain, enzymes, and imaging make the diagnosis. You already have the pain. Do not spend the first hour on a scan he may not need.","guideline":"Characteristic pain plus a lipase at least three times the upper limit is enough to diagnose pancreatitis. Contrast CT on the first day is for diagnostic doubt, not for a classic story, and it underestimates necrosis.","answer":"Lipase, and lactated Ringer while you watch the pulse","kind":"choice","successFinding":"Lipase sent. Lactated Ringer started.","successStatus":"Fluid running. Lipase pending.","missYou":"","miss":"","choices":[{"id":"lipase-fluid","label":"Send a lipase and start intravenous lactated Ringer","verdict":"correct","feedback":"The story is already characteristic. The lipase confirms it. He is tachycardic and hypotensive, so fluid starts now, not after a scan. Contrast CT can wait until the diagnosis is in doubt or he is failing later.","finding":"Lipase sent. Lactated Ringer started.","status":"Fluid running. Lipase pending.","sbp":98,"hr":110},{"id":"ct-first","label":"Contrast CT of the abdomen before any fluid","verdict":"wrong","delayMin":40,"feedback":"An early contrast scan does not diagnose this faster than a lipase, and it can miss necrosis that has not declared itself. He is under-filled. Resuscitate and send the enzyme. Image later if you still need to."},{"id":"laparotomy","label":"Immediate exploratory laparotomy","verdict":"wrong","critical":true,"delayMin":90,"feedback":"There is no peritonism and no free air. Opening the abdomen for uncomplicated early pancreatitis adds harm and does not treat the inflammation. This is a medical resuscitation first."},{"id":"antibiotic","label":"Prophylactic imipenem, and no fluid yet","verdict":"wrong","feedback":"Antibiotics do not prevent infection of necrosis, and they are not the treatment of hypovolemia. He needs fluid and a diagnosis, not a carbapenem at the door."}]},{"id":"diagnosis","skill":"Diagnosis","title":"The lipase is back","lead":"Lipase is 2,140 U/L. The laboratory upper limit is 60. The pain has not moved. He has had one litre of lactated Ringer.","prompt":"What do you call this, and do you scan now?","hint":"The enzyme is more than three times the upper limit. Imaging is the third way to diagnose, not a requirement once the first two are met.","guideline":"Acute pancreatitis is diagnosed with two of three: typical pain, lipase or amylase at least three times the upper limit, or characteristic imaging. CT is reserved for doubt or for later deterioration.","answer":"Acute pancreatitis. No CT today.","kind":"choice","successFinding":"Acute pancreatitis diagnosed without an early CT","successStatus":"Lipase 2,140. Resuscitation continues.","missYou":"","miss":"","choices":[{"id":"no-scan","label":"Acute pancreatitis. Continue resuscitation. Do not scan today.","verdict":"correct","feedback":"Pain plus a lipase more than thirty times the upper limit is the diagnosis. A contrast CT this morning will not change the fluid, and it may under-call necrosis. Look for the cause and watch the organs.","finding":"Acute pancreatitis diagnosed without an early CT","status":"Lipase 2,140. Resuscitation continues."},{"id":"ct-anyway","label":"The lipase is high, so he needs a contrast CT now","verdict":"wrong","delayMin":30,"feedback":"The lipase already answered the diagnostic question. Early CT is for a doubtful abdomen, not for a textbook enzyme. It also delays the fluid and the search for a stone."},{"id":"discharge","label":"Gastritis. Discharge on an oral antacid.","verdict":"wrong","critical":true,"feedback":"A lipase of 2,140 is not gastritis. Sending him home with this pulse and blood pressure misses organ failure at the door."},{"id":"ercp-all","label":"Urgent ERCP for every patient with gallstones","verdict":"wrong","feedback":"A stone in the gallbladder is not an indication for an emergency ERCP. Urgent ERCP is for cholangitis or a stone still blocking the bile duct. He has no fever and no jaundice yet."}]},{"id":"fluids","skill":"Fluids","title":"Set the fluid plan","lead":"He weighs 80 kg. After one litre he is still dry: heart rate 110, blood pressure 98/64, urine 15 mL in the last hour. The lungs are clear.","prompt":"Which fluid plan do you write?","hint":"Lactated Ringer is the usual fluid. More is not better. The aggressive protocol caused more fluid overload without a better recovery.","guideline":"Moderate lactated Ringer, about 1.5 mL/kg per hour after a bolus only if hypovolemic, is preferred to a prolonged high-rate infusion. Stop or slow the fluid if oxygen falls or the lungs fill. The WATERFALL trial is the reason the aggressive arm is not the default.","answer":"Moderate lactated Ringer, reassessed every few hours","kind":"choice","atStart":{"hr":110,"sbp":98,"dbp":64,"status":"Still volume-responsive. Lungs clear."},"successFinding":"Moderate lactated Ringer plan","successStatus":"1.5 mL/kg/h of lactated Ringer. Urine watched.","missYou":"","miss":"","choices":[{"id":"moderate","label":"Lactated Ringer at about 1.5 mL/kg per hour, and reassess urine, pulse, and oxygen","verdict":"correct","feedback":"He is hypovolemic, so he can have a bolus, then a moderate rate, about 120 mL per hour at this weight, not a day-long flood. Recheck the urine, the pulse, and the saturation. If the lungs get wet, the fluid stops.","finding":"Moderate lactated Ringer plan","status":"1.5 mL/kg/h of lactated Ringer. Urine watched.","sbp":108,"dbp":68,"hr":98,"spo2":96},{"id":"aggressive","label":"A 20 mL/kg bolus, then 3 mL/kg per hour for a full day","verdict":"wrong","feedback":"That is the aggressive arm. In the WATERFALL trial it caused more fluid overload and did not improve outcomes. Use a moderate rate and stop when the circulation has answered.","spo2":91,"rr":30,"status":"More fluid. Saturation falling."},{"id":"saline","label":"Normal saline at that same aggressive rate","verdict":"wrong","feedback":"Saline in large volume tends toward a hyperchloremic acidosis, and the rate is still the aggressive one. Lactated Ringer at a moderate rate is the plan."},{"id":"none","label":"No further fluid. The low pressure is only pain.","verdict":"wrong","critical":true,"feedback":"Pain does not explain a heart rate of 110 and 15 mL of urine in an hour. Untreated hypovolemia is how early pancreatitis becomes prolonged organ failure."}]},{"id":"cause","skill":"Cause","title":"Name the cause today","lead":"The pain is settling toward the moderate fluid. You still do not know why the pancreas inflamed. The history has gallstones and almost no alcohol.","prompt":"What do you arrange now?","hint":"The common causes are gallstones, alcohol, high triglycerides, and a medicine. Ultrasound is the first look at the gallbladder. Save MRCP for when the duct is the question.","guideline":"Right-upper-quadrant ultrasound is the first test for a biliary source. A triglyceride level is needed when the serum is lipemic or the history suggests it. MRCP or EUS comes later, not ahead of resuscitation.","answer":"Ultrasound for stones, plus triglycerides if the serum is lipemic","kind":"choice","successFinding":"Ultrasound shows gallbladder stones. No bile-duct dilatation.","successStatus":"Biliary pancreatitis. No cholangitis.","missYou":"","miss":"","choices":[{"id":"us","label":"Right-upper-quadrant ultrasound, and a triglyceride level if the blood looks lipemic","verdict":"correct","feedback":"Ultrasound shows stones in the gallbladder and a bile duct that is not dilated. There is no fever and no jaundice, so this is biliary pancreatitis without cholangitis. The gallbladder will need to come out, but not tonight.","finding":"Ultrasound shows gallbladder stones. No bile-duct dilatation.","status":"Biliary pancreatitis. No cholangitis."},{"id":"mrcp","label":"MRCP tonight, before ultrasound, while he is still hypotensive","verdict":"wrong","delayMin":50,"feedback":"MRCP is a good test for a stone in the duct when ultrasound has not answered that question. It is a poor first test in a man who still needs the ward, the fluid, and a simple ultrasound."},{"id":"ignore","label":"The cause can wait until the clinic","verdict":"wrong","feedback":"Missing gallstones means a second attack. The cause is looked for on this admission, even when the operation itself waits."},{"id":"eus","label":"Endoscopic ultrasound as the first test","verdict":"wrong","feedback":"Endoscopic ultrasound is a second-line look for microlithiasis or a missed stone. It is not the test you book from the door. Start with a transabdominal ultrasound."}]},{"id":"click-necrosis","skill":"Localization","title":"Click the necrosis","lead":"Forty-eight hours on, the urine is still poor, the saturation is 92 percent on oxygen, and the creatinine has risen. A contrast CT is now justified. One part of the gland does not take up contrast.","prompt":"Click the non-enhancing pancreatic body.","hint":"Radiological orientation: the patient\u2019s left is marked L. The dark geographic area is in the gland, not in the liver and not in the spleen.","guideline":"Necrosis is pancreatic tissue that does not enhance. It is usually obvious after the first several days, which is why a scan at the door is a poor map. Necrosis alone is not proof of infection.","answer":"Non-enhancing pancreatic body","image":{"src":"sim/pancreatitis-ct.jpg","alt":"Teaching illustration of an axial contrast CT with non-enhancing pancreatic body","caption":"Contrast CT, teaching illustration. Patient\u2019s left is marked L. Not a real scan."},"kind":"hotspot","atStart":{"spo2":92,"rr":28,"hr":108,"sbp":104,"dbp":64,"status":"Organ failure still present at 48 hours."},"successFinding":"Necrosis in the pancreatic body","successStatus":"Necrotizing pancreatitis. No gas on this scan.","missYou":"Clicked outside the non-enhancing gland","miss":"Not that organ. The necrosis is the dark geographic area in the pancreas, just toward the side marked L of the midline.","regions":[{"id":"necrosis","verdict":"correct","cx":0.57,"cy":0.36,"rx":0.1,"ry":0.08,"you":"Non-enhancing pancreatic body","feedback":"That dark area in the gland does not enhance. This is necrosis of the pancreatic body, with a little fluid around it. There is no gas. Necrosis is not the same thing as infection, so it is not an indication for an antibiotic or an operation today."},{"id":"liver","verdict":"wrong","cx":0.22,"cy":0.42,"rx":0.14,"ry":0.16,"you":"Liver","feedback":"That large organ on the side marked R is the liver. It is not the inflamed gland. Come back toward the midline, slightly toward the L marker."},{"id":"spleen","verdict":"wrong","cx":0.84,"cy":0.4,"rx":0.08,"ry":0.1,"you":"Spleen","feedback":"That oval on the side marked L is the spleen. The pancreas sits medial to it. The non-enhancing tissue is closer to the midline."},{"id":"spine","verdict":"wrong","cx":0.5,"cy":0.74,"rx":0.08,"ry":0.08,"you":"Vertebra","feedback":"The bright white structure at the back is the vertebra. Necrosis is soft tissue in front of it, in the pancreas."}]},{"id":"read-ct","skill":"Interpretation","title":"What does this scan change?","lead":"Same slice. Necrosis in the body, a rim of fluid, no gas, and organ failure that has already lasted two days.","prompt":"Which plan matches the scan?","hint":"Separate three decisions: antibiotics, feeding, and an operation. Necrosis without gas is not an infected collection.","guideline":"Prophylactic antibiotics do not prevent infection of necrosis. Enteral feeding is preferred if he cannot eat. Open necrosectomy is not the treatment of sterile necrosis.","answer":"No prophylactic antibiotic. Feed the gut. Do not operate today.","image":{"src":"sim/pancreatitis-ct.jpg","alt":"The same teaching CT of pancreatic necrosis","caption":"Same teaching illustration. Not a real scan."},"kind":"choice","successFinding":"Sterile necrosis. No antibiotic. Enteral plan.","successStatus":"Necrosis without gas. Organs supported.","missYou":"","miss":"","choices":[{"id":"support","label":"No antibiotic. Start enteral feed. Do not operate.","verdict":"correct","feedback":"This is necrotizing pancreatitis with persistent organ failure, which makes it severe. The necrosis is not infected on this scan. Antibiotics do not sterilize it in advance. If he cannot eat, feed the gut. An operation today removes tissue that may recover and that is not the source of sepsis yet.","finding":"Sterile necrosis. No antibiotic. Enteral plan.","status":"Necrosis without gas. Organs supported."},{"id":"mero","label":"Meropenem now, because necrosis means infection","verdict":"wrong","feedback":"Necrosis is dead tissue, not automatically infected tissue. Gas, or a septic deterioration later, is what changes that. A prophylactic carbapenem selects resistant organisms for the day you actually need a drug."},{"id":"open","label":"Open necrosectomy this afternoon","verdict":"wrong","critical":true,"feedback":"Operating on sterile necrosis early increases harm. Drainage, if it is ever needed, waits for a walled collection or for a patient who is septic from it. Today he needs organ support."},{"id":"starve","label":"Nil by mouth until the lipase is normal","verdict":"wrong","feedback":"The lipase is not a switch for feeding. Early oral intake is used in mild disease, and enteral feed is used when he cannot eat. Starvation until the enzyme falls is an old plan."}]},{"id":"feed","skill":"Nutrition","title":"He cannot eat","lead":"It is the third day. He is on oxygen, nauseated, and has not kept down a sip. The necrosis is unchanged. The gut is not obstructed.","prompt":"How do you feed him?","hint":"Use the gut. A nasal tube is enough. Parenteral nutrition is the fallback, not the opening move.","guideline":"If a patient with pancreatitis cannot eat by about 72 hours, start enteral nutrition. Nasogastric and nasojejunal routes are both acceptable. Parenteral nutrition is for when the gut cannot be used.","answer":"Nasogastric feeding","kind":"choice","successFinding":"Enteral feed started","successStatus":"Nasogastric feed running.","missYou":"","miss":"","choices":[{"id":"ng","label":"Start nasogastric feeding","verdict":"correct","feedback":"The gut works. A nasogastric feed is a fair first route; a jejunal tube is an alternative if he does not tolerate it. You do not need a surgical jejunostomy to start.","finding":"Enteral feed started","status":"Nasogastric feed running."},{"id":"tpn","label":"Total parenteral nutrition as the first feed","verdict":"wrong","feedback":"Parenteral nutrition is for a gut you cannot use. It is not safer than a nasal feed, and it brings a line and an infection risk he does not need yet."},{"id":"week","label":"Clear fluids only, for seven days","verdict":"wrong","feedback":"A week of near-starvation is not pancreas rest. It is a calorie deficit. Feed him."},{"id":"oral","label":"A full meal, because early oral diet is always right","verdict":"partial","feedback":"Early eating is right when the disease is mild and he is hungry. He is vomiting and in organ failure. A tube is the version of enteral nutrition that fits this man. Do not force a plate."}]},{"id":"click-gas","skill":"Localization","title":"Click the gas","lead":"Day eleven. New fever of 39\u00b0C, a falling blood pressure, and a rising oxygen requirement. The repeat CT shows a walled collection that was not full of gas before.","prompt":"Click the gas inside the collection.","hint":"Gas is blacker than fluid. It sits in the round collection in front of the spine, not inside the liver.","guideline":"Gas in a pancreatic collection is evidence of infection until proved otherwise. It is a reason for antibiotics and drainage, not for an immediate open necrosectomy.","answer":"Gas in the walled collection","image":{"src":"sim/pancreatitis-gas.jpg","alt":"Teaching illustration of a pancreatic collection containing gas","caption":"Repeat contrast CT, teaching illustration. Not a real scan."},"kind":"hotspot","atStart":{"sbp":88,"dbp":54,"hr":124,"rr":32,"spo2":90,"status":"New fever and shock on day eleven."},"successFinding":"Gas in a walled pancreatic collection","successStatus":"Infected collection. Septic.","missYou":"Clicked outside the gas","miss":"Not that structure. The gas is the black bubbles inside the round collection in the center of the slice.","regions":[{"id":"gas","verdict":"correct","cx":0.5,"cy":0.4,"rx":0.1,"ry":0.09,"you":"Gas in the collection","feedback":"Those black bubbles inside the walled collection are gas. With this new fever and shock, treat it as infected pancreatic necrosis. The next decision is how to drain it, not whether to ignore it."},{"id":"liver2","verdict":"wrong","cx":0.2,"cy":0.42,"rx":0.12,"ry":0.14,"you":"Liver","feedback":"The liver, on the side marked R, is not the collection. Come to the center of the slice."},{"id":"spleen2","verdict":"wrong","cx":0.84,"cy":0.4,"rx":0.08,"ry":0.1,"you":"Spleen","feedback":"The spleen is the oval on the side marked L. The gas is medial to it, in the collection."},{"id":"spine2","verdict":"wrong","cx":0.5,"cy":0.76,"rx":0.08,"ry":0.08,"you":"Vertebra","feedback":"The bright bone is the vertebra. The collection, with the black gas, is in front of it."}]},{"id":"drain","skill":"Source control","title":"Infected necrosis","lead":"Same scan. Gas, fever, and a blood pressure of 88 systolic. He is on the enteral feed. There is no jaundice.","prompt":"What is the source-control plan?","hint":"Antibiotics are indicated now. The abdomen is opened last, not first. A drain, percutaneous or endoscopic, is the step-up.","guideline":"Suspected infected necrosis is treated with antibiotics that cover gut flora and with drainage of a walled collection. Immediate open necrosectomy is reserved for catastrophes a drain cannot handle. ERCP is for cholangitis, which he does not have.","answer":"Antibiotics and a drain. Not an open necrosectomy.","image":{"src":"sim/pancreatitis-gas.jpg","alt":"The same teaching CT with gas in the collection","caption":"Same teaching illustration. Not a real scan."},"kind":"choice","successFinding":"Antibiotics and percutaneous drainage","successStatus":"Drain in the collection. Pressure recovering.","missYou":"","miss":"","choices":[{"id":"drain","label":"Antibiotics and a percutaneous or endoscopic drain","verdict":"correct","feedback":"Gas plus sepsis is infection. Start antibiotics that cover enteric organisms and drain the walled collection, through the skin or the stomach. Culture what you drain. Open surgery stays in reserve if the drain and the drug do not control him.","finding":"Antibiotics and percutaneous drainage","status":"Drain in the collection. Pressure recovering.","sbp":104,"dbp":66,"hr":102,"spo2":94},{"id":"open-now","label":"Immediate open necrosectomy","verdict":"wrong","critical":true,"feedback":"Open necrosectomy is the last step, not the first. A drain controls most infected collections and avoids the wound and the fistula of an early laparotomy."},{"id":"antifungal","label":"Antifungal therapy only","verdict":"wrong","feedback":"Candida can complicate a long course, but the gas and the shock are a bacterial collection until proved otherwise. An antifungal alone does not drain pus."},{"id":"ercp","label":"Urgent ERCP instead of a drain","verdict":"wrong","feedback":"ERCP treats a blocked infected bile duct. He is not jaundiced. The infected space on this scan is the pancreatic collection. Drain that."}]},{"id":"gallbladder","skill":"Prevention","title":"The gallbladder is still in","lead":"The drain output is falling. He is off vasopressors and eating. The ultrasound from day one still shows gallstones. No one has booked the gallbladder.","prompt":"What do you do about the stones?","hint":"Mild biliary pancreatitis has the gallbladder removed on the same admission. After necrosis, the operation waits until he has recovered, but it is not cancelled.","guideline":"Cholecystectomy prevents a second biliary attack. After severe or necrotizing pancreatitis it is delayed until inflammation and collections are controlled. It is still part of the plan.","answer":"Interval cholecystectomy once the collection is controlled","kind":"choice","atStart":{"sbp":122,"dbp":74,"hr":84,"rr":18,"spo2":97,"status":"Eating. Drain output falling."},"successFinding":"Interval cholecystectomy planned","successStatus":"Stones will be removed after the collection is controlled.","missYou":"","miss":"","choices":[{"id":"interval","label":"Plan cholecystectomy once the collection is controlled","verdict":"correct","feedback":"The stones caused this. Taking the gallbladder out tomorrow, while a drain is still in necrotic tissue, is too soon. Leaving it in forever invites another attack. Book the operation for when the collection has settled, and do not lose the plan at discharge.","finding":"Interval cholecystectomy planned","status":"Stones will be removed after the collection is controlled."},{"id":"never","label":"Leave the gallbladder. One attack is enough warning.","verdict":"wrong","feedback":"Biliary pancreatitis recurs if the stones stay. The delay is about timing, not about whether the gallbladder comes out."},{"id":"tomorrow","label":"Cholecystectomy tomorrow, while he is just off vasopressors","verdict":"wrong","feedback":"That timing fits mild biliary pancreatitis. He has had necrosis and a drain. Operating through that inflammation risks a bile duct injury and a worse collection. Wait until it is controlled, then do the operation."},{"id":"urso","label":"Ursodeoxycholic acid instead of surgery","verdict":"wrong","feedback":"A bile acid tablet does not empty a gallbladder full of stones, and it does not replace cholecystectomy after biliary pancreatitis."}]}]},{"id":"alf","title":"Acute liver failure","syndrome":"Paracetamol, encephalopathy","minutes":"12 min","difficulty":"Core","available":true,"summary":"A late paracetamol ingestion and a falling glucose. Start the antidote, do not chase the INR with plasma, then click the tight basal cisterns and refer her when the criteria are met.","queued":"","clockLabel":"Since the tablets","objectives":["Start N-acetylcysteine before the level","Recognize acute liver failure","Protect the glucose and the airway","Click the effaced basal cisterns","Apply King's College criteria and keep the antidote running"],"thumb":"sim/alf-ct.jpg","patient":"A. Shah","ageSex":"28-year-old woman","chart":["Teaching case. Not a real patient, and not a substitute for a liver-unit decision.","Sixteen hours ago, after an argument, she swallowed several strips of paracetamol. Found drowsy by her sister.","No known liver disease. Little alcohol. Not pregnant. Weight 60 kg.","Disoriented, sleepy, localizing to pain. No chronic signs of liver disease.","Heart rate 112. Blood pressure 104/62. Respiratory rate 22. Saturation 97 percent on air.","Fingerstick glucose 58 mg/dL. The paracetamol level is not back."],"opening":{"lkwMin":960,"status":"Drowsy and disoriented. Hypoglycemic.","sbp":104,"dbp":62,"hr":112,"rr":22,"spo2":97,"glucose":58},"stages":[{"id":"antidote","skill":"Antidote","title":"What do you give first?","lead":"The history is a large late ingestion. She is already drowsy, and the glucose is 58 mg/dL. The serum level will take time.","prompt":"What is the first treatment?","hint":"Do not wait for a level when the patient is already encephalopathic after a substantial late ingestion. Glucose is failing too.","guideline":"Intravenous N-acetylcysteine is started immediately when acute liver failure from paracetamol is suspected. The level and the nomogram do not have to return first. Hypoglycemia is treated at the same time.","answer":"Intravenous N-acetylcysteine now, and glucose","kind":"choice","successFinding":"N-acetylcysteine and glucose started","successStatus":"Antidote running. Glucose corrected.","missYou":"","miss":"","choices":[{"id":"nac","label":"Intravenous N-acetylcysteine now, and intravenous glucose","verdict":"correct","feedback":"Start the antidote. A common intravenous regimen is 150 mg/kg over the first hour, then 50 mg/kg over 4 hours, then 100 mg/kg over 16 hours. At 60 kg that is 9 g, then 3 g, then 6 g. Give glucose now. The level can be plotted when it arrives; it is not a reason to stand still.","finding":"N-acetylcysteine and glucose started","status":"Antidote running. Glucose corrected.","glucose":128,"hr":104},{"id":"wait-level","label":"Wait for the paracetamol level and plot the nomogram","verdict":"wrong","critical":true,"delayMin":70,"feedback":"The treatment nomogram is for a single ingestion seen between 4 and 24 hours, and even then you do not delay the antidote once acute liver injury and encephalopathy are in front of you. Waiting here costs liver."},{"id":"charcoal","label":"Activated charcoal only","verdict":"wrong","feedback":"Charcoal is considered in the first hour or two, in a protected airway. She is sixteen hours on and drowsy. Charcoal does not replace N-acetylcysteine."},{"id":"ffp-first","label":"Fresh frozen plasma first, to bring the INR down","verdict":"wrong","feedback":"You do not yet have a bleeding problem, and you do not yet have the INR. Plasma is not the antidote. It will also hide the number you need for prognosis."}]},{"id":"diagnose","skill":"Diagnosis","title":"The laboratories are back","lead":"Paracetamol 18 mg/L. AST 8,400 U/L. INR 4.8. Bilirubin 3.1 mg/dL. Creatinine 1.4 mg/dL. Lactate 4.2 mmol/L. Arterial pH 7.32. She remains disoriented.","prompt":"What is this illness?","hint":"Acute liver failure is an acute injury, coagulopathy, and encephalopathy, without cirrhosis. A low late drug level does not erase it.","guideline":"Acute liver failure is hepatic encephalopathy and an INR of at least 1.5 from an acute liver injury, in a patient without preexisting cirrhosis, with an illness of less than 26 weeks.","answer":"Paracetamol acute liver failure. Continue the antidote.","kind":"choice","successFinding":"Paracetamol acute liver failure","successStatus":"INR 4.8. Encephalopathy. Antidote continues.","missYou":"","miss":"","choices":[{"id":"alf","label":"Acute liver failure from paracetamol. Continue N-acetylcysteine.","verdict":"correct","feedback":"Encephalopathy plus an INR of 4.8 plus a huge transaminase, days into a paracetamol ingestion, is acute liver failure. The level is low because the drug has already been metabolized. That does not make her safe. The antidote continues.","finding":"Paracetamol acute liver failure","status":"INR 4.8. Encephalopathy. Antidote continues."},{"id":"stop-nac","label":"Stop the antidote. The level is below the treatment line.","verdict":"wrong","critical":true,"feedback":"A late level falls while the liver is dying. The nomogram does not clear a patient who already has coagulopathy and encephalopathy. Stopping N-acetylcysteine here is a harmful miss."},{"id":"cirrhosis","label":"Decompensated cirrhosis. Lactulose is the treatment.","verdict":"wrong","feedback":"There is no history or sign of chronic liver disease. Lactulose does not treat paracetamol injury, and it is not the priority in acute liver failure."},{"id":"normalize","label":"Give plasma until the INR is normal, then reassess","verdict":"wrong","feedback":"The INR is the clock and the prognostic marker. Correct it for bleeding or for a procedure, not to make the number look better. Plasma is not a treatment of the liver."}]},{"id":"glucose","skill":"Metabolic","title":"The glucose falls again","lead":"An hour later the stick is 46 mg/dL. She is sweatier and harder to rouse. The antidote infusion is in progress.","prompt":"What do you do about the glucose?","hint":"The failing liver cannot defend the glucose. Recheck it often. Insulin has no role here.","guideline":"Hypoglycemia is common in acute liver failure because glycogen is exhausted. Treat it with dextrose and repeat the measurement. Do not assume a single correction will hold.","answer":"Dextrose now, and a schedule of repeat checks","kind":"choice","atStart":{"glucose":46,"status":"Harder to rouse. Glucose 46 mg/dL."},"successFinding":"Hypoglycemia treated","successStatus":"Dextrose running. Glucose watched.","missYou":"","miss":"","choices":[{"id":"dextrose","label":"Intravenous dextrose now, then repeat the glucose frequently","verdict":"correct","feedback":"Give concentrated dextrose and start a glucose-containing infusion. In acute liver failure the next low reading can come quickly. Hourly checks are reasonable until it is stable.","finding":"Hypoglycemia treated","status":"Dextrose running. Glucose watched.","glucose":142},{"id":"insulin","label":"A sliding scale of insulin, because the enzymes are high","verdict":"wrong","critical":true,"feedback":"The enzymes are not hyperglycemia. A glucose of 46 with insulin is how this becomes a seizure. She needs sugar."},{"id":"enough","label":"One ampule earlier was enough. Do not recheck.","verdict":"wrong","feedback":"One correction does not restore glycogen. The glucose has already fallen again. Leaving it unchecked is how the next deterioration gets blamed on the brain alone."},{"id":"steroid","label":"High-dose corticosteroid for the liver","verdict":"wrong","feedback":"Steroid is not the treatment of paracetamol acute liver failure, and it does nothing for this glucose. Dextrose and the antidote are the metabolic plan."}]},{"id":"airway","skill":"Airway","title":"She only localizes to pain","lead":"Grade has worsened. She does not follow commands. A sternal rub makes her withdraw. The gag is unreliable. Glucose is now 138 mg/dL.","prompt":"How do you protect her?","hint":"Grade III and IV encephalopathy lose the airway. Sedation that only hides the grade is not a plan.","guideline":"Intubate for airway protection in advanced hepatic encephalopathy. Agitation is not treated with a benzodiazepine that will mask the neurology.","answer":"Intubate for airway protection","kind":"choice","atStart":{"glucose":138,"rr":26,"status":"Only localizes to pain."},"successFinding":"Intubated for grade IV encephalopathy","successStatus":"Airway protected. Sedation is for the tube, not to hide the grade.","missYou":"","miss":"","choices":[{"id":"intubate","label":"Intubate and ventilate to protect the airway","verdict":"correct","feedback":"This is grade IV encephalopathy. She cannot protect the airway. Intubate before transfer, before vomiting, and before a scan. Sedation is then for the tube and for cerebral protection, and you record the grade you saw before it.","finding":"Intubated for grade IV encephalopathy","status":"Airway protected. Sedation is for the tube, not to hide the grade.","spo2":99,"rr":16},{"id":"lactulose","label":"Lactulose by mouth as the main treatment","verdict":"wrong","feedback":"Lactulose does not reverse paracetamol necrosis. Given by mouth to someone who cannot protect the airway, it also risks aspiration. The airway comes first."},{"id":"benzo","label":"A benzodiazepine so she settles on the ward","verdict":"wrong","critical":true,"feedback":"A sedative on an unprotected airway, in a patient whose consciousness is the disease, hides the grade and invites aspiration. This is an intubation, not a sleeping tablet."},{"id":"ward","label":"Keep her on the ward. The saturation is normal.","verdict":"wrong","critical":true,"feedback":"A normal saturation does not mean she will keep the airway when the grade slips further. Advanced encephalopathy is an intensive-care problem."}]},{"id":"click-cistern","skill":"Localization","title":"Click the tight cisterns","lead":"She is intubated. Before transfer you have a non-contrast head CT. There is no blood. The dark spaces around the midbrain are no longer dark.","prompt":"Click the effaced basal cisterns.","hint":"They sit in the center, around the midbrain, not in the skull and not out in the cortex. Patient\u2019s left is marked L.","guideline":"Cerebral edema in acute liver failure effaces the basal cisterns and can slit the ventricles. It is a reason to protect the brain and to hurry the transplant assessment, not a reason for a lumbar puncture.","answer":"Effaced basal cisterns","image":{"src":"sim/alf-ct.jpg","alt":"Teaching illustration of a head CT with effaced basal cisterns","caption":"Non-contrast head CT, teaching illustration. Not a real scan."},"kind":"hotspot","successFinding":"Effaced basal cisterns","successStatus":"Cerebral edema. No hemorrhage.","missYou":"Clicked outside the cisterns","miss":"Not that structure. The basal cisterns are the spaces around the midbrain, in the center of the slice. On this scan they are tight.","regions":[{"id":"cisterns","verdict":"correct","cx":0.5,"cy":0.48,"rx":0.09,"ry":0.09,"you":"Effaced basal cisterns","feedback":"Those spaces around the midbrain should be dark with cerebrospinal fluid. They are compressed. This is cerebral edema from acute liver failure, and there is no hemorrhage. Treat the brain and get her to a transplant center."},{"id":"cortex","verdict":"wrong","cx":0.32,"cy":0.38,"rx":0.1,"ry":0.1,"you":"Cerebral cortex","feedback":"That is hemisphere cortex. It is not the cistern. Come to the center of the slice, around the midbrain."},{"id":"skull","verdict":"wrong","cx":0.5,"cy":0.16,"rx":0.12,"ry":0.06,"you":"Skull","feedback":"The bright rim is bone. The finding is inside, where the cisterns have lost their dark CSF."},{"id":"scalp","verdict":"wrong","cx":0.78,"cy":0.5,"rx":0.08,"ry":0.1,"you":"Outside the brain","feedback":"That is lateral to the finding. The tight cisterns are central."}]},{"id":"edema","skill":"Brain","title":"How do you treat the edema?","lead":"Same scan. No bleed. Pupils are still equal. She is intubated and the carbon dioxide is 38 mmHg.","prompt":"Which brain plan is right?","hint":"Raise the head. Treat fever and hypotension. Osmotic therapy is for signs of swelling, not a standing order to drive the carbon dioxide down.","guideline":"In acute liver failure, cerebral edema is managed by intubation, head-up position, normal carbon dioxide, and osmotic therapy if intracranial pressure is rising. Steroids and routine hyperventilation are not the treatment. Lumbar puncture is dangerous.","answer":"Head up. Osmotic therapy if she herniates. No steroid and no routine hyperventilation.","image":{"src":"sim/alf-ct.jpg","alt":"The same teaching head CT","caption":"Same teaching illustration. Not a real scan."},"kind":"choice","successFinding":"Brain precautions set","successStatus":"Head up. Carbon dioxide left near normal.","missYou":"","miss":"","choices":[{"id":"precautions","label":"Head of the bed up. Mannitol or hypertonic saline only if pupils or pressure change.","verdict":"correct","feedback":"Nurse her head up, keep the neck straight, treat fever, and keep the carbon dioxide around normal. If a pupil blows or a monitor shows a pressure surge, give an osmotic agent. Do not start that by collapsing the carbon dioxide for hours.","finding":"Brain precautions set","status":"Head up. Carbon dioxide left near normal."},{"id":"steroid","label":"Dexamethasone for the edema","verdict":"wrong","feedback":"Steroid reduces edema around a tumor. It does not treat the cerebral edema of acute liver failure."},{"id":"hypervent","label":"Hyperventilate to a carbon dioxide of 25 mmHg and leave it there","verdict":"wrong","feedback":"A brief reduction in carbon dioxide is a bridge during a herniation, not a ventilator setting for the rest of the day. Sustained hyperventilation constricts cerebral vessels that are already in trouble."},{"id":"lp","label":"Lumbar puncture to remove cerebrospinal fluid","verdict":"wrong","critical":true,"feedback":"The cisterns are already tight. A lumbar puncture in that setting can precipitate herniation. This is not a diagnostic tap you need."}]},{"id":"kings","skill":"Prognosis","title":"Does she meet transplant criteria?","lead":"After fluid, the arterial pH is 7.28. INR 7.1. Creatinine 3.6 mg/dL. She is intubated for grade IV encephalopathy. Lactate was 4.2 mmol/L. The antidote is still running.","prompt":"Which reading of King's College criteria is right?","hint":"For paracetamol, an arterial pH under 7.30 after resuscitation is a criterion on its own. The triad is the other door.","guideline":"For paracetamol acute liver failure, King's College criteria are an arterial pH below 7.30 after resuscitation, or all three of grade III\u2013IV encephalopathy, INR above 6.5, and creatinine above 3.4 mg/dL.","answer":"She meets criteria on the pH, and also on the triad","kind":"choice","atStart":{"status":"pH 7.28. INR 7.1. Grade IV."},"successFinding":"King's College criteria met","successStatus":"Criteria met. Transplant center called.","missYou":"","miss":"","choices":[{"id":"meets","label":"pH under 7.30 after resuscitation is enough. She also has the triad. Refer her.","verdict":"correct","feedback":"Arterial pH 7.28 after fluid meets the paracetamol criterion on its own. She also has grade IV encephalopathy, an INR of 7.1, and a creatinine of 3.6 mg/dL, which is the three-part criterion. Call the transplant center. Do not wait for a biopsy.","finding":"King's College criteria met","status":"Criteria met. Transplant center called."},{"id":"bilirubin","label":"She needs a bilirubin over 20 mg/dL before anyone will take her","verdict":"wrong","feedback":"A high bilirubin is part of the non-paracetamol criteria, not the rule you are using. Her pH and the triad already list her."},{"id":"age","label":"She is under 40, so she cannot meet criteria","verdict":"wrong","feedback":"Age under 10 or over 40 is a non-paracetamol factor. It is not required here. Paracetamol criteria are the pH, or the encephalopathy\u2013INR\u2013creatinine triad."},{"id":"biopsy","label":"Wait for a transjugular biopsy before you telephone","verdict":"wrong","critical":true,"feedback":"Biopsy is not the gate to a referral. The criteria are already met, and delay is the enemy of a graft."}]},{"id":"transfer","skill":"Transfer","title":"What travels with her?","lead":"The transplant center has accepted the call. The ambulance is twenty minutes away. Someone suggests stopping the infusion because the 21-hour protocol is nearly done, and giving plasma so the receiving INR looks kinder.","prompt":"What do you continue?","hint":"In established liver failure the antidote is not stopped just because the clock of the standard course has ended. The INR is left readable unless she is bleeding.","guideline":"N-acetylcysteine is continued in paracetamol acute liver failure until the INR and the clinical state are clearly improving, or until transplantation. Plasma is reserved for bleeding or an invasive procedure.","answer":"Continue N-acetylcysteine. Do not correct the INR for appearance.","kind":"choice","successFinding":"Antidote continued. INR left unmasked.","successStatus":"Transferred on N-acetylcysteine. INR still readable.","missYou":"","miss":"","choices":[{"id":"continue","label":"Keep N-acetylcysteine running. Do not give plasma just to improve the INR.","verdict":"correct","feedback":"The standard 21-hour course is not a stop time once acute liver failure is established. Continue the antidote until she recovers or is transplanted. Leave the INR uncorrected so the receiving team can see the disease. Give plasma only if she bleeds or needs a procedure that requires it.","finding":"Antidote continued. INR left unmasked.","status":"Transferred on N-acetylcysteine. INR still readable."},{"id":"stop-21","label":"Stop N-acetylcysteine at 21 hours exactly","verdict":"wrong","critical":true,"feedback":"That clock is for uncomplicated treatment. She is in liver failure. Stopping the infusion at an arbitrary hour removes the drug that is still helping the remaining liver."},{"id":"pretty","label":"Two units of plasma so the receiving INR is lower","verdict":"wrong","feedback":"You would be painting over the prognostic number. The center needs the true INR. Plasma does not treat the necrosis."},{"id":"heparin","label":"A heparin infusion, because a high INR means the blood is prothrombotic","verdict":"wrong","critical":true,"feedback":"The hemostasis of acute liver failure is complicated, but a heparin infusion in an INR of 7 is not a bedside plan. She can bleed. This is not the transfer order."}]}]},{"id":"alf-drug","title":"Acute liver failure, not paracetamol","syndrome":"Anti-tuberculosis drug injury","minutes":"12 min","difficulty":"Core","available":true,"summary":"Jaundice for twelve days on tuberculosis treatment, then confusion. Stop the hepatotoxic drugs, do not use the paracetamol rules, and list him when the non-paracetamol criteria are met.","queued":"","clockLabel":"Since jaundice was noticed","objectives":["Stop the hepatotoxic tuberculosis drugs","Separate this from paracetamol liver failure","Send the viral studies without delaying the stop","Click the effaced basal cisterns","Apply the non-paracetamol King's College criteria"],"thumb":"sim/alf-ct.jpg","patient":"V. Iyer","ageSex":"46-year-old man","chart":["Teaching case. Not a real patient, and not a substitute for a liver-unit decision.","Pulmonary tuberculosis. Rifampicin, isoniazid, pyrazinamide, and ethambutol for seven weeks.","Jaundice noticed twelve days ago. The medicines were continued. He became confused yesterday.","No paracetamol. Little alcohol. No known chronic liver disease. Weight 68 kg.","Drowsy, disoriented, and jaundiced. No chronic signs of liver disease.","Heart rate 104. Blood pressure 118/70. Respiratory rate 20. Glucose 72 mg/dL."],"opening":{"lkwMin":17280,"status":"Jaundiced and disoriented. Still on tuberculosis treatment.","sbp":118,"dbp":70,"hr":104,"rr":20,"spo2":97,"glucose":72},"stages":[{"id":"stop-drugs","skill":"Cause","title":"What do you stop?","lead":"He has been yellow for twelve days and is now disoriented. The tuberculosis medicines are still being given this morning. There is no history of paracetamol.","prompt":"What is the first order?","hint":"Isoniazid, rifampicin, and pyrazinamide injure the liver. Ethambutol does not. Do not keep the harmful drugs running while you send a panel.","guideline":"In suspected drug-induced acute liver failure, the hepatotoxic medicines are stopped at once. For tuberculosis treatment that is isoniazid, rifampicin, and pyrazinamide. A later non-hepatotoxic holding regimen is a specialist decision, not a reason to continue the original drugs.","answer":"Stop isoniazid, rifampicin, and pyrazinamide","kind":"choice","successFinding":"Hepatotoxic tuberculosis drugs stopped","successStatus":"Isoniazid, rifampicin, and pyrazinamide stopped.","missYou":"","miss":"","choices":[{"id":"stop","label":"Stop isoniazid, rifampicin, and pyrazinamide now","verdict":"correct","feedback":"Those three are the hepatotoxic drugs. Stop them immediately. Ethambutol is not the cause of this injury. What replaces them, once he is stable, is decided with the tuberculosis team. It is not decided by continuing this morning's doses.","finding":"Hepatotoxic tuberculosis drugs stopped","status":"Isoniazid, rifampicin, and pyrazinamide stopped."},{"id":"continue","label":"Continue all four drugs so the tuberculosis does not relapse","verdict":"wrong","critical":true,"feedback":"Leaving the hepatotoxic drugs on during acute liver failure keeps the injury going. Tuberculosis treatment will be rebuilt later with drugs that spare the liver. It is not continued unchanged through liver failure."},{"id":"nac-only","label":"Plot a paracetamol nomogram and give nothing else","verdict":"wrong","feedback":"There is no paracetamol history, and the nomogram does not apply. The specific act in this case is to stop the tuberculosis drugs. A nomogram is the wrong tool."},{"id":"steroid-first","label":"High-dose methylprednisolone before you touch the tuberculosis drugs","verdict":"wrong","feedback":"There is no diagnosis of autoimmune hepatitis here. Steroid does not replace stopping the offending drugs, and it is not the first order."}]},{"id":"pattern","skill":"Diagnosis","title":"The laboratories are not a paracetamol pattern","lead":"Paracetamol is undetectable. Bilirubin 22 mg/dL. AST 980 U/L. ALT 760 U/L. INR 4.4. Creatinine 1.1 mg/dL. Arterial pH 7.38. He is disoriented, and the jaundice began twelve days before the confusion.","prompt":"What do you call this?","hint":"Acute liver failure still means encephalopathy, coagulopathy, and an acute injury without cirrhosis. The enzyme height and the bilirubin tell you it is not the paracetamol pattern.","guideline":"Paracetamol injury typically produces extremely high transaminases and a bilirubin that rises later. Drug-induced and viral acute liver failure more often produce a high bilirubin with a lower enzyme peak. The definition of acute liver failure itself does not change.","answer":"Non-paracetamol acute liver failure","kind":"choice","successFinding":"Non-paracetamol acute liver failure","successStatus":"Bilirubin 22. INR 4.4. Not a paracetamol pattern.","missYou":"","miss":"","choices":[{"id":"dili","label":"Non-paracetamol acute liver failure. Do not use the paracetamol criteria.","verdict":"correct","feedback":"He has encephalopathy and an INR of 4.4 from an acute injury, without cirrhosis. That is acute liver failure. An AST of 980 with a bilirubin of 22, after weeks of tuberculosis treatment, is not paracetamol. The prognostic rules are the non-paracetamol rules.","finding":"Non-paracetamol acute liver failure","status":"Bilirubin 22. INR 4.4. Not a paracetamol pattern."},{"id":"must-be-apap","label":"The INR is high, so this is paracetamol until proved otherwise","verdict":"wrong","feedback":"Coagulopathy is part of every acute liver failure. It does not identify the cause. An undetectable paracetamol level and this enzyme-bilirubin pattern argue against paracetamol."},{"id":"cirrhosis","label":"Decompensated cirrhosis. Lactulose is the treatment.","verdict":"wrong","feedback":"There is no chronic liver disease. Lactulose will not stop drug injury, and it is not the decision that changes his outcome."},{"id":"ffp","label":"Give plasma until the INR is below 1.5, then decide","verdict":"wrong","feedback":"The INR is how you follow the liver and how you apply prognostic criteria. Correct it for bleeding or a procedure, not to make the case look milder."}]},{"id":"panel","skill":"Cause","title":"What else do you send?","lead":"The drugs are stopped. A drug history does not exclude a virus, and in this region hepatitis E and B still have to be looked for. He is afebrile. There is no hemolysis.","prompt":"Which set do you send today?","hint":"Send the acute viral studies now. Do not wait for them before the drugs are stopped, and do not take a biopsy before you have referred a failing liver.","guideline":"The first liver-failure panel looks for hepatitis A IgM, hepatitis B surface antigen and IgM core antibody, and hepatitis E IgM. Autoimmune and Wilson studies are added when the story suggests them. A biopsy is not required to refer.","answer":"Hepatitis A IgM, B surface antigen and IgM core antibody, and hepatitis E IgM","kind":"choice","successFinding":"Acute viral studies sent","successStatus":"Drugs already stopped. Viral studies in the laboratory.","missYou":"","miss":"","choices":[{"id":"viruses","label":"Hepatitis A IgM, hepatitis B surface antigen and IgM core antibody, hepatitis E IgM","verdict":"correct","feedback":"Send those today. A positive virus would change the story, and hepatitis E in particular belongs on the list. You did not need the results in order to stop the drugs. Wilson disease is unlikely at 46 without hemolysis. Biopsy can wait.","finding":"Acute viral studies sent","status":"Drugs already stopped. Viral studies in the laboratory."},{"id":"none","label":"No blood tests. The prescription is explanation enough.","verdict":"wrong","feedback":"The drugs are the leading cause. They are not the only cause you are allowed to consider. A virus can sit underneath a convenient drug history."},{"id":"biopsy","label":"Transjugular biopsy before any serology","verdict":"wrong","feedback":"Histology will not return fast enough to make the first decisions, and it is not required to diagnose drug injury or to refer him. Send the serology."},{"id":"hsv-only","label":"Acyclovir only, and no viral hepatitis studies","verdict":"wrong","feedback":"Herpes is suspected when the transaminases are very high, the bilirubin is relatively low, and there is fever, especially in pregnancy or immunosuppression. That is not this pattern. Do not skip hepatitis A, B, and E."}]},{"id":"glucose-airway","skill":"Support","title":"He is harder to rouse","lead":"The glucose is 48 mg/dL. He no longer follows commands and only localizes to pain. The gag is poor. The tuberculosis drugs remain stopped.","prompt":"What do you do now?","hint":"Glucose first in the same minute as the airway. Grade III to IV encephalopathy is intubated. Lactulose is not the treatment of this disease.","guideline":"Hypoglycemia is treated with dextrose and rechecked. Advanced hepatic encephalopathy is an indication to intubate for airway protection before transfer or imaging.","answer":"Dextrose, then intubate","kind":"choice","atStart":{"glucose":48,"status":"Only localizes to pain. Glucose 48 mg/dL."},"successFinding":"Glucose replaced and airway protected","successStatus":"Intubated. Dextrose running.","missYou":"","miss":"","choices":[{"id":"both","label":"Intravenous dextrose now, and intubate for airway protection","verdict":"correct","feedback":"Replace the glucose and check it again soon. Then intubate. He is in grade IV encephalopathy and will not protect his airway for a transfer or a scan. Record the grade before the sedative.","finding":"Glucose replaced and airway protected","status":"Intubated. Dextrose running.","glucose":136,"spo2":99,"rr":16},{"id":"sugar-only","label":"Dextrose, then observe him on the ward","verdict":"wrong","critical":true,"feedback":"The glucose must be treated, and it does not restore an airway. Leaving grade IV encephalopathy on a ward is how this patient aspirates."},{"id":"lactulose","label":"Lactulose by mouth, and no tube","verdict":"wrong","feedback":"Lactulose is not the treatment of drug-induced acute liver failure, and a dose by mouth in this grade risks aspiration. The airway comes first."},{"id":"restart","label":"Restart rifampicin at half the dose","verdict":"wrong","critical":true,"feedback":"Half a dose of a hepatotoxic drug is still the wrong drug during liver failure. Rifampicin stays stopped."}]},{"id":"click-cistern","skill":"Localization","title":"Click the tight cisterns","lead":"He is intubated. The non-contrast head CT shows no blood. The dark spaces around the midbrain have closed.","prompt":"Click the effaced basal cisterns.","hint":"They are in the center of the slice, around the midbrain. Patient\u2019s left is marked L.","guideline":"Cerebral edema in acute liver failure is not limited to paracetamol. Effaced basal cisterns mean the same precaution: protect the brain, and do not do a lumbar puncture.","answer":"Effaced basal cisterns","image":{"src":"sim/alf-ct.jpg","alt":"Teaching illustration of a head CT with effaced basal cisterns","caption":"Non-contrast head CT, teaching illustration. Not a real scan."},"kind":"hotspot","successFinding":"Effaced basal cisterns","successStatus":"Cerebral edema. No hemorrhage.","missYou":"Clicked outside the cisterns","miss":"Not that structure. The basal cisterns are central, around the midbrain. On this scan they are tight.","regions":[{"id":"cisterns","verdict":"correct","cx":0.5,"cy":0.48,"rx":0.09,"ry":0.09,"you":"Effaced basal cisterns","feedback":"The spaces around the midbrain should be dark. They are compressed. Cerebral edema occurs in non-paracetamol acute liver failure too. There is no hemorrhage. This hurries the referral. It is not a lumbar puncture."},{"id":"cortex","verdict":"wrong","cx":0.32,"cy":0.38,"rx":0.1,"ry":0.1,"you":"Cerebral cortex","feedback":"That is cortex, lateral to the finding. Come to the center, around the midbrain."},{"id":"skull","verdict":"wrong","cx":0.5,"cy":0.16,"rx":0.12,"ry":0.06,"you":"Skull","feedback":"The bright rim is bone. The cisterns are inside the skull, in the center of the slice."},{"id":"scalp","verdict":"wrong","cx":0.78,"cy":0.5,"rx":0.08,"ry":0.1,"you":"Outside the brain","feedback":"Too lateral. The tight cisterns are central."}]},{"id":"kings","skill":"Prognosis","title":"Which criteria apply?","lead":"Age 46. Idiosyncratic drug injury. Jaundice for twelve days before the encephalopathy. Bilirubin 22 mg/dL. INR 5.2. Arterial pH 7.38. Grade IV encephalopathy. No paracetamol.","prompt":"Does he meet King's College criteria?","hint":"Do not borrow the paracetamol pH rule. For other causes, one route is an INR above 6.5. The other is any three of the five factors. He does not need the INR to reach 6.5 if three factors are already present.","guideline":"Non-paracetamol King's College criteria are an INR above 6.5, or any three of: age under 10 or over 40, an unfavorable cause such as idiosyncratic drug injury, jaundice more than 7 days before encephalopathy, INR above 3.5, and bilirubin above 17.5 mg/dL.","answer":"Any three factors are enough. He has more than three.","kind":"choice","atStart":{"status":"INR 5.2. Bilirubin 22. Grade IV. pH 7.38."},"successFinding":"Non-paracetamol King's College criteria met","successStatus":"Criteria met without waiting for the INR to pass 6.5.","missYou":"","miss":"","choices":[{"id":"three","label":"Age, drug cause, the twelve-day jaundice, the bilirubin, and an INR above 3.5. Refer him.","verdict":"correct","feedback":"He has five of the five factors: age over 40, a drug cause, jaundice more than seven days before encephalopathy, bilirubin 22 mg/dL, and INR 5.2 which is already above 3.5. Any three would be enough. You do not wait for the INR to pass 6.5, and you do not use the paracetamol pH rule. His pH is 7.38 and would have falsely reassured you.","finding":"Non-paracetamol King's College criteria met","status":"Criteria met without waiting for the INR to pass 6.5."},{"id":"need-inr","label":"The INR is only 5.2, so he does not meet criteria","verdict":"wrong","critical":true,"feedback":"An INR above 6.5 is one way to meet the non-paracetamol criteria. It is not the only way. Three of the five factors already list him. Waiting for a worse INR is a delay."},{"id":"ph","label":"Use the paracetamol rule. The pH is 7.38, so he is safe.","verdict":"wrong","critical":true,"feedback":"The arterial-pH criterion belongs to paracetamol. Using it here is how a non-paracetamol failure is falsely cleared. His pH is normal. His criteria are not."},{"id":"grade","label":"Criteria require him to be grade IV for a full day first","verdict":"wrong","feedback":"The non-paracetamol list does not ask you to watch grade IV encephalopathy overnight. He already meets it. Refer now."}]},{"id":"nac-role","skill":"Transfer","title":"What is the role of N-acetylcysteine here?","lead":"The center asks what you are giving. Someone wants a full 21-hour antidote course before the ambulance leaves. Someone else wants a steroid trial for possible autoimmune hepatitis. He has no autoimmune history, and the criteria are already met.","prompt":"What do you tell them?","hint":"N-acetylcysteine is not the specific antidote for a tuberculosis drug. A possible early benefit does not postpone a referral once criteria are met.","guideline":"Intravenous N-acetylcysteine has been studied in early non-paracetamol acute liver failure and is sometimes continued, especially at a milder grade. It is not a reason to delay transplant assessment once King's College criteria are met, and it does not replace stopping the causative drug.","answer":"Refer now. The antidote protocol must not delay the transfer.","kind":"choice","successFinding":"Referred. Drugs stay stopped.","successStatus":"Transfer arranged. INR left uncorrected.","missYou":"","miss":"","choices":[{"id":"refer","label":"Refer now. Do not hold the ambulance for a 21-hour antidote course or a steroid trial.","verdict":"correct","feedback":"The criteria are met. N-acetylcysteine is not a specific antidote for isoniazid, rifampicin, or pyrazinamide, and finishing a paracetamol schedule before transfer wastes time. A steroid trial is not indicated without a reason to suspect autoimmune disease. Keep the INR readable, keep the glucose checked, and move him. The tuberculosis drugs stay stopped.","finding":"Referred. Drugs stay stopped.","status":"Transfer arranged. INR left uncorrected."},{"id":"finish-nac","label":"Finish 21 hours of N-acetylcysteine, then discuss transplant","verdict":"wrong","critical":true,"feedback":"That schedule is the paracetamol course. He has already met non-paracetamol transplant criteria. Holding him for an antidote clock delays the only treatment that changes survival."},{"id":"steroid-trial","label":"Three days of methylprednisolone before any referral","verdict":"wrong","feedback":"There is no autoimmune diagnosis. A steroid trial in established criteria delays transplantation. Stop the causative drugs and refer."},{"id":"mask","label":"Give plasma so the receiving INR is kinder","verdict":"wrong","feedback":"Plasma hides the number the receiving team needs. Give it for bleeding or a procedure, not for the appearance of the transfer sheet."}]}]},{"id":"ich","title":"Intracerebral hemorrhage","syndrome":"Sudden deficit, deep clot","minutes":"8 min","difficulty":"Core","available":true,"summary":"A deep hemorrhage. Lower the pressure, and do not reach for a steroid.","queued":"","clockLabel":"Time in the department","clockWarnAfterMin":null,"objectives":["Choose the first study, or the act that must not wait for it","Click the finding","Name it","Make the next decision","Reassess after the numbers change"],"thumb":"sim/cases/ich2.jpg","patient":"Sudden right weakness while cooking","ageSex":"62-year-old woman","chart":["Teaching case. Not a prescription.","Onset forty minutes ago. No anticoagulant. Glucose is normal. She is drowsy but localizes."],"opening":{"lkwMin":20,"status":"Drowsy, dense right hemiparesis.","sbp":204,"dbp":112,"hr":78,"rr":16,"spo2":97,"glucose":118,"gcs":"E3 V4 M6"},"stages":[{"id":"study","skill":"Investigation","title":"What do you image first?","lead":"The deficit is sudden and she is not protecting a long conversation. The scanner is free.","prompt":"Which study comes first?","hint":"Blood is the question that changes the drug. MRI can wait.","guideline":"Non-contrast CT is first in a sudden deficit. It is fast, and it shows blood.","answer":"Non-contrast CT of the head","kind":"choice","successFinding":"Non-contrast CT first","successStatus":"On the way to the scanner.","missYou":"Not that choice","miss":"Blood is the question that changes the drug. MRI can wait.","choices":[{"id":"ct","label":"Non-contrast CT of the head","verdict":"correct","feedback":"Non-contrast CT answers whether this is blood. Do not wait for an MRI, and do not give a thrombolytic on the story alone.","finding":"Non-contrast CT first","status":"Non-contrast CT done."},{"id":"mri","label":"MRI before any CT","verdict":"wrong","feedback":"MRI is a poor first test when you still do not know if there is blood. It delays the answer."},{"id":"lyse","label":"Thrombolysis from the clinical syndrome","verdict":"wrong","feedback":"A sudden deficit can be a hemorrhage. A thrombolytic before the CT can be fatal.","critical":true},{"id":"lp","label":"Lumbar puncture first","verdict":"wrong","feedback":"There is a focal deficit and you have not seen the scan. A lumbar puncture is not the first study."}]},{"id":"click","skill":"Localization","title":"Click the clot","lead":"Several slices are on the screen. One slice carries a bright intraparenchymal clot, and blood has reached the ventricles.","prompt":"Click the bright intraparenchymal hemorrhage.","hint":"Blood is bright on a non-contrast CT. The largest white clot is in the upper middle slice.","guideline":"Acute blood is hyperdense. Intraventricular blood often travels with a deep hemorrhage. Volume and the ventricles decide the next hour, not a steroid.","answer":"Intraparenchymal hemorrhage","image":{"src":"sim/cases/ich2.jpg","alt":"Non-contrast CT with a deep hemorrhage and blood in the ventricles.","caption":"Deep hemorrhage. Blood is bright, and some of it is in the ventricles."},"kind":"hotspot","successFinding":"Deep intracerebral hemorrhage","successStatus":"Clot seen. No thrombolytic.","missYou":"Clicked away from the clot","miss":"The clot is the bright mass in the brain, not the dark ventricles on the slices where they are still black.","regions":[{"id":"clot","verdict":"correct","cx":0.5,"cy":0.24,"rx":0.09,"ry":0.11,"you":"Deep hemorrhage","feedback":"That bright mass is acute blood in the brain. Nearby slices also show blood that has broken into the ventricles."},{"id":"vent","verdict":"wrong","cx":0.84,"cy":0.28,"rx":0.08,"ry":0.08,"you":"A slice with dark ventricles","feedback":"Those dark slits are ventricles that are not the main clot. Go back to the slice with the large white hemorrhage."}]},{"id":"name","skill":
