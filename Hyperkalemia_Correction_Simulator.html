<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High potassium</title>
<style>
  :root{--ink:#0f172a;--muted:#475569;--bg:#f5f3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px;background:linear-gradient(90deg,#6d28d9,#be123c);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#ede9fe}
  #limitBadge{background:#fff;color:#6d28d9;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
  main{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6d28d9}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;color:#334155}
  input,select{width:100%;font-size:18px;font-weight:700;padding:8px;border:2px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px}
  #target{border-color:#059669;background:#ecfdf5}
  input[type=range]{padding:0;height:32px;accent-color:#6d28d9;border:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff}
  #calcium{background:#0f766e}
  #insulin{background:#6d28d9}
  #salb{background:#0891b2}
  #ecg{background:#be123c}
  .chips button.on{outline:3px solid #0f172a;outline-offset:2px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{border-radius:12px;text-align:center;padding:10px 6px;color:#fff}
  .num:nth-child(1){background:#6d28d9}
  .num:nth-child(2){background:#be123c}
  .num:nth-child(3){background:#059669}
  .num.bad{background:#dc2626}
  .num span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .num b{font-size:26px}
  #banner{display:none;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800;text-align:center;padding:10px;margin:12px 0}
  #banner.show{display:block}
  #ods{display:none;margin-top:10px;background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.35}
  #ods.show{display:block}
  #ods b{display:block;font-size:16px;letter-spacing:.03em;margin-bottom:4px}
  .plot{margin-top:12px;background:#faf5ff;border:2px solid #ddd6fe;border-radius:16px;padding:8px 8px 4px}
  canvas{width:100%;height:340px;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin:4px 0 8px}
  .legend i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
  .lg-k{background:#6d28d9}.lg-goal{background:#059669}.lg-lim{background:#dc2626}
  .hours{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
  .hours b{display:block;font-size:16px;color:#6d28d9}
  .quiet{font-size:12px;color:var(--muted);margin:8px 0 0}
  a{color:#6d28d9}
</style>
</head>
<body>
<header>
  <div>
    <h1>High potassium</h1>
    <p>6-hour line. Calcium protects the heart. It does not lower potassium.</p>
  </div>
  <div id="limitBadge">Floor 3.5</div>
</header>
<main>
  <section>
    <h2>Treatment</h2>
    <div class="row">
      <div><label>Potassium now</label><input id="k" type="text" inputmode="decimal" value="6.8"></div>
      <div><label>Goal at 6 h</label><input id="target" type="text" inputmode="decimal" value="5.0"></div>
    </div>
    <p class="quiet" id="goalNote"></p>
    <div class="chips">
      <button type="button" id="ecg">ECG changes</button>
      <button type="button" id="calcium" class="on">Calcium</button>
      <button type="button" id="insulin" class="on">Insulin</button>
      <button type="button" id="salb">Salbutamol</button>
    </div>
    <label>Removal <b id="remLabel">0.25</b> mmol/h</label>
    <input id="rem" type="range" min="0" max="0.4" step="0.05" value="0.25">
    <p class="quiet">Dialysis or a binder. Insulin and salbutamol only shift potassium, then it rebounds.</p>
  </section>
  <section>
    <div class="nums">
      <div class="num"><span>At 1 h</span><b id="h1">—</b></div>
      <div class="num" id="endBox"><span>At 6 h</span><b id="end">—</b></div>
      <div class="num" id="deltaBox"><span>Change</span><b id="delta">—</b></div>
    </div>
    <div id="banner"></div>
    <div id="ods"></div>
    <div class="plot">
      <canvas id="chart" width="720" height="340"></canvas>
      <div class="legend"><span><i class="lg-k"></i>Potassium</span><span id="goalKey"><i class="lg-goal"></i>Goal</span><span><i class="lg-lim"></i>3.5</span></div>
    </div>
    <div class="hours" id="hours"></div>
    <p class="quiet" id="note"></p>
    <p class="quiet"><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
var H=6, FLOOR=3.5;
function on(id){ return document.getElementById(id).classList.contains('on'); }
function read(id){
  var raw=String(document.getElementById(id).value||'').replace(',','.').trim();
  var n=parseFloat(raw);
  return Number.isFinite(n)?n:null;
}
function shift(h, peak){
  if(h<=0) return 0;
  var up=Math.min(1, h/1);
  var hold=h<=3?1:Math.max(0.4, 1-(h-3)/4);
  return -peak*up*hold;
}
function project(k, rem, insulin, salb){
  var path=[k];
  for(var h=1;h<=H;h++){
    var s=0;
    if(insulin) s+=shift(h, 0.8);
    if(salb) s+=shift(h, 0.5);
    path.push(k+s-rem*h);
  }
  return path;
}
function draw(path, goal, crossH){
  var c=document.getElementById('chart');
  var dpr=Math.min(2, devicePixelRatio||1);
  var cssW=c.clientWidth||640, cssH=c.clientHeight||340;
  c.width=cssW*dpr; c.height=cssH*dpr;
  var ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  var vals=path.concat([goal, FLOOR]);
  var min=Math.min.apply(null,vals)-0.3, max=Math.max.apply(null,vals)+0.3;
  var L=42,T=22,B=26,plotR=cssW-86, n=path.length-1;
  var X=function(i){ return L+(plotR-L)*i/n; };
  var Y=function(v){ return T+(cssH-T-B)*(1-(v-min)/(max-min)); };
  ctx.font='12px sans-serif'; ctx.fillStyle='#64748b'; ctx.strokeStyle='#ede9fe';
  for(var i=0;i<=4;i++){
    var v=max-(max-min)*i/4, y=T+(cssH-T-B)*i/4;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(plotR,y); ctx.stroke();
    ctx.fillText(v.toFixed(1), 2, y+4);
  }
  ctx.beginPath(); ctx.strokeStyle='#6d28d9'; ctx.lineWidth=3.5;
  path.forEach(function(v,i){ var x=X(i), y=Y(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle='#6d28d9'; ctx.beginPath(); ctx.arc(X(n), Y(path[n]), 5, 0, 7); ctx.fill();
  ctx.strokeStyle='#dc2626'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(0), Y(FLOOR)); ctx.lineTo(plotR, Y(FLOOR)); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle='#dc2626'; ctx.font='11px sans-serif'; ctx.fillText('3.5', X(0)+4, Y(FLOOR)-4);
  if(crossH!=null){
    ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.arc(X(crossH), Y(path[crossH]), 7, 0, 7); ctx.fill();
    ctx.font='bold 12px sans-serif'; ctx.fillText('Low', X(Math.min(crossH,n-1))+8, Y(path[crossH])-8);
  }
  var y=Y(goal);
  ctx.strokeStyle='#059669'; ctx.lineWidth=4; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(X(0), y); ctx.lineTo(plotR, y); ctx.stroke();
  ctx.setLineDash([]);
  var label='Goal '+Number(goal).toFixed(1);
  ctx.font='bold 13px sans-serif';
  var tw=ctx.measureText(label).width+14;
  var bx=Math.min(cssW-tw-6, plotR+6);
  var by=Math.max(6, Math.min(cssH-30, y-12));
  ctx.fillStyle='#059669'; ctx.fillRect(bx, by, tw, 24);
  ctx.fillStyle='#fff'; ctx.fillText(label, bx+7, by+16);
}
function paint(){
  var k=read('k'), goal=read('target');
  var rem=parseFloat(document.getElementById('rem').value)||0;
  document.getElementById('remLabel').textContent=rem.toFixed(2);
  if(k==null) return;
  if(goal==null) goal=k;
  var path=project(k, rem, on('insulin'), on('salb'));
  var cross=null;
  for(var h=1;h<path.length;h++){
    if(path[h-1]>FLOOR && path[h]<=FLOOR){ cross=h; break; }
  }
  document.getElementById('h1').textContent=path[1].toFixed(2);
  document.getElementById('end').textContent=path[6].toFixed(2);
  document.getElementById('delta').textContent=(path[6]-k>=0?'+':'')+(path[6]-k).toFixed(2);
  var over=cross!=null;
  document.getElementById('endBox').className='num'+(over?' bad':'');
  document.getElementById('deltaBox').className='num'+(over?' bad':'');
  var lines=[];
  var danger=on('ecg') || k>=6.5;
  if(danger && !on('calcium')) lines.push('Give calcium gluconate, 10 mL of 10%, if the ECG has changed. Calcium does not move this line.');
  if(on('insulin') || on('salb')) lines.push('The dip is a shift. Without removal the potassium climbs back.');
  if(Math.abs(path[6]-goal)>0.2) lines.push('This plan does not land on the goal. The green line is still the goal.');
  document.getElementById('banner').className=lines.length?'show':'';
  document.getElementById('banner').textContent=lines.join(' ');
  var ods=document.getElementById('ods');
  if(cross!=null){
    ods.className='show';
    ods.innerHTML='<b>Overcorrection — hypokalemia</b>The potassium crosses 3.5 at '+cross+' h. Stop insulin, salbutamol, and removal. Recheck now.';
  } else { ods.className=''; ods.innerHTML=''; }
  document.getElementById('goalNote').textContent='Goal '+goal.toFixed(1)+' at 6 h. The green line is that number.';
  document.getElementById('goalKey').innerHTML='<i class="lg-goal"></i>Goal '+goal.toFixed(1);
  draw(path, goal, cross);
  document.getElementById('hours').innerHTML=[0,1,2,3,4,5,6].map(function(h){ return '<div>'+h+' h<b>'+path[h].toFixed(1)+'</b></div>'; }).join('');
  document.getElementById('note').textContent='Insulin 10 units with 25 g dextrose. Salbutamol 10–20 mg nebulised. Recheck at 1 hour.';
}
function endK(rem, insulin, salb){
  return project(read('k'), rem, insulin, salb)[6];
}
function applyGoal(){
  var k=read('k'), goal=read('target');
  if(k==null||goal==null){ paint(); return; }
  var insulin=on('insulin'), salb=on('salb');
  function solve(){
    var a=endK(0, insulin, salb), b=endK(0.4, insulin, salb);
    if((a>=b && goal>=a)||(a<b && goal<=a)) return 0;
    if((a>=b && goal<=b)||(a<b && goal>=b)) return 0.4;
    var lo=0, hi=0.4;
    for(var i=0;i<20;i++){
      var mid=(lo+hi)/2, v=endK(mid, insulin, salb);
      if(a>=b ? v>goal : v<goal) lo=mid; else hi=mid;
    }
    return Math.round(lo/0.05)*0.05;
  }
  var rem=solve();
  if(Math.abs(endK(rem, insulin, salb)-goal)>0.25 && !insulin){
    insulin=true; document.getElementById('insulin').classList.add('on'); rem=solve();
  }
  if(Math.abs(endK(rem, insulin, salb)-goal)>0.25 && !salb){
    salb=true; document.getElementById('salb').classList.add('on'); rem=solve();
  }
  document.getElementById('rem').value=rem.toFixed(2);
  paint();
}
['ecg','calcium','insulin','salb'].forEach(function(id){
  document.getElementById(id).onclick=function(){ this.classList.toggle('on'); paint(); };
});
document.getElementById('rem').addEventListener('input', paint);
document.getElementById('k').addEventListener('input', function(){ setTarget(); applyGoal(); });
document.getElementById('target').addEventListener('input', applyGoal);
document.getElementById('target').addEventListener('change', applyGoal);
function setTarget(){
  var k=read('k');
  if(k==null) return;
  var g=k>5?5.0:Math.round(k*10)/10;
  document.getElementById('target').value=String(g);
}
var q=new URLSearchParams(location.search);
if(q.get('k')) document.getElementById('k').value=q.get('k');
setTarget();
applyGoal();
window.addEventListener('resize', paint);
</script>
</body>
</html>
