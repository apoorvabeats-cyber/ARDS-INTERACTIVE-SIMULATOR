<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High potassium</title>
<style>
  :root{--ink:#0f172a;--bg:#f5f3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px;background:linear-gradient(90deg,#6d28d9,#be123c);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#ede9fe}
  #limitBadge{background:#fff;color:#6d28d9;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
  main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6d28d9}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;color:#334155}
  input{width:100%;font-size:18px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a}
  #target{border-color:#059669;background:#ecfdf5}
  input[type=range]{padding:0;height:32px;accent-color:#6d28d9;border:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff}
  #calcium{background:#0f766e}#insulin{background:#6d28d9}#salb{background:#0891b2}
  .chips button.on{outline:3px solid #0f172a;outline-offset:2px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{border-radius:12px;text-align:center;padding:10px 6px;color:#fff}
  .num:nth-child(1){background:#6d28d9}.num:nth-child(2){background:#be123c}.num:nth-child(3){background:#059669}
  .num.bad{background:#dc2626}
  .num span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .num b{font-size:26px}
  #banner{display:none;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800;text-align:center;padding:10px;margin:12px 0}
  #banner.show{display:block}
  #ods{display:none;margin-top:10px;background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800}
  #ods.show{display:block}
  .plot{margin-top:12px;background:#faf5ff;border:2px solid #ddd6fe;border-radius:16px;padding:8px}
  canvas.chart{width:100%;height:260px;display:block}
  .ecgbox{margin-top:10px;background:#14061f;border-radius:16px;padding:8px;border:2px solid #5b21b6}
  .ecgbox.bad{border-color:#dc2626}
  canvas.ecg{width:100%;height:168px;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin:4px 0}
  .legend i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
  .lg-k{background:#6d28d9}.lg-goal{background:#059669}.lg-lim{background:#dc2626}
  .hours{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
  .hours b{display:block;font-size:16px;color:#6d28d9}
  a{color:#6d28d9}
  body.embed header, body.embed a[href="index.html"]{display:none}
  body.embed main{padding:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>High potassium</h1>
    <p>Drag removal. The line is 6 hours.</p>
  </div>
  <div id="limitBadge">Floor 3.5</div>
</header>
<main>
  <section>
    <h2>Treatment</h2>
    <div class="row">
      <div><label>Potassium now</label><input id="k" type="text" inputmode="decimal" value="6.8"></div>
      <div><label>Goal at 6 h</label><input id="target" type="text" inputmode="decimal" value="5"></div>
    </div>
    <div class="chips">
      <button type="button" id="calcium" class="on">Calcium 10 mL</button>
      <button type="button" id="insulin" class="on">Insulin 10 U</button>
      <button type="button" id="salb">Salbutamol 20 mg</button>
    </div>
    <label>Removal <b id="remLabel">0.25</b> mmol/h</label>
    <input id="rem" type="range" min="0" max="0.4" step="0.05" value="0.25">
  </section>
  <section>
    <div class="nums">
      <div class="num"><span>At 1 h</span><b id="h1">—</b></div>
      <div class="num" id="endBox"><span>At 6 h</span><b id="end">—</b></div>
      <div class="num" id="deltaBox"><span>Change</span><b id="delta">—</b></div>
    </div>
    <div id="banner"></div>
    <div id="ods"></div>
    <div class="plot">
      <canvas class="chart" id="chart" width="720" height="260"></canvas>
      <div class="legend"><span><i class="lg-k"></i>Potassium</span><span id="goalKey"><i class="lg-goal"></i>Goal</span><span><i class="lg-lim"></i>3.5</span></div>
    </div>
    <div class="hours" id="hours"></div>
    <div class="ecgbox" id="ecgBox"><canvas class="ecg" id="ecg" width="720" height="168"></canvas></div>
    <p><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
if(new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');
var H=6, FLOOR=3.5, phase=0, nowKind='wide', laterKind='normal';
var NAME={normal:'Normal',peaked:'Peaked T',wide:'Wide QRS',sine:'Sine wave',flat:'Flat T',uwave:'U wave',bigu:'Large U',vt:'VT'};
function read(id){ var n=parseFloat(String(document.getElementById(id).value||'').replace(',','.')); return Number.isFinite(n)?n:null; }
function on(id){ return document.getElementById(id).classList.contains('on'); }
function kind(k, calcium){
  var x=calcium?k-1.2:k;
  if(k<3.5){ if(k<2.2) return 'vt'; if(k<2.6) return 'bigu'; if(k<3.2) return 'uwave'; return 'flat'; }
  if(x>=8) return 'sine';
  if(x>=6.5) return 'wide';
  if(x>=5.5) return 'peaked';
  return 'normal';
}
function shift(h, peak){ var up=Math.min(1,h/1), hold=h<=3?1:Math.max(0.4,1-(h-3)/4); return -peak*up*hold; }
function project(k, rem, insulin, salb){
  var path=[k];
  for(var h=1;h<=H;h++){
    var s=0; if(insulin) s+=shift(h,0.8); if(salb) s+=shift(h,0.5);
    path.push(k+s-rem*h);
  }
  return path;
}
function g(x,c,w,a){ var d=x-c; return a*Math.exp(-(d*d)/(2*w*w)); }
function sample(t, kd){
  t=((t%1)+1)%1;
  if(kd==='sine') return Math.sin(t*Math.PI*2)*0.85;
  if(kd==='vt') return Math.sin(t*Math.PI*8)*(0.55+0.35*Math.sin(t*40));
  var p=0.16, qw=0.012, qa=1, ta=0.32, tw=0.035, tc=0.46, ua=0;
  if(kd==='peaked'){ ta=0.9; tw=0.02; }
  if(kd==='wide'){ p=0.04; qw=0.045; ta=0.55; }
  if(kd==='flat'){ ta=0.08; ua=0.18; }
  if(kd==='uwave'){ ta=0.06; ua=0.32; }
  if(kd==='bigu'){ ta=0.02; ua=0.5; qa=0.75; }
  return g(t,0.14,0.018,p)+g(t,0.24,qw*0.45,-0.25*qa)+g(t,0.27,qw,qa)+g(t,tc,tw,ta)+g(t,0.62,0.04,ua);
}
function paintChart(path, goal, cross){
  var c=document.getElementById('chart'), dpr=Math.min(2,devicePixelRatio||1);
  var W=c.clientWidth||640, Ht=c.clientHeight||260;
  c.width=W*dpr; c.height=Ht*dpr;
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,Ht);
  var vals=path.concat([goal, FLOOR]);
  var min=Math.min.apply(null,vals)-0.35, max=Math.max.apply(null,vals)+0.35;
  var L=42,T=16,B=22,R=W-78, n=path.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(Ht-T-B)*(1-(v-min)/(max-min)); };
  ctx.font='12px sans-serif'; ctx.fillStyle='#64748b'; ctx.strokeStyle='#ede9fe';
  for(var i=0;i<=4;i++){ var v=max-(max-min)*i/4, y=T+(Ht-T-B)*i/4; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke(); ctx.fillText(v.toFixed(1),2,y+4); }
  ctx.beginPath(); ctx.strokeStyle='#6d28d9'; ctx.lineWidth=3.5;
  path.forEach(function(v,i){ var x=X(i), y=Y(v); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
  ctx.stroke();
  ctx.fillStyle='#6d28d9'; ctx.beginPath(); ctx.arc(X(n),Y(path[n]),5,0,7); ctx.fill();
  ctx.strokeStyle='#dc2626'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(0),Y(FLOOR)); ctx.lineTo(R,Y(FLOOR)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#dc2626'; ctx.fillText('3.5', X(0)+4, Y(FLOOR)-4);
  if(cross!=null){ ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.arc(X(cross),Y(path[cross]),7,0,7); ctx.fill(); }
  var y=Y(goal);
  ctx.strokeStyle='#059669'; ctx.lineWidth=4; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(X(0),y); ctx.lineTo(R,y); ctx.stroke(); ctx.setLineDash([]);
  var label='Goal '+Number(goal).toFixed(1);
  ctx.font='bold 13px sans-serif';
  var tw=ctx.measureText(label).width+14, bx=Math.min(W-tw-6,R+4), by=Math.max(4,Math.min(Ht-28,y-12));
  ctx.fillStyle='#059669'; ctx.fillRect(bx,by,tw,22); ctx.fillStyle='#fff'; ctx.fillText(label,bx+7,by+16);
}
function drawStrip(ctx, y0, h, kd, title){
  var W=ctx.canvas.clientWidth||640;
  ctx.fillStyle='#1a0b24'; ctx.fillRect(0,y0,W,h);
  ctx.strokeStyle='#6d28d933'; ctx.lineWidth=1;
  for(var x=0;x<W;x+=24){ ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y0+h); ctx.stroke(); }
  for(var y=y0;y<y0+h;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  var bad=kd==='sine'||kd==='wide'||kd==='vt'||kd==='bigu';
  ctx.strokeStyle=bad?'#f87171':'#4ade80'; ctx.lineWidth=2; ctx.beginPath();
  for(var i=0;i<W;i++){
    var v=sample((i/W)*4+phase, kd);
    var py=y0+h*0.55-v*h*0.38;
    if(i) ctx.lineTo(i,py); else ctx.moveTo(i,py);
  }
  ctx.stroke();
  ctx.font='bold 13px sans-serif'; ctx.fillStyle=bad?'#fecaca':'#bbf7d0';
  ctx.fillText(title+' · '+NAME[kd], 8, y0+16);
}
function frame(){
  var c=document.getElementById('ecg'), dpr=Math.min(2,devicePixelRatio||1);
  var W=c.clientWidth||640, Ht=c.clientHeight||168;
  if(c.width!==Math.floor(W*dpr)){ c.width=W*dpr; c.height=Ht*dpr; }
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  drawStrip(ctx, 0, Ht/2-2, nowKind, 'Now');
  drawStrip(ctx, Ht/2+2, Ht/2-2, laterKind, '6 h');
  phase+=0.012;
  requestAnimationFrame(frame);
}
function paint(){
  var k=read('k'), goal=read('target'), rem=parseFloat(document.getElementById('rem').value)||0;
  document.getElementById('remLabel').textContent=rem.toFixed(2);
  if(k==null) return;
  if(goal==null) goal=k;
  var path=project(k, rem, on('insulin'), on('salb'));
  var cross=null;
  for(var h=1;h<path.length;h++) if(path[h-1]>FLOOR && path[h]<=FLOOR){ cross=h; break; }
  document.getElementById('h1').textContent=path[1].toFixed(1);
  document.getElementById('end').textContent=path[6].toFixed(1);
  document.getElementById('delta').textContent=(path[6]-k>=0?'+':'')+(path[6]-k).toFixed(1);
  document.getElementById('endBox').className='num'+(cross!=null?' bad':'');
  document.getElementById('deltaBox').className='num'+(cross!=null?' bad':'');
  var lines=[];
  if(Math.abs(path[6]-goal)>0.2) lines.push('The green line is the goal. This plan does not reach it.');
  if((k>=6.5) && !on('calcium')) lines.push('No calcium. The top ECG stays wide.');
  document.getElementById('banner').className=lines.length?'show':'';
  document.getElementById('banner').textContent=lines.join(' ');
  var ods=document.getElementById('ods');
  if(cross!=null){ ods.className='show'; ods.textContent='Overcorrection. The potassium crosses 3.5 at '+cross+' h. Stop removal.'; }
  else { ods.className=''; ods.textContent=''; }
  document.getElementById('goalKey').innerHTML='<i class="lg-goal"></i>Goal '+goal.toFixed(1);
  paintChart(path, goal, cross);
  document.getElementById('hours').innerHTML=[0,1,2,3,4,5,6].map(function(h){ return '<div>'+h+' h<b>'+path[h].toFixed(1)+'</b></div>'; }).join('');
  nowKind=kind(k, on('calcium'));
  laterKind=kind(path[6], on('calcium'));
  var bad=nowKind==='sine'||nowKind==='wide'||nowKind==='vt'||laterKind==='vt'||laterKind==='bigu';
  document.getElementById('ecgBox').className='ecgbox'+(bad?' bad':'');
}
function endAt(rem, insulin, salb){ return project(read('k'), rem, insulin, salb)[6]; }
function applyGoal(){
  var k=read('k'), goal=read('target');
  if(k==null||goal==null){ paint(); return; }
  var insulin=on('insulin'), salb=on('salb');
  function solve(){
    var a=endAt(0,insulin,salb), b=endAt(0.4,insulin,salb);
    if((a>=b && goal>=a) || (a<b && goal<=a)) return 0;
    if((a>=b && goal<=b) || (a<b && goal>=b)) return 0.4;
    var lo=0, hi=0.4;
    for(var i=0;i<20;i++){
      var mid=(lo+hi)/2, v=endAt(mid,insulin,salb);
      if(a>=b ? v>goal : v<goal) lo=mid; else hi=mid;
    }
    return Math.round(lo/0.05)*0.05;
  }
  var rem=solve();
  if(Math.abs(endAt(rem,insulin,salb)-goal)>0.25 && !insulin){ insulin=true; document.getElementById('insulin').classList.add('on'); rem=solve(); }
  if(Math.abs(endAt(rem,insulin,salb)-goal)>0.25 && !salb){ salb=true; document.getElementById('salb').classList.add('on'); rem=solve(); }
  document.getElementById('rem').value=rem.toFixed(2);
  paint();
}
['calcium','insulin','salb'].forEach(function(id){
  document.getElementById(id).onclick=function(){ this.classList.toggle('on'); if(id==='calcium') paint(); else applyGoal(); };
});
document.getElementById('rem').oninput=paint;
document.getElementById('k').oninput=function(){ var k=read('k'); if(k!=null && k>5) document.getElementById('target').value='5'; applyGoal(); };
document.getElementById('target').oninput=applyGoal;
var q=new URLSearchParams(location.search);
if(q.get('k')) document.getElementById('k').value=q.get('k');
applyGoal();
requestAnimationFrame(frame);
window.addEventListener('resize', paint);
</script>
</body>
</html>
