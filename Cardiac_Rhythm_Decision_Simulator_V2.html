<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardiac Rhythm Decision Simulator V2</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#122033;--muted:#64748b;--border:#d8dee8;--good:#087f5b;--bad:#c62828;--warn:#a15c00;--accent:#155eef;--danger-bg:#fff1f2}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0 0 5px;font-size:25px}.sub{color:var(--muted);font-size:14px}.badge{font-weight:700;padding:7px 10px;border-radius:999px;background:#eef4ff;color:#174ea6}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 8px #00000008}
.casehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.case-title{font-size:20px;font-weight:800}.stage{font-weight:700;color:var(--accent)}
.case{line-height:1.55}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.vitals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.vital{border:1px solid var(--border);border-radius:12px;padding:11px}.vital b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.vital .val{font-size:21px;font-weight:800}.blink{animation:blink .65s ease 4}@keyframes blink{50%{background:#fff0f0;box-shadow:0 0 0 3px #f8b4b4 inset}}
.ecgbox{background:#08120f;border-radius:14px;padding:12px;color:#a7f3d0}.ecghead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}.ecgwrap{height:210px;margin-top:8px;border-radius:9px;overflow:hidden;background:#06100d;border:1px solid #173d31}.ecgwrap svg{width:100%;height:100%;display:block}.pauseRow{margin-top:18px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:15px;background:#e9eef5;color:var(--ink)}button.primary{background:var(--accent);color:#fff}button.good{background:#0b8f67;color:#fff}button.danger{background:#c62828;color:#fff}button.warn{background:#f4c06b}button:disabled{opacity:.45;cursor:not-allowed}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{text-align:left;border:1px solid var(--border);background:#fff}.opt:hover{border-color:#8aa7e8}.feedback{min-height:52px;padding:12px;border-radius:12px;margin-top:12px;background:#f8fafc;border:1px solid var(--border)}.feedback.good{background:#ecfdf5;border-color:#9bd9c5}.feedback.bad{background:#fff1f2;border-color:#f1a4ad}.feedback.warn{background:#fff8eb;border-color:#f2c36f}
.controls,.top-controls{display:flex;gap:8px;flex-wrap:wrap}.top-controls{margin-top:2px}.top-controls button{display:inline-flex!important;visibility:visible!important;opacity:1!important;align-items:center;justify-content:center;min-width:125px;background:#155eef;color:#fff;border:1px solid #0d47b5}.top-controls button:nth-child(1){background:#0b8f67}.top-controls button:nth-child(2){background:#7c3aed}.top-controls button:nth-child(3){background:#475569}.small{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:700}.hidden{display:none!important}
.arrest{background:#21070a;color:#fff;border-color:#6d1b25}.arrest .small{color:#ffcbd0}.arrest .case-title{color:#fff}.arrest .stage{color:#ffb4bd}.arrest .ecgbox{border:1px solid #74212a}.arrest .vital{border-color:#6d1b25;background:#2c0a0e}.arrest .vital b{color:#ffb4bd}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{background:#fff;border:1px solid var(--border);min-height:54px}.action .dose{display:block;font-size:11px;color:var(--muted);margin-top:3px}.lockednote{font-size:12px;margin-top:8px;color:#ffd3d7}
.abg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.abg div{padding:9px;border-radius:10px;background:#f8fafc;border:1px solid var(--border)}.abg b{display:block;font-size:11px;color:var(--muted)}.abg span{font-weight:800}
.rhythm-flash{font-weight:900;color:#ffef75;background:#174f3d;padding:6px 10px;border-radius:8px;animation:rhythmFlash 1s ease 3}@keyframes rhythmFlash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(1.08)}} .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#122033;color:#fff;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}
@media(max-width:760px){.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.abg{grid-template-columns:1fr 1fr}.top .top-controls{width:100%}.top .top-controls button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Cardiac Rhythm Decision Simulator</h1></div>
    <div class="top-controls" id="topControls">
      <button id="pulseBtn" type="button">🔊 Pulse: ON</button>
      <button id="voiceBtn" type="button">🗣 Voice: ON</button>
      <button id="newBtn" type="button">↻ New Case</button>
    </div>
  </div>

  <div class="card" id="mainCard">
    <div class="casehead"><div><span class="pill" id="caseNo"></span> <span class="pill" id="caseGroup"></span></div><div class="stage" id="stageLabel"></div></div>
    <div class="case-title" id="caseTitle"></div>
    <div class="case" id="caseText"></div>
  </div>

  <div class="grid">
    <div class="card ecgbox">
      <div class="ecghead"><span id="ecgLabel">ECG</span><span id="rhythmFlash" class="rhythm-flash hidden"></span></div>
      <div class="ecgwrap"><svg viewBox="0 0 1000 210" preserveAspectRatio="none"><path id="gridlines" fill="none" stroke="#10342a" stroke-width="1" d=""></path><path id="trace" fill="none" stroke="#65f0a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d=""></path></svg></div>
      <div class="pauseRow">
        <button id="pauseBtn">⏸ Pause ECG</button>
        <button id="resumeBtn" disabled>▶ Resume ECG</button>
      </div>
      
    </div>

    <div class="card">
      <h3 style="margin-top:0">Patient parameters</h3>
      <div class="vitals" id="vitals"></div>

    </div>
  </div>

  <div class="card" id="questionCard">
    <div class="stage" id="questionStage"></div>
    <h2 id="question" style="margin:7px 0 12px"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">Listen to the question and interpret the moving ECG.</div>
  </div>

  <div class="card hidden" id="abgCard">
    <div class="casehead"><h3 style="margin:0">🧪 ABG / Arrest investigation</h3><span class="pill">Asystole module only</span></div>
    
    <div class="abg" id="abg"></div>
  </div>

  <div class="card hidden" id="arrestCard">
    <div class="casehead"><h3 style="margin:0">🚨 Cardiac Arrest Actions</h3><span id="arrestState" class="pill">Arrest mode</span></div>
    
    <div class="actions" id="actions"></div>
    <div class="feedback" id="arrestFeedback">Select an action. The ECG and physiology will respond.</div>
  </div>

  
</div>
<div class="toast" id="toast"></div>

<script>
const cases=[
{title:"Normal Sinus Rhythm (NSR)",group:"Sinus",text:"Stable patient. Identify the rhythm from the moving ECG before treatment is discussed.",rhythm:"NSR",v:{hr:78,bp:"124/76",spo2:98,rr:16,gcs:15},rhythmOpts:["Normal sinus rhythm","Atrial fibrillation","Atrial flutter","PSVT"],correctRhythm:"Normal sinus rhythm",treat:["Observe and treat the clinical context","IV adenosine","Immediate defibrillation","Diltiazem bolus"],correctTreat:"Observe and treat the clinical context"},
{title:"Sinus Bradycardia",group:"Sinus",text:"65-year-old after an inferior MI with dizziness, cool extremities and symptomatic slow pulse.",rhythm:"BRADY",v:{hr:42,bp:"78/46",spo2:96,rr:18,gcs:14},rhythmOpts:["Sinus bradycardia","Complete heart block","AF with slow response","VT"],correctRhythm:"Sinus bradycardia",treat:["IV atropine for symptomatic bradycardia","IV diltiazem","Metoprolol IV","Defibrillation"],correctTreat:"IV atropine for symptomatic bradycardia"},
{title:"Sinus Tachycardia / Sinus Arrhythmia",group:"Sinus",text:"Patient with fever and pneumonia has a regular sinus tachycardia. The simulator can vary R-R intervals subtly with respiration when sinus arrhythmia is selected as the rhythm challenge.",rhythm:"TACHY",v:{hr:128,bp:"104/66",spo2:89,rr:30,gcs:15},rhythmOpts:["Sinus tachycardia","Sinus arrhythmia","AF","Atrial flutter"],correctRhythm:"Sinus tachycardia",treat:["Treat the underlying cause and hypoxemia","IV adenosine","Synchronized cardioversion","IV amiodarone as routine first-line therapy"],correctTreat:"Treat the underlying cause and hypoxemia"},
{title:"Atrial Fibrillation",group:"Atrial",text:"68-year-old with pneumonia, palpitations and an irregularly irregular tachycardia. No evidence of pre-excitation.",rhythm:"AF",v:{hr:158,bp:"118/72",spo2:94,rr:24,gcs:15},rhythmOpts:["Atrial fibrillation","Atrial flutter","PSVT","MAT"],correctRhythm:"Atrial fibrillation",treat:["Appropriate acute rate control when suitable","IV adenosine as definitive therapy","Diltiazem plus verapamil together","Unsynchronized defibrillation"],correctTreat:"Appropriate acute rate control when suitable"},
{title:"Atrial Flutter",group:"Atrial",text:"Patient has regular atrial activity with characteristic saw-tooth flutter waves and a rapid ventricular response.",rhythm:"FLUTTER",v:{hr:150,bp:"110/70",spo2:95,rr:22,gcs:15},rhythmOpts:["Atrial flutter","AF","PSVT","VT"],correctRhythm:"Atrial flutter",treat:["Appropriate rate control or synchronized cardioversion when indicated","Adenosine as definitive therapy","Unsynchronized defibrillation in a stable patient","Digoxin as guaranteed immediate conversion"],correctTreat:"Appropriate rate control or synchronized cardioversion when indicated"},
{title:"PSVT / Regular Narrow-Complex SVT",group:"Supraventricular",text:"32-year-old with sudden palpitations. Regular narrow-complex tachycardia at about 190/min and stable blood pressure.",rhythm:"SVT",v:{hr:190,bp:"122/76",spo2:98,rr:22,gcs:15},rhythmOpts:["Regular narrow-complex SVT","AF","VT","Sinus tachycardia"],correctRhythm:"Regular narrow-complex SVT",treat:["Vagal manoeuvre then rapid IV adenosine if appropriate","Slow IV adenosine infusion","Immediate defibrillation in a stable patient","Routine IV amiodarone first-line"],correctTreat:"Vagal manoeuvre then rapid IV adenosine if appropriate"},
{title:"Premature Ventricular Contractions (PVCs)",group:"Ventricular",text:"Patient has intermittent early wide ectopic beats without preceding P waves followed by compensatory pauses.",rhythm:"PVC",v:{hr:88,bp:"118/74",spo2:97,rr:18,gcs:15},rhythmOpts:["PVCs","AF","PSVT","Complete heart block"],correctRhythm:"PVCs",treat:["Assess cause, oxygenation and electrolytes; treat underlying problem","Immediate defibrillation","Adenosine for every PVC","Diltiazem as routine PVC suppression"],correctTreat:"Assess cause, oxygenation and electrolytes; treat underlying problem"},
{title:"Monomorphic Ventricular Tachycardia",group:"Ventricular",text:"Previous MI patient develops regular wide-complex monomorphic VT with a pulse and hypotension.",rhythm:"VT",v:{hr:178,bp:"82/54",spo2:92,rr:28,gcs:14},rhythmOpts:["Monomorphic VT","SVT with aberrancy","AF with RVR","Sinus tachycardia"],correctRhythm:"Monomorphic VT",treat:["Immediate synchronized cardioversion for instability","IV diltiazem","Definitive adenosine treatment","Observation because a pulse is present"],correctTreat:"Immediate synchronized cardioversion for instability"},
{title:"Polymorphic VT / Torsades de Pointes",group:"Ventricular",text:"Patient on a QT-prolonging drug has hypokalemia and a twisting polymorphic ventricular tachycardia.",rhythm:"TORSADES",v:{hr:220,bp:"76/42",spo2:86,rr:30,gcs:13},rhythmOpts:["Torsades de pointes","Monomorphic VT","SVT","AF"],correctRhythm:"Torsades de pointes",treat:["IV magnesium, correct potassium and remove QT-prolonging trigger","IV diltiazem","IV digoxin","Give another QT-prolonging drug"],correctTreat:"IV magnesium, correct potassium and remove QT-prolonging trigger"},
{title:"Ventricular Fibrillation",group:"Cardiac arrest",text:"Sudden collapse. No pulse. The monitor shows chaotic ventricular activity with no recognizable QRS complexes.",rhythm:"VF",v:{hr:0,bp:"0/0",spo2:0,rr:0,gcs:3},rhythmOpts:["Ventricular fibrillation","Asystole","PEA","Complete heart block"],correctRhythm:"Ventricular fibrillation",treat:["Immediate unsynchronized defibrillation with CPR","Synchronized cardioversion","Diltiazem","Wait for a 12-lead ECG"],correctTreat:"Immediate unsynchronized defibrillation with CPR"},
{title:"First-Degree AV Block",group:"AV block",text:"ECG shows 1:1 AV conduction with a prolonged, constant PR interval.",rhythm:"FIRST",v:{hr:64,bp:"122/70",spo2:98,rr:16,gcs:15},rhythmOpts:["First-degree AV block","Mobitz I","Mobitz II","Complete heart block"],correctRhythm:"First-degree AV block",treat:["Assess patient and reversible causes; treat only if clinically indicated","Immediate pacing in every patient","IV diltiazem","Defibrillation"],correctTreat:"Assess patient and reversible causes; treat only if clinically indicated"},
{title:"Second-Degree AV Block — Mobitz I (Wenckebach)",group:"AV block",text:"The PR interval progressively lengthens until a QRS is dropped, then the cycle repeats.",rhythm:"MOBITZ1",v:{hr:48,bp:"96/60",spo2:97,rr:18,gcs:15},rhythmOpts:["Mobitz I (Wenckebach)","Mobitz II","First-degree AV block","Complete heart block"],correctRhythm:"Mobitz I (Wenckebach)",treat:["Assess symptoms; atropine/pacing pathway if clinically significant","Beta-blocker escalation","Diltiazem","Defibrillation"],correctTreat:"Assess symptoms; atropine/pacing pathway if clinically significant"},
{title:"Second-Degree AV Block — Mobitz II",group:"AV block",text:"PR intervals remain constant, but intermittent QRS complexes are suddenly dropped. This is a high-risk conduction pattern.",rhythm:"MOBITZ2",v:{hr:38,bp:"86/54",spo2:96,rr:18,gcs:14},rhythmOpts:["Mobitz II","Mobitz I","First-degree AV block","AF"],correctRhythm:"Mobitz II",treat:["Prepare for pacing and treat symptomatic bradycardia","Give a beta-blocker","Give diltiazem","Observe without pacing planning"],correctTreat:"Prepare for pacing and treat symptomatic bradycardia"},
{title:"Third-Degree / Complete AV Block",group:"AV block",text:"P waves and QRS complexes are independent. A slow escape rhythm maintains circulation but the patient is hypotensive.",rhythm:"COMPLETE",v:{hr:32,bp:"72/40",spo2:95,rr:20,gcs:13},rhythmOpts:["Complete heart block","Mobitz II","Mobitz I","Sinus bradycardia"],correctRhythm:"Complete heart block",treat:["Atropine when appropriate while preparing for pacing; pace if ineffective/unstable","Metoprolol","Diltiazem","Observation only"],correctTreat:"Atropine when appropriate while preparing for pacing; pace if ineffective/unstable"},
{title:"Asystole / Dynamic Cardiac Arrest",group:"ACLS arrest",text:"Patient collapses and has no pulse. The monitor shows an initially flat/asystolic tracing. This case is a multi-state ACLS simulation: rhythms may evolve to PEA, VF/pVT, organized rhythm, ROSC, sinus tachycardia or recurrent arrest.",rhythm:"ASYSTOLE",v:{hr:0,bp:"0/0",spo2:0,rr:0,gcs:3},rhythmOpts:["Asystole","VF","PEA","VT"],correctRhythm:"Asystole",treat:["High-quality CPR + epinephrine + airway/oxygen + IV/IO + reversible-cause search","Defibrillate immediately","Diltiazem","Adenosine"],correctTreat:"High-quality CPR + epinephrine + airway/oxygen + IV/IO + reversible-cause search",arrest:true}
];

let caseIndex=0, phase="rhythm", paused=false, pulseOn=true, voiceOn=true, currentRhythm=null, arrestState="ASYSTOLE", arrestStep=0, audioCtx=null, pulseTimer=null, pulseInterval=820;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(text){if(!voiceOn||!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1; speechSynthesis.speak(u)}
function tone(type){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);let now=audioCtx.currentTime;if(type==="correct"){o.frequency.setValueAtTime(660,now);o.frequency.setValueAtTime(880,now+.18);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.15,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.42);o.start(now);o.stop(now+.43)}else{o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(90,now+.35);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.36);o.start(now);o.stop(now+.37)}}
function pulseTone(){if(!pulseOn||paused)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);let n=audioCtx.currentTime;o.frequency.value=720;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.045,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+.09);o.start(n);o.stop(n+.1)}
function startPulse(){clearInterval(pulseTimer);if(currentRhythm==="ASYSTOLE"||currentRhythm==="VF"||currentRhythm==="PEA")return;pulseTimer=setInterval(pulseTone,pulseInterval)}
function stopPulse(){clearInterval(pulseTimer)}

function vitalData(c){return [{k:"HR",v:c.v.hr+" bpm"},{k:"BP",v:c.v.bp+" mmHg"},{k:"RR",v:c.v.rr+"/min"},{k:"SpO₂",v:(c.v.spo2?c.v.spo2+"%":"—")}]}
function renderVitals(c,delta={}){
 const vals=vitalData(c); $("vitals").innerHTML=vals.map(x=>`<div class="vital ${delta[x.k]?'blink':''}"><b>${x.k}</b><div class="val">${x.v}</div></div>`).join("");
}
function ecgPoints(kind,t){
 const pts=[]; const rate=(kind==="NSR"?78:kind==="BRADY"?42:kind==="TACHY"?128:kind==="AF"?158:kind==="FLUTTER"?150:kind==="SVT"?190:kind==="PVC"?88:kind==="VT"?178:kind==="TORSADES"?220:kind==="VF"?0:kind==="FIRST"?64:kind==="MOBITZ1"?48:kind==="MOBITZ2"?38:kind==="COMPLETE"?32:kind==="PEA"?90:0);
 const period=rate?60000/rate:900;
 for(let x=0;x<=1000;x+=2){let ms=(x/1000*6000+t)%6000,y=0;
  if(kind==="VF"){y=(Math.sin(ms*.08)+Math.sin(ms*.17+.7)+Math.sin(ms*.31))*14+(Math.random()-.5)*8}
  else if(kind==="ASYSTOLE"){y=(Math.random()-.5)*1.2}
  else if(kind==="PEA"){y=8*Math.sin(ms/period*2*Math.PI); if((ms%period)<90)y-=8}
  else if(kind==="VT"){let q=ms%period; y=28*Math.sin(q/period*2*Math.PI); if(q>80&&q<260)y-=30*Math.sin((q-80)/180*Math.PI)}
  else if(kind==="TORSADES"){let q=ms%900;let amp=55*Math.sin(q/900*Math.PI);y=amp*Math.sin(q/70)}
  else {let q=ms%period; y=0;
   if(kind==="FLUTTER") y=10*Math.sin(ms/65*2*Math.PI);
   if(kind==="AF") y=3*Math.sin(ms/47)+2*Math.sin(ms/19);
   const p=(kind==="MOBITZ1"&&q>period*.72)?false:true;
   const dropped=(kind==="MOBITZ1"&&Math.floor(ms/period)%4===3)||(kind==="MOBITZ2"&&Math.floor(ms/period)%3===2);
   if(q<90)y-=p?14*Math.exp(-Math.pow((q-35)/12,2)):0;
   if(q>=90&&q<145)y+=p?7*Math.exp(-Math.pow((q-110)/16,2)):0;
   if(q>=145&&q<175)y-=dropped?0:62*Math.exp(-Math.pow((q-160)/8,2));
   if(q>=175&&q<225)y+=dropped?0:24*Math.exp(-Math.pow((q-198)/14,2));
   if(kind==="PVC"&&Math.floor(ms/period)%5===3){let qq=q-120;y=qq>0&&qq<130?-58*Math.exp(-Math.pow((qq-60)/25,2)):0}
   if(kind==="COMPLETE"){y= q<70?10*Math.sin(q/70*2*Math.PI):0; if(q>120&&q<300)y-=50*Math.exp(-Math.pow((q-185)/18,2))}
   if(kind==="FIRST"){y*=1}
   if(kind==="BRADY"||kind==="TACHY"||kind==="NSR"||kind==="SVT"||kind==="AF"||kind==="FLUTTER"){}
  }
  pts.push([x,105+y])
 }
 return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")
}
function renderGrid(){let d="";for(let x=0;x<=1000;x+=50)d+=`M${x} 0V210 `;for(let y=0;y<=200;y+=35)d+=`M0 ${y}H1000 `;$("gridlines").setAttribute("d",d)}
function animateECG(){if(!paused){const now=performance.now();$("trace").setAttribute("d",ecgPoints(currentRhythm,now*.7))}requestAnimationFrame(animateECG)}
function setCase(i){
 caseIndex=i; phase="rhythm"; paused=false; arrestState="ASYSTOLE"; arrestStep=0; const c=cases[i]; currentRhythm=c.rhythm;
 $("mainCard").classList.toggle("arrest",!!c.arrest); $("caseNo").textContent=`Case ${i+1}/15`; $("caseGroup").textContent=c.group; $("stageLabel").textContent="Stage 1 • Rhythm recognition"; $("caseTitle").textContent=c.title; $("caseText").textContent=c.text;
 $("ecgLabel").textContent="ECG"; $("rhythmFlash").textContent=""; $("rhythmFlash").classList.add("hidden"); renderVitals(c); $("pauseBtn").disabled=false;$("resumeBtn").disabled=true;
 $("questionStage").textContent="STEP 1"; $("question").textContent="What is the rhythm?"; $("feedback").className="feedback";$("feedback").textContent="Listen to the voice prompt, review the moving ECG, then choose the rhythm.";
 $("options").innerHTML=shuffle(c.rhythmOpts).map((o,i)=>`<button class="opt" onclick="answerRhythm('${encodeURIComponent(o)}')">${String.fromCharCode(65+i)}. ${o}</button>`).join("");
 $("abgCard").classList.toggle("hidden",!c.arrest); $("arrestCard").classList.toggle("hidden",!c.arrest); if(c.arrest)renderArrest();
 speak("What is the rhythm?"); startPulse(); updatePulseButton();
}
function answerRhythm(encoded){const choice=decodeURIComponent(encoded),c=cases[caseIndex];if(choice!==c.correctRhythm){tone("wrong");speak("Taa.");$("feedback").className="feedback bad";$("feedback").textContent="Incorrect rhythm interpretation. Reassess the moving ECG.";return}
 tone("correct");speak("Yes, this is "+c.correctRhythm+"."); $("feedback").className="feedback good";$("feedback").textContent="Correct. The rhythm has been identified."; phase="treat"; $("stageLabel").textContent="Stage 2 • Treatment"; $("questionStage").textContent="STEP 2"; $("question").textContent="What is the most appropriate treatment?";
 $("ecgLabel").textContent="ECG"; const rf=$("rhythmFlash"); rf.textContent="✓ "+c.correctRhythm; rf.classList.remove("hidden"); rf.classList.remove("rhythm-flash"); void rf.offsetWidth; rf.classList.add("rhythm-flash"); $("options").innerHTML=shuffle(c.treat).map((o,i)=>`<button class="opt" onclick="answerTreat('${encodeURIComponent(o)}')">${String.fromCharCode(65+i)}. ${o}</button>`).join("");
 setTimeout(()=>speak("What is the most appropriate treatment?"),500);
}
function answerTreat(encoded){const choice=decodeURIComponent(encoded),c=cases[caseIndex];if(choice!==c.correctTreat){tone("wrong");speak("Taa.");$("feedback").className="feedback bad";$("feedback").textContent="Incorrect treatment. The patient's ECG and physiology will now show the simulated consequence.";applyDeterioration();return}
 tone("correct");speak("Yes. The most appropriate treatment is "+c.correctTreat+".");$("feedback").className="feedback good";$("feedback").textContent="Correct treatment. The ECG and vital parameters now show the expected response.";applyImprovement();if(c.arrest)arrestState="CPR";renderArrest();}

function applyDeterioration(){const c=cases[caseIndex];let d={};if(c.v.hr>100){c.v.hr+=18;d.HR=1}if(c.v.hr>0&&c.v.hr<70){c.v.hr=Math.max(18,c.v.hr-8);d.HR=1}if(c.v.bp!=="0/0"){let [a,b]=c.v.bp.split("/").map(Number);c.v.bp=Math.max(40,a-18)+"/"+Math.max(25,b-10);d.BP=1}if(c.v.spo2){c.v.spo2=Math.max(60,c.v.spo2-6);d["SpO₂"]=1}c.v.gcs=Math.max(3,c.v.gcs-2);renderVitals(c,d)}
function applyImprovement(){const c=cases[caseIndex];let d={};if(c.v.hr>100){c.v.hr=Math.max(70,c.v.hr-28);d.HR=1}if(c.v.hr>0&&c.v.hr<70){c.v.hr=Math.min(75,c.v.hr+22);d.HR=1}if(c.v.bp!=="0/0"){let [a,b]=c.v.bp.split("/").map(Number);c.v.bp=Math.min(125,a+20)+"/"+Math.min(80,b+12);d.BP=1}if(c.v.spo2){c.v.spo2=Math.min(98,c.v.spo2+4);d["SpO₂"]=1}c.v.gcs=Math.min(15,c.v.gcs+2);renderVitals(c,d)}

function updatePulseButton(){$("pulseBtn").textContent="🔊 Pulse: "+(pulseOn?"ON":"OFF");$("pulseBtn").style.display="inline-flex";$("voiceBtn").style.display="inline-flex";$("newBtn").style.display="inline-flex"}
$("pulseBtn").onclick=()=>{pulseOn=!pulseOn;updatePulseButton();if(pulseOn){pulseTone();startPulse()}else stopPulse()}
$("voiceBtn").onclick=()=>{voiceOn=!voiceOn;$("voiceBtn").textContent="🗣 Voice: "+(voiceOn?"ON":"OFF");if(!voiceOn)speechSynthesis.cancel()}
$("pauseBtn").onclick=()=>{paused=true;$("pauseBtn").disabled=true;$("resumeBtn").disabled=false;stopPulse();$("feedback").textContent="ECG PAUSED — review the strip before resuming."}
$("resumeBtn").onclick=()=>{paused=false;$("pauseBtn").disabled=false;$("resumeBtn").disabled=true;startPulse()}
$("newBtn").onclick=()=>setCase(Math.floor(Math.random()*cases.length));

function renderArrest(){const c=cases[caseIndex];if(!c.arrest)return;const states=["ASYSTOLE","PEA","VF","PVT","ORGANIZED RHYTHM","ROSC","SINUS TACHYCARDIA","RECURRENT ASYSTOLE"];arrestState=states[Math.min(arrestStep,states.length-1)];$("arrestState").textContent=arrestState;$("abgCard").classList.remove("hidden");$("arrestCard").classList.remove("hidden");renderABG();const acts=[
["CPR","Start/continue high-quality CPR"],["EPINEPHRINE","1 mg IV/IO; repeat per ACLS timing"],["DEFIBRILLATOR","Deliver shock if VF/pVT is present"],["AIRWAY / BVM","Ventilate and consider advanced airway"],["100% OXYGEN","Support oxygenation"],["IV / IO ACCESS","Establish vascular access"],["CAPNOGRAPHY","Monitor ETCO₂ when available"],["AMIODARONE","For refractory VF/pVT when appropriate"],["LIDOCAINE","Alternative antiarrhythmic for refractory VF/pVT"],["MAGNESIUM","Selected indications, especially torsades"],["CALCIUM","Selected indications such as hyperkalemia"],["SODIUM BICARBONATE","Selected indications; not routine arrest"],["ATROPINE","Bradycardia pathway; not routine asystole"],["RHYTHM CHECK","Pause briefly and reassess rhythm"],["4H / 4T","Search and treat reversible causes"],["ROSC / POST-ARREST","Post-ROSC care when circulation returns"]
];$("actions").innerHTML=acts.map((a,i)=>`<button class="action" onclick="arrestAction('${a[0]}')"><b>${a[0]}</b><span class="dose">${a[1]}</span></button>`).join("")}
function renderABG(){const states=["ASYSTOLE","PEA","VF","PVT","ORGANIZED RHYTHM","ROSC","SINUS TACHYCARDIA","RECURRENT ASYSTOLE"];const s=states[Math.min(arrestStep,states.length-1)];let v={pH:"7.16",PaCO2:"58",PaO2:"54",HCO3:"19",Lactate:"8.2",K:"5.9",Na:"138",Ca:"1.05"};if(s==="ROSC"||s==="SINUS TACHYCARDIA")v={pH:"7.28",PaCO2:"44",PaO2:"92",HCO3:"20",Lactate:"5.2",K:"4.8",Na:"138",Ca:"1.12"};$("abg").innerHTML=Object.entries(v).map(([k,x])=>`<div><b>${k}</b><span>${x}${k==="pH"?"":k==="PaCO2"||k==="PaO2"?" mmHg":k==="Lactate"?" mmol/L":k==="K"||k==="Na"||k==="Ca"?" mmol/L":" mmol/L"}</span></div>`).join("")}
function arrestAction(action){
 const s=arrestState;
 const shockable=s==="VF"||s==="PVT";
 let correct=false;
 if((s==="ASYSTOLE"||s==="PEA")&&(action==="CPR"||action==="EPINEPHRINE"||action==="AIRWAY / BVM"||action==="100% OXYGEN"||action==="IV / IO ACCESS"||action==="CAPNOGRAPHY"||action==="4H / 4T"||action==="RHYTHM CHECK"))correct=true;
 if(shockable&&(action==="DEFIBRILLATOR"||action==="CPR"))correct=true;
 if((s==="VF"||s==="PVT")&&(action==="AMIODARONE"||action==="LIDOCAINE"))correct=true;
 if(s==="ASYSTOLE"&&action==="DEFIBRILLATOR"){tone("wrong");speak("Taa. Asystole is a non-shockable rhythm.");$("arrestFeedback").className="feedback bad";$("arrestFeedback").textContent="Incorrect: no shock should be delivered for asystole. Continue CPR, epinephrine and reversible-cause management.";return}
 if(s==="ASYSTOLE"&&action==="SODIUM BICARBONATE"){tone("wrong");speak("Taa.");$("arrestFeedback").className="feedback bad";$("arrestFeedback").textContent="Not routine in undifferentiated cardiac arrest; use only for a specific indication.";return}
 if(!correct && action!=="ROSC / POST-ARREST"){tone("wrong");speak("Taa.");$("arrestFeedback").className="feedback bad";$("arrestFeedback").textContent="This action is not the priority for the current rhythm/state.";applyDeterioration();return}
 tone("correct");speak("Ding-dong.");$("arrestFeedback").className="feedback good";
 if(action==="RHYTHM CHECK"){arrestStep=Math.min(arrestStep+1,7);transitionArrest();return}
 if(action==="ROSC / POST-ARREST"&&s==="ROSC"){transitionArrest();return}
 $("arrestFeedback").textContent="Appropriate action. The simulated patient state responds.";
 if(action==="DEFIBRILLATOR"&&shockable){arrestStep=4;transitionArrest()}
 else if(action==="EPINEPHRINE"&&s==="ASYSTOLE"){arrestStep=1;transitionArrest()}
 else if(action==="EPINEPHRINE"&&s==="PEA"){arrestStep=2;transitionArrest()}
 else if(action==="CPR"&&s==="ASYSTOLE"){arrestStep=1;transitionArrest()}
 else if(action==="CPR"&&s==="PEA"){arrestStep=2;transitionArrest()}
 else if(action==="CPR"&&s==="VF"){arrestStep=3;transitionArrest()}
 else if((action==="AMIODARONE"||action==="LIDOCAINE")&&shockable){arrestStep=4;transitionArrest()}
}
function transitionArrest(){
 const states=["ASYSTOLE","PEA","VF","PVT","ORGANIZED RHYTHM","ROSC","SINUS TACHYCARDIA","RECURRENT ASYSTOLE"];arrestState=states[Math.min(arrestStep,7)];
 currentRhythm=arrestState==="VF"?"VF":arrestState==="PVT"?"VT":arrestState==="PEA"?"PEA":arrestState==="ASYSTOLE"||arrestState==="RECURRENT ASYSTOLE"?"ASYSTOLE":arrestState==="SINUS TACHYCARDIA"?"TACHY":"NSR";
 const c=cases[caseIndex]; if(arrestState==="ROSC"||arrestState==="SINUS TACHYCARDIA"){c.v.hr=arrestState==="ROSC"?84:126;c.v.bp="108/66";c.v.spo2=94;c.v.rr=20;c.v.gcs=8}
 else if(arrestState==="VF"||arrestState==="PVT"){c.v.hr=0;c.v.bp="0/0";c.v.spo2=0;c.v.gcs=3}
 else if(arrestState==="ASYSTOLE"||arrestState==="RECURRENT ASYSTOLE"){c.v.hr=0;c.v.bp="0/0";c.v.spo2=0;c.v.gcs=3}
 else {c.v.hr=90;c.v.bp="0/0";c.v.spo2=0;c.v.gcs=3}
 $("ecgLabel").textContent="ECG — "+arrestState;renderVitals(c);renderArrest();startPulse()}
renderGrid();animateECG();setCase(0);
</script>
