  ett:[

const TWINS = {dl:["vl"], vl:["dl"], nrb:["omask"], omask:["nrb"]};
let quizAt = 0;
let quizStep = "use";
let quizOpen = false;
let quizQ = null;
function quizPool(field, id, name, correct){
  const here = ITEMS.filter(function(row){ return row.id===id; })[0];
  const skip = TWINS[id] || [];
  const same = [];
  const other = [];
  Object.keys(QUIZ).forEach(function(qid){
    if(skip.indexOf(qid)>=0) return;
    const row = ITEMS.filter(function(r){ return r.id===qid; })[0];
    QUIZ[qid].forEach(function(item){
      const text = item[field];
      if(item.name===name || !text || text===correct) return;
      ((row && here && row.cat===here.cat) ? same : other).push(text);
    });
  });
  const out = [];
  [same, other].forEach(function(group){
    while(out.length<3 && group.length){
      const text = group.splice(Math.floor(Math.random()*group.length),1)[0];
      if(out.indexOf(text)<0) out.push(text);
    }
  });
  return out;
}
function quizNew(){
  const item = QUIZ[currentId][quizAt];
  const field = quizStep==="use" ? "u" : "k";
  const correct = item[field];
  const options = quizPool(field, currentId, item.name, correct);
  const at = Math.floor(Math.random()*(options.length+1));
  options.splice(at, 0, correct);
  quizQ = {options:options, correct:at, picked:null};
}
function quizFull(item){ return item[quizStep==="use" ? "use" : "check"]; }
function quizPanel(){
  const list = QUIZ[currentId];
  if(!list) return "";
  if(!quizOpen || !quizQ) return "<button type='button' id='ask'>Questions</button>";
  const item = list[quizAt];
  const prompt = quizStep==="use" ? "What is it for?" : "Which check matters?";
  const done = quizQ.picked!==null;
  const rows = quizQ.options.map(function(opt,i){
    let cls = "";
    if(done && i===quizQ.correct) cls = " class='on'";
    else if(done && i===quizQ.picked) cls = " class='wrong'";
    return "<button type='button' data-q='"+i+"'"+cls+(done?" disabled":"")+">"+opt+"</button>";
  }).join("");
  const last = quizStep==="check" && quizAt>=list.length-1;
  const feedback = done
    ? "<p id='qfb' role='status'>"+(quizQ.picked===quizQ.correct ? "Correct. " : "That is incorrect. ")+quizFull(item)+"</p><button type='button' id='qnext'>"+(last ? "Finish" : "Next")+"</button>"
    : "";
  const number = quizAt*2 + (quizStep==="use" ? 1 : 2);
  return "<div id='quiz'><b>"+item.name+"</b><small>Question "+number+" of "+list.length*2+"</small><p>"+prompt+"</p>"+rows+feedback+"</div>";
}
function wireQuiz(aside){
  const ask = aside.querySelector("#ask");
  if(ask) ask.onclick = function(){ quizOpen = true; quizAt = 0; quizStep = "use"; quizNew(); paintLists(true); };
  aside.querySelectorAll("[data-q]").forEach(function(btn){
    btn.onclick = function(){
      if(!quizQ || quizQ.picked!==null) return;
      quizQ.picked = Number(btn.getAttribute("data-q"));
      const item = QUIZ[currentId][quizAt];
      speak((quizQ.picked===quizQ.correct ? "Correct. " : "That is incorrect. ")+quizFull(item));
      paintLists(true);
    };
  });
  const next = aside.querySelector("#qnext");
  if(next) next.onclick = function(){
    stopSpeak();
    const list = QUIZ[currentId];
    if(quizStep==="use"){ quizStep = "check"; }
    else {
      quizStep = "use"; quizAt += 1;
      if(quizAt>=list.length){ quizOpen = false; quizAt = 0; quizQ = null; paintLists(true); return; }
    }
    quizNew();
    paintLists(true);
  };
}
let selected = null;
let turning = false;
function clearRoot(){
  while(root.children.length){
    const o = root.children.pop();
    o.traverse(function(n){
      if(n.geometry) n.geometry.dispose();
      if(n.material){
        const list = Array.isArray(n.material) ? n.material : [n.material];
        list.forEach(function(m){ if(m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }
  parts.length = 0;
  selected = null;
}

function fit(){
  const box = new THREE.Box3().setFromObject(root);
  if(box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.55, size*0.28, size*0.72));
  camera.near = Math.max(0.01, size/200);
  camera.far = size*20;
  camera.updateProjectionMatrix();
  controls.update();
}
function setEttStatus(text, bad){
  const el = document.getElementById("ett-status");
  if(!el) return;
  if(!text){ el.hidden = true; el.textContent = ""; el.className = ""; return; }
  el.hidden = false;
  el.className = bad ? "bad" : "";
  el.textContent = text;
}
function loadReal(id){
  const spec = REAL[id];
  const token = ++modelToken;
  realModel = false;
  setEttStatus("Loading the "+spec.label.toLowerCase()+"…", false);
  const loader = new GLTFLoader();
  const fileLoader = new THREE.FileLoader();
  fileLoader.setResponseType("arraybuffer");
  fileLoader.load(spec.url+"?v=20261113a", function(buf){
    loader.parse(buf, "", function(gltf){
    if(token !== modelToken || currentId !== id) return;
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDimension = Math.max(size.x, size.y, size.z);

function clearGuides(){
  if(!partGuides) return;
  Object.keys(partGuides).forEach(function(id){
    const mark = partGuides[id];
    scene.remove(mark);
    mark.geometry.dispose();
    mark.material.dispose();
  });
  partGuides = null;
  shownPart = "";
}
function buildEttGuides(model){
  clearGuides();
  const buckets = {};
  activeParts().forEach(function(part){ buckets[part.id] = []; });
  const tmp = new THREE.Vector3();
  const sum = new THREE.Vector3();
  model.updateMatrixWorld(true);
  model.traverse(function(mesh){
    if(!mesh.isMesh || !mesh.geometry || !mesh.geometry.attributes.position) return;
    mesh.updateMatrix();
    const pos = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const tris = index ? index.count / 3 : pos.count / 3;
    for(let i=0;i<tris;i++){
      const ia = index ? index.getX(i*3) : i*3;
      const ib = index ? index.getX(i*3+1) : i*3+1;
      const ic = index ? index.getX(i*3+2) : i*3+2;
      sum.set(0,0,0);
      authoredVertex(mesh, ia, tmp); sum.add(tmp);
      authoredVertex(mesh, ib, tmp); sum.add(tmp);
      authoredVertex(mesh, ic, tmp); sum.add(tmp);
      sum.multiplyScalar(1/3);
      const part = activePartId(sum.x, sum.y, sum.z);
      const bag = buckets[part];
      if(!bag) continue;
      tmp.fromBufferAttribute(pos, ia).applyMatrix4(mesh.matrixWorld);
      bag.push(tmp.x, tmp.y, tmp.z);
      tmp.fromBufferAttribute(pos, ib).applyMatrix4(mesh.matrixWorld);
      bag.push(tmp.x, tmp.y, tmp.z);
      tmp.fromBufferAttribute(pos, ic).applyMatrix4(mesh.matrixWorld);
      bag.push(tmp.x, tmp.y, tmp.z);
    }
  });
  partGuides = {};
  activeParts().forEach(function(part){
    const arr = buckets[part.id];
    if(!arr.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    const mark = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0x7fd4e6, transparent: true, opacity: 0.5, depthTest: true,
      side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    }));
    mark.visible = false;
    scene.add(mark);
    partGuides[part.id] = mark;
  });
}
function showPart(id){
  const list = activeParts();
  const part = list ? list.filter(function(row){ return row.id===id; })[0] : null;
  if(!part) return;
  shownPart = id;
  if(partGuides){
    Object.keys(partGuides).forEach(function(key){ partGuides[key].visible = key===id; });
  }
  clearTouch();
  speak(part.title+". "+part.text);
  paintLists(true);
}
function partFromHit(hit){
  const mesh = hit.object;
  const geo = mesh.geometry;
  if(!geo || !geo.attributes.position || hit.faceIndex==null) return "body";
  const index = geo.index;
  const face = hit.faceIndex;
  const ia = index ? index.getX(face*3) : face*3;
  const ib = index ? index.getX(face*3+1) : face*3+1;
  const ic = index ? index.getX(face*3+2) : face*3+2;
  const tmp = new THREE.Vector3();
  const sum = new THREE.Vector3();
  authoredVertex(mesh, ia, tmp); sum.add(tmp);
  authoredVertex(mesh, ib, tmp); sum.add(tmp);
  authoredVertex(mesh, ic, tmp); sum.add(tmp);
  sum.multiplyScalar(1/3);
  return activePartId(sum.x, sum.y, sum.z);
}
function clearTouch(){
  if(!touchMark) return;
  scene.remove(touchMark);
  touchMark.geometry.dispose();
  touchMark.material.dispose();
  touchMark = null;
}
function markTouch(hit){
  clearTouch();
  const mesh = hit.object;
  const geo = mesh.geometry;
  if(!geo || !geo.attributes.position) return;
  const pos = geo.attributes.position;
  const index = geo.index;
  mesh.updateWorldMatrix(true, false);
  const world = mesh.matrixWorld;
  const point = new THREE.Vector3();
  const span = mesh.userData.span || 2.5;
  const reach = span * 0.1;
  const reach2 = reach * reach;
  const center = hit.point;
  const keep = [];
  const tris = index ? index.count / 3 : pos.count / 3;
  for(let i=0;i<tris;i++){
    const a = index ? index.getX(i*3) : i*3;
    const b = index ? index.getX(i*3+1) : i*3+1;
    const c = index ? index.getX(i*3+2) : i*3+2;
    point.fromBufferAttribute(pos, a).applyMatrix4(world);
    const ax = point.x, ay = point.y, az = point.z;
    point.fromBufferAttribute(pos, b).applyMatrix4(world);
    const bx = point.x, by = point.y, bz = point.z;
    point.fromBufferAttribute(pos, c).applyMatrix4(world);
    const mx = (ax+bx+point.x)/3, my = (ay+by+point.y)/3, mz = (az+bz+point.z)/3;
    const dx = mx-center.x, dy = my-center.y, dz = mz-center.z;
    if(dx*dx+dy*dy+dz*dz > reach2) continue;
    keep.push(ax,ay,az, bx,by,bz, point.x,point.y,point.z);
  }
  if(!keep.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(keep, 3));
  touchMark = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: 0x7fd4e6, transparent: true, opacity: 0.55, depthTest: true,
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  }));
  scene.add(touchMark);
}
function select(mesh){
  if(selected && selected!==mesh) clearHighlight(selected);
  selected = mesh;
  if(mesh){ paintHighlight(mesh); speak(mesh.userData.title+". "+mesh.userData.text); }
  paintLists(true);
}
function femaleVoice(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() || [] : [];
  const en = voices.filter(function(v){ return /^en/i.test(v.lang || ""); });
  const male = /rishi|daniel|alex|aaron|fred|arthur|gordon|david|tom|lee|ravi|veer|male|daniel|junior/i;
  const female = /female|samantha|victoria|karen|moira|fiona|serena|zira|veena|allison|ava|susan|kate|nicky|martha|libby|amy|joanna|ivy|salli|kimberly|emma|alice|catherine|fiona|google uk english female/i;
  return en.find(function(v){ return female.test((v.name||"")+" "+(v.voiceURI||"")) && !male.test(v.name||""); })
    || en.find(function(v){ return !male.test((v.name||"")+" "+(v.voiceURI||"")) && /en-GB|en-IN|en-AU/i.test(v.lang||""); })
    || null;
}
let speakToken = 0;
function stopSpeak(){
  speakToken += 1;
  try { if(window.speechSynthesis) speechSynthesis.cancel(); } catch (err) {}
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  const token = ++speakToken;
  const say = function(){
    if(token !== speakToken) return;
    const u = new SpeechSynthesisUtterance(text);
    const voice = femaleVoice();
    u.lang = voice && voice.lang ? voice.lang : "en-GB";
    u.rate = 0.88;
    u.pitch = 1.16;
    u.volume = 1;
    if(voice) u.voice = voice;
    const go = function(){
      if(token !== speakToken) return;
      try { speechSynthesis.cancel(); } catch (err) {}
      speechSynthesis.resume();
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.speaking || speechSynthesis.pending){
      try { speechSynthesis.cancel(); } catch (err) {}
      setTimeout(go, 60);
    } else go();
  };
  if(!speechSynthesis.getVoices().length){
    const once = function(){ speechSynthesis.removeEventListener("voiceschanged", once); say(); };
    speechSynthesis.addEventListener("voiceschanged", once);
    speechSynthesis.getVoices();
    return;
  }
  say();
}
function downloadGlb(){
  const spec = REAL[currentId];
  if(!spec) return;
  const a = document.createElement("a");
  a.href = spec.url;
  a.download = spec.url.split("/").pop();
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function resize(){
  const r = canvas.getBoundingClientRect();
  if(!r.width || !r.height) return;
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  renderer.setSize(r.width, r.height, false);
}
function frame(){
  requestAnimationFrame(frame);
  controls.update();
  renderer.render(scene, camera);
}
canvas.addEventListener("pointerdown", function(e){ canvas._x = e.clientX; canvas._y = e.clientY; });
canvas.addEventListener("pointerup", function(e){
  if(Math.hypot(e.clientX-canvas._x, e.clientY-canvas._y) > 8) return;
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX-rect.left)/rect.width)*2-1;
  const y = -((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(new THREE.Vector2(x,y), camera);
  const hit = ray.intersectObjects(parts, false)[0];
  if(!hit) return;
  if(activeParts()){
    if(selected && selected!==hit.object) clearHighlight(selected);
    selected = hit.object;
    paintHighlight(hit.object);
    showPart(partFromHit(hit));
    return;
  }
  markTouch(hit);
  select(hit.object);
});
window.addEventListener("resize", resize);
resize();
showItem("ett");
requestAnimationFrame(frame);
