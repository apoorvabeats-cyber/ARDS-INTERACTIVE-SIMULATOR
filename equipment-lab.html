<style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const CATS = [["airway","Airway"],["oxygen","Oxygen"],["access","Access"],["gi","Gastrointestinal"],["support","Support"]];
const ITEMS = [
  {id:"ett", cat:"airway", name:"Endotracheal tube", note:"Cuffed adult tube"},
  {id:"lma", cat:"airway", name:"Laryngeal mask airway", note:"Supraglottic airway"},
  {id:"bvm", cat:"airway", name:"Bag-valve mask", note:"Self-inflating resuscitator"},
  {id:"dl", cat:"airway", name:"Direct laryngoscope", note:"Handle and blade"},
  {id:"vl", cat:"airway", name:"Video laryngoscope", note:"Screen and blade"},
  {id:"hfnc", cat:"oxygen", name:"High-flow nasal cannula", note:"Heated humidified oxygen"},
  {id:"niv", cat:"oxygen", name:"NIV full-face mask", note:"CPAP or non-invasive ventilation"},
  {id:"nrb", cat:"oxygen", name:"Non-rebreather mask", note:"Reservoir bag"},
  {id:"omask", cat:"oxygen", name:"Oxygen mask", note:"Face mask"},
  {id:"o2kit", cat:"oxygen", name:"Oxygen therapy kit", note:"Oxygen delivery set"},
  {id:"o2tube", cat:"oxygen", name:"Oxygen tubing", note:"Flowmeter to the mask"},
  {id:"cvc", cat:"access", name:"Central venous catheter", note:"Triple lumen"},
  {id:"dialysis", cat:"access", name:"Dialysis catheter", note:"Access for renal replacement"},
  {id:"needles", cat:"access", name:"Arterial line", note:"Continuous blood pressure"},
  {id:"epidural", cat:"access", name:"Swan-Ganz catheter", note:"Pulmonary artery catheter"},
  {id:"suction", cat:"access", name:"Nasogastric tube", note:"Nose to the stomach"},
  {id:"sb", cat:"gi", name:"Sengstaken-Blakemore tube", note:"Balloon tamponade"},
  {id:"chest", cat:"support", name:"Chest drainage system", note:"Underwater seal"},
  {id:"defib", cat:"support", name:"Defibrillator", note:"Pads and setup"}
];

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.75));
renderer.setClearColor(0x101418, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xf7f1e6, 0x1b140f, 0.85));
const key = new THREE.DirectionalLight(0xfff8ee, 2.4);
key.position.set(4, 6, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xb7e4f2, 1.1);
rim.position.set(-5, 2, -4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xf3efe6, 0.45);
fill.position.set(0, 2, -5);
scene.add(fill);
const camera = new THREE.PerspectiveCamera(35, 1, 0.02, 80);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = false;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 0.45;
controls.maxDistance = 14;
const root = new THREE.Group();
scene.add(root);
const ray = new THREE.Raycaster();
const parts = [];
let currentId = "ett";
let realModel = false;
let modelToken = 0;
const REAL = {
  ett: {url:"assets/models/ETT.glb", label:"Endotracheal tube", text:"A cuffed tube placed through the vocal cords into the trachea, to protect the airway and ventilate the patient."},
  lma: {url:"assets/models/LMA.glb", label:"Laryngeal mask airway", text:"A supraglottic airway. The mask sits over the larynx, and the tube joins the breathing circuit."},
  bvm: {url:"assets/models/BVM.glb", label:"Bag-valve mask", text:"A self-inflating bag, a valve, and a mask, used to ventilate a patient by hand."},
  dl: {url:"assets/models/Laryngoscope.glb", label:"Direct laryngoscope", text:"A handle and blade used to lift the tongue and see the vocal cords."},
  vl: {url:"assets/models/VL.glb", label:"Video laryngoscope", text:"A blade with a camera and a screen, used to see the glottis without a direct line of sight."},
  hfnc: {url:"assets/models/HFNC.glb", label:"High-flow nasal cannula", text:"Soft nasal prongs that deliver heated, humidified oxygen at a high flow."},
  niv: {url:"assets/models/NIV.glb", label:"NIV full-face mask", text:"A mask that seals over the nose and mouth for CPAP or non-invasive ventilation."},
  nrb: {url:"assets/models/NRBM.glb", label:"Non-rebreather mask", text:"A face mask with a reservoir bag, used to give a high concentration of oxygen."},
  omask: {url:"assets/models/OMASK.glb", label:"Oxygen mask", text:"A mask over the nose and mouth that raises the oxygen the patient breathes."},
  o2kit: {url:"assets/models/O2KIT.glb", label:"Oxygen therapy kit", text:"The set of pieces used to give controlled oxygen."},
  o2tube: {url:"assets/models/O2TUBE.glb", label:"Oxygen tubing", text:"The tube that carries oxygen from the flowmeter to the mask or cannula."},
  cvc: {url:"assets/models/CVC.glb", label:"Central venous catheter", text:"A triple-lumen catheter placed in a large vein for drugs, fluids, and central venous pressure."},
  dialysis: {url:"assets/models/DIALYSIS.glb", label:"Dialysis catheter", text:"A wide double-lumen catheter used for renal replacement therapy."},
  needles: {url:"assets/models/NEEDLES.glb", label:"Arterial line", text:"A cannula placed in an artery, usually the radial artery, for continuous blood pressure and arterial blood samples."},
  epidural: {url:"assets/models/EPIDURAL.glb", label:"Swan-Ganz catheter", text:"A pulmonary artery catheter. The balloon is floated through the right heart into the pulmonary artery to measure pressures and cardiac output."},
  suction: {url:"assets/models/SUCTION.glb", label:"Nasogastric tube", text:"A tube passed through the nose into the stomach, to drain the stomach or to give feed and medicine."},
  sb: {url:"assets/models/SBTUBE.glb", label:"Sengstaken-Blakemore tube", text:"A tube with a gastric balloon and an oesophageal balloon, used to compress bleeding varices. Inflate the gastric balloon only after the position is confirmed."},
  chest: {url:"assets/models/CHEST.glb", label:"Chest drainage system", text:"An underwater seal that drains air or fluid from the pleural space."},
  defib: {url:"assets/models/DEFIB.glb", label:"Defibrillator", text:"Pads placed on the chest to read the rhythm and deliver a shock."}
};
let selected = null;
let exploded = false;
let turning = false;
let cuffOn = true;
let bladeOn = true;
let vented = true;
let reservoirOn = true;
let flowOn = false;
let bubbling = false;
const flags = {cuff:true, blade:true, vented:true, reservoir:true, flow:false, bubble:false};

function pvc(){ return new THREE.MeshPhysicalMaterial({color:0xd5e4ec, roughness:0.12, metalness:0, transmission:0.55, thickness:0.25, transparent:true, opacity:0.92, emissive:new THREE.Color(0)}); }
function soft(hex){ return new THREE.MeshStandardMaterial({color:hex, roughness:0.62, metalness:0.02, emissive:new THREE.Color(0)}); }
function hard(hex){ return new THREE.MeshStandardMaterial({color:hex, roughness:0.38, metalness:0.08, emissive:new THREE.Color(0)}); }
function metal(hex){ return new THREE.MeshStandardMaterial({color:hex, roughness:0.28, metalness:0.82, emissive:new THREE.Color(0)}); }
function glass(hex, op){ return new THREE.MeshPhysicalMaterial({color:hex, roughness:0.08, transmission:0.65, thickness:0.2, transparent:true, opacity:op||0.55, emissive:new THREE.Color(0)}); }
function screenTex(lines){
  const c = document.createElement("canvas");
  c.width = 512; c.height = 320;
  const g = c.getContext("2d");
  g.fillStyle = "#071018";
  g.fillRect(0,0,512,320);
  g.strokeStyle = "#7fd4e6";
  g.lineWidth = 3;
  g.strokeRect(16,16,480,288);
  g.fillStyle = "#d7f6fb";
  g.font = "600 42px sans-serif";
  lines.forEach(function(line, i){ g.fillText(line, 36, 78+i*52); });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function V(x,y,z){ return new THREE.Vector3(x,y,z); }
function hose(pts, r, mat, n){
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n||48, r, 12, false), mat);
}
function pointAt(pts, t){
  return new THREE.CatmullRomCurve3(pts).getPointAt(Math.max(0, Math.min(1, t)));
}
function tangentAt(pts, t){
  const c = new THREE.CatmullRomCurve3(pts);
  return c.getTangentAt(Math.max(0.02, Math.min(0.98, t))).normalize();
}
function aim(mesh, dir, axis){
  mesh.quaternion.setFromUnitVectors(axis || new THREE.Vector3(0,1,0), dir.clone().normalize());
}
function P(mesh, id, title, text, ex){
  mesh.name = id;
  mesh.userData.id = id;
  mesh.userData.title = title;
  mesh.userData.text = text;
  mesh.userData.ex = ex || [0,0,0];
  mesh.userData.home = mesh.position.clone();
  mesh.userData.base = mesh.scale.clone();
  parts.push(mesh);
  root.add(mesh);
  return mesh;
}
function cyl(rTop, rBot, h, mat){ return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 28), mat); }
function box(w,h,d, mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
function sph(r, mat){ return new THREE.Mesh(new THREE.SphereGeometry(r, 28, 18), mat); }
function clearRoot(){
  while(root.children.length){
    const o = root.children.pop();
    o.traverse(function(n){
      if(n.geometry) n.geometry.dispose();
      if(n.material){
        const list = Array.isArray(n.material) ? n.material : [n.material];
        list.forEach(function(m){ if(m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }
  parts.length = 0;
  selected = null;
}

function ettCurve(){
  const pts = [];
  for(let i=0;i<=16;i++){
    const t = i/16;
    pts.push(V(-1.45+t*2.9, Math.sin(t*1.05)*0.62-0.15, 0));
  }
  return pts;
}
function buildEtt(){
  const pts = ettCurve();
  P(hose(pts, 0.06, pvc(), 70), "shaft", "Tube", "Transparent curved shaft of an adult cuffed tracheal tube. Size is the internal diameter. The radiopaque line and the depth marks travel with the shaft.", [0,0.15,0]);
  const line = pts.map(function(p){ return p.clone().add(new THREE.Vector3(0,0,0.045)); });
  P(hose(line, 0.012, hard(0x243038), 70), "radio", "Radiopaque line", "A dense line in the wall. On a chest film it shows the course of the tube so the tip can be seen above the carina.", [0,0.15,0.12]);
  for(let i=1;i<=5;i++){
    const t = 0.18+i*0.1;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.068, 0.008, 8, 18), hard(0x1c2830));
    ring.position.copy(pointAt(pts, t));
    aim(ring, tangentAt(pts, t), new THREE.Vector3(0,0,1));
    P(ring, "mark"+i, "Depth marking", "Centimetre marks along the tube. Read them at the teeth or the lip, then confirm position. A usual oral depth in adults is about 21 cm in women and 23 cm in men, and that is only a start.", [0,0.28,0]);
  }
  const tipP = pointAt(pts, 0.98);
  const bevel = cyl(0.02, 0.06, 0.18, pvc());
  bevel.position.copy(tipP);
  aim(bevel, tangentAt(pts, 0.98));
  P(bevel, "bevel", "Bevelled tip", "The distal opening is cut at an angle so it can pass the vocal cords and face down the trachea.", [0.25,0,0]);
  const eye = sph(0.035, hard(0x152026));
  eye.position.copy(pointAt(pts, 0.9)).add(new THREE.Vector3(0,0.07,0));
  P(eye, "murphy", "Murphy eye", "A side hole just above the tip. Ventilation can continue if the bevel rests against the tracheal wall.", [0,0.25,0.1]);
  const cuffT = 0.78;
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.045, 16, 28), soft(0xf0d2c4));
  cuff.position.copy(pointAt(pts, cuffT));
  aim(cuff, tangentAt(pts, cuffT), new THREE.Vector3(0,0,1));
  cuff.userData.role = "cuff";
  P(cuff, "cuff", "Cuff", "A high-volume, low-pressure balloon that seals the trachea for ventilation and reduces gross aspiration. It does not fix the tube. Sealing pressure is usually kept near 20 to 30 cm of water.", [0,-0.05,0.2]);
  const cuffPos = pointAt(pts, cuffT);
  const pilotPts = [cuffPos.clone().add(new THREE.Vector3(0,0.08,0.05)), cuffPos.clone().add(new THREE.Vector3(0.15,0.35,0.35)), V(0.55,0.85,0.55)];
  P(hose(pilotPts, 0.012, soft(0xf0d2c4), 24), "line", "Inflation line", "The fine tube from the cuff to the pilot balloon. Do not cut it.", [0.1,0.15,0.15]);
  const balloon = sph(0.09, soft(0xf3c9b4));
  balloon.position.set(0.55,0.98,0.55);
  balloon.userData.role = "cuff";
  P(balloon, "pilot", "Pilot balloon", "The small balloon outside the patient. If it is flat, the cuff is empty. It does not, by itself, tell you the pressure on the tracheal wall.", [0.15,0.2,0.2]);
  const valve = cyl(0.03, 0.03, 0.08, hard(0x2a6f86));
  valve.position.set(0.55,1.12,0.55);
  P(valve, "valve", "One-way valve", "Air goes in and stays until a syringe or a cuff manometer opens the valve. Measure cuff pressure. Do not keep inflating until the pilot feels hard.", [0.15,0.28,0.2]);
  const conn = cyl(0.09, 0.075, 0.22, hard(0xd7dee6));
  conn.position.copy(pointAt(pts, 0.02)).add(new THREE.Vector3(-0.12,0.02,0));
  aim(conn, tangentAt(pts, 0.04));
  P(conn, "conn", "15 mm connector", "The standard connector. It fits a catheter mount, a bag-valve mask, or the ventilator circuit. Do not jam a smaller tube inside it.", [-0.28,0.1,0]);
}
function buildLma(){
  const pts = [V(-0.2,1.1,0), V(-0.15,0.4,0), V(0, -0.15, 0.05)];
  P(hose(pts, 0.11, pvc(), 28), "airway", "Airway tube", "The tube from the connector down to the mask bowl. Ventilation passes through it, not through the gastric channel.", [-0.2,0.2,0]);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 20, 0, Math.PI*2, 0, Math.PI*0.62), soft(0xf0cbb8));
  bowl.position.set(0.15,-0.55,0);
  bowl.rotation.x = 0.5;
  bowl.userData.role = "cuff";
  P(bowl, "cuff", "Cuff", "The inflatable rim that sits over the laryngeal inlet. Inflated and deflated are both teaching states. A second-generation device still needs a seal, a bite block, and confirmation of ventilation.", [0.15,-0.15,0.25]);
  const hole = sph(0.12, hard(0x1a242c));
  hole.position.set(0.05,-0.42,0.12);
  P(hole, "aperture", "Mask aperture", "The opening that faces the glottis. Bars or a reinforced inlet keep the epiglottis from blocking it. If you cannot ventilate, remove it and use a different airway.", [0,0.2,0.2]);
  const gastric = hose([V(0.35,-0.7,0.05), V(0.55,-0.1,0.15), V(0.7,0.9,0.2)], 0.045, pvc(), 32);
  P(gastric, "gastric", "Gastric channel", "A separate tube that opens at the tip of the bowl, for a gastric tube. It is not a ventilation lumen and it does not make aspiration impossible.", [0.35,0,0.15]);
  const pilot = sph(0.08, soft(0xf3c9b4));
  pilot.position.set(-0.55,0.7,0.3);
  pilot.userData.role = "cuff";
  P(pilot, "pilot", "Pilot balloon", "Shows that the cuff has been inflated. Follow the volume printed on the device. More air is not a better seal.", [-0.15,0.15,0.2]);
  P(hose([V(-0.15,-0.2,0.15), V(-0.4,0.3,0.28), V(-0.55,0.6,0.3)], 0.014, soft(0xf0d2c4), 16), "iline", "Inflation line", "Carries air to the cuff. Keep it outside the teeth.", [-0.1,0.1,0.15]);
  const conn = cyl(0.12, 0.1, 0.2, hard(0xe6edf2));
  conn.position.set(-0.2,1.28,0);
  P(conn, "conn", "Connector", "15 mm connector for the breathing circuit. Cap the gastric port when a gastric tube is not in place, as the manufacturer shows.", [-0.15,0.25,0]);
}
function buildBvm(){
  const bag = sph(0.55, soft(0x2f6f4e));
  bag.scale.set(0.85,1,0.7);
  bag.position.set(-0.15,0,0);
  P(bag, "bag", "Self-inflating bag", "The bag refills from air, or from oxygen if a reservoir is attached. Squeezing it is the breath. A self-inflating bag works without a gas supply. Watch the chest, not the bag.", [0,0.15,0]);
  const valve = cyl(0.16, 0.16, 0.28, hard(0xf3efe6));
  valve.rotation.z = Math.PI/2;
  valve.position.set(0.85,0.05,0);
  P(valve, "valve", "Non-rebreathing valve", "Directs the squeeze to the patient and exhaled gas away from the bag. If it is assembled backwards, the bag will not ventilate.", [0.2,0.1,0]);
  const mask = new THREE.Mesh(new THREE.SphereGeometry(0.38, 28, 18, 0, Math.PI*2, 0, Math.PI*0.55), pvc());
  mask.position.set(1.45,0.05,0);
  mask.rotation.z = -Math.PI/2;
  P(mask, "mask", "Face mask", "Clear mask over the nose and mouth. A seal needs a jaw thrust and the right size. Two hands on the mask are often better than one.", [0.35,0,0]);
  const inlet = cyl(0.05, 0.05, 0.16, hard(0x2a6f86));
  inlet.position.set(-0.15,-0.15,0.45);
  inlet.rotation.x = Math.PI/2;
  P(inlet, "inlet", "Oxygen inlet", "A nipple for oxygen tubing. Oxygen alone does not fill a self-inflating bag unless the reservoir and the flow are connected.", [0,-0.1,0.25]);
  const res = sph(0.42, soft(0xd7e6c8));
  res.scale.set(0.7,1.1,0.7);
  res.position.set(-1.15,0.15,0);
  res.userData.role = "reservoir";
  P(res, "reservoir", "Oxygen reservoir", "A bag on the inlet side. With a reservoir and enough oxygen flow, the inspired oxygen is much higher than with the inlet alone.", [-0.35,0.1,0]);
  P(hose([V(-0.75,0.05,0), V(-0.95,0.1,0)], 0.06, pvc(), 8), "rtube", "Reservoir tubing", "Joins the reservoir to the bag inlet. Keep it unkinked.", [-0.15,0.15,0]);
  const relief = cyl(0.06, 0.04, 0.1, hard(0xc45b4a));
  relief.position.set(0.15,0.55,0);
  P(relief, "relief", "Pressure relief valve", "Opens if the squeeze pressure is high, on bags that have one. It can also leak the breath. Know whether this bag has one before you rely on it.", [0,0.25,0]);
  const arrow = cyl(0.0, 0.08, 0.16, hard(0xe2b48a));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 12), hard(0xe2b48a));
  cone.position.set(1.15,0.42,0);
  cone.rotation.z = -Math.PI/2;
  cone.userData.role = "flow";
  P(cone, "flow", "Airflow", "Teaching arrow only. The squeeze goes to the patient. Exhaled gas leaves at the valve and is not meant to return to the bag.", [0.2,0.35,0]);
  arrow.visible = false;
}
function buildDl(){

function fit(){
  const box = new THREE.Box3().setFromObject(root);
  if(box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.55, size*0.28, size*0.72));
  camera.near = Math.max(0.01, size/200);
  camera.far = size*20;
  camera.updateProjectionMatrix();
  controls.update();
}
function applyFlags(){
  parts.forEach(function(mesh){
    const role = mesh.userData.role;
    if(role==="cuff"){
      const s = flags.cuff ? 1.45 : 0.62;
      mesh.scale.set(s, s, s);
    }else if(role==="reservoir"){
      const s = flags.reservoir ? 1 : 0.4;
      mesh.scale.set(s, s, s);
    }else if(role==="flow"){
      mesh.visible = flags.flow;
    }else if(role==="vent"){
      mesh.visible = flags.vented;
    }else if(role==="bubble"){
      mesh.visible = flags.bubble;
    }else if(role==="blade"){
      mesh.visible = flags.blade || mesh.userData.keep;
    }else if(role==="hyper"){
      mesh.visible = !flags.blade;
    }
  });
}
function setEttStatus(text, bad){
  const el = document.getElementById("ett-status");
  if(!el) return;
  if(!text){ el.hidden = true; el.textContent = ""; el.className = ""; return; }
  el.hidden = false;
  el.className = bad ? "bad" : "";
  el.textContent = text;
}
function loadReal(id){
  const spec = REAL[id];
  const token = ++modelToken;
  realModel = false;
  setEttStatus("Loading the "+spec.label.toLowerCase()+"…", false);
  const loader = new GLTFLoader();
  const fileLoader = new THREE.FileLoader();
  fileLoader.setResponseType("arraybuffer");
  fileLoader.load(spec.url+"?v=20261030x", function(buf){
    loader.parse(buf, "", function(gltf){
    if(token !== modelToken || currentId !== id) return;
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDimension = Math.max(size.x, size.y, size.z);
    if(!Number.isFinite(maxDimension) || maxDimension <= 0){
      setEttStatus(spec.label+" opened, but it is not a usable 3D model. No substitute is shown.", true);
      paintLists();
      return;
    }
    const scale = 2.5 / maxDimension;
    model.scale.setScalar(scale);
    model.position.copy(centre).multiplyScalar(-scale);
    model.traverse(function(object){
      if(!object.isMesh) return;
      const title = partTitle(object.name, spec.label);
      object.userData.id = object.uuid;
      object.userData.title = title;
      object.userData.text = spec.text;
      object.userData.ex = [0,0,0];
      object.userData.span = 2.5;
      parts.push(object);
    });
    root.add(model);
    parts.forEach(function(mesh){ mesh.userData.home = mesh.position.clone(); });

function buildEttGuides(model){

  model.updateMatrixWorld(true);
  model.traverse(function(mesh){
    if(!mesh.isMesh || !mesh.geometry || !mesh.geometry.attributes.position) return;
    mesh.updateMatrix();
    const pos = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const tris = index ? index.count / 3 : pos.count / 3;
    for(let i=0;i<tris;i++){
      const ia = index ? index.getX(i*3) : i*3;
      const ib = index ? index.getX(i*3+1) : i*3+1;
      const ic = index ? index.getX(i*3+2) : i*3+2;
      sum.set(0,0,0);
      authoredVertex(mesh, ia, tmp); sum.add(tmp);
      authoredVertex(mesh, ib, tmp); sum.add(tmp);
      authoredVertex(mesh, ic, tmp); sum.add(tmp);
      sum.multiplyScalar(1/3);

      const bag = buckets[part];
      if(!bag) continue;
      tmp.fromBufferAttribute(pos, ia).applyMatrix4(mesh.matrixWorld);
      bag.push(tmp.x, tmp.y, tmp.z);
      tmp.fromBufferAttribute(pos, ib).applyMatrix4(mesh.matrixWorld);
      bag.push(tmp.x, tmp.y, tmp.z);
      tmp.fromBufferAttribute(pos, ic).applyMatrix4(mesh.matrixWorld);

  const sum = new THREE.Vector3();

function markTouch(hit){
  clearTouch();
  const mesh = hit.object;
  const geo = mesh.geometry;
  if(!geo || !geo.attributes.position) return;
  const pos = geo.attributes.position;
  const index = geo.index;
  mesh.updateWorldMatrix(true, false);
  const world = mesh.matrixWorld;
  const point = new THREE.Vector3();
  const span = mesh.userData.span || 2.5;
  const reach = span * 0.1;
  const reach2 = reach * reach;
  const center = hit.point;
  const keep = [];
  const tris = index ? index.count / 3 : pos.count / 3;
  for(let i=0;i<tris;i++){
    const a = index ? index.getX(i*3) : i*3;
    const b = index ? index.getX(i*3+1) : i*3+1;
    const c = index ? index.getX(i*3+2) : i*3+2;
    point.fromBufferAttribute(pos, a).applyMatrix4(world);
    const ax = point.x, ay = point.y, az = point.z;
    point.fromBufferAttribute(pos, b).applyMatrix4(world);
    const bx = point.x, by = point.y, bz = point.z;
    point.fromBufferAttribute(pos, c).applyMatrix4(world);
    const mx = (ax+bx+point.x)/3, my = (ay+by+point.y)/3, mz = (az+bz+point.z)/3;
    const dx = mx-center.x, dy = my-center.y, dz = mz-center.z;
    if(dx*dx+dy*dy+dz*dz > reach2) continue;
    keep.push(ax,ay,az, bx,by,bz, point.x,point.y,point.z);
  }
  if(!keep.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(keep, 3));
  touchMark = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: 0xe2b48a, transparent: true, opacity: 0.92, depthTest: true,
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2

  const voices = window.speechSynthesis ? speechSynthesis.getVoices() || [] : [];
  const en = voices.filter(function(v){ return /^en/i.test(v.lang || ""); });
  const male = /rishi|daniel|alex|aaron|fred|arthur|gordon|david|tom|lee|ravi|veer|male|daniel|junior/i;
  const female = /female|samantha|victoria|karen|moira|fiona|serena|zira|veena|allison|ava|susan|kate|nicky|martha|libby|amy|joanna|ivy|salli|kimberly|emma|alice|catherine|fiona|google uk english female/i;
  return en.find(function(v){ return female.test((v.name||"")+" "+(v.voiceURI||"")) && !male.test(v.name||""); })
    || en.find(function(v){ return !male.test((v.name||"")+" "+(v.voiceURI||"")) && /en-GB|en-IN|en-AU/i.test(v.lang||""); })
    || null;
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  const say = function(){
    const u = new SpeechSynthesisUtterance(text);
    const voice = femaleVoice();
    u.lang = voice && voice.lang ? voice.lang : "en-GB";
    u.rate = 0.88;
    u.pitch = 1.16;
    u.volume = 1;
    if(voice) u.voice = voice;
    const go = function(){ speechSynthesis.resume(); speechSynthesis.speak(u); };
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(go, 80);
    } else go();
  };
  if(!speechSynthesis.getVoices().length){
    const once = function(){ speechSynthesis.removeEventListener("voiceschanged", once); say(); };
    speechSynthesis.addEventListener("voiceschanged", once);
    speechSynthesis.getVoices();
    return;
  }
  say();
}
function exportGlb(){
  const exporter = new GLTFExporter();
  exporter.parse(root, function(bin){
    const blob = new Blob([bin], {type:"model/gltf-binary"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentId+"-teaching.glb";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }, function(err){ console.error(err); }, {binary:true});
}
function resize(){
  const r = canvas.getBoundingClientRect();
  if(!r.width || !r.height) return;
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  renderer.setSize(r.width, r.height, false);
}
const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  parts.forEach(function(mesh){
    const home = mesh.userData.home;
    if(!home) return;
    const ex = exploded ? mesh.userData.ex : [0,0,0];
    mesh.position.x += (home.x + ex[0] - mesh.position.x) * Math.min(1, dt*6);
    mesh.position.y += (home.y + ex[1] - mesh.position.y) * Math.min(1, dt*6);
    mesh.position.z += (home.z + ex[2] - mesh.position.z) * Math.min(1, dt*6);
    if(mesh.userData.role==="bubble" && flags.bubble){
      mesh.position.y = home.y + Math.sin(performance.now()/300 + mesh.userData.phase)*0.05;
    }
    if(mesh.userData.role==="flow" && flags.flow){
      mesh.position.x = home.x + Math.sin(performance.now()/250)*0.06;
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
canvas.addEventListener("pointerdown", function(e){ canvas._x = e.clientX; canvas._y = e.clientY; });
canvas.addEventListener("pointerup", function(e){
  if(Math.hypot(e.clientX-canvas._x, e.clientY-canvas._y) > 8) return;
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX-rect.left)/rect.width)*2-1;
  const y = -((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(new THREE.Vector2(x,y), camera);
  const hit = ray.intersectObjects(parts, false)[0];
  if(!hit) return;
  if(activeParts()){
    showPart(partFromHit(hit));
    return;
  }
  markTouch(hit);
  select(hit.object);
});
window.addEventListener("resize", resize);
resize();
showItem("ett");
requestAnimationFrame(frame);
</script>
