.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:6px 2px}.tabs .on{border-color:var(--c);color:var(--c)}

{sx:'f',dx:'Septic shock',hx:'61F. Urosepsis from an obstructing stone, day 1. Fluids given, cultures sent, antibiotics started.',hr:118,sbp:96,spo2:96,rr:24,t:39.1,ab:[7.28,30,14,5.2],lb:'WBC 24 · Hb 9.8 · Plt 82 · Cr 2.1',lk:['Procalcitonin',48,30,'ng/mL'],dr:14,vt:380,slow:{ab:.4},q:'MAP 52 after 30 mL/kg crystalloid. Lactate 5.2. Next step?',o:[['Start norepinephrine, target MAP 65 or more',1,'Correct. Norepinephrine is the first-line vasopressor.'],['Give another 2 L bolus without reassessing',0,'Unchecked fluid risks overload. Assess responsiveness first.'],['Start dopamine first-line',0,'More arrhythmias. Norepinephrine is preferred.']]},
