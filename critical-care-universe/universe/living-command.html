<!DOCTYPE html>

<title>Living ICU</title>
<style>

#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#050b18,transparent)}
#top b{margin-right:auto;font-size:15px;letter-spacing:.04em}
#hud{font-variant-numeric:tabular-nums;color:var(--c)}

#hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#7fa6c8;pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;display:none;max-height:64%;overflow:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(5,15,32,.94);border-top:1px solid var(--c)}

#pm{width:100%;max-width:360px;display:block;margin-bottom:8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{display:block;color:#9fc3e4}

#ev{margin-top:10px}

#end{position:fixed;inset:0;display:none;background:rgba(5,11,24,.96);padding:24px;overflow:auto}

#top,#toast{z-index:3}#panel{z-index:2}#end{z-index:5}

#pc{-webkit-mask-image:radial-gradient(ellipse 32% 20% at 50% 58%,#000 42%,transparent 78%);mask-image:radial-gradient(ellipse 32% 20% at 50% 58%,#000 42%,transparent 78%);transform-origin:50% 58%}
#pl{position:absolute;left:7.66%;top:13.9%;width:16.8%;height:21.1%}
#pr{position:absolute}

#drip{position:absolute;left:43.6%;top:18%;width:.55%;aspect-ratio:1;border-radius:50%;background:#bfe3ff;opacity:0;animation:dr 1.1s linear infinite}@keyframes dr{0%{transform:translateY(0);opacity:0}15%,80%{opacity:.9}100%{transform:translateY(700%);opacity:0}}

#door.open{opacity:0;pointer-events:none}
#door h1{margin:0;font-size:22px}#door p{margin:0;color:#7fa6c8}
.frame{position:relative;width:min(62vw,260px);height:min(50vh,380px);border:6px solid #2a5a8c;overflow:hidden;box-shadow:0 0 40px #39e6ff44;cursor:pointer}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#16365e,#0d2140);transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
.leaf.l{left:0;border-right:2px solid #02060f}.leaf.r{right:0}
.leaf::after{content:"";position:absolute;top:20%;left:22%;right:22%;height:22%;background:#0a1830;border:2px solid #2a5a8c}
#door.open .l{transform:translateX(-100%)}#door.open .r{transform:translateX(100%)}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:6px 2px}.tabs .on{border-color:var(--c);color:var(--c)}
.tb{display:none}.tb.on{display:block}
#lab table{width:100%;border-collapse:collapse}#lab td{padding:4px 6px;border-bottom:1px solid #16305a}#lab td:last-child{text-align:right;font-variant-numeric:tabular-nums}.hi{color:var(--r)}
