<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICU hall</title>
<style>
:root{--c:#39e6ff;--g:#3dff9a;--t:#d8ecff;color-scheme:dark}
html,body{height:100%;margin:0;background:#0a1420;color:var(--t);font:13px/1.4 system-ui,sans-serif;overflow:hidden;touch-action:none}
#gl{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#050b18e0,transparent);pointer-events:none}
#bar>*{pointer-events:auto}
button{font:inherit;color:var(--t);background:#0d2140;border:1px solid #2a5a8c;border-radius:8px;padding:9px 13px;cursor:pointer}
#title{font-weight:700;letter-spacing:.03em;margin-right:auto;pointer-events:none}
#team{position:fixed;top:calc(52px + env(safe-area-inset-top,0));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:#06111fd9;border:1px solid #2a5a8c;border-radius:999px;padding:4px 10px;font-size:12px}
.chip i{width:8px;height:8px;border-radius:50%;background:#667}
.chip.on i,.chip.me i{background:var(--g)}.chip.off{opacity:.55}
#card{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0));transform:translateX(-50%);max-width:min(92vw,420px);display:flex;flex-direction:column;gap:4px;background:#06111fee;border:1px solid var(--c);border-radius:12px;padding:10px 14px}
#card[hidden]{display:none}#card b{font-size:15px}#card span{color:#9fd8ff}#card button{margin-top:6px;align-self:flex-start}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0));text-align:center;color:#8fb3d6;pointer-events:none;text-shadow:0 1px 3px #000}
</style></head><body>
<canvas id="gl"></canvas>
<div id="bar"><button id="back" type="button">← Orders</button><span id="title">ICU hall · <span id="me"></span></span></div>
<div id="team" aria-label="Doctors in the hall"></div>
<div id="card" hidden></div>
<div id="hint">Swipe up to walk · keep your finger down to keep walking · drag sideways to look · tap a bed or a doctor</div>
<script type="module" src="team-hall.js?v=20261120l"></script>
</body></html>
