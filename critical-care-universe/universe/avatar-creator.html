<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050b18">
<title>Create your doctor</title>
<style>
:root{--c:#5fe3ff;--c2:#9ff0ff;--ink:#eaf8ff;--mut:#8fb6c9;--ok:#3dff9a;--glass:rgba(8,30,48,.62);--line:rgba(120,225,255,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 30%,#0e2a40,#050b18 70%);color:var(--ink);font:14px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
button{font:inherit;color:inherit;cursor:pointer}
.g{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 0 22px rgba(60,200,255,.14)}
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
#top h1{flex:1;margin:0;text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);text-shadow:0 0 12px rgba(95,227,255,.6)}
.pill{min-height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.go{background:linear-gradient(180deg,#1ec9a0,#10896f);border-color:#58f0c8;font-weight:700}
#tools{position:fixed;right:10px;top:calc(60px + env(safe-area-inset-top));z-index:5;display:flex;flex-direction:column;gap:8px}
#tools button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:11px;line-height:1.05;text-align:center;padding:0}
#tools button[data-on="1"]{border-color:var(--ok);box-shadow:0 0 14px rgba(61,255,154,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;border-radius:20px 20px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));max-height:46vh;display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;min-height:36px;padding:0 11px;font-size:13.5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid transparent;color:var(--mut);font-weight:600}
#tabs button.on{color:#06202c;background:var(--c);box-shadow:0 0 16px rgba(95,227,255,.5)}
#opts{overflow-y:auto;padding:2px 12px 4px;-webkit-overflow-scrolling:touch}
.row{margin:0 0 12px}.row>b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(120,225,255,.22);font-size:13px}
.chip.on{border-color:var(--c);background:rgba(95,227,255,.2);box-shadow:0 0 12px rgba(95,227,255,.35)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 0 14px rgba(95,227,255,.6)}
#toast{position:fixed;left:50%;bottom:calc(46% + 6px);transform:translate(-50%,-10px);z-index:9;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .3s;text-align:center;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#050b18;color:var(--c2);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
@media (min-width:760px){#sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:20px;max-height:calc(100vh - 100px)}#tools{right:auto;left:16px}}
</style>
</head>
<body>
<div id="load">Loading doctor…</div>
<div id="top"><button class="pill g" id="back" type="button">← Back</button><h1>Create your doctor</h1><button class="pill go" id="save" type="button">Save</button></div>
<div id="tools">
 <button class="g" id="shuf" type="button" title="Random look">Shuf&shy;fle</button>
 <button class="g" id="walk" type="button" title="Walk">Walk</button>
 <button class="g" id="zoom" type="button" title="Face or full body">Face</button>
 <button class="g" id="rst" type="button" title="Start again">Reset</button>
</div>
<div id="toast" class="g"></div>
<div id="sheet" class="g"><div id="tabs"></div><div id="opts"></div></div>
<script type="module">
import * as T from "./three.module.js";
import { loadDoctorBody, createDoctor, SPEC } from "./doctor-avatar.js?v=20261126m";
import { SKINS, HAIRC, EYEC, SCRUBS, SCRUB_NAMES, SKIN_NAMES, HAIR_NAMES, EYE_NAMES, OPT, defaultLook, sanitize, loadLook, saveLook, randomLook } from "./doctor-look.js?v=20261124g";
const $ = (q) => document.querySelector(q), hex = (n) => "#" + n.toString(16).padStart(6, "0");
const Q = new URLSearchParams(location.search);

/* ---------------- scene ---------------- */
const R = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" }); R.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); R.outputColorSpace = T.SRGBColorSpace; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; document.body.prepend(R.domElement);
const S = new T.Scene(), cam = new T.PerspectiveCamera(32, 1, 0.05, 40);
S.add(new T.HemisphereLight(0xcfeaff, 0x1b2a38, 1.25));
const key = new T.DirectionalLight(0xffffff, 2.2); key.position.set(2.2, 3.4, 3.2); S.add(key);
const rim = new T.DirectionalLight(0x5fe3ff, 1.6); rim.position.set(-3, 2.4, -2.6); S.add(rim);
const fill = new T.DirectionalLight(0xffd9b8, 0.5); fill.position.set(-2.4, 1.2, 2.4); S.add(fill);
const plat = new T.Group(); S.add(plat);
const disc = new T.Mesh(new T.CylinderGeometry(0.62, 0.66, 0.05, 56), new T.MeshStandardMaterial({ color: 0x0b1c2b, roughness: 0.35, metalness: 0.6 })); disc.position.y = -0.025; plat.add(disc);
[[0.6, 0.012, 0x5fe3ff], [0.5, 0.006, 0x2a7fa8], [0.7, 0.01, 0x5fe3ff]].forEach(([r, t, c]) => { const m = new T.Mesh(new T.TorusGeometry(r, t, 8, 72), new T.MeshBasicMaterial({ color: c })); m.rotation.x = Math.PI / 2; m.position.y = 0.002; plat.add(m); });
const spin = new T.Group(); plat.add(spin);
const fit = () => { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }; addEventListener("resize", fit); fit();

/* ---------------- state ---------------- */
let sex = Q.get("sex") === "f" ? "f" : "m", look = loadLook() || defaultLook(sex); sex = look.sex;
let doc = null, gltfs = {}, walking = false, faceView = false, tab = "body", spec = "intensivist", building = 0;
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); };

async function build() {
  const my = ++building;
  const gl = gltfs[sex] || (gltfs[sex] = await loadDoctorBody(sex)); if (my !== building) return;
  const d = createDoctor(T, gl, { name: "Dr You", spec, sex, look }); if (my !== building) return;
  if (doc) { spin.remove(doc.group); doc.group.traverse((o) => { if (o.geometry && !o.isSkinnedMesh) o.geometry.dispose(); }); }
  doc = d; doc.tag.visible = false; doc.setMoving(walking ? 1 : 0); spin.add(doc.group); $("#load").hidden = true;
}
const set = (k, v) => { look = sanitize({ ...look, [k]: v }, sex); dirty = true; build(); paint(); };
let dirty = false;

/* ---------------- panels ---------------- */
const TABS = [["body", "Body"], ["face", "Face"], ["hair", "Hair"], ["clothes", "Clothing"], ["acc", "Accessories"]];
const chips = (name, list, cur, k, fn) => `<div class="row"><b>${name}</b><div class="chips">${list.map(([v, l]) => `<button class="chip${cur === v ? " on" : ""}" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div></div>`;
const swatches = (name, cols, names, cur, k) => `<div class="row"><b>${name}</b><div class="sw">${cols.map((c, i) => `<button class="${cur === i ? "on" : ""}" style="background:${hex(c)}" data-k="${k}" data-v="${i}" aria-label="${names ? names[i] : ""}" title="${names ? names[i] : ""}"></button>`).join("")}</div></div>`;
const idx = (arr) => arr.map((l, i) => [i, l]);
function paint() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("");
  let h = "";
  if (tab === "body") h = chips("Presentation", [["m", "Male"], ["f", "Female"]], sex, "sex") + chips("Build", idx(OPT.build), look.build, "build") + chips("Height", idx(OPT.height), look.height, "height") + chips("Age", idx(OPT.age), look.age, "age");
  if (tab === "face") h = swatches("Skin tone", SKINS, SKIN_NAMES, look.skin, "skin") + chips("Face shape", idx(OPT.face), look.face, "face") + swatches("Eye colour", EYEC, EYE_NAMES, look.eyes, "eyes");
  if (tab === "hair") h = chips("Hairstyle", OPT.hair, look.hair, "hair") + swatches("Hair colour", HAIRC, HAIR_NAMES, look.hairc, "hairc") + chips("Facial hair", OPT.facial, look.facial, "facial");
  if (tab === "clothes") h = chips("Outfit", OPT.outfit, look.outfit, "outfit") + swatches("Scrub colour", SCRUBS, SCRUB_NAMES, look.scrub, "scrub") + chips("Specialty outfit", Object.entries(SPEC).map(([k, v]) => [k, v[0]]), spec, "spec");
  if (tab === "acc") h = `<div class="row"><b>Accessories</b><div class="chips">${OPT.acc.map(([v, l]) => `<button class="chip${look.acc.includes(v) ? " on" : ""}" data-k="acc" data-v="${v}">${l}</button>`).join("")}</div></div>`;
  const keep = $("#opts").scrollTop; $("#opts").innerHTML = h; $("#opts").scrollTop = keep;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; faceView = tab === "face" || tab === "hair"; $("#zoom").textContent = faceView ? "Body" : "Face"; paint(); return; }
  const k = t.dataset.k; if (!k) return; let v = t.dataset.v;
  if (k === "sex") { if (v === sex) return; sex = v; look = sanitize({ ...defaultLook(sex), skin: look.skin, build: look.build, height: look.height, age: look.age, outfit: look.outfit, acc: look.acc, scrub: look.scrub }, sex); dirty = true; build(); paint(); return; }
  if (k === "spec") { spec = v; if (look.scrub < 0) { build(); } paint(); return; }
  if (k === "acc") { const a = new Set(look.acc); a.has(v) ? a.delete(v) : a.add(v); set("acc", [...a]); return; }
  if (["skin", "face", "eyes", "age", "build", "height", "hairc", "scrub"].includes(k)) v = +v;
  if (k === "outfit" && v === "surgical" && !look.acc.includes("cap")) { /* surgical scrubs: the colour defaults to green, a cap is offered */ }
  set(k, v);
});
$("#shuf").onclick = () => { look = randomLook(sex); dirty = true; build(); paint(); };
$("#rst").onclick = () => { look = defaultLook(sex); dirty = true; build(); paint(); };
$("#walk").onclick = () => { walking = !walking; $("#walk").dataset.on = walking ? 1 : 0; if (doc) doc.setMoving(walking ? 1 : 0); };
$("#zoom").onclick = () => { faceView = !faceView; $("#zoom").textContent = faceView ? "Body" : "Face"; };
$("#save").onclick = () => { if (saveLook(look)) { dirty = false; toast("Saved. This is how other doctors will see you in the MDT hall."); } else toast("This browser would not let me save."); };
$("#back").onclick = () => { if (dirty) saveLook(look); if (history.length > 1) history.back(); else location.href = "nexus.html"; };

/* ---------------- view: drag to turn, pinch or wheel to zoom ---------------- */
let yaw = 0.35, vel = 0, dist = 4.6, tgtDist = 4.6, last = 0, touches = new Map(), pinch = 0, idle = 0;
R.domElement.addEventListener("pointerdown", (e) => { touches.set(e.pointerId, [e.clientX, e.clientY]); R.domElement.setPointerCapture(e.pointerId); idle = 0; if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
R.domElement.addEventListener("pointermove", (e) => { const p = touches.get(e.pointerId); if (!p) return; idle = 0;
  if (touches.size === 2) { touches.set(e.pointerId, [e.clientX, e.clientY]); const [a, b] = [...touches.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) tgtDist = Math.min(7, Math.max(1.2, tgtDist * pinch / d)); pinch = d; return; }
  const dx = e.clientX - p[0]; yaw += dx * 0.011; vel = dx * 0.011; touches.set(e.pointerId, [e.clientX, e.clientY]); });
const up = (e) => { touches.delete(e.pointerId); pinch = 0; }; R.domElement.addEventListener("pointerup", up); R.domElement.addEventListener("pointercancel", up);
R.domElement.addEventListener("wheel", (e) => { tgtDist = Math.min(7, Math.max(1.2, tgtDist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

const ty = { y: 0.95 }; const clock = new T.Clock();
R.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()); idle += dt;
  if (!touches.size) { yaw += vel; vel *= 0.92; if (idle > 3 && Math.abs(vel) < 0.002) yaw += dt * 0.35; }
  spin.rotation.y = yaw;
  const portrait = innerWidth < 760 ? 1 : 0, wantD = (faceView ? 1.0 : 4.3) * (faceView ? 1 : tgtDist / 4.6) * (faceView ? 1 : 1);
  dist += ((faceView ? 1.15 * (tgtDist / 4.6) : tgtDist) - dist) * Math.min(1, dt * 5); const wantY = faceView ? 1.58 : 0.9;
  ty.y += (wantY - ty.y) * Math.min(1, dt * 5);
  const shift = portrait ? 0 : 0;                                    // the sheet takes the bottom part in portrait, so look a little below the figure's middle
  const lift = portrait ? (faceView ? 0.0 : -0.17) * (dist / 4.6) + (faceView ? -0.02 : 0) : 0;
  cam.position.set(0, ty.y + 0.1 + lift * 0.0, dist); cam.lookAt(0, ty.y + (portrait ? (faceView ? -0.02 : -0.28 * (dist / 4.6)) : 0) , 0);
  if (doc) doc.update(dt);
  R.render(S, cam);
});
build().then(() => { paint(); }); paint();
window.__creator = { yaw: (v) => { yaw = v; vel = 0; idle = -1e9; }, T, get doc() { return doc; }, get look() { return look; }, set: (k, v) => set(k, v), build, cam, S };
</script>
</body>
</html>
