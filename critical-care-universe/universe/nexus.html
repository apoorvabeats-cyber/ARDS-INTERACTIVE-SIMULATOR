<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040a12">
<title>MDT Hall</title>
<style>
:root{--c:#5fe3ff;--c2:#9ff0ff;--ink:#eaf8ff;--mut:#8fb6c9;--ok:#3dff9a;--warn:#ffc24a;--bad:#ff5468;--glass:rgba(8,30,48,.46);--line:rgba(120,225,255,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#050b18;color:var(--ink);font:14px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
button{font:inherit;color:inherit;cursor:pointer}
.g{background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 0 22px rgba(60,200,255,.14),inset 0 0 18px rgba(120,225,255,.05)}
/* the opening screen: same colour as the fade out of the auditorium, so the entry is one continuous move */
#veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0c2236,#050b18 70%) center/cover no-repeat;pointer-events:auto}
#veil.off{display:none}
#veil.snap .ring,#veil.snap p{display:none}
#veil.snap small{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:block;text-shadow:0 1px 6px #000;color:#dff6ff;font-size:12px;letter-spacing:.06em}
#veil .ring{width:92px;height:92px;border-radius:50%;border:2px solid rgba(95,227,255,.18);border-top-color:var(--c);animation:sp 1.1s linear infinite;margin:0 auto 18px;box-shadow:0 0 28px rgba(95,227,255,.35)}
#veil p{margin:0;text-align:center;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--c2)}
#veil small{display:block;margin-top:8px;letter-spacing:.04em;text-transform:none;color:var(--mut)}
@keyframes sp{to{transform:rotate(360deg)}}
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#top>*{pointer-events:auto}
.b{min-height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b[data-on="1"]{border-color:var(--ok);box-shadow:0 0 14px rgba(61,255,154,.4)}
#title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;pointer-events:none;overflow:hidden;white-space:nowrap}
#title .br{font-weight:800;letter-spacing:.26em;text-transform:uppercase;font-size:11px;color:#dff6ff;text-shadow:0 0 14px rgba(95,227,255,.7)}
#title .hl{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--c2)}
#title .hl em{font-style:normal;color:var(--ok);margin-left:8px;text-shadow:0 0 10px rgba(61,255,154,.7);animation:lv 1.6s ease-in-out infinite}
#title small{font-size:10.5px;letter-spacing:.06em;color:var(--mut)}
@keyframes lv{50%{opacity:.45}}
@media(max-aspect-ratio:4/5){#title small{display:none}#top{flex-wrap:wrap}#title{order:5;flex-basis:100%;flex-direction:row;justify-content:center;gap:10px;margin-top:2px}#hint{display:none}#tilt svg{display:none !important}#title .br{display:none}}
#team{display:none !important;position:fixed;z-index:5;left:12px;top:calc(104px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;width:max-content;max-width:60vw}
.chip i{width:8px;height:8px;border-radius:50%;background:#667}
.chip.on i,.chip.me i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .chip.off{opacity:.55}
#hint{position:fixed;z-index:4;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#cdeeff;text-shadow:0 1px 6px #000;pointer-events:none;padding:0 90px;transition:opacity .6s}
#fab{position:fixed;z-index:6;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#fabl{position:fixed;z-index:6;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#card{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:min(94vw,440px);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#card[hidden],#desk[hidden],#say[hidden]{display:none}
#card b{font-size:15px;color:var(--c2)} #card span{color:#cfe7f3}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
#card button,#desk button,#say button{background:rgba(30,110,150,.35);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
#card button:active,#desk button:active,#say button:active{background:rgba(95,227,255,.35)}
#desk{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,470px);max-height:86vh;overflow:auto;padding:16px 16px 14px}
#desk h2{margin:0 0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--c2)}
#desk h1{margin:0 0 8px;font-size:22px;font-weight:650}
#desk p{margin:6px 0;color:#cfe7f3}
#desk .code{font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#fff;text-shadow:0 0 16px rgba(95,227,255,.7);margin:4px 0 10px}
#desk input{width:100%;margin:4px 0 8px;padding:10px 12px;border-radius:10px;background:rgba(0,12,24,.55);border:1px solid var(--line);color:#fff;font:inherit;font-size:16px}
#desk .go{width:100%;background:linear-gradient(180deg,rgba(60,200,255,.55),rgba(30,120,170,.55));font-weight:650;margin:6px 0}
#desk .seats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
#desk .seat{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:7px 10px}
#desk .seat[data-on="1"]{border-color:var(--ok);background:rgba(61,255,154,.2)}
#desk .seat[disabled]{opacity:.4}
#desk .seat small{color:var(--mut)}
#desk .step{display:inline-flex;gap:4px;align-items:center}
#desk .step button{min-height:28px;padding:0 9px;border-radius:8px}
#desk ul{list-style:none;margin:6px 0;padding:0;display:grid;gap:3px} #desk li{display:flex;justify-content:space-between;gap:10px;color:#cfe7f3}
#desk .err{color:#ff9aa6}
#note{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;font-size:13px;font-weight:650;color:#fff;background:rgba(8,30,48,.82);border:1px solid #ffc24a;box-shadow:0 0 16px rgba(255,194,74,.35);pointer-events:none;white-space:nowrap}
#xray[data-on="1"]{border-color:var(--c)}
.sci{position:fixed;z-index:8;right:12px;top:calc(54px + env(safe-area-inset-top));bottom:12px;width:min(47vw,540px);display:flex;flex-direction:column;overflow:hidden;background:rgba(6,24,40,.9);transform-origin:50% 100%}
.sci .gl{flex:none;align-self:center;font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);padding:0 4px 0 10px;border-left:1px solid var(--line);margin-left:4px;white-space:nowrap}
.sci canvas.mach{width:100%;max-width:520px;height:auto;border-radius:12px;border:1px solid var(--line);display:block;margin:8px 0 4px;background:#06141f}
#lcd{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
body .sci.lcd{transform-origin:50% 50%!important;position:absolute!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:var(--sw,760px)!important;height:var(--sh,480px)!important;border-radius:10px!important;border:1px solid rgba(95,227,255,.55)!important;box-shadow:0 0 0 7px #070b10,0 0 0 8px rgba(95,227,255,.4),0 0 40px rgba(60,200,255,.35)!important;animation:none!important;padding:0!important;max-width:none!important}
body .sci.lcd[hidden]{display:none!important}
.sci.in-off{animation:sciIn .46s cubic-bezier(.2,.9,.25,1) both}
@keyframes sciIn{from{transform:scale(.16)}to{transform:scale(1)}}
.sci header{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.sci .no{font:800 30px/1 system-ui,sans-serif;color:var(--c)}
.sci h2{margin:0;flex:1;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2)}
.sci header button{width:38px;height:38px;border-radius:50%;background:rgba(30,110,150,.35);border:1px solid var(--line)}
.sci .subs{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none;flex:none}.sci .subs::-webkit-scrollbar{display:none}
.sci .subs button{flex:none;border-radius:999px;padding:6px 12px;background:transparent;border:1px solid var(--line);color:var(--mut);font-size:12.5px;min-height:34px}
.sci .subs button[data-on="1"]{background:rgba(95,227,255,.24);color:#fff;border-color:var(--c)}
.sci .sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 16px}
.sci h3{margin:2px 0 8px;font-size:17px;font-weight:650}
.sci h4{margin:12px 0 6px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2)}
.sci .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:6px 0}
.sci .kv>div{background:rgba(95,227,255,.07);border:1px solid rgba(120,225,255,.22);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.sci .kv span{font-size:11.5px;color:var(--mut)}.sci .kv b{font:700 18px/1.25 ui-monospace,Menlo,Consolas,monospace;color:#e9fbff;word-break:break-word}.sci .kv small{font-size:11px;color:var(--mut)}
.sci .kv .ok b{color:var(--ok)}.sci .kv .w b{color:var(--warn)}.sci .kv .x b{color:var(--bad)}
.sci .nt{margin:8px 0;font-size:12.5px;color:var(--mut)}.sci .story{margin:8px 0;color:#d6ecf6}
.sci .ls{list-style:none;margin:6px 0;padding:0;display:grid;gap:5px}.sci .ls li{padding:6px 10px 6px 26px;border-radius:8px;background:rgba(95,227,255,.06);position:relative;color:#d6ecf6}
.sci .ls li::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#56707f}
.sci .ls li.ok::before{background:var(--ok)}.sci .ls li.w::before{background:var(--warn)}.sci .ls li.x::before{background:var(--bad)}
.sci .acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.sci .bt{background:rgba(30,110,150,.38);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sci .bt small{color:var(--mut);font-size:11px}.sci .bt:active{background:rgba(95,227,255,.35)}.sci .bt.sent{background:rgba(61,255,154,.3);border-color:var(--ok)}.sci .bt[disabled]{opacity:.38}
.sci .tb{width:100%;border-collapse:collapse;margin:4px 0;font-size:12.5px}.sci .tb td{padding:5px 6px;border-bottom:1px solid rgba(120,225,255,.14);color:#d6ecf6;vertical-align:top}.sci .tb td:nth-child(2){white-space:nowrap}.sci .tb tr.mis td{color:#7d95a3}
.sci canvas.ximg{width:100%;max-width:440px;height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0 4px;cursor:crosshair}
.sci canvas.ecg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:6px 0}
.sci .cap{margin:2px 0 6px;font-size:11.5px;color:var(--warn)}.sci .hot{padding:8px 10px;border-radius:10px;background:rgba(95,227,255,.08);color:#d6ecf6;font-size:13px;margin-bottom:8px}.sci .hot[data-hit="1"]{border:1px solid var(--warn)}
.sci .pump{display:grid;gap:6px;margin:6px 0}.sci .pump>div{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(12,42,34,.8);border:1px solid rgba(61,255,154,.45)}.sci .pump b{color:var(--ok);font-family:ui-monospace,Menlo,monospace}
.sci .sp{margin:8px 0}.sci .sp span{font-size:12px;color:var(--mut)}.sci .sp span i{font-style:normal;color:#fff;font-weight:700;margin-left:6px}.sci .sp svg{width:100%;max-width:340px;height:64px;display:block;background:rgba(95,227,255,.05);border-radius:8px}
@media(max-aspect-ratio:4/5){.sci{top:auto;bottom:0;right:0;width:min(70vw,440px);height:57vh;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}#note{top:calc(98px + env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){#sci.in{animation:none}}
@media(prefers-reduced-motion:reduce){#veil .ring{animation:none}}
/* the doctor's own screen: role header, the tabs, and everything below them */
.sci header{--a:#5fe3ff;padding:10px 12px 4px}
.sci header .rl{padding:4px 12px;border-radius:999px;background:rgba(95,227,255,.16);border:1px solid var(--a);color:#fff;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;white-space:nowrap}
.sci header b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sci header .lv{color:var(--ok);font-size:10.5px;letter-spacing:.16em;font-weight:700;white-space:nowrap}
.sci header .scix{width:auto;height:36px;border-radius:999px;padding:0 14px;font-size:12.5px;white-space:nowrap}
.sci .stabs{display:flex;gap:5px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;flex:none}.sci .stabs::-webkit-scrollbar{display:none}
.sci .stabs button{flex:none;border-radius:9px;padding:6px 12px;background:rgba(95,227,255,.07);border:1px solid var(--line);color:var(--mut);font-size:12.5px;min-height:36px;white-space:nowrap}
.sci .stabs button[data-on="1"]{background:rgba(95,227,255,.28);color:#fff;border-color:var(--c);box-shadow:0 0 12px rgba(95,227,255,.3)}
.sci .stabs button i{font-style:normal;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;margin-left:6px}
.sci .subs button.red,.sci .bt.red{border-color:var(--bad);color:#ffc9d0}
.sci .bt.fin{border-color:var(--ok);background:rgba(61,255,154,.18)}
.sci .bt.fin:active{background:rgba(61,255,154,.4)}
.sci .ls li b{color:#fff}
/* the team-actions bar */
#acts{position:fixed;z-index:6;left:200px;right:200px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:2px}
#acts::-webkit-scrollbar{display:none}
#acts .ah{flex:none;align-self:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-right:2px}
#acts button{flex:none;min-height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:600}
#acts button.fin{border-color:var(--ok);box-shadow:0 0 14px rgba(61,255,154,.35)}
#say{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,440px);padding:16px;display:flex;flex-direction:column;gap:8px}
#say h2{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--c2)}
#say p{margin:0;color:#cfe7f3}
#say textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:10px;background:rgba(0,12,24,.55);border:1px solid var(--line);color:#fff;font:inherit;font-size:16px;resize:vertical}
#say .chq{display:flex;flex-direction:column;gap:6px}
#say .chipq{text-align:left;border-radius:10px;font-size:13px;padding:7px 10px;color:#cfe7f3}
#say .row{display:flex;gap:8px;justify-content:flex-end}
body.using #acts,body.using #fab,body.using #fabl,body.using #hint,body.using #team,body.using #card{display:none !important}
@media(max-aspect-ratio:4/5){#acts{left:8px;right:8px;justify-content:flex-start}#fab,#fabl{bottom:calc(64px + env(safe-area-inset-bottom))}#card{bottom:calc(118px + env(safe-area-inset-bottom))}#hint{bottom:calc(116px + env(safe-area-inset-bottom));padding:0 12px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="MDT Hall, a shared 3D chamber"></canvas>
<div id="veil"><div><div class="ring"></div><p>MDT Hall<small id="vmsg">Preparing the patient…</small></p></div></div>
<script>try{var __s=sessionStorage.getItem("ccu-snap"),__t=+sessionStorage.getItem("ccu-snap-t")||0;if(Date.now()-__t>15000)__s=null;if(__s){var __v=document.getElementById("veil");__v.style.backgroundImage="url("+__s+")";__v.classList.add("snap");window.__snap=1}}catch(e){}</script>
<div id="top">
  <button class="b g" id="exit" type="button">← Universe</button>
  <div id="title"><span class="br">Critical Care Universe</span><span class="hl">MDT Hall <em id="livep" hidden>● Live</em></span><small>Collaborative Decisions. Better Outcomes.</small></div>
  <button class="b g" id="line" type="button" data-on="0">🎙 Line</button>
  <button class="b g" id="classic" type="button">Classic</button>
</div>
<div id="team"></div>
<div id="hint">Swipe up to walk · drag sideways to look · drag the patient sideways to revolve the disc · tap a curved display to read it · tap your own screen to work at it</div><div id="note" hidden></div>
<div id="fabl"><button class="b g" id="spin" type="button" data-on="0">⟳ Auto-rotate</button></div>
<div id="fab"><button class="b g" id="xray" type="button" data-on="0">See inside</button><button class="b g" id="bed" type="button">My seat</button><button class="b g" id="rx" type="button" hidden>My screen</button></div>
<div id="card" class="g" hidden></div>
<section id="sci" class="g sci" hidden></section>
<section id="desk" class="g" hidden></section>
<section id="say" class="g" hidden><h2 id="sayt">Team action</h2><p id="sayq"></p><textarea id="sayi" maxlength="240" placeholder="Write it for the team"></textarea><div class="chq" id="sayc"></div><div class="row"><button type="button" id="sayx">Cancel</button><button type="button" id="sayg" class="go">Send to the team</button></div></section>
<div id="acts" hidden><span class="ah">Team actions</span><button class="b g" type="button" data-k="ask">Request investigations</button><button class="b g" type="button" data-k="propose">Propose plan</button><button class="b g" type="button" data-k="challenge">Challenge plan</button><button class="b g" type="button" data-k="agree">Agree</button><button class="b g fin" type="button" data-k="final">Finalise MDT plan</button></div>
<script src="aud-beyond.js?v=20261122g"></script>
<script src="welcome-voice.js?v=20261122g"></script>
<script type="module" src="nexus.js?v=20261123f"></script>
</body>
</html>
