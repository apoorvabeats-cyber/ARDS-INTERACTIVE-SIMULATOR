<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050b18">
<title>Medical Nexus</title>
<style>
:root{--c:#5fe3ff;--c2:#9ff0ff;--ink:#eaf8ff;--mut:#8fb6c9;--ok:#3dff9a;--warn:#ffc24a;--bad:#ff5468;--glass:rgba(8,30,48,.46);--line:rgba(120,225,255,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#050b18;color:var(--ink);font:14px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
button{font:inherit;color:inherit;cursor:pointer}
.g{background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 0 22px rgba(60,200,255,.14),inset 0 0 18px rgba(120,225,255,.05)}
/* the opening screen: same colour as the fade out of the auditorium, so the entry is one continuous move */
#veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0c2236,#050b18 70%);transition:opacity .9s ease;pointer-events:auto}
#veil.off{opacity:0;pointer-events:none}
#veil .ring{width:92px;height:92px;border-radius:50%;border:2px solid rgba(95,227,255,.18);border-top-color:var(--c);animation:sp 1.1s linear infinite;margin:0 auto 18px;box-shadow:0 0 28px rgba(95,227,255,.35)}
#veil p{margin:0;text-align:center;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--c2)}
#veil small{display:block;margin-top:8px;letter-spacing:.04em;text-transform:none;color:var(--mut)}
@keyframes sp{to{transform:rotate(360deg)}}
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#top>*{pointer-events:auto}
.b{min-height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b[data-on="1"]{border-color:var(--ok);box-shadow:0 0 14px rgba(61,255,154,.4)}
#title{flex:1;min-width:0;text-align:center;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--c2);text-shadow:0 0 12px rgba(95,227,255,.6);pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vit{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));display:flex;gap:4px;padding:6px 10px;pointer-events:none;max-width:calc(100vw - 16px);overflow:hidden}
#vit span{display:flex;flex-direction:column;align-items:center;min-width:46px;font-size:10px;letter-spacing:.08em;color:var(--mut)}
#vit b{font:700 17px/1.1 ui-monospace,Menlo,Consolas,monospace;color:var(--ok)}
#vit .w b{color:var(--warn)} #vit .x b{color:var(--bad)}
#team{position:fixed;z-index:5;left:12px;top:calc(104px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;width:max-content;max-width:60vw}
.chip i{width:8px;height:8px;border-radius:50%;background:#667}
.chip.on i,.chip.me i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .chip.off{opacity:.55}
#hint{position:fixed;z-index:4;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#cdeeff;text-shadow:0 1px 6px #000;pointer-events:none;padding:0 90px;transition:opacity .6s}
#fab{position:fixed;z-index:6;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#fabl{position:fixed;z-index:6;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#card{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:min(94vw,440px);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#card[hidden],#dock[hidden],#desk[hidden]{display:none}
#card b{font-size:15px;color:var(--c2)} #card span{color:#cfe7f3}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
#card button,#dock button.bt,#desk button{background:rgba(30,110,150,.35);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
#card button:active,#dock button.bt:active,#desk button:active{background:rgba(95,227,255,.35)}
#dock{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:52vh;display:flex;flex-direction:column;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;border-bottom:0}
#dock h3{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);flex:1}
#dock header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none} #tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border-radius:999px;padding:6px 13px;background:transparent;border:1px solid var(--line);color:var(--mut);min-height:34px}
#tabs button[data-on="1"]{background:rgba(95,227,255,.22);color:#fff;border-color:var(--c)}
#tabs button.red{border-color:var(--bad);color:#ffc9d0}
#btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#btns .bt{text-align:left;display:flex;flex-direction:column;gap:2px} #btns .bt small{color:var(--mut);font-size:11px}
#btns .bt[disabled]{opacity:.35}
#btns .bt.sent{background:rgba(61,255,154,.3);border-color:var(--ok)}
#dock .note{margin:6px 0 0;color:var(--mut);font-size:12px}
#desk{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,470px);max-height:86vh;overflow:auto;padding:16px 16px 14px}
#desk h2{margin:0 0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--c2)}
#desk h1{margin:0 0 8px;font-size:22px;font-weight:650}
#desk p{margin:6px 0;color:#cfe7f3}
#desk .code{font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#fff;text-shadow:0 0 16px rgba(95,227,255,.7);margin:4px 0 10px}
#desk input{width:100%;margin:4px 0 8px;padding:10px 12px;border-radius:10px;background:rgba(0,12,24,.55);border:1px solid var(--line);color:#fff;font:inherit;font-size:16px}
#desk .go{width:100%;background:linear-gradient(180deg,rgba(60,200,255,.55),rgba(30,120,170,.55));font-weight:650;margin:6px 0}
#desk .seats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
#desk .seat{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:7px 10px}
#desk .seat[data-on="1"]{border-color:var(--ok);background:rgba(61,255,154,.2)}
#desk .seat[disabled]{opacity:.4}
#desk .seat small{color:var(--mut)}
#desk .step{display:inline-flex;gap:4px;align-items:center}
#desk .step button{min-height:28px;padding:0 9px;border-radius:8px}
#desk ul{list-style:none;margin:6px 0;padding:0;display:grid;gap:3px} #desk li{display:flex;justify-content:space-between;gap:10px;color:#cfe7f3}
#desk .err{color:#ff9aa6}
@media(max-width:420px){#hint{padding:0 12px;bottom:calc(66px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){#veil{transition:none}#veil .ring{animation:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Medical Nexus, a shared 3D hall"></canvas>
<div id="veil"><div><div class="ring"></div><p>Medical Nexus<small id="vmsg">Preparing the patient…</small></p></div></div>
<div id="top">
  <button class="b g" id="exit" type="button">← Universe</button>
  <div id="title"></div>
  <button class="b g" id="line" type="button" data-on="0">🎙 Line</button>
  <button class="b g" id="classic" type="button">Classic</button>
</div>
<div id="vit" class="g" hidden></div>
<div id="team"></div>
<div id="hint">Swipe up to walk · keep your finger down to keep walking · drag sideways to look · drag the patient to rotate · tap an organ</div>
<div id="fabl"><button class="b g" id="spin" type="button" data-on="0">⟳ Auto-rotate</button></div>
<div id="fab"><button class="b g" id="bed" type="button">Bedside</button><button class="b g" id="rx" type="button" hidden>Orders</button></div>
<div id="card" class="g" hidden></div>
<section id="dock" class="g" hidden><header><h3 id="dtitle">Orders</h3><button class="b g" id="dx" type="button">Close</button></header><div id="tabs"></div><div id="btns"></div><p class="note" id="dnote"></p></section>
<section id="desk" class="g" hidden></section>
<script type="module" src="nexus.js?v=20261120m"></script>
</body>
</html>
