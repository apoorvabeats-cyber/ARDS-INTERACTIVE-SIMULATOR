<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Beta access admin · Critical Care Universe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05070c;color:#f3efe6;font:15px/1.45 Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(1000px 560px at 85% -10%,rgba(24,138,255,.2),transparent 60%),#05070c;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.01em}
.sub{color:#9aa6b2;margin:0 0 14px;font-size:13.5px}
.card{background:linear-gradient(160deg,rgba(18,34,52,.8),rgba(7,14,22,.85));border:1px solid rgba(127,212,230,.28);border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8fc9d8;margin:0 0 5px}
input{width:100%;min-height:46px;padding:0 13px;border-radius:11px;border:1px solid rgba(190,220,250,.28);background:rgba(4,9,15,.7);color:#f3efe6;font:500 16px Figtree,sans-serif;outline:0}
input:focus{border-color:#2ceaff;box-shadow:0 0 0 3px rgba(44,234,255,.18)}
.f{margin:0 0 12px}
button{font:700 14px Figtree,sans-serif;cursor:pointer;border-radius:10px;min-height:42px;padding:0 14px;border:1px solid rgba(190,220,250,.35);background:rgba(255,255,255,.06);color:#f3efe6;touch-action:manipulation}
button:disabled{opacity:.5;cursor:progress}
.pri{background:linear-gradient(135deg,#1aa8ff,#1261d6 60%,#0b3f9c);border-color:rgba(150,230,255,.8);color:#fff;width:100%;min-height:48px}
.ok{background:rgba(60,220,150,.16);border-color:rgba(90,230,170,.65);color:#a8f0cd}
.no{background:rgba(255,92,92,.14);border-color:rgba(255,120,120,.6);color:#ffb4b4}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:13.5px}
.msg.err{background:rgba(255,92,92,.1);border:1px solid rgba(255,120,120,.5);color:#ffb4b4}
.msg.info{background:rgba(44,234,255,.08);border:1px solid rgba(44,234,255,.38);color:#bfeaf3}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:38px;padding:0 12px;font-size:13px}
.tabs button.on{background:rgba(44,234,255,.18);border-color:#2ceaff;color:#fff}
.bar .sp{flex:1}
.search{max-width:230px;min-height:38px;font-size:14px}
.cnt{font-size:12px;color:#8fc9d8;margin-left:4px}
.list{display:flex;flex-direction:column;gap:9px}
.u{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px;border-radius:12px;background:rgba(4,9,15,.55);border:1px solid rgba(190,220,250,.16)}
.em{font-weight:700;word-break:break-all}
.dt{font-size:12.5px;color:#8a94a0}
.st{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:1px}
.st.pending{background:rgba(255,207,92,.15);color:#ffcf5c;border:1px solid rgba(255,207,92,.5)}
.st.approved{background:rgba(60,220,150,.15);color:#7be0a8;border:1px solid rgba(90,230,170,.5)}
.st.rejected{background:rgba(255,92,92,.14);color:#ff9a9a;border:1px solid rgba(255,120,120,.5)}
.act{display:flex;gap:7px}
.act button{min-width:84px}
.empty{text-align:center;color:#8a94a0;padding:26px 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-size:12.5px;color:#8a94a0;word-break:break-all}
.lnk{background:none;border:0;color:#7fd4e6;text-decoration:underline;min-height:36px;padding:0 4px;font-weight:600}
@media(max-width:560px){.u{grid-template-columns:1fr}.act button{flex:1}}
#login{max-width:400px;margin:9vh auto 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden>
    <img src="../auth/logo.jpg" alt="Critical Care Universe" width="180" height="176" style="mix-blend-mode:lighten;display:block;margin:0 auto 6px;width:180px;height:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 2.5%,#000 97%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 2.5%,#000 97%,transparent);mask-composite:intersect">
    <h1 style="text-align:center">Beta access admin</h1>
    <p class="sub" style="text-align:center">Critical Care Universe. Administrators only.</p>
    <div class="card">
      <div class="msg err" id="lmsg" hidden role="alert"></div>
      <form id="lf" novalidate>
        <div class="f"><label for="le">Email</label><input id="le" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required></div>
        <div class="f"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
        <button class="pri" id="lb" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <div id="dash" hidden>
    <div class="top">
      <div><h1>Beta access</h1><p class="sub" style="margin:0">Approve or reject people who asked to join.</p></div>
      <div style="text-align:right"><div class="who" id="me"></div><button class="lnk" id="so" type="button">Sign out</button></div>
    </div>
    <div style="height:12px"></div>
    <div class="msg err" id="dmsg" hidden role="alert"></div>
    <div class="card">
      <div class="bar">
        <div class="tabs" id="tabs">
          <button type="button" data-f="pending" class="on">Pending</button>
          <button type="button" data-f="approved">Approved</button>
          <button type="button" data-f="rejected">Rejected</button>
          <button type="button" data-f="all">All</button>
        </div>
        <span class="sp"></span>
        <input class="search" id="q" type="search" placeholder="Search email" aria-label="Search email" autocapitalize="off">
        <button type="button" id="rf">Refresh</button>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </div>
  </div>

  <div id="fatal" class="card" hidden style="margin-top:10vh"></div>
</div>

<script src="../auth/config.js?v=20261127a"></script>
<script src="../auth/vendor/supabase.js?v=2.119.2"></script>
<script>
(function () {
  "use strict";
  /* Security: this page only holds the PUBLIC url + anon key. Every approve/reject goes to the Edge Function, which re-checks
     the caller's token and the ADMIN_EMAILS allow-list on the server. Hiding this page proves nothing; the server decides. */
  var C = window.CCU_AUTH_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
  var users = [], filter = "pending", sb;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fatal(t) { $("login").hidden = $("dash").hidden = true; var f = $("fatal"); f.hidden = false; f.innerHTML = "<h1>Not configured</h1><p class='sub'>" + esc(t) + "</p>"; }
  if (!C.supabaseUrl || /PASTE_YOUR/.test(C.supabaseUrl + C.supabaseAnonKey) || !window.supabase) { fatal("Fill in critical-care-universe/auth/config.js first."); return; }
  try { var p = JSON.parse(atob(C.supabaseAnonKey.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); if (p.role === "service_role") { fatal("config.js holds a service_role key. Remove it now and rotate that key in Supabase."); return; } } catch (e) {}
  sb = window.supabase.createClient(C.supabaseUrl.replace(/\/$/, ""), C.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "ccu-beta-auth" } });

  async function call(body) {
    var g = await sb.auth.getSession(), s = g.data && g.data.session;
    if (!s) throw { status: 401 };
    var r = await fetch(C.supabaseUrl.replace(/\/$/, "") + "/functions/v1/" + (C.adminFunction || "admin-beta"), {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + s.access_token, "apikey": C.supabaseAnonKey }, body: JSON.stringify(body)
    });
    var j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw { status: r.status, data: j };
    return j;
  }
  function showLogin(msg) { $("dash").hidden = true; $("login").hidden = false; var m = $("lmsg"); m.hidden = !msg; m.textContent = msg || ""; }
  function dmsg(t) { var m = $("dmsg"); m.hidden = !t; m.textContent = t || ""; }
  function fmt(d) { try { return new Date(d).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return d; } }

  function paint() {
    var q = $("q").value.trim().toLowerCase();
    var rows = users.filter(function (u) { return (filter === "all" || u.access_status === filter) && (!q || (u.email || "").toLowerCase().indexOf(q) >= 0); });
    var counts = { pending: 0, approved: 0, rejected: 0 }; users.forEach(function (u) { counts[u.access_status] = (counts[u.access_status] || 0) + 1; });
    Array.prototype.forEach.call($("tabs").children, function (b) { var f = b.getAttribute("data-f"); b.classList.toggle("on", f === filter); b.innerHTML = b.textContent.replace(/\s*\(\d+\)$/, "") + '<span class="cnt">(' + (f === "all" ? users.length : counts[f] || 0) + ")</span>"; });
    $("list").innerHTML = rows.length ? rows.map(function (u) {
      return '<div class="u" data-id="' + esc(u.user_id) + '"><div><span class="em">' + esc(u.email) + '</span><span class="st ' + esc(u.access_status) + '">' + esc(u.access_status) + '</span><div class="dt">Signed up ' + esc(fmt(u.created_at)) + '</div></div>' +
        '<div class="act">' + (u.access_status !== "approved" ? '<button class="ok" data-s="approved" type="button">Approve</button>' : "") + (u.access_status !== "rejected" ? '<button class="no" data-s="rejected" type="button">Reject</button>' : "") + '</div></div>';
    }).join("") : '<div class="empty">' + (users.length ? "No one matches this view." : "No sign-ups yet.") + "</div>";
  }
  async function load() {
    dmsg(""); $("rf").disabled = true;
    try { var j = await call({ action: "list" }); users = j.users || []; $("me").textContent = j.me || ""; $("login").hidden = true; $("dash").hidden = false; paint(); }
    catch (e) {
      if (e.status === 403) { $("login").hidden = true; $("dash").hidden = false; users = []; paint(); dmsg("This account is not an administrator. Ask the owner to add your email to ADMIN_EMAILS."); }
      else if (e.status === 401) { showLogin("Please sign in as an administrator."); }
      else { $("dash").hidden = false; $("login").hidden = true; dmsg("Could not load users. Check that the admin-beta function is deployed and ALLOWED_ORIGINS includes this site."); }
    }
    $("rf").disabled = false;
  }
  $("lf").addEventListener("submit", async function (e) {
    e.preventDefault(); var b = $("lb"); b.disabled = true; b.textContent = "Signing in...";
    var r = await sb.auth.signInWithPassword({ email: $("le").value.trim(), password: $("lp").value });
    b.disabled = false; b.textContent = "Sign in";
    if (r.error) return showLogin("That email and password do not match.");
    load();
  });
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-f]"); if (!b) return; filter = b.getAttribute("data-f"); paint(); });
  $("q").addEventListener("input", paint);
  $("rf").addEventListener("click", load);
  $("so").addEventListener("click", async function () { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} users = []; showLogin(""); });
  $("list").addEventListener("click", async function (e) {
    var b = e.target.closest("button[data-s]"); if (!b) return;
    var row = b.closest(".u"), id = row.getAttribute("data-id"), s = b.getAttribute("data-s");
    Array.prototype.forEach.call(row.querySelectorAll("button"), function (x) { x.disabled = true; }); b.textContent = "Saving...";
    try { var j = await call({ action: "set", user_id: id, status: s }); users = users.map(function (u) { return u.user_id === id ? j.user : u; }); dmsg(""); paint(); }
    catch (er) { dmsg(er.status === 403 ? "Not allowed: your account is not an administrator." : "Could not save that change. Try again."); paint(); }
  });
  sb.auth.getSession().then(function (g) { if (g.data && g.data.session) load(); else showLogin(""); });
})();
</script>
</body>
</html>
