<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Critical Care Universe</title>
    <meta
      name="description"
      content="Critical Care Universe. Live updates, a bay monitor, and a 360 degree human body."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="modulepreload" href="./universe/three.module.js" />
    <link rel="preload" as="image" href="./universe/command-centre.jpg" />
    <link rel="prefetch" href="./universe/living-command.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Fraunces:opsz,wght@9..144,520;9..144,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html,body{color:#e7e1d6;background:#071018;height:100%;margin:0}
      #boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#071018}
      #boot svg{width:min(78vw,340px);height:auto;overflow:visible}
      #boot .c-left{transform:translateX(-62vw);animation:c-in .42s cubic-bezier(.16,.84,.24,1) .08s forwards}
      #boot .c-right{transform:translateX(62vw);animation:c-in .42s cubic-bezier(.16,.84,.24,1) .54s forwards}
      #boot .u{transform:translateY(70vh);animation:u-in .4s cubic-bezier(.16,.84,.24,1) 1.02s forwards}
      #boot .ring{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:678.6;stroke-dashoffset:678.6;animation:ring-in .9s linear 1.48s forwards}
      #boot .tag{margin:6px 0 0;color:#f3efe6;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:15px;letter-spacing:.16em;text-transform:lowercase;opacity:0;animation:tag-in .45s ease 2.28s forwards}
      @keyframes c-in{to{transform:none}}
      @keyframes u-in{to{transform:none}}
      @keyframes ring-in{to{stroke-dashoffset:0}}
      @keyframes tag-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        #boot .c-left,#boot .c-right,#boot .u{animation:none;transform:none}
        #boot .ring{animation:none;stroke-dashoffset:0}
        #boot .tag{animation:none;opacity:1}
      }
    </style>
    <script type="module" crossorigin src="./assets/app.js?v=20261114g"></script>
  </head>
  <body>
    <div id="boot" role="img" aria-label="Critical Care Universe">
      <svg viewBox="0 0 240 248" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round">
          <path class="c-left" d="M115.7 86.8 A32 32 0 1 0 115.7 137.2"/>
          <path class="c-right" d="M124.3 86.8 A32 32 0 1 1 124.3 137.2"/>
        </g>
        <path class="u" d="M54 70 L54 140 A66 52 0 0 1 186 140 L186 70" fill="none" stroke="#7fd4e6" stroke-width="9" stroke-linecap="round"/>
        <path class="ring" d="M120 8 A108 108 0 1 0 119.4 8"/>
      </svg>
      <p class="tag">critical care universe</p>
    </div>
    <script>
      (function(){
        var boot = document.getElementById("boot");
        if(!boot) return;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var until = performance.now() + (reduce ? 600 : 3300);
        var gone = false;
        var nativeRemove = Element.prototype.remove;
        function finish(){
          if(gone) return;
          gone = true;
          nativeRemove.call(boot);
        }
        boot.remove = function(){
          var wait = until - performance.now();
          if(wait <= 0) finish();
          else window.setTimeout(finish, wait);
        };
      })();
    </script>
    <div id="app"></div>
  </body>
</html>
