<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Critical Care Universe</title>
    <meta
      name="description"
      content="Critical Care Universe. Live updates, a bay monitor, and a 360 degree human body."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="modulepreload" href="./universe/three.module.js" />
    <link rel="preload" as="image" href="./universe/command-centre.jpg" />
    <link rel="prefetch" href="./universe/living-command.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Fraunces:opsz,wght@9..144,520;9..144,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="./assets/startup.css?v=20261115-beats" />
    <link rel="modulepreload" href="./assets/app.js" />
    <script defer src="./assets/startup.js"></script>
  </head>
  <body>
    <div class="startup" id="startup" role="status" aria-label="Critical Care Universe is starting">
      <div class="startup-logo">
        <div class="startup-title" aria-hidden="true">
          <span class="startup-word startup-critical">Critical</span>
          <span class="startup-word startup-care">Care</span>
        </div>
        <svg viewBox="0 0 240 240" fill="none" aria-hidden="true">
          <path class="startup-circle" pathLength="1" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" />
          <g transform="translate(0 -10)">
            <path class="startup-c startup-c-left" d="M108 87 A32 32 0 1 0 108 153" />
            <path class="startup-c startup-c-right" d="M132 87 A32 32 0 1 1 132 153" />
            <path class="startup-u" d="M57 69 V129 C57 170 82 192 120 192 C158 192 183 170 183 129 V69" />
          </g>
        </svg>
        <div class="startup-title startup-bottom" aria-hidden="true">
          <span class="startup-word startup-universe">Universe</span>
        </div>
        <button class="startup-music" type="button" hidden>Tap to start music and intro</button>
        <button class="startup-skip" type="button" hidden>Continue to app without intro</button>
        <p class="startup-music-error" role="status" hidden></p>
      </div>
    </div>
    <noscript><p class="startup-noscript">JavaScript is required to start Critical Care Universe.</p></noscript>
    <audio data-score-el autoplay loop playsinline preload="auto" src="./universe/theme.mp3"></audio>
    <div id="app"></div>
  </body>
</html>
