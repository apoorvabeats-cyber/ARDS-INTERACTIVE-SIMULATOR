<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Critical Care Universe</title>
    <meta
      name="description"
      content="Critical Care Universe. Live updates, a bay monitor, and a 360 degree human body."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="modulepreload" href="./universe/three.module.js" />
    <link rel="preload" as="image" href="./universe/command-centre.jpg" />
    <link rel="prefetch" href="./universe/living-command.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Fraunces:opsz,wght@9..144,520;9..144,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="./assets/startup.css?v=20261115-brand-v3" />
    <link rel="modulepreload" href="./assets/app.js" />
    <script defer src="./assets/startup.js"></script>
  </head>
  <body>
    <div class="startup" id="startup" role="status" aria-label="Critical Care Universe is starting">
      <div class="startup-logo">
        <div class="startup-title" aria-hidden="true">
          <span class="startup-word startup-critical">Critical</span>
          <span class="startup-word startup-care">Care</span>
        </div>
        <div class="startup-flare startup-flare-top" aria-hidden="true"></div>
        <svg viewBox="0 0 240 240" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="su-titanium" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#708295" />
              <stop offset=".17" stop-color="#f4fbff" />
              <stop offset=".35" stop-color="#a9bac8" />
              <stop offset=".51" stop-color="#fff" />
              <stop offset=".68" stop-color="#8b9eaf" />
              <stop offset=".84" stop-color="#f8fcff" />
              <stop offset="1" stop-color="#7e8d9d" />
            </linearGradient>
            <linearGradient id="su-cobalt" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2ceaff" />
              <stop offset=".18" stop-color="#13baff" />
              <stop offset=".43" stop-color="#0872ff" />
              <stop offset=".68" stop-color="#19c7ff" />
              <stop offset=".86" stop-color="#087aff" />
              <stop offset="1" stop-color="#1261d6" />
            </linearGradient>
            <filter id="su-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4.3" /></filter>
            <filter id="su-halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" /></filter>
          </defs>
          <path class="startup-halo" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" stroke="#1d8dff" stroke-width="15" filter="url(#su-halo)" />
          <path class="startup-circle-blue" pathLength="1" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" />
          <path class="startup-circle" pathLength="1" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" />
          <path class="startup-circle-final" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" />
          <path class="startup-rim" d="M120 15 A105 105 0 1 0 120 225 A105 105 0 1 0 120 15" stroke="#63dcff" stroke-width="5.5" filter="url(#su-glow)" />
          <g transform="translate(0 -10)">
            <g class="startup-c startup-c-left">
              <path d="M108 87 A32 32 0 1 0 108 153" transform="translate(0 2)" stroke="#334655" stroke-width="14" />
              <path d="M108 87 A32 32 0 1 0 108 153" stroke="url(#su-titanium)" stroke-width="9" />
            </g>
            <g class="startup-c startup-c-right">
              <path d="M132 87 A32 32 0 1 1 132 153" transform="translate(0 2)" stroke="#334655" stroke-width="14" />
              <path d="M132 87 A32 32 0 1 1 132 153" stroke="url(#su-titanium)" stroke-width="9" />
            </g>
            <g class="startup-u">
              <path d="M57 69 V129 C57 170 82 192 120 192 C158 192 183 170 183 129 V69" stroke="#168aff" stroke-opacity=".3" stroke-width="22" filter="url(#su-glow)" />
              <path d="M57 69 V129 C57 170 82 192 120 192 C158 192 183 170 183 129 V69" stroke="url(#su-cobalt)" stroke-width="10" />
              <path d="M59 70 V129 C59 168 84 190 120 190 C156 190 181 168 181 129 V70" stroke="#9befff" stroke-opacity=".64" stroke-width="1.35" />
            </g>
          </g>
        </svg>
        <div class="startup-flare startup-flare-middle" aria-hidden="true"></div>
        <div class="startup-title startup-bottom" aria-hidden="true">
          <span class="startup-word startup-universe">Universe</span>
        </div>
        <div class="startup-flare startup-flare-bottom" aria-hidden="true"></div>
        <button class="startup-music" type="button" hidden>Tap to start music and intro</button>
        <button class="startup-skip" type="button" hidden>Continue to app without intro</button>
        <p class="startup-music-error" role="status" hidden></p>
      </div>
    </div>
    <noscript><p class="startup-noscript">JavaScript is required to start Critical Care Universe.</p></noscript>
    <audio data-score-el autoplay loop playsinline preload="auto" src="./universe/theme.mp3"></audio>
    <div id="app"></div>
  </body>
</html>
