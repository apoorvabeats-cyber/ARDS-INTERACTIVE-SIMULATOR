<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Critical Care Universe</title>
<meta name="theme-color" content="#05080a">
<link rel="icon" href="../favicon.svg">
<link rel="preload" href="./fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./home.css?v=20261126r2">
</head>
<body>
<div id="app">
  <header id="top">
    <nav aria-label="Account">
      <button type="button" id="bProfile" aria-haspopup="dialog">Profile</button>
      <button type="button" id="bSet" aria-haspopup="dialog">Settings</button>
    </nav>
  </header>

  <!-- the end of a corridor, dim, with the doctor small in the same light -->
  <section id="scene" aria-hidden="true">
    <i class="corr"></i>
    <canvas id="heroCv"></canvas>
    <i class="ring"></i>
  </section>

  <main id="main">
    <h1 id="welcome">Welcome back, Doctor</h1>
    <p class="lead">Critical Care Universe <i>·</i> Your clinical workspace</p>
    <button type="button" class="go" id="bEnter">Enter the ICU</button>
    <button type="button" class="alt" id="bGate">Walk the gate</button>

    <h2>Portals</h2>
    <div class="portals" id="portals" role="list"></div>

    <h2>Quick actions</h2>
    <div class="cards" id="quick"></div>

    <h2>Universe Live</h2>
    <ul class="live" id="liveList"></ul>
    <button type="button" class="more" id="liveAll">View all updates</button>

    <p class="foot">Educational use only. Not for direct patient care.</p>
  </main>
</div>

<div id="shade" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></section>
<div id="veil" aria-hidden="true"></div>
<audio id="music" src="./beat.mp3?v=2" loop preload="none"></audio>
<script type="module" src="./home.js?v=20261126r2"></script>
</body>
</html>
