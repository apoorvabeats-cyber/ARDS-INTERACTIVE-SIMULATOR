<style>
:root{
  --bg:#071018; --fg:#f3efe6; --muted:#b7b1a4; --faint:#8a8478;
  --line:rgba(243,239,230,.18); --cool:#7fd4e6; --warm:#e2b48a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 118px 0 16px}
.brand{margin:0;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:28px;letter-spacing:-.03em;line-height:.95}
.brand small{display:block;margin-top:4px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
header input{width:42%;max-width:220px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px}
header input::placeholder{color:var(--faint)}
.atlas{position:relative;min-height:calc(100dvh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 12px}
.atlas::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(127,212,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,212,230,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 42%,#000 10%,transparent 68%);
}
.dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.glow{position:fixed;left:50%;top:42%;width:280px;height:280px;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(127,212,230,.28),transparent 68%);opacity:0}
body.opening .glow{animation:glow 2s ease forwards}
@keyframes glow{0%{opacity:0}40%{opacity:1}100%{opacity:.35}}
.sound,.skip{position:fixed;z-index:6;background:rgba(7,16,24,.72);border:1px solid var(--line);color:var(--fg);border-radius:999px;min-height:44px;padding:0 14px}
.sound{top:12px;right:12px}
.skip{top:12px;left:12px;display:none}
body.opening .skip{display:block}
body.blocked .figure{opacity:0}
body.blocked header{visibility:hidden}
body.blocked .invite{opacity:1}
.touch{display:none;position:fixed;top:22px;left:0;right:0;z-index:6;text-align:center;color:var(--faint);font-size:13px;letter-spacing:.08em}
body.blocked .touch{display:block}
.invite{position:fixed;left:0;right:0;bottom:28px;z-index:5;text-align:center;padding:0 24px;opacity:0;pointer-events:none}
body.titled .invite,body.ready .invite{opacity:1;transition:opacity .8s ease}
body.settled .invite,body.in .invite{opacity:0}
.invite p{margin:0;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--cool)}
.invite h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:34px;letter-spacing:-.03em;margin:8px 0;line-height:1}
.invite .quiet{letter-spacing:0;text-transform:none;font-size:15px;color:var(--muted);margin-top:6px}
.well{perspective:1200px;width:min(100%,420px);position:relative;z-index:1}
.halo{position:absolute;left:15%;right:15%;bottom:2%;height:16px;border-radius:50%;border:1px solid rgba(127,212,230,.45);box-shadow:0 0 22px rgba(127,212,230,.28);opacity:0;pointer-events:none}
body.titled .halo,body.ready .halo{opacity:1;transition:opacity .6s ease}
.glimpses{display:none}
.trace{position:absolute;width:76px;height:34px;opacity:0;pointer-events:none;z-index:2}
body.ready .trace{opacity:.72;transition:opacity .6s ease}
.trace.ct{left:0;top:7%}
.trace.ecg{right:0;top:36%}
.trace.vent{left:0;top:50%}
.trace.line{right:0;top:64%}
.trace img,.trace svg{width:100%;height:100%;display:block;object-fit:cover;background:transparent}
.well::before{content:"";position:absolute;left:18%;right:18%;top:6%;bottom:12%;background:radial-gradient(circle,rgba(127,212,230,.14),transparent 68%);pointer-events:none;z-index:0}
.scan{display:none}
body.opening .figure{opacity:0}
body.opening .figure.materialise{animation:materialise 2.4s ease forwards}
@keyframes materialise{
  0%{opacity:0;transform:translateY(18px) scale(.97);filter:brightness(2.2) saturate(.25) drop-shadow(0 0 22px rgba(127,212,230,.85))}
  55%{opacity:1;filter:brightness(1.15) drop-shadow(0 0 16px rgba(127,212,230,.45))}
  100%{opacity:1;transform:none;filter:none}
}
.figure::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--hx,50%) var(--hy,40%),transparent 0 22%,rgba(7,16,24,.4) 60%);
}
.figure.focus::after{opacity:1;transition:opacity .25s ease}
.figure{position:relative;z-index:1;aspect-ratio:1008/1792;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .55s ease}
.figure.sway{animation:sway 11s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-7deg)}50%{transform:rotateY(7deg)}}
.figure.zoom{opacity:.2}
.figure img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none}
.hot{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border:0;border-radius:999px;background:transparent;padding:0}
.hot[data-id="brain"]{width:96px;height:78px}
.hot i{position:absolute;inset:16px;border:0;border-radius:inherit;background:transparent;box-shadow:none}
.hot.lit i{inset:0;background:radial-gradient(circle,rgba(127,212,230,.62),rgba(127,212,230,0) 72%);box-shadow:0 0 26px rgba(127,212,230,.35)}
.hot[data-id="brain"].lit i{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1);opacity:.72}}
.hot b{display:none}
.figure.filming{transition:transform 1.75s cubic-bezier(.22,.61,.2,1),opacity 1.1s ease .35s}
body.filming header,body.filming .trace,body.filming .halo,body.filming .invite,body.filming .hot b{opacity:0}
.room{display:none;min-height:100dvh;padding:14px 14px 22px}
body.in .atlas,body.in header{display:none}
body.in .room{display:flex;flex-direction:column}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px}
.room h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:42px;letter-spacing:-.035em;margin:6px 0 8px;line-height:.95}
.lede{margin:0;max-width:38rem;color:var(--muted);line-height:1.45}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.parts button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;color:var(--muted)}
.parts button.on{color:var(--fg);border-color:var(--fg)}
.portals{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;perspective:900px;min-height:0}
.portal{
  position:relative;border:0;border-radius:18px;min-height:280px;text-align:left;padding:16px;
  transform-style:preserve-3d;overflow:hidden;color:var(--fg);
}
.portal.lab{background:
  radial-gradient(80% 50% at 50% 100%,rgba(127,212,230,.16),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#12343f 0%,#0c1418 58%,#071018 100%);
  transform:none;box-shadow:inset 0 0 0 1px rgba(127,212,230,.4)}
.portal.arena{background:
  radial-gradient(80% 46% at 50% 100%,rgba(226,180,138,.18),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#3a2a1c 0%,#16110e 55%,#071018 100%);
  transform:none;box-shadow:inset 0 0 0 1px rgba(226,180,138,.45)}
.portal.lab::after,.portal.arena::after{content:"";position:absolute;left:12%;right:12%;bottom:16px;height:42px;border:1px solid rgba(127,212,230,.28);border-radius:50%;transform:rotateX(68deg);pointer-events:none}
.portal.arena::after{border-color:rgba(226,180,138,.35)}
.portal.arena::before{content:"";position:absolute;top:16px;right:14px;width:42%;height:22px;opacity:.75;background:linear-gradient(#e2b48a,#e2b48a) 0 10px/100% 1px no-repeat,repeating-linear-gradient(90deg,transparent 0 7px,rgba(226,180,138,.85) 7px 8px)}
body.inside.lab{background:#07161c}
body.inside.arena{background:#140e0b}
.portal span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.portal.lab span{color:var(--cool)}
.portal.arena span{color:var(--warm)}
.portal strong{display:block;margin-top:16px;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:520;letter-spacing:-.03em;line-height:1.05}
.portal em{display:block;margin-top:8px;font-style:normal;color:var(--muted);line-height:1.35;font-size:13px}
body.enter .portal.lab{animation:fromLeft .75s cubic-bezier(.22,.7,.2,1) both}
body.enter .portal.arena{animation:fromRight .75s cubic-bezier(.22,.7,.2,1) both}
@keyframes fromLeft{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.shelf{display:none;margin-top:8px}
body.inside .portals{display:none}
body.inside .shelf{display:block}
.card{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--line);min-height:44px}
.card b{display:block;font-size:17px;font-weight:600}
.card span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.empty{color:var(--muted);line-height:1.45}
.results{display:none;padding:8px 16px 24px}
.veil{position:fixed;z-index:8;overflow:hidden;border-radius:18px;padding:18px;color:var(--fg);transition:left 1.25s cubic-bezier(.22,.61,.2,1),top 1.25s cubic-bezier(.22,.61,.2,1),width 1.25s cubic-bezier(.22,.61,.2,1),height 1.25s cubic-bezier(.22,.61,.2,1),border-radius 1.25s ease,opacity .8s ease}
.veil.full{left:0;top:0;width:100%;height:100%;border-radius:0}
.veil.away{opacity:0}
.veil.lab{background:radial-gradient(120% 90% at 50% 0%,#12343f,#071018 72%)}
.veil.arena{background:radial-gradient(120% 90% at 50% 0%,#3a2a1c,#140e0b 72%)}
.veil.title{background:#071018;display:flex;align-items:flex-end}
.veil strong{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:34px;letter-spacing:-.03em}
.veil.title strong{font-size:42px}
body.inside .shelf .card{animation:titleIn 1.15s ease both}
@keyframes titleIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.credit{position:fixed;left:12px;right:12px;bottom:8px;z-index:4;margin:0;font-size:10px;line-height:1.3;color:var(--faint)}
.credit a{color:inherit}
.approach{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:transparent;pointer-events:none}
.approach img{width:100vw;height:100dvh;object-fit:cover;border-radius:0;box-shadow:none;transform:translate(var(--sx,0),var(--sy,-18vh)) scale(.2);opacity:0}
.approach.rise img{opacity:1;transform:translate(0,0) scale(1);transition:transform 1.7s cubic-bezier(.22,.61,.2,1),opacity .7s ease}
.approach.leave img{opacity:0;transform:translate(0,-3vh) scale(1.08);transition:transform .85s ease,opacity .85s ease}
.approach p{display:none}
body.searching header{display:flex}
body.searching .atlas,body.searching .room{display:none}
body.searching .results{display:block}
.group{margin-top:18px}
.group h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:26px;margin:0}
@media(max-width:380px){
  .portal strong{font-size:24px}
  .room h2{font-size:36px}
}
@media(prefers-reduced-motion:reduce){
  .figure.sway,.hot i,body.enter .portals,.dust,.scan,.glow{animation:none}
  .figure{transition:none}
  .portal.lab,.portal.arena{transform:none}
  body.opening .figure{opacity:1;animation:none}
}
</style>
</head>

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}
function organById(id){ return ORGANS.find(function(item){ return item.id===id; }); }
function rowsOf(list){
  return list.map(function(row){
    const tagged = row.length===4;
    return { part: tagged?row[0]:"", title: row[tagged?1:0], meta: row[tagged?2:1], href: row[tagged?3:2] };
  });
}
function cards(list){
  if(!list.length) return "";
  return list.map(function(row){
    return '<a class="card" href="'+esc(row.href)+'"><b>'+esc(row.title)+'</b><span>'+esc(row.meta)+'</span></a>';
  }).join("");
}
function learnRows(organ){
  const rows = rowsOf(organ.learn);
  if(!organ.parts || part==="all") return rows;
  return rows.filter(function(row){ return row.part.split(" ").indexOf(part)!==-1; });
}
function light(id, spot){
  figure.querySelectorAll(".hot").forEach(function(btn){
    btn.classList.toggle("lit", btn.getAttribute("data-id")===id);
  });
  if(!id){ figure.classList.remove("focus"); return; }
  const organ = organById(id);
  const use = spot || (organ && organ.spots[0]);
  if(!use) return;
  figure.style.setProperty("--hx", use.x+"%");
  figure.style.setProperty("--hy", use.y+"%");
  figure.classList.add("focus");
}
function paint(){
  const html = [];
  ORGANS.forEach(function(organ){
    organ.spots.forEach(function(spot){
      const label = spot.name || organ.name;
      html.push('<button type="button" class="hot" data-id="'+organ.id+'" data-x="'+spot.x+'" data-y="'+spot.y+'" style="left:'+spot.x+'%;top:'+spot.y+'%" aria-label="'+esc(label)+'"><i></i><b>'+esc(label)+'</b></button>');
    });
  });
  figure.insertAdjacentHTML("beforeend", html.join(""));
}
function renderRoom(){
  const organ = organById(current);
  if(!organ) return;
  const learn = learnRows(organ);
  const practice = rowsOf(organ.practice);
  const parts = organ.parts ? '<div class="parts"><button type="button" data-part="all"'+(part==="all"?' class="on"':"")+'>Whole organ</button>'+organ.parts.map(function(item){
    return '<button type="button" data-part="'+item.id+'"'+(part===item.id?' class="on"':"")+'>'+esc(item.name)+'</button>';
  }).join("")+"</div>" : "";
  const shelfTitle = inside==="lab" ? "Learning Hub" : "Practice Arena";
  const shelfRows = inside==="lab" ? learn : practice;
  const shelfEmpty = inside==="lab"
    ? (organ.soon || "Nothing in the learning lab yet.")
    : (organ.soon || "Nothing in the practice arena yet.");
  room.innerHTML =
    '<button type="button" class="back" id="back">'+(inside?"Back to the portals":"Back to the body")+'</button>'+
    '<p class="lede" style="letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--faint)">'+esc(organ.room)+'</p>'+
    '<h2>'+esc(organ.name)+'</h2>'+
    '<p class="lede">'+esc(organ.line)+'</p>'+
    parts+
    '<div class="portals">'+
      '<button type="button" class="portal lab" id="openLab"><span>Left</span><strong>Learning Hub</strong><em>Anatomy, imaging and the pathway.</em></button>'+
      '<button type="button" class="portal arena" id="openArena"><span>Right</span><strong>Practice Arena</strong><em>The live case. The monitor moves after you decide.</em></button>'+
    '</div>'+
    '<div class="shelf"><p class="lede" style="letter-spacing:.14em;text-transform:uppercase;font-size:12px">'+shelfTitle+'</p>'+
      (shelfRows.length?cards(shelfRows):'<p class="empty">'+esc(shelfEmpty)+'</p>')+
    '</div>';
  document.getElementById("back").onclick = function(){
    if(inside){ inside=null; document.body.classList.remove("inside","lab","arena"); renderRoom(); }
    else leave();
  };
  document.getElementById("openLab").onclick = function(){ fillPortal("lab", this); };
  document.getElementById("openArena").onclick = function(){ fillPortal("arena", this); };
  room.querySelectorAll("[data-part]").forEach(function(btn){
    btn.onclick = function(){ part=btn.getAttribute("data-part"); renderRoom(); };
  });
}
function openPath(which){
  inside = which;
  document.body.classList.add("inside");
  document.body.classList.toggle("lab", which==="lab");
  document.body.classList.toggle("arena", which==="arena");
  renderRoom();
}
let traveling = false;
function grow(el, kind, mid, end){
  if(traveling) return;
  if(reduced){ if(mid) mid(); if(end) end(); return; }
  traveling = true;
  const rect = el.getBoundingClientRect();
  const veil = document.createElement("div");
  veil.className = "veil "+kind;
  veil.innerHTML = el.innerHTML;
  veil.style.left = rect.left+"px";
  veil.style.top = rect.top+"px";
  veil.style.width = rect.width+"px";
  veil.style.height = rect.height+"px";
  document.body.appendChild(veil);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("full"); }); });
  setTimeout(function(){
    if(mid) mid();
    veil.classList.add("away");
    setTimeout(function(){
      veil.remove();
      traveling = false;
      if(end) end();
    }, 860);
  }, kind==="title" ? 1500 : 1150);
}
function fillPortal(which, el){
  speak(which==="lab" ? "Welcome to Learning Hub." : "Welcome to Practice Arena.");
  grow(el, which==="lab" ? "lab" : "arena", function(){ openPath(which); });
}
function openTitle(card){
  grow(card, "title", null, function(){
    hush();
    location.href = card.getAttribute("href");
  });
}
function placeBrain(spot){
  const layer = document.getElementById("approach");
  const rect = figure.getBoundingClientRect();
  const px = rect.left + rect.width * spot.x / 100;
  const py = rect.top + rect.height * spot.y / 100;
  layer.style.setProperty("--sx", (px - window.innerWidth/2) + "px");
  layer.style.setProperty("--sy", (py - window.innerHeight/2) + "px");
  return layer;
}
function showRooms(){
  document.getElementById("approach").classList.remove("rise","leave");
  document.body.classList.remove("filming");
  document.body.classList.add("in","enter");
  renderRoom();
}
function enter(id, spot){
  const organ = organById(id);
  if(!organ || current) return;
  spot = spot || organ.spots[0];
  current = id;
  part = "all";
  inside = null;
  document.body.classList.remove("inside","lab","arena");
  bootSound();
  speak(spot.name || organ.name);
  finishIntro();
  figure.classList.remove("sway");
  figure.classList.add("filming");
  document.body.classList.add("filming");
  figure.style.transformOrigin = spot.x+"% "+spot.y+"%";
  clearTimeout(timer);
  clearTimeout(arm);
  requestAnimationFrame(function(){
    figure.style.transform = "scale(4.2)";
    figure.style.opacity = "0";
  });
  if(id==="brain" && !reduced){
    const layer = placeBrain(spot);
    layer.classList.remove("leave");
    requestAnimationFrame(function(){ layer.classList.add("rise"); });
    arm = setTimeout(function(){ layer.classList.add("leave"); }, 1750);
    timer = setTimeout(showRooms, 2650);
    return;
  }
  if(reduced) showRooms();
  else timer = setTimeout(showRooms, 1900);
}
function leave(){
  clearTimeout(timer);
  clearTimeout(arm);
  inside = null;
  current = null;
  held = null;
  document.body.classList.remove("in","enter","inside","lab","arena","filming");
  document.getElementById("approach").classList.remove("show","rise","leave");
  figure.classList.remove("zoom","filming");
  figure.style.transform = "";
  figure.style.opacity = "";
  figure.classList.add("sway");
  light("");
  if(!reduced) requestAnimationFrame(drawDust);
}
function search(){
  const words = find.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  document.body.classList.toggle("searching", words.length>0);
  if(!words.length){ results.innerHTML=""; return; }
  results.innerHTML = ORGANS.map(function(organ){
    const rows = rowsOf(organ.learn).concat(rowsOf(organ.practice)).filter(function(row){
      const hay = (organ.name+" "+organ.room+" "+row.title+" "+row.meta).toLowerCase();
      return words.every(function(word){ return hay.indexOf(word)!==-1; });
    });
    if(!rows.length) return "";
    return '<div class="group"><h2>'+esc(organ.name)+'</h2>'+cards(rows)+'</div>';
  }).join("") || '<p class="empty">No simulator matches that.</p>';
}
figure.addEventListener("click", function(event){
  const btn = event.target.closest(".hot");
  if(!btn || current) return;
  const id = btn.getAttribute("data-id");
  const spot = {x:+btn.getAttribute("data-x"), y:+btn.getAttribute("data-y"), name: btn.querySelector("b").textContent};
  light(id, spot);
  enter(id, spot);
});
figure.addEventListener("pointerdown", function(event){
  if(event.target.closest(".hot")) return;
  drag = event.clientX;
  figure.classList.remove("sway");
});
figure.addEventListener("pointermove", function(event){
  if(drag==null) return;
  const turn = Math.max(-18, Math.min(18, (event.clientX-drag)/10));
  figure.style.transform = "rotateY("+turn+"deg)";
});
figure.addEventListener("pointerup", function(){
  if(drag==null || current) return;
  drag = null;
  figure.style.transform = "";
  figure.classList.add("sway");
});
find.addEventListener("input", search);
let audioCtx = null;
let ambient = [];
let soundOn = true;
let welcomed = false;
function ensureAudio(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx) audioCtx = new Ctx();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function startAmbient(){
  if(!soundOn || ambient.length) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const master = ctx.createGain();
  master.gain.value = 1;
  master.connect(ctx.destination);
  [98,146,196].forEach(function(freq, index){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lfo = ctx.createOscillator();
    const depth = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = index===0 ? 0.03 : 0.012;
    lfo.frequency.value = 0.05 + index*0.02;
    depth.gain.value = 0.008;
    lfo.connect(depth);
    depth.connect(gain.gain);
    osc.connect(gain);
    gain.connect(master);
    osc.start();
    lfo.start();
    ambient.push({osc:osc, gain:gain, lfo:lfo});
  });
  const len = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 420;
  const ng = ctx.createGain();
  ng.gain.value = 0.012;
  noise.connect(filter);
  filter.connect(ng);
  ng.connect(master);
  noise.start();
  ambient.push({osc:noise, gain:ng, lfo:{stop:function(){ noise.stop(); }}});
}
function stopAmbient(){
  if(!audioCtx || !ambient.length){ ambient = []; return; }
  const ctx = audioCtx;
  ambient.forEach(function(node){
    try{
      node.gain.gain.cancelScheduledValues(ctx.currentTime);
      node.gain.gain.setValueAtTime(Math.max(0.0001, node.gain.gain.value), ctx.currentTime);
      node.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.4);
      node.osc.stop(ctx.currentTime+0.45);
      node.lfo.stop(ctx.currentTime+0.45);
    }catch(err){}
  });
  ambient = [];
}
function speak(text){
  if(!soundOn) return;
  const file = {
    "Brain":"voice/brain.mp3",
    "Thyroid":"voice/thyroid.mp3",
    "Lungs":"voice/lungs.mp3",
    "Heart":"voice/heart.mp3",
    "Liver":"voice/liver.mp3",
    "Stomach":"voice/stomach.mp3",
    "Intestines":"voice/intestines.mp3",
    "Spleen":"voice/spleen.mp3",
    "Whole patient":"voice/whole.mp3",
    "Kidneys":"voice/kidneys.mp3",
    "Welcome to Learning Hub.":"voice/hub.mp3",
    "Welcome to Practice Arena.":"voice/arena.mp3"
  }[text];
  if(!file) return;
  playLine(file);
}
function startBed(){
  if(!soundOn || document.hidden) return;
  const bed = document.getElementById("bed");
  bed.muted = false;
  bed.volume = 0.13;
  const pending = bed.play();
  if(pending) pending.catch(function(){});
}
function hush(){
  const bed = document.getElementById("bed");
  const line = document.getElementById("line");
  bed.pause();
  line.pause();
  bed.muted = true;
  line.muted = true;
}
function playLine(src){
  if(!soundOn || document.hidden) return;
  const line = document.getElementById("line");
  line.muted = false;
  line.volume = 0.95;
  line.src = src;
  const pending = line.play();
  if(pending) pending.catch(function(){});
}
function playWelcome(){
  if(!soundOn || welcomed) return;
  welcomed = true;
  playLine("welcome.mp3");
}
function bootSound(){
  if(!soundOn) return;
  startBed();
}
function setSound(on){
  soundOn = on;
  const button = document.getElementById("sound");
  button.setAttribute("aria-pressed", on ? "true" : "false");
  button.textContent = on ? "Sound: On" : "Sound: Off";
  const bed = document.getElementById("bed");
  const line = document.getElementById("line");
  if(on) startBed();
  else { bed.pause(); line.pause(); }
}
document.getElementById("sound").onclick = function(){
  setSound(!soundOn);
};
let begun = false;
function beginShow(){
  if(begun) return;
  begun = true;
  document.body.classList.remove("blocked");
  document.body.classList.add("begun");
  playIntro();
}
document.addEventListener("pointerdown", function(event){
  startBed();
  if(!begun){
    beginShow();
    if(!(event.target.closest && event.target.closest(".hot"))) playWelcome();
    return;
  }
  if(welcomed) return;
  if(event.target.closest && event.target.closest(".hot")) return;
  playWelcome();
}, true);
let introTimers = [];
function finishIntro(){
  introTimers.forEach(clearTimeout);
  introTimers = [];
  document.body.classList.remove("opening","scanning","titled");
  document.body.classList.add("ready");
  figure.classList.add("materialise","sway");
  if(!current){ figure.style.opacity = "1"; light(""); }
}
function later(ms, fn){ introTimers.push(setTimeout(fn, ms)); }
function playIntro(){
  if(reduced){ startBed(); playWelcome(); finishIntro(); return; }
  document.body.classList.add("opening");
  later(180, function(){ figure.classList.add("materialise"); startBed(); });
  later(5000, function(){
    document.body.classList.add("titled");
    figure.classList.add("sway");
    if(!current) playWelcome();
  });
  later(7600, finishIntro);
  later(14000, function(){ document.body.classList.add("settled"); });
}
document.getElementById("skip").onclick = function(){ playWelcome(); finishIntro(); };
document.addEventListener("visibilitychange", function(){
  if(document.hidden) hush();
  else if(soundOn) startBed();
});
window.addEventListener("pagehide", hush);
document.addEventListener("freeze", hush);
room.addEventListener("click", function(event){
  const card = event.target.closest("a.card");
  if(!card) return;
  event.preventDefault();
  openTitle(card);
});
const dust = document.getElementById("dust");
const pen = dust.getContext("2d");
const specks = [];
for(let n=0;n<36;n++) specks.push({x:Math.random(), y:Math.random(), v:0.15+Math.random()*0.35, s:0.6+Math.random()*1.4});
function drawDust(){
  if(reduced || document.body.classList.contains("in")) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  if(dust.width!==w || dust.height!==h){ dust.width = w; dust.height = h; }
  pen.clearRect(0,0,dust.width,dust.height);
  pen.fillStyle = "rgba(127,212,230,.4)";
  specks.forEach(function(speck){
    speck.y -= 0.00045*speck.v;
    if(speck.y<0) speck.y = 1;
    pen.beginPath();
    pen.arc(speck.x*dust.width, speck.y*dust.height, speck.s, 0, 6.28);
    pen.fill();
  });
  requestAnimationFrame(drawDust);
}
document.querySelector(".atlas").addEventListener("pointermove", function(event){
  if(reduced || drag!=null || current) return;
  const box = event.currentTarget.getBoundingClientRect();
  const x = (event.clientX-box.left)/box.width-0.5;
  const y = (event.clientY-box.top)/box.height-0.5;
  document.querySelector(".well").style.transform = "rotateY("+(x*7)+"deg) rotateX("+(-y*4)+"deg)";
});
paint();
figure.addEventListener("pointerover", function(event){
  if(event.pointerType==="touch" || current) return;
  const btn = event.target.closest(".hot");
  if(!btn) return;
  fine = true;
  light(btn.getAttribute("data-id"), {x:+btn.getAttribute("data-x"), y:+btn.getAttribute("data-y")});
});
function startShow(){
  const bed = document.getElementById("bed");
  bed.volume = 0.13;
  const pending = bed.play();
  if(pending && pending.then){
    pending.then(function(){ beginShow(); }).catch(function(){ document.body.classList.add("blocked"); });
  } else beginShow();
}
startShow();
if(!reduced) requestAnimationFrame(drawDust);
</script>
</body>
