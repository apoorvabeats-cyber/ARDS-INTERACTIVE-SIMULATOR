<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Critical Care Human Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071018; --fg:#f3efe6; --muted:#b7b1a4; --faint:#8a8478;
  --line:rgba(243,239,230,.18); --cool:#7fd4e6; --warm:#e2b48a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 118px 0 16px}
.brand{margin:0;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:28px;letter-spacing:-.03em;line-height:.95}
.brand small{display:block;margin-top:4px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
header input{width:42%;max-width:220px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px}
header input::placeholder{color:var(--faint)}
.atlas{position:relative;min-height:calc(100dvh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 12px}
.atlas::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(127,212,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,212,230,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 42%,#000 10%,transparent 68%);
}
.dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.glow{position:fixed;left:50%;top:42%;width:280px;height:280px;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(127,212,230,.28),transparent 68%);opacity:0}
body.opening .glow{animation:glow 2s ease forwards}
@keyframes glow{0%{opacity:0}40%{opacity:1}100%{opacity:.35}}
.sound,.skip{position:fixed;z-index:6;background:rgba(7,16,24,.72);border:1px solid var(--line);color:var(--fg);border-radius:999px;min-height:44px;padding:0 14px}
.sound{top:12px;right:12px}
.skip{top:12px;left:12px;display:none}
body.opening .skip{display:block}
body.opening header{visibility:hidden}
.invite{position:fixed;left:0;right:0;bottom:28px;z-index:5;text-align:center;padding:0 24px;opacity:0;pointer-events:none}
body.titled .invite{opacity:1;transition:opacity .6s ease}
body.ready .invite{opacity:0}
.invite p{margin:0;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--cool)}
.invite h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:34px;letter-spacing:-.03em;margin:8px 0;line-height:1}
.invite .quiet{letter-spacing:0;text-transform:none;font-size:15px;color:var(--muted);margin-top:6px}
.well{perspective:1200px;width:min(100%,420px);position:relative;z-index:1}
.halo{position:absolute;left:15%;right:15%;bottom:2%;height:16px;border-radius:50%;border:1px solid rgba(127,212,230,.45);box-shadow:0 0 22px rgba(127,212,230,.28);opacity:0;pointer-events:none}
body.titled .halo,body.ready .halo{opacity:1;transition:opacity .6s ease}
.glimpses{display:none}
.trace{position:absolute;width:76px;height:34px;opacity:0;pointer-events:none;z-index:2}
body.ready .trace{opacity:.72;transition:opacity .6s ease}
.trace.ct{left:0;top:7%}
.trace.ecg{right:0;top:36%}
.trace.vent{left:0;top:50%}
.trace.line{right:0;top:64%}
.trace img,.trace svg{width:100%;height:100%;display:block;object-fit:cover;background:transparent}
.well::before{content:"";position:absolute;left:18%;right:18%;top:6%;bottom:12%;background:radial-gradient(circle,rgba(127,212,230,.14),transparent 68%);pointer-events:none;z-index:0}
.scan{position:absolute;left:8%;right:8%;height:14%;top:-20%;pointer-events:none;opacity:0;background:linear-gradient(transparent,rgba(127,212,230,.45),transparent);mix-blend-mode:screen}
body.scanning .scan{animation:scan 2.4s linear forwards}
@keyframes scan{0%{top:-16%;opacity:1}100%{top:100%;opacity:0}}
body.opening .figure{opacity:0}
body.opening .figure.materialise{animation:materialise 2.1s ease forwards}
@keyframes materialise{0%{opacity:0;clip-path:inset(0 0 100% 0);filter:brightness(2) saturate(.2)}45%{opacity:1}100%{opacity:1;clip-path:inset(0);filter:none}}
.figure::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--hx,50%) var(--hy,40%),transparent 0 22%,rgba(7,16,24,.4) 60%);
}
.figure.focus::after{opacity:1;transition:opacity .25s ease}
.figure{position:relative;z-index:1;aspect-ratio:1008/1792;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .55s ease}
.figure.sway{animation:sway 11s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-7deg)}50%{transform:rotateY(7deg)}}
.figure.zoom{opacity:.2}
.figure img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none}
.hot{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border:0;border-radius:999px;background:transparent;padding:0}
.hot[data-id="brain"]{width:96px;height:78px}
.hot i{position:absolute;inset:16px;border:0;border-radius:inherit;background:transparent;box-shadow:none}
.hot.lit i{inset:0;background:radial-gradient(circle,rgba(127,212,230,.62),rgba(127,212,230,0) 72%);box-shadow:0 0 26px rgba(127,212,230,.35)}
.hot[data-id="brain"].lit i{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1);opacity:.72}}
.hot b{position:absolute;left:54px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.02em;opacity:0;text-shadow:0 1px 8px #071018}
.hot.lit b{opacity:1}
.hot.lit b::after{content:" · open";font-weight:460;color:var(--cool)}
.room{display:none;min-height:100dvh;padding:14px 14px 22px}
body.in .atlas,body.in header{display:none}
body.in .room{display:flex;flex-direction:column}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px}
.room h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:42px;letter-spacing:-.035em;margin:6px 0 8px;line-height:.95}
.lede{margin:0;max-width:38rem;color:var(--muted);line-height:1.45}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.parts button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;color:var(--muted)}
.parts button.on{color:var(--fg);border-color:var(--fg)}
.portals{flex:1;display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;perspective:900px;min-height:0}
@media(min-width:760px){.portals{grid-template-columns:1fr 1fr}}
.portal{
  position:relative;border:0;border-radius:18px;min-height:280px;text-align:left;padding:16px;
  transform-style:preserve-3d;overflow:hidden;color:var(--fg);
}
.portal.lab{background:
  radial-gradient(80% 50% at 50% 100%,rgba(127,212,230,.16),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#12343f 0%,#0c1418 58%,#071018 100%);
  transform:rotateY(16deg) translateZ(12px);box-shadow:inset 0 0 0 1px rgba(127,212,230,.4)}
.portal.arena{background:
  radial-gradient(80% 46% at 50% 100%,rgba(226,180,138,.18),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#3a2a1c 0%,#16110e 55%,#071018 100%);
  transform:rotateY(-16deg) translateZ(12px);box-shadow:inset 0 0 0 1px rgba(226,180,138,.45)}
.portal.lab::after,.portal.arena::after{content:"";position:absolute;left:12%;right:12%;bottom:16px;height:42px;border:1px solid rgba(127,212,230,.28);border-radius:50%;transform:rotateX(68deg);pointer-events:none}
.portal.arena::after{border-color:rgba(226,180,138,.35)}
.portal.arena::before{content:"";position:absolute;top:16px;right:14px;width:42%;height:22px;opacity:.75;background:linear-gradient(#e2b48a,#e2b48a) 0 10px/100% 1px no-repeat,repeating-linear-gradient(90deg,transparent 0 7px,rgba(226,180,138,.85) 7px 8px)}
body.inside.lab{background:#07161c}
body.inside.arena{background:#140e0b}
.portal span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.portal.lab span{color:var(--cool)}
.portal.arena span{color:var(--warm)}
.portal strong{display:block;margin-top:28px;font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:520;letter-spacing:-.03em;line-height:1}
.portal em{display:block;margin-top:10px;font-style:normal;color:var(--muted);line-height:1.4}
body.enter .portals{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.shelf{display:none;margin-top:8px}
body.inside .portals{display:none}
body.inside .shelf{display:block}
.card{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--line);min-height:44px}
.card b{display:block;font-size:17px;font-weight:600}
.card span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.empty{color:var(--muted);line-height:1.45}
.results{display:none;padding:8px 16px 24px}
.approach{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#071018;padding:24px;opacity:0;pointer-events:none;transition:opacity .45s ease}
.approach.show{opacity:1;pointer-events:auto}
.approach img{width:min(88vw,440px);height:auto;border-radius:20px;box-shadow:0 0 70px rgba(127,212,230,.22);animation:approach .7s ease both}
.approach p{margin:0;color:var(--cool);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
@keyframes approach{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
body.searching header{display:flex}
body.searching .atlas,body.searching .room{display:none}
body.searching .results{display:block}
.group{margin-top:18px}
.group h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:26px;margin:0}
@media(max-width:380px){
  .portal strong{font-size:24px}
  .room h2{font-size:36px}
}
@media(prefers-reduced-motion:reduce){
  .figure.sway,.hot i,body.enter .portals,.dust,.scan,.glow{animation:none}
  .figure{transition:none}
  .portal.lab,.portal.arena{transform:none}
  body.opening .figure{opacity:1;animation:none}
}
</style>
</head>
<body>
<canvas class="dust" id="dust" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<button type="button" class="skip" id="skip">Skip</button>
<button type="button" class="sound" id="sound" aria-pressed="false">Sound: Off</button>
<div class="invite" id="invite">
  <p>Critical care • Human atlas</p>
  <h2>Explore the human body</h2>
  <p class="quiet">Every organ. Every decision. Every critical moment.</p>
  <p class="quiet">Select an organ to begin</p>
</div>
<div class="approach" id="approach">
  <img src="brain-close.jpg" alt="Close view of the cerebral cortex and its surface vessels">
  <p>Cortex and cerebral vessels</p>
</div>
<header>
  <h1 class="brand">Human Atlas<small>Critical care</small></h1>
  <input id="find" type="search" enterkeyhint="search" placeholder="Search" aria-label="Search simulators">
</header>
<main class="atlas">
  <div class="well">
    <div class="figure" id="figure">
      <img src="anatomy-body.jpg" alt="Translucent anatomical model. Select an organ to enter that critical-care room.">
      <div class="scan" aria-hidden="true"></div>
    </div>
    <div class="halo" aria-hidden="true"></div>
    <div class="trace ct" aria-hidden="true"><img src="sim/stroke-ncct.jpg" alt=""></div>
    <div class="trace ecg" aria-hidden="true"><svg viewBox="0 0 160 46" fill="none"><path d="M0 28 H28 L36 28 L42 8 L50 40 L58 18 L66 28 H160" stroke="#7fd4e6" stroke-width="1.6"/></svg></div>
    <div class="trace vent" aria-hidden="true"><svg viewBox="0 0 160 46" fill="none"><path d="M0 30 H20 L28 12 H70 L78 30 H100 L108 16 H140 L148 30 H160" stroke="#7fd4e6" stroke-width="1.6"/></svg></div>
    <div class="trace line" aria-hidden="true"><svg viewBox="0 0 160 46" fill="none"><path d="M0 32 H18 L26 8 L34 24 L42 32 H70 L78 8 L86 24 L94 32 H160" stroke="#e2b48a" stroke-width="1.6"/></svg></div>
  </div>
</main>
<section class="room" id="room"></section>
<section class="results" id="results"></section>
<script>
const ORGANS = [
  {
    id:"brain", name:"Brain", room:"Neurology",
    line:"The room for consciousness, vessels and seizure. The scan is part of the case, not a slide.",
    spots:[{x:50,y:11.2}],
    parts:[
      {id:"hemi", name:"Hemispheres"},
      {id:"circ", name:"Cerebral circulation"},
      {id:"stem", name:"Brainstem"}
    ],
    learn:[
      ["hemi circ","Acute ischemic stroke","Assessment, NIHSS, imaging, thrombolysis and EVT.","Acute_Ischemic_Stroke_Simulator_V6_FINAL.html?v=20260925s"],
      ["hemi","Intracerebral hemorrhage","Blood pressure, reversal and the ICP pathway.","Intracerebral_Hemorrhage_Interactive_Simulator_v1.html?v=20260925s"],
      ["circ","Subarachnoid hemorrhage","Grading, the aneurysm and the day-one bundle.","Subarachnoid_Hemorrhage_Interactive_Simulator_v1.html?v=20260925s"],
      ["hemi stem","Status epilepticus","Benzodiazepine, second-line drug, then refractory care.","Status_Epilepticus_Interactive_Simulator_v2_EDITABLE.html?v=20260925s"],
      ["stem","Traumatic brain injury","GCS, CT, reversal, ICP tiers and surgery.","TBI_Interactive_Simulator_v5_ICP_Anisocoria.html?v=20260925s"],
      ["stem","CNS infection","Meningitis, encephalitis, abscess and the ICU complications.","CNS_Infection_Interactive_Algorithm_v7.html?v=20260925s"]
    ],
    practice:[
      ["Neurology Practice Simulator","A patient, a study, and the next decision. Stroke and subarachnoid hemorrhage. The numbers change after you choose.","Practice_Simulator.html?focus=neuro&v=20261014e"]
    ],
    soon:""
  },
  {
    id:"thyroid", name:"Thyroid", room:"Endocrine",
    line:"Neck and endocrine crises. Glucose, potassium and the insulin that must not stop too early.",
    spots:[{x:50,y:28.9}],
    learn:[
      ["DKA","Fluids, potassium, insulin and dextrose across four bedside cases.","DKA_Interactive_Simulator.html?v=20260925s"],
      ["DKA and HHS","Holds insulin when potassium is under 3.3, and does not stop it when the glucose falls.","DKA_HHS_Resuscitation_Engine.html?v=20260925n"]
    ],
    practice:[],
    soon:"The Endocrine Emergency Simulator is the next bay. The learning lab is open."
  },
  {
    id:"lungs", name:"Lungs", room:"Respiratory",
    line:"Gas exchange, the ventilator and the film. Failure has a pattern before it has a machine.",
    spots:[{x:39,y:42},{x:63,y:42}],
    learn:[
      ["Hypoxic patient","Oxygen, HFNC, NIV and the reason for the failure.","Hypoxic_Patient_Respiratory_Critical_Care_Simulator_v22.html?v=20260925s"],
      ["ARDS ventilator","PEEP, prone position, driving pressure and rescue.","ARDS_Active_Simulator.html?v=20260925s"],
      ["COPD and asthma","Bronchodilator, the ventilator and the ICU pathway.","COPD_Asthma_V11_CASE_DRIVEN_CHECKED.html?v=20260925s"],
      ["COPD versus ARDS","An atlas of the two patterns.","COPD_vs_ARDS_Interactive_Atlas_NATIVE.html?v=20260925s"],
      ["ABG photo","Photograph a report. The six-step reading is done for you.","ABG_Photo_Interpreter_Simulator.html?v=20260925s"]
    ],
    practice:[
      ["Mechanical ventilation","Pressure, flow and volume. Name the pattern.","Ventilator_Waveform_Troubleshooting.html?v=20260925s"],
      ["Respiratory Practice Simulator","ARDS. Click the opacity, name the severity, then set the tidal volume.","Practice_Simulator.html?focus=lungs&v=20261014e"]
    ],
    soon:""
  },
  {
    id:"heart", name:"Heart", room:"Cardiac",
    line:"Rhythm, pressure and the failing pump. The trace moves before you commit.",
    spots:[{x:55,y:44.5}],
    learn:[
      ["ACLS, 2025 AHA","Arrest, tachycardia and bradycardia, with the current doses.","ACLS_Interactive_Simulator_2025_AHA_v2.html?v=20260925s"],
      ["Shock identification","MAP, cardiac index and the phenotype.","Shock_Identification_Management_Simulator.html?v=20260925s"],
      ["Shock and POCUS","RUSH exam, ScvO2 and lactate.","Shock_POCUS_RUSH_Simulator.html?v=20260925l"],
      ["Shock telemetry","Arterial line, IVC, PPV and the vasopressor.","Shock_Telemetry_POCUS_Simulator.html?v=20261001a"]
    ],
    practice:[
      ["Cardiac rhythm","A moving ECG, the arrest and the reversible causes.","Cardiac_Rhythm_Decision_Simulator_V29_FINAL_AUDITED.html?v=20260925t"],
      ["Shock Practice Simulator","Septic shock. The small ventricle, the full IVC, then norepinephrine.","Practice_Simulator.html?focus=circulation&v=20261014e"]
    ],
    soon:""
  },
  {
    id:"liver", name:"Liver", room:"Hepatic",
    line:"Acute liver failure and encephalopathy belong in this room. The cases are not on the floor yet.",
    spots:[{x:40,y:55}],
    learn:[],
    practice:[],
    soon:"The Liver Failure Simulator is not built yet."
  },
  {
    id:"stomach", name:"Stomach", room:"Gastrointestinal",
    line:"The upper abdomen. Pancreatitis is the case that is ready.",
    spots:[{x:54,y:59.5}],
    learn:[
      ["Acute pancreatitis","Diagnosis, fluids, cause, and the step-up approach.","Acute_Pancreatitis_Simulator.html?v=20260926s"]
    ],
    practice:[],
    soon:"The Acute GI Practice Simulator is the next bay."
  },
  {
    id:"bowel", name:"Intestines", room:"Gastrointestinal",
    line:"Bowel and bleeding. Pancreatitis is the working case; a bleeding bay is not built yet.",
    spots:[{x:50,y:70}],
    learn:[
      ["Acute pancreatitis","Diagnosis, fluids, cause, and the step-up approach.","Acute_Pancreatitis_Simulator.html?v=20260926s"]
    ],
    practice:[],
    soon:"The Acute GI Practice Simulator is the next bay."
  },
  {
    id:"multi", name:"Whole patient", room:"Multiorgan",
    line:"Sepsis, shock and more than one failing organ. Infection sits with the spleen; the integrated cases sit in the arena.",
    spots:[{x:66,y:54,name:"Spleen"},{x:50,y:78,name:"Whole patient"}],
    learn:[
      ["Shock bay","Phenotypes of shock, and a ventilator you control.","Shock_Bay.html?v=20260925s"],
      ["Antibiotics","The culture, the resistance, and the toxicity that changes the choice.","Antibiotic_Simulator.html?v=20260928e"],
      ["IDSA selection","KPC, OXA-48, NDM, and the dose that follows the clearance.","IDSA_Antibiotic_Selection_Simulator.html?v=20260928g"],
      ["Antifungal resistance","C. auris, Mucorales, and the site the drug does not reach.","Antifungal_Resistance_Simulator.html?v=20260925s"]
    ],
    practice:[
      ["Integrated ICU cases","Stroke, subarachnoid hemorrhage, ARDS and septic shock, one after another.","Practice_Simulator.html?v=20261014e"]
    ],
    soon:""
  },
  {
    id:"kidneys", name:"Kidneys", room:"Nephrology",
    line:"Sodium, potassium, calcium, magnesium and phosphate. Calcium is calculated from the serum value and the albumin.",
    spots:[{x:40,y:64},{x:60,y:64}],
    learn:[
      ["Electrolytes","The number chooses the algorithm. Calcium starts from serum calcium and albumin.","Electrolyte_Disorders_Interactive_Simulator.html?v=20261014d"]
    ],
    practice:[],
    soon:"The Nephrology Practice Simulator is not built yet. The learning lab is open."
  }
];

const figure = document.getElementById("figure");
const room = document.getElementById("room");
const results = document.getElementById("results");
const find = document.getElementById("find");
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = null;
let part = "all";
let inside = null;
let held = null;
let fine = false;
let arm = 0;
let timer = 0;
let drag = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}
function organById(id){ return ORGANS.find(function(item){ return item.id===id; }); }
function rowsOf(list){
  return list.map(function(row){
    const tagged = row.length===4;
    return { part: tagged?row[0]:"", title: row[tagged?1:0], meta: row[tagged?2:1], href: row[tagged?3:2] };
  });
}
function cards(list){
  if(!list.length) return "";
  return list.map(function(row){
    return '<a class="card" href="'+esc(row.href)+'"><b>'+esc(row.title)+'</b><span>'+esc(row.meta)+'</span></a>';
  }).join("");
}
function learnRows(organ){
  const rows = rowsOf(organ.learn);
  if(!organ.parts || part==="all") return rows;
  return rows.filter(function(row){ return row.part.split(" ").indexOf(part)!==-1; });
}
function light(id, spot){
  figure.querySelectorAll(".hot").forEach(function(btn){
    btn.classList.toggle("lit", btn.getAttribute("data-id")===id);
  });
  if(!id){ figure.classList.remove("focus"); return; }
  const organ = organById(id);
  const use = spot || (organ && organ.spots[0]);
  if(!use) return;
  figure.style.setProperty("--hx", use.x+"%");
  figure.style.setProperty("--hy", use.y+"%");
  figure.classList.add("focus");
}
function paint(){
  const html = [];
  ORGANS.forEach(function(organ){
    organ.spots.forEach(function(spot){
      const label = spot.name || organ.name;
      html.push('<button type="button" class="hot" data-id="'+organ.id+'" data-x="'+spot.x+'" data-y="'+spot.y+'" style="left:'+spot.x+'%;top:'+spot.y+'%" aria-label="'+esc(label)+'"><i></i><b>'+esc(label)+'</b></button>');
    });
  });
  figure.insertAdjacentHTML("beforeend", html.join(""));
}
function renderRoom(){
  const organ = organById(current);
  if(!organ) return;
  const learn = learnRows(organ);
  const practice = rowsOf(organ.practice);
  const parts = organ.parts ? '<div class="parts"><button type="button" data-part="all"'+(part==="all"?' class="on"':"")+'>Whole organ</button>'+organ.parts.map(function(item){
    return '<button type="button" data-part="'+item.id+'"'+(part===item.id?' class="on"':"")+'>'+esc(item.name)+'</button>';
  }).join("")+"</div>" : "";
  const shelfTitle = inside==="lab" ? "Learning Lab" : "Practice Arena";
  const shelfRows = inside==="lab" ? learn : practice;
  const shelfEmpty = inside==="lab"
    ? (organ.soon || "Nothing in the learning lab yet.")
    : (organ.soon || "Nothing in the practice arena yet.");
  room.innerHTML =
    '<button type="button" class="back" id="back">'+(inside?"Back to the portals":"Back to the body")+'</button>'+
    '<p class="lede" style="letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--faint)">'+esc(organ.room)+'</p>'+
    '<h2>'+esc(organ.name)+'</h2>'+
    '<p class="lede">'+esc(organ.line)+'</p>'+
    parts+
    '<div class="portals">'+
      '<button type="button" class="portal lab" id="openLab"><span>Studio</span><strong>Learning Lab</strong><em>Anatomy, imaging and the pathway. Nothing here is scored.</em></button>'+
      '<button type="button" class="portal arena" id="openArena"><span>Bay</span><strong>Practice Arena</strong><em>A live case. The monitor moves after the decision.</em></button>'+
    '</div>'+
    '<div class="shelf"><p class="lede" style="letter-spacing:.14em;text-transform:uppercase;font-size:12px">'+shelfTitle+'</p>'+
      (shelfRows.length?cards(shelfRows):'<p class="empty">'+esc(shelfEmpty)+'</p>')+
    '</div>';
  document.getElementById("back").onclick = function(){
    if(inside){ inside=null; document.body.classList.remove("inside","lab","arena"); renderRoom(); }
    else leave();
  };
  document.getElementById("openLab").onclick = function(){ openPath("lab"); };
  document.getElementById("openArena").onclick = function(){ openPath("arena"); };
  room.querySelectorAll("[data-part]").forEach(function(btn){
    btn.onclick = function(){ part=btn.getAttribute("data-part"); renderRoom(); };
  });
}
function openPath(which){
  inside = which;
  document.body.classList.add("inside");
  document.body.classList.toggle("lab", which==="lab");
  document.body.classList.toggle("arena", which==="arena");
  tone(which==="arena" ? 330 : 660);
  renderRoom();
}
function enter(id){
  const organ = organById(id);
  if(!organ) return;
  current = id;
  part = "all";
  inside = null;
  document.body.classList.remove("inside");
  const spot = organ.spots[0];
  light(id);
  chime(id);
  finishIntro();
  figure.classList.remove("sway");
  figure.style.transformOrigin = spot.x+"% "+spot.y+"%";
  figure.style.transform = "scale(2.15)";
  figure.classList.add("zoom");
  clearTimeout(timer);
  clearTimeout(arm);
  const go = function(){
    document.getElementById("approach").classList.remove("show");
    document.body.classList.add("in","enter");
    renderRoom();
  };
  if(id==="brain" && !reduced){
    arm = setTimeout(function(){ document.getElementById("approach").classList.add("show"); }, 460);
    timer = setTimeout(go, 1480);
    return;
  }
  if(reduced) go();
  else timer = setTimeout(go, 620);
}
function leave(){
  clearTimeout(timer);
  clearTimeout(arm);
  inside = null;
  current = null;
  held = null;
  document.body.classList.remove("in","enter","inside","lab","arena");
  document.getElementById("approach").classList.remove("show");
  figure.classList.remove("zoom");
  figure.style.transform = "";
  figure.classList.add("sway");
  light("");
  if(!reduced) requestAnimationFrame(drawDust);
}
function search(){
  const words = find.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  document.body.classList.toggle("searching", words.length>0);
  if(!words.length){ results.innerHTML=""; return; }
  results.innerHTML = ORGANS.map(function(organ){
    const rows = rowsOf(organ.learn).concat(rowsOf(organ.practice)).filter(function(row){
      const hay = (organ.name+" "+organ.room+" "+row.title+" "+row.meta).toLowerCase();
      return words.every(function(word){ return hay.indexOf(word)!==-1; });
    });
    if(!rows.length) return "";
    return '<div class="group"><h2>'+esc(organ.name)+'</h2>'+cards(rows)+'</div>';
  }).join("") || '<p class="empty">No simulator matches that.</p>';
}
figure.addEventListener("click", function(event){
  const btn = event.target.closest(".hot");
  if(!btn || current) return;
  const id = btn.getAttribute("data-id");
  const spot = {x:+btn.getAttribute("data-x"), y:+btn.getAttribute("data-y")};
  if(!fine && held!==id){ held = id; light(id, spot); return; }
  enter(id);
});
figure.addEventListener("pointerdown", function(event){
  if(event.target.closest(".hot")) return;
  drag = event.clientX;
  figure.classList.remove("sway");
});
figure.addEventListener("pointermove", function(event){
  if(drag==null) return;
  const turn = Math.max(-18, Math.min(18, (event.clientX-drag)/10));
  figure.style.transform = "rotateY("+turn+"deg)";
});
figure.addEventListener("pointerup", function(){
  if(drag==null || current) return;
  drag = null;
  figure.style.transform = "";
  figure.classList.add("sway");
});
find.addEventListener("input", search);
let audioCtx = null;
let ambient = [];
let soundOn = false;
function ensureAudio(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx) audioCtx = new Ctx();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function startAmbient(){
  if(!soundOn || ambient.length || !document.body.classList.contains("opening")) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  [110,220,330].forEach(function(freq, index){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lfo = ctx.createOscillator();
    const depth = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = index===0 ? 0.006 : 0.003;
    lfo.frequency.value = 0.07;
    depth.gain.value = 0.002;
    lfo.connect(depth);
    depth.connect(gain.gain);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    lfo.start();
    ambient.push({osc:osc, gain:gain, lfo:lfo});
  });
}
function stopAmbient(){
  if(!audioCtx || !ambient.length){ ambient = []; return; }
  const ctx = audioCtx;
  ambient.forEach(function(node){
    node.gain.gain.cancelScheduledValues(ctx.currentTime);
    node.gain.gain.setValueAtTime(Math.max(0.0001, node.gain.gain.value), ctx.currentTime);
    node.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.4);
    node.osc.stop(ctx.currentTime+0.45);
    node.lfo.stop(ctx.currentTime+0.45);
  });
  ambient = [];
}
function tone(freq){
  if(!soundOn) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.028, ctx.currentTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.2);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.22);
}
function chime(id){
  const index = Math.max(0, ORGANS.findIndex(function(item){ return item.id===id; }));
  tone(470 + index*34);
}
function setSound(on){
  soundOn = on;
  const button = document.getElementById("sound");
  button.setAttribute("aria-pressed", on ? "true" : "false");
  button.textContent = on ? "Sound: On" : "Sound: Off";
  try{ localStorage.setItem("atlas-sound", on ? "on" : "off"); }catch(err){}
  if(on) startAmbient();
  else stopAmbient();
}
document.getElementById("sound").onclick = function(){
  ensureAudio();
  setSound(!soundOn);
};
let introTimers = [];
function finishIntro(){
  introTimers.forEach(clearTimeout);
  introTimers = [];
  document.body.classList.remove("opening","scanning","titled");
  document.body.classList.add("ready");
  figure.classList.add("materialise","sway");
  figure.style.opacity = "1";
  stopAmbient();
  if(!current) light("");
}
function later(ms, fn){ introTimers.push(setTimeout(fn, ms)); }
function playIntro(){
  if(reduced){ finishIntro(); return; }
  document.body.classList.add("opening");
  later(180, function(){ figure.classList.add("materialise"); });
  later(2100, function(){
    document.body.classList.add("scanning");
    ["brain","heart","lungs","kidneys"].forEach(function(id, index){
      later(index*420, function(){ if(!current) light(id); });
    });
  });
  later(5000, function(){
    document.body.classList.add("titled");
    figure.classList.add("sway");
  });
  later(7600, finishIntro);
}
document.getElementById("skip").onclick = finishIntro;
const dust = document.getElementById("dust");
const pen = dust.getContext("2d");
const specks = [];
for(let n=0;n<36;n++) specks.push({x:Math.random(), y:Math.random(), v:0.15+Math.random()*0.35, s:0.6+Math.random()*1.4});
function drawDust(){
  if(reduced || document.body.classList.contains("in")) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  if(dust.width!==w || dust.height!==h){ dust.width = w; dust.height = h; }
  pen.clearRect(0,0,dust.width,dust.height);
  pen.fillStyle = "rgba(127,212,230,.4)";
  specks.forEach(function(speck){
    speck.y -= 0.00045*speck.v;
    if(speck.y<0) speck.y = 1;
    pen.beginPath();
    pen.arc(speck.x*dust.width, speck.y*dust.height, speck.s, 0, 6.28);
    pen.fill();
  });
  requestAnimationFrame(drawDust);
}
document.querySelector(".atlas").addEventListener("pointermove", function(event){
  if(reduced || drag!=null || current) return;
  const box = event.currentTarget.getBoundingClientRect();
  const x = (event.clientX-box.left)/box.width-0.5;
  const y = (event.clientY-box.top)/box.height-0.5;
  document.querySelector(".well").style.transform = "rotateY("+(x*7)+"deg) rotateX("+(-y*4)+"deg)";
});
paint();
figure.addEventListener("pointerover", function(event){
  if(event.pointerType==="touch" || current) return;
  const btn = event.target.closest(".hot");
  if(!btn) return;
  fine = true;
  light(btn.getAttribute("data-id"), {x:+btn.getAttribute("data-x"), y:+btn.getAttribute("data-y")});
});
playIntro();
if(!reduced) requestAnimationFrame(drawDust);
</script>
