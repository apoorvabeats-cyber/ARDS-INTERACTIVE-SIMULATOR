<style>
:root{
  --bg:#071018; --fg:#f3efe6; --muted:#b7b1a4; --faint:#8a8478;
  --line:rgba(243,239,230,.18); --cool:#7fd4e6; --warm:#e2b48a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070c;color:var(--fg)}
body{font-family:Figtree,ui-sans-serif,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 118px 0 16px}
.brand{margin:0;font-family:Figtree,sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;line-height:1.15;color:#d9ffe8}
.figure{position:relative;z-index:1;width:100%;height:min(78dvh,820px);transform-style:preserve-3d;transition:opacity .45s ease}
.figure canvas{width:100%;height:100%;display:block;touch-action:none}
body.live3d .figure img,body.live3d .hot{display:none}
.dock{position:absolute;left:8px;right:8px;bottom:112px;z-index:4;display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.dock button{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(7,16,24,.72);color:var(--fg)}
.dock button.on{border-color:var(--cool);color:var(--cool)}
.pickname{position:absolute;left:0;right:0;top:8px;z-index:4;text-align:center;margin:0;font-family:Fraunces,Georgia,serif;font-size:22px;letter-spacing:-.03em;pointer-events:none}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
.brand small{display:block;margin-top:4px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
header input,.seek input{width:100%;max-width:none;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px}
header input::placeholder{color:var(--faint)}
.seek{display:flex;flex-direction:column;align-items:stretch;width:46%;max-width:220px}
.touch{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.atlas{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 46%,#102033 0%,#05070c 62%)}
.hud-header{position:absolute;top:10px;right:10px;z-index:8;display:flex;gap:8px;padding:0}
.hud-header input{position:absolute;width:1px;height:1px;opacity:0}
.hud-center{position:absolute;inset:0}
.veil{position:absolute;inset:0;pointer-events:none;z-index:4}
.bracket{position:absolute;width:54px;height:54px;border:1px solid rgba(170,230,255,.55)}
.bracket.tl{top:14px;left:14px;border-right:0;border-bottom:0}
.bracket.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.bracket.bl{bottom:14px;left:14px;border-right:0;border-top:0}
.bracket.br{bottom:14px;right:14px;border-left:0;border-top:0}
.diag{position:absolute;top:12%;bottom:12%;width:64px;display:flex;flex-direction:column;justify-content:space-between}
.diag.left{left:10px}
.diag.right{right:10px}
.pane{height:22%;border:1px solid rgba(150,220,255,.28);background:
  linear-gradient(rgba(150,220,255,.16) 1px,transparent 1px) 0 0 / 100% 7px,
  linear-gradient(90deg,rgba(150,220,255,.12) 1px,transparent 1px) 0 0 / 8px 100%;
  position:relative;overflow:hidden}
.pane i{position:absolute;left:-20%;width:140%;height:46%;top:30%;
  background:radial-gradient(closest-side,rgba(190,245,255,.9),transparent 70%) 0 50% / 14px 100% repeat-x;
  filter:drop-shadow(0 0 4px #9fe);
  animation:trace 2.8s linear infinite}
.pane.alt i{animation-duration:3.6s;animation-direction:reverse;top:48%}
.bars{height:18%;display:flex;align-items:flex-end;gap:3px;padding:4px;border:1px solid rgba(150,220,255,.28)}
.bars b{flex:1;background:#8fd8ff;opacity:.7;transform-origin:bottom;animation:bar 1.6s ease-in-out infinite}
.bars b:nth-child(2){animation-delay:.15s;height:70%}
.bars b:nth-child(3){animation-delay:.3s;height:40%}
.bars b:nth-child(4){animation-delay:.45s;height:85%}
.bars b:nth-child(5){animation-delay:.1s;height:55%}
.bars b:nth-child(1){height:60%}
@keyframes bar{50%{transform:scaleY(.35);opacity:.35}}
@keyframes trace{to{transform:translateX(18%)}}
.ringset{position:absolute;left:50%;top:52%;width:min(78vw,520px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(160,225,255,.28);border-radius:50%}
.ringset::before,.ringset::after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(160,225,255,.45);animation:spin 22s linear infinite}
.ringset::after{inset:18%;border-style:solid;border-color:transparent rgba(210,245,255,.7);animation-duration:9s;animation-direction:reverse}
.beam{position:absolute;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,#dff,#fff,#dff,transparent);box-shadow:0 0 16px #9fe7ff;animation:sweep 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{top:82%;opacity:.2}50%{opacity:1}100%{top:10%;opacity:.2}}
.pickname,.invite,.load{color:transparent;font-size:0}
.atlas .well,.atlas .figure{width:100%;height:100%}
.atlas .figure{min-height:100%}
@media(max-width:720px){
  .diag{width:42px;top:16%;bottom:10%}
  .bracket{width:28px;height:28px}
}
.atlas::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(127,212,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,212,230,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 42%,#000 10%,transparent 68%);
}
.dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.glow{position:fixed;left:50%;top:42%;width:280px;height:280px;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(127,212,230,.28),transparent 68%);opacity:0}
body.opening .glow{animation:glow 2s ease forwards}
@keyframes glow{0%{opacity:0}40%{opacity:1}100%{opacity:.35}}
.sound,.skip{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:1px solid rgba(170,230,255,.55);background:transparent;color:transparent;font-size:0}
.replay{margin:0}
.skip{top:12px;left:12px;display:none}
body.opening .skip{display:block}
body.blocked .figure{opacity:0}
body.blocked header{visibility:hidden}
body.blocked .invite{opacity:1}
body.begun .touch{display:none}
.invite{display:none}
body.titled .invite,body.ready .invite{opacity:1;transition:opacity .8s ease}
body.settled .invite,body.in .invite{opacity:0}
.invite p{margin:0;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#8dceb0}
.invite h2{font-family:Figtree,sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0;line-height:1.3;color:#d9ffe8}
.invite .quiet{letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:#8dceb0;margin-top:4px}
.well{perspective:1200px;width:min(100% - 168px, 520px);position:relative;z-index:1}
.halo{position:absolute;left:22%;right:22%;bottom:16%;height:18px;border-radius:50%;border:1px solid rgba(127,212,230,.55);box-shadow:0 0 22px rgba(127,212,230,.35);opacity:0;pointer-events:none}
body.titled .halo,body.ready .halo{opacity:1;transition:opacity .6s ease}
.glimpses{display:none}
.trace{position:absolute;width:76px;height:34px;opacity:0;pointer-events:none;z-index:2}
body.ready .trace{opacity:.72;transition:opacity .6s ease}
.trace.ct{left:0;top:7%}
.trace.ecg{right:0;top:36%}
.trace.vent{left:0;top:50%}
.trace.line{right:0;top:64%}
.trace img,.trace svg{width:100%;height:100%;display:block;object-fit:cover;background:transparent}
.well::before{content:"";position:absolute;left:18%;right:18%;top:6%;bottom:12%;background:radial-gradient(circle,rgba(127,212,230,.14),transparent 68%);pointer-events:none;z-index:0}
.scan{position:absolute;left:22%;right:22%;height:10%;top:-14%;pointer-events:none;opacity:0;background:linear-gradient(transparent,rgba(160,230,245,.7),transparent);mix-blend-mode:screen}
body.scanning .scan{animation:scan 2.7s ease-in-out forwards}
@keyframes scan{0%{top:-8%;opacity:.15}12%{opacity:1}100%{top:88%;opacity:0}}
body.opening .figure{opacity:0}
body.opening .figure.materialise{animation:materialise 2s ease forwards}
@keyframes materialise{
  0%{opacity:0;clip-path:inset(0 0 100% 0);filter:brightness(2.6) saturate(.15)}
  20%{opacity:1}
  100%{opacity:1;clip-path:inset(0);filter:none}
}
.figure::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--hx,50%) var(--hy,40%),transparent 0 22%,rgba(7,16,24,.4) 60%);
}
.figure.focus::after{opacity:1;transition:opacity .25s ease}
.well{perspective:1400px;transform-style:preserve-3d}
.figure img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none;backface-visibility:hidden}
.figure img.back{position:absolute;inset:0;transform:rotateY(180deg)}
body.spinning .hot{pointer-events:none}
.hot{position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border:0;border-radius:999px;background:transparent;padding:0;backface-visibility:hidden}
.hot[data-id="brain"]{width:120px;height:100px}
.hot i{position:absolute;inset:16px;border:0;border-radius:inherit;background:transparent;box-shadow:none}
.hot.lit i{inset:0;background:radial-gradient(circle,rgba(127,212,230,.62),rgba(127,212,230,0) 72%);box-shadow:0 0 26px rgba(127,212,230,.35)}
.hot[data-id="brain"].lit i{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1);opacity:.72}}
.hot b{display:none}
.figure.filming{transition:opacity .25s ease;transform:none}
body.filming header,body.filming .trace,body.filming .halo,body.filming .invite,body.filming .hot b{opacity:0}
.room{display:none;min-height:100dvh;padding:14px 14px 22px}
body.in .atlas,body.in header,body.in .approach{display:none}
body.in .room{display:flex;flex-direction:column}
body.hud3d.in .atlas,body.hud3d.in header,body.hud3d.in .approach{display:none !important}
body.hud3d.in .room{display:flex;position:fixed;inset:0;z-index:40;height:100dvh;min-height:100dvh;overflow:auto;background:#071018}
.back{align-self:flex-start;text-align:left;background:rgba(12,24,34,.92);border:1px solid rgba(127,212,230,.55);color:#e7f6fb;padding:0 16px;min-height:44px;border-radius:999px;margin:0 0 10px}
.room h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:42px;letter-spacing:-.035em;margin:6px 0 8px;line-height:.95}
.lede{margin:0;max-width:38rem;color:var(--muted);line-height:1.45}
.parts{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin:14px 0 0}
.parts button{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px;color:var(--muted)}
.parts button.on{color:var(--fg);border-color:var(--fg)}
.portals{flex:none;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.portal{
  position:relative;border:0;border-radius:18px;min-height:92px;width:100%;text-align:left;padding:16px 42px 16px 16px;
  overflow:hidden;color:var(--fg);
}
.portal .go{position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:translateY(-50%) rotate(45deg);opacity:.7;pointer-events:none}
.portal.lab{background:
  radial-gradient(80% 50% at 50% 100%,rgba(127,212,230,.16),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#12343f 0%,#0c1418 58%,#071018 100%);
  transform:none;box-shadow:inset 0 0 0 1px rgba(127,212,230,.4)}
.portal.arena{background:
  radial-gradient(80% 46% at 50% 100%,rgba(226,180,138,.18),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#3a2a1c 0%,#16110e 55%,#071018 100%);
  transform:none;box-shadow:inset 0 0 0 1px rgba(226,180,138,.45)}
.portal.osce{background:
  radial-gradient(80% 50% at 50% 100%,rgba(170,196,168,.18),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#1c3324 0%,#101612 55%,#071018 100%);
  box-shadow:inset 0 0 0 1px rgba(170,196,168,.45)}
.portal.reference{background:
  radial-gradient(80% 50% at 50% 100%,rgba(214,198,150,.16),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#2c2818 0%,#14140f 55%,#071018 100%);
  box-shadow:inset 0 0 0 1px rgba(214,198,150,.4)}
.portal.on{box-shadow:inset 0 0 0 2px #f3efe6}
body.inside.lab{background:#07161c}
body.inside.arena{background:#140e0b}
body.inside.osce{background:#0d1610}
body.inside.reference{background:#14140f}
.portal span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.portal.lab span{color:var(--cool)}
.portal.arena span{color:var(--warm)}
.portal.osce span{color:#b7d2b8}
.portal.reference span{color:#e2d2a2}
.portal strong{display:block;margin-top:6px;font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:520;letter-spacing:-.03em;line-height:1.05}
.mcq-stem{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:16px;line-height:1.4;letter-spacing:-.01em;margin:8px 0 12px}
.mcq-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:12px;margin:0 0 8px;border-radius:14px;border:1px solid var(--line);background:#0c1822;color:#f3efe6;font-size:15px;line-height:1.35;-webkit-appearance:none;appearance:none}
.mcq-opt b{font-family:Fraunces,Georgia,serif;color:#7fd4e6;min-width:1.2em;font-weight:520}
.mcq-opt.right{border-color:#7dcea0;background:#10241c}
.mcq-opt.wrong{border-color:#c46a6a;background:#241416}
.mcq-opt:disabled{cursor:default}
.mcq-note{margin-top:8px}
body.enter .portal.lab{animation:fromLeft .75s cubic-bezier(.22,.7,.2,1) both}

@keyframes fromLeft{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.shelf{display:none;margin-top:8px}
body.inside .portals{flex:none;flex-direction:column;gap:8px;overflow:visible;margin-top:10px}
body.inside .portal{min-height:52px;width:100%;flex:none;padding:12px 16px;border-radius:16px}
body.inside .portal em,body.inside .portal::before,body.inside .portal::after,body.inside .portal .go,body.inside .portal span{display:none}
body.inside .portal strong{margin:0;font-family:Figtree,sans-serif;font-size:14px;font-weight:650;letter-spacing:0}
body.inside .shelf{display:block}
.refhead{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;margin:16px 0 6px}
.tasks{margin:10px 0;padding-left:18px;color:var(--muted)}
.tick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tick input{width:22px;height:22px;margin-top:2px;flex:none}
.mark{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.card{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--line);min-height:44px}
button.card{width:100%;font:inherit;color:inherit;text-align:left;background:transparent;border:0;border-radius:0;cursor:pointer}
.card b{display:block;font-size:17px;font-weight:600}
.card span{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.empty{color:var(--muted);line-height:1.45}
.results{display:none;padding:8px 16px 24px}
.veil{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:var(--fg);transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(var(--from,.42));transition:transform .9s cubic-bezier(.22,.61,.2,1),opacity .5s ease}

.veil.title{background:#071018}

.credit{display:none}

.group{margin-top:18px}

/* Opening atlas: keep the body and its controls visible at every screen size. */
body{height:auto;min-height:100dvh}
.atlas{flex:none;height:100dvh;min-height:620px;overflow:hidden}
.atlas-heading{position:absolute;left:32px;top:28px;z-index:5;pointer-events:none}

.atlas-heading h1{font:520 32px/1.1 Fraunces,Georgia,serif;margin:0 0 10px;letter-spacing:-.03em}
.atlas-heading span{color:var(--muted);font-size:13px}
.hud-header{position:absolute;z-index:8;top:24px;right:28px;gap:8px}
.sound{width:auto;padding:0 13px;color:var(--fg);font-size:12px;background:#0c1823;min-height:38px;border-color:var(--line);border-radius:20px}
#sound::before{content:"Sound on"}#sound[aria-pressed="false"]::before{content:"Sound off"}
.skip{color:var(--fg);font-size:12px;width:auto;padding:0 12px;z-index:9;position:absolute;top:130px;left:32px}
.skip::before{content:"Skip intro"}
.atlas .hud-center{left:0;right:230px;top:94px;bottom:100px;display:flex;align-items:stretch;justify-content:center}
.atlas .well{width:auto;max-width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.figure img{position:absolute;inset:0;object-fit:fill}
.figure canvas{position:relative;z-index:1}
body:not(.live3d) .figure canvas{display:none}
.atlas .figure{height:100%;width:auto;max-width:100%;aspect-ratio:1008/1792;min-height:0}
body.flat .figure canvas{display:none}
body.flat .figure .back{display:none}
.load{font-size:12px;color:var(--muted);inset:auto 20px 8px;z-index:3;text-align:center}
.pickname{top:auto;bottom:0;font:12px Figtree,sans-serif;color:var(--muted);transform:translateY(26px)}
.organ-nav{position:absolute;z-index:5;right:32px;top:120px;bottom:100px;width:190px;display:flex;flex-direction:column;justify-content:center;gap:6px}

function applyTurn(){
  if(current) return;
  figure.style.transform = "rotateY("+angle+"deg)";
}
function setSpin(on){
  spinning = false; // The 3D viewer owns rotation; a flat image must stay readable.
  document.body.classList.toggle("spinning", spinning);
}
function tick(now){
  if(!lastTick) lastTick = now;
  const dt = Math.min(0.05, (now-lastTick)/1000);
  lastTick = now;
  if(window.anatomyManaged) return;
  if(spinning && !current){
    angle = (angle + dt * 28) % 360;
    applyTurn();
  }
  requestAnimationFrame(tick);
}
if(!reduced) requestAnimationFrame(tick);

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&"+"#39;"}[c];
  });
}

function organById(id){ return ORGANS.find(function(item){ return item.id===id; }); }
function rowsOf(list){
  return list.map(function(row){
    const tagged = row.length===4;
    return { part: tagged?row[0]:"", title: row[tagged?1:0], meta: row[tagged?2:1], href: row[tagged?3:2] };
  });
}
function cards(list){
  if(!list.length) return "";
  return list.map(function(row){
    return '<a class="card" href="'+esc(row.href)+'"><b>'+esc(row.title)+'</b><span>'+esc(row.meta)+'</span></a>';
  }).join("");
}
function learnRows(organ){
  const rows = rowsOf(organ.learn);
  if(!organ.parts || part==="all") return rows;
  return rows.filter(function(row){ return row.part.split(" ").indexOf(part)!==-1; });
}
function light(id, spot){
  figure.querySelectorAll(".hot").forEach(function(btn){
    btn.classList.toggle("lit", btn.getAttribute("data-id")===id);
  });
  if(!id){ figure.classList.remove("focus"); return; }
  const organ = organById(id);
  const use = spot || (organ && organ.spots[0]);
  if(!use) return;
  figure.style.setProperty("--hx", use.x+"%");
  figure.style.setProperty("--hy", use.y+"%");
  figure.classList.add("focus");
}
function paint(){
  const html = [];
  ORGANS.forEach(function(organ){
    organ.spots.forEach(function(spot){
      const label = spot.name || organ.name;
      html.push('<button type="button" class="hot" data-id="'+organ.id+'" data-x="'+spot.x+'" data-y="'+spot.y+'" style="left:'+spot.x+'%;top:'+spot.y+'%" aria-label="'+esc(label)+'"><i></i><b>'+esc(label)+'</b></button>');
    });
  });
  figure.insertAdjacentHTML("beforeend", html.join(""));
}

    body:["Take cultures and give an antibiotic that covers the likely source. Do not let the culture ritual delay the drug.","Give crystalloid for hypoperfusion, then reassess. A large fixed volume is not a target.","Norepinephrine is the first vasopressor. It may start in a watched peripheral vein if a central catheter would delay it.","Lactate is a marker of trouble. Chasing it to normal is not the treatment."],
    link:["Open the shock practice case","Practice_Simulator.html?focus=circulation&v=20261028m"]},
  {section:"guidelines", title:"ARDS ventilation",
    body:["Predicted body weight, not actual weight, sets the tidal volume. Six millilitres per kilogram is the usual target.","Keep plateau pressure at or under 30 cm H2O. Driving pressure is watched.","Prone positioning is for moderate to severe ARDS, often when the ratio of arterial oxygen to inspired oxygen is under about 150 despite a proper PEEP."],

  {section:"guidelines", title:"Acute pancreatitis",
    body:["Diagnose with typical pain plus a lipase at least three times the upper limit. Contrast CT is not required on the first day when those two are clear.","Lactated Ringer at a moderate rate is preferred to a prolonged high-rate infusion. The WATERFALL trial is why the aggressive arm is not the default.","Do not give antibiotics for necrosis alone. Feed the gut. Infected necrosis, shown by gas or by sepsis, is drained. It is not opened first.","Gallstones are removed later. Urgent ERCP is for cholangitis or a stone still blocking the duct."],
    link:["Open the pancreatitis practice case","Practice_Simulator.html?focus=gi&v=20261028m"]},
  {section:"guidelines", title:"Acute liver failure",
    body:["Definition: encephalopathy and an INR of at least 1.5 from an acute injury, without cirrhosis, inside 26 weeks.","Paracetamol: start intravenous N-acetylcysteine immediately. A common course is 150 mg/kg over one hour, then 50 mg/kg over four hours, then 100 mg/kg over 16 hours, and it continues if the liver is failing.","Paracetamol King's College: arterial pH under 7.30 after resuscitation, or all three of grade III–IV encephalopathy, INR above 6.5, and creatinine above 3.4 mg/dL.","Other causes: INR above 6.5, or any three of age under 10 or over 40, an unfavorable cause such as a drug reaction, jaundice more than seven days before encephalopathy, INR above 3.5, and bilirubin above 17.5 mg/dL.","Stop the causative drug. Do not paint over the INR with plasma unless there is bleeding or a procedure."],
    link:["Open the liver practice cases","Practice_Simulator.html?focus=liver&v=20261028m"]},
  {section:"formulas", title:"Perfusion and the ventilator",
    body:["Mean arterial pressure = diastolic + (systolic − diastolic) / 3.","Cerebral perfusion pressure = mean arterial pressure − intracranial pressure.","Predicted body weight, men: 50 + 0.91 × (height in centimetres − 152.4). Women: 45.5 + 0.91 × (height in centimetres − 152.4).","Tidal volume target in ARDS is about 6 mL for each kilogram of that weight."]},
  {section:"formulas", title:"Gas and the anion gap",
    body:["Alveolar oxygen is approximated by 150 − (PaCO2 / 0.8) while breathing room air at sea level. The A–a gradient is that number minus PaO2.","Anion gap = sodium − (chloride + bicarbonate). A raised gap with a low pH is a high-gap metabolic acidosis until proved otherwise.","Winter's formula estimates the carbon dioxide that should accompany a metabolic acidosis: 1.5 × bicarbonate + 8, give or take 2."]},
  {section:"formulas", title:"Corrected laboratories",
    body:["Sodium falls about 1.6 mmol/L for every 100 mg/dL the glucose sits above 100. Add that back when you judge the tonicity.","Corrected calcium = measured calcium + 0.8 × (4 − albumin in g/dL). Use the ionized calcium when the decision is close.","Osmol gap = measured osmolality − (2 × sodium + glucose/18 + urea/6), with glucose and urea in mg/dL."]},
  {section:"formulas", title:"How the OSCE simulators keep score",
    body:["Each correct choice adds one. On a film, the finding is asked first and the treatment second. On an instrument, the use is asked first and the check second.","The running score stays on this device. It is practice, not a college result.","Doses in the drug station are published teaching doses. Confirm the monograph before you give a drug."]},

    body:["If the ECG is changing or the potassium is dangerously high, give intravenous calcium to stabilize the membrane.","Shift potassium with insulin and glucose. A beta agonist can be added. Recheck the glucose.","Remove potassium with a kaliuresis if the kidneys can answer, or with dialysis if they cannot. A resin is slow and is not the emergency.","Stop the cause: the drug, the missed dialysis, the dying muscle."]},

  {section:"materials", title:"Intracranial pressure, the bedside",
    body:["Raise the head, keep the neck straight, treat fever, and do not let carbon dioxide drift.","A new anisocoria is a herniation until proved otherwise. Osmotic therapy is for that moment, not a standing order to hyperventilate for hours.","An external ventricular drain can measure and remove cerebrospinal fluid. A parenchymal monitor measures only. Neither replaces the reason the pressure rose."],
    link:["Open the disease learning lab","brain-disease-lab.html?v=20261028p"]},

function osceRecord(){
  try { return JSON.parse(localStorage.getItem("osce-world-v1") || "{}"); }
  catch(e){ return {}; }
}
function saveOsce(id, percent, pass, missed){
  const all = osceRecord();
  const prev = all[id] || {attempts:0, best:0, passes:0, misses:{}};
  prev.attempts += 1;
  prev.best = Math.max(prev.best || 0, percent);
  if(pass) prev.passes += 1;
  prev.lastPass = pass;
  prev.misses = prev.misses || {};
  (missed || []).forEach(function(text){ prev.misses[text] = (prev.misses[text] || 0) + 1; });
  all[id] = prev;
  localStorage.setItem("osce-world-v1", JSON.stringify(all));
}

function weakestCritical(osce){
  let text = "";

  Object.keys(osce).forEach(function(id){

      if(misses[item] > n){ n = misses[item]; text = item; }

  });
  return n ? {text:text, n:n} : null;
}

function markStation(station){
  const boxes = Array.prototype.slice.call(document.querySelectorAll("[data-tick]"));
  const done = boxes.filter(function(box){ return box.checked; }).length;
  const missed = boxes.filter(function(box){ return box.getAttribute("data-critical") && !box.checked; }).map(function(box){
    return station.items[Number(box.getAttribute("data-tick"))][0];
  });
  const percent = boxes.length ? Math.round(done / boxes.length * 100) : 0;
  const pass = percent >= 70 && !missed.length;
  const result = document.getElementById("markResult");
  result.hidden = false;
  result.textContent = percent+"%. "+(missed.length?"A critical item was missed. ":"")+(pass?"Station passed.":"Station not passed.");
  saveOsce(station.id, percent, pass, missed);
  if(mockCircuit){
    mockCircuit.marks.push({id:station.id, percent:percent, pass:pass});
    const next = mockCircuit.ids[mockCircuit.marks.length];
    if(next){
      osceStation = next;
      renderRoom();
      return;
    }
    const mean = Math.round(mockCircuit.marks.reduce(function(sum, item){ return sum+item.percent; }, 0) / mockCircuit.marks.length);
    const circuitPass = mockCircuit.marks.every(function(item){ return item.pass; });
    saveOsce("mock-circuit", mean, circuitPass, []);
    mockCircuit = null;
    osceStation = null;
    osceSection = "analytics";
    renderRoom();
  }
}

  const veil = document.createElement("div");
  const label = el.querySelector("strong, b");
  veil.className = "veil "+kind;
  veil.innerHTML = "<strong>"+esc(label ? label.textContent : "")+"</strong>";
  veil.style.setProperty("--ox", (rect.left+rect.width/2)+"px");

  veil.style.setProperty("--from", String(Math.max(0.34, rect.width/window.innerWidth)));
  document.body.appendChild(veil);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add("full"); }); });
  setTimeout(function(){
    if(end) end();
    requestAnimationFrame(function(){ veil.classList.add("away"); });

  }, kind==="title" ? 980 : 860);

function enter(id, spot){
  const organ = organById(id);
  if(!organ || current) return;

  current = id;

  inside = null;
  document.body.classList.remove("inside","lab","arena","osce","reference");
  bootSound();
  speak(organ.name);
  finishIntro();
  setSpin(false);
  figure.classList.remove("sway");
  blip((spot.x||50)/100*2-1);
  if(window.zoomIntoAnatomy) window.zoomIntoAnatomy(id);
  if(organ.plate && !reduced){
    const layer = placeBrain(spot);
    const plate = document.getElementById("plate");
    layer.classList.remove("rise","leave");
    const go = function(){
      requestAnimationFrame(function(){ layer.classList.add("rise"); });
      arm = setTimeout(function(){ layer.classList.add("leave"); }, 1750);
      timer = setTimeout(showRooms, 2550);
    };
    plate.alt = organ.name;
    plate.onload = null;
    plate.onerror = function(){ plate.onload = null; plate.onerror = null; showRooms(); };
    if(plate.getAttribute("src")===organ.plate && plate.complete && plate.naturalWidth){
      go();
    } else {
      plate.onload = function(){ plate.onload = null; go(); };
      plate.src = organ.plate;
    }
    return;
  }

  else timer = setTimeout(showRooms, 1900);

      else if(letter===mcqPicked) cls += " wrong";
    }
    return '<button type="button" class="'+cls+'" data-letter="'+letter+'"'+(mcqPicked?" disabled":"")+'><b>'+letter+'</b><span>'+esc(text)+'</span></button>';
  }).join("");
  const note = mcqPicked
    ? '<div class="mcq-note"><p class="lede"><b>'+(mcqPicked===q.answer?"Correct. ":"Not this one. The answer is "+q.answer+". ")+'</b>'+esc(q.explain)+'</p><button type="button" class="portal lab" id="mcq-next"><strong>'+(mcqIndex+1===pool.length?"See the score":"Next question")+'</strong></button></div>'
    : "";
  room.innerHTML =
    '<button type="button" class="back" id="back">Back to the systems</button>'+
    '<p class="lede" style="letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--faint)">'+esc(q.system)+' · '+(mcqIndex+1)+' of '+pool.length+'</p>'+
    '<h2 class="mcq-stem">'+esc(q.stem)+'</h2>'+
    '<div class="mcq-opts">'+opts+'</div>'+note;
  document.getElementById("back").onclick = function(){ mcqSystem=null; mcqPicked=null; renderTest(); };
  room.querySelectorAll("[data-letter]").forEach(function(btn){
    btn.onclick = function(){
      if(mcqPicked) return;
      mcqPicked = btn.getAttribute("data-letter");
      if(mcqPicked===q.answer) mcqScore += 1;
      renderTest();
    };
  });
  const next = document.getElementById("mcq-next");
  if(next) next.onclick = function(){
    mcqPicked = null;
    mcqIndex += 1;
    renderTest();
  };
  room.scrollTop = 0;
  if(mcqPicked){
    const letters = ["A","B","C","D","E"];
    const answerText = q.options[letters.indexOf(q.answer)] || "";
    speakMcq((mcqPicked===q.answer ? "Correct. " : "Not this one. The answer is "+q.answer+". "+answerText+". ") + q.explain);
  } else speakMcq(q.stem);
}

function openRail(which){
  stopSpoken();
  finishIntro();
  setSpin(false);
  current = null;
  inside = null;
  document.body.classList.add("in","enter");
  document.body.classList.remove("inside","lab","arena","osce","reference","opening","scanning","doors");

  let bodyHtml = "";
  if(which==="osce"){
    title = "OSCE World";
    lede = "Five spoken stations. The voice asks the question. You choose.";

  }else if(which==="drugs"){
    title = "Drugs and doses";
    lede = "Teaching doses only. Confirm the monograph before a drug is given.";

  }else if(which==="formulas"){

    lede = "The calculations the simulators assume.";
    bodyHtml = formulaBlock();
  }
  room.innerHTML =
    '<button type="button" class="back" id="back">Back to the body</button>'+
    '<h2>'+esc(title)+'</h2>'+

document.getElementById("rail-tabs").addEventListener("click", function(event){
  const btn = event.target.closest("[data-tab]");
  if(!btn) return;
  stopSpoken();
  const tab = btn.getAttribute("data-tab");
  if(tab==="train"){ if(window.openBody) window.openBody(); return; }
  if(tab==="test"){ mcqSystem=null; mcqPicked=null; renderTest(); return; }
  if(tab==="abg"){ renderAbg(); return; }
  openRail(tab);
});
