<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DKA and HHS: map</title>
<style>
:root{--bg:#eef3f8;--ink:#0c1b2e;--mute:#546579;--panel:#fff;--line:#b9c8d8;--acc:#0a7f8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06111f;--ink:#e6f1fb;--mute:#8fa5bb;--panel:#0d2036;--line:#24435f;--acc:#3fe0f0;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 14px 28px}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
#stage{color:var(--acc);font-weight:600;margin:2px 0 12px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
button:focus-visible,.node:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
label{display:block;margin:12px 0 2px;color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
svg{width:100%;height:auto;display:block}
.node{cursor:pointer}.node text{fill:var(--ink);font-size:10.5px;font-weight:600;text-anchor:middle;pointer-events:none}
.hub text{fill:var(--ink);font-size:16px;font-weight:700;text-anchor:middle}
.flow{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.hot .glow{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.1}}
.t1{fill:var(--ink);font-size:13.5px;font-weight:700}.t2{fill:var(--mute);font-size:11px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.chip{border-radius:12px;text-align:left;padding:8px 10px;font-size:13px}
.chip b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.panel ul{margin:4px 0 0;padding-left:18px}.panel li{margin:3px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
h2{margin:6px 0 0;font-size:21px}
a.lab3d{display:inline-block;margin:8px 6px 0 0;padding:8px 14px;border:1px solid var(--acc);border-radius:999px;color:var(--acc);text-decoration:none;font-weight:600;font-size:14px}
a.lab3d:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:4px 0 0}
@keyframes beat{50%{transform:scale(var(--a))}}
.rx ul{padding-left:0}.rx li{list-style:none;margin:5px 0}.rx b{display:inline-block;min-width:46px;font-size:12px}.up b{color:#2bb673}.dn b{color:#ef5b52}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body><main>
<h1>DKA and HHS</h1><div id="stage"></div>
<div class="row" id="types"><button data-t="dka" aria-pressed="true">DKA</button><button data-t="hhs" aria-pressed="false">HHS</button></div>
<div class="row" id="presets"><button data-p="15">Early</button><button data-p="40">Established</button><button data-p="70">Severe</button><button data-p="95">Critical</button></div>
<label for="prog">Disease progression</label>
<input id="prog" type="range" min="0" max="100" value="45">
<div class="row" style="margin-top:8px"><button id="rx" aria-pressed="false">Insulin, fluids and potassium</button></div>
<div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const C=[
{id:'acid',n:['Keto-','acidosis'],a:-90,on:.2,m:{dka:1,hhs:.25},lab:'meta',val:s=>'pH '+(7.4-.38*s).toFixed(2),
 org:'Ketoacidosis, organ level. Ketone acids build up in the blood, the pH falls, and the breathing becomes deep and fast to blow off carbon dioxide.',
 cell:'Ketoacidosis, cell level. With no insulin, the liver burns fatty acids in its mitochondria and releases ketone acids, which lower the pH and inhibit enzymes.',
 D:[[1,'IV insulin','switches ketone production off'],[1,'IV fluids','dilute ketones and restore perfusion'],[0,'Bicarbonate','usually harms: brain acidosis and low potassium']]},
{id:'pot',n:['Potassium'],a:-18,on:.3,m:{dka:1,hhs:.8},lab:'meta',val:s=>'K '+(4.2+1.3*s).toFixed(1)+', body stores low',
 org:'Potassium, organ level. The blood level looks normal or high, but the body has lost a great deal in the urine. Insulin then drops the level fast and can cause arrhythmia.',
 cell:'Potassium, cell level. Without insulin, and with acid outside, potassium leaves muscle and liver cells. Insulin pushes it back in through the sodium potassium pump.',
 D:[[1,'Potassium replacement','start once the level is below 5.3 and urine is flowing'],[1,'Cardiac monitoring','catches arrhythmia early'],[0,'Insulin without potassium','dangerous fall in potassium']]},
{id:'dehy',n:['Dehydration'],a:54,on:.15,m:{dka:.9,hhs:1.2},lab:'kidney',val:s=>'Deficit '+(7*s).toFixed(1)+' L',
 org:'Dehydration, organ level. Glucose in the urine drags water out. The patient loses several litres, the pressure falls and the heart races.',
 cell:'Dehydration, cell level. The tubule glucose transporters are saturated, so glucose stays in the lumen and holds water there instead of letting it be reabsorbed.',
 D:[[1,'Balanced IV fluids','first priority, refill the vessels'],[1,'IV insulin','stops the glycosuria once volume is restored'],[0,'Loop diuretic','deepens the dehydration']]},
{id:'aki',n:['Kidney','injury'],a:126,on:.4,m:{dka:.8,hhs:1},lab:'kidney',val:s=>'Creatinine '+(1+2*s).toFixed(1),
 org:'Kidney injury, organ level. Low volume reduces kidney perfusion. Creatinine rises, and the injury is usually reversible with fluids.',
 cell:'Kidney injury, cell level. Tubule cells are short of blood flow and oxygen. Prolonged low volume can progress from pre renal injury to tubular injury.',
 D:[[1,'Early fluids','restore renal perfusion'],[1,'Avoid nephrotoxins','NSAIDs and contrast add injury'],[0,'SGLT2 inhibitor','more fluid loss and euglycaemic DKA']]},
{id:'brain',n:['Brain'],a:198,on:.3,m:{dka:.7,hhs:1},lab:'brain',val:s=>'GCS '+Math.round(15-8*s),
 org:'Brain, organ level. In HHS the high osmolality makes the patient drowsy. In DKA, especially in children, brain swelling can appear after treatment starts.',
 cell:'Brain, cell level. Neurons hold extra osmoles. If blood osmolality falls too fast, water moves into the cells and they swell.',
 D:[[1,'Slow osmolality correction','less than 3 mOsm per kg per hour'],[1,'Mannitol or hypertonic saline','for established swelling'],[0,'Rapid fluid and insulin boluses','swell the brain']]}];
const M=Object.fromEntries(C.map(c=>[c.id,c]));
const E=[['acid','pot','Acidosis and insulin lack push potassium out of cells'],['acid','dehy','Vomiting and deep breathing add to the water loss'],['dehy','aki','Low volume cuts kidney perfusion'],['dehy','brain','High osmolality shrinks brain cells, and fast correction swells them'],['aki','pot','Failing kidneys cannot clear potassium']];
let p=.45,type='dka',rx=false,open=null,lvl=null;
const sev=c=>clamp((p-c.on)/(1-c.on))**.8*c.m[type]*(rx?.5:1);
const col=s=>`hsl(${175-175*clamp(s)} 85% 52%)`,pos=c=>[200+138*Math.cos(c.a*Math.PI/180),200+138*Math.sin(c.a*Math.PI/180)];
const stage=()=>p<.25?'Early':p<.5?'Established':p<.8?'Severe':'Critical';
function wheel(){
 let g='';
 C.forEach(c=>{const[x,y]=pos(c);g+=`<line x1="200" y1="200" x2="${x}" y2="${y}" stroke="${col(sev(c))}" stroke-opacity=".4" stroke-width="1.5"/>`});
 E.forEach(([a,b])=>{const s=Math.min(sev(M[a]),sev(M[b])),[x1,y1]=pos(M[a]),[x2,y2]=pos(M[b]);
  g+=`<line class="${s>.12?'flow':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(s)}" stroke-width="${.8+4*clamp(s)}" stroke-opacity="${.12+.88*clamp(s)}" stroke-dasharray="${s>.12?'6 6':'2 6'}"/>`});
 C.forEach(c=>{const[x,y]=pos(c),s=sev(c),k=col(s),l=c.n.length;
  g+=`<g class="node ${s>.6?'hot':''}" tabindex="0" role="button" data-id="${c.id}" aria-label="${c.n.join('')}: ${c.val(s)}"><circle r="39" cx="${x}" cy="${y}" fill="var(--panel)"/><circle class="glow" r="39" cx="${x}" cy="${y}" fill="${k}" fill-opacity="${.08+.3*clamp(s)}"/><circle r="39" cx="${x}" cy="${y}" fill="none" stroke="${k}" stroke-width="${2+2.5*clamp(s)}"/>${c.n.map((t,i)=>`<text x="${x}" y="${y+4+(i-(l-1)/2)*13}">${t}</text>`).join('')}</g>`});
 g+=`<g class="hub"><circle cx="200" cy="200" r="48" fill="var(--panel)" stroke="${col(p)}" stroke-width="3.5"/><text x="200" y="206">${type.toUpperCase()}</text></g>`;
 const act=E.map(([a,b,t])=>[Math.min(sev(M[a]),sev(M[b])),t]).filter(e=>e[0]>.15).sort((a,b)=>b[0]-a[0]).slice(0,3);
 return `<svg viewBox="0 0 400 400" role="img" aria-label="${type.toUpperCase()} and five complications">${g}</svg>
 <div class="chips">${C.map(c=>`<button class="chip" data-id="${c.id}" style="border-color:${col(sev(c))}"><b>${c.n.join('').replace('-','')}</b>${c.val(sev(c))}</button>`).join('')}</div>
 <div class="panel"><strong>Active links</strong>${act.length?`<ul>${act.map(e=>`<li>${e[1]}</li>`).join('')}</ul>`:'<div>No links are active yet. Advance the disease to see them.</div>'}</div>
 <p class="hint">Tap a complication to see and hear it at organ and cell level, then open its 3D lab.</p>`}
function detail(c){const s=sev(c),k=col(s);
 return `<button data-back style="margin-top:12px">← DKA and HHS map</button><h2>${c.n.join('').replace('-','')}</h2><div style="color:${k};font-weight:600">${c.val(s)}</div><div class="bar"><i style="width:${Math.round(clamp(s)*100)}%;background:${k}"></i></div>
 <div class="row"><button data-lv="org" aria-pressed="${lvl==='org'}">Organ level</button><button data-lv="cell" aria-pressed="${lvl==='cell'}">Cell level</button></div>
 <div class="panel">${lvl?c[lvl]:'Tap Organ level or Cell level to see and hear what happens.'}</div>
 <div class="panel rx"><strong>Treatments</strong> <span style="color:var(--mute);font-size:12px">(tap one to hear it)</span><ul>${c.D.map(d=>`<li class="${d[0]?'up':'dn'}"><b>${d[0]?'Helps':'Harms'}</b> ${d[1]}: ${d[2]}</li>`).join('')}</ul></div>
 <a class="lab3d" href="lab-${c.lab}.html" data-lab="${c.lab}">Open the 3D lab</a>`}
function render(){$('#stage').textContent=type.toUpperCase()+': '+stage();
 document.querySelectorAll('#types button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===type));
 $('#view').innerHTML=open?detail(M[open]):wheel()}
const PHM={dka:["Early DKA. At organ level, glucose is rising and the patient is thirsty and passing a lot of urine. At cellular level, insulin is low, so cells cannot take up glucose and the liver starts to make ketones.",
"Established DKA. At organ level, ketones and acid accumulate and the breathing becomes deep and fast. At cellular level, liver mitochondria burn fat into ketone acids.",
"Severe DKA. At organ level, the patient is dehydrated and the pH is low. At cellular level, potassium leaves the cells and acid disturbs enzyme function.",
"Critical DKA. At organ level, shock, drowsiness and arrhythmia threaten. At cellular level, cells are energy starved and total body potassium is depleted."],
hhs:["Early HHS. At organ level, glucose is climbing slowly over days. At cellular level, a little insulin remains, which is enough to hold ketone production back.",
"Established HHS. At organ level, the patient is very dehydrated and drowsy. At cellular level, high osmolality pulls water out of cells.",
"Severe HHS. At organ level, glucose is extremely high and the fluid deficit is large. At cellular level, neurons shrink and brain function slows.",
"Critical HHS. At organ level, the patient may be in coma, with shock and clots forming. At cellular level, thick blood and endothelial injury favour thrombosis."]};
const RS="Insulin, fluids and potassium. Fluids restore volume first, insulin stops ketone production and lowers glucose, and potassium replacement keeps the level safe.";
const vq=(t,q)=>{if(parent!==window)parent.postMessage({vo:t,q:!!q},'*')};
const ph4=()=>p<.25?0:p<.5?1:p<.8?2:3;let vtm=0;
document.head.insertAdjacentHTML('beforeend','<style>.rx li{cursor:pointer}</style>');
$('#types').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;type=b.dataset.t;render();vq(PHM[type][ph4()])});
$('#presets').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;p=b.dataset.p/100;$('#prog').value=b.dataset.p;render();vq(PHM[type][ph4()])});
$('#prog').addEventListener('input',e=>{p=e.target.value/100;render();clearTimeout(vtm);vtm=setTimeout(()=>vq(PHM[type][ph4()]),700)});
$('#rx').addEventListener('click',e=>{rx=!rx;e.currentTarget.setAttribute('aria-pressed',rx);render();vq(RS)});
$('#view').addEventListener('click',e=>{const T=s=>e.target.closest(s);
 if(T('[data-lv]')&&open){lvl=T('[data-lv]').dataset.lv;render();vq(M[open][lvl])}
 else if(T('[data-id]')&&!open){open=T('[data-id]').dataset.id;lvl=null;render();scrollTo(0,0);vq(M[open].org)}
 else if(T('[data-back]')){open=null;lvl=null;render()}
 else if(T('.rx li'))vq(T('.rx li').textContent)});
$('#view').addEventListener('keydown',e=>{const n=e.target.closest('.node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open=n.dataset.id;lvl=null;render();vq(M[open].org)}});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-lab]');if(a&&parent!==window){e.preventDefault();parent.postMessage({lab:a.dataset.lab},'*')}});
render();
</script>
</body></html>
