<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111a">
<title>Echo bay</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#07111a;--fg:#e7f1f4;--muted:#93a8b3;--line:rgba(226,180,138,.35);--warm:#e2b48a;--paper:#f3efe6;--aki:#c45b4a;--hypo:#d7a15a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Figtree,sans-serif;font-size:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:#102028;color:var(--paper);border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
button.on{border-color:var(--warm);color:#fff8ee;background:#2a2118}
a.go{color:var(--warm)}
header{display:flex;gap:10px;align-items:center;padding:10px 12px 0}
header h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;margin:0;letter-spacing:-.03em}
#status{margin:6px 12px 0;color:var(--warm);font-size:14px;line-height:1.35;min-height:1.35em}
.bar{display:flex;gap:8px;overflow:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}
.bar button{flex:none;font-size:14px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px;padding:0 8px 8px}
.panel{background:#0c1822;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;min-width:0}
.panel h2{margin:0;padding:8px 10px 0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--warm);font-weight:650}
#heart{width:100%;height:42dvh;min-height:200px;display:block;touch-action:none}
#heartmsg{position:absolute;inset:36px 12px auto;color:var(--muted);font-size:14px}
.tag{position:absolute;left:8px;right:8px;bottom:8px;margin:0;background:rgba(7,17,26,.88);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;line-height:1.3;pointer-events:none}
.chest-box{position:relative;height:42dvh;min-height:200px;touch-action:none;background:#14202c}
.chest-box > svg{width:100%;height:100%;display:block}
#probe svg{width:40px;height:64px;display:block}
#hint{position:absolute;left:8px;right:8px;top:8px;margin:0;padding:6px 8px;border-radius:10px;background:rgba(7,17,26,.78);color:var(--paper);font-size:13px;line-height:1.3;pointer-events:none}
#hint.hide{opacity:0}
#contact,#probe{position:absolute;pointer-events:none}
#contact{width:28px;height:28px;border-radius:50%;border:2px solid #9fd4ff;box-shadow:0 0 12px rgba(120,190,255,.8);left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);transform:translate(-50%,-50%);opacity:0}
#contact.on{opacity:1}
#probe{width:40px;height:78px;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);transform-origin:50% 92%;transform:translate(-50%,calc(-92% - var(--lift) * 36px)) rotate(calc(var(--spin) * 1deg));transition:none;overflow:visible}
#probe .nib{display:none}
.dials{display:flex;gap:10px;padding:0 10px 8px}
.dials label{flex:1;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dials input{width:100%}
.scan{grid-column:1 / -1;display:flex;flex-direction:column;background:#02060a}
#echo{width:100%;height:26dvh;min-height:160px;display:block}
#ecg{width:100%;height:120px;display:block;background:#06140c;border-top:1px solid rgba(127,212,150,.25)}
.caption{margin:0;padding:6px 10px 8px;color:var(--muted);font-size:13px}
.sheet{padding:4px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-family:Figtree,sans-serif;font-weight:650;font-size:18px;margin:8px 0}
.sheet p{margin:0 0 8px;line-height:1.4}
.choice{display:block;width:100%;text-align:left;border-radius:12px;margin:0 0 8px}
.choice.right{border-color:#7dcea0;background:#10241c}
.choice.wrong{border-color:#c46a6a;background:#241416}
.kicker{margin:0;color:var(--warm);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.note{color:var(--muted);font-size:13px}
#bull{width:min(100%,320px);height:auto;display:block;margin:8px auto;touch-action:manipulation}
#bull path,#bull circle{cursor:pointer;stroke:#07111a;stroke-width:.6}
.ef{width:100%}
@media(min-width:980px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,.95fr)}
  .scan{grid-column:auto;grid-row:1}
  #heart,.chest-box{height:64dvh}
  #echo{height:46dvh}
}
#doors{display:none}
body.doors #doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:calc(100dvh - 72px);perspective:900px}
body.doors #doors button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100dvh - 96px);border-radius:18px;padding:22px 16px;color:#f4fbff;background:
  linear-gradient(180deg, rgba(6,16,28,.2), rgba(4,10,18,.55)),
  url("lab-bg.jpg?v=20261030k") center/cover no-repeat;
  box-shadow:inset 0 0 0 1px rgba(160,220,255,.5), inset 0 0 36px rgba(80,190,230,.22)}
body.doors #doors button[data-door="supply"]{background-position:22% center;animation:doorLeft 1.05s cubic-bezier(.22,.61,.2,1) both}
body.doors #doors button[data-door="sim"]{background-position:78% center;animation:doorRight 1.05s cubic-bezier(.22,.61,.2,1) both}
body.doors #doors b{font-family:Fraunces,Georgia,serif;font-size:clamp(26px,5vw,40px);font-weight:520}
body.doors #doors span{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.35}
@keyframes doorLeft{from{opacity:0;transform:translateX(-120%)}to{opacity:1;transform:none}}
@keyframes doorRight{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  body.doors #doors button[data-door="supply"],body.doors #doors button[data-door="sim"]{animation:none}
}
body.doors .stage,body.doors #tabs,body.doors #lesions,body.doors #phases,body.doors #status,body.doors .sheet{display:none}
body.sim #tabs,body.sim #lesions,body.sim #phases,body.sim .sheet,body.sim .caption,body.sim #ecg,body.supply #echo,body.supply [aria-label="Patient and probe"]{display:none}
body.sim .stage{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
body.sim .scan{grid-column:1;grid-row:1}
body.sim .panel:first-child{display:none}
body.sim #echo,body.sim .chest-box{height:72dvh}
body.supply .stage{display:block}
body.supply #heart{height:46dvh}
body.supply #ecg{height:240px}
@media(max-width:700px){
  body.doors #doors{grid-template-columns:1fr 1fr}
  body.doors #doors button{min-height:calc(100dvh - 96px);padding:14px}
  body.doors #doors b{font-size:clamp(22px,6vw,30px)}
  body.sim .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
</style>
</head>
<body>
<header>
  <button type="button" id="back">Back to ICU</button>
  <h1>Echo bay</h1>
</header>
<section id="doors" aria-label="Echo bay doors">
  <button type="button" data-door="supply"><b>Heart and supply</b><span>Four vessels, the lesion, and the trace.</span></button>
  <button type="button" data-door="sim"><b>Echo simulator</b><span>The finger is the probe. The sector follows it.</span></button>
</section>
<p id="status"></p>
<div class="bar" id="tabs" role="tablist"></div>
<div class="bar" id="lesions" aria-label="Coronary lesion"></div>
<div class="bar" id="phases" aria-label="Timing"></div>
<div class="stage">
  <section class="panel" aria-label="Heart model">
    <h2>Heart</h2>
    <canvas id="heart"></canvas>
    <p id="heartmsg">Opening the heart…</p>
  </section>
  <section class="panel" aria-label="Patient and probe">
    <h2>Patient</h2>
    <div class="chest-box" id="torso">
      <svg class="patient" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Patient lying supine. A finger on the chest is the echo probe.">
        <rect width="100" height="100" fill="#14202c"/>
        <ellipse cx="50" cy="18" rx="10" ry="8.2" fill="#c4a48c"/>
        <path d="M43.2 17 q2.2 1.1 3.6 0 M53.2 17 q2.2 1.1 3.6 0" fill="none" stroke="#5c4638" stroke-width=".7" stroke-linecap="round"/>
        <path d="M49.2 19.4 v2" stroke="#5c4638" stroke-width=".55"/>
        <path d="M47.2 22.6 q2.8 1.2 5.6 0" fill="none" stroke="#8d6b58" stroke-width=".45"/>
        <path d="M44 23 h12 v7 h-12 z" fill="#c4a48c"/>
        <path d="M6 34 C16 22 30 24 38 28 L40 21 h20 l2 7 C70 24 84 22 94 34 L90 80 C72 94 28 94 10 80 Z" fill="#cbb59e"/>
        <path d="M18 31 C30 26 40 30 46 34 M82 31 C70 26 60 30 54 34" fill="none" stroke="#a8927c" stroke-width="1"/>
        <circle id="sh-r" cx="20" cy="30" r="2.1" fill="none" stroke="#e7f6fb" stroke-width=".7"/>
        <text id="sh-r-label" x="8" y="27" fill="#e7f6fb" font-size="3.3" font-family="sans-serif">Right shoulder</text>
        <circle id="sh-l" cx="80" cy="30" r="2.1" fill="none" stroke="#e7f6fb" stroke-width=".7"/>
        <text id="sh-l-label" x="70" y="27" fill="#e7f6fb" font-size="3.3" font-family="sans-serif">Left shoulder</text>
        <line x1="50" y1="27" x2="50" y2="68" stroke="#8d7b68" stroke-width="1.2"/>
        <circle cx="50" cy="69" r="1.2" fill="#6a5848"/>
        <ellipse cx="38" cy="40" rx="1.5" ry="1.1" fill="#b08978"/>
        <ellipse cx="62" cy="40" rx="1.5" ry="1.1" fill="#b08978"/>
        <path d="M22 48 C34 42 44 46 49 52 M78 48 C66 42 56 46 51 52" fill="none" stroke="#b39d88" stroke-width=".7"/>
        <ellipse id="z-para" cx="64" cy="46" rx="12" ry="14" fill="none" stroke="rgba(80,60,40,.45)" stroke-dasharray="1.4 1.1"/>
        <ellipse id="z-apex" cx="76" cy="58" rx="10" ry="8" fill="none" stroke="rgba(80,60,40,.45)" stroke-dasharray="1.4 1.1"/>
        <ellipse id="z-sub" cx="50" cy="76" rx="8" ry="5.5" fill="none" stroke="rgba(80,60,40,.45)" stroke-dasharray="1.4 1.1"/>
        <ellipse id="z-ssn" cx="50" cy="29" rx="6.5" ry="4.2" fill="none" stroke="rgba(80,60,40,.45)" stroke-dasharray="1.4 1.1"/>
        <ellipse id="z-ivc" cx="37" cy="78" rx="7" ry="5" fill="none" stroke="rgba(80,60,40,.45)" stroke-dasharray="1.4 1.1"/>
      </svg>
      <p id="hint">Put a finger on a window. The probe follows it. Circle the finger without lifting and the probe turns with it. Lift on a marker and it stays. Drag it off the body and it lifts away.</p>
      <div id="contact"></div>
      <div id="probe" aria-hidden="true">
        <span class="nib" title="Probe pointer"></span>
        <svg viewBox="0 0 40 78" width="40" height="78">
          <polygon points="20,1 29,16 23,16 23,24 17,24 17,16 11,16" fill="#e2b48a"/>
          <rect x="12" y="24" width="16" height="26" rx="5" fill="#e6edf2" stroke="#7e8c99"/>
          <rect x="16" y="30" width="8" height="6" rx="1.5" fill="#9aabba"/>
          <path d="M8 50 h24 l-4 14 h-16 z" fill="#d5dee6" stroke="#7e8c99"/>
          <rect x="10" y="64" width="20" height="10" rx="3" fill="#b9c9d6" stroke="#6e7e8e"/>
        </svg>
      </div>
    </div>
    <div class="dials">
      <label>Pointer <input id="rot" type="range" min="0" max="359" value="300"></label>
    </div>
  </section>
  <section class="panel scan" aria-label="Simulated echo and ECG">
    <h2 id="viewtitle">Window</h2>
    <canvas id="echo"></canvas>
    <canvas id="ecg"></canvas>
    <p class="caption" id="caption"></p>
  </section>
</div>
<section class="sheet" id="sheet"></section>
<script src="bed-bridge.js"></script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const LV = ["bA","bAS","bIS","bI","bIL","bAL","mA","mAS","mIS","mI","mIL","mAL","aA","aS","aI","aL","apex"];
const LEADS = ["I","II","III","aVR","aVL","aVF","V1","V2","V3","V4","V5","V6","V4R"];
const TABS = [
  ["anatomy","Heart"],["coronary","Supply"]
];
const LESIONS = [
  ["ladP","LAD"],["lcxP","LCx"],["rcaP","RCA"],["lm","Left main"]
];
const PHASES = [["normal","Normal"],["ischaemia","Ischaemia"],["infarct","Infarction"],["recovery","Recovery"]];
const CULPRIT = {
  ladP:["Left coronary artery","Anterior interventricular artery","Septal branches of anterior interventricular artery"],
  ladM:["Anterior interventricular artery","Septal branches of anterior interventricular artery"],
  ladD:["Anterior interventricular artery"],
  lcxP:["Left coronary artery","Circumflex artery of heart"],
  lcxD:["Circumflex artery of heart"],
  rcaP:["Right coronary artery","Right inferolateral branch of right coronary artery"],
  rcaD:["Right coronary artery","Right inferolateral branch of right coronary artery"],
  lm:["Left coronary artery","Anterior interventricular artery","Circumflex artery of heart","Septal branches of anterior interventricular artery"],
  multi:["Left coronary artery","Anterior interventricular artery","Circumflex artery of heart","Right coronary artery"]
};
const ZONE_OF = {
  anterior:["bA","mA","aA"], septal:["bAS","bIS","mAS","mIS","aS"], inferior:["bI","mI","aI"],
  lateral:["bAL","bIL","mAL","mIL","aL"], apex:["apex"]
};
const VIEW = {
  off:{name:"Off the window", mark:"", note:"The footprint is not on a standard window.", see:[]},
  plax:{name:"Parasternal long axis", mark:"pointer 10 o'clock, right shoulder", note:"Left parasternal border, 3rd–4th intercostal space. Pointer to the right shoulder, about 10 o'clock.", see:["Left ventricle","Left atrium","Mitral valve","Aortic valve","Aortic root","Right ventricular outflow"]},
  "psax-av":{name:"Parasternal short axis, aortic valve", mark:"pointer 1–2 o'clock, left shoulder", note:"Same parasternal position as the long axis. Pointer to the left shoulder, about 1–2 o'clock.", see:["Aortic valve","Three cusps","Right ventricular outflow","Pulmonary valve","Tricuspid valve"]},
  "psax-mv":{name:"Parasternal short axis, mitral valve", mark:"pointer to the left shoulder", note:"From the aortic level, angle toward the base of the left ventricle. Pointer stays toward the left shoulder.", see:["Mitral valve, fish-mouth","Basal left ventricle"]},
  "psax-pap":{name:"Parasternal short axis, papillary muscles", mark:"pointer to the left shoulder", note:"Tilt toward the mid left ventricle. Pointer stays toward the left shoulder.", see:["Left ventricle","Right ventricle","Anterolateral papillary muscle","Posteromedial papillary muscle"]},
  "psax-apex":{name:"Parasternal short axis, apex", mark:"pointer to the left shoulder", note:"Tilt further toward the apex. Pointer stays toward the left shoulder.", see:["Left ventricular apical segments"]},
  a4c:{name:"Apical four-chamber", mark:"pointer 3 o'clock, patient's left", note:"Probe on the cardiac apex, usually the 5th intercostal space. Pointer to the patient's left, about 3 o'clock.", see:["Both atria","Both ventricles","Mitral valve","Tricuspid valve"]},
  a5c:{name:"Apical five-chamber", mark:"pointer 3 o'clock, rocked anteriorly", note:"Same apical position as the four-chamber, tilted anteriorly. Pointer about 3 o'clock.", see:["Four chambers","Left ventricular outflow","Aortic valve"]},
  a2c:{name:"Apical two-chamber", mark:"pointer 12 o'clock", note:"From the four-chamber, rotate about 60° counterclockwise. Pointer about 12 o'clock.", see:["Left atrium","Left ventricle","Anterior wall","Inferior wall"]},
  a3c:{name:"Apical three-chamber", mark:"pointer 10 o'clock, right shoulder", note:"Rotate further from the two-chamber. Pointer about 10 o'clock.", see:["Left ventricle","Left atrium","Mitral valve","Aortic valve","Left ventricular outflow"]},
  sc4:{name:"Subcostal four-chamber", mark:"pointer 3 o'clock, patient's left", note:"Probe below the xiphoid. Pointer to the patient's left, about 3 o'clock.", see:["All four chambers","Interatrial septum","Interventricular septum","Pericardium"]},
  ivc:{name:"Subcostal inferior vena cava", mark:"pointer 12 o'clock", note:"From under the xiphoid, rotate toward the patient's right. Pointer about 12 o'clock. Use it for diameter and respiratory variation.", see:["Inferior vena cava","Hepatic vein junction","Right atrium"]},
  ssn:{name:"Suprasternal long axis", mark:"pointer to the left shoulder", note:"Probe in the suprasternal notch. Pointer toward the left shoulder.", see:["Aortic arch","Ascending aorta","Descending aorta","Arch branches"]}
};
const PRESET = {
  plax:{x:63,y:43,spin:300},
  "psax-av":{x:63,y:40,spin:45},
  "psax-mv":{x:63,y:45,spin:45},
  "psax-pap":{x:64,y:49,spin:45},
  "psax-apex":{x:66,y:53,spin:45},
  a4c:{x:76,y:58,spin:90},
  a5c:{x:76,y:53,spin:90},
  a2c:{x:76,y:58,spin:0},
  a3c:{x:76,y:58,spin:300},
  sc4:{x:50,y:76,spin:90},
  ivc:{x:37,y:78,spin:0},
  ssn:{x:50,y:29,spin:45}
};
const INFO = {
  "Left ventricle":"Thick-walled systemic pump. Inlet is the mitral valve, outlet the aortic valve.",
  "Right ventricle":"Thin-walled crescent against the sternum. Fails in a proximal right coronary occlusion and in a large pulmonary embolus.",
  "Left atrium":"Pulmonary veins enter here. The appendage is not a separate mesh.",
  "Right atrium":"Receives both venae cavae and the coronary sinus.",
  "Anterior interventricular artery":"The left anterior descending artery, in the anterior interventricular groove. Anterior wall, anterior septum and often the apex.",
  "Circumflex artery of heart":"In the left atrioventricular groove. Lateral wall. In a left-dominant circulation it also reaches the inferior wall.",
  "Right coronary artery":"In the right atrioventricular groove. Right ventricle, and in a right-dominant heart the inferior wall and usually the atrioventricular node.",
  "Left coronary artery":"Short left main, from the left coronary sinus, before it divides.",
  "Superior vena cava":"Enters the roof of the right atrium. Central lines aim at this junction.",
  "Ascending aorta":"Coronary ostia arise in the sinuses just above the aortic valve."
};

const state = {
  tab:"anatomy", lesion:"none", phase:"normal", dominance:"right", custom:false, globalOn:false, ef:55,
  wall:Object.fromEntries(LV.map(function(id){ return [id,"normal"]; })),
  rv:false, effusion:false, alternans:false, lowQrs:false,
  probe:{down:false,x:63,y:43,rot:300,tilt:40,lift:1,spin:300,twistBase:null,docked:false},
  view:"plax", score:0, asked:0, caseId:null, qIx:0, locked:false
};
const mode = new URLSearchParams(location.search).get("mode") || "";
document.body.classList.add(mode==="sim" ? "sim" : mode==="supply" ? "supply" : "doors");
try{
  const saved = JSON.parse(sessionStorage.getItem("echoState") || "null");
  if(saved && saved.lesion) state.lesion = saved.lesion;
  if(saved && saved.phase) state.phase = saved.phase;
  if(saved && saved.dominance) state.dominance = saved.dominance;
}catch(err){}
function saveEcho(){
  try{ sessionStorage.setItem("echoState", JSON.stringify({lesion:state.lesion, phase:state.phase, dominance:state.dominance})); }catch(err){}
}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return "&#"+c.charCodeAt(0)+";"; }); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function femaleVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  const named = /female|samantha|victoria|karen|moira|fiona|tessa|serena|zira|susan|veena|heera|sonia|catherine|allison|ava|nicky|libby/i;
  const en = voices.filter(function(v){ return /^en/i.test(v.lang || ""); });
  return en.find(function(v){ return named.test((v.name||"")+" "+(v.voiceURI||"")); })
    || en.find(function(v){ return /en-GB|en-IN|en-AU/i.test(v.lang) && !/male/i.test(v.name||""); })
    || null;
}
function speakLine(text){
  if(!text || !window.speechSynthesis) return;
  const say = function(){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = femaleVoice();
    u.lang = voice && voice.lang ? voice.lang : "en-GB";
    u.rate = 0.92;
    u.pitch = 1.06;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if(!speechSynthesis.getVoices().length){
    const once = function(){ speechSynthesis.removeEventListener("voiceschanged", once); say(); };
    speechSynthesis.addEventListener("voiceschanged", once);
    speechSynthesis.getVoices();
    return;
  }
  say();
}
function segmentsFor(id){
  const dom = state.dominance;
  const base = {
    ladP:["bA","bAS","mA","mAS","aA","aS","aI","aL","apex"],
    ladM:["mA","mAS","aA","aS","aI","apex"],
    ladD:["aA","aS","apex"],
    lcxP:["bAL","bIL","mAL","mIL","aL"],
    lcxD:["mAL","mIL","aL"],
    rcaP: dom==="left" ? [] : ["bI","bIS","mI","mIS","aI"],
    rcaD: dom==="left" ? [] : ["bI","mI","aI"],
    multi:["bA","bAS","bI","bAL","mA","mI","mAL","aA","apex"]
  };
  if(id==="lm") return Array.from(new Set(segmentsFor("ladP").concat(segmentsFor("lcxP"))));
  let list = (base[id] || []).slice();
  if(dom==="left" && (id==="lcxP" || id==="lcxD")) list = list.concat(["bI","bIS","mI","mIS","aI"]);
  return Array.from(new Set(list));
}
function gradeForPhase(){
  if(state.phase==="ischaemia") return "hypo";
  if(state.phase==="infarct") return "aki";
  if(state.phase==="recovery") return "hypo";
  return "normal";
}
function applyWalls(){
  if(state.custom) return;
  LV.forEach(function(id){ state.wall[id] = "normal"; });
  state.rv = false;
  if(state.effusion && state.caseId==="tamp") return;
  if(state.globalOn){
    const g = state.ef>=50 ? "normal" : state.ef>=35 ? "hypo" : "aki";
    LV.forEach(function(id){ state.wall[id] = g; });
    return;
  }
  if(state.lesion==="none" || state.phase==="normal") return;

const WINDOWS = [
  {id:"ssn", x:50, y:29, r:8},
  {id:"para", x:63, y:44, r:15},
  {id:"apex", x:76, y:58, r:12},
  {id:"sub", x:50, y:76, r:10},
  {id:"ivc", x:37, y:78, r:9}
];
function nearestWindow(x, y){
  let best = null, bd = 1e9;
  WINDOWS.forEach(function(z){

  const p = state.probe;

  if(!onBody(p.x, p.y)) return "off";
  const best = nearestWindow(p.x, p.y);
  if(!best) return "off";
  const s = normDeg(p.spin);
  if(best.id === "ssn") return "ssn";
  if(best.id === "ivc") return "ivc";
  if(best.id === "sub") return angDist(s, 90) <= 55 ? "sc4" : "ivc";
  if(best.id === "apex"){
    if(angDist(s, 90) <= 38) return p.y < 56 ? "a5c" : "a4c";
    if(angDist(s, 0) <= 42 || angDist(s, 360) <= 42) return "a2c";
    if(angDist(s, 300) <= 42) return "a3c";
    const opts = [[90, p.y < 56 ? "a5c" : "a4c"], [0, "a2c"], [300, "a3c"]];
    opts.sort(function(a, b){ return angDist(s, a[0]) - angDist(s, b[0]); });

  }

    ladM:"mid and apical anterior wall and septum",
    ladD:"apex",

    lcxD:"apical lateral wall",
    rcaP: dom ? "right ventricle" : "inferior wall and right ventricle",

  const h = Math.max(2, Math.floor(r.height*dpr));

    const ang = a0 + (a1-a0)*s[0];
    const rad = 8 + s[1]*R*0.92;
    ctx.fillStyle = "rgba(186,196,190,"+(0.04+s[2]*0.12*(0.65+0.35*Math.sin(flick*6+s[2]*8)))+")";

    const lx = lb.length > 3 ? ox + (lb[3] / 100) * dw : ax;
    const ly = lb.length > 4 ? oy + (lb[4] / 100) * dh : ay;
    if(lb.length > 3){

function drawECG(){

  ctx.fillStyle = "#06140c";

  const spec = ecgSpec();
  const show = ["I","II","III","aVR","aVL","aVF","V1","V2","V3","V4","V5","V6"];
  if(state.lesion==="rcaP" && state.dominance==="right") show[11] = "V4R";
  const cols = 4, rows = 3;

  const alt = state.alternans && beatN%2 ? 0.55 : 1;
  show.forEach(function(id, i){

function drawLead(ctx, x, y, w, h, id, spec, alt){

  ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x+w, base); ctx.stroke();
  ctx.fillStyle = "#b7e0c4";
  ctx.font = "11px Figtree, sans-serif";
  ctx.fillText(id, x, y+11);
  ctx.beginPath();
  ctx.strokeStyle = Math.abs(spec.st||0)>0.4 ? "#d7e38a" : "#7fd496";
  ctx.lineWidth = 1.6;
  const st = (spec.st||0) * h * 0.28;

    [0,0],[0.14,0],[0.20,-0.15],[0.26,0],[0.34, spec.q ? Math.min(1.5, 0.4+spec.q*0.5) : 0],
    [0.44, spec.q ? -0.45 : -1],[0.52,0.4],[0.58, -st/(amp||1)],
    [0.78, -st/(amp||1)],[0.88, -st/(amp||1) - 0.22*(spec.t||1)],[1, -st/(amp||1)]

    const py = base + p[1]*amp;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);

      const a0 = (i-0.5)*Math.PI/3, a1 = (i+0.5)*Math.PI/3;
      const g = state.wall[id] || "normal";
      const fill = g==="aki"?"#a33b3b":g==="hypo"?"#c4924a":g==="dys"?"#6d4c92":"#1c3a36";
      paths += '<path data-seg="'+id+'" d="'+wedge(ring[1], ring[2], a0, a1)+'" fill="'+fill+'"><title>'+id+" "+g+'</title></path>';
    });
  });
  const g = state.wall.apex || "normal";
  const fill = g==="aki"?"#a33b3b":g==="hypo"?"#c4924a":g==="dys"?"#6d4c92":"#1c3a36";
  paths += '<circle data-seg="apex" cx="50" cy="50" r="11" fill="'+fill+'"><title>apex '+g+'</title></circle>';
  return '<svg id="bull" viewBox="0 0 100 100" role="img" aria-label="Seventeen segment model. Tap a segment to change its motion.">'+paths+"</svg>";
}
function likelyTerritory(){
  const bad = LV.filter(function(id){ return state.wall[id]!=="normal"; });
  if(!bad.length) return "No regional abnormality is set.";
  const ant = bad.filter(function(id){ return /A$|AS|apex|aS|aA|aI|aL/.test(id) && !/AL|IL|IS|bI|mI/.test(id); }).length;
  const inf = bad.filter(function(id){ return /I$|IS/.test(id); }).length;
  const lat = bad.filter(function(id){ return /AL|IL/.test(id); }).length;
  if(ant>=inf && ant>=lat) return "These segments are often in left anterior descending territory. Dominance and the diagonal and septal branches change the edges.";
  if(inf>=lat) return "These segments are often inferior, usually right coronary in a right-dominant heart, and circumflex if the circulation is left dominant.";
  return "These segments are often lateral, in circumflex territory. A posterior wall can be silent on the standard leads.";
}
const CASES = [
  {id:"ant", title:"Crushing pain, pressure 88/60", stem:"Two hours of pain. Place the probe on the apex and the left sternal border, then read the trace.",
    setup:function(){ state.dominance="right"; state.globalOn=false; state.custom=false; state.effusion=false; state.alternans=false; state.lowQrs=false; state.lesion="ladP"; state.phase="infarct"; applyWalls(); jump("a4c"); },
    questions:[
      {q:"Which pattern fits this trace and the anterior septum?", options:["Proximal left anterior descending occlusion","Isolated posterior descending occlusion","Coronary sinus thrombosis","A normal conducting system only"], answer:0, why:"ST elevation across the anterior leads with an akinetic anterior septum and apex is the proximal left anterior descending territory until an angiogram says otherwise."},
      {q:"On the apical four-chamber view, which wall faces the septum?", options:["The lateral wall","The inferior wall only","The right atrial appendage","The moderator band"], answer:0, why:"The four-chamber view puts the septum and the lateral wall on opposite sides of the left ventricle."},
      {q:"The apex is moving outward in systole. What is that called?", options:["Hyperkinesia","Dyskinesia","A normal twist","Restrictive filling"], answer:1, why:"Outward motion in systole is dyskinesia. It is common at an infarcted apex and it is not specific to coronary disease by itself."}
    ]},
  {id:"inf", title:"Inferior pain, clear lungs, low pressure", stem:"ST change in the inferior leads. The lungs are clear and the pressure falls when he sits up.",
    setup:function(){ state.dominance="right"; state.globalOn=false; state.custom=false; state.effusion=false; state.alternans=false; state.lowQrs=false; state.lesion="rcaP"; state.phase="infarct"; applyWalls(); jump("a2c"); },
    questions:[
      {q:"Which chamber are you protecting when the lungs are clear and the pressure is low?", options:["The left atrium","The right ventricle","The descending aorta","The coronary sinus"], answer:1, why:"A proximal right coronary occlusion can infarct the right ventricle. Preload keeps the left heart filled. This is not a licence to give a fixed fluid volume."},
      {q:"Which extra lead looks at the right ventricle?", options:["V4R","aVL alone","V7 only","The coronary sinus electrogram"], answer:0, why:"V4R is a right-sided chest lead. Elevation there supports right ventricular infarction."},
      {q:"In a left-dominant circulation, the same inferior wall is more often supplied by which artery?", options:["The circumflex","The coronary sinus","The internal thoracic artery","A diagonal branch only"], answer:0, why:"Left dominance means the posterior descending artery continues from the circumflex, so the inferior wall is not a right coronary territory."}
    ]},
  {id:"lat", title:"Lateral discomfort, a quiet ECG", stem:"Pain is lateral. The standard trace is easy to under-call. Compare a right-dominant circumflex lesion.",
    setup:function(){ state.dominance="right"; state.globalOn=false; state.custom=false; state.effusion=false; state.alternans=false; state.lowQrs=false; state.lesion="lcxP"; state.phase="ischaemia"; applyWalls(); jump("a4c"); },
    questions:[
      {q:"Which leads look at the lateral wall?", options:["I, aVL, V5 and V6","V1 and V2 only","aVR alone","The inferior vena cava"], answer:0, why:"The high lateral wall is I and aVL. The low lateral wall is V5 and V6. Posterior injury can instead depress V1 to V3."},
      {q:"A wall-motion abnormality in this territory proves an acute occlusion.", options:["True","False"], answer:1, why:"Hypokinesia also follows myocarditis, pacing, a bundle branch block, a scar, or a cardiomyopathy. The trace and the history decide the timing."}
    ]},
  {id:"glob", title:"A dilated pump", stem:"No single artery lights up. Every left ventricular segment is weak. Set the illustrative ejection fraction and watch the short-axis ring.",
    setup:function(){ state.lesion="none"; state.custom=false; state.effusion=false; state.alternans=false; state.lowQrs=false; state.globalOn=true; state.ef=25; state.phase="ischaemia"; applyWalls(); jump("psax-pap"); },
    questions:[
      {q:"Global hypokinesia is specific for left-main occlusion.", options:["True","False"], answer:1, why:"A globally weak ventricle is also seen in dilated cardiomyopathy, myocarditis, sepsis and a tachyarrhythmia. Multivessel disease can look the same."},
      {q:"Which view shows every mid-ventricular segment in one plane?", options:["Parasternal short axis at the papillary muscles","Inferior vena cava view","Suprasternal notch only","A single parasternal long axis"], answer:0, why:"The papillary short-axis ring is the mid segments. The long axis shows only two walls."}
    ]},
  {id:"tamp", title:"Distant sounds, a rising venous pressure", stem:"After a procedure the pressure falls, the neck veins rise, and the heart sounds are quiet. Put the probe under the xiphoid.",
    setup:function(){ state.lesion="none"; state.custom=false; state.globalOn=false; state.phase="normal"; state.effusion=true; state.alternans=true; state.lowQrs=true; state.rv=false; applyWalls(); jump("sc4"); },
    questions:[
      {q:"What should the subcostal view show if this is tamponade?", options:["A layer of fluid around the heart and a plethoric inferior vena cava","An akinetic apex only","A vegetation on the aortic valve as the only finding","A collapsed descending aorta"], answer:0, why:"Fluid in the pericardial space plus a full inferior vena cava that barely varies with breathing is the ultrasound side of tamponade. The diagnosis is clinical as well."},
      {q:"Electrical alternans on the trace means what?", options:["The QRS changes height as the heart swings in fluid","The left anterior descending has reopened","The right coronary is spared","The ventricle is hypertrophied"], answer:0, why:"Beat-to-beat change in QRS size is the electrical mark of a swinging heart. It is not required to make the diagnosis."}
    ]}
];
function teaching(){
  const meta = VIEW[state.view] || VIEW.off;
  const see = meta.see.length ? " Visible structures: "+meta.see.join(", ")+"." : "";
  if(state.tab==="probe"){
    return "<p class='kicker'>Probe</p><h3 id='probe-name'>"+esc(meta.name)+"</h3><p id='probe-note'>"+esc(meta.note+see)+"</p>"+
      "<p>Put a finger on a dashed window. The probe comes to the finger and follows it. Circle the finger without lifting and the probe turns through the same angle, and the window changes. Lift on a marker and the probe stays. Drag it off the body and it lifts away.</p>"+
      "<div class='bar' style='padding-left:0'>"+Object.keys(PRESET).map(function(id){
        return "<button type='button' data-jump='"+id+"'>"+esc(VIEW[id].name)+"</button>";
      }).join("")+"</div>"+
      "<p class='note' id='probe-find'>"+esc(findingLine())+"</p>";
  }
  if(state.tab==="anatomy"){
    const name = selected ? selected.name : "Heart";
    const line = selected ? (INFO[selected.name] || "Tap another mesh. Septa, chordae, the nodes and the pericardium are not separate meshes in this atlas.") : "Drag to turn the heart. Tap a chamber, valve or artery.";
    return "<p class='kicker'>Anatomy</p><h3>"+esc(name)+"</h3><p>"+esc(line)+"</p><p class='note'>Coronary glow follows the selected lesion. Amber and red spheres mark hypokinetic and akinetic muscle. They are teaching markers, not separate muscle meshes.</p>";
  }
  if(state.tab==="coronary"){
    return "<p class='kicker'>Coronary supply</p><h3>"+esc(lesionName())+"</h3><p>"+esc(coronaryText())+"</p><p>Dominance is <button type='button' id='dom'>"+(state.dominance==="right"?"right — tap for left":"left — tap for right")+"</button></p>";
  }
  if(state.tab==="chambers"){
    return "<p class='kicker'>Chambers</p><h3>Four chambers</h3><p>Right atrium, right ventricle, left atrium, left ventricle. The septa are the shared walls. Place the probe for an apical four-chamber or a subcostal four-chamber and the labels follow.</p>";
  }
  if(state.tab==="valves"){
    return "<p class='kicker'>Valves</p><h3>What the atlas actually has</h3><p>Aortic and pulmonary leaflets are partly segmented, with some mitral and tricuspid leaflets and the papillary muscles. Chordae, the anterior mitral leaflet and a full pericardium are not separate meshes. On the sector, the mitral leaflets open in diastole and the aortic leaflets open in systole.</p>";
  }
  if(state.tab==="global"){
    return "<p class='kicker'>Global systolic function</p><h3>Illustrative ejection fraction "+illustrativeEf()+"%</h3>"+
      "<input class='ef' id='ef' type='range' min='15' max='70' value='"+state.ef+"'>"+
      "<p>Every segment shares one grade. Contexts include a dilated cardiomyopathy, myocarditis, sepsis and diffuse ischaemia. A single coronary occlusion is a poor explanation for a uniformly weak ventricle unless the territory is huge, as with a left main or a proximal anterior descending lesion in a small heart.</p>";
  }
  if(state.tab==="rwma"){
    return "<p class='kicker'>Regional wall motion</p><h3>Seventeen segments</h3>"+bullseye()+
      "<p>Tap a segment. It cycles through normal, hypokinesia, akinesia and dyskinesia. "+esc(likelyTerritory())+"</p><p class='note'>Wall motion is not specific for coronary occlusion.</p>";
  }
  if(state.tab==="ecg"){
    return "<p class='kicker'>ECG</p><h3>"+esc(lesionName())+", "+esc(phaseName().toLowerCase())+"</h3><p>"+esc(ecgText())+"</p><p class='note'>A 12-lead teaching trace cannot name the occluded artery by itself. Collateral flow, the level of the lesion, dominance and the time from onset all move the ST segment.</p>";
  }
  return caseSheet();
}
function coronaryText(){
  const id = state.lesion;
  const dom = state.dominance==="right" ? "Right-dominant pattern: the posterior descending artery continues from the right coronary artery." : "Left-dominant pattern: the inferior wall is drawn with the circumflex, and a right coronary lesion is limited to the right ventricle.";
  const map = {
    none:"Select a lesion. The artery lights on the heart, the muscle markers follow the phase, and the trace changes with it.",
    ladP:"Proximal anterior descending. Anterior wall, anterior septum and apex. The trace often elevates in V1 to V4, with reciprocal change inferiorly when the territory is large.",
    ladM:"Mid anterior descending. The basal anterior wall is spared more often than in a proximal occlusion. V2 to V4 still move.",
    ladD:"Distal anterior descending. Apical segments. The basal walls can still thicken.",
    lcxP:"Proximal circumflex. Lateral wall, and a posterior territory that may only depress V1 to V3. "+(state.dominance==="left"?" In this left-dominant setting the inferior wall is included.":""),
    lcxD:"More distal circumflex. A smaller lateral territory.",
    rcaP:"Proximal right coronary. Inferior left ventricle in a right-dominant heart, plus the right ventricle. V4R is the right-sided lead.",
    rcaD:"Distal right coronary. Inferior wall with less of the right ventricular free wall than a proximal occlusion.",
    lm:"Left main. A large share of the left ventricle. The familiar clue is ST elevation in aVR with depression across many other leads. That pattern is also seen in severe triple-vessel disease and in a proximal anterior descending lesion.",
    multi:"Several territories at once. The trace is often depression rather than one territorial elevation, and the ventricle can look globally weak."
  };
  return (map[id]||"")+" "+dom;
}
function ecgText(){
  if(state.caseId==="tamp") return "Low voltage and electrical alternans. The QRS height alternates while the heart swings in fluid. This is not an occlusion pattern.";
  if(state.globalOn) return "Diffuse ST depression and T-wave inversion when the illustrative ejection fraction is low. There is no single territorial elevation.";
  if(state.phase==="normal") return "Normal phase. The artery can still be selected, but the ST segment is drawn on the baseline and the muscle thickens.";
  if(state.phase==="ischaemia") return "Ischaemia is drawn as ST depression or T-wave inversion in the leads that face the territory, not as ST elevation.";
  if(state.phase==="recovery") return "Recovery leaves Q waves and inverted T waves. The ST segment has mostly settled. The wall may stay hypokinetic.";
  if(state.lesion==="ladP"||state.lesion==="ladM") return "Anterior infarction. ST elevation in V1 to V4, with reciprocal depression in III and aVF when the proximal vessel is occluded.";
  if(state.lesion==="ladD") return "A smaller anterior elevation, centred on V3 to V5, sparing V1 if the septum’s basal half is not in the territory.";
  if(state.lesion==="lcxP"||state.lesion==="lcxD") return "Lateral elevation in I, aVL, V5 and V6. Depression in V1 to V3 is the posterior mirror, not a separate non-ST syndrome.";
  if(state.lesion==="rcaP") return "Inferior elevation in II, III and aVF, usually taller in III than in II when the right coronary is the culprit. V4R rises if the right ventricle is in the territory. Reciprocal depression sits in I and aVL.";
  if(state.lesion==="rcaD") return "Inferior elevation without the same V4R rise, because the right ventricular branches have already left the artery.";
  if(state.lesion==="lm") return "Elevation in aVR and depression almost everywhere else. Do not read this as a map that only the left main can produce.";
  if(state.lesion==="multi") return "Widespread depression. No single territorial elevation.";
  return "Set a lesion and a phase. The trace follows that teaching pattern.";
}
function findingLine(){
  const v = state.view;
  if(state.effusion && (v==="sc4" || v==="a4c" || v==="plax" || v==="ivc")) return "Fluid is drawn around the heart. The inferior vena cava is wide.";
  if(state.globalOn && v.indexOf("psax")===0) return "The whole ring thickens poorly. Illustrative ejection fraction "+illustrativeEf()+"%.";
  if(state.phase==="normal" || state.lesion==="none") return "Walls thicken together. Change the lesion or the phase to see a regional abnormality.";
  if(v==="a4c" && (state.lesion==="ladP"||state.lesion==="ladM")) return "The septum is the weak wall in this apical four-chamber view.";
  if(v==="a4c" && state.lesion.indexOf("lcx")===0) return "The lateral wall is the weak wall in this apical four-chamber view.";
  if(v==="a2c" && state.lesion.indexOf("rca")===0) return "The inferior wall is the weak wall in this apical two-chamber view.";
  if(v==="plax" && state.lesion.indexOf("lad")===0) return "The septum, not the inferolateral wall, is the weak side in this long-axis view.";
  if(v.indexOf("psax")===0) return "Segments in the chosen territory thicken less than their neighbours.";
  return "This window may only show part of the territory. Move the probe if the abnormal wall is not in frame.";
}
function caseSheet(){
  if(!state.caseId){
    return "<p class='kicker'>Cases</p><h3>Choose a case</h3>"+CASES.map(function(item){
      return "<button type='button' class='choice' data-case='"+item.id+"'>"+esc(item.title)+"</button>";
    }).join("")+"<p class='note'>Score "+state.score+" of "+state.asked+".</p>";
  }
  const item = CASES.find(function(row){ return row.id===state.caseId; });
  const q = item.questions[state.qIx];
  if(!q){
    return "<p class='kicker'>Case complete</p><h3>"+esc(item.title)+"</h3><p>Score "+state.score+" of "+state.asked+".</p><button type='button' id='more'>Another case</button>";
  }
  return "<p class='kicker'>Case "+(CASES.indexOf(item)+1)+" of "+CASES.length+"</p><h3>"+esc(q.q)+"</h3><p>"+esc(item.stem)+"</p>"+
    q.options.map(function(opt,i){ return "<button type='button' class='choice' data-i='"+i+"'>"+esc(opt)+"</button>"; }).join("")+
    "<p id='why'></p>";
}
function syncProbeCopy(){
  const meta = VIEW[state.view] || VIEW.off;
  const name = document.getElementById("probe-name");
  if(name) name.textContent = meta.mark ? meta.name+" · "+meta.mark : meta.name;
  const note = document.getElementById("probe-note");
  if(note){
    const see = meta.see.length ? " Visible structures: "+meta.see.join(", ")+"." : "";
    note.textContent = meta.note+see;
  }
  const find = document.getElementById("probe-find");
  if(find) find.textContent = findingLine();
  const cap = document.getElementById("caption");
  if(cap) cap.textContent = meta.note;
}
function renderSheet(){
  const sheet = document.getElementById("sheet");
  if(state.tab==="global" && document.activeElement && document.activeElement.id==="ef"){
    const head = sheet.querySelector("h3");
    if(head) head.textContent = "Illustrative ejection fraction "+illustrativeEf()+"%";
    return;
  }
  sheet.innerHTML = teaching();
  sheet.querySelectorAll("[data-jump]").forEach(function(btn){
    btn.onclick = function(){ jump(btn.getAttribute("data-jump")); };
  });
  sheet.querySelectorAll("[data-seg]").forEach(function(node){
    node.addEventListener("click", function(){ cycleSeg(node.getAttribute("data-seg")); });
  });
  const dom = document.getElementById("dom");
  if(dom) dom.onclick = function(){ state.dominance = state.dominance==="right"?"left":"right"; if(!state.custom) applyWalls(); paintHeart(); renderSheet(); paintStatus(); };
  const ef = document.getElementById("ef");
  if(ef) ef.oninput = function(){ state.globalOn=true; state.lesion="none"; state.custom=false; state.ef=Number(ef.value); applyWalls(); paintHeart(); paintStatus(); document.querySelector(".sheet h3").textContent = "Illustrative ejection fraction "+illustrativeEf()+"%"; };
  sheet.querySelectorAll("[data-case]").forEach(function(btn){
    btn.onclick = function(){ openCase(btn.getAttribute("data-case")); };
  });
  const more = document.getElementById("more");
  if(more) more.onclick = function(){ state.caseId=null; renderSheet(); };
  if(state.tab==="cases" && state.caseId){
    const item = CASES.find(function(row){ return row.id===state.caseId; });
    const q = item && item.questions[state.qIx];
    if(q && !state.locked) speakLine(q.q);
    sheet.querySelectorAll(".choice[data-i]").forEach(function(btn){
      btn.onclick = function(){ answerCase(Number(btn.getAttribute("data-i"))); };
    });
  }
  const cap = document.getElementById("caption");
  cap.textContent = (VIEW[state.view]||VIEW.off).note;
}
function openCase(id){
  const item = CASES.find(function(row){ return row.id===id; });
  if(!item) return;
  state.caseId = id;
  state.qIx = 0;
  state.locked = false;
  item.setup();
  paintHeart();
  paintTabs();
  paintStatus();
  renderSheet();
}
function answerCase(i){
  if(state.locked) return;
  const item = CASES.find(function(row){ return row.id===state.caseId; });
  const q = item.questions[state.qIx];
  state.locked = true;
  state.asked += 1;
  const right = i===q.answer;
  if(right) state.score += 1;
  document.querySelectorAll(".choice[data-i]").forEach(function(btn){
    const n = Number(btn.getAttribute("data-i"));
    btn.disabled = true;
    if(n===q.answer) btn.classList.add("right");
    else if(n===i) btn.classList.add("wrong");
  });
  const line = right ? "Correct. "+q.why : "That is incorrect. The correct answer is "+q.options[q.answer]+". "+q.why;
  document.getElementById("why").textContent = line;
  speakLine(line);
  setTimeout(function(){ state.qIx += 1; state.locked=false; renderSheet(); }, 1600);
}
let echoFrame = 0;
function releaseGraphics(){
  if(echoFrame) cancelAnimationFrame(echoFrame);
  echoFrame = 0;
  if(renderer){
    try{ renderer.dispose(); renderer.forceContextLoss(); }catch(err){}
    renderer = null;
  }
}
document.getElementById("back").onclick = function(){
  releaseGraphics();
  if(mode){ location.href = "echo-lab.html?v=20261031r"; return; }
  try{
    if(window.parent && window.parent!==window && typeof window.parent.returnToIcu==="function"){
      window.parent.returnToIcu();
      return;
    }
  }catch(err){}
  location.href = "index.html";
};
document.getElementById("doors").onclick = function(event){
  const btn = event.target.closest("[data-door]");
  if(!btn) return;
  location.href = "echo-lab.html?mode="+btn.getAttribute("data-door")+"&v=20261031r";
};
document.getElementById("tabs").innerHTML = TABS.map(function(tab){
  return "<button type='button' data-tab='"+tab[0]+"'>"+tab[1]+"</button>";
}).join("");
document.getElementById("tabs").onclick = function(event){
  const btn = event.target.closest("[data-tab]");
  if(!btn) return;
  state.tab = btn.getAttribute("data-tab");
  if(state.tab==="global"){ state.globalOn=true; state.lesion="none"; state.custom=false; applyWalls(); }
  if(state.tab==="rwma"){ state.custom=true; }
  paintHeart(); paintTabs(); renderSheet();
};
document.getElementById("lesions").innerHTML = LESIONS.map(function(row){
  return "<button type='button' data-lesion='"+row[0]+"'>"+row[1]+"</button>";
}).join("");
document.getElementById("lesions").onclick = function(event){
  const btn = event.target.closest("[data-lesion]");
  if(!btn) return;
  setLesion(btn.getAttribute("data-lesion"));
};
document.getElementById("phases").innerHTML = PHASES.map(function(row){
  return "<button type='button' data-phase='"+row[0]+"'>"+row[1]+"</button>";
}).join("");
document.getElementById("phases").onclick = function(event){
  const btn = event.target.closest("[data-phase]");
  if(!btn) return;
  setPhase(btn.getAttribute("data-phase"));
};
applyWalls();
paintProbe();
paintTabs();
paintStatus();
if(mode) renderSheet();
function loop(){
  if(renderer && controls){
    controls.update();
    renderer.render(scene, camera);
  }
  if(mode==="sim") drawEcho();
  if(mode==="supply") drawECG();
  if(mode) echoFrame = requestAnimationFrame(loop);
}
if(mode) echoFrame = requestAnimationFrame(loop);
window.addEventListener("pagehide", releaseGraphics);
</script>
