<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sodium correction</title>
<style>
  :root{--ink:#0f172a;--muted:#475569;--bg:#e8eef6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px;background:linear-gradient(90deg,#0f4c81,#0e7490);color:#fff}
  h1{margin:0;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}
  header p{margin:2px 0 0;font-size:13px;color:#dbeafe}
  #limitBadge{background:#fff;color:#0f4c81;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
  main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
  @media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0f4c81}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;color:#334155}
  input,select{width:100%;font-size:18px;font-weight:700;padding:8px;border:2px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px}
  #target{border-color:#059669;background:#ecfdf5}
  input[type=range]{padding:0;height:32px;accent-color:#2563eb;border:0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button,.safe{border:0;border-radius:999px;font-weight:800;padding:10px 12px;cursor:pointer;font-size:13px;color:#fff}
  .chips button[data-rate="30"]{background:#2563eb}
  .chips button[data-rate="50"]{background:#7c3aed}
  .chips button[data-fluid="154"]{background:#0d9488}
  .chips button[data-fluid="0"]{background:#0891b2}
  #fit{background:#fb7185}
  #risk{background:#d97706}
  .chips button.on{outline:3px solid #0f172a;outline-offset:2px}
  #fit.on{background:#e11d48}
  #risk.on{background:#b45309}
  .safe{background:#059669;margin-top:8px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{border-radius:12px;text-align:center;padding:10px 6px;color:#fff}
  .num:nth-child(1){background:#0f4c81}
  .num:nth-child(2){background:#2563eb}
  .num:nth-child(3){background:#059669}
  .num.bad{background:#dc2626}
  .num span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .num b{font-size:28px}
  #banner{display:none;border-radius:12px;background:#fef2f2;color:#b91c1c;font-weight:800;text-align:center;padding:10px;margin:12px 0}
  #banner.show{display:block}
  #ods{display:none;margin-top:10px;background:#7f1d1d;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.35}
  #ods.show{display:block}
  #ods b{display:block;font-size:16px;letter-spacing:.03em;margin-bottom:4px}
  .plot{margin-top:12px;background:#f8fbff;border:2px solid #bfdbfe;border-radius:16px;padding:8px 8px 4px}
  canvas{width:100%;height:340px;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin:4px 0 8px}
  .legend i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
  .lg-na{background:#2563eb}
  .lg-goal{background:#059669}
  .lg-lim{background:#dc2626}
  .hours{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
  .hours b{display:block;font-size:16px;color:#1d4ed8}
  .quiet{font-size:12px;color:var(--muted);margin:8px 0 0}
  a{color:#0f4c81}
  body.embed header, body.embed a[href="index.html"]{display:none}
  body.embed main{padding:8px}
  details{margin-top:8px}
  summary{cursor:pointer;font-weight:800;font-size:13px;color:#0f4c81}
</style>
</head>
<body>
<header>
  <div>
    <h1>Sodium correction</h1>
    <p>Drag the rate. The line is the next 24 hours.</p>
  </div>
  <div id="limitBadge">24 h limit 8</div>
</header>
<main>
  <section>
    <h2>Patient</h2>
    <div class="row">
      <div><label>Weight kg</label><input id="wt" type="number" value="70" min="30" max="250"></div>
      <div><label>Body water</label>
        <select id="who">
          <option value="0.6">Male 0.6</option>
          <option value="0.5">Female or elderly male 0.5</option>
          <option value="0.45">Elderly female 0.45</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Sodium now</label><input id="na" type="number" value="120" step="0.1"></div>
      <div><label>24 h goal</label><input id="target" type="text" inputmode="decimal" value="126"></div>
    </div>
    <p class="quiet" id="goalNote"></p>
    <label>Glucose mg/dL</label>
    <input id="glu" type="number" placeholder="Adds the rise onto the line" inputmode="decimal">
    <label>Type</label>
    <select id="fluid">
      <option value="513">3% saline · 513</option>
      <option value="154">0.9% saline · 154</option>
      <option value="130">Ringer's lactate · 130</option>
      <option value="77">0.45% saline · 77</option>
      <option value="38.5">0.225% saline · 38.5</option>
      <option value="0">Water or 5% dextrose · 0</option>
    </select>
    <label>Rate <b id="rateLabel">30</b> mL/h</label>
    <input id="rate" type="range" min="0" max="250" step="5" value="30">
    <input id="rateN" type="number" value="30" min="0" max="500" step="5">
    <div class="chips">
      <button type="button" data-fluid="513" data-rate="30">3% slow</button>
      <button type="button" data-fluid="513" data-rate="50">3% 50</button>
      <button type="button" data-fluid="154" data-rate="100">0.9% 100</button>
      <button type="button" data-fluid="0" data-rate="80">Water</button>
      <button type="button" id="fit">Seizure</button>
      <button type="button" id="risk">High risk</button>
    </div>
    <details>
      <summary>Urine</summary>
      <div class="row">
        <div><label>Urine Na</label><input id="uNa" type="number" placeholder="mmol/L"></div>
        <div><label>Urine K</label><input id="uK" type="number" placeholder="mmol/L"></div>
      </div>
      <label>Urine mL/h</label>
      <input id="uVol" type="number" placeholder="mL per hour, not per day">
    </details>
  </section>
  <section>
    <div class="nums">
      <div class="num"><span>Body water</span><b id="tbw">—</b></div>
      <div class="num" id="endBox"><span>At 24 h</span><b id="end">—</b></div>
      <div class="num" id="deltaBox"><span>Change</span><b id="delta">—</b></div>
    </div>
    <div id="banner"></div>
    <div id="ods"></div>
    <button class="safe" id="safe" type="button" hidden>Slow to a safe rate</button>
    <div class="plot">
      <canvas id="chart" width="720" height="340"></canvas>
      <div class="legend"><span><i class="lg-na"></i>Sodium</span><span id="goalKey"><i class="lg-goal"></i>Your goal</span><span><i class="lg-lim"></i>Limit</span></div>
    </div>
    <div class="hours" id="hours"></div>
    <p class="quiet" id="note"></p>
    <p class="quiet"><a href="index.html">All simulators</a></p>
  </section>
</main>
<script>
if(new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');
function track(o){
  let tbw=o.weight*o.factor;
  const start=tbw;
  const path=[o.na];
  let cur=o.na;
  const vol=o.rate/1000;
  const use=o.uNa!=null;
  const uvol=use?o.uVol/1000:0;
  let bad=false;
  for(let h=1;h<=24;h++){
    const denom=tbw+vol-uvol;
    if(denom<5){ bad=true; break; }
    const removed=use?(o.uNa+o.uK)*uvol:0;
    cur=(cur*tbw + o.fluid*vol - removed)/denom;
    tbw=denom;
    path.push(cur);
  }
  while(path.length<25) path.push(path[path.length-1]);
  return {tbw:start, path, final:path[24], delta:path[24]-o.na, bad};
}
function num(id){ const v=document.getElementById(id).value; return v===''?null:parseFloat(v); }
function state(){
  const urine=[num('uNa'),num('uK'),num('uVol')];
  const filled=urine.filter(v=>v!=null && !Number.isNaN(v)).length;
  return {
    weight:num('wt')||0, factor:parseFloat(document.getElementById('who').value),
    na:num('na'), target:num('target'), fluid:parseFloat(document.getElementById('fluid').value),
    rate:num('rateN')||0, glu:num('glu'),
    urine: filled===3 ? {uNa:urine[0], uK:urine[1], uVol:urine[2]} : null,
    urinePartial: filled>0 && filled<3,
    fit:document.getElementById('fit').classList.contains('on'),
    risk:document.getElementById('risk').classList.contains('on')
  };
}
function draw(path, target, limit, start, crossH){
  const c=document.getElementById('chart');
  const dpr=Math.min(2, devicePixelRatio||1);
  const cssW=c.clientWidth||640, cssH=c.clientHeight||340;
  c.width=cssW*dpr; c.height=cssH*dpr;
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const goal=Number(target);
  const vals=path.concat([goal, start+limit, start-limit]);
  let min=Math.min.apply(null,vals)-3, max=Math.max.apply(null,vals)+3;
  if(!(max>min)) { min=start-8; max=start+8; }
  const L=46,R=8,T=22,B=26;
  const plotR=cssW-92;
  const X=i=>L+(plotR-L)*i/24;
  const Y=v=>T+(cssH-T-B)*(1-(v-min)/(max-min));
  ctx.font='12px sans-serif'; ctx.fillStyle='#64748b'; ctx.strokeStyle='#dbeafe'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const v=max-(max-min)*i/4;
    const y=T+(cssH-T-B)*i/4;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(plotR,y); ctx.stroke();
    ctx.fillText(v.toFixed(0), 4, y+4);
  }
  ctx.beginPath();
  path.forEach((v,i)=>{ const x=X(i), y=Y(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.lineTo(X(24), cssH-B); ctx.lineTo(X(0), cssH-B); ctx.closePath();
  ctx.fillStyle='rgba(37,99,235,0.12)'; ctx.fill();
  ctx.beginPath(); ctx.strokeStyle='#2563eb'; ctx.lineWidth=3.5; ctx.setLineDash([]);
  path.forEach((v,i)=>{ const x=X(i), y=Y(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle='#2563eb';
  ctx.beginPath(); ctx.arc(X(24), Y(path[24]), 5, 0, Math.PI*2); ctx.fill();
  if(crossH!=null){
    ctx.fillStyle='#dc2626';
    ctx.beginPath(); ctx.arc(X(crossH), Y(path[crossH]), 7, 0, Math.PI*2); ctx.fill();
    ctx.font='bold 13px sans-serif';
    ctx.fillText('ODS', X(Math.min(crossH,20))+10, Y(path[crossH])-10);
  }
  function limitLine(v, color, label){
    ctx.strokeStyle=color; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(X(0), Y(v)); ctx.lineTo(plotR, Y(v)); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle=color; ctx.font='11px sans-serif';
    ctx.fillText(label, X(0)+4, Y(v)-4);
  }
  limitLine(start+limit, '#dc2626', '+'+limit);
  limitLine(start-limit, '#f97316', '-'+limit);
  const y=Y(goal);
  ctx.strokeStyle='#059669'; ctx.lineWidth=4; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(X(0), y); ctx.lineTo(plotR, y); ctx.stroke();
  ctx.setLineDash([]);
  const label='Goal '+goal.toFixed(1);
  ctx.font='bold 13px sans-serif';
  const tw=ctx.measureText(label).width+14;
  const bx=Math.min(cssW-tw-6, plotR+6);
  const by=Math.max(6, Math.min(cssH-30, y-12));
  ctx.fillStyle='#059669';
  ctx.fillRect(bx, by, tw, 24);
  ctx.fillStyle='#fff';
  ctx.fillText(label, bx+7, by+16);
  ctx.fillStyle='#64748b'; ctx.font='12px sans-serif';
  ctx.fillText('0 h', X(0), cssH-6);
  ctx.fillText('24 h', X(24)-28, cssH-6);
}
function paint(){
  const s=state();
  document.getElementById('rate').value=s.rate;
  document.getElementById('rateLabel').textContent=String(s.rate);
  const banner=document.getElementById('banner');
  const lines=[];
  if(!(s.weight>0) || s.na==null || Number.isNaN(s.na)) return;
  const risk=s.risk || s.na<105;
  const limit=risk?6:8;
  document.querySelectorAll('.chips button[data-fluid]').forEach(b=>{
    b.classList.toggle('on', b.dataset.fluid===String(s.fluid) && Number(b.dataset.rate)===s.rate);
  });
  const auto=suggestedGoal(s.na, s.glu, risk);
  const custom=s.target!=null && Math.abs(s.target-auto)>0.15;
  document.getElementById('goalNote').textContent = custom
    ? 'Your goal is '+s.target+'. The green line is that number.'
    : (risk ? 'High risk. Goal is +4. Do not pass +6.' : 'Goal is +6 in 24 h. Do not pass +8.');
  let rise=0, corr=s.na;
  if(s.glu>100){ rise=1.6*(s.glu-100)/100; corr=s.na+rise; }
  if(s.urinePartial){
    banner.className='show'; banner.textContent='Enter urine sodium, potassium, and mL/h, or leave all three blank.';
    return;
  }
  const t=track({weight:s.weight, factor:s.factor, na:s.na, fluid:s.fluid, rate:s.rate, uNa:s.urine&&s.urine.uNa, uK:s.urine&&s.urine.uK, uVol:s.urine&&s.urine.uVol});
  const path=t.path.map((v,h)=>v+rise*h/24);
  const final=path[24];
  const delta=final-s.na;
  document.getElementById('tbw').textContent=t.tbw.toFixed(1);
  document.getElementById('end').textContent=final.toFixed(1);
  document.getElementById('delta').textContent=(delta>=0?'+':'')+delta.toFixed(1);
  const over=Math.abs(delta)>limit;
  document.getElementById('deltaBox').className='num'+(over?' bad':'');
  document.getElementById('endBox').className='num'+(over?' bad':'');
  document.getElementById('safe').hidden=!over;
  if(s.fit) lines.push('Seizure: 150 mL of 3% saline over 10 minutes. This line is the drip after that.');
  if(corr>=135 && s.na<135) lines.push('Corrected sodium is '+corr.toFixed(1)+'. This is not a low sodium. Do not start 3% saline.');
  else if(rise>=1) lines.push('Fixing the glucose raises sodium about '+rise.toFixed(1)+' before any saline.');
  if(t.bad) lines.push('That urine volume is a daily total. Enter mL per hour.');
  if(t.delta<-0.5) lines.push('This fluid lowers the sodium.');
  const limitLine=s.na+limit;
  let cross=null;
  for(let h=1;h<path.length;h++){
    if(path[h-1]<limitLine && path[h]>=limitLine){ cross=h; break; }
  }
  const ods=document.getElementById('ods');
  if(cross!=null){
    ods.className='show';
    ods.innerHTML='<b>Overcorrection — ODS</b>The sodium crosses +'+limit+' at '+cross+' h. Stop 3% saline. Give free water. Use desmopressin if it keeps rising.';
  } else {
    ods.className='';
    ods.innerHTML='';
  }
  if(s.target!=null && Math.abs(final-s.target)>1.2) lines.push('This fluid cannot reach that goal. The green line is still your goal.');
  else if(!cross && s.target!=null && s.target-s.na>limit) lines.push('That goal is past the limit. Reaching it in one day is overcorrection.');
  banner.className=lines.length?'show':'';
  banner.textContent=lines.join(' ');
  draw(path, s.target==null?s.na:s.target, limit, s.na, cross);
  const shown=s.target==null?s.na:s.target;
  document.getElementById('goalKey').innerHTML='<i class="lg-goal"></i>Goal '+Number(shown).toFixed(1);
  document.getElementById('hours').innerHTML=[0,6,12,18,24].map(h=>'<div>'+h+' h<b>'+path[h].toFixed(1)+'</b></div>').join('');
  document.getElementById('note').textContent=rise?('Glucose adds +'+rise.toFixed(1)+' as it falls to 100.'):(s.urine?'Urine included.':'');
}
function setFluid(v, rate){
  document.getElementById('fluid').value=String(v);
  document.getElementById('rateN').value=rate;
  document.getElementById('rate').value=rate;
  paint();
}
document.getElementById('rate').addEventListener('input', e=>{ document.getElementById('rateN').value=e.target.value; paint(); });
document.getElementById('rateN').addEventListener('input', e=>{ document.getElementById('rate').value=e.target.value; paint(); });
['wt','who','fluid','uNa','uK','uVol'].forEach(id=>document.getElementById(id).addEventListener('input', paint));
document.getElementById('target').addEventListener('input', applyGoal);
document.getElementById('target').addEventListener('keyup', applyGoal);
document.getElementById('target').addEventListener('change', applyGoal);
document.getElementById('na').addEventListener('input', retarget);
document.getElementById('glu').addEventListener('input', retarget);
document.querySelectorAll('.chips button[data-fluid]').forEach(b=>b.addEventListener('click', ()=>setFluid(b.dataset.fluid, +b.dataset.rate)));
document.getElementById('fit').onclick=function(){ this.classList.toggle('on'); paint(); };
document.getElementById('risk').onclick=function(){ this.classList.toggle('on'); retarget(); };
function suggestedGoal(na, glu, risk){
  const corr=(glu>100)?na+1.6*(glu-100)/100:na;
  const goal=risk?4:6;
  if(corr>=135 && na<135) return Math.round(Math.min(140, corr)*10)/10;
  return Math.min(140, Math.round((na+goal)*10)/10);
}
function setTarget(){
  const na=parseFloat(document.getElementById('na').value);
  if(!(na>0)) return;
  const glu=parseFloat(document.getElementById('glu').value);
  const risk=document.getElementById('risk').classList.contains('on') || na<105;
  document.getElementById('target').value=String(suggestedGoal(na, glu, risk));
}
function readGoal(){
  const raw=String(document.getElementById('target').value||'').replace(',','.').trim();
  if(raw===''||raw==='-'||raw==='.') return null;
  const n=parseFloat(raw);
  return Number.isFinite(n)?n:null;
}
function endNa(rate){
  const s=state();
  const rise=(s.glu>100)?1.6*(s.glu-100)/100:0;
  const t=track({weight:s.weight,factor:s.factor,na:s.na,fluid:s.fluid,rate:rate,uNa:s.urine&&s.urine.uNa,uK:s.urine&&s.urine.uK,uVol:s.urine&&s.urine.uVol});
  return t.final+rise;
}
function applyGoal(){
  const goal=readGoal();
  const s=state();
  if(goal==null||!(s.weight>0)||s.na==null||Number.isNaN(s.na)||s.urinePartial){ paint(); return; }
  const low=endNa(0), high=endNa(250);
  let rate;
  if((low<=high && goal<=low)||(low>high && goal>=low)) rate=0;
  else if((low<=high && goal>=high)||(low>high && goal<=high)) rate=250;
  else {
    let lo=0, hi=250;
    for(let i=0;i<22;i++){
      const mid=(lo+hi)/2;
      const v=endNa(mid);
      if(low<=high ? v<goal : v>goal) lo=mid; else hi=mid;
    }
    rate=Math.max(0, Math.round(lo/5)*5);
  }
  document.getElementById('rateN').value=rate;
  document.getElementById('rate').value=rate;
  paint();
}
function retarget(){ setTarget(); applyGoal(); }
document.getElementById('safe').onclick=function(){
  const s=state();
  const limit=(s.risk||s.na<105)?6:8;
  let lo=0, hi=s.rate;
  for(let i=0;i<18;i++){
    const mid=(lo+hi)/2;
  const rise=(s.glu>100)?1.6*(s.glu-100)/100:0;
  const d=Math.abs(track({weight:s.weight,factor:s.factor,na:s.na,fluid:s.fluid,rate:mid,uNa:s.urine&&s.urine.uNa,uK:s.urine&&s.urine.uK,uVol:s.urine&&s.urine.uVol}).delta+rise);
    if(d>limit) hi=mid; else lo=mid;
  }
  const rate=Math.max(0, Math.floor(lo/5)*5);
  document.getElementById('rateN').value=rate;
  paint();
};
const q=new URLSearchParams(location.search);
if(q.get('na')) document.getElementById('na').value=q.get('na');
if(q.get('glu')){ document.getElementById('glu').value=q.get('glu'); document.querySelector('details').open=true; }
setTarget();
paint();
window.addEventListener('resize', paint);
</script>
</body>
</html>
