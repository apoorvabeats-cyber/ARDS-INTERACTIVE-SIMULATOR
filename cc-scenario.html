var VENTB = {phase:0, t:0, pres:[], flow:[], vol:[]};
function shownVent(){ return patient.shown || patient.vent; }
function ventNow(){
  var v = shownVent();
  var support = patient.support;
  var imv = support==="imv";
  var rr = imv ? (v.rr||16) : (v.backup||12);
  var peep = imv ? v.peep : v.epap;
  var pip = imv ? (peep + (v.mode==="PC-AC" || v.mode==="PS" ? (v.ps||10) : Math.max(8, Math.round((v.tv||400)/35)))) : v.ipap;
  var flow = imv ? Math.round(((v.tv||400)/1000) / ((60/Math.max(8,rr))*0.33) * 60) : Math.round(Math.max(10, (v.ipap-v.epap)*3));
  return {v:v, imv:imv, rr:rr, peep:peep, pip:Math.round(pip), flow:flow, tv: imv ? v.tv : Math.round(Math.max(250, (v.ipap-v.epap)*45))};
}
function ventSample(frac, snap){
  var ti = 0.33;
  if(snap.imv && snap.v.ie==="1:1") ti = 0.5;
  if(snap.imv && snap.v.ie==="1:3") ti = 0.25;
  if(!snap.imv) ti = Math.min(0.55, Math.max(0.2, (snap.v.ti||1) / (60/Math.max(6, snap.rr))));
  var insp = frac < ti;
  var u = insp ? frac/Math.max(0.05,ti) : (frac-ti)/Math.max(0.05,1-ti);
  var rise = u < 0.16 ? u / 0.16 : 1;
  var pres = insp ? rise : Math.exp(-u * 6);
  var square = snap.imv && (snap.v.mode==="VC-AC" || snap.v.mode==="SIMV");
  var flow = insp ? (square ? 0.8 : Math.max(0, 0.85 - u * 0.7)) : (u < 0.48 ? -0.65 * Math.exp(-u * 3.4) : 0);
  var vol = insp ? u : (u < 0.62 ? Math.max(0, 1 - u / 0.62) : 0);
  return {pres:pres, flow:flow, vol:vol};
}
function drawVentWaves(ts){
  var c = document.getElementById("ventwave");
  if(!c || !patient) return;
  var on = patient.support==="cpap" || patient.support==="bipap" || patient.support==="imv";
  if(!on){
    var box = fitCanvas(c);
    if(box){ box.ctx.fillStyle="#071018"; box.ctx.fillRect(0,0,box.w,box.h); }
    return;
  }
  var snap = ventNow();
  var span = 120 / Math.max(6, snap.rr);
  var pres = traceAt(ts, snap.rr, 100, span, function(ph){ return 0.18 + 0.82*ventSample(ph, snap).pres; });
  var flow = traceAt(ts, snap.rr, 100, span, function(ph){ return ventSample(ph, snap).flow; });
  var vol = traceAt(ts, snap.rr, 100, span, function(ph){ return ventSample(ph, snap).vol; });
  var lanes = [
    {arr:pres, color:"#e2b48a", mid:0.86, amp:0.46},
    {arr:flow, color:"#9ad7ff", mid:0.52, amp:0.28},
    {arr:vol, color:"#c9f0c0", mid:0.86, amp:0.42}
  ];
  drawSweep(c, lanes, {lw:1.1, bg:"#071018"});
  /* one letter per curve so pressure, flow and volume can be told apart */
  var tag = fitCanvas(c);
  if(tag){
    var lh = tag.h/3, fs = Math.max(6, Math.min(11, lh*0.42));
    tag.ctx.font = "700 "+fs+"px Figtree, Arial, sans-serif";
    tag.ctx.textBaseline = "top";

  }
}

function radBase(mode){
  if(mode==="hyper") return 28;
  if(mode==="weak" || mode==="weakglobal") return 46;
  return 36;
}
function lvRadius(mode, a, sys){
  var base = radBase(mode);
  var squeeze = mode==="hyper" ? 20 : mode==="weakglobal" ? 4 : mode==="weak" ? 12 : 12;
  if(mode==="weak"){
    var deg = (a*180/Math.PI) % 360;
    if(deg<0) deg += 360;
    var d = Math.min(Math.abs(deg-270), 360-Math.abs(deg-270));
    if(d<40) squeeze = 0;
  }
  return base - squeeze*sys;
}

function drawPhotoBeat(c, src, sys, breath, mode){
  var box = fitCanvas(c);
  if(!box) return;
  var ctx = box.ctx, w = box.w, h = box.h;
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,w,h);
  var im = echoImg(src);
  if(!(im.complete && im.naturalWidth)){
    ctx.fillStyle = "#c9d0d6";
    ctx.font = "12px Figtree, sans-serif";
    ctx.fillText("Recorded 2D frame", 8, 18);
    return;
  }
  var beat = mode==="ivc" ? (1 - 0.08*((Math.sin(breath*Math.PI*2)+1)/2)) : (1 - 0.055*sys);
  var dw = w * (mode==="ivc" ? beat : beat);
  var dh = h * (mode==="ivc" ? 1 : beat);
  ctx.drawImage(im, (w-dw)/2, (h-dh)/2, dw, dh);
  var sweep = ((sys||0) + breath) % 1;
  ctx.save();
  ctx.strokeStyle = "rgba(215,255,232,.45)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(w*0.5, h*0.96);
  ctx.lineTo(w*(0.12+sweep*0.76), h*0.06);
  ctx.stroke();
  ctx.restore();
}

function studyZoom(kind, title){
  var rep = patient.results[kind];
  if(!rep) return "<h2 class='stage-no'>"+title+"</h2><p>Not filed.</p>";
  var text = rep.text || "";
  return "<h2 class='stage-no'>"+title+"</h2>"+
    (text ? "<ul class='points'><li class='stack'><b>Report</b>"+escapeHtml(text)+"</li></ul>" : "")+
    pointList(rep.points)+
    filmFigure(rep, kind)+
    askBlock(kind);
}
function abgZoom(){
  var g = patient.results.abg;
  return "<h2 class='stage-no'>ABG</h2><ul class='points'>"+
    rowPoint("pH", g.ph, "7.35–7.45", g.ph<7.35||g.ph>7.45)+
    rowPoint("PaCO2", g.pco2+" mmHg", "35–45", g.pco2<35||g.pco2>45)+
    rowPoint("PaO2", g.po2+" mmHg", "80–100", g.po2<80)+
    rowPoint("HCO3", g.hco3+" mmol/L", "22–26", g.hco3<22||g.hco3>26)+
    rowPoint("Lactate", g.lactate+" mmol/L", "<2", g.lactate>2)+
    rowPoint("Base excess", g.be, "−2 to +2", g.be<-2||g.be>2)+
    rowPoint("Glucose", g.glucose+" mg/dL", "70–180", g.glucose<70||g.glucose>180)+
    "</ul>"+(isLab()?"<p class='lead'>A high lactate is a perfusion problem until proved otherwise. The pH has to agree with the bicarbonate and the carbon dioxide.</p>":"");
}
function labZoom(which){
  var l = patient.results.labs;
  var hbLo = patient.sex==="man" ? 13 : 12;
  var hbHi = patient.sex==="man" ? 17 : 15;
  var hbRef = patient.sex==="man" ? "13–17 g/dL" : "12–15 g/dL";
  if(which==="cbc"){
    return "<h2 class='stage-no'>CBC</h2><ul class='points'>"+
      rowPoint("Hemoglobin", l.cbc.hb+" g/dL", hbRef, l.cbc.hb<hbLo||l.cbc.hb>hbHi)+
      rowPoint("White cells", l.cbc.wbc+" ×10⁹/L", "4–11", l.cbc.wbc<4||l.cbc.wbc>11)+
      rowPoint("Differential", l.cbc.dlc, "", false)+
      rowPoint("Platelets", l.cbc.plt+" ×10⁹/L", "150–400", l.cbc.plt<150||l.cbc.plt>400)+
      "</ul>";
  }
  if(which==="kft"){
    return "<h2 class='stage-no'>KFT</h2><ul class='points'>"+
      rowPoint("Urea", l.rft.urea+" mg/dL", "15–40", l.rft.urea<15||l.rft.urea>40)+
      rowPoint("Creatinine", l.rft.creat+" mg/dL", "0.6–1.2", l.rft.creat<0.6||l.rft.creat>1.2)+
      rowPoint("Sodium", l.rft.na+" mmol/L", "135–145", l.rft.na<135||l.rft.na>145)+
      rowPoint("Potassium", l.rft.k+" mmol/L", "3.5–5.0", l.rft.k<3.5||l.rft.k>5)+
      rowPoint("eGFR", l.rft.egfr+" mL/min", "about 90–120", l.rft.egfr<60)+
      "</ul>"+(isLab() && l.rft.k<3.3 ? "<p class='lead'>Insulin waits if the potassium is under 3.3 mmol/L.</p>" : "");
  }
  if(which==="lft"){
    return "<h2 class='stage-no'>LFT</h2><ul class='points'>"+
      rowPoint("Bilirubin", l.lft.bili+" mg/dL", "0.2–1.2", l.lft.bili>1.2)+
      rowPoint("AST", l.lft.ast+" U/L", "<40", l.lft.ast>=40)+
      rowPoint("ALT", l.lft.alt+" U/L", "<40", l.lft.alt>=40)+
      rowPoint("Albumin", l.lft.alb+" g/dL", "3.5–5.0", l.lft.alb<3.5||l.lft.alb>5)+
      "</ul>";
  }
  if(which==="coag"){
    return "<h2 class='stage-no'>Coagulation</h2><ul class='points'>"+
      rowPoint("PT", l.coags.pt+" s", "11–15", l.coags.pt<11||l.coags.pt>15)+
      rowPoint("INR", l.coags.inr, "0.8–1.2", l.coags.inr<0.8||l.coags.inr>1.2)+
      rowPoint("aPTT", l.coags.aptt+" s", "25–35", l.coags.aptt<25||l.coags.aptt>35)+
      "</ul>";
  }
  return "<h2 class='stage-no'>Inflammatory markers</h2><ul class='points'>"+
    rowPoint("CRP", l.inflam.crp+" mg/L", "<10", l.inflam.crp>=10)+
    rowPoint("Procalcitonin", l.inflam.pct+" ng/mL", "<0.1", l.inflam.pct>=0.1)+
    "</ul>";
}
function cultureZoom(){
  var plan = culturePlan(patient.id);
  if(!patient.cultures){
    return "<h2 class='stage-no'>Cultures</h2><ul class='points'><li class='stack'><b>Before the drug</b>"+escapeHtml(plan.samples)+"</li></ul><button class='next' type='button' data-act='cultures'>Send cultures</button>";
  }
  if(!patient.cultureReport){
    return "<h2 class='stage-no'>Cultures</h2><p>Received by the laboratory. The Gram stain and the name are still pending.</p><button class='next' type='button' id='cultureGo'>Open the microbiology report</button>";
  }
  var c = patient.cultureReport;
  return "<h2 class='stage-no'>Microbiology report</h2><ul class='points'>"+
    "<li class='stack'><b>Gram stain</b>"+escapeHtml(c.gram)+"</li>"+
    "<li class='stack'><b>Culture</b>"+escapeHtml(c.id)+"</li>"+
    "<li class='stack'><b>Susceptibility</b>"+escapeHtml(c.sens)+"</li></ul>";
}
function tab(id, title, sub){
  return "<button type='button' class='tablet' data-zoom='"+id+"'><b>"+title+"</b><span>"+sub+"</span></button>";
}
function filed(ok, pending){ return ok ? "Filed" : pending; }
function ixHome(){
  var labs = !!patient.results.labs;
  return "<h2 class='stage-no'>4. Investigations</h2><div class='tablets'>"+
    tab("abg","ABG", filed(!!patient.results.abg, "Gas and lactate"))+
    tab("cbc","CBC", filed(labs, "Blood count"))+
    tab("kft","KFT", filed(labs, "Urea and electrolytes"))+
    tab("lft","LFT", filed(labs, "Liver"))+
    tab("coag","Coagulation", filed(labs, "PT, INR, aPTT"))+
    tab("inflam","Inflammatory", filed(labs, "CRP and procalcitonin"))+
    tab("cultures","Cultures", patient.cultureReport?"Report filed":patient.cultures?"Pending":"Not sent")+
    tab("usg","Ultrasound", filed(!!patient.results.usg, "Lung"))+
    tab("cxr","Chest radiograph", filed(!!patient.results.cxr, "Film"))+
    tab("ct","CT", filed(!!patient.results.ct, "Selected study"))+
    tab("mri","MRI", filed(!!patient.results.mri, "Selected study"))+
    "</div>";
}
function zoomBody(kind){
  if(kind==="abg") return abgZoom();
  if(kind==="cbc"||kind==="kft"||kind==="lft"||kind==="coag"||kind==="inflam") return labZoom(kind);
  if(kind==="cultures") return cultureZoom();
  if(kind==="usg") return studyZoom("usg", "Ultrasound");
  if(kind==="cxr") return studyZoom("cxr", "Chest radiograph");
  if(kind==="ct") return studyZoom("ct", "CT");
  if(kind==="mri") return studyZoom("mri", "MRI");
  return "";
}

    "<li class='stack'><b>Complaint</b>"+escapeHtml(p.complaint)+"</li>"+
    "<li class='stack'><b>Story</b>"+escapeHtml(p.story)+"</li>"+
    "<li class='stack'><b>Examination</b>"+escapeHtml(p.exam)+"</li>"+
    "<li class='stack'><b>History</b>"+escapeHtml(p.pmh)+"</li>"+
    "<li class='stack'><b>Drugs</b>"+escapeHtml(p.meds)+"</li>"+
    "</ul>"+(isLab()?"<div class='card hint'><h3>Hint</h3>"+escapeHtml(p.syn.hint)+"</div>":"");
}
function echoChoices(){
  function sel(id, label, options){
    return "<label class='f'>"+label+"<select id='"+id+"'>"+options.map(function(o){ return "<option value='"+o[0]+"'>"+o[1]+"</option>"; }).join("")+"</select></label>";
  }
  return sel("elv","LV systolic function",[["high","Hyperdynamic"],["normal","Normal"],["low","Reduced"]])+
    sel("erv","RV dysfunction",[["no","No"],["yes","Yes"]])+
    sel("erw","Regional wall motion abnormality",[["no","No"],["yes","Yes"]])+
    sel("eef","Pericardial effusion",[["none","None"],["small","Small"],["large","Large"]])+
    sel("eivc","IVC diameter and collapsibility",[["collapsing","Small and collapsing"],["normal","Normal"],["dilated","Dilated, poor collapse"]])+
    sel("evol","Volume status",[["underfilled","Underfilled"],["normal","Normal"],["overloaded","Overloaded"]])+
    sel("eob","Obstructive shock",[["no","No"],["yes","Yes"]])+
    "<button class='next' type='button' id='echoGo'>Commit the echo read</button>";
}
function echoSheet(){
  var e = patient.results.echo;
  if(!e) return "<h2 class='stage-no'>5. Echo</h2><p>The study is not back.</p>";
  var missed = patient.echoMiss && isLab();
  return "<h2 class='stage-no'>5. Echo</h2>"+
    "<p class='lead'>Recorded 2D frames, moving with the cardiac cycle. A single frozen photograph does not measure ejection fraction. Watch the beat, then the stills.</p>"+
    (missed?"<p class='missline'>The mark is the finding that disagrees with your read.</p>":"")+
    "<div class='cinebox'><canvas id='cine'></canvas><canvas id='ivccine'></canvas></div>"+
    "<ul class='points'>"+
    "<li class='stack'><b>LV</b>"+escapeHtml(e.lv)+"</li>"+
    "<li class='stack'><b>RV</b>"+escapeHtml(e.rv)+"</li>"+
    "<li class='stack'><b>Wall motion</b>"+escapeHtml(e.rwma)+"</li>"+
    "<li class='stack'><b>Pericardium</b>"+escapeHtml(e.pericardium)+"</li>"+
    "<li class='stack'><b>IVC</b>"+escapeHtml(e.ivc)+"</li></ul>"+
    e.stills.map(function(s){
      return "<figure class='still'><img class='film' alt='"+escapeHtml(s.cap)+"' src='"+s.src+"'><figcaption class='lead'>"+escapeHtml(s.cap)+"</figcaption></figure>";
    }).join("")+
    (patient.echoRead ? "<p>Your read is filed.</p>" : echoChoices());
}
function oxygenSheet(){
  function ob(id, label){
    var on = patient.pending===id || (!patient.pending && patient.support===id);
    return "<button type='button' class='"+(on?"on":"")+"' data-act='"+id+"'>"+label+"</button>";
  }
  return "<h2 class='stage-no'>6. Oxygen and ventilator</h2><div class='opts'>"+
    ob("room","Room air")+ob("np","Nasal prongs")+ob("fm","Face mask")+ob("nrb","Non-rebreather")+ob("hfnc","High-flow nasal oxygen")+ob("cpap","NIV — CPAP")+ob("bipap","NIV — BiPAP")+ob("imv","Invasive ventilation")+
    "</div>"+ventHtml();
}
function circSheet(){
  return "<h2 class='stage-no'>7. Circulation</h2><div class='opts'>"+
    btn("rl250","Balanced crystalloid 250 mL")+btn("rl500","Balanced crystalloid 500 mL")+btn("ns500","Normal saline 500 mL")+btn("diuretic","Furosemide 40 mg IV")+
    btn("norepi","Norepinephrine 0.05 mcg/kg/min")+btn("dobutamine","Dobutamine 2.5 mcg/kg/min")+btn("vaso","Vasopressin 0.03 units/min")+btn("stoppress","Stop the vasopressor")+
    btn("gtn","GTN infusion, start 10 mcg/min")+btn("nicardipine","Nicardipine infusion")+btn("labetalol","Labetalol bolus")+
    btn("crrt", patient.crrt?"CRRT is running":"Start CRRT")+
    "</div>";
}
function abxSheet(){
  if(!patient.cultureReport){
    var lead = patient.cultures
      ? "The bottles are in. Open the microbiology report from Investigations. Antibiotic selection comes after that report."
      : "Send cultures from Investigations. The report follows. Antibiotic selection is the step after the report.";

  }
  return "<h2 class='stage-no'>8. Antibiotics</h2><ul class='points'><li class='stack'><b>Report</b>"+escapeHtml(patient.cultureReport.sens)+"</li></ul>"+

    "</div>";

function procSheet(){
  return "<h2 class='stage-no'>9. Drugs and procedures</h2><div class='opts'>"+
    btn("sedation","Fentanyl, then propofol if the airway is secure")+btn("d50","Dextrose 50%, 50 mL")+btn("insulin","Insulin infusion 0.1 units/kg/h")+btn("kcl","Potassium chloride replacement")+btn("dexinf","Dextrose infusion beside insulin")+btn("bicarb","Sodium bicarbonate")+
    btn("blood","One unit of blood")+btn("pcc","Reverse warfarin")+btn("ppi","Proton-pump inhibitor infusion")+btn("aspirin","Aspirin 300 mg")+btn("heparin","Treatment-dose heparin")+btn("lytic","Thrombolysis")+
    btn("decompress","Decompress the pleura")+btn("drain","Chest drain")+btn("naloxone","Naloxone, titrated")+btn("head","Head up, neck straight")+btn("osmotic","Hypertonic saline or mannitol")+
    "</div>";

function courseSheet(){
  var p = patient;
  return "<h2 class='stage-no'>10. Course</h2><ul class='log'>"+(p.log.slice(0,12).map(function(l){ return "<li>"+l.t+" min — "+escapeHtml(l.text)+"</li>"; }).join("")||"<li>No action yet.</li>")+"</ul>";
}
function sheetHtml(){
  if(!patient.sheet) return "";
  var inner = "";
  if(patient.sheet==="vitals") inner = vitalsSheet();
  else if(patient.sheet==="present") inner = presentSheet();
  else if(patient.sheet==="ix") inner = patient.zoom ? zoomBody(patient.zoom) : ixHome();
  else if(patient.sheet==="echo") inner = echoSheet();
  else if(patient.sheet==="oxygen") inner = oxygenSheet();
  else if(patient.sheet==="circ") inner = circSheet();
  else if(patient.sheet==="abx") inner = abxSheet();
  else if(patient.sheet==="proc") inner = procSheet();
  else if(patient.sheet==="course") inner = courseSheet();
  return "<div class='sheet' id='sheet'><div class='panel'><button type='button' class='x' id='sheetX' aria-label='Close'>×</button>"+inner+"</div></div>";
}
function headBtn(id, num, title){
  return "<button type='button' class='head"+(patient.sheet===id?" on":"")+"' data-sheet='"+id+"'><span>"+num+"</span><b>"+title+"</b></button>";
}
function openHead(id){
  patient.zoom = "";
  patient.sheet = id;
  if(id==="echo" && !patient.results.echo) return orderTest("echo");
  render();
}
function openZoom(kind){
  patient.sheet = "ix";
  patient.zoom = kind;
  var test = {abg:"abg", cbc:"labs", kft:"labs", lft:"labs", coag:"labs", inflam:"labs", usg:"usg", cxr:"cxr", ct:"ct", mri:"mri"}[kind];
  if(test && !patient.results[test]) return orderTest(test, kind);
  var speech = panelSpeech(kind);
  if(speech) patient._ann = speech;
  else { patient._ann = ""; if(window.speechSynthesis) speechSynthesis.cancel(); }
  render();
}
function closeSheet(){
  if(patient.zoom && patient.sheet==="ix") patient.zoom = "";
  else { patient.sheet = ""; patient.zoom = ""; }
  render();
}
function bindChrome(){
  document.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick = function(){ onAct(b.getAttribute("data-act")); };
  });
  document.querySelectorAll("[data-sheet]").forEach(function(b){
    b.onclick = function(){ openHead(b.getAttribute("data-sheet")); };
  });
  document.querySelectorAll("[data-zoom]").forEach(function(b){
    b.onclick = function(){ openZoom(b.getAttribute("data-zoom")); };
  });
  document.querySelectorAll("[data-film]").forEach(function(b){
    b.onclick = function(){ answerFilm(b.getAttribute("data-kind"), b.getAttribute("data-film")); };
  });
  var renal = document.getElementById("renal");
  if(renal) renal.onchange = function(){ patient.renal = renal.checked; };
  var echoGo = document.getElementById("echoGo");
  if(echoGo) echoGo.onclick = function(){
    commitEcho({
      lv: document.getElementById("elv").value,
      rv: document.getElementById("erv").value,
      rw: document.getElementById("erw").value,
      eff: document.getElementById("eef").value,
      ivc: document.getElementById("eivc").value,
      vol: document.getElementById("evol").value,
      ob: document.getElementById("eob").value
    });
  };
  var cultureGo = document.getElementById("cultureGo");
  if(cultureGo) cultureGo.onclick = function(){ openCultureReport(); };
  var reassess = document.getElementById("reassess");
  if(reassess) reassess.onclick = function(){ tick(15); note("Fifteen minutes passed.", "Fifteen minutes passed."); render(); };
  var submit = document.getElementById("submit");
  if(submit) submit.onclick = function(){ openSubmit(false); };
  var sheet = document.getElementById("sheet");
  if(sheet) sheet.onclick = function(ev){ if(ev.target===sheet) closeSheet(); };
  var x = document.getElementById("sheetX");
  if(x) x.onclick = function(ev){ ev.stopPropagation(); closeSheet(); };
  bindVent();
}
function renderPick(){
  syncBay();
  document.getElementById("modechip").textContent = mode==="arena"?"Practice arena":"Learning lab";
  var app = document.getElementById("app");
  var notes = [];
  if(selected.indexOf("hypoBP")>=0 && selected.indexOf("hyperBP")>=0) notes.push("Blood pressure cannot be low and high at the same minute. The case will carry both, in that order.");
  if(selected.indexOf("hypogly")>=0 && selected.indexOf("hypergly")>=0) notes.push("Glucose cannot be low and high together. You will meet the high value first.");
  app.innerHTML = "<h2 class='stage-no'>1. Initial screen – Select clinical presentation</h2>"+
    "<span class='pill'>Multiple selection enabled</span>"+
    "<p class='lead'>"+(mode==="arena"?"No hints. Twelve minutes.":"Hints stay inside the case. The clock is clinical, not a countdown.")+"</p>"+
    "<div class='grid pick'>"+FLAGS.map(function(f){
      var on = selected.indexOf(f.id)>=0;
      return "<button type='button' class='alarm"+(on?" on":"")+"' data-flag='"+f.id+"' aria-pressed='"+(on?"true":"false")+"'>"+(ICONS[f.id]||"")+"<b>"+escapeHtml(f.name)+"</b><span>"+escapeHtml(f.sub)+"</span></button>";
    }).join("")+"</div>"+
    (notes.length?"<p class='lead'>"+notes.join(" ")+"</p>":"")+
    "<button class='go' id='gen' type='button'"+(selected.length?"":" disabled")+">Generate the patient</button>";
  app.querySelectorAll("[data-flag]").forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-flag");
      var i = selected.indexOf(id);
      if(i>=0) selected.splice(i,1); else selected.push(id);
      renderPick();
    };
  });
  var gen = document.getElementById("gen");
  if(gen) gen.onclick = function(){
    patient = buildPatient(selected);
    patient._ann = vitalLine(patient);
    finished = false;
    wall = 12*60;
    if(mode==="arena") startWall();
    render();
  };
  placeBed();
}

function startWall(){
  if(timer) clearInterval(timer);
  timer = setInterval(function(){
    wall -= 1;
    const el = document.getElementById("wall");
    if(el) el.textContent = fmt(wall);
    if(wall<=0){ clearInterval(timer); timer = null; if(!finished) openSubmit(true); }
  }, 1000);
}
function fmt(s){ s = Math.max(0,s); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function settleView(){
  if(typeof placeBed==="function") placeBed();
  const focus = patient && patient.focus;
  if(patient) patient.focus = "";
  if(patient && patient.sheet) return;
  const run = function(){
    let el = null;
    if(focus==="event") el = document.getElementById("focus-event");
    else if(focus==="result") el = document.getElementById("focus-result");
    else if(focus==="echo") el = document.getElementById("focus-echo");
    else if(focus==="form") el = document.getElementById("focus-form");
    else if(document.querySelector(".vitals .hot")) el = document.querySelector(".vitals");
    else if(focus==="vent") el = document.getElementById("focus-vent");
    if(!el || !el.scrollIntoView) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "start"});
  };
  if(typeof requestAnimationFrame==="function") requestAnimationFrame(function(){ requestAnimationFrame(run); });
  else run();
}
function vitalsSheet(){
  return "<h2 class='stage-no'>2. Vitals</h2>"+vitalsHtml();
}
function maybePromptReassess(){
  if(!patient || patient.reassessPrompt) return;
  var keys = ["Oxygen support matched","Fluid while underfilled","Norepinephrine for a low","Dextrose for hypoglycemia","Decompression of tension","Naloxone for opioid","Nitrate for hypertensive","Diuretic for a wet","Blood for bleeding","Antibiotic covers the source","Insulin after a safe","Controlled blood-pressure","Nicardipine in intracranial","Anticoagulation for pulmonary","Thrombolysis for massive","Lung-protective tidal","NIV pressures in a usable","Inotrope while the pressure","Small fluid challenge","Aspirin in an acute"];
  var hit = false;
  for(var i=0;i<patient.good.length && !hit;i++){
    for(var j=0;j<keys.length;j++) if(patient.good[i].indexOf(keys[j])>=0) hit = true;
  }
  if(!hit) return;
  patient.reassessPrompt = true;
  var extra = " Reassess the patient after 15 minutes.";
  patient._ann = (patient._ann ? String(patient._ann).replace(/\s+$/,"") : "The first step is in place.") + extra;
}
function render(){
  if(!patient) return renderPick();
  var p = patient;
  var app = document.getElementById("app");
  document.getElementById("modechip").textContent = mode==="arena"?"Practice · "+fmt(wall):"Learning lab";
  app.innerHTML = "<p class='kicker'>"+escapeHtml(p.name)+" · "+p.age+"-year-old "+p.sex+" · "+p.wt+" kg · predicted body weight "+p.pbw+" kg</p>"+
    (mode==="arena"?"<p class='lead'>Time <span class='clock' id='wall'>"+fmt(wall)+"</span></p>":"")+
    (p.events.length?"<div class='card' id='focus-event'><h3>Event</h3><p>"+escapeHtml(p.events[p.events.length-1])+"</p></div>":"")+
    "<div class='heads'>"+
      headBtn("vitals","2","Vitals")+
      headBtn("present","3","Presentation")+
      headBtn("ix","4","Investigations")+
      headBtn("echo","5","Echo")+
      headBtn("oxygen","6","Oxygen and ventilator")+
      headBtn("circ","7","Circulation")+
      headBtn("abx","8","Antibiotics")+
      headBtn("proc","9","Drugs and procedures")+
      headBtn("course","10","Course")+
    "</div>"+
    "<button class='next' id='reassess' type='button'>Reassess in 15 minutes</button>"+
    "<button class='next' id='submit' type='button'>Submit the diagnosis</button>"+
    sheetHtml();
  bindChrome();
  syncBay();
  settleView();
  maybePromptReassess();
  if(p._ann){
    var line = p._ann;
    p._ann = "";
    say(line);
  }
}

function airEdit(){
  if(patient.pending==="cpap"||patient.pending==="bipap"||patient.pending==="imv") return patient.pending;
  if(patient.support==="cpap"||patient.support==="bipap"||patient.support==="imv") return patient.support;
  return "";
}
function ventHtml(){
  const v = patient.shown || patient.vent;
  const mode = airEdit();
  const niv = mode==="cpap"||mode==="bipap";
  const imv = mode==="imv";
  if(!niv && !imv) return "<p class='lead'>Choose NIV or a tube, set the numbers, then apply. Nothing is placed on the patient until then.</p>";
  if(niv){
    return "<div id='focus-vent'><p class='lead'>"+(patient.pending?"The NIV mask appears when you apply these settings.":"NIV is on. Predicted body weight "+patient.pbw+" kg.")+"</p>"+
      slider("ipap","IPAP", v.ipap, 8, 24, 1)+" "+slider("epap","EPAP", v.epap, 4, 14, 1)+
      slider("fio2","FiO2 %", v.fio2, 30, 100, 5)+" "+slider("backup","Backup rate", v.backup, 8, 24, 1)+
      slider("rise","Rise time, s", v.rise, 0.1, 0.6, 0.1)+" "+slider("ti","Inspiratory time, s", v.ti, 0.6, 1.6, 0.1)+
      "<label class='f'>Mask<select id='mask'><option value='nasal'>Nasal</option><option value='oronasal'>Oronasal</option><option value='full'>Full face</option><option value='helmet'>Helmet</option></select></label>"+
      "<button class='next' type='button' id='applyVent'>Apply NIV settings</button>";
  }
  return "<div id='focus-vent'><p class='lead'>"+(patient.pending?"The tube is placed when you apply these settings. Predicted body weight "+patient.pbw+" kg. Six mL/kg is "+Math.round(6*patient.pbw)+" mL.":"The tube is in. Predicted body weight "+patient.pbw+" kg. Six mL/kg is "+Math.round(6*patient.pbw)+" mL.")+"</p>"+
    "<label class='f'>Mode<select id='modev'><option>VC-AC</option><option>PC-AC</option><option>SIMV</option><option>PS</option></select></label>"+
    slider("tv","Tidal volume, mL", v.tv, 200, 800, 10)+" "+slider("vrr","Set rate", v.rr, 10, 30, 1)+
    slider("peep","PEEP", v.peep, 0, 18, 1)+" "+slider("fio2","FiO2 %", v.fio2, 30, 100, 5)+
    slider("ps","Pressure support", v.ps, 0, 20, 1)+
    "<label class='f'>I:E<select id='ie'><option>1:1</option><option>1:2</option><option>1:3</option></select></label>"+
    "<button class='next' type='button' id='applyVent'>Apply ventilator settings</button>";
}
function slider(id, label, value, min, max, step){
  return "<label class='row'>"+label+" <input id='"+id+"' type='range' min='"+min+"' max='"+max+"' step='"+step+"' value='"+value+"'><b id='"+id+"v'>"+value+"</b></label>";
}
function previewVent(){
  if(!patient) return;
  var v = Object.assign({}, patient.vent);
  var g = function(id){ var el = document.getElementById(id); return el ? +el.value : null; };
  if(airEdit()==="imv"){
    var modev = document.getElementById("modev"); if(modev) v.mode = modev.value;
    if(document.getElementById("tv")) v.tv = g("tv");
    if(document.getElementById("vrr")) v.rr = g("vrr");
    if(document.getElementById("peep")) v.peep = g("peep");
    if(document.getElementById("fio2")) v.fio2 = g("fio2");
    if(document.getElementById("ps")) v.ps = g("ps");
    var ie = document.getElementById("ie"); if(ie) v.ie = ie.value;
  } else {
    if(document.getElementById("ipap")) v.ipap = g("ipap");
    if(document.getElementById("epap")) v.epap = g("epap");
    if(document.getElementById("fio2")) v.fio2 = g("fio2");
    if(document.getElementById("backup")) v.backup = g("backup");
    if(document.getElementById("rise")) v.rise = g("rise");
    if(document.getElementById("ti")) v.ti = g("ti");
    var mask = document.getElementById("mask"); if(mask) v.mask = mask.value;
  }
  patient.shown = v;
  paintVentReadout();
}
function bindVent(){
  ["ipap","epap","fio2","backup","rise","ti","tv","vrr","peep","ps"].forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = function(){
      const o = document.getElementById(id+"v");
      if(o) o.textContent = el.value;
      previewVent();
    };
  });
  const mask = document.getElementById("mask");
  if(mask){ mask.value = patient.vent.mask; mask.onchange = previewVent; }
  const modev = document.getElementById("modev");
  if(modev){ modev.value = patient.vent.mode; modev.onchange = previewVent; }
  const ie = document.getElementById("ie");
  if(ie){ ie.value = patient.vent.ie; ie.onchange = previewVent; }
  const apply = document.getElementById("applyVent");
  if(!apply) return;
  apply.onclick = function(){
    patient.shown = null;
    const v = patient.vent;
    const g = function(id){ const el = document.getElementById(id); return el? +el.value : null; };
    if(airEdit()==="imv"){
      v.mode = document.getElementById("modev").value;
      v.tv = g("tv"); v.rr = g("vrr"); v.peep = g("peep"); v.fio2 = g("fio2"); v.ps = g("ps");
      v.ie = document.getElementById("ie").value;
    } else {
      v.ipap = g("ipap"); v.epap = g("epap"); v.fio2 = g("fio2"); v.backup = g("backup");
      v.rise = g("rise"); v.ti = g("ti"); v.mask = document.getElementById("mask").value;
    }
    applyVent();
  };
}
function onAct(act){
  if(act==="abg"||act==="labs"||act==="usg"||act==="cxr"||act==="ct"||act==="echo") return orderTest(act);
  if(act==="cultures") return sendCultures();
  if(["room","np","fm","nrb","hfnc","cpap","bipap","imv"].indexOf(act)>=0) return setSupport(act);
  if(act==="rl500") return bolus(500,"balanced");
  if(act==="ns500") return bolus(500,"saline");
  if(act==="rl250") return bolus(250,"balanced");
  if(act==="diuretic") return giveDiuretic();
  if(act==="norepi"||act==="dobutamine"||act==="vaso") return givePressor(act);
  if(act==="stoppress") return givePressor("none");
  if(act==="gtn"||act==="nicardipine"||act==="labetalol") return giveBPDrug(act);
  if(act==="ctx-azi"||act==="piptazo"||act==="mero"||act==="vanc") return giveAbx(act);
  if(act==="sedation") return giveSedation();
  if(act==="d50"||act==="insulin"||act==="kcl"||act==="dexinf"||act==="bicarb") return giveMetabolic(act);
  return procedure(act);
}
function openSubmit(timedOut){
  finished = true;
  if(timer){ clearInterval(timer); timer = null; }
  if(patient){ patient.sheet = ""; patient.zoom = ""; }
  const p = patient;
  const app = document.getElementById("app");
  app.innerHTML = vitalsHtml()+
    "<h2 id='focus-form'>"+(timedOut?"Time is up.":"Your diagnosis.")+"</h2>"+
    "<p class='lead'>"+escapeHtml(p.name)+". Submit the illness, the shock, and the respiratory failure.</p>"+
    "<label class='f'>Primary diagnosis<select id='dx'>"+DX.map(function(d){ return "<option value='"+d[0]+"'>"+d[1]+"</option>"; }).join("")+"</select></label>"+
    "<label class='f'>Shock<select id='shock'><option value='distributive'>Distributive</option><option value='cardiogenic'>Cardiogenic</option><option value='hypovolemic'>Hypovolemic</option><option value='obstructive'>Obstructive</option><option value='none'>No shock</option></select></label>"+
    "<label class='f'>Respiratory failure<select id='resp'><option value='type1'>Type 1, hypoxemic</option><option value='type2'>Type 2, hypercapnic</option><option value='mixed'>Mixed</option><option value='none'>No respiratory failure</option></select></label>"+
    "<label class='f'>Leading alternative<select id='alt'>"+DX.map(function(d){ return "<option value='"+d[0]+"'>"+d[1]+"</option>"; }).join("")+"</select></label>"+
    "<label class='f'>Management you would write in the notes<textarea id='plan' placeholder='Airway, the circulation, the specific drug, and what you would recheck.'></textarea></label>"+
    "<button class='go' id='done' type='button'>Score this case</button>";
  document.getElementById("done").onclick = function(){
    showScore(document.getElementById("dx").value, document.getElementById("shock").value, document.getElementById("resp").value, document.getElementById("alt").value, document.getElementById("plan").value);
  };
  patient.focus = "form";
  settleView();
}
function showScore(dx, shock, resp, alt, plan){
  const p = patient;
  const sc = scorePatient(dx, shock, resp);
  const nameOf = function(id){ return (DX.filter(function(d){ return d[0]===id; })[0]||["",id])[1]; };
  const dxName = nameOf(dx);
  const right = nameOf(p.id);
  const altName = nameOf(alt);
  plan = (plan||"").trim();
  const shockOk = shock===p.syn.shock;
  const respOk = resp===p.syn.resp;
  document.getElementById("app").innerHTML =
    "<p class='kicker'>Score</p><h2 id='focus-form'>"+sc+" / 100</h2>"+
    "<div class='teach"+(dx===p.id?"":" miss")+"'>You said "+escapeHtml(dxName)+". The illness was "+escapeHtml(right)+".</div>"+
    "<div class='teach"+(shockOk?"":" miss")+"'>Shock: you said "+escapeHtml(shock)+". It was "+escapeHtml(p.syn.shock)+".</div>"+
    "<div class='teach"+(respOk?"":" miss")+"'>Respiratory failure: you said "+escapeHtml(resp)+". It was "+escapeHtml(p.syn.resp)+".</div>"+
    "<div class='card'><h3>Differential</h3>You also named "+escapeHtml(altName)+"."+(alt===p.id && dx!==p.id?" That alternative was the illness.":alt===dx?" It was the same as the primary diagnosis.":"")+"</div>"+
    "<div class='card'><h3>Your management note</h3>"+(plan?escapeHtml(plan):"No note written.")+"</div>"+
    "<div class='card'><h3>What helped</h3>"+(p.good.length?p.good.map(escapeHtml).join("<br>"):"Nothing recorded as clearly helpful.")+"</div>"+
    "<div class='card'><h3>What did not fit</h3>"+(p.bad.length?p.bad.map(escapeHtml).join("<br>"):"No suboptimal calls recorded.")+"</div>"+
    "<div class='card'><h3>Critical errors</h3>"+(p.critical.length?p.critical.map(escapeHtml).join("<br>"):"None recorded.")+"</div>"+
    "<div class='card'><h3>Timeline</h3>"+(p.timeline.map(escapeHtml).join("<br>")||"No actions.")+"</div>"+
    "<div class='card'><h3>Expert pathway</h3>"+p.syn.expert.map(function(s){ return "<p>"+escapeHtml(s)+"</p>"; }).join("")+"</div>"+
    "<button class='go' id='again' type='button'>Another patient</button>";
  document.getElementById("again").onclick = function(){ hushVoice(); patient = null; selected = []; finished = false; renderPick(); };
  if(typeof syncBay==="function") syncBay();
  patient.focus = "form";
  settleView();
}
function showDoors(){
  document.getElementById("modechip").textContent = "";
  if(typeof syncBay==="function") syncBay();
  document.getElementById("app").innerHTML =
    "<p class='kicker'>One engine. Two doors.</p>"+
    "<div class='grid'>"+
      "<button type='button' class='alarm' id='doorLab'><b>Learning lab</b><span>The reason is said out loud after every decision.</span></button>"+
      "<button type='button' class='alarm' id='doorArena'><b>Practice arena</b><span>No hints. Twelve minutes. The patient still answers.</span></button>"+
    "</div>";
  document.getElementById("doorLab").onclick = function(){ mode = "lab"; renderPick(); };
  document.getElementById("doorArena").onclick = function(){ mode = "arena"; renderPick(); };
}
function start(){
  const q = new URLSearchParams(location.search);
  const m = q.get("mode");
  document.getElementById("back").onclick = function(){
    hushVoice();
    if(timer) clearInterval(timer);
    if(history.length>1){ history.back(); return; }
    location.href = "index.html";
  };
  const voiceBtn = document.getElementById("voice");
  voiceBtn.onclick = function(){
    voiceOn = !voiceOn;
    voiceBtn.setAttribute("aria-pressed", voiceOn ? "true" : "false");
    voiceBtn.textContent = voiceOn ? "Voice" : "Voice off";
    if(!voiceOn) hushVoice();
  };
  const soundBtn = document.getElementById("soundbed");
  soundBtn.onclick = function(){
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    soundBtn.textContent = soundOn ? "Sound" : "Sound off";
    if(soundOn && typeof primeAudio==="function") primeAudio();
  };
  document.addEventListener("pointerdown", function(){ if(soundOn && typeof primeAudio==="function") primeAudio(); }, {passive:true});
  if(typeof ensureBed==="function") ensureBed();
  if(window.speechSynthesis){
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener("voiceschanged", function(){ speechSynthesis.getVoices(); });
  }
  if(m==="lab"||m==="arena"){ mode = m; renderPick(); }
  else showDoors();
}
if(typeof document!=="undefined") start();
</script>
