<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>Multi-Parameter Critical Care Scenario Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@420;600;700&family=Fraunces:opsz,wght@9..144,520&display=swap" rel="stylesheet">
<style>
:root{--bg:#101214;--ink:#f3efe6;--muted:#b7b1a4;--cool:#7fd4e6;--warm:#e2b48a;--card:#171c22;--line:rgba(243,239,230,.16);--good:#8fd0a8;--bad:#e7a3a3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{position:static;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#101214;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:15px;line-height:1.2;margin:0;letter-spacing:-.03em;flex:1 1 160px}
#stick{position:sticky;top:0;z-index:8;background:#101214}
h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:20px;margin:0 0 8px}
#back,#voice{background:#171c22;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 12px}
#voice[aria-pressed="false"]{opacity:.5}
.modechip{margin-left:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
main{max-width:860px;margin:0 auto;padding:12px 12px 36px}
.kicker{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.lead{margin:0 0 12px;color:var(--muted);line-height:1.45}
.clock{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid{grid-template-columns:1fr}.pick{grid-template-columns:1fr 1fr}}
.stage-no{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.05;margin:0 0 8px;letter-spacing:-.03em}
.pill{display:inline-block;margin:0 0 12px;padding:4px 10px;border-radius:999px;background:#1a332c;color:#8fd0a8;font-size:13px}
.alarm{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.alarm svg{flex:none;margin-top:2px}
.heads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.head{text-align:left;min-height:74px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.head b{display:block;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:16px}
.head.on{border-color:var(--cool);background:#10242c}
.missline{color:var(--warm);margin:8px 0}
.head span{color:var(--warm);font-size:12px;letter-spacing:.08em}
#bay{position:relative;top:auto;z-index:4;background:#0c1014;border-bottom:1px solid var(--line)}
#bay[hidden]{display:none !important}
.scene{position:relative;width:100%;aspect-ratio:16/9;height:auto;overflow:hidden;background:#0c1014}
.scene .bedpic{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform:none;animation:none}
.breathlayer{position:absolute;left:45%;top:54%;width:13%;height:13%;z-index:1;overflow:hidden;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 50% 48% at 50% 42%, #000 58%, transparent 84%);mask-image:radial-gradient(ellipse 50% 48% at 50% 42%, #000 58%, transparent 84%)}
.breathlayer img{position:absolute;width:769.23%;height:769.23%;max-width:none;left:-346.15%;top:-415.38%;object-fit:fill;transform-origin:51.5% 54%;will-change:transform}
@keyframes ivdrip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes pumpled{0%,100%{opacity:1}50%{opacity:.2}}
.glass{position:absolute;z-index:2;overflow:hidden;pointer-events:none;background:#04110c;border-radius:2px}
.glass.mon{left:7.5%;top:13.9%;width:16.7%;height:20.8%;display:grid;grid-template-columns:64% 36%}
.glass.vent{left:81.7%;top:35%;width:8.75%;height:10.8%;display:none;background:#071018}
.glass.vent:not([hidden]){display:flex;flex-direction:column}
.glass canvas{display:block;width:100%;height:100%;min-height:28px}
.monums{height:100%;display:grid;grid-template-rows:repeat(4,1fr);align-items:center;justify-items:end;padding:0 4% 0 0;font-variant-numeric:tabular-nums;line-height:1}
.monums b{font-size:max(7px,calc(var(--u,.34px)*27));font-weight:700;letter-spacing:-.04em}
.monums b.nbp{font-size:max(6px,calc(var(--u,.34px)*22))}
.nhr{color:#8fd0a8}.nbp{color:#e7a3a3}.nsat{color:#7fd4e6}.nrr{color:#f0d98a}
.ventread{position:absolute;z-index:3;right:1.4%;bottom:3%;width:auto;max-width:24%;color:#d7f4ff;font-size:10px;line-height:1.2;display:none;pointer-events:none;background:rgba(6,16,24,.92);padding:4px 6px;border-radius:8px;border:1px solid rgba(127,212,230,.45)}
.o2-cpap .ventread,.o2-bipap .ventread,.o2-imv .ventread{display:flex;flex-direction:column;gap:1px}
.ventread div{display:grid;grid-template-columns:52px 1fr;column-gap:6px}
.ventread b{font-variant-numeric:tabular-nums}
.rail{position:relative;z-index:4;display:flex;flex-direction:row;align-items:flex-end;gap:8px;width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 8px 10px;background:#0c1014;pointer-events:auto}
.addpump{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid #7fd4e6;background:#10242c;color:#7fd4e6;font-weight:700;line-height:1}
.gearsvg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.gearbtns{position:absolute;inset:0;z-index:5;pointer-events:none}
.gearx{position:absolute;--s:max(16px,min(22px,calc(var(--u,.34px)*30)));width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;border:0;background:rgba(16,18,20,.78);color:#f3efe6;font-size:calc(var(--s)*.62);line-height:var(--s);padding:0;pointer-events:auto}
.drip{animation:ivdrip 1.1s linear infinite}
.led{animation:pumpled 1.2s ease-in-out infinite}
.finding{position:absolute;width:22%;aspect-ratio:1;border:3px solid #ffd27a;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.7);transform:translate(-50%,-50%);pointer-events:none}
.finding b{position:absolute;left:104%;top:0;background:#101214;color:#ffd27a;border:1px solid #ffd27a;padding:2px 6px;white-space:nowrap;font-size:13px;font-weight:700}
.alerting .glass.mon{box-shadow:0 0 0 2px #e7a3a3, 0 0 12px rgba(231,163,163,.55)}
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;top:var(--bed,280px);background:rgba(6,8,10,.55);display:flex;align-items:stretch;padding:8px}
.panel{position:relative;flex:1;background:#171c22;border:1px solid var(--line);border-radius:18px;padding:36px 12px 16px;overflow:auto;animation:zoomIn .22s ease}
@keyframes zoomIn{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
.x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#10161c}
.tablets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tablet{min-height:64px;text-align:left;border-radius:14px;border:1px solid var(--line);background:#10161c;padding:10px 12px}
.tablet b{display:block;font-family:Fraunces,Georgia,serif;font-weight:520}
.tablet span{color:var(--muted);font-size:12px}
.points{list-style:none;margin:0;padding:0}
.points li{display:grid;grid-template-columns:minmax(108px,42%) minmax(0,1fr);column-gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.points li.stack{display:block}
.points li.stack b{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.points li > span:first-child{color:var(--muted)}
.points li.bad .v{color:var(--bad)}
.ref{color:var(--muted);font-size:12px}
.filmwrap{position:relative}
.filmwrap .hintlayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cinebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cinebox canvas{width:100%;height:150px;background:#000;border-radius:12px;display:block}
.q{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.q button{text-align:left;background:#10161c;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
figure.still{margin:0 0 8px}
@media(max-width:560px){.cinebox{grid-template-columns:1fr}.monums{font-size:7px}.monums b{font-size:9px}}
#soundbed{background:#171c22;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 12px}
#soundbed[aria-pressed="false"]{opacity:.5}
.alarm{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:76px}
.alarm.on{border-color:var(--cool);background:#10242c}
.alarm b{display:block;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:520}
.alarm span{color:var(--muted);font-size:13px}
.go{width:100%;margin-top:12px;min-height:48px;border-radius:12px;border:1px solid var(--cool);background:#10242c;font-weight:700}
.go:disabled{opacity:.4}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
@media(max-width:560px){.vitals{grid-template-columns:repeat(2,1fr)}}
.vitals div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.vitals b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.vitals span{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.badn{color:var(--bad)}
.vitals .hot{outline:1px solid var(--bad);animation:hotPulse 1.1s ease}
@keyframes hotPulse{0%{outline-color:transparent}35%{outline-color:var(--bad)}100%{outline-color:var(--bad)}}
.vitals,#focus-event,#focus-result,#focus-echo,#focus-vent,#focus-form{scroll-margin-top:72px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;line-height:1.45}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--cool)}
.hint{border-color:rgba(127,212,230,.45)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 10px}
summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opts button,.next{text-align:left;background:#10161c;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px;line-height:1.35}
.opts button.on{border-color:var(--cool)}
.next{width:100%;text-align:center;font-weight:700;border-color:var(--cool);background:#10242c}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--muted);font-size:13px}
.row input[type=range]{flex:1}
img.film{width:100%;border-radius:12px;display:block;margin:8px 0;background:#000}
.log{margin:0;padding-left:18px}
.log li{margin:0 0 6px}
.teach{background:#141a16;border:1px solid rgba(143,208,168,.4);border-radius:12px;padding:12px;line-height:1.45;margin:0 0 8px}
.teach.miss{background:#241818;border-color:rgba(231,163,163,.45)}
label.f{display:block;margin:0 0 8px;color:var(--muted);font-size:13px}
select,input[type=text],textarea{width:100%;background:#10161c;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:42px}
textarea{min-height:84px;resize:vertical}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0}
</style>
</head>
<body>
<div id="stick">
<header>
  <button type="button" id="back">Back</button>
  <h1>Multi-Parameter Critical Care Scenario Simulator</h1>
  <button type="button" id="voice" aria-pressed="true">Voice</button>
  <button type="button" id="soundbed" aria-pressed="true">Sound</button>
  <span class="modechip" id="modechip"></span>
</header>
<div id="bay" hidden></div>
</div>
<main id="app"></main>
<script>

const FLAGS = [
  {id:"hypoBP", name:"Hypotension", sub:"Low BP / shock"},
  {id:"hyperBP", name:"Hypertension", sub:"Elevated BP"},
  {id:"desat", name:"Desaturation", sub:"Low SpO2"},
  {id:"tachypnea", name:"Tachypnea", sub:"Increased RR"},
  {id:"tachy", name:"Tachycardia", sub:"Increased HR"},
  {id:"lowGCS", name:"Low GCS", sub:"Altered consciousness"},
  {id:"hypergly", name:"Hyperglycemia", sub:"High glucose"},
  {id:"hypogly", name:"Hypoglycemia", sub:"Low glucose"}
];
const DX = [
  ["sepsis","Septic shock from pneumonia"],
  ["cardiogenic","Cardiogenic shock"],
  ["pe","Massive pulmonary embolism"],
  ["tension","Tension pneumothorax"],
  ["edema","Hypertensive pulmonary edema"],
  ["dka","Diabetic ketoacidosis"],
  ["hhs","Hyperosmolar hyperglycemic state"],
  ["hypogly","Hypoglycemia"],
  ["ich","Intracerebral hemorrhage"],
  ["gib","Hypovolemic shock from gastrointestinal bleeding"],
  ["pneumonia","Hypoxemic pneumonia, not in shock"],
  ["opioid","Opioid overdose"],
  ["tamponade","Cardiac tamponade"],
  ["asthma","Acute severe asthma"],
  ["status","Status epilepticus"]
];
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function jit(n, f){ return Math.round(n + (Math.random()*2-1)*f); }
function mapOf(sbp, dbp){ return Math.round(dbp + (sbp-dbp)/3); }
function phOf(hco3, pco2){ return 6.1 + Math.log10(hco3 / (0.03*pco2)); }
function once(list, text){ if(list.indexOf(text)<0) list.push(text); }

const SYNDROMES = {
  sepsis:{
    bp:"low", glucose:"normal", preload:"empty", oxygen:"good", shock:"distributive", resp:"type1",
    covers:["hypoBP","desat","tachypnea","tachy","lowGCS","hypergly"],
    abx:["ctx-azi","piptazo","mero"], source:"lung",
    hint:"The pressure is low and the oxygen is low. Fill only what is empty, then a vasopressor. An antibiotic is part of the resuscitation, not a later order.",
    expert:["Oxygen to a saturation of 92 to 96.","Lactate and cultures, then an antibiotic that covers pneumonia within the hour.","Crystalloid while the heart is empty, then stop and look. Norepinephrine if the mean pressure stays under 65.","Echo. A hyperdynamic empty ventricle supports sepsis. A poor ventricle is a different shock.","Intubate if the airway is lost or the work of breathing fails. Tidal volume about 6 mL/kg predicted body weight.","The source here is the lung."]
  },
  cardiogenic:{
    bp:"low", glucose:"normal", preload:"full", oxygen:"good", shock:"cardiogenic", resp:"type1",
    covers:["hypoBP","desat","tachypnea","tachy","lowGCS"],
    abx:[], source:"heart",
    hint:"The lungs are wet and the pressure is low. Fluid will make the oxygen worse. Support the pressure and the airway, and look at the ventricle.",
    expert:["Oxygen. Non-invasive ventilation if awake and working. A tube if the airway fails.","No fluid bolus. A loop diuretic if the lungs are wet and the pressure allows.","Norepinephrine if hypotensive. Dobutamine if the pressure is holding and the output is low.","Aspirin if this is an acute coronary pattern, and a reperfusion call. Nitrate is for high pressure, not for a mean pressure of 55.","Echo: poor left ventricle, full inferior vena cava."]
  },
  pe:{
    bp:"low", glucose:"normal", preload:"obstruct", oxygen:"poor", shock:"obstructive", resp:"type1",
    covers:["hypoBP","desat","tachypnea","tachy","lowGCS"],
    abx:[], source:"clot",
    hint:"Oxygen is lower than the film can explain. The right ventricle is the chamber to worry about. A large fluid load will not fix a blocked pulmonary artery.",
    expert:["Oxygen. Intubation is a risk here because it drops venous return. Do it only if the airway is failing.","A small fluid challenge at most. Norepinephrine if the pressure is low.","Anticoagulate if there is no bleeding. Thrombolysis if shock persists.","Echo: a dilated, strained right ventricle and a full vein. A clear chest radiograph fits.","High PEEP will worsen the right ventricle."]
  },
  tension:{
    bp:"low", glucose:"normal", preload:"obstruct", oxygen:"blocked", shock:"obstructive", resp:"type1",
    covers:["hypoBP","desat","tachypnea","tachy","lowGCS"],
    abx:[], source:"air",
    hint:"One side of the chest is the emergency. Imaging that delays decompression, in a crashing patient, is the wrong order.",
    expert:["Oxygen.","If the pressure is low and one side does not move air: decompress, then a chest drain. Do not travel for a CT first.","A large fluid bolus is not the treatment.","Ultrasound: no lung sliding, a barcode on M-mode.","After the drain, recheck the pressure and the saturation."]
  },
  edema:{
    bp:"high", glucose:"normal", preload:"full", oxygen:"good", shock:"none", resp:"type1",
    covers:["hyperBP","desat","tachypnea","tachy"],
    abx:[], source:"pressure",
    hint:"The pressure is high and the lungs are wet. Sit the patient up. A nitrate and a diuretic belong here. A fluid bolus does not.",
    expert:["Sit up. Oxygen. Non-invasive ventilation if working hard and awake.","Intravenous nitrate, titrated. A loop diuretic.","Do not give a fluid bolus. Do not start a beta blocker as the drug that drops this pressure.","Echo often shows a stiff or weak left ventricle and a full vein. Lung ultrasound shows bilateral B-lines.","Intubate only if ventilation is failing."]
  },
  dka:{
    bp:"low", glucose:"high", preload:"empty", oxygen:"good", shock:"hypovolemic", resp:"mixed",
    covers:["hypoBP","tachypnea","tachy","lowGCS","hypergly","desat"],
    abx:[], source:"ketoacid",
    hint:"The rate is high because of acid, not because the lung is the whole story. Know the potassium before any insulin. Do not stop insulin just because the glucose falls.",
    expert:["Fluid first. A balanced crystalloid or saline is acceptable.","Measure potassium. If it is under 3.3 mmol/L, replace potassium and hold insulin.","Insulin infusion at 0.1 units/kg/h once potassium is safe.","Add dextrose when glucose is near 200 mg/dL and keep insulin running until the gap closes.","Bicarbonate is not routine. Look for a trigger. Protect the airway if consciousness fails."]
  },
  hhs:{
    bp:"low", glucose:"high", preload:"empty", oxygen:"good", shock:"hypovolemic", resp:"none",
    covers:["hypoBP","tachy","lowGCS","hypergly"],
    abx:[], source:"hyperosm",
    hint:"The glucose is extreme and the patient is dry. Fluid is the resuscitation. Insulin is slower and smaller than in ketoacidosis. Know the potassium.",
    expert:["Fluid is the main resuscitation. Replace the deficit over hours, not as one uncontrolled pour.","Potassium before and during insulin.","Insulin at a lower rate than ketoacidosis, once fluid has started and potassium is safe.","Glucose falls slowly. Watch sodium and osmolality.","Find the trigger. Protect the airway if consciousness is lost."]
  },
  hypogly:{
    bp:"normal", glucose:"low", preload:"normal", oxygen:"good", shock:"none", resp:"none",
    covers:["hypogly","lowGCS","tachy","hypoBP","desat"],
    abx:[], source:"glucose",
    hint:"Consciousness is down and the glucose is already on the monitor. Give dextrose before you treat this as a primary brain injury.",
    expert:["Intravenous dextrose now. 50 mL of 50% dextrose is 25 g.","Recheck the glucose. Start an infusion if it falls again, especially after a sulfonylurea or insulin.","Airway protection if it does not recover. Do not intubate before the dextrose if the glucose is the cause you can see.","Look for the reason: insulin, a sulfonylurea, liver failure, sepsis."]
  },
  ich:{
    bp:"high", glucose:"normal", preload:"normal", oxygen:"good", shock:"none", resp:"none",
    covers:["hyperBP","lowGCS","tachy","desat"],
    abx:[], source:"brain",
    hint:"The pressure is high and the consciousness is low. This is a brain until a scan says otherwise. Do not drop the pressure off a cliff, and do not send this patient for a lumbar puncture.",
    expert:["Airway and oxygen. Head up, neck straight, carbon dioxide in the normal range.","Non-contrast CT.","Lower a very high systolic pressure toward about 140 to 160, smoothly, with nicardipine or labetalol. Not a nitrate.","Reverse anticoagulation if it is present. Hypertonic saline or mannitol only for herniation, not as a standing drip.","Keep saturation and glucose in range. Fever and hypotension both hurt."]
  },
  gib:{
    bp:"low", glucose:"normal", preload:"empty", oxygen:"good", shock:"hypovolemic", resp:"none",
    covers:["hypoBP","tachy","lowGCS"],
    abx:[], source:"bleed",
    hint:"The pressure is low and the rate is high, and the lung is not the cause. Blood is the replacement. Crystalloid is a bridge, not the transfusion.",
    expert:["Two large cannulae. Send a group and crossmatch.","Transfuse blood. A hemoglobin near 7 g/dL is the usual restrictive target, lower if the patient is still unstable or has a cardiac history.","Reverse warfarin if the INR is high. A proton-pump inhibitor. Hold antiplatelet and anticoagulant drugs.","Endoscopy when the pressure allows. Do not drown the patient in saline.","Airway protection if consciousness is lost or the vomit will not stop."]
  },
  pneumonia:{
    bp:"normal", glucose:"normal", preload:"normal", oxygen:"good", shock:"none", resp:"type1",
    covers:["desat","tachypnea","tachy","hypergly","lowGCS"],
    abx:["ctx-azi","piptazo"], source:"lung",
    hint:"The oxygen is the failing organ. Escalating the oxygen device is the first skill. Antibiotics for the lung. Fluid is not the treatment of hypoxemia.",
    expert:["Oxygen, stepped up until the saturation is 92 to 96. High-flow before non-invasive ventilation in focal pneumonia.","An antibiotic that covers community pneumonia.","Cultures before the drug if it does not delay the dose.","Intubate if the work fails. Tidal volume about 6 mL/kg predicted body weight, and a PEEP that matches the oxygen need.","A fluid bolus does not treat a consolidation."]
  },
  opioid:{
    bp:"normal", glucose:"normal", preload:"normal", oxygen:"good", shock:"none", resp:"type2",
    covers:["lowGCS","desat","hypoBP"],
    abx:[], source:"opioid",
    hint:"The consciousness is down and the respiratory rate is slow. That slow rate is the clue. Glucose first if you have not seen it, then a trial of naloxone, and support the airway.",
    expert:["Open the airway and give oxygen. Ventilate if the rate is not safe.","Check glucose. Give dextrose if it is low.","Naloxone, titrated, if the rate is slow and opioid is possible.","Do not give a huge dose and walk away. The opioid outlasts the antidote.","Look for co-ingestions."]
  }
};

function fitScore(id, flags){
  const s = SYNDROMES[id];
  let score = Math.random()*1.2;
  flags.forEach(function(f){
    if(s.covers.indexOf(f)>=0) score += 3;
    else score -= 2.2;
  });
  if(flags.indexOf("hypoBP")>=0 && s.bp!=="low") score -= 5;
  if(flags.indexOf("hyperBP")>=0 && s.bp!=="high") score -= 5;
  if(flags.indexOf("hypogly")>=0 && s.glucose!=="low") score -= 8;
  if(id==="hypogly" && flags.indexOf("hypogly")<0) score -= 8;
  if((id==="dka"||id==="hhs") && flags.indexOf("hypergly")<0) score -= 6;

function chooseSyndrome(flags){
  let best = "pneumonia", bestScore = -1e9;
  Object.keys(SYNDROMES).forEach(function(id){

function normalize(selected){
  const flags = selected.slice();
  const notes = [];
  if(flags.indexOf("hypoBP")>=0 && flags.indexOf("hyperBP")>=0){
    flags.splice(flags.indexOf("hyperBP"),1);
    notes.push("The pressure an hour ago was about 210/120. The pressure in front of you is the low one.");

    flags.splice(flags.indexOf("hypogly"),1);
    notes.push("Glucose is high at the start. It will crash if insulin runs after the glucose has fallen and no dextrose is given.");

function note(why, seen){

function announce(text, force){
  if(!patient || !text) return;
  if(force || !patient._ann) patient._ann = text;
}
let voiceOn = true;
function maleVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  const female = /female|samantha|karen|moira|victoria|allison|zira|susan|heera|sonia|libby|veena|siri|fiona|tessa|serena|nicky|catherine/i;
  const rank = [/rishi/i, /daniel/i, /google uk english male/i, /google us english male/i, /microsoft david/i, /microsoft george/i, /microsoft ravi/i, /alex/i, /fred/i, /aaron/i, /arthur/i, /gordon/i, /oliver/i, /\btom\b/i, /david/i, /james/i, /nathan/i, /\blee\b/i, /\bmale\b/i];
  function label(v){ return (v.name||"")+" "+(v.voiceURI||""); }
  const en = voices.filter(function(v){ return /^en/i.test(v.lang||"") && !female.test(label(v)); });
  for(let i=0;i<rank.length;i++){
    const hit = en.find(function(v){ return rank[i].test(label(v)); });
    if(hit) return hit;
  }
  return en[0] || null;
}
function say(text){
  if(!voiceOn || !text || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g," ").trim());
  if(!u.text) return;
  u.rate = 0.95;
  u.volume = 1;
  const go = function(){
    const v = maleVoice();
    if(v){ u.voice = v; u.pitch = 1; u.lang = v.lang || "en-GB"; }
    else { u.pitch = 0.8; u.lang = "en-GB"; }
    try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(err){}
  };
  if(speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
    setTimeout(go, 80);
  } else go();
}
function hushVoice(){ if(window.speechSynthesis) speechSynthesis.cancel(); }
function vitalLine(p){
  const bits = [];
  if(p.map<65) bits.push("Mean pressure "+p.map+", in the shock range");
  else if(p.sbp>180) bits.push("Blood pressure "+p.sbp+" over "+p.dbp);
  if(p.hr>120) bits.push("heart rate "+p.hr);
  else if(p.hr<50) bits.push("heart rate "+p.hr+", slow");
  if(p.rr>24) bits.push("respiratory rate "+p.rr);
  else if(p.rr<10) bits.push("respiratory rate "+p.rr+", slow");
  if(p.spo2<92) bits.push("saturation "+p.spo2+" percent");
  if(p.gcs<=8) bits.push("GCS "+p.gcs);
  if(p.glucose<70) bits.push("glucose "+p.glucose);
  else if(p.glucose>180) bits.push("glucose "+p.glucose);
  if(!bits.length) return "";
  return "Important findings. "+bits.join(". ")+".";
}
function culturePlan(id){

      sens:"Susceptible to ceftriaxone, piperacillin-tazobactam, and meropenem. Resistant to ampicillin. Vancomycin has no activity.",

function bloodSpeech(kind){
  var p = patient;
  var l = p.results && p.results.labs;
  if(!l) return "";
  var bits = [];
  var hbLo = p.sex==="man" ? 13 : 12;
  var hbHi = p.sex==="man" ? 17 : 15;
  if(kind==="cbc"){
    if(l.cbc.hb<hbLo || l.cbc.hb>hbHi) bits.push("Hemoglobin "+l.cbc.hb+".");
    if(l.cbc.wbc<4 || l.cbc.wbc>11) bits.push("White cells "+l.cbc.wbc+".");
    if(l.cbc.plt<150 || l.cbc.plt>400) bits.push("Platelets "+l.cbc.plt+".");
    return bits.join(" ");
  }
  if(kind==="kft"){
    if(l.rft.urea<15 || l.rft.urea>40) bits.push("Urea "+l.rft.urea+".");
    if(l.rft.creat<0.6 || l.rft.creat>1.2) bits.push("Creatinine "+l.rft.creat+".");
    if(l.rft.na<135 || l.rft.na>145) bits.push("Sodium "+l.rft.na+".");
    if(l.rft.k<3.5 || l.rft.k>5) bits.push("Potassium "+l.rft.k+".");
    if(l.rft.egfr<60) bits.push("Filtration "+l.rft.egfr+".");
    return bits.join(" ");
  }
  if(kind==="lft"){
    if(l.lft.bili>1.2) bits.push("Bilirubin "+l.lft.bili+".");
    if(l.lft.ast>=40) bits.push("AST "+l.lft.ast+".");
    if(l.lft.alt>=40) bits.push("ALT "+l.lft.alt+".");
    if(l.lft.alb<3.5 || l.lft.alb>5) bits.push("Albumin "+l.lft.alb+".");
    return bits.join(" ");
  }
  if(kind==="coag"){
    if(l.coags.pt<11 || l.coags.pt>15) bits.push("Prothrombin time "+l.coags.pt+".");
    if(l.coags.inr<0.8 || l.coags.inr>1.2) bits.push("INR "+l.coags.inr+".");
    if(l.coags.aptt<25 || l.coags.aptt>35) bits.push("aPTT "+l.coags.aptt+".");
    return bits.join(" ");
  }
  if(kind==="inflam"){
    if(l.inflam.crp>=10) bits.push("CRP "+l.inflam.crp+".");
    if(l.inflam.pct>=0.1) bits.push("Procalcitonin "+l.inflam.pct+".");
    return bits.join(" ");
  }
  return "";
}
function panelSpeech(kind){
  var p = patient;
  if(!p || !p.results) return "";
  if(kind==="abg" && p.results.abg){
    var g = p.results.abg, bits = [];
    if(g.ph<7.35 || g.ph>7.45) bits.push("pH "+g.ph+".");
    if(g.pco2<35 || g.pco2>45) bits.push("Carbon dioxide "+g.pco2+".");
    if(g.po2<80) bits.push("Oxygen tension "+g.po2+".");
    if(g.hco3<22 || g.hco3>26) bits.push("Bicarbonate "+g.hco3+".");
    if(g.lactate>2) bits.push("Lactate "+g.lactate+".");
    if(Math.abs(g.be)>2) bits.push("Base excess "+g.be+".");
    if(g.glucose<70 || g.glucose>180) bits.push("Glucose "+g.glucose+".");
    return bits.join(" ");
  }
  if(kind==="cbc" || kind==="kft" || kind==="lft" || kind==="coag" || kind==="inflam") return bloodSpeech(kind);
  if(kind==="cxr" && p.results.cxr){
    if(!p.results.cxr.mark) return "";
    return "Chest radiograph. "+p.results.cxr.mark.label+".";
  }
  if(kind==="ct" && p.results.ct && p.results.ct.mark) return "CT. "+p.results.ct.mark.label+".";
  if(kind==="mri" && p.results.mri && p.results.mri.mark) return "MRI. "+p.results.mri.mark.label+".";
  if(kind==="usg" && p.results.usg && p.results.usg.mark) return "Ultrasound. "+p.results.usg.mark.label+".";
  if(kind==="echo" && p.results.echo){
    var e = p.results.echo, out = [];
    if(e.lvShort && !/^normal/i.test(e.lvShort)) out.push(e.lvShort+".");
    if(e.rvBad) out.push("Right ventricle is abnormal.");
    if(e.rwmaYes) out.push(e.rwmaText);
    if(e.ivcKind && e.ivcKind!=="normal") out.push(e.ivc);
    return out.join(" ");
  }
  return "";
}
function resultSpeech(kind){ return panelSpeech(kind); }
function setBP(sbp, dbp){
  patient.sbp = Math.round(clamp(sbp,60,230));
  patient.dbp = Math.round(clamp(dbp,30,140));
  patient.map = mapOf(patient.sbp, patient.dbp);
}
function nudgeBP(ds, dd){ setBP(patient.sbp+ds, patient.dbp+dd); }
function spoilLungs(n){
  patient.lungWater = Math.max(0, Math.min(10, patient.lungWater + n));
  if(n>0 && patient.lungWater>=6){
    patient.spo2 = Math.max(70, Math.min(100, patient.spo2 - n*2));
    patient.rr = Math.min(46, patient.rr+2);
  }
}
function raiseEvent(seen, why){
  const text = isLab()? why : seen;
  if(patient.events.indexOf(text)>=0) return;
  patient.events.push(text);
  patient.focus = "event";
  patient.sheet = "";
  patient.zoom = "";
  announce(text, true);
  patient.timeline.push(patient.t+" min — "+seen);
  patient.log.unshift({t:patient.t, text:text});
}
function tick(min){
  patient.t += min;
  const id = patient.id;
  if((id==="sepsis"||id==="pneumonia") && !patient.abx && patient.t>=45){
    nudgeBP(-4, -3); patient.lactate += 0.4; patient.hr += 4;
    if(patient.t>=90) once(patient.critical, "Antibiotic delayed past 90 minutes in a lung infection");
  }
  if(patient.map<65){ patient.lactate += 0.3; patient.uo = Math.max(0, patient.uo-8); }
  else if(patient.lactate>1.2) patient.lactate = Math.max(1, patient.lactate-0.2);
  if((id==="hypogly") && !patient.dextrose){
    patient.gcs = Math.max(3, patient.gcs-1);
    patient.spo2 = Math.max(70, patient.spo2-1);
  }
  if(patient.gcs<=8 && !patient.intubated && patient.support!=="imv"){
    if(!patient.airwaySince) patient.airwaySince = patient.t;
    if(patient.t - patient.airwaySince > 25 && !(id==="hypogly" && !patient.dextrose)){
      once(patient.critical, "Airway left unprotected after the reversible causes were addressed or were not the problem");
      patient.spo2 = Math.max(70, patient.spo2-4);
    }
  } else patient.airwaySince = 0;
  if(id==="tension" && !patient.decompressed && patient.t>20){
    nudgeBP(-3,-2); patient.spo2 = Math.max(68, patient.spo2-2);
    once(patient.critical, "Tension pneumothorax left under pressure");
  }
  if(id==="dka" && patient.insulin && !patient.dextrose && patient.glucose<180){
    patient.glucose -= 30;
    if(patient.glucose<70){
      patient.gcs = Math.max(3, patient.gcs-1);
      once(patient.critical, "Insulin continued after the glucose fell, with no dextrose");
    }
  }
  if((id==="sepsis"||id==="pneumonia") && !patient.abx && patient.t>=40)
    raiseEvent("New event. Mottling is worse and the lactate has not turned.", "New event. The infection is untreated. Lactate is climbing because the first antibiotic is not in.");
  if(id==="pe" && !patient.anticoag && !patient.lytic && patient.t>=30 && patient.map<70)
    raiseEvent("New event. The neck veins are still up and the pressure is falling again.", "New event. Shock is persisting with a strained right heart and no treatment for clot.");
  if(id==="dka" && patient.insulin && !patient.dextrose && patient.glucose<220 && patient.glucose>=70)
    raiseEvent("New event. Glucose is nearing 200 mg/dL and insulin is still running.", "New event. Glucose is nearing 200 mg/dL. Add dextrose and keep insulin until the gap closes.");
  if(id==="gib" && patient.bloodU===0 && patient.t>=20 && patient.map<70)
    raiseEvent("New event. Still pale. The pressure did not hold.", "New event. Still pale and hypotensive. Crystalloid is not a substitute for blood.");
  if(id==="ich" && !patient.results.ct && patient.t>=25)
    raiseEvent("New event. Consciousness has not returned.", "New event. Consciousness has not returned and the head has not been imaged.");
  if(id==="tension" && !patient.decompressed && patient.t>=15)
    raiseEvent("New event. The quiet side of the chest is unchanged.", "New event. The quiet hemithorax is still the emergency. Decompress before any further imaging.");
  patient.spo2 = Math.max(68, Math.min(100, Math.round(patient.spo2)));
  patient.hr = Math.max(40, Math.min(180, Math.round(patient.hr)));
  patient.rr = Math.max(6, Math.min(48, Math.round(patient.rr)));
  patient.lactate = +Math.max(0.6, Math.min(15, patient.lactate)).toFixed(1);
  patient.glucose = Math.round(Math.max(20, Math.min(900, patient.glucose)));
  patient.map = mapOf(patient.sbp, patient.dbp);
}

function orderTest(kind, panel){
  tick(10);

  if(kind==="labs") patient.results.labs = labsSnapshot(patient);
  if(kind==="usg") patient.results.usg = usgReport(patient);
  if(kind==="cxr") patient.results.cxr = cxrReport(patient);
  if(kind==="ct"){
    patient.results.ct = ctReport(patient);
    if(patient.id==="tension" && !patient.decompressed && patient.map<70){
      once(patient.critical, "CT before decompression in tension pneumothorax");

  }

  patient.focus = kind==="echo" ? "echo" : "result";

function oxygenBonus(level){
  const table = {room:0, np:3, fm:5, nrb:8, hfnc:11, cpap:12, bipap:13, imv:14};
  let b = table[level]||0;
  if(patient.syn.oxygen==="poor") b = Math.round(b*0.6);
  if(patient.syn.oxygen==="blocked" && !patient.decompressed) b = Math.round(b*0.35);
  return b;
}
function setSupport(level){
  if(level==="cpap"||level==="bipap"||level==="imv"){
    patient.pending = level;
    patient.sheet = "oxygen";
    patient.focus = "vent";
    render();
    return;
  }
  patient.pending = "";
  applyDevice(level, false);
}
function applyDevice(level, silent){
  if(!silent) tick(5);
  patient.shown = null;
  const before = oxygenBonus(patient.support);
  patient.support = level;
  patient.intubated = level==="imv";
  if(level==="cpap"||level==="bipap"||level==="imv") patient.focus = "vent";
  const delta = oxygenBonus(level) - before;
  patient.spo2 = Math.max(70, Math.min(100, patient.spo2+delta));
  if((level==="cpap"||level==="bipap") && patient.gcs<9 && !patient.intubated){
    patient.spo2 = Math.max(70, patient.spo2-6);
    once(patient.critical, "Non-invasive ventilation while the airway was not protected");
    note("The mask is on a patient who is not protecting the airway. Oxygen fell.", "Vomited under the mask. Saturation fell.");
  } else if(level==="imv" && patient.id==="hypogly" && !patient.dextrose){
    once(patient.critical, "Intubation before dextrose in witnessed hypoglycemia");
    note("The tube treats the airway. It does not treat a glucose of this level. Dextrose was still the first drug.", "Intubated. Glucose unchanged.");
  } else if(level==="imv" && patient.id==="pe" && patient.map<70){
    nudgeBP(-8,-4);
    note("Induction dropped the venous return. The right ventricle had no reserve.", "Pressure fell on induction.");
    once(patient.bad, "Intubation in massive pulmonary embolism while shocked");
  } else if(delta>0){
    once(patient.good, "Oxygen support matched to the saturation");
    note("Saturation rose because the inspired oxygen, or the pressure in the airway, met the problem.", "Saturation changed after the device change.");
  } else {
    note("This device was not enough for the mechanism in front of you.", "Little change in saturation.");
  }
  if(!silent) render();
}
function applyVent(){
  var level = patient.pending || ((patient.support==="cpap"||patient.support==="bipap"||patient.support==="imv") ? patient.support : "");
  if(!level){
    note("Those ventilator numbers are not attached to a patient on NIV or a tube.", "Settings saved, but no NIV or tube is running.");
    return render();
  }
  var fresh = !!patient.pending;
  patient.pending = "";
  if(fresh) applyDevice(level, true);
  tick(5);
  const v = patient.vent;
  const tvkg = v.tv / patient.pbw;
  if(patient.support==="imv"){
    if(tvkg>10){ once(patient.critical, "Tidal volume above 10 mL/kg predicted body weight"); spoilLungs(2); }
    else if(tvkg>8){ once(patient.bad, "Tidal volume above 8 mL/kg predicted body weight"); spoilLungs(1); }
    else once(patient.good, "Lung-protective tidal volume");
    if(patient.id==="pe" && v.peep>=14){
      nudgeBP(-10,-6);
      once(patient.critical, "High PEEP in right-ventricular failure");
      note("High PEEP raised the afterload on a failing right ventricle. The pressure fell.", "Pressure fell after the PEEP change.");
    } else {
      note("The ventilator is running at "+v.mode+", "+v.tv+" mL, about "+tvkg.toFixed(1)+" mL/kg predicted weight, PEEP "+v.peep+".", "Ventilator settings applied.");
    }
    patient.pco2 = Math.max(18, Math.min(70, 40 - (v.rr-14)*0.8 - (tvkg-6)*1.5));
  } else if(patient.support==="cpap"||patient.support==="bipap"){
    const drive = v.ipap - v.epap;
    if(v.epap<5 && (patient.id==="edema"||patient.id==="cardiogenic")){
      once(patient.bad, "EPAP too low for pulmonary edema");
      note("Edema needs end-expiratory pressure. A wide drive with a low EPAP is the wrong shape.", "Work of breathing is still high.");
    } else if(drive<4){
      once(patient.bad, "Pressure support on NIV is too small");
      note("The drive pressure is too small to rest the patient.", "The patient is still tachypneic.");
    } else {
      patient.rr = Math.max(16, patient.rr-4);
      patient.spo2 = Math.max(70, Math.min(100, patient.spo2+2));
      once(patient.good, "NIV pressures in a usable range");
      note("The pressures are in a range that can rest a wet or a stiff lung, if the airway is safe.", "The rate has eased a little.");
    }
  } else {
    note("Those ventilator numbers are not attached to a patient on NIV or a tube.", "Settings saved, but no NIV or tube is running.");
  }
  render();
}

  patient.bags.push({id:id, label:label});
}
function lineOn(id, name, detail){
  if(!patient.lines) patient.lines = [];
  patient.lines = patient.lines.filter(function(x){ return x.id!==id; });
  patient.lines.push({id:id, name:name, detail:detail || "infusion"});
}
function lineOff(id){
  if(!patient.lines) return;
  patient.lines = patient.lines.filter(function(x){ return x.id!==id; });
}
function bolus(ml, fluid){
  tick(8);
  patient.fluidMl += ml;
  patient.boluses += 1;
  hangBag(fluid==="saline" ? "ns" : "rl", fluid==="saline" ? "NS" : "RL");
  const pre = patient.syn.preload;
  const echo = patient.results.echo;
  const full = pre==="full" || (echo && (echo.volume==="overloaded"||echo.volume==="obstructed"));
  const empty = pre==="empty" && !(echo && echo.volume==="overloaded");
  if(patient.id==="tension" && !patient.decompressed){
    once(patient.bad, "Fluid used as the treatment of tension");
    note("Fluid does not leave the chest. The pressure barely moves.", "Little change. The chest is still silent.");
    return render();
  }
  if(full || pre==="obstruct" && patient.boluses>1){
    spoilLungs(pre==="full"?2:1);
    if(pre==="full") nudgeBP(-4,-2);
    if(echo && (echo.volume==="overloaded"||echo.ef==="low") && pre==="full")
      once(patient.critical, "Fluid bolus into a full, failing heart after the echo was seen");
    else once(patient.bad, "Fluid into a circulation that was not empty");
    note("The ventricle was not asking for volume. Lung water rose and the oxygen fell.", "More breathless. Saturation dipped.");
  } else if(empty && patient.boluses<=3){
    nudgeBP(ml>=500?10:6, ml>=500?6:4);
    patient.hr = Math.max(70, patient.hr-8);
    patient.lactate = Math.max(1, patient.lactate-0.4);
    patient.uo += 10;
    once(patient.good, "Fluid while underfilled");
    note((fluid==="balanced"?"A balanced crystalloid ":"Saline ")+"met an empty circulation. Pressure rose. Look again before the next bag.", "Pressure rose after the bolus.");
    if(fluid==="saline" && patient.fluidMl>=2000){
      patient.bad.push("Large saline load");
      note("The chloride load of this much saline will show up as a tighter difference between sodium and chloride.", "A lot of saline is now in.");
    }
  } else if(pre==="obstruct" && patient.boluses===1 && ml<=250){
    nudgeBP(3,2);
    once(patient.good, "Small fluid challenge only, in obstruction");
    note("A small challenge is the most the right ventricle will accept. Stop there.", "A small rise, then no more.");
  } else if(pre==="obstruct" && patient.boluses===1){
    spoilLungs(1);
    once(patient.bad, "A large fluid load in obstructive shock");
    note("Half a litre is more than a blocked circulation will accept. A small challenge is the ceiling.", "Little gain, and the oxygen is not better.");
  } else {
    spoilLungs(1);
    once(patient.bad, "Repeated fluid without a new look");
    note("Further fluid, after the first response, is how edema starts.", "The oxygen is not better.");
  }
  render();
}
function givePressor(which){
  tick(5);
  patient.pressor = which;
  if(which==="none"){ lineOff("press"); note("Vasopressor stopped.", "Vasopressor stopped."); return render(); }
  if(which==="norepi") lineOn("press","Norepinephrine","0.05 mcg/kg/min");
  else if(which==="dobutamine") lineOn("press","Dobutamine","2.5 mcg/kg/min");
  else if(which==="vaso") lineOn("press","Vasopressin","0.03 unit/min");
  if(patient.id==="gib" && patient.bloodU===0){
    once(patient.bad, "Vasopressor before blood in hemorrhage");
    nudgeBP(6,5);
    note("The number rose and the tank is still empty. Blood is the drug.", "Pressure up. Still pale.");
  } else if(patient.id==="edema"){
    once(patient.bad, "A vasopressor for hypertensive edema");
    nudgeBP(16,12);
    note("The pressure was already high. A vasopressor is the wrong direction.", "Pressure is higher.");
  } else if(which==="dobutamine" && patient.map<65){
    nudgeBP(-6,-4); patient.hr += 12;
    once(patient.bad, "Dobutamine while profoundly hypotensive");
    note("Dobutamine can drop the pressure when the tank of resistance is empty. Norepinephrine first.", "Pressure fell and the rate rose.");
  } else if(which==="norepi" && (patient.map<70 || patient.id==="pe"||patient.id==="cardiogenic"||patient.id==="sepsis")){
    nudgeBP(14,10);
    once(patient.good, "Norepinephrine for a low mean pressure");
    note("Norepinephrine raised the mean pressure. Check the fingers, the lactate, and the urine, not only the number.", "Mean pressure rose.");
  } else if(which==="dobutamine" && (patient.id==="cardiogenic"||patient.id==="edema") && patient.map>=65){
    nudgeBP(4,2); patient.hr += 8; patient.lactate = Math.max(1, patient.lactate-0.3);
    once(patient.good, "Inotrope while the pressure allowed it");
    note("An inotrope is reasonable once the pressure is not critically low and the ventricle is the problem.", "Output feels better. Rate is up.");
  } else if(which==="vaso"){
    nudgeBP(6,6);
    once(patient.good, "Vasopressin as a second vasopressor");
    note("Vasopressin is an adjunct, not the first drug, and not a substitute for blood or for opening a pneumothorax.", "A small additional rise.");
  } else {
    nudgeBP(8,6);
    note("The pressure moved. Ask whether the mechanism wanted this drug.", "Pressure changed.");
  }
  render();
}
function giveBPDrug(which){
  tick(5);
  if(patient.map<70 || patient.sbp<100){
    nudgeBP(-18,-14);
    once(patient.critical, "An antihypertensive given to a hypotensive patient");
    note("The pressure was already low. This drug took what was left.", "Pressure crashed.");
    return render();
  }
  if(which==="gtn"){
    patient.nitrate = true;
    lineOn("gtn","GTN","10 mcg/min");
    if(patient.id==="edema"){
      nudgeBP(-28,-16); patient.spo2 = Math.min(100, patient.spo2+3); spoilLungs(-1);
      once(patient.good, "Nitrate for hypertensive pulmonary edema");
      note("Nitrate unloaded the left ventricle. Oxygen followed the pressure down toward a safer range.", "Pressure fell. Breathing is easier.");
    } else if(patient.id==="ich"){
      nudgeBP(-20,-12);
      once(patient.bad, "Nitrate in intracranial hemorrhage");
      note("A nitrate can raise intracranial pressure. Nicardipine or labetalol is the cleaner choice here.", "Pressure fell. This was not the preferred drug.");
    } else {
      nudgeBP(-16,-10);
      note("The pressure fell. Be sure the syndrome was a high-pressure one.", "Pressure fell.");
    }
  } else if(which==="labetalol"){
    lineOn("lab","Labetalol","IV bolus");
    if(patient.id==="ich" && patient.sbp>160){
      nudgeBP(-22,-14); patient.hr -= 12;
      once(patient.good, "Controlled blood-pressure fall in hemorrhage");
      note("A smooth fall, not a collapse. The target is a safer systolic pressure, not a normal one in five minutes.", "Pressure and rate came down.");
    } else if(patient.id==="edema"||patient.id==="cardiogenic"){
      nudgeBP(-10,-8); patient.hr -= 16;
      once(patient.bad, "Beta blockade in acute heart failure");
      note("The failing heart needed rate and contractility. A beta blocker took both.", "Slower, and not stronger.");
    } else { nudgeBP(-12,-8); note("Pressure fell.", "Pressure fell."); }
  } else if(which==="nicardipine"){
    lineOn("nic","Nicardipine","infusion");
    if(patient.id==="ich" && patient.sbp>160){
      nudgeBP(-20,-12);
      once(patient.good, "Nicardipine in intracranial hemorrhage");
      note("Nicardipine lowers the pressure without the beta-blocker hit on contractility.", "Pressure came down in a controlled way.");
    } else if(patient.id==="edema"){
      nudgeBP(-18,-12);
      once(patient.good, "A vasodilator in hypertensive edema");
      note("Useful, though a nitrate unloads the lung more directly.", "Pressure fell.");
    } else { nudgeBP(-14,-8); note("Pressure fell.", "Pressure fell."); }
  }
  render();
}
function giveDiuretic(){
  tick(8);
  patient.diuretic = true;
  lineOn("fur","Furosemide","IV bolus");
  if(patient.syn.preload==="full" && patient.sbp>=90){
    spoilLungs(-2); patient.spo2 = Math.min(100, patient.spo2+3); patient.uo += 40;
    once(patient.good, "Diuretic for a wet circulation");
    note("Urine came. Lung water fell, as long as the pressure stayed safe.", "A diuresis started.");
  } else if(patient.syn.preload==="empty"||patient.id==="gib"||patient.id==="dka"||patient.id==="hhs"){
    nudgeBP(-8,-5); patient.uo += 20; patient.k = Math.max(2.6, patient.k-0.3);
    once(patient.bad, "Diuretic while volume-deplete");
    note("The patient was dry. The diuretic took pressure and potassium.", "Pressure dipped after the diuretic.");
  } else {
    patient.uo += 15;
    note("A modest diuresis. Check that the lungs were the reason.", "Urine output rose.");
  }
  render();
}
function giveSedation(){
  tick(5);
  patient.sedation = "analgesia-sedation";
  lineOn("sed","Fentanyl / propofol","infusion");
  if(patient.intubated){
    patient.hr = Math.max(50, patient.hr-6);
    once(patient.good, "Analgesia and sedation on a secured airway");
    note("The tube is in. Analgesia first, then a sedative, aimed at comfort rather than a flat line.", "Sedation started on the ventilator.");
  } else {
    patient.gcs = Math.max(3, patient.gcs-2);
    patient.rr = Math.max(6, patient.rr-4);
    patient.spo2 = Math.max(70, patient.spo2-3);
    once(patient.bad, "Sedation without a protected airway");
    if(patient.gcs<=8) once(patient.critical, "Sedation dropped consciousness with no airway plan");
    note("A sedative took the respiratory drive in a patient who is not intubated.", "Harder to rouse, and the rate fell.");
  }
  render();
}
function giveAbx(id){
  tick(5);
  patient.abx = id;
  lineOn("abx", ABXNAME[id] || id, "IV infusion");
  const ok = patient.syn.abx.indexOf(id)>=0;
  if(patient.syn.abx.length===0){
    once(patient.bad, "Antibiotic with no bacterial source");
    note("There is no bacterial source in this illness. The drug does not treat it.", "Antibiotic given. No change in the illness.");
  } else if(id==="vanc"){
    once(patient.bad, "Vancomycin alone for this source");
    note("The report shows no activity for vancomycin against this Gram-negative rod.", "Vancomycin does not match the microbiology report.");
  } else if(ok){
    once(patient.good, "Antibiotic covers the source");
    if(patient.cultures) once(patient.good, "Cultures taken before the antibiotic");
    if(patient.t<=60) once(patient.good, "Antibiotic within the hour");
    note("The report shows this drug is active. Match the dose to the kidney, and do not add vancomycin for an organism it does not touch.", "Antibiotic matches the microbiology report.");
    if(patient.egfr<50 && !patient.renal && (id==="mero"||id==="piptazo")){
      once(patient.bad, "No renal adjustment despite a low GFR");
      note("The GFR is under 50. Meropenem and piperacillin need a wider interval. Ceftriaxone does not.", "Dose not changed for the kidney.");
      announce("The filtration rate is under 50. This dose was not adjusted for the kidney.", true);
    }
    if(patient.egfr>=60 && patient.renal){
      once(patient.bad, "Renal dose despite a normal GFR");
      note("The GFR does not need a reduction. A renal dose here is an underdose.", "Dose reduced without a renal reason.");
      announce("Filtration is normal. A renal dose here is an underdose.", true);
    }
    if(patient.egfr<50 && patient.renal && (id==="mero"||id==="piptazo")) once(patient.good, "Renal adjustment when the GFR was low");
  } else {
    once(patient.bad, "Antibiotic does not match the source");
    note("This is not the best spectrum for the source in front of you.", "Antibiotic given.");
  }
  render();
}
function giveMetabolic(which){
  tick(5);
  if(which==="d50"){
    patient.dextrose = true;
    lineOn("d50","Dextrose 50%","IV bolus");
    if(patient.glucose<70){
      patient.glucose = jit(146,15);
      if(patient.id==="hypogly"){
        patient.gcs = Math.max(patient.gcs, 14);
        patient.spo2 = Math.min(100, patient.spo2+4);
        once(patient.good, "Dextrose for hypoglycemia");
        note("Glucose rose and consciousness followed it, because hypoglycemia was the cause.", "Woke as the glucose rose.");
      } else {
        patient.gcs = Math.min(15, patient.gcs+1);
        note("Glucose was low and is now safer. Consciousness only partly follows it, so the glucose was not the whole cause.", "Glucose corrected.");
      }
    } else {
      patient.glucose += 80;
      once(patient.bad, "Dextrose while glucose was already high");
      note("The glucose was not low. Fifty percent dextrose made it higher.", "Glucose rose further.");
    }
  } else if(which==="insulin"){
    if(!patient.results.labs){
      once(patient.critical, "Insulin before the potassium was known");
      note("You have not seen the potassium. Insulin can stop the heart if the potassium is low.", "Insulin started without a potassium.");
    } else if(patient.k<3.3){
      once(patient.critical, "Insulin while potassium was under 3.3");
      patient.hr = 140; patient.k = Math.max(2.2, patient.k-0.4);
      note("Potassium was under 3.3. Insulin drives it lower. Replace potassium and hold the infusion.", "Rhythm became unstable.");
    } else if(patient.id==="dka"||patient.id==="hhs"||patient.glucose>250){
      patient.insulin = true;
      lineOn("insulin","Insulin","0.1 unit/kg/h");
      patient.glucose = Math.round(patient.glucose*0.75);
      patient.k = Math.max(2.8, +(patient.k-0.4).toFixed(1));
      patient.hco3 = Math.min(22, patient.hco3+3);
      once(patient.good, "Insulin after a safe potassium");
      note("Insulin is running. Potassium will fall. Add dextrose as the glucose nears 200 and do not stop insulin while the gap is open.", "Glucose is falling.");
    } else {
      patient.glucose = Math.max(40, patient.glucose-60);
      once(patient.bad, "Insulin when glucose was not high");
      note("There was no reason for insulin. Glucose fell.", "Glucose fell.");
    }
  } else if(which==="kcl"){
    patient.k = +(patient.k+0.6).toFixed(1);
    lineOn("kcl","Potassium chloride","IV infusion");
    once(patient.good, "Potassium replaced");
    note("Potassium replaced. Recheck it. This is what allows insulin when the serum value was low.", "Potassium rising.");
  } else if(which==="dexinf"){
    patient.dextrose = true;
    hangBag("d5","5D");
    lineOn("d5","5D","infusion");
    if(patient.insulin && patient.glucose<220){
      patient.glucose = Math.max(140, patient.glucose);
      once(patient.good, "Dextrose infusion while insulin continues");
      note("Dextrose lets the insulin keep closing the gap after the glucose has fallen.", "Dextrose running beside insulin.");
    } else {
      note("A dextrose infusion is for the moment insulin would otherwise make the patient hypoglycemic.", "Dextrose infusion started.");
    }
  } else if(which==="bicarb"){
    lineOn("bic","Sodium bicarbonate","IV");
    if(patient.id==="dka" && phOf(patient.hco3, patient.pco2)<6.9){
      patient.hco3 += 2; once(patient.good, "Bicarbonate only at a very low pH");
    } else {
      once(patient.bad, "Bicarbonate without a severe acidemia");
      note("Bicarbonate is not the treatment of ketoacidosis, sepsis, or a respiratory acidosis.", "Bicarbonate given.");
    }
  }
  render();
}
function procedure(which){
  tick(8);
  if(which==="decompress"){
    if(patient.id==="tension"){
      patient.decompressed = true;
      setBP(jit(110,6), jit(68,4));
      patient.spo2 = Math.min(100, patient.spo2+10);
      patient.hr = Math.max(90, patient.hr-15);
      once(patient.good, "Decompression of tension pneumothorax");
      note("The pressure returned as the air left the pleura. A drain still has to follow the needle or the finger.", "Pressure and saturation rose as the chest was decompressed.");
    } else {
      once(patient.critical, "Pleural decompression with no pneumothorax");
      spoilLungs(1); patient.spo2 = Math.max(80, patient.spo2-4);
      note("You put air into a pleura that did not have a tension pneumothorax.", "A new pneumothorax. Saturation fell.");
    }
  } else if(which==="drain"){
    patient.drained = true;
    if(patient.id==="tension"){
      if(!patient.decompressed){ patient.decompressed = true; setBP(jit(108,6), jit(66,4)); patient.spo2 = Math.min(100, patient.spo2+8); }
      once(patient.good, "Chest drain for pneumothorax");
      note("The drain is in. Do not clamp it while it bubbles.", "Drain swinging.");
    } else {
      once(patient.bad, "Chest drain without a collection or a pneumothorax");
      note("There was no drainable collection and no pneumothorax.", "A drain was placed without a target.");
    }
  } else if(which==="blood"){
    patient.bloodU += 1;
    hangBag("blood","Blood");
    if(patient.id==="gib"||patient.hb<7.5){
      patient.hb = +(patient.hb+1).toFixed(1);
      nudgeBP(12,8); patient.hr = Math.max(80, patient.hr-10); patient.lactate = Math.max(1, patient.lactate-0.5);
      once(patient.good, "Blood for bleeding or a low hemoglobin");
      note("Blood is the replacement. Another unit is a response to the pressure and the hemoglobin, not a reflex.", "Less pale. Pressure rose.");
    } else {
      once(patient.bad, "Transfusion with a safe hemoglobin and no bleeding");
      note("The hemoglobin did not ask for blood.", "A unit was given without a clear target.");
    }
  } else if(which==="pcc"){
    if(patient.inr>2){
      patient.inr = 1.4; patient.reversed = true;
      once(patient.good, "Coagulopathy reversed in bleeding");
      note("Warfarin reversal belongs with the blood, not instead of it.", "INR is coming down.");
    } else {
      once(patient.bad, "Clotting factors without a coagulopathy");
      note("The INR was not high.", "Factors given. Little reason.");
    }
  } else if(which==="ppi"){
    lineOn("ppi","Pantoprazole","infusion");
    if(patient.id==="gib"){ once(patient.good, "Acid suppression in upper gastrointestinal bleeding"); note("A proton-pump inhibitor is part of ulcer bleeding. It does not replace blood or endoscopy.", "Infusion started."); }
    else { once(patient.bad, "Acid suppression with no gastrointestinal bleed"); note("No ulcer to treat.", "Infusion started. No relevant effect."); }
  } else if(which==="aspirin"){
    if(patient.id==="cardiogenic"){ patient.aspirin = true; once(patient.good, "Aspirin in an acute coronary pattern"); note("Aspirin now, if the bleed risk is not the story. Reperfusion is a separate call.", "Aspirin given."); }
    else if(patient.id==="ich"||patient.id==="gib"){ once(patient.critical, "Aspirin in hemorrhage"); note("This patient is bleeding. Aspirin adds to it.", "Aspirin given into a bleed."); }
    else { once(patient.bad, "Aspirin without an acute coronary syndrome"); note("No coronary syndrome to treat.", "Aspirin given."); }
  } else if(which==="heparin"){
    patient.anticoag = true;
    lineOn("hep","Heparin","infusion");
    if(patient.id==="pe"){ once(patient.good, "Anticoagulation for pulmonary embolism"); note("Treatment-dose anticoagulation. Thrombolysis is for persistent shock, not for every clot.", "Anticoagulant running."); }
    else if(patient.id==="ich"||patient.id==="gib"){ once(patient.critical, "Anticoagulation during active bleeding"); note("You anticoagulated a bleeding patient.", "Bleeding risk just rose."); }
    else { once(patient.bad, "Anticoagulation without a clot"); note("No thrombus to treat.", "Anticoagulant started."); }
  } else if(which==="lytic"){
    patient.lytic = true;
    if(patient.id==="pe" && patient.map<70){
      nudgeBP(16,10); patient.spo2 = Math.min(100, patient.spo2+4);
      once(patient.good, "Thrombolysis for massive pulmonary embolism");
      note("Shock that is still there after pressure support is the setting for thrombolysis. Bleeding is the cost.", "Pressure rose after thrombolysis.");
    } else if(patient.id==="ich"){
      once(patient.critical, "Thrombolysis in intracerebral hemorrhage");
      note("Thrombolysis into a brain hemorrhage is a catastrophe.", "The neurological picture worsened.");
      patient.gcs = Math.max(3, patient.gcs-2);
    } else {
      once(patient.critical, "Thrombolysis without a massive pulmonary embolism or a coronary indication you have proved");
      note("There is no proved massive clot to lyse.", "Thrombolysis given.");
    }
  } else if(which==="naloxone"){
    patient.naloxone = true;
    lineOn("nal","Naloxone","IV bolus");
    if(patient.id==="opioid"){
      patient.rr = jit(16,2); patient.gcs = 13; patient.spo2 = Math.min(100, patient.spo2+6);
      once(patient.good, "Naloxone for opioid overdose");
      note("The rate and the consciousness rose. The opioid will outlast a single dose. Watch.", "Woke, and the rate rose.");
    } else {
      note("Naloxone did nothing. Opioid was not the cause. A trial in a slow, unconscious patient is reasonable. It is not a treatment of hemorrhage or sepsis.", "No change after naloxone.");
      if(patient.rr>=18) once(patient.bad, "Naloxone in a patient who was not hypoventilating");
    }
  } else if(which==="head"){
    patient.headUp = true;
    if(patient.id==="ich"){ once(patient.good, "Head-up position in brain injury"); note("Head up, neck straight. That is the position, not a substitute for the scan.", "Positioned head up."); }
    else note("Head-up is harmless in most of these illnesses and essential in brain injury.", "Head of the bed raised.");
  } else if(which==="osmotic"){
    patient.osmotic = true;
    hangBag("hts","3% saline");
    lineOn("osm","Hypertonic saline","infusion");
    if(patient.id==="ich" && patient.gcs<=8){
      once(patient.good, "Osmotherapy for a low consciousness in hemorrhage");
      note("Hypertonic saline or mannitol is for herniation or a sharply falling consciousness, not a standing order.", "Osmotherapy given.");
    } else {
      once(patient.bad, "Osmotherapy without brain herniation");
      note("There is no brain herniation to treat. Osmotherapy shifts volume and is not a blood-pressure drug.", "Osmotherapy given.");
    }
  } else if(which==="crrt"){
    if(patient.crrt){
      note("The circuit is already running.", "CRRT is already running.");
    } else {
      patient.crrt = true;
      if(patient.syn.preload==="full"){
        spoilLungs(-1);
        patient.uo += 25;
        once(patient.good, "Renal replacement while the circulation was full");
        note("Ultrafiltration took lung water while the pressure allowed it.", "Dialysis started. Lung water is falling.");
      } else if(patient.syn.preload==="empty" || patient.id==="gib"){
        nudgeBP(-8,-5);
        once(patient.bad, "Dialysis started while the circulation was empty");
        note("Fluid removal in an empty patient dropped the pressure.", "Pressure fell after dialysis started.");
      } else {
        note("The circuit is running. It is not the treatment of the main problem.", "Dialysis circuit started.");
      }
    }
  }
  render();
}
function commitEcho(ans){
  const e = patient.results.echo;
  if(!e) return;
  patient.echoRead = ans;
  const miss = {
    lv: !((e.ef==="low"&&ans.lv==="low")||(e.ef==="high"&&ans.lv==="high")||(e.ef==="normal"&&ans.lv==="normal")),
    rv: (!!e.rvBad)!==(ans.rv==="yes"),
    rw: (!!e.rwmaYes)!==(ans.rw==="yes"),
    eff: ans.eff!=="none",
    ivc: e.ivcKind!==ans.ivc,
    vol: !(e.volume===ans.vol || (e.volume==="obstructed"&&ans.vol==="overloaded")),
    ob: !((e.obstruct==="no"&&ans.ob==="no")||(e.obstruct!=="no"&&ans.ob==="yes"))
  };
  const ok = !miss.lv && !miss.rv && !miss.rw && !miss.eff && !miss.ivc && !miss.vol && !miss.ob;
  patient.echoMiss = ok ? null : miss;
  if(ok){
    once(patient.good, "Echo read correctly");
    note("The read matches the study. An empty heart can take fluid. A full one cannot. A failing right ventricle is an obstruction.", "Echo interpretation recorded.");
  } else {
    once(patient.bad, "Echo read does not match the study");
    note(isLab()?"The mark shows the finding that disagrees with your read. Fluid and pressure choices that follow a wrong read will be wrong.":"That read does not match the study.", "Echo interpretation recorded.");
  }
  render();
}

function scorePatient(dx, shock, resp){
  let score = 35;
  if(dx===patient.id) score += 25; else score -= 8;
  if(shock===patient.syn.shock) score += 12;
  if(resp===patient.syn.resp) score += 12;
  score += Math.min(24, patient.good.length*4);
  score -= patient.bad.length*4;
  score -= patient.critical.length*12;
  if(mode==="arena" && wall<=0) score -= 6;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c];
  });
}

  return "<div class='vitals'>"+
    cell("MAP", p.map, p.map<65)+

    cell("HR", p.hr, p.hr>120||p.hr<50)+

    cell("SpO2", p.spo2+"%", p.spo2<92)+

function ensureBed(){
  if(bedStarted || typeof requestAnimationFrame!=="function") return;
  bedStarted = true;
  requestAnimationFrame(bedFrame);
}
function primeAudio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(!audioCtx) audioCtx = new AC();
  if(audioCtx.state==="suspended") audioCtx.resume();
  if(!noiseBuf && audioCtx){
    var n = audioCtx.sampleRate;
    noiseBuf = audioCtx.createBuffer(1, n, n);
    var data = noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++) data[i] = Math.random()*2-1;
  }
}
function tone(freq, t, dur, type, gain){
  if(!audioCtx || !soundOn) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(Math.max(0.0001, gain), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function whoosh(t, dur){
  if(!audioCtx || !noiseBuf || !soundOn) return;
  var src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  var f = audioCtx.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.setValueAtTime(420, t);
  f.frequency.exponentialRampToValueAtTime(880, t+dur*0.35);
  f.frequency.exponentialRampToValueAtTime(260, t+dur);
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.045, t+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t+dur+0.02);
}
function runBedAudio(){
  if(!audioCtx || !soundOn || !patient) return;
  if(audioCtx.state==="suspended") return;
  var now = audioCtx.currentTime;
  var hr = Math.max(35, patient.hr||80);
  var gap = 60/hr;
  if(nextPulse < now - gap) nextPulse = now + 0.02;
  var guard = 0;
  while(nextPulse < now + 0.4 && guard < 8){
    tone(880, nextPulse, 0.055, "sine", 0.075);
    nextPulse += gap;
    guard++;
  }
  var vent = patient.support==="cpap" || patient.support==="bipap" || patient.support==="imv";
  if(vent){
    var rr = patient.support==="imv" ? (patient.vent.rr||16) : (patient.vent.backup||12);
    var bgap = 60/Math.max(6, rr);
    if(nextBreath < now - bgap) nextBreath = now + 0.04;
    if(now + 0.05 >= nextBreath){
      tone(160, nextBreath, 0.05, "sine", 0.03);
      whoosh(nextBreath, 0.62);
      nextBreath += bgap;
    }
  }
  var ventIssue = vent && (patient.spo2<88 || (patient.support==="imv" && patient.vent.tv/patient.pbw>10));
  var monAlarm = patient.spo2<88 || patient.map<55;
  if(ventIssue || monAlarm){
    if(nextAlarm < now-0.2) nextAlarm = now;
    if(now+0.06 >= nextAlarm){
      tone(ventIssue?980:740, nextAlarm, 0.11, "square", 0.028);
      nextAlarm += ventIssue ? 0.42 : 0.85;
    }
  }
}
function bedFrame(ts){
  requestAnimationFrame(bedFrame);
  if(!patient) return;
  drawMonitor(ts);
  drawVentWaves(ts);
  drawEcho(ts);
  sizeScene();
  var chest = document.getElementById("breathpic");
  if(chest){
    var rate = breathRate();
    var ph = ((ts/1000) * rate/60) % 1;
    var f, amp = 1;
    if(onVent()){
      var snap = ventNow();
      f = ventSample(ph, snap).vol;
      amp = Math.max(0.6, Math.min(1.5, snap.tv/450));
    } else {
      f = respWave(ph);
    }
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var rise = Math.max(0, Math.min(1, amp * f));
    var sy = (1 + 0.34 * rise).toFixed(3);
    var sx = (1 + 0.05 * rise).toFixed(3);
    chest.style.transform = still ? "none" : "scale("+sx+","+sy+")";
  }
  runBedAudio();
}

  if(html!==lastNums || el.getAttribute("data-who")!==patient.uid){
    lastNums = html; el.setAttribute("data-who", patient.uid); el.innerHTML = html;
  }
}
function pumpLabel(){
  var bits = [];
  if(patient.pressor==="norepi") bits.push("NE");
  else if(patient.pressor==="dobutamine") bits.push("DOB");
  else if(patient.pressor==="vaso") bits.push("VP");
  else if(patient.pressor && patient.pressor!=="none") bits.push("DRIP");
  if(patient.insulin) bits.push("INS");
  if(patient.nitrate) bits.push("GTN");
  return bits.join(" ") || "IV";
}

function bedKey(){
  var s = patient.support || "room", woman = patient.sex==="woman", name = "room";
  if(s==="imv") name = "imv"; else if(s==="cpap"||s==="bipap") name = "niv";
  else if(s==="fm"||s==="nrb"||s==="np"||s==="hfnc") name = woman ? "mask" : (s==="np"||s==="hfnc" ? "cannula" : "mask");
  return woman ? "woman-"+name : name;
}
function bedFile(){
  var s = patient.support || "room";
  var woman = patient.sex==="woman";
  var name = "room";
  if(s==="imv") name = "imv";
  else if(s==="cpap" || s==="bipap") name = "niv";
  else if(s==="fm" || s==="nrb" || s==="np" || s==="hfnc") name = woman ? "mask" : (s==="np" || s==="hfnc" ? "cannula" : "mask");
  var file = woman ? ("sim/bed/woman-"+name+".jpg") : ("sim/bed/"+name+".jpg");
  return file+"?v=20261107k";
}
function syncBay(){
  var bay = document.getElementById("bay");
  if(!bay) return;
  if(!patient){ bay.hidden = true; placeBed(); return; }
  bay.hidden = false;
  if(bay.getAttribute("data-who")!==patient.uid){
    bay.setAttribute("data-who", patient.uid);
    bay.innerHTML = bayMarkup();
    MON.uid = "";
  }
  var scene = document.getElementById("scene");
  if(!scene) return;
  var vent = patient.support==="cpap" || patient.support==="bipap" || patient.support==="imv";
  var alertOn = patient.spo2<88 || patient.map<55 || (patient.support==="imv" && patient.vent.tv/patient.pbw>10);
  scene.className = "scene o2-"+patient.support+(alertOn?" alerting":"");
  var src = bedFile();
  var pic = document.getElementById("bedpic");
  if(pic && pic.getAttribute("src")!==src) pic.src = src;
  var breath = document.getElementById("breathpic");
  if(breath && breath.getAttribute("src")!==src) breath.src = src;
  var vg = document.getElementById("ventglass");
  if(vg) vg.hidden = !vent;
  var G = sceneGeo();
  placeGlass(G);
  var gsv = document.getElementById("gearsvg");
  if(gsv) gsv.innerHTML = gearSvg(G);
  var gbt = document.getElementById("gearbtns");
  if(gbt) gbt.innerHTML = gearButtons(G);
  var onscreen = document.getElementById("onscreen");
  if(onscreen) onscreen.innerHTML = gearScene();
  sizeScene();
  bindGear();
  paintVentReadout();
  paintNums();
  ensureBed();
  placeBed();
}
function shortDrug(name){
  var map = {"Norepinephrine":"Norepi","Piperacillin-tazobactam":"Pip-tazo","Ceftriaxone + azithromycin":"Ceftriaxone","Fentanyl / propofol":"Fentanyl","Potassium chloride":"KCl","Sodium bicarbonate":"Bicarb","Hypertonic saline":"3% saline","Dextrose 50%":"D50"};
  return map[name] || name;
}

var GEO_DEFAULT = {mon:[100,112,204,136], vent:[1046,256,108,72], hub:[452,508]};
var GEO_BY_PHOTO = {
  "niv":{vent:[1044,260,96,78]},
  "woman-room":{hub:[464,516]},

function placeGlass(G){
  var put = function(el, r){
    if(!el) return;
    el.style.left = (r[0]/12.8)+"%"; el.style.top = (r[1]/7.2)+"%";
    el.style.width = (r[2]/12.8)+"%"; el.style.height = (r[3]/7.2)+"%";
  };
  put(document.getElementById("monglass"), G.mon);
  put(document.getElementById("ventglass"), G.vent);

function sizeScene(){
  var sc = document.getElementById("scene");
  if(!sc) return;
  var w = sc.clientWidth || 0;
  if(w && String(w)!==sc.getAttribute("data-w")){ sc.setAttribute("data-w", String(w)); sc.style.setProperty("--u", (w/1280).toFixed(4)+"px"); }
}
function gearLayout(G){
  var bags = (patient.bags || []).slice(0,4);
  var lines = (patient.lines || []).filter(function(l){ return l.detail!=="IV bolus"; }).slice(0,6);
  var hooks = [560, 632, 704, 776];
  var dims = {ns:[65,300], rl:[75,300], d5:[63,300], blood:[108,260]};
  var out = {bags:[], pumps:[], hub:G.hub};
  bags.forEach(function(b,i){
    var key = b.id==="blood" ? "blood" : (b.id==="d5" ? "d5" : (b.id==="rl" ? "rl" : "ns"));
    var h = key==="blood" ? 132 : 150;
    var w = Math.round(dims[key][0]*h/dims[key][1]);
    out.bags.push({b:b, key:key, cx:hooks[i], w:w, h:h, top:26});
  });
  var n = lines.length;
  if(n){
    var ph = Math.min(112, Math.floor(300/n)-4);
    var pw = Math.round(ph*164/200);
    var maxRight = 424;
    if(POLE_X-12-pw < 312) pw = Math.max(46, POLE_X-12-312);
    lines.forEach(function(l,i){ out.pumps.push({l:l, x:Math.min(POLE_X-12-pw, maxRight-pw), y:18+i*(ph+4), w:pw, h:ph}); });
  }
  return out;
}
function tubeSvg(d){
  return "<path d='"+d+"' fill='none' stroke='#6f8794' stroke-opacity='.55' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/>"+
         "<path d='"+d+"' fill='none' stroke='#f2fbff' stroke-opacity='.93' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>";
}
function svgText(t, x, y, fs, fill, maxW, wt){
  var est = t.length*fs*0.58;
  var fit = est>maxW ? " textLength='"+maxW.toFixed(1)+"' lengthAdjust='spacingAndGlyphs'" : "";
  return "<text x='"+x.toFixed(1)+"' y='"+y.toFixed(1)+"' text-anchor='middle' font-family='Figtree, Arial, sans-serif' font-size='"+fs.toFixed(1)+"' font-weight='"+(wt||600)+"' fill='"+fill+"'"+fit+">"+escapeHtml(t)+"</text>";
}
function pumpName(l){

function pumpDetail(l){
  var d = l.detail || "infusion";
  if(d==="IV infusion" || d==="infusion") return "RUNNING";

}
function gearSvg(G){
  var L = gearLayout(G);
  if(!L.bags.length && !L.pumps.length) return "";
  var M = {x:470, y:252};
  var hub = L.hub;
  var s = "<defs>"+
    "<linearGradient id='polev' x1='0' x2='1' y1='0' y2='0'><stop offset='0' stop-color='#7d8a93'/><stop offset='.45' stop-color='#f0f4f6'/><stop offset='1' stop-color='#6f7c85'/></linearGradient>"+
    "<linearGradient id='barh' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='#f0f4f6'/><stop offset='1' stop-color='#7d8a93'/></linearGradient></defs>";
  var barEnd = L.bags.length ? L.bags[L.bags.length-1].cx+46 : POLE_X+30;
  /* support: pole behind the head of the bed, cross bar over the patient */
  s += "<rect x='"+(POLE_X-4)+"' y='18' width='8' height='306' rx='3' fill='url(#polev)'/>";
  s += "<rect x='"+(POLE_X-22)+"' y='23' width='"+(barEnd-POLE_X+22)+"' height='7' rx='3.5' fill='url(#barh)'/>";
  s += "<circle cx='"+POLE_X+"' cy='17' r='6' fill='#cfd8dd' stroke='#7d8a93' stroke-width='1'/>";
  /* tubing */
  var trunk = "M"+M.x+" "+M.y+" L"+M.x+" 338 C"+M.x+" 372 428 384 428 428 C428 470 "+(hub[0]-12)+" "+(hub[1]-34)+" "+hub[0]+" "+hub[1];
  s += tubeSvg(trunk);
  L.bags.forEach(function(g){
    var yb = g.top+g.h;
    s += tubeSvg("M"+g.cx+" "+yb+" C"+g.cx+" "+(yb+26)+" 500 236 "+M.x+" "+M.y);
  });
  L.pumps.forEach(function(p){
    var x0 = p.x+p.w*0.5, y0 = p.y+p.h-3, yj = Math.max(M.y, Math.min(338, y0+12));

function waveAt(kind, ph, p){
  if(kind==="ecg"){
    if(ph>0.08 && ph<0.16) return Math.sin((ph-0.08)/0.08*Math.PI)*0.18;
    if(ph>=0.18 && ph<0.22) return -(ph-0.18)/0.04*0.25;
    if(ph>=0.22 && ph<0.26) return -0.25 + (ph-0.22)/0.04*1.45;
    if(ph>=0.26 && ph<0.30) return 1.2 - (ph-0.26)/0.04*1.55;
    if(ph>=0.30 && ph<0.36) return -0.35 + (ph-0.30)/0.06*0.35;
    if(ph>=0.42 && ph<0.58) return Math.sin((ph-0.42)/0.16*Math.PI)*0.32;
    return 0;
  }
  if(kind==="pleth"){
    var x = (ph+0.12)%1;
    var pulse = Math.exp(-Math.pow((x-0.16)/0.045,2)) + 0.5*Math.exp(-Math.pow((x-0.30)/0.09,2));
    return pulse * Math.max(0.25, Math.min(1, (p.spo2-70)/30));
  }
  if(ph<0.18) return Math.sin(ph/0.18*Math.PI);
  return Math.exp(-(ph-0.18)*3.1);
}
function fitCanvas(c){
  var w = c.clientWidth || 0, h = c.clientHeight || 0;
  if((w<8 || h<8) && c.parentElement){
    w = c.parentElement.clientWidth || w;
    h = c.parentElement.clientHeight || h;
  }
  if(w<8 || h<8) return null;
  var r = Math.min(2, window.devicePixelRatio||1);
  if(c.width!==Math.floor(w*r) || c.height!==Math.floor(h*r)){
    c.width = Math.floor(w*r); c.height = Math.floor(h*r);
  }
  var ctx = c.getContext("2d");
  ctx.setTransform(r,0,0,r,0,0);
  return {ctx:ctx, w:w, h:h};
}
function drawSweep(c, lanes, opt){
  opt = opt || {};
  var box = fitCanvas(c);
  if(!box) return;
  var ctx = box.ctx, w = box.w, h = box.h;
  ctx.fillStyle = opt.bg || "#04110c";
  ctx.fillRect(0,0,w,h);
  var laneH = h / lanes.length;
  lanes.forEach(function(lane, i){
    var amp = lane.amp!=null ? lane.amp : (opt.amp==null ? 0.32 : opt.amp);
    var top = i * laneH;
    var mid = lane.mid==null ? 0.68 : lane.mid;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, top+0.5, w, laneH-1);
    ctx.clip();
    ctx.beginPath();
    ctx.strokeStyle = lane.color;
    ctx.lineWidth = opt.lw || 1.15;
    var arr = lane.arr, n = arr.length;
    for(var k=0;k<n;k++){
      var x = n<2 ? 0 : (k/(n-1))*w;
      var y = top + laneH*mid - arr[k]*laneH*amp;
      if(y<top+1) y = top+1;
      if(y>top+laneH-2) y = top+laneH-2;
      if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle = opt.bg || "#04110c";
    ctx.fillRect(w-5, top, 5, laneH);
    ctx.restore();
  });
}
function traceAt(ts, rate, n, span, fn){
  var out = [];
  var hz = Math.max(4, rate)/60;
  for(var k=0;k<n;k++){
    var ago = ((n-1-k)/n)*span;
    var ph = ((ts/1000 - ago) * hz) % 1;
    if(ph<0) ph += 1;
    out.push(fn(ph));
  }
  return out;
}
function onVent(){ return patient.support==="cpap" || patient.support==="bipap" || patient.support==="imv"; }
function breathRate(){ return onVent() ? Math.max(6, ventNow().rr) : Math.max(6, patient.rr||16); }
function monitorRR(){ return onVent() ? Math.round(breathRate()) : patient.rr; }
function respWave(ph){
  return ph<0.4 ? 0.5-0.5*Math.cos(ph/0.4*Math.PI) : 0.5+0.5*Math.cos((ph-0.4)/0.6*Math.PI);
}
function drawMonitor(ts){
  paintNums();

  if(!c) return;
  var hr = Math.max(35, patient.hr||80);
  var rr = breathRate();
  var ecg = traceAt(ts, hr, 120, 3.4, function(ph){ return waveAt("ecg", ph, patient); });
  var art = traceAt(ts, hr, 120, 3.4, function(ph){ return waveAt("art", ph, patient); });
  var pleth = traceAt(ts, hr, 120, 3.4, function(ph){ return waveAt("pleth", ph, patient); });
  var resp = traceAt(ts, rr, 120, 150/rr, respWave);
  drawSweep(c, [
    {arr:ecg, color:"#8fd0a8", mid:0.74},
