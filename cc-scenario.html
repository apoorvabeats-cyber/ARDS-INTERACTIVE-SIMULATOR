  }
  if(r.labs){
    const l = r.labs;
    html += "<div class='card'"+markCard("labs")+"><h3>Bloods</h3>"+
      "Hb "+hi(l.cbc.hb+" g/dL", l.cbc.hb<8)+" · white cells "+hi(l.cbc.wbc, l.cbc.wbc<4||l.cbc.wbc>12)+" · "+l.cbc.dlc+" · platelets "+hi(l.cbc.plt, l.cbc.plt<100)+"<br>"+
      "Urea "+l.rft.urea+" mg/dL · creatinine "+hi(l.rft.creat+" mg/dL", l.rft.creat>1.3)+" · GFR about "+hi(l.rft.egfr, l.rft.egfr<60)+" · Na "+hi(l.rft.na, l.rft.na<135||l.rft.na>145)+" · K "+hi(l.rft.k, l.rft.k<3.5||l.rft.k>5.1)+"<br>"+
      "Bilirubin "+l.lft.bili+" · AST "+hi(l.lft.ast, l.lft.ast>40)+" · ALT "+l.lft.alt+" · albumin "+l.lft.alb+" g/dL<br>"+
      "PT "+l.coags.pt+" · INR "+hi(l.coags.inr, l.coags.inr>1.4)+" · aPTT "+hi(l.coags.aptt, l.coags.aptt>40)+"<br>"+
      "CRP "+hi(l.inflam.crp+" mg/L", l.inflam.crp>10)+" · procalcitonin "+hi(l.inflam.pct+" ng/mL", l.inflam.pct>0.5)+
      (isLab() && patient.id==="dka"?"<p class='lead'>In ketoacidosis, insulin waits if potassium is under 3.3 mmol/L.</p>":"")+
      "</div>";
  }
  if(r.cxr){
    html += "<div class='card'"+markCard("cxr")+"><h3>Chest radiograph</h3><p>"+escapeHtml(r.cxr.text)+"</p>"+(r.cxr.img?"<img class='film' alt='"+escapeHtml(r.cxr.cap)+"' src='"+r.cxr.img+"'>":"")+"</div>";
  }
  if(r.usg){
    html += "<div class='card'"+markCard("usg")+"><h3>Ultrasound</h3><p>"+escapeHtml(r.usg.text)+"</p>"+(r.usg.img?"<img class='film' alt='"+escapeHtml(r.usg.cap)+"' src='"+r.usg.img+"'>":"")+"</div>";
  }
  if(r.ct) html += "<div class='card'"+markCard("ct")+"><h3>CT</h3><p>"+escapeHtml(r.ct)+"</p></div>";
  if(r.echo){
    const e = r.echo;
    html += "<div class='card'"+markCard("echo")+"><h3>Echo</h3>LV: "+escapeHtml(e.lv)+"<br>RV: "+escapeHtml(e.rv)+"<br>Wall motion: "+escapeHtml(e.rwma)+"<br>Pericardium: "+escapeHtml(e.pericardium)+"<br>IVC: "+escapeHtml(e.ivc);
    if(!patient.echoRead){
      html += "<p class='lead'>Your read.</p>"+
        "<label class='f'>Left ventricle<select id='elv'><option value='high'>Hyperdynamic</option><option value='low'>Reduced</option><option value='rwma'>Regional wall-motion abnormality</option><option value='normal'>Normal</option></select></label>"+
        "<label class='f'>Volume<select id='evol'><option value='underfilled'>Underfilled</option><option value='normal'>Normal</option><option value='overloaded'>Overloaded</option></select></label>"+
        "<label class='f'>Obstruction<select id='eob'><option value='no'>No obstructive lesion</option><option value='yes'>Right-heart strain, tamponade, or chest pressure</option></select></label>"+
        "<button class='next' type='button' id='echoGo'>Commit the echo read</button>";
    } else html += "<p>Your read is filed.</p>";
    html += "</div>";
  }
  return html;
}
function btn(id, label){ return "<button type='button' data-act='"+id+"'>"+label+"</button>"; }

function renderPick(){
  document.getElementById("modechip").textContent = mode==="arena"?"Practice arena":"Learning lab";
  const app = document.getElementById("app");
  const notes = [];
  if(selected.indexOf("hypoBP")>=0 && selected.indexOf("hyperBP")>=0) notes.push("Blood pressure cannot be low and high at the same minute. The case will carry both, in that order.");
  if(selected.indexOf("hypogly")>=0 && selected.indexOf("hypergly")>=0) notes.push("Glucose cannot be low and high together. You will meet the high value first.");
  app.innerHTML = "<p class='kicker'>"+(mode==="arena"?"No hints. Twelve minutes.":"Hints on. The clock is clinical, not a countdown.")+"</p>"+
    "<h2>What is wrong at the door?</h2>"+
    "<p class='lead'>Select one abnormality, or several. The engine builds one illness that can hold all of them. It will not paste an unrelated scan onto an unrelated gas.</p>"+
    "<div class='grid'>"+FLAGS.map(function(f){
      const on = selected.indexOf(f.id)>=0;
      return "<button type='button' class='alarm"+(on?" on":"")+"' data-flag='"+f.id+"' aria-pressed='"+(on?"true":"false")+"'><b>"+f.name+"</b><span>"+f.sub+"</span></button>";
    }).join("")+"</div>"+
    (notes.length?"<p class='lead'>"+notes.join(" ")+"</p>":"")+
    "<button class='go' id='gen' type='button'"+(selected.length?"":" disabled")+">Generate the patient</button>"+
    "<p class='foot'>Teaching cases. Not a prescription for a named patient.</p>";
  app.querySelectorAll("[data-flag]").forEach(function(b){
    b.onclick = function(){
      const id = b.getAttribute("data-flag");
      const i = selected.indexOf(id);
      if(i>=0) selected.splice(i,1); else selected.push(id);
      renderPick();
    };
  });
  document.getElementById("gen").onclick = function(){
    patient = buildPatient(selected);
    finished = false;
    wall = 12*60;
    if(mode==="arena") startWall();
    render();
  };
}
function startWall(){
  if(timer) clearInterval(timer);
  timer = setInterval(function(){
    wall -= 1;
    const el = document.getElementById("wall");
    if(el) el.textContent = fmt(wall);
    if(wall<=0){ clearInterval(timer); timer = null; if(!finished) openSubmit(true); }
  }, 1000);
}
function fmt(s){ s = Math.max(0,s); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function settleView(){
  const focus = patient && patient.focus;
  if(patient) patient.focus = "";
  const run = function(){
    let el = null;
    if(focus==="event") el = document.getElementById("focus-event");
    else if(focus==="result") el = document.getElementById("focus-result");
    else if(focus==="echo") el = document.getElementById("focus-echo");
    else if(focus==="form") el = document.getElementById("focus-form");
    else if(document.querySelector(".vitals .hot")) el = document.querySelector(".vitals");
    else if(focus==="vent") el = document.getElementById("focus-vent");
    if(!el || !el.scrollIntoView) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "start"});
  };
  if(typeof requestAnimationFrame==="function") requestAnimationFrame(function(){ requestAnimationFrame(run); });
  else run();
}
function render(){
  if(!patient) return renderPick();
  const p = patient;
  const app = document.getElementById("app");
  document.getElementById("modechip").textContent = mode==="arena"?"Practice · "+fmt(wall):"Learning lab";
  app.innerHTML = "<p class='kicker'>"+escapeHtml(p.name)+" · "+p.age+"-year-old "+p.sex+" · "+p.wt+" kg · predicted body weight "+p.pbw+" kg</p>"+
    (mode==="arena"?"<p class='lead'>Time <span class='clock' id='wall'>"+fmt(wall)+"</span></p>":"")+
    (p.events.length?"<div class='card' id='focus-event'><h3>Event</h3><p>"+escapeHtml(p.events[p.events.length-1])+"</p></div>":"")+
    vitalsHtml()+
    "<div class='card'><h3>"+escapeHtml(p.complaint)+"</h3><p>"+escapeHtml(p.story)+"</p><p>"+escapeHtml(p.exam)+"</p><p>History: "+escapeHtml(p.pmh)+" Drugs: "+escapeHtml(p.meds)+"</p></div>"+
    (isLab()?"<div class='card hint'><h3>Hint</h3>"+escapeHtml(p.syn.hint)+"</div>":"")+
    "<details open><summary>Investigations</summary><div class='opts'>"+
      btn("abg","ABG, with lactate")+btn("labs","Bloods — count, renal, liver, coagulation, CRP")+btn("usg","Ultrasound — lung, abdomen, IVC")+btn("cxr","Chest radiograph")+btn("ct","CT")+btn("echo","Echo")+
    "</div></details>"+
    resultCards()+
    "<details open><summary>Oxygen and the ventilator</summary><div class='opts'>"+
      btn("room","Room air")+btn("np","Nasal prongs")+btn("fm","Face mask")+btn("nrb","Non-rebreather")+btn("hfnc","High-flow nasal oxygen")+btn("cpap","NIV — CPAP")+btn("bipap","NIV — BiPAP")+btn("imv","Invasive ventilation")+
    "</div>"+ventHtml()+"</details>"+
    "<details><summary>Fluids, pressure, and urine</summary><div class='opts'>"+
      btn("rl500","Balanced crystalloid 500 mL")+btn("ns500","Normal saline 500 mL")+btn("rl250","Balanced crystalloid 250 mL")+btn("diuretic","Furosemide 40 mg IV")+
      btn("norepi","Norepinephrine 0.05 mcg/kg/min")+btn("dobutamine","Dobutamine 2.5 mcg/kg/min")+btn("vaso","Vasopressin 0.03 units/min")+btn("stoppress","Stop the vasopressor")+
      btn("gtn","GTN infusion, start 10 mcg/min")+btn("nicardipine","Nicardipine infusion")+btn("labetalol","Labetalol bolus")+
    "</div></details>"+
    "<details><summary>Antibiotics</summary><label class='check'><input id='renal' type='checkbox' "+(p.renal?"checked":"")+"> Renal dose</label><div class='opts'>"+
      btn("ctx-azi","Ceftriaxone 2 g daily + azithromycin 500 mg")+btn("piptazo","Piperacillin-tazobactam 4.5 g every 6 h")+btn("mero","Meropenem 1 g every 8 h")+btn("vanc","Vancomycin alone, 15 mg/kg")+
    "</div></details>"+
    "<details><summary>Glucose, potassium, blood, and procedures</summary><div class='opts'>"+
      btn("sedation","Fentanyl, then propofol if the airway is secure")+btn("d50","Dextrose 50%, 50 mL")+btn("insulin","Insulin infusion 0.1 units/kg/h")+btn("kcl","Potassium chloride replacement")+btn("dexinf","Dextrose infusion beside insulin")+btn("bicarb","Sodium bicarbonate")+
      btn("blood","One unit of blood")+btn("pcc","Reverse warfarin")+btn("ppi","Proton-pump inhibitor infusion")+btn("aspirin","Aspirin 300 mg")+btn("heparin","Treatment-dose heparin")+btn("lytic","Thrombolysis")+
      btn("decompress","Decompress the pleura")+btn("drain","Chest drain")+btn("naloxone","Naloxone, titrated")+btn("head","Head up, neck straight")+btn("osmotic","Hypertonic saline or mannitol")+
    "</div></details>"+
    "<div class='card'><h3>Course</h3><ul class='log'>"+(p.log.slice(0,8).map(function(l){ return "<li>"+l.t+" min — "+escapeHtml(l.text)+"</li>"; }).join("")||"<li>No action yet.</li>")+"</ul></div>"+
    "<button class='next' id='reassess' type='button'>Reassess in 15 minutes</button>"+
    "<button class='next' id='submit' type='button'>Submit the diagnosis</button>";
  app.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick = function(){ onAct(b.getAttribute("data-act")); };
  });
  const renal = document.getElementById("renal");
  if(renal) renal.onchange = function(){ patient.renal = renal.checked; };
  const echoGo = document.getElementById("echoGo");
  if(echoGo) echoGo.onclick = function(){
    commitEcho(document.getElementById("elv").value, document.getElementById("evol").value, document.getElementById("eob").value);
  };
  document.getElementById("reassess").onclick = function(){ tick(15); note("Fifteen minutes passed.", "Fifteen minutes passed."); render(); };
  document.getElementById("submit").onclick = function(){ openSubmit(false); };
  bindVent();
  settleView();
}
function ventHtml(){
  const v = patient.vent;
  const niv = patient.support==="cpap"||patient.support==="bipap";
  const imv = patient.support==="imv";
  if(!niv && !imv) return "<p class='lead'>The ventilator panel opens when you choose NIV or a tube.</p>";
  if(niv){
    return "<div id='focus-vent'><p class='lead'>NIV. Predicted body weight "+patient.pbw+" kg.</p>"+
      slider("ipap","IPAP", v.ipap, 8, 24, 1)+" "+slider("epap","EPAP", v.epap, 4, 14, 1)+
      slider("fio2","FiO2 %", v.fio2, 30, 100, 5)+" "+slider("backup","Backup rate", v.backup, 8, 24, 1)+
      slider("rise","Rise time, s", v.rise, 0.1, 0.6, 0.1)+" "+slider("ti","Inspiratory time, s", v.ti, 0.6, 1.6, 0.1)+
      "<label class='f'>Mask<select id='mask'><option value='nasal'>Nasal</option><option value='oronasal'>Oronasal</option><option value='full'>Full face</option><option value='helmet'>Helmet</option></select></label>"+
      "<button class='next' type='button' id='applyVent'>Apply NIV settings</button></div>";
  }
  return "<div id='focus-vent'><p class='lead'>Invasive ventilation. Predicted body weight "+patient.pbw+" kg. A tidal volume of 6 mL/kg is "+Math.round(6*patient.pbw)+" mL.</p>"+
    "<label class='f'>Mode<select id='modev'><option>VC-AC</option><option>PC-AC</option><option>SIMV</option><option>PS</option></select></label>"+
    slider("tv","Tidal volume, mL", v.tv, 200, 800, 10)+" "+slider("vrr","Set rate", v.rr, 10, 30, 1)+
    slider("peep","PEEP", v.peep, 0, 18, 1)+" "+slider("fio2","FiO2 %", v.fio2, 30, 100, 5)+
    slider("ps","Pressure support", v.ps, 0, 20, 1)+
    "<label class='f'>I:E<select id='ie'><option>1:1</option><option>1:2</option><option>1:3</option></select></label>"+
    "<button class='next' type='button' id='applyVent'>Apply ventilator settings</button></div>";
}
function slider(id, label, value, min, max, step){
  return "<label class='row'>"+label+" <input id='"+id+"' type='range' min='"+min+"' max='"+max+"' step='"+step+"' value='"+value+"'><b id='"+id+"v'>"+value+"</b></label>";
}
function bindVent(){
  ["ipap","epap","fio2","backup","rise","ti","tv","vrr","peep","ps"].forEach(function(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.oninput = function(){ const o = document.getElementById(id+"v"); if(o) o.textContent = el.value; };
  });
  const mask = document.getElementById("mask");
  if(mask) mask.value = patient.vent.mask;
  const modev = document.getElementById("modev");
  if(modev) modev.value = patient.vent.mode;
  const ie = document.getElementById("ie");
  if(ie) ie.value = patient.vent.ie;
  const apply = document.getElementById("applyVent");
  if(!apply) return;
  apply.onclick = function(){
    const v = patient.vent;
    const g = function(id){ const el = document.getElementById(id); return el? +el.value : null; };
    if(patient.support==="imv"){
      v.mode = document.getElementById("modev").value;
      v.tv = g("tv"); v.rr = g("vrr"); v.peep = g("peep"); v.fio2 = g("fio2"); v.ps = g("ps");
      v.ie = document.getElementById("ie").value;
    } else {
      v.ipap = g("ipap"); v.epap = g("epap"); v.fio2 = g("fio2"); v.backup = g("backup");
      v.rise = g("rise"); v.ti = g("ti"); v.mask = document.getElementById("mask").value;
    }
    applyVent();
  };
}
function onAct(act){
  if(act==="abg"||act==="labs"||act==="usg"||act==="cxr"||act==="ct"||act==="echo") return orderTest(act);
  if(["room","np","fm","nrb","hfnc","cpap","bipap","imv"].indexOf(act)>=0) return setSupport(act);
  if(act==="rl500") return bolus(500,"balanced");
  if(act==="ns500") return bolus(500,"saline");
  if(act==="rl250") return bolus(250,"balanced");
  if(act==="diuretic") return giveDiuretic();
  if(act==="norepi"||act==="dobutamine"||act==="vaso") return givePressor(act);
  if(act==="stoppress") return givePressor("none");
  if(act==="gtn"||act==="nicardipine"||act==="labetalol") return giveBPDrug(act);
  if(act==="ctx-azi"||act==="piptazo"||act==="mero"||act==="vanc") return giveAbx(act);
  if(act==="sedation") return giveSedation();
  if(act==="d50"||act==="insulin"||act==="kcl"||act==="dexinf"||act==="bicarb") return giveMetabolic(act);
  return procedure(act);
}
function openSubmit(timedOut){
  finished = true;
  if(timer){ clearInterval(timer); timer = null; }
  const p = patient;
  const app = document.getElementById("app");
  app.innerHTML = vitalsHtml()+
    "<h2 id='focus-form'>"+(timedOut?"Time is up.":"Your diagnosis.")+"</h2>"+
    "<p class='lead'>"+escapeHtml(p.name)+". Submit the illness, the shock, and the respiratory failure.</p>"+
    "<label class='f'>Primary diagnosis<select id='dx'>"+DX.map(function(d){ return "<option value='"+d[0]+"'>"+d[1]+"</option>"; }).join("")+"</select></label>"+
    "<label class='f'>Shock<select id='shock'><option value='distributive'>Distributive</option><option value='cardiogenic'>Cardiogenic</option><option value='hypovolemic'>Hypovolemic</option><option value='obstructive'>Obstructive</option><option value='none'>No shock</option></select></label>"+
    "<label class='f'>Respiratory failure<select id='resp'><option value='type1'>Type 1, hypoxemic</option><option value='type2'>Type 2, hypercapnic</option><option value='mixed'>Mixed</option><option value='none'>No respiratory failure</option></select></label>"+
    "<label class='f'>Leading alternative<select id='alt'>"+DX.map(function(d){ return "<option value='"+d[0]+"'>"+d[1]+"</option>"; }).join("")+"</select></label>"+
    "<label class='f'>Management you would write in the notes<textarea id='plan' placeholder='Airway, the circulation, the specific drug, and what you would recheck.'></textarea></label>"+
    "<button class='go' id='done' type='button'>Score this case</button>";
  document.getElementById("done").onclick = function(){
    showScore(document.getElementById("dx").value, document.getElementById("shock").value, document.getElementById("resp").value, document.getElementById("alt").value, document.getElementById("plan").value);
  };
  patient.focus = "form";
  settleView();
}
function showScore(dx, shock, resp, alt, plan){
  const p = patient;
  const sc = scorePatient(dx, shock, resp);
  const nameOf = function(id){ return (DX.filter(function(d){ return d[0]===id; })[0]||["",id])[1]; };
  const dxName = nameOf(dx);
  const right = nameOf(p.id);
  const altName = nameOf(alt);
  plan = (plan||"").trim();
  const shockOk = shock===p.syn.shock;
  const respOk = resp===p.syn.resp;
  document.getElementById("app").innerHTML =
    "<p class='kicker'>Score</p><h2 id='focus-form'>"+sc+" / 100</h2>"+
    "<div class='teach"+(dx===p.id?"":" miss")+"'>You said "+escapeHtml(dxName)+". The illness was "+escapeHtml(right)+".</div>"+
    "<div class='teach"+(shockOk?"":" miss")+"'>Shock: you said "+escapeHtml(shock)+". It was "+escapeHtml(p.syn.shock)+".</div>"+
    "<div class='teach"+(respOk?"":" miss")+"'>Respiratory failure: you said "+escapeHtml(resp)+". It was "+escapeHtml(p.syn.resp)+".</div>"+
    "<div class='card'><h3>Differential</h3>You also named "+escapeHtml(altName)+"."+(alt===p.id && dx!==p.id?" That alternative was the illness.":alt===dx?" It was the same as the primary diagnosis.":"")+"</div>"+
    "<div class='card'><h3>Your management note</h3>"+(plan?escapeHtml(plan):"No note written.")+"</div>"+
    "<div class='card'><h3>What helped</h3>"+(p.good.length?p.good.map(escapeHtml).join("<br>"):"Nothing recorded as clearly helpful.")+"</div>"+
    "<div class='card'><h3>What did not fit</h3>"+(p.bad.length?p.bad.map(escapeHtml).join("<br>"):"No suboptimal calls recorded.")+"</div>"+
    "<div class='card'><h3>Critical errors</h3>"+(p.critical.length?p.critical.map(escapeHtml).join("<br>"):"None recorded.")+"</div>"+
    "<div class='card'><h3>Timeline</h3>"+(p.timeline.map(escapeHtml).join("<br>")||"No actions.")+"</div>"+
    "<div class='card'><h3>Expert pathway</h3>"+p.syn.expert.map(function(s){ return "<p>"+escapeHtml(s)+"</p>"; }).join("")+"</div>"+
    "<button class='go' id='again' type='button'>Another patient</button>"+
    "<p class='foot'>Teaching cases. Not a prescription for a named patient.</p>";
  document.getElementById("again").onclick = function(){ patient = null; selected = []; finished = false; renderPick(); };
  patient.focus = "form";
  settleView();
}
function showDoors(){
  document.getElementById("modechip").textContent = "";
  document.getElementById("app").innerHTML =
    "<p class='kicker'>One engine. Two doors.</p>"+
    "<div class='grid'>"+
      "<button type='button' class='alarm' id='doorLab'><b>Learning lab</b><span>The reason is said out loud after every decision.</span></button>"+
      "<button type='button' class='alarm' id='doorArena'><b>Practice arena</b><span>No hints. Twelve minutes. The patient still answers.</span></button>"+
    "</div>";
  document.getElementById("doorLab").onclick = function(){ mode = "lab"; renderPick(); };
  document.getElementById("doorArena").onclick = function(){ mode = "arena"; renderPick(); };
}
function start(){
  const q = new URLSearchParams(location.search);
  const m = q.get("mode");
  document.getElementById("back").onclick = function(){
    if(timer) clearInterval(timer);
    if(history.length>1){ history.back(); return; }
    location.href = "index.html";
  };
  if(m==="lab"||m==="arena"){ mode = m; renderPick(); }
  else showDoors();
}
if(typeof document!=="undefined") start();
</script>
