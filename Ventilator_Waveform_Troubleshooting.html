<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#071b3a">
<title>Ventilator waveforms</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f7fb; color: #14213d; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.4; }
  button, input { font: inherit; }
  button { cursor: pointer; border: 1px solid #d7e0ec; background: #fff; color: #14213d; border-radius: 14px; min-height: 44px; padding: 8px 12px; }
  button.on { background: #1457a6; color: #fff; border-color: #1457a6; }
  button.good { background: #067647; color: #fff; border-color: #067647; }
  button.bad { background: #b42318; color: #fff; border-color: #b42318; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { background: linear-gradient(135deg, #071b3a, #1457a6); color: #fff; border-radius: 24px; padding: 24px 18px; }
  h1 { font-size: clamp(28px, 7vw, 42px); line-height: 1.05; margin: 8px 0; }
  h2 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #5f6f86; }
  p { margin: 0; }
  a { color: #9ec5ff; }
  .lede { color: #dbe9ff; font-size: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  canvas { width: 100%; display: block; background: #0e1520; border-radius: 16px; }
  #scalars { height: 280px; }
  #loops { height: 220px; margin-top: 8px; }
  .nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (min-width: 720px) { .nums { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .num { background: #fff; border: 1px solid #d7e0ec; border-radius: 14px; padding: 8px 10px; }
  .num span { display: block; color: #5f6f86; font-size: 12px; }
  .num b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .hi { color: #b42318; }
  .ok { color: #067647; }
  .panel { background: #fff; border: 1px solid #d7e0ec; border-radius: 16px; padding: 12px; margin-top: 10px; }
  .slider { margin-top: 10px; }
  .slider label { display: flex; justify-content: space-between; font-size: 14px; color: #334155; }
  input[type=range] { width: 100%; accent-color: #1457a6; }
  .top { display: flex; gap: 8px; margin-top: 12px; }
  .top button { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const PRESETS = [
  { id:"normal", name:"Normal volume control", mode:"VC", rr:14, vt:480, ti:1.0, peep:5, R:8, C:50, leak:0, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"Routine postoperative patient. Comfortable, no alarms.",
    tell:"Square inspiratory flow, pressure steps then rises, expiratory flow returns to zero, and both loops close. Peak and plateau are close." },
  { id:"pc", name:"Normal pressure control", mode:"PC", rr:16, vt:420, ti:1.0, peep:8, R:8, C:45, leak:0, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"Pressure-control breath. The set pressure is square. Flow should decelerate.",
    tell:"Square pressure, decelerating flow. Flow near zero at the end of inspiration means the lung has equilibrated with the set pressure." },
  { id:"resistance", name:"High resistance", mode:"VC", rr:14, vt:500, ti:1.0, peep:5, R:28, C:50, leak:0, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"Wheeze after intubation. Peak pressure is alarming. Plateau is not.",
    tell:"Large peak-to-plateau gap. Expiratory flow is scooped and slow. Think bronchospasm, secretions, a kink, or the patient biting — not a stiff lung." },
  { id:"compliance", name:"Low compliance", mode:"VC", rr:18, vt:400, ti:0.9, peep:10, R:8, C:18, leak:0, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:18,
    stem:"Peak and plateau are both high. The gap between them is small.",
    tell:"Elastic pressure is the problem. The pressure-volume loop is flat. ARDS, pneumothorax, mainstem intubation, and abdominal distension all look like this. The waveform does not name which one." },
  { id:"autopeep", name:"Auto-PEEP", mode:"VC", rr:26, vt:560, ti:1.0, peep:5, R:22, C:55, leak:0, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"COPD. The rate was turned up for a low pH. Expiratory flow never rests.",
    tell:"The next breath starts before flow reaches zero. Volume is still trapped. Intrinsic PEEP is set PEEP plus what is left in the lung. Give more time to exhale: lower the rate, shorten inspiration." },
  { id:"leak", name:"Leak", mode:"VC", rr:14, vt:500, ti:1.0, peep:5, R:10, C:45, leak:0.55, starve:0, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"Exhaled tidal volume is much smaller than inhaled. Pressure is ordinary.",
    tell:"The volume trace does not return to zero and the loops do not close. Look for a cuff leak, a disconnected circuit, or a chest tube bubbling off the tidal volume." },
  { id:"beak", name:"Overdistension", mode:"VC", rr:16, vt:720, ti:1.1, peep:5, R:8, C:28, leak:0, starve:0, saw:0, miss:0, double:0, beak:1, pinsp:14,
    stem:"Large tidal volume on a stiff lung. The pressure-volume loop turns up at the end.",
    tell:"Bird beak: the last part of the breath costs a lot of pressure and little volume. Drop the tidal volume. This is how ventilator-induced lung injury starts." },
  { id:"starve", name:"Flow starvation", mode:"VC", rr:18, vt:450, ti:1.15, peep:5, R:10, C:40, leak:0, starve:1, saw:0, miss:0, double:0, beak:0, pinsp:14,
    stem:"Awake, air hunger, the inspiratory pressure curve caves in.",
    tell:"The patient wants flow the ventilator is not giving. In volume control the pressure scoop means unmet demand. Raise the flow, lengthen inspiration less, or switch to a pressure mode." },
  { id:"saw", name:"Secretions", mode:"VC", rr:16, vt:460, ti:0.95, peep:6, R:14, C:40, leak:0, starve:0, saw:1, miss:0, double:0, beak:0, pinsp:14,
    stem:"A rattle in the circuit. The flow line is jagged.",
    tell:"Sawtooth oscillations on flow and pressure are secretions or water in the tubing. Suction the patient, not the settings." },
  { id:"miss", name:"Ineffective trigger", mode:"VC", rr:22, vt:500, ti:0.9, peep:5, R:24, C:50, leak:0, starve:0, saw:0, miss:1, double:0, beak:0, pinsp:14,
    stem:"COPD, uncomfortable. Small efforts do not start a breath.",
    tell:"Pressure dips without a delivered breath. Auto-PEEP is usually the reason: the patient cannot drop airway pressure enough to trigger. Treat the trapping, or add a little set PEEP to help triggering." },
  { id:"double", name:"Double trigger", mode:"VC", rr:16, vt:480, ti:0.7, peep:5, R:8, C:45, leak:0, starve:0, saw:0, miss:0, double:1, beak:0, pinsp:14,
    stem:"Two breaths fire back to back. The exhaled volume of the pair is huge.",
    tell:"The first breath ended while the patient was still inspiring, so a second breath stacked. Volume is delivered twice. Lengthen inspiration or raise the flow so one breath satisfies the effort." },
];

let screen = "explore";
let cfg = Object.assign({}, PRESETS[0]);
let quiz = [];
let qi = 0;
let picked = null;
let score = 0;

function generate(c) {
  const T = 60 / c.rr;
  const Ti = Math.min(c.ti, T * 0.55);
  const dt = 0.008;
  const warm = T * 4;
  const show = T * 3;
  const R = Math.max(4, c.R);
  const C = Math.max(8, c.C);
  let lung = 0;
  let meas = 0;
  const all = [];
  for (let t = 0; t < warm + show; t += dt) {
    const phase = t % T;
    if (phase < dt) meas = 0;
    const second = c.double && phase > Ti + 0.12 && phase < Ti + 0.12 + Math.min(0.45, Ti);
    const insp = phase < Ti || second;
    let flow = 0;
    let effort = 0;
    if (insp) {
      if (c.mode === "VC") {
        flow = (c.vt / 1000) / Ti;
      } else {
        const drive = (c.pinsp - lung / C) / R;
        flow = Math.max(0, drive);
      }
      lung += flow * 1000 * dt;
      meas += flow * 1000 * dt;
      if (c.starve && phase > Ti * 0.12 && phase < Ti * 0.88) {
        effort = 14 * Math.sin(Math.PI * (phase - Ti * 0.12) / (Ti * 0.76));
      }
    } else {
      const trueFlow = -Math.max(0, lung / C) / R;
      const seen = trueFlow * (1 - c.leak);
      lung = Math.max(0, lung + trueFlow * 1000 * dt);
      meas = Math.max(0, meas + seen * 1000 * dt);
      flow = seen;
      if (c.miss && phase > Ti + 0.28 && phase < Ti + 0.48) {
        const u = (phase - (Ti + 0.28)) / 0.2;
        effort = 6 * Math.sin(Math.PI * u);
        flow += 0.18 * Math.sin(Math.PI * u);
      }
    }
    let paw = c.peep + flow * R + lung / C - effort;
    if (c.beak && lung > c.vt * 0.78) {
      const x = (lung - c.vt * 0.78) / (c.vt * 0.22);
      paw += 22 * x * x;
    }
    if (c.saw) {
      paw += 1.3 * Math.sin(t * 78);
      flow += 0.12 * Math.sin(t * 78);
    }
    if (t >= warm) all.push({ t: t - warm, paw, flow, meas, lung });
  }
  let ppeak = 0, pplat = 0, vend = 0, flowEnd = 0;
  const lastT = all[all.length - 1].t;
  const start = lastT - T;
  let maxInsp = 0, flowSum = 0, flowN = 0, endMeas = 0;
  const beakExtra = (lung) => (c.beak && lung > c.vt * 0.78 ? 22 * ((lung - c.vt * 0.78) / (c.vt * 0.22)) ** 2 : 0);
  all.forEach((p) => {
    if (p.t < start) return;
    const phase = p.t - start;
    if (p.paw > ppeak) ppeak = p.paw;
    if (p.meas > maxInsp) maxInsp = p.meas;
    if (Math.abs(phase - Ti) < dt * 1.5) pplat = c.peep + p.lung / C + beakExtra(p.lung);
    if (phase > T - 0.08) { vend = p.lung; flowSum += p.flow; flowN++; endMeas = p.meas; }
  });
  flowEnd = flowN ? flowSum / flowN : 0;
  const vti = maxInsp;
  const vte = Math.max(0, maxInsp - endMeas);
  const peepi = vend / C;
  return { pts: all.filter((p) => p.t >= start - T), T, Ti, ppeak, pplat, vti, vte, peepi, flowEnd, vend };
}

function draw(series) {
  const sCanvas = document.getElementById("scalars");
  const lCanvas = document.getElementById("loops");
  if (!sCanvas || !series) return;
  paintScalars(sCanvas, series);
  paintLoops(lCanvas, series);
}
function setup(canvas) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}
function paintScalars(canvas, series) {
  const { ctx, w, h } = setup(canvas);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#0e1520";
  ctx.fillRect(0, 0, w, h);
  const rows = [
    { key:"paw", label:"Paw  cmH2O", color:"#e6b325", zero:true },
    { key:"flow", label:"Flow  L/s", color:"#3dbe6a", zero:true, mid:true },
    { key:"meas", label:"Volume  mL", color:"#4aa3ff", zero:true },
  ];
  const pts = series.pts;
  const rh = h / 3;
  rows.forEach((row, i) => {
    const y0 = i * rh;
    let min = Infinity, max = -Infinity;
    pts.forEach((p) => { const v = p[row.key]; if (v < min) min = v; if (v > max) max = v; });
    if (row.key === "flow") { const m = Math.max(Math.abs(min), Math.abs(max), 0.2); min = -m; max = m; }
    if (row.key === "meas") { min = 0; max = Math.max(max, 200); }
    if (row.key === "paw") { min = Math.min(0, min - 2); max = Math.max(max + 4, 20); }
    const pad = 8;
    const mapY = (v) => y0 + rh - pad - ((v - min) / (max - min || 1)) * (rh - pad * 2);
    const mapX = (t) => 46 + ((t - pts[0].t) / (pts[pts.length - 1].t - pts[0].t)) * (w - 56);
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.beginPath();
    const yz = mapY(0);
    ctx.moveTo(46, yz); ctx.lineTo(w - 8, yz); ctx.stroke();
    ctx.fillStyle = row.color;
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText(row.label, 8, y0 + 16);
    ctx.beginPath();
    ctx.strokeStyle = row.color;
    ctx.lineWidth = 1.6;
    pts.forEach((p, n) => {
      const x = mapX(p.t), y = mapY(p[row.key]);
      if (n === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}
function paintLoops(canvas, series) {
  const { ctx, w, h } = setup(canvas);
  ctx.fillStyle = "#0e1520";
  ctx.fillRect(0, 0, w, h);
  const pts = series.pts.filter((p) => p.t > series.pts[series.pts.length - 1].t - series.T);
  function loop(box, xKey, yKey, color, xlab, ylab, xZero, yZero) {
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
    pts.forEach((p) => {
      xmin = Math.min(xmin, p[xKey]); xmax = Math.max(xmax, p[xKey]);
      ymin = Math.min(ymin, p[yKey]); ymax = Math.max(ymax, p[yKey]);
    });
    if (xZero) xmin = Math.min(0, xmin);
    if (yZero === "mid") { const m = Math.max(Math.abs(ymin), Math.abs(ymax), 0.2); ymin = -m; ymax = m; }
    if (yZero === "base") ymin = 0;
    const pad = 16;
    const X = (v) => box.x + pad + ((v - xmin) / (xmax - xmin || 1)) * (box.w - pad * 2);
    const Y = (v) => box.y + box.h - pad - ((v - ymin) / (ymax - ymin || 1)) * (box.h - pad * 2);
    ctx.strokeStyle = "rgba(255,255,255,.15)";
    ctx.beginPath();
    if (yZero) { ctx.moveTo(box.x + 8, Y(0)); ctx.lineTo(box.x + box.w - 8, Y(0)); }
    if (xZero) { ctx.moveTo(X(0), box.y + 8); ctx.lineTo(X(0), box.y + box.h - 8); }
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.7;
    pts.forEach((p, n) => { const x = X(p[xKey]), y = Y(p[yKey]); if (n === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    ctx.fillStyle = "#c5d0dc";
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText(ylab + " / " + xlab, box.x + 8, box.y + 14);
  }
  loop({ x:0, y:0, w:w/2, h }, "paw", "lung", "#e6b325", "Paw", "P–V", true, "base");
  loop({ x:w/2, y:0, w:w/2, h }, "meas", "flow", "#3dbe6a", "Vol", "F–V", false, "mid");
}

function nums(series) {
  const gap = series.ppeak - series.pplat;
  const leakPct = series.vti > 0 ? Math.max(0, (series.vti - series.vte) / series.vti * 100) : 0;
  return [
    ["Ppeak", series.ppeak.toFixed(0), "cmH2O", series.ppeak > 35 ? "hi" : ""],
    ["Pplat", series.pplat.toFixed(0), "cmH2O", series.pplat > 30 ? "hi" : ""],
    ["Peak − plat", gap.toFixed(0), "cmH2O", gap > 10 && series.pplat < 28 ? "hi" : series.pplat >= 28 ? "" : "ok"],
    ["PEEPi", series.peepi.toFixed(1), "cmH2O", series.peepi > 2 ? "hi" : "ok"],
    ["VTi", Math.round(series.vti), "mL", ""],
    ["VTe", Math.round(series.vte), "mL", leakPct > 20 ? "hi" : ""],
    ["Leak", Math.round(leakPct), "%", leakPct > 20 ? "hi" : "ok"],
    ["End flow", series.flowEnd.toFixed(2), "L/s", series.flowEnd < -0.08 ? "hi" : "ok"],
  ];
}

const app = document.getElementById("app");
function drawUI() {
  if (screen === "quiz") return drawQuiz();
  if (screen === "done") return drawDone();
  const hub = location.hostname.endsWith("github.io") ? '<p><a href="index.html">← All simulators</a></p>' : "";
  const preset = PRESETS.find((p) => p.id === cfg.id) || PRESETS[0];
  app.innerHTML = `<div class="wrap">
    <div class="hero">${hub}
      <div style="font-size:13px;letter-spacing:.08em;font-weight:700">RESPIRATORY CRITICAL CARE</div>
      <h1>Ventilator waveforms</h1>
      <p class="lede">Change the lung and the breath. The scalars and the loops are how you tell resistance from compliance, trapping from a leak, and a patient who is still pulling.</p>
      <div class="top">
        <button class="on" id="tabE">Explore</button>
        <button id="tabQ">Troubleshoot</button>
      </div>
    </div>
    <h2>Pattern</h2>
    <div class="row" id="presets">${PRESETS.map((p) => `<button data-id="${p.id}" class="${p.id===cfg.id?"on":""}">${p.name}</button>`).join("")}</div>
    <h2>Scalars</h2>
    <canvas id="scalars"></canvas>
    <canvas id="loops" aria-label="Pressure-volume and flow-volume loops"></canvas>
    <div class="nums" id="nums"></div>
    <div class="panel" id="tell"></div>
    <h2>Change the breath</h2>
    <div class="panel" id="sliders"></div>
  </div>`;
  document.getElementById("tabQ").onclick = startQuiz;
  document.getElementById("presets").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const p = PRESETS.find((x) => x.id === b.dataset.id);
    cfg = Object.assign({}, p);
    drawUI();
  };
  const sliders = [
    ["rr","Rate", 10, 30, 1, " /min"],
    ["vt","Tidal volume", 300, 800, 10, " mL"],
    ["ti","Inspiratory time", 0.5, 1.6, 0.05, " s"],
    ["peep","Set PEEP", 0, 16, 1, ""],
    ["R","Resistance", 5, 35, 1, ""],
    ["C","Compliance", 12, 70, 1, " mL/cm"],
  ];
  document.getElementById("sliders").innerHTML = sliders.map(([k,lab,min,max,step,unit]) =>
    `<div class="slider"><label>${lab}<b id="v-${k}"></b></label><input id="s-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${cfg[k]}"></div>`
  ).join("") + `<div class="row" style="margin-top:12px">
      <button id="m-VC" class="${cfg.mode==="VC"?"on":""}">Volume control</button>
      <button id="m-PC" class="${cfg.mode==="PC"?"on":""}">Pressure control</button>
    </div>`;
  sliders.forEach(([k]) => {
    const el = document.getElementById("s-"+k);
    el.oninput = () => { cfg[k] = Number(el.value); cfg.id = "custom"; refresh(); };
  });
  document.getElementById("m-VC").onclick = () => { cfg.mode = "VC"; drawUI(); };
  document.getElementById("m-PC").onclick = () => { cfg.mode = "PC"; drawUI(); };
  refresh();
  document.getElementById("tell").innerHTML = `<b>${preset.name}</b><p style="margin-top:6px">${preset.stem}</p><p style="margin-top:6px;color:#334155">${preset.tell}</p>`;
}
function refresh() {
  const series = generate(cfg);
  draw(series);
  const box = document.getElementById("nums");
  if (!box) return;
  box.innerHTML = nums(series).map(([l,v,u,cls]) => `<div class="num"><span>${l}</span><b class="${cls}">${v}</b><span>${u}</span></div>`).join("");
  ["rr","vt","ti","peep","R","C"].forEach((k) => {
    const lab = document.getElementById("v-"+k);
    if (lab) lab.textContent = (k==="ti" ? Number(cfg[k]).toFixed(2) : cfg[k]) + ({rr:" /min",vt:" mL",ti:" s",peep:"",R:"",C:" mL/cm"}[k]);
  });
}
function startQuiz() {
  quiz = PRESETS.filter((p) => p.id !== "pc").map((p) => p.id);
  for (let i = quiz.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [quiz[i], quiz[j]] = [quiz[j], quiz[i]]; }
  qi = 0; score = 0; picked = null; screen = "quiz"; drawQuiz();
}
function optionsFor(id) {
  const names = PRESETS.filter((p) => p.id !== "pc").map((p) => p.id);
  const distract = names.filter((n) => n !== id);
  for (let i = distract.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [distract[i], distract[j]] = [distract[j], distract[i]]; }
  const opts = [id, ...distract.slice(0, 3)];
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  return opts;
}
let currentOpts = [];
function drawQuiz() {
  const id = quiz[qi];
  const preset = PRESETS.find((p) => p.id === id);
  cfg = Object.assign({}, preset);
  if (!picked) currentOpts = optionsFor(id);
  const hub = location.hostname.endsWith("github.io") ? '<p><a href="index.html">← All simulators</a></p>' : "";
  app.innerHTML = `<div class="wrap">
    <div class="hero">${hub}
      <div style="font-size:13px;letter-spacing:.08em;font-weight:700">TRACE ${qi+1} OF ${quiz.length}</div>
      <h1>What is wrong?</h1>
      <p class="lede">${preset.stem}</p>
      <div class="top"><button id="back">Explore</button><button id="next" ${picked?"":"disabled"}>Next</button></div>
    </div>
    <h2>Scalars and loops</h2>
    <canvas id="scalars"></canvas>
    <canvas id="loops"></canvas>
    <div class="nums" id="nums"></div>
    <h2>Diagnosis</h2>
    <div class="row" id="opts"></div>
    <div class="panel" id="why" style="display:${picked?"block":"none"}"></div>
  </div>`;
  document.getElementById("back").onclick = () => { screen = "explore"; cfg = Object.assign({}, PRESETS[0]); drawUI(); };
  document.getElementById("opts").innerHTML = currentOpts.map((oid) => `<button data-id="${oid}">${PRESETS.find(p=>p.id===oid).name}</button>`).join("");
  document.getElementById("opts").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || picked) return;
    picked = b.dataset.id;
    if (picked === id) score++;
    drawQuiz();
  };
  if (picked) {
    document.querySelectorAll("#opts button").forEach((b) => {
      if (b.dataset.id === id) b.className = "good";
      else if (b.dataset.id === picked) b.className = "bad";
    });
    document.getElementById("why").innerHTML = `<b>${picked===id?"Right.":"Not that pattern."}</b><p style="margin-top:6px">${preset.tell}</p>`;
    document.getElementById("next").disabled = false;
    document.getElementById("next").onclick = () => {
      picked = null; qi++;
      if (qi >= quiz.length) { screen = "done"; drawDone(); }
      else drawQuiz();
    };
  }
  const series = generate(cfg);
  draw(series);
  document.getElementById("nums").innerHTML = nums(series).map(([l,v,u,cls]) => `<div class="num"><span>${l}</span><b class="${cls}">${v}</b><span>${u}</span></div>`).join("");
}
function drawDone() {
  app.innerHTML = `<div class="wrap"><div class="hero">
    <div style="font-size:13px;letter-spacing:.08em;font-weight:700">DONE</div>
    <h1>${score} of ${quiz.length}</h1>
    <p class="lede">Peak minus plateau is resistance. Plateau minus PEEP is compliance. Flow that never returns to zero is trapping. A volume that never returns to zero is a leak.</p>
    <div class="top"><button id="again">Again</button><button id="explore">Explore</button></div>
  </div></div>`;
  document.getElementById("again").onclick = startQuiz;
  document.getElementById("explore").onclick = () => { screen = "explore"; cfg = Object.assign({}, PRESETS[0]); drawUI(); };
}
drawUI();
window.addEventListener("resize", () => { if (document.getElementById("scalars")) { const series = generate(cfg); draw(series); } });
</script>
