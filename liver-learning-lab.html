tibiotics if cholangitis or incomplete drainage is expected.","stage":0},{"title":"Position","text":"Prone or supine if the airway is protected. The side-viewing scope finds the ampulla in the second part of the duodenum.","stage":1},{"title":"Cannulation","text":"Selective bile-duct cannulation, contrast, then sphincterotomy, stone extraction or stent. Pancreatic-duct contrast is not a souvenir. It is a risk.","stage":2},{"title":"Complications","text":"Pancreatitis, bleeding, perforation and cholangitis if the duct is filled and not drained.","stage":3},{"title":"Aftercare","text":"Watch for pain that is pancreatitis. A falling bilirubin the next day means the stent is working. A rising one means it is not.","stage":3}]},{"title":"Percutaneous biliary drainage","steps":[{"title":"Indication","text":"Obstruction that ERCP cannot cross: a high hilar block, a failed cannulation, or surgical anatomy.","stage":0},{"title":"Cautions","text":"Ascites between the liver and the wall, and coagulopathy. Drain ascites first if the tract would cross it.","stage":0},{"title":"Puncture","text":"A peripheral duct is chosen under ultrasound or fluoroscopy, usually from the right flank or the left epigastrium.","stage":1},{"title":"Wire","text":"A wire crosses the stricture if it can. External drainage is the fallback. Internal-external drainage is more comfortable if the wire reaches the duodenum.","stage":2},{"title":"Complications","text":"Bleeding, bile leak, sepsis at the moment of decompression, and a catheter that falls out.","stage":3},{"title":"Aftercare","text":"Flush and secure the catheter. Bile output and the bilirubin tell you it is in the right place. Antibiotics if the system was infected.","stage":3}]}],"management":[{"title":"Acute liver failure","intubation":true,"blocks":[{"heading":"Principles","items":["Stop the cause. Start N-acetylcysteine for paracetamol at once. Call a transplant center when encephalopathy or a rising INR appears."]},{"heading":"Objectives","items":["Prevent hypoglycemia and aspiration. Protect the brain. Reach transplant if King's College criteria say survival without it is unlikely."]},{"heading":"Steps","items":["Resuscitate. Send the prognostic bloods before plasma. NAC. Screen for infection. Grade the brain hourly. Transfer before coma is deep if the center is elsewhere."]},{"heading":"Drugs","items":["N-acetylcysteine 150 mg/kg over 1 hour, then 50 mg/kg over 4 hours, then 100 mg/kg over 16 hours. Local two-bag protocols exist. Do not delay them for a level in an obvious large overdose."]},{"heading":"Avoid","items":["Sedatives that make the grade unreadable. Routine fresh frozen plasma. Hypotonic fluid if the brain is at risk."]},{"heading":"Monitoring","items":["Glucose hourly at first. INR, lactate, arterial ammonia, creatinine, and pupils."]},{"heading":"Escalation","items":["Intubate for grade III to IV encephalopathy. Continuous renal replacement if dialysis is needed. Intracranial-pressure care only in a unit that does it."]},{"heading":"Evidence","items":["EASL acute liver failure guidelines, 2017. King's College criteria. NAC is established for paracetamol and reasonable early in non-paracetamol failure. It is not a substitute for transplant."]}]},{"title":"ACLF","blocks":[{"heading":"Principles","items":["Acute-on-chronic liver failure is cirrhosis plus organ failure, not a high bilirubin alone. EASL-CLIF and APASL define it differently. Name which definition you are using."]},{"heading":"Objectives","items":["Treat the precipitant within the first day. Support failing organs. Decide early whether transplant is realistic in this admission."]},{"heading":"Steps","items":["Tap ascites. Culture. Stop nephrotoxins. Treat bleed, alcohol, or drug injury specifically. Recalculate organ failures at 48 hours."]},{"heading":"Drugs","items":["Antibiotics for documented or strongly suspected infection. The organ-failure drugs are those of the failing organ, not a single ACLF infusion."]},{"heading":"Avoid","items":["A therapeutic nihilism that delays the precipitant, and a therapeutic excess that starts steroids into untreated peritonitis."]},{"heading":"Monitoring","items":["CLIF-OF or the organ failures you can actually measure: brain, kidney, circulation, respiration, liver, coagulation."]},{"heading":"Escalation","items":["Three organ failures have a short survival without transplant. Say that to the family while the patient can still be assessed."]},{"heading":"Evidence","items":["CANONIC cohort and the EASL-CLIF definition. CLIF-C ACLF score from Jalan, Journal of Hepatology 2014. APASL ACLF is a different, liver-first definition."]}]},{"title":"Hepatic encephalopathy","intubation":true,"blocks":[{"heading":"Principles","items":["Find the precipitant. Give lactulose. Do not restrict protein. Protect the airway if the grade is III or IV."]},{"heading":"Objectives","items":["Two or three soft stools a day, a treated infection or bleed, and a patient who is safe to swallow."]},{"heading":"Steps","items":["Glucose. Ascitic tap. Drug chart. Stool chart. Lactulose. Rifaximin if this is a recurrence."]},{"heading":"Drugs","items":["Lactulose 20 to 30 mL every one to two hours until stool, then titrate. Retention enema if the gut is idle. Rifaximin 550 mg twice daily for secondary prevention."]},{"heading":"Avoid","items":["Benzodiazepines. Chasing a normal ammonia. Endless lactulose that dehydrates the patient into a worse grade."]},{"heading":"Monitoring","items":["West Haven grade, or Glasgow coma scale once intubated. Potassium. Kidneys."]},{"heading":"Escalation","items":["Intubate before transfer and before endoscopy. Reconsider a TIPS that has caused repeated coma."]},{"heading":"Evidence","items":["AASLD-EASL hepatic encephalopathy guideline, 2014."]}]},{"title":"Variceal bleeding","intubation":true,"blocks":[{"heading":"Principles","items":["Restrict transfusion. Give a vasoactive drug and an antibiotic. Endoscope within 12 hours. Early TIPS for the high-risk subgroup."]},{"heading":"Objectives","items":["Hemoglobin around 7 to 8 g/dL. A controlled varix. An airway that is not full of blood."]},{"heading":"Steps","items":["Two large cannulae. Vasoactive drug. Ceftriaxone. Transfuse to the restrictive target. Intubate if hematemesis is massive. Endoscopy. Early TIPS if Child-Pugh C is under 14 or Child-Pugh B is actively bleeding."]},{"heading":"Drugs","items":["Octreotide 50 micrograms bolus then 50 micrograms per hour, or terlipressin 2 mg every 4 hours while bleeding. Ceftriaxone 1 g daily for up to 7 days. Erythromycin before endoscopy if the QT interval allows."]},{"heading":"Avoid","items":["Liberal blood. Plasma to normalize the INR. Banding a fundal varix. A Sengstaken tube left in overnight."]},{"heading":"Monitoring","items":["Heart rate, hemoglobin, lactate, and the grade of encephalopathy."]},{"heading":"Escalation","items":["Balloon or stent only as a bridge measured in hours. TIPS for failure or for the pre-emptive indication."]},{"heading":"Evidence","items":["Baveno VII, 2022. Villanueva, New England Journal of Medicine 2013, for restrictive transfusion. García-Pagán, New England Journal of Medicine 2010, for early TIPS."]}]},{"title":"Spontaneous bacterial peritonitis","blocks":[{"heading":"Principles","items":["Tap. Treat at 250 neutrophils. Add albumin if the Sort risk factors are present."]},{"heading":"Objectives","items":["A falling neutrophil count at 48 hours and a creatinine that does not rise."]},{"heading":"Steps","items":["Culture bottles at the bedside. Third-generation cephalosporin. Albumin if creatinine is above 1 mg/dL, urea above 30 mg/dL, or bilirubin above 4 mg/dL."]},{"heading":"Drugs","items":["Cefotaxime 2 g every 8 hours or ceftriaxone 2 g daily for five days if uncomplicated. Albumin 1.5 g/kg on day 1 and 1 g/kg on day 3 in the high-risk group."]},{"heading":"Avoid","items":["Aminoglycosides. Waiting for the culture to start. Missing a secondary peritonitis that needs a surgeon."]},{"heading":"Monitoring","items":["Creatinine daily. Repeat tap at 48 hours if not improving. A fall under 25 percent means resistance or the wrong diagnosis."]},{"heading":"Escalation","items":["Shock is treated as shock. Imaging if the fluid is polymicrobial or the protein and LDH look surgical."]},{"heading":"Evidence","items":["Sort and colleagues, New England Journal of Medicine 1999. EASL 2018 and AASLD ascites guidance."]}]},{"title":"HRS-AKI","blocks":[{"heading":"Principles","items":["Prove it is not just volume or nephrotoxin. Then give albumin and a vasoconstrictor. Transplant is the cure."]},{"heading":"Objectives","items":["A creatinine fall of at least 30 percent without pulmonary edema."]},{"heading":"Steps","items":["Stop diuretics. Albumin 1 g/kg for two days. Tap for peritonitis. Then terlipressin or norepinephrine."]},{"heading":"Drugs","items":["Terlipressin 1 mg every 4 to 6 hours, up to 2 mg if creatinine does not fall, plus albumin 20 to 40 g daily. Norepinephrine is the ICU alternative. Stop terlipressin if oxygen falls."]},{"heading":"Avoid","items":["Midodrine and octreotide if a real vasoconstrictor is available. More terlipressin in a hypoxic patient."]},{"heading":"Monitoring","items":["Creatinine, oxygen saturation, and ischemic pain in gut, heart or digits."]},{"heading":"Escalation","items":["Renal replacement as a bridge to transplant, preferably continuous if unstable. Nonresponse is a transplant conversation."]},{"heading":"Evidence","items":["International Club of Ascites definition. CONFIRM trial and the license warning on respiratory failure."]}]},{"title":"Severe ascites","blocks":[{"heading":"Principles","items":["Salt restriction, aldosterone blockade, and albumin-covered large-volume drainage for tense fluid."]},{"heading":"Objectives","items":["An abdomen that can move, without a crashed blood pressure the same evening."]},{"heading":"Steps","items":["Tap first. Then either start diuretics or drain if tense. Albumin if more than 5 liters leave."]},{"heading":"Drugs","items":["Spironolactone 100 mg and furosemide 40 mg as a common start, titrated. Albumin 6 to 8 g per liter removed above 5 liters."]},{"heading":"Avoid","items":["Saline challenges. Nonsteroidal drugs. Draining 10 liters and calling albumin optional."]},{"heading":"Monitoring","items":["Weight, creatinine, sodium, and potassium."]},{"heading":"Escalation","items":["Refractory ascites: TIPS in selected patients, and transplant referral in all of them."]},{"heading":"Evidence","items":["EASL decompensated cirrhosis guidelines, 2018. AASLD ascites guidance."]}]},{"title":"Coagulopathy","blocks":[{"heading":"Principles","items":["The INR in cirrhosis is not a bleeding thermometer. Do not correct it for a paracentesis."]},{"heading":"Objectives","items":["Treat bleeding, not numbers. Give vitamin K if deficiency is plausible, especially in obstruction."]},{"heading":"Steps","items":["Ask whether the patient is bleeding or about to have a high-risk procedure. Then decide. Platelets and fibrinogen matter more than INR for many procedures."]},{"heading":"Drugs","items":["Vitamin K if cholestasis or malnutrition is likely. Plasma, platelets or cryoprecipitate for bleeding or a high-risk procedure, on local thresholds. There is no routine dose of plasma for an INR of 2."]},{"heading":"Avoid","items":["A unit of plasma before every tap. Tranexamic acid as a habit. The HALT-IT trial did not support it in gastrointestinal bleeding."]},{"heading":"Monitoring","items":["The site, the hemoglobin, and, where your unit uses them, viscoelastic tests. They are not yet a universal standard."]},{"heading":"Escalation","items":["Interventional radiology for a structural bleed. Hematology for fibrinolysis you can actually see."]},{"heading":"Evidence","items":["AASLD guidance on coagulation in cirrhosis advises against routine prophylactic plasma. HALT-IT, Lancet 2020, did not show a benefit of tranexamic acid in gastrointestinal bleeding."]}]},{"title":"Sepsis in cirrhosis","blocks":[{"heading":"Principles","items":["Cirrhosis hides peritonitis and underestimates infection. Culture widely and tap ascites. Source control still beats a broader antibiotic."]},{"heading":"Objectives","items":["Antibiotics within the hour if shock is present, and a source that has been looked for."]},{"heading":"Steps","items":["Blood cultures, ascitic tap, urine, chest imaging, and the abdomen. Cover Gram-negatives. Narrow later."]},{"heading":"Drugs","items":["A local sepsis antibiotic that covers spontaneous bacterial peritonitis organisms if ascites is present. Add albumin if the Sort criteria are met. Norepinephrine for shock."]},{"heading":"Avoid","items":["Aminoglycosides. A five-day delay before the first tap. Steroids for alcoholic hepatitis in untreated shock."]},{"heading":"Monitoring","items":["Lactate, creatinine, and a 48-hour reassessment of the neutrophil count if peritonitis was the source."]},{"heading":"Escalation","items":["This is how ACLF starts. Reassess organ failures. Discuss transplant if they are accumulating and the infection is controlled."]},{"heading":"Evidence","items":["EASL 2018 places infection as the dominant precipitant of decompensation. Surviving Sepsis timing applies. There is no cirrhosis exception to source control."]}]},{"title":"Hypoglycemia","blocks":[{"heading":"Principles","items":["A failing liver cannot store or make glucose reliably. Hypoglycemia is a medical emergency and a differential of encephalopathy."]},{"heading":"Objectives","items":["Glucose in a safe range, without large volumes of free water if cerebral edema is a concern."]},{"heading":"Steps","items":["Check glucose before you grade the brain. Give intravenous dextrose. Start a D10 infusion if hypoglycemia recurs. Feed the patient."]},{"heading":"Drugs","items":["Concentrated dextrose for an acute low value, then an infusion. Do not use a large hypotonic maintenance fluid as the glucose strategy in acute liver failure."]},{"heading":"Avoid","items":["Assuming a confused patient with cirrhosis is only encephalopathic. Missing hypoglycemia because the blood gas was not run."]},{"heading":"Monitoring","items":["Hourly glucose in acute liver failure until stable. Less often in stable cirrhosis, still at once if the mental state changes."]},{"heading":"Escalation","items":["Recurrent hypoglycemia is a marker of lost hepatic mass. In acute liver failure it belongs in the transplant conversation."]},{"heading":"Evidence","items":["EASL acute liver failure guidance treats hypoglycemia as a core element of intensive care, not an optional extra."]}]},{"title":"Cerebral edema","intubation":true,"blocks":[{"heading":"Principles","items":["This is mainly a disease of acute liver failure, not of ordinary cirrhosis. High ammonia, inflammation and lost autoregulation drive it."]},{"heading":"Objectives","items":["A sedated, normocapnic, head-up patient with a sodium that is not low, in a unit that can transplant."]},{"heading":"Steps","items":["Intubate at grade III. Head of bed 30 degrees. Hypertonic saline toward a sodium of 145 to 155 mmol/L in high-risk acute liver failure. Treat seizures if they occur."]},{"heading":"Drugs","items":["Hypertonic saline. Mannitol 0.5 to 1 g/kg for an acute pressure crisis if osmolality is under about 320 mOsm/kg. Norepinephrine to hold cerebral perfusion if shock coexists."]},{"heading":"Avoid","items":["Hyponatremia. High PEEP without thinking about venous drainage. Hyperventilation as a standing order. Ammonia-lowering drugs as a substitute for transplant."]},{"heading":"Monitoring","items":["Pupils, ammonia, sodium, osmolality, and, in selected transplant-center patients, intracranial pressure."]},{"heading":"Escalation","items":["A unilateral dilated pupil is herniation until proven otherwise. Mannitol or hypertonic saline, call the transplant surgeon, and do not send the patient for a leisurely CT first if they are crashing."]},{"heading":"Evidence","items":["Murphy and colleagues, Hepatology 2004, for hypertonic saline prophylaxis in severe acute liver failure. EASL 2017 for the rest of the package. Intracranial-pressure monitoring is center practice, not a universal mandate."]}]},{"title":"Mechanical ventilation","intubation":true,"blocks":[{"heading":"Principles","items":["Intubate to protect the airway in deep encephalopathy or massive hematemesis. Ventilate for the lung you find, and do not add a liver-specific mode that does not exist."]},{"heading":"Objectives","items":["An endotracheal tube confirmed by waveform capnography. Normoxia. Normocapnia if cerebral edema is the worry. A head-up position."]},{"heading":"Steps","items":["The film shows the sequence: prepare, pre-oxygenate, visualize the glottis, pass the tube through the cords, confirm a sustained capnography waveform, secure, and reassess ventilation."]},{"heading":"Drugs","items":["Induction drugs at reduced dose. The liver is not clearing them. Have vasopressors drawn up. These patients drop their blood pressure."]},{"heading":"Avoid","items":["High PEEP without checking the brain and the blood pressure. Prolonged hyperventilation. Forgetting that ascites, not the lung, may be the reason the pressures are high."]},{"heading":"Monitoring","items":["Capnography continuously. Plateau pressure. Blood gases. Pupils if acute liver failure."]},{"heading":"Escalation","items":["Drain tense ascites if it is splinting the diaphragm. Treat hydrothorax with a careful thoracentesis, not a chronic chest drain."]},{"heading":"Evidence","items":["Airway protection in grade III to IV encephalopathy is standard critical care and is stated in acute liver failure guidance. There is no randomized trial of a unique ventilator mode for liver failure."]}]},{"title":"Vasopressors","blocks":[{"heading":"Principles","items":["Cirrhotic shock is usually vasodilatory. Norepinephrine is the first vasoconstrictor. Terlipressin has a separate role in hepatorenal syndrome and in variceal bleeding. They are not interchangeable labels."]},{"heading":"Objectives","items":["A mean arterial pressure that restores urine output and mentation, commonly discussed around 65 mmHg, higher if the baseline was hypertension. Do not chase a number into ischemic digits."]},{"heading":"Steps","items":["Volume only if the patient is actually empty. Most of these patients are not. Norepinephrine. Treat the bleed, the peritonitis or the adrenal question on their own merits."]},{"heading":"Drugs","items":["Norepinephrine infusion. Vasopressin as a second catecholamine-sparing agent in septic shock, on sepsis guidance. Terlipressin for HRS-AKI or variceal bleeding at the doses in those chapters."]},{"heading":"Avoid","items":["Dopamine. A fluid bolus of saline every hour. Terlipressin stacked on norepinephrine without a reason and without watching oxygen."]},{"heading":"Monitoring","items":["Mean arterial pressure, lactate, urine, lactate again, and skin."]},{"heading":"Escalation","items":["If the pressure will not hold, look for bleeding, a missed source, and adrenal failure. Hydrocortisone in refractory septic shock follows sepsis practice, not a liver myth."]},{"heading":"Evidence","items":["Surviving Sepsis for norepinephrine and vasopressin. CONFIRM and variceal guidelines for the separate terlipressin indications."]}]},{"title":"Renal replacement therapy","blocks":[{"heading":"Principles","items":["Dialysis does not fix portal hypertension. It treats hyperkalemia, acidosis, fluid overload and uremia, and it can help control ammonia and temperature in acute liver failure."]},{"heading":"Objectives","items":["A safe potassium, a tolerable acid-base balance, and room for nutrition and blood products."]},{"heading":"Steps","items":["Standard indications, plus early discussion in acute liver failure when ammonia is high and the brain is at risk. Continuous therapy if the blood pressure is fragile."]},{"heading":"Drugs","items":["No unique dialysis fluid for liver disease. Dose antibiotics for the modality you are actually delivering. Albumin is not a dialysate."]},{"heading":"Avoid","items":["Intermittent dialysis in a patient with cerebral edema. Promising the family that the kidney machine replaces transplant."]},{"heading":"Monitoring","items":["Sodium, phosphate, glucose, and the anticoagulation of the circuit. Citrate accumulation is a real risk when the liver cannot clear it. Watch the total-to-ionized calcium ratio."]},{"heading":"Escalation","items":["In HRS-AKI, dialysis is a bridge. If transplant is impossible, continued dialysis needs an honest conversation."]},{"heading":"Evidence","items":["Continuous therapy is preferred in unstable acute liver failure in EASL guidance because osmotic shifts are slower. Citrate caution is standard intensive-care practice when liver function is poor."]}]},{"title":"Nutrition","blocks":[{"heading":"Principles","items":["Do not starve a patient with cirrhosis, and do not restrict protein to treat encephalopathy. The muscle is part of ammonia handling."]},{"heading":"Objectives","items":["Enough energy and 1.2 to 1.5 g/kg/day of protein in decompensated disease, unless a separate disease forbids it. A late-evening snack to shorten the fast."]},{"heading":"Steps","items":["Feed by mouth if safe. Nasogastric feeding if not. Parenteral nutrition only if the gut cannot be used. Thiamine before glucose in alcohol use."]},{"heading":"Drugs","items":["Thiamine, and replacement of confirmed fat-soluble vitamin deficiency in cholestasis. There is no routine branched-chain amino acid requirement for every ICU patient."]},{"heading":"Avoid","items":["Nil by mouth for days around a stable encephalopathy. Protein intakes of 0.5 g/kg that used to be taught and were wrong."]},{"heading":"Monitoring","items":["Glucose, phosphate on refeeding, and actual intake, not the diet sheet."]},{"heading":"Escalation","items":["A dietitian is part of ACLF care, not a discharge extra."]},{"heading":"Evidence","items":["ESPEN guideline on clinical nutrition in liver disease, 2019, and EASL nutrition advice: feed, include protein, add a bedtime snack."]}]},{"title":"Transplant referral","blocks":[{"heading":"Principles","items":["Referral is a phone call, not a reward for surviving a week. Acute liver failure and the first decompensation are both reasons to call."]},{"heading":"Objectives","items":["The patient assessed while still transplantable. A clear contraindication named early if one exists, such as uncontrolled extrahepatic malignancy or active substance use that the program will not accept."]},{"heading":"Steps","items":["King's College criteria for acute failure. MELD-Na and the complication list for cirrhosis. Document infection control before listing in ACLF."]},{"heading":"Drugs","items":["No drug earns a delay. NAC, terlipressin and antibiotics continue while the center decides."]},{"heading":"Avoid","items":["Waiting for the ammonia to look nicer. Sending an incomplete story without the INR trend, the lactate and the grade of coma."]},{"heading":"Monitoring","items":["The criteria you called about. Repeat them. A patient can cross a threshold between the morning round and the evening."]},{"heading":"Escalation","items":["If your hospital does not transplant, transfer agreements exist for a reason. Use them at grade II, not at fixed dilated pupils."]},{"heading":"Evidence","items":["King's College criteria remain the acute-liver-failure frame cited by EASL and AASLD. MELD-Na is the allocation tool for chronic disease in UNOS-style systems. Local allocation rules differ. Read the current ones."]}]}]}</script>
<script>

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      if (c === "&") return "&" + "amp;";
      if (c === "<") return "&" + "lt;";
      if (c === ">") return "&" + "gt;";
      return "&" + "quot;";
    });
  }
  function stopSpoken() {
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  function femaleVoice() {
    if (!window.speechSynthesis) return null;
    const voices = speechSynthesis.getVoices() || [];
    const named = /female|samantha|victoria|karen|moira|fiona|tessa|serena|zira|susan|veena|heera|sonia|catherine|allison|ava|nicky|libby/i;
    const en = voices.filter(function (voice) { return /^en/i.test(voice.lang || ""); });
    return en.find(function (voice) { return named.test((voice.name || "") + " " + (voice.voiceURI || "")); })
      || en.find(function (voice) { return /en-GB|en-IN|en-AU/i.test(voice.lang) && !/male/i.test(voice.name || ""); })
      || null;
  }
  function speakLine(text) {
    if (!text || !window.speechSynthesis) return;
    const say = function () {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = femaleVoice();
      utterance.lang = voice && voice.lang ? voice.lang : "en-GB";
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      if (voice) utterance.voice = voice;
      setTimeout(function () { speechSynthesis.speak(utterance); }, 60);
    };
    if (!speechSynthesis.getVoices().length) {
      const once = function () {
        speechSynthesis.removeEventListener("voiceschanged", once);
        say();
      };
      speechSynthesis.addEventListener("voiceschanged", once);
      speechSynthesis.getVoices();
      return;
    }
    say();
  }
  function diseaseById(id) {
    return DATA.diseases.find(function (item) { return item.id === id; });
  }
  function pointsOf(text) {
    const raw = String(text || "").replace(/\s+/g, " ").trim();
    if (!raw) return [];
    const words = raw.split(" ");
    const out = [];
    let buf = "";
    for (let i = 0; i < words.length; i++) {
      buf = buf ? buf + " " + words[i] : words[i];
      const word = words[i];
      const next = words[i + 1] || "";
      const stops = /[.?!]$/.test(word) && !/\d\.$/.test(word) && !/^[A-Za-z]\.$/.test(word);
      if (stops && (!next || /^[A-Z0-9"'(]/.test(next))) {
        out.push(buf);
        buf = "";
      }
    }
    if (buf) out.push(buf);
    return out.length ? out : [raw];
  }
  function marks(items) {
    const out = [];
    (items || []).forEach(function (item) {
      pointsOf(item).forEach(function (point) { if (point) out.push(point); });
    });
    return out;
  }
  function bullets(items) {
    const list = marks(items);
    if (!list.length) return "";
    return "<ul class='bullets'>" + list.map(function (item) { return "<li>" + esc(item) + "</li>"; }).join("") + "</ul>";
  }
  function pointSpans(items) {
    return marks(items).map(function (item) { return "<span class='point'>" + esc(item) + "</span>"; }).join("");
  }
  function investMarks(items) {
    const out = [];
    marks(items).forEach(function (line) {
      line.split(/;\s+/).forEach(function (part) {
        const clean = part.trim();
        if (clean) out.push(clean);
      });
    });
    return out;
  }
  function bulletList(list) {

  }
  function note() {
    return "<p class='fine'>Educational learning lab. Scores are illustrative, not a listing tool and not a local protocol.</p>";
  }
  const SCANS = {

    toxic:{file:"cirrhosis.jpg", mod:"CT", line:"Liver on CT", caption:"The liver. Toxic injury is the history and the enzymes. This film excludes another structural cause.", x:42, y:40, rx:24, ry:18, label:"Liver"},
    wilson:{file:"wilson.png", mod:"MRI", line:"Panda sign", caption:"MRI of the brain. Face of the giant panda sign in the midbrain.", x:50, y:58, rx:12, ry:12, label:"Midbrain"},
    cld:{file:"ascitesct.png", mod:"CT", line:"Chronic liver", caption:"Irregular liver with an enlarged spleen. A normal film does not exclude chronic disease.", x:32, y:40, rx:18, ry:16, label:"Liver"},
    cirrhosis:{file:"cirrhosis.jpg", mod:"CT", line:"Nodular surface", caption:"Nodular cirrhotic liver.", x:40, y:22, rx:22, ry:8, label:"Nodular surface"},

    ald:{file:"fatty.jpg", mod:"USG", line:"Steatosis", caption:"Steatosis, the early film of alcohol-associated liver disease. Later disease looks nodular.", x:48, y:55, rx:16, ry:14, label:"Steatosis"},
    aih:{file:"cirrhosis.jpg", mod:"CT", line:"Nodular liver", caption:"No specific scan. Late autoimmune hepatitis looks nodular, like this liver.", x:40, y:22, rx:22, ry:8, label:"Nodular surface"},

    psc:{file:"psc.jpg", mod:"MRI", line:"Beaded ducts", caption:"Cholangiogram. Beading and strictures.", x:52, y:42, rx:14, ry:16, label:"Beading"},
    phtn:{file:"varices.jpg", mod:"CT", line:"Varices", caption:"Varices of portal hypertension.", x:62, y:48, rx:10, ry:12, label:"Varices"},
    evarices:{file:"esovar.jpg", mod:"CT", line:"Esophageal varices", caption:"Large esophageal varices.", x:74, y:64, rx:8, ry:12, label:"Varices"},
    gvarices:{file:"varices.jpg", mod:"CT", line:"Varices", caption:"Varices. Gastric varices are sought in the fundus. This slice shows the upper abdominal veins.", x:62, y:48, rx:10, ry:12, label:"Varices"},
    vbleed:{file:"esovar.jpg", mod:"CT", line:"Esophageal varices", caption:"Esophageal varices, the usual source when this bleed is variceal.", x:74, y:64, rx:8, ry:12, label:"Varices"},
    ascites:{file:"ascites.jpg", mod:"USG", line:"Ascites", caption:"Anechoic ascites around the liver.", x:48, y:34, rx:22, ry:14, label:"Ascites"},
    sbp:{file:"ascites.jpg", mod:"USG", line:"Fluid to tap", caption:"Ascites. The infection is the cell count, not a mark on the fluid.", x:48, y:34, rx:22, ry:14, label:"Ascites"},
    hydro:{file:"effusion.jpg", mod:"CXR", line:"Pleural fluid", caption:"Large pleural effusion. Hepatic hydrothorax is usually on the right. The white hemithorax is the fluid.", x:72, y:52, rx:20, ry:28, label:"Pleural fluid"},
    hrs:{file:"ascitesct.png", mod:"CT", line:"Cirrhosis with ascites", caption:"Decompensated cirrhosis. The kidneys are not the picture that makes hepatorenal syndrome.", x:32, y:40, rx:18, ry:16, label:"Liver"},
    pvt:{file:"pvt.jpg", mod:"CT", line:"Portal vein thrombus", caption:"Thrombus in the portal vein.", x:24, y:50, rx:5, ry:8, label:"Thrombus"},
    bcs:{file:"bcs.jpg", mod:"CT", line:"Outflow block", caption:"Budd-Chiari syndrome. Patchy liver from blocked venous outflow.", x:28, y:48, rx:16, ry:20, label:"Patchy liver"},
    mhe:{file:"brainct.jpg", mod:"CT", line:"CT head", caption:"CT of the brain. Minimal encephalopathy is not on this film. The ventricles have no blood.", x:50, y:40, rx:8, ry:7, label:"No bleed"},
    ohe:{file:"brainct.jpg", mod:"CT", line:"CT head", caption:"CT of the brain. The grade is clinical. This film excludes a bleed.", x:50, y:40, rx:8, ry:7, label:"No bleed"},
    west:{file:"brainct.jpg", mod:"CT", line:"CT head", caption:"CT of the brain. West Haven grade is clinical. No blood in the ventricles.", x:50, y:40, rx:8, ry:7, label:"No bleed"},
    precip:{file:"brainct.jpg", mod:"CT", line:"CT head", caption:"CT of the brain. Use it to exclude a bleed, an infarct, or a mass.", x:50, y:40, rx:8, ry:7, label:"No bleed"},

  function scanOf(id){ return SCANS[id] || SCANS.cirrhosis; }
  function markSvg(scan){
    const marks = scan.marks || [{x:scan.x, y:scan.y, rx:scan.rx, ry:scan.ry, label:scan.label}];

      const ly = below ? mark.y + mark.ry + 4.2 : mark.y - mark.ry - 1.4;

  }

  const HOME = [
    ["anatomy", "Liver anatomy", "Lobes, Couinaud segments, and a cutaway of the vessels and one lobule."],

    return "<svg class='schematic' viewBox='0 0 320 160' role='img' aria-label='" + esc(label) + "'><rect width='320' height='160' fill='#10151c'/><path d='M40 80 H130' stroke='#7fd4e6' stroke-width='4'/><path d='M130 80 H210' stroke='#8fbf9f' stroke-width='8'/><path d='M210 80 H290' stroke='#e2b48a' stroke-width='4'/><circle cx='170' cy='80' r='26' fill='#16302c' stroke='#f3efe6'/><text x='16' y='28' fill='#f3efe6' font-size='14'>" + esc(label) + "</text><text x='16' y='140' fill='#b7b1a4' font-size='12'>Blood enters the sinusoid. Bile leaves into the canaliculus.</text></svg>";
  }
  function imageSvg(finding) {
    const marks = (finding.marks || []).map(function (mark) {
      return "<g data-mark='" + esc(mark.id) + "'><circle cx='" + mark.x + "' cy='" + mark.y + "' r='11' fill='#05070c' stroke='#e2b48a' stroke-width='2'/><text x='" + (mark.x - 4) + "' y='" + (mark.y + 4) + "' fill='#f3efe6' font-size='11'>+</text></g>";
    }).join("");
    return "<svg class='schematic tall' viewBox='0 0 320 200' role='img' aria-label='Teaching diagram, not a scan'><rect width='320' height='200' fill='#10151c'/><ellipse cx='78' cy='108' rx='28' ry='40' fill='#14222b' stroke='#7fd4e6'/><path d='M120 70 C150 40 230 40 250 78 C270 120 230 160 170 156 C120 152 100 120 120 70' fill='#16302c' stroke='#8fbf9f' stroke-width='2'/><path d='M132 116 C160 100 200 108 214 126' fill='none' stroke='#7fd4e6' stroke-width='3'/>" + marks + "</svg>";
  }
  function stageSvg(stage, title) {
    const depth = 46 + stage * 18;
    const y = Math.min(130, depth + 20);
    const words = ["Plan the path", "Mark the landmark", "Advance", "Confirm the result"][stage] || "Step";

  function calcBody(kind) {
    if (kind === "meld") {
      return "<p class='lede'>Illustrative UNOS MELD-Na. Bilirubin and creatinine in mg/dL, sodium in mmol/L. Values under 1 are lifted to 1. Creatinine is capped at 4, or set to 4 if dialysis was given at least twice in a week. Sodium is kept between 125 and 137. This is not a listing calculator.</p>"
        + field("bili", "Bilirubin mg/dL", "3") + field("inr", "INR", "1.8") + field("cr", "Creatinine mg/dL", "1.4") + field("na", "Sodium mmol/L", "132", "1")
        + "<label class='check'><input id='dialysis' type='checkbox'> Dialysis at least twice in the past week</label>"
        + "<div id='out'></div>";
    }
    if (kind === "child") {
      return "<p class='lede'>Illustrative Child-Pugh. Bilirubin in mg/dL, albumin in g/dL. Class A is 5 to 6, B is 7 to 9, C is 10 to 15. Cholestatic diseases historically use different bilirubin cutoffs.</p>"
        + field("bili", "Bilirubin mg/dL", "2.4") + field("alb", "Albumin g/dL", "3.0") + field("inr", "INR", "1.6")
        + select("ascites", "Ascites", 2, [[1, "None"], [2, "Mild, or controlled"], [3, "Moderate or severe"]])
        + select("he", "Encephalopathy", 1, [[1, "None"], [2, "Grade I to II"], [3, "Grade III to IV"]])
        + "<div id='out'></div>";
    }
    if (kind === "fib4") {
      return "<p class='lede'>FIB-4 = age × AST / (platelets × square root of ALT). Platelets are in 10⁹/L. Under 1.30 is a low-risk rule-out in adults under 65. Some pathways use under 2.0 above age 65. At or above 2.67 suggests advanced fibrosis. Illustrative only.</p>"
        + field("age", "Age years", "58", "1") + field("ast", "AST U/L", "62", "1") + field("alt", "ALT U/L", "48", "1") + field("plt", "Platelets ×10⁹/L", "160", "1")
        + "<div id='out'></div>";
    }
    if (kind === "maddrey") {
      return "<p class='lede'>Discriminant function = 4.6 × (patient prothrombin time − control) + bilirubin in mg/dL. A value of 32 or more was the severe threshold in the steroid trials. Illustrative only.</p>"
        + field("pt", "Patient PT seconds", "22") + field("control", "Control PT seconds", "12") + field("bili", "Bilirubin mg/dL", "8")
        + "<div id='out'></div>";
    }
    if (kind === "lille") {
      return "<p class='lede'>Louvet Lille model. Albumin in g/L on day 0. Bilirubin in µmol/L. Prothrombin time in seconds. A score of 0.45 or more at day 7 marks a poor steroid response in the original paper. Illustrative only.</p>"
        + field("age", "Age years", "50", "1") + field("alb", "Albumin day 0, g/L", "28") + field("bili0", "Bilirubin day 0, µmol/L", "180")
        + field("bili7", "Bilirubin day 7, µmol/L", "140") + field("pt", "Prothrombin time seconds", "20")
        + select("renal", "Renal insufficiency", 0, [[0, "No"], [1, "Yes"]])
        + "<div id='out'></div>";
    }
    if (kind === "clif") {
      return "<p class='lede'>CLIF-C ACLF = 10 × [0.33 × CLIF-OF + 0.04 × age + 0.63 × ln(white cells) − 2]. Enter a CLIF-OF organ score from 6 to 18 and white cells in 10⁹/L. Illustrative only.</p>"
        + bullets(["ACLF grade 1 is one organ failure with the published extra rules for kidney and brain. Grade 2 is two organ failures. Grade 3 is three or more. EASL-CLIF and APASL define ACLF differently."])
        + field("organ", "CLIF-OF score, 6 to 18", "10", "1") + field("age", "Age years", "58", "1") + field("wbc", "White cells ×10⁹/L", "8")
        + "<div id='out'></div>";
    }
    return "";
  }
  function paintCalc(kind) {
    const out = document.getElementById("out");
    if (!out) return;
    if (kind === "meld") {
      const bilirubin = Math.max(1, num("bili"));
      let creatinine = Math.max(1, Math.min(4, num("cr")));
      if (document.getElementById("dialysis").checked) creatinine = 4;
      const ratio = Math.max(1, num("inr"));
      let meld = 10 * (0.957 * Math.log(creatinine) + 0.378 * Math.log(bilirubin) + 1.12 * Math.log(ratio) + 0.643);
      meld = Math.round(meld);
      if (meld > 11) {
        const sodium = Math.min(137, Math.max(125, num("na")));
        meld = Math.round(meld + 1.32 * (137 - sodium) - 0.033 * meld * (137 - sodium));
      }
      meld = Math.max(6, Math.min(40, meld));
      out.innerHTML = result("Illustrative MELD-Na", String(meld));
    } else if (kind === "child") {
      const b = num("bili");
      const a = num("alb");
      const i = num("inr");
      const points = (b < 2 ? 1 : b <= 3 ? 2 : 3) + (a > 3.5 ? 1 : a >= 2.8 ? 2 : 3) + (i < 1.7 ? 1 : i <= 2.3 ? 2 : 3) + Number(document.getElementById("ascites").value) + Number(document.getElementById("he").value);
      const grade = points <= 6 ? "A" : points <= 9 ? "B" : "C";
      out.innerHTML = result("Illustrative Child-Pugh", points + " · class " + grade);
    } else if (kind === "fib4") {
      const platelets = num("plt");
      const alanine = num("alt");
      const score = platelets <= 0 || alanine <= 0 ? 0 : (num("age") * num("ast")) / (platelets * Math.sqrt(alanine));
      const band = score < 1.3 ? "Low risk of advanced fibrosis if under 65" : score > 2.67 ? "High risk" : "Indeterminate";
      out.innerHTML = result("Illustrative FIB-4", score.toFixed(2) + " · " + band);
    } else if (kind === "maddrey") {
      const score = 4.6 * (num("pt") - num("control")) + num("bili");
      out.innerHTML = result("Illustrative Maddrey", score.toFixed(1) + " · " + (score >= 32 ? "at or above 32" : "below 32"));
    } else if (kind === "lille") {
      const evolution = num("bili0") - num("bili7");
      const r = 3.19 - 0.101 * num("age") + 0.147 * num("alb") + 0.0165 * evolution - 0.206 * Number(document.getElementById("renal").value) - 0.0065 * num("bili0") - 0.0096 * num("pt");
      const exp = Math.exp(-r);
      const score = exp / (1 + exp);
      out.innerHTML = result("Illustrative Lille", score.toFixed(2) + " · " + (score >= 0.45 ? "0.45 or more" : "below 0.45"));
    } else if (kind === "clif") {
      const white = Math.max(0.1, num("wbc"));
      const score = 10 * (0.33 * num("organ") + 0.04 * num("age") + 0.63 * Math.log(white) - 2);
      out.innerHTML = result("Illustrative CLIF-C ACLF", score.toFixed(1));
    }
  }
  function bindCalc(kind) {

    paintCalc(kind);
  }

  const LIVER_PARTS = [

    {id:"ii", mesh:"Left posterior lateral segment of liver (II)", title:"Segment II", short:"Left lateral, superior", say:"Segment two. Left posterior lateral segment. It is the superior part of the left lateral section, to the left of the falciform ligament."},
    {id:"iii", mesh:"Left anterior lateral segment of liver (III)", title:"Segment III", short:"Left lateral, inferior", say:"Segment three. Left anterior lateral segment. With segment two it is the left lateral section, the part that crosses the midline."},
    {id:"iv", mesh:"Left medial segment of liver (IV)", title:"Segment IV", short:"Left medial, quadrate lobe", say:"Segment four. Left medial segment. It includes the quadrate lobe and lies between the falciform ligament and Cantlie's line."},
    {id:"v", mesh:"Anterior medial segment of liver (V)", title:"Segment V", short:"Right anterior, inferior", say:"Segment five. Right anterior inferior segment. It lies beside the gallbladder fossa."},

    {id:"whole", mesh:"Liver", title:"Whole liver", short:"Show the organ", say:"Whole liver. The functional right and left lobes are divided by Cantlie's line, from the gallbladder fossa to the inferior vena cava, not by the falciform ligament."}

  function liverPartById(id){ return LIVER_PARTS.find(function(item){ return item.id===id; }) || null; }
  function normLiverName(name){

  function mountLiver(initialId){
    paintLiverList(initialId);
    const canvas = document.getElementById("liver3d");
    if(!canvas) return;
    let stopped = false;
    let frame = 0;
    let renderer = null;
    let controls = null;
    let draco = null;
    const selected = {id: initialId};
    window.__liverSelect = function(id){
      selected.id = id || "";
      paintLiverList(selected.id);
      if(window.__liverPaint) window.__liverPaint();
      if(window.__liverFrame) window.__liverFrame(selected.id);
    };
    liverStop = function(){
      stopped = true;
      cancelAnimationFrame(frame);
      window.__liverSelect = null;
      window.__liverPaint = null;
      window.__liverFrame = null;
      if(window.__liverResize){ window.removeEventListener("resize", window.__liverResize); window.__liverResize = null; }
      if(controls) controls.dispose();
      if(draco) draco.dispose();
      if(renderer){ renderer.dispose(); try{ renderer.forceContextLoss(); }catch(err){} }
    };
    import("three").then(function(THREE){
      return Promise.all([
        import("three/addons/loaders/GLTFLoader.js"),
        import("three/addons/controls/OrbitControls.js"),
        import("three/addons/loaders/DRACOLoader.js"),
        Promise.resolve(THREE)

    }).then(function(mods){
      if(stopped) return;
      const GLTFLoader = mods[0].GLTFLoader;
      const OrbitControls = mods[1].OrbitControls;
      const DRACOLoader = mods[2].DRACOLoader;
      const THREE = mods[3];
      try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false, powerPreference:"high-performance"}); }
      catch(err){
        const load = document.getElementById("liverload");
        if(load) load.textContent = "3D is not available in this browser. The structure list is still here.";
        return;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setClearColor(0x07111a, 1);
      if("outputColorSpace" in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
      if(THREE.ACESFilmicToneMapping){ renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2; }
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xf7f1e6, 0x2a211c, 1.2));
      const key = new THREE.DirectionalLight(0xfff6ea, 1.7);
      key.position.set(2.4, 3.6, 4.2);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xf3efe6, 0.55);
      fill.position.set(-2.2, 0.6, 2.4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0x7fd4e6, 0.28);
      rim.position.set(-3, 1.2, -2.4);
      scene.add(rim);
      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 50);
      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.enablePan = false;
      const root3 = new THREE.Group();
      scene.add(root3);
      const meshes = [];
      const COLOUR = {i:0x8e4b46, ii:0xc48978, iii:0xb56a5e, iv:0xd4a08c, v:0xa85a50, vi:0x965046, vii:0x7a3e3a, viii:0xc46e62, gb:0xd7b07a, duct:0x7fd4e6, whole:0xc4816e};
      function colourOf(id){ return COLOUR[id] || 0xc4816e; }
      function resize(){
        const parent = canvas.parentElement;
        const w = canvas.clientWidth || (parent && parent.clientWidth) || 320;
        const h = canvas.clientHeight || (parent && parent.clientHeight) || 360;
        renderer.setSize(w, h, false);
        camera.aspect = w / Math.max(1, h);
        camera.updateProjectionMatrix();
      }
      window.__liverResize = resize;
      function paint(){
        const part = liverPartById(selected.id);
        meshes.forEach(function(mesh){
          const mine = !!(part && mesh.userData.partId === part.id);
          const shell = mesh.userData.partId === "whole";
          const accessory = mesh.userData.partId === "gb" || mesh.userData.partId === "duct";
          const showShell = !!(part && part.id === "whole");
          mesh.visible = showShell ? (shell || accessory) : !shell;
          const mat = mesh.material;
          const base = new THREE.Color(colourOf(mesh.userData.partId));
          if(!part || mine){
            mat.color.copy(base);
            if(mine) mat.color.lerp(new THREE.Color(0xfff6e8), 0.72);
            mat.emissive.copy(mine ? new THREE.Color(0xe2b48a) : new THREE.Color(0x000000));
            mat.emissiveIntensity = mine ? 0.85 : 0;
            mat.opacity = 1;
            mat.transparent = false;
            mat.depthWrite = true;
            mesh.renderOrder = mine ? 3 : 1;
          }else{
            mat.color.copy(base).multiplyScalar(0.42);
            mat.emissive.set(0x000000);
            mat.emissiveIntensity = 0;
            mat.opacity = mesh.visible ? 0.3 : 0;
            mat.transparent = true;
            mat.depthWrite = false;
            mesh.renderOrder = 0;
          }
        });
      }
      window.__liverPaint = paint;
      function framePart(id){
        const part = liverPartById(id);
        const box = new THREE.Box3();
        let n = 0;
        meshes.forEach(function(mesh){
          if(!mesh.visible) return;
          if(part && mesh.userData.partId !== part.id) return;
          box.expandByObject(mesh);
          n += 1;
        });
        if(!n){
          meshes.forEach(function(mesh){ if(mesh.visible) box.expandByObject(mesh); });
        }
        if(box.isEmpty()) return;
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const radius = Math.max(size.length() * 0.5, 0.012);
        const vFov = camera.fov * Math.PI / 180;
        const aspect = Math.max(0.45, camera.aspect || 1);
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
        const dist = Math.max(radius / Math.tan(vFov / 2), radius / Math.tan(hFov / 2)) * 1.38;
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(dist * 0.42, dist * 0.18, dist));
        camera.near = Math.max(dist / 200, 0.001);
        camera.far = Math.max(dist * 80, 8);
        controls.minDistance = radius * 0.35;
        controls.maxDistance = dist * 5;
        camera.updateProjectionMatrix();
        controls.update();
      }
      window.__liverFrame = framePart;
      const ray = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      let downX = 0, downY = 0;
      canvas.addEventListener("pointerdown", function(event){ downX = event.clientX; downY = event.clientY; });

        if(Math.abs(event.clientX - downX) + Math.abs(event.clientY - downY) > 10) return;
        const rect = canvas.getBoundingClientRect();
        ndc.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -(((event.clientY - rect.top) / rect.height) * 2 - 1));
        ray.setFromCamera(ndc, camera);
        const hits = ray.intersectObjects(meshes.filter(function(mesh){ return mesh.visible; }), false);
        if(!hits[0]) return;
        const found = liverPartByMesh(hits[0].object.name);
        if(!found) return;
        location.hash = "anatomy/" + found.id;
      });
      function loop(){
        if(stopped) return;
        frame = requestAnimationFrame(loop);
        controls.update();
        renderer.render(scene, camera);

        if(fit.isEmpty()){ fallbackLiver(); return; }
        const center = fit.getCenter(new THREE.Vector3());
        liverRoot.position.sub(center);
        const span = fit.getSize(new THREE.Vector3()).length();
        if(span > 0) liverRoot.scale.setScalar(1.6 / span);
        liverRoot.updateMatrixWorld(true);
        buildInsides(new THREE.Box3().setFromObject(liverRoot));
        resize();
        paint();
        framePart(selected.id);
        const load = document.getElementById("cutload");
        if(load) load.classList.add("hide");
        loop();
      }, undefined, function(){ if(!stopped) fallbackLiver(); });
    }).catch(function(){
      const load = document.getElementById("cutload");
      if(load) load.textContent = "The 3D viewer did not start.";
    });
  }

    rows.push({href:"cutaway", title:"Internal anatomy", text:"Cutaway, portal triad, lobule", group:"Anatomy"});
    LIVER_PARTS.forEach(function(item){
      rows.push({href:"anatomy/" + item.id, title:item.title, text:item.short, group:"Anatomy"});
    });
    CUT_PARTS.forEach(function(item){
      rows.push({href:"cutaway/" + item.id, title:item.title, text:item.short, group:"Cutaway"});
    });
    DATA.pathways.forEach(function(item){
      rows.push({href:"physiology/" + item.id, title:item.title, text:item.summary, group:"Physiology"});
    });
    DATA.diseases.forEach(function(item){
      rows.push({href:"diseases/" + item.id, title:item.name, text:"Disease", group:"Diseases"});
    });
    labPages().forEach(function(page, index){
      rows.push({href:"investigations/" + index, title:page.title, text:"Investigation", group:"Investigations"});
    });
    scorePages().forEach(function(page, index){
      rows.push({href:"scores/" + index, title:page.title, text:"Score", group:"Important scores"});

    });
    DATA.procedures.forEach(function(item, index){
      rows.push({href:"procedures/" + index, title:item.title, text:"Procedure", group:"Procedures"});

  function paintHits(){
    const box = document.getElementById("hits");
    const input = document.getElementById("labfind");
    if(!box || !input) return;
    const query = input.value.trim().toLowerCase();
    const hits = catalog().filter(function(row){
      if(!query) return row.group !== "Anatomy" && row.group !== "Cutaway";
      return (row.title + " " + row.text + " " + row.group).toLowerCase().indexOf(query) !== -1;
    }).slice(0, 40);
    box.innerHTML = hits.length
      ? hits.map(function(row){ return card(row.href, row.title, row.group + ". " + row.text); }).join("")
      : "<p class='fine'>Nothing matches.</p>";
  }
  function renderSearch(){
    document.getElementById("kicker").textContent = "Search";
    document.getElementById("title").textContent = "Search";
    root.innerHTML = "<div class='stack' id='hits'></div>";
    paintHits();
    speakLine("Search the liver lab.");
  }
  function scrollPage(head){
    requestAnimationFrame(function(){
      const open = (head === "procedures" || head === "physiology") ? root.querySelector(".vcard.on") : null;
      if(open){
        open.scrollIntoView({block:"start"});
        return;
      }
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      try{
        if(window.parent && window.parent !== window){
          window.parent.scrollTo(0, 0);
          const room = window.parent.document.getElementById("room");
          if(room) room.scrollTop = 0;
        }
      }catch(err){}
    });
  }

      return;
    }
    const pathway = DATA.pathways.find(function (item) { return item.id === rest[0]; }) || DATA.pathways[0];

      btn.onclick = function () {

  function renderListDetail(section, title, pages, rest, paint) {
    document.getElementById("kicker").textContent = title;
    if (!rest.length) {
      document.getElementById("title").textContent = title;
      root.innerHTML = "<div class='stack'>" + pages.map(function (page, index) {
        const pts = investMarks(page.items).slice(0, 3);

        return "<a class='vcard' href='#" + section + "/" + index + "'><b>" + esc(page.title) + "</b>" + pointSpans(pts) + "</a>";
      }).join("") + "</div>";
      speakLine(title + ". Each topic is in points.");
      return;
    }
    const index = Math.max(0, Math.min(pages.length - 1, Number(rest[0]) || 0));
    const page = pages[index];
    document.getElementById("title").textContent = page.title;
    const painted = paint(page);
    root.innerHTML = painted.html;
    if (painted.calc) bindCalc(painted.calc);
    if (painted.after) painted.after();
    speakLine(painted.spoken);
  }

  function renderImaging(rest) {
    document.getElementById("kicker").textContent = "Imaging";
    if (!rest.length) {
      document.getElementById("title").textContent = "Imaging lab";
      let last = "";
      const html = DATA.findings.map(function (item, index) {
        const head = item.group !== last ? "<p class='group'>" + esc(item.group) + "</p>" : "";
        last = item.group;
        const film = IMAGING[item.title];
        const line = film ? film.mod + " · " + film.label : item.points[0];
        return head + card("imaging/" + index, item.title, line);
      }).join("");
      root.innerHTML = stack(html);
      speakLine("Imaging lab. Real films. The mark sits on the finding.");
      return;
    }
    const index = Math.max(0, Math.min(DATA.findings.length - 1, Number(rest[0]) || 0));
    const finding = DATA.findings[index];
    const film = IMAGING[finding.title] || IMAGING["Cirrhotic liver"];
    document.getElementById("kicker").textContent = finding.group;
    document.getElementById("title").textContent = finding.title;
    const points = (finding.points || []).filter(function (line) {
      return !/diagram|drawing|not an ultrasound|not a ct|fabricated|does not invent|not a scan/i.test(line);
    });
    const extra = (finding.marks || []).map(function (mark) { return mark.label + ". " + mark.text; });
    const figure = "<figure class='film'><div class='shot'><img src='liver/scans/" + film.file + "?v=20261103e' alt=''><svg class='mark' viewBox='0 0 100 100' preserveAspectRatio='none' aria-hidden='true'>" + markSvg(film) + "</svg></div><figcaption>" + esc(film.mod) + " · " + esc(film.caption) + "</figcaption></figure>";
    root.innerHTML = figure + bullets(points.concat(extra)) + note();
    speakLine(finding.title + ". " + film.label + ". " + film.caption);
  }

  function remember(hash) {
    const here = hash || "#home";
    if (applyingBack) { applyingBack = false; return; }
    if (navStack[navStack.length - 1] !== here) navStack.push(here);
  }
  function pageBack() {
    if (navStack.length > 1) {
      navStack.pop();
      applyingBack = true;
      location.hash = navStack[navStack.length - 1];
      return true;
    }
    return false;
  }
  window.__pageBack = pageBack;

  back.onclick = function (event) {
    event.preventDefault();
    stopSpoken();
    if (pageBack()) return;
    if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) return;
    location.href = "index.html?doors=liver";
  };

  const labfind = document.getElementById("labfind");
  if(labfind){
    labfind.addEventListener("focus", function(){
      if(parse().head !== "search") location.hash = "search";
    });
    labfind.addEventListener("input", function(){
      if(parse().head !== "search") location.hash = "search";
      else paintHits();
    });
  }

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "home";
  else render();
})();
