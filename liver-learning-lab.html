<script id="payload" type="application/json">{"categories":[{"id":"acute","title":"Acute liver diseases"},{"id":"chronic","title":"Chronic liver diseases"},{"id":"portal","title":"Portal hypertension and complications"},{"id":"he","title":"Hepatic encephalopathy"},{"id":"other","title":"Other important conditions"}],"chapters":[["definition","Definition and diagnostic criteria"],["etiology","Etiology and risk factors"],["classification","Classification and grading"],["pathophysiology","Detailed pathophysiology"],["mechanisms","Cellular and molecular mechanisms"],["clinical","Clinical manifestations"],["labs","Laboratory abnormalities"],["investigations","Diagnostic investigations"],["imaging","Imaging findings"],["criteria","Diagnostic criteria"],["scores","Severity and prognostic scores"],["differential","Differential diagnosis"],["management","Evidence-based management"],["drugs","Pharmacological management"],["nonPharm","Non-pharmacological management"],["icu","ICU management"],["complications","Complications"],["prognosis","Prognosis"],["guidelines","Guideline recommendations"],["pearls","Key clinical pearls"]],"diseases":[{"id":"alf","name":"Acute liver failure","category":"acute","blocks":{"definition":["Acute liver failure is an acute liver injury with encephalopathy and coagulopathy (usually INR at least 1.5) in a patient without preexisting cirrhosis.","The interval from jaundice to encephalopathy defines hyperacute, acute and subacute presentations. Wilson disease and some vertically acquired hepatitis B can present as acute failure on unrecognized chronic disease."],"etiology":["Paracetamol is the leading cause in many high-income countries. Other drugs, hepatitis A, B and E, autoimmune hepatitis, Wilson disease, ischemic hepatitis, mushroom poisoning and pregnancy-related liver disease follow.","Indeterminate cases remain common. Ask specifically about dose, staggered ingestion, herbal products and suicide risk."],"classification":["Hyperacute: encephalopathy within 7 days of jaundice. Acute: 8 to 28 days. Subacute: more than 28 days and less than 26 weeks.","Hyperacute paracetamol injury has marked enzyme rise and a better transplant-free survival than subacute presentations, which often have only modest enzyme elevation."],"pathophysiology":["Massive hepatocyte necrosis removes synthetic and detoxifying capacity. Ammonia rises, glutamine accumulates in astrocytes, and cerebral blood flow becomes dysregulated.","Systemic inflammation and loss of peripheral vascular tone produce vasodilatory shock. The kidney, lung and bone marrow are frequent secondary targets."],"mechanisms":["Paracetamol: CYP2E1 forms NAPQI, glutathione is depleted, and mitochondrial injury kills hepatocytes.","Cerebral edema is more a feature of hyperacute failure than of cirrhosis. High arterial ammonia, systemic inflammation and loss of autoregulation are the drivers."],"clinical":["Jaundice, nausea, right-upper-quadrant pain, then confusion, asterixis and progressive coma. Hypoglycemia may be the first metabolic clue.","Look for a small liver, bleeding from mucosa, and signs of the cause: shock liver after hypotension, hemolysis in Wilson disease, pregnancy beyond 20 weeks for AFLP and HELLP."],"labs":["INR rises. Glucose falls. Lactate may stay high after resuscitation. Aminotransferases can be in the thousands in toxic or ischemic injury and only modest in subacute failure.","Creatinine, arterial ammonia, pH and factor V, where available, are used for prognosis. A very high bilirubin with low alkaline phosphatase suggests Wilson disease."],"investigations":["Paracetamol level, viral serology including hepatitis E, autoimmune markers, ceruloplasmin and hemolysis screen, pregnancy test, and a careful drug history.","Ultrasound with Doppler to exclude chronic liver disease, biliary obstruction and Budd-Chiari syndrome. Biopsy is rarely required and is risky."],"imaging":["The liver may look collapsed and heterogeneous. Doppler should confirm hepatic vein outflow so that Budd-Chiari syndrome is not missed.","CT of the head does not reliably exclude early cerebral edema. Clinical grade and ammonia guide that concern."],"criteria":["Practical definition used by transplant units: acute liver injury, INR at least 1.5, and any degree of encephalopathy, without cirrhosis, illness under 26 weeks.","King's College criteria select who is unlikely to survive without transplant. They are not required to make the diagnosis."],"scores":["King's College criteria, separated for paracetamol and non-paracetamol causes. Arterial lactate after fluid resuscitation adds prognostic information in paracetamol injury.","MELD is not the primary listing tool for acute liver failure, although some regions use it alongside King's College criteria."],"differential":["Acute decompensation of cirrhosis, severe sepsis with coagulopathy, toxic shock, alcoholic hepatitis, and acute-on-chronic liver failure.","A nodular liver, splenomegaly or clear portosystemic collaterals point away from a truly acute first presentation."],"management":["Stop the offending drug. Start N-acetylcysteine for paracetamol injury immediately, and discuss it early for non-paracetamol acute liver failure while the cause is still being proven.","Contact a transplant center at the first sign of encephalopathy or a rising INR. Do not wait for deep coma."],"drugs":["Intravenous N-acetylcysteine, traditional three-bag regimen: 150 mg/kg over 1 hour, then 50 mg/kg over 4 hours, then 100 mg/kg over 16 hours. Local two-bag protocols also exist.","Avoid sedatives that cloud encephalopathy grading. Treat infection early. There is no routine role for fresh frozen plasma unless a procedure or bleeding requires it."],"nonPharm":["Nurse at 30 degrees. Keep sodium toward 145 to 155 mmol/L with hypertonic saline in high-risk encephalopathy, as used in specialist units.","Frequent glucose checks. Continuous renal replacement rather than intermittent dialysis if renal support is needed and cerebral edema is a concern."],"icu":["Intubate for airway protection in advanced encephalopathy before transfer or procedures. Confirm the airway with waveform capnography.","Norepinephrine for vasodilatory shock. Target normocapnia. Mannitol or hypertonic saline for an acute ICP crisis if osmolarity allows. Raise the question of intracranial pressure monitoring only in experienced transplant centers."],"complications":["Cerebral edema, infection, bleeding, acute kidney injury, hypoglycemia, pancreatitis and noncardiogenic pulmonary edema."],"prognosis":["Transplant-free survival is best in hyperacute paracetamol injury treated early, and worst in subacute indeterminate or drug-induced failure once encephalopathy is established.","Death is often from cerebral herniation or multiorgan failure if transplant is not available in time."],"guidelines":["EASL Clinical Practical Guidelines on acute liver failure, 2017: early N-acetylcysteine, early transplant referral, and structured intensive care.","AASLD acute liver failure guidance: immediate N-acetylcysteine for paracetamol, and King's College criteria to identify transplant candidates. Confirm the current document before using a threshold at the bedside."],"pearls":["A falling aminotransferase with a rising INR and bilirubin is deterioration, not recovery.","Do not correct the INR with plasma before the prognostic blood draw unless the patient is bleeding."]}},{"id":"avh","name":"Acute viral hepatitis","category":"acute","blocks":{"definition":["Acute viral hepatitis is a self-limited or, less often, fulminant infection of hepatocytes by hepatitis A, B, C, D or E, or by non-hepatotropic viruses such as HSV, EBV or CMV."],"etiology":["Hepatitis A and E are fecal-oral. B, C and D are blood and body-fluid borne. Hepatitis E in pregnancy, and hepatitis B with hepatitis D, carry higher failure risk.","Immunosuppression and pregnancy change severity, especially for hepatitis E and herpes simplex hepatitis."],"classification":["Anicteric, icteric, cholestatic and fulminant patterns. Only a minority of acute viral hepatitis becomes acute liver failure."],"pathophysiology":["Injury is largely immune-mediated hepatocyte death rather than a direct viral cytopathic effect, except for herpes simplex, which is directly cytopathic.","Massive necrosis, when it occurs, follows the same detoxification and cerebral pathway as other causes of acute liver failure."],"mechanisms":["Cytotoxic T cells clear infected hepatocytes. The height of the aminotransferase reflects this injury, not residual function."],"clinical":["Prodrome of fever, malaise, anorexia and nausea, then dark urine and jaundice. Right-upper-quadrant discomfort is common. Pruritus suggests a cholestatic course."],"labs":["ALT and AST often above 1000 U/L in acute A, B or E, with ALT usually higher than AST. Bilirubin and INR decide severity.","IgM anti-HAV, HBsAg with IgM anti-HBc, HCV RNA, and IgM anti-HEV are the useful acute markers. HCV antibody may still be negative."],"investigations":["Full acute serology panel before labeling a case indeterminate. HSV hepatitis is suggested by marked aminotransferases, fever, and little bilirubin rise, often without skin lesions."],"imaging":["Ultrasound excludes obstruction. The parenchyma is nonspecific. Imaging does not grade viral injury."],"criteria":["Compatible illness plus a specific acute marker: IgM for A, E or core of B, or HCV RNA for acute C. Acute liver failure criteria apply if encephalopathy and coagulopathy appear."],"scores":["No virus-specific ICU score. Use King's College criteria if failure develops. MELD is not required for ordinary acute hepatitis."],"differential":["Drug injury, ischemic hepatitis, autoimmune hepatitis, biliary obstruction and alcoholic hepatitis. Alcohol usually has AST higher than ALT and a lower peak."],"management":["Supportive care for A and E. Acute hepatitis B in immunocompetent adults usually clears. Treat herpes simplex hepatitis urgently with aciclovir. Discuss antiviral therapy for severe acute hepatitis B with a hepatologist."],"drugs":["Aciclovir intravenous for suspected HSV hepatitis, without waiting for every confirmatory test if the picture fits.","Nucleos(t)ide analogues are considered for severe acute hepatitis B, especially if INR is rising. There is no routine antiviral for hepatitis A."],"nonPharm":["Avoid further hepatotoxins, including alcohol and unnecessary paracetamol. Notify public health for A and E as local law requires."],"icu":["Admit if INR is rising, confusion appears, the patient is pregnant with hepatitis E, or hypoglycemia develops. Manage as acute liver failure once those features are present, including airway protection if encephalopathy deepens."],"complications":["Acute liver failure, cholestatic prolongation, and, for B and C, chronic infection. Hepatitis D accelerates chronic B."],"prognosis":["Most immunocompetent adults with hepatitis A recover. Pregnant patients with hepatitis E have a much higher risk of failure. Acute HCV often becomes chronic."],"guidelines":["EASL hepatitis B and hepatitis E guidelines cover severe acute infection and pregnancy. Use the current society document for who should start a nucleos(t)ide analogue."],"pearls":["IgM anti-HBc diagnoses acute hepatitis B. HBsAg alone does not separate acute from chronic infection.","A negative HCV antibody does not exclude acute hepatitis C. Order RNA."]}},{"id":"dili","name":"Drug-induced liver injury","category":"acute","blocks":{"definition":["Drug-induced liver injury is a liver injury caused by a medicine, herb or toxin after exclusion of other common causes. It may be intrinsic and dose-dependent, or idiosyncratic."],"etiology":["Paracetamol is the prototype intrinsic toxin. Antibiotics, anti-tuberculous drugs, antiepileptics, immune-checkpoint inhibitors, androgens and many herbal products cause idiosyncratic injury."],"classification":["Hepatocellular if ALT is at least five times the upper limit and the R ratio is at least 5. Cholestatic if alkaline phosphatase is at least twice the upper limit and R is 2 or less. Mixed sits between.","R is ALT divided by its upper limit, over alkaline phosphatase divided by its upper limit."],"pathophysiology":["Intrinsic injury is direct biochemical toxicity. Idiosyncratic injury involves reactive metabolites and adaptive immunity in a susceptible host."],"mechanisms":["Failure of adaptation, HLA-linked immune responses, and mitochondrial toxicity explain why only some exposed patients become ill, and why rechallenge can be catastrophic."],"clinical":["Anything from asymptomatic enzyme rise to jaundice and failure. Immunoallergic cases add rash, fever and eosinophilia. Checkpoint-inhibitor injury can mimic autoimmune hepatitis."],"labs":["Record ALT, AST, alkaline phosphatase and bilirubin on the same sample so the R ratio is valid. Eosinophilia and autoantibodies are supportive, not specific."],"investigations":["Stop the suspect drug and exclude virus, obstruction, ischemia and alcohol. Liver biopsy is for atypical, prolonged or checkpoint-inhibitor cases."],"imaging":["Ultrasound or MRCP if the pattern is cholestatic, to avoid missing a stone or stricture and blaming the drug."],"criteria":["A compatible latency, a known signature, dechallenge, and exclusion of alternatives. The RUCAM score is an educational structured assessment, not a bedside law."],"scores":["Hy's law: hepatocellular injury with bilirubin more than twice the upper limit, without obstruction, predicts a serious risk of death or transplant in drug development cohorts."],"differential":["Viral hepatitis, autoimmune hepatitis, obstruction, sepsis-associated cholestasis and graft-versus-host patterns in the relevant host."],"management":["Stop the culprit. Do not rechallenge a serious idiosyncratic reaction. Paracetamol has a specific antidote. Most other agents do not."],"drugs":["N-acetylcysteine for paracetamol. Corticosteroids are used for immune-checkpoint hepatitis graded by oncology protocols, not for routine antibiotic injury.","Ursodeoxycholic acid is sometimes used for prolonged cholestasis. Evidence is limited. Say so."],"nonPharm":["Report serious events to the national pharmacovigilance scheme. Review every herbal and over-the-counter product with the family."],"icu":["Jaundice plus coagulopathy or encephalopathy is acute liver failure until proven otherwise. Refer early. Airway protection follows the encephalopathy grade."],"complications":["Vanishing bile duct syndrome after severe cholestatic injury, chronic DILI, and acute liver failure."],"prognosis":["Most hepatocellular idiosyncratic cases improve after withdrawal. Jaundice with hepatocellular injury is the danger pattern. Cholestasis can take months to resolve."],"guidelines":["EASL and AASLD drug-induced liver injury guidance: stop the drug, define the pattern with the R ratio, and use N-acetylcysteine only where it is indicated. Avoid invented causality certainty."],"pearls":["The newest drug is not always the cause. Latency for amoxicillin-clavulanate can begin after the course has finished.","Cholestatic injury still needs imaging."]}},{"id":"ischemic","name":"Ischemic hepatitis","category":"acute","blocks":{"definition":["Ischemic hepatitis, or hypoxic hepatitis, is diffuse hepatocyte necrosis from a fall in hepatic oxygen delivery. It is a laboratory and clinical syndrome, not a radiographic infarct."],"etiology":["Cardiac shock, profound hypotension, respiratory failure, and hepatic congestion from right-heart failure. Sepsis can contribute even when the recorded blood pressure drop was brief."],"classification":["There is no staging system. Severity is the peak aminotransferase, the accompanying lactate and INR, and the reversibility of the shock state."],"pathophysiology":["The liver normally extracts a large fraction of its oxygen. Portal venous blood is already partly desaturated. Arterial hypotension or hepatic venous congestion tips the centrilobular zone into necrosis."],"mechanisms":["Zone 3, around the central vein, is the most hypoxic. That is why ischemic injury and paracetamol injury look similar histologically."],"clinical":["The patient is usually already in an ICU with shock, arrhythmia or hypoxia. Tender hepatomegaly suggests congestion. There is often no abdominal complaint at all."],"labs":["AST and ALT rise abruptly into the thousands and fall by about half each day once perfusion is restored. LDH is very high. INR may rise transiently.","A slow fall, or a second rise, means ongoing shock or another diagnosis."],"investigations":["Look at the circulation first: ECG, echocardiography, volume and vasopressor state. Viral serology if the history is not an obvious shock event."],"imaging":["Ultrasound may show a dilated inferior vena cava and hepatic veins if congestion is the driver. The parenchyma itself is nonspecific."],"criteria":["A compatible clinical setting, a sudden massive aminotransferase rise, a rapid fall after reperfusion, and exclusion of toxin and obstruction."],"scores":["No specific score. Prognosis follows the cardiac or septic illness more than the height of the ALT."],"differential":["Paracetamol, other toxins, viral hepatitis and hepatic artery occlusion after transplant or intervention. Toxin injury does not halve every day as reliably."],"management":["Restore oxygen delivery. Treat the heart, the rhythm, the bleed or the sepsis. The liver itself has no antidote."],"drugs":["No hepatoprotective drug is indicated. Avoid adding further injury with unnecessary high-dose paracetamol while glutathione and perfusion are stressed."],"nonPharm":["Correct hypoxia, low output and severe congestion. Repeated enzyme checks over 48 hours confirm the expected rapid decline."],"icu":["This is already an ICU disease. Norepinephrine or inotrope choice follows the shock type. Watch glucose, INR and kidney function for 48 hours."],"complications":["Transient liver failure, hypoglycemia, and ischemic cholangiopathy if the hepatic artery, not just perfusion pressure, was lost."],"prognosis":["The enzymes recover if the patient recovers. Mortality is the mortality of the underlying shock, which is high."],"guidelines":["There is no standalone society guideline that changes ICU shock care. Recognize the pattern so that a unnecessary transplant assessment is not started for a liver that will recover with perfusion."],"pearls":["An ALT of 5000 that is 2200 the next day, in a patient who was hypotensive, is ischemic hepatitis until proven otherwise.","The bilirubin is often only mildly raised, unlike subacute liver failure."]}},{"id":"toxic","name":"Toxic liver injury","category":"acute","blocks":{"definition":["Toxic liver injury is dose-related damage from a poison such as paracetamol, Amanita phalloides, industrial solvents or concentrated herbal alkaloids."],"etiology":["Single large paracetamol ingestion, repeated supratherapeutic dosing, carbon tetrachloride, yellow phosphorus, and amatoxin mushrooms. Alcohol and fasting increase paracetamol risk."],"classification":["Use the same hepatocellular, cholestatic and mixed patterns as other drug injury, then name the toxin. Paracetamol has its own treatment nomogram for a single time-known ingestion."],"pathophysiology":["Amatoxin inhibits RNA polymerase II and kills hepatocytes and also gut and kidney cells. Paracetamol kills through NAPQI after glutathione stores fall."],"mechanisms":["Centrilobular necrosis is the shared histologic end point of many direct toxins because CYP enzymes are concentrated there."],"clinical":["A latent period is typical. Mushroom poisoning causes early gastroenteritis, a false recovery, then jaundice and failure on day two to three."],"labs":["Paracetamol concentration plotted on the treatment nomogram if the time of a single ingestion is known. Staggered overdoses cannot be cleared by a nomogram.","Rising INR, creatinine and lactate mark amatoxin and severe paracetamol injury."],"investigations":["Save serum and urine if a forensic or rare toxin is possible. Involve a poisons center. Do not delay N-acetylcysteine for a paracetamol level if the history is a large ingestion."],"imaging":["Imaging is to exclude other disease. It does not stage toxic necrosis."],"criteria":["Exposure history plus a compatible enzyme pattern, or a toxic concentration. Acute liver failure criteria apply when encephalopathy and coagulopathy develop."],"scores":["King's College paracetamol criteria: arterial pH below 7.30 after resuscitation, or all three of encephalopathy grade III or IV, INR above 6.5, and creatinine above 3.4 mg/dL."],"differential":["Ischemic hepatitis, viral hepatitis and idiosyncratic drug injury. The history of a specific exposure is the separator."],"management":["N-acetylcysteine for paracetamol, including staggered and established failure presentations. For amatoxin, early referral and supportive care. Silibinin is used in some centers. Evidence is not a randomized standard. Do not present it as proven."],"drugs":["Activated charcoal if presentation is early and the airway is safe. N-acetylcysteine as in acute liver failure. Do not use the oral nomogram to withhold treatment in a sick staggered overdose."],"nonPharm":["Transplant assessment runs in parallel with antidote treatment. Psychiatric review after survival of intentional poisoning."],"icu":["Same organ support as acute liver failure. Intubate for advanced encephalopathy. Start renal replacement for standard indications and discuss it early when ammonia and acidosis are severe."],"complications":["Acute liver failure, kidney injury from the toxin itself, and cerebral edema."],"prognosis":["Early N-acetylcysteine makes serious paracetamol injury uncommon. Established acidosis and deep coma mark a high risk of death without transplant."],"guidelines":["Prescott regimen and regional poison-center nomograms remain the operational standard for paracetamol. EASL acute liver failure guidance, 2017, supports N-acetylcysteine and King's College assessment."],"pearls":["If the time of ingestion is unknown, treat. Do not wait for a pretty point on the nomogram.","Amatoxin gastroenteritis that seems to settle is the dangerous calm before liver failure."]}},{"id":"wilson","name":"Wilson disease","category":"acute","blocks":{"definition":["Wilson disease is autosomal recessive copper accumulation from ATP7B mutations. It may present as chronic liver disease, neurological disease, or acute liver failure with hemolysis."],"etiology":["Biallelic ATP7B variants impair biliary copper excretion. Family history is often absent. Onset is usually in childhood or young adulthood but is not limited to those ages."],"classification":["Hepatic, neurological, psychiatric, or acute liver failure with Coombs-negative hemolysis. Acute failure in Wilson disease is effectively acute-on-chronic, because cirrhosis is usually already present."],"pathophysiology":["Copper leaks from necrotic hepatocytes, injures red cells, and further damages remaining liver and renal tubules."],"mechanisms":["ATP7B normally loads copper onto ceruloplasmin and exports excess copper into bile. Failure of both steps stores copper in the liver and then the basal ganglia and cornea."],"clinical":["Acute failure, hemolysis, a relatively modest aminotransferase rise, and renal injury in a young patient. Kayser-Fleischer rings may be absent in purely hepatic disease. Look for them anyway."],"labs":["Alkaline phosphatase is often very low. An alkaline phosphatase to total bilirubin ratio below 4, and an AST to ALT ratio above 2.2, are published clues in acute Wilsonian failure.","Ceruloplasmin can be low, but it is an acute-phase protein and can mislead. Hemoglobin falls from hemolysis. Creatinine rises."],"investigations":["24-hour urinary copper, slit-lamp examination, and, if the patient can wait, hepatic copper quantification. In crashing failure these tests must not delay transplant referral."],"imaging":["A cirrhotic contour on ultrasound supports the acute-on-chronic nature. Brain MRI is for neurological disease, not for the ICU liver presentation."],"criteria":["Leipzig score combines rings, neurology, ceruloplasmin, hemolysis, liver copper, urinary copper and ATP7B genetics. A score of 4 or more is highly likely."],"scores":["Modified Nazer or prognostic indices are used by specialist units to identify acute Wilsonian failure that will not recover without transplant. King's College non-paracetamol criteria also apply."],"differential":["Other acute liver failure, autoimmune hepatitis, and viral hepatitis with hemolysis from another cause."],"management":["Acute liver failure due to Wilson disease is a transplant emergency. Chelation does not rescue established failure with hemolysis in time."],"drugs":["Trientine or D-penicillamine, with zinc, are for diagnosed stable disease under a specialist. Do not start penicillamine in a crashing ICU patient and call that definitive therapy."],"nonPharm":["Urgent transplant listing. Screen siblings after the index case survives. Avoid holding transplant referral for a genetic result."],"icu":["Support hemolysis, kidney injury and encephalopathy. Plasmapheresis or renal replacement can lower copper as a bridge in specialist centers. This is a bridge, not a cure. Airway protection if coma deepens."],"complications":["Fanconi-type renal tubular injury, intractable hemolysis, and death from liver failure if transplant is delayed."],"prognosis":["Transplant survival for acute Wilsonian failure is good if the patient reaches theatre. Without transplant, mortality of the acute hemolytic presentation is very high."],"guidelines":["AASLD and EASL Wilson disease guidance: Leipzig score for diagnosis, chelation for chronic disease, and transplant for acute liver failure."],"pearls":["Young patient, hemolysis, low alkaline phosphatase, high bilirubin: say Wilson disease out loud and call the transplant center.","A normal ceruloplasmin does not exclude the diagnosis during acute inflammation."]}},{"id":"cld","name":"Chronic liver disease","category":"chronic","blocks":{"definition":["Chronic liver disease is ongoing liver injury for more than six months. It includes inflammation and fibrosis before cirrhosis, and cirrhosis itself."],"etiology":["Viral hepatitis B and C, MASLD, alcohol, autoimmune hepatitis, cholestatic disease, Wilson disease, hemochromatosis and alpha-1 antitrypsin deficiency. More than one cause can coexist."],"classification":["Stage by fibrosis, not by a single enzyme value. Compensated disease has no variceal bleed, ascites, encephalopathy or jaundice from failure. Decompensation is the arrival of those events."],"pathophysiology":["Repeated hepatocyte injury activates stellate cells. Collagen replaces sinusoids, resistance rises, and the architecture slowly remodels."],"mechanisms":["TGF-beta and platelet-derived signals drive stellate-cell activation. Extinguishing the cause can allow fibrosis to regress before it is fixed as cirrhosis."],"clinical":["Fatigue, spider nevi, palmar erythema, firm liver, or no signs at all. Decompensation is a change in the patient's story, not a blood-test curiosity."],"labs":["Platelets fall as portal hypertension and splenic sequestration develop. AST, ALT, albumin and INR can be nearly normal in compensated cirrhosis."],"investigations":["Find the cause with a structured panel once, not a random test each admission. Noninvasive fibrosis tests, then elastography, then selective biopsy."],"imaging":["Nodular surface, coarse echo, splenomegaly and collaterals suggest cirrhosis. A normal ultrasound does not exclude clinically significant fibrosis."],"criteria":["Duration beyond six months plus evidence of inflammation or fibrosis. Cirrhosis is a histological or a confident clinical-imaging diagnosis, not an enzyme threshold."],"scores":["FIB-4 for first-line risk stratification in primary care pathways. Child-Pugh and MELD once cirrhosis is established. They answer different questions."],"differential":["Infiltrative disease, right-heart congestion, and extrahepatic portal hypertension with a normal liver."],"management":["Remove the cause: alcohol cessation, antiviral therapy, weight and metabolic treatment, immunosuppression for autoimmune disease, venesection for hemochromatosis."],"drugs":["Cause-specific. There is no universal antifibrotic tablet to add in the ICU. Continue indicated antivirals and do not stop beta blockers casually in a patient with known varices."],"nonPharm":["Vaccinate against hepatitis A and B if nonimmune. Surveillance for varices and hepatocellular carcinoma follows the stage, not symptoms."],"icu":["The ICU admission is usually for a complication, not for chronic disease itself. Treat the precipitant and reassess whether the liver disease is compensated, decompensated or ACLF."],"complications":["Portal hypertension, hepatocellular carcinoma, and acute-on-chronic liver failure after infection, bleed, alcohol or drug injury."],"prognosis":["Compensated cirrhosis has a far better survival than the first decompensating event. Removing the cause changes the slope."],"guidelines":["EASL and AASLD disease-specific guidelines all start from the same principle: name the cause, stage the fibrosis, and prevent the first decompensation."],"pearls":["Normal enzymes do not mean a normal liver.","A first admission with ascites is a change in natural history. Say so to the patient."]}},{"id":"cirrhosis","name":"Cirrhosis, compensated and decompensated","category":"chronic","blocks":{"definition":["Cirrhosis is diffuse fibrosis with regenerative nodules and distorted architecture. Compensated cirrhosis has no ascites, variceal bleed, encephalopathy or jaundice of failure. Decompensation is their appearance."],"etiology":["Any chronic liver disease left in progress. Alcohol and metabolic disease often coexist with hepatitis C or B."],"classification":["Compensated with or without clinically significant portal hypertension, then decompensated, then further decompensation such as refractory ascites, recurrent encephalopathy or hepatorenal syndrome.","Child-Pugh A is usually compensated. B and C are decompensated grades, not precise bedside diagnoses on their own."],"pathophysiology":["Fibrous bands and nodules raise intrahepatic resistance. Nitric oxide in the splanchnic bed dilates vessels. Effective arterial blood volume falls. The kidney retains sodium."],"mechanisms":["Stellate-cell collagen, sinusoidal capillarization, and bacterial translocation maintain inflammation even after the original virus is cured, until the architecture recovers."],"clinical":["Compensated: spider nevi, a firm liver, thrombocytopenia. Decompensated: ascites, confusion, hematemesis or jaundice. Ask which complication came first and when."],"labs":["Low platelets, low albumin, raised INR, raised bilirubin. Sodium falls as water retention worsens and is part of MELD-Na."],"investigations":["Confirm chronicity and cause. Diagnostic paracentesis for every new or hospitalized ascites. Endoscopy if not recently assessed and bleeding is a concern."],"imaging":["Nodular surface, enlarged caudate, splenomegaly, and portosystemic collaterals. Transient elastography is for staging outside acute illness. Numbers during hepatitis or congestion are falsely high."],"criteria":["Histology is the reference. In practice, a nodular liver with portal hypertension on examination and imaging is accepted. Do not demand a biopsy before treating ascites."],"scores":["Child-Pugh for clinic communication. MELD-Na for transplant priority. CLIF-C ACLF if organ failures are present. They are not interchangeable."],"differential":["Budd-Chiari syndrome, constrictive pericarditis, and malignant infiltration can mimic decompensated cirrhosis."],"management":["Treat the active complication. Then prevent the next one: salt restriction and diuretics, lactulose after encephalopathy, nonselective beta blocker when indicated, and transplant referral once decompensated."],"drugs":["Spironolactone with or without furosemide for ascites. Lactulose for encephalopathy. Nonselective beta blocker, often carvedilol where guidelines endorse it, for clinically significant portal hypertension. Stop the beta blocker in refractory hypotension or acute kidney injury and reassess."],"nonPharm":["Alcohol cessation is disease-modifying. Nutrition with a bedtime snack. Do not restrict protein. HCC surveillance every six months in cirrhosis."],"icu":["Identify ACLF. Infection, bleed and drugs are the usual precipitants. Avoid large chloride loads and nephrotoxins. Early transplant discussion if organ failures are accumulating."],"complications":["Variceal bleed, ascites, spontaneous bacterial peritonitis, hepatic encephalopathy, hepatorenal syndrome, hepatopulmonary syndrome and hepatocellular carcinoma."],"prognosis":["Median survival falls sharply with the first decompensation and again with further decompensation. Organ failure on that background is ACLF and has a short window."],"guidelines":["EASL clinical practice guidelines on decompensated cirrhosis, 2018, and Baveno VII, 2022, on portal hypertension. AASLD guidance on ascites and varices agrees on the major bedside steps."],"pearls":["Every new ascites in hospital gets a diagnostic tap before antibiotics if it can be done immediately, and with antibiotics if the tap is delayed and infection is likely.","A cured virus does not retire the HCC surveillance program if cirrhosis remains."]}},{"id":"masld","name":"MASLD","category":"chronic","blocks":{"definition":["Metabolic dysfunction-associated steatotic liver disease is hepatic steatosis plus a cardiometabolic risk factor, in the absence of a dominant other cause. Steatohepatitis is the inflammatory form. The old name NAFLD maps to this spectrum."],"etiology":["Obesity, type 2 diabetes, hypertension, atherogenic dyslipidemia and insulin resistance. Lean patients with metabolic risk are included. Alcohol limits in the nomenclature matter. Do not relabel alcoholic disease as MASLD."],"classification":["Steatosis, steatohepatitis, fibrosis stage, and cirrhosis. Fibrosis stage, not the ALT, predicts liver outcomes."],"pathophysiology":["Free fatty acids, de novo lipogenesis and impaired VLDL export fill the hepatocyte. Lipotoxic species injure mitochondria, recruit inflammation and activate stellate cells."],"mechanisms":["Insulin resistance increases adipose lipolysis. Fructose and surplus carbohydrate feed hepatic lipogenesis. Gut barrier dysfunction adds inflammatory signals."],"clinical":["Usually silent. Hepatomegaly, fatigue, or a finding on imaging done for another reason. Decompensation looks like any other cirrhosis."],"labs":["ALT is often below twice the upper limit even with advanced fibrosis. Platelets and the AST to ALT ratio become more informative as fibrosis advances."],"investigations":["FIB-4 first in most pathways. If indeterminate or high, elastography. Exclude hepatitis B and C, and do not forget alcohol history."],"imaging":["Ultrasound can show a bright liver but misses moderate fat and cannot stage fibrosis. Elastography and, where used, MRI proton-density fat fraction answer different questions."],"criteria":["Imaging or biopsy evidence of steatosis, one or more cardiometabolic criteria, and no other dominant liver disease. Biopsy remains the way to prove steatohepatitis."],"scores":["FIB-4 below 1.30 suggests a low risk of advanced fibrosis in adults under 65. At or above 2.67 suggests a high risk. Age changes the lower threshold in some pathways."],"differential":["Alcohol-associated liver disease, drug steatosis, hepatitis C, and Wilson disease in the young."],"management":["Weight loss of about 7 to 10 percent improves steatohepatitis. Treat diabetes, blood pressure and lipids for their own sake. Resmetirom is a liver-directed option in selected noncirrhotic disease where it is approved. Do not generalize it to decompensated cirrhosis."],"drugs":["GLP-1 receptor agonists and other diabetes drugs may be appropriate for the metabolic disease. Pioglitazone has biopsy evidence in selected steatohepatitis. Vitamin E has evidence in nondiabetic adults. Match the drug to the license and the patient."],"nonPharm":["Mediterranean-style eating pattern, resistance and aerobic activity, and no crash starvation, which can worsen inflammation."],"icu":["MASLD cirrhosis is managed as cirrhosis. These patients also carry coronary and diabetic risk during critical illness. Screen glucose and watch fluid."],"complications":["Cirrhosis, hepatocellular carcinoma even before cirrhosis in some metabolic patients, and cardiovascular death, which remains a leading outcome."],"prognosis":["Simple steatosis has a low liver-event rate. F3 and F4 drive liver outcomes. Cardiovascular risk runs in parallel."],"guidelines":["AASLD practice guidance on MASLD, 2023, supports noninvasive fibrosis pathways and reserves biopsy for uncertainty. Confirm local drug approvals before quoting a specific agent as standard."],"pearls":["A normal ALT does not clear advanced fibrosis.","Ask about alcohol in grams, not in adjectives."]}},{"id":"ald","name":"Alcohol-associated liver disease","category":"chronic","blocks":{"definition":["Alcohol-associated liver disease spans steatosis, steatohepatitis, fibrosis, cirrhosis and alcoholic hepatitis. Alcoholic hepatitis is a clinical syndrome of recent heavy drinking, jaundice and a systemic inflammatory illness."],"etiology":["Sustained heavy alcohol use. Women are susceptible at lower doses. Obesity, hepatitis C and genetic factors worsen injury. A threshold is not a guarantee of safety."],"classification":["Steatosis, fibrosis stage, cirrhosis, and alcoholic hepatitis stratified by Maddrey discriminant function, MELD and Lille response."],"pathophysiology":["Ethanol and acetaldehyde injure mitochondria, induce CYP2E1 oxidative stress, and increase gut permeability. Portal endotoxin amplifies neutrophilic hepatitis."],"mechanisms":["Impaired proteasome function balloons hepatocytes and leaves Mallory-Denk bodies. Stellate cells activate in parallel, so fibrosis and hepatitis coexist."],"clinical":["Tender hepatomegaly, fever, anorexia and jaundice after heavy drinking. Cirrhosis may already be present. Gastrointestinal bleeding and infection are frequent companions."],"labs":["AST greater than ALT, both usually under 400 U/L, high GGT, high bilirubin, leukocytosis that can look like sepsis, and a prolonged INR.","A truly thousand-range ALT suggests an added toxin or ischemia."],"investigations":["Infection screen including diagnostic paracentesis. Maddrey discriminant function using a control prothrombin time. Biopsy if the diagnosis is uncertain and it will change steroids."],"imaging":["Ultrasound to exclude obstruction and look for cirrhosis and ascites. It cannot prove alcoholic hepatitis."],"criteria":["Recent heavy alcohol, bilirubin typically above 3 mg/dL, AST to ALT ratio above 1.5, and exclusion of other jaundice. NIAAA clinical criteria are used in research and are a fair bedside frame."],"scores":["Maddrey discriminant function of 32 or more marks severe alcoholic hepatitis in the trials. Lille score at day 7 assesses steroid response. MELD also tracks mortality."],"differential":["Drug injury, ischemic hepatitis, viral hepatitis and obstructive jaundice. Sepsis can mimic the white-cell count."],"management":["Stop alcohol. Feed the patient. Treat infection before steroids. Prednisolone is considered for severe disease without uncontrolled infection or bleed, then stopped if the Lille score shows no response."],"drugs":["Prednisolone 40 mg daily in the regimens used by the STOPAH trial, for 28 days in responders. N-acetylcysteine added to steroids improved short-term outcome in one trial. Pentoxifylline does not improve survival."],"nonPharm":["Thiamine before glucose. Enteral nutrition aiming at adequate protein and calories. Alcohol relapse prevention once the patient can engage. This changes long-term survival more than a month of steroid."],"icu":["Airway protection if encephalopathy is deep, especially before endoscopy. Early antibiotics for infection. Steroids are harmful in untreated septic shock. Renal failure in severe alcoholic hepatitis has a grim prognosis."],"complications":["Infection, kidney injury, variceal bleeding and encephalopathy. Steroids raise infection risk further."],"prognosis":["Severe alcoholic hepatitis carries high 28-day and 90-day mortality. Nonresponse on the Lille score should stop steroids. Abstinence is the dominant long-term modifier."],"guidelines":["AASLD alcoholic hepatitis guidance and EASL alcohol-related liver disease guidance: nutrition, treat infection, consider prednisolone for severe disease, use Lille to stop futile steroids. STOPAH showed only a possible short-term mortality benefit."],"pearls":["AST 900 is not typical alcoholic hepatitis. Look for paracetamol or shock.","Do not start prednisolone on an untapped ascites."]}},{"id":"aih","name":"Autoimmune hepatitis","category":"chronic","blocks":{"definition":["Autoimmune hepatitis is a chronic immune-mediated hepatitis with interface hepatitis, hypergammaglobulinemia and autoantibodies. It can present acutely, even as liver failure."],"etiology":["Loss of immune tolerance in a genetically susceptible person. Drugs, including nitrofurantoin, minocycline and checkpoint inhibitors, can induce a similar picture."],"classification":["Type 1 has ANA and or smooth-muscle antibody. Type 2, more often in children, has anti-LKM or anti-LC1. The simplified IAIHG score supports the diagnosis."],"pathophysiology":["T-cell attack on hepatocytes produces interface hepatitis and piecemeal necrosis. Untreated inflammation progresses to cirrhosis."],"mechanisms":["HLA associations and regulatory T-cell defects are described. Autoantibodies mark the disease. They are not themselves the main killers of hepatocytes."],"clinical":["Fatigue, amenorrhea, arthralgia, jaundice, or an acute hepatitis picture. Other autoimmune diseases may be present. Some patients are asymptomatic with only an enzyme rise."],"labs":["High ALT, high IgG, ANA, smooth-muscle antibody, anti-LKM, and sometimes anti-SLA, which is more specific. INR and bilirubin decide whether this admission is failure rather than chronic hepatitis."],"investigations":["Exclude virus before blaming immunity. Biopsy is important when it can be done safely. It also separates drug-induced autoimmune-like injury."],"imaging":["Used to exclude obstruction and to look for cirrhosis. There is no diagnostic imaging sign of autoimmune hepatitis."],"criteria":["Simplified score: autoantibodies, IgG, compatible histology, and exclusion of viral hepatitis. A score of 7 or more is definite in that system. Acute failure may not wait for a full score."],"scores":["Use MELD and King's College criteria if acute failure is present. The diagnostic score is not a severity score."],"differential":["Viral hepatitis, drug injury, Wilson disease in the young, and overlap with primary biliary cholangitis or primary sclerosing cholangitis."],"management":["Prednisolone or budesonide in selected noncirrhotic patients, then azathioprine for maintenance. Treat acute severe presentations in hospital. Transplant if failure criteria are met despite therapy."],"drugs":["Prednisolone typically 40 to 60 mg daily at induction, or a local protocol. Azathioprine after a response, often 1 to 1.5 mg/kg, once thiopurine methyltransferase status is considered. Budesonide is not for cirrhosis."],"nonPharm":["Bone protection on steroids, vaccination, and long-term follow-up. Do not stop immunosuppression because enzymes normalized for a month."],"icu":["Acute severe autoimmune hepatitis with INR rise belongs in a transplant center. Steroids may be started, but deterioration over days should not delay listing. Infection surveillance is mandatory."],"complications":["Cirrhosis, relapse on withdrawal, steroid adverse effects, and acute liver failure at first presentation."],"prognosis":["Most patients respond and do well if treated before cirrhosis. Missed relapse and late presentation drive transplant and death."],"guidelines":["AASLD autoimmune hepatitis guidance, 2019, and EASL autoimmune hepatitis guidelines: biopsy where safe, steroid induction, azathioprine maintenance, and transplant assessment for severe nonresponse."],"pearls":["Normal IgG does not exclude autoimmune hepatitis in an acute presentation.","Checkpoint-inhibitor hepatitis is a related but protocol-driven disease. Do not casually apply chronic autoimmune hepatitis doses."]}},{"id":"pbc","name":"Primary biliary cholangitis","category":"chronic","blocks":{"definition":["Primary biliary cholangitis is a chronic cholestatic destruction of interlobular bile ducts, strongly associated with antimitochondrial antibody."],"etiology":["Autoimmune injury on a genetic background. It is much more common in women. Urinary tract infection and smoking are associated. Association is not causation for the bedside."],"classification":["By stage of fibrosis and by biochemical response to ursodeoxycholic acid. Fatigue and pruritus do not track histology neatly."],"pathophysiology":["Immune destruction of small ducts causes chronic cholestasis, copper and bile-acid retention, and eventually biliary cirrhosis."],"mechanisms":["Pyruvate dehydrogenase antibodies mark loss of tolerance. T cells damage biliary epithelium. Retained hydrophobic bile acids then injure hepatocytes."],"clinical":["Fatigue and pruritus years before jaundice. Xanthelasma, Sicca symptoms, and a high alkaline phosphatase found incidentally."],"labs":["Alkaline phosphatase and GGT rise first. AMA is positive in most patients. IgM may be high. A high bilirubin is a late and serious sign."],"investigations":["AMA, liver biochemistry, and ultrasound. Biopsy if AMA is negative and the diagnosis remains likely, or if overlap is suspected."],"imaging":["Bile ducts are not dilated. That absence matters. MRCP is used when primary sclerosing cholangitis is the alternative."],"criteria":["Unexplained cholestasis plus AMA, or compatible histology if AMA is negative. Do not call every AMA-negative cholestasis primary biliary cholangitis."],"scores":["UK-PBC and GLOBE scores estimate transplant-free survival after treatment. They are clinic tools. MELD applies once decompensated."],"differential":["Drug cholestasis, obstruction, primary sclerosing cholangitis and sarcoidosis."],"management":["Ursodeoxycholic acid for all patients with the diagnosis, unless a rare intolerance occurs. Second-line therapy if alkaline phosphatase and bilirubin do not respond. Transplant for decompensation or intractable pruritus in specialist practice."],"drugs":["Ursodeoxycholic acid 13 to 15 mg/kg/day. Obeticholic acid is contraindicated in decompensated cirrhosis and has a boxed warning for hepatic decompensation. Fibrates are used off-label in some regions. Follow the current label."],"nonPharm":["Treat pruritus with the accepted sequence, skin care and, when needed, specialist therapies. Fat-soluble vitamin replacement if deficient. Fracture prevention."],"icu":["Decompensated primary biliary cholangitis is managed as decompensated cirrhosis. Do not start or continue obeticholic acid in this setting."],"complications":["Cirrhosis, portal hypertension, osteoporosis, fat-soluble vitamin deficiency, and a small increase in hepatocellular carcinoma risk once cirrhotic."],"prognosis":["Biochemical responders to ursodeoxycholic acid have a survival close to the general population. Nonresponders and jaundiced patients do not."],"guidelines":["EASL primary biliary cholangitis guidelines, 2017, and later AASLD guidance: ursodeoxycholic acid first, assess response at about 12 months, and avoid obeticholic acid in advanced decompensation."],"pearls":["A high alkaline phosphatase with a normal ultrasound and a positive AMA is the diagnosis. Do not order repeated MRCPs for reassurance.","Jaundice in this disease is late. Treat it as a change in prognosis."]}},{"id":"psc","name":"Primary sclerosing cholangitis","category":"chronic","blocks":{"definition":["Primary sclerosing cholangitis is chronic inflammation and multifocal stricturing of intrahepatic and or extrahepatic bile ducts, without another identified cause."],"etiology":["Strongly associated with inflammatory bowel disease, especially ulcerative colitis. The bowel disease can be silent. IgG4-related disease must be separated because it is treatable with steroids."],"classification":["Large-duct disease is seen on cholangiography. Small-duct disease has a normal cholangiogram and compatible histology, usually with inflammatory bowel disease."],"pathophysiology":["Concentric fibrosis around ducts, the onion-skin lesion, leads to strictures, chronic cholestasis and biliary cirrhosis."],"mechanisms":["Gut-lymphocyte homing and bile-acid toxicity are proposed. No single drug has been shown to change the natural history."],"clinical":["Fatigue, pruritus, jaundice, cholangitis, or an asymptomatic enzyme rise in a patient with colitis. Right-upper-quadrant pain and fever mean possible bacterial cholangitis behind a stricture."],"labs":["Cholestatic enzymes. p-ANCA is nonspecific. IgG4 should be measured once so that a steroid-responsive disease is not missed."],"investigations":["MRCP is the diagnostic test. ERCP is for sampling or treating a dominant stricture, not for diagnosis alone. Colonoscopy even if bowel symptoms are absent."],"imaging":["Beaded ducts, multifocal short strictures, and pruned peripheral ducts. A dominant stricture needs cytology or other sampling because cholangiocarcinoma can look the same."],"criteria":["Cholestasis plus characteristic cholangiography, after exclusion of secondary sclerosing cholangitis, stones as the sole cause, and IgG4 disease."],"scores":["Several prognostic models exist, including the Amsterdam and Mayo clinic models. MELD is used once transplant is being considered. None replaces the cancer question."],"differential":["Secondary sclerosing cholangitis after stones, ischemia or recurrent pancreatitis, IgG4 disease, cholangiocarcinoma, and AIDS cholangiopathy in the relevant host."],"management":["No proven disease-modifying drug. Treat dominant strictures endoscopically. Treat cholangitis with antibiotics and drainage. Refer for transplant for decompensation, recurrent cholangitis or limited perihilar cancer protocols."],"drugs":["Ursodeoxycholic acid at high dose worsened outcomes in a trial and is not recommended as disease modification. Antibiotics for bacterial cholangitis. Do not promise steroids unless IgG4 disease is the actual diagnosis."],"nonPharm":["Colonoscopic surveillance of colitis, which carries a high dysplasia risk. Gallbladder polyps in this disease are treated cautiously because of malignancy risk."],"icu":["Cholangitis with sepsis is the usual ICU entry. Resuscitate, culture blood, cover Gram-negative organisms, and obtain biliary decompression if obstruction persists."],"complications":["Recurrent cholangitis, cirrhosis, cholangiocarcinoma, gallbladder cancer, and colorectal neoplasia if colitis is present."],"prognosis":["Median transplant-free survival is measured in years to a couple of decades from diagnosis, shorter once jaundice or decompensation appears. Cancer, not only liver failure, causes death."],"guidelines":["AASLD and EASL primary sclerosing cholangitis guidance: MRCP to diagnose, ERCP for dominant strictures, no high-dose ursodeoxycholic acid, and surveillance for cholangiocarcinoma and colitis-associated cancer."],"pearls":["A new dominant stricture is cancer until sampling says otherwise.","Check IgG4 once. It changes treatment."]}},{"id":"phtn","name":"Portal hypertension","category":"portal","blocks":{"definition":["A pathological rise in the pressure gradient between the portal vein and the inferior vena cava. Clinically significant portal hypertension begins at a hepatic venous pressure gradient of 10 mmHg."],"etiology":["Cirrhosis is the usual cause. Prehepatic causes include portal vein thrombosis. Posthepatic causes include Budd-Chiari syndrome and right-heart disease."],"classification":["Prehepatic, intrahepatic (presinusoidal, sinusoidal, postsinusoidal) and posthepatic. The gradient is high in sinusoidal and postsinusoidal disease and low in pure prehepatic disease."],"pathophysiology":["Fixed architectural resistance plus a dynamic, reversible component from intrahepatic endothelial dysfunction. Splanchnic vasodilatation increases portal inflow."],"mechanisms":["Low intrahepatic nitric oxide and high splanchnic nitric oxide. That mismatch is why a nonselective beta blocker and a splanchnic vasoconstrictor can both be rational."],"clinical":["Varices, ascites, splenomegaly and encephalopathy. None of these appears until the gradient is substantially raised."],"labs":["Platelets fall. There is no blood test that measures the gradient. Liver tests reflect the cause, not the pressure."],"investigations":["Elastography, platelet count and endoscopy are the noninvasive path in compensated disease. Hepatic venous pressure gradient is the reference measurement, used when it will change management."],"imaging":["Patent portal vein with collaterals, splenomegaly, and a slowed or reversed portal flow on Doppler once hypertension is advanced."],"criteria":["A gradient of 10 mmHg or more is clinically significant. Varices, ascites or a reliable noninvasive combination can stand in when the gradient is not measured."],"scores":["Child-Pugh and MELD describe liver function, not portal pressure. Baveno criteria use elastography and platelets to spare some endoscopies."],"differential":["Splenic enlargement from hematological disease, and varices from isolated splenic vein thrombosis, which are gastric rather than esophageal."],"management":["Treat the cause. Use a nonselective beta blocker when guidelines support it for clinically significant portal hypertension. Prevent the first bleed and the first ascites."],"drugs":["Carvedilol is preferred in several Baveno VII pathways for compensated advanced chronic liver disease. Propranolol and nadolol remain alternatives. Stop the drug in shock or progressive kidney injury."],"nonPharm":["Alcohol cessation, salt restriction once ascites exists, and endoscopic surveillance according to Baveno, not a fixed annual habit for everyone."],"icu":["Portal hypertension itself is not an ICU diagnosis. The bleed, the sepsis and the kidney injury are. Restart or withhold the beta blocker deliberately. Do not leave it ambiguous."],"complications":["Variceal hemorrhage, ascites, spontaneous bacterial peritonitis, hepatorenal syndrome and hepatic encephalopathy."],"prognosis":["A gradient of 10 mmHg marks the risk of decompensation. A gradient of 12 mmHg or more is the range in which varices bleed."],"guidelines":["Baveno VII consensus, 2022: hepatic venous pressure gradient definitions, carvedilol in selected compensated disease, and noninvasive rules to avoid unnecessary endoscopy."],"pearls":["A normal portal-vein diameter does not exclude portal hypertension.","Isolated gastric varices from splenic-vein thrombosis are a different disease. Look at the pancreas."]}},{"id":"evarices","name":"Esophageal varices","category":"portal","blocks":{"definition":["Dilated portosystemic collaterals in the esophageal submucosa, fed by the left gastric vein, in portal hypertension."],"etiology":["Almost always cirrhosis or another cause of portal hypertension. Size and red signs track bleeding risk."],"classification":["Small and large on endoscopy. Red wale marks, cherry-red spots and a Child-Pugh C liver increase bleed risk."],"pathophysiology":["When the gradient exceeds about 12 mmHg, varices enlarge. Wall tension, described by a modified Laplace relation, decides which varix ruptures."],"mechanisms":["Thin wall, large radius and high pressure. That is why size and red signs matter more than the mere presence of a small varix."],"clinical":["Silent until they bleed. A screening endoscopy, not symptoms, finds them."],"labs":["No laboratory test sees a varix. Platelets and stiffness only estimate whether endoscopy is needed."],"investigations":["Upper endoscopy is the diagnostic test. Capsule endoscopy is not the standard for screening or banding decisions."],"imaging":["CT or ultrasound may show paraesophageal collaterals. They cannot grade the mucosal varix or the red signs."],"criteria":["Endoscopic visualization. Baveno VII allows some patients with compensated disease, favorable platelets and liver stiffness to defer endoscopy."],"scores":["No score replaces the endoscopic grade. Child-Pugh class modifies the bleeding risk of a given varix."],"differential":["Esophageal folds, reflux esophagitis, and downhill varices from superior vena cava obstruction, which are proximal rather than distal."],"management":["Small varices without red signs may be observed or treated depending on liver function. Large varices or red signs need a nonselective beta blocker or band ligation to prevent a first bleed."],"drugs":["Carvedilol, propranolol or nadolol, titrated to tolerance. There is no target heart rate that proves the gradient has fallen. Do not use a selective beta blocker and expect a portal-pressure effect."],"nonPharm":["Endoscopic band ligation if drugs are not tolerated or if the local pathway prefers ligation for large varices. Eradication needs repeat sessions."],"icu":["A known varix in a shocked patient is a bleed until endoscopy says otherwise. Protect the airway if hematemesis is massive or encephalopathy is deep. The intubation film in the management chapter shows that sequence."],"complications":["Hemorrhage, banding ulcers, and stricture after repeated ligation."],"prognosis":["A treated large varix bleeds less often. The liver function still dominates survival after a bleed."],"guidelines":["Baveno VII, 2022, and AASLD portal hypertension guidance: screen the right patients, and prevent the first bleed with a nonselective beta blocker or ligation."],"pearls":["Selective beta blockers do not do this job.","Downhill varices sit high in the esophagus. Look for a chest cause."]}},{"id":"gvarices","name":"Gastric varices","category":"portal","blocks":{"definition":["Gastric varices are dilated veins in the stomach wall from portal hypertension or from isolated splenic-vein thrombosis."],"etiology":["Cirrhosis with gastroesophageal varices, or sinistral portal hypertension from pancreatic disease occluding the splenic vein."],"classification":["Sarin classification: GOV1 extend from esophageal varices along the lesser curve. GOV2 extend toward the fundus. IGV1 are isolated fundal varices. IGV2 are elsewhere in the stomach."],"pathophysiology":["Fundal varices are often fed by a gastrorenal shunt. They bleed less often than esophageal varices but more severely when they do."],"mechanisms":["A large shunt decompresses the portal vein, so the measured gradient can be lower than expected even while the fundal varix is dangerous."],"clinical":["Hematemesis or melena, often without the repeated small bleeds of esophageal varices. Splenomegaly is marked in splenic-vein thrombosis."],"labs":["No specific blood test. A normal liver panel with isolated gastric varices should make you look at the splenic vein and the pancreas."],"investigations":["Endoscopy for the Sarin type. Contrast CT for the shunt, the splenic vein and a pancreatic mass or pancreatitis."],"imaging":["A gastrorenal shunt and fundal enhancement on portal-venous CT. Doppler may show splenic-vein occlusion."],"criteria":["Endoscopic type plus imaging of the feeding veins. Do not treat an isolated fundal varix exactly like an esophageal varix."],"scores":["No validated bleed-risk score replaces the endoscopic type and the clinical bleed."],"differential":["Gastric folds, portal hypertensive gastropathy, and a Dieulafoy lesion."],"management":["GOV1 can be banded as an extension of esophageal varices. Fundal varices need cyanoacrylate, coil and glue combinations, or TIPS with or without balloon-occluded retrograde obliteration, in experienced hands."],"drugs":["A vasoactive drug and an antibiotic are still indicated during acute bleeding. Nonselective beta blockers are used for portal hypertension but do not replace definitive therapy of a fundal varix that has bled."],"nonPharm":["Avoid blind banding of a large fundal varix. It can leave a catastrophic ulcer. Splenectomy cures varices caused only by splenic-vein thrombosis."],"icu":["Resuscitate to a restrictive hemoglobin target, protect the airway, and move to a center that can glue or decompress. Do not spend the night repeating ineffective bands."],"complications":["Exsanguination, glue embolism, and rebleeding."],"prognosis":["Worse per bleed than esophageal varices, better if the cause is an isolated splenic-vein thrombosis that can be removed."],"guidelines":["Baveno VII, 2022: cyanoacrylate for cardiofundal varices that bleed, and TIPS or BRTO according to anatomy and local expertise."],"pearls":["IGV1 plus a normal liver means pancreatic disease until CT says otherwise.","Do not band a fundal varix just because the band ligator is already open."]}},{"id":"vbleed","name":"Variceal hemorrhage","category":"portal","blocks":{"definition":["Bleeding from esophageal or gastric varices. It is a life-threatening expression of portal hypertension, not a peptic ulcer with a different label."],"etiology":["Portal hypertension with a varix whose wall tension exceeds its strength. Infection, alcohol and a high gradient are common companions."],"classification":["Esophageal versus gastric. Failure to control bleeding by five days, and early rebleeding, are the clinical failure points used in trials."],"pathophysiology":["Hypovolemia, bacterial translocation during the bleed, and a further rise in portal pressure from overtransfusion all worsen outcome."],"mechanisms":["Restrictive transfusion avoids the rebound in portal pressure seen with liberal blood. Antibiotics reduce early rebleeding and infection."],"clinical":["Hematemesis, melena, and hemodynamic instability in a patient with liver disease. Encephalopathy can worsen within hours from the protein load."],"labs":["Hemoglobin lags the bleed. INR is often already prolonged and should not be chased with plasma as a routine. Lactate and hemoglobin trend guide resuscitation."],"investigations":["Endoscopy within 12 hours after initial resuscitation. A diagnostic tap if ascites is present, because infection and bleed travel together."],"imaging":["CT if perforation or an alternative abdominal catastrophe is likely. It should not delay endoscopy in a typical upper-gastrointestinal bleed."],"criteria":["Bleeding varix seen on endoscopy, or varices plus blood in the stomach and no other source."],"scores":["Child-Pugh and MELD predict survival. They also select early TIPS candidates: Child-Pugh C below 14, or Child-Pugh B with active bleeding at endoscopy."],"differential":["Peptic ulcer, portal hypertensive gastropathy, gastric antral vascular ectasia, and a Mallory-Weiss tear."],"management":["Restrictive transfusion toward a hemoglobin of 7 to 8 g/dL, a vasoactive drug, antibiotic prophylaxis, then endoscopy. Early pre-emptive TIPS for the high-risk subgroup."],"drugs":["Octreotide 50 micrograms bolus then 50 micrograms per hour where terlipressin is unavailable, or terlipressin 2 mg every 4 hours while bleeding. Ceftriaxone 1 g daily for up to 7 days. Erythromycin before endoscopy if the QT interval allows."],"nonPharm":["Band ligation of esophageal varices. Balloon tamponade or a covered stent only as a bridge, measured in hours, to TIPS or repeat endoscopy. Airway intubation before endoscopy when aspiration risk is high."],"icu":["Intubate for massive hematemesis or deep encephalopathy, confirm with waveform capnography, then endoscope. This is the sequence in the intubation film. Correct hypothermia and treat infection. Do not place a Sengstaken tube and leave it overnight."],"complications":["Aspiration, rebleeding, banding ulcer, esophageal perforation from a balloon, and hepatorenal syndrome after the bleed."],"prognosis":["Six-week mortality remains substantial and follows liver function and whether bleeding was controlled. Early TIPS improves outcomes in the selected high-risk group."],"guidelines":["Baveno VII, 2022: restrictive transfusion, vasoactive drug plus antibiotic, endoscopy within 12 hours, and early TIPS for Child-Pugh C under 14 or B with active bleeding. Villanueva, New England Journal of Medicine 2013, is the transfusion trial."],"pearls":["Plasma is not a resuscitation fluid for a high INR.","A second bleed in hospital should raise early TIPS, not a third diagnostic debate."]}},{"id":"ascites","name":"Ascites","category":"portal","blocks":{"definition":["Free fluid in the peritoneal cavity. In cirrhosis it is a sodium-retaining state driven by portal hypertension and splanchnic vasodilatation."],"etiology":["Cirrhosis is the common cause in this lab. Malignancy, heart failure, tuberculosis, nephrotic syndrome and pancreatic leak are the alternatives a tap is meant to catch."],"classification":["Uncomplicated, refractory to diuretics, and complicated by spontaneous bacterial peritonitis, hydrothorax or hepatorenal syndrome. Grade 1 is only on imaging. Grade 2 is moderate. Grade 3 is tense."],"pathophysiology":["Effective arterial underfilling activates renin, aldosterone and antidiuretic hormone. The kidney keeps sodium and water. Fluid weeps from the splanchnic capillaries because hydrostatic pressure is high and oncotic pressure is low."],"mechanisms":["Bacterial products add inflammation and worsen vasodilatation. That is the bridge from simple ascites to acute-on-chronic liver failure."],"clinical":["Distension, shifting dullness, and early satiety. A tense abdomen can impair ventilation. New fever or pain means a tap the same day."],"labs":["Serum-ascites albumin gradient of 1.1 g/dL or more supports portal hypertension. A high ascitic protein suggests cardiac ascites. A low protein plus cirrhosis suggests a higher risk of spontaneous bacterial peritonitis."],"investigations":["Diagnostic paracentesis for every new ascites and every hospital admission with ascites. Send cell count, culture in blood-culture bottles, albumin and protein."],"imaging":["Ultrasound confirms fluid and marks a safe pocket. It does not replace the tap. Nodular liver and splenomegaly support cirrhosis."],"criteria":["Fluid on examination or imaging, then characterized by the albumin gradient and the cell count. Do not treat diuretics for weeks without a tap in a new presentation."],"scores":["Child-Pugh includes ascites. Refractory ascites is a further-decompensation event and should prompt transplant discussion."],"differential":["Malignant ascites, tuberculous peritonitis, nephrotic syndrome, pancreatic ascites and right-heart failure. The gradient and protein split these."],"management":["Salt restriction, spironolactone with or without furosemide, and stop nonsteroidal drugs and unnecessary saline. Large-volume paracentesis for tense ascites, with albumin if more than 5 liters are removed."],"drugs":["Spironolactone 100 mg daily, titrated, often with furosemide 40 mg, keeping roughly a 100 to 40 ratio. Albumin 6 to 8 g per liter removed when paracentesis exceeds 5 liters. EASL texts often use 8 g per liter."],"nonPharm":["Dietary sodium around 2 g, or 90 mmol, per day if the patient can actually follow it. TIPS for selected refractory ascites with preserved liver function. Transplant referral."],"icu":["Drain tense ascites that is splinting ventilation. Give albumin. Watch blood pressure and urine output for post-paracentesis circulatory dysfunction. Do not fluid-challenge with liters of saline."],"complications":["Spontaneous bacterial peritonitis, hernia rupture, hepatic hydrothorax, hepatorenal syndrome and circulatory dysfunction after a large tap without albumin."],"prognosis":["The first ascites is a major fall in survival. Refractory ascites is worse. Both are transplant conversations."],"guidelines":["EASL decompensated cirrhosis guidelines, 2018, and AASLD ascites guidance: tap, salt restriction, aldosterone antagonist, albumin after large-volume paracentesis."],"pearls":["A serum-ascites albumin gradient of 1.1 or more is portal hypertension, not proof of cirrhosis. Heart failure does this too.","Never assume an old tap result is today's cell count."]}},{"id":"sbp","name":"Spontaneous bacterial peritonitis","category":"portal","blocks":{"definition":["Infection of ascitic fluid without an intra-abdominal surgical source. The diagnostic threshold is an ascitic neutrophil count of at least 250 cells per mm3."],"etiology":["Gut bacteria, usually enteric Gram-negatives, translocate across an edematous bowel and a leaky barrier. Prior spontaneous bacterial peritonitis, low ascitic protein and gastrointestinal bleeding raise the risk."],"classification":["Culture-positive neutrocytic ascites, culture-negative neutrocytic ascites, and bacterascites with a positive culture but fewer than 250 neutrophils. Secondary peritonitis is the mimic that needs a surgeon."],"pathophysiology":["Translocated bacteria meet little opsonin in low-protein ascites. The inflammatory response then deepens vasodilatation and can precipitate kidney failure."],"mechanisms":["Cytokines and nitric oxide drop the effective arterial volume further. Albumin on day 1 and day 3, in selected patients, interrupts that cascade. The evidence is the Sort trial."],"clinical":["Fever, abdominal pain, or only a quiet encephalopathy and a falling kidney. Many episodes have no abdominal tenderness. That is why the tap is routine."],"labs":["Neutrophils at least 250 per mm3. Culture inoculated at the bedside into blood-culture bottles. A very high protein, a very high neutrophil count, or polymicrobial growth suggests secondary peritonitis."],"investigations":["Tap before the first antibiotic dose if it can be done at once. Blood cultures. If the fluid looks surgical, add lipase, glucose and lactate dehydrogenase and request imaging."],"imaging":["Not required to diagnose spontaneous bacterial peritonitis. CT is for suspected perforation, abscess or secondary peritonitis."],"criteria":["Ascitic neutrophils at least 250 cells per mm3 in the absence of a surgical source. Start treatment before the culture returns."],"scores":["Kidney injury at diagnosis dominates survival. MELD rises during the episode and should be recalculated."],"differential":["Secondary peritonitis, peritoneal carcinomatosis, tuberculosis, and a traumatic tap. A traumatic tap needs a corrected neutrophil count."],"management":["Third-generation cephalosporin promptly. Albumin on day 1 and day 3 if creatinine is above 1 mg/dL, urea is above 30 mg/dL, or bilirubin is above 4 mg/dL. Five days of antibiotics if the course is uncomplicated."],"drugs":["Cefotaxime 2 g every 8 hours, or ceftriaxone 2 g daily, unless local resistance says otherwise. Albumin 1.5 g/kg on day 1 and 1 g/kg on day 3 in the high-risk group. Avoid aminoglycosides."],"nonPharm":["Secondary prophylaxis after one episode, commonly a daily oral antibiotic chosen for local resistance. Norfloxacin was the trial drug. Availability now varies. Primary prophylaxis is for selected high-risk ascites, not for everyone."],"icu":["Treat associated septic shock with norepinephrine. Repeat the tap at 48 hours if the patient is not improving. A neutrophil fall of less than 25 percent suggests resistance or a surgical abdomen."],"complications":["Hepatorenal syndrome, septic shock, and a missed perforation if secondary peritonitis was labeled spontaneous."],"prognosis":["Mortality is driven by kidney injury and the underlying liver. Albumin in the Sort criteria group improved survival. It is not cosmetic."],"guidelines":["EASL 2018 and AASLD ascites guidance follow the 250-cell threshold, a third-generation cephalosporin, and the Sort albumin regimen. Sort and colleagues, New England Journal of Medicine 1999."],"pearls":["No tenderness does not mean no spontaneous bacterial peritonitis.","Put the fluid in blood-culture bottles. A plain sterile pot grows much less."]}},{"id":"hydro","name":"Hepatic hydrothorax","category":"portal","blocks":{"definition":["A pleural effusion, usually right-sided, in a patient with cirrhosis and portal hypertension, without a cardiac or primary pulmonary cause."],"etiology":["Ascites crosses small defects in the diaphragm, more often the right hemidiaphragm, driven by negative intrathoracic pressure."],"classification":["Uncomplicated, infected (spontaneous bacterial empyema), and refractory. The effusion can exist even when abdominal ascites is not obvious."],"pathophysiology":["A one-way diaphragmatic leak. The pleural space is a lower-pressure destination, so the chest can fill while the abdomen looks only mildly distended."],"mechanisms":["The fluid has the same origin as ascites, so the albumin gradient is high and the protein is usually low, unless infection has changed it."],"clinical":["Dyspnea, cough, and hypoxemia. The right chest is dull. Fever or a new infiltrate raises spontaneous bacterial empyema."],"labs":["Pleural fluid neutrophils at least 250 per mm3 with a positive culture, or at least 500 without a culture, define spontaneous bacterial empyema if pneumonia is absent."],"investigations":["Thoracentesis. Rule out heart failure and pneumonia. A diagnostic peritoneal tap as well if ascites is present."],"imaging":["Right pleural effusion on ultrasound or chest radiograph. Isotope or MR studies of a diaphragmatic leak are rarely needed clinically."],"criteria":["Cirrhosis, a pleural effusion, and exclusion of other causes. A high serum-pleural albumin gradient supports the portal-hypertensive origin."],"scores":["No dedicated score. Refractory hydrothorax is further decompensation and a transplant issue."],"differential":["Heart failure, parapneumonic effusion, tuberculosis and malignancy. Left-sided fluid alone makes hepatic hydrothorax less likely."],"management":["Salt restriction and diuretics first. Therapeutic thoracentesis for dyspnea. Chest tubes are avoided because they drain the patient into kidney failure. TIPS in selected refractory cases."],"drugs":["The same diuretics as ascites. Antibiotics as for spontaneous bacterial peritonitis if empyema criteria are met, plus albumin if the Sort risk factors are present."],"nonPharm":["Do not place a permanent chest drain. Pleurodesis and diaphragmatic repair are specialist, inconsistent options. Transplant assessment is the disease-modifying path."],"icu":["Oxygen, careful thoracentesis of about 1 to 2 liters, and stop if cough or pain appears. A chest tube is a complication, not a plan, unless pus or a pneumothorax forces it."],"complications":["Respiratory failure, spontaneous bacterial empyema, and protein and volume loss from an ill-advised drain."],"prognosis":["Refractory hepatic hydrothorax has a poor transplant-free survival. Say that early."],"guidelines":["AASLD ascites guidance discusses hepatic hydrothorax with the same salt, diuretic and selected TIPS approach, and advises against routine chest-tube drainage."],"pearls":["A right effusion in cirrhosis is not automatically pneumonia.","A chest tube for simple hepatic hydrothorax creates a new disease."]}},{"id":"hrs","name":"Hepatorenal syndrome","category":"portal","blocks":{"definition":["Hepatorenal syndrome-AKI is acute kidney injury in cirrhosis with ascites, after shock, nephrotoxins and structural kidney disease have been addressed, and kidney injury criteria are met."],"etiology":["Extreme splanchnic vasodilatation, a low effective arterial volume, and intense renal vasoconstriction. It often follows infection, a bleed or over-diuresis."],"classification":["The current name is HRS-AKI, using KDIGO stages of creatinine rise, replacing the old type 1 label. HRS-NAKI, formerly type 2, is a slower decline, often with refractory ascites."],"pathophysiology":["Portal hypertension dilates the splanchnic bed. Cardiac output, which was high, can no longer compensate. The kidney sees a low perfusion pressure and constricts."],"mechanisms":["Renin, norepinephrine and vasopressin are high. Intrarenal vasodilators fail. The kidney is structurally intact at the start, which is why vasoconstrictor plus albumin can reverse it."],"clinical":["Oliguria and a rising creatinine during an admission for ascites, peritonitis or bleeding. There is usually no pain, no active sediment and no shock at the moment of diagnosis."],"labs":["A bland urine, sodium often very low, and no significant hematuria. Creatinine rises. These findings support the diagnosis but do not prove it."],"investigations":["Stop diuretics and nephrotoxins. Give a proper albumin challenge, commonly 1 g/kg on two consecutive days, maximum often cited at 100 g per day. Ultrasound the kidneys. Tap the ascites."],"imaging":["Normal-sized kidneys. Hydronephrosis or a small scarred kidney points elsewhere."],"criteria":["Cirrhosis with ascites, an acute creatinine rise by KDIGO, no response to two days of diuretic withdrawal and volume, no shock, no recent nephrotoxin, and no signs of structural kidney disease."],"scores":["The creatinine response to terlipressin defines treatment success in trials: a fall of at least 30 percent, ideally toward below 1.5 mg/dL. MELD rises with the creatinine and can change transplant priority."],"differential":["Prerenal azotemia that responds to volume, acute tubular necrosis, nephrotoxic injury, and abdominal-compartment physiology from tense ascites."],"management":["Albumin plus a vasoconstrictor. Terlipressin is the best-studied drug. Norepinephrine is the ICU alternative. Transplant is the definitive treatment. Midodrine and octreotide are inferior and belong only where neither terlipressin nor norepinephrine can be used."],"drugs":["Terlipressin 1 mg every 4 to 6 hours, increased to 2 mg if creatinine has not fallen, plus albumin 20 to 40 g daily after the initial 1 g/kg day. Stop if respiratory failure or ischemia appears. The CONFIRM trial used 1 mg every 6 hours."],"nonPharm":["Drain tense ascites. Avoid hydroxyethyl starch and nonsteroidal drugs. Renal replacement is a bridge to transplant, not a cure for hepatorenal physiology."],"icu":["Norepinephrine infusion plus albumin if terlipressin is unavailable or the patient is already in the ICU on a vasopressor. Watch oxygen saturation. Terlipressin can cause pulmonary edema. Do not chase a creatinine with escalating doses in a hypoxic patient."],"complications":["Ischemia of digits, gut or heart, respiratory failure from volume, and progression to a kidney that no longer recovers even after transplant if the injury was actually necrosis."],"prognosis":["Untreated HRS-AKI has a very short survival. Response to a vasoconstrictor improves it. Nonresponse should accelerate transplant discussion, not an endless drug titration."],"guidelines":["AASLD and EASL adopt the International Club of Ascites HRS-AKI definition. Terlipressin plus albumin is supported by CONFIRM and is licensed for this use in several countries. Follow the local label on respiratory-failure warnings."],"pearls":["Give the albumin challenge before you call it hepatorenal syndrome.","A hypoxic patient and terlipressin are a bad pair. CONFIRM showed more respiratory failure."]}},{"id":"pvt","name":"Portal vein thrombosis","category":"portal","blocks":{"definition":["Thrombus in the portal vein trunk or its branches. It may be acute, without collaterals, or chronic, with cavernous transformation."],"etiology":["Cirrhosis is the common setting in hospital. Outside cirrhosis, loo
