k for thrombophilia, myeloproliferative disease, intra-abdominal infection and surgery. Malignancy invades as well as compresses."],"classification":["Completely or partially occlusive. Yerdel grading is used around transplant. Acute versus chronic is decided by symptoms and by the presence of a cavernoma, not by the calendar alone."],"pathophysiology":["Loss of portal inflow raises the dependence on the hepatic artery. In a noncirrhotic liver the artery usually compensates. In cirrhosis, thrombosis worsens portal hypertension."],"mechanisms":["Slow flow, a damaged vessel wall and a prothrombotic state. Cirrhosis is not anticoagulant by nature. It is a rebalanced, fragile hemostasis that can clot."],"clinical":["Acute thrombosis outside cirrhosis causes abdominal pain and, if the superior mesenteric vein is involved, bowel ischemia. Chronic thrombosis presents as variceal bleeding. Cirrhotic thrombosis is often found on a scan."],"labs":["Lactate and acidosis if the bowel is ischemic. Thrombophilia bloods are best taken before anticoagulation, but treatment of an acute symptomatic thrombus should not wait for them."],"investigations":["Doppler ultrasound first, contrast CT or MRI to map extent and to look for tumor thrombus. Alpha-fetoprotein and multiphase imaging if invasion by hepatocellular carcinoma is possible."],"imaging":["Absent color flow, a filling defect, and, when chronic, serpiginous collaterals at the porta. Tumor thrombus enhances and expands the vein. Bland thrombus does not enhance."],"criteria":["Imaging demonstration of thrombus. Symptoms plus mesenteric extension define the bowel-threatening form."],"scores":["No score replaces the imaging extent and the question of intestinal ischemia."],"differential":["Tumor thrombus, slow flow mistaken for thrombus on Doppler, and extrinsic compression."],"management":["Anticoagulate acute noncirrhotic portal vein thrombosis unless bleeding prohibits it, especially if the mesenteric vein is involved. In cirrhosis, anticoagulate symptomatic or progressive thrombus and patients listed for transplant, individualized against variceal risk."],"drugs":["Low-molecular-weight heparin is the usual start. Direct oral anticoagulants are used in selected compensated patients in newer guidance. They are not a default in decompensated cirrhosis. Band high-risk varices before long anticoagulation when endoscopy is feasible."],"nonPharm":["Antibiotics if pylephlebitis from an abdominal source is the cause. Surgery for dead bowel. Do not thrombolyse a chronic cavernoma."],"icu":["Suspected mesenteric ischemia is an emergency: lactate, CT, anticoagulation, and a surgeon. Variceal bleeding on anticoagulation is managed as variceal bleeding, with a deliberate decision about when to restart."],"complications":["Bowel infarction, variceal bleeding, and extension to the splenic or mesenteric veins."],"prognosis":["Recanalization is realistic in acute thrombosis that is anticoagulated early. A cavernoma will not dissolve. The bowel, not the liver enzyme, is the acute threat."],"guidelines":["AASLD vascular liver disorders guidance, 2020, and Baveno VII: anticoagulate acute noncirrhotic portal vein thrombosis, and individualize anticoagulation in cirrhosis."],"pearls":["Enhancing thrombus is tumor until proven otherwise.","A rising lactate with portal and mesenteric thrombus is dead bowel until the surgeon says it is not."]}},{"id":"bcs","name":"Budd-Chiari syndrome","category":"portal","blocks":{"definition":["Obstruction of hepatic venous outflow from the hepatic vein ostia down to the suprahepatic inferior vena cava, regardless of the cause. Cardiac failure is excluded from the term."],"etiology":["Myeloproliferative disorders, especially a JAK2-positive polycythemia that may not yet look obvious on the blood count, thrombophilia, pregnancy, oral contraceptives, and membranes or webs in the inferior vena cava in some regions."],"classification":["Obstruction of hepatic veins, of the inferior vena cava, or of both. Acute, subacute and chronic presentations. The caudal lobe often hypertrophies because it drains separately."],"pathophysiology":["Blood cannot leave the sinusoids. The liver swells, pressure transmits to the portal vein, and ischemic necrosis follows in the drained territories. The caudate lobe is relatively spared."],"mechanisms":["Thrombosis on a prothrombotic background is the usual molecular story. A membranous web is a mechanical variant. Both end in the same congestion."],"clinical":["Right-upper-quadrant pain, ascites and hepatomegaly. The chronic form looks like any other cirrhosis. Acute obstruction can present with liver failure."],"labs":["Aminotransferases high in acute obstruction, nonspecific later. JAK2 V617F even when the blood count is nearly normal. Protein C, S and antithrombin are hard to interpret once the liver is sick."],"investigations":["Doppler ultrasound is the first test and is sensitive in experienced hands. CT or MR venography confirms. Send thrombophilia tests, but start treatment on imaging."],"imaging":["Absent hepatic-vein flow, a spiderweb of intrahepatic collaterals, a hypertrophied caudate lobe, and a narrowed inferior vena cava."],"criteria":["Imaging proof of hepatic venous outflow obstruction, not explained by heart failure or sinusoidal obstruction syndrome."],"scores":["Several prognostic scores exist for transplant decisions. They do not replace the stepwise treatment. Acute liver failure criteria apply if encephalopathy and coagulopathy are present."],"differential":["Right-heart failure, constrictive pericarditis, and sinusoidal obstruction syndrome after hematopoietic transplant."],"management":["Anticoagulate unless there is a major contraindication. Then restore outflow: angioplasty or stent for a short web or caval narrowing, TIPS if the veins cannot be recanalized, transplant if the liver has failed or TIPS is not possible."],"drugs":["Low-molecular-weight heparin, then a long-term anticoagulant chosen with hematology. Treat the myeloproliferative disease. Do not give thrombolysis casually in a patient who can go to TIPS."],"nonPharm":["Salt restriction and paracentesis for ascites while anatomy is being fixed. Hematological follow-up for life if a clone is found."],"icu":["Acute Budd-Chiari with liver failure needs urgent decompression, not a week of diuretics. Intubate if encephalopathy is deep. Involve interventional radiology the day the Doppler is positive."],"complications":["Intestinal congestion, liver failure, and failure to look for the blood disorder that will reclot the next vein."],"prognosis":["Stepwise recanalization, TIPS and transplant have changed survival. The underlying blood disease still needs treatment after the liver is fixed."],"guidelines":["EASL clinical practice guidelines on vascular diseases of the liver, 2016, and AASLD vascular guidance, 2020: anticoagulate, look for a myeloproliferative neoplasm, and proceed from angioplasty to TIPS to transplant."],"pearls":["Pain, ascites and a large liver: Doppler the hepatic veins before you call it cirrhosis.","JAK2 can be positive with a normal hemoglobin. Send it."]}},{"id":"mhe","name":"Minimal hepatic encephalopathy","category":"he","blocks":{"definition":["Cognitive impairment from liver disease that is not obvious on a standard clinical examination, but is measurable on psychometric or neurophysiological tests. It is now grouped as covert hepatic encephalopathy with grade I."],"etiology":["Cirrhosis with portosystemic shunting. Ammonia and inflammation are the drivers, even when the patient looks well in clinic."],"classification":["Covert hepatic encephalopathy covers minimal disease and West Haven grade I. Overt disease is grades II to IV."],"pathophysiology":["Low-grade astrocyte swelling from glutamine, altered neurotransmission, and a systemic inflammatory signal. The patient can drive, work and still be unsafe."],"mechanisms":["Ammonia, manganese deposition in basal ganglia, and cytokine priming. Lactulose lowers the ammonia load. It does not fix the shunt."],"clinical":["Normal conversation. Complaints of sleep inversion, poor concentration, or a near-miss while driving. The family notices more than the clinician."],"labs":["Ammonia is often raised and does not grade the deficit. Do not use a normal ammonia to dismiss a spouse who says the patient is not themselves."],"investigations":["Psychometric hepatic encephalopathy score, critical flicker frequency, or a validated smartphone or paper test, depending on what your unit actually has. EEG is not required for the label."],"imaging":["Not diagnostic. MRI hyperintensity of the basal ganglia is a chronic manganese sign, not a measure of today's cognition."],"criteria":["Abnormal specialized testing with a normal bedside mental state, in a patient with cirrhosis, after excluding other brain disease."],"scores":["West Haven grade 0 by examination, with a positive psychometric test. Child-Pugh and MELD still describe the liver."],"differential":["Dementia, depression, cerebrovascular disease, and medication effects, especially opioids and benzodiazepines."],"management":["Treat if the deficit affects driving, work or quality of life. Lactulose is first line. Rifaximin can be added. Counsel about driving according to local law."],"drugs":["Lactulose titrated to two or three soft stools a day. Rifaximin 550 mg twice daily is better proven after an overt episode than as a first drug for minimal disease."],"nonPharm":["Nutrition, stop sedatives, and do not restrict protein. Review diuretics if dehydration is provoking the deficit."],"icu":["This grade is not an ICU diagnosis. It matters because it predicts overt encephalopathy during the next bleed or infection."],"complications":["Accidents, falls, and later overt encephalopathy. Quality of life is already worse."],"prognosis":["Covert encephalopathy predicts overt episodes and a poorer survival. Treating it is not cosmetic."],"guidelines":["AASLD and EASL hepatic encephalopathy guideline, 2014: test when the diagnosis will change advice, treat with lactulose, and do not use ammonia to rule the syndrome out."],"pearls":["Ask the family about driving and sleep. The patient will tell you they are fine.","A normal number-connection test done once, badly explained, is not a clearance to drive."]}},{"id":"ohe","name":"Overt hepatic encephalopathy","category":"he","blocks":{"definition":["Brain dysfunction caused by liver insufficiency or portosystemic shunting that is obvious at the bedside, from personality change and asterixis to coma."],"etiology":["Cirrhosis with a precipitant: infection, bleed, constipation, dehydration, sedatives, electrolyte disorder, or a new shunt. Acute liver failure causes a related but more edematous syndrome."],"classification":["West Haven grades II, III and IV are overt. Grade I sits with minimal disease inside the covert group, although many clinicians still say grade I out loud."],"pathophysiology":["Ammonia and other gut toxins bypass the liver or overwhelm it. Astrocytes swell. Inhibitory neurotransmission increases. In cirrhosis, intracranial pressure is usually normal. In acute liver failure, it may not be."],"mechanisms":["Glutamine in astrocytes is the osmotic load. Inflammation makes the brain sensitive to a given ammonia. That is why infection precipitates coma without a huge change in the ammonia number."],"clinical":["Reversed sleep, irritability, asterixis, then confusion, then coma. Fetor, hyperventilation and a positive glabellar tap are soft signs. Focal neurology is a warning of another diagnosis."],"labs":["Look for the precipitant: white cells, creatinine, sodium, potassium, glucose, and hemoglobin. Ammonia, if sent, must be arterial or free-flowing venous, on ice, analyzed immediately. A normal result does not exclude the diagnosis."],"investigations":["Tap the ascites. Culture blood and urine. Consider CT of the head if the presentation is new coma, focal signs, or trauma. Do not CT everyone with known recurrent encephalopathy and a clear precipitant."],"imaging":["CT excludes hemorrhage. It does not diagnose hepatic encephalopathy. MRI is not an ICU test for this."],"criteria":["A compatible neurological picture in cirrhosis or a shunt, with other causes considered, and a search for the precipitant completed."],"scores":["West Haven grade, and the Glasgow coma scale once verbal function is unreliable. FOUR score if intubated. MELD does not grade the brain."],"differential":["Intracranial bleed, meningitis, hypoglycemia, alcohol withdrawal, seizure, and opioid toxicity. Withdrawal is jittery and tachycardic. Hepatic encephalopathy is slow."],"management":["Find and treat the precipitant. Lactulose by mouth or nasogastric tube. Add rifaximin after a recurrence. Protect the airway in grade III to IV. Do not restrict protein."],"drugs":["Lactulose 20 to 30 mL every one to two hours until stool, then titrate. If the gut is not working, a retention enema, often 300 mL lactulose in water, while the ileus is treated. Rifaximin 550 mg twice daily to prevent recurrence. Stop benzodiazepines."],"nonPharm":["Nutrition with protein. Correct potassium and sodium slowly if chronic. Review a TIPS that has produced intractable encephalopathy. Transplant assessment after recovery from a first overt episode in decompensated disease."],"icu":["Intubate for airway protection in deep encephalopathy before a long transfer or endoscopy. Confirm tube position with waveform capnography. Avoid hyperventilation as a routine. Sedate as little as possible so that the grade can be reassessed."],"complications":["Aspiration, recurrence, and a missed intracranial bleed. In acute liver failure, cerebral edema and herniation."],"prognosis":["Each overt episode marks a worse survival. Precipitant control and secondary prevention with lactulose, then rifaximin, reduce recurrence. They do not replace transplant in advanced decompensation."],"guidelines":["AASLD and EASL hepatic encephalopathy practice guideline, 2014: treat the precipitant, lactulose first, rifaximin for prevention of recurrence, no protein restriction, ammonia is supportive only."],"pearls":["Coma plus a focal sign is a bleed or a stroke until CT says otherwise.","Two days of lactulose without a search for peritonitis is not a treatment plan."]}},{"id":"west","name":"West Haven grading","category":"he","blocks":{"definition":["A bedside scale for hepatic encephalopathy, from trivial awareness to coma. It is a grading system, not a disease."],"etiology":["Applied to encephalopathy from cirrhosis, a shunt, or acute liver failure. The same number does not mean the same intracranial pressure in those settings."],"classification":["Grade I: shortened attention, euphoria or anxiety, reversed sleep. Grade II: lethargy, disorientation to time, obvious personality change, asterixis. Grade III: marked confusion, somnolence, disorientation to place, brisk reflexes. Grade IV: coma."],"pathophysiology":["Grades track clinical brain dysfunction. They do not measure ammonia, cerebral blood flow or intracranial pressure."],"mechanisms":["Asterixis is a lapse of postural tone from the same metabolic encephalopathy. It can be absent in grade IV because there is no posture left to lapse."],"clinical":["Grade the best and worst state of the day, not a single glance. A patient who was grade III overnight and is grade I at the ward round has not been cured by daylight."],"labs":["None required to assign a grade. Glucose must be known before a grade is believed, because hypoglycemia copies every grade."],"investigations":["Glasgow coma scale alongside West Haven once grade III or IV is reached, because West Haven was not designed for intubated titration."],"imaging":["Not part of the grade. Image if another brain lesion is plausible."],"criteria":["The descriptors above, after excluding hypoglycemia and sedative overdose as the sole cause of the picture."],"scores":["West Haven itself. Covert encephalopathy is minimal plus grade I. Overt is grades II to IV in current nomenclature."],"differential":["A low Glasgow coma scale from a structural lesion. If the grade and the pupils do not fit a metabolic picture, image the head."],"management":["Use the grade to trigger airway protection, not as a label to write and leave. Grade III and IV need a protected airway before transfer and before endoscopy."],"drugs":["Treatment is the treatment of the encephalopathy and its precipitant, not a drug for the scale."],"nonPharm":["Reassess after each stool and after each treated infection. Document the grade in the notes so the night team can see a change."],"icu":["An intubated patient cannot be graded by conversation. Use the Glasgow or FOUR score, pupillary responses, and ammonia trend in acute liver failure. Do not write West Haven IV for three days without a pupil check."],"complications":["False reassurance from a soft grade I that is actually a subdural hematoma in a patient who fell."],"prognosis":["Higher grades predict in-hospital death, especially in acute liver failure, where grade III and IV raise the concern for cerebral edema."],"guidelines":["The scale is embedded in the AASLD-EASL hepatic encephalopathy guideline, 2014, which also explains the covert and overt grouping."],"pearls":["Always exclude hypoglycemia before you assign a grade.","Asterixis cannot be tested in a coma. Its absence then means nothing."]}},{"id":"precip","name":"Precipitating factors and cerebral pathophysiology","category":"he","blocks":{"definition":["The events that turn a stable patient with cirrhosis into an encephalopathic one, and the brain mechanisms those events amplify."],"etiology":["Infection including spontaneous bacterial peritonitis, gastrointestinal bleeding, constipation, dehydration from diuretics or lactulose itself, hypokalemia, hyponatremia, sedatives, renal failure, and a new portosystemic shunt."],"classification":["Increased ammonia production, reduced ammonia clearance, increased neuroinflammation, and direct drug depression of consciousness."],"pathophysiology":["Bleeding dumps protein into the gut. Infection primes astrocytes so that a modest ammonia rise now causes coma. Dehydration reduces hepatic and renal ammonia handling. A TIPS bypasses the liver entirely."],"mechanisms":["Astrocyte glutamine is osmotically active. Myoinositol and other osmolytes fall over time in cirrhosis, which is why chronic patients tolerate an ammonia level that would swell an acutely failing liver."],"clinical":["The mental state changes faster than the bilirubin. Look at the abdomen, the stool chart, the drug chart and the potassium before you add another envelope of lactulose."],"labs":["White cells, ascitic neutrophils, hemoglobin, potassium, sodium, creatinine and glucose. Ammonia is optional and easy to spoil."],"investigations":["Paracentesis, cultures, a rectal examination or a stool record, and a review of new opioids, benzodiazepines and the diuretic dose."],"imaging":["Head CT if trauma, focal signs, or first-ever coma without a precipitant. Otherwise the precipitant is in the abdomen or the drug chart, not the scanner."],"criteria":["A temporal link between one of the factors above and a change in West Haven grade."],"scores":["No separate score. Count how many precipitants are active. More than one is the rule, not the exception."],"differential":["A primary neurological event occurring in a patient who also has cirrhosis. The two can coexist."],"management":["Remove every precipitant you find, not only the most convenient one. Restart rifaximin if this is a recurrence. Reconsider a TIPS that has caused repeated coma."],"drugs":["Stop sedatives. Correct potassium. Treat infection. Lactulose until two or three stools, then stop escalating so that you do not create dehydration, which is itself a precipitant."],"nonPharm":["Feed protein. A nil-by-mouth order for three days worsens sarcopenia and does not treat the brain."],"icu":["Deep coma from a precipitant still needs an airway. In acute liver failure the same biochemistry sits next to a rising intracranial pressure. Do not export cirrhosis habits unchanged into acute liver failure."],"complications":["Aspiration during the search for a precipitant, and diuretic-induced kidney injury from overcalling the need for dry weight."],"prognosis":["Encephalopathy with a reversible precipitant recovers better than encephalopathy with no precipitant and a dying liver."],"guidelines":["AASLD-EASL 2014 lists the precipitants explicitly and recommends a systematic search at every episode."],"pearls":["Lactulose overdose causes dehydration, which causes encephalopathy. More is not always more.","If you cannot name the precipitant, you have not finished the admission."]}},{"id":"abscess","name":"Hepatic abscess","category":"other","blocks":{"definition":["A pus-filled collection in the liver, either pyogenic from bacteria or amebic from Entamoeba histolytica."],"etiology":["Pyogenic abscesses follow biliary obstruction, portal pyemia from diverticulitis or appendicitis, hepatic arterial seeding, or a penetrating injury. Amebic abscess follows intestinal amebiasis, which may have been mild."],"classification":["Single or multiple. Pyogenic or amebic. Multiple small abscesses suggest a biliary source or hematogenous spread."],"pathophysiology":["Bacteria reach the liver through bile, portal blood or the hepatic artery and are walled off. Entamoeba travels from the colon via the portal vein and liquefies parenchyma. The classic amebic pus is described as anchovy paste and is often sterile of bacteria."],"mechanisms":["Klebsiella, especially a hypervirulent strain, causes a monomicrobial abscess and can seed the eye and the brain. Mixed enteric flora suggest a biliary or bowel source."],"clinical":["Fever, right-upper-quadrant pain and tender hepatomegaly. Amebic disease may add a travel or endemic-area history and a less toxic appearance than the size of the cavity suggests."],"labs":["High white-cell count, high alkaline phosphatase, and blood cultures that are often positive in pyogenic disease. Serology for Entamoeba is sensitive for amebic abscess but stays positive for years."],"investigations":["Ultrasound or CT, blood cultures before antibiotics if possible, and aspiration if the abscess is pyogenic-pattern or the patient is not improving. Test for Entamoeba when epidemiology fits."],"imaging":["A hypoechoic or rim-enhancing lesion. Multiple lesions along the bile ducts suggest cholangitis. A large solitary right-lobe lesion is the amebic stereotype, not a rule."],"criteria":["Imaging of a collection plus a clinical infection, confirmed by aspirate culture or by a response to antiamebic therapy with positive serology."],"scores":["No liver-abscess score is required. Source control and the underlying biliary obstruction decide outcome."],"differential":["Necrotic hepatocellular carcinoma, hydatid cyst, and a simple cyst with hemorrhage. Do not aspirate a suspected hydatid cyst casually."],"management":["Pyogenic: antibiotics and drainage of lesions that are large or not improving, commonly those above about 3 to 5 cm, plus treatment of the biliary or bowel source. Amebic: metronidazole, and drainage only if rupture is imminent, the lesion is left-lobe and threatening the pericardium, or drugs fail."],"drugs":["Pyogenic cover for Gram-negatives and anaerobes until cultures return, for example a third-generation cephalosporin plus metronidazole, then narrow. Amebic: metronidazole 500 to 750 mg three times daily for 7 to 10 days, then a luminal agent such as paromomycin to clear gut cysts."],"nonPharm":["Percutaneous drain for large pyogenic abscesses. ERCP if the bile duct is obstructed. Surgery if the collection ruptures or percutaneous drainage fails."],"icu":["Septic shock from a biliary source needs antibiotics and decompression the same day. A ruptured amebic abscess into the pleura or peritoneum needs drainage and metronidazole."],"complications":["Rupture into pleura, peritoneum or pericardium, metastatic Klebsiella infection, and an obstructed bile duct left untreated."],"prognosis":["Good if the organism is treated and the source is controlled. Poor if a cholangiocarcinoma or uncontrolled biliary sepsis was the real source."],"guidelines":["Surgical and infectious-disease sources, including the Surgical Infection Society and hepatology reviews, agree on antibiotics plus drainage for large pyogenic abscesses and on metronidazole for amebic abscess. There is no single AASLD abscess guideline to pretend otherwise."],"pearls":["Anchovy paste and a negative bacterial culture is amebic until serology returns.","Klebsiella abscess: look at the eyes and ask about diabetes."]}},{"id":"hcc","name":"Hepatocellular carcinoma","category":"other","blocks":{"definition":["A primary malignancy of hepatocytes, almost always on the background of cirrhosis or chronic hepatitis B."],"etiology":["Cirrhosis of any cause, chronic hepatitis B even without cirrhosis, and metabolic liver disease. Aflatoxin and chronic hepatitis B interact in high-incidence regions."],"classification":["Barcelona Clinic Liver Cancer stage combines tumor burden, liver function and performance status and links them to treatment. LI-RADS categories describe imaging certainty."],"pathophysiology":["Regenerative nodules, chronic inflammation and viral integration produce dysplasia, then carcinoma. The tumor arterializes, which is why it enhances in the arterial phase and washes out later."],"mechanisms":["Arterial neovascularization and loss of portal supply create the imaging hallmark. Portal-vein invasion is a biological step, not just a size problem."],"clinical":["Often silent and found on surveillance. Decompensation without a clear precipitant, weight loss, or a rising alpha-fetoprotein. A hepatic bruit is rare and late."],"labs":["Alpha-fetoprotein is raised in only a portion of tumors. A rising value matters more than a single modest number. Liver tests reflect the underlying cirrhosis."],"investigations":["Multiphase CT or MRI. Biopsy only when imaging is not diagnostic. Do not biopsy a LI-RADS 5 lesion and seed the track for no reason."],"imaging":["Arterial phase hyperenhancement and washout in the portal venous or delayed phase, in a lesion at least 1 cm, in a high-risk liver. Capsule appearance and growth support the diagnosis."],"criteria":["LI-RADS 5, or the equivalent AASLD imaging criteria, in a patient at risk. Organ-procurement policy has specific exception rules for listing. Use the current policy, not memory, for transplant paperwork."],"scores":["BCLC stage, Child-Pugh or a measure of portal hypertension, and Milan criteria for transplant: one lesion up to 5 cm, or up to three lesions each up to 3 cm, no vascular invasion, no metastasis."],"differential":["Cholangiocarcinoma, metastasis, a dysplastic nodule, and an abscess. Washout favors hepatocellular carcinoma. A targetoid lesion raises cholangiocarcinoma."],"management":["Resection for a small tumor in a noncirrhotic or very well compensated liver without portal hypertension. Ablation for small unresectable lesions. Transplant within Milan or accepted expanded criteria. Transarterial therapy and systemic agents for later stages."],"drugs":["Atezolizumab plus bevacizumab is a first-line systemic option in compensated disease with a patent portal vein and varices that have been assessed. Sorafenib and lenvatinib remain options. These drugs are not for untreated varices or Child-Pugh C disease."],"nonPharm":["Six-monthly ultrasound surveillance in cirrhosis, with or without alpha-fetoprotein depending on the guideline you follow. Treat varices before bevacizumab."],"icu":["The ICU sees the rupture, the bleed after a procedure, or the decompensation. Resuscitate, image, and involve interventional radiology for a ruptured tumor. Systemic therapy is not an ICU start."],"complications":["Rupture with hemoperitoneum, portal-vein invasion, and decompensation after locoregional therapy."],"prognosis":["Early tumors treated by ablation, resection or transplant can be cured. Symptomatic advanced disease is measured in months, longer with modern systemic therapy in selected patients."],"guidelines":["AASLD hepatocellular carcinoma guidance and EASL hepatocellular carcinoma guidelines: surveillance, LI-RADS or equivalent diagnosis, BCLC-linked treatment, and Milan criteria for transplant."],"pearls":["A new decompensation needs a multiphase scan, not only a paracentesis.","Do not start bevacizumab on an unscreened varix."]}},{"id":"cholangitis","name":"Acute cholangitis","category":"other","blocks":{"definition":["Bacterial infection of the biliary tree, usually behind an obstruction. It is a combined medical and drainage emergency when severe."],"etiology":["Stones in the common duct, a malignant stricture, a blocked stent, or primary sclerosing cholangitis. Organisms are enteric Gram-negatives and anaerobes."],"classification":["Tokyo Guidelines 2018 severity. Grade I responds to antibiotics. Grade II is moderate and needs early drainage. Grade III is severe, with organ failure, and needs urgent drainage after stabilization."],"pathophysiology":["Raised intraductal pressure pushes bacteria and endotoxin into the bloodstream. That is why antibiotics without drainage fail when the duct is still blocked."],"mechanisms":["Cholangiovenous reflux at high biliary pressure causes the bacteremia. Relieve the pressure and the bacteremia stops."],"clinical":["Charcot's triad of fever, jaundice and right-upper-quadrant pain is present in only some patients. Reynolds' pentad adds hypotension and confusion and means severe disease. Elderly patients may have only fever and a cholestatic blood test."],"labs":["Raised white cells, raised alkaline phosphatase and bilirubin, and positive blood cultures. A normal bilirubin early on does not exclude the diagnosis if pain and fever are typical."],"investigations":["Blood cultures, ultrasound first, then CT or MRCP to define the level of obstruction. Coagulation before ERCP."],"imaging":["Dilated ducts and, often, a stone or a stricture. Ultrasound can miss a distal stone. A normal ultrasound in a sick jaundiced patient is not the end of imaging."],"criteria":["Tokyo Guidelines: systemic inflammation, cholestasis, and imaging of a biliary cause. Suspected versus definite depends on how many of those domains are present."],"scores":["Tokyo severity grade, plus ordinary sepsis scores. The grade decides how fast the duct must be drained."],"differential":["Cholecystitis, liver abscess, pancreatitis, and hepatitis. A dilated duct points at the bile duct rather than the gallbladder alone."],"management":["Resuscitate, take cultures, start antibiotics, and drain the duct according to severity. ERCP is first line for a distal obstruction. Percutaneous transhepatic drainage if ERCP cannot reach the obstruction."],"drugs":["Cover enteric Gram-negatives and anaerobes. A third-generation cephalosporin plus metronidazole, or piperacillin-tazobactam, depending on severity and local resistance. Narrow to cultures. Antibiotics do not replace drainage in grade II and III."],"nonPharm":["ERCP with sphincterotomy and stone extraction or stent. Correct coagulopathy for the procedure with vitamin K if deficiency is likely. Do not cancel drainage because the INR is 1.6 from sepsis and vitamin K deficiency without replacing the vitamin and rechecking."],"icu":["Grade III disease: norepinephrine for shock, cultures, antibiotics within the hour, and drainage as soon as the team can do it safely. Intubate if coma or aspiration risk requires it before ERCP."],"complications":["Septic shock, liver abscess, acute kidney injury, and pancreatitis after ERCP."],"prognosis":["Excellent if the duct is drained early. Mortality rises sharply when severe cholangitis is treated with antibiotics alone."],"guidelines":["Tokyo Guidelines 2018: diagnosis, severity grading, and timing of biliary drainage. Antimicrobial choice follows severity and local resistance, not a single global drug."],"pearls":["Severe cholangitis is a drainage emergency wearing a medical disguise.","Ultrasound that does not show a stone has not excluded a stone."]}},{"id":"chole","name":"Acute cholecystitis","category":"other","blocks":{"definition":["Inflammation of the gallbladder, usually from a stone impacted in the cystic duct."],"etiology":["Gallstones in most cases. Acalculous cholecystitis occurs in the critically ill, from ischemia and bile stasis, and is easier to miss."],"classification":["Tokyo Guidelines severity. Grade I is mild. Grade II has marked local inflammation. Grade III has organ failure. Acalculous disease is a separate high-risk form."],"pathophysiology":["Cystic-duct obstruction raises gallbladder pressure, the wall becomes ischemic and inflamed, and secondary infection follows. In acalculous disease the ischemia comes first."],"mechanisms":["Prostaglandin-mediated inflammation and bacterial colonization by enteric organisms. The bile duct itself is not necessarily blocked, which is why the bilirubin may be normal."],"clinical":["Right-upper-quadrant pain, fever, and a positive Murphy sign in a patient who can cooperate. In a ventilated patient the sign is a tender gallbladder on ultrasound probe pressure, or there is no sign at all."],"labs":["White cells rise. Liver tests are normal or only mildly abnormal. A clearly cholestatic pattern suggests a common-duct stone or Mirizzi syndrome as well."],"investigations":["Ultrasound. If ultrasound is equivocal, HIDA scintigraphy where available, or CT. Blood cultures if septic."],"imaging":["Stones, wall thickening, pericholecystic fluid, and a sonographic Murphy sign. Gangrene shows a discontinuous wall. Gas in the wall is emphysematous cholecystitis."],"criteria":["Tokyo Guidelines: local signs, systemic signs, and characteristic imaging. Suspected and definite grades depend on the combination."],"scores":["Tokyo severity, used to decide early surgery versus urgent drainage."],"differential":["Cholangitis, liver abscess, peptic ulcer, and right-base pneumonia. Acalculous cholecystitis hides inside multiorgan failure."],"management":["Antibiotics and early laparoscopic cholecystectomy for operable patients, ideally during the index admission once resuscitated. Percutaneous cholecystostomy if the patient cannot tolerate surgery, then a later decision about the gallbladder."],"drugs":["Antibiotics covering enteric organisms. They are an adjunct to source control, not a substitute, once the gallbladder is gangrenous or emphysematous."],"nonPharm":["Early surgery is source control. Cholecystostomy drains pus but leaves a diseased gallbladder. Acalculous disease in a recovering patient sometimes does not need later surgery. Confirm that with a specialist rather than a rule of thumb."],"icu":["Acalculous cholecystitis: ultrasound, antibiotics, and percutaneous drainage if the patient is too unstable for theatre. Re-examine the abdomen of every unexplained ICU fever."],"complications":["Gangrene, perforation, abscess, and gallstone ileus later. Emphysematous cholecystitis has a higher perforation rate."],"prognosis":["Excellent with early surgery in fit patients. Mortality in acalculous disease is the mortality of the critical illness around it."],"guidelines":["Tokyo Guidelines 2018: early laparoscopic cholecystectomy for mild and many moderate cases, and urgent biliary drainage or surgery for severe disease."],"pearls":["A normal bilirubin does not exclude cholecystitis. It makes cholangitis less likely.","In the ICU, acalculous cholecystitis has no Murphy sign to offer you."]}},{"id":"obstruct","name":"Biliary obstruction","category":"other","blocks":{"definition":["Blockage of bile flow from the canaliculus to the duodenum. Extrahepatic obstruction is the mechanical form this page concentrates on."],"etiology":["Common-duct stone, pancreatic cancer, cholangiocarcinoma, a benign stricture, a blocked stent, or primary sclerosing cholangitis. Intrahepatic cholestasis from drugs and sepsis is the medical mimic."],"classification":["By level: hilum, mid duct, or distal duct. By completeness. By benign versus malignant. The level decides whether ERCP or percutaneous drainage can reach it."],"pathophysiology":["Pressure rises in the ducts, bile acids and conjugated bilirubin reflux into blood, and the gut loses bile acids and vitamin K absorption. Bacteria then infect the static bile."],"mechanisms":["Conjugated hyperbilirubinemia because conjugation was intact. Pale stool and dark urine because conjugated bilirubin never reaches the bowel and spills into urine."],"clinical":["Painless progressive jaundice suggests malignancy. Pain and fever suggest a stone and cholangitis. Pruritus can precede deep jaundice. A palpable nontender gallbladder, Courvoisier's sign, suggests a distal malignant obstruction."],"labs":["Alkaline phosphatase and GGT rise early, then conjugated bilirubin. INR rises if vitamin K is not absorbed and corrects with parenteral vitamin K, unlike the INR of failed hepatocytes."],"investigations":["Ultrasound for duct dilatation and stones. MRCP to map a stricture. CA 19-9 only after obstruction is relieved, because biliary obstruction itself raises it. Clotting before any drainage."],"imaging":["Dilated intrahepatic ducts if the block is below the confluence. An undilated system does not exclude early or intermittent obstruction. A hilar mass with isolated sectoral dilatation is easy to miss on ultrasound."],"criteria":["Cholestatic blood tests plus imaging of a block, or cholangiography. A stone on ultrasound plus a compatible story is enough to plan ERCP."],"scores":["No obstruction score. Tokyo grading applies if infection is present. MELD is misleading while the bilirubin is purely obstructive."],"differential":["Drug cholestasis, sepsis, primary biliary cholangitis, and parenteral-nutrition cholestasis. Those do not dilate the ducts."],"management":["Drain infected or complete obstruction. Remove stones. Stent malignant obstruction for symptoms or for chemotherapy. Give vitamin K if the INR is high and a procedure is planned. Antibiotics if cholangitis criteria are met."],"drugs":["Parenteral vitamin K while the gut is not seeing bile. Antibiotics only if infection is present or a procedure will be done on an infected system. Ursodeoxycholic acid does not unblock a stone."],"nonPharm":["ERCP for distal disease. Percutaneous transhepatic drainage for a hilar block that ERCP cannot cross, or for altered anatomy. Surgery for resectable tumors, planned by a hepatobiliary team, not as an emergency drain."],"icu":["Obstruction plus shock is cholangitis. Resuscitate and drain. Correct vitamin K-related coagulopathy before the procedure. Do not attribute a falling blood pressure to the bilirubin number."],"complications":["Cholangitis, liver abscess, fat-soluble vitamin deficiency, and post-ERCP pancreatitis."],"prognosis":["A stone removed at ERCP is a cure of the obstruction. Malignant obstruction follows the cancer. The bilirubin itself is reversible if the duct is opened before the kidney and the sepsis fail."],"guidelines":["ASGE and ESGE endoscopic guidelines, with Tokyo Guidelines 2018 when infection is present: image the level, give vitamin K, and drain urgent infection."],"pearls":["An INR that corrects with vitamin K is a bile problem, not a dead liver.","Do not trust CA 19-9 while the patient is still jaundiced."]}}],"pathways":[{"id":"carb","title":"Carbohydrate metabolism","summary":"The liver stores glucose as glycogen after a meal and releases glucose during fasting.","significance":"It keeps blood glucose available to brain and red cells, which depend on glucose.","diseases":"Acute liver failure causes hypoglycemia. Cirrhosis causes insulin resistance and fragile fasting glucose.","steps":[{"title":"Glycogenesis","enzyme":"Glucokinase, glycogen synthase","detail":"After a meal, insulin drives glucose uptake and storage as glycogen in hepatocytes.","fail":"Poor glycogen stores mean a short fast can drop glucose, especially in acute liver failure and malnourished cirrhosis."},{"title":"Glycogenolysis","enzyme":"Glycogen phosphorylase","detail":"Glucagon and adrenaline break glycogen to glucose-6-phosphate, then glucose-6-phosphatase releases free glucose.","fail":"Only liver and kidney can export free glucose. Muscle glycogen cannot support blood glucose."},{"title":"Gluconeogenesis","enzyme":"Pyruvate carboxylase, PEPCK, fructose-1,6-bisphosphatase","detail":"During a longer fast the liver makes glucose from lactate, glycerol and alanine.","fail":"When hepatocyte mass collapses, gluconeogenesis fails and hypoglycemia appears even with ongoing nutrition stress."}]},{"id":"protein","title":"Protein metabolism","summary":"Hepatocytes synthesize albumin and most clotting factors, and dispose of nitrogen through the urea cycle.","significance":"Plasma oncotic pressure, hemostasis and nitrogen clearance all depend on hepatic protein synthesis.","diseases":"Low albumin and rising INR mark loss of synthetic function. They are used in Child-Pugh and MELD.","steps":[{"title":"Amino acid handling","enzyme":"Aminotransferases (ALT, AST)","detail":"ALT is cytosolic in hepatocytes. AST is also in mitochondria and in muscle, heart and red cells.","fail":"High ALT and AST signal hepatocyte injury. They do not measure remaining liver function."},{"title":"Albumin synthesis","enzyme":"Hepatic rough endoplasmic reticulum","detail":"Albumin is made only by hepatocytes. Its half-life is about three weeks, so it falls slowly.","fail":"A low albumin in acute disease is often dilution, inflammation or loss, not sudden synthetic failure."},{"title":"Clotting factors","enzyme":"Vitamin K–dependent factors II, VII, IX, X, proteins C and S","detail":"Factor VII has a short half-life, so INR rises early when synthesis fails or vitamin K is lacking.","fail":"INR in cirrhosis does not equal bleeding risk. The liver also loses anticoagulant proteins."},{"title":"Urea cycle","enzyme":"Carbamoyl phosphate synthetase I, ornithine transcarbamylase","detail":"Ammonia from amino acid breakdown is converted to urea in periportal hepatocytes.","fail":"Urea-cycle failure raises ammonia. See the ammonia pathway for cerebral effects."}]},{"id":"lipid","title":"Lipid metabolism","summary":"The liver oxidizes fatty acids, builds triglycerides and cholesterol, and exports lipoproteins.","significance":"Hepatic fat handling decides whether lipid is burned, stored or secreted into blood.","diseases":"MASLD starts with triglyceride accumulation. Alcohol and ischemia also change fatty-acid oxidation.","steps":[{"title":"Fatty acid oxidation","enzyme":"Carnitine palmitoyltransferase, beta-oxidation enzymes","detail":"Mitochondria oxidize fatty acids to acetyl-CoA, which can enter the Krebs cycle or make ketones.","fail":"Impaired oxidation and increased delivery of free fatty acids favor steatosis."},{"title":"Triglyceride synthesis","enzyme":"DGAT","detail":"Excess fatty acids are esterified to triglyceride and stored in lipid droplets.","fail":"Droplets plus lipotoxicity drive ballooning, inflammation and fibrosis in steatohepatitis."},{"title":"Cholesterol metabolism","enzyme":"HMG-CoA reductase, 7α-hydroxylase","detail":"The liver synthesizes cholesterol and is the only organ that can eliminate it as bile acids.","fail":"Cholestasis raises serum cholesterol and disrupts bile-acid dependent absorption of fat."},{"title":"Lipoprotein export","enzyme":"Microsomal triglyceride transfer protein","detail":"VLDL carries triglyceride out of the hepatocyte. HDL metabolism also centers on the liver.","fail":"Blocked VLDL export traps fat in the liver, as in some drugs and nutritional injuries."}]},{"id":"bili","title":"Bilirubin metabolism","summary":"The liver takes up unconjugated bilirubin, conjugates it, and excretes it into bile.","significance":"The pattern of direct and indirect bilirubin separates hemolysis, uptake defects and cholestasis.","diseases":"Gilbert is an uptake/conjugation mild defect. Obstruction and sepsis cause conjugated hyperbilirubinemia.","steps":[{"title":"Heme breakdown","enzyme":"Heme oxygenase, biliverdin reductase","detail":"Senescent red cells release heme. Macrophages form unconjugated bilirubin, bound to albumin in plasma.","fail":"Hemolysis, hematoma and transfusion overload the pathway and raise indirect bilirubin."},{"title":"Hepatic uptake","enzyme":"OATP transporters","detail":"Hepatocytes take up unconjugated bilirubin at the sinusoidal membrane.","fail":"Drugs and Gilbert syndrome can slow uptake or conjugation and cause mild indirect hyperbilirubinemia."},{"title":"Conjugation","enzyme":"UGT1A1","detail":"Glucuronidation makes bilirubin water soluble so it can enter bile.","fail":"UGT1A1 deficiency is Crigler-Najjar. Severe unconjugated bilirubin can injure the newborn brain, not the adult ICU brain in the same way."},{"title":"Biliary excretion","enzyme":"MRP2","detail":"Conjugated bilirubin is secreted into the canaliculus. This is often the rate-limiting step.","fail":"Hepatocellular injury, sepsis and duct obstruction cause conjugated hyperbilirubinemia."},{"title":"Enterohepatic circulation","enzyme":"Bacterial deconjugation in the gut","detail":"Gut bacteria form urobilinogen. Some is reabsorbed. Obstruction makes stools pale and urine dark.","fail":"Antibiotics and ileus can change urobilinogen without meaning the cholestasis has resolved."}]},{"id":"ammonia","title":"Ammonia metabolism","summary":"Periportal hepatocytes convert ammonia to urea. Perivenous hepatocytes scavenge the rest as glutamine.","significance":"Ammonia and other gut-derived toxins drive astrocyte swelling in hepatic encephalopathy.","diseases":"Acute liver failure, cirrhosis with portosystemic shunting, and urea-cycle defects all raise ammonia.","steps":[{"title":"Ammonia production","detail":"Enterocytes generate ammonia from glutamine. Colonic bacteria generate it from urea and protein.","fail":"Gastrointestinal bleeding, constipation, infection and excess protein load increase the ammonia burden."},{"title":"Urea cycle","enzyme":"CPS1, OTC, arginase","detail":"Periportal urea synthesis is the main permanent disposal route for nitrogen.","fail":"Hepatocyte loss or a bypassing shunt lets ammonia reach the systemic circulation."},{"title":"Glutamine synthesis","enzyme":"Glutamine synthetase","detail":"A thin perivenous rim of hepatocytes binds leftover ammonia to glutamate.","fail":"This safety zone is small. Once it is overwhelmed, arterial ammonia rises."},{"title":"Neurotoxicity","detail":"Astrocytes convert ammonia to glutamine. Osmolyte accumulation swells the cell and impairs neurotransmission.","fail":"In acute liver failure this contributes to cerebral edema. In cirrhosis the swelling is usually low-grade but still causes encephalopathy."}]},{"id":"drug","title":"Drug metabolism","summary":"The liver chemically modifies drugs so they can be inactivated or excreted.","significance":"First-pass metabolism, drug interactions and toxic metabolites are daily ICU problems.","diseases":"Paracetamol toxicity is a classic toxic metabolite injury. Cirrhosis changes clearance of many sedatives and beta blockers.","steps":[{"title":"Phase I","enzyme":"CYP450 family","detail":"Oxidation, reduction or hydrolysis exposes a functional group. Activity can rise or fall with inducers and inhibitors.","fail":"CYP2E1 makes NAPQI from paracetamol. Glutathione normally detoxifies it. Overdose depletes glutathione."},{"title":"Phase II","enzyme":"UGT, sulfotransferases, glutathione S-transferases","detail":"Conjugation makes metabolites larger and more water soluble.","fail":"Low glutathione is the reason N-acetylcysteine works in paracetamol injury: it restores the detoxifying conjugate."},{"title":"First-pass metabolism","detail":"Oral drug absorbed from the gut passes through portal blood before the systemic circulation.","fail":"Portosystemic shunts increase bioavailability of high-extraction drugs such as morphine, midazolam and some beta blockers."}]},{"id":"bile","title":"Bile physiology","summary":"Bile acids are made from cholesterol, stored in the gallbladder, and recycled through the ileum.","significance":"Bile acids drive bile flow and intestinal fat absorption, and they signal metabolic pathways via FXR.","diseases":"Cholestasis, bile-acid diarrhea after ileal disease, and duct obstruction all break this circuit.","steps":[{"title":"Bile acid synthesis","enzyme":"CYP7A1","detail":"The classic pathway converts cholesterol to primary bile acids, cholic acid and chenodeoxycholic acid.","fail":"Loss of this route is the only quantitative way the body excretes cholesterol."},{"title":"Secretion","enzyme":"BSEP, MDR3","detail":"Bile acids and phospholipid are pumped into the canaliculus. Osmotic water flow forms bile.","fail":"BSEP or MDR3 failure causes familial cholestasis and, for MDR3, biliary injury from toxic bile."},{"title":"Enterohepatic circulation","detail":"About 95 percent of bile acids are reabsorbed in the terminal ileum and return in portal blood.","fail":"Ileal resection wastes bile acids. The liver cannot always replace the pool, so fat-soluble vitamins fall."}]}],"anatomy":[{"title":"Orientation","focus":"all","body":["The liver sits in the right upper abdomen, under the diaphragm, from the fifth rib toward the right costal margin. The left lobe reaches across the midline.","The reference model below is the liver mesh from the atlas file, shown with the arterial and venous trees. It is one solid organ mesh. It is not divided into Couinaud segments, so segment selection is on the diagram, not pretended on the mesh.","Drag to rotate. Pinch or use the wheel to zoom. Spin and reset sit under the model."]},{"title":"Lobes","focus":"liver","body":["The anatomical right and left lobes are separated on the front by the falciform ligament. That is not the functional divide.","The functional divide is Cantlie's line, from the gallbladder fossa to the inferior vena cava, along the middle hepatic vein. Everything to the right of that line is the functional right lobe.","The caudate lobe is segment I, behind the porta, between the inferior vena cava and the fissure for the ligamentum venosum. The quadrate lobe, on the visceral surface, is part of segment IV."]},{"title":"Couinaud segments","focus":"liver","body":["Couinaud numbered the liver by portal inflow and hepatic venous outflow. Each segment has its own portal pedicle and can be resected.","I is the caudate lobe. II and III are the left lateral superior and inferior segments. IV is the left medial lobe, sometimes split into IVa and IVb. Quadrate lobe belongs here.","V and VIII are the right anterior inferior and superior segments. VI and VII are the right posterior inferior and superior segments.","The right hepatic vein separates V/VIII from VI/VII. The middle hepatic vein separates IV from V/VIII. The left hepatic vein separates II/III from IV."]},{"title":"Portal vein","focus":"veins","body":["The portal vein forms behind the neck of the pancreas from the superior mesenteric and splenic veins. It brings nutrient-rich, partly deoxygenated blood, about three quarters of hepatic blood flow.","At the hilum it divides into right and left branches. The right branch is short. The left branch has a longer horizontal part in the hilum.","The venous mesh in the model is the whole venous tree, not a separately named portal vein. Use it for relationship, and this text for the branch pattern."]},{"title":"Hepatic artery","focus":"arteries","body":["The common hepatic artery usually comes from the celiac trunk, gives the gastroduodenal artery, and continues as the proper hepatic artery to the hilum, where it divides into right and left hepatic arteries.","Replaced or accessory arteries are common. A replaced right hepatic artery from the superior mesenteric artery runs behind the portal vein and bile duct. Surgeons and endoscopists need that variant.","Arterial blood is the smaller share of flow and about half of hepatic oxygen delivery. The arterial mesh in the model is the body arterial tree. The hepatic artery is the branch that enters the hilum."]},{"title":"Hepatic veins and the cava","focus":"veins","body":["Right, middle and left hepatic veins drain into the inferior vena cava just below the diaphragm. They have no valves.","The caudate lobe drains by several small veins straight into the cava. That is why it enlarges and is relatively spared in early Budd-Chiari syndrome.","The middle hepatic vein lies in Cantlie's line and is the functional boundary of right and left lobes."]},{"title":"Biliary tree and gallbladder","focus":"liver","body":["Bile canaliculi form between hepatocytes. Ductules become interlobular ducts, then right and left hepatic ducts, then the common hepatic duct.","The cystic duct from the gallbladder joins the common hepatic duct to form the common bile duct, which runs in the free edge of the lesser omentum, in front of the portal vein and to the right of the hepatic artery.","The common bile duct joins the pancreatic duct at the ampulla of Vater. There is no separate gallbladder mesh in the reference file. Do not look for one."]},{"title":"Lobule, sinusoid, triad","focus":"liver","body":["The classic lobule is a hexagon with a central vein and portal tracts at the corners. The portal triad is a branch of the hepatic artery, a branch of the portal vein, and a bile ductule.","Sinusoids run from the triad toward the central vein. They are lined by fenestrated endothelium. Kupffer cells sit in the lumen. Stellate cells sit in the space of Disse and store vitamin A until injury turns them into scar-forming cells.","Hepatocytes are polarized. Sinusoidal membrane takes up bilirubin and drugs. Canalicular membrane secretes bile. Zone 3, nearest the central vein, is the most hypoxic and the first to die in ischemia and paracetamol toxicity."]}],"segments":[{"id":"II","title":"II left lateral superior","place":"Left of the falciform ligament, above","role":"Left lateral portal pedicle. Resected with III in a left lateral sectionectomy."},{"id":"III","title":"III left lateral inferior","place":"Left of the falciform ligament, below","role":"With II, the part of the left lobe most people mean when they palpate across the midline."},{"id":"IV","title":"IV left medial, quadrate","place":"Between falciform ligament and Cantlie's line","role":"Includes the quadrate lobe on the visceral surface. Can be split into IVa and IVb."},{"id":"I","title":"I caudate","place":"Behind the porta, beside the cava","role":"Portal inflow from both sides. Venous drainage direct to the cava."},{"id":"VIII","title":"VIII right anterior superior","place":"Right lobe, above, next to the middle hepatic vein","role":"Right anterior section, superior."},{"id":"V","title":"V right anterior inferior","place":"Right lobe, below, next to the gallbladder","role":"Right anterior section, inferior. Close to the gallbladder fossa."},{"id":"VII","title":"VII right posterior superior","place":"Right lobe, posterior and superior","role":"Right posterior section. Harder to see from the front."},{"id":"VI","title":"VI right posterior inferior","place":"Right lobe, posterior and inferior","role":"Right posterior section, inferior."}],"invest":[{"title":"Liver function tests","kind":"text","items":["The panel is not one function. Aminotransferases mark injury. Alkaline phosphatase and GGT mark cholestasis. Albumin and INR mark synthesis, on different time scales. Bilirubin marks excretion and, when unconjugated, production or uptake.","Reference ranges vary by laboratory, sex and age. Treat the number against the range printed on that report.","A hepatocellular pattern is a high ALT and AST. A cholestatic pattern is a high alkaline phosphatase out of proportion to the aminotransferases. Mixed sits between them."]},{"title":"AST and ALT","kind":"text","items":["ALT is more specific to liver. AST is also in muscle, heart and red cells. Typical adult upper limits are often near 40 U/L, but the lab's own limit is the one that counts.","AST greater than ALT, both under about 400, suggests alcohol. Values in the thousands suggest toxin, virus or ischemia. Ischemic enzymes halve each day after reperfusion.","The height does not measure remaining function. A falling ALT with a rising INR is deterioration."]},{"title":"ALP and GGT","kind":"text","items":["Alkaline phosphatase rises in cholestasis and also comes from bone, placenta and intestine. GGT rises with cholestasis and with alcohol or enzyme induction, and it helps confirm a liver source of alkaline phosphatase.","An isolated raised GGT is not a liver diagnosis. An alkaline phosphatase that stays high with a dilated duct is obstruction until imaged."]},{"title":"Bilirubin","kind":"text","items":["Unconjugated bilirubin rises with hemolysis, hematoma, Gilbert syndrome and Crigler-Najjar. Conjugated bilirubin rises with hepatocyte injury and with obstruction.","Adult total bilirubin is often under about 1.2 mg/dL. Fractions matter more than the total. Urine bilirubin means the conjugated fraction is spilling.","In cirrhosis a rising bilirubin is a late and serious sign. In pure obstruction it can be extreme while hepatocytes are still working, which is why vitamin K corrects the INR."]},{"title":"Albumin","kind":"text","items":["Made only by hepatocytes. Adult serum albumin is often about 3.5 to 5 g/dL. Half-life is about three weeks, so acute illness does not drop it overnight.","Low albumin also comes from inflammation, dilution, nephrotic loss and gut loss. Do not call every low albumin cirrhosis."]},{"title":"PT and INR","kind":"text","items":["The prothrombin time is sensitive to factor VII. INR standardizes it for warfarin, and it is reused, imperfectly, in liver disease.","A prolonged INR means poor synthesis or vitamin K deficiency. In cirrhosis it does not mean the patient will bleed, because anticoagulant proteins are lost too.","Do not transfuse plasma to beautify the INR before a low-risk paracentesis."]},{"title":"Ammonia","kind":"text","items":["Arterial or free-flowing venous blood, on ice, analyzed at once. A tourniquet and a warm tube raise the result.","A high value supports encephalopathy. A normal value does not exclude it. Do not trend a badly handled sample.","In acute liver failure a high arterial ammonia is one of the markers used when worrying about cerebral edema. In cirrhosis it is not a treatment target by itself."]},{"title":"Viral markers","kind":"text","items":["IgM anti-HAV for acute hepatitis A. HBsAg, IgM anti-HBc and HBV DNA separate acute B, chronic B and immunity. Anti-HBs alone is vaccine immunity.","HCV antibody can be negative in acute infection. Order HCV RNA. Hepatitis D serology only matters if HBsAg is positive. IgM anti-HEV where hepatitis E is possible, including pregnancy."]},{"title":"Autoimmune markers","kind":"text","items":["ANA, smooth-muscle antibody, anti-LKM, anti-SLA and a high IgG support autoimmune hepatitis. AMA supports primary biliary cholangitis.","Antibodies are not the disease. Biopsy and the exclusion of virus still matter. IgG4 is the test that separates a steroid-responsive cholangiopathy from primary sclerosing cholangitis."]},{"title":"Wilson investigations","kind":"text","items":["Ceruloplasmin is often low, and it is also an acute-phase protein, so a normal value does not clear the diagnosis in acute illness.","24-hour urinary copper, slit-lamp examination for Kayser-Fleischer rings, hemolysis markers, and hepatic copper if a biopsy is done. In acute failure, an alkaline phosphatase to bilirubin ratio under 4 and an AST to ALT ratio over 2.2 are published clues."]},{"title":"Iron studies","kind":"text","items":["Transferrin saturation and ferritin screen for hereditary hemochromatosis. Saturation persistently above about 45 percent is the more specific clue. Ferritin is also an acute-phase reactant.","HFE genotyping follows a positive screen. Do not venesect a patient on a ferritin raised only by inflammation."]},{"title":"Alpha-1 antitrypsin","kind":"text","items":["A low level plus a deficient phenotype, classically PiZZ, causes liver disease by retained abnormal protein, and lung disease by lost protection.","The level rises in inflammation, so a borderline value during illness needs a phenotype or genotype, not a shrug."]},{"title":"MELD-Na","kind":"meld","items":[]},{"title":"Child-Pugh","kind":"child","items":[]},{"title":"FIB-4","kind":"fib4","items":[]},{"title":"Maddrey discriminant function","kind":"maddrey","items":[]},{"title":"Lille score","kind":"lille","items":[]},{"title":"CLIF-SOFA","kind":"text","items":["CLIF-SOFA adapts the sequential organ-failure score to cirrhosis. It scores liver, kidney, brain, coagulation, circulation and respiration. CLIF-OF is the simplified 1-to-3 version of those same organs used inside the ACLF grade and the CLIF-C ACLF formula.","Use it to describe organ failure, not to diagnose the liver disease. A high score means the admission has become multiorgan, and transplant or ceiling-of-care decisions should not wait for a prettier bilirubin."]},{"title":"CLIF-C ACLF","kind":"clif","items":[]}],"findings":[{"title":"Normal liver","group":"Ultrasound","points":["Homogeneous parenchyma, smooth capsule, anechoic vessels. This drawing is a map of where to look, not an ultrasound image."],"marks":[{"id":"p","x":150,"y":80,"label":"Parenchyma","text":"Even texture. Portal vein branches have bright walls. Hepatic veins do not."}]},{"title":"Fatty liver","group":"Ultrasound","points":["Bright liver relative to the right kidney, with attenuation of the deep diaphragm. Ultrasound detects fat poorly at mild degrees and does not stage fibrosis."],"marks":[{"id":"f","x":150,"y":78,"label":"Bright liver","text":"Compare with the kidney cortex. A brighter liver suggests steatosis. It is not specific for the cause."}]},{"title":"Cirrhotic liver","group":"Ultrasound","points":["Coarse echo, nodular surface, and often a large caudate lobe. A normal scan does not exclude cirrhosis."],"marks":[{"id":"n","x":168,"y":70,"label":"Nodular surface","text":"The capsule is no longer a smooth line. Look also at the spleen."}]},{"title":"Nodular surface","group":"Ultrasound","points":["Best seen with a high-frequency probe on the anterior surface, or where ascites outlines the capsule."],"marks":[{"id":"c","x":168,"y":58,"label":"Capsule","text":"Ascites makes the nodules obvious. Without fluid, a linear probe helps."}]},{"title":"Ascites","group":"Ultrasound","points":["Anechoic fluid around liver and in the pelvis. Ultrasound finds the pocket for a tap. It does not give a cell count."],"marks":[{"id":"a","x":200,"y":120,"label":"Fluid","text":"Mark depth and the safest window. Avoid the inferior epigastric vessels and scars."}]},{"title":"Portal vein dilatation","group":"Ultrasound","points":["A portal vein wider than about 13 mm supports portal hypertension and does not prove it. A normal diameter does not exclude it."],"marks":[{"id":"pv","x":150,"y":96,"label":"Portal vein","text":"Measure the diameter and confirm flow direction with Doppler."}]},{"title":"Portal vein thrombosis","group":"Ultrasound","points":["Absent color flow and a filling defect. Tumor thrombus enhances and expands the vein. Bland thrombus does not."],"marks":[{"id":"th","x":150,"y":96,"label":"Filling defect","text":"Add contrast CT if tumor invasion or mesenteric extent is possible."}]},{"title":"Splenomegaly","group":"Ultrasound","points":["A long spleen supports portal hypertension in the right context. Hematological disease is the other common cause."],"marks":[{"id":"s","x":78,"y":100,"label":"Spleen","text":"Measure the longest axis. Do not call portal hypertension from the spleen alone."}]},{"title":"Hepatic abscess","group":"Ultrasound","points":["A hypoechoic collection, sometimes with debris. Multiple lesions along ducts suggest a biliary source."],"marks":[{"id":"ab","x":176,"y":84,"label":"Collection","text":"Pyogenic lesions are drained when large. Amebic lesions are usually treated with metronidazole first."}]},{"title":"Liver mass","group":"Ultrasound","points":["Ultrasound finds a lesion. It rarely characterizes it. A mass in cirrhosis needs a multiphase CT or MRI, not a longer ultrasound report."],"marks":[{"id":"m","x":176,"y":80,"label":"Lesion","text":"Size, location by segment if you can, and whether the portal vein is invaded."}]},{"title":"Normal portal flow","group":"Doppler","points":["Hepatopetal, continuous, with respiratory variation. Direction is toward the probe at the porta when the approach is right."],"marks":[{"id":"d1","x":150,"y":96,"label":"Toward the liver","text":"Color and spectral Doppler should agree. A single still frame is not a direction."}]},{"title":"Portal hypertension Doppler","group":"Doppler","points":["Slow flow, loss of respiratory variation, and collaterals. Diameter is supportive only."],"marks":[{"id":"d2","x":150,"y":96,"label":"Slow flow","text":"Look for a recanalized umbilical vein and splenomegaly on the same study."}]},{"title":"Hepatofugal flow","group":"Doppler","points":["Portal flow away from the liver means the vein has become an outflow. It is a late sign, not a requirement for the diagnosis."],"marks":[{"id":"d3","x":150,"y":96,"label":"Reversed","text":"Confirm with spectral Doppler. Reversed flow changes surgical and TIPS planning."}]},{"title":"Portal vein thrombosis Doppler","group":"Doppler","points":["No color and no spectral signal in a vessel you can see. Slow flow can be mistaken for thrombus. Contrast CT settles the argument."],"marks":[{"id":"d4","x":150,"y":96,"label":"No signal","text":"Map the superior mesenteric vein. Ischemia lives there, not in the liver enzymes."}]},{"title":"Hepatic vein Doppler","group":"Doppler","points":["Normal hepatic veins have a multiphasic waveform transmitted from the heart. A flat waveform suggests stiffness or outflow disease."],"marks":[{"id":"hv","x":188,"y":64,"label":"Hepatic vein","text":"Loss of pulsatility is not specific for cirrhosis. Right-heart disease changes the same waveform."}]},{"title":"Budd-Chiari Doppler","group":"Doppler","points":["Absent hepatic-vein flow, intrahepatic collaterals, and a large caudate lobe. This is the scan that must not be skipped in painful ascites with a big liver."],"marks":[{"id":"bc","x":188,"y":64,"label":"No hepatic vein","text":"If Doppler is positive, the next call is interventional radiology, not another week of diuretics."}]},{"title":"CT cirrhosis","group":"CT","points":["Nodular contour, enlarged caudate, wide fissures, and an irregular capsule. CT is not a fibrosis stage."],"marks":[{"id":"ct1","x":168,"y":74,"label":"Contour","text":"Educational diagram. Not a CT slice. Arterial and venous phases are still required if a mass is the question."}]},{"title":"CT portal hypertension","group":"CT","points":["Splenomegaly, ascites, and a patent portal vein with collaterals. Varices are the clinical point of the collaterals."],"marks":[{"id":"ct2","x":210,"y":48,"label":"Collaterals","text":"Paraesophageal and recanalized umbilical veins are the ones to name in the report you request."}]},{"title":"Portosystemic collaterals","group":"CT","points":["Left gastric, esophageal, splenorenal, and paraumbilical veins. A large gastrorenal shunt matters for fundal varices and for balloon-occluded obliteration."],"marks":[{"id":"ct3","x":120,"y":46,"label":"Shunt","text":"Name the shunt. It decides glue, TIPS, or BRTO. A diagram cannot measure it."}]},{"title":"CT abscess","group":"CT","points":["Rim-enhancing fluid collection. Clustered lesions suggest cholangitis. Do not call every low-density lesion an abscess."],"marks":[{"id":"ct4","x":176,"y":84,"label":"Rim","text":"Pair the image with fever and cultures. A necrotic tumor can look similar."}]},{"title":"CT hepatocellular carcinoma","group":"CT","points":["In a high-risk liver, arterial hyperenhancement and later washout, at least 1 cm, is the imaging diagnosis. This page does not show a fabricated scan. It states the rule."],"marks":[{"id":"ct5","x":176,"y":80,"label":"Washout","text":"Nonrim arterial enhancement plus washout. A targetoid lesion is a different tumor until proven otherwise."}]},{"title":"CT portal vein thrombosis","group":"CT","points":["A filling defect on the portal venous phase. Enhancement inside the thrombus means tumor. Extent into the mesenteric vein is the ischemic question."],"marks":[{"id":"ct6","x":150,"y":96,"label":"Defect","text":"Ask for a multiphase study so bland thrombus is not confused with tumor thrombus."}]},{"title":"MRCP obstruction","group":"MRI","points":["Magnetic resonance cholangiography shows the level of a block without cannulating the duct. It does not drain it."],"marks":[{"id":"mr1","x":196,"y":108,"label":"Cut-off","text":"A distal block dilates the duct above. A hilar block may isolate sectors."}]},{"title":"Biliary stricture","group":"MRI","points":["A smooth short stricture may be benign. A long shouldered stricture is suspicious. Sampling, not the picture, diagnoses cancer."],"marks":[{"id":"mr2","x":196,"y":108,"label":"Stricture","text":"Primary sclerosing cholangitis produces many short strictures. One dominant stricture still needs sampling."}]},{"title":"Primary sclerosing cholangitis","group":"MRI","points":["Beading: multifocal short strictures and mildly dilated segments between them. MRCP is the diagnostic test. ERCP is for intervention."],"marks":[{"id":"mr3","x":170,"y":90,"label":"Beading","text":"Intrahepatic and extrahepatic ducts can both be involved. A normal cholangiogram with compatible histology is small-duct disease."}]},{"title":"Hepatic lesions on MRI","group":"MRI","points":["The same arterial and washout rules as CT, often with higher sensitivity. Hepatobiliary contrast adds retention in functioning hepatocytes. Cysts, hemangiomas and focal fat have their own patterns and should not be called cancer."],"marks":[{"id":"mr4","x":176,"y":80,"label":"Sequence","text":"Read the phase, not a single image. This lab does not invent an MRI to stand in for that sequence."}]}],"procedures":[{"title":"Diagnostic paracentesis","steps":[{"title":"Indication","text":"New ascites, every hospital admission with ascites, and any fever, pain or encephalopathy that might be infected fluid.","stage":0},{"title":"Cautions","text":"A surgical scar, an obvious abdominal-wall infection, and clinically evident fibrinolysis are reasons to move the site or to ask for help. INR and platelet count alone are not a reason to cancel a diagnostic tap.","stage":0},{"title":"Anatomy","text":"Left lower quadrant, lateral to the rectus sheath, about 2 to 3 cm above and medial to the anterior superior iliac spine. The abdominal wall is thinner there and the inferior epigastric vessels are avoided.","stage":1},{"title":"Equipment","text":"Ultrasound, antiseptic, lidocaine, a 18 to 22 gauge needle, syringes, and blood-culture bottles.","stage":1},{"title":"Position","text":"Supine, with the side of the tap slightly down if that deepens the pocket.","stage":1},{"title":"Ultrasound","text":"Confirm a pocket deep enough, note the depth, and stay away from bowel and the bladder.","stage":1},{"title":"Needle","text":"Anesthetize, then advance in a short Z-track while aspirating. Stop when fluid returns.","stage":2},{"title":"Samples","text":"Cell count immediately. Inoculate culture bottles at the bedside. Albumin and protein on the same tap.","stage":3},{"title":"Complications","text":"Leak, abdominal-wall hematoma, and, rarely, bowel puncture. A leak is treated by a further small drain of fluid and a pressure dressing, not by a suture as a first reflex.","stage":3},{"title":"Aftercare","text":"The patient can sit up. Watch the site. Do not wait overnight to read the neutrophil count.","stage":3}]},{"title":"Large-volume paracentesis","steps":[{"title":"Indication","text":"Tense or refractory ascites causing pain or breathlessness.","stage":0},{"title":"Cautions","text":"Ongoing untreated peritonitis is not an absolute ban, but take the diagnostic sample first. Shock and a surgical abdomen are different problems.","stage":0},{"title":"Albumin plan","text":"If you expect to remove more than 5 liters, give albumin, 6 to 8 grams per liter removed. EASL texts commonly use 8 grams per liter.","stage":1},{"title":"Equipment","text":"A catheter with side holes, tubing, and a controlled drainage bag. Not an unattended open cannula.","stage":1},{"title":"Drain","text":"The needle enters the marked pocket. Fluid should be clear or faintly yellow unless you already know it is infected.","stage":2},{"title":"Volume","text":"Drain to dryness if the patient tolerates it, over one to three hours. Stop for pain, cough, or a falling blood pressure.","stage":2},{"title":"Albumin","text":"Give the albumin during or just after the drain. Saline is not a substitute. It is the wrong fluid for this physiology.","stage":3},{"title":"Complications","text":"Post-paracentesis circulatory dysfunction, leak, and bleeding. Kidney injury after a large tap without albumin is the one you can prevent.","stage":3},{"title":"Aftercare","text":"Blood pressure and urine output. Restart diuretics the next day unless the kidneys have protested.","stage":3}]},{"title":"Ultrasound-guided tap","steps":[{"title":"Why ultrasound","text":"It is the default, not a rescue. It finds a safe pocket when the examination is hard and it shows bowel in the way.","stage":0},{"title":"Setup","text":"Probe cover if you are puncturing under real-time view. Sterile gel. Do not mark a site and then tap somewhere more convenient.","stage":1},{"title":"Mark","text":"Note depth in centimeters. If the pocket is under 3 cm once you account for the wall, move.","stage":1},{"title":"Real time","text":"Watch the needle enter fluid. If you only marked the skin, recheck the mark after the patient moves.","stage":2},{"title":"Stop rules","text":"Bowel in the window, a vessel in the wall, or a dry pass at the measured depth. Do not convert a dry pass into a deeper hopeful one.","stage":3}]},{"title":"Upper endoscopy","steps":[{"title":"Indication","text":"Suspected variceal bleed, within 12 hours after resuscitation. Also surveillance when Baveno says the patient still needs it.","stage":0},{"title":"Cautions","text":"An unprotected airway in massive hematemesis or deep encephalopathy. Intubate first. The intubation film is in the management chapters that discuss this.","stage":0},{"title":"Preparation","text":"Vasoactive drug running, antibiotic given, blood available, and erythromycin if the QT interval allows, 30 to 120 minutes before.","stage":1},{"title":"Position","text":"Left lateral if the airway is safe. Supine if intubated.","stage":1},{"title":"Passage","text":"The scope crosses the cricopharynx, inspects the esophagus on the way out as well as in, and does not stop at the first clot.","stage":2},{"title":"Findings","text":"Grade esophageal varices, look for a white nipple or active spurting, then inspect the fundus in retroflexion for gastric varices.","stage":2},{"title":"Complications","text":"Aspiration, perforation, and a banding ulcer days later.","stage":3},{"title":"Aftercare","text":"Continue the vasoactive drug for two to five days. A proton-pump inhibitor does not replace banding. It may help the ulcer after bands.","stage":3}]},{"title":"Variceal band ligation","steps":[{"title":"Target","text":"Esophageal varices, and GOV1 that are a continuation of them. Not a large fundal varix.","stage":0},{"title":"Device","text":"A multiband ligator on the scope tip. Count the bands before you start.","stage":1},{"title":"Suction","text":"Suction the varix into the cap until a red-out, then fire. The band must sit on varix, not on a random fold.","stage":2},{"title":"Sequence","text":"Start at the gastroesophageal junction and move up. Band the bleeding point first if you can see it.","stage":2},{"title":"Fundal warning","text":"Do not apply this technique to an isolated fundal varix. Glue, coil, TIPS or BRTO belong there.","stage":3},{"title":"Aftercare","text":"Repeat sessions until eradication, then surveillance. Warn the patient about a soft diet and chest pain from the ulcers.","stage":3}]},{"title":"TIPS","steps":[{"title":"Indication","text":"Salvage of uncontrolled variceal bleeding, early pre-emptive TIPS in high-risk bleed, and selected refractory ascites.","stage":0},{"title":"Cautions","text":"Severe heart failure, severe pulmonary hypertension, uncontrolled sepsis, and a bilirubin or encephalopathy burden that the unit considers prohibitive. These thresholds are center-specific. Do not invent a single cutoff.","stage":0},{"title":"Anatomy","text":"A tract is made from a hepatic vein, usually the right, into a portal vein branch, and lined with a covered stent.","stage":1},{"title":"Path","text":"Jugular access, hepatic vein catheterization, puncture into the portal vein, pressure measurement, then stent deployment.","stage":2},{"title":"Pressure","text":"The aim in bleeding is to drop the portal-pressure gradient, commonly toward under 12 mmHg. The exact target is set by the operator and the indication.","stage":2},{"title":"Complications","text":"Encephalopathy, heart failure from the new preload, bleeding from the puncture, and stenosis later.","stage":3},{"title":"Aftercare","text":"Doppler surveillance of the stent. Lactulose if encephalopathy appears. Anticoagulation is not automatic.","stage":3}]},{"title":"Percutaneous liver biopsy","steps":[{"title":"Indication","text":"Histology that will change treatment, when blood tests and imaging have not answered the question.","stage":0},{"title":"Cautions","text":"Uncooperative patient, no safe window, biliary dilatation, and a coagulation state the operator will not accept. Ascites makes a percutaneous pass harder. Consider the transjugular route.","stage":0},{"title":"Site","text":"Right lobe, mid-axillary line, on expiration, below the costophrenic recess. Ultrasound should choose the interspace.","stage":1},{"title":"Pass","text":"Local anesthetic to the capsule. A core needle fires on a breath hold. One pass is the aim. More passes raise bleeding.","stage":2},{"title":"Complications","text":"Pain, bleeding, hemobilia, and puncture of another organ. Bleeding is usually in the first hours.","stage":3},{"title":"Aftercare","text":"Same-side down for a period according to local practice, pulse and blood pressure, and a low threshold for imaging if pain worsens.","stage":3}]},{"title":"Transjugular liver biopsy","steps":[{"title":"Indication","text":"Need for histology when coagulopathy, ascites, or a failed percutaneous attempt makes the capsule unsafe, and when hepatic pressures are wanted at the same time.","stage":0},{"title":"Access","text":"Right internal jugular vein, through the right atrium, into a hepatic vein.","stage":1},{"title":"Biopsy","text":"The needle fires inside the liver toward the parenchyma, not through the capsule as the intended path. Contrast confirms position.","stage":2},{"title":"Pressures","text":"Wedged and free hepatic venous pressures give the gradient if the disease is sinusoidal.","stage":2},{"title":"Complications","text":"Capsule perforation still happens. Neck hematoma and arrhythmia occur. Samples are smaller than a good percutaneous core.","stage":3}]},{"title":"ERCP","steps":[{"title":"Indication","text":"Therapy of a stone, a dominant stricture, or cholangitis. Diagnosis alone belongs to MRCP.","stage":0},{"title":"Cautions","text":"Uncorrected coagulopathy for a sphincterotomy, and an altered anatomy that the scope cannot reach. An
