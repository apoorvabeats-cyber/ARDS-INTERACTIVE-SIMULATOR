<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111a">
<title>Neuroimaging workstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Figtree:wght@460;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111a;--fg:#e7f1f4;--muted:#93a8b3;--line:rgba(127,212,230,.28);--cyan:#7fd4e6;--warm:#e2b48a;--green:#3ee0a0;--card:rgba(10,22,32,.92);--bad:#e07a68}
*{box-sizing:border-box}
html,body{margin:0;background:
  radial-gradient(1000px 420px at 8% -10%, rgba(127,212,230,.08), transparent 50%),
  var(--bg);color:var(--fg);font-family:Figtree,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 0}
header a.back{color:var(--fg);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(12,24,34,.92);white-space:nowrap}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:clamp(26px,6vw,40px);letter-spacing:-.03em;margin:0;line-height:1.05}
h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:clamp(22px,4vw,30px);letter-spacing:-.03em;margin:0 0 8px}
.kicker{margin:0 0 4px;color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
main{padding:8px 14px 48px}
.lead{color:#d5e4ea;line-height:1.5;font-size:16px;margin:8px 0}
.note{color:var(--muted);font-size:13px;line-height:1.45}
.grid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card,button.opt,button.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;min-height:52px;color:inherit}
.card b,button.opt b{display:block;font-weight:600}
.card span,button.opt span{display:block;color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button.mode{min-height:72px}
button.mode b{display:block}
button.opt.on{border-color:var(--cyan)}
button.opt.good{border-color:var(--green);color:var(--green)}
button.opt.bad{border-color:var(--bad)}
.viewer{margin:10px 0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#05080c}
svg.film{width:100%;height:auto;display:block;touch-action:manipulation;background:#05080c}
svg.film .side{fill:#c5d5de;font:600 15px Figtree,sans-serif}
svg.film .scale{fill:#93a8b3;font:11px Figtree,sans-serif}
svg.film .tag{fill:#d5e4ea;font:600 12px Figtree,sans-serif}
svg.film .hit{pointer-events:none}
svg.film.live .hit{pointer-events:all;cursor:pointer}
svg.film .hit.found{fill:rgba(62,224,160,.22);stroke:#3ee0a0;stroke-width:2}
svg.film .hit.reveal{fill:rgba(226,180,138,.18);stroke:#e2b48a;stroke-width:2;stroke-dasharray:5 4}
svg .ov[hidden]{display:none}
figcaption{padding:8px 12px 10px;color:var(--muted);font-size:12px;letter-spacing:.02em}
.ask{font-size:17px;line-height:1.4;margin:12px 0 8px}
.fb{border-radius:14px;padding:12px 14px;line-height:1.45;margin:10px 0;border:1px solid var(--line)}
.fb.ok{border-color:var(--green)}
.fb.no{border-color:var(--warm)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row button,button.go{border:1px solid var(--line);background:#0c1a24;border-radius:999px;min-height:44px;padding:0 16px}
button.go:disabled{opacity:.4}
.nih{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.nih label{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:44px}
.nih label.bad{border-color:var(--bad)}
.nih label.good{border-color:var(--green)}
.nih input{width:64px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:#07111a;text-align:center}
.nih .max{color:var(--muted);font-size:12px}
.steps{display:flex;gap:6px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}
.steps button{flex:0 0 auto;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 12px}
.steps button.on{background:var(--cyan);color:#07111a;border-color:var(--cyan)}
.steps button:disabled{opacity:.35}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair button.shot{padding:0;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#05080c;text-align:left}
.pair button.shot.good{border-color:var(--green)}
.pair button.shot.bad{border-color:var(--bad)}
.pair button.shot span{display:block;padding:8px 10px 10px;color:var(--muted);font-size:12px}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.layers button{border:1px solid var(--line);background:#0c1a24;border-radius:999px;min-height:40px;padding:0 12px}
.layers button.on{border-color:var(--cyan);color:#07111a;background:var(--cyan)}
.warn{border-left:3px solid var(--warm);padding-left:10px}
.score{font-variant-numeric:tabular-nums}
@media(min-width:840px){
  header,main{padding-left:28px;padding-right:28px}
  .viewer{max-width:640px}
}
</style>
</head>
<body>
<header>
  <div><p class="kicker">Critical care · brain</p><h1>Neuroimaging workstation</h1></div>
  <a class="back" id="toplink" href="index.html?lab=brain" target="_top">Learning lab</a>
</header>
<main id="app"></main>
<script>
(function(){
"use strict";
var MM = 0.5;
var app = document.getElementById("app");
var state = {route:"home", step:0, misses:0, locked:false, reveal:false, ok:false, pick:null, marks:{}, feedback:"", cleared:loadCleared(), stroke:null, compare:null, overlay:null, challenge:null};

function loadCleared(){
  try { return JSON.parse(localStorage.getItem("neuro-workstation-cleared") || "{}"); }
  catch (err) { return {}; }
}
function saveCleared(){
  try { localStorage.setItem("neuro-workstation-cleared", JSON.stringify(state.cleared)); }
  catch (err) {}
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    return "&" + "quot;";
  });
}
function resetStep(){
  state.step = 0;
  state.misses = 0;
  state.locked = false;
  state.reveal = false;
  state.ok = false;
  state.pick = null;
  state.marks = {};
  state.feedback = "";
}
function go(route){
  if (location.hash === "#" + route) enter(route);
  else location.hash = route;
}
function enter(route){
  state.route = route || "home";
  resetStep();
  if (route === "stroke") state.stroke = {stage:0, log:[]};
  if (route === "compare") state.compare = {i:0, score:0, answered:false};
  if (route === "overlay") state.overlay = {i:0, on:{}};
  if (route === "challenge") state.challenge = {order:shuffle(CASES.map(function(c){ return c.id; })), i:0, part:0, score:0, done:false, log:[]};
  render();
}
function shuffle(list){
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function boneDefs(id){
  return '<defs><radialGradient id="br'+id+'" cx="48%" cy="42%" r="68%"><stop offset="0" stop-color="#72787c"/><stop offset="1" stop-color="#3c4246"/></radialGradient><linearGradient id="bn'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#b7b1a6"/></linearGradient><filter id="gr'+id+'"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0.22 0"/></filter></defs>';
}
function liveClass(){
  var step = activeStep();
  return step && (step.kind === "click" || step.kind === "marks") ? " live" : "";
}
function ctOpen(id, label){
  return '<svg class="film'+liveClass()+'" viewBox="0 0 400 420" role="img" aria-label="'+esc(label)+'">'+boneDefs(id)+
    '<rect width="400" height="420" fill="#05080c"/>'+
    '<ellipse cx="200" cy="196" rx="178" ry="184" fill="#241f1c"/>'+
    '<ellipse class="hit" data-hit="skull" data-name="the skull" cx="200" cy="196" rx="164" ry="170" fill="url(#bn'+id+')"/>'+
    '<ellipse cx="200" cy="200" rx="136" ry="144" fill="url(#br'+id+')"/>'+
    '<ellipse cx="200" cy="200" rx="136" ry="144" fill="#000" opacity=".28" filter="url(#gr'+id+')"/>'+
    '<ellipse cx="200" cy="200" rx="128" ry="134" fill="none" stroke="#8b9296" stroke-width="9" opacity=".45"/>'+
    '<path d="M200 58 v34 M200 318 v28" stroke="#e4dfd6" stroke-width="2" opacity=".8"/>'+
    '<text class="side" x="18" y="28">R</text><text class="side" x="382" y="28" text-anchor="end">L</text>';
}
function ctClose(){
  return '<g class="scale"><line x1="22" y1="396" x2="42" y2="396" stroke="#93a8b3" stroke-width="1.5"/>'+
    '<line x1="22" y1="391" x2="22" y2="401" stroke="#93a8b3"/><line x1="42" y1="391" x2="42" y2="401" stroke="#93a8b3"/>'+
    '<text x="48" y="400">10 mm</text></g></svg>';
}
function sulci(side){
  var west = '<g fill="none" stroke="#14181c" stroke-width="2.3" stroke-linecap="round"><path d="M96 146 q18 6 10 22"/><path d="M88 184 q20 4 8 20"/><path d="M104 224 q16 8 6 18"/><path d="M122 116 q14 10 8 18"/><path d="M78 208 q12 12 4 16"/><path d="M118 250 q10 8 2 14"/></g>';
  var east = '<g fill="none" stroke="#14181c" stroke-width="2.3" stroke-linecap="round"><path d="M304 146 q-18 6 -10 22"/><path d="M312 184 q-20 4 -8 20"/><path d="M296 224 q-16 8 -6 18"/><path d="M278 116 q-14 10 -8 18"/><path d="M322 208 q-12 12 -4 16"/><path d="M282 250 q-10 8 -2 14"/></g>';
  if (side === "west") return west;
  if (side === "east") return east;
  if (side === "none") return "";
  return west + east;
}
function sylvian(){
  return '<path d="M118 196 q28 16 48 6" fill="none" stroke="#12161a" stroke-width="3" stroke-linecap="round"/>'+
    '<path d="M282 196 q-28 16 -48 6" fill="none" stroke="#12161a" stroke-width="3" stroke-linecap="round"/>';
}
function ventsNormal(){
  return '<ellipse cx="168" cy="176" rx="13" ry="9" transform="rotate(-16 168 176)" fill="#101418"/>'+
    '<ellipse cx="232" cy="176" rx="13" ry="9" transform="rotate(16 232 176)" fill="#101418"/>'+
    '<ellipse cx="200" cy="196" rx="3.5" ry="9" fill="#101418"/>';
}
function scaleNote(){ return ""; }
function hitEll(id, name, cx, cy, rx, ry){
  return '<ellipse class="'+hitClass(id)+'" data-hit="'+id+'" data-name="'+esc(name)+'" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="rgba(255,255,255,.012)"/>';
}
function hitPath(id, name, d){
  return '<path class="'+hitClass(id)+'" data-hit="'+id+'" data-name="'+esc(name)+'" d="'+d+'" fill="rgba(255,255,255,.012)"/>';
}
function hitClass(id){
  var step = activeStep();
  var cls = "hit";
  if (state.marks && state.marks[id]) cls += " found";
  if (state.reveal && step) {
    if (step.kind === "click" && step.target === id) cls += " reveal";
    if (step.kind === "marks" && step.targets.indexOf(id) !== -1 && !state.marks[id]) cls += " reveal";
  }
  return cls;
}
function catcher(){
  return '<ellipse class="hit" data-hit="brain" data-name="brain that is not the target" cx="200" cy="200" rx="130" ry="136" fill="rgba(255,255,255,.012)"/>';
}

function plateNormal(){
  return ctOpen("n", "Normal non-contrast CT, schematic") + sulci("all") + sylvian() + ventsNormal() +
    '<ellipse cx="156" cy="196" rx="16" ry="12" fill="#5a6166"/>'+
    '<ellipse cx="244" cy="196" rx="16" ry="12" fill="#5a6166"/>'+
    catcher() + ctClose();
}
function clotArt(){
  return '<ellipse cx="250" cy="188" rx="39" ry="30" fill="#f3f1ea"/>'+
    '<ellipse cx="256" cy="184" rx="14" ry="9" fill="#fff" opacity=".35"/>';
}
function ichVents(){
  return '<ellipse cx="156" cy="178" rx="14" ry="10" transform="rotate(-16 156 178)" fill="#101418"/>'+
    '<ellipse cx="214" cy="170" rx="7" ry="3.2" transform="rotate(12 214 170)" fill="#101418"/>'+
    '<path d="M186 154 v62" stroke="#c9c3bc" stroke-width="2"/>'+
    '<ellipse cx="186" cy="198" rx="3" ry="8" fill="#101418"/>';
}
function ambient(narrowEast){
  return '<ellipse cx="176" cy="268" rx="16" ry="7" fill="#12161a"/>'+
    '<ellipse cx="226" cy="270" rx="'+(narrowEast?7:16)+'" ry="'+(narrowEast?3:7)+'" fill="#12161a"/>'+
    '<ellipse cx="200" cy="274" rx="14" ry="12" fill="#5c584f"/>';
}
function plateIch(caliper){
  var caps = caliper
    ? '<line x1="211" y1="188" x2="289" y2="188" stroke="#7fd4e6" stroke-width="1.4"/><text class="tag" x="214" y="180">A 4 cm</text>'+
      '<line x1="250" y1="158" x2="250" y2="218" stroke="#e2b48a" stroke-width="1.4"/><text class="tag" x="256" y="208">B 3 cm</text>'
    : "";
  return ctOpen(caliper ? "ic" : "ih", "Non-contrast CT, left basal ganglia hemorrhage, schematic") +
    sulci("west") + sylvian() + ichVents() + ambient(true) + clotArt() + caps +
    catcher() +
    hitEll("sulci", "the cortex over the clot, where the sulci are gone", 300, 168, 36, 48) +
    hitEll("horn", "the compressed frontal horn", 214, 170, 22, 16) +
    hitEll("septum", "the septum pellucidum", 186, 184, 14, 36) +
    hitEll("clot", "the bright collection", 250, 188, 48, 40) +
    ctClose();
}
function plateEarly(){
  return ctOpen("ea", "Non-contrast CT, early left middle cerebral ischemia, schematic") +
    sulci("all") + sylvian() + ventsNormal() +
    '<path d="M232 164 q36 6 30 46 q-28 10 -40 -2 z" fill="#3a4044"/>'+
    '<path d="M248 176 q22 4 16 24" fill="none" stroke="#2a2e32" stroke-width="6" stroke-linecap="round"/>'+
    catcher() + hitEll("insula", "the insula", 256, 186, 36, 32) + ctClose();
}
function plateEstablished(){
  return ctOpen("es", "Non-contrast CT, established left middle cerebral infarct, schematic") +
    sulci("west") +
    '<path d="M210 120 Q340 150 328 240 Q300 300 230 270 Q200 210 210 120 Z" fill="#2e3438"/>'+
    ventsNormal() + catcher() + hitEll("infarct", "the dark territory", 270, 190, 55, 60) + ctClose();
}
function plateHt(){
  return ctOpen("ht", "Non-contrast CT, hemorrhagic transformation, schematic") +
    sulci("west") +
    '<path d="M210 120 Q340 150 328 240 Q300 300 230 270 Q200 210 210 120 Z" fill="#2e3438"/>'+
    '<ellipse cx="268" cy="196" rx="26" ry="20" fill="#f3f1ea"/>'+
    catcher() + hitEll("bleed", "blood inside the infarct", 268, 196, 36, 30) + ctClose();
}
function plateEdh(){
  return ctOpen("ed", "Non-contrast CT, right temporal extradural hematoma, schematic") +
    sulci("all") + sylvian() + ventsNormal() +
    '<path d="M62 168 C78 160 96 168 100 196 C96 230 76 246 62 236 C84 214 86 186 62 168 Z" fill="#f3f1ea"/>'+
    '<path d="M58 188 l10 16" stroke="#1a1c1e" stroke-width="2"/>'+
    '<path d="M70 150 l8 -16 M70 250 l6 16" stroke="#9aa0a4" stroke-width="1.2" opacity=".7"/>'+
    catcher() + hitPath("edh", "the lens-shaped collection", "M62 168 C78 160 96 168 100 196 C96 230 76 246 62 236 C84 214 86 186 62 168 Z") + ctClose();
}
function plateSdh(){
  return ctOpen("sd", "Non-contrast CT, left acute subdural hematoma, schematic") +
    sulci("west") + sylvian() +
    '<ellipse cx="176" cy="180" rx="12" ry="9" fill="#101418"/>'+
    '<ellipse cx="210" cy="176" rx="6" ry="3" fill="#101418"/>'+
    '<path d="M186 160 v50" stroke="#c9c3bc" stroke-width="2"/>'+
    '<path d="M300 96 C338 150 336 270 296 328 C324 260 326 150 300 96 Z" fill="#f3f1ea"/>'+
    catcher() + hitPath("sdh", "the crescent over the hemisphere", "M300 96 C338 150 336 270 296 328 C324 260 326 150 300 96 Z") + ctClose();
}
function plateTbi(){
  return ctOpen("tb", "Non-contrast CT, extradural, subdural and contusion, schematic") +
    sulci("west") +
    '<path d="M62 168 C78 160 96 168 100 196 C96 230 76 246 62 236 C84 214 86 186 62 168 Z" fill="#f3f1ea"/>'+
    '<path d="M58 188 l10 16" stroke="#1a1c1e" stroke-width="2"/>'+
    '<path d="M300 108 C332 160 328 280 298 324 C322 270 324 160 300 108 Z" fill="#f3f1ea"/>'+
    '<ellipse cx="132" cy="128" rx="8" ry="6" fill="#f3f1ea"/><ellipse cx="146" cy="138" rx="6" ry="5" fill="#e7e4dc"/><ellipse cx="124" cy="140" rx="5" ry="4" fill="#f7f5f0"/>'+
    ventsNormal() + catcher() +
    hitPath("edh", "the lens under the temporal bone", "M62 168 C78 160 96 168 100 196 C96 230 76 246 62 236 C84 214 86 186 62 168 Z") +
    hitPath("sdh", "the crescent", "M300 108 C332 160 328 280 298 324 C322 270 324 160 300 108 Z") +
    hitEll("iph", "the bruise inside the frontal lobe", 136, 134, 28, 24) +
    ctClose();
}
function plateHydro(){
  return ctOpen("hy", "Non-contrast CT, enlarged ventricles, schematic") +
    sulci("all") +
    '<ellipse cx="158" cy="168" rx="28" ry="20" fill="#101418"/>'+
    '<ellipse cx="242" cy="168" rx="28" ry="20" fill="#101418"/>'+
    '<ellipse cx="200" cy="206" rx="9" ry="18" fill="#101418"/>'+
    '<ellipse cx="142" cy="248" rx="10" ry="6" fill="#101418"/>'+
    '<ellipse cx="258" cy="248" rx="10" ry="6" fill="#101418"/>'+
    '<ellipse cx="158" cy="168" rx="36" ry="28" fill="#1c2428" opacity=".45"/>'+
    '<ellipse cx="242" cy="168" rx="36" ry="28" fill="#1c2428" opacity=".45"/>'+
    catcher() + hitEll("vent", "the enlarged lateral ventricle", 200, 180, 78, 48) + ctClose();
}
function plateEdema(){
  return ctOpen("oe", "Non-contrast CT, swollen hemisphere with herniation, schematic") +
    sulci("east") +
    '<ellipse cx="214" cy="176" rx="12" ry="8" fill="#101418"/>'+
    '<ellipse cx="168" cy="174" rx="5" ry="2.4" fill="#101418"/>'+
    '<path d="M214 156 v58" stroke="#c9c3bc" stroke-width="2"/>'+
    '<ellipse cx="168" cy="270" rx="5" ry="2.5" fill="#12161a"/>'+
    '<ellipse cx="230" cy="268" rx="16" ry="7" fill="#12161a"/>'+
    '<ellipse cx="198" cy="276" rx="13" ry="11" fill="#5c584f"/>'+
    '<path d="M150 250 q18 16 28 4" fill="none" stroke="#e2b48a" stroke-width="1.6" opacity=".0"/>'+
    catcher() +
    hitEll("sulci", "the effaced sulci", 96, 170, 40, 55) +
    hitEll("horn", "the slit-like frontal horn", 168, 174, 22, 16) +
    hitEll("cistern", "the effaced ambient cistern", 160, 268, 28, 20) +
    ctClose();
}
function plateCvt(){
  return ctOpen("cv", "CT venogram, empty delta, schematic") +
    sulci("all") + ventsNormal() +
    '<path d="M200 312 L176 352 L224 352 Z" fill="#f3f1ea"/>'+
    '<path d="M200 322 L186 346 L214 346 Z" fill="#2a3034"/>'+
    catcher() + hitPath("sinus", "the superior sagittal sinus", "M200 312 L176 352 L224 352 Z") + ctClose();
}
function plateMrv(){
  return '<svg class="film'+liveClass()+'" viewBox="0 0 400 420" role="img" aria-label="MR venogram, schematic, missing left transverse sinus">'+
    '<rect width="400" height="420" fill="#05080c"/>'+
    '<text class="side" x="18" y="28">R</text><text class="side" x="382" y="28" text-anchor="end">L</text>'+
    '<path d="M70 250 C70 80 330 80 330 250" fill="none" stroke="#e7eef2" stroke-width="8" stroke-linecap="round"/>'+
    '<path d="M200 250 v40" stroke="#e7eef2" stroke-width="8"/>'+
    '<path d="M200 290 C150 300 90 300 60 330" fill="none" stroke="#e7eef2" stroke-width="8" stroke-linecap="round"/>'+
    '<text class="tag" x="48" y="360">flow</text>'+
    catcher().replace('cx="200" cy="200" rx="130" ry="136"', 'cx="200" cy="210" rx="160" ry="150"') +
    hitEll("transverse", "where the left transverse sinus should fill", 300, 300, 55, 36) +
    "</svg>";
}
function platePres(){
  return '<svg class="film'+liveClass()+'" viewBox="0 0 400 420" role="img" aria-label="FLAIR MRI, posterior reversible encephalopathy, schematic">'+
    boneDefs("pr") +
    '<rect width="400" height="420" fill="#070b10"/>'+
    '<ellipse cx="200" cy="200" rx="150" ry="158" fill="#3e464c"/>'+
    '<ellipse cx="200" cy="200" rx="150" ry="158" fill="none" stroke="#1a1e22" stroke-width="8"/>'+
    sulci("all") + ventsNormal() +
    '<path d="M90 250 q40 50 70 20 q-20 30 -70 10 z" fill="#d5dde6" opacity=".92"/>'+
    '<path d="M310 250 q-40 50 -70 20 q20 30 70 10 z" fill="#d5dde6" opacity=".92"/>'+
    '<text class="side" x="18" y="28">R</text><text class="side" x="382" y="28" text-anchor="end">L</text>'+

function activeStep(){
  if (state.route === "challenge") return challengeStep();
  if (state.route === "compare") return compareStep();
  if (state.route === "overlay") return overlayStep();
  if (state.route === "stroke") return strokeStep();
  var station = STATIONS[state.route];
  if (!station) return null;
  return station.steps[state.step] || null;
}
function strokeStep(){
  if (!state.stroke) return null;
  var stage = STROKE[state.stroke.stage];
  if (!stage) return null;
  if (stage.kind === "click" && state.stroke.followOpen) {
    return {kind:"choose", plate:stage.plate, ask:stage.follow.ask, options:stage.follow.options, answer:stage.follow.answer, why:stage.follow.why};
  }
  return stage;
}
function challengeStep(){
  var ch = state.challenge;
  if (!ch || ch.done) return null;
  var c = caseById(ch.order[ch.i]);
  if (ch.part === 0) return {kind:"click", ask:"Where is the abnormality?", plate:c.plate, target:c.click, explain:c.explain, hints:c.hints, caption:c.stem};
  if (ch.part === 1) return {kind:"choose", ask:c.locAsk, plate:c.plate, options:c.loc, answer:c.locAnswer, why:c.locWhy, caption:c.stem};
  if (ch.part === 2) return {kind:"choose", ask:c.mechAsk, plate:c.plate, options:c.mech, answer:c.mechAnswer, why:c.mechWhy, caption:c.stem};
  return {kind:"choose", ask:c.nextAsk, plate:c.plate, options:c.next, answer:c.nextAnswer, why:c.nextWhy, caption:c.stem};
}
function compareStep(){
  var item = COMPARE[state.compare ? state.compare.i : 0];
  if (!item) return null;
  return {kind:"comparepick", ask:item.ask, plates:item.plates, names:item.names, answer:item.answer, why:item.why};
}
function overlayStep(){
  var item = OVERLAY[state.overlay ? state.overlay.i : 0];
  if (!item) return null;
  return {kind:"choose", ask:item.ask, plate:"overlay", options:item.options, answer:item.answer, why:item.why, layer:item.layer};
}
function caseById(id){
  return CASES.filter(function(c){ return c.id === id; })[0];
}

function render(){
  var route = state.route;
  if (!route || route === "home") renderHome();

  else if (route === "compare") renderCompare();
  else if (route === "overlay") renderOverlay();

  else if (STATIONS[route]) renderStation();
  else renderHome();
  bind();
}

  app.innerHTML =
    '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
    '<p class="kicker">Station '+(state.step+1)+" of "+n+"</p><h2>"+esc(station.title)+"</h2>"+
    '<p class="note">'+esc(station.aim)+"</p>"+
    renderStep(step)+
    navRow(state.step > 0, state.locked, state.step === n - 1 ? "Finish" : "Next");
}
function renderStep(step){
  if (!step) return "";
  var html = "";
  if (step.plate) html += figure(step.plate, step.caption);
  if (step.kind === "comparepick") {
    html += '<p class="ask">'+esc(step.ask)+"</p>"+pairHtml(step);
  } else if (step.kind === "nihss") {
    html += nihssHtml(step);
  } else if (step.kind === "multi") {
    html += '<p class="ask">'+esc(step.ask)+"</p>"+multiHtml(step);
  } else if (step.kind === "number") {
    html += '<p class="ask">'+esc(step.ask)+'</p><p class="note">'+esc(step.note)+'</p>'+
      '<div class="row"><input id="num" inputmode="decimal" aria-label="Volume in millilitres" placeholder="mL" style="min-height:44px;border-radius:12px;border:1px solid var(--line);background:#07111a;padding:0 12px;width:8rem">'+
      '<button type="button" class="go" id="check">Check</button></div>';
  } else if (step.kind === "debrief") {
    html += debriefHtml();
  } else {
    html += '<p class="ask">'+esc(step.ask)+"</p>";
    if (step.kind === "marks") html += '<p class="note">Marked '+Object.keys(state.marks).length+" of "+step.targets.length+".</p>";
    if (step.options) html += optionsHtml(step);
  }
  html += feedbackHtml();
  return html;
}
function optionsHtml(step){
  return '<div class="grid">'+step.options.map(function(op){
    return '<button type="button" class="opt '+optClass(op.id, step)+'" data-opt="'+esc(op.id)+'"><b>'+esc(op.t)+"</b></button>";
  }).join("")+"</div>";
}
function optClass(id, step){
  if (!state.locked) return state.pick === id ? "on" : "";
  if (id === step.answer) return "good";
  if (id === state.pick) return "bad";
  return "";
}
function multiHtml(step){
  var picked = state.pick || {};
  return '<div class="grid">'+step.options.map(function(op){
    var cls = "opt";
    if (state.locked) cls += op.on ? " good" : (picked[op.id] ? " bad" : "");
    else if (picked[op.id]) cls += " on";
    return '<button type="button" class="'+cls+'" data-multi="'+esc(op.id)+'"><b>'+esc(op.t)+"</b></button>";
  }).join("")+'</div><div class="row"><button type="button" class="go" id="check">Check</button></div>';
}
function pairHtml(step){
  var cls = ["shot", "shot"];
  if (state.locked) {
    cls[step.answer] += " good";
    if (state.pick !== null && Number(state.pick) !== step.answer) cls[state.pick] += " bad";
  }
  return '<div class="pair">'+step.plates.map(function(pid, i){
    return '<button type="button" class="'+cls[i]+'" data-pick="'+i+'">'+(PLATE[pid]?PLATE[pid]():"")+'<span>'+esc(step.names[i])+"</span></button>";
  }).join("")+"</div>";
}
function nihssHtml(step){
  if (state.stroke && state.stroke.syndromeOpen) {
    return '<p class="ask">NIHSS '+esc(String(step.total))+'.</p><p class="ask">'+esc(step.syndromeAsk)+"</p>"+
      optionsHtml({options:step.syndromeOptions, answer:step.syndrome});
  }
  return '<p class="ask">'+esc(step.ask)+'</p><p class="note">Enter a score for each item. The maximum is written beside the box. Total <b class="score" id="live-total">0</b>.</p>'+
    '<div class="nih">'+step.items.map(function(item, i){
      var flag = "";
      if (state.nihssFlags) flag = state.nihssFlags[i] ? " good" : " bad";
      return '<label class="'+flag+'"><span>'+esc(item[0]+". "+item[1])+' <span class="max">0–'+item[3]+'</span></span>'+
        '<input data-nih="'+i+'" inputmode="numeric" value="'+(state.nihssVals && state.nihssVals[i] != null ? esc(String(state.nihssVals[i])) : "")+'"></label>';
    }).join("")+'</div><div class="row"><button type="button" class="go" id="check">Check the total</button></div>';
}
function feedbackHtml(){
  if (!state.feedback) return "";
  return '<div class="fb '+(state.ok ? "ok" : "no")+'" role="status">'+esc(state.feedback)+"</div>";
}
function navRow(back, nextOn, nextLabel){
  return '<div class="row">'+(back ? '<button type="button" class="go" id="back">Back</button>' : "")+
    '<button type="button" class="go" id="next" '+(nextOn ? "" : "disabled")+">"+esc(nextLabel || "Next")+"</button></div>";
}

function renderStroke(){
  var st = state.stroke;
  var stage = STROKE[st.stage];
  app.innerHTML =
    '<div class="row"><button type="button" class="go" data-go="home">All stations</button>'+
    '<button type="button" class="go" id="restart">Restart pathway</button></div>'+
    '<div class="steps">'+STROKE.map(function(s, i){
      return '<button type="button" data-stage="'+i+'" class="'+(i===st.stage?"on":"")+'" '+(i>st.stage?"disabled":"")+">"+(i+1)+" "+esc(s.title)+"</button>";
    }).join("")+"</div>"+
    '<p class="kicker">Stage '+(st.stage+1)+" of 8 · "+esc(stage.activity)+"</p><h2>"+esc(stage.title)+"</h2>"+
    renderStep(strokeStep())+
    (stage.kind === "debrief" ? "" : navRow(st.stage > 0, state.locked, st.stage === STROKE.length - 2 ? "Debrief" : "Next"));
}
function debriefHtml(){
  var log = state.stroke.log || [];
  var misses = log.filter(function(row){ return !row.ok; });
  var lines = log.map(function(row){
    return "<p><b>"+(row.ok ? "Held. " : "Revise. ")+esc(row.title)+".</b> "+esc(row.text)+"</p>";
  }).join("");
  var clue = misses.length
    ? "The misses above are the debrief. The clues that are easiest to drop are last known well, blood on the CT before a lytic, a large-vessel occlusion that still needs a retrieval plan, and stopping the infusion when he deteriorates."
    : "Nothing in the pathway was missed. The clues that are still worth saying aloud: time starts at last known well, the CT must be free of blood before a lytic, an M1 occlusion is a retrieval as well as a lytic, and deterioration means stop and rescan.";
  return '<p class="lead">'+esc(clue)+"</p>"+lines+
    '<p class="note">Frame: early window, no hemorrhage, left M1, NIHSS 12. Teaching doses, not an order: alteplase 0.9 mg/kg (maximum 90 mg) or, where the pathway uses it, tenecteplase 0.25 mg/kg (maximum 25 mg). Hemorrhagic transformation stops antithrombotics. This is the AHA early-management frame as a teaching case, not a local protocol.</p>';
}

function renderCompare(){
  var item = COMPARE[state.compare.i];
  var last = state.compare.i >= COMPARE.length;
  if (!item) {
    app.innerHTML = '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
      "<h2>Comparison</h2><p class='lead'>"+state.compare.score+" of "+COMPARE.length+" on the first click.</p>"+
      '<div class="row"><button type="button" class="go" data-go="compare">Again</button></div>';
    return;
  }
  app.innerHTML =
    '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
    '<p class="kicker">Pair '+(state.compare.i+1)+" of "+COMPARE.length+"</p><h2>Compare</h2>"+
    renderStep(compareStep())+
    navRow(false, state.locked, state.compare.i === COMPARE.length - 1 ? "Finish" : "Next");
}
function renderOverlay(){
  var item = OVERLAY[state.overlay.i];
  if (!item) {
    app.innerHTML = '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div><h2>Overlays</h2><p class="lead">The film under the color never changed. That is the point of an overlay.</p>';
    return;
  }
  if (!state.overlay.on[item.layer] && !state.locked) {
    /* the question still shows; Check path is the choose buttons */
  }
  app.innerHTML =
    '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
    '<p class="kicker">Overlay '+(state.overlay.i+1)+" of "+OVERLAY.length+"</p><h2>Overlays</h2>"+
    '<div class="layers">'+
      [["boundary","Hematoma boundary"],["territory","Vascular territories"],["midline","Midline shift"],["vent","Ventricular compression"],["cistern","Cisternal effacement"],["herniation","Herniation pathway"]].map(function(pair){
        var on = state.overlay.on[pair[0]] ? " on" : "";
        return '<button type="button" class="'+on+'" data-layer="'+pair[0]+'">'+esc(pair[1])+"</button>";
      }).join("")+"</div>"+
    renderStep(overlayStep())+
    navRow(false, state.locked, state.overlay.i === OVERLAY.length - 1 ? "Finish" : "Next");
}
function renderChallenge(){
  var ch = state.challenge;
  if (ch.done) {
    var best = saveBest(ch.score, ch.order.length * 4);
    app.innerHTML =
      '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
      "<h2>Unknown scan</h2><p class='lead'>"+ch.score+" of "+(ch.order.length * 4)+" on the first try. Best saved on this device: "+best+".</p>"+
      ch.log.map(function(row){
        return '<p class="note"><b>'+esc(row.title)+".</b> "+esc(row.text)+"</p>";
      }).join("")+
      '<div class="row"><button type="button" class="go" data-go="challenge">New set</button></div>'+
      '<p class="note">A point needs the first response to be right. Hints are free of charge and free of points.</p>';
    return;
  }
  var c = caseById(ch.order[ch.i]);
  var partName = ["Find it", "Localize", "Mechanism", "Next step"][ch.part];
  app.innerHTML =
    '<div class="row"><button type="button" class="go" data-go="home">All stations</button></div>'+
    '<p class="kicker">Case '+(ch.i+1)+" of "+ch.order.length+" · "+partName+" · "+ch.score+" points</p>"+
    "<h2>Unknown scan</h2><p class='lead'>"+esc(c.stem)+"</p>"+
    renderStep(challengeStep())+
    navRow(false, state.locked, "Next");
}
function saveBest(score, n){
  var best = score;
  try {
    var prev = JSON.parse(localStorage.getItem("neuro-workstation-challenge") || "{}");
    if (typeof prev.best === "number") best = Math.max(prev.best, score);
    localStorage.setItem("neuro-workstation-challenge", JSON.stringify({best:best, n:n}));
  } catch (err) {}
  return best;
}

function bind(){
  app.querySelectorAll("[data-go]").forEach(function(btn){
    btn.onclick = function(){ go(btn.getAttribute("data-go")); };
  });
  var next = document.getElementById("next");
  if (next) next.onclick = onNext;
  var back = document.getElementById("back");
  if (back) back.onclick = onBack;
  var check = document.getElementById("check");
  if (check) check.onclick = onCheck;
  var restart = document.getElementById("restart");
  if (restart) restart.onclick = function(){ enter("stroke"); };
  app.querySelectorAll("[data-stage]").forEach(function(btn){
    btn.onclick = function(){
      var i = Number(btn.getAttribute("data-stage"));
      if (i > state.stroke.stage) return;
      state.stroke.stage = i;
      state.stroke.followOpen = false;
      resetStep();
      var logged = state.stroke.log[i];
      if (logged) {
        state.locked = true;
        state.ok = logged.ok;
        state.feedback = logged.detail || logged.text;
      }
      render();
    };
  });
  app.querySelectorAll("[data-opt]").forEach(function(btn){
    btn.onclick = function(){ chooseOpt(btn.getAttribute("data-opt")); };
  });
  app.querySelectorAll("[data-multi]").forEach(function(btn){
    btn.onclick = function(){
      if (state.locked) return;
      state.pick = state.pick || {};
      var id = btn.getAttribute("data-multi");
      state.pick[id] = !state.pick[id];
      render();
    };
  });
  app.querySelectorAll("[data-pick]").forEach(function(btn){
    btn.onclick = function(){ pickFilm(Number(btn.getAttribute("data-pick"))); };
  });
  app.querySelectorAll("[data-layer]").forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute("data-layer");
      state.overlay.on[id] = !state.overlay.on[id];
      render();
    };
  });
  app.querySelectorAll("svg.film.live").forEach(function(svg){
    svg.addEventListener("click", onFilm);
  });
  app.querySelectorAll("[data-nih]").forEach(function(input){
    input.addEventListener("input", function(){
      var total = 0;
      app.querySelectorAll("[data-nih]").forEach(function(el){
        var n = parseInt(el.value, 10);
        if (!isNaN(n)) total += n;
      });
      var live = document.getElementById("live-total");
      if (live) live.textContent = String(total);
    });
  });
}

function onFilm(event){
  var step = activeStep();
  if (!step || state.locked) return;
  if (step.kind !== "click" && step.kind !== "marks") return;
  var hit = event.target.closest("[data-hit]");
  var id = hit ? hit.getAttribute("data-hit") : "outside";
  var name = hit ? hit.getAttribute("data-name") : "outside the brain";
  if (step.kind === "click") {
    if (id === step.target) return pass(step.explain);
    return fail(name, step);
  }
  if (step.targets.indexOf(id) === -1) return fail(name, step);
  if (state.marks[id]) return;
  state.marks[id] = true;
  state.feedback = "Marked. "+(step.targets.length - Object.keys(state.marks).length)+" still to find.";
  state.ok = true;
  if (step.targets.every(function(t){ return state.marks[t]; })) return pass(step.explain);
  render();
}
function fail(name, step){
  state.misses += 1;
  state.ok = false;
  var hint = (step.hints && step.hints[Math.min(state.misses - 1, step.hints.length - 1)]) || "Look again at the density, not the skull.";
  if (state.misses >= 2) {
    state.reveal = true;
    state.locked = true;
    state.feedback = "That was "+name+". "+step.explain;
  } else {
    state.feedback = "That was "+name+". "+hint;
  }
  render();
}
function pass(text){
  state.locked = true;
  state.ok = state.misses === 0;
  state.feedback = (state.ok ? "Correct. " : "") + text;
  if (state.route === "challenge" && state.ok) state.challenge.score += 1;
  render();
}
function chooseOpt(id){
  var step = activeStep();
  if (!step || state.locked) return;
  if (step.layer && state.overlay && !state.overlay.on[step.layer]) {
    state.feedback = "Turn that overlay on first. The film underneath should stay visible.";
    state.ok = false;
    render();
    return;
  }
  var answer = step.answer;
  if (step.kind === "nihss" && state.stroke && state.stroke.syndromeOpen) answer = step.syndrome;
  state.pick = id;
  state.locked = true;
  state.ok = id === answer;
  state.feedback = (state.ok ? "Correct. " : "Not that one. ") + (step.why || "");
  if (state.route === "challenge" && state.ok && state.challenge.part > 0) state.challenge.score += 1;
  render();
}
function pickFilm(index){
  var step = activeStep();
  if (!step || state.locked || step.kind !== "comparepick") return;
  state.pick = index;
  state.locked = true;
  state.ok = index === step.answer;
  state.feedback = (state.ok ? "Correct. " : "Not that film. ") + step.why;
  if (state.route === "compare" && state.ok) state.compare.score += 1;
  render();
}
function onCheck(){
  var step = activeStep();
  if (!step || state.locked) return;
  if (step.kind === "number") return checkNumber(step);
  if (step.kind === "multi") return checkMulti(step);
  if (step.kind === "nihss") return checkNihss(step);
}
function checkNumber(step){
  var raw = (document.getElementById("num").value || "").replace(/[^0-9.]/g, "");
  var n = parseFloat(raw);
  if (isNaN(n)) {
    state.feedback = "Enter a number in millilitres.";
    state.ok = false;
    render();
    return;
  }
  if (Math.abs(n - step.answer) < 0.6) {
    state.misses = 0;
    return pass(step.why);
  }
  state.misses += 1;
  state.ok = false;
  if (Math.abs(n - 48) < 0.6) state.feedback = "That is A × B × C without dividing by 2.";
  else if (Math.abs(n - 12) < 0.6) state.feedback = "That has been halved twice, or the radii were used.";
  else state.feedback = step.hints[Math.min(state.misses - 1, step.hints.length - 1)];
  if (state.misses >= 2) {
    state.locked = true;
    state.feedback += " "+step.why;
  }
  render();
}
function checkMulti(step){
  var picked = state.pick || {};
  var ok = step.options.every(function(op){ return !!picked[op.id] === !!op.on; });
  state.locked = true;
  state.ok = ok;
  state.feedback = (ok ? "Correct. " : "Not that set. ") + step.why;
  render();
}
function checkNihss(step){
  var flags = [];
  var vals = [];
  var total = 0;
  var bad = 0;
  app.querySelectorAll("[data-nih]").forEach(function(el, i){
    var n = parseInt(el.value, 10);
    vals[i] = el.value;
    if (isNaN(n)) { flags[i] = false; bad += 1; return; }
    total += n;
    flags[i] = n === step.items[i][2];
    if (!flags[i]) bad += 1;
  });
  state.nihssVals = vals;
  state.nihssFlags = flags;
  if (bad === 0 && total === step.total) {
    state.stroke.syndromeOpen = true;
    state.locked = false;
    state.ok = true;
    state.pick = null;
    state.feedback = "The total is 12. Name the syndrome.";
    render();
    return;
  }
  state.ok = false;
  state.feedback = bad + " item"+(bad===1?"":"s")+" do not match the bedside finding. The running total you entered is "+total+".";
  render();
}
function onBack(){
  if (state.route === "stroke") {
    if (state.stroke.stage > 0) {
      state.stroke.stage -= 1;
      state.stroke.followOpen = false;
      resetStep();
    }
    render();
    return;
  }
  if (state.step > 0) {
    state.step -= 1;
    resetStep();
    render();
  }
}
function onNext(){
  if (!state.locked && activeStep() && activeStep().kind !== "debrief") return;
  if (state.route === "stroke") return nextStroke();
  if (state.route === "compare") return nextCompare();
  if (state.route === "overlay") return nextOverlay();
  if (state.route === "challenge") return nextChallenge();
  var station = STATIONS[state.route];
  logStation();
  if (state.step >= station.steps.length - 1) {
    state.cleared[state.route] = true;
    saveCleared();
    go("home");
    return;
  }
  state.step += 1;
  resetStep();
  render();
}
function logStation(){}
function nextStroke(){
  var st = state.stroke;
  var stage = STROKE[st.stage];
  if (stage.kind === "click" && stage.follow && !st.followOpen) {
    st.clickOk = !!state.ok;
    st.followOpen = true;
    resetStep();
    render();
    return;
  }
  if (stage.kind !== "debrief") {
    var ok = !!state.ok;
    if (stage.kind === "click") ok = !!(st.clickOk && state.ok);
    st.log[st.stage] = {
      ok: ok,
      title: stage.title,
      text: ok ? "Your call matched the teaching frame." : "Your call did not match. "+shortWhy(stage),
      detail: state.feedback
    };
  }
  if (st.stage >= STROKE.length - 1) return;
  st.stage += 1;
  st.followOpen = false;
  st.syndromeOpen = false;
  resetStep();
  if (STROKE[st.stage].kind === "debrief") state.locked = true;
  render();
}
function shortWhy(stage){
  if (stage.why) return stage.why;
  if (stage.follow && stage.follow.why) return stage.follow.why;
  return stage.explain || "";
}
function nextCompare(){
  state.compare.i += 1;
  resetStep();
  render();
}
function nextOverlay(){
  state.overlay.i += 1;
  resetStep();
  render();
}
function nextChallenge(){
  var ch = state.challenge;
  var c = caseById(ch.order[ch.i]);
  if (!state.ok) {
    var partName = ["Finding", "Site", "Mechanism", "Next step"][ch.part];
    ch.log.push({title:"Case "+(ch.i+1)+" · "+partName, text:state.feedback || c.explain});
  }
  if (ch.part < 3) {
    ch.part += 1;
    resetStep();
    render();
    return;
  }
  ch.i += 1;
  ch.part = 0;
  if (ch.i >= ch.order.length) ch.done = true;
  resetStep();
  render();
}

window.addEventListener("hashchange", function(){
  var route = (location.hash || "#").replace("#", "") || "home";
  if (route === state.route) return;
  enter(route);
});
var initial = (location.hash || "#").replace("#", "") || "home";
enter(initial);
})();
</script>
</body>
</html>
