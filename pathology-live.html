<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Pathophysiology live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Fraunces:opsz,wght@9..144,520;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--fg:#f3efe6;--muted:#b7b1a4;--faint:#8a8478;--line:rgba(243,239,230,.18);--cool:#7fd4e6;--warm:#e2b48a;--panel:#0c141c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Figtree,ui-sans-serif,sans-serif}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
body{min-height:100dvh;padding:14px 14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{text-decoration:none;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--cool)}
h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:28px;letter-spacing:-.03em;margin:10px 0 0}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.modes,.views,.presets,.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.modes button,.views button,.presets button,.acts button,.tog{
  min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#0c1823
}
.modes button.on,.views button.on,.tog.on{border-color:var(--cool);color:var(--cool)}
.diseases{display:flex;gap:6px;overflow:auto;margin-top:14px;padding-bottom:4px}
.diseases button{flex:0 0 auto;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.diseases button.on{color:var(--fg);border-color:var(--fg)}
.lead{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.stage{position:relative;margin-top:12px;min-height:280px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 132px minmax(0,1fr);gap:8px;align-items:center}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.col{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.bodybox{position:relative;z-index:1}
.bodybox svg{width:100%;height:auto;display:block}
.skin{fill:none;stroke:rgba(243,239,230,.35);stroke-width:1.4}
.organ{fill:rgba(243,239,230,.03);stroke:rgba(243,239,230,.28);stroke-width:1.3;transition:stroke .3s ease,fill .3s ease}
.organ.possible{stroke:var(--warm);stroke-dasharray:3 2;fill:rgba(226,180,138,.08)}
.organ.forming{stroke:var(--cool);stroke-dasharray:3 2;fill:rgba(127,212,230,.06)}
.organ.on{stroke:var(--cool);fill:rgba(127,212,230,.14)}
.organ.severe,.organ.locked{stroke:var(--warm);fill:rgba(226,180,138,.16)}
[data-organ].possible .organ{stroke:var(--warm);stroke-dasharray:3 2;fill:rgba(226,180,138,.08)}
[data-organ].forming .organ{stroke:var(--cool);stroke-dasharray:3 2;fill:rgba(127,212,230,.08)}
[data-organ].on .organ{stroke:var(--cool);fill:rgba(127,212,230,.16)}
[data-organ].severe .organ,[data-organ].locked .organ{stroke:var(--warm);fill:rgba(226,180,138,.18)}
.node{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(8,14,20,.88);border-radius:10px;padding:7px 8px;min-height:46px}
.node b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.node small{display:block;margin-top:2px;color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.node.on{border-color:var(--cool)}
.node.severe{border-color:var(--warm)}
.node.possible,.node.forming{border-style:dashed;border-color:var(--warm)}
.node.forming{border-color:var(--cool)}
.node.locked{border-color:var(--warm);background:rgba(226,180,138,.1)}
.node.off{opacity:.45}
.node.sel{box-shadow:inset 0 0 0 1px var(--fg)}
.sheet{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.kicker{margin:0;color:var(--cool);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.sheet h2{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:24px;margin:4px 0 8px;letter-spacing:-.03em}
.why{margin:0 0 10px;color:var(--fg);font-size:15px;line-height:1.45}
.sheet h3{margin:12px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.sheet p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.lab3d{display:inline-block;margin:12px 8px 0 0;min-height:40px;line-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--cool);color:var(--cool);text-decoration:none;font-size:14px}
.kids{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kids button{text-align:left;min-height:42px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent}
.clock{display:flex;align-items:center;gap:8px;margin-top:14px}
.clock b{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:520}
.clock button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#0c1823}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.slider span{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.slider b{color:var(--fg);font-size:15px}
.slider input{width:100%;margin-top:4px;accent-color:#7fd4e6}
.note{margin:10px 0 0;min-height:1.3em;color:var(--warm);font-size:14px;line-height:1.4}
.chart{list-style:none;margin:12px 0 0;padding:0}
.chart li{margin:0 0 8px 0}
.chart .twig{margin-left:16px;border-left:1px solid var(--line);padding-left:10px}
.fine{margin:16px 0 0;color:var(--faint);font-size:12px;line-height:1.45}
body.sepsis #modes,body.sepsis #views,body.sepsis .clock,body.sepsis #presets,body.sepsis #lead,body.sepsis #mapwrap,body.sepsis #chart,body.sepsis #sheet,body.sepsis #sliders,body.sepsis #acts,body.sepsis #note,body.sepsis .fine,body.sepsis .sub{display:none !important}
#sepsis-lab{display:none;width:100%;height:calc(100dvh - 148px);min-height:520px;border:0;border-radius:14px;margin-top:10px;background:#071018}
body.sepsis #sepsis-lab{display:block}
</style>
<style>
.subtabs,.labpick{display:flex;gap:6px;overflow:auto;margin-top:10px}
.subtabs button,.labpick button,#voice{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.subtabs button.on,.labpick button.on,#voice[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
#frame{display:block;width:100%;height:calc(100dvh - 210px);min-height:540px;border:0;border-radius:14px;margin-top:10px;background:#071018}
.soon{margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">Back to hall</a>
    <button type="button" id="voice" aria-pressed="true">Voice on</button>
  </div>
  <h1>Pathophysiology live</h1>
  <p class="sub">Pick a disease. Sepsis is live: follow it from the organ to the cell, and open each complication in 3D.</p>
  <div class="diseases" id="diseases"></div>
  <div id="sepsisPane" hidden>
    <div class="subtabs" id="subtabs"><button type="button" data-t="map">Sepsis map</button><button type="button" data-t="lab">3D lab</button></div>
    <iframe id="frame" title="Sepsis"></iframe>
  </div>
  <p class="soon" id="soon" hidden></p>
<script>
const VER = "20261118d";
const TABS = [["sepsis","Sepsis"],["ards","ARDS"],["dka","DKA / HHS"],["pancreatitis","Acute pancreatitis"],["aki","AKI"],["alf","Acute liver failure"],["ahf","Acute heart failure"],["tbi","Traumatic brain injury"],["status","Status epilepticus"],["dic","DIC"]];
const LABS = [["shock","Septic shock"],["cardiac","Myocardial dysfunction"],["ards","ARDS"],["aki","AKI"],["dic","DIC"],["enceph","Encephalopathy"]];
const state = {id:"sepsis", tab:"map", lab:"shock"};
const frame = document.getElementById("frame");
const $ = id => document.getElementById(id);

/* Voice: one soft male voice, shared by the map and every 3D lab through messages. */
const VOICE = {on:true};
function maleVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  const female = /female|woman|zira|samantha|karen|victoria|susan|tessa|moira|fiona|veena|heera|priya|google uk english female/i;
  const male = /male|david|mark|daniel|alex|rishi|ravi|aaron|fred|george|james|guy|hemant|prabhat|google uk english male/i;
  const en = voices.filter(v=>/^en/i.test(v.lang||"") && !female.test((v.name||"")+" "+(v.voiceURI||"")));
  return en.find(v=>male.test((v.name||"")+" "+(v.voiceURI||""))) || en[0] || null;
}
function speak(text, queue){
  if(!VOICE.on || !text || !window.speechSynthesis) return;
  if(!queue) speechSynthesis.cancel();
  (String(text).match(/[^.!?]+[.!?]*/g) || [text]).forEach(part=>{
    const u = new SpeechSynthesisUtterance(part.trim());
    u.rate = 0.88; u.pitch = 0.8; u.volume = 0.8;
    const v = maleVoice(); if(v) u.voice = v;
    speechSynthesis.speak(u);
  });
}
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged", ()=>speechSynthesis.getVoices()); }
$("voice").onclick = ()=>{
  VOICE.on = !VOICE.on;
  $("voice").setAttribute("aria-pressed", VOICE.on);
  $("voice").textContent = VOICE.on ? "Voice on" : "Voice off";
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(VOICE.on) speak("Voice on.");
};
window.addEventListener("message", e=>{
  if(e.source !== frame.contentWindow) return;
  const d = e.data || {};
  if(d.vo) speak(d.vo, d.q);
  if(d.lab){ state.tab = "lab"; state.lab = d.lab; render(); }
});

function render(){
  const sepsis = state.id === "sepsis";
  document.querySelectorAll("#diseases button").forEach(b=>b.classList.toggle("on", b.dataset.id===state.id));
  $("sepsisPane").hidden = !sepsis;
  $("soon").hidden = sepsis;
  if(!sepsis){
    frame.removeAttribute("src");
    $("soon").textContent = TABS.find(t=>t[0]===state.id)[1]+" is being rebuilt. Sepsis is ready now.";
    return;
  }
  document.querySelectorAll("#subtabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===state.tab));
  const src = state.tab==="map" ? "sepsis/map.html?v="+VER : "sepsis/lab-"+state.lab+".html?v="+VER;
  if(frame.getAttribute("src") !== src){ if(window.speechSynthesis) speechSynthesis.cancel(); frame.src = src; }
}
$("diseases").innerHTML = TABS.map(t=>"<button type='button' data-id='"+t[0]+"'>"+t[1]+"</button>").join("");
$("diseases").onclick = e=>{ const b=e.target.closest("[data-id]"); if(b){ state.id=b.dataset.id; render(); } };
$("subtabs").onclick = e=>{ const b=e.target.closest("[data-t]"); if(b){ state.tab=b.dataset.t; render(); } };
const want = new URLSearchParams(location.search).get("d");
if(want && TABS.some(t=>t[0]===want)) state.id = want;
render();
</script>
</body>
</html>
