<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Electrolyte Disorders — Critical Care Simulator</title>
<style>
  :root{
    --bg:#0b1a20; --bg2:#0f2530; --card:#ffffff; --card-ink:#122733;
    --line:#2e4d5c; --accent:#3fa9c9; --accent-dark:#1f6d8a;
    --ink:#bcd4dc; --ink-dim:#7fa0ac;
    --high:#c0392b; --high-bg:#fdecea;
    --low:#1f6d8a; --low-bg:#e9f4f8;
    --warn:#b8860b; --warn-bg:#fdf6e3;
    --good:#1e7d4f; --good-bg:#e8f6ee;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);padding-bottom:40px;
  }
  header{
    padding:22px 16px 16px;text-align:center;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--bg2),var(--bg));
  }
  header h1{margin:0 0 4px;font-size:20px;color:#fff;letter-spacing:.2px}
  header p{margin:0;font-size:13px;color:var(--ink-dim)}
  .wrap{max-width:760px;margin:0 auto;padding:16px}

  /* Menu grid */
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  @media (max-width:420px){.menu-grid{grid-template-columns:1fr}}
  .menu-card{
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    padding:14px;text-align:left;cursor:pointer;color:#fff;
    display:flex;flex-direction:column;gap:4px;transition:border-color .15s;
  }
  .menu-card:active{border-color:var(--accent)}
  .menu-card .tag{
    font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;
    border-radius:20px;display:inline-block;width:fit-content;
  }
  .tag.high{background:var(--high-bg);color:var(--high)}
  .tag.low{background:var(--low-bg);color:var(--low)}
  .menu-card .name{font-size:15px;font-weight:600;margin-top:2px}
  .menu-card .range{font-size:11.5px;color:var(--ink-dim)}

  /* Detail view */
  #detailView{display:none}
  .backbtn{
    background:none;border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;cursor:pointer;
  }
  .disorder-head{margin-bottom:14px}
  .disorder-head .tag{
    font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px;
  }
  .disorder-head h2{color:#fff;margin:8px 0 2px;font-size:21px}
  .disorder-head .subtitle{font-size:13px;color:var(--ink-dim)}

  .card{
    background:var(--card);color:var(--card-ink);border-radius:12px;
    padding:16px;margin-bottom:12px;border-left:4px solid var(--accent-dark);
  }
  .card h3{margin:0 0 10px;font-size:14.5px;letter-spacing:.2px;color:var(--accent-dark)}
  .card p{margin:0 0 8px;font-size:14px;line-height:1.5}
  .card p:last-child{margin-bottom:0}
  .card ul{margin:0;padding-left:20px}
  .card li{font-size:13.5px;line-height:1.55;margin-bottom:6px}
  .card li:last-child{margin-bottom:0}
  .severity-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .sev-chip{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
  .sev-mild{background:var(--good-bg);color:var(--good)}
  .sev-mod{background:var(--warn-bg);color:var(--warn)}
  .sev-sev{background:var(--high-bg);color:var(--high)}

  .mgmt-step{
    border:1px solid #dfe6ea;border-radius:10px;padding:12px 14px;margin-bottom:10px;
    background:#fbfdfe;
  }
  .mgmt-step:last-child{margin-bottom:0}
  .mgmt-step .step-title{font-weight:700;font-size:13.5px;color:var(--card-ink);margin-bottom:4px}
  .mgmt-step .step-body{font-size:13.5px;line-height:1.55;color:#3a4a52}
  .mgmt-step.emergency{border-color:#e8b4ad;background:#fdf3f2}
  .mgmt-step.emergency .step-title{color:var(--high)}
  .mgmt-step.caution{border-color:#e6d190;background:#fdf9ee}
  .mgmt-step.caution .step-title:before{content:"⚠ "}

  .pearl-box{
    background:#fff7e6;border:1px solid #f0d99a;border-radius:10px;
    padding:12px 14px;font-size:13px;line-height:1.55;color:#6b4e0a;
  }
  .pearl-box b{color:#8a5a00}
  .ref-note{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:18px;padding:0 8px}

  /* Interactive calculator */
  .calc-card{
    background:var(--card);color:var(--card-ink);border-radius:12px;
    padding:16px;margin-bottom:12px;border-left:4px solid #1e7d4f;
  }
  .calc-card h3{margin:0 0 10px;font-size:14.5px;letter-spacing:.2px;color:#1e7d4f}
  .calc-card h3 .step-num{
    display:inline-block;background:#1e7d4f;color:#fff;font-size:11px;
    width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;margin-right:6px;
  }
  .calc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .calc-field{flex:1;min-width:120px}
  .calc-field label{display:block;font-size:11.5px;color:#5a6d75;margin-bottom:3px}
  .calc-field input,.calc-field select{
    width:100%;padding:8px 9px;border:1px solid #cfd9dd;border-radius:8px;
    font-size:14px;background:#fbfdfe;color:var(--card-ink);
  }
  .calc-field input:focus,.calc-field select:focus{outline:2px solid #1e7d4f33;border-color:#1e7d4f}
  .toggle-btns{display:flex;gap:6px;flex-wrap:wrap}
  .toggle-btns label{
    flex:1;min-width:90px;text-align:center;padding:8px 10px;border:1px solid #cfd9dd;
    border-radius:8px;font-size:13px;cursor:pointer;background:#fbfdfe;color:#3a4a52;
    user-select:none;
  }
  .toggle-btns input{display:none}
  .toggle-btns label:has(input:checked){background:#1e7d4f;border-color:#1e7d4f;color:#fff}
  .calc-btn{
    background:#1e7d4f;color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;width:100%;margin-top:4px;
  }
  .calc-btn:active{background:#166b41}
  .calc-out{margin-top:10px;font-size:13.5px;line-height:1.6}
  .calc-out:empty{margin-top:0}
  .calc-hint{font-size:11.5px;color:#7fa0ac;margin-top:-4px;margin-bottom:8px}
  .di-flag{
    background:#fdf6e3;border:1px solid #e6d190;border-radius:8px;padding:10px 12px;
    font-size:13px;color:#6b4e0a;margin-top:8px;
  }
</style>
</head>
<body>

<header>
  <h1>Electrolyte Disorders</h1>
  <p>Diagnosis &amp; guideline-based management — Critical Care Reference</p>
</header>

<div class="wrap">

  <div id="menuGrid" class="menu-grid"></div>

  <div id="detailView">
    <button class="backbtn" onclick="showMenu()">← All disorders</button>
    <div id="detailContent"></div>
  </div>

  <div class="ref-note">Reference guide only — always correlate with the full clinical picture, trend values, and unit protocols before acting.</div>
</div>

<script>
const DISORDERS = {

sodium_low: {
  name:'Hyponatremia', tag:'low', range:'Na⁺ &lt;135 mEq/L',
  subtitle:'Serum sodium below 135 mEq/L',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'130–134'},
    {label:'Moderate',cls:'sev-mod',range:'125–129'},
    {label:'Severe',cls:'sev-sev',range:'&lt;125'}
  ],
  causes:[
    'Hypovolaemic: GI losses (vomiting, diarrhoea), diuretics, third-spacing, cerebral/renal salt wasting, adrenal insufficiency',
    'Euvolaemic: SIADH (malignancy, CNS/pulmonary disease, drugs), hypothyroidism, primary polydipsia, low solute intake',
    'Hypervolaemic: heart failure, cirrhosis, nephrotic syndrome, advanced renal failure',
    'Pseudohyponatraemia: severe hyperlipidaemia or hyperproteinaemia (lab artefact)',
    'Translocational: hyperglycaemia — corrected Na = measured Na + 1.6–2.4 mEq/L per 100 mg/dL glucose above 100'
  ],
  symptoms:[
    'Chronic/mild: often asymptomatic, or nausea, headache, mild confusion, unsteady gait',
    'Acute/severe (usually Na &lt;120 or rapid drop): confusion, seizures, coma, respiratory arrest from cerebral oedema',
    'Risk is driven far more by the RATE of fall than the absolute number — acute drops are dangerous at higher Na than slow chronic ones'
  ],
  diagnosis:[
    'Confirm true hypotonic hyponatraemia — exclude pseudohyponatraemia and correct for hyperglycaemia first',
    'Assess volume status clinically (skin turgor, JVP, oedema, orthostatics)',
    'Urine osmolality: &lt;100 mOsm/kg suggests primary polydipsia or low solute intake (appropriately suppressed ADH); ≥100 suggests ADH is active (SIADH, hypovolaemia, hypervolaemic states, renal failure)',
    'Urine sodium: &lt;30 mEq/L suggests hypovolaemia (extra-renal loss) or effective volume depletion (CHF/cirrhosis); ≥30 mEq/L suggests SIADH, renal salt wasting, diuretics, or adrenal insufficiency',
    'Check TSH and morning cortisol/short synacthen test if euvolaemic — hypothyroidism and adrenal insufficiency are reversible causes'
  ],
  management:[
    {title:'Acute symptomatic hyponatraemia (seizure, coma, resp. distress)',body:'3% hypertonic saline 100–150 mL IV bolus over 10–20 min. Repeat up to 2–3 times (or check Na after each bolus) until symptoms improve or Na has risen 4–6 mEq/L — this modest rise is usually enough to reduce cerebral oedema; full correction is not the goal acutely.',emergency:true},
    {title:'Correction-rate limit — osmotic demyelination risk',body:'Do not exceed 8 mEq/L rise in any 24-hour period in most patients (some protocols use ≤10–12). Use a stricter limit of ≤4–6 mEq/L/24h in high-risk patients: chronic alcohol use, malnutrition, advanced liver disease, hypokalaemia, or Na &lt;105 mEq/L at presentation.',caution:true},
    {title:'If correction rate is exceeded',body:'Re-lower serum sodium — stop hypertonic saline, give free water (oral or IV D5W), and consider desmopressin (the "DDAVP clamp") to prevent further autonomous water diuresis while re-lowering.',caution:true},
    {title:'Chronic hypovolaemic hyponatraemia',body:'Isotonic (0.9%) saline to restore volume; this alone corrects ADH-driven water retention as volume normalises.'},
    {title:'Chronic SIADH (euvolaemic)',body:'Fluid restriction (typically &lt;800–1000 mL/day) as first line. If inadequate: increase solute intake (salt tablets, oral urea), or add a loop diuretic. Vaptans (e.g. tolvaptan) are an option for refractory cases but are NOT used in cirrhosis-related hyponatraemia (hepatotoxicity boxed warning, overly rapid correction risk) and require initiation with fluid liberalisation and close Na monitoring given rapid-correction risk.'},
    {title:'Hypervolaemic hyponatraemia',body:'Fluid and sodium restriction; treat the underlying heart failure or cirrhosis; loop diuretics as needed for volume management.'}
  ],
  pearl:'The correction-RATE limit applies regardless of cause once you start treating — track cumulative Na rise over rolling 24h windows, not just since starting treatment, especially if boluses are repeated.'
},

sodium_high: {
  name:'Hypernatremia', tag:'high', range:'Na⁺ &gt;145 mEq/L',
  subtitle:'Serum sodium above 145 mEq/L',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'146–149'},
    {label:'Moderate',cls:'sev-mod',range:'150–159'},
    {label:'Severe',cls:'sev-sev',range:'≥160'}
  ],
  causes:[
    'Pure water loss: diabetes insipidus (central or nephrogenic), insensible losses (fever, burns, mechanical ventilation), hypodipsia/impaired thirst',
    'Hypotonic fluid loss: GI losses (osmotic diarrhoea), osmotic diuresis (hyperglycaemia, mannitol), excessive sweating',
    'Sodium gain: hypertonic saline or sodium bicarbonate administration, mineralocorticoid excess, accidental salt ingestion',
    'Almost always reflects a free-water deficit relative to sodium — in a conscious patient with intact thirst it rarely persists, so look for impaired access to water or altered mental status as the enabling factor'
  ],
  symptoms:[
    'Lethargy, weakness, irritability, confusion progressing to seizures and coma in severe/rapid cases',
    'Thirst (if intact), signs of hypovolaemia if concurrent volume loss',
    'Polyuria with dilute urine suggests diabetes insipidus'
  ],
  diagnosis:[
    'Assess volume status — hypovolaemic (most common), euvolaemic, or hypervolaemic hypernatraemia',
    'Urine osmolality: low/inappropriately dilute despite hypernatraemia suggests diabetes insipidus; high urine osmolality suggests extrarenal water loss or inadequate intake with intact renal concentrating ability',
    'Distinguish central vs nephrogenic DI: response to desmopressin — urine osmolality rises significantly in central DI, minimal/no response in nephrogenic DI',
    'Free water deficit (L) = Total Body Water × [(current Na ÷ 140) − 1]; TBW ≈ 0.6 × weight(kg) in men, 0.5 × weight(kg) in women (use ~0.5/0.45 in the elderly)'
  ],
  management:[
    {title:'Correction-rate limit',body:'Lower serum Na by no more than 10–12 mEq/L per 24 hours (many protocols use a more conservative ≤8) to avoid cerebral oedema from overly rapid correction. If hypernatraemia developed acutely (&lt;24–48h), faster correction is reasonable since there has been less time for brain osmotic adaptation.',caution:true},
    {title:'Route of free water replacement',body:'Oral/enteral water is preferred whenever the GI tract is usable. If IV is required: D5W, or 0.45% saline if some sodium replacement is also needed. Replace the calculated free water deficit over the time needed to stay within the correction-rate limit, and separately continue to match ongoing losses.'},
    {title:'Concurrent hypovolaemia',body:'If haemodynamically unstable, resuscitate first with isotonic (0.9%) saline to restore perfusion before switching focus to free-water replacement — correcting the free water deficit is not urgent enough to delay treating shock.',emergency:true},
    {title:'Central diabetes insipidus',body:'Desmopressin (DDAVP), plus free water replacement for any existing deficit.'},
    {title:'Nephrogenic diabetes insipidus',body:'Treat the underlying cause (stop lithium if applicable, correct hypercalcaemia/hypokalaemia). Low-sodium, low-protein diet plus a thiazide diuretic (paradoxically reduces urine output); NSAIDs (e.g. indomethacin) can be added as an adjunct.'},
    {title:'Hypervolaemic hypernatraemia (rare)',body:'Diuretics to remove excess sodium, combined with free water replacement.'}
  ],
  pearl:'Recheck serum Na every 4–6 hours during active correction — the free water deficit formula is a starting estimate, not a fixed prescription; titrate the infusion to the measured trend.'
},

potassium_low: {
  name:'Hypokalemia', tag:'low', range:'K⁺ &lt;3.5 mEq/L',
  subtitle:'Serum potassium below 3.5 mEq/L',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'3.0–3.4'},
    {label:'Moderate',cls:'sev-mod',range:'2.5–2.9'},
    {label:'Severe',cls:'sev-sev',range:'&lt;2.5'}
  ],
  causes:[
    'GI losses: vomiting, diarrhoea, nasogastric suction, laxative abuse',
    'Renal losses: loop/thiazide diuretics, hyperaldosteronism, renal tubular acidosis (type 1 and 2), Bartter/Gitelman syndromes, magnesium depletion',
    'Transcellular shift: insulin, beta-2 agonists, alkalosis, hypokalaemic periodic paralysis, refeeding syndrome',
    'Poor intake — uncommon alone but contributory in malnourished/ICU patients'
  ],
  symptoms:[
    'Muscle weakness, cramps, fatigue; severe cases: flaccid paralysis, rhabdomyolysis, ileus',
    'ECG: T-wave flattening, U waves, ST depression, QT/QU prolongation',
    'Increased arrhythmia risk, especially with concurrent digoxin therapy'
  ],
  diagnosis:[
    'Always check serum magnesium — hypomagnesaemia both causes renal K⁺ wasting and blocks effective repletion until corrected',
    'Review medication list (diuretics, laxatives, beta-agonists, insulin) and recent GI losses',
    'If cause unclear: check blood pressure and acid-base status, urine K⁺ and transtubular potassium gradient to distinguish renal from extrarenal loss'
  ],
  management:[
    {title:'Correct magnesium first/concurrently',body:'Hypokalaemia is often refractory to potassium replacement alone if Mg²⁺ is also low — replete Mg²⁺ in parallel (see Hypomagnesaemia).',caution:true},
    {title:'Oral replacement (mild–moderate, tolerating oral intake)',body:'KCl 40–100 mEq/day in divided doses is the preferred route when safe — better titratability and lower risk than IV.'},
    {title:'IV replacement (severe, symptomatic, or NPO)',body:'KCl via peripheral line: maximum 10 mEq/hour. Higher rates (up to 20 mEq/hour) require a central line and continuous cardiac monitoring in an ICU/HDU setting for severe or critical hypokalaemia. As a rough guide, each 10 mEq raises serum K⁺ by roughly 0.1 mEq/L, but individual response varies — recheck levels regularly rather than relying on the estimate alone.',emergency:true},
    {title:'Diluent choice',body:'Use normal saline as the diluent, not dextrose-containing fluids — the insulin response to dextrose can transiently drive potassium further into cells and worsen the hypokalaemia during replacement.'},
    {title:'Monitoring',body:'Continuous cardiac (ECG) monitoring for severe hypokalaemia or any IV infusion rate above 10 mEq/hour; recheck serum K⁺ after each replacement cycle.'}
  ],
  pearl:'A patient on digoxin with hypokalaemia is at markedly increased risk of digoxin toxicity and arrhythmia even at K⁺ levels that would otherwise be considered only mildly low — treat more urgently in this context.'
},

potassium_high: {
  name:'Hyperkalemia', tag:'high', range:'K⁺ &gt;5.0–5.5 mEq/L',
  subtitle:'Serum potassium above 5.0–5.5 mEq/L',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'5.5–5.9'},
    {label:'Moderate',cls:'sev-mod',range:'6.0–6.4'},
    {label:'Severe',cls:'sev-sev',range:'≥6.5 or any ECG changes'}
  ],
  causes:[
    'Renal failure (acute or chronic) — reduced excretion is the most common underlying driver',
    'Medications: ACE inhibitors, ARBs, potassium-sparing diuretics, NSAIDs, trimethoprim, non-selective beta-blockers',
    'Tissue breakdown: rhabdomyolysis, tumour lysis syndrome, haemolysis, extensive burns/trauma',
    'Transcellular shift: metabolic acidosis, insulin deficiency',
    'Adrenal insufficiency, excessive potassium intake with impaired excretion'
  ],
  symptoms:[
    'Often asymptomatic until ECG changes appear — muscle weakness and paraesthesias can occur',
    'ECG progression: peaked T waves → PR prolongation and P-wave flattening → QRS widening → sine-wave pattern → ventricular fibrillation/asystole',
    'Any ECG change in the setting of hyperkalaemia is a medical emergency regardless of the exact K⁺ number'
  ],
  diagnosis:[
    'Exclude pseudohyperkalaemia (haemolysed sample, prolonged tourniquet time, marked thrombocytosis/leukocytosis) — recheck on a fresh unhaemolysed sample if the picture is inconsistent',
    'Obtain a 12-lead ECG immediately in any significant hyperkalaemia',
    'Review medications, renal function, and consider tissue-breakdown causes (CK, uric acid, LDH if rhabdomyolysis/tumour lysis suspected)'
  ],
  management:[
    {title:'1. Stabilise the cardiac membrane',body:'IV calcium gluconate 10% 10 mL (or calcium chloride 10% 5–10 mL, preferably via a central line) over 2–3 minutes if ECG changes are present. Onset 1–3 minutes, duration 30–60 minutes — repeat if ECG changes persist or recur. This does NOT lower serum potassium, it only protects the heart while other measures take effect.',emergency:true},
    {title:'2a. Shift potassium intracellularly — insulin/dextrose',body:'Regular insulin 10 units IV with 25 g dextrose (2 amps D50W, or an infusion if glucose is already elevated) given concurrently or dextrose immediately after. Onset 15–30 minutes, duration 4–6 hours, typically lowers K⁺ by ~0.5–1.2 mEq/L. Monitor glucose hourly for several hours — hypoglycaemia is a real risk, especially in renal failure or low body weight; some protocols reduce the insulin dose to 5 units in these groups.',emergency:true},
    {title:'2b. Shift potassium intracellularly — beta-2 agonist',body:'Nebulised salbutamol 10–20 mg (well above the standard bronchodilator dose) — onset 15–30 minutes, additive effect with insulin/dextrose, lowers K⁺ by roughly another 0.5–1 mEq/L. Use with caution in patients with tachyarrhythmia or significant coronary disease.'},
    {title:'2c. Sodium bicarbonate',body:'Reserve for hyperkalaemia with significant concurrent metabolic acidosis — not recommended as a routine standalone measure given limited evidence of benefit in isolation.'},
    {title:'3. Remove potassium from the body',body:'Loop diuretics (e.g. furosemide) if renal function/urine output allow. Potassium binders — sodium zirconium cyclosilicate (faster onset, roughly within an hour) or patiromer (slower, more suited to non-emergent/chronic management) — bind potassium in the gut. Older resin (sodium polystyrene sulfonate) has questioned efficacy and a bowel-necrosis risk, and is now less favoured.'},
    {title:'4. Dialysis',body:'The fastest and most definitive way to remove potassium — indicated for severe or refractory hyperkalaemia, especially with renal failure, or life-threatening ECG changes not responding to medical therapy.',emergency:true},
    {title:'Throughout',body:'Continuous cardiac monitoring, stop any contributing medications, treat the underlying cause, and recheck serum potassium serially (the temporising measures above all wear off).'}
  ],
  pearl:'Calcium gluconate protects the heart but does not lower the potassium level — every patient who gets it still needs one of the potassium-lowering measures started alongside it.'
},

calcium_low: {
  name:'Hypocalcemia', tag:'low', range:'Corrected Ca &lt;8.5 mg/dL',
  subtitle:'Corrected total calcium &lt;8.5 mg/dL or ionised calcium &lt;1.1 mmol/L (4.4 mg/dL)',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'Corrected 8.0–8.5'},
    {label:'Moderate',cls:'sev-mod',range:'7.0–7.9'},
    {label:'Severe',cls:'sev-sev',range:'&lt;7.0 or symptomatic'}
  ],
  causes:[
    'Hypoparathyroidism — post-thyroidectomy/neck surgery, autoimmune',
    'Vitamin D deficiency, chronic kidney disease (impaired 1-alpha hydroxylation)',
    'Hypomagnesaemia — impairs both PTH secretion and PTH action; hypocalcaemia often will not correct until Mg²⁺ is replaced',
    'Acute pancreatitis, sepsis/critical illness, massive blood transfusion (citrate chelation), tumour lysis syndrome, hyperphosphataemia'
  ],
  symptoms:[
    'Perioral numbness and tingling, paraesthesias of the fingers/toes',
    'Chvostek\'s sign (facial twitch on tapping the facial nerve) and Trousseau\'s sign (carpal spasm on BP cuff inflation)',
    'Tetany, seizures; prolonged QT interval with arrhythmia risk; laryngospasm in severe cases'
  ],
  diagnosis:[
    'Correct total calcium for albumin: corrected Ca (mg/dL) = measured Ca + 0.8 × (4.0 − albumin g/dL)',
    'Ionised calcium is more reliable than corrected total calcium, particularly in critically ill patients — measure directly where available rather than relying on the correction formula',
    'Check magnesium, phosphate, PTH, and vitamin D (25-OH-D) to identify the underlying cause'
  ],
  management:[
    {title:'Correct magnesium first',body:'Replete Mg²⁺ before or alongside calcium if magnesium is low — calcium replacement is often ineffective while hypomagnesaemia persists.',caution:true},
    {title:'Severe or symptomatic (tetany, seizure, arrhythmia, prolonged QT, ionised Ca &lt;0.8 mmol/L)',body:'IV calcium gluconate 10%, 1–2 g (90–180 mg elemental calcium) over 10–20 minutes, followed by a continuous infusion (e.g. 10 vials of 10% calcium gluconate in 1 L D5W, infused over 24 hours and titrated to ionised calcium). Use calcium gluconate rather than calcium chloride via a peripheral line — calcium chloride is a vesicant and risks tissue necrosis if it extravasates.',emergency:true},
    {title:'Administration cautions',body:'Monitor ECG during IV correction; avoid rapid IV push (risk of bradycardia/arrhythmia); do not infuse through the same line as bicarbonate-containing fluids (risk of precipitation).',caution:true},
    {title:'Mild/chronic/asymptomatic',body:'Oral calcium (carbonate or citrate) 1–2 g elemental calcium/day in divided doses, plus vitamin D — cholecalciferol/ergocalciferol for simple deficiency, or calcitriol (active vitamin D) if renal failure or hypoparathyroidism is present, since 1-alpha hydroxylation is impaired in both.'},
    {title:'Chronic hypoparathyroidism',body:'Long-term active vitamin D (calcitriol) plus calcium supplementation; recombinant PTH (rhPTH 1-84) is an option in refractory cases per current endocrine society guidance.'}
  ],
  pearl:'In a critically ill patient, trust the ionised calcium over the albumin-corrected total calcium whenever both are available — the correction formula was derived in outpatients and is less reliable in acute illness.'
},

calcium_high: {
  name:'Hypercalcemia', tag:'high', range:'Corrected Ca &gt;10.5 mg/dL',
  subtitle:'Corrected total calcium &gt;10.5 mg/dL or ionised calcium &gt;1.3 mmol/L',
  severity:[
    {label:'Mild',cls:'sev-mild',range:'&lt;12'},
    {label:'Moderate',cls:'sev-mod',range:'12–14'},
    {label:'Severe / crisis',cls:'sev-sev',range:'&gt;14 or symptomatic'}
  ],
  causes:[
    'Primary hyperparathyroidism — the most common cause of mild, often outpatient-detected hypercalcaemia',
    'Malignancy — the most common cause of severe, inpatient hypercalcaemia: PTHrP-mediated humoral hypercalcaemia, osteolytic bone metastases, or 1,25(OH)₂D production (lymphoma)',

const ORDER=['sodium_low','sodium_high','potassium_low','potassium_high','calcium_low','calcium_high','magnesium_low','magnesium_high','phosphate_low','phosphate_high'];

function buildMenu(){
  const grid=document.getElementById('menuGrid');
  grid.innerHTML='';
  ORDER.forEach(key=>{
    const d=DISORDERS[key];
    const card=document.createElement('div');
    card.className='menu-card';
    card.onclick=()=>showDisorder(key);
    card.innerHTML=`
      <span class="tag ${d.tag}">${d.tag==='high'?'ELEVATED':'LOW'}</span>
      <span class="name">${d.name}</span>
      <span class="range">${d.range}</span>
    `;
    grid.appendChild(card);
  });
}

function severityRow(sev){
  return '<div class="severity-row">'+sev.map(s=>`<span class="sev-chip ${s.cls}">${s.label}: ${s.range}</span>`).join('')+'</div>';
}

function listCard(title,items){
  return `<div class="card"><h3>${title}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
}

function mgmtCard(steps){
  const stepsHtml=steps.map(s=>{
    const cls='mgmt-step'+(s.emergency?' emergency':'')+(s.caution?' caution':'');
    return `<div class="${cls}"><div class="step-title">${s.title}</div><div class="step-body">${s.body}</div></div>`;
  }).join('');
  return `<div class="card"><h3>Management</h3>${stepsHtml}</div>`;
}

function hnUpdateSeverity(){
  const naVal=document.getElementById('hnNa').value;
  const na=parseFloat(naVal);
  const out=document.getElementById('hnSeverityOut');
  const step1=document.getElementById('hnStep1Wrap');
  if(naVal===''||isNaN(na)){ out.innerHTML=''; step1.style.display='none'; return; }
  if(na<=145){
    out.innerHTML='<span class="sev-chip sev-mild">Na⁺ '+na+' mmol/L — not hypernatraemic (definition: &gt;145)</span>';
    step1.style.display='none';
    return;
  }
  let sev,cls;
  if(na>=160){sev='Severe';cls='sev-sev';}
  else if(na>=150){sev='Moderate';cls='sev-mod';}
  else{sev='Mild';cls='sev-mild';}
  const warn=na>=160?'<div class="di-flag">⚠ Severe hypernatraemia (≥160 mmol/L) is associated with neurological manifestations and requires urgent, controlled correction.</div>':'';
  out.innerHTML='<span class="sev-chip '+cls+'">'+sev+' hypernatraemia — Na⁺ '+na+' mmol/L</span>'+warn;
  step1.style.display='block';
}

function hnCheckDI(){
  const uOsmVal=document.getElementById('hnUOsm').value;
  const uOsm=parseFloat(uOsmVal);
  const polyuriaEl=document.querySelector('input[name="hnPolyuria"]:checked');
  const polyuria=polyuriaEl?polyuriaEl.value:null;
  const flag=document.getElementById('hnDIFlag');
  const diWrap=document.getElementById('hnDIWrap');
  if(polyuria==='yes'&&uOsmVal!==''&&uOsm<300){
    flag.innerHTML='<div class="di-flag">Hypernatraemia + polyuria + inappropriately dilute urine (osmolality '+uOsm+' mOsm/kg) — pattern suggestive of diabetes insipidus. Select the type below.</div>';
    diWrap.style.display='block';
  } else if(polyuria==='yes'){
    flag.innerHTML='<div class="di-flag">Polyuria present — enter urine osmolality to check for a DI pattern (suggested by inappropriately dilute urine despite hypernatraemia).</div>';
    diWrap.style.display='none';
  } else {
    flag.innerHTML='';
    diWrap.style.display='none';
  }
}

function hnShowDIType(){
  const type=document.querySelector('input[name="hnDIType"]:checked');
  const out=document.getElementById('hnDITypeOut');
  if(!type){ out.innerHTML=''; return; }
  if(type.value==='central'){
    out.innerHTML='<div class="mgmt-step"><div class="step-title">Central DI — low ADH</div><div class="step-body">Desmopressin, plus free-water replacement for the existing deficit.</div></div>';
  } else {
    out.innerHTML='<div class="mgmt-step"><div class="step-title">Nephrogenic DI — renal resistance to ADH</div><div class="step-body">Remove the offending drug (e.g. lithium); correct hypokalaemia/hypercalcaemia; low-solute diet; thiazide ± amiloride depending on the underlying cause.</div></div>';
  }
}

let hnDeficitL=null,hnCurrentNa=null,hnTargetNaVal=null;

function hnCalcDeficit(){
  const na=parseFloat(document.getElementById('hnNa').value);
  const weight=parseFloat(document.getElementById('hnWeight').value);
  const sex=document.getElementById('hnSex').value;
  const elderlyEl=document.querySelector('input[name="hnElderly"]:checked');
  const elderly=elderlyEl&&elderlyEl.value==='yes';
  const target=parseFloat(document.getElementById('hnTarget').value)||140;
  const out=document.getElementById('hnDeficitOut');
  const mgmtWrap=document.getElementById('hnMgmtWrap');

  if(!na||na<=145){ out.innerHTML='<span style="color:#c0392b">Enter a serum Na⁺ above 145 mmol/L at the top of this page first.</span>'; return; }
  if(!weight){ out.innerHTML='<span style="color:#c0392b">Enter body weight.</span>'; return; }

  let tbwFactor;
  if(sex==='male') tbwFactor=elderly?0.5:0.6;
  else tbwFactor=elderly?0.45:0.5;

  const tbw=tbwFactor*weight;
  const deficit=tbw*(na/target-1);

  hnDeficitL=deficit;hnCurrentNa=na;hnTargetNaVal=target;

  out.innerHTML=
    '<p>TBW = '+tbwFactor+' × '+weight+' kg = <b>'+tbw.toFixed(1)+' L</b></p>'+
    '<p>Free-water deficit = '+tbw.toFixed(1)+' × ('+na+'/'+target+' − 1) = <b>'+deficit.toFixed(2)+' L</b></p>';

  mgmtWrap.style.display='block';
}

function hnCalcManagement(){
  const shockEl=document.querySelector('input[name="hnShock"]:checked');
  const durationEl=document.querySelector('input[name="hnDuration"]:checked');
  const shock=shockEl?shockEl.value:'no';
  const duration=durationEl?durationEl.value:'chronic';
  const out=document.getElementById('hnMgmtOut');

  if(hnDeficitL===null){ out.innerHTML='<span style="color:#c0392b">Calculate the free-water deficit above first.</span>'; return; }

  let html='';
  if(shock==='yes'){
    html+='<div class="mgmt-step emergency"><div class="step-title">Resuscitate first</div><div class="step-body">Restore circulation with 0.9% saline before correcting the free-water deficit.</div></div>';
  }

  const totalDrop=hnCurrentNa-hnTargetNaVal;

  if(duration==='acute'){
    html+='<div class="mgmt-step caution"><div class="step-title">Acute hypernatraemia (&lt;48h)</div><div class="step-body">More rapid correction can be considered under close monitoring — evidence in adults is less definitive than the conservative approach used for &gt;48h/unknown-duration cases. A reasonable approach is full correction within roughly 24 hours with frequent (2–4 hourly) Na⁺ rechecks, adjusted to the clinical trajectory rather than followed rigidly.</div></div>';
  } else {
    const daysNeeded=Math.max(1,Math.ceil(totalDrop/10));
    const hoursNeeded=daysNeeded*24;
    const rateMLperHr=(hnDeficitL*1000)/hoursNeeded;
    const hourlyRateMmol=(totalDrop/hoursNeeded).toFixed(2);
    html+=
      '<div class="mgmt-step"><div class="step-title">Staged correction — ≤10 mmol/L per 24h (traditional conservative ICU target)</div><div class="step-body">'+
      'Total drop needed: '+totalDrop.toFixed(1)+' mmol/L, from '+hnCurrentNa+' to '+hnTargetNaVal+'. Spread over at least <b>'+daysNeeded+' day(s)</b> ('+hoursNeeded+' hours) to stay within the ~10–12 mmol/L/24h limit — averaging ≈'+hourlyRateMmol+' mmol/L/hr, comfortably under the ≤0.5 mmol/L/hr ceiling.<br><br>'+
      'Free-water deficit '+hnDeficitL.toFixed(2)+' L ÷ '+hoursNeeded+' h ≈ <b>'+rateMLperHr.toFixed(0)+' mL/hr</b> of free water replacement. This covers the calculated deficit only — add separately for ongoing losses and maintenance requirements.'+
      '</div></div>'+
      '<div class="mgmt-step caution"><div class="step-title">Monitoring</div><div class="step-body">Recheck serum Na⁺ approximately every 2–4 hours initially in severe hypernatraemia, and adjust the infusion to the measured trend rather than the calculated rate alone.</div></div>';
  }

  html+='<div class="mgmt-step"><div class="step-title">Route</div><div class="step-body">Oral or enteral water is preferred whenever the GI tract is usable. If IV is required: D5W, or 0.45% saline when some sodium replacement is also needed.</div></div>';

  out.innerHTML=html;
}

function showDisorder(key){
  const d=DISORDERS[key];
  document.getElementById('menuGrid').parentElement.querySelector('#menuGrid').style.display='none';
  document.getElementById('detailView').style.display='block';
  document.querySelector('.ref-note').style.display='none';

  let html='';
  html+=`<div class="disorder-head">
    <span class="tag ${d.tag}" style="background:${d.tag==='high'?'#fdecea':'#e9f4f8'};color:${d.tag==='high'?'#c0392b':'#1f6d8a'}">${d.tag==='high'?'ELEVATED':'LOW'}</span>
    <h2>${d.name}</h2>
    <div class="subtitle">${d.subtitle}</div>
  </div>`;
  if(key==='sodium_high'){
    hnDeficitL=null;hnCurrentNa=null;hnTargetNaVal=null;
    html+=hnCalculatorHTML();
  }
  html+=`<div class="card"><h3>Severity</h3>${severityRow(d.severity)}</div>`;
  html+=listCard('Causes',d.causes);
  html+=listCard('Clinical Features',d.symptoms);
  html+=listCard('Diagnostic Approach',d.diagnosis);
  html+=mgmtCard(d.management);
  html+=`<div class="pearl-box"><b>Key pearl:</b> ${d.pearl}</div>`;

  document.getElementById('detailContent').innerHTML=html;
  window.scrollTo({top:0,behavior:'smooth'});
}

function showMenu(){
  document.getElementById('menuGrid').style.display='grid';
  document.getElementById('detailView').style.display='none';
  document.querySelector('.ref-note').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

buildMenu();
