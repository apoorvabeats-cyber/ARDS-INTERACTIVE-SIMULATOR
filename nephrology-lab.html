function facts(prev,now){const L=[],add=s=>{if(L.length<4)L.push(s)};
if(Math.abs(now.g-prev.g)>=8)add(now.g<prev.g?`GFR falls to ${now.g.toFixed(0)}`:`GFR rises to ${now.g.toFixed(0)}`);
const vr=now.V/Math.max(prev.V,1e-6),vh=now.V*60;
if(vr>=1.35)add(`urine output rises to ${vh.toFixed(0)} millilitres per hour`);
else if(vr<=.75)add(`urine output falls to ${vh.toFixed(0)} millilitres per hour`);
if(now.uG>=5&&prev.uG<1)add('glucose appears in the urine');
if(now.ph>=7.1&&prev.ph<6.8)add('the urine becomes alkaline');
else if(now.ph<5.2&&prev.ph>=5.8)add('the urine is more acid');
if(now.uo<250&&prev.uo>=300)add('the urine is dilute');
else if(now.uo>700&&prev.uo<=500)add('the urine is more concentrated');
else if(Math.abs(now.uo-prev.uo)>=150)add(`urine osmolality is ${now.uo.toFixed(0)}`);
if(now.kE>prev.kE*1.35&&now.kE>iK*1.15)add('potassium loss increases');
else if(now.kE<prev.kE*.7)add('potassium loss falls');
if(now.NaE>prev.NaE*1.4)add('sodium loss increases');
return L}
