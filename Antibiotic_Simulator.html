<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antibiotic simulator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f7fb;color:#14213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 18px 10px;background:#0f766e;color:#fff}
  h1{margin:0;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
  #stepName{margin:4px 0 0;font-weight:700}
  main{max-width:760px;margin:0 auto;padding:14px 14px 92px}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:12px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#0f766e}
  h2:first-child{margin-top:0}
  .hint{margin:0 0 10px;font-weight:700;color:#334155}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#334155;margin-bottom:4px}
  input,select{width:100%;font-size:16px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;color:#14213d}
  .out{margin-top:12px;border-radius:14px;padding:12px;background:#f8fafc;border:2px solid #e2e8f0;font-weight:800;line-height:1.45}
  .out.bad{border-color:#be123c}
  .out b{font-size:22px;display:block}
  ul{margin:8px 0 0;padding-left:18px}
  canvas{width:100%;height:220px;background:#fff;border:2px solid #e2e8f0;border-radius:12px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;margin-top:8px}
  .legend i{display:inline-block;width:18px;height:4px;background:#0f766e;margin-right:6px;vertical-align:middle}
  .legend .red{background:#dc2626}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e2e8f0}
  nav button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:#0f766e;color:#fff}
  nav button:disabled{background:#cbd5e1;color:#64748b}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <h1>Antibiotics</h1>
  <p id="stepName">Patient</p>
</header>
<main><section id="view"></section></main>
<nav>
  <button type="button" id="back">Back</button>
  <button type="button" id="next">Next</button>
</nav>
<script>
var S={age:'60',sex:'male',ht:'170',wt:'70',scr:'1',uo:'50',where:'hospital',source:'vap',sev:'shock',recent:'no',prior:'none',org:'kleb',mech:'ndm',mic:'4',ast:'R',drug:'meropenem',inf:'extended',rrt:'none',load:'load',traj:'stable',vd:'increased',level:'no',identified:'yes',astYes:'yes',resp:'improving',control:'yes'};
var stack=['pt'];
var TITLE={pt:'Patient',bug:'Organism',drug:'Drug and dose',pk:'Exposure',plan:'Plan'};
function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function crcl(){
  var age=num('age'), wt=num('wt'), scr=num('scr'), ht=num('ht');
  if(age==null||wt==null||scr==null||ht==null||scr<=0||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  var use=wt;
  if(bmi>=30 && wt>ibw) use=ibw+0.4*(wt-ibw);
  var c=(140-age)*use/(72*scr);
  if(S.sex==='female') c*=0.85;
  return Math.max(0,c);
}
function band(c){
  if(c==null) return '';
  if(c>130) return 'Augmented clearance';
  if(c>=90) return 'Normal';
  if(c>=60) return 'Mild impairment';
  if(c>=30) return 'Moderate impairment';
  return 'Severe impairment';
}
function box(id,label){ return '<div><label>'+label+'</label><input id="'+id+'" inputmode="decimal" value="'+(S[id]||'')+'"></div>'; }
function sel(id,label,opts){
  return '<div><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){
    return '<option value="'+o[0]+'"'+(S[id]===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('')+'</select></div>';
}
function out(title,lines,bad){
  return '<div class="out'+(bad?' bad':'')+'"><b>'+title+'</b>'+(lines&&lines.length?'<ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>':'')+'</div>';
}
var ORG={
  ecoli:['Escherichia coli','entero'], kleb:['Klebsiella pneumoniae','entero'], enterobacter:['Enterobacter cloacae complex','entero'],
  pseudomonas:['Pseudomonas aeruginosa','pseudo'], acinetobacter:['Acinetobacter baumannii','acineto'], steno:['Stenotrophomonas maltophilia','steno'],
  mrsa:['MRSA','mrsa'], mssa:['MSSA','mssa'], enterococcus:['Enterococcus faecium','vre'], unknown:['Unknown gram-negative','entero']
};
var MECH={
  none:'No enzyme named', esbl:'ESBL', ampc:'AmpC', kpc:'KPC', oxa48:'OXA-48-like',
  ndm:'NDM', vim:'VIM', imp:'IMP', dtr:'Difficult-to-treat Pseudomonas', crab:'CRAB', steno:'Stenotrophomonas'
};
var PREF={
  esbl:['meropenem'],
  ampc:['cefepime','meropenem'],
  kpc:['ceftazavi','merovab','imirele','cefiderocol'],
  oxa48:['ceftazavi','cefiderocol'],
  ndm:['aztavi','cazazi','cefiderocol'],
  vim:['aztavi','cazazi','cefiderocol'],
  imp:['aztavi','cazazi','cefiderocol'],
  dtr:['ceftolozane','ceftazavi','imirele','cefiderocol'],
  crab:['sulbactam','cefiderocol'],
  steno:['tmp','cefiderocol']
};
var DRUG={
  meropenem:['Meropenem','fT>MIC','ESBL bacteremia. Not NDM, KPC, or OXA-48.','Lowers valproate. Seizures if the dose ignores the kidneys.'],
  cefepime:['Cefepime','fT>MIC','AmpC when the MIC is low. Susceptible Pseudomonas.','Encephalopathy, myoclonus, and seizures when it accumulates.'],
  piptazo:['Piperacillin-tazobactam','fT>MIC','Susceptible mixed infection. Not ESBL bacteremia. Not AmpC.','Kidney injury when combined with vancomycin.'],
  ceftazavi:['Ceftazidime-avibactam','fT>MIC','KPC and OXA-48-like. Not an MBL alone.','Fails if an NDM is also present.'],
  merovab:['Meropenem-vaborbactam','fT>MIC','KPC. Not OXA-48. Not an MBL.','Vaborbactam does not cover every carbapenemase.'],
  imirele:['Imipenem-relebactam','fT>MIC','KPC and some difficult Pseudomonas. Not an MBL.','Seizure risk of imipenem if the dose is high for the kidneys.'],
  ceftolozane:['Ceftolozane-tazobactam','fT>MIC','Difficult Pseudomonas. Pneumonia is 3 g, not 1.5 g.','The urinary dose under-treats pneumonia.'],
  cefiderocol:['Cefiderocol','fT>MIC','MBL, difficult Pseudomonas, selected CRAB, Stenotrophomonas, when susceptible.','Resistance can emerge. Confirm the MIC.'],
  aztavi:['Aztreonam-avibactam','fT>MIC','NDM, VIM, or IMP Enterobacterales.','Aztreonam alone is not enough if an ESBL or AmpC is also there.'],
  cazazi:['Ceftazidime-avibactam + aztreonam','fT>MIC','MBL Enterobacterales when aztreonam-avibactam is not available.','Both drugs still need a 3-hour infusion.'],
  vancomycin:['Vancomycin','AUC/MIC','MRSA, including pneumonia.','Kidney injury, ear toxicity, and the red-man infusion reaction.'],
  linezolid:['Linezolid','AUC/MIC','MRSA pneumonia. Not the best drug for bacteremia.','Marrow suppression, neuropathy, and serotonin syndrome with an SSRI.'],
  daptomycin:['Daptomycin','Cmax/MIC','MRSA or VRE in the blood. Never pneumonia.','Muscle injury. Stop the statin. Surfactant kills it in the lung.'],
  amikacin:['Amikacin','Cmax/MIC','Add-on for selected gram-negatives. Not pneumonia alone.','Kidney injury and hearing loss.'],
  tmp:['Trimethoprim-sulfamethoxazole','AUC/MIC','Stenotrophomonas. Dose on the trimethoprim.','Potassium rises, kidneys worsen, marrow falls, severe rash.'],
  sulbactam:['Sulbactam-durlobactam','fT>MIC','CRAB.','Still needs a susceptibility check.'],
  tigecycline:['Tigecycline','AUC/MIC','Some intra-abdominal CRE. Not the blood.','Low blood levels. Nausea. Higher death in some bloodstream uses.'],
  eravacycline:['Eravacycline','AUC/MIC','Selected CRE or CRAB outside the blood.','Not a bloodstream drug.']
};
function prefList(){ return PREF[S.mech]||[]; }
function siteBlock(id){
  if((id==='tigecycline'||id==='eravacycline') && (S.source==='bsi'||S.source==='endo'||S.source==='line')) return 'Blood levels are too low.';
  if(id==='daptomycin' && (S.source==='vap'||S.source==='cap')) return 'Surfactant in the lung inactivates daptomycin.';
  if(id==='meropenem' && S.org==='pseudomonas' && S.mech==='none') return '';
  if((id==='vancomycin'||id==='linezolid'||id==='daptomycin') && ORG[S.org][1]!=='mrsa' && ORG[S.org][1]!=='vre' && ORG[S.org][1]!=='mssa') return 'This is not a gram-positive drug for this culture.';
  if(id!=='vancomycin' && id!=='linezolid' && id!=='daptomycin' && id!=='tmp' && (ORG[S.org][1]==='mrsa' || ORG[S.org][1]==='vre')) return 'This gram-negative drug does not treat this gram-positive culture.';
  return '';
}
function judge(){
  var id=S.drug, pref=prefList(), block=siteBlock(id);
  if(S.ast==='R') return {bad:true, title:'Lab says resistant', lines:['Do not use a drug the report marks resistant.']};
  if(block) return {bad:true, title:'Wrong place or wrong bug', lines:[block]};
  if(S.mech==='none'){
    if(S.org==='pseudomonas' && id==='meropenem') return {bad:false, title:'Active if susceptible', lines:['Pseudomonas needs an antipseudomonal drug. Ertapenem would not be one.']};
    if(ORG[S.org][1]==='mrsa' && (id==='vancomycin'||id==='linezolid')) return {bad:false, title:id==='linezolid'&&S.source==='bsi'?'Weak for the blood':'Fits MRSA', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='vre' && (id==='daptomycin'||id==='linezolid')) return {bad:false, title:'Fits VRE faecium', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mssa' && id==='cefepime') return {bad:true, title:'Too broad', lines:['MSSA bacteremia wants cefazolin or an anti-staphylococcal penicillin, not a Pseudomonas drug.']};
    return {bad:false, title:'No enzyme named', lines:['Use the narrowest susceptible drug for the site.', DRUG[id][3]]};
  }
  if(pref.indexOf(id)>=0) return {bad:false, title:'Fits '+MECH[S.mech], lines:[DRUG[id][2], DRUG[id][3]]};
  if(S.mech==='esbl' && id==='piptazo') return {bad:true, title:'Not for ESBL in the blood', lines:['A susceptible piperacillin result is not enough for ESBL bacteremia. Use a carbapenem.']};
  if(S.mech==='ampc' && id==='piptazo') return {bad:true, title:'Tazobactam does not hold AmpC', lines:['Cefepime is the narrower active choice when the MIC allows it.']};
  if((S.mech==='ndm'||S.mech==='vim'||S.mech==='imp') && id==='ceftazavi') return {bad:true, title:'Avibactam alone does not stop an MBL', lines:['Add aztreonam, or use aztreonam-avibactam or susceptible cefiderocol.']};
  if((S.mech==='oxa48') && id==='merovab') return {bad:true, title:'Vaborbactam is for KPC', lines:['OXA-48-like needs ceftazidime-avibactam.']};
  if(S.mech==='kpc' && id==='meropenem') return {bad:true, title:'KPC hydrolyzes meropenem', lines:['A longer infusion does not replace avibactam, vaborbactam, or relebactam.']};
  if(S.mech==='dtr' && (id==='meropenem'||id==='cefepime'||id==='piptazo')) return {bad:true, title:'The usual Pseudomonas drugs have already failed', lines:['Use a susceptible newer antipseudomonal agent.']};
  if(S.mech==='crab' && id==='meropenem') return {bad:true, title:'Not a CRAB drug', lines:['Use sulbactam-durlobactam or susceptible cefiderocol.']};
  if(S.mech==='steno' && (id==='meropenem'||id==='cefepime')) return {bad:true, title:'Inactive against Stenotrophomonas', lines:['Trimethoprim-sulfamethoxazole or susceptible cefiderocol.']};
  return {bad:true, title:'Does not match '+MECH[S.mech], lines:['Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.']};
}
function doseLine(){
  var c=crcl(), id=S.drug;
  if(S.rrt==='crrt') return 'On CRRT start from the severe-infection dose and match the effluent. Do not use the anuric dose.';
  if(S.rrt==='sled') return 'SLED sits between dialysis and CRRT. Confirm the dose with the effluent and the residual urine.';
  if(c==null) return 'Enter age, sex, height, weight, and creatinine.';
  var hd=S.rrt==='ihd'||c<10;
  var low=c<30, mid=c<50;
  var map={
    meropenem: hd?'500 mg every 24 hours, plus a dose after hemodialysis.':low?'500 mg to 1 g every 12 hours.':mid?'1 g every 12 hours.':'1 g every 8 hours. Use 2 g every 8 hours for a high MIC or meningitis.',
    cefepime: hd?'1 g every 24 hours, plus 1 g after hemodialysis.':c<30?'2 g every 24 hours.':c<60?'2 g every 12 hours.':'2 g every 8 hours.',
    piptazo: hd?'2.25 g every 8 hours, plus a dose after hemodialysis.':c<20?'2.25 g every 8 hours.':c<40?'2.25 g every 6 hours.':'4.5 g every 6 hours, extended infusion.',
    ceftazavi: hd?'0.94 g every 24 to 48 hours, after hemodialysis.':c<30?'0.94 g every 12 to 24 hours.':c<50?'1.25 g every 8 hours.':'2.5 g every 8 hours over 3 hours.',
    merovab: hd?'Adjust from the label. Dose after hemodialysis.':c<30?'Reduce the 4 g dose. Confirm the label.':c<50?'Reduce the interval or the dose from the label.':'4 g every 8 hours over 3 hours.',
    imirele: hd?'Label dose after hemodialysis.':c<30?'Renal label dose.':'Full label dose when clearance is normal. Confirm the product table.',
    ceftolozane: hd?'Reduced label dose after hemodialysis.':c<50?'Reduce from the pneumonia dose.':'Pneumonia: 3 g every 8 hours over 3 hours. Urine or abdomen: 1.5 g.',
    cefiderocol: hd?'Reduced dose after hemodialysis.':c<60?'Reduce from 2 g every 8 hours.':'2 g every 8 hours over 3 hours.',
    aztavi: 'Product-specific dose. Give it over about 3 hours and adjust for this clearance of '+Math.round(c)+' mL/min.',
    cazazi: 'Infuse both over 3 hours. Adjust each drug for this clearance of '+Math.round(c)+' mL/min.',
    vancomycin: 'Load 20–25 mg/kg, then dose to an AUC/MIC of 400–600. Do not chase a trough of 15 by habit.',
    linezolid: '600 mg every 12 hours. Little renal change. Watch the platelets and serotonin drugs.',
    daptomycin: '8–10 mg/kg every 24 hours for bacteremia. Stretch the interval when clearance is under 30, including hemodialysis.',
    amikacin: 'Peak should be about 8–10 times the MIC. Extend the interval as clearance falls. Stop if the kidneys or hearing change.',
    tmp: 'About 5 mg/kg of trimethoprim every 8 hours for pneumonia, then stretch the interval as clearance falls.',
    sulbactam: c<30?'Reduce the every-6-hour dose. Confirm the label.':'1 g / 1 g every 6 hours over 3 hours when clearance allows.',
    tigecycline: 'Label load, then maintenance. Not a renal drug. Not a blood drug.',
    eravacycline: '1 mg/kg every 12 hours. Not a blood drug.'
  };
  var line=map[id]||'Confirm the label.';
  if(S.inf==='extended' && DRUG[id][1]==='fT>MIC' && S.rrt!=='ihd') line+=' Infuse over 3 hours.';
  if(S.inf==='continuous' && DRUG[id][1]==='fT>MIC') line+=' A continuous infusion can hold the level above the MIC.';
  if(S.load==='load' && (S.vd!=='normal' || S.sev==='shock')) line+=' Give a loading dose. The volume of distribution is large in shock.';
  return line;
}
function mechWarn(){
  var kind=ORG[S.org][1], m=S.mech;
  if((m==='esbl'||m==='kpc'||m==='oxa48'||m==='ndm'||m==='vim'||m==='imp') && kind!=='entero' && kind!=='unknown') return 'That enzyme is an Enterobacterales mechanism. It does not describe this organism.';
  if(m==='dtr' && kind!=='pseudo') return 'Difficult-to-treat is a Pseudomonas result.';
  if(m==='crab' && kind!=='acineto') return 'CRAB means Acinetobacter.';
  if(m==='steno' && kind!=='steno') return 'This pathway is only for Stenotrophomonas.';
  if(m==='ampc' && S.org!=='enterobacter') return 'The classic AmpC risk here is Enterobacter, Klebsiella aerogenes, or Citrobacter freundii.';
  return '';
}
function empiric(){
  var lines=[];
  if(S.prior==='ndm'||S.prior==='vim'||S.prior==='imp') lines.push('A previous MBL is known. Do not rely on meropenem.');
  else if(S.prior==='kpc'||S.prior==='oxa') lines.push('A previous serine carbapenemase is known. Meropenem alone is the wrong start.');
  else if(S.prior==='dtr') lines.push('A previous difficult Pseudomonas is known. The usual antipseudomonal beta-lactams may fail.');
  else if(S.prior==='crab') lines.push('A previous CRAB is known. A carbapenem does not cover it.');
  else if(S.where==='hospital' && (S.source==='vap'||S.source==='bsi')) lines.push('Hospital source. Cover Pseudomonas. Add MRSA cover only if the risk is real.');
  else if(S.where==='community' && S.source==='cap') lines.push('Community lung. Pseudomonas is not automatic.');
  if(S.sev==='low') lines.push('The chance of a bacterial infection is low. Do not start a broad drug just to feel covered.');
  if(S.recent==='yes') lines.push('Recent antibiotics raise the chance of resistance.');
  var c=crcl();
  if(c!=null && c>130) lines.push('Clearance is augmented. A normal dose may fall short.');
  return lines;
}
function views(){
  return {
    pt:function(){
      return '<p class="hint">Clearance uses age, sex, height, weight, and creatinine.</p><div class="grid">'
        +sel('where','Where',[['community','Community'],['hospital','Hospital']])
        +sel('source','Source',[['vap','HAP / VAP'],['cap','Severe community pneumonia'],['uti','Urine'],['iab','Abdomen'],['ssti','Skin'],['cns','Brain'],['bsi','Blood'],['line','Line'],['endo','Endocarditis']])
        +sel('sev','How sick',[['shock','Septic shock'],['sepsis','Sepsis'],['stable','Stable'],['low','Low chance of bacterial infection']])
        +box('age','Age')+sel('sex','Sex',[['male','Male'],['female','Female']])+box('ht','Height cm')+box('wt','Weight kg')+box('scr','Creatinine mg/dL')+box('uo','Urine mL/h')
        +sel('recent','Antibiotics in the last 90 days',[['no','No'],['yes','Yes']])
        +sel('prior','Previous resistant organism',[['none','None'],['mrsa','MRSA'],['esbl','ESBL'],['ampc','AmpC'],['kpc','KPC'],['oxa','OXA-48-like'],['ndm','NDM'],['vim','VIM'],['imp','IMP'],['dtr','Difficult Pseudomonas'],['crab','CRAB']])
        +'</div><div id="live"></div>';
    },
    bug:function(){
      return '<div class="grid">'
        +sel('org','Organism',Object.keys(ORG).map(function(k){return [k,ORG[k][0]];}))
        +sel('mech','Mechanism',Object.keys(MECH).map(function(k){return [k,MECH[k]];}))
        +box('mic','MIC mg/L')
        +sel('ast','Report',[['S','Susceptible'],['I','Intermediate'],['R','Resistant'],['pending','Pending']])
        +'</div><div id="live"></div>';
    },
    drug:function(){
      return '<div class="grid">'
        +sel('drug','Antibiotic',Object.keys(DRUG).map(function(k){return [k,DRUG[k][0]];}))
        +sel('inf','Infusion',[['standard','30 minutes'],['extended','3 hours'],['continuous','Continuous']])
        +sel('rrt','Kidney replacement',[['none','None'],['crrt','CRRT'],['ihd','Hemodialysis'],['sled','SLED']])
        +sel('load','Loading dose',[['standard','No extra load'],['load','Loading dose']])
        +'</div><div id="live"></div>';
    },
    pk:function(){
      return '<div class="grid">'
        +sel('traj','Clearance now',[['stable','Steady'],['arc','Augmented'],['aki','Falling fast'],['rrt','On replacement']])
        +sel('vd','Volume of distribution',[['normal','Normal'],['increased','Increased'],['marked','Very increased']])
        +sel('level','A measured level exists',[['no','No'],['yes','Yes']])
        +'</div><h2>Level against the MIC</h2><canvas id="chart" width="720" height="220"></canvas>'
        +'<div class="legend"><span><i></i>Free level</span><span><i class="red"></i>MIC</span></div>'
        +'<p class="hint">Hours along the bottom. This is a sketch, not a measured level.</p><div id="live"></div>';
    },
    plan:function(){
      return '<div class="grid">'
        +sel('identified','Organism is known',[['yes','Yes'],['no','No']])
        +sel('astYes','Susceptibility is known',[['yes','Yes'],['no','No']])
        +sel('resp','Course',[['improving','Improving'],['stable','Unchanged'],['worsening','Worse']])
        +sel('control','Source controlled',[['yes','Yes'],['no','No']])
        +'</div><div id="live"></div><p><a href="index.html">All simulators</a></p>';
    }
  };
}
function livePt(){
  var c=crcl();
  var lines=empiric();
  if(c==null) return out('Need the body numbers', []);
  lines.unshift(band(c)+'.');
  var u=num('uo'), w=num('wt');
  if(u!=null&&w) lines.push('Urine '+(u/w).toFixed(2)+' mL/kg/h.');
  return out('Creatinine clearance '+Math.round(c)+' mL/min', lines, c<30||c>130);
}
function liveBug(){
  var warn=mechWarn();
  var pref=prefList();
  var lines=[];
  if(warn) lines.push(warn);
  if(S.mech==='esbl') lines.push('For invasive infection, a carbapenem. Do not trust piperacillin in the blood.');
  if(S.mech==='ampc') lines.push('Cefepime can hold AmpC when the MIC is low. Ceftriaxone can fail on treatment.');
  if(S.mech==='kpc') lines.push('Serine carbapenemase. Avibactam, vaborbactam, or relebactam.');
  if(S.mech==='oxa48') lines.push('Ceftazidime-avibactam. Vaborbactam does not cover this enzyme.');
  if(S.mech==='ndm'||S.mech==='vim'||S.mech==='imp') lines.push('Metallo-beta-lactamase. Aztreonam-avibactam or susceptible cefiderocol. Avibactam alone is not enough.');
  if(S.mech==='dtr') lines.push('Ceftolozane-tazobactam, ceftazidime-avibactam, imipenem-relebactam, or cefiderocol, from the panel.');
  if(S.mech==='crab') lines.push('Sulbactam-durlobactam, or susceptible cefiderocol.');
  if(S.mech==='steno') lines.push('Not meropenem. Trimethoprim-sulfamethoxazole or susceptible cefiderocol.');
  if(pref.length) lines.push('Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.');
  lines.push('MIC '+(num('mic')==null?'—':num('mic'))+' mg/L. '+(S.ast==='R'?'Resistant.':S.ast==='pending'?'Result still pending.':'Use the MIC with the exposure.'));
  return out(ORG[S.org][0]+' · '+MECH[S.mech], lines, !!warn||S.ast==='R');
}
function liveDrug(){
  var j=judge();
  var lines=j.lines.slice();
  lines.push(DRUG[S.drug][1]+'.');
  lines.push(doseLine());
  return out(j.title, lines, j.bad);
}
function series(){
  var mic=num('mic'); if(mic==null) mic=1;
  var c=crcl(); if(c==null) c=80;
  var ke=0.15*(c/80);
  if(S.traj==='arc'||c>130) ke*=1.7;
  if(S.traj==='aki') ke*=0.4;
  if(S.rrt==='crrt'||S.traj==='rrt') ke=0.12;
  var vd=S.vd==='marked'?1.8:S.vd==='increased'?1.35:1;
  var inf=S.inf==='continuous'?8:S.inf==='extended'?3:0.5;
  var peak=(S.load==='load'?40:28)/vd;
  var pts=[];
  for(var t=0;t<=8.001;t+=0.25){
    var y;
    if(S.inf==='continuous') y=peak*0.55;
    else if(t<=inf) y=peak*(t/inf);
    else y=peak*Math.exp(-ke*(t-inf));
    pts.push(y);
  }
  var above=pts.filter(function(y){return y>mic;}).length/pts.length;
  return {pts:pts, mic:mic, above:above};
}
function draw(){
  var c=document.getElementById('chart'); if(!c) return;
  var dpr=Math.min(2, devicePixelRatio||1);
  var W=c.clientWidth||640, H=c.clientHeight||220;
  c.width=W*dpr; c.height=H*dpr;
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var s=series();
  var max=Math.max(s.mic*1.4, 8, Math.max.apply(null,s.pts));
  var L=46,T=16,B=28,R=W-10, n=s.pts.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-v/max); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [0,2,4,6,8].forEach(function(h){ g.fillText(h+' h', X(h*4)-8, H-8); });
  g.fillText('mg/L', 4, 12);
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(s.mic)); g.lineTo(R,Y(s.mic)); g.stroke(); g.setLineDash([]);
  g.fillText('MIC '+s.mic, L, Y(s.mic)-4);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  s.pts.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
}
function livePk(){
  draw();
  var s=series();
  var lines=[];
  var idx=DRUG[S.drug][1];
  if(idx==='fT>MIC') lines.push('Time above the MIC is the target. About '+Math.round(s.above*100)+'% of this interval is above the red line.');
  if(idx==='AUC/MIC') lines.push('The target is the area under the curve, not a single peak. Vancomycin wants an AUC/MIC of 400–600.');
  if(idx==='Cmax/MIC') lines.push('The peak should be several times the MIC. Watch the trough so the drug can clear.');
  if(S.traj==='arc') lines.push('Augmented clearance can drop the level under the MIC before the next dose.');
  if(S.traj==='aki') lines.push('Clearance is changing. Recalculate rather than leaving yesterday’s dose.');
  if(S.vd!=='normal') lines.push('A larger volume lowers the early level. Load, then maintain.');
  if(S.level==='yes') lines.push('Use the measured level. This sketch does not replace it.');
  if(judge().bad) lines.push('A level above the MIC does not help if the enzyme destroys the drug.');
  var bad=judge().bad||(idx==='fT>MIC' && s.above<0.5);
  return out(idx, lines, bad);
}
function livePlan(){
  var j=judge();
  var lines=[];
  lines.push(ORG[S.org][0]+', '+MECH[S.mech]+', MIC '+(num('mic')==null?'—':num('mic'))+'.');
  lines.push(DRUG[S.drug][0]+'. '+doseLine());
  if(j.bad) lines.push(j.title+'.');
  if(S.resp==='worsening') lines.push('Worse: check the source, the MIC, the level, and a new bug before adding another drug.');
  else if(S.control==='no') lines.push('The source is not controlled. Drainage or line removal matters more than a broader drug.');
  else if(S.identified==='yes' && S.astYes==='yes' && !j.bad) lines.push('Narrow to this active drug. Stop duplicate cover. Ask whether the vein can become a tablet.');
  else lines.push('Cultures are incomplete. Reassess before the broad drug becomes the habit.');
  var c=crcl(); if(c!=null) lines.push('Clearance '+Math.round(c)+' mL/min.');
  return out(S.resp==='worsening'||j.bad?'Change the plan':'Stewardship plan', lines, S.resp==='worsening'||S.control==='no'||j.bad);
}
function refresh(){
  var id=stack[stack.length-1];
  var el=document.getElementById('live');
  var html=id==='pt'?livePt():id==='bug'?liveBug():id==='drug'?liveDrug():id==='pk'?livePk():livePlan();
  if(el) el.innerHTML=html;
  var ok=id==='pt'?crcl()!=null:id==='bug'?num('mic')!=null:true;
  document.getElementById('next').disabled=id==='plan'?false:!ok;
}
function show(){
  var id=stack[stack.length-1];
  var order=['pt','bug','drug','pk','plan'];
  document.getElementById('stepName').textContent=TITLE[id]+' · '+(order.indexOf(id)+1)+' of 5';
  document.getElementById('view').innerHTML=views()[id]();
  document.getElementById('back').disabled=stack.length<2;
  document.getElementById('next').textContent=id==='plan'?'Done':'Next';
  refresh();
}
document.getElementById('view').oninput=function(e){
  if(!e.target.id) return;
  S[e.target.id]=e.target.value;
  refresh();
};
document.getElementById('view').onchange=document.getElementById('view').oninput;
document.getElementById('back').onclick=function(){ if(stack.length>1){ stack.pop(); show(); } };
document.getElementById('next').onclick=function(){
  var id=stack[stack.length-1];
  if(id==='plan'){ location.href='index.html'; return; }
  var order=['pt','bug','drug','pk','plan'];
  stack.push(order[order.indexOf(id)+1]);
  show();
};
show();
</script>
