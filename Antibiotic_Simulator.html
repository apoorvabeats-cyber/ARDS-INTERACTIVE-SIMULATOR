<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#071b3a">
<title>Antibiotic simulator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f7fb; color: #14213d; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.4; }
  button { font: inherit; cursor: pointer; border: 1px solid #d7e0ec; background: #fff; color: #14213d; border-radius: 14px; min-height: 48px; padding: 10px 12px; text-align: left; }
  .wrap { max-width: 840px; margin: 0 auto; padding: 16px 16px 48px; }
  .hero { background: linear-gradient(135deg,#071b3a,#1457a6); color: #fff; border-radius: 24px; padding: 22px 18px; }
  h1 { font-size: clamp(28px, 7vw, 42px); line-height: 1.05; margin: 8px 0; }
  h2 { margin: 16px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #5f6f86; }
  p { margin: 0; }
  a { color: #9ec5ff; }
  .lede { color: #dbe9ff; font-size: 16px; }
  .card { display: block; width: 100%; margin-top: 10px; }
  .card b { display: block; color: #1457a6; font-size: 17px; }
  .meta { color: #5f6f86; margin-top: 4px; font-size: 14px; }
  .slip { background: #fff; border: 1px solid #d7e0ec; border-radius: 16px; padding: 12px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #eef2f6; }
  .row span { color: #5f6f86; }
  .opts { display: grid; gap: 8px; margin-top: 8px; }
  .good { background: #ecfdf5; border-color: #9bd9c5; }
  .bad { background: #fff1f2; border-color: #f1a4ad; }
  .ok { background: #fff8e6; border-color: #efd28d; }
  .top { display: flex; gap: 8px; margin-top: 12px; }
  .top button { flex: 1; text-align: center; }
  .pill { display: inline-block; background: #e9f2ff; color: #1457a6; border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 13px; margin-right: 6px; }
</style>
</head>
<body>
<div id="app"></div>

let screen = "board";
let caseId = null;
let picked = null;
const seen = {};

function cur() { return CASES.find((c) => c.id === caseId); }
const app = document.getElementById("app");

function draw() {
  if (screen === "primer") return primer();
  if (screen === "case") return showCase();
  board();
}
function board() {
  const hub = location.hostname.endsWith("github.io") ? '<p><a href="index.html">← All simulators</a></p>' : "";
  const groups = ["Community", "Hospital", "Carbapenemase"];
  app.innerHTML = `<div class="wrap"><div class="hero">${hub}
    <div style="font-size:13px;letter-spacing:.08em;font-weight:700">INFECTION IN CRITICAL CARE</div>
    <h1>Antibiotic simulator</h1>
    <p class="lede">A culture comes back. You pick the drug that covers the organism, at a dose the kidneys can tolerate, with the toxicity this patient will actually meet.</p>
    <div class="top"><button id="pk">PK/PD and toxicity</button></div>
  </div>
  ${groups.map((g) => `<h2>${g}</h2>` + CASES.filter((c) => c.group === g).map((c) =>
    `<button class="card" data-id="${c.id}"><b>${c.title}</b><div class="meta">${c.bug}${seen[c.id] ? " · done" : ""}</div></button>`
  ).join("")).join("")}
  <p class="meta" style="margin-top:16px">Educational drill. Doses are typical adult IV starting points, not a prescription. Confirm with the culture, the creatinine clearance, the local antibiogram, and pharmacy or infectious diseases.</p>
  </div>`;
  document.getElementById("pk").onclick = () => { screen = "primer"; draw(); };
  app.querySelectorAll(".card").forEach((b) => b.onclick = () => {
    caseId = b.dataset.id; picked = null; cur() && (cur()._order = null); screen = "case"; draw();
  });
}
function showCase() {
  const c = cur();
  app.innerHTML = `<div class="wrap"><div class="hero">
    <div style="font-size:13px;letter-spacing:.08em;font-weight:700">${c.group.toUpperCase()}</div>
    <h1>${c.title}</h1>
    <div class="top"><button id="back">Cases</button></div>
  </div>
  <div class="slip"><p>${c.story}</p></div>
  <h2>Culture</h2>
  <div class="slip">
    <div class="row"><span>Organism</span><b>${c.bug}</b></div>
    <div class="row"><span>Source</span><b>${c.source}</b></div>
    <div class="row"><span>Marker</span><b>${c.mech}</b></div>
  </div>
  <h2>${c.ask}</h2>
  <div class="opts" id="opts">${(c._order||(c._order=c.options.map((_,i)=>i).sort(()=>Math.random()-0.5))).map((i) => `<button data-i="${i}">${c.options[i].t}</button>`).join("")}</div>
  <div class="slip" id="fb" style="display:none"></div>
  </div>`;
  document.getElementById("back").onclick = () => { screen = "board"; draw(); };
  document.getElementById("opts").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || picked) return;
    picked = c.options[+b.dataset.i];
    seen[c.id] = true;
    document.querySelectorAll("#opts button").forEach((btn) => {
      const g = c.options[+btn.dataset.i].grade;
      if (g === "best") btn.className = "good";
      else if (btn === b && g === "bad") btn.className = "bad";
      else if (btn === b && g === "ok") btn.className = "ok";
    });
    const fb = document.getElementById("fb");
    const label = picked.grade === "best" ? "Right drug." : picked.grade === "ok" ? "Active, not the best fit." : "Not this drug.";
    fb.style.display = "block";
    fb.className = "slip " + (picked.grade === "best" ? "good" : picked.grade === "ok" ? "ok" : "bad");
    fb.innerHTML = `<b>${label}</b><p style="margin-top:8px">${picked.why}</p>
      <p style="margin-top:10px"><span class="pill">PK/PD</span> ${c.pk}</p>
      <p style="margin-top:8px"><span class="pill">Harm</span> ${c.harm}</p>`;
  };
}
