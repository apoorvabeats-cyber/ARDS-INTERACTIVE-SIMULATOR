<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antibiotic simulator</title>
<style>

:root{--primary:#0f766e;--primary-dark:#115e59;--secondary:#475569;--bg:#f4f7fb;--card:#fff;--text:#14213d;--border:#e2e8f0;--danger:#be123c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 18px;background:var(--primary);color:#fff}
.header h1{margin:0;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.btn-preset{background:#ecfdf5;color:#115e59;border:0;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}
.layout{display:grid;grid-template-columns:240px 1fr 320px;gap:14px;padding:14px;max-width:1180px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.stepper,.main-panel,.output-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}
.step-item{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--secondary);font-size:14px}
.step-item.active{background:#ecfdf5;color:var(--primary-dark)}
.step-number{width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step-item.active .step-number{background:var(--primary);color:#fff}
.step-title{font-size:20px;font-weight:800;color:var(--primary-dark);margin:4px 0}
.step-desc{color:var(--secondary);font-weight:700;margin-bottom:12px}
.form-label,label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#334155;margin-bottom:6px}
.radio-group,.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.chip-option{border:2px solid #cbd5e1;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}
.chip-option.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
input,select{width:100%;font-size:16px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px}
.btn-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.btn-prev{background:#e2e8f0}
.btn-next{background:var(--primary);color:#fff}
.btn:disabled{opacity:.45}
.output-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px}
.badge{border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}
.badge-danger{background:#ffe4e6;color:#9f1239}
.badge-success{background:#d1fae5;color:#065f46}
.rec-box{background:#f8fafc;border-left:4px solid var(--primary);padding:10px 12px;border-radius:0 10px 10px 0;margin-bottom:10px;font-weight:700}
.rec-box h4{margin:0 0 4px;color:var(--primary-dark)}
.rec-box ul{margin:6px 0 0;padding-left:18px}
.summary-item{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px}
.report{display:flex;flex-direction:column;gap:8px}
.report button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:16px}
.report button.on{border-color:var(--primary);background:#ecfdf5}
.report button.on.bad{border-color:var(--danger);background:#fff1f2}
.tag{border-radius:8px;padding:2px 8px}
.tag.S{background:#d1fae5;color:#065f46}
.tag.I{background:#fef3c7;color:#92400e}
.tag.R{background:#ffe4e6;color:#9f1239}
canvas{width:100%;height:220px;background:#fff;border:2px solid #e2e8f0;border-radius:12px;display:block}
.legend{display:flex;gap:14px;font-size:13px;font-weight:800;margin-top:8px}
.legend i{display:inline-block;width:18px;height:4px;background:var(--primary);margin-right:6px;vertical-align:middle}
.legend .red{background:#dc2626}
a{color:var(--primary)}
.form-group{margin-bottom:14px}

</style>
</head>
<body>
<div class="header"><h1>Antibiotics</h1><div class="presets">
<button class="btn-preset" onclick="preset('hap')">Severe pneumonia</button>
<button class="btn-preset" onclick="preset('uti')">Urine, ESBL</button>
<button class="btn-preset" onclick="preset('crrt')">Shock on CRRT</button>
</div></div>
<div class="layout">
<div class="stepper" id="stepper"></div>
<div class="main-panel"><div id="step-content"></div><div class="btn-nav"><button class="btn btn-prev" id="btn-prev" type="button">Previous</button><button class="btn btn-next" id="btn-next" type="button">Next step</button></div></div>
<div class="output-panel"><div class="output-title"><span>What to do</span><span class="badge badge-success" id="status-badge">Empiric</span></div><div id="recommendation-content"></div><div class="output-title">This patient</div><div id="summary-list"></div><p><a href="index.html">All simulators</a></p></div>
</div>
<script>
var S={age:'60',sex:'male',ht:'170',wt:'70',scr:'1',uo:'50',eff:'25',where:'hospital',source:'vap',sev:'shock',bact:'yes',blood:'yes',srcx:'yes',addMrsa:'yes',addPseudo:'yes',addAna:'no',allergy:'no',recent:'no',prior:'none',risks:[],org:'kleb',mech:'esbl',mic:'',hasmic:'no',ast:'S',drug:'meropenem',inf:'extended',rrt:'none',load:'load',traj:'stable',vd:'increased',level:'no',identified:'yes',astYes:'yes',resp:'improving',control:'yes',po:'no'};
function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function crcl(){
  var age=num('age'), wt=num('wt'), scr=num('scr'), ht=num('ht');
  if(age==null||wt==null||scr==null||ht==null||scr<=0||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  var use=wt;
  if(bmi>=30 && wt>ibw) use=ibw+0.4*(wt-ibw);
  var c=(140-age)*use/(72*scr);
  if(S.sex==='female') c*=0.85;
  return Math.max(0,c);
}
function band(c){
  if(c==null) return '';
  if(c>130) return 'Augmented clearance';
  if(c>=90) return 'Normal';
  if(c>=60) return 'Mild impairment';
  if(c>=30) return 'Moderate impairment';
  return 'Severe impairment';
}
function box(id,label){ return '<div><label>'+label+'</label><input id="'+id+'" inputmode="decimal" value="'+(S[id]||'')+'"></div>'; }
function sel(id,label,opts){
  return '<div><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){
    return '<option value="'+o[0]+'"'+(S[id]===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('')+'</select></div>';
}
function out(title,lines,bad){
  return '<div class="out'+(bad?' bad':'')+'"><b>'+title+'</b>'+(lines&&lines.length?'<ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>':'')+'</div>';
}
var ORG={
  ecoli:['Escherichia coli','entero'], kleb:['Klebsiella pneumoniae','entero'], enterobacter:['Enterobacter cloacae complex','entero'],
  pseudomonas:['Pseudomonas aeruginosa','pseudo'], acinetobacter:['Acinetobacter baumannii','acineto'], steno:['Stenotrophomonas maltophilia','steno'],
  mrsa:['MRSA','mrsa'], mssa:['MSSA','mssa'], faecalis:['Enterococcus faecalis','faecalis'], enterococcus:['Enterococcus faecium','vre'], unknown:['Unknown gram-negative','entero']
};
var MECH={
  none:'No enzyme named', esbl:'ESBL', ampc:'AmpC', kpc:'KPC', oxa48:'OXA-48-like',
  ndm:'NDM', vim:'VIM', imp:'IMP', dtr:'Difficult-to-treat Pseudomonas', crab:'CRAB', steno:'Stenotrophomonas'
};
var PREF={
  esbl:['meropenem'],
  ampc:['cefepime','meropenem'],
  kpc:['ceftazavi','merovab','imirele','cefiderocol'],
  oxa48:['ceftazavi','cefiderocol'],
  ndm:['aztavi','cazazi','cefiderocol'],
  vim:['aztavi','cazazi','cefiderocol'],
  imp:['aztavi','cazazi','cefiderocol'],
  dtr:['ceftolozane','ceftazavi','imirele','cefiderocol'],
  crab:['sulbactam','cefiderocol'],
  steno:['tmp','cefiderocol']
};
var DRUG={
  meropenem:['Meropenem','fT>MIC','ESBL bacteremia. Not NDM, KPC, or OXA-48.','Lowers valproate. Seizures if the dose ignores the kidneys.'],
  cefepime:['Cefepime','fT>MIC','AmpC when the MIC is low. Susceptible Pseudomonas.','Encephalopathy, myoclonus, and seizures when it accumulates.'],
  piptazo:['Piperacillin-tazobactam','fT>MIC','Susceptible mixed infection. Not ESBL bacteremia. Not AmpC.','Kidney injury when combined with vancomycin.'],
  ceftazavi:['Ceftazidime-avibactam','fT>MIC','KPC and OXA-48-like. Not an MBL alone.','Fails if an NDM is also present.'],
  merovab:['Meropenem-vaborbactam','fT>MIC','KPC. Not OXA-48. Not an MBL.','Vaborbactam does not cover every carbapenemase.'],
  imirele:['Imipenem-relebactam','fT>MIC','KPC and some difficult Pseudomonas. Not an MBL.','Seizure risk of imipenem if the dose is high for the kidneys.'],
  ceftolozane:['Ceftolozane-tazobactam','fT>MIC','Difficult Pseudomonas. Pneumonia is 3 g, not 1.5 g.','The urinary dose under-treats pneumonia.'],
  cefiderocol:['Cefiderocol','fT>MIC','MBL, difficult Pseudomonas, selected CRAB, Stenotrophomonas, when susceptible.','Resistance can emerge. Confirm the MIC.'],
  aztavi:['Aztreonam-avibactam','fT>MIC','NDM, VIM, or IMP Enterobacterales.','Aztreonam alone is not enough if an ESBL or AmpC is also there.'],
  cazazi:['Ceftazidime-avibactam + aztreonam','fT>MIC','MBL Enterobacterales when aztreonam-avibactam is not available.','Both drugs still need a 3-hour infusion.'],
  vancomycin:['Vancomycin','AUC/MIC','MRSA, including pneumonia.','Kidney injury, ear toxicity, and the red-man infusion reaction.'],
  linezolid:['Linezolid','AUC/MIC','MRSA pneumonia. Not the best drug for bacteremia.','Marrow suppression, neuropathy, and serotonin syndrome with an SSRI.'],
  daptomycin:['Daptomycin','Cmax/MIC','MRSA or VRE in the blood. Never pneumonia.','Muscle injury. Stop the statin. Surfactant kills it in the lung.'],
  amikacin:['Amikacin','Cmax/MIC','Add-on for selected gram-negatives. Not pneumonia alone.','Kidney injury and hearing loss.'],
  tmp:['Trimethoprim-sulfamethoxazole','AUC/MIC','Stenotrophomonas. Dose on the trimethoprim.','Potassium rises, kidneys worsen, marrow falls, severe rash.'],
  sulbactam:['Sulbactam-durlobactam','fT>MIC','CRAB.','Still needs a susceptibility check.'],
  tigecycline:['Tigecycline','AUC/MIC','Some intra-abdominal CRE. Not the blood.','Low blood levels. Nausea. Higher death in some bloodstream uses.'],
  eravacycline:['Eravacycline','AUC/MIC','Selected CRE or CRAB outside the blood.','Not a bloodstream drug.'],
  aztreonam:['Aztreonam','fT>MIC','Gram-negatives, including Pseudomonas, after penicillin anaphylaxis.','No anaerobic cover. An ESBL or a metallo-enzyme can destroy it.'],
  ceftriaxone:['Ceftriaxone','fT>MIC','Third-generation cephalosporin. Community lung, urine, and meningitis.','Does not treat Pseudomonas, AmpC, or ESBL.'],
  cefazolin:['Cefazolin','fT>MIC','First-generation cephalosporin. The narrow drug for MSSA.','Does not treat MRSA, Pseudomonas, or meningitis.'],
  ampicillin:['Ampicillin','fT>MIC','Aminopenicillin. Susceptible Enterococcus faecalis, and Listeria in meningitis.','Does not treat ESBL, Pseudomonas, or Enterococcus faecium.'],
  levofloxacin:['Levofloxacin','AUC/MIC','Fluoroquinolone. A reserve drug for community lung when a beta-lactam cannot be given.','Tendons, a long QT, and C. difficile.'],
  ciprofloxacin:['Ciprofloxacin','AUC/MIC','Fluoroquinolone with Pseudomonas activity, mostly for urine.','Weak for pneumonia. Same harms as levofloxacin.'],
  azithromycin:['Azithromycin','AUC/MIC','Macrolide. The atypical partner in community pneumonia.','Not a drug for bacteremia.'],
  metronidazole:['Metronidazole','AUC/MIC','Nitroimidazole. Anaerobes only.','It does not treat gram-negative aerobes. Neuropathy if the course is long.'],
  polymyxin:['Polymyxin B','AUC/MIC','Polymyxin. Last drug for some carbapenem-resistant gram-negatives.','Kidney injury. It does not reach the urine.']
};
var BETA={meropenem:1,cefepime:1,piptazo:1,ceftazavi:1,merovab:1,imirele:1,ceftolozane:1,cefiderocol:1,aztavi:1,cazazi:1,sulbactam:1,aztreonam:1,ceftriaxone:1,cefazolin:1,ampicillin:1};
function prefList(){ return PREF[S.mech]||[]; }
function siteBlock(id){
  var kind=ORG[S.org][1];
  if((id==='tigecycline'||id==='eravacycline'||id==='azithromycin') && (S.source==='bsi'||S.source==='endo'||S.source==='line')) return 'Blood levels are too low.';
  if(id==='daptomycin' && (S.source==='vap'||S.source==='cap')) return 'Surfactant in the lung inactivates daptomycin.';
  if(id==='cefazolin' && S.source==='cns') return 'Cefazolin does not treat meningitis.';
  if(id==='polymyxin' && S.source==='uti') return 'Polymyxin B does not reach the urine.';
  if(id==='metronidazole' && S.source!=='iab' && S.source!=='cns') return 'Metronidazole does not treat this site.';
  if(id==='azithromycin' && S.source!=='cap') return 'A macrolide is not the drug for this site.';
  if(id==='ciprofloxacin' && (S.source==='vap'||S.source==='cap')) return 'Ciprofloxacin is a weak pneumonia drug.';
  var gp={vancomycin:1,linezolid:1,daptomycin:1,cefazolin:1,ampicillin:1};
  if(gp[id] && kind!=='mrsa' && kind!=='vre' && kind!=='mssa' && kind!=='faecalis'){
    if(id==='ampicillin' && S.source==='cns') return '';
    return 'This is a gram-positive drug. It does not treat this culture.';
  }
  if(!gp[id] && id!=='tmp' && id!=='metronidazole' && (kind==='mrsa'||kind==='vre'||kind==='mssa'||kind==='faecalis')) return 'This drug does not treat this gram-positive culture.';
  return '';
}
function judge(){
  var id=S.drug, pref=prefList(), block=siteBlock(id);
  if(S.ast==='R'){
    var alt=prefList();
    var why=['Do not use a drug the report marks resistant.'];
    if(alt.length) why.push('Look at '+alt.map(function(x){return DRUG[x][0];}).join(', ')+'.');
    return {bad:true, title:'Lab says resistant', lines:why};
  }
  if(S.allergy==='anaphylaxis' && BETA[id]) return {bad:true, title:'Penicillin anaphylaxis', lines:['This is a beta-lactam. Do not start it until the allergy is reviewed. Aztreonam is the gram-negative substitute when the organism is still susceptible to it.']};
  if(block) return {bad:true, title:'Wrong place or wrong bug', lines:[block]};
  if(S.mech==='none'){
    if(id==='polymyxin') return {bad:true, title:'Last drug, not the first', lines:['A polymyxin is not the first drug when no enzyme is named.']};
    if(id==='aztreonam' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first choice', lines:['Aztreonam is for penicillin anaphylaxis. It misses anaerobes and many resistant gram-negatives.']};
    if(id==='aztreonam') return {bad:false, title:'Anaphylaxis substitute', lines:[DRUG.aztreonam[2], DRUG.aztreonam[3]]};
    if(id==='cefazolin' && ORG[S.org][1]==='mssa') return {bad:false, title:'MSSA drug', lines:[DRUG.cefazolin[2], DRUG.cefazolin[3]]};
    if(id==='vancomycin' && ORG[S.org][1]==='mssa') return {bad:true, title:'Too broad once MSSA is known', lines:['Switch to cefazolin.']};
    if(id==='ampicillin' && ORG[S.org][1]==='faecalis') return {bad:false, title:'Faecalis drug', lines:[DRUG.ampicillin[2], DRUG.ampicillin[3]]};
    if(id==='ampicillin') return {bad:true, title:'Too narrow', lines:['Ampicillin is for susceptible Enterococcus faecalis, or Listeria in meningitis.']};
    if(id==='ceftriaxone' && ORG[S.org][1]==='pseudo') return {bad:true, title:'No Pseudomonas activity', lines:['Ceftriaxone does not treat Pseudomonas.']};
    if(id==='ceftriaxone' && (S.source==='vap'||S.where==='hospital') && S.source!=='cns') return {bad:true, title:'Too narrow for a hospital infection', lines:['Ceftriaxone misses Pseudomonas and AmpC.']};
    if(id==='levofloxacin' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first drug', lines:['A fluoroquinolone is a reserve. Tendons, a long QT, and C. difficile.']};
    if(id==='levofloxacin') return {bad:false, title:'Anaphylaxis reserve', lines:[DRUG.levofloxacin[2], DRUG.levofloxacin[3]]};
    if(id==='ciprofloxacin' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first drug', lines:['Save ciprofloxacin. It is weak for pneumonia and it harms tendons, the QT, and the gut.']};
    if(id==='azithromycin') return {bad:false, title:'Partner only', lines:['Azithromycin covers atypicals. It does not replace the beta-lactam.']};
    if(id==='metronidazole') return {bad:false, title:'Anaerobes only', lines:['Keep the gram-negative drug. Metronidazole does not replace it.']};
    if(S.org==='pseudomonas' && id==='meropenem') return {bad:false, title:'Active if susceptible', lines:['Pseudomonas needs an antipseudomonal drug. Ertapenem would not be one.']};
    if(ORG[S.org][1]==='mrsa' && (id==='vancomycin'||id==='linezolid')) return {bad:false, title:id==='linezolid'&&(S.source==='bsi'||S.source==='endo')?'Weak for the blood':'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mrsa' && id==='daptomycin') return {bad:false, title:'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='vre' && id==='vancomycin') return {bad:true, title:'Vancomycin does not treat VRE', lines:['Use high-dose daptomycin or linezolid.']};
    if(ORG[S.org][1]==='vre' && (id==='daptomycin'||id==='linezolid')) return {bad:false, title:'VRE pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mssa' && id==='cefepime') return {bad:true, title:'Too broad', lines:['MSSA bacteremia wants cefazolin or an anti-staphylococcal penicillin, not a Pseudomonas drug.']};
    return {bad:false, title:'No enzyme named', lines:['Use the narrowest susceptible drug for the site.', DRUG[id][3]]};
  }
  if(id==='polymyxin') return {bad:true, title:'Last drug, not the first', lines:['Use a polymyxin only when the newer active drug cannot be given. It injures the kidneys, and polymyxin B does not treat urine.']};
  if(pref.indexOf(id)>=0) return {bad:false, title:'Fits '+MECH[S.mech], lines:[DRUG[id][2], DRUG[id][3]]};
  if(S.mech==='esbl' && id==='piptazo') return {bad:true, title:'Not for ESBL in the blood', lines:['A susceptible piperacillin result is not enough for ESBL bacteremia. Use a carbapenem.']};
  if(S.mech==='ampc' && id==='piptazo') return {bad:true, title:'Tazobactam does not hold AmpC', lines:['Cefepime is the narrower active choice when the MIC allows it.']};
  if((S.mech==='ndm'||S.mech==='vim'||S.mech==='imp') && id==='ceftazavi') return {bad:true, title:'Avibactam alone does not stop an MBL', lines:['Add aztreonam, or use aztreonam-avibactam or susceptible cefiderocol.']};
  if((S.mech==='oxa48') && id==='merovab') return {bad:true, title:'Vaborbactam is for KPC', lines:['OXA-48-like needs ceftazidime-avibactam.']};
  if(S.mech==='kpc' && id==='meropenem') return {bad:true, title:'KPC hydrolyzes meropenem', lines:['A longer infusion does not replace avibactam, vaborbactam, or relebactam.']};
  if(S.mech==='dtr' && (id==='meropenem'||id==='cefepime'||id==='piptazo')) return {bad:true, title:'The usual Pseudomonas drugs have already failed', lines:['Use a susceptible newer antipseudomonal agent.']};
  if(S.mech==='crab' && id==='meropenem') return {bad:true, title:'Not a CRAB drug', lines:['Use sulbactam-durlobactam or susceptible cefiderocol.']};
  if(S.mech==='steno' && (id==='meropenem'||id==='cefepime')) return {bad:true, title:'Inactive against Stenotrophomonas', lines:['Trimethoprim-sulfamethoxazole or susceptible cefiderocol.']};
  return {bad:true, title:'Does not match '+MECH[S.mech], lines:['Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.']};
}
function doseWt(){
  var wt=num('wt'), ht=num('ht');
  if(wt==null||ht==null||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  if(bmi>=30 && wt>ibw) return ibw+0.4*(wt-ibw);
  return wt;
}
function g(mg){
  if(mg===3375) return '3.375 g';
  if(mg===2250) return '2.25 g';
  if(mg>=1000) return (Math.round(mg/10)/100)+' g';
  return Math.round(mg)+' mg';
}
function tier(){
  if(S.rrt==='ihd') return 'hd';
  if(S.rrt==='sled') return 'sled';
  if(S.rrt==='crrt'){ var e=num('eff'); if(e==null) e=25; return e>=25?'crrt':'crrtLow'; }
  var c=crcl();
  if(c==null) return null;
  if(c>=120 || S.traj==='arc') return 'arc';
  return c;
}
function wantLoad(){ return S.load==='load' || S.vd!=='normal' || S.sev==='shock'; }
function regimen(){
  var t=tier(), c=crcl(), id=S.drug, wt=num('wt'), dw=doseWt();
  if(t==null || (id!=='linezolid' && id!=='tigecycline' && id!=='azithromycin' && id!=='metronidazole' && c==null && S.rrt==='none')) return null;
  var mic=num('mic')||1;
  var high=S.source==='cns' || mic>=4 || S.sev==='shock';
  var lung=S.source==='vap'||S.source==='cap';
  var row, loadMg, every, after=false, note='';
  function pick(rows){ return rows; }
  if(id==='meropenem'){
    if(t==='arc') row=high?[2000,6]:[2000,8];
    else if(t==='hd'){ row=[500,24]; after=true; }
    else if(t==='crrt') row=high?[2000,8]:[1000,8];

function mechWarn(){

  if(m==='dtr' && kind!=='pseudo') return 'Difficult-to-treat is a Pseudomonas result.';
  if(m==='crab' && kind!=='acineto') return 'CRAB means Acinetobacter.';
  if(m==='steno' && kind!=='steno') return 'This pathway is only for Stenotrophomonas.';
  if(m==='ampc' && S.org!=='enterobacter') return 'The classic AmpC risk here is Enterobacter, Klebsiella aerogenes, or Citrobacter freundii.';

function hasRisk(x){ return S.risks && S.risks.indexOf(x)>=0; }

function needAna(){ return S.source==='iab'; }
function coverMiss(){
  var miss=[];

  if(needMrsa()!==(S.addMrsa==='yes')) miss.push('MRSA');
  if(needPseudo()!==(S.addPseudo==='yes')) miss.push('Pseudomonas');
  if(needAna()!==(S.addAna==='yes')) miss.push('Anaerobes');

function empiric(){
  var lines=[];

  else if(S.prior==='kpc'||S.prior==='oxa') lines.push('A previous serine carbapenemase is known. Meropenem alone is the wrong start.');
  else if(S.prior==='dtr') lines.push('A previous difficult Pseudomonas is known. The usual antipseudomonal beta-lactams may fail.');
  else if(S.prior==='crab') lines.push('A previous CRAB is known. A carbapenem does not cover it.');
  else if(S.where==='community' && S.source==='cap') lines.push('Community lung. Pseudomonas is not automatic.');
  if(S.sev==='low') lines.push('This may not be bacterial. Look for another cause before starting a broad drug.');
  var mrsa=S.prior==='mrsa'||S.source==='line'||S.source==='ssti'||(S.where==='hospital'&&S.source==='vap');
  if(mrsa) lines.push('MRSA cover is reasonable: vancomycin or linezolid.');
  if(S.where==='hospital'&&(S.source==='vap'||S.source==='iab'||S.source==='bsi')||S.prior==='dtr') lines.push('Pseudomonas cover is reasonable. Ertapenem does not count.');
  if(S.source==='iab') lines.push('Anaerobic cover belongs with an abdominal source.');
  if(S.recent==='yes') lines.push('Recent antibiotics raise the chance of resistance.');

  if(c!=null && c>130) lines.push('Clearance is augmented. A normal dose may fall short.');

}

function empiricNow(){

  var broad=S.recent==='yes'||S.sev==='shock';
  var gnb=null, lines=[], hard=false;
  var p=S.prior;
  if(p==='none'){
    if(hasRisk('CRAB')) p='crab';
    else if(hasRisk('DTR')) p='dtr';
    else if(hasRisk('ESBL')) p='esbl';
    else if(hasRisk('AmpC')) p='ampc';
    else if(hasRisk('CRE')){
      if(S.mech==='kpc'||S.mech==='oxa48'||S.mech==='ndm'||S.mech==='vim'||S.mech==='imp') p=S.mech==='oxa48'?'oxa':S.mech;
      else lines.push('CRE risk. Do not start meropenem until the enzyme is known.');
    }
  }
  if(p==='ndm'||p==='vim'||p==='imp') gnb='aztavi';
  else if(p==='kpc'||p==='oxa') gnb='ceftazavi';
  else if(p==='esbl') gnb='meropenem';
  else if(p==='ampc') gnb='cefepime';
  else if(p==='dtr') gnb='ceftolozane';
  else if(p==='crab') gnb='sulbactam';
  else if(src==='vap'||(src==='uti'&&hosp)||(src==='bsi'&&hosp)) gnb=broad?'meropenem':'cefepime';
  else if(src==='iab') gnb=hosp?'meropenem':'piptazo';
  else if(src==='cap'||src==='uti'||src==='endo'||src==='bsi') gnb='ctx';
  else if(src==='cns') gnb='ctx-cns';
  else if(src==='ssti'&&shock) gnb='piptazo';
  var ana=S.allergy==='anaphylaxis';
  var ordinary=gnb==='meropenem'||gnb==='cefepime'||gnb==='piptazo'||gnb==='ctx'||gnb==='ctx-cns';
  var special=gnb==='aztavi'||gnb==='ceftazavi'||gnb==='ceftolozane'||gnb==='sulbactam';

    lines.push('The organism from before still needs a beta-lactam. Do not give it until the allergy is reviewed.');
    hard=true; gnb=null;
  } else if(ana && ordinary){
    if(gnb==='ctx-cns'){
      lines.push('Do not give ceftriaxone. Keep vancomycin. Ask before any beta-lactam, including meropenem.');
      gnb=null;
    } else if(src==='cap'){
      lines.push(doseFor('levofloxacin')+' This replaces ceftriaxone.');
      gnb=null;
    } else {
      gnb='aztreonam';
      if(src==='iab'||src==='ssti') lines.push(doseFor('metronidazole')+' Aztreonam misses anaerobes.');
    }
  }
  if(shock) lines.unshift('Shock. Draw the cultures, then give this now.');
  if(gnb==='ctx'||gnb==='ctx-cns') lines.push(doseFor('ceftriaxone'));
  if(gnb==='ctx' && src==='cap') lines.push(doseFor('azithromycin')+' This is only the atypical partner.');
  if(gnb && DRUG[gnb]) lines.push(doseFor(gnb));
  if(needMrsa()||S.prior==='mrsa'){ if(src!=='cns') lines.push(doseFor('vancomycin')+' This is the MRSA drug.'); }
  if(src==='cns'){
    lines.push(doseFor('vancomycin')+' This is for resistant pneumococcus, not MRSA.');
    if((num('age')||0)>=50 && !ana) lines.push(doseFor('ampicillin')+' For Listeria.');
    if((num('age')||0)>=50 && ana) lines.push('Age 50 or more, but penicillin anaphylaxis: do not add ampicillin.');
  }
  if(src==='endo' && !(needMrsa()||S.prior==='mrsa')) lines.push(doseFor('vancomycin')+' Until the culture names the gram-positive.');
  if(src==='line' && !needMrsa()) lines.push(doseFor('vancomycin')+' Then remove the line.');
  return lines;
}
function series(){
  var mic=num('mic'); if(mic==null) mic=1;
  var r=regimen();
  var every=r?r.every:8, inf=r?r.infH:0.5, mg=r?r.mg:1000;
  var c=crcl(); if(c==null) c=80;
  var ke=0.15*(c/80);
  if(S.traj==='arc'||c>130) ke*=1.7;
  if(S.traj==='aki') ke*=0.4;
  if(S.rrt==='crrt'||S.traj==='rrt'){
    var e=num('eff'); if(e==null) e=25;
    ke=0.08+e/400;
  }
  var vd=S.vd==='marked'?1.8:S.vd==='increased'?1.35:1;
  var peak=(32*(mg/1000))/vd;
  var pts=[], step=Math.max(0.25, every/32);
  for(var t=0;t<=every+0.001;t+=step){
    var y;
    if(S.inf==='continuous' && DRUG[S.drug][1]==='fT>MIC') y=peak*0.45;
    else if(t<=inf) y=peak*(inf?t/inf:1);
    else y=peak*Math.exp(-ke*(t-inf));
    pts.push(y);
  }
  var above=pts.filter(function(y){return y>mic;}).length/pts.length;
  var peakNow=Math.max.apply(null, pts);
  return {pts:pts, mic:mic, above:above, every:every, step:step, peak:peakNow};
}
function draw(){
  var c=document.getElementById('chart'); if(!c) return;
  var dpr=Math.min(2, devicePixelRatio||1);
  var W=c.clientWidth||640, H=c.clientHeight||220;
  c.width=W*dpr; c.height=H*dpr;
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var s=series();
  var max=Math.max(s.mic*1.4, 8, Math.max.apply(null,s.pts));
  var L=46,T=16,B=28,R=W-10, n=s.pts.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-v/max); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [0, s.every/2, s.every].forEach(function(h){
    var i=Math.round(h/s.step);
    g.fillText((Math.round(h*10)/10)+' h', X(Math.min(n,i))-10, H-8);
  });
  g.fillText('mg/L', 4, 12);
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(s.mic)); g.lineTo(R,Y(s.mic)); g.stroke(); g.setLineDash([]);
  g.fillText('MIC '+s.mic, L, Y(s.mic)-4);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  s.pts.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
}

    return 'R';
  }
  if(m==='ampc') return (id==='cefepime'||id==='meropenem'||id==='piptazo')?'S':'R';
  if(m==='kpc') return (id==='ceftazavi'||id==='merovab'||id==='imirele'||id==='cefiderocol')?'S':'R';
  if(m==='oxa48') return (id==='ceftazavi'||id==='cefiderocol'||id==='aztavi')?'S':'R';
  if(m==='ndm'||m==='vim'||m==='imp') return (id==='aztavi'||id==='cazazi'||id==='cefiderocol')?'S':'R';
  if(m==='dtr') return (id==='ceftolozane'||id==='ceftazavi'||id==='imirele'||id==='cefiderocol')?'S':'R';
  if(m==='crab'||kind==='acineto') return (id==='sulbactam'||id==='cefiderocol')?'S':'R';
  if(m==='steno'||kind==='steno') return (id==='tmp'||id==='cefiderocol')?'S':'R';
  if(kind==='pseudo') return (id==='meropenem'||id==='cefepime'||id==='piptazo'||id==='ceftolozane'||id==='ceftazavi'||id==='cefiderocol')?'S':'R';
  if(id==='meropenem'||id==='cefepime'||id==='piptazo'||id==='ceftazavi') return 'S';
  return 'R';
}
function reportDrugs(){
  var m=S.mech, kind=ORG[S.org][1], list;
  if(kind==='mssa') list=['cefazolin','vancomycin','linezolid'];
  else if(kind==='mrsa'||kind==='vre') list=['vancomycin','linezolid','daptomycin'];
  else if(kind==='faecalis') list=['ampicillin','vancomycin'];
  else if(m==='esbl') list=['ceftriaxone','meropenem','piptazo','cefepime','levofloxacin'];
  else if(m==='ampc') list=['ceftriaxone','cefepime','piptazo','meropenem'];
  else if(m==='kpc') list=['meropenem','ceftazavi','merovab','imirele','cefiderocol','polymyxin'];
  else if(m==='oxa48') list=['meropenem','merovab','ceftazavi','cefiderocol','polymyxin'];
  else if(m==='ndm'||m==='vim'||m==='imp') list=['meropenem','ceftazavi','aztavi','cazazi','cefiderocol','polymyxin'];
  else if(m==='dtr') list=['meropenem','cefepime','piptazo','ciprofloxacin','ceftolozane','ceftazavi','imirele','cefiderocol','polymyxin'];
  else if(m==='crab'||kind==='acineto') list=['meropenem','sulbactam','cefiderocol','polymyxin'];
  else if(m==='steno'||kind==='steno') list=['meropenem','tmp','cefiderocol'];
  else if(kind==='pseudo') list=['meropenem','cefepime','piptazo','ciprofloxacin','ceftolozane'];
  else list=['ceftriaxone','cefepime','piptazo','meropenem','levofloxacin'];
  if(S.source==='iab' && list.indexOf('metronidazole')<0) list.push('metronidazole');
  return list;
}
function syncDrug(){
  var list=reportDrugs().filter(function(id){ return labOf(id)==='S'; });
  S.drug=list[0]||reportDrugs()[0];
  S.ast=labOf(S.drug);
}


var STEPS=['Likelihood','Site','Cultures','MDR risk','Mechanism','Susceptibility','Patient PK','PK/PD target','Exposure','24–72 h','Source control','De-escalation','Duration'];
function chip(key,val,label){
  return '<div class="chip-option'+(S[key]===val?' selected':'')+'" data-k="'+key+'" data-v="'+val+'">'+label+'</div>';
}
function go(n){ S.step=n; render(); }
function renderStepper(){
  document.getElementById('stepper').innerHTML = STEPS.map(function(name,i){
    var n=i+1;
    return '<div class="step-item'+(S.step===n?' active':'')+'" data-step="'+n+'"><div class="step-number">'+n+'</div><div>'+name+'</div></div>';
  }).join('');
}
function stepHtml(){
  var n=S.step, h='';
  if(n===1) h='<div class="step-title">Is this bacterial, and how fast?</div><div class="step-desc">If it is not bacterial, stop. If it is shock, take cultures and give the drug now.</div>'
    +'<div class="form-group"><label class="form-label">Bacterial?</label><div class="radio-group">'+chip('bact','yes','Yes')+chip('bact','no','No. Look elsewhere.')+'</div></div>'
    +'<div class="form-group"><label class="form-label">How sick?</label><div class="radio-group">'+chip('sev','shock','Septic shock')+chip('sev','sepsis','Sepsis')+chip('sev','stable','Stable')+chip('sev','low','Not bacterial')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Penicillin allergy</label><div class="radio-group">'+chip('allergy','no','None')+chip('allergy','rash','Rash only')+chip('allergy','anaphylaxis','Anaphylaxis')+'</div></div>';
  if(n===2) h='<div class="step-title">Where is the infection?</div><div class="step-desc">The site decides the drug and whether Pseudomonas, MRSA, or anaerobes belong.</div>'
    +'<div class="form-group"><label class="form-label">Setting</label><div class="radio-group">'+chip('where','community','Community')+chip('where','hospital','Hospital')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Site</label><div class="radio-group">'
    +chip('source','vap','Hospital lung')+chip('source','cap','Community lung')+chip('source','uti','Urine')+chip('source','iab','Abdomen')+chip('source','cns','Brain')+chip('source','ssti','Skin')+chip('source','bsi','Blood')+chip('source','line','Line')+chip('source','endo','Valve')
    +'</div></div>';
  if(n===3) h='<div class="step-title">Cultures</div><div class="step-desc">Blood and a culture from the site, before the drug if the patient can wait.</div>'
    +'<div class="form-group"><label class="form-label">Blood cultures</label><div class="radio-group">'+chip('blood','yes','Taken')+chip('blood','no','Not yet')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Site culture</label><div class="radio-group">'+chip('srcx','yes','Taken')+chip('srcx','no','Not yet')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Antibiotics in the last 90 days</label><div class="radio-group">'+chip('recent','no','No')+chip('recent','yes','Yes')+'</div></div>';
  if(n===4){
    var risks=['MRSA','ESBL','AmpC','CRE','DTR','CRAB'];
    h='<div class="step-title">What resistance is likely?</div><div class="step-desc">Tap every risk that is real. This changes the drug you start, before the culture returns.</div><div class="checkbox-group">'
      +risks.map(function(r){ return '<div class="chip-option'+(hasRisk(r)?' selected':'')+'" data-risk="'+r+'">'+r+'</div>'; }).join('')
      +'</div>';
  }
  if(n===5) h='<div class="step-title">Organism and enzyme</div><div class="step-desc">When the culture names an enzyme, the drug changes.</div>'
    +'<div class="form-group"><label class="form-label">Organism</label><div class="radio-group">'+Object.keys(ORG).map(function(k){return chip('org',k,ORG[k][0]);}).join('')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Enzyme</label><div class="radio-group">'+Object.keys(MECH).map(function(k){return chip('mech',k,MECH[k]);}).join('')+'</div></div>';
  if(n===6){
    h='<div class="step-title">The report</div><div class="step-desc">Most reports show only S, I, or R. Tap the drug you would give. Add an MIC only if one is printed.</div><div class="report">';
    reportDrugs().forEach(function(id){
      var letter=labOf(id);
      var prev=S.drug; S.drug=id; var bad=judge().bad; S.drug=prev; S.ast=labOf(prev);
      h+='<button type="button" data-drug="'+id+'" class="'+(S.drug===id?'on':'')+(S.drug===id&&bad?' bad':'')+'"><span>'+DRUG[id][0]+'</span><b class="tag '+letter+'">'+letter+'</b></button>';
    });
    h+='</div><div class="form-group" style="margin-top:16px"><label class="form-label">Is an MIC printed?</label><div class="radio-group">'+chip('hasmic','no','No. Only S, I, or R')+chip('hasmic','yes','Yes')+'</div></div>';
    if(S.hasmic==='yes') h+='<div class="form-group"><label class="form-label">MIC mg/L</label><input class="form-control" id="mic" inputmode="decimal" value="'+(S.mic||'')+'"></div>';
  }
  if(n===7) h='<div class="step-title">Clearance and volume</div><div class="step-desc">The dose uses age, sex, height, weight, and creatinine. A large volume needs a loading dose.</div>'
    +'<div class="grid">'+box('age','Age')+box('ht','Height cm')+box('wt','Weight kg')+box('scr','Creatinine mg/dL')+box('uo','Urine mL/h')+box('eff','CRRT mL/kg/h')+'</div>'
    +'<div class="form-group"><label class="form-label">Sex</label><div class="radio-group">'+chip('sex','male','Male')+chip('sex','female','Female')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Clearance now</label><div class="radio-group">'+chip('traj','stable','Steady')+chip('traj','arc','Augmented')+chip('traj','aki','Falling')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Kidney replacement</label><div class="radio-group">'+chip('rrt','none','None')+chip('rrt','crrt','CRRT')+chip('rrt','ihd','Hemodialysis')+chip('rrt','sled','SLED')+'</div></div>'
    +'<div class="form-group"><label class="form-label">Volume of distribution</label><div class="radio-group">'+chip('vd','normal','Normal')+chip('vd','increased','Large')+chip('vd','marked','Very large')+'</div></div>';
  if(n===8){
    var pk=DRUG[S.drug]?DRUG[S.drug][1]:'';
    h='<div class="step-title">How this drug has to be given</div><div class="step-desc">'+DRUG[S.drug][0]+' is judged by '+pk+'.</div>'
      +'<div class="form-group"><label class="form-label">Infusion</label><div class="radio-group">'+chip('inf','standard','30 minutes')+chip('inf','extended','3 hours')+chip('inf','continuous','Continuous')+'</div></div>';
    if(pk==='fT>MIC') h+='<div class="rec-box"><h4>Beta-lactam</h4><p>Shock wants the level above the MIC for the whole interval. A 3-hour or continuous infusion is how you get there.</p></div>';
    if(pk==='AUC/MIC') h+='<div class="rec-box"><h4>AUC drug</h4><p>Vancomycin needs a measured level. The target is an AUC/MIC of 400–600, not a trough of 15.</p></div>';
    if(pk==='Cmax/MIC') h+='<div class="rec-box"><h4>Peak drug</h4><p>An aminoglycoside wants a peak about 8–10 times the MIC, then a long gap so the level can fall.</p></div>';
  }
  if(n===9){
    h='<div class="step-title">Is the exposure enough?</div>';
    if(S.hasmic!=='yes'||num('mic')==null) h+='<div class="step-desc">No MIC on this report. '+ (S.ast==='S'?'Susceptible: use the standard dose for this clearance.':S.ast==='I'?'Intermediate: raise the dose and use a 3-hour infusion.':'Resistant: pick another drug. There is no MIC to optimize.')+'</div>';
    else h+='<div class="step-desc">The line is a sketch of the free level. The red line is the MIC you typed.</div><canvas id="chart" width="720" height="220"></canvas><div class="legend"><span><i></i>Free level</span><span><i class="red"></i>MIC</span></div>';
  }
  if(n===10) h='<div class="step-title">At 24 to 72 hours</div><div class="step-desc">Improving continues. Unchanged makes you recheck the diagnosis. Worse makes you recheck the source before adding a drug.</div><div class="radio-group">'+chip('resp','improving','Improving')+chip('resp','stable','Unchanged')+chip('resp','worsening','Worse')+'</div>';
  if(n===11) h='<div class="step-title">Is the source controlled?</div><div class="step-desc">An open source is not fixed by a broader antibiotic.</div><div class="radio-group">'+chip('control','yes','Yes')+chip('control','no','No. Drain, remove, or debride.')+'</div>';
  if(n===12){
    var j=judge();
    h='<div class="step-title">Can you narrow?</div><div class="step-desc">Stop duplicate drugs. Move to a tablet only if the patient is eating and the site allows it.</div>';
    h+= j.bad||S.ast==='R' ? '<div class="rec-box" style="border-left-color:#dc2626"><h4>Not yet</h4><p>'+j.title+'. Do not narrow to this drug.</p></div>' : '<div class="rec-box"><h4>Narrow</h4><p>Use '+DRUG[S.drug][0]+' and stop the other antibiotics.</p></div>';
    var oral=S.source==='cap'||S.source==='uti'||S.source==='ssti';
    h+='<div class="form-group"><label class="form-label">Oral switch</label><div class="radio-group">'+chip('po','yes','Eating, and an oral drug is active')+chip('po','no','Stay on the vein')+'</div></div>';
    if(S.po==='yes' && !oral) h+='<div class="rec-box" style="border-left-color:#dc2626"><h4>Not this site</h4><p>Lung infection in the hospital, blood, brain, and a valve do not become a tablet this early.</p></div>';
    if(S.po==='yes' && oral && S.resp==='improving') h+='<div class="rec-box"><h4>Convert</h4><p>Stop the vein.</p></div>';
  }
  if(n===13) h='<div class="step-title">When it stops</div><div class="step-desc">The clock starts only after the source is controlled and the patient is improving.</div><div id="duration"></div>';
  return h;
}
function durationLines(){
  var kind=ORG[S.org][1], src=S.source, lines=[], bad=false, text;
  if(S.bact==='no'||S.sev==='low') return {bad:true, lines:['This is not a bacterial infection. Do not give an antibiotic.']};
  if(S.control!=='yes'){ lines.push('The source is not controlled. Do not start the clock.'); bad=true; }
  if(S.resp==='worsening'){ lines.push('The patient is worse. Do not stop on a calendar.'); bad=true; }
  if(src==='endo') text='Endocarditis is weeks. The valve and the organism decide the stop.';
  else if(src==='cns') text='Meningitis is often 2 to 3 weeks.';
  else if((kind==='mrsa'||kind==='mssa') && (src==='bsi'||src==='line')) text='Staphylococcus aureus in the blood is at least 14 days from the first negative culture, after a clear echo and line removal.';
  else if((kind==='vre'||kind==='faecalis') && (src==='bsi'||src==='line')) text='Enterococcus in the blood is often 7 to 14 days once the source is gone. A valve is weeks.';
  else if(src==='bsi') text='About 7 days only for uncomplicated gram-negative bacteremia. Staphylococcus aureus is at least 14 days.';
  else {
    var stop={cap:'5 days',vap:'7 days',uti:'5 to 7 days',iab:'about 4 days after source control',ssti:'5 to 7 days',line:'a short course once the line is out'};
    text='Usual stop: '+(stop[src]||'by the syndrome')+'.';
  }
  lines.push(text);
  if(!bad && S.resp==='improving') lines.push('When that time is done, stop.');
  return {bad:bad, lines:lines};
}
function renderRec(){
  S.load=(S.sev==='shock'||S.vd!=='normal')?'load':'standard';
  S.ast=labOf(S.drug);
  var badge=document.getElementById('status-badge');
  var box=document.getElementById('recommendation-content');
  var sum=document.getElementById('summary-list');
  if(S.bact==='no'||S.sev==='low'){
    badge.textContent='Not bacterial'; badge.className='badge badge-danger';
    box.innerHTML='<div class="rec-box" style="border-left-color:#dc2626"><h4>Stop</h4><p>Look for a noninfectious diagnosis. Do not start an antibiotic.</p></div>';
  } else {
    badge.textContent=S.sev==='shock'?'Shock':S.sev==='sepsis'?'Sepsis':'Empiric';
    badge.className='badge '+(S.sev==='shock'||S.sev==='sepsis'?'badge-danger':'badge-success');
    var lines=empiricNow();
    var j=judge(), r=regimen();
    var dose=r?(r.load+'. Then '+r.maint+'. Over '+r.infuseLabel+'.'):'Enter the body numbers.';
    var dur=durationLines();
    box.innerHTML='<div class="rec-box"><h4>Start this now</h4><ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
      +'<div class="rec-box" style="border-left-color:'+(j.bad?'#dc2626':'#0284c7')+'"><h4>'+j.title+'</h4><p>'+DRUG[S.drug][0]+'. Report '+(S.ast==='S'?'S':S.ast==='I'?'I':'R')+(S.hasmic==='yes'&&num('mic')!=null?' · MIC '+num('mic')+' mg/L':' · no MIC')+'.</p><p>'+dose+'</p><ul>'+j.lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
      +'<div class="rec-box" style="border-left-color:'+(dur.bad?'#dc2626':'#0284c7')+'"><h4>Stop</h4><ul>'+dur.lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>';
  }
  var c=crcl();
  sum.innerHTML=''
    +'<div class="summary-item"><span>Clearance</span><strong>'+(c==null?'—':Math.round(c)+' mL/min')+'</strong></div>'
    +'<div class="summary-item"><span>Site</span><strong>'+S.source+'</strong></div>'
    +'<div class="summary-item"><span>Risks</span><strong>'+(S.risks.length?S.risks.join(', '):'None')+'</strong></div>'
    +'<div class="summary-item"><span>Enzyme</span><strong>'+MECH[S.mech]+'</strong></div>'
    +'<div class="summary-item"><span>Drug</span><strong>'+DRUG[S.drug][0]+'</strong></div>'
    +'<div class="summary-item"><span>Source</span><strong>'+(S.control==='yes'?'Controlled':'Open')+'</strong></div>';
  if(document.getElementById('chart')) draw();
  var d=document.getElementById('duration');
  if(d){ var dur=durationLines(); d.innerHTML='<div class="rec-box" style="border-left-color:'+(dur.bad?'#dc2626':'#0284c7')+'"><ul>'+dur.lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'; }
}
function render(){
  if(S.step<1) S.step=1; if(S.step>13) S.step=13;
  renderStepper();
  document.getElementById('step-content').innerHTML=stepHtml();
  document.getElementById('btn-prev').disabled=S.step===1;
  document.getElementById('btn-next').textContent=S.step===13?'Done':'Next step';
  renderRec();
}
function preset(name){
  var base={step:1,bact:'yes',blood:'yes',srcx:'yes',allergy:'no',recent:'no',hasmic:'no',mic:'',inf:'extended',resp:'improving',control:'yes',po:'no',sex:'male',age:'60',ht:'170',wt:'70',uo:'50',eff:'25'};
  if(name==='hap') Object.assign(S, base, {sev:'shock',where:'hospital',source:'vap',risks:['MRSA','DTR'],prior:'dtr',org:'pseudomonas',mech:'dtr',traj:'arc',scr:'0.4',vd:'marked',rrt:'none'});
  if(name==='uti') Object.assign(S, base, {sev:'stable',where:'community',source:'uti',risks:['ESBL'],prior:'esbl',org:'ecoli',mech:'esbl',traj:'stable',scr:'1',vd:'normal',rrt:'none'});
  if(name==='crrt') Object.assign(S, base, {sev:'shock',where:'hospital',source:'iab',risks:['CRE'],prior:'ndm',org:'kleb',mech:'ndm',traj:'aki',scr:'3.2',vd:'increased',rrt:'crrt',eff:'30'});
  syncDrug();
  render();
}
document.body.addEventListener('click', function(e){
  var step=e.target.closest('[data-step]');
  if(step){ go(+step.dataset.step); return; }
  var risk=e.target.closest('[data-risk]');
  if(risk){ var i=S.risks.indexOf(risk.dataset.risk); if(i>=0) S.risks.splice(i,1); else S.risks.push(risk.dataset.risk); render(); return; }
  var drug=e.target.closest('[data-drug]');
  if(drug){ S.drug=drug.dataset.drug; S.ast=labOf(S.drug); render(); return; }
  var b=e.target.closest('[data-k]');
  if(!b) return;
  S[b.dataset.k]=b.dataset.v;
  if(b.dataset.k==='org'||b.dataset.k==='mech') syncDrug();
  if(b.dataset.k==='hasmic' && S.hasmic==='no') S.mic='';
  if(b.dataset.k==='sev' && S.sev==='low') S.bact='no';
  if(b.dataset.k==='bact' && S.bact==='no') S.sev='low';
  if(b.dataset.k==='bact' && S.bact==='yes' && S.sev==='low') S.sev='stable';
  render();
});
document.body.addEventListener('input', function(e){
  if(!e.target.id || !(e.target.id in S)) return;
  S[e.target.id]=e.target.value;
  renderRec();
});
document.getElementById('btn-prev').onclick=function(){ if(S.step>1) go(S.step-1); };
document.getElementById('btn-next').onclick=function(){ if(S.step<13) go(S.step+1); else location.href='index.html'; };
S.step=1;
render();

</script>
