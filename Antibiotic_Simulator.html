<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antibiotic simulator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f7fb;color:#14213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 18px 10px;background:#0f766e;color:#fff}
  h1{margin:0;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
  #stepName{margin:4px 0 0;font-weight:700}
  main{max-width:760px;margin:0 auto;padding:14px 14px 92px}
  section{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0f172a14}
  h2{margin:12px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#0f766e}
  h2:first-child{margin-top:0}
  .hint{margin:0 0 10px;font-weight:700;color:#334155}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#334155;margin-bottom:4px}
  input,select{width:100%;font-size:16px;font-weight:700;padding:8px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;color:#14213d}
  .out{margin-top:12px;border-radius:14px;padding:12px;background:#f8fafc;border:2px solid #e2e8f0;font-weight:800;line-height:1.45}
  .out.bad{border-color:#be123c}
  .out b{font-size:22px;display:block}
  ul{margin:8px 0 0;padding-left:18px}
  canvas{width:100%;height:220px;background:#fff;border:2px solid #e2e8f0;border-radius:12px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;margin-top:8px}
  .legend i{display:inline-block;width:18px;height:4px;background:#0f766e;margin-right:6px;vertical-align:middle}
  .legend .red{background:#dc2626}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e2e8f0}
  nav button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:#0f766e;color:#fff}
  nav button:disabled{background:#cbd5e1;color:#64748b}
  a{color:#0f766e}
</style>
</head>
<body>
<header>
  <h1>Antibiotics</h1>
  <p id="stepName">Patient</p>
</header>
<main><section id="view"></section></main>
<nav>
  <button type="button" id="back">Back</button>
  <button type="button" id="next">Next</button>
</nav>
<script>
var S={age:'60',sex:'male',ht:'170',wt:'70',scr:'1',uo:'50',eff:'25',where:'hospital',source:'vap',sev:'shock',bact:'yes',blood:'no',srcx:'no',addMrsa:'no',addPseudo:'yes',addAna:'no',allergy:'no',recent:'no',prior:'none',org:'kleb',mech:'ndm',mic:'4',ast:'R',drug:'meropenem',inf:'extended',rrt:'none',load:'load',traj:'stable',vd:'increased',level:'no',identified:'yes',astYes:'yes',resp:'improving',control:'yes',po:'no'};
var stack=['bact'];
var TITLE={bact:'Bacterial?',sick:'How sick',site:'Site',micro:'Cultures',mdr:'MDR risk',cover:'Empiric cover',bug:'Mechanism',ast:'MIC',body:'Patient PK',drug:'Drug and dose',pk:'Exposure',review:'24–72 h',src:'Source control',narrow:'De-escalation',po:'IV to oral',stop:'Duration',non:'Not bacterial'};
function route(){
  if(S.bact==='no') return ['bact','non'];
  return ['bact','sick','site','micro','mdr','cover','bug','ast','body','drug','pk','review','src','narrow','po','stop'];
}
function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function crcl(){
  var age=num('age'), wt=num('wt'), scr=num('scr'), ht=num('ht');
  if(age==null||wt==null||scr==null||ht==null||scr<=0||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  var use=wt;
  if(bmi>=30 && wt>ibw) use=ibw+0.4*(wt-ibw);
  var c=(140-age)*use/(72*scr);
  if(S.sex==='female') c*=0.85;
  return Math.max(0,c);
}
function band(c){
  if(c==null) return '';
  if(c>130) return 'Augmented clearance';
  if(c>=90) return 'Normal';
  if(c>=60) return 'Mild impairment';
  if(c>=30) return 'Moderate impairment';
  return 'Severe impairment';
}
function box(id,label){ return '<div><label>'+label+'</label><input id="'+id+'" inputmode="decimal" value="'+(S[id]||'')+'"></div>'; }
function sel(id,label,opts){
  return '<div><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){
    return '<option value="'+o[0]+'"'+(S[id]===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('')+'</select></div>';
}
function out(title,lines,bad){
  return '<div class="out'+(bad?' bad':'')+'"><b>'+title+'</b>'+(lines&&lines.length?'<ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>':'')+'</div>';
}
var ORG={
  ecoli:['Escherichia coli','entero'], kleb:['Klebsiella pneumoniae','entero'], enterobacter:['Enterobacter cloacae complex','entero'],
  pseudomonas:['Pseudomonas aeruginosa','pseudo'], acinetobacter:['Acinetobacter baumannii','acineto'], steno:['Stenotrophomonas maltophilia','steno'],
  mrsa:['MRSA','mrsa'], mssa:['MSSA','mssa'], enterococcus:['Enterococcus faecium','vre'], unknown:['Unknown gram-negative','entero']
};
var MECH={
  none:'No enzyme named', esbl:'ESBL', ampc:'AmpC', kpc:'KPC', oxa48:'OXA-48-like',
  ndm:'NDM', vim:'VIM', imp:'IMP', dtr:'Difficult-to-treat Pseudomonas', crab:'CRAB', steno:'Stenotrophomonas'
};
var PREF={
  esbl:['meropenem'],
  ampc:['cefepime','meropenem'],
  kpc:['ceftazavi','merovab','imirele','cefiderocol'],
  oxa48:['ceftazavi','cefiderocol'],
  ndm:['aztavi','cazazi','cefiderocol'],
  vim:['aztavi','cazazi','cefiderocol'],
  imp:['aztavi','cazazi','cefiderocol'],
  dtr:['ceftolozane','ceftazavi','imirele','cefiderocol'],
  crab:['sulbactam','cefiderocol'],
  steno:['tmp','cefiderocol']
};
var DRUG={
  meropenem:['Meropenem','fT>MIC','ESBL bacteremia. Not NDM, KPC, or OXA-48.','Lowers valproate. Seizures if the dose ignores the kidneys.'],
  cefepime:['Cefepime','fT>MIC','AmpC when the MIC is low. Susceptible Pseudomonas.','Encephalopathy, myoclonus, and seizures when it accumulates.'],
  piptazo:['Piperacillin-tazobactam','fT>MIC','Susceptible mixed infection. Not ESBL bacteremia. Not AmpC.','Kidney injury when combined with vancomycin.'],
  ceftazavi:['Ceftazidime-avibactam','fT>MIC','KPC and OXA-48-like. Not an MBL alone.','Fails if an NDM is also present.'],
  merovab:['Meropenem-vaborbactam','fT>MIC','KPC. Not OXA-48. Not an MBL.','Vaborbactam does not cover every carbapenemase.'],
  imirele:['Imipenem-relebactam','fT>MIC','KPC and some difficult Pseudomonas. Not an MBL.','Seizure risk of imipenem if the dose is high for the kidneys.'],
  ceftolozane:['Ceftolozane-tazobactam','fT>MIC','Difficult Pseudomonas. Pneumonia is 3 g, not 1.5 g.','The urinary dose under-treats pneumonia.'],
  cefiderocol:['Cefiderocol','fT>MIC','MBL, difficult Pseudomonas, selected CRAB, Stenotrophomonas, when susceptible.','Resistance can emerge. Confirm the MIC.'],
  aztavi:['Aztreonam-avibactam','fT>MIC','NDM, VIM, or IMP Enterobacterales.','Aztreonam alone is not enough if an ESBL or AmpC is also there.'],
  cazazi:['Ceftazidime-avibactam + aztreonam','fT>MIC','MBL Enterobacterales when aztreonam-avibactam is not available.','Both drugs still need a 3-hour infusion.'],
  vancomycin:['Vancomycin','AUC/MIC','MRSA, including pneumonia.','Kidney injury, ear toxicity, and the red-man infusion reaction.'],
  linezolid:['Linezolid','AUC/MIC','MRSA pneumonia. Not the best drug for bacteremia.','Marrow suppression, neuropathy, and serotonin syndrome with an SSRI.'],
  daptomycin:['Daptomycin','Cmax/MIC','MRSA or VRE in the blood. Never pneumonia.','Muscle injury. Stop the statin. Surfactant kills it in the lung.'],
  amikacin:['Amikacin','Cmax/MIC','Add-on for selected gram-negatives. Not pneumonia alone.','Kidney injury and hearing loss.'],
  tmp:['Trimethoprim-sulfamethoxazole','AUC/MIC','Stenotrophomonas. Dose on the trimethoprim.','Potassium rises, kidneys worsen, marrow falls, severe rash.'],
  sulbactam:['Sulbactam-durlobactam','fT>MIC','CRAB.','Still needs a susceptibility check.'],
  tigecycline:['Tigecycline','AUC/MIC','Some intra-abdominal CRE. Not the blood.','Low blood levels. Nausea. Higher death in some bloodstream uses.'],
  eravacycline:['Eravacycline','AUC/MIC','Selected CRE or CRAB outside the blood.','Not a bloodstream drug.'],
  aztreonam:['Aztreonam','fT>MIC','Gram-negatives, including Pseudomonas, after penicillin anaphylaxis.','No anaerobic cover. An ESBL or a metallo-enzyme can destroy it.']
};
var BETA={meropenem:1,cefepime:1,piptazo:1,ceftazavi:1,merovab:1,imirele:1,ceftolozane:1,cefiderocol:1,aztavi:1,cazazi:1,sulbactam:1};
function prefList(){ return PREF[S.mech]||[]; }
function siteBlock(id){
  if((id==='tigecycline'||id==='eravacycline') && (S.source==='bsi'||S.source==='endo'||S.source==='line')) return 'Blood levels are too low.';
  if(id==='daptomycin' && (S.source==='vap'||S.source==='cap')) return 'Surfactant in the lung inactivates daptomycin.';
  if(id==='meropenem' && S.org==='pseudomonas' && S.mech==='none') return '';
  if((id==='vancomycin'||id==='linezolid'||id==='daptomycin') && ORG[S.org][1]!=='mrsa' && ORG[S.org][1]!=='vre' && ORG[S.org][1]!=='mssa') return 'This is not a gram-positive drug for this culture.';
  if(id!=='vancomycin' && id!=='linezolid' && id!=='daptomycin' && id!=='tmp' && (ORG[S.org][1]==='mrsa' || ORG[S.org][1]==='vre')) return 'This gram-negative drug does not treat this gram-positive culture.';
  return '';
}
function judge(){
  var id=S.drug, pref=prefList(), block=siteBlock(id);
  if(S.ast==='R') return {bad:true, title:'Lab says resistant', lines:['Do not use a drug the report marks resistant.']};
  if(S.allergy==='anaphylaxis' && BETA[id]) return {bad:true, title:'Penicillin anaphylaxis', lines:['This is a beta-lactam. Do not start it until the allergy is reviewed. Aztreonam is the gram-negative substitute when the organism is still susceptible to it.']};
  if(block) return {bad:true, title:'Wrong place or wrong bug', lines:[block]};
  if(S.mech==='none'){
    if(id==='aztreonam' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first choice', lines:['Aztreonam is for penicillin anaphylaxis. It misses anaerobes and many resistant gram-negatives.']};
    if(id==='aztreonam') return {bad:false, title:'Anaphylaxis substitute', lines:[DRUG.aztreonam[2], DRUG.aztreonam[3]]};
    if(S.org==='pseudomonas' && id==='meropenem') return {bad:false, title:'Active if susceptible', lines:['Pseudomonas needs an antipseudomonal drug. Ertapenem would not be one.']};
    if(ORG[S.org][1]==='mrsa' && (id==='vancomycin'||id==='linezolid')) return {bad:false, title:id==='linezolid'&&(S.source==='bsi'||S.source==='endo')?'Weak for the blood':'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mrsa' && id==='daptomycin') return {bad:false, title:'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='vre' && id==='vancomycin') return {bad:true, title:'Vancomycin does not treat VRE', lines:['Use high-dose daptomycin or linezolid.']};
    if(ORG[S.org][1]==='vre' && (id==='daptomycin'||id==='linezolid')) return {bad:false, title:'VRE pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mssa' && id==='cefepime') return {bad:true, title:'Too broad', lines:['MSSA bacteremia wants cefazolin or an anti-staphylococcal penicillin, not a Pseudomonas drug.']};
    return {bad:false, title:'No enzyme named', lines:['Use the narrowest susceptible drug for the site.', DRUG[id][3]]};
  }
  if(pref.indexOf(id)>=0) return {bad:false, title:'Fits '+MECH[S.mech], lines:[DRUG[id][2], DRUG[id][3]]};
  if(S.mech==='esbl' && id==='piptazo') return {bad:true, title:'Not for ESBL in the blood', lines:['A susceptible piperacillin result is not enough for ESBL bacteremia. Use a carbapenem.']};
  if(S.mech==='ampc' && id==='piptazo') return {bad:true, title:'Tazobactam does not hold AmpC', lines:['Cefepime is the narrower active choice when the MIC allows it.']};
  if((S.mech==='ndm'||S.mech==='vim'||S.mech==='imp') && id==='ceftazavi') return {bad:true, title:'Avibactam alone does not stop an MBL', lines:['Add aztreonam, or use aztreonam-avibactam or susceptible cefiderocol.']};
  if((S.mech==='oxa48') && id==='merovab') return {bad:true, title:'Vaborbactam is for KPC', lines:['OXA-48-like needs ceftazidime-avibactam.']};
  if(S.mech==='kpc' && id==='meropenem') return {bad:true, title:'KPC hydrolyzes meropenem', lines:['A longer infusion does not replace avibactam, vaborbactam, or relebactam.']};
  if(S.mech==='dtr' && (id==='meropenem'||id==='cefepime'||id==='piptazo')) return {bad:true, title:'The usual Pseudomonas drugs have already failed', lines:['Use a susceptible newer antipseudomonal agent.']};
  if(S.mech==='crab' && id==='meropenem') return {bad:true, title:'Not a CRAB drug', lines:['Use sulbactam-durlobactam or susceptible cefiderocol.']};
  if(S.mech==='steno' && (id==='meropenem'||id==='cefepime')) return {bad:true, title:'Inactive against Stenotrophomonas', lines:['Trimethoprim-sulfamethoxazole or susceptible cefiderocol.']};
  return {bad:true, title:'Does not match '+MECH[S.mech], lines:['Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.']};
}
function doseWt(){
  var wt=num('wt'), ht=num('ht');
  if(wt==null||ht==null||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  if(bmi>=30 && wt>ibw) return ibw+0.4*(wt-ibw);
  return wt;
}
function g(mg){
  if(mg===3375) return '3.375 g';
  if(mg===2250) return '2.25 g';
  if(mg>=1000) return (Math.round(mg/10)/100)+' g';
  return Math.round(mg)+' mg';
}
function tier(){
  if(S.rrt==='ihd') return 'hd';
  if(S.rrt==='sled') return 'sled';
  if(S.rrt==='crrt'){ var e=num('eff'); if(e==null) e=25; return e>=25?'crrt':'crrtLow'; }
  var c=crcl();
  if(c==null) return null;
  if(c>=120 || S.traj==='arc') return 'arc';
  return c;
}
function wantLoad(){ return S.load==='load' || S.vd!=='normal' || S.sev==='shock'; }
function regimen(){
  var t=tier(), c=crcl(), id=S.drug, wt=num('wt'), dw=doseWt();
  if(t==null || (id!=='linezolid' && id!=='tigecycline' && c==null && S.rrt==='none')) return null;
  var mic=num('mic')||1;
  var high=S.source==='cns' || mic>=4 || S.sev==='shock';
  var lung=S.source==='vap'||S.source==='cap';
  var row, loadMg, every, after=false, note='';
  function pick(rows){ return rows; }
  if(id==='meropenem'){
    if(t==='arc') row=high?[2000,6]:[2000,8];
    else if(t==='hd'){ row=[500,24]; after=true; }
    else if(t==='crrt') row=high?[2000,8]:[1000,8];
    else if(t==='crrtLow') row=[500,8];
    else if(t==='sled') row=[1000,12];
    else if(c>=50) row=high?[2000,8]:[1000,8];
    else if(c>=26) row=[1000,12];
    else if(c>=10) row=[500,12];
    else row=[500,24];
  } else if(id==='cefepime'){
    if(t==='arc') row=[2000,6];
    else if(t==='hd'){ row=[1000,24]; after=true; }
    else if(t==='crrt') row=[2000,8];
    else if(t==='crrtLow') row=[1000,12];
    else if(t==='sled') row=[2000,12];
    else if(c>=60) row=[2000,8];
    else if(c>=30) row=[2000,12];
    else if(c>=11) row=[2000,24];
    else row=[1000,24];
  } else if(id==='piptazo'){
    var big=lung||S.sev==='shock'||S.sev==='sepsis';
    if(t==='arc'||t==='crrt') row=[4500,6];
    else if(t==='crrtLow'||t==='sled') row=[4500,8];
    else if(t==='hd'){ row=[2250,8]; after=true; }
    else if(c>40) row=big?[4500,6]:[3375,6];
    else if(c>=20) row=[2250,6];
    else row=[2250,8];
  } else if(id==='ceftazavi'){
    if(t==='arc'||t==='crrt') row=[2500,8];
    else if(t==='crrtLow'||t==='sled') row=[1250,8];
    else if(t==='hd'||c<6){ row=[940,48]; after=t==='hd'; }
    else if(c>=50) row=[2500,8];
    else if(c>=31) row=[1250,8];
    else if(c>=16) row=[940,12];
    else row=[940,24];
  } else if(id==='merovab'){
    if(t==='arc'||t==='crrt') row=[4000,8];
    else if(t==='crrtLow'||t==='sled') row=[2000,8];
    else if(t==='hd'){ row=[1000,12]; after=true; }
    else if(c>=50) row=[4000,8];
    else if(c>=30) row=[2000,8];
    else if(c>=15) row=[2000,12];
    else row=[1000,12];
  } else if(id==='imirele'){
    if(t==='arc') row=[1250,6];
    else if(t==='crrt') row=[1250,6];
    else if(t==='crrtLow'||t==='sled') row=[750,6];
    else if(t==='hd'){ row=[500,12]; after=true; }
    else if(c>=90) row=[1250,6];
    else if(c>=60) row=[1000,6];
    else if(c>=30) row=[750,6];
    else if(c>=15) row=[500,6];
    else row=[500,12];
  } else if(id==='ceftolozane'){
    if(lung){
      if(t==='arc'||t==='crrt') row=[3000,8];
      else if(t==='hd'){ row=[450,8]; loadMg=2250; after=true; }
      else if(c>=50) row=[3000,8];
      else if(c>=30) row=[1500,8];
      else row=[750,8];
    } else {
      if(t==='arc'||t==='crrt') row=[1500,8];
      else if(t==='hd'){ row=[150,8]; loadMg=750; after=true; }
      else if(c>=50) row=[1500,8];
      else if(c>=30) row=[750,8];
      else row=[375,8];
    }
    if(t==='crrtLow'||t==='sled') row=lung?[1500,8]:[750,8];
  } else if(id==='cefiderocol'){
    if(t==='arc') row=[2000,6];
    else if(t==='crrt') row=[2000,8];
    else if(t==='crrtLow'||t==='sled') row=[1500,8];
    else if(t==='hd'){ row=[750,12]; after=true; }
    else if(c>=120) row=[2000,6];
    else if(c>=60) row=[2000,8];
    else if(c>=30) row=[1500,8];
    else if(c>=15) row=[1000,8];
    else row=[750,12];
  } else if(id==='aztavi'||id==='cazazi'){
    var az=2000, ev=8;
    if(t==='hd'|| (c!=null && c<10)){ az=500; ev=8; after=t==='hd'; }
    else if(c!=null && c<30 && t!=='crrt' && t!=='arc'){ az=1000; ev=8; }
    row=[az,ev];
    note=id==='cazazi'?'Give this aztreonam with the ceftazidime-avibactam dose for the same clearance, both over 3 hours.':'Avibactam is the matching product amount, in the same bag, over 3 hours.';
  } else if(id==='aztreonam'){
    var az2=2000, ev2=8;
    if(t==='hd'|| (c!=null && c<10)){ az2=500; ev2=8; after=t==='hd'; }
    else if(c!=null && c<30 && t!=='crrt' && t!=='arc'){ az2=1000; ev2=8; }
    row=[az2,ev2];
    note='No anaerobic cover. An ESBL or a metallo-enzyme can destroy it.';
  } else if(id==='vancomycin'){
    var kg=wt||70;
    loadMg=Math.min(3000, Math.round(kg*(S.sev==='shock'?25:20)/250)*250);
    var md=Math.min(2000, Math.round((dw||kg)*15/250)*250);
    var ev=c>=90||t==='arc'?8:c>=50||t==='crrt'?12:24;
    if(t==='hd'||t==='sled'||(c!=null&&c<20)) ev=24;
    row=[md,ev];
    note='Target AUC/MIC 400–600. Check a level. Do not chase a trough of 15 by habit.';
    if(loadMg>1500) note+=' Infuse the load over at least 2 hours.';
  } else if(id==='linezolid'){
    row=[600,12];
  } else if(id==='daptomycin'){
    var per=S.sev==='shock'||S.source==='bsi'||S.source==='endo'?10:8;
    var dmg=Math.round((dw||wt||70)*per/50)*50;
    var evd=(t==='hd'||t==='vl'||(c!=null&&c<30))?48:24;
    if(t==='crrt'||t==='crrtLow') evd=24;
    row=[dmg,evd];
    loadMg=dmg;
  } else if(id==='amikacin'){
    var am=Math.min(2000, Math.round((dw||wt||70)*15/50)*50);
    var eva=t==='hd'?48:(c>=60||t==='arc'||t==='crrt')?24:(c>=40)?36:48;
    row=[am,eva];
    loadMg=am;
    note='Aim a peak about '+(8*mic).toFixed(0)+'–'+(10*mic).toFixed(0)+' mg/L. Stop if the kidneys or the hearing change.';
  } else if(id==='tmp'){
    var tm=Math.max(80, Math.round((dw||wt||70)*5/40)*40);
    var evt=8;
    if(t==='hd'||(c!=null&&c<15)) evt=24;
    else if(c!=null&&c<30) evt=12;
    if(t==='crrt') evt=8;
    row=[tm,evt];
    note='This milligram is the trimethoprim part.';
  } else if(id==='sulbactam'){
    var evs=6;

function series(){
  var mic=num('mic'); if(mic==null) mic=1;
  var r=regimen();
  var every=r?r.every:8, inf=r?r.infH:0.5, mg=r?r.mg:1000;
  var c=crcl(); if(c==null) c=80;
  var ke=0.15*(c/80);
  if(S.traj==='arc'||c>130) ke*=1.7;
  if(S.traj==='aki') ke*=0.4;
  if(S.rrt==='crrt'||S.traj==='rrt'){
    var e=num('eff'); if(e==null) e=25;
    ke=0.08+e/400;
  }
  var vd=S.vd==='marked'?1.8:S.vd==='increased'?1.35:1;
  var peak=(32*(mg/1000))/vd;
  var pts=[], step=Math.max(0.25, every/32);
  for(var t=0;t<=every+0.001;t+=step){
    var y;
    if(S.inf==='continuous' && DRUG[S.drug][1]==='fT>MIC') y=peak*0.45;
    else if(t<=inf) y=peak*(inf?t/inf:1);
    else y=peak*Math.exp(-ke*(t-inf));
    pts.push(y);
  }
  var above=pts.filter(function(y){return y>mic;}).length/pts.length;
  var peakNow=Math.max.apply(null, pts);
  return {pts:pts, mic:mic, above:above, every:every, step:step, peak:peakNow};
}
function draw(){

  var s=series();
  var max=Math.max(s.mic*1.4, 8, Math.max.apply(null,s.pts));
  var L=46,T=16,B=28,R=W-10, n=s.pts.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-v/max); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [0, s.every/2, s.every].forEach(function(h){
    var i=Math.round(h/s.step);
    g.fillText((Math.round(h*10)/10)+' h', X(Math.min(n,i))-10, H-8);
  });
  g.fillText('mg/L', 4, 12);
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(s.mic)); g.lineTo(R,Y(s.mic)); g.stroke(); g.setLineDash([]);
  g.fillText('MIC '+s.mic, L, Y(s.mic)-4);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  s.pts.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
}
function livePk(){
  draw();
  var s=series();
  var lines=[];
  var idx=DRUG[S.drug][1];
  var need=(S.sev==='shock'||S.sev==='sepsis')?100:70;
  if(idx==='fT>MIC'){
    var pct=Math.round(s.above*100);
    lines.push(pct+'% of this dose interval is above the MIC. The target in this patient is '+need+'%.');
    lines.push(pct>=need?'Exposure is adequate. Continue.':'Exposure is not adequate. Change the dose, the interval, or the infusion, then recheck.');
  }
  if(idx==='AUC/MIC') lines.push('Vancomycin and the other AUC drugs need a measured level. The target for vancomycin is an AUC/MIC of 400–600.');
  if(idx==='Cmax/MIC'){
    var ratio=s.mic?s.peak/s.mic:0;
    lines.push('Sketch peak is about '+ratio.toFixed(1)+' times the MIC. Aminoglycosides want about 8–10.');
    lines.push(ratio>=8?'Peak target met on this sketch.':'Peak target missed on this sketch.');
  }
  if(S.traj==='arc') lines.push('Augmented clearance can drop the level under the MIC before the next dose.');
  if(S.traj==='aki') lines.push('Clearance is changing. Recalculate rather than leaving yesterday’s dose.');
  if(S.vd!=='normal') lines.push('A larger volume lowers the early level. The loading dose is already in the regimen.');
  if(S.level==='yes') lines.push('A measured level replaces this sketch.');
  if(judge().bad) lines.push('A level above the MIC does not help if the enzyme destroys the drug.');
  var missed=idx==='fT>MIC' && Math.round(s.above*100)<need;
  if(idx==='Cmax/MIC' && s.mic && s.peak/s.mic<8) missed=true;
  return out(idx, lines, judge().bad||missed);
}
function livePlan(){
  if(S.bact==='no') return out('Stop', ['This is not a bacterial infection. Do not give an antibiotic. Look for another diagnosis.'], true);
  var j=judge();
  var lines=[];
  if(S.resp==='worsening') lines.push('Worse at 24–72 hours. Recheck the source, the MIC, and the level. Do not add a drug until you know why.');
  else if(S.resp==='stable') lines.push('Unchanged. Recheck the diagnosis and the source.');
  else lines.push('Improving. Continue if the drug is active.');
  if(S.control==='no') lines.push('Source is not controlled. Drain it, remove the line, debride, or relieve the obstruction.');
  else lines.push('Source is controlled.');
  if(S.identified==='yes' && S.astYes==='yes' && !j.bad && S.ast!=='R') lines.push('Culture is back. Narrow to '+DRUG[S.drug][0]+' and stop duplicate cover.');
  else lines.push('Culture is incomplete. Reassess daily. Do not leave the broad drug on by habit.');
  if(j.bad) lines.push(j.title+'.');
  if(S.resp==='improving' && S.control==='yes' && S.identified==='yes' && !j.bad){
    var stop={cap:'5 days',vap:'7 days',uti:'5 to 7 days',iab:'about 4 days after source control',ssti:'5 to 7 days',bsi:'7 days for a gram-negative that is improving',line:'a short course once the line is out',cns:'often 2 to 3 weeks',endo:'weeks, by the organism'};
    if(S.po==='yes' && (S.source==='cap'||S.source==='uti'||S.source==='ssti')) lines.push('Convert the vein to a tablet.');
    else lines.push('Stay on the vein.');
    if(stop[S.source]) lines.push('Usual stop: '+stop[S.source]+'. Then stop the antibiotic.');
  }
  var c=crcl(); if(c!=null) lines.push('Clearance '+Math.round(c)+' mL/min. '+doseLine());
  var bad=S.resp==='worsening'||S.control==='no'||j.bad;
  return out(bad?'Change the plan':'Stop when the course is done', lines, bad);
}
function liveAst(){
  if(S.ast==='R') return out('Resistant', ['Do not use this drug. Pick an active alternative.'], true);
  if(S.ast==='I') return out('Intermediate', ['Do not switch yet. Optimize the dose, the interval, and the infusion. Then recheck the exposure.']);
  if(S.ast==='pending') return out('No MIC yet', ['Stay empiric. Use the site and any previous isolate.']);
  return out('Susceptible', ['MIC '+(num('mic')==null?'—':num('mic'))+' mg/L. Continue only if the exposure reaches the target.']);
}
function liveBody(){
  var c=crcl();
  if(c==null) return out('Need the body numbers', []);
  var lines=[band(c)+'.'];
  var u=num('uo'), w=num('wt');
  if(u!=null&&w) lines.push('Urine '+(u/w).toFixed(2)+' mL/kg/h.');
  if(c>130||S.traj==='arc') lines.push('Augmented clearance. A normal dose may fall short.');
  if(S.traj==='aki') lines.push('Clearance is falling. Recalculate as the creatinine changes.');
  if(S.rrt==='crrt') lines.push('CRRT effluent '+(num('eff')||25)+' mL/kg/h. At 25 or above, keep a full dose.');
  if(S.rrt==='ihd') lines.push('Dose for hemodialysis, and give it after dialysis.');
  if(S.vd!=='normal'||S.sev==='shock') lines.push('The volume is large. Give a loading dose.');
  return out('Creatinine clearance '+Math.round(c)+' mL/min', lines, c<30||c>130);
}
function liveReview(){
  if(S.resp==='worsening') return out('Worse', ['Recheck the source, the MIC, and the level before you add a drug.'], true);
  if(S.resp==='stable') return out('Unchanged', ['Recheck the diagnosis and the source.']);
  return out('Improving', ['Continue the active drug.']);
}
function liveSrc(){
  if(S.control==='no') return out('Source is open', ['Drain it, remove the line, debride, or relieve the obstruction. A broader antibiotic does not replace that.'], true);
  return out('Source is controlled', ['Continue the antibiotic.']);
}
function liveNarrow(){
  var j=judge();
  if(S.identified!=='yes'||S.astYes!=='yes') return out('Not yet', ['Reassess every day. Do not leave the broad drug on by habit.']);
  if(j.bad||S.ast==='R') return out('This drug is not the narrow one', [j.title+'.'], true);
  return out('Narrow', ['Use '+DRUG[S.drug][0]+'. Stop duplicate cover.']);
}
function livePo(){
  var okSite=S.source==='cap'||S.source==='uti'||S.source==='ssti';
  if(S.po==='yes' && okSite && S.resp==='improving') return out('Convert', ['The patient is eating and an oral drug is active. Stop the vein.']);
  if(S.po==='yes' && !okSite) return out('Stay on the vein', ['This site is not a tablet site yet.'], true);
  return out('Stay on the vein', ['No oral switch.']);
}
function liveStop(){
  var kind=ORG[S.org][1], src=S.source, lines=[], bad=false, text;
  if(S.control!=='yes'){ lines.push('The source is not controlled. Do not start the clock.'); bad=true; }
  if(S.resp==='worsening'){ lines.push('The patient is worse. Do not stop on a calendar.'); bad=true; }
  if(src==='endo') text='Endocarditis is weeks. The organism and the valve decide the stop.';
  else if(src==='cns') text='Meningitis is often 2 to 3 weeks. Some organisms run longer.';
  else if(S.identified==='yes' && (kind==='mrsa'||kind==='mssa') && (src==='bsi'||src==='line')) text='Staphylococcus aureus in the blood is at least 14 days from the first negative culture, and only after the echo is clear and the line is out.';
  else if(S.identified==='yes' && kind==='vre' && (src==='bsi'||src==='line')) text='Enterococcus in the blood is often 7 to 14 days once the source is gone. A valve is weeks.';
  else if(src==='bsi') text='About 7 days only if this is uncomplicated gram-negative bacteremia. Staphylococcus aureus is at least 14 days.';
  else {
    var stop={cap:'5 days',vap:'7 days',uti:'5 to 7 days',iab:'about 4 days after source control',ssti:'5 to 7 days',line:'a short course once the line is out'};
    text='Usual duration: '+(stop[src]||'by the syndrome')+'.';
  }
  lines.push(text);
  if(!bad && S.resp==='improving') lines.push('When that time is done, stop the antibiotic.');
  return out(bad?'Do not stop yet':'Then stop', lines, bad);
}
function liveNon(){ return out('Look elsewhere', ['No antibiotic. Search for a noninfectious diagnosis.'], true); }
function refresh(){
  var id=stack[stack.length-1];
  var map={bact:liveBact,sick:liveSick,site:liveSite,micro:liveMicro,mdr:liveMdr,cover:liveCover,bug:liveBug,ast:liveAst,body:liveBody,drug:liveDrug,pk:livePk,review:liveReview,src:liveSrc,narrow:liveNarrow,po:livePo,stop:liveStop,non:liveNon};
  var el=document.getElementById('live');
  if(el && map[id]) el.innerHTML=map[id]();
  var ok=id==='body'?crcl()!=null:id==='ast'?(S.ast==='pending'||num('mic')!=null):true;
  document.getElementById('next').disabled=(id==='stop'||id==='non')?false:!ok;
}
function show(){
  var id=stack[stack.length-1];
  var order=route();
  if(order.indexOf(id)<0){ stack=['bact']; id='bact'; order=route(); }
  document.getElementById('stepName').textContent=TITLE[id]+' · '+(order.indexOf(id)+1)+' of '+order.length;
  document.getElementById('view').innerHTML=views()[id]();
  document.getElementById('back').disabled=stack.length<2;
  document.getElementById('next').textContent=(id==='stop'||id==='non')?'Done':'Next';
  refresh();
}
document.getElementById('view').oninput=function(e){
  if(!e.target.id) return;
  S[e.target.id]=e.target.value;
  if(e.target.id==='bact') show();
  else refresh();
};
document.getElementById('view').onchange=document.getElementById('view').oninput;
document.getElementById('back').onclick=function(){ if(stack.length>1){ stack.pop(); show(); } };
document.getElementById('next').onclick=function(){
  var id=stack[stack.length-1];
  var order=route();
  var i=order.indexOf(id);
  if(i<0||i===order.length-1){ location.href='index.html'; return; }
  stack.push(order[i+1]);
  show();
};
show();
</script>
</body>
</html>
