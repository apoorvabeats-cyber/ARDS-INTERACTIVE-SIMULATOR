function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function crcl(){
  var age=num('age'), wt=num('wt'), scr=num('scr'), ht=num('ht');
  if(age==null||wt==null||scr==null||ht==null||scr<=0||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);

  ceftolozane:['Ceftolozane-tazobactam','fT>MIC','Difficult Pseudomonas. Pneumonia is 3 g, not 1.5 g.','The urinary dose under-treats pneumonia.'],

  levofloxacin:['Levofloxacin','AUC/MIC','Fluoroquinolone. A reserve drug for community lung when a beta-lactam cannot be given.','Tendons, a long QT, and C. difficile.'],

function prefList(){ return PREF[S.mech]||[]; }
function siteBlock(id){
  var kind=ORG[S.org][1];
  if((id==='tigecycline'||id==='eravacycline'||id==='azithromycin') && (S.source==='bsi'||S.source==='endo'||S.source==='line')) return 'Blood levels are too low.';
  if(id==='daptomycin' && (S.source==='vap'||S.source==='cap')) return 'Surfactant in the lung inactivates daptomycin.';
  if(id==='cefazolin' && S.source==='cns') return 'Cefazolin does not treat meningitis.';
  if(id==='polymyxin' && S.source==='uti') return 'Polymyxin B does not reach the urine.';
  if(id==='metronidazole' && S.source!=='iab' && S.source!=='cns') return 'Metronidazole does not treat this site.';
  if(id==='azithromycin' && S.source!=='cap') return 'A macrolide is not the drug for this site.';
  if(id==='ciprofloxacin' && (S.source==='vap'||S.source==='cap')) return 'Ciprofloxacin is a weak pneumonia drug.';
  var gp={vancomycin:1,linezolid:1,daptomycin:1,cefazolin:1,ampicillin:1};
  if(gp[id] && kind!=='mrsa' && kind!=='vre' && kind!=='mssa' && kind!=='faecalis'){

function judge(){

  }

  if(block) return {bad:true, title:'Wrong place or wrong bug', lines:[block]};
  if(S.mech==='none'){
    if(id==='polymyxin') return {bad:true, title:'Last drug, not the first', lines:['A polymyxin is not the first drug when no enzyme is named.']};

    if(id==='aztreonam') return {bad:false, title:'Anaphylaxis substitute', lines:[DRUG.aztreonam[2], DRUG.aztreonam[3]]};
    if(id==='cefazolin' && ORG[S.org][1]==='mssa') return {bad:false, title:'MSSA drug', lines:[DRUG.cefazolin[2], DRUG.cefazolin[3]]};
    if(id==='vancomycin' && ORG[S.org][1]==='mssa') return {bad:true, title:'Too broad once MSSA is known', lines:['Switch to cefazolin.']};
    if(id==='ampicillin' && ORG[S.org][1]==='faecalis') return {bad:false, title:'Faecalis drug', lines:[DRUG.ampicillin[2], DRUG.ampicillin[3]]};
    if(id==='ampicillin') return {bad:true, title:'Too narrow', lines:['Ampicillin is for susceptible Enterococcus faecalis, or Listeria in meningitis.']};
    if(id==='ceftriaxone' && ORG[S.org][1]==='pseudo') return {bad:true, title:'No Pseudomonas activity', lines:['Ceftriaxone does not treat Pseudomonas.']};
    if(id==='ceftriaxone' && (S.source==='vap'||S.where==='hospital') && S.source!=='cns') return {bad:true, title:'Too narrow for a hospital infection', lines:['Ceftriaxone misses Pseudomonas and AmpC.']};

    if(id==='levofloxacin') return {bad:false, title:'Anaphylaxis reserve', lines:[DRUG.levofloxacin[2], DRUG.levofloxacin[3]]};
    if(id==='ciprofloxacin' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first drug', lines:['Save ciprofloxacin. It is weak for pneumonia and it harms tendons, the QT, and the gut.']};
    if(id==='azithromycin') return {bad:false, title:'Partner only', lines:['Azithromycin covers atypicals. It does not replace the beta-lactam.']};
    if(id==='metronidazole') return {bad:false, title:'Anaerobes only', lines:['Keep the gram-negative drug. Metronidazole does not replace it.']};
    if(S.org==='pseudomonas' && id==='meropenem') return {bad:false, title:'Active if susceptible', lines:['Pseudomonas needs an antipseudomonal drug. Ertapenem would not be one.']};
    if(ORG[S.org][1]==='mrsa' && (id==='vancomycin'||id==='linezolid')) return {bad:false, title:id==='linezolid'&&(S.source==='bsi'||S.source==='endo')?'Weak for the blood':'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mrsa' && id==='daptomycin') return {bad:false, title:'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='vre' && id==='vancomycin') return {bad:true, title:'Vancomycin does not treat VRE', lines:['Use high-dose daptomycin or linezolid.']};

  return {bad:true, title:'Does not match '+MECH[S.mech], lines:['Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.']};

function doseWt(){
  var wt=num('wt'), ht=num('ht');
  if(wt==null||ht==null||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  if(bmi>=30 && wt>ibw) return ibw+0.4*(wt-ibw);
  return wt;

function g(mg){
  if(mg===3375) return '3.375 g';
  if(mg===2250) return '2.25 g';
  if(mg>=1000) return (Math.round(mg/10)/100)+' g';
  return Math.round(mg)+' mg';

    gnb=null;

    lines.push('MDR risk is high. Meropenem replaces the narrower gram-negative drug.');
    gnb='meropenem';
  }
  var ana=S.allergy==='anaphylaxis';
  var ordinary=gnb==='meropenem'||gnb==='cefepime'||gnb==='piptazo'||gnb==='ctx'||gnb==='ctx-cns'||gnb==='cefazolin'||gnb==='ampsulba';
  var special=gnb==='aztavi'||gnb==='ceftazavi'||gnb==='ceftolozane'||gnb==='sulbactam';
  if(ana && special){
    lines.push('The organism from before still needs a beta-lactam. Do not give it until the allergy is reviewed.');
    gnb=null;
  } else if(ana && ordinary){
    if(gnb==='ctx-cns'){
      lines.push('Do not give ceftriaxone. Keep vancomycin. Ask before any beta-lactam, including meropenem.');
      gnb=null;
    } else if(gnb==='ampsulba'){
      lines.push('Penicillin anaphylaxis. Do not give ampicillin-sulbactam.');
      gnb=null;
    } else if(gnb==='cefazolin'){
      lines.push('Penicillin anaphylaxis. Do not give cefazolin. Vancomycin replaces it.');
      gnb=null;
    } else if(src==='cap'||src==='asp'){
      lines.push(doseFor('levofloxacin')+' This replaces ceftriaxone.');
      gnb=null;
    } else {
      gnb='aztreonam';
    }
  }
  if(shock) lines.unshift('Shock. Draw the cultures, then give this now.');
  if(gnb==='ctx'||gnb==='ctx-cns') lines.push(doseFor('ceftriaxone'));
  if(gnb==='ctx' && src==='cap') lines.push(doseFor('azithromycin')+' This is only the atypical partner.');
  if(gnb && DRUG[gnb]) lines.push(doseFor(gnb));
  if(needAna() && gnb!=='meropenem' && gnb!=='piptazo' && gnb!=='aztavi' && gnb!=='ampsulba') lines.push(doseFor('metronidazole')+' This is the anaerobe drug. It does not replace the other one.');
  if(S.nec==='yes'){
    lines.unshift('Urgent source control. Call surgery now.');
    lines.push(doseFor('clindamycin')+' For the toxin, not for MRSA.');
  }
  if(needVre() && src!=='cns' && src!=='neuro'){
    if(src==='vap'||src==='cap'||src==='asp') lines.push(doseFor('linezolid')+' Previous VRE. Not vancomycin, and not daptomycin in the lung.');

  } else if((needMrsa()||S.prior==='mrsa'||(ana && src==='ssti')) && src!=='cns' && src!=='neuro') lines.push(doseFor('vancomycin')+' This is the MRSA drug.');
  if(src==='cns'||src==='neuro'){
    if(needVre()) lines.push(doseFor('linezolid')+' Previous VRE. Vancomycin will not treat it, and daptomycin does not enter this space.');
    else lines.push(doseFor('vancomycin')+(src==='neuro'?' This is for the hospital gram-positive, including MRSA.':' This is for resistant pneumococcus, not MRSA.'));
    if(src==='cns' && !hasSource('brainabs') && (num('age')||0)>=50 && !ana) lines.push(doseFor('ampicillin')+' For Listeria.');
    if(src==='cns' && !hasSource('brainabs') && (num('age')||0)>=50 && ana) lines.push('Age 50 or more, but penicillin anaphylaxis: do not add ampicillin.');
  }

  if(src==='line' && !needMrsa() && !needVre()) lines.push(doseFor('vancomycin')+' Then remove the line.');
  (S.sources||[]).forEach(function(id){ if(SRC[id]&&SRC[id].note) lines.push(SRC[id].note); });
  return lines;
}
function series(){
  var mic=num('mic'); if(mic==null) mic=1;
  var r=regimen();
  var every=r?r.every:8, inf=r?r.infH:0.5, mg=r?r.mg:1000;
  var c=crcl(); if(c==null) c=80;
  var ke=0.15*(c/80);
  if(S.traj==='arc'||c>130) ke*=1.7;
  if(S.traj==='aki') ke*=0.4;
  if(S.rrt==='crrt'||S.traj==='rrt'){
    var e=num('eff'); if(e==null) e=25;
    ke=0.08+e/400;
  }
  var vd=S.vd==='marked'?1.8:S.vd==='increased'?1.35:1;
  var peak=(32*(mg/1000))/vd;
  var pts=[], step=Math.max(0.25, every/32);
  for(var t=0;t<=every+0.001;t+=step){
    var y;
    if(S.inf==='continuous' && DRUG[S.drug][1]==='fT>MIC') y=peak*0.45;
    else if(t<=inf) y=peak*(inf?t/inf:1);
    else y=peak*Math.exp(-ke*(t-inf));
    pts.push(y);
  }
  var above=pts.filter(function(y){return y>mic;}).length/pts.length;
  var peakNow=Math.max.apply(null, pts);
  return {pts:pts, mic:mic, above:above, every:every, step:step, peak:peakNow};
}
function draw(){
  var c=document.getElementById('chart'); if(!c) return;
  var dpr=Math.min(2, devicePixelRatio||1);
  var W=c.clientWidth||640, H=c.clientHeight||220;
  c.width=W*dpr; c.height=H*dpr;
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var s=series();
  var max=Math.max(s.mic*1.4, 8, Math.max.apply(null,s.pts));
  var L=46,T=16,B=28,R=W-10, n=s.pts.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-v/max); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [0, s.every/2, s.every].forEach(function(h){
    var i=Math.round(h/s.step);
    g.fillText((Math.round(h*10)/10)+' h', X(Math.min(n,i))-10, H-8);
  });
  g.fillText('mg/L', 4, 12);
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(s.mic)); g.lineTo(R,Y(s.mic)); g.stroke(); g.setLineDash([]);
  g.fillText('MIC '+s.mic, L, Y(s.mic)-4);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  s.pts.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
}

function labOf(id){

  if(kind==='vre') return (id==='linezolid'||id==='daptomycin')?'S':'R';

function severity(){
  var sbp=num('sbp'), map=num('map'), lact=num('lact'), uo=num('uo'), rr=num('rr'), spo=num('spo'), plt=num('plt'), scr=num('scr');

  if(organ) return {band:'yellow', name:'Sepsis', sev:'sepsis', clock:'Sepsis. Within 1 hour. Do not wait for a procalcitonin.'};
  return {band:'green', name:'Infection', sev:'stable', clock:'Infection without organ failure. Look first. If it still looks infected, give the antibiotic within 3 hours. A broader drug is not automatic.'};

function infectionProb(){
  var pct=num('pct'), tlc=num('tlc'), temp=num('temp'), n=0;

function targeted(){
  if(S.culture!=='pos') return {act:'Continue', bad:false, lines:['The culture is not back. Stay on the empiric drug. Do not narrow yet.']};
  var letter=S.astMap&&S.astMap[S.drug];
  if(!letter) return {act:'Not yet', bad:true, lines:['Mark S, I, or R for the drug you would keep. Do not invent a result.']};
  if(letter==='R') return {act:'Change', bad:true, lines:[DRUG[S.drug][0]+' is resistant. Stop it.']};
  if(S.mechKnown==='yes' && S.mech && S.mech!=='none'){
    S.ast=letter;
    var j=judge();
    if(j.bad) return {act:'Change', bad:true, lines:j.lines};
  } else if(letter==='S'){
    return {act:'Narrow', bad:false, lines:['No enzyme was named. Use the susceptible drug and stop the extra ones. Do not assume ESBL, KPC, NDM, or OXA-48.']};
  }
  if(letter==='I') return {act:'Change', bad:true, lines:['Intermediate. Lengthen the infusion if the patient is stable. In shock, change the drug.']};
  return {act:'Narrow', bad:false, lines:['Keep '+DRUG[S.drug][0]+' and stop the drugs the culture does not need.']};

function oralLine(){

function durationText(){
  var src=S.source, kind=ORG[S.org]?ORG[S.org][1]:'';

  if(hasSource('brainabs')) return 'A brain abscess is often 4 to 8 weeks.';
  if(src==='endo') return 'Endocarditis is weeks.';
  if(src==='cns'||src==='neuro') return 'Meningitis is often 2 to 3 weeks.';

  if((kind==='mrsa'||kind==='mssa') && (src==='bsi'||src==='line'||src==='endo')) return 'Staphylococcus aureus in the blood is at least 14 days. A falling procalcitonin does not shorten it.';
  if(src==='vap') return 'Hospital pneumonia is usually 7 days.';
  if(src==='cap') return 'Community pneumonia is usually 5 days.';
  if(src==='uti') return 'Urine infection is usually 5 to 7 days. Uncomplicated cystitis is 3 to 5 days.';
  if(src==='iab') return 'About 4 days after the source is controlled.';
  if(src==='ssti') return 'Skin infection is usually 5 to 7 days if it is not necrotizing.';

}
function planAction(){
  var lines=[];
  if(S.control!=='yes') return {act:'Do not stop', bad:true, lines:['The source is open. A falling procalcitonin does not close it.']};
  if(S.resp==='worsening') return {act:'Escalate', bad:true, lines:['Worse. Recheck the source and the culture before adding a drug.']};
  if((S.culture==='neg'||S.culture==='contam'||S.altDx==='yes') && S.resp==='improving') return {act:'Stop', bad:false, lines:['The culture does not support continuing, and the patient is better.']};
  var hard=S.source==='endo'||S.source==='cns'||S.source==='bone'||((ORG[S.org][1]==='mrsa'||ORG[S.org][1]==='mssa')&&(S.source==='bsi'||S.source==='line'));
  if(S.culture==='pos') lines=lines.concat(targeted().lines);
  if(hard) lines.push('A falling procalcitonin does not shorten this course.');
  else if(S.pctTrend==='down' && S.resp==='improving') lines.push('The source is controlled and the patient is better. A falling procalcitonin can support a stop only when the duration is otherwise unclear.');

}

  if(num('bili')!=null && num('bili')>=2) S.liver='yes';
  if(!S.sources||!S.sources.length) return '<div class="rec-box"><h4>Choose a source</h4></div>';
  if(S.sev==='low') return '<div class="rec-box"><h4>Do not start</h4><p>This does not look like infection, and there is no shock.</p></div>';
  var lines=empiricNow();
  var picks=S.picks||[];
  var alt=picks.length?altId(picks[0]):'';
  var act=planAction();
  var c=crcl();
  var letter=S.astMap&&S.drug&&S.astMap[S.drug];
  return '<div class="clock '+sev.band+'">'+sev.name+'. '+sev.clock+'</div>'
    +'<div class="rec-box"><h4>Empiric, until the culture returns</h4><ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
    +coverage()
    +'<div class="rec-box"><h4>Why</h4><ul>'+whyLines().map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
    +'<div class="rec-box"><h4>Not needed</h4><ul>'+unnecessary().map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
    +picks.map(doseBlock).join('')
    +(alt&&DRUG[alt]?'<div class="rec-box"><h4>Alternative</h4><p>'+DRUG[alt][0]+'. Standard dose: '+stdDose(alt)+'</p></div>':'')
    +'<div class="rec-box"><h4>Final plan</h4>'
    +'<p>Source: '+(S.sources||[]).join(', ')+'</p>'
    +'<p>Setting: '+(S.acq||'community')+'</p>'
    +'<p>Severity: '+sev.name+'</p>'
    +'<p>MDR risk: '+mdrLevel()+'</p>'
    +'<p>Organism: '+(S.culture==='pos'&&ORG[S.org]?ORG[S.org][0]:'Not back')+'</p>'
    +'<p>Result: '+(letter||'Not entered')+(S.hasmic==='yes'&&num('mic')!=null?(' · MIC '+num('mic')+' mg/L'):' · MIC not entered')+'</p>'
    +'<p>Mechanism: '+(S.mechKnown==='yes'&&S.mech&&S.mech!=='none'?MECH[S.mech]:'No information. Not assumed.')+'</p>'
    +'<p>Clearance: '+(c==null?'—':Math.round(c)+' mL/min')+'</p>'
    +'<p>Liver: '+((S.liver==='yes')?'Impaired':'Not flagged')+'</p>'
    +'<p>'+act.act+'</p><ul>'+act.lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>'
    +'<p>Check this before you give it.</p></div>';
}
function stepHtml(){
  var n=S.step, h='';
  if(n===1){
    var groups=[['A','Respiratory',[['cap','CAP'],['hap','HAP'],['vap','VAP'],['asp','Aspiration pneumonia'],['lungabs','Lung abscess / empyema']]],['B','Urinary',[['uti','UTI'],['pyelo','Pyelonephritis / complicated UTI'],['cauti','CAUTI'],['urosep','Urosepsis']]],['C','Intra-abdominal',[['chol','Cholangitis / cholecystitis'],['app','Appendicitis / diverticulitis'],['perit','Peritonitis'],['iaabs','Intra-abdominal abscess'],['paiab','Post-operative abdominal infection']]],['D','Skin and soft tissue',[['cell','Cellulitis'],['skabs','Abscess'],['dfi','Diabetic foot infection'],['nec','Necrotizing soft-tissue infection'],['wound','Infected wound / pressure injury']]],['E','CNS',[['men','Meningitis'],['brainabs','Brain abscess'],['neuro','Post-neurosurgical meningitis / ventriculitis']]],['F','Bloodstream',[['bact','Bacteremia'],['clabsi','CLABSI / CRBSI'],['endo','Infective endocarditis']]],['G','Bone and joint',[['osteo','Osteomyelitis'],['septicj','Septic arthritis'],['pji','Prosthetic joint infection']]],['H','Other',[['postsep','Post-operative / healthcare-associated'],['neut','Neutropenic / immunocompromised'],['unk','Unknown source']]]];
    h='<div class="step-title">Where is the infection?</div><div class="step-desc">Tap every source that fits.</div>'
      +groups.map(function(g){return '<div class="group">'+g[0]+'. '+g[1]+'</div><div class="checkbox-group">'+g[2].map(function(s){return '<div class="chip-option'+onSrc(s[0])+'" data-src="'+s[0]+'">'+s[1]+'</div>';}).join('')+'</div>';}).join('')
      +'<div class="form-group"><label class="form-label">Where it was caught</label><div class="radio-group">'+chip('acq','community','Community')+chip('acq','hospital','Hospital')+chip('acq','device','Healthcare or device')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Penicillin allergy</label><div class="radio-group">'+chip('allergy','no','None')+chip('allergy','rash','Rash only')+chip('allergy','anaphylaxis','Anaphylaxis')+'</div></div>';
  }
  if(n===2){
    var sev=severity();
    h='<div class="step-title">How sick?</div><div class="clock '+sev.band+'">'+sev.name+'. '+sev.clock+'</div>'
      +'<div class="grid">'+box('temp','Temperature °C')+box('hr','Heart rate')+box('sbp','Systolic')+box('dbp','Diastolic')+box('map','MAP')+box('rr','Respiratory rate')+box('spo','SpO2')+box('lact','Lactate')+box('uo','Urine mL/h')+'</div>'
      +'<div class="form-group"><label class="form-label">Vasopressor</label><div class="radio-group">'+chip('press','no','No')+chip('press','yes','Yes')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Thinking</label><div class="radio-group">'+chip('mental','clear','Clear')+chip('mental','altered','Not clear')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Does this look like infection?</label><div class="radio-group">'+chip('clinical','high','Likely')+chip('clinical','mid','Unsure')+chip('clinical','low','Unlikely')+'</div></div>';
  }
  if(n===3){
    var pctT=trend('pct','pctPrev'), crpT=trend('crp','crpPrev');
    h='<div class="step-title">Labs</div><div class="step-desc">Infection looks '+infectionProb().toLowerCase()+'. A procalcitonin does not start or choose the antibiotic. Clearance '+(crcl()==null?'needs age, sex, height, weight, and creatinine':Math.round(crcl())+' mL/min')+'.</div>'
      +(pctT?'<p class="step-desc">Procalcitonin is '+pctT+'. CRP is '+(crpT||'not compared')+'.</p>':'')
      +'<div class="grid">'+box('age','Age')+box('ht','Height cm')+box('wt','Weight kg')+box('scr','Creatinine')+box('bili','Bilirubin')+box('tlc','WBC')+box('anc','Neutrophils')+box('plt','Platelets')+box('crp','CRP now')+box('crpPrev','CRP earlier')+box('pct','Procalcitonin now')+box('pctPrev','Procalcitonin earlier')+'</div>'
      +'<div class="form-group"><label class="form-label">Sex</label><div class="radio-group">'+chip('sex','male','Male')+chip('sex','female','Female')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Kidneys</label><div class="radio-group">'+chip('rrt','none','Own kidneys')+chip('rrt','crrt','CRRT')+chip('rrt','ihd','Hemodialysis')+'</div></div>'
      +(S.rrt==='crrt'?'<div class="grid">'+box('eff','CRRT mL/kg/h')+'</div>':'')
      +'<div class="form-group"><label class="form-label">Liver</label><div class="radio-group">'+chip('liver','no','Acceptable')+chip('liver','yes','Failing')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Cultures</label><div class="radio-group">'+chip('blood','yes','Blood taken')+chip('blood','no','Blood not taken')+'</div></div>';
  }
  if(n===4){
    var risks=[['ABX','Antibiotics in 90 days'],['HOSP','Recent hospitalization'],['ICU','Recent ICU'],['SURG','Recent surgery'],['MDR','Previous MDR organism'],['ESBL','Previous ESBL'],['CRE','Previous carbapenem-resistant organism'],['DTR','Previous MDR Pseudomonas'],['MRSA','Previous MRSA'],['VRE','Previous VRE'],['DIAL','Chronic dialysis'],['CATH','Long-term urinary catheter'],['CVC','Central line'],['VENT','Ventilation or tracheostomy'],['IMMUNO','Immunosuppression'],['LTCF','Long-term care']];
    h='<div class="step-title">What raises resistance?</div><div class="clock '+(mdrLevel()==='High'?'red':mdrLevel()==='Moderate'?'yellow':'green')+'">MDR risk: '+mdrLevel()+'</div><div class="step-desc">Use what you can know today. Do not guess the enzyme.</div><div class="checkbox-group">'
      +risks.map(function(r){return '<div class="chip-option'+(hasRisk(r[0])?' selected':'')+'" data-risk="'+r[0]+'">'+r[1]+'</div>';}).join('')+'</div>'
      +'<div class="form-group" style="margin-top:12px"><label class="form-label">Your unit, if you know it</label><div class="radio-group">'+chip('bio','no','Not available')+chip('bio','high','Resistance is common here')+'</div></div>';
  }
  if(n===5) h='<div class="step-title">Empiric drug and dose</div><div class="step-desc">The textbook dose is first. The recommended dose is this patient, from clearance and the liver only.</div><div id="live"></div>';
  if(n===6){
    var drugs=reportDrugs();
    h='<div class="step-title">When the culture returns</div><div class="step-desc">Enter only what the report shows. If the enzyme is not named, leave it unknown.</div>'
      +'<div class="form-group"><label class="form-label">Organism</label><div class="radio-group">'+Object.keys(ORG).map(function(k){return chip('org',k,ORG[k][0]);}).join('')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Is an MIC printed?</label><div class="radio-group">'+chip('hasmic','no','No')+chip('hasmic','yes','Yes')+'</div></div>'
      +(S.hasmic==='yes'?'<div class="grid">'+box('mic','MIC mg/L for the drug you mark')+'</div>':'')
      +'<div class="form-group"><label class="form-label">Mark the drug you would keep</label></div>'
      +drugs.map(function(id){
        var mark=S.astMap&&S.astMap[id];
        return '<div class="rec-box"><h4>'+DRUG[id][0]+'</h4><div class="radio-group">'
          +['S','I','R'].map(function(L){return '<div class="chip-option'+((mark===L)?' selected':'')+'" data-ast="'+id+'" data-letter="'+L+'">'+L+'</div>';}).join('')
          +'</div></div>';
      }).join('')
      +'<div class="form-group"><label class="form-label">Is the enzyme named on the report?</label><div class="radio-group">'+chip('mechKnown','no','No information')+chip('mechKnown','yes','Yes')+'</div></div>'
      +(S.mechKnown==='yes'?'<div class="radio-group">'+Object.keys(MECH).map(function(k){return chip('mech',k,MECH[k]);}).join('')+'</div>':'');
  }
  if(n===7){
    h='<div class="step-title">At 24 to 72 hours</div>'
      +'<div class="form-group"><label class="form-label">Course</label><div class="radio-group">'+chip('resp','improving','Improving')+chip('resp','stable','Unchanged')+chip('resp','worsening','Worse')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Culture</label><div class="radio-group">'+chip('culture','pending','Pending')+chip('culture','pos','Positive')+chip('culture','neg','Negative')+chip('culture','contam','Contaminant')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Source</label><div class="radio-group">'+chip('control','yes','Controlled')+chip('control','no','Open')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Procalcitonin</label><div class="radio-group">'+chip('pctTrend','down','Falling')+chip('pctTrend','same','Unchanged')+chip('pctTrend','up','Rising')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Eating, and an oral drug is active</label><div class="radio-group">'+chip('eating','no','Not yet')+chip('eating','yes','Yes')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Another diagnosis fits</label><div class="radio-group">'+chip('altDx','no','No')+chip('altDx','yes','Yes')+'</div></div>';
  }
  if(n===8) h='<div class="step-title">Final plan</div><div id="live"></div>';
  return h;
}
function renderRec(){
  var badge=document.getElementById('status-badge');
  var boxEl=document.getElementById('recommendation-content');
  var html=cardHtml();
  if(boxEl) boxEl.innerHTML=html;
  if(badge){ var sev=severity(); badge.textContent=sev.name; badge.className='badge '+(sev.band==='green'?'badge-success':'badge-danger'); }
  var live=document.getElementById('live');
  if(live) live.innerHTML=html;
  var sum=document.getElementById('summary-list');
  if(sum) sum.innerHTML='';
}
function render(){
  if(!S.step||S.step<1) S.step=1;
  if(S.step>8) S.step=8;
  document.getElementById('stepName').textContent=STEPS[S.step-1]+' · '+S.step+' of '+STEPS.length;
  document.getElementById('step-content').innerHTML=stepHtml();
  var ans=document.getElementById('answer');
  if(ans) ans.style.display='none';
  document.getElementById('btn-prev').disabled=S.step===1;
  document.getElementById('btn-next').textContent=S.step===8?'Done':'Next';
  renderRec();
  window.scrollTo(0,0);
}
document.body.addEventListener('click', function(e){
  var src=e.target.closest('[data-src]');
  if(src){
    if(!S.sources) S.sources=[];
    var id=src.dataset.src, i=S.sources.indexOf(id);
    if(i>=0) S.sources.splice(i,1); else S.sources.push(id);
    syncPrimary(); render(); return;
  }
  var risk=e.target.closest('[data-risk]');
  if(risk){ var i=S.risks.indexOf(risk.dataset.risk); if(i>=0) S.risks.splice(i,1); else S.risks.push(risk.dataset.risk); render(); return; }
  var ast=e.target.closest('[data-ast]');
  if(ast){
    if(!S.astMap) S.astMap={};
    S.astMap[ast.dataset.ast]=ast.dataset.letter;
    S.drug=ast.dataset.ast;
    S.ast=ast.dataset.letter;
    S.culture='pos';
    render(); return;
  }
  var b=e.target.closest('[data-k]');
  if(!b) return;
  S[b.dataset.k]=b.dataset.v;
  if(b.dataset.k==='org') S.culture='pos';
  if(b.dataset.k==='mechKnown' && S.mechKnown==='no') S.mech='none';
  if(b.dataset.k==='hasmic' && S.hasmic==='no') S.mic='';
  render();
});
document.body.addEventListener('input', function(e){
  if(!e.target.id) return;
  S[e.target.id]=e.target.value;
  renderRec();
});
document.getElementById('btn-prev').onclick=function(){ if(S.step>1) go(S.step-1); };
document.getElementById('btn-next').onclick=function(){ if(S.step<8) go(S.step+1); else location.href='index.html'; };
S.step=1;
if(!S.sources) S.sources=[];
if(!S.risks) S.risks=[];
if(!S.astMap) S.astMap={};
if(!S.acq) S.acq='community';
if(!S.mech) S.mech='none';
render();

</script>
</body>
</html>
