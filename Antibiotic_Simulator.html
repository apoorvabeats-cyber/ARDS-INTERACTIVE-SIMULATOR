function num(id){ var n=parseFloat(String(S[id]==null?'':S[id]).replace(',','.')); return Number.isFinite(n)?n:null; }
function crcl(){
  var age=num('age'), wt=num('wt'), scr=num('scr'), ht=num('ht');
  if(age==null||wt==null||scr==null||ht==null||scr<=0||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);

  ceftolozane:['Ceftolozane-tazobactam','fT>MIC','Difficult Pseudomonas. Pneumonia is 3 g, not 1.5 g.','The urinary dose under-treats pneumonia.'],

  levofloxacin:['Levofloxacin','AUC/MIC','Fluoroquinolone. A reserve drug for community lung when a beta-lactam cannot be given.','Tendons, a long QT, and C. difficile.'],

function prefList(){ return PREF[S.mech]||[]; }
function siteBlock(id){
  var kind=ORG[S.org][1];
  if((id==='tigecycline'||id==='eravacycline'||id==='azithromycin') && (S.source==='bsi'||S.source==='endo'||S.source==='line')) return 'Blood levels are too low.';
  if(id==='daptomycin' && (S.source==='vap'||S.source==='cap')) return 'Surfactant in the lung inactivates daptomycin.';
  if(id==='cefazolin' && S.source==='cns') return 'Cefazolin does not treat meningitis.';
  if(id==='polymyxin' && S.source==='uti') return 'Polymyxin B does not reach the urine.';
  if(id==='metronidazole' && S.source!=='iab' && S.source!=='cns') return 'Metronidazole does not treat this site.';
  if(id==='azithromycin' && S.source!=='cap') return 'A macrolide is not the drug for this site.';
  if(id==='ciprofloxacin' && (S.source==='vap'||S.source==='cap')) return 'Ciprofloxacin is a weak pneumonia drug.';
  var gp={vancomycin:1,linezolid:1,daptomycin:1,cefazolin:1,ampicillin:1};
  if(gp[id] && kind!=='mrsa' && kind!=='vre' && kind!=='mssa' && kind!=='faecalis'){

function judge(){

  }

  if(block) return {bad:true, title:'Wrong place or wrong bug', lines:[block]};
  if(S.mech==='none'){
    if(id==='polymyxin') return {bad:true, title:'Last drug, not the first', lines:['A polymyxin is not the first drug when no enzyme is named.']};

    if(id==='aztreonam') return {bad:false, title:'Anaphylaxis substitute', lines:[DRUG.aztreonam[2], DRUG.aztreonam[3]]};
    if(id==='cefazolin' && ORG[S.org][1]==='mssa') return {bad:false, title:'MSSA drug', lines:[DRUG.cefazolin[2], DRUG.cefazolin[3]]};
    if(id==='vancomycin' && ORG[S.org][1]==='mssa') return {bad:true, title:'Too broad once MSSA is known', lines:['Switch to cefazolin.']};
    if(id==='ampicillin' && ORG[S.org][1]==='faecalis') return {bad:false, title:'Faecalis drug', lines:[DRUG.ampicillin[2], DRUG.ampicillin[3]]};
    if(id==='ampicillin') return {bad:true, title:'Too narrow', lines:['Ampicillin is for susceptible Enterococcus faecalis, or Listeria in meningitis.']};
    if(id==='ceftriaxone' && ORG[S.org][1]==='pseudo') return {bad:true, title:'No Pseudomonas activity', lines:['Ceftriaxone does not treat Pseudomonas.']};
    if(id==='ceftriaxone' && (S.source==='vap'||S.where==='hospital') && S.source!=='cns') return {bad:true, title:'Too narrow for a hospital infection', lines:['Ceftriaxone misses Pseudomonas and AmpC.']};

    if(id==='levofloxacin') return {bad:false, title:'Anaphylaxis reserve', lines:[DRUG.levofloxacin[2], DRUG.levofloxacin[3]]};
    if(id==='ciprofloxacin' && S.allergy!=='anaphylaxis') return {bad:true, title:'Not the first drug', lines:['Save ciprofloxacin. It is weak for pneumonia and it harms tendons, the QT, and the gut.']};
    if(id==='azithromycin') return {bad:false, title:'Partner only', lines:['Azithromycin covers atypicals. It does not replace the beta-lactam.']};
    if(id==='metronidazole') return {bad:false, title:'Anaerobes only', lines:['Keep the gram-negative drug. Metronidazole does not replace it.']};
    if(S.org==='pseudomonas' && id==='meropenem') return {bad:false, title:'Active if susceptible', lines:['Pseudomonas needs an antipseudomonal drug. Ertapenem would not be one.']};
    if(ORG[S.org][1]==='mrsa' && (id==='vancomycin'||id==='linezolid')) return {bad:false, title:id==='linezolid'&&(S.source==='bsi'||S.source==='endo')?'Weak for the blood':'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='mrsa' && id==='daptomycin') return {bad:false, title:'MRSA pathway', lines:[DRUG[id][2], DRUG[id][3]]};
    if(ORG[S.org][1]==='vre' && id==='vancomycin') return {bad:true, title:'Vancomycin does not treat VRE', lines:['Use high-dose daptomycin or linezolid.']};

  return {bad:true, title:'Does not match '+MECH[S.mech], lines:['Preferred: '+pref.map(function(x){return DRUG[x][0];}).join(', ')+'.']};

function doseWt(){
  var wt=num('wt'), ht=num('ht');
  if(wt==null||ht==null||ht<=0) return null;
  var inch=ht/2.54;
  var ibw=(S.sex==='female'?45.5:50)+2.3*Math.max(0, inch-60);
  var bmi=wt/Math.pow(ht/100,2);
  if(bmi>=30 && wt>ibw) return ibw+0.4*(wt-ibw);
  return wt;

function g(mg){
  if(mg===3375) return '3.375 g';
  if(mg===2250) return '2.25 g';
  if(mg>=1000) return (Math.round(mg/10)/100)+' g';
  return Math.round(mg)+' mg';

function series(){
  var mic=num('mic'); if(mic==null) mic=1;
  var r=regimen();
  var every=r?r.every:8, inf=r?r.infH:0.5, mg=r?r.mg:1000;
  var c=crcl(); if(c==null) c=80;
  var ke=0.15*(c/80);
  if(S.traj==='arc'||c>130) ke*=1.7;
  if(S.traj==='aki') ke*=0.4;
  if(S.rrt==='crrt'||S.traj==='rrt'){
    var e=num('eff'); if(e==null) e=25;
    ke=0.08+e/400;
  }
  var vd=S.vd==='marked'?1.8:S.vd==='increased'?1.35:1;
  var peak=(32*(mg/1000))/vd;
  var pts=[], step=Math.max(0.25, every/32);
  for(var t=0;t<=every+0.001;t+=step){
    var y;
    if(S.inf==='continuous' && DRUG[S.drug][1]==='fT>MIC') y=peak*0.45;
    else if(t<=inf) y=peak*(inf?t/inf:1);
    else y=peak*Math.exp(-ke*(t-inf));
    pts.push(y);
  }
  var above=pts.filter(function(y){return y>mic;}).length/pts.length;
  var peakNow=Math.max.apply(null, pts);
  return {pts:pts, mic:mic, above:above, every:every, step:step, peak:peakNow};
}
function draw(){
  var c=document.getElementById('chart'); if(!c) return;
  var dpr=Math.min(2, devicePixelRatio||1);
  var W=c.clientWidth||640, H=c.clientHeight||220;
  c.width=W*dpr; c.height=H*dpr;
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var s=series();
  var max=Math.max(s.mic*1.4, 8, Math.max.apply(null,s.pts));
  var L=46,T=16,B=28,R=W-10, n=s.pts.length-1;
  var X=function(i){ return L+(R-L)*i/n; };
  var Y=function(v){ return T+(H-T-B)*(1-v/max); };
  g.font='12px sans-serif'; g.fillStyle='#334155'; g.strokeStyle='#e2e8f0';
  [0, s.every/2, s.every].forEach(function(h){
    var i=Math.round(h/s.step);
    g.fillText((Math.round(h*10)/10)+' h', X(Math.min(n,i))-10, H-8);
  });
  g.fillText('mg/L', 4, 12);
  g.strokeStyle='#dc2626'; g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(s.mic)); g.lineTo(R,Y(s.mic)); g.stroke(); g.setLineDash([]);
  g.fillText('MIC '+s.mic, L, Y(s.mic)-4);
  g.strokeStyle='#0f766e'; g.lineWidth=3; g.beginPath();
  s.pts.forEach(function(v,i){ if(i) g.lineTo(X(i),Y(v)); else g.moveTo(X(i),Y(v)); });
  g.stroke();
}

  applyLabs();
  var sepsisPts=sepsisOn()?2:0;
  var surgPts=S.csSurg==='yes'?1:0;
  var tpnPts=S.csTpn==='yes'?1:0;
  var colPts=S.csCol==='yes'?1:0;
  var n=sepsisPts+surgPts+tpnPts+colPts;
  return {n:n, sepsisPts:sepsisPts, surgPts:surgPts, tpnPts:tpnPts, colPts:colPts, start:n>=3};
}
function fungusPlan(ids){
  var lines=[], notes=[];
  function push(t){ lines.push(t); }
  var c=crcl(), low=c!=null&&c<50;
  ids.forEach(function(id){
    if(id==='albicans'){
      if(S.sev==='shock') push('Candida albicans in shock: micafungin 100 mg IV every 24 hours. Fluconazole after it is susceptible and the patient is stable.');
      else push('Candida albicans: fluconazole 800 mg once, then '+(low?'200 mg':'400 mg')+' every 24 hours.'+(low?' Clearance is low, so the daily dose is halved.':''));
    }
    if(id==='glabrata') push('Candida glabrata: micafungin 100 mg IV every 24 hours. Do not start fluconazole.');
    if(id==='parapsilosis') push('Candida parapsilosis: fluconazole 800 mg once, then '+(low?'200 mg':'400 mg')+' every 24 hours.');
    if(id==='auris') push('Candida auris: micafungin 100 mg IV every 24 hours. Liposomal amphotericin 5 mg/kg is only if the echinocandin fails or resistance is shown.');
    if(id==='aspergillus') push('Aspergillus: voriconazole 6 mg/kg every 12 hours for two doses, then 4 mg/kg every 12 hours.'+(low?' Clearance is under 50. Do not use the intravenous form. Give it by mouth.':''));
    if(id==='mucor') push('Mucorales: liposomal amphotericin 5–10 mg/kg IV every 24 hours. Do not reduce it for a high creatinine. Watch the kidneys.');
    if(id==='crypto') push('Cryptococcus: liposomal amphotericin 3–4 mg/kg every 24 hours plus flucytosine 25 mg/kg every '+(c!=null&&c<20?'24':c!=null&&c<40?'12':'6')+' hours.');
    if(id==='pjp') push('Pneumocystis: trimethoprim-sulfamethoxazole 15–20 mg/kg/day of trimethoprim, divided every 6 to 8 hours. This is not the Stenotrophomonas dose.');
  });
  if(!ids.length) notes.push('Name the fungus only if you have it. A score under 3 is not a reason to start one.');
  return {lines:lines, notes:notes};
}
function abxHtml(){
  refreshSources();
  var sev=severity();
  if(!S.sources.length) return '<div class="rec-box"><h4>No source yet</h4></div>';
  var lines=empiricNow();
  var picks=S.picks||[];
  var demo='';
  if(crBad()||S.rrt!=='none'){
    demo='<div class="step-desc">Creatinine is '+(num('scr')==null?'missing':num('scr'))+'. Clearance uses age, sex, height, and weight. Change them if they are wrong.</div><div class="grid">'+box('age','Age')+box('ht','Height cm')+box('wt','Weight kg')+'</div><div class="form-group"><label class="form-label">Sex</label><div class="radio-group">'+chip('sex','male','Male')+chip('sex','female','Female')+'</div></div><div class="form-group"><label class="form-label">Kidney replacement</label><div class="radio-group">'+chip('rrt','none','No')+chip('rrt','crrt','CRRT')+chip('rrt','ihd','Hemodialysis')+'</div></div>'+(S.rrt==='crrt'?'<div class="grid">'+box('eff','CRRT mL/kg/h')+'</div>':'');
  }
  return '<div class="clock '+sev.band+'">'+sev.name+'. '+sev.clock+'</div>'
    +'<div class="rec-box"><h4>Start this</h4><ul>'+lines.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
    +demo
    +picks.map(function(id){return '<div class="rec-box"><h4>'+DRUG[id][0]+'</h4><p>'+shownDose(id)+'</p></div>';}).join('')
    +'<p class="step-desc">Empiric. Change it when the organism is named. A procalcitonin did not choose this.</p>';
}
function cultureHtml(){
  refreshSources();
  var plan=bugPlan(S.bugs||[]);
  return plan.drugs.map(function(id){return '<div class="rec-box"><h4>'+(DRUG[id]?DRUG[id][0]:id)+'</h4><p>'+shownDose(id)+'</p></div>';}).join('')
    +'<ul>'+plan.notes.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>';
}
function stepHtml(){
  var n=S.step, h='';
  if(n===1){
    var sev=severity();
    h='<div class="step-title">Patient</div>'
      +'<div class="group">Symptoms</div><div class="checkbox-group">'
      +[['cough','Cough or sputum'],['breath','Breathlessness'],['urine','Burning urine or flank pain'],['abd','Abdominal pain'],['cns','Headache or neck stiffness'],['skin','Red or painful skin'],['diarrhea','Diarrhea']].map(function(s){return '<div class="chip-option'+(hasSx(s[0])?' selected':'')+'" data-sx="'+s[0]+'">'+s[1]+'</div>';}).join('')
      +'</div><div class="group">Vitals</div><div class="grid">'+box('temp','Temperature °C')+box('hr','Pulse')+box('rr','Respiratory rate')+box('sbp','Systolic')+box('dbp','Diastolic')+box('spo','SpO2')+'</div>'
      +'<div class="form-group"><label class="form-label">Oxygen</label><div class="radio-group">'+chip('o2','nc','Nasal cannula')+chip('o2','mask','Oxygen mask')+chip('o2','hfnc','HFNC')+chip('o2','niv','NIV')+chip('o2','tube','Intubated')+'</div></div>'
      +'<div id="shockline" class="clock red" style="'+(sev.sev==='shock'?'':'display:none')+'">Shock is present.</div>';
  }
  if(n===2){
    h='<div class="step-title">Are the labs back?</div><div class="radio-group">'+chip('labsOn','no','Not yet')+chip('labsOn','yes','Yes')+'</div>';
    if(S.labsOn==='yes'){
      h+='<div class="grid">'+box('tlc','WBC')+box('pct','Procalcitonin')+box('hb','Hemoglobin')+box('plt','Platelets')+box('urea','Urea')+box('scr','Creatinine')+box('bili','Bilirubin')+box('ast','AST')+box('alt','ALT')+'</div>'
        +'<div class="form-group"><label class="form-label">Urine</label><div class="radio-group">'+chip('urineDx','notdone','Not done')+chip('urineDx','normal','Normal')+chip('urineDx','pyuria','Pus cells')+chip('urineDx','nitrite','Nitrite')+chip('urineDx','blood','Blood')+'</div></div>'
        +'<div class="form-group"><label class="form-label">Urinary catheter</label><div class="radio-group">'+chip('cath','no','No')+chip('cath','yes','Yes')+'</div></div>'
        +'<div class="form-group"><label class="form-label">Blood culture</label><div class="radio-group">'+chip('bloodCx','notsent','Not sent')+chip('bloodCx','pending','Pending')+chip('bloodCx','neg','Negative')+chip('bloodCx','pos','Positive')+'</div></div>'
        +'<div class="form-group"><label class="form-label">Urine culture</label><div class="radio-group">'+chip('urineCx','notsent','Not sent')+chip('urineCx','pending','Pending')+chip('urineCx','neg','Negative')+chip('urineCx','pos','Positive')+'</div></div>'
        +'<div class="form-group"><label class="form-label">Tracheal culture</label><div class="radio-group">'+chip('ettCx','notsent','Not sent')+chip('ettCx','pending','Pending')+chip('ettCx','neg','Negative')+chip('ettCx','pos','Positive')+'</div></div>';
      if(num('pct')!=null) h+='<p class="step-desc">Procalcitonin is '+num('pct')+'. It does not choose the antibiotic.</p>';
      if(num('hb')!=null && num('hb')<7) h+='<p class="step-desc">Hemoglobin is low. It does not change the antibiotic.</p>';
    } else if(S.labsOn==='no') h+='<p class="step-desc">The blood numbers are not back. Radiology can still be entered below.</p>';
    h+='<div class="group">Radiology</div>'
      +'<div class="form-group"><label class="form-label">Chest film</label><div class="radio-group">'+chip('cxr','none','Not done')+chip('cxr','clear','Clear')+chip('cxr','uni','One-sided infiltrate')+chip('cxr','bilat','Both lungs')+chip('cxr','consol','Consolidation')+chip('cxr','effusion','Effusion')+chip('cxr','cavity','Cavity')+chip('cxr','ards','ARDS pattern')+'</div></div>'
      +'<div class="form-group"><label class="form-label">CT</label><div class="radio-group">'+chip('ct','notdone','Not done')+chip('ct','none','No source')+chip('ct','collection','Abdominal collection')+chip('ct','biliary','Biliary obstruction')+chip('ct','divert','Diverticulitis or appendicitis')+chip('ct','pyelo','Pyelonephritis')+chip('ct','brain','Brain abscess')+chip('ct','necro','Necrotizing soft tissue')+'</div></div>';
  }
  if(n===3){
    var sug=suggest();
    var extra=[['cap','CAP'],['hap','HAP'],['vap','VAP'],['asp','Aspiration'],['lungabs','Lung abscess'],['uti','UTI'],['pyelo','Pyelonephritis'],['cauti','CAUTI'],['chol','Cholangitis'],['app','Appendix or diverticulitis'],['perit','Peritonitis'],['iaabs','Abdominal abscess'],['cell','Cellulitis'],['skabs','Skin abscess'],['dfi','Diabetic foot'],['nec','Necrotizing skin'],['men','Meningitis'],['brainabs','Brain abscess'],['neuro','Post-neurosurgery'],['bact','Bacteremia'],['clabsi','Line infection'],['endo','Endocarditis'],['osteo','Osteomyelitis'],['septicj','Septic arthritis'],['pji','Prosthetic joint'],['neut','Neutropenic sepsis'],['unk','Unknown']];
    h='<div class="step-title">Suspected source</div><div class="rec-box"><h4>From the vitals and the films</h4><ul>'+sug.why.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul></div>'
      +'<div class="checkbox-group">'+sug.ids.map(function(id){var lab=(extra.filter(function(x){return x[0]===id;})[0]||[id,id])[1]; return '<div class="chip-option'+(activeSources().indexOf(id)>=0?' selected':'')+'" data-src="'+id+'">'+lab+'</div>';}).join('')+'</div>'
      +'<div class="group">Add a source the films missed</div><div class="checkbox-group">'+extra.filter(function(x){return sug.ids.indexOf(x[0])<0;}).map(function(x){return '<div class="chip-option'+(activeSources().indexOf(x[0])>=0?' selected':'')+'" data-src="'+x[0]+'">'+x[1]+'</div>';}).join('')+'</div>'
      +'<div class="form-group"><label class="form-label">Where it was caught</label><div class="radio-group">'+chip('acq','community','Community')+chip('acq','hospital','Hospital')+chip('acq','device','Device or healthcare')+'</div></div>'
      +'<div class="form-group"><label class="form-label">Penicillin allergy</label><div class="radio-group">'+chip('allergy','no','None')+chip('allergy','rash','Rash')+chip('allergy','anaphylaxis','Anaphylaxis')+'</div></div>';
  }
  if(n===4) h='<div class="step-title">Antibiotic</div><div id="live">'+abxHtml()+'</div>';
  if(n===5){
    var bugs=[['mssa','MSSA'],['mrsa','MRSA'],['strep','Streptococcus'],['pneumo','S. pneumoniae'],['hflu','H. influenzae'],['ecoli','E. coli'],['kleb','Klebsiella'],['proteus','Proteus'],['enterobacter','Enterobacter'],['serratia','Serratia'],['faecalis','E. faecalis'],['vre','VRE'],['pseudo','Pseudomonas'],['acineto','Acinetobacter'],['steno','Stenotrophomonas'],['bacteroides','Bacteroides'],['legionella','Legionella'],['anaerobe','Mixed anaerobes'],['esbl','ESBL E. coli or Klebsiella'],['kpc','KPC'],['ndm','NDM'],['oxa','OXA-48'],['dtr','Difficult Pseudomonas'],['crab','CRAB']];
    h='<div class="step-title">Organisms on the report</div><div class="step-desc">Tap every organism that grew. The dose changes only if the creatinine is deranged.</div><div class="checkbox-group">'
      +bugs.map(function(b){return '<div class="chip-option'+((S.bugs||[]).indexOf(b[0])>=0?' selected':'')+'" data-bug="'+b[0]+'">'+b[1]+'</div>';}).join('')+'</div><div id="live">'+cultureHtml()+'</div>';
  }
  if(n===6){
    var sc=candidaScore();
    var risks=[['abd','Recent abdominal surgery, perforation, or leak'],['panc','Necrotizing pancreatitis'],['abx','Prolonged broad-spectrum antibiotics'],['icu','Prolonged ICU stay'],['tpn','TPN'],['cvc','Central line'],['rrt','CRRT or hemodialysis'],['immuno','Immunosuppression or neutropenia'],['colon','Candida at more than one site']];
    var fungi=[['albicans','Candida albicans'],['glabrata','Candida glabrata'],['parapsilosis','Candida parapsilosis'],['auris','Candida auris'],['aspergillus','Aspergillus'],['mucor','Mucorales'],['crypto','Cryptococcus'],['pjp','Pneumocystis']];
    var advice=sc.start?'Score 3 or more. An echinocandin can be considered. A central line or TPN alone is not the reason.':(hasAf('abd')||hasAf('panc')?'A leak or necrotic pancreas is a high-risk abdomen. The score is still '+sc.n+'. Do not start a drug for a line or for antibiotics alone.':'Score under 3. Do not start an antifungal.');
    h='<div class="step-title">Antifungal</div><div class="clock '+(sc.start?'yellow':'green')+'">'+advice+'</div>'
      +'<div class="group">Any major Candida risk</div><div class="step-desc">Tap every one that applies.</div><div class="checkbox-group">'
      +risks.map(function(r){return '<div class="chip-option'+(hasAf(r[0])?' selected':'')+'" data-af="'+r[0]+'">'+r[1]+'</div>';}).join('')
      +'</div><div class="group">Candida score</div>'
      +'<div class="checkbox-group">'
      +'<div class="chip-option'+(sc.sepsisPts?' selected':'')+'" data-cs="sepsis">Severe sepsis, 2 points</div>'
      +'<div class="chip-option'+(sc.surgPts?' selected':'')+'" data-cs="surg">Surgery, 1 point</div>'
      +'<div class="chip-option'+(sc.tpnPts?' selected':'')+'" data-cs="tpn">Parenteral nutrition, 1 point</div>'
      +'<div class="chip-option'+(sc.colPts?' selected':'')+'" data-cs="colon">Candida at more than one site, 1 point</div>'
      +'</div><div class="rec-box"><h4>Score '+sc.n+'</h4><p>Severe sepsis '+sc.sepsisPts+' + surgery '+sc.surgPts+' + parenteral nutrition '+sc.tpnPts+' + multifocal Candida '+sc.colPts+'.</p><p>'+(sc.start?'At 3 or more, micafungin 100 mg IV every 24 hours can be started until the fungus is named.':'Under 3. Do not start.')+'</p></div>'
      +'<div class="group">If a fungus is named</div><div class="checkbox-group">'
      +fungi.map(function(f){return '<div class="chip-option'+((S.fungi||[]).indexOf(f[0])>=0?' selected':'')+'" data-fungus="'+f[0]+'">'+f[1]+'</div>';}).join('')+'</div>'
      +'<div id="livefungus"></div>';
  }
  return h;
}
function renderRec(){
  applyLabs();
  var live=document.getElementById('live');
  if(live && S.step===4) live.innerHTML=abxHtml();
  if(live && S.step===5) live.innerHTML=cultureHtml();
  var fg=document.getElementById('livefungus');
  if(fg){
    var plan=fungusPlan(S.fungi||[]);
    fg.innerHTML=plan.lines.map(function(l){return '<div class="rec-box"><p>'+l+'</p></div>';}).join('')+plan.notes.map(function(l){return '<p class="step-desc">'+l+'</p>';}).join('');
  }
}
function render(){
  if(!S.step||S.step<1) S.step=1;
  if(S.step>6) S.step=6;
  document.getElementById('stepName').textContent=STEPS[S.step-1]+' · '+S.step+' of '+STEPS.length;
  document.getElementById('step-content').innerHTML=stepHtml();
  var ans=document.getElementById('answer');
  if(ans) ans.style.display='none';
  document.getElementById('btn-prev').disabled=S.step===1;
  document.getElementById('btn-next').textContent=S.step===6?'Done':'Next';
  renderRec();
  window.scrollTo(0,0);
}
document.body.addEventListener('click', function(e){
  var src=e.target.closest('[data-src]');
  if(src){
    var id=src.dataset.src, sug=suggest().ids;
    if(sug.indexOf(id)>=0){
      if(!S.off) S.off=[];
      var i=S.off.indexOf(id);
      if(i>=0) S.off.splice(i,1); else S.off.push(id);
    } else {
      if(!S.picked) S.picked=[];
      var j=S.picked.indexOf(id);
      if(j>=0) S.picked.splice(j,1); else S.picked.push(id);
    }
    refreshSources(); render(); return;
  }
  var bug=e.target.closest('[data-bug]');
  if(bug){
    if(!S.bugs) S.bugs=[];
    var i=S.bugs.indexOf(bug.dataset.bug);
    if(i>=0) S.bugs.splice(i,1); else S.bugs.push(bug.dataset.bug);
    render(); return;
  }
  var fu=e.target.closest('[data-fungus]');
  if(fu){
    if(!S.fungi) S.fungi=[];
    var i=S.fungi.indexOf(fu.dataset.fungus);
    if(i>=0) S.fungi.splice(i,1); else S.fungi.push(fu.dataset.fungus);
    render(); return;
  }
  var sx=e.target.closest('[data-sx]');
  if(sx){
    if(!S.sx) S.sx=[];
    var i=S.sx.indexOf(sx.dataset.sx);
    if(i>=0) S.sx.splice(i,1); else S.sx.push(sx.dataset.sx);
    render(); return;
  }
  var af=e.target.closest('[data-af]');
  if(af){
    if(!S.afRisks) S.afRisks=[];
    var id=af.dataset.af, i=S.afRisks.indexOf(id);
    if(i>=0) S.afRisks.splice(i,1); else S.afRisks.push(id);
    if(id==='abd') S.csSurg=S.afRisks.indexOf('abd')>=0?'yes':'no';
    if(id==='tpn') S.csTpn=S.afRisks.indexOf('tpn')>=0?'yes':'no';
    if(id==='colon') S.csCol=S.afRisks.indexOf('colon')>=0?'yes':'no';
    render(); return;
  }
  var cs=e.target.closest('[data-cs]');
  if(cs){
    if(cs.dataset.cs==='sepsis') S.csSepsis=sepsisOn()?'no':'yes';
    if(cs.dataset.cs==='surg') S.csSurg=S.csSurg==='yes'?'no':'yes';
    if(cs.dataset.cs==='tpn') S.csTpn=S.csTpn==='yes'?'no':'yes';
    if(cs.dataset.cs==='colon') S.csCol=S.csCol==='yes'?'no':'yes';
    render(); return;
  }
  var b=e.target.closest('[data-k]');
  if(!b) return;
  S[b.dataset.k]=b.dataset.v;
  if(b.dataset.k==='acq') S.acqTouch=1;
  render();
});
document.body.addEventListener('input', function(e){
  if(!e.target.id) return;
  S[e.target.id]=e.target.value;
  var line=document.getElementById('shockline');
  if(line){ var sev=severity(); line.style.display=sev.sev==='shock'?'':'none'; line.textContent='Shock is present.'; }
  renderRec();
});
document.getElementById('btn-prev').onclick=function(){ if(S.step>1) go(S.step-1); };
document.getElementById('btn-next').onclick=function(){ if(S.step<6) go(S.step+1); else location.href='index.html'; };
S.step=1;
S.labsOn=S.labsOn||'';
S.cxr=S.cxr||'none';
S.ct=S.ct||'notdone';
S.urineDx=S.urineDx||'notdone';
S.bloodCx=S.bloodCx||'notsent';
S.urineCx=S.urineCx||'notsent';
S.ettCx=S.ettCx||'notsent';
S.o2=S.o2||'';
S.sx=S.sx||[];
S.afRisks=S.afRisks||[];
S.cath=S.cath||'no';
S.bugs=S.bugs||[];
S.fungi=S.fungi||[];
S.off=S.off||[];
S.picked=S.picked||[];
S.acq=S.acq||'community';
render();

</script>
