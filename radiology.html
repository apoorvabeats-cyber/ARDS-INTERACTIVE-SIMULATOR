<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<title>Radiology Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@420;600;700&family=Fraunces:opsz,wght@9..144,520&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b0d;--panel:#101419;--panel2:#161b21;--ink:#ece8de;--muted:#a9a89f;--line:rgba(236,232,222,.14);--cool:#7fd4e6;--warm:#e2b48a;--good:#8fd0a8;--bad:#e7a3a3;--amber:#f0c36a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--cool)}
.top{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:#0b0e11}
#back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:14px}
h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:22px;letter-spacing:-.02em}
.sp{flex:1}
.badge{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warm);text-align:right;line-height:1.25}
.mods{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto;background:#0b0e11}
.mods button{flex:0 0 auto;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600;font-size:14px}
.mods button[aria-selected="true"]{background:var(--cool);color:#04181c;border-color:var(--cool)}
.mods small{font-weight:420;opacity:.75;margin-left:5px}
.ws{display:grid;grid-template-columns:240px minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 110px)}
.cases{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 110px)}
.cases .srch{position:sticky;top:0;padding:8px;background:var(--panel);z-index:2}
.cases input{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--line);background:#0b0e11;padding:0 10px}
.grp{margin:10px 12px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm)}
.case{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:9px 12px;min-height:44px;font-size:14px;line-height:1.25}
.case:hover{background:var(--panel2)}
.case[aria-current="true"]{background:var(--panel2);border-left-color:var(--cool)}
.case .t{flex:1}
.case .ok{color:var(--good);font-size:13px}
.cases-toggle{display:none}
.viewer{display:flex;flex-direction:column;min-width:0;background:#000}
.tools{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0b0e11;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tools button{flex:0 0 auto;min-height:40px;min-width:48px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
.tools button[aria-pressed="true"]{background:var(--cool);color:#04181c;border-color:var(--cool);font-weight:700}
.tools button:disabled{opacity:.4;cursor:default}
.tools .gap{flex:0 0 8px}
.stage{position:relative;flex:1;display:grid;grid-template-columns:1fr;gap:2px;min-height:420px;height:calc(100vh - 215px);background:#000}
.stage.two{grid-template-columns:1fr 1fr}
.vp{position:relative;overflow:hidden;background:#000;min-width:0;touch-action:none;outline:none}
.vp[hidden]{display:none}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.vp.t-measure canvas,.vp.t-arrow canvas,.vp.t-circle canvas,.vp.t-point canvas{cursor:crosshair}
.vp.t-wl canvas{cursor:ns-resize}
.vp.t-zoom canvas{cursor:zoom-in}
.hud{position:absolute;pointer-events:none;font:11.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d6d3c7;text-shadow:0 1px 2px #000}
.hud.tl{left:8px;top:6px;max-width:60%}
.hud.tr{right:8px;top:6px;text-align:right;max-width:38%}
.hud.bl{left:8px;bottom:6px;max-width:80%}
.hud .tag{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(240,195,106,.18);border:1px solid rgba(240,195,106,.5);color:var(--amber)}
.hud .tag.ref{background:rgba(127,212,230,.16);border-color:rgba(127,212,230,.5);color:var(--cool)}
.pending{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);line-height:1.5;font-size:14px}
.cine[hidden]{display:none}
.cine{display:flex;gap:4px;align-items:center;padding:6px;background:#0b0e11;border-top:1px solid var(--line);flex-wrap:wrap}
.cine button{min-height:38px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px}
.cine button[aria-pressed="true"]{background:var(--cool);color:#04181c;border-color:var(--cool)}
.cine button:disabled,.cine input:disabled{opacity:.4}
.cine .note{font-size:12px;color:var(--muted);flex:1;min-width:140px}
.cine input[type=range]{flex:1;min-width:120px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;max-height:calc(100vh - 110px);padding:14px 14px 40px}
.panel h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-weight:520;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:rgba(240,195,106,.5);color:var(--amber)}
.sec{margin:12px 0}
.sec h3{margin:0 0 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm)}
.sec p,.sec li{margin:0;line-height:1.5;font-size:14.5px}
.sec ul{margin:0;padding-left:18px}
.sec li{margin:3px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn.pri{background:var(--cool);border-color:var(--cool);color:#04181c}
.btn:disabled{opacity:.4;cursor:default}
.result{padding:10px 12px;border-radius:10px;border:1px solid var(--line);line-height:1.45;font-size:14.5px;margin:8px 0}
.result.ok{border-color:rgba(143,208,168,.6);background:rgba(143,208,168,.08)}
.result.part{border-color:rgba(240,195,106,.6);background:rgba(240,195,106,.08)}
.result.no{border-color:rgba(231,163,163,.6);background:rgba(231,163,163,.08)}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opts button{text-align:left;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);line-height:1.35;font-size:14.5px}
.opts button.sel{border-color:var(--cool)}
.opts button.right{border-color:var(--good);background:rgba(143,208,168,.1)}
.opts button.wrong{border-color:var(--bad);background:rgba(231,163,163,.08);color:var(--muted)}
.why{font-size:13.5px;color:var(--muted);line-height:1.45;margin:4px 0 0}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.foot{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.5}
.locked{color:var(--muted);font-size:13.5px;margin:12px 0}
@media (max-width:1180px){
  .ws{grid-template-columns:minmax(0,1fr) 360px}
  .cases{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;max-height:none}
  body.cases-open .cases{transform:none}
  .cases-toggle{display:inline-flex;align-items:center}
  .scrim{display:none}
  body.cases-open .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55)}
}
@media (max-width:820px){
  .ws{grid-template-columns:1fr}
  .stage{height:56vh;min-height:300px}
  .stage.two{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:80vh}
  .panel{max-height:none;border-left:0;border-top:1px solid var(--line)}
  h1{font-size:19px}
  .badge{display:none}
}
.viewer.fs{position:fixed;inset:0;z-index:100}
.viewer.fs .stage{height:auto}
.viewer:fullscreen .stage{height:auto}
@media (prefers-reduced-motion:reduce){.cases{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" id="back">← Back to hall</a>
  <button type="button" class="btn cases-toggle" id="casesBtn" aria-expanded="false" style="min-height:40px">Cases</button>
  <h1>Radiology Lab</h1>
  <span class="sp"></span>
  <span class="badge">Teaching images<br>Not for clinical diagnosis</span>
</header>
<nav class="mods" id="mods" role="tablist" aria-label="Imaging modality"></nav>
<div class="scrim" id="scrim"></div>
<main class="ws">
  <aside class="cases" id="cases" aria-label="Cases"></aside>
  <section class="viewer" id="viewer" aria-label="Image viewer">
    <div class="tools" id="tools" role="toolbar" aria-label="Viewer tools"></div>
    <div class="stage" id="stage">
      <div class="vp" id="vp1" tabindex="0"><canvas></canvas><div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div></div>
      <div class="vp" id="vp2" hidden><canvas></canvas><div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div></div>
    </div>
    <div class="cine" id="cine" hidden></div>
  </section>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>
<script src="radiology/cases-cxr.js?v=20261119r1"></script>
<script src="radiology/cases-ct.js?v=20261119r1"></script>
<script src="radiology/cases-mri.js?v=20261119r1"></script>
<script src="radiology/cases-us.js?v=20261119r1"></script>
<script src="radiology/viewer.js?v=20261119r1"></script>
</body>
</html>
